<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#1a1a1a">MSS Ngoài POI — Root Cause 5 Whys</text>
  <text x="30" y="58" font-size="13" fill="#555">Chuỗi bậc thang từ hành vi entry theo mini-MSS xuống nguyên nhân gốc, kèm nhánh vì sao vị trí quyết định chất lượng</text>

  <rect x="30" y="80" width="330" height="90" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="45" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">BỀ MẶT</text>
  <text x="45" y="122" font-size="13" fill="#333">Entry ngay khi đủ sweep +</text>
  <text x="45" y="140" font-size="13" fill="#333">displacement + MSS + FVG, dù</text>
  <text x="45" y="158" font-size="13" fill="#333">MSS xảy ra quanh EQ giữa range.</text>

  <path d="M 195 170 L 195 195" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="200" width="400" height="95" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="105" y="222" font-size="14" font-weight="bold" fill="#c62828">WHY 1</text>
  <text x="105" y="242" font-size="13" fill="#333">Checklist chỉ kiểm tra TỒN TẠI của 4</text>
  <text x="105" y="260" font-size="13" fill="#333">thành phần, không kiểm tra VỊ TRÍ nơi</text>
  <text x="105" y="278" font-size="13" fill="#333">chúng xảy ra — nhị phân dễ, vị trí khó.</text>

  <path d="M 290 295 L 290 320" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="325" width="410" height="95" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="165" y="347" font-size="14" font-weight="bold" fill="#c62828">WHY 2</text>
  <text x="165" y="367" font-size="13" fill="#333">Pattern-matching (hệ thống 1, nhanh,</text>
  <text x="165" y="385" font-size="13" fill="#333">tự động) áp đảo tính vị trí trong dealing</text>
  <text x="165" y="403" font-size="13" fill="#333">range (hệ thống 2, chậm, có chủ đích).</text>

  <path d="M 355 420 L 355 445" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="450" width="420" height="95" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="225" y="472" font-size="14" font-weight="bold" fill="#c62828">WHY 3</text>
  <text x="225" y="492" font-size="13" fill="#333">Trong quá khứ pattern "đủ 4 thành phần"</text>
  <text x="225" y="510" font-size="13" fill="#333">từng đúng ngẫu nhiên trùng POI — não</text>
  <text x="225" y="528" font-size="13" fill="#333">học "pattern thắng", không tách biến ẩn vị trí.</text>

  <path d="M 420 545 L 420 570" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="575" width="460" height="110" rx="8" fill="#c62828" stroke="#8e0000"/>
  <text x="285" y="598" font-size="14" font-weight="bold" fill="#ffffff">WHY 4 — NGUYÊN NHÂN GỐC</text>
  <text x="285" y="618" font-size="13" fill="#ffffff">Checklist đặt "xác định POI trước" là bước</text>
  <text x="285" y="636" font-size="13" fill="#ffffff">lý thuyết đầu tiên, nhưng KHÔNG có gate</text>
  <text x="285" y="654" font-size="13" fill="#ffffff">thực thi — không ngăn được việc tìm POI</text>
  <text x="285" y="672" font-size="12" fill="#ffffff">ngược sau khi đã thấy MSS để biện minh.</text>

  <!-- Nhánh vị trí quyết định chất lượng -->
  <rect x="760" y="200" width="310" height="480" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="775" y="228" font-size="15" font-weight="bold" fill="#1565c0">Vị trí quyết định chất lượng</text>

  <rect x="780" y="245" width="270" height="90" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="792" y="265" font-size="12" font-weight="bold" fill="#1565c0">MSS tại POI hợp lệ</text>
  <text x="792" y="283" font-size="12" fill="#333">Mượn độ tin cậy từ origin</text>
  <text x="792" y="299" font-size="12" fill="#333">displacement — có "kho lệnh"</text>
  <text x="792" y="315" font-size="12" fill="#333">tổ chức đứng sau, có nhiên liệu.</text>

  <path d="M 915 335 L 915 355" stroke="#f9a825" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="780" y="360" width="270" height="90" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="792" y="380" font-size="12" font-weight="bold" fill="#3a2c00">MSS giữa range (EQ)</text>
  <text x="792" y="398" font-size="12" fill="#3a2c00">Không "kho lệnh" đứng sẵn —</text>
  <text x="792" y="414" font-size="12" fill="#3a2c00">chỉ dòng lệnh ngắn hạn, thanh</text>
  <text x="792" y="430" font-size="12" fill="#3a2c00">khoản mỏng, thiếu nhiên liệu.</text>

  <path d="M 915 450 L 915 470" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="780" y="475" width="270" height="90" rx="6" fill="#fdecea" stroke="#c62828"/>
  <text x="792" y="495" font-size="12" font-weight="bold" fill="#c62828">SL nằm trên đường đi</text>
  <text x="792" y="513" font-size="12" fill="#333">SL bạn nằm chính xác trên</text>
  <text x="792" y="529" font-size="12" fill="#333">đường tới POI thật — bạn cược</text>
  <text x="792" y="545" font-size="12" fill="#333">tiền đúng nơi bị quét trước.</text>

  <path d="M 630 380 L 760 380" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="373" font-size="11" fill="#777">cùng cơ chế thị trường</text>

  <rect x="780" y="590" width="270" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="792" y="612" font-size="12" font-weight="bold" fill="#2e7d32">Ai bảo vệ mức giá?</text>
  <text x="792" y="630" font-size="12" fill="#333">Không OB/FVG HTF → không lý</text>
  <text x="792" y="646" font-size="12" fill="#333">do cấu trúc để tổ chức bảo vệ.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f9a825"/>
    </marker>
  </defs>

  <rect x="30" y="790" width="1040" height="80" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="45" y="812" font-size="12" font-weight="bold" fill="#1a1a1a">Evidence Tier: Tier 0 (giả thuyết)</text>
  <text x="45" y="830" font-size="12" fill="#555">Chuỗi 5 Whys và nhánh vị trí là suy luận first-principles dựa trên order flow/smart</text>
  <text x="45" y="846" font-size="12" fill="#555">money concepts — chưa kiểm định bằng dữ liệu order flow thật.</text>
  <text x="45" y="862" font-size="12" fill="#555">Cần backtest n≥20 theo field MSS_in_POI để nâng tier.</text>
</svg>
