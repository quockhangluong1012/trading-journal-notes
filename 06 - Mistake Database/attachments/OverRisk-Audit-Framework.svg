<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Audit Framework — Risk-per-trade</text>
  <text x="550" y="58" text-anchor="middle" font-size="14" fill="#555">Pipeline 4 bước từ log đến hành động, kèm khối red flags</text>

  <!-- Pipeline boxes -->
  <rect x="40" y="90" width="230" height="110" rx="8" fill="#1565c0"/>
  <text x="155" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1. Log đủ field</text>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#e3f2fd">planned/actual risk%,</text>
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="#e3f2fd">SL thật, conviction_score,</text>
  <text x="155" y="172" text-anchor="middle" font-size="11" fill="#e3f2fd">correlation group,</text>
  <text x="155" y="188" text-anchor="middle" font-size="11" fill="#e3f2fd">screenshot pre-entry</text>

  <rect x="300" y="90" width="230" height="110" rx="8" fill="#1565c0"/>
  <text x="415" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2. Bộ câu hỏi</text>
  <text x="415" y="140" text-anchor="middle" font-size="11" fill="#e3f2fd">12 câu PASS/FAIL</text>
  <text x="415" y="156" text-anchor="middle" font-size="11" fill="#e3f2fd">khách quan, đo từ log</text>
  <text x="415" y="172" text-anchor="middle" font-size="11" fill="#e3f2fd">không dựa vào trí nhớ</text>

  <rect x="560" y="90" width="230" height="110" rx="8" fill="#1565c0"/>
  <text x="675" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3. Rubric A/B/C/F</text>
  <text x="675" y="140" text-anchor="middle" font-size="11" fill="#e3f2fd">A: 11-12 PASS</text>
  <text x="675" y="156" text-anchor="middle" font-size="11" fill="#e3f2fd">B: 8-10  C: 5-7</text>
  <text x="675" y="172" text-anchor="middle" font-size="11" fill="#e3f2fd">F: 0-4</text>

  <rect x="820" y="90" width="230" height="110" rx="8" fill="#2e7d32"/>
  <text x="935" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4. Hành động</text>
  <text x="935" y="140" text-anchor="middle" font-size="11" fill="#e8f5e9">A: tiếp tục</text>
  <text x="935" y="156" text-anchor="middle" font-size="11" fill="#e8f5e9">C: giảm size, về backtest</text>
  <text x="935" y="172" text-anchor="middle" font-size="11" fill="#e8f5e9">F: CẤM trade live ngay</text>

  <!-- Arrows -->
  <line x1="270" y1="145" x2="298" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="530" y1="145" x2="558" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="790" y1="145" x2="818" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Sample questions strip -->
  <rect x="40" y="230" width="1010" height="140" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <text x="60" y="256" font-size="13" fill="#1a1a1a" font-weight="bold">Ví dụ câu hỏi audit (trích 4/12)</text>
  <text x="60" y="278" font-size="12" fill="#333">Q1. actual_risk_pct ≤ 0.5%? — PASS nếu đo trực tiếp từ log đúng 0.5%</text>
  <text x="60" y="298" font-size="12" fill="#333">Q3. Nếu SL đổi, đã tính lại lot chưa? — PASS nếu có, FAIL nếu giữ nguyên lot</text>
  <text x="60" y="318" font-size="12" fill="#333">Q4. Tổng risk nhóm correlation ≤0.5% aggregate? — PASS nếu đã cập đúng</text>
  <text x="60" y="338" font-size="12" fill="#333">Q6. Đây có phải revenge sizing sau lệnh thua không? — PASS nếu không phải</text>
  <text x="60" y="358" font-size="11.5" fill="#777">(Đầy đủ 12 câu xem mục 14.3 trong nội dung .md)</text>

  <!-- Red flags box -->
  <rect x="40" y="390" width="1010" height="270" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="60" y="418" font-size="15" fill="#8e0000" font-weight="bold">Red flags khi audit — các mẫu gian lận/tự lừa phổ biến</text>

  <rect x="60" y="436" width="470" height="90" rx="6" fill="#fff" stroke="#c62828" stroke-width="1"/>
  <text x="75" y="458" font-size="12" fill="#8e0000" font-weight="bold">Sửa log sau khi biết kết quả</text>
  <text x="75" y="476" font-size="11" fill="#333">conviction_score chỉ xuất hiện SAU</text>
  <text x="75" y="492" font-size="11" fill="#333">khi lệnh đã thắng, không có timestamp</text>
  <text x="75" y="508" font-size="11" fill="#333">trước entry để xác minh</text>

  <rect x="560" y="436" width="470" height="90" rx="6" fill="#fff" stroke="#c62828" stroke-width="1"/>
  <text x="575" y="458" font-size="12" fill="#8e0000" font-weight="bold">Chỉ log lệnh đẹp</text>
  <text x="575" y="476" font-size="11" fill="#333">Khoảng trống bất thường quanh các</text>
  <text x="575" y="492" font-size="11" fill="#333">lệnh thua lớn hoặc vi phạm risk —</text>
  <text x="575" y="508" font-size="11" fill="#333">selective logging</text>

  <rect x="60" y="536" width="470" height="90" rx="6" fill="#fff" stroke="#c62828" stroke-width="1"/>
  <text x="75" y="558" font-size="12" fill="#8e0000" font-weight="bold">Định nghĩa xê dịch theo kết quả</text>
  <text x="75" y="576" font-size="11" fill="#333">"Conviction cao" khi thắng, "lỡ tay"</text>
  <text x="75" y="592" font-size="11" fill="#333">khi thua — cùng hành vi, hai tên gọi</text>
  <text x="75" y="608" font-size="11" fill="#333">khác nhau tùy kết quả</text>

  <rect x="560" y="536" width="470" height="90" rx="6" fill="#fff" stroke="#c62828" stroke-width="1"/>
  <text x="575" y="558" font-size="12" fill="#8e0000" font-weight="bold">Circuit breaker bị diễn giải lại</text>
  <text x="575" y="576" font-size="11" fill="#333">"Chỉ -1.8% chưa tới -2% nên chưa cần</text>
  <text x="575" y="592" font-size="11" fill="#333">dừng" trong khi số thật là -2.1% —</text>
  <text x="575" y="608" font-size="11" fill="#333">biến ranh giới cứng thành mềm lúc thua</text>
</svg>
