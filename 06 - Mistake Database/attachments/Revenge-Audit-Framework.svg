<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#1a1a1a">Audit Framework — Revenge Trading</text>
  <text x="30" y="58" font-size="13" fill="#555">Pipeline kiểm toán độc lập: từ log đủ field tới hành động, kèm red flags</text>

  <!-- Pipeline 4 bước ngang -->
  <rect x="30" y="90" width="240" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="45" y="115" font-size="14" font-weight="bold" fill="#1565c0">1. Log đủ field</text>
  <text x="45" y="136" font-size="12" fill="#333">10 field bắt buộc: timestamp,</text>
  <text x="45" y="152" font-size="12" fill="#333">screenshot, checklist score,</text>
  <text x="45" y="168" font-size="12" fill="#333">% risk thực, khoảng cách lệnh,</text>
  <text x="45" y="184" font-size="12" fill="#333">trạng thái sweep/MSS/FVG,</text>
  <text x="45" y="200" font-size="12" fill="#333">tilt flag sinh lý.</text>
  <text x="45" y="220" font-size="12" fill="#c62828" font-weight="bold">Thiếu field = FAIL tự động</text>

  <path d="M 275 165 L 305 165" stroke="#1565c0" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="310" y="90" width="240" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="325" y="115" font-size="14" font-weight="bold" fill="#1565c0">2. Bộ câu hỏi</text>
  <text x="325" y="136" font-size="12" fill="#333">12 câu PASS/FAIL khách</text>
  <text x="325" y="152" font-size="12" fill="#333">quan: cooldown, risk %,</text>
  <text x="325" y="168" font-size="12" fill="#333">checklist score, screenshot,</text>
  <text x="325" y="184" font-size="12" fill="#333">journal trước kết quả, số</text>
  <text x="325" y="200" font-size="12" fill="#333">lệnh sau lệnh thua đầu.</text>

  <path d="M 555 165 L 585 165" stroke="#1565c0" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="590" y="90" width="240" height="150" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="605" y="115" font-size="14" font-weight="bold" fill="#3a2c00">3. Rubric A/B/C/F</text>
  <text x="605" y="136" font-size="12" fill="#3a2c00">A: 11-12 PASS — tiếp tục</text>
  <text x="605" y="152" font-size="12" fill="#3a2c00">B: 9-10 PASS — siết lại</text>
  <text x="605" y="168" font-size="12" fill="#3a2c00">C: 6-8 PASS — tạm dừng size</text>
  <text x="605" y="184" font-size="12" fill="#3a2c00">F: ≤5 PASS — cấm live</text>

  <path d="M 835 165 L 865 165" stroke="#1565c0" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="870" y="90" width="200" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="885" y="115" font-size="14" font-weight="bold" fill="#2e7d32">4. Hành động</text>
  <text x="885" y="136" font-size="12" fill="#333">A/B: review định kỳ,</text>
  <text x="885" y="152" font-size="12" fill="#333">tiếp tục theo dõi.</text>
  <text x="885" y="172" font-size="12" fill="#333">C/F: dừng risk thật,</text>
  <text x="885" y="188" font-size="12" fill="#333">quay lại backtest thuần</text>
  <text x="885" y="204" font-size="12" fill="#333">tới khi đạt lại chuẩn B+.</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Red flags box -->
  <rect x="30" y="270" width="1040" height="180" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="50" y="298" font-size="16" font-weight="bold" fill="#c62828">Red Flags khi audit</text>
  <text x="50" y="322" font-size="12" fill="#333">• Sửa log SAU khi biết kết quả — timestamp file chỉnh sửa muộn hơn timestamp entry gốc.</text>
  <text x="50" y="344" font-size="12" fill="#333">• Chỉ log lệnh đẹp — số lệnh có log ít hơn rõ rệt so với account statement thật.</text>
  <text x="50" y="366" font-size="12" fill="#333">• Định nghĩa xê dịch theo kết quả — cùng hành vi được gọi "chấp nhận được" khi thắng,</text>
  <text x="50" y="384" font-size="12" fill="#333">  "vi phạm" khi thua.</text>
  <text x="50" y="406" font-size="12" fill="#333">• Tilt flag luôn ghi giá trị thấp/mặc định — dấu hiệu điền log qua loa, không tự quan sát thật.</text>
  <text x="50" y="428" font-size="12" fill="#333">• Không có screenshot lưu file thật — chỉ "nhớ là có xem chart" trước khi entry.</text>

  <!-- Meta-audit + nhịp audit -->
  <rect x="30" y="470" width="500" height="200" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="50" y="496" font-size="14" font-weight="bold" fill="#1a1a1a">Meta-audit chính note</text>
  <text x="50" y="518" font-size="12" fill="#555">Evidence Tier hiện tại: Tier 0 — toàn</text>
  <text x="50" y="536" font-size="12" fill="#555">bộ bảng số ở Deep-Dive là mô phỏng,</text>
  <text x="50" y="554" font-size="12" fill="#555">chưa có log thật đạt 10/10 field.</text>
  <text x="50" y="576" font-size="12" fill="#555">Cần n≥20 lệnh log đầy đủ, trải qua</text>
  <text x="50" y="594" font-size="12" fill="#555">≥2 giai đoạn biến động khác nhau,</text>
  <text x="50" y="612" font-size="12" fill="#555">để nâng từ Tier 0 lên Tier 1.</text>
  <text x="50" y="634" font-size="12" fill="#555">Khuyến nghị: hạ giọng khẳng định</text>
  <text x="50" y="652" font-size="12" fill="#555">tuyệt đối thành "giả thuyết đang kiểm định".</text>

  <rect x="550" y="470" width="520" height="200" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="570" y="496" font-size="14" font-weight="bold" fill="#1a1a1a">Nhịp audit</text>
  <text x="570" y="518" font-size="12" fill="#555">Hàng ngày: tự chấm nhanh 3 câu đầu</text>
  <text x="570" y="534" font-size="12" fill="#555">cuối phiên, 5 phút, không trì hoãn.</text>
  <text x="570" y="556" font-size="12" fill="#555">Hàng tuần: chạy đủ 12 câu, tính rubric,</text>
  <text x="570" y="572" font-size="12" fill="#555">đối chiếu tilt-metrics trong Weekly Review.</text>
  <text x="570" y="594" font-size="12" fill="#555">Hàng tháng: tổng hợp xu hướng rubric</text>
  <text x="570" y="610" font-size="12" fill="#555">qua 4 tuần, can thiệp cấu trúc nếu trì trệ.</text>
  <text x="570" y="632" font-size="12" fill="#555">Auditor: bản thân (log khách quan) +</text>
  <text x="570" y="648" font-size="12" fill="#555">rule cứng tự động + review định kỳ.</text>
</svg>
