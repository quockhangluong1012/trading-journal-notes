<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Audit Framework — Log Data Mismatch</text>
  <text x="500" y="56" text-anchor="middle" font-size="14" fill="#555">Đây LÀ mistake về audit trail — khung kiểm toán cần nghiêm ngặt nhất</text>

  <rect x="40" y="80" width="220" height="120" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="150" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">1. 12 field bắt buộc</text>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#333">mismatch_detected,</text>
  <text x="150" y="144" text-anchor="middle" font-size="11" fill="#333">audit_method,</text>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#333">resolution_deadline,</text>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#333">r_multiple_delta...</text>

  <line x1="260" y1="140" x2="290" y2="140" stroke="#999" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="290" y="80" width="220" height="120" rx="10" fill="#fff3e0" stroke="#f9a825" stroke-width="2"/>
  <text x="400" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c00">2. 12 câu PASS/FAIL</text>
  <text x="400" y="128" text-anchor="middle" font-size="11" fill="#3a2c00">Khớp filename/năm,</text>
  <text x="400" y="144" text-anchor="middle" font-size="11" fill="#3a2c00">R tính lại khớp log,</text>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#3a2c00">cross-check chart gốc,</text>
  <text x="400" y="176" text-anchor="middle" font-size="11" fill="#3a2c00">không sửa hồi tố</text>

  <line x1="510" y1="140" x2="540" y2="140" stroke="#999" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="540" y="80" width="220" height="120" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="650" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">3. Rubric A/B/C/F</text>
  <text x="650" y="128" text-anchor="middle" font-size="11" fill="#333">A: 11-12 PASS</text>
  <text x="650" y="144" text-anchor="middle" font-size="11" fill="#333">B: 8-10 · C: 5-7</text>
  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#333">F: 0-4 (như ví dụ</text>
  <text x="650" y="176" text-anchor="middle" font-size="11" fill="#333">thật mục 4)</text>

  <line x1="760" y1="140" x2="790" y2="140" stroke="#999" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="790" y="80" width="170" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="875" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">4. Hành động</text>
  <text x="875" y="128" text-anchor="middle" font-size="11" fill="#333">A/B: giữ sample</text>
  <text x="875" y="144" text-anchor="middle" font-size="11" fill="#333">C/F: cách ly</text>
  <text x="875" y="160" text-anchor="middle" font-size="11" fill="#333">(quarantine) khỏi</text>
  <text x="875" y="176" text-anchor="middle" font-size="11" fill="#333">dashboard</text>

  <rect x="60" y="220" width="880" height="210" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="500" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">Red Flags — tự lừa/gian lận trong tự-audit</text>

  <rect x="80" y="260" width="400" height="72" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="90" y="280" font-size="12" font-weight="bold" fill="#c62828">Sửa R sau khi biết kết quả</text>
  <text x="90" y="298" font-size="11" fill="#333">Timestamp sửa sau timestamp đóng</text>
  <text x="90" y="314" font-size="11" fill="#333">lệnh = bằng chứng hồi tố hoá.</text>

  <rect x="500" y="260" width="400" height="72" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="510" y="280" font-size="12" font-weight="bold" fill="#c62828">mismatch_detected: No giả</text>
  <text x="510" y="298" font-size="11" fill="#333">audit_date trống hoặc trùng ngày</text>
  <text x="510" y="314" font-size="11" fill="#333">tạo note — không thực sự rà lại.</text>

  <rect x="80" y="342" width="400" height="72" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="90" y="362" font-size="12" font-weight="bold" fill="#c62828">Xác nhận đúng không dẫn chứng</text>
  <text x="90" y="380" font-size="11" fill="#333">resolution_status: confirmed nhưng</text>
  <text x="90" y="396" font-size="11" fill="#333">không giải thích vì sao.</text>

  <rect x="500" y="342" width="400" height="72" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="510" y="362" font-size="12" font-weight="bold" fill="#c62828">0% mismatch toàn sample</text>
  <text x="510" y="380" font-size="11" fill="#333">Về thống kê đáng ngờ hơn là tốt</text>
  <text x="510" y="396" font-size="11" fill="#333">nếu n≥20 và audit nghiêm ngặt.</text>

  <rect x="60" y="450" width="880" height="110" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">Meta-audit chính note này</text>
  <text x="500" y="500" text-anchor="middle" font-size="12" fill="#333">Ví dụ thật duy nhất (mục 4/8) là Tier 1, n=1 — chưa đủ để khẳng định tỷ lệ phổ biến lỗi.</text>
  <text x="500" y="520" text-anchor="middle" font-size="12" fill="#333">Checklist mục 7 chỉ bắt "sai không nhất quán", không bắt "sai nhất quán ở cả 4 nguồn".</text>
  <text x="500" y="540" text-anchor="middle" font-size="12" fill="#333">Backlog ưu tiên cao nhất: audit toàn sample 1 lần để lập baseline tỷ lệ mismatch.</text>

  <rect x="60" y="580" width="880" height="150" rx="10" fill="#fff3e0" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="606" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c00">Nhịp audit đề xuất</text>
  <text x="500" y="630" text-anchor="middle" font-size="12" fill="#3a2c00">Đóng note: chạy checklist nội bộ 4 nguồn (bắt buộc).</text>
  <text x="500" y="650" text-anchor="middle" font-size="12" fill="#3a2c00">Cuối tuần: chấm rubric cho note mới trong tuần.</text>
  <text x="500" y="670" text-anchor="middle" font-size="12" fill="#3a2c00">Cuối tháng: cross-check chart gốc cho 5-10 note ngẫu nhiên.</text>
  <text x="500" y="690" text-anchor="middle" font-size="12" fill="#3a2c00">Một lần (ưu tiên cao): audit toàn sample để lập baseline tỷ lệ mismatch.</text>
  <text x="500" y="712" text-anchor="middle" font-size="12" fill="#3a2c00">Điều kiện tiên quyết để đánh giá đúng mức độ nghiêm trọng của backlog này.</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
