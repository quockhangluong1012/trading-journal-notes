<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="780" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">FOMO Entry — Root Cause: Chuỗi 5 Whys</text>
  <text x="550" y="58" text-anchor="middle" font-size="14" fill="#555">Từ hành vi "đuổi giá đã chạy" xuống nguyên nhân gốc về thiết kế quy trình</text>

  <!-- Why 1 -->
  <rect x="60" y="80" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="80" y="103" font-size="13" font-weight="bold" fill="#1a1a1a">Why 1: Vì sao vào lệnh giữa/cuối con sóng?</text>
  <text x="80" y="123" font-size="13" fill="#555">Thấy giá chạy mạnh, tin nó tiếp tục chạy,</text>
  <text x="80" y="140" font-size="13" fill="#555">sợ mất cơ hội nếu không vào ngay.</text>

  <!-- Why 2 -->
  <rect x="120" y="160" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="140" y="183" font-size="13" font-weight="bold" fill="#1a1a1a">Why 2: Vì sao tin "sẽ tiếp tục" chỉ vì đã chạy?</text>
  <text x="140" y="203" font-size="13" fill="#555">Heuristic đại diện: displacement mạnh trông</text>
  <text x="140" y="220" font-size="13" fill="#555">giống trend mới, dù thường là giai đoạn cuối.</text>

  <!-- Why 3 -->
  <rect x="180" y="240" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="200" y="263" font-size="13" font-weight="bold" fill="#1a1a1a">Why 3: Vì sao ưu tiên cảm giác hơn checklist?</text>
  <text x="200" y="283" font-size="13" fill="#555">Checklist cần xử lý chậm (lý trí); nhận diện</text>
  <text x="200" y="300" font-size="13" fill="#555">"giá đang chạy" là xử lý nhanh (cảm xúc) thắng.</text>

  <!-- Why 4 -->
  <rect x="240" y="320" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="260" y="343" font-size="13" font-weight="bold" fill="#1a1a1a">Why 4: Vì sao chưa có rào cản đủ mạnh?</text>
  <text x="260" y="363" font-size="13" fill="#555">Quy trình chưa bắt buộc bước "dừng - viết ra</text>
  <text x="260" y="380" font-size="13" fill="#555">POI mục tiêu" trước khi được phép bấm lệnh.</text>

  <!-- Why 5 root -->
  <rect x="300" y="400" width="560" height="90" rx="8" fill="#c62828"/>
  <text x="320" y="428" font-size="14" font-weight="bold" fill="#fff">Why 5 (GỐC): Vì sao chưa cấu trúc hóa quy trình?</text>
  <text x="320" y="450" font-size="13" fill="#fff">Thiếu "circuit breaker" tách rời nhận diện setup</text>
  <text x="320" y="468" font-size="13" fill="#fff">khỏi quyền bấm lệnh — vấn đề THIẾT KẾ QUY TRÌNH,</text>
  <text x="320" y="484" font-size="13" fill="#fff">không phải thiếu ý chí cá nhân.</text>

  <!-- arrows between steps -->
  <path d="M 340 146 L 340 158" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 226 L 400 238" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 460 306 L 460 318" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 520 386 L 520 398" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <!-- AMD branch -->
  <rect x="760" y="80" width="290" height="410" rx="10" fill="#fff3e0" stroke="#f9a825" stroke-width="2"/>
  <text x="905" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a2c00">Nhánh cơ chế thị trường (AMD)</text>

  <rect x="780" y="126" width="250" height="64" rx="6" fill="#ffffff" stroke="#ddd"/>
  <text x="795" y="148" font-size="12" font-weight="bold" fill="#1a1a1a">Accumulation</text>
  <text x="795" y="166" font-size="12" fill="#555">SM xây vị thế trước</text>
  <text x="795" y="182" font-size="12" fill="#555">khi displacement xảy ra</text>

  <rect x="780" y="202" width="250" height="64" rx="6" fill="#ffffff" stroke="#ddd"/>
  <text x="795" y="224" font-size="12" font-weight="bold" fill="#1a1a1a">Manipulation</text>
  <text x="795" y="242" font-size="12" fill="#555">Displacement quét thanh</text>
  <text x="795" y="258" font-size="12" fill="#555">khoản, tạo cảm giác FOMO</text>

  <rect x="780" y="278" width="250" height="80" rx="6" fill="#c62828"/>
  <text x="795" y="300" font-size="12" font-weight="bold" fill="#fff">Distribution</text>
  <text x="795" y="318" font-size="12" fill="#fff">Đám đông FOMO vào = thanh</text>
  <text x="795" y="334" font-size="12" fill="#fff">khoản đối ứng cho SM bán ra</text>
  <text x="795" y="350" font-size="12" fill="#fff">→ đảo chiều ngay sau đó</text>

  <text x="780" y="380" font-size="12" fill="#3a2c00" font-weight="bold">FOMO entry rơi đúng vào</text>
  <text x="780" y="398" font-size="12" fill="#3a2c00" font-weight="bold">điểm cuối Manipulation /</text>
  <text x="780" y="416" font-size="12" fill="#3a2c00" font-weight="bold">đầu Distribution.</text>
  <text x="780" y="440" font-size="12" fill="#555">Displacement là công cụ tạo</text>
  <text x="780" y="456" font-size="12" fill="#555">dòng lệnh đối ứng, không chỉ</text>
  <text x="780" y="472" font-size="12" fill="#555">là hệ quả ngẫu nhiên.</text>

  <!-- bottom note -->
  <rect x="60" y="520" width="990" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="80" y="546" font-size="13" font-weight="bold" fill="#1565c0">Ý nghĩa thực hành</text>
  <text x="80" y="568" font-size="13" fill="#333">Vì nguyên nhân là thiết kế quy trình, giải pháp không thể chỉ là "tự nhắc bản thân" —</text>
  <text x="80" y="586" font-size="13" fill="#333">cần cơ chế bắt buộc (circuit breaker: cửa sổ chờ 90s, checklist khóa trước khi bấm lệnh).</text>

  <rect x="60" y="626" width="990" height="120" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="80" y="652" font-size="13" font-weight="bold" fill="#1a1a1a">Evidence Tier hiện tại của phân tích này: Tier 0</text>
  <text x="80" y="674" font-size="13" fill="#555">Chuỗi 5 Whys và nhánh AMD là suy luận logic từ lý thuyết ICT gốc, chưa có dữ liệu</text>
  <text x="80" y="692" font-size="13" fill="#555">backtest riêng xác nhận tần suất đúng-sai của cơ chế trên hành vi giao dịch thật.</text>
  <text x="80" y="714" font-size="13" fill="#555">Cần log n≥20 lệnh có tín hiệu FOMO để kiểm định trước khi nâng lên Tier 1.</text>
</svg>
