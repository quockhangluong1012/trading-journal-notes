<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#1a1a1a">Revenge Trading — Root Cause 5 Whys</text>
  <text x="30" y="58" font-size="13" fill="#555">Chuỗi bậc thang từ hành vi bề mặt xuống nguyên nhân gốc, kèm nhánh cơ chế thị trường AMD</text>

  <!-- Bậc thang 5 Whys, đi xuống dần từ trái sang phải -->
  <!-- Bậc 0: Bề mặt -->
  <rect x="30" y="80" width="330" height="90" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="45" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">BỀ MẶT</text>
  <text x="45" y="122" font-size="13" fill="#333">Vào lệnh thứ hai chỉ 3 phút</text>
  <text x="45" y="140" font-size="13" fill="#333">sau khi bị stop out, không</text>
  <text x="45" y="158" font-size="13" fill="#333">chờ setup mới.</text>

  <!-- mũi tên xuống -->
  <path d="M 195 170 L 195 195" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bậc 1 -->
  <rect x="90" y="200" width="380" height="95" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="105" y="222" font-size="14" font-weight="bold" fill="#c62828">WHY 1</text>
  <text x="105" y="242" font-size="13" fill="#333">Tin giá "chắc chắn" đảo lại vì</text>
  <text x="105" y="260" font-size="13" fill="#333">cảm xúc thua tạo nhu cầu "sửa</text>
  <text x="105" y="278" font-size="13" fill="#333">sai ngay", lý do kỹ thuật chỉ là</text>
  <text x="105" y="292" font-size="12" fill="#333">hợp lý hoá quyết định cảm xúc.</text>

  <path d="M 270 295 L 270 320" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bậc 2 -->
  <rect x="150" y="325" width="400" height="95" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="165" y="347" font-size="14" font-weight="bold" fill="#c62828">WHY 2</text>
  <text x="165" y="367" font-size="13" fill="#333">Prospect theory: domain of losses</text>
  <text x="165" y="385" font-size="13" fill="#333">đẩy hệ thần kinh sang risk-seeking</text>
  <text x="165" y="403" font-size="13" fill="#333">— phản xạ tiến hoá thắng checklist</text>
  <text x="165" y="417" font-size="12" fill="#333">ngay lúc ý thức yếu nhất.</text>

  <path d="M 350 420 L 350 445" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bậc 3 -->
  <rect x="210" y="450" width="410" height="95" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="225" y="472" font-size="14" font-weight="bold" fill="#c62828">WHY 3</text>
  <text x="225" y="492" font-size="13" fill="#333">Chưa có pre-commitment device</text>
  <text x="225" y="510" font-size="13" fill="#333">tách quyết định khỏi cảm xúc — kỷ</text>
  <text x="225" y="528" font-size="13" fill="#333">luật dựa hoàn toàn vào ý chí, tài</text>
  <text x="225" y="542" font-size="12" fill="#333">nguyên cạn nhanh nhất lúc cortisol cao.</text>

  <path d="M 415 545 L 415 570" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bậc 4 gốc -->
  <rect x="270" y="575" width="440" height="105" rx="8" fill="#c62828" stroke="#8e0000"/>
  <text x="285" y="598" font-size="14" font-weight="bold" fill="#ffffff">WHY 4 — NGUYÊN NHÂN GỐC</text>
  <text x="285" y="618" font-size="13" fill="#ffffff">Circuit breaker là "rule nên nhớ" thay</text>
  <text x="285" y="636" font-size="13" fill="#ffffff">vì cơ chế cứng ở tầng hệ thống/platform</text>
  <text x="285" y="654" font-size="13" fill="#ffffff">— thiết kế quy trình thiếu ma sát bắt</text>
  <text x="285" y="670" font-size="12" fill="#ffffff">buộc tại điểm rủi ro cao nhất.</text>

  <!-- Nhánh cơ chế thị trường AMD -->
  <rect x="760" y="200" width="310" height="480" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="775" y="228" font-size="15" font-weight="bold" fill="#1565c0">Nhánh cơ chế thị trường (AMD)</text>

  <rect x="780" y="245" width="270" height="80" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="792" y="265" font-size="12" font-weight="bold" fill="#1565c0">Accumulation</text>
  <text x="792" y="283" font-size="12" fill="#333">Trước sweep — dòng lệnh</text>
  <text x="792" y="299" font-size="12" fill="#333">tổ chức tích lũy vị thế.</text>
  <text x="792" y="315" font-size="12" fill="#333">Trader chưa bị ảnh hưởng.</text>

  <path d="M 915 325 L 915 345" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="780" y="350" width="270" height="90" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="792" y="370" font-size="12" font-weight="bold" fill="#1565c0">Manipulation (sweep gây thua)</text>
  <text x="792" y="388" font-size="12" fill="#333">Giá quét SL kế hoạch của trader.</text>
  <text x="792" y="404" font-size="12" fill="#333">Đây là lệnh thua ban đầu, đúng</text>
  <text x="792" y="420" font-size="12" fill="#333">chi phí vận hành của hệ thống.</text>
  <text x="792" y="434" font-size="12" fill="#333">Trader bước vào domain of losses.</text>

  <path d="M 915 440 L 915 460" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="780" y="465" width="270" height="100" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="792" y="485" font-size="12" font-weight="bold" fill="#3a2c00">Distribution kế tiếp (vùng nhiễu)</text>
  <text x="792" y="503" font-size="12" fill="#3a2c00">Thanh khoản mỏng, hai chiều —</text>
  <text x="792" y="519" font-size="12" fill="#3a2c00">chính lúc trader muốn revenge</text>
  <text x="792" y="535" font-size="12" fill="#3a2c00">nhất lại là lúc signal/noise</text>
  <text x="792" y="551" font-size="12" fill="#3a2c00">thấp nhất trong ngày.</text>

  <path d="M 915 565 L 915 585" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="780" y="590" width="270" height="80" rx="6" fill="#fdecea" stroke="#c62828"/>
  <text x="792" y="610" font-size="12" font-weight="bold" fill="#c62828">Kết quả: bị thu hoạch lần 2</text>
  <text x="792" y="628" font-size="12" fill="#333">Không cần "thế lực" chủ động —</text>
  <text x="792" y="644" font-size="12" fill="#333">chỉ cần tăng size, hạ chuẩn, vào</text>
  <text x="792" y="660" font-size="12" fill="#333">đúng lúc noise cao nhất.</text>

  <!-- Kết nối ngang từ Why2 sang nhánh AMD -->
  <path d="M 620 380 L 760 380" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="630" y="373" font-size="11" fill="#777">liên hệ tầng thị trường</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="30" y="790" width="1040" height="80" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="45" y="812" font-size="12" font-weight="bold" fill="#1a1a1a">Evidence Tier: Tier 0 (giả thuyết)</text>
  <text x="45" y="830" font-size="12" fill="#555">Chuỗi 5 Whys và nhánh AMD là suy luận có cấu trúc dựa trên prospect theory và</text>
  <text x="45" y="846" font-size="12" fill="#555">first-principles order flow — chưa kiểm định bằng log thật của trader (n=0).</text>
  <text x="45" y="862" font-size="12" fill="#555">Cần backtest n≥20 để nâng tier.</text>
</svg>
