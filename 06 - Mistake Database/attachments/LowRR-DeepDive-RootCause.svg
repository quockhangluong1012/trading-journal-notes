<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="780" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Not enough RR — Root Cause: Chuỗi 5 Whys</text>
  <text x="550" y="58" text-anchor="middle" font-size="14" fill="#555">Từ hành vi "vào lệnh RR dưới chuẩn" xuống nguyên nhân gốc thiếu RR gate</text>

  <!-- Why 1 -->
  <rect x="60" y="80" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="80" y="103" font-size="13" font-weight="bold" fill="#1a1a1a">Why 1: Vì sao vào lệnh RR đo được &lt;1:2?</text>
  <text x="80" y="123" font-size="13" fill="#555">Setup trông "đúng hướng" (bias/POI/sweep/MSS)</text>
  <text x="80" y="140" font-size="13" fill="#555">nên chấp nhận RR thấp hơn ngưỡng.</text>

  <!-- Why 2 -->
  <rect x="120" y="160" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="140" y="183" font-size="13" font-weight="bold" fill="#1a1a1a">Why 2: Vì sao "đúng hướng" thắng "đủ RR"?</text>
  <text x="140" y="203" font-size="13" fill="#555">Bias/POI/MSS đọc trực quan trên chart; RR thật</text>
  <text x="140" y="220" font-size="13" fill="#555">cần một bước đo lường tách biệt (runway check).</text>

  <!-- Why 3 -->
  <rect x="180" y="240" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="200" y="263" font-size="13" font-weight="bold" fill="#1a1a1a">Why 3: Vì sao bước đo RR không luôn xảy ra?</text>
  <text x="200" y="283" font-size="13" fill="#555">Runway check là kiến thức đã học, chưa phải</text>
  <text x="200" y="300" font-size="13" fill="#555">bước bắt buộc chặn lệnh trước khi bấm Buy/Sell.</text>

  <!-- Why 4 -->
  <rect x="240" y="320" width="560" height="66" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="260" y="343" font-size="13" font-weight="bold" fill="#1a1a1a">Why 4: Vì sao chưa gắn cứng vào quy trình?</text>
  <text x="260" y="363" font-size="13" fill="#555">Chưa có cổng chặn (gate) tách biệt "nhận diện</text>
  <text x="260" y="380" font-size="13" fill="#555">hướng đúng" khỏi "quyền vào lệnh".</text>

  <!-- Why 5 root -->
  <rect x="300" y="400" width="560" height="90" rx="8" fill="#c62828"/>
  <text x="320" y="428" font-size="14" font-weight="bold" fill="#fff">Why 5 (GỐC): Vì sao chưa có RR gate cứng?</text>
  <text x="320" y="450" font-size="13" fill="#fff">Thiếu RR gate đo được, không thể bỏ qua — RR bị</text>
  <text x="320" y="468" font-size="13" fill="#fff">xử lý như "cảm giác hợp lý" thay vì số đo trước —</text>
  <text x="320" y="484" font-size="13" fill="#fff">lỗi THIẾT KẾ QUY TRÌNH ĐO LƯỜNG.</text>

  <!-- arrows between steps -->
  <path d="M 340 146 L 340 158" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 226 L 400 238" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 460 306 L 460 318" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 520 386 L 520 398" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <!-- AMD / microstructure branch -->
  <rect x="760" y="80" width="290" height="410" rx="10" fill="#fff3e0" stroke="#f9a825" stroke-width="2"/>
  <text x="905" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a2c00">Nhánh vi cấu trúc (AMD)</text>

  <rect x="780" y="126" width="250" height="64" rx="6" fill="#ffffff" stroke="#ddd"/>
  <text x="795" y="148" font-size="12" font-weight="bold" fill="#1a1a1a">Vị trí trong AMD</text>
  <text x="795" y="166" font-size="12" fill="#555">RR thấp = vào quá sớm</text>
  <text x="795" y="182" font-size="12" fill="#555">trong pha Manipulation</text>

  <rect x="780" y="202" width="250" height="64" rx="6" fill="#ffffff" stroke="#ddd"/>
  <text x="795" y="224" font-size="12" font-weight="bold" fill="#1a1a1a">Runway chưa sạch</text>
  <text x="795" y="242" font-size="12" fill="#555">Pool đối ứng còn treo</text>
  <text x="795" y="258" font-size="12" fill="#555">giữa entry và target</text>

  <rect x="780" y="278" width="250" height="64" rx="6" fill="#ffffff" stroke="#ddd"/>
  <text x="795" y="300" font-size="12" font-weight="bold" fill="#1a1a1a">Counterparty</text>
  <text x="795" y="318" font-size="12" fill="#555">Resting orders tại pool</text>
  <text x="795" y="334" font-size="12" fill="#555">nội bộ bị quét trước</text>

  <rect x="780" y="354" width="250" height="64" rx="6" fill="#ffffff" stroke="#ddd"/>
  <text x="795" y="376" font-size="12" font-weight="bold" fill="#1a1a1a">Chi phí ăn RR</text>
  <text x="795" y="394" font-size="12" fill="#555">Spread/slippage chiếm %</text>
  <text x="795" y="410" font-size="12" fill="#555">lớn hơn khi risk pip nhỏ</text>

  <rect x="780" y="430" width="250" height="50" rx="6" fill="#fce4e4" stroke="#c62828"/>
  <text x="795" y="452" font-size="12" font-weight="bold" fill="#c62828">Kết luận</text>
  <text x="795" y="470" font-size="12" fill="#3a2c00">RR thấp không ngẫu nhiên</text>

  <!-- Bottom summary strip -->
  <rect x="60" y="520" width="990" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="546" font-size="14" font-weight="bold" fill="#1565c0">Ý nghĩa thực hành</text>
  <text x="80" y="568" font-size="13" fill="#1a1a1a">Giải pháp không phải "học lại RR là gì" mà là gắn bước cơ học bắt buộc: không cho phép</text>
  <text x="80" y="588" font-size="13" fill="#1a1a1a">điền order ticket nếu chưa ghi RR đo được + tên pool liquidity cụ thể vào log trước entry.</text>

  <!-- Taxonomy strip -->
  <rect x="60" y="630" width="990" height="120" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="80" y="656" font-size="14" font-weight="bold" fill="#1a1a1a">5 biến thể con thường gặp</text>
  <text x="80" y="680" font-size="13" fill="#555">1. Eyeball RR (đo bằng mắt)   2. RR sai lệch timeframe target   3. RR "làm đẹp" hồi tố</text>
  <text x="80" y="702" font-size="13" fill="#555">4. Phantom RR (runway bị chặn ẩn)   5. RR decay (quản lý lệnh phá RR kế hoạch)</text>
  <text x="80" y="726" font-size="12" fill="#555">Xem mục 11.4 nội dung markdown để biết chi tiết dấu hiệu nhận diện từng biến thể.</text>
</svg>
