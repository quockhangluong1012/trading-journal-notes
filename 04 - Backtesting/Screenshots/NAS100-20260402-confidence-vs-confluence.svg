  <line x1="60" y1="410" x2="840" y2="410" stroke="#ccc"/>

  <rect x="60" y="425" width="780" height="90" fill="#fff8e1" stroke="#e0c060"/>
  <text x="80" y="448" font-size="13" font-weight="700" fill="#8a6d00">Khoang cach: 1 muc Yes ro rang + 2 muc chua danh gia, tren tong 8 muc - nhung confidence tu cham la MAX (5/5).</text>
