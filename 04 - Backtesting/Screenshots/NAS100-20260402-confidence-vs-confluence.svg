  <text x="80" y="506" font-size="12" font-weight="700" fill="#c0392b">Rui ro: confidence 5/5 dang duoc cap boi "khong co gi sai" + outcome Win, khong phai boi so luong confluence doc lap.</text>

  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#444">[METHOD]: confidence tu cham sau khi biet outcome de danh gia lai process la outcome-as-evidence, khong phai do luong doc lap.</text>
