<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">EURUSD 2005-04-13 Short - Inducement tai CE truoc dot displacement thuc</text>
  <text x="540" y="52" text-anchor="middle" font-size="13" fill="#666">FVG H1 1.29321-1.29743, CE = 1.29532 -- gia test 2 lan truoc khi di thuc</text>

  <!-- LEFT PANEL: false break -->
  <text x="235" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">DOT 1: BAT GIA (khong FVG)</text>
  <rect x="70" y="100" width="330" height="410" fill="#fafafa" stroke="#ddd"/>

  <line x1="70" y1="150" x2="400" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="405" y="146" font-size="10" fill="#333">FVG Top 1.29743</text>

  <line x1="70" y1="230" x2="400" y2="230" stroke="#e67e22" stroke-width="2"/>
  <text x="405" y="234" font-size="11" fill="#e67e22">CE FVG H1 = 1.29532</text>

  <line x1="70" y1="300" x2="400" y2="300" stroke="#333" stroke-width="1.5"/>
  <text x="405" y="304" font-size="10" fill="#333">FVG Bottom 1.29321</text>

  <circle cx="230" cy="230" r="5" fill="#c0392b"/>
  <text x="235" y="270" text-anchor="middle" font-size="11" fill="#c0392b">Gia cham CE 2 lan, dong duoi</text>
  <path d="M 200 200 Q 230 230 200 260" stroke="#c0392b" stroke-width="2" fill="none"/>

  <rect x="70" y="330" width="330" height="60" fill="#f9d0c4" fill-opacity="0.5"/>
  <text x="235" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Nen lon nhung rau trung lap</text>
  <text x="235" y="373" text-anchor="middle" font-size="11" fill="#a93226">KHONG tao FVG -&gt; chua la</text>
  <text x="235" y="389" text-anchor="middle" font-size="11" fill="#a93226">displacement thuc (tu nhan dinh)</text>

  <!-- RIGHT PANEL: real move after inducement -->
  <text x="745" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">DOT 2: INDUCEMENT + DISPLACEMENT THUC</text>
  <rect x="580" y="100" width="330" height="410" fill="#fafafa" stroke="#ddd"/>

  <line x1="580" y1="150" x2="910" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="915" y="146" font-size="10" fill="#333">Dinh nho + EQH tai CE</text>

  <circle cx="745" cy="150" r="5" fill="#8e44ad"/>
  <text x="745" y="175" text-anchor="middle" font-size="11" fill="#8e44ad">Inducement (EQH tai CE)</text>
  <text x="745" y="192" text-anchor="middle" font-size="10" fill="#8e44ad">bi quet truoc khi dao chieu thuc</text>

  <rect x="580" y="220" width="330" height="90" fill="#a9dfbf" fill-opacity="0.55"/>
  <text x="745" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">Displacement thuc</text>
  <text x="745" y="263" text-anchor="middle" font-size="11" fill="#1e8449">tao Liquidity Void (nhieu FVG)</text>
  <text x="745" y="281" text-anchor="middle" font-size="11" fill="#1e8449">= MSS + FVG M5 -&gt; Entry</text>
  <text x="800" y="304" font-size="10" fill="#1e8449">Entry 1.29239</text>

  <line x1="580" y1="340" x2="910" y2="340" stroke="#c0392b" stroke-dasharray="5 3"/>
  <text x="915" y="344" font-size="10" fill="#c0392b">SL 1.29545 (tren dinh sweep)</text>

  <line x1="580" y1="450" x2="910" y2="450" stroke="#2980b9" stroke-width="1.5"/>
  <text x="915" y="454" font-size="10" fill="#2980b9">TP 1.28404 (RR ~2.78)</text>

  <path d="M 745 190 Q 700 260 745 300" stroke="#1e8449" stroke-width="2.5" fill="none" marker-end="url(#arrowG)"/>

  <text x="540" y="540" text-anchor="middle" font-size="12" fill="#444">Nghi van: viec phan biet "bat gia" (dot 1) voi "displacement thuc" (dot 2) co the la hindsight -- xem O1 trong Devil's Advocate.</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e8449"/>
    </marker>
  </defs>
</svg>
