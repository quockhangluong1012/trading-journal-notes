<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">EURUSD 2005-04-27 Long - iFVG dung trinh tu + BPR sau hon OTE</text>
  <text x="540" y="52" text-anchor="middle" font-size="13" fill="#666">Dealing Range H1: High 1.31266 / Low 1.28777</text>

  <!-- LEFT PANEL: timeline of iFVG formation -->
  <text x="235" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">TRINH TU HINH THANH iFVG</text>
  <rect x="70" y="100" width="330" height="410" fill="#fafafa" stroke="#ddd"/>

  <text x="90" y="135" font-size="12" font-weight="700" fill="#1a1a1a">Buoc 1 (18/04): Bearish FVG</text>
  <rect x="90" y="145" width="290" height="40" fill="#f39c12" fill-opacity="0.35"/>
  <text x="235" y="169" text-anchor="middle" font-size="10" fill="#b9770e">FVG bearish hinh thanh (bias con Bearish)</text>

  <text x="90" y="215" font-size="12" font-weight="700" fill="#1a1a1a">Buoc 2: Displacement bullish</text>
  <text x="90" y="235" font-size="10" fill="#555">Gia dong nen xuyen qua FVG bearish</text>
  <path d="M 200 190 L 200 250" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <text x="90" y="285" font-size="12" font-weight="700" fill="#1a1a1a">Buoc 3: iFVG + FVG moi = BPR</text>
  <rect x="90" y="295" width="290" height="50" fill="#a9dfbf" fill-opacity="0.6"/>
  <text x="235" y="315" text-anchor="middle" font-size="10" fill="#1e8449">BPR 1.28927 - 1.29084</text>
  <text x="235" y="333" text-anchor="middle" font-size="10" fill="#1e8449">iFVG (goi ten SAU khi co pha) + FVG bullish</text>

  <text x="90" y="390" font-size="11" fill="#c0392b" font-weight="700">Con thieu: gia dong nen cu the</text>
  <text x="90" y="408" font-size="11" fill="#c0392b">cua candle dao - body close hay wick?</text>

  <!-- RIGHT PANEL: depth vs OTE + external liquidity -->
  <text x="745" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">BPR SAU HON OTE - RUI RO SSL</text>
  <rect x="580" y="100" width="330" height="410" fill="#fafafa" stroke="#ddd"/>

  <line x1="580" y1="120" x2="910" y2="120" stroke="#333" stroke-width="2"/>
  <text x="915" y="124" font-size="10" fill="#333">Range High 1.31266 (0.0)</text>

  <rect x="580" y="220" width="330" height="55" fill="#d5d8dc" fill-opacity="0.5"/>
  <text x="915" y="217" font-size="10" fill="#666">OTE 0.618-0.79</text>
  <line x1="580" y1="220" x2="910" y2="220" stroke="#888" stroke-dasharray="3 2"/>
  <line x1="580" y1="275" x2="910" y2="275" stroke="#888" stroke-dasharray="3 2"/>

  <rect x="580" y="340" width="330" height="55" fill="#c0392b" fill-opacity="0.35"/>
  <text x="915" y="337" font-size="10" fill="#c0392b">BPR 0.84-0.94 (SAU hon OTE)</text>
  <line x1="580" y1="345" x2="910" y2="345" stroke="#c0392b" stroke-width="1.5"/>
  <text x="915" y="360" font-size="10" fill="#c0392b">BPR Top 1.29084</text>
  <line x1="580" y1="390" x2="910" y2="390" stroke="#c0392b" stroke-width="1.5"/>
  <text x="915" y="405" font-size="10" fill="#c0392b">BPR Bottom 1.28927</text>

  <rect x="580" y="390" width="330" height="30" fill="#f9d0c4" fill-opacity="0.6"/>
  <text x="745" y="410" text-anchor="middle" font-size="10" font-weight="700" fill="#a93226">~15 pip SSL chua quet</text>

  <line x1="580" y1="420" x2="910" y2="420" stroke="#333" stroke-width="2"/>
  <text x="915" y="424" font-size="10" fill="#333">Range Low 1.28777 (1.0, SSL)</text>

  <text x="745" y="460" text-anchor="middle" font-size="11" fill="#c0392b">Neu draw thuc la SSL day range,</text>
  <text x="745" y="476" text-anchor="middle" font-size="11" fill="#c0392b">SL co the bi quet truoc khi di dung huong</text>

  <text x="540" y="540" text-anchor="middle" font-size="12" fill="#444">Diem manh: note tu canh bao rui ro nay (hiem trong batch). Diem yeu: thieu gia dong nen xac nhan iFVG la body close.</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e8449"/>
    </marker>
  </defs>
</svg>
