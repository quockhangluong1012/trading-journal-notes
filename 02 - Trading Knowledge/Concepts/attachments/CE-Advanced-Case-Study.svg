<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="700" fill="#0f1420" rx="12"/>

<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: GBPUSD Short — CE-on-CE hai khung H4 + M15</text>
<text x="40" y="64" font-size="15" fill="#94a3b8">09/07, 08:15–11:30 London — hai array độc lập cùng chỉ về một vùng 6 pip</text>

<g stroke="#1c2333" stroke-width="1">
<line x1="40" y1="120" x2="1160" y2="120"/>
<line x1="40" y1="220" x2="1160" y2="220"/>
<line x1="40" y1="320" x2="1160" y2="320"/>
<line x1="40" y1="420" x2="1160" y2="420"/>
<line x1="40" y1="520" x2="1160" y2="520"/>
</g>

<!-- H4 FVG zone wide -->
<rect x="80" y="180" width="1040" height="90" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-dasharray="4,3"/>
<text x="90" y="195" font-size="13" fill="#ef4444">H4 bearish FVG unmitigated 1.2790–1.2815</text>
<line x1="80" y1="225" x2="1120" y2="225" stroke="#eab308" stroke-width="2" stroke-dasharray="7,4"/>
<text x="1000" y="220" font-size="13" fill="#eab308" font-weight="bold">CE H4 = 1.2802</text>

<!-- sweep candle -->
<rect x="150" y="230" width="18" height="25" fill="#22c55e"/><line x1="159" y1="220" x2="159" y2="270" stroke="#22c55e" stroke-width="2"/>
<text x="120" y="290" font-size="12" fill="#eab308">1: Sweep BSL 1.2822</text>

<!-- M15 displacement down -->
<rect x="220" y="240" width="20" height="60" fill="#ef4444"/><line x1="230" y1="230" x2="230" y2="315" stroke="#ef4444" stroke-width="2.5"/>
<text x="200" y="330" font-size="12" fill="#f97316">2: Displacement M15 giảm</text>

<!-- M15 FVG small, tighter -->
<rect x="260" y="245" width="70" height="30" fill="#ef4444" opacity="0.25" stroke="#ef4444" stroke-dasharray="3,3"/>
<text x="335" y="245" font-size="12" fill="#ef4444">M15 FVG 1.2798–1.2810</text>
<line x1="260" y1="258" x2="700" y2="258" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
<text x="710" y="253" font-size="13" fill="#eab308" font-weight="bold">CE M15 = 1.2804 (lệch chỉ 2 pip so với CE H4)</text>

<!-- pullback to CE zone -->
<rect x="380" y="250" width="16" height="20" fill="#22c55e"/><line x1="388" y1="243" x2="388" y2="278" stroke="#22c55e" stroke-width="2"/>
<text x="400" y="300" font-size="13" fill="#38bdf8" font-weight="bold">3: Retrace 1.2803 (09:40) — MSS bearish M5</text>

<!-- entry / SL lines -->
<line x1="380" y1="258" x2="1160" y2="258" stroke="#38bdf8" stroke-dasharray="5,4" stroke-width="2"/>
<text x="1000" y="275" font-size="12" fill="#38bdf8">Entry 1.2803</text>

<line x1="80" y1="185" x2="1160" y2="185" stroke="#ef4444" stroke-dasharray="5,4" stroke-width="2"/>
<text x="1000" y="180" font-size="12" fill="#ef4444">SL 1.2828</text>

<!-- decline candles to TP1 TP2 -->
<rect x="460" y="280" width="16" height="45" fill="#ef4444"/><line x1="468" y1="270" x2="468" y2="335" stroke="#ef4444" stroke-width="2"/>
<rect x="500" y="330" width="16" height="45" fill="#ef4444"/><line x1="508" y1="320" x2="508" y2="385" stroke="#ef4444" stroke-width="2"/>
<rect x="560" y="380" width="16" height="20" fill="#ef4444"/><line x1="568" y1="372" x2="568" y2="408" stroke="#ef4444" stroke-width="2"/>

<line x1="40" y1="400" x2="1160" y2="400" stroke="#a78bfa" stroke-dasharray="5,4" stroke-width="2"/>
<text x="590" y="395" font-size="13" fill="#a78bfa" font-weight="bold">4: TP1 1.2740 (63 pip) +2.4R</text>

<rect x="650" y="420" width="16" height="45" fill="#ef4444"/><line x1="658" y1="410" x2="658" y2="475" stroke="#ef4444" stroke-width="2"/>
<rect x="700" y="460" width="16" height="40" fill="#ef4444"/><line x1="708" y1="452" x2="708" y2="510" stroke="#ef4444" stroke-width="2"/>

<line x1="40" y1="500" x2="1160" y2="500" stroke="#a78bfa" stroke-dasharray="5,4" stroke-width="2"/>
<text x="740" y="495" font-size="13" fill="#a78bfa" font-weight="bold">5: TP2 1.2695 (108 pip) +4.3R</text>

<!-- summary -->
<rect x="40" y="540" width="1120" height="140" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="60" y="565" font-size="15" fill="#e2e8f0" font-weight="bold">Tổng kết trade</text>
<text x="60" y="588" font-size="13" fill="#94a3b8">Entry 1.2803 | SL 1.2828 (risk 25 pip) | TP1 1.2740 (+2.4R, đóng 60%) | TP2 1.2695 (+4.3R, đóng 40%)</text>
<text x="60" y="608" font-size="13" fill="#94a3b8">R trung bình weighted: ~3.2R</text>
<text x="60" y="634" font-size="13" fill="#eab308">Bài học: CE-on-CE thật (hai array độc lập, cả hai còn "tươi") cho vùng entry hẹp hơn</text>
<text x="60" y="654" font-size="13" fill="#eab308">và đáng tin hơn một CE đơn lẻ — sự đồng thuận đa khung là lý do R:R đạt gần 5 lần risk.</text>
</svg>
