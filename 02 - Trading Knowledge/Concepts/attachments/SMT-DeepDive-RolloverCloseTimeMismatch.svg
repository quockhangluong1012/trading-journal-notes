<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="34" fill="#d1d4dc" font-size="22" font-weight="bold" text-anchor="middle">Edge Case: Futures Rollover va Chenh Lech Gio Dong Cua</text>
  <text x="480" y="56" fill="#787b86" font-size="13" text-anchor="middle">Hai nguyen nhan pho bien gay SMT gia</text>

  <!-- Divider -->
  <line x1="480" y1="80" x2="480" y2="500" stroke="#1e222d" stroke-width="2"/>

  <!-- LEFT PANEL: Rollover -->
  <text x="240" y="95" fill="#d1d4dc" font-size="15" font-weight="bold" text-anchor="middle">1) Futures Rollover</text>

  <text x="60" y="130" fill="#787b86" font-size="12">Hop dong thang truoc (front month)</text>
  <polyline points="60,180 100,170 140,175 180,160" fill="none" stroke="#26a69a" stroke-width="2"/>
  <line x1="180" y1="145" x2="180" y2="300" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="185" y="150" fill="#f2c94c" font-size="11">Ngay rollover</text>

  <text x="60" y="220" fill="#787b86" font-size="12">Hop dong thang sau (back month)</text>
  <polyline points="180,210 220,200 260,205 300,190" fill="none" stroke="#ef5350" stroke-width="2"/>

  <rect x="60" y="250" width="380" height="80" fill="rgba(255,152,0,0.25)" stroke="#ff9800" stroke-width="1"/>
  <text x="70" y="270" fill="#d1d4dc" font-size="12">Volume dich chuyen tu front sang back</text>
  <text x="70" y="288" fill="#d1d4dc" font-size="12">month gay gia bien dong khong phan anh</text>
  <text x="70" y="306" fill="#d1d4dc" font-size="12">dong lenh thao tung thuc su</text>

  <text x="240" y="360" fill="#f2c94c" font-size="13" font-weight="bold" text-anchor="middle">Nen dung bieu do continuous</text>
  <text x="240" y="378" fill="#f2c94c" font-size="13" font-weight="bold" text-anchor="middle">hoac kiem tra volume 2 hop dong</text>

  <text x="240" y="420" fill="#d1d4dc" font-size="12" text-anchor="middle">NQ/ES/YM: dao han quy (thang 3/6/9/12)</text>
  <text x="240" y="440" fill="#d1d4dc" font-size="12" text-anchor="middle">Rollover thuc te ~1-2 tuan truoc dao han</text>

  <!-- RIGHT PANEL: close time mismatch -->
  <text x="720" y="95" fill="#d1d4dc" font-size="15" font-weight="bold" text-anchor="middle">2) Chenh Lech Gio Dong Cua</text>

  <text x="520" y="130" fill="#787b86" font-size="12">Futures NQ (24h, gan lien tuc)</text>
  <line x1="520" y1="160" x2="920" y2="160" stroke="#26a69a" stroke-width="3"/>
  <text x="920" y="155" fill="#26a69a" font-size="10" text-anchor="end">giao dich hau nhu lien tuc</text>

  <text x="520" y="200" fill="#787b86" font-size="12">Cash index (NDX, co gio dong cua)</text>
  <line x1="520" y1="230" x2="760" y2="230" stroke="#ef5350" stroke-width="3"/>
  <line x1="760" y1="230" x2="920" y2="230" stroke="#3a3e4a" stroke-width="3" stroke-dasharray="3,3"/>
  <text x="760" y="248" fill="#f2c94c" font-size="10">dong cua 16:00 ET</text>
  <text x="900" y="248" fill="#3a3e4a" font-size="10" text-anchor="end">khong giao dich</text>

  <rect x="520" y="270" width="400" height="90" fill="rgba(41,98,255,0.25)" stroke="#2962ff" stroke-width="1"/>
  <text x="530" y="292" fill="#d1d4dc" font-size="12">So sanh futures 24h voi cash index</text>
  <text x="530" y="310" fill="#d1d4dc" font-size="12">ngoai gio giao dich cash la khong hop le</text>
  <text x="530" y="328" fill="#d1d4dc" font-size="12">ve cau truc du lieu - can gioi han khung</text>
  <text x="530" y="346" fill="#d1d4dc" font-size="12">gio ca hai cung giao dich</text>

  <text x="720" y="400" fill="#f2c94c" font-size="13" font-weight="bold" text-anchor="middle">Chi doc SMT trong khung gio chung</text>

  <text x="480" y="500" fill="#787b86" font-size="12" text-anchor="middle">Ca hai edge case deu tao lech pha KHONG phan anh dong lenh thao tung thuc su</text>
</svg>
