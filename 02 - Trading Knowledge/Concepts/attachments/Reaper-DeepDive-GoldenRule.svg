<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
  </g>

  <text x="480" y="36" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Golden Rule: 2 dieu kien de la Reaper IFVG that</text>

  <!-- Dealing range box -->
  <rect x="60" y="80" width="840" height="380" fill="none" stroke="#d1d4dc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="80" y="100" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="13">Dealing Range</text>

  <!-- Premium / Discount split -->
  <line x1="60" y1="270" x2="900" y2="270" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="890" y="150" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Premium</text>
  <text x="890" y="420" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="14" text-anchor="end">Discount</text>

  <!-- Candles forming leg down into discount then breaker up -->
  <line x1="150" y1="140" x2="150" y2="190" stroke="#ef5350" stroke-width="2"/>
  <rect x="142" y="150" width="16" height="30" fill="#ef5350"/>
  <line x1="190" y1="180" x2="190" y2="250" stroke="#ef5350" stroke-width="2"/>
  <rect x="182" y="190" width="16" height="45" fill="#ef5350"/>
  <line x1="230" y1="240" x2="230" y2="330" stroke="#ef5350" stroke-width="2"/>
  <rect x="222" y="250" width="16" height="65" fill="#ef5350"/>

  <!-- IFVG box correctly inside leg, in discount: VALID -->
  <rect x="205" y="290" width="60" height="35" fill="rgba(41,98,255,0.25)" stroke="#26a69a" stroke-width="2"/>
  <text x="235" y="345" fill="#26a69a" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">IFVG A: HOP LE</text>
  <text x="235" y="360" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">(trong chan gia + discount)</text>

  <!-- Breaker box after -->
  <rect x="260" y="240" width="70" height="40" fill="rgba(255,152,0,0.25)"/>
  <text x="295" y="230" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Breaker</text>

  <!-- Bounce up candles -->
  <line x1="340" y1="220" x2="340" y2="270" stroke="#26a69a" stroke-width="2"/>
  <rect x="332" y="225" width="16" height="35" fill="#26a69a"/>
  <line x1="380" y1="180" x2="380" y2="230" stroke="#26a69a" stroke-width="2"/>
  <rect x="372" y="190" width="16" height="30" fill="#26a69a"/>

  <!-- Second example: IFVG in wrong location (premium) - INVALID -->
  <text x="700" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Vi du sai vi tri (khong hop le)</text>

  <line x1="600" y1="120" x2="600" y2="160" stroke="#ef5350" stroke-width="2"/>
  <rect x="592" y="125" width="16" height="25" fill="#ef5350"/>
  <line x1="640" y1="110" x2="640" y2="150" stroke="#ef5350" stroke-width="2"/>
  <rect x="632" y="115" width="16" height="25" fill="#ef5350"/>

  <rect x="615" y="140" width="50" height="25" fill="rgba(41,98,255,0.25)" stroke="#ef5350" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="640" y="185" fill="#ef5350" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">IFVG B: KHONG HOP LE</text>
  <text x="640" y="200" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">(dung vi tri chan gia nhung sai P/D - o premium)</text>

  <rect x="670" y="150" width="60" height="30" fill="rgba(255,152,0,0.25)"/>
  <text x="700" y="140" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Breaker</text>

  <text x="480" y="500" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Chi IFVG thoa CA HAI dieu kien (vi tri trong chan gia VA dung phia P/D) moi la Reaper IFVG that</text>
</svg>
