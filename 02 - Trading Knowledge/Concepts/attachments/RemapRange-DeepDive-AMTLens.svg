<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="40" fill="#d1d4dc" font-size="20" font-weight="bold" text-anchor="middle">So sanh: Re-mapping (ICT) vs Auction Market Theory / Wyckoff</text>
  <text x="480" y="62" fill="#787b86" font-size="13" text-anchor="middle">Cung mot nhip displacement, ba lang kinh doc hien tuong khac nhau</text>

  <!-- Grid background -->
  <rect x="40" y="90" width="880" height="200" fill="#1e222d"/>
  <line x1="40" y1="190" x2="920" y2="190" stroke="#2a2e39" stroke-width="1"/>

  <!-- Old range -->
  <rect x="60" y="150" width="200" height="80" fill="rgba(41,98,255,0.15)" stroke="#2962ff" stroke-width="1"/>
  <text x="160" y="145" fill="#d1d4dc" font-size="13" text-anchor="middle">Range cu (value area cu)</text>

  <!-- Displacement candles -->
  <rect x="290" y="220" width="14" height="20" fill="#26a69a"/>
  <rect x="310" y="200" width="14" height="30" fill="#26a69a"/>
  <rect x="330" y="160" width="14" height="55" fill="#26a69a"/>
  <rect x="350" y="120" width="14" height="55" fill="#26a69a"/>
  <text x="330" y="105" fill="#26a69a" font-size="13" text-anchor="middle" font-weight="bold">Displacement</text>

  <!-- FVG -->
  <rect x="330" y="160" width="34" height="20" fill="rgba(41,98,255,0.25)"/>
  <text x="347" y="255" fill="#5b8def" font-size="11" text-anchor="middle">FVG (ICT)</text>

  <!-- New range -->
  <rect x="400" y="100" width="200" height="70" fill="rgba(255,152,0,0.15)" stroke="#f2c94c" stroke-width="1"/>
  <text x="500" y="95" fill="#d1d4dc" font-size="13" text-anchor="middle">Range moi (POI can re-map)</text>

  <line x1="620" y1="100" x2="620" y2="280" stroke="#2a2e39" stroke-dasharray="4,4"/>

  <!-- three lens labels -->
  <rect x="650" y="105" width="250" height="170" fill="#181c27" stroke="#2a2e39"/>
  <text x="775" y="128" fill="#f2c94c" font-size="14" font-weight="bold" text-anchor="middle">Ba cach goi cung 1 hien tuong</text>

  <text x="665" y="155" fill="#26a69a" font-size="13" font-weight="bold">ICT:</text>
  <text x="700" y="155" fill="#d1d4dc" font-size="12">Displacement tao POI moi</text>

  <text x="665" y="182" fill="#f2c94c" font-size="13" font-weight="bold">AMT:</text>
  <text x="705" y="182" fill="#d1d4dc" font-size="12">Failure to auction back,</text>
  <text x="705" y="200" fill="#d1d4dc" font-size="12">value area moi (POC/LVN)</text>

  <text x="665" y="228" fill="#5b8def" font-size="13" font-weight="bold">Wyckoff:</text>
  <text x="665" y="248" fill="#d1d4dc" font-size="12">Sign of Strength, di vao</text>
  <text x="665" y="266" fill="#d1d4dc" font-size="12">giai doan Re-accumulation</text>

  <!-- Bottom comparison table -->
  <rect x="40" y="310" width="880" height="200" fill="#181c27" stroke="#2a2e39"/>
  <text x="480" y="335" fill="#d1d4dc" font-size="14" font-weight="bold" text-anchor="middle">Diem chung va diem khac</text>

  <line x1="40" y1="350" x2="920" y2="350" stroke="#2a2e39"/>
  <line x1="330" y1="350" x2="330" y2="500" stroke="#2a2e39"/>
  <line x1="630" y1="350" x2="630" y2="500" stroke="#2a2e39"/>

  <text x="185" y="372" fill="#26a69a" font-size="13" font-weight="bold" text-anchor="middle">ICT</text>
  <text x="480" y="372" fill="#f2c94c" font-size="13" font-weight="bold" text-anchor="middle">AMT / Volume Profile</text>
  <text x="775" y="372" fill="#5b8def" font-size="13" font-weight="bold" text-anchor="middle">Wyckoff</text>

  <text x="60" y="400" fill="#d1d4dc" font-size="11">Dinh vi POI bang hinh</text>
  <text x="60" y="416" fill="#d1d4dc" font-size="11">dang nen (FVG, OB)</text>

  <text x="350" y="400" fill="#d1d4dc" font-size="11">Do truc tiep phan phoi</text>
  <text x="350" y="416" fill="#d1d4dc" font-size="11">khoi luong theo gia</text>

  <text x="650" y="400" fill="#d1d4dc" font-size="11">Doc hanh vi qua Spring,</text>
  <text x="650" y="416" fill="#d1d4dc" font-size="11">Test, LPS trong range</text>

  <text x="60" y="450" fill="#787b86" font-size="11">Trong tam: ranh gioi</text>
  <text x="60" y="466" fill="#787b86" font-size="11">(khi nao range chet)</text>

  <text x="350" y="450" fill="#787b86" font-size="11">Trong tam: vi tri gia tri</text>
  <text x="350" y="466" fill="#787b86" font-size="11">(value area, POC, LVN)</text>

  <text x="650" y="450" fill="#787b86" font-size="11">Trong tam: hanh vi ben</text>
  <text x="650" y="466" fill="#787b86" font-size="11">trong 1 range da nhan</text>

  <text x="480" y="495" fill="#d1d4dc" font-size="11" text-anchor="middle">Diem chung: ca ba deu dong y gia da roi khoi vung can bang cu, phai dung cau truc MOI de phan tich tiep</text>
</svg>
