<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">Sweep-of-sweep: stop cascade 2 tầng trong 1 nến, vs breakout thật</text>
  <text x="32" y="66" font-size="15" fill="#787b86">NQ M5 — cùng một nến quét 2 mức thanh khoản liên tiếp, phân biệt bằng thời gian giữ trên mức</text>

  <line x1="640" y1="90" x2="640" y2="700" stroke="#2a2e39" stroke-width="1"/>

  <!-- LEFT panel: sweep-of-sweep -->
  <rect x="40" y="100" width="560" height="26" rx="5" fill="#1c2030" stroke="#b48ead" stroke-opacity="0.6"/>
  <text x="52" y="118" font-size="14" fill="#b48ead">✗ Sweep-of-sweep — cascade, khong giu duoc</text>

  <line x1="60" y1="300" x2="600" y2="300" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="480" y="294" font-size="12" fill="#b48ead">Pool 1: 20,180</text>
  <line x1="60" y1="230" x2="600" y2="230" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="480" y="224" font-size="12" fill="#b48ead">Pool 2: 20,205</text>

  <g>
    <rect x="280" y="180" width="26" height="140" fill="#26a69a" rx="1"/>
    <line x1="293" y1="150" x2="293" y2="360" stroke="#26a69a" stroke-width="2"/>
  </g>
  <text x="200" y="380" font-size="13" fill="#787b86">1 nen M5 quet ca 2 pool</text>
  <text x="200" y="398" font-size="13" fill="#787b86">roi dong nen ngay duoi Pool 1</text>

  <!-- next candle reverses down hard -->
  <g>
    <rect x="330" y="330" width="20" height="60" fill="#ef5350" rx="1"/><line x1="340" y1="320" x2="340" y2="420" stroke="#ef5350"/>
    <rect x="370" y="380" width="20" height="70" fill="#ef5350" rx="1"/><line x1="380" y1="365" x2="380" y2="470" stroke="#ef5350"/>
  </g>
  <text x="330" y="500" font-size="13" fill="#ff6b6b">Thoi gian tren muc: 1 nen, dong lai</text>
  <text x="330" y="518" font-size="13" fill="#ff6b6b">duoi ca 2 pool ngay -&gt; cascade, khong giu</text>

  <!-- RIGHT panel: real breakout -->
  <rect x="700" y="100" width="560" height="26" rx="5" fill="#1c2030" stroke="#26a69a" stroke-opacity="0.6"/>
  <text x="712" y="118" font-size="14" fill="#26a69a">✓ Breakout that — giu tren muc ≥ 3 nen</text>

  <line x1="720" y1="300" x2="1260" y2="300" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="1140" y="294" font-size="12" fill="#b48ead">Pool 1: 20,180</text>
  <line x1="720" y1="230" x2="1260" y2="230" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="1140" y="224" font-size="12" fill="#b48ead">Pool 2: 20,205</text>

  <g>
    <rect x="800" y="180" width="26" height="130" fill="#26a69a" rx="1"/><line x1="813" y1="160" x2="813" y2="330" stroke="#26a69a"/>
    <rect x="850" y="150" width="26" height="60" fill="#26a69a" rx="1"/><line x1="863" y1="135" x2="863" y2="220" stroke="#26a69a"/>
    <rect x="900" y="140" width="26" height="40" fill="#26a69a" rx="1"/><line x1="913" y1="125" x2="913" y2="195" stroke="#26a69a"/>
  </g>
  <text x="800" y="380" font-size="13" fill="#787b86">Ca 3 nen dong tren Pool 2</text>
  <text x="800" y="398" font-size="13" fill="#26a69a">-&gt; giu vung ≥3 nen = acceptance thuc su</text>

  <rect x="700" y="500" width="540" height="160" fill="#1c2030" stroke="#f2c94c" stroke-dasharray="6 4"/>
  <text x="716" y="528" font-size="15" font-weight="bold" fill="#f2c94c">Rule phan biet do duoc</text>
  <text x="716" y="552" font-size="13" fill="#d1d4dc">Giu tren muc &lt; 2 nen -&gt; nhieu kha nang</text>
  <text x="716" y="572" font-size="13" fill="#d1d4dc">la sweep-of-sweep (cascade lien tang)</text>
  <text x="716" y="596" font-size="13" fill="#d1d4dc">Giu tren muc ≥ 3 nen dong lien tiep</text>
  <text x="716" y="616" font-size="13" fill="#d1d4dc">-&gt; nhieu kha nang la breakout that</text>
  <text x="716" y="640" font-size="13" fill="#f2c94c">Ap dung cung khung voi khung phan tich chinh</text>

  <text x="60" y="694" font-size="13" fill="#565b66">Cascade 2 tầng khác cơ chế Double Sweep phân tầng (W2) — ở đây cả hai pool bị quét trong CÙNG một nến, không phải hai lần riêng biệt.</text>
</svg>
