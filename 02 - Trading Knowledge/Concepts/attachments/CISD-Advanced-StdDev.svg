<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="450" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Chiếu Standard Deviation từ chân CISD để tìm target</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">1 SD = khoảng sweep → CISD level (biên độ chân thao túng); chiếu −2 / −2.5 / −4 SD theo hướng delivery mới</text>
  <rect x="24" y="70" width="712" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- 1SD band (manipulation leg) bullish reversal: sweep low to CISD level -->
  <line x1="60" y1="360" x2="700" y2="360" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="66" y="354" font-size="10" fill="#B45309">Sweep (cực trị) = 0 SD</text>
  <line x1="60" y1="300" x2="700" y2="300" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="66" y="294" font-size="10" font-weight="700" fill="#0284C7">CISD level = 1 SD</text>
  <line x1="60" y1="240" x2="700" y2="240" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="606" y="234" font-size="10" font-weight="700" fill="#475569">−2 SD ≈ T1 / IRL gần</text>
  <line x1="60" y1="186" x2="700" y2="186" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="606" y="180" font-size="10" font-weight="700" fill="#475569">−2.5 SD ≈ T2</text>
  <line x1="60" y1="120" x2="700" y2="120" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="606" y="114" font-size="10" font-weight="700" fill="#475569">−4 SD (trend day)</text>

  <!-- bracket 1SD -->
  <path d="M96,360 L86,360 L86,300 L96,300" fill="none" stroke="#0EA5E9" stroke-width="1.6"/>
  <text x="40" y="334" font-size="10" font-weight="700" fill="#0284C7" transform="rotate(-90 40 334)">1 SD</text>

  <!-- candles: red down to sweep, green reclaim through CISD -->
  <rect x="150" y="300" width="2" height="46" fill="#DC2626"/><rect x="142" y="302" width="14" height="38" fill="#DC2626" rx="1"/>
  <rect x="182" y="330" width="2" height="40" fill="#DC2626"/><rect x="174" y="334" width="14" height="26" fill="#DC2626" rx="1"/>
  <circle cx="181" cy="360" r="7" fill="none" stroke="#B45309" stroke-width="2.2"/>
  <rect x="220" y="250" width="2" height="120" fill="#16A34A"/><rect x="212" y="264" width="14" height="96" fill="#16A34A" rx="1"/>
  <text x="230" y="256" font-size="10" font-weight="700" fill="#15803D">CISD in</text>
  <path d="M226,300 L300,262 L380,240 L470,190 L560,124" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <circle cx="380" cy="240" r="5" fill="#0EA5E9"/><text x="388" y="236" font-size="9" fill="#0284C7">chốt 1 phần</text>

  <text x="40" y="416" font-size="10.5" fill="#6B7280">Best practice: ưu tiên SD TRÙNG với IRL/ERL hoặc POI HTF — đừng chốt tại một con số SD "trần trụi".</text>
</svg>
