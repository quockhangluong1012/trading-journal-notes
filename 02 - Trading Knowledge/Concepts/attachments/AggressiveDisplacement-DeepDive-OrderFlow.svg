<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <!-- grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="40" y1="80" x2="920" y2="80"/>
    <line x1="40" y1="150" x2="920" y2="150"/>
    <line x1="40" y1="220" x2="920" y2="220"/>
    <line x1="40" y1="290" x2="920" y2="290"/>
    <line x1="40" y1="360" x2="920" y2="360"/>
    <line x1="40" y1="430" x2="920" y2="430"/>
  </g>

  <text x="480" y="40" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Co che Order Flow: Aggressive Displacement</text>

  <!-- Phase 1: resting liquidity -->
  <text x="90" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Pha 1: Resting liquidity</text>
  <line x1="70" y1="130" x2="70" y2="180" stroke="#26a69a" stroke-width="2"/>
  <rect x="63" y="140" width="14" height="30" fill="#26a69a"/>
  <line x1="110" y1="120" x2="110" y2="170" stroke="#26a69a" stroke-width="2"/>
  <rect x="103" y="130" width="14" height="25" fill="#26a69a"/>
  <line x1="150" y1="115" x2="150" y2="165" stroke="#26a69a" stroke-width="2"/>
  <rect x="143" y="120" width="14" height="30" fill="#26a69a"/>

  <line x1="70" y1="400" x2="920" y2="400" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="750" y="393" fill="#f2c94c" font-family="Arial, sans-serif" font-size="15">BSL - Buy Side Liquidity</text>

  <!-- Phase 2: trigger market order -->
  <text x="280" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Pha 2: Trigger + Sweep</text>
  <rect x="230" y="200" width="16" height="170" fill="#26a69a"/>
  <line x1="238" y1="185" x2="238" y2="380" stroke="#26a69a" stroke-width="2"/>

  <rect x="270" y="150" width="16" height="180" fill="#26a69a"/>
  <line x1="278" y1="135" x2="278" y2="335" stroke="#26a69a" stroke-width="2"/>

  <path d="M 260 400 L 300 400 L 300 385" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="230" y="415" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">Sweep BSL</text>

  <!-- FVG zone -->
  <rect x="300" y="170" width="90" height="90" fill="rgba(41,98,255,0.25)"/>
  <text x="305" y="163" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">FVG</text>

  <!-- CE line -->
  <line x1="300" y1="215" x2="390" y2="215" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="395" y="219" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">CE 50%</text>

  <!-- Phase 3: stop cascade candles -->
  <text x="480" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Pha 3: Stop cascade / MM skew</text>
  <rect x="440" y="120" width="16" height="150" fill="#26a69a"/>
  <line x1="448" y1="105" x2="448" y2="280" stroke="#26a69a" stroke-width="2"/>
  <rect x="480" y="95" width="16" height="140" fill="#26a69a"/>
  <line x1="488" y1="80" x2="488" y2="245" stroke="#26a69a" stroke-width="2"/>
  <rect x="520" y="80" width="16" height="120" fill="#26a69a"/>
  <line x1="528" y1="68" x2="528" y2="210" stroke="#26a69a" stroke-width="2"/>

  <!-- Phase 4: retrace to CE -->
  <text x="650" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Pha 4: Retrace toi CE</text>
  <rect x="600" y="230" width="16" height="60" fill="#ef5350"/>
  <line x1="608" y1="220" x2="608" y2="300" stroke="#ef5350" stroke-width="2"/>
  <rect x="640" y="200" width="16" height="70" fill="#26a69a"/>
  <line x1="648" y1="190" x2="648" y2="285" stroke="#26a69a" stroke-width="2"/>

  <line x1="580" y1="245" x2="700" y2="245" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="705" y="249" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">CE giu gia</text>

  <!-- continuation candles -->
  <rect x="700" y="150" width="16" height="90" fill="#26a69a"/>
  <line x1="708" y1="135" x2="708" y2="255" stroke="#26a69a" stroke-width="2"/>
  <rect x="740" y="110" width="16" height="100" fill="#26a69a"/>
  <line x1="748" y1="95" x2="748" y2="225" stroke="#26a69a" stroke-width="2"/>
  <rect x="780" y="85" width="16" height="90" fill="#26a69a"/>
  <line x1="788" y1="70" x2="788" y2="190" stroke="#26a69a" stroke-width="2"/>

  <text x="640" y="330" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">Entry tai CE, Target BSL moi</text>

  <!-- legend -->
  <rect x="40" y="470" width="16" height="16" fill="rgba(41,98,255,0.25)"/>
  <text x="62" y="483" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">FVG (imbalance)</text>
  <line x1="220" y1="478" x2="260" y2="478" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="266" y="483" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">Vung thanh khoan (SSL/BSL)</text>
  <line x1="500" y1="478" x2="540" y2="478" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="546" y="483" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">CE / muc gia phong ve</text>

  <text x="480" y="520" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Resting liquidity bi tieu thu trong displacement lam retrace chi con nong toi CE</text>
</svg>
