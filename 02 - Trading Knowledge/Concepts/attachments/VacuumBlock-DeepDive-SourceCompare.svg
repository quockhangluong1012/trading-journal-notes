<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#131722"/>
  <!-- grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="140" x2="960" y2="140"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="380" x2="960" y2="380"/>
    <line x1="0" y1="460" x2="960" y2="460"/>
    <line x1="320" y1="40" x2="320" y2="500"/>
    <line x1="640" y1="40" x2="640" y2="500"/>
  </g>

  <text x="480" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc" text-anchor="middle">Vacuum Block: so sanh theo nguon goc gap (minh hoa nguyen tac)</text>

  <!-- Column 1: Session gap -->
  <text x="160" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc" text-anchor="middle">Session Gap</text>
  <rect x="120" y="90" width="80" height="30" fill="#26a69a"/>
  <line x1="160" y1="80" x2="160" y2="90" stroke="#26a69a" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="130" stroke="#26a69a" stroke-width="2"/>
  <rect x="120" y="150" width="80" height="60" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-dasharray="4,3"/>
  <text x="160" y="185" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">VB range</text>
  <rect x="120" y="220" width="80" height="30" fill="#26a69a"/>
  <line x1="160" y1="210" x2="160" y2="220" stroke="#26a69a" stroke-width="2"/>
  <line x1="160" y1="250" x2="160" y2="260" stroke="#26a69a" stroke-width="2"/>
  <path d="M 160 220 Q 160 185 160 152" stroke="#ffffff" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="290" font-family="Arial, sans-serif" font-size="14" fill="#26a69a" text-anchor="middle">Rebalance nhanh, day du</text>
  <text x="160" y="312" font-family="Arial, sans-serif" font-size="12" fill="#787b86" text-anchor="middle">(minh hoa - khong phai so lieu that)</text>

  <!-- Column 2: Weekend gap (NWOG) -->
  <text x="480" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc" text-anchor="middle">Weekend Gap (NWOG)</text>
  <rect x="440" y="90" width="80" height="30" fill="#26a69a"/>
  <line x1="480" y1="80" x2="480" y2="90" stroke="#26a69a" stroke-width="2"/>
  <line x1="480" y1="120" x2="480" y2="130" stroke="#26a69a" stroke-width="2"/>
  <rect x="440" y="150" width="80" height="60" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-dasharray="4,3"/>
  <text x="480" y="185" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">VB range</text>
  <rect x="450" y="230" width="60" height="25" fill="#ef5350"/>
  <line x1="480" y1="222" x2="480" y2="230" stroke="#ef5350" stroke-width="2"/>
  <line x1="480" y1="255" x2="480" y2="263" stroke="#ef5350" stroke-width="2"/>
  <path d="M 480 230 Q 480 200 480 152" stroke="#ffffff" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="480" y="290" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c" text-anchor="middle">Partial pho bien hon full</text>
  <text x="480" y="312" font-family="Arial, sans-serif" font-size="12" fill="#787b86" text-anchor="middle">(minh hoa - khong phai so lieu that)</text>

  <!-- Column 3: News gap -->
  <text x="800" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc" text-anchor="middle">News Gap</text>
  <rect x="760" y="90" width="80" height="30" fill="#26a69a"/>
  <line x1="800" y1="80" x2="800" y2="90" stroke="#26a69a" stroke-width="2"/>
  <line x1="800" y1="120" x2="800" y2="130" stroke="#26a69a" stroke-width="2"/>
  <rect x="760" y="150" width="80" height="60" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-dasharray="4,3"/>
  <text x="800" y="185" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">VB range</text>
  <rect x="770" y="330" width="60" height="25" fill="#26a69a"/>
  <line x1="800" y1="322" x2="800" y2="330" stroke="#26a69a" stroke-width="2"/>
  <line x1="800" y1="355" x2="800" y2="363" stroke="#26a69a" stroke-width="2"/>
  <text x="800" y="290" font-family="Arial, sans-serif" font-size="14" fill="#ef5350" text-anchor="middle">Co the khong rebalance</text>
  <text x="800" y="312" font-family="Arial, sans-serif" font-size="12" fill="#787b86" text-anchor="middle">(displacement that - minh hoa)</text>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">
    <rect x="60" y="470" width="16" height="16" fill="rgba(41,98,255,0.25)" stroke="#f2c94c"/>
    <text x="82" y="483">Vung Vacuum Block (gap range)</text>
    <line x1="360" y1="478" x2="390" y2="478" stroke="#ffffff"/>
    <text x="398" y="483">Huong keo gia du kien (draw on liquidity)</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
