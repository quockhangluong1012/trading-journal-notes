<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760">
  <rect width="1280" height="760" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">CS-D2. EURUSD Long - bias loại trừ, thua đúng quy trình (-0.5R)</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Tái dựng minh họa từ mẫu backtest - H1/M15, size giảm 50% theo rule EC-D4</text>

  <!-- sideway range box -->
  <rect x="60" y="200" width="1160" height="220" fill="#787b86" opacity="0.06" stroke="#2a2e39" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="90" y="195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">D1 sideway 4 ngày, không rõ P/D - loại bỏ bước 1</text>

  <!-- BSL/SSL equal -->
  <line x1="60" y1="230" x2="1220" y2="230" stroke="#b48ead" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="1210" y="223" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#b48ead">BSL 1.0920</text>
  <line x1="60" y1="395" x2="1220" y2="395" stroke="#b48ead" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="1210" y="410" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#b48ead">SSL 1.0855 (khoảng cách tương đương)</text>

  <!-- OB H4 tested day before -->
  <rect x="120" y="330" width="120" height="45" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="120" y1="352" x2="240" y2="352" stroke="#4a90d9" stroke-width="2"/>
  <text x="180" y="395" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#4a90d9">OB H4 1.0878 (tôn trọng hôm trước)</text>

  <!-- retrace to OB, weak MSS -->
  <g>
    <line x1="400" y1="260" x2="400" y2="310" stroke="#ef5350" stroke-width="2"/>
    <rect x="390" y="265" width="20" height="35" fill="#ef5350" rx="1"/>
    <line x1="450" y1="290" x2="450" y2="340" stroke="#ef5350" stroke-width="2"/>
    <rect x="440" y="295" width="20" height="35" fill="#ef5350" rx="1"/>
  </g>
  <g>
    <line x1="500" y1="330" x2="500" y2="360" stroke="#26a69a" stroke-width="2"/>
    <rect x="490" y="335" width="20" height="18" fill="#26a69a" rx="1"/>
  </g>
  <text x="500" y="400" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ff9800">MSS yếu: 6 pip (chuẩn 14 pip)</text>

  <line x1="530" y1="352" x2="590" y2="352" stroke="#26a69a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="595" y="357" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#26a69a">Long 1.0881, size 50%</text>

  <!-- choppy sideways after entry -->
  <g>
    <line x1="650" y1="280" x2="650" y2="330" stroke="#787b86" stroke-width="2"/>
    <rect x="640" y="285" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="700" y1="300" x2="700" y2="350" stroke="#787b86" stroke-width="2"/>
    <rect x="690" y="305" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="750" y1="270" x2="750" y2="320" stroke="#787b86" stroke-width="2"/>
    <rect x="740" y="275" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="800" y1="310" x2="800" y2="360" stroke="#787b86" stroke-width="2"/>
    <rect x="790" y="315" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="850" y1="330" x2="850" y2="380" stroke="#ef5350" stroke-width="2"/>
    <rect x="840" y="335" width="20" height="35" fill="#ef5350" rx="1"/>
  </g>
  <text x="750" y="440" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">giá đi ngang 1.0865-1.0905, không displacement thật</text>

  <!-- stop level -->
  <line x1="60" y1="380" x2="1220" y2="380" stroke="#ff6b6b" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="1210" y="373" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ff6b6b">stop 1.0865</text>

  <g>
    <line x1="900" y1="360" x2="900" y2="400" stroke="#ef5350" stroke-width="2"/>
    <rect x="890" y="365" width="20" height="35" fill="#ef5350" rx="1"/>
  </g>
  <text x="900" y="450" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff6b6b">15:40 ET stop out</text>

  <rect x="880" y="500" width="280" height="46" rx="8" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="1020" y="529" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff6b6b">✗ Kết quả: -0.5R (size đã giảm)</text>

  <text x="640" y="660" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">D1 đóng gần doji giữa range - xác nhận đây đúng là ngày Neutral thật</text>

  <text x="640" y="710" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem EC-D4 - giảm size trước, không phải sau khi thua mới rút kinh nghiệm</text>
</svg>
