<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="760" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="758" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">EURUSD Long — Thắng nhờ re-anchor đúng lúc, không giữ range chết</text>
  <text x="32" y="66" font-size="15" fill="#787b86">EURUSD H1/H4, London → NY — BOS phá range cũ buộc vẽ lại range mới trước khi vào lệnh</text>

  <text x="90" y="700" font-size="13" fill="#ff9800">Asia</text>
  <text x="330" y="700" font-size="13" fill="#ff9800">London 03:00</text>
  <text x="650" y="700" font-size="13" fill="#ff9800">London 06:00</text>
  <text x="950" y="700" font-size="13" fill="#ff9800">NY AM 09:30</text>

  <!-- OLD range box (dashed, fading) -->
  <rect x="60" y="330" width="380" height="180" fill="none" stroke="#787b86" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="66" y="322" font-size="13" fill="#787b86">Range CU (Asia): 1.0810 - 1.0850</text>

  <!-- Asia candles inside old range -->
  <g>
    <rect x="90" y="420" width="14" height="30" fill="#26a69a" rx="1"/><line x1="97" y1="410" x2="97" y2="458" stroke="#26a69a"/>
    <rect x="115" y="400" width="14" height="35" fill="#26a69a" rx="1"/><line x1="122" y1="390" x2="122" y2="443" stroke="#26a69a"/>
    <rect x="140" y="410" width="14" height="28" fill="#ef5350" rx="1"/><line x1="147" y1="400" x2="147" y2="445" stroke="#ef5350"/>
    <rect x="165" y="430" width="14" height="30" fill="#ef5350" rx="1"/><line x1="172" y1="420" x2="172" y2="468" stroke="#ef5350"/>
  </g>

  <!-- displacement breaking old range high -->
  <g>
    <rect x="200" y="360" width="14" height="60" fill="#26a69a" rx="1"/><line x1="207" y1="345" x2="207" y2="428" stroke="#26a69a"/>
    <rect x="225" y="280" width="14" height="90" fill="#26a69a" rx="1"/><line x1="232" y1="265" x2="232" y2="378" stroke="#26a69a"/>
    <rect x="250" y="220" width="14" height="70" fill="#26a69a" rx="1"/><line x1="257" y1="205" x2="257" y2="298" stroke="#26a69a"/>
  </g>
  <!-- acceptance marker -->
  <line x1="60" y1="330" x2="500" y2="330" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="270" y="325" font-size="13" fill="#ff6b6b">Dong nen H1 giu ngoai = ACCEPTANCE, khong phai sweep</text>

  <!-- NEW range box from displacement origin -->
  <rect x="280" y="205" width="800" height="330" fill="none" stroke="#4a90d9" stroke-dasharray="6 4"/>
  <text x="286" y="197" font-size="13" fill="#4a90d9">Range MOI: origin displacement 1.0838 -&gt; extreme 1.0912</text>

  <!-- new EQ line -->
  <line x1="280" y1="370" x2="1080" y2="370" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="900" y="365" font-size="13" fill="#f2c94c">EQ moi = 1.0875</text>

  <!-- retrace down to discount of NEW range (not old range) -->
  <g>
    <rect x="290" y="300" width="14" height="60" fill="#ef5350" rx="1"/><line x1="297" y1="288" x2="297" y2="368" stroke="#ef5350"/>
    <rect x="315" y="340" width="14" height="70" fill="#ef5350" rx="1"/><line x1="322" y1="328" x2="322" y2="418" stroke="#ef5350"/>
    <rect x="340" y="380" width="14" height="60" fill="#ef5350" rx="1"/><line x1="347" y1="368" x2="347" y2="448" stroke="#ef5350"/>
  </g>

  <!-- FVG / discount POI zone in new range -->
  <rect x="360" y="400" width="140" height="55" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="366" y="395" font-size="13" fill="#26a69a">Discount POI (bullish FVG) 1.0845-1.0851</text>

  <!-- entry arrow -->
  <line x1="480" y1="428" x2="480" y2="380" stroke="#f2c94c" stroke-width="2"/>
  <polygon points="480,378 474,390 486,390" fill="#f2c94c"/>
  <text x="500" y="425" font-size="14" fill="#f2c94c">ENTRY 1.0848</text>

  <!-- stop -->
  <line x1="360" y1="460" x2="500" y2="460" stroke="#ff6b6b" stroke-dasharray="4 3"/>
  <text x="510" y="464" font-size="13" fill="#ff6b6b">SL 1.0828</text>

  <!-- continuation to target BSL of new range -->
  <g>
    <rect x="560" y="330" width="14" height="60" fill="#26a69a" rx="1"/><line x1="567" y1="315" x2="567" y2="398" stroke="#26a69a"/>
    <rect x="590" y="280" width="14" height="65" fill="#26a69a" rx="1"/><line x1="597" y1="265" x2="597" y2="353" stroke="#26a69a"/>
    <rect x="620" y="235" width="14" height="60" fill="#26a69a" rx="1"/><line x1="627" y1="220" x2="627" y2="303" stroke="#26a69a"/>
    <rect x="700" y="205" width="14" height="50" fill="#26a69a" rx="1"/><line x1="707" y1="195" x2="707" y2="263" stroke="#26a69a"/>
    <rect x="850" y="210" width="14" height="35" fill="#26a69a" rx="1"/><line x1="857" y1="200" x2="857" y2="253" stroke="#26a69a"/>
  </g>

  <!-- target line -->
  <line x1="280" y1="205" x2="1080" y2="205" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="900" y="200" font-size="13" fill="#f2c94c">TP 1.0908 (BSL range moi)</text>

  <!-- result box -->
  <rect x="700" y="560" width="480" height="130" fill="#1c2030" stroke="#26a69a" stroke-dasharray="6 4"/>
  <text x="716" y="588" font-size="16" font-weight="bold" fill="#26a69a">✓ +3.0R — Long tu discount cua RANGE MOI</text>
  <text x="716" y="612" font-size="14" fill="#d1d4dc">Neu giu range Asia cu: gia da o "premium"</text>
  <text x="716" y="634" font-size="14" fill="#d1d4dc">-&gt; bo lo hoac Short nham huong</text>
  <text x="716" y="658" font-size="14" fill="#f2c94c">Twist: thang nho nhan dien ACCEPTANCE</text>
  <text x="716" y="676" font-size="14" fill="#f2c94c">de re-map, khong phai nho OTE dep</text>

  <text x="60" y="730" font-size="13" fill="#565b66">Tái dựng minh họa từ mẫu backtest EURUSD H1/H4 — không phải giao dịch thật.</text>
</svg>
