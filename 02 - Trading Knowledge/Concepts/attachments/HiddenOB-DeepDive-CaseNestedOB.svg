<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Case: Hidden OB long nhau qua 3 khung thoi gian</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="80" y1="450" x2="900" y2="450"/>
  </g>

  <!-- price path -->
  <polyline points="80,200 160,180 240,260 320,150 400,300 480,140 560,320 640,120 720,340 800,110 880,150"
    fill="none" stroke="#d1d4dc" stroke-width="2"/>

  <!-- H4 OB zone - large -->
  <rect x="380" y="270" width="160" height="90" fill="rgba(255,152,0,0.12)" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="385" y="380" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c">Hidden OB H4 (vung rong)</text>

  <!-- H1 OB nested inside -->
  <rect x="410" y="290" width="90" height="50" fill="rgba(255,152,0,0.22)" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c">Hidden OB H1 (nested)</text>
  <path d="M 590 300 L 505 305" stroke="#f2c94c" stroke-width="1" fill="none" marker-end="url(#arrow4)"/>

  <!-- M15 OB nested further -->
  <rect x="425" y="300" width="40" height="20" fill="rgba(255,152,0,0.35)" stroke="#f2c94c" stroke-width="1.5"/>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c">Hidden OB M15 (sau nhat)</text>
  <path d="M 590 330 L 468 312" stroke="#f2c94c" stroke-width="1" fill="none" marker-end="url(#arrow4)"/>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f2c94c"/>
    </marker>
  </defs>

  <text x="80" y="90" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">Cau hoi phan bien: neu 3 nguoi ve 3 hop khac nhau (H4/H1/M15)</text>
  <text x="80" y="115" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">cho CUNG mot cu bat, ai dung? Khong co trong tai khach quan neu</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">khong co rule thu tu uu tien khung thoi gian duoc dinh nghia TRUOC.</text>

  <text x="80" y="500" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Minh hoa dinh tinh cho van de "nested subjectivity" cua Hidden OB - khong phai du lieu gia thuc.</text>
</svg>
