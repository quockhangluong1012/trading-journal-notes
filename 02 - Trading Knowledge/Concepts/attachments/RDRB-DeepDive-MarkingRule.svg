<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="480" y1="60" x2="480" y2="500" stroke-dasharray="4,4"/>
  </g>

  <text x="480" y="36" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Danh dau RDRB: SAI vs DUNG</text>

  <!-- Left: WRONG marking -->
  <text x="230" y="70" fill="#ef5350" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">SAI: danh dau tren than 2 nen RDRB</text>

  <line x1="120" y1="180" x2="120" y2="220" stroke="#26a69a" stroke-width="2"/>
  <rect x="112" y="185" width="16" height="30" fill="#26a69a"/>
  <text x="120" y="240" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen truoc</text>

  <line x1="170" y1="130" x2="170" y2="190" stroke="#26a69a" stroke-width="2"/>
  <rect x="162" y="140" width="16" height="40" fill="#26a69a"/>
  <text x="170" y="120" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen A</text>

  <line x1="220" y1="110" x2="220" y2="150" stroke="#26a69a" stroke-width="2"/>
  <rect x="212" y="115" width="16" height="30" fill="#26a69a"/>
  <text x="220" y="100" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen B</text>

  <line x1="270" y1="150" x2="270" y2="200" stroke="#26a69a" stroke-width="2"/>
  <rect x="262" y="155" width="16" height="35" fill="#26a69a"/>
  <text x="270" y="220" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen sau</text>

  <!-- wrong box on A and B bodies -->
  <rect x="155" y="130" width="80" height="55" fill="rgba(41,98,255,0.25)" stroke="#ef5350" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="195" y="270" fill="#ef5350" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Vung bi dao nguoc</text>
  <text x="195" y="288" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">(dung tren than A va B)</text>

  <!-- Right: CORRECT marking -->
  <text x="730" y="70" fill="#26a69a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">DUNG: wick nen TRUOC va SAU</text>

  <line x1="620" y1="180" x2="620" y2="220" stroke="#26a69a" stroke-width="2"/>
  <rect x="612" y="185" width="16" height="30" fill="#26a69a"/>
  <text x="620" y="240" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen truoc</text>

  <line x1="670" y1="130" x2="670" y2="190" stroke="#26a69a" stroke-width="2"/>
  <rect x="662" y="140" width="16" height="40" fill="#26a69a"/>
  <text x="670" y="120" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen A</text>

  <line x1="720" y1="110" x2="720" y2="150" stroke="#26a69a" stroke-width="2"/>
  <rect x="712" y="115" width="16" height="30" fill="#26a69a"/>
  <text x="720" y="100" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen B</text>

  <line x1="770" y1="150" x2="770" y2="200" stroke="#26a69a" stroke-width="2"/>
  <rect x="762" y="155" width="16" height="35" fill="#26a69a"/>
  <text x="770" y="220" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">nen sau</text>

  <!-- correct box from wick of nen truoc to wick of nen sau -->
  <rect x="612" y="200" width="166" height="20" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="695" y="270" fill="#26a69a" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">RDRB range dung</text>
  <text x="695" y="288" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">(wick nen truoc - wick nen sau)</text>

  <path d="M 628 218 L 628 218" stroke="#ffffff" stroke-width="1"/>
  <path d="M 620 218 L 620 218" stroke="#ffffff" stroke-width="1"/>

  <text x="480" y="500" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Loi so 1: danh dau tren cap nen RDRB thay vi wick nen bao quanh se dao nguoc vung entry/stop</text>
</svg>
