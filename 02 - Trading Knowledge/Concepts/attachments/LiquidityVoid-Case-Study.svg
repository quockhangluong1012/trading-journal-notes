<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1232" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: NQ Long 12/12/2025 — Void làm TARGET sau CPI, +3.4R</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">Displacement 6 nến M5 sau tin tốt → macro void 190 điểm, entry tại FVG con trong void</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="60" y1="120" x2="1150" y2="120"/>
    <line x1="60" y1="230" x2="1150" y2="230"/>
    <line x1="60" y1="340" x2="1150" y2="340"/>
    <line x1="60" y1="450" x2="1150" y2="450"/>
    <line x1="60" y1="560" x2="1150" y2="560"/>
  </g>
  <text x="1155" y="124" font-size="9.0" fill="#94a3b8">21340 (TP)</text>
  <text x="1155" y="234" font-size="9.0" fill="#eab308">21310 BSL</text>
  <text x="1155" y="344" font-size="12" fill="#94a3b8">21195</text>
  <text x="1155" y="454" font-size="9.0" fill="#38bdf8">21180 CE entry</text>
  <text x="1155" y="564" font-size="9.2" fill="#ef4444">21140 SL</text>

  <!-- pre-news small candles -->
  <rect x="80" y="540" width="14" height="20" fill="#94a3b8" opacity="0.5"/>
  <rect x="110" y="535" width="14" height="20" fill="#94a3b8" opacity="0.5"/>
  <text x="80" y="600" font-size="12" fill="#94a3b8">trước 08:30 — đi ngang</text>

  <!-- displacement chain 08:30-08:55 -->
  <g>
    <rect x="150" y="480" width="14" height="55" fill="#22c55e"/><line x1="157" y1="465" x2="157" y2="540" stroke="#22c55e" stroke-width="2"/>
    <rect x="180" y="420" width="14" height="55" fill="#22c55e"/><line x1="187" y1="405" x2="187" y2="480" stroke="#22c55e" stroke-width="2"/>
    <rect x="210" y="350" width="14" height="65" fill="#22c55e"/><line x1="217" y1="335" x2="217" y2="420" stroke="#22c55e" stroke-width="2"/>
    <rect x="240" y="280" width="14" height="65" fill="#22c55e"/><line x1="247" y1="265" x2="247" y2="350" stroke="#22c55e" stroke-width="2"/>
    <rect x="270" y="210" width="14" height="65" fill="#22c55e"/><line x1="277" y1="195" x2="277" y2="285" stroke="#22c55e" stroke-width="2"/>
    <rect x="300" y="150" width="14" height="55" fill="#22c55e"/><line x1="307" y1="135" x2="307" y2="210" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="145" y="130" font-size="13" fill="#22c55e" font-weight="bold">① 08:30-08:55 CPI thấp hơn kỳ vọng — displacement 6 nến</text>

  <!-- void zone -->
  <rect x="145" y="150" width="180" height="390" fill="#eab308" opacity="0.12" stroke="#eab308" stroke-dasharray="4,3"/>
  <text x="145" y="700" font-size="13" fill="#eab308">Liquidity Void 21150-21340 (190 điểm, 4.2x ATR M5)</text>

  <!-- pullback and FVG con -->
  <rect x="340" y="480" width="70" height="60" fill="#38bdf8" opacity="0.2" stroke="#38bdf8" stroke-dasharray="3,2"/>
  <text x="340" y="470" font-size="12" fill="#38bdf8" font-weight="bold">② 08:58 pullback — FVG con 21165-21195</text>

  <g>
    <rect x="350" y="500" width="14" height="30" fill="#ef4444"/>
    <rect x="380" y="510" width="14" height="25" fill="#ef4444"/>
  </g>

  <!-- entry -->
  <line x1="60" y1="450" x2="1150" y2="450" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="420" y="444" font-size="14" fill="#38bdf8" font-weight="bold">③ 09:03 Entry Long CE = 21180</text>

  <!-- SL -->
  <line x1="60" y1="560" x2="1150" y2="560" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="420" y="580" font-size="13" fill="#ef4444" font-weight="bold">SL 21140 (40 điểm, $800/lot)</text>

  <!-- rally to target -->
  <g>
    <rect x="440" y="410" width="14" height="45" fill="#22c55e"/>
    <rect x="480" y="360" width="14" height="55" fill="#22c55e"/>
    <rect x="520" y="300" width="14" height="65" fill="#22c55e"/>
    <rect x="560" y="240" width="14" height="65" fill="#22c55e"/>
    <rect x="600" y="180" width="14" height="65" fill="#22c55e"/>
    <rect x="640" y="130" width="14" height="55" fill="#22c55e"/>
  </g>
  <text x="440" y="600" font-size="13" fill="#22c55e">④ 09:15-09:40 chạy đúng dự đoán</text>

  <!-- BSL sweep -->
  <line x1="60" y1="230" x2="1150" y2="230" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="670" y="224" font-size="13" fill="#eab308" font-weight="bold">⑤ 09:42 quét BSL 21310</text>

  <!-- TP -->
  <line x1="60" y1="120" x2="1150" y2="120" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="700" y="114" font-size="14" fill="#a78bfa" font-weight="bold">⑥ 09:44 TP 21340 (rìa xa void) khớp</text>

  <g transform="translate(750,270)">
    <rect x="0" y="0" width="380" height="140" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="16" y="26" font-size="15" fill="#e2e8f0" font-weight="bold">Kết quả</text>
    <text x="16" y="50" font-size="13" fill="#94a3b8">Rủi ro: 40 điểm ($800/lot)</text>
    <text x="16" y="70" font-size="13" fill="#94a3b8">Lợi nhuận chốt: 160 điểm ($3200/lot)</text>
    <text x="16" y="94" font-size="16" fill="#22c55e" font-weight="bold">R-multiple thực = +3.4R</text>
    <text x="16" y="118" font-size="12" fill="#94a3b8">(sau trừ slippage 2 tick mỗi chiều)</text>
  </g>
</svg>