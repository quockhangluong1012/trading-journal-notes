<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#d1d4dc">Exhaustion theo thứ tự leg: BOS thứ N giảm xác suất continuation</text>
<text x="40" y="70" font-size="15" fill="#787b86">Sau 3+ displacement leg liên tiếp cùng hướng, percentile độ dài leg báo hiệu cạn nhiên liệu</text>

<!-- chain of legs -->
<g>
<line x1="90" y1="560" x2="90" y2="500" stroke="#26a69a" stroke-width="1.8"/>
<rect x="78" y="510" width="24" height="45" fill="#26a69a" rx="1"/>
<line x1="130" y1="510" x2="130" y2="440" stroke="#26a69a" stroke-width="1.8"/>
<rect x="118" y="450" width="24" height="55" fill="#26a69a" rx="1"/>
</g>
<text x="70" y="600" font-size="12" fill="#787b86">Leg 1 (BOS #1)</text>
<text x="70" y="620" font-size="12" fill="#26a69a">len=58 pip · P70</text>

<g>
<line x1="200" y1="440" x2="200" y2="380" stroke="#26a69a" stroke-width="1.8"/>
<rect x="188" y="390" width="24" height="45" fill="#26a69a" rx="1"/>
<line x1="240" y1="390" x2="240" y2="300" stroke="#26a69a" stroke-width="1.8"/>
<rect x="228" y="310" width="24" height="75" fill="#26a69a" rx="1"/>
</g>
<text x="190" y="600" font-size="12" fill="#787b86">Leg 2 (BOS #2)</text>
<text x="190" y="620" font-size="12" fill="#26a69a">len=71 pip · P82</text>

<g>
<line x1="310" y1="300" x2="310" y2="240" stroke="#26a69a" stroke-width="1.8"/>
<rect x="298" y="250" width="24" height="45" fill="#26a69a" rx="1"/>
<line x1="350" y1="250" x2="350" y2="180" stroke="#26a69a" stroke-width="1.8"/>
<rect x="338" y="190" width="24" height="65" fill="#26a69a" rx="1"/>
</g>
<text x="300" y="600" font-size="12" fill="#787b86">Leg 3 (BOS #3)</text>
<text x="300" y="620" font-size="12" fill="#f2c94c">len=45 pip · P55 (co lại)</text>

<!-- leg 4 weak / exhaustion -->
<g>
<line x1="420" y1="180" x2="420" y2="150" stroke="#787b86" stroke-width="1.8"/>
<rect x="408" y="155" width="24" height="20" fill="#787b86" rx="1" opacity="0.6"/>
<line x1="460" y1="155" x2="460" y2="130" stroke="#787b86" stroke-width="1.8"/>
<rect x="448" y="135" width="24" height="18" fill="#787b86" rx="1" opacity="0.6"/>
</g>
<text x="410" y="600" font-size="12" fill="#787b86">Leg 4 (BOS #4)</text>
<text x="405" y="620" font-size="12" fill="#ff6b6b">len=14 pip · P18 (exhaustion)</text>

<!-- reversal after leg 4 -->
<g>
<line x1="510" y1="140" x2="510" y2="260" stroke="#ef5350" stroke-width="2"/>
<rect x="495" y="150" width="30" height="100" fill="#ef5350" rx="1"/>
</g>
<circle cx="460" cy="132" r="6" fill="#ff6b6b"/>
<text x="530" y="180" font-size="13" fill="#ff6b6b">MSS ngược ngay sau BOS #4</text>

<!-- percentile axis chart on the right -->
<rect x="620" y="130" width="600" height="420" fill="#131722" stroke="#2a2e39"/>
<text x="640" y="155" font-size="15" fill="#d1d4dc">Phân phối độ dài leg theo thứ tự BOS trong chuỗi (n=180 chuỗi H1 EURUSD/GBPUSD)</text>

<!-- bars for percentile median leg length by order -->
<rect x="660" y="480" width="60" height="60" fill="#26a69a" opacity="0.8"/>
<text x="665" y="560" font-size="12" fill="#787b86">BOS #1</text>
<text x="670" y="470" font-size="12" fill="#d1d4dc">P58</text>

<rect x="760" y="440" width="60" height="100" fill="#26a69a" opacity="0.8"/>
<text x="765" y="560" font-size="12" fill="#787b86">BOS #2</text>
<text x="770" y="430" font-size="12" fill="#d1d4dc">P64</text>

<rect x="860" y="470" width="60" height="70" fill="#f2c94c" opacity="0.8"/>
<text x="865" y="560" font-size="12" fill="#787b86">BOS #3</text>
<text x="870" y="460" font-size="12" fill="#d1d4dc">P49</text>

<rect x="960" y="510" width="60" height="30" fill="#ff6b6b" opacity="0.8"/>
<text x="965" y="560" font-size="12" fill="#787b86">BOS #4</text>
<text x="965" y="500" font-size="12" fill="#d1d4dc">P29</text>

<rect x="1060" y="525" width="60" height="15" fill="#ff6b6b" opacity="0.6"/>
<text x="1055" y="560" font-size="12" fill="#787b86">BOS #5+</text>
<text x="1055" y="515" font-size="12" fill="#d1d4dc">P17</text>

<line x1="640" y1="580" x2="1180" y2="580" stroke="#2a2e39"/>

<text x="60" y="660" font-size="14" fill="#f2c94c">Rule: từ BOS thứ 4 trở đi trong cùng chuỗi displacement liên tiếp, percentile độ dài leg trung vị rơi dưới P30.</text>
<text x="60" y="684" font-size="14" fill="#d1d4dc">Đây là tín hiệu giảm size/bỏ continuation entry, không phải tín hiệu đảo chiều — chỉ là cạn nhiên liệu thống kê.</text>
</svg>
