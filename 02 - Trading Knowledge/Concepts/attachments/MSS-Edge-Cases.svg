<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>

  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Edge Case đắt giá nhất: MSS trong nến tin + Fractal Conflict HTF/LTF</text>
  <text x="600" y="64" font-size="15" fill="#94a3b8" text-anchor="middle">EC3 (MSS trong nến CPI/NFP) và EC6 (HTF đúng nhưng LTF fail liên tục) minh họa trên cùng một trục thời gian</text>

  <!-- Panel A: news candle -->
  <text x="40" y="105" font-size="17" font-weight="bold" fill="#f97316">A. MSS hình thành TRONG nến CPI 08:30 — trông "hoàn hảo" nhưng kém tin cậy</text>

  <g stroke="#1c2333"><line x1="40" y1="130" x2="580" y2="130"/><line x1="40" y1="220" x2="580" y2="220"/><line x1="40" y1="310" x2="580" y2="310"/></g>

  <!-- pre-news candles making lower highs -->
  <line x1="80" y1="160" x2="80" y2="210" stroke="#ef4444" stroke-width="2"/>
  <rect x="72" y="170" width="16" height="30" fill="#ef4444"/>
  <line x1="130" y1="150" x2="130" y2="195" stroke="#ef4444" stroke-width="2"/>
  <rect x="122" y="158" width="16" height="27" fill="#ef4444"/>
  <line x1="70" y1="150" x2="200" y2="150" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="205" y="154" font-size="12" fill="#eab308">lower-high 18,140</text>

  <line x1="180" y1="175" x2="180" y2="230" stroke="#ef4444" stroke-width="2"/>
  <rect x="172" y="190" width="16" height="30" fill="#ef4444"/>
  <line x1="200" y1="220" x2="200" y2="240" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="200" y="255" font-size="11.5" fill="#eab308">equal lows 18,065/68</text>

  <!-- the massive news candle -->
  <line x1="280" y1="70" x2="280" y2="300" stroke="#f97316" stroke-width="3"/>
  <rect x="266" y="95" width="28" height="150" fill="#22c55e" stroke="#f97316" stroke-width="2"/>
  <text x="230" y="65" font-size="12.5" fill="#f97316" font-weight="bold">08:30:00 CPI — 1 nến M1</text>
  <text x="230" y="315" font-size="11.5" fill="#94a3b8">quét 18,048 → đóng 18,158</text>

  <!-- FVG deep -->
  <rect x="300" y="150" width="130" height="60" fill="#22c55e" opacity="0.2"/>
  <text x="310" y="170" font-size="12" fill="#e2e8f0">FVG rất sâu</text>
  <text x="310" y="186" font-size="11" fill="#94a3b8">18,075–18,105</text>

  <!-- entry then reversal -->
  <circle cx="360" cy="180" r="5" fill="#38bdf8"/>
  <text x="368" y="184" font-size="12" fill="#38bdf8">Entry 08:33 @18,098</text>

  <line x1="360" y1="180" x2="500" y2="290" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="440" y="250" font-size="12" fill="#ef4444">08:41 đảo mạnh → quét stop</text>
  <line x1="60" y1="290" x2="580" y2="290" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="305" font-size="12" fill="#ef4444">Stop 18,040 (-1R)</text>

  <rect x="40" y="330" width="540" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="352" font-size="12.5" fill="#e2e8f0">Vì sao dễ đọc sai: nến vừa sweep vừa phá toàn bộ chuỗi</text>
  <text x="52" y="368" font-size="12.5" fill="#e2e8f0">lower-high — trông "đẹp hơn" MSS bình thường nhưng phản</text>
  <text x="52" y="384" font-size="12.5" fill="#e2e8f0">ánh phản ứng tin 2 chiều, chưa ổn định, không phải order flow thật</text>

  <!-- Panel B: fractal conflict -->
  <text x="640" y="105" font-size="17" font-weight="bold" fill="#a78bfa">B. H1 MSS đúng — M5 entry fail liên tục (fractal conflict)</text>

  <g stroke="#1c2333"><line x1="640" y1="130" x2="1160" y2="130"/><line x1="640" y1="220" x2="1160" y2="220"/><line x1="640" y1="310" x2="1160" y2="310"/></g>

  <!-- H1 bullish structure -->
  <text x="650" y="150" font-size="12.5" fill="#94a3b8">H1: bullish MSS + POI hợp lệ (đúng bias, đúng sweep)</text>
  <line x1="660" y1="240" x2="660" y2="180" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="650" y="185" width="20" height="50" fill="#22c55e"/>
  <rect x="650" y="235" width="150" height="40" fill="#22c55e" opacity="0.18"/>
  <text x="655" y="290" font-size="11.5" fill="#e2e8f0">H1 FVG (POI đúng)</text>

  <!-- M5 attempts fail 1, fail 2 then win -->
  <text x="850" y="150" font-size="12.5" fill="#94a3b8" textLength="344" lengthAdjust="spacingAndGlyphs">M5 refine: 2 lần bearish micro-MSS quét stop trước khi đúng hướng</text>

  <line x1="870" y1="200" x2="870" y2="240" stroke="#ef4444" stroke-width="2"/>
  <rect x="862" y="205" width="14" height="25" fill="#ef4444"/>
  <text x="850" y="255" font-size="11" fill="#ef4444">Fail #1</text>

  <line x1="920" y1="210" x2="920" y2="250" stroke="#ef4444" stroke-width="2"/>
  <rect x="912" y="215" width="14" height="25" fill="#ef4444"/>
  <text x="900" y="265" font-size="11" fill="#ef4444">Fail #2</text>

  <line x1="970" y1="240" x2="970" y2="170" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="962" y="175" width="16" height="55" fill="#22c55e"/>
  <text x="950" y="160" font-size="11.5" fill="#22c55e" font-weight="bold">Đúng hướng cuối cùng</text>

  <rect x="640" y="330" width="520" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="652" y="352" font-size="12.5" fill="#e2e8f0">Rule đo được: sau ≥2 lần thua liên tiếp cùng loại setup</text>
  <text x="652" y="368" font-size="12.5" fill="#e2e8f0">HTF-đúng/LTF-fail, chuyển confirmation timeframe lên M15</text>
  <text x="652" y="384" font-size="12.5" fill="#e2e8f0">(thô hơn, ít nhiễu hơn) thay vì tiếp tục refine M5</text>

  <!-- bottom: other edge cases quick reference -->
  <text x="40" y="440" font-size="17" font-weight="bold" fill="#e2e8f0">Các Edge Case khác cần nhớ (xem đầy đủ trong mục 19)</text>
  <g font-size="12.5">
    <rect x="40" y="455" width="365" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="52" y="476" fill="#eab308" font-weight="bold">EC1 — Data feed khác nhau</text>
    <text x="52" y="495" fill="#e2e8f0">MSS trên CFD broker không tồn</text>
    <text x="52" y="510" fill="#e2e8f0">tại trên futures CME → dùng</text>
    <text x="52" y="525" fill="#e2e8f0">chart gốc làm bản đồ chính</text>

    <rect x="418" y="455" width="365" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="430" y="476" fill="#eab308" font-weight="bold">EC5 — Gap thứ Hai đầu tuần</text>
    <text x="430" y="495" fill="#e2e8f0">Swing "phá" bởi gap cuối tuần</text>
    <text x="430" y="510" fill="#e2e8f0">không phải MSS thật — chờ nến</text>
    <text x="430" y="525" fill="#e2e8f0">đầu tuần đóng + displacement</text>

    <rect x="796" y="455" width="364" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="808" y="476" fill="#eab308" font-weight="bold">EC8 — Trend một chiều mạnh</text>
    <text x="808" y="495" fill="#e2e8f0">MSS counter-trend "đúng hình"</text>
    <text x="808" y="510" fill="#e2e8f0">nhưng ATR co + không pullback</text>
    <text x="808" y="525" fill="#e2e8f0">sâu → hạ tier hoặc bỏ hẳn</text>
  </g>

  <text x="600" y="590" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-style="italic">Bài học chung: checklist kỹ thuật đúng không đảm bảo bối cảnh (tin tức, fractal, trend regime) đang ủng hộ MSS.</text>
</svg>