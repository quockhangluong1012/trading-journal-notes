<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="42" font-size="26" font-weight="bold" fill="#e2e8f0">Edge case đắt giá nhất: CBDR quá hẹp và quá rộng đều phá SD projection</text>
  <text x="40" y="66" font-size="15" fill="#94a3b8">So sánh 2 phiên GBPUSD cùng tuần — cùng công thức, kết quả trái ngược hoàn toàn</text>

  <!-- Left panel: too narrow -->
  <rect x="50" y="100" width="520" height="600" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="70" y="128" font-size="16" fill="#e2e8f0" font-weight="bold">Case A: Range quá HẸP (12 pip)</text>
  <text x="70" y="148" font-size="13" fill="#94a3b8">Thứ Ba — thanh khoản Âu-Mỹ nghỉ lễ một phần</text>

  <line x1="90" y1="300" x2="530" y2="300" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="535" y="304" font-size="11" fill="#e2e8f0">High</text>
  <line x1="90" y1="330" x2="530" y2="330" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="535" y="334" font-size="11" fill="#e2e8f0">Low (12 pip)</text>

  <g>
    <rect x="110" y="308" width="12" height="14" fill="#22c55e"/>
    <rect x="140" y="312" width="12" height="12" fill="#ef4444"/>
    <rect x="170" y="309" width="12" height="14" fill="#22c55e"/>
    <rect x="200" y="313" width="12" height="11" fill="#ef4444"/>
  </g>

  <!-- SD fan too tight -->
  <line x1="90" y1="315" x2="530" y2="200" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="440" y="195" font-size="12" fill="#22c55e">+1 SD (chỉ 12 pip trên)</text>
  <line x1="90" y1="315" x2="530" y2="140" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="440" y="135" font-size="12" fill="#94a3b8">+2 SD (24 pip — vẫn trong noise thường ngày)</text>

  <!-- price whips through both -->
  <g>
    <rect x="300" y="150" width="14" height="160" fill="#38bdf8" opacity="0.5"/>
  </g>
  <text x="120" y="420" font-size="13" fill="#f97316">London mở: giá giật 35 pip trong 20 phút</text>
  <text x="120" y="440" font-size="13" fill="#f97316">xuyên thẳng qua +1 SD, +2 SD, +3 SD</text>
  <text x="120" y="460" font-size="13" fill="#94a3b8">chỉ là biến động bình thường của phiên —</text>
  <text x="120" y="478" font-size="13" fill="#94a3b8">không phải "expansion tới target"</text>

  <rect x="80" y="510" width="460" height="160" rx="6" fill="#0f1420" stroke="#334155"/>
  <text x="95" y="535" font-size="13" fill="#e2e8f0" font-weight="bold">Vấn đề:</text>
  <text x="95" y="556" font-size="13" fill="#94a3b8">Đơn vị SD quá nhỏ (12 pip) so với volatility</text>
  <text x="95" y="574" font-size="13" fill="#94a3b8">thật của phiên (ATR London ~55 pip GBPUSD).</text>
  <text x="95" y="592" font-size="13" fill="#94a3b8">Mọi mức SD bị "nuốt" trong vài phút —</text>
  <text x="95" y="610" font-size="13" fill="#94a3b8">TP tại +1/+2 SD chốt lời quá sớm, bỏ lỡ</text>
  <text x="95" y="628" font-size="13" fill="#94a3b8">phần lớn move thật. Range hẹp do NGÀY LỄ,</text>
  <text x="95" y="646" font-size="13" fill="#94a3b8">không phải do dealer thật đang cân bằng.</text>

  <!-- Right panel: too wide -->
  <rect x="620" y="100" width="530" height="600" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="128" font-size="16" fill="#e2e8f0" font-weight="bold">Case B: Range quá RỘNG (95 pip)</text>
  <text x="640" y="148" font-size="13" fill="#94a3b8">Thứ Năm — BOE speech bất ngờ rơi vào cửa sổ 18:00 NY</text>

  <line x1="660" y1="230" x2="1120" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="1125" y="234" font-size="11" fill="#e2e8f0">High</text>
  <line x1="660" y1="420" x2="1120" y2="420" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="1125" y="424" font-size="11" fill="#e2e8f0">Low (95 pip)</text>

  <g>
    <rect x="680" y="240" width="12" height="20" fill="#22c55e"/>
    <line x1="686" y1="232" x2="686" y2="264" stroke="#22c55e" stroke-width="2"/>
    <rect x="710" y="300" width="12" height="90" fill="#ef4444"/>
    <line x1="716" y1="240" x2="716" y2="418" stroke="#ef4444" stroke-width="2"/>
    <rect x="740" y="350" width="12" height="30" fill="#22c55e"/>
  </g>
  <text x="680" y="450" font-size="12" fill="#f97316">Spike tin BOE tạo wick dài bất thường</text>

  <!-- SD fan too wide -->
  <line x1="660" y1="325" x2="1120" y2="80" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="960" y="75" font-size="12" fill="#22c55e">+1 SD (95 pip trên — quá xa)</text>

  <rect x="650" y="510" width="480" height="160" rx="6" fill="#0f1420" stroke="#334155"/>
  <text x="665" y="535" font-size="13" fill="#e2e8f0" font-weight="bold">Vấn đề:</text>
  <text x="665" y="556" font-size="13" fill="#94a3b8">Range bị "nhiễm" spike tin ngoài kế hoạch,</text>
  <text x="665" y="574" font-size="13" fill="#94a3b8">gấp gần 2x ATR phiên London thường ngày.</text>
  <text x="665" y="592" font-size="13" fill="#94a3b8">+1 SD (95 pip) vượt xa range trung bình</text>
  <text x="665" y="610" font-size="13" fill="#94a3b8">một ngày GBPUSD — giá lẹt đẹt cả phiên</text>
  <text x="665" y="628" font-size="13" fill="#94a3b8">London/NY sau đó, không bao giờ chạm.</text>
  <text x="665" y="646" font-size="13" fill="#eab308">Cả 2 case: SD chỉ có nghĩa khi range PHẢN ÁNH</text>
  <text x="665" y="663" font-size="13" fill="#eab308">đúng "nhịp thở" bình thường của phiên tới.</text>
</svg>
