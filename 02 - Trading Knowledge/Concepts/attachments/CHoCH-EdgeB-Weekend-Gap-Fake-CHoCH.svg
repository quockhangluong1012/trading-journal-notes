<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Weekend gap tạo ra CHoCH mà không có giao dịch thật</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">XAUUSD/GBPJPY broker CFD có nến Chủ nhật - ~70% các "CHoCH cuối tuần" bị lấp lại đầu tuần</text>

  <line x1="60" y1="450" x2="1220" y2="450" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="1210" y="442" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">protected low</text>

  <!-- Friday close candles downtrend -->
  <g>
    <line x1="120" y1="330" x2="120" y2="400" stroke="#ef5350" stroke-width="2"/>
    <rect x="112" y="335" width="16" height="45" fill="#ef5350" rx="1"/>
    <line x1="180" y1="360" x2="180" y2="430" stroke="#ef5350" stroke-width="2"/>
    <rect x="172" y="365" width="16" height="45" fill="#ef5350" rx="1"/>
    <line x1="240" y1="390" x2="240" y2="455" stroke="#ef5350" stroke-width="2"/>
    <rect x="232" y="395" width="16" height="40" fill="#ef5350" rx="1"/>
  </g>
  <text x="180" y="490" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">đóng cửa Thứ Sáu 2 428.50</text>
  <line x1="240" y1="450" x2="240" y2="470" stroke="#787b86" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Gap zone -->
  <rect x="280" y="180" width="120" height="270" fill="#ff9800" opacity="0.10" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="200" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff9800">khoảng trống</text>
  <text x="340" y="218" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff9800">không có tick nào</text>
  <text x="340" y="236" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff9800">giao dịch thực</text>

  <!-- Sunday open candle far above protected low -->
  <line x1="420" y1="180" x2="420" y2="230" stroke="#26a69a" stroke-width="2.5"/>
  <rect x="406" y="185" width="28" height="40" fill="#26a69a" rx="1"/>
  <text x="420" y="165" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff9800">mở cửa Chủ Nhật</text>
  <text x="420" y="250" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#26a69a">gap +9.5 ATR "displacement"</text>

  <rect x="470" y="140" width="230" height="46" rx="8" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="585" y="169" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">✗ gap_origin: weekend</text>

  <!-- Monday session: price fills gap back to Friday close -->
  <g>
    <line x1="520" y1="220" x2="520" y2="290" stroke="#ef5350" stroke-width="2"/>
    <rect x="512" y="225" width="16" height="55" fill="#ef5350" rx="1"/>
    <line x1="580" y1="270" x2="580" y2="350" stroke="#ef5350" stroke-width="2"/>
    <rect x="572" y="275" width="16" height="65" fill="#ef5350" rx="1"/>
    <line x1="640" y1="330" x2="640" y2="410" stroke="#ef5350" stroke-width="2"/>
    <rect x="632" y="335" width="16" height="65" fill="#ef5350" rx="1"/>
    <line x1="700" y1="390" x2="700" y2="450" stroke="#ef5350" stroke-width="2"/>
    <rect x="692" y="395" width="16" height="45" fill="#ef5350" rx="1"/>
  </g>
  <text x="610" y="480" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">phiên Á/London Thứ Hai: lấp gap về đúng 2 428.50</text>

  <line x1="750" y1="410" x2="750" y2="450" stroke="#26a69a" stroke-width="2"/>
  <rect x="742" y="415" width="16" height="30" fill="#26a69a" rx="1" opacity="0.6"/>

  <rect x="850" y="380" width="260" height="70" rx="8" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="980" y="405" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#26a69a">giá sửa lại về giá trị</text>
  <text x="980" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#26a69a">công bằng - không liên</text>
  <text x="980" y="443" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#26a69a">quan cấu trúc CHoCH</text>

  <text x="640" y="600" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">Dealing desk định giá lại nến Chủ Nhật theo futures/spot, không phải order flow tổ chức thật</text>

  <text x="640" y="695" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Rule: loại trừ CHoCH từ nến mở phiên đầu tuần nếu gap ≥ 1.5x ATR(14) - xem EC-B5</text>
</svg>
