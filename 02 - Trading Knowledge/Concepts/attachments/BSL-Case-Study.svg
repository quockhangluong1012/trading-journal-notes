<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: GBPUSD Short reversal sau sweep PWH</text>
  <text x="40" y="62" font-size="15" fill="#94a3b8">Thứ Ba 14/04, London KZ 08:10-09:30 — thắng đúng sách 2.8R</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="40" y1="120" x2="1160" y2="120"/>
    <line x1="40" y1="220" x2="1160" y2="220"/>
    <line x1="40" y1="320" x2="1160" y2="320"/>
    <line x1="40" y1="420" x2="1160" y2="420"/>
    <line x1="40" y1="520" x2="1160" y2="520"/>
  </g>

  <!-- PWH level -->
  <line x1="80" y1="200" x2="1120" y2="200" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1000" y="195" font-size="14" fill="#eab308">PWH 1.2648</text>

  <!-- pre-move up candles -->
  <g>
    <line x1="130" y1="380" x2="130" y2="260" stroke="#22c55e" stroke-width="2"/>
    <rect x="120" y="280" width="20" height="90" fill="#22c55e"/>
    <line x1="180" y1="360" x2="180" y2="240" stroke="#22c55e" stroke-width="2"/>
    <rect x="170" y="255" width="20" height="90" fill="#22c55e"/>
    <line x1="230" y1="330" x2="230" y2="205" stroke="#22c55e" stroke-width="2"/>
    <rect x="220" y="220" width="20" height="95" fill="#22c55e"/>
  </g>

  <!-- sweep candle at 08:15 -->
  <line x1="290" y1="360" x2="290" y2="160" stroke="#f97316" stroke-width="3"/>
  <rect x="278" y="200" width="24" height="130" fill="#f97316"/>
  <text x="250" y="150" font-size="13" fill="#f97316">08:15 sweep wick → 1.2653</text>

  <!-- reclaim candle -->
  <line x1="350" y1="200" x2="350" y2="330" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="338" y="215" width="24" height="90" fill="#ef4444"/>
  <text x="330" y="345" font-size="12" fill="#e2e8f0">08:22 đóng nến quay lại &lt; 1.2648</text>

  <!-- displacement down + FVG -->
  <rect x="400" y="330" width="90" height="60" fill="#ef4444" opacity="0.2"/>
  <text x="405" y="325" font-size="12" fill="#ef4444">bearish FVG 1.2630-1.2638</text>
  <line x1="420" y1="330" x2="420" y2="470" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="408" y="340" width="24" height="130" fill="#ef4444"/>
  <line x1="470" y1="450" x2="470" y2="540" stroke="#ef4444" stroke-width="2"/>
  <rect x="458" y="450" width="24" height="90" fill="#ef4444"/>

  <!-- STL / MSS -->
  <line x1="290" y1="400" x2="600" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="605" y="405" font-size="12" fill="#94a3b8">STL nội bộ 1.2622</text>
  <polygon points="470,450 455,425 485,425" fill="#ef4444"/>
  <text x="495" y="440" font-size="13" fill="#ef4444">08:38 MSS giảm xác nhận</text>

  <!-- retrace to FVG entry -->
  <line x1="540" y1="470" x2="540" y2="410" stroke="#38bdf8" stroke-width="2"/>
  <rect x="528" y="410" width="24" height="60" fill="#38bdf8" opacity="0.7"/>
  <circle cx="540" cy="415" r="6" fill="#38bdf8"/>
  <text x="555" y="418" font-size="13" fill="#38bdf8">08:47 Entry Short 1.2634 (CE FVG)</text>

  <!-- stop marker -->
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="1000" y="175" font-size="13" fill="#ef4444">SL 1.2658 (trên đỉnh sweep)</text>

  <!-- target -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="960" y="580" font-size="13" fill="#a78bfa">TP 1.2565 (SSL - Asia low)</text>

  <!-- continuation down candles to target -->
  <g>
    <line x1="620" y1="470" x2="620" y2="560" stroke="#ef4444" stroke-width="2"/>
    <rect x="608" y="480" width="24" height="70" fill="#ef4444"/>
    <line x1="690" y1="500" x2="690" y2="600" stroke="#ef4444" stroke-width="2"/>
    <rect x="678" y="510" width="24" height="80" fill="#ef4444"/>
    <line x1="760" y1="540" x2="760" y2="565" stroke="#ef4444" stroke-width="2"/>
    <rect x="748" y="545" width="24" height="20" fill="#ef4444"/>
  </g>

  <!-- box summary -->
  <rect x="850" y="90" width="310" height="220" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="870" y="118" font-size="16" font-weight="bold" fill="#e2e8f0">Kết quả</text>
  <text x="870" y="145" font-size="14" fill="#e2e8f0">Entry: 1.2634 (08:47)</text>
  <text x="870" y="168" font-size="14" fill="#ef4444">SL: 1.2658 (24 pip)</text>
  <text x="870" y="191" font-size="14" fill="#a78bfa">TP: 1.2565 (69 pip)</text>
  <text x="870" y="214" font-size="14" fill="#22c55e">R:R đạt ≈ 2.8R</text>
  <text x="870" y="245" font-size="13" fill="#94a3b8">PWH = pool external nặng,</text>
  <text x="870" y="264" font-size="13" fill="#94a3b8">sweep có wick rõ + đóng nến</text>
  <text x="870" y="283" font-size="13" fill="#94a3b8">quay lại + MSS giảm xác nhận.</text>

  <!-- timeline steps -->
  <g font-size="13" fill="#e2e8f0">
    <text x="80" y="630">1. 08:15 sweep PWH 1.2648→1.2653</text>
    <text x="80" y="652">2. 08:22 đóng nến quay lại dưới PWH</text>
    <text x="420" y="630">3. 08:38 MSS giảm phá STL 1.2622</text>
    <text x="420" y="652">4. 08:47 entry tại CE FVG 1.2634</text>
    <text x="760" y="630">5. Trailing theo cấu trúc M5</text>
    <text x="760" y="652">6. TP hit 1.2565 lúc 09:26 → 2.8R</text>
  </g>
</svg>
