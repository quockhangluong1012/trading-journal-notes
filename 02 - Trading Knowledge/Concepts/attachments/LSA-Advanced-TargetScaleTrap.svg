<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<defs>
<marker id="lsatg1" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 Z" fill="#1D4ED8"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Target CŨNG có scale — pool trung gian "ăn" cú move trước bể HTF</text>
<text x="24" y="54" font-size="13" fill="#6B7280">Trigger cùng khung entry hợp lệ, nhưng target phân tầng: T1 (pool trung gian) → T2 (bể HTF).</text>
<rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<!-- T2 far HTF EQH -->
<line x1="60" y1="118" x2="700" y2="118" stroke="#B45309" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="500" y="104" width="196" height="20" rx="4" fill="#FEF3C7"/>
<text x="508" y="118" font-size="10.5" font-weight="700" fill="#B45309">bể HTF — T2 (EQH / BSL cấp HTF)</text>
<!-- T1 intermediate pool -->
<line x1="60" y1="216" x2="700" y2="216" stroke="#B45309" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="470" y="202" width="226" height="20" rx="4" fill="#FEF3C7"/>
<text x="478" y="216" font-size="10.5" font-weight="700" fill="#B45309">pool trung gian — T1 (STH M15 / session high)</text>
<!-- POI box at bottom -->
<rect x="60" y="348" width="640" height="46" fill="#16A34A" opacity="0.10"/>
<text x="66" y="364" font-size="10" font-weight="700" fill="#15803D">POI (OB / FVG discount) — nơi entry</text>
<!-- local STL sweep line under POI -->
<line x1="60" y1="404" x2="360" y2="404" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="66" y="416" font-size="8.8" fill="#6B7280">STL cục bộ (SSL LTF) — bị quét (trigger cùng khung)</text>
<!-- FVG box on displacement up -->
<rect x="196" y="300" width="46" height="52" fill="#3B82F6" opacity="0.16"/>
<text x="200" y="294" font-size="8.5" fill="#1D4ED8">FVG</text>
<!-- price path -->
<path d="M70,270 L108,312 L146,356 L176,400 L196,356 L228,312 L272,262 L316,224 L352,212 L370,206 L392,240 L426,266 L462,250 L500,272 L538,258 L576,278"
 fill="none" stroke="#374151" stroke-width="2.1"/>
<!-- circled markers -->
<circle cx="176" cy="400" r="5" fill="none" stroke="#B45309" stroke-width="2.2"/>
<circle cx="228" cy="312" r="5" fill="none" stroke="#15803D" stroke-width="2.2"/>
<circle cx="365" cy="209" r="5" fill="none" stroke="#B45309" stroke-width="2.2"/>
<!-- annotations -->
<text x="70" y="440" font-size="10" fill="#374151">① quét STL cục bộ tại POI (LTF) → trigger cùng khung entry</text>
<text x="392" y="440" font-size="10" fill="#374151">② M5 MSS + FVG → Long</text>
<!-- reject at T1 -->
<text x="360" y="188" font-size="10" font-weight="700" fill="#B91C1C">③ giá KHỰNG / đảo lại tại T1 — chốt non nếu đặt TP thẳng T2</text>
<!-- runner arrow toward T2 -->
<path d="M600,206 L600,132" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#lsatg1)"/>
<text x="606" y="176" font-size="9.5" fill="#1D4ED8">runner</text>
<!-- partial note at T1 -->
<text x="470" y="240" font-size="9.5" font-weight="700" fill="#15803D">chốt partial tại T1</text>
</svg>
