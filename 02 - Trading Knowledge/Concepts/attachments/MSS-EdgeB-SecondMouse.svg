<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Double MSS — "Second Mouse Gets The Cheese"</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">GBPUSD M5, London AM — MSS đầu fail, sweep sâu hơn, MSS thứ hai chạy trọn</text>

  <line x1="40" y1="400" x2="1240" y2="400" stroke="#2a2e39" stroke-width="1"/>

  <!-- leg down into first sweep -->
  <g>
    <line x1="100" y1="140" x2="100" y2="240" stroke="#ef5350" stroke-width="1"/>
    <rect x="92" y="150" width="16" height="80" rx="1" fill="#ef5350"/>
    <line x1="140" y1="180" x2="140" y2="280" stroke="#ef5350" stroke-width="1"/>
    <rect x="132" y="195" width="16" height="75" rx="1" fill="#ef5350"/>
  </g>
  <!-- first shallow sweep -->
  <line x1="180" y1="230" x2="180" y2="330" stroke="#ef5350" stroke-width="1"/>
  <rect x="172" y="245" width="16" height="60" rx="1" fill="#ef5350"/>
  <line x1="60" y1="300" x2="1000" y2="300" stroke="#b48ead" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="65" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b48ead">SSL-1 1.2620</text>

  <!-- weak MSS 1 -->
  <line x1="220" y1="255" x2="220" y2="320" stroke="#26a69a" stroke-width="1"/>
  <rect x="212" y="262" width="16" height="30" rx="1" fill="#26a69a"/>
  <line x1="260" y1="200" x2="260" y2="270" stroke="#787b86" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="185" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">LH1 1.2646</text>
  <line x1="260" y1="215" x2="260" y2="285" stroke="#26a69a" stroke-width="1"/>
  <rect x="252" y="222" width="16" height="40" rx="1" fill="#26a69a"/>
  <text x="150" y="350" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">MSS-1: body nhỏ, không FVG</text>

  <!-- failed, price drops deeper -->
  <line x1="300" y1="260" x2="300" y2="360" stroke="#ef5350" stroke-width="1"/>
  <rect x="292" y="270" width="16" height="80" rx="1" fill="#ef5350"/>
  <line x1="340" y1="290" x2="340" y2="380" stroke="#ef5350" stroke-width="1"/>
  <rect x="332" y="300" width="16" height="70" rx="1" fill="#ef5350"/>
  <!-- deep sweep 2 -->
  <line x1="380" y1="330" x2="380" y2="400" stroke="#ef5350" stroke-width="1"/>
  <rect x="372" y="340" width="16" height="50" rx="1" fill="#ef5350"/>
  <line x1="60" y1="390" x2="1000" y2="390" stroke="#b48ead" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="65" y="405" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b48ead">SSL-2 (PDL thật) 1.2598</text>

  <rect x="360" y="350" width="60" height="50" fill="#b48ead" opacity="0.16" stroke="#b48ead" stroke-dasharray="6 4"/>
  <text x="365" y="358" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b48ead">sweep sâu</text>

  <!-- strong MSS 2 with displacement and FVG -->
  <line x1="420" y1="150" x2="420" y2="360" stroke="#26a69a" stroke-width="1"/>
  <rect x="412" y="160" width="16" height="185" rx="1" fill="#26a69a"/>
  <rect x="440" y="170" width="70" height="70" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4"/>
  <text x="445" y="255" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">FVG mới</text>
  <text x="410" y="130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#26a69a">MSS-2: displacement mạnh, phá LH1 luôn</text>

  <g>
    <line x1="530" y1="100" x2="530" y2="200" stroke="#26a69a" stroke-width="1"/>
    <rect x="522" y="110" width="16" height="80" rx="1" fill="#26a69a"/>
    <line x1="570" y1="70" x2="570" y2="170" stroke="#26a69a" stroke-width="1"/>
    <rect x="562" y="80" width="16" height="80" rx="1" fill="#26a69a"/>
  </g>

  <!-- entry marker at retrace -->
  <line x1="600" y1="200" x2="670" y2="240" stroke="#f2c94c" stroke-width="1.5"/>
  <circle cx="670" cy="240" r="4" fill="#f2c94c"/>
  <text x="680" y="238" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">Entry: FVG của MSS-2</text>

  <!-- comparison badges -->
  <rect x="120" y="440" width="220" height="34" rx="6" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b"/>
  <text x="138" y="463" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#ff6b6b">✗ MSS-1: win-rate 24% (n=180)</text>

  <rect x="120" y="484" width="220" height="34" rx="6" fill="#26a69a" opacity="0.18" stroke="#26a69a"/>
  <text x="138" y="507" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#26a69a">✓ MSS-2: win-rate 68% (n=180)</text>

  <text x="120" y="545" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">Điều kiện nhận diện "second mouse":</text>
  <text x="120" y="567" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">MSS-1 fail trong 1-5 nến + sweep-2 vượt sweep-1</text>
  <text x="120" y="589" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">→ chờ MSS-2 cùng hướng, bỏ hẳn MSS-1</text>

  <text x="40" y="690" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">GBPUSD M5 London AM · minh họa từ backtest tổng hợp 360 mẫu MSS thất bại</text>
</svg>
