<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="42" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study — EURUSD: setup "đẹp như sách" nhưng THUA</text>
  <text x="40" y="66" font-size="15" fill="#94a3b8">Thứ Tư 11/03, CBDR sạch 38 pip, +2 SD trùng BSL HTF — vẫn dừng lỗ</text>

  <line x1="60" y1="700" x2="1150" y2="700" stroke="#334155" stroke-width="2"/>
  <text x="90" y="722" font-size="13" fill="#94a3b8">14:00–20:00 NY (CBDR)</text>
  <text x="420" y="722" font-size="13" fill="#94a3b8">Á 20:00–02:00</text>
  <text x="700" y="722" font-size="13" fill="#94a3b8">London 02:00–05:00 NY</text>
  <text x="980" y="722" font-size="13" fill="#94a3b8">NY AM</text>

  <!-- CBDR box -->
  <rect x="80" y="430" width="260" height="55" fill="#eab308" opacity="0.12"/>
  <g>
    <rect x="100" y="440" width="12" height="16" fill="#22c55e"/>
    <rect x="125" y="444" width="12" height="14" fill="#ef4444"/>
    <rect x="150" y="441" width="12" height="16" fill="#22c55e"/>
    <rect x="175" y="445" width="12" height="13" fill="#ef4444"/>
    <rect x="200" y="442" width="12" height="15" fill="#22c55e"/>
    <rect x="225" y="446" width="12" height="13" fill="#ef4444"/>
    <rect x="250" y="443" width="12" height="14" fill="#22c55e"/>
  </g>
  <line x1="80" y1="436" x2="340" y2="436" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="345" y="440" font-size="12" fill="#e2e8f0">1.0882 (CBDR High)</text>
  <line x1="80" y1="478" x2="340" y2="478" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="345" y="482" font-size="12" fill="#e2e8f0">1.0844 (CBDR Low, 38 pip)</text>

  <!-- SD projections -->
  <line x1="340" y1="457" x2="1140" y2="330" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1010" y="325" font-size="12" fill="#22c55e">+1 SD 1.0920</text>
  <line x1="340" y1="457" x2="1140" y2="203" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="990" y="198" font-size="12" fill="#22c55e">+2 SD 1.0958 (= BSL HTF)</text>
  <line x1="340" y1="457" x2="1140" y2="584" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1010" y="598" font-size="12" fill="#ef4444">-1 SD 1.0806</text>

  <!-- Asia sweep of -1SD -->
  <g>
    <rect x="440" y="470" width="14" height="22" fill="#ef4444"/>
    <line x1="447" y1="462" x2="447" y2="500" stroke="#ef4444" stroke-width="2"/>
    <rect x="470" y="490" width="14" height="30" fill="#ef4444"/>
    <line x1="477" y1="482" x2="477" y2="528" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="440" y="545" font-size="12" fill="#f97316">Á: quét nhẹ về gần -1 SD (manipulation OK)</text>

  <!-- London MSS bullish + entry -->
  <g>
    <rect x="700" y="440" width="16" height="25" fill="#22c55e"/>
    <line x1="708" y1="430" x2="708" y2="472" stroke="#22c55e" stroke-width="2"/>
    <rect x="735" y="400" width="16" height="30" fill="#22c55e"/>
    <line x1="743" y1="390" x2="743" y2="438" stroke="#22c55e" stroke-width="2"/>
  </g>
  <circle cx="751" cy="415" r="7" fill="#38bdf8"/>
  <text x="762" y="412" font-size="13" fill="#38bdf8">Entry Long 1.0865 (FVG sau MSS)</text>
  <text x="700" y="480" font-size="12" fill="#94a3b8">Stop 1.0850 (dưới sweep London)</text>

  <!-- fake continuation then reversal at NY -->
  <g>
    <rect x="800" y="370" width="14" height="25" fill="#22c55e"/>
    <line x1="807" y1="360" x2="807" y2="400" stroke="#22c55e" stroke-width="2"/>
    <rect x="830" y="345" width="14" height="20" fill="#22c55e"/>
  </g>
  <text x="800" y="335" font-size="12" fill="#94a3b8">Giá nhích lên đúng hướng TP1...</text>

  <g>
    <rect x="900" y="370" width="16" height="35" fill="#ef4444"/>
    <line x1="908" y1="358" x2="908" y2="415" stroke="#ef4444" stroke-width="2"/>
    <rect x="940" y="410" width="16" height="55" fill="#ef4444"/>
    <line x1="948" y1="398" x2="948" y2="475" stroke="#ef4444" stroke-width="2"/>
    <rect x="980" y="465" width="16" height="45" fill="#ef4444"/>
    <line x1="988" y1="455" x2="988" y2="518" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="900" y="545" font-size="13" fill="#ef4444" font-weight="bold">NY AM: US data bất ngờ → reversal mạnh</text>
  <text x="900" y="562" font-size="12" fill="#94a3b8">giá cắm thẳng qua entry, chạm stop 1.0850</text>

  <!-- result box -->
  <rect x="700" y="80" width="440" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="715" y="105" font-size="14" fill="#e2e8f0" font-weight="bold">Kết quả bằng số</text>
  <text x="715" y="126" font-size="13" fill="#94a3b8">Entry 1.0865 → Stop 1.0850 (−15 pip)</text>
  <text x="715" y="144" font-size="13" fill="#94a3b8">Risk 1R = 150 USD/lot chuẩn (10 USD/pip)</text>
  <text x="715" y="162" font-size="13" fill="#94a3b8">Kết quả: −1R dù mọi điều kiện CBDR đúng sách</text>
  <text x="715" y="180" font-size="13" fill="#94a3b8">TP1 +1 SD (1.0920) không bao giờ đạt tới</text>
  <text x="715" y="198" font-size="13" fill="#eab308">Bài học: SD là target có điều kiện — dữ liệu vĩ</text>
  <text x="715" y="216" font-size="13" fill="#eab308">mô bất ngờ luôn thắng mọi projection kỹ thuật</text>
</svg>
