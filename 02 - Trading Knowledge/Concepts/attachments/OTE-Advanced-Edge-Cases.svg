<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>
  <g stroke="#1c2333" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="600" y1="90" x2="600" y2="650"/>
  </g>
  <text x="600" y="40" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Hai bẫy OTE: fib co cụm vs anchor sai</text>
  <text x="600" y="63" text-anchor="middle" fill="#94a3b8" font-size="15">EURUSD M1 (trái) — GBPUSD/NQ anchor sai (phải)</text>

  <!-- LEFT PANEL: clustered fib -->
  <text x="300" y="100" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">1. Leg quá ngắn — fib co cụm</text>

  <!-- candles small impulse -->
  <g>
    <rect x="120" y="380" width="16" height="30" fill="#ef4444"/><line x1="128" y1="370" x2="128" y2="415" stroke="#ef4444" stroke-width="2"/>
    <rect x="150" y="350" width="16" height="35" fill="#22c55e"/><line x1="158" y1="335" x2="158" y2="390" stroke="#22c55e" stroke-width="2"/>
    <rect x="180" y="300" width="16" height="55" fill="#22c55e"/><line x1="188" y1="285" x2="188" y2="360" stroke="#22c55e" stroke-width="2"/>
    <rect x="210" y="250" width="16" height="55" fill="#22c55e"/><line x1="218" y1="235" x2="218" y2="310" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="226" y="225" fill="#94a3b8" font-size="13">1.08880 (100%)</text>
  <line x1="120" y1="235" x2="480" y2="235" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- clustered OTE zone -->
  <rect x="120" y="255" width="360" height="8" fill="#38bdf8" opacity="0.35"/>
  <text x="490" y="255" fill="#38bdf8" font-size="13">62% 1.08825</text>
  <text x="490" y="263" fill="#38bdf8" font-size="13">79% 1.08805 → chỉ 2 pip!</text>

  <line x1="120" y1="410" x2="480" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="226" y="425" fill="#94a3b8" font-size="13">1.08760 (0%)</text>

  <!-- spread bar -->
  <rect x="250" y="256" width="30" height="6" fill="#ef4444" opacity="0.6"/>
  <text x="250" y="300" fill="#ef4444" font-size="13" font-weight="bold">Spread 1.2 pip</text>
  <text x="250" y="317" fill="#ef4444" font-size="13" font-weight="bold">≈ hơn 50% vùng OTE</text>

  <rect x="120" y="500" width="360" height="120" fill="#1e293b" stroke="#334155" rx="6"/>
  <text x="140" y="525" fill="#e2e8f0" font-size="14" font-weight="bold">① Nhịp impulse chỉ 12 pip</text>
  <text x="140" y="547" fill="#94a3b8" font-size="13">② Vùng OTE co lại còn 2 pip</text>
  <text x="140" y="569" fill="#94a3b8" font-size="13">③ Spread 1.2 pip nuốt &gt;50% edge</text>
  <text x="140" y="591" fill="#f97316" font-size="13" font-weight="bold">→ Không đủ dư địa lãi sau chi phí</text>

  <!-- RIGHT PANEL: wrong anchor -->
  <text x="900" y="100" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">2. Chọn sai swing anchor</text>

  <g>
    <rect x="650" y="400" width="18" height="40" fill="#22c55e"/><line x1="659" y1="385" x2="659" y2="450" stroke="#22c55e" stroke-width="2"/>
    <rect x="680" y="360" width="18" height="45" fill="#22c55e"/><line x1="689" y1="345" x2="689" y2="415" stroke="#22c55e" stroke-width="2"/>
    <rect x="710" y="320" width="18" height="45" fill="#22c55e"/><line x1="719" y1="305" x2="719" y2="375" stroke="#22c55e" stroke-width="2"/>
    <rect x="740" y="335" width="18" height="20" fill="#ef4444"/><line x1="749" y1="325" x2="749" y2="365" stroke="#ef4444" stroke-width="2"/>
    <rect x="770" y="290" width="18" height="50" fill="#22c55e"/><line x1="779" y1="275" x2="779" y2="350" stroke="#22c55e" stroke-width="2"/>
    <rect x="800" y="250" width="18" height="45" fill="#22c55e"/><line x1="809" y1="235" x2="809" y2="305" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- wrong anchor: minor low at 340 -->
  <circle cx="749" cy="360" r="6" fill="#ef4444"/>
  <text x="765" y="365" fill="#ef4444" font-size="13" font-weight="bold">Anchor SAI (đáy phụ,</text>
  <text x="765" y="382" fill="#ef4444" font-size="13" font-weight="bold">higher-low 20 phút trước)</text>

  <!-- correct anchor: real swing low far left, off screen conceptually -->
  <circle cx="659" cy="445" r="6" fill="#22c55e"/>
  <text x="600" y="470" fill="#22c55e" font-size="13" font-weight="bold">Anchor ĐÚNG (đáy thật của</text>
  <text x="600" y="487" fill="#22c55e" font-size="13" font-weight="bold">nhịp displacement, MSS gốc)</text>

  <line x1="659" y1="440" x2="900" y2="440" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="749" y1="365" x2="900" y2="365" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="905" y="368" fill="#ef4444" font-size="13">OTE(sai) 62-79%</text>
  <text x="905" y="443" fill="#22c55e" font-size="13">OTE(đúng) 62-79%</text>
  <text x="905" y="405" fill="#eab308" font-size="13" font-weight="bold">Lệch ~40-50 điểm</text>

  <rect x="650" y="530" width="440" height="90" fill="#1e293b" stroke="#334155" rx="6"/>
  <text x="670" y="555" fill="#e2e8f0" font-size="14" font-weight="bold">Luôn hỏi: "Đáy này có phải điểm</text>
  <text x="670" y="575" fill="#e2e8f0" font-size="14" font-weight="bold">bị phá bởi chính MSS đang dùng</text>
  <text x="670" y="595" fill="#e2e8f0" font-size="14" font-weight="bold">làm lý do vào lệnh không?"</text>

  <text x="600" y="670" text-anchor="middle" fill="#94a3b8" font-size="14">Cả hai lỗi đều "đúng quy trình vẽ" nhưng sai bản chất — checklist kỹ thuật không bắt được</text>
</svg>
