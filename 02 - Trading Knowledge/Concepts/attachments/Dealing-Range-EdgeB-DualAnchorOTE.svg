<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="800" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="798" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">Hai đầu range hợp lệ: Wick-high vs Body-high</text>
  <text x="32" y="66" font-size="15" fill="#787b86">NQ H1 — cùng một leg, hai giao thức anchor cho hai bộ OTE khác nhau</text>

  <!-- vertical divider -->
  <line x1="640" y1="90" x2="640" y2="740" stroke="#2a2e39" stroke-width="1"/>

  <!-- LEFT PANEL: wick-high anchor -->
  <rect x="40" y="100" width="200" height="26" rx="5" fill="#1c2030" stroke="#b48ead" stroke-opacity="0.6"/>
  <text x="52" y="118" font-size="14" fill="#b48ead">ANCHOR A — Sweep-high (wick)</text>

  <!-- candles left panel -->
  <g>
    <!-- down leg into low -->
    <rect x="80" y="560" width="16" height="60" fill="#ef5350" rx="1"/>
    <line x1="88" y1="550" x2="88" y2="630" stroke="#ef5350"/>
    <rect x="110" y="600" width="16" height="70" fill="#ef5350" rx="1"/>
    <line x1="118" y1="590" x2="118" y2="685" stroke="#ef5350"/>
    <!-- low anchor -->
    <rect x="140" y="640" width="16" height="20" fill="#ef5350" rx="1"/>
    <line x1="148" y1="630" x2="148" y2="670" stroke="#ef5350"/>

    <!-- up leg -->
    <rect x="180" y="480" width="16" height="150" fill="#26a69a" rx="1"/>
    <line x1="188" y1="470" x2="188" y2="640" stroke="#26a69a"/>
    <rect x="210" y="380" width="16" height="90" fill="#26a69a" rx="1"/>
    <line x1="218" y1="360" x2="218" y2="475" stroke="#26a69a"/>
    <!-- wick spike candle: body modest, wick far up -->
    <rect x="240" y="330" width="16" height="30" fill="#26a69a" rx="1"/>
    <line x1="248" y1="220" x2="248" y2="365" stroke="#26a69a" stroke-width="2"/>
    <rect x="270" y="340" width="16" height="40" fill="#ef5350" rx="1"/>
    <line x1="278" y1="330" x2="278" y2="390" stroke="#ef5350"/>
  </g>

  <!-- wick-high marker line -->
  <line x1="60" y1="222" x2="300" y2="222" stroke="#b48ead" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="212" font-size="14" fill="#b48ead">Wick-high (sweep) @ 20,412</text>

  <!-- low anchor line -->
  <line x1="60" y1="660" x2="300" y2="660" stroke="#787b86" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="676" font-size="14" fill="#787b86">Swing low @ 20,180</text>

  <!-- OTE zone left panel using wick anchor -->
  <rect x="60" y="345" width="240" height="72" fill="#f2c94c" opacity="0.14" stroke="#f2c94c" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="66" y="340" font-size="13" fill="#f2c94c">OTE (62-79%) tren Anchor A</text>
  <text x="66" y="362" font-size="13" fill="#d1d4dc">62% = 20,308</text>
  <text x="66" y="380" font-size="13" fill="#d1d4dc">70.5% = 20,281</text>
  <text x="66" y="398" font-size="13" fill="#d1d4dc">79% = 20,253</text>

  <text x="60" y="450" font-size="14" fill="#ff6b6b">Bao gom ca cai wick "khong ai giao dich"</text>
  <text x="60" y="470" font-size="14" fill="#787b86">-&gt; OTE nong hon, cham som hon</text>

  <!-- RIGHT PANEL: body-high anchor -->
  <rect x="700" y="100" width="220" height="26" rx="5" fill="#1c2030" stroke="#4a90d9" stroke-opacity="0.6"/>
  <text x="712" y="118" font-size="14" fill="#4a90d9">ANCHOR B — Displacement-high (body)</text>

  <g>
    <rect x="740" y="560" width="16" height="60" fill="#ef5350" rx="1"/>
    <line x1="748" y1="550" x2="748" y2="630" stroke="#ef5350"/>
    <rect x="770" y="600" width="16" height="70" fill="#ef5350" rx="1"/>
    <line x1="778" y1="590" x2="778" y2="685" stroke="#ef5350"/>
    <rect x="800" y="640" width="16" height="20" fill="#ef5350" rx="1"/>
    <line x1="808" y1="630" x2="808" y2="670" stroke="#ef5350"/>

    <rect x="840" y="480" width="16" height="150" fill="#26a69a" rx="1"/>
    <line x1="848" y1="470" x2="848" y2="640" stroke="#26a69a"/>
    <rect x="870" y="380" width="16" height="90" fill="#26a69a" rx="1"/>
    <line x1="878" y1="360" x2="878" y2="475" stroke="#26a69a"/>
    <rect x="900" y="330" width="16" height="30" fill="#26a69a" rx="1"/>
    <line x1="908" y1="220" x2="908" y2="365" stroke="#26a69a" stroke-width="2"/>
    <rect x="930" y="340" width="16" height="40" fill="#ef5350" rx="1"/>
    <line x1="938" y1="330" x2="938" y2="390" stroke="#ef5350"/>
  </g>

  <!-- body-high marker line: at close of displacement candle, i.e. top of body ~ y=330 -->
  <line x1="720" y1="330" x2="960" y2="330" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="320" font-size="14" fill="#4a90d9">Body-high (close) @ 20,381</text>

  <line x1="720" y1="660" x2="960" y2="660" stroke="#787b86" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="676" font-size="14" fill="#787b86">Swing low @ 20,180</text>

  <!-- OTE zone right panel using body anchor - shifted lower -->
  <rect x="720" y="400" width="240" height="72" fill="#f2c94c" opacity="0.14" stroke="#f2c94c" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="726" y="395" font-size="13" fill="#f2c94c">OTE (62-79%) tren Anchor B</text>
  <text x="726" y="417" font-size="13" fill="#d1d4dc">62% = 20,255</text>
  <text x="726" y="435" font-size="13" fill="#d1d4dc">70.5% = 20,226</text>
  <text x="726" y="453" font-size="13" fill="#d1d4dc">79% = 20,197</text>

  <text x="720" y="500" font-size="14" fill="#4a90d9">Chi tinh phan gia da "giao dich" that</text>
  <text x="720" y="520" font-size="14" fill="#787b86">-&gt; OTE sau hon, cham muon hon 28pt</text>

  <!-- bottom callout -->
  <rect x="40" y="710" width="1200" height="60" fill="#1c2030" stroke="#2a2e39"/>
  <text x="56" y="734" font-size="14" fill="#d1d4dc">Chenh lech 62% giua hai anchor: 53 diem NQ — du de mot limit "trung ke hoach A" khong bao gio thay gia tren ke hoach B.</text>
  <text x="56" y="754" font-size="13" fill="#787b86">Giao thuc: chon anchor theo displacement neu muon entry som/rong; chon body-close neu muon entry chinh xac, it bi phantom wick.</text>
</svg>
