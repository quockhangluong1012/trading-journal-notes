<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="760" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="758" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">XAUUSD Long — Thua vì chase sau partial fill, không chờ FVG con</text>
  <text x="32" y="66" font-size="15" fill="#787b86">XAUUSD M15, phiên London → NY (tái dựng minh họa từ mẫu backtest)</text>

  <text x="90" y="700" font-size="13" fill="#ff9800">08:00</text>
  <text x="330" y="700" font-size="13" fill="#ff9800">09:00</text>
  <text x="600" y="700" font-size="13" fill="#ff9800">09:45</text>
  <text x="900" y="700" font-size="13" fill="#ff9800">10:15</text>

  <!-- initial displacement -->
  <g>
    <rect x="90" y="480" width="20" height="50" fill="#26a69a" rx="1"/><line x1="100" y1="465" x2="100" y2="540" stroke="#26a69a"/>
    <rect x="125" y="400" width="20" height="90" fill="#26a69a" rx="1"/><line x1="135" y1="385" x2="135" y2="500" stroke="#26a69a"/>
    <rect x="160" y="350" width="20" height="60" fill="#26a69a" rx="1"/><line x1="170" y1="335" x2="170" y2="420" stroke="#26a69a"/>
  </g>

  <!-- FVG zone -->
  <rect x="70" y="350" width="180" height="130" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="76" y="342" font-size="13" fill="#26a69a">Bullish FVG proximal 2418 distal 2405</text>
  <line x1="60" y1="415" x2="1200" y2="415" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1080" y="410" font-size="13" fill="#f2c94c">CE = 2411.5</text>

  <!-- partial fill only 25% -->
  <g>
    <rect x="260" y="368" width="18" height="20" fill="#ef5350" rx="1"/><line x1="269" y1="358" x2="269" y2="393" stroke="#ef5350"/>
  </g>
  <line x1="60" y1="388" x2="1200" y2="388" stroke="#787b86" stroke-dasharray="3 3"/>
  <text x="1080" y="382" font-size="13" fill="#787b86">Fill toi 2416 (~15%)</text>

  <!-- trader chases with market order here (wrong) -->
  <line x1="300" y1="380" x2="300" y2="330" stroke="#ff6b6b" stroke-width="2"/>
  <polygon points="300,328 294,340 306,340" fill="#ff6b6b"/>
  <text x="230" y="320" font-size="14" fill="#ff6b6b">Market order chase tai 2417 (khong doi CE)</text>

  <!-- price continues up briefly then reverses hard (fake breakout / news reversal) -->
  <g>
    <rect x="330" y="300" width="18" height="40" fill="#26a69a" rx="1"/><line x1="339" y1="288" x2="339" y2="348" stroke="#26a69a"/>
    <rect x="360" y="260" width="18" height="35" fill="#26a69a" rx="1"/><line x1="369" y1="248" x2="369" y2="305" stroke="#26a69a"/>
    <!-- reversal candle -->
    <rect x="400" y="270" width="18" height="90" fill="#ef5350" rx="1"/><line x1="409" y1="258" x2="409" y2="380" stroke="#ef5350"/>
    <rect x="430" y="340" width="18" height="100" fill="#ef5350" rx="1"/><line x1="439" y1="325" x2="439" y2="450" stroke="#ef5350"/>
    <rect x="460" y="420" width="18" height="80" fill="#ef5350" rx="1"/><line x1="469" y1="405" x2="469" y2="510" stroke="#ef5350"/>
  </g>

  <!-- stop hit -->
  <line x1="380" y1="440" x2="700" y2="440" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="710" y="444" font-size="13" fill="#ff6b6b">SL 2409 (duoi distal, tinh theo entry chase)</text>
  <circle cx="500" cy="440" r="7" fill="#ff6b6b"/>
  <text x="515" y="470" font-size="14" fill="#ff6b6b">Stop out -1.4R</text>

  <!-- what should have happened: no FVG-child forms, so No Trade -->
  <rect x="700" y="220" width="480" height="220" fill="#1c2030" stroke="#4a90d9" stroke-dasharray="6 4"/>
  <text x="716" y="248" font-size="16" font-weight="bold" fill="#4a90d9">Dung theo re-entry protocol</text>
  <text x="716" y="274" font-size="14" fill="#d1d4dc">Fill chi 15% -&gt; sponsorship rat manh</text>
  <text x="716" y="296" font-size="14" fill="#d1d4dc">-&gt; theo EC-B4: khong chase, cho FVG con</text>
  <text x="716" y="322" font-size="14" fill="#d1d4dc">Thuc te: khong co FVG con nao hinh</text>
  <text x="716" y="344" font-size="14" fill="#d1d4dc">thanh truoc khi dao chieu that (tin</text>
  <text x="716" y="366" font-size="14" fill="#d1d4dc">CPI bat ngo dao nguoc toan bo leg)</text>
  <text x="716" y="398" font-size="14" fill="#f2c94c">-&gt; Ket luan dung la No Trade,</text>
  <text x="716" y="420" font-size="14" fill="#f2c94c">khong phai "cho lau qua lo co hoi"</text>

  <text x="60" y="730" font-size="13" fill="#565b66">Tái dựng minh họa từ mẫu backtest XAUUSD M15 — không phải giao dịch thật.</text>
</svg>
