<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">CISD (LEVEL) vs Order Block (ZONE) — và điểm confluence</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">CISD = một đường (trigger chính xác); OB = một dải (vùng chờ). Mạnh nhất khi CISD level nằm TRONG OB</text>

  <rect x="24" y="70" width="345" height="340" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#0284C7">CISD — LEVEL (đường)</text>
  <line x1="44" y1="150" x2="350" y2="150" stroke="#0EA5E9" stroke-width="2.4" stroke-dasharray="8 4"/>
  <text x="150" y="143" font-size="10" font-weight="700" fill="#0284C7">CISD level (open chuỗi đẩy)</text>
  <rect x="70" y="150" width="2" height="70" fill="#DC2626"/><rect x="62" y="152" width="14" height="58" fill="#DC2626" rx="1"/>
  <rect x="104" y="200" width="2" height="70" fill="#DC2626"/><rect x="96" y="206" width="14" height="56" fill="#DC2626" rx="1"/>
  <rect x="152" y="130" width="2" height="200" fill="#16A34A"/><rect x="144" y="150" width="14" height="170" fill="#16A34A" rx="1"/>
  <text x="44" y="366" font-size="10.5" fill="#374151">+ Điểm trigger chính xác, dễ đặt alert</text>
  <text x="44" y="384" font-size="10.5" fill="#374151">− Bản thân không phải vùng để "chờ phản ứng"</text>

  <rect x="391" y="70" width="345" height="340" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="407" y="96" font-size="12.5" font-weight="700" fill="#B45309">Order Block — ZONE (dải)</text>
  <rect x="411" y="140" width="306" height="46" fill="#F59E0B" opacity="0.18"/>
  <line x1="411" y1="140" x2="717" y2="140" stroke="#B45309" stroke-width="1.2"/>
  <line x1="411" y1="186" x2="717" y2="186" stroke="#B45309" stroke-width="1.2"/>
  <!-- CISD line inside OB -->
  <line x1="411" y1="163" x2="717" y2="163" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="8 4"/>
  <text x="470" y="132" font-size="10" font-weight="700" fill="#B45309">vùng OB (high–low nến gốc)</text>
  <text x="500" y="178" font-size="9.5" font-weight="700" fill="#0284C7">CISD level nằm TRONG OB</text>
  <rect x="440" y="200" width="2" height="70" fill="#16A34A"/><rect x="432" y="206" width="14" height="58" fill="#16A34A" rx="1"/>
  <circle cx="447" cy="163" r="7" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="407" y="360" font-size="11" font-weight="700" fill="#15803D">CONFLUENCE cao nhất:</text>
  <text x="407" y="380" font-size="10.5" fill="#374151">trigger sớm (CISD) + vùng entry đẹp (OB) trùng nhau</text>
</svg>
