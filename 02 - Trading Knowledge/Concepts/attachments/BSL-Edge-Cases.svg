<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case đắt giá: Data feed lệch + Double Sweep tin NFP</text>
  <text x="40" y="62" font-size="15" fill="#94a3b8">Hai bẫy khiến trader kinh nghiệm vẫn bị quét stop khi trade quanh BSL</text>

  <!-- Panel A: broker feed vs CME feed -->
  <rect x="40" y="90" width="540" height="300" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="60" y="118" font-size="17" font-weight="bold" fill="#e2e8f0">A. CFD broker feed vs CME futures feed</text>

  <text x="60" y="150" font-size="14" fill="#94a3b8">Broker CFD (giờ server GMT+2/3)</text>
  <line x1="60" y1="220" x2="560" y2="220" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="565" y="224" font-size="12" fill="#eab308">EQH broker = 18,255.0</text>
  <line x1="150" y1="300" x2="150" y2="200" stroke="#f97316" stroke-width="2.5"/>
  <rect x="140" y="205" width="20" height="60" fill="#f97316"/>
  <text x="90" y="330" font-size="12" fill="#f97316">Wick vượt 18,257 (sweep trên broker)</text>

  <text x="60" y="365" font-size="14" fill="#94a3b8">CME futures feed (giờ Chicago, session khác)</text>

  <rect x="40" y="400" width="540" height="130" fill="#1e293b" stroke="#334155" rx="8"/>
  <line x1="60" y1="470" x2="540" y2="470" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="545" y="474" font-size="12" fill="#eab308">EQH CME = 18,251.0</text>
  <line x1="150" y1="510" x2="150" y2="460" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="140" y="465" width="20" height="30" fill="#94a3b8"/>
  <text x="90" y="425" font-size="13" fill="#e2e8f0">CME: giá KHÔNG chạm 18,251 → không có sweep trên feed thật</text>
  <text x="60" y="530" font-size="12" fill="#ef4444">→ Trader dùng broker CFD Short "sau sweep" nhưng NQ future chưa hề quét EQH thật</text>

  <!-- Panel B: NFP double sweep -->
  <rect x="620" y="90" width="540" height="440" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="640" y="118" font-size="17" font-weight="bold" fill="#e2e8f0">B. Double Sweep quanh nến tin NFP 08:30 EST</text>

  <line x1="640" y1="260" x2="1140" y2="260" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="1000" y="255" font-size="12" fill="#eab308">EQH 1.0975</text>

  <!-- first sweep pre-NFP -->
  <line x1="700" y1="360" x2="700" y2="250" stroke="#f97316" stroke-width="2.5"/>
  <rect x="690" y="255" width="20" height="80" fill="#f97316"/>
  <text x="660" y="390" font-size="12" fill="#f97316">Sweep #1</text>
  <text x="655" y="408" font-size="11" fill="#94a3b8">08:29 (pre-tin)</text>

  <!-- fake MSS then NFP spike sweeps again -->
  <line x1="760" y1="330" x2="820" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="825" y="335" font-size="11" fill="#94a3b8">MSS giả</text>

  <line x1="880" y1="380" x2="880" y2="180" stroke="#ef4444" stroke-width="3"/>
  <rect x="866" y="200" width="28" height="140" fill="#ef4444"/>
  <text x="905" y="200" font-size="12" fill="#ef4444">Sweep #2: nến NFP</text>
  <text x="905" y="218" font-size="11" fill="#ef4444">gap through stop!</text>
  <text x="905" y="236" font-size="11" fill="#94a3b8">08:30:00-05 slippage</text>

  <rect x="640" y="450" width="500" height="60" fill="#0f1420" stroke="#ef4444" rx="6"/>
  <text x="655" y="472" font-size="13" fill="#e2e8f0">Stop đặt trên Sweep #1 (đỉnh sweep đầu) bị nến NFP</text>
  <text x="655" y="492" font-size="13" fill="#e2e8f0">nuốt luôn bằng GAP — không kịp khớp đúng giá stop</text>

  <text x="640" y="550" font-size="14" fill="#e2e8f0" font-weight="bold">Cách nhận diện sớm:</text>
  <text x="640" y="574" font-size="13" fill="#94a3b8">• Lịch tin đỏ trong 15 phút tới trùng vùng BSL</text>
  <text x="640" y="596" font-size="13" fill="#94a3b8">• Sweep #1 xảy ra quá sát giờ tin (dưới 5 phút)</text>
  <text x="640" y="618" font-size="14" fill="#e2e8f0" font-weight="bold">Cách xử lý:</text>
  <text x="640" y="642" font-size="13" fill="#94a3b8">• Không trade sweep trong ±15 phút quanh NFP/FOMC/CPI</text>
  <text x="640" y="664" font-size="13" fill="#94a3b8">• Nếu đã vào: dời stop ra xa hơn 1.5x ATR hoặc thoát trước tin</text>

  <text x="40" y="560" font-size="14" fill="#e2e8f0" font-weight="bold">Cách xử lý (Panel A):</text>
  <text x="40" y="584" font-size="13" fill="#94a3b8">• Luôn đối chiếu mức EQH trên ít nhất 2 nguồn feed (broker + TradingView CME)</text>
  <text x="40" y="606" font-size="13" fill="#94a3b8">• Chỉ tin sweep khi cả hai feed đồng thuận, hoặc ưu tiên feed futures gốc cho NQ/ES</text>
  <text x="40" y="628" font-size="13" fill="#94a3b8">• Với FX: so broker MT4/5 server time vs ICE/EBS spot để tránh lệch giờ nến D1</text>
</svg>
