<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: NQ — "Asia tạo, London quét, NY giao" thành công</text>
  <text x="40" y="62" font-size="15" fill="#94a3b8">Thứ Tư 22/05, chuỗi tiêu thụ pool đúng thứ tự — Long 3.4R</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="40" y1="120" x2="1160" y2="120"/>
    <line x1="40" y1="220" x2="1160" y2="220"/>
    <line x1="40" y1="320" x2="1160" y2="320"/>
    <line x1="40" y1="420" x2="1160" y2="420"/>
    <line x1="40" y1="520" x2="1160" y2="520"/>
  </g>

  <!-- Asia range box -->
  <rect x="80" y="280" width="200" height="80" fill="#1e293b" stroke="#334155" opacity="0.8"/>
  <text x="90" y="275" font-size="13" fill="#94a3b8">Asia Range 19:00-02:00</text>
  <line x1="80" y1="280" x2="280" y2="280" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="80" y1="360" x2="280" y2="360" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="285" y="285" font-size="12" fill="#eab308">Asia High 18,320</text>
  <text x="285" y="365" font-size="12" fill="#eab308">Asia Low 18,275</text>

  <!-- London judas sweep low -->
  <line x1="330" y1="380" x2="330" y2="260" stroke="#22c55e" stroke-width="2"/>
  <rect x="318" y="300" width="24" height="70" fill="#22c55e"/>
  <line x1="380" y1="370" x2="380" y2="240" stroke="#f97316" stroke-width="3"/>
  <rect x="368" y="330" width="24" height="90" fill="#f97316"/>
  <text x="330" y="400" font-size="12" fill="#f97316">02:20 London sweep Asia Low → 18,268</text>

  <!-- reclaim + bullish displacement -->
  <line x1="440" y1="360" x2="440" y2="230" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="428" y="240" width="24" height="110" fill="#22c55e"/>
  <text x="460" y="245" font-size="12" fill="#22c55e">02:35 reclaim + displacement lên</text>

  <!-- MSS -->
  <line x1="280" y1="300" x2="500" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="505" y="305" font-size="12" fill="#94a3b8">STL nội bộ</text>
  <polygon points="440,270 425,295 455,295" fill="#22c55e"/>
  <text x="460" y="290" font-size="12" fill="#22c55e">MSS tăng</text>

  <!-- entry at FVG retrace -->
  <line x1="520" y1="260" x2="520" y2="310" stroke="#38bdf8" stroke-width="2"/>
  <rect x="508" y="260" width="24" height="30" fill="#38bdf8" opacity="0.8"/>
  <circle cx="520" cy="290" r="6" fill="#38bdf8"/>
  <text x="540" y="270" font-size="12" fill="#38bdf8">08:05 Entry Long 18,298 (FVG NY open)</text>

  <!-- London high liquidity taken en route -->
  <line x1="600" y1="240" x2="1080" y2="240" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1000" y="235" font-size="12" fill="#eab308">London High 18,320 (BSL waypoint)</text>
  <line x1="650" y1="260" x2="650" y2="200" stroke="#22c55e" stroke-width="2"/>
  <rect x="638" y="205" width="24" height="55" fill="#22c55e"/>
  <text x="660" y="205" font-size="11" fill="#94a3b8">09:10 tiêu thụ London High tiện đường</text>

  <!-- continuation up to PDH target -->
  <g>
    <line x1="750" y1="230" x2="750" y2="170" stroke="#22c55e" stroke-width="2"/>
    <rect x="738" y="180" width="24" height="50" fill="#22c55e"/>
    <line x1="850" y1="200" x2="850" y2="140" stroke="#22c55e" stroke-width="2"/>
    <rect x="838" y="150" width="24" height="50" fill="#22c55e"/>
  </g>

  <!-- target PDH -->
  <line x1="600" y1="130" x2="1080" y2="130" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="900" y="125" font-size="13" fill="#a78bfa">TP: PDH 18,360</text>

  <!-- stop -->
  <line x1="280" y1="345" x2="600" y2="345" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="605" y="350" font-size="12" fill="#ef4444">SL 18,265 (dưới điểm sweep)</text>

  <!-- summary box -->
  <rect x="850" y="330" width="300" height="180" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="870" y="358" font-size="16" font-weight="bold" fill="#e2e8f0">Kết quả</text>
  <text x="870" y="384" font-size="13" fill="#e2e8f0">Entry: 18,298 (08:05)</text>
  <text x="870" y="406" font-size="13" fill="#ef4444">SL: 18,265 (33 pt = 660 USD/lot)</text>
  <text x="870" y="428" font-size="13" fill="#a78bfa">TP: 18,360 (62 pt = 1,240 USD/lot)</text>
  <text x="870" y="450" font-size="13" fill="#22c55e">R:R ≈ 1.9R (chốt sớm 1 phần tại 3.4R</text>
  <text x="870" y="470" font-size="12" fill="#94a3b8">trailing runner theo cấu trúc M15)</text>

  <!-- timeline -->
  <g font-size="12" fill="#e2e8f0">
    <text x="80" y="600">1. Asia range 18,275-18,320 (19:00-02:00)</text>
    <text x="80" y="620">2. 02:20 London Judas sweep Asia Low → 18,268</text>
    <text x="480" y="600">3. 02:35 reclaim + displacement → MSS tăng</text>
    <text x="480" y="620">4. 08:05 NY entry Long tại FVG 18,298</text>
    <text x="850" y="600">5. 09:10 tiêu thụ London High (waypoint)</text>
    <text x="850" y="620">6. TP PDH 18,360 → 3.4R runner</text>
  </g>
</svg>
