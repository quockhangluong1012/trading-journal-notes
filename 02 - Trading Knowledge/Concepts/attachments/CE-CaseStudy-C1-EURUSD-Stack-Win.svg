  <text x="640" y="720" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem EC-C2 - quy tắc ưu tiên OB khi CE stack lệch nhau dưới 10 tick</text>
