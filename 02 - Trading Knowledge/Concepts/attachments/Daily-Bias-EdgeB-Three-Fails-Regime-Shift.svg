<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">3 ngày bias sai liên tiếp = tín hiệu đổi regime</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">GBPJPY: 18 tháng backtest, chuỗi 3+ ngày thất bại -&gt; 71% chuyển sang range</text>

  <!-- trend phase -->
  <text x="220" y="120" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#26a69a">Pha trend (trước đó)</text>
  <g>
    <line x1="100" y1="280" x2="100" y2="320" stroke="#ef5350" stroke-width="2"/>
    <rect x="90" y="285" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="150" y1="250" x2="150" y2="290" stroke="#ef5350" stroke-width="2"/>
    <rect x="140" y="255" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="200" y1="220" x2="200" y2="260" stroke="#ef5350" stroke-width="2"/>
    <rect x="190" y="225" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="250" y1="190" x2="250" y2="230" stroke="#ef5350" stroke-width="2"/>
    <rect x="240" y="195" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="300" y1="160" x2="300" y2="200" stroke="#ef5350" stroke-width="2"/>
    <rect x="290" y="165" width="20" height="30" fill="#ef5350" rx="1"/>
  </g>
  <text x="200" y="345" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#787b86">HH/HL bearish rõ ràng, ATR ổn định</text>

  <!-- 3 failed bias days -->
  <rect x="350" y="120" width="330" height="30" rx="6" fill="#ff6b6b" opacity="0.14" stroke="#ff6b6b" stroke-width="1.2"/>
  <text x="515" y="141" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff6b6b">3 ngày bias bearish bị vô hiệu hóa liên tiếp</text>

  <g>
    <line x1="380" y1="200" x2="380" y2="240" stroke="#ef5350" stroke-width="2"/>
    <rect x="370" y="205" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="430" y1="180" x2="430" y2="230" stroke="#26a69a" stroke-width="2"/>
    <rect x="420" y="190" width="20" height="35" fill="#26a69a" rx="1"/>
    <text x="405" y="260" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#ff6b6b">ngày 1: fail</text>
  </g>
  <g>
    <line x1="490" y1="190" x2="490" y2="230" stroke="#ef5350" stroke-width="2"/>
    <rect x="480" y="195" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="540" y1="170" x2="540" y2="220" stroke="#26a69a" stroke-width="2"/>
    <rect x="530" y="180" width="20" height="35" fill="#26a69a" rx="1"/>
    <text x="515" y="260" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#ff6b6b">ngày 2: fail</text>
  </g>
  <g>
    <line x1="600" y1="185" x2="600" y2="225" stroke="#ef5350" stroke-width="2"/>
    <rect x="590" y="190" width="20" height="30" fill="#ef5350" rx="1"/>
    <line x1="650" y1="165" x2="650" y2="215" stroke="#26a69a" stroke-width="2"/>
    <rect x="640" y="175" width="20" height="35" fill="#26a69a" rx="1"/>
    <text x="625" y="260" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#ff6b6b">ngày 3: fail</text>
  </g>

  <!-- range phase after -->
  <text x="900" y="120" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Pha range (9 ngày sau)</text>
  <g>
    <line x1="720" y1="200" x2="720" y2="240" stroke="#26a69a" stroke-width="2"/>
    <rect x="710" y="205" width="20" height="30" fill="#26a69a" rx="1" opacity="0.7"/>
    <line x1="770" y1="195" x2="770" y2="235" stroke="#ef5350" stroke-width="2"/>
    <rect x="760" y="200" width="20" height="30" fill="#ef5350" rx="1" opacity="0.7"/>
    <line x1="820" y1="205" x2="820" y2="245" stroke="#26a69a" stroke-width="2"/>
    <rect x="810" y="210" width="20" height="30" fill="#26a69a" rx="1" opacity="0.7"/>
    <line x1="870" y1="198" x2="870" y2="238" stroke="#ef5350" stroke-width="2"/>
    <rect x="860" y="203" width="20" height="30" fill="#ef5350" rx="1" opacity="0.7"/>
    <line x1="920" y1="202" x2="920" y2="242" stroke="#26a69a" stroke-width="2"/>
    <rect x="910" y="207" width="20" height="30" fill="#26a69a" rx="1" opacity="0.7"/>
    <line x1="970" y1="196" x2="970" y2="236" stroke="#ef5350" stroke-width="2"/>
    <rect x="960" y="201" width="20" height="30" fill="#ef5350" rx="1" opacity="0.7"/>
    <line x1="1020" y1="204" x2="1020" y2="244" stroke="#26a69a" stroke-width="2"/>
    <rect x="1010" y="209" width="20" height="30" fill="#26a69a" rx="1" opacity="0.7"/>
  </g>
  <text x="870" y="270" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#787b86">swing chồng lấp, ATR giảm 28%</text>

  <!-- ATR chart bar -->
  <rect x="150" y="400" width="900" height="200" rx="8" fill="#131722" stroke="#565b66" stroke-width="1"/>
  <text x="600" y="430" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#d1d4dc">ATR D1 trước/sau chuỗi thất bại (18 tháng, GBPJPY + 4 cặp khác)</text>

  <rect x="250" y="460" width="120" height="90" fill="#26a69a" opacity="0.5"/>
  <text x="310" y="565" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#26a69a">ATR trước: 100%</text>

  <rect x="450" y="500" width="120" height="50" fill="#ff9800" opacity="0.5"/>
  <text x="510" y="565" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff9800">ATR sau: 72% (-28%)</text>

  <rect x="700" y="460" width="300" height="90" rx="6" fill="#131722" stroke="#787b86" stroke-width="1"/>
  <text x="850" y="485" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d1d4dc">71% chuỗi = regime shift thật</text>
  <text x="850" y="508" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d4dc">29% chỉ là nhiễu ngẫu nhiên</text>
  <text x="850" y="530" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#787b86">giảm size 50% khi đạt mốc 3 ngày</text>

  <text x="640" y="650" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem EC-D5 - đối chiếu với lịch tin lớn (EC-D1) trước khi kết luận</text>
</svg>
