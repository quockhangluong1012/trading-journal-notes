<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#d1d4dc">Đo body vs wick trên XAUUSD chênh lớn hơn hẳn so với FX</text>
<text x="40" y="70" font-size="15" fill="#787b86">Cùng phương pháp CBDR, biên độ sai khác giữa hai cách đo tỉ lệ với volatility instrument</text>

<line x1="640" y1="95" x2="640" y2="660" stroke="#2a2e39" stroke-width="2"/>

<rect x="55" y="100" width="180" height="30" rx="6" fill="#4a90d9" opacity="0.18" stroke="#4a90d9"/>
<text x="145" y="120" font-size="14" fill="#4a90d9" text-anchor="middle">EURUSD (FX)</text>

<!-- body range box -->
<rect x="80" y="330" width="480" height="30" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-dasharray="6 4"/>
<text x="90" y="323" font-size="12" fill="#26a69a">Range theo BODY: 38 pip</text>
<!-- wick range box slightly larger -->
<rect x="80" y="300" width="480" height="90" fill="#f2c94c" opacity="0.10" stroke="#f2c94c" stroke-dasharray="6 4"/>
<text x="90" y="410" font-size="12" fill="#f2c94c">Range theo WICK: 44 pip (+16%)</text>

<g>
<line x1="130" y1="310" x2="130" y2="375" stroke="#26a69a" stroke-width="1.8"/>
<rect x="118" y="325" width="24" height="35" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="180" y1="305" x2="180" y2="380" stroke="#ef5350" stroke-width="1.8"/>
<rect x="168" y="330" width="24" height="35" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="230" y1="308" x2="230" y2="372" stroke="#26a69a" stroke-width="1.8"/>
<rect x="218" y="328" width="24" height="30" fill="#26a69a" rx="1"/>
</g>

<text x="80" y="450" font-size="13" fill="#d1d4dc">Chênh lệch body/wick: ~16%</text>
<text x="80" y="470" font-size="13" fill="#d1d4dc">SD1 body=38pip vs SD1 wick=44pip — lệch nhưng vẫn</text>
<text x="80" y="490" font-size="13" fill="#d1d4dc">trong biên chấp nhận được để cả hai cách đo còn dùng tạm ổn</text>

<rect x="695" y="100" width="180" height="30" rx="6" fill="#ff9800" opacity="0.18" stroke="#ff9800"/>
<text x="785" y="120" font-size="14" fill="#ff9800" text-anchor="middle">XAUUSD (Gold)</text>

<rect x="720" y="330" width="480" height="30" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-dasharray="6 4"/>
<text x="730" y="323" font-size="12" fill="#26a69a">Range theo BODY: $6.80</text>
<rect x="720" y="240" width="480" height="120" fill="#f2c94c" opacity="0.10" stroke="#f2c94c" stroke-dasharray="6 4"/>
<text x="730" y="415" font-size="12" fill="#f2c94c">Range theo WICK: $10.40 (+53%)</text>

<g>
<line x1="770" y1="250" x2="770" y2="375" stroke="#26a69a" stroke-width="1.8"/>
<rect x="756" y="290" width="28" height="55" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="830" y1="245" x2="830" y2="385" stroke="#ef5350" stroke-width="1.8"/>
<rect x="816" y="300" width="28" height="55" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="890" y1="255" x2="890" y2="370" stroke="#26a69a" stroke-width="1.8"/>
<rect x="876" y="295" width="28" height="45" fill="#26a69a" rx="1"/>
</g>

<text x="720" y="450" font-size="13" fill="#d1d4dc">Chênh lệch body/wick: ~53% — gấp hơn 3 lần FX</text>
<text x="720" y="470" font-size="13" fill="#ff6b6b">SD1 wick projection lệch xa khỏi SD1 body, hai bộ target</text>
<text x="720" y="490" font-size="13" fill="#ff6b6b">gần như không dùng thay thế nhau được trên gold</text>

<line x1="60" y1="540" x2="1220" y2="540" stroke="#2a2e39"/>
<text x="60" y="568" font-size="14" fill="#f2c94c">Cơ chế: spread/liquidity provider quote gold có đuôi bóng nến dài hơn tỉ lệ thuận với volatility cao hơn 3-5 lần FX major.</text>
<text x="60" y="592" font-size="14" fill="#d1d4dc">Rule: trên XAUUSD, chọn MỘT cách đo (khuyến nghị body) và neo cứng — không đổi qua lại giữa body/wick giữa các phiên, vì sai lệch đủ lớn để đổi hẳn vị trí +1/+2 SD.</text>
<text x="60" y="616" font-size="13" fill="#787b86">Backtest 40 phiên XAUUSD: body/wick range ratio trung bình 1.53, so với 1.16 trên EURUSD cùng giai đoạn.</text>
</svg>
