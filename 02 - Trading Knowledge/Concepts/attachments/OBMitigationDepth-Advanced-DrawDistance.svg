<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="obdraw1" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#15803D"/></marker>
    <marker id="obdraw2" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B45309"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Độ sâu mitigation tỷ lệ với khoảng cách tới draw target còn lại</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Nguyên nhân gốc thứ 4: target XA → shallow tap rồi bốc đi; target GẦN → mitigation sâu, chậm, dễ full</text>

  <!-- LEFT panel: target far -->
  <rect x="24" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="94" font-size="13" font-weight="700" fill="#15803D">① Draw target CÒN XA (urgency cao)</text>

  <!-- distant BSL target near top -->
  <line x1="44" y1="120" x2="352" y2="120" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="48" y="115" font-size="9" font-weight="700" fill="#374151">Draw target (BSL) — RẤT XA phía trên</text>

  <!-- OB zone lower -->
  <rect x="44" y="290" width="308" height="80" fill="#16A34A" opacity="0.12"/>
  <text x="48" y="286" font-size="8.5" fill="#6B7280">proximal</text>
  <line x1="44" y1="330" x2="352" y2="330" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="310" y="326" font-size="8.5" font-weight="700" fill="#1D4ED8">CE</text>
  <text x="48" y="382" font-size="8.5" fill="#6B7280">distal</text>

  <!-- price: shallow tap then long arrow far up -->
  <path d="M70,240 L110,270 L150,305" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="150" cy="305" r="6" fill="none" stroke="#15803D" stroke-width="2.2"/>
  <text x="158" y="318" font-size="9" font-weight="700" fill="#166534">shallow tap</text>
  <path d="M150,305 L200,230 L260,160 L300,122" fill="none" stroke="#15803D" stroke-width="2.6" marker-end="url(#obdraw1)"/>
  <text x="215" y="205" font-size="9.5" font-weight="700" fill="#15803D" transform="rotate(-38 215 205)">bốc đi ngay, đi lấy thanh khoản xa</text>

  <rect x="36" y="392" width="308" height="24" rx="5" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="1"/>
  <text x="44" y="408" font-size="9.5" fill="#166534">Kỳ vọng SHALLOW · entry aggressive tại nested FVG</text>

  <!-- RIGHT panel: target near -->
  <rect x="392" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="404" y="94" font-size="13" font-weight="700" fill="#B45309">② Draw target ĐÃ GẦN / gần cạn</text>

  <!-- near target line just above OB -->
  <line x1="412" y1="220" x2="720" y2="220" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="416" y="215" font-size="9" font-weight="700" fill="#374151">Draw target — chỉ còn GẦN phía trên</text>

  <!-- OB zone -->
  <rect x="412" y="290" width="308" height="80" fill="#16A34A" opacity="0.12"/>
  <text x="416" y="286" font-size="8.5" fill="#6B7280">proximal</text>
  <line x1="412" y1="330" x2="720" y2="330" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="678" y="326" font-size="8.5" font-weight="700" fill="#1D4ED8">CE</text>
  <text x="416" y="382" font-size="8.5" fill="#6B7280">distal</text>

  <!-- price: deep/full mitigation then short arrow to near target -->
  <path d="M438,244 L478,280 L520,320 L558,365" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="558" cy="365" r="6" fill="none" stroke="#B45309" stroke-width="2.2"/>
  <text x="566" y="378" font-size="9" font-weight="700" fill="#92400E">full mitigation (sát distal)</text>
  <path d="M558,365 L600,300 L640,238" fill="none" stroke="#B45309" stroke-width="2.6" marker-end="url(#obdraw2)"/>
  <text x="612" y="292" font-size="9.5" font-weight="700" fill="#B45309" transform="rotate(-52 612 292)">chậm, dễ hỏng</text>

  <rect x="404" y="392" width="308" height="24" rx="5" fill="#B45309" opacity="0.08" stroke="#B45309" stroke-width="1"/>
  <text x="412" y="408" font-size="9.5" fill="#92400E">Kỳ vọng SÂU · chờ full + xác nhận · hạ kỳ vọng R</text>

  <text x="40" y="446" font-size="10.5" fill="#6B7280" font-style="italic">Đọc "còn bao xa tới draw" như một biến dự đoán độ sâu: target xa → nông; target gần cạn → sâu &amp; kém tin cậy.</text>
</svg>
