<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <!-- Grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="210" x2="960" y2="210"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="330" x2="960" y2="330"/>
    <line x1="0" y1="390" x2="960" y2="390"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="60" x2="160" y2="500"/>
    <line x1="480" y1="60" x2="480" y2="500"/>
    <line x1="720" y1="60" x2="720" y2="500"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Co che Order Book: vi sao gia phai di tim doi ung</text>

  <!-- Left panel: order book depth before -->
  <text x="30" y="75" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Truoc: so lenh mong dan phia tren gia</text>
  <g>
    <rect x="30" y="95" width="200" height="14" fill="rgba(239,83,80,0.25)"/>
    <rect x="30" y="112" width="140" height="14" fill="rgba(239,83,80,0.25)"/>
    <rect x="30" y="129" width="90" height="14" fill="rgba(239,83,80,0.25)"/>
    <text x="240" y="106" font-family="Arial, sans-serif" font-size="13" fill="#ef5350">Ask (ban) mong dan</text>
  </g>
  <line x1="30" y1="150" x2="330" y2="150" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="240" y="146" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Gia hien tai</text>
  <g>
    <rect x="30" y="152" width="60" height="14" fill="rgba(38,166,154,0.25)"/>
    <rect x="30" y="169" width="80" height="14" fill="rgba(38,166,154,0.25)"/>
  </g>

  <!-- Candles NQ leg down -->
  <g>
    <line x1="380" y1="180" x2="380" y2="330" stroke="#ef5350" stroke-width="1"/>
    <rect x="370" y="195" width="20" height="45" fill="#ef5350"/>
    <line x1="420" y1="200" x2="420" y2="345" stroke="#ef5350" stroke-width="1"/>
    <rect x="410" y="215" width="20" height="55" fill="#ef5350"/>
    <line x1="460" y1="230" x2="460" y2="365" stroke="#ef5350" stroke-width="1"/>
    <rect x="450" y="250" width="20" height="55" fill="#ef5350"/>
  </g>

  <!-- SSL line -->
  <line x1="160" y1="350" x2="640" y2="350" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="645" y="354" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">SSL (dinh/day cu)</text>

  <!-- sweep wick below SSL -->
  <line x1="500" y1="280" x2="500" y2="400" stroke="#ef5350" stroke-width="1"/>
  <rect x="490" y="300" width="20" height="45" fill="#ef5350"/>
  <text x="470" y="415" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Sweep</text>

  <!-- stop cascade arrows -->
  <g stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 520 360 L 560 360"/>
    <path d="M 520 375 L 560 375"/>
    <path d="M 520 390 L 560 390"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="565" y="358" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Stop-loss ban</text>
  <text x="565" y="373" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Breakout ban</text>
  <text x="565" y="388" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">FOMO ban</text>

  <!-- reversal candles -->
  <g>
    <line x1="620" y1="270" x2="620" y2="330" stroke="#26a69a" stroke-width="1"/>
    <rect x="610" y="275" width="20" height="45" fill="#26a69a"/>
    <line x1="660" y1="200" x2="660" y2="290" stroke="#26a69a" stroke-width="1"/>
    <rect x="650" y="205" width="20" height="65" fill="#26a69a"/>
  </g>
  <text x="600" y="185" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Reclaim = SM da mua xong</text>

  <!-- FVG zone -->
  <rect x="605" y="210" width="80" height="55" fill="rgba(41,98,255,0.25)"/>
  <text x="695" y="240" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">FVG</text>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">
    <rect x="30" y="480" width="14" height="14" fill="rgba(239,83,80,0.25)"/>
    <text x="50" y="491">Sell orders / Ask</text>
    <rect x="220" y="480" width="14" height="14" fill="rgba(38,166,154,0.25)"/>
    <text x="240" y="491">Buy orders / Bid</text>
    <rect x="420" y="480" width="14" height="14" fill="rgba(41,98,255,0.25)"/>
    <text x="440" y="491">FVG</text>
    <line x1="560" y1="487" x2="590" y2="487" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="595" y="491">Liquidity pool</text>
  </g>
</svg>
