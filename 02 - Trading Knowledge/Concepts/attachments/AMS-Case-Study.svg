<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="720" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: XAUUSD — Sweep LTL thật → Long theo đúng degree</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Thứ Năm, sau FOMC — H4 bullish, LTL bị quét rồi reclaim, MSS Short Term xác nhận</text>

<!-- price grid -->
<line x1="40" y1="640" x2="1160" y2="640" stroke="#1c2333"/>
<text x="1090" y="130" font-size="13" fill="#94a3b8">2,432</text>
<text x="1090" y="330" font-size="13" fill="#94a3b8">2,408</text>
<text x="1090" y="560" font-size="13" fill="#94a3b8">2,391</text>

<!-- H4 downtrend prior to LTL -->
<rect x="90" y="200" width="18" height="60" fill="#ef4444"/><line x1="99" y1="185" x2="99" y2="280" stroke="#ef4444" stroke-width="2"/>
<rect x="120" y="260" width="18" height="70" fill="#ef4444"/><line x1="129" y1="245" x2="129" y2="350" stroke="#ef4444" stroke-width="2"/>
<rect x="150" y="340" width="18" height="80" fill="#ef4444"/><line x1="159" y1="325" x2="159" y2="440" stroke="#ef4444" stroke-width="2"/>
<rect x="180" y="410" width="18" height="60" fill="#22c55e"/><line x1="189" y1="395" x2="189" y2="480" stroke="#22c55e" stroke-width="2"/>
<rect x="210" y="440" width="18" height="55" fill="#ef4444"/><line x1="219" y1="425" x2="219" y2="500" stroke="#ef4444" stroke-width="2"/>

<!-- LTL formed here -->
<rect x="240" y="480" width="18" height="35" fill="#ef4444"/>
<line x1="249" y1="465" x2="249" y2="565" stroke="#f97316" stroke-width="3"/>
<text x="200" y="590" font-size="13" fill="#eab308" font-weight="bold">LTL @2,394 (protected low H4)</text>

<!-- reclaim + sweep -->
<circle cx="249" cy="560" r="8" fill="none" stroke="#f97316" stroke-width="2"/>
<text x="265" y="545" font-size="12" fill="#f97316">wick 2,391 → sweep SSL</text>

<!-- bullish reversal -->
<rect x="280" y="440" width="18" height="90" fill="#22c55e"/><line x1="289" y1="425" x2="289" y2="540" stroke="#22c55e" stroke-width="2"/>
<rect x="310" y="380" width="18" height="80" fill="#22c55e"/><line x1="319" y1="365" x2="319" y2="470" stroke="#22c55e" stroke-width="2"/>
<!-- internal STL then STH break = MSS short term -->
<rect x="340" y="410" width="18" height="30" fill="#ef4444"/><line x1="349" y1="395" x2="349" y2="450" stroke="#ef4444" stroke-width="2"/>
<text x="330" y="465" font-size="12" fill="#eab308">STL nội bộ</text>
<rect x="370" y="330" width="18" height="90" fill="#22c55e"/><line x1="379" y1="315" x2="379" y2="430" stroke="#22c55e" stroke-width="2"/>
<circle cx="379" cy="370" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="395" y="345" font-size="13" fill="#38bdf8" font-weight="bold">MSS Short Term (phá STH M15)</text>

<!-- entry marker -->
<rect x="400" y="290" width="90" height="34" fill="#1e293b" stroke="#38bdf8" rx="4"/>
<text x="410" y="312" font-size="13" fill="#38bdf8" font-weight="bold">ENTRY 2,412</text>
<line x1="490" y1="307" x2="600" y2="307" stroke="#38bdf8" stroke-dasharray="4,3"/>

<rect x="400" y="560" width="90" height="30" fill="#1e293b" stroke="#ef4444" rx="4"/>
<text x="408" y="580" font-size="13" fill="#ef4444" font-weight="bold">SL 2,390.5</text>
<line x1="490" y1="575" x2="1120" y2="575" stroke="#ef4444" stroke-dasharray="4,3"/>

<rect x="400" y="130" width="90" height="30" fill="#1e293b" stroke="#a78bfa" rx="4"/>
<text x="412" y="150" font-size="13" fill="#a78bfa" font-weight="bold">TP 2,431</text>
<line x1="490" y1="145" x2="1120" y2="145" stroke="#a78bfa" stroke-dasharray="4,3"/>

<!-- continuation candles to target -->
<rect x="610" y="270" width="18" height="70" fill="#22c55e"/><line x1="619" y1="255" x2="619" y2="360" stroke="#22c55e" stroke-width="2"/>
<rect x="640" y="220" width="18" height="60" fill="#22c55e"/><line x1="649" y1="205" x2="649" y2="290" stroke="#22c55e" stroke-width="2"/>
<rect x="670" y="180" width="18" height="50" fill="#22c55e"/><line x1="679" y1="165" x2="679" y2="240" stroke="#22c55e" stroke-width="2"/>
<rect x="700" y="150" width="18" height="35" fill="#22c55e"/><line x1="709" y1="135" x2="709" y2="195" stroke="#22c55e" stroke-width="2"/>

<!-- info box -->
<rect x="760" y="400" width="380" height="220" fill="#1e293b" stroke="#334155" rx="6"/>
<text x="780" y="425" font-size="15" fill="#e2e8f0" font-weight="bold">Kết quả bằng số</text>
<text x="780" y="450" font-size="13" fill="#94a3b8">Entry: 2,412.0 | SL: 2,390.5 (21.5 pt)</text>
<text x="780" y="470" font-size="13" fill="#94a3b8">TP: 2,431.0 (19.0 pt) → chốt 70% tại TP1</text>
<text x="780" y="490" font-size="13" fill="#94a3b8">Runner chốt 2,438 → blended +1.9R</text>
<text x="780" y="515" font-size="13" fill="#22c55e" font-weight="bold">R-multiple: +1.9R | Risk: 0.9% acc</text>
<text x="780" y="545" font-size="13" fill="#e2e8f0">Bài học: sweep LTL + reclaim + MSS Short</text>
<text x="780" y="565" font-size="13" fill="#e2e8f0">Term đồng hướng = xác nhận đủ 3 lớp degree</text>
<text x="780" y="585" font-size="13" fill="#e2e8f0">trước khi vào — không vào ngay tại wick.</text>
</svg>
