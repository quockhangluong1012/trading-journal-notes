<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="720" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case: Equal Lows "giấu" swing point thật</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">NQ M15 — chuỗi equal lows KHÔNG phải ITL, chỉ là bể liquidity engineered</text>

<line x1="40" y1="640" x2="1160" y2="640" stroke="#1c2333"/>
<!-- price axis labels -->
<text x="1080" y="120" font-size="13" fill="#94a3b8">18,340</text>
<text x="1080" y="560" font-size="13" fill="#94a3b8">18,180</text>

<!-- candles: downtrend into equal lows -->
<rect x="100" y="150" width="18" height="70" fill="#ef4444"/><line x1="109" y1="140" x2="109" y2="230" stroke="#ef4444" stroke-width="2"/>
<rect x="130" y="200" width="18" height="80" fill="#ef4444"/><line x1="139" y1="185" x2="139" y2="290" stroke="#ef4444" stroke-width="2"/>
<rect x="160" y="260" width="18" height="90" fill="#ef4444"/><line x1="169" y1="245" x2="169" y2="360" stroke="#ef4444" stroke-width="2"/>
<rect x="190" y="330" width="18" height="60" fill="#22c55e"/><line x1="199" y1="315" x2="199" y2="400" stroke="#22c55e" stroke-width="2"/>
<rect x="220" y="380" width="18" height="55" fill="#ef4444"/><line x1="229" y1="365" x2="229" y2="450" stroke="#ef4444" stroke-width="2"/>

<!-- equal low 1 -->
<rect x="250" y="440" width="18" height="30" fill="#ef4444"/><line x1="259" y1="425" x2="259" y2="480" stroke="#ef4444" stroke-width="2"/>
<text x="240" y="500" font-size="12" fill="#eab308">EQL-1</text>
<rect x="290" y="380" width="18" height="50" fill="#22c55e"/><line x1="299" y1="365" x2="299" y2="440" stroke="#22c55e" stroke-width="2"/>
<rect x="320" y="400" width="18" height="45" fill="#ef4444"/><line x1="329" y1="385" x2="329" y2="460" stroke="#ef4444" stroke-width="2"/>
<!-- equal low 2 -->
<rect x="350" y="440" width="18" height="30" fill="#ef4444"/><line x1="359" y1="425" x2="359" y2="480" stroke="#ef4444" stroke-width="2"/>
<text x="340" y="500" font-size="12" fill="#eab308">EQL-2</text>
<rect x="390" y="390" width="18" height="45" fill="#22c55e"/><line x1="399" y1="375" x2="399" y2="450" stroke="#22c55e" stroke-width="2"/>
<rect x="420" y="405" width="18" height="40" fill="#ef4444"/><line x1="429" y1="390" x2="429" y2="460" stroke="#ef4444" stroke-width="2"/>
<!-- equal low 3 (final sweep) -->
<rect x="450" y="440" width="18" height="35" fill="#ef4444"/>
<line x1="459" y1="425" x2="459" y2="520" stroke="#f97316" stroke-width="3"/>
<text x="435" y="540" font-size="12" fill="#f97316" font-weight="bold">SWEEP (wick xuyên)</text>

<!-- equal low dashed line -->
<line x1="230" y1="470" x2="470" y2="470" stroke="#eab308" stroke-dasharray="6,4" stroke-width="2"/>
<text x="480" y="475" font-size="13" fill="#eab308">EQL — liquidity engineered, KHÔNG phải ITL</text>

<!-- reversal after sweep -->
<rect x="490" y="360" width="18" height="90" fill="#22c55e"/><line x1="499" y1="345" x2="499" y2="470" stroke="#22c55e" stroke-width="2"/>
<rect x="520" y="300" width="18" height="80" fill="#22c55e"/><line x1="529" y1="285" x2="529" y2="390" stroke="#22c55e" stroke-width="2"/>
<rect x="550" y="250" width="18" height="70" fill="#22c55e"/><line x1="559" y1="235" x2="559" y2="330" stroke="#22c55e" stroke-width="2"/>
<!-- real swing formed after sweep -->
<rect x="580" y="220" width="18" height="40" fill="#ef4444"/><line x1="589" y1="205" x2="589" y2="270" stroke="#ef4444" stroke-width="2"/>
<rect x="610" y="180" width="18" height="60" fill="#22c55e"/><line x1="619" y1="165" x2="619" y2="250" stroke="#22c55e" stroke-width="2"/>
<circle cx="459" cy="470" r="7" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="620" y="230" font-size="13" fill="#38bdf8" font-weight="bold">STL thật hình thành SAU sweep</text>

<!-- annotation boxes -->
<rect x="700" y="140" width="440" height="230" fill="#1e293b" stroke="#334155" rx="6"/>
<text x="720" y="165" font-size="15" fill="#e2e8f0" font-weight="bold">Chuỗi lý luận sai của trader</text>
<text x="720" y="190" font-size="13" fill="#94a3b8">1. Thấy 3 đáy gần bằng → tưởng là "vùng hỗ trợ ITL"</text>
<text x="720" y="212" font-size="13" fill="#94a3b8">2. Long ngay tại EQL-3 kỳ vọng bounce như 2 lần trước</text>
<text x="720" y="234" font-size="13" fill="#94a3b8">3. Không nhận ra: mỗi lần "giữ" chỉ là chưa đủ</text>
<text x="720" y="253" font-size="13" fill="#94a3b8">   thanh khoản để algo kích hoạt sweep toàn bộ</text>
<text x="720" y="278" font-size="13" fill="#22c55e" font-weight="bold">Cách xử lý đúng:</text>
<text x="720" y="300" font-size="13" fill="#e2e8f0">- Đánh dấu EQL là TARGET liquidity, không phải swing</text>
<text x="720" y="322" font-size="13" fill="#e2e8f0">- Chờ wick sweep + displacement ngược mới chấm STL</text>
<text x="720" y="344" font-size="13" fill="#e2e8f0">- Entry sau khi swing THẬT hình thành, không tại EQL</text>

<rect x="700" y="390" width="440" height="90" fill="#1e293b" stroke="#334155" rx="6"/>
<text x="720" y="415" font-size="14" fill="#a78bfa" font-weight="bold">Số liệu thực chiến (NQ, backtest 40 setup equal-low)</text>
<text x="720" y="438" font-size="13" fill="#e2e8f0">68% các cụm ≥3 equal lows bị sweep sâu thêm ≥15 điểm</text>
<text x="720" y="458" font-size="13" fill="#e2e8f0">trước khi hình thành swing thật — trung bình mất 2.3R</text>
<text x="720" y="478" font-size="13" fill="#e2e8f0">nếu Long ngay tại lần chạm thứ 3.</text>
</svg>
