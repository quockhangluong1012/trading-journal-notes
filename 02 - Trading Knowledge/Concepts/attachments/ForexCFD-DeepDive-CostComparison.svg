<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc" text-anchor="middle">So sanh chi phi: ECN (commission) vs Market Maker (spread markup)</text>

  <!-- Grid lines -->
  <line x1="80" y1="460" x2="900" y2="460" stroke="#1e222d" stroke-width="2"/>
  <line x1="80" y1="90" x2="80" y2="460" stroke="#1e222d" stroke-width="2"/>

  <text x="60" y="465" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="end">0</text>
  <text x="30" y="270" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc" text-anchor="start" transform="rotate(-90 30 270)">Tong chi phi ($)</text>
  <text x="480" y="500" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc" text-anchor="middle">So luong lenh (tan suat giao dich)</text>

  <!-- ECN line: lower slope after intercept -->
  <polyline points="80,430 220,390 360,350 500,310 640,270 780,230 900,195"
            fill="none" stroke="#26a69a" stroke-width="3"/>
  <circle cx="900" cy="195" r="5" fill="#26a69a"/>
  <text x="905" y="190" font-family="Arial, sans-serif" font-size="14" fill="#26a69a" text-anchor="start">ECN (spread hep + commission)</text>

  <!-- Market Maker line: higher intercept, steeper -->
  <polyline points="80,400 220,340 360,280 500,220 640,160 780,110 830,90"
            fill="none" stroke="#ef5350" stroke-width="3"/>
  <circle cx="780" cy="110" r="5" fill="#ef5350"/>
  <text x="620" y="95" font-family="Arial, sans-serif" font-size="14" fill="#ef5350" text-anchor="start">Market Maker (spread markup)</text>

  <!-- Crossover marker -->
  <line x1="300" y1="90" x2="300" y2="460" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="305" y="105" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c" text-anchor="start">Vung giao nhau</text>
  <text x="305" y="122" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c" text-anchor="start">(tan suat trung binh)</text>

  <!-- Annotation boxes -->
  <rect x="90" y="330" width="190" height="70" rx="6" fill="rgba(41,98,255,0.18)" stroke="#2962ff" stroke-width="1.2"/>
  <text x="100" y="350" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">Scalp / tan suat cao:</text>
  <text x="100" y="368" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">ECN thuong re hon</text>
  <text x="100" y="386" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">nho commission co dinh</text>

  <rect x="560" y="150" width="220" height="70" rx="6" fill="rgba(255,152,0,0.18)" stroke="#ff9800" stroke-width="1.2"/>
  <text x="570" y="170" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">Tan suat rat cao:</text>
  <text x="570" y="188" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">chenh lech chi phi MM</text>
  <text x="570" y="206" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">tich luy rat lon</text>

  <!-- Legend -->
  <rect x="80" y="500" width="16" height="4" fill="#26a69a"/>
  <text x="102" y="507" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">ECN: spread hep, commission co dinh moi lot</text>

  <rect x="500" y="500" width="16" height="4" fill="#ef5350"/>
  <text x="522" y="507" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Market Maker: spread rong, khong commission rieng</text>
</svg>
