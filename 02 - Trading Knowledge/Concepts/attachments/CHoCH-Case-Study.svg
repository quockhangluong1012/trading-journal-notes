<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="720" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: GBPUSD — CHoCH bearish thắng đúng sách sau sweep PDH + MSS xác nhận</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">H1, thứ Tư sau London open — sweep equal highs, CHoCH, chờ MSS "yellow to green light" mới entry</text>

<line x1="40" y1="640" x2="1160" y2="640" stroke="#1c2333"/>
<text x="1090" y="150" font-size="13" fill="#94a3b8">1.2745</text>
<text x="1090" y="560" font-size="13" fill="#94a3b8">1.2660</text>

<!-- prior uptrend into equal highs -->
<rect x="90" y="380" width="16" height="45" fill="#22c55e"/><line x1="98" y1="365" x2="98" y2="440" stroke="#22c55e" stroke-width="2"/>
<rect x="115" y="350" width="16" height="45" fill="#22c55e"/><line x1="123" y1="335" x2="123" y2="410" stroke="#22c55e" stroke-width="2"/>
<rect x="145" y="330" width="16" height="35" fill="#22c55e"/><line x1="153" y1="315" x2="153" y2="380" stroke="#22c55e" stroke-width="2"/>
<line x1="70" y1="330" x2="330" y2="330" stroke="#eab308" stroke-dasharray="6,4"/>
<text x="180" y="325" font-size="12" fill="#eab308">equal highs 1.2728 (2 lần chạm)</text>

<!-- sweep candle -->
<rect x="200" y="300" width="18" height="30" fill="#22c55e"/>
<line x1="209" y1="270" x2="209" y2="345" stroke="#22c55e" stroke-width="2"/>
<rect x="230" y="270" width="200" height="60" fill="#f97316" opacity="0.15" stroke="#f97316" stroke-dasharray="4,3"/>
<text x="235" y="260" font-size="12" fill="#f97316" font-weight="bold">1. Sweep 1.2733 (quét equal highs)</text>

<!-- reversal into HL breach = CHoCH -->
<rect x="260" y="340" width="16" height="35" fill="#ef4444"/><line x1="268" y1="325" x2="268" y2="390" stroke="#ef4444" stroke-width="2"/>
<line x1="70" y1="400" x2="600" y2="400" stroke="#eab308" stroke-dasharray="6,4"/>
<text x="450" y="418" font-size="12" fill="#eab308">HL 1.2695 (bảo vệ trước đó)</text>
<rect x="290" y="395" width="20" height="90" fill="#ef4444"/>
<line x1="300" y1="380" x2="300" y2="500" stroke="#ef4444" stroke-width="3"/>
<text x="230" y="380" font-size="13" fill="#38bdf8" font-weight="bold">2. CHoCH: body close 1.2684 dưới HL</text>

<!-- MSS confirm second leg -->
<rect x="320" y="420" width="16" height="30" fill="#22c55e"/><line x1="328" y1="405" x2="328" y2="465" stroke="#22c55e" stroke-width="2"/>
<rect x="350" y="440" width="16" height="45" fill="#ef4444"/><line x1="358" y1="425" x2="358" y2="500" stroke="#ef4444" stroke-width="2"/>
<rect x="380" y="470" width="20" height="60" fill="#ef4444"/>
<line x1="390" y1="455" x2="390" y2="545" stroke="#ef4444" stroke-width="3"/>
<text x="330" y="545" font-size="13" fill="#a78bfa" font-weight="bold">3. MSS: phá HL thứ 2 → "green light"</text>

<!-- entry -->
<rect x="410" y="490" width="90" height="30" fill="#1e293b" stroke="#38bdf8" rx="4"/>
<text x="420" y="510" font-size="13" fill="#38bdf8" font-weight="bold">ENTRY 1.2668</text>
<line x1="500" y1="505" x2="1120" y2="505" stroke="#38bdf8" stroke-dasharray="4,3"/>

<rect x="410" y="540" width="90" height="30" fill="#1e293b" stroke="#ef4444" rx="4"/>
<text x="422" y="560" font-size="13" fill="#ef4444" font-weight="bold">SL 1.2702</text>
<line x1="500" y1="555" x2="1120" y2="555" stroke="#ef4444" stroke-dasharray="4,3"/>

<rect x="410" y="180" width="90" height="30" fill="#1e293b" stroke="#a78bfa" rx="4"/>
<text x="422" y="200" font-size="13" fill="#a78bfa" font-weight="bold">TP 1.2598</text>
<line x1="500" y1="195" x2="1120" y2="195" stroke="#a78bfa" stroke-dasharray="4,3"/>

<!-- continuation down -->
<rect x="510" y="470" width="16" height="50" fill="#ef4444"/><line x1="518" y1="455" x2="518" y2="530" stroke="#ef4444" stroke-width="2"/>
<rect x="540" y="420" width="16" height="55" fill="#ef4444"/><line x1="548" y1="405" x2="548" y2="485" stroke="#ef4444" stroke-width="2"/>
<rect x="570" y="360" width="16" height="65" fill="#ef4444"/><line x1="578" y1="345" x2="578" y2="435" stroke="#ef4444" stroke-width="2"/>
<rect x="600" y="290" width="16" height="75" fill="#ef4444"/><line x1="608" y1="275" x2="608" y2="375" stroke="#ef4444" stroke-width="2"/>
<rect x="630" y="220" width="16" height="75" fill="#ef4444"/><line x1="638" y1="205" x2="638" y2="305" stroke="#ef4444" stroke-width="2"/>

<!-- info box -->
<rect x="680" y="380" width="460" height="240" fill="#1e293b" stroke="#334155" rx="6"/>
<text x="700" y="408" font-size="15" fill="#e2e8f0" font-weight="bold">Diễn biến theo mốc giờ (GMT)</text>
<text x="700" y="432" font-size="13" fill="#94a3b8">08:15 — sweep equal highs 1.2733 (quét stop retail)</text>
<text x="700" y="452" font-size="13" fill="#94a3b8">08:40 — CHoCH: body close 1.2684, dưới HL 1.2695</text>
<text x="700" y="472" font-size="13" fill="#94a3b8">09:05 — yellow light, chờ MSS xác nhận thêm</text>
<text x="700" y="492" font-size="13" fill="#94a3b8">09:35 — MSS phá HL thứ 2 → green light, entry 1.2668</text>
<text x="700" y="512" font-size="13" fill="#94a3b8">SL 1.2702 (34 pip) | TP 1.2598 (70 pip)</text>
<text x="700" y="540" font-size="14" fill="#22c55e" font-weight="bold">R-multiple: +2.06R | Risk 1% tài khoản</text>
<text x="700" y="565" font-size="13" fill="#e2e8f0">Bài học: chờ MSS xác nhận sau CHoCH giảm entry sớm 1</text>
<text x="700" y="585" font-size="13" fill="#e2e8f0">nhịp nhưng loại bỏ rủi ro CHoCH đơn lẻ bị reclaim.</text>
</svg>
