<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Đếm nhầm degree: STL break bị đọc thành CHoCH ở ITL</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">XAUUSD H1 — continuation setup bị bỏ lỡ vì tưởng cấu trúc đã đổi</text>

  <line x1="40" y1="620" x2="1240" y2="620" stroke="#2a2e39" stroke-width="1"/>

  <!-- uptrend candles establishing ITH, ITL -->
  <g>
    <line x1="90" y1="380" x2="90" y2="480" stroke="#26a69a" stroke-width="1"/>
    <rect x="82" y="390" width="16" height="70" rx="1" fill="#26a69a"/>
    <line x1="130" y1="320" x2="130" y2="420" stroke="#26a69a" stroke-width="1"/>
    <rect x="122" y="330" width="16" height="70" rx="1" fill="#26a69a"/>
    <line x1="170" y1="260" x2="170" y2="360" stroke="#26a69a" stroke-width="1"/>
    <rect x="162" y="270" width="16" height="70" rx="1" fill="#26a69a"/>
    <text x="140" y="245" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">ITH trước (đã phá)</text>
  </g>

  <!-- pullback creating ITL (protected low, degree = Intermediate) -->
  <g>
    <line x1="210" y1="300" x2="210" y2="400" stroke="#ef5350" stroke-width="1"/>
    <rect x="202" y="310" width="16" height="70" rx="1" fill="#ef5350"/>
    <line x1="250" y1="340" x2="250" y2="440" stroke="#ef5350" stroke-width="1"/>
    <rect x="242" y="350" width="16" height="70" rx="1" fill="#ef5350"/>
  </g>
  <line x1="290" y1="360" x2="290" y2="460" stroke="#26a69a" stroke-width="1"/>
  <rect x="282" y="370" width="16" height="70" rx="1" fill="#26a69a"/>
  <text x="255" y="485" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">ITL thật (protected low)</text>
  <line x1="130" y1="470" x2="1240" y2="470" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1050" y="463" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">Protected Low (ITL)</text>

  <!-- resumption up then small pullback breaking only STL -->
  <g>
    <line x1="330" y1="300" x2="330" y2="400" stroke="#26a69a" stroke-width="1"/>
    <rect x="322" y="310" width="16" height="70" rx="1" fill="#26a69a"/>
    <line x1="370" y1="250" x2="370" y2="350" stroke="#26a69a" stroke-width="1"/>
    <rect x="362" y="260" width="16" height="70" rx="1" fill="#26a69a"/>
    <line x1="410" y1="210" x2="410" y2="310" stroke="#26a69a" stroke-width="1"/>
    <rect x="402" y="220" width="16" height="70" rx="1" fill="#26a69a"/>
  </g>

  <!-- small internal pullback: STL (minor), degree Short Term only -->
  <g>
    <line x1="450" y1="260" x2="450" y2="340" stroke="#ef5350" stroke-width="1"/>
    <rect x="442" y="270" width="16" height="55" rx="1" fill="#ef5350"/>
  </g>
  <line x1="470" y1="335" x2="700" y2="335" stroke="#b48ead" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="475" y="325" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#b48ead">STL nhỏ (minor pullback)</text>

  <line x1="490" y1="290" x2="490" y2="370" stroke="#ef5350" stroke-width="1"/>
  <rect x="482" y="300" width="16" height="55" rx="1" fill="#ef5350"/>
  <text x="440" y="395" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">Giá đóng nến xuyên qua đáy STL này</text>

  <!-- mislabel box -->
  <rect x="440" y="410" width="330" height="70" rx="8" fill="#ff6b6b" opacity="0.14" stroke="#ff6b6b" stroke-dasharray="6 4"/>
  <text x="455" y="435" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#ff6b6b">✗ Trader đọc: "phá đáy = CHoCH ITL"</text>
  <text x="455" y="457" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#ff6b6b">→ đóng Long, thậm chí lật Short</text>
  <text x="455" y="475" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Thực tế: ITL protected low vẫn chưa bị đóng nến xuyên</text>

  <!-- continuation candles resuming up, price far from ITL line -->
  <g>
    <line x1="560" y1="220" x2="560" y2="320" stroke="#26a69a" stroke-width="1"/>
    <rect x="552" y="230" width="16" height="70" rx="1" fill="#26a69a"/>
    <line x1="600" y1="160" x2="600" y2="260" stroke="#26a69a" stroke-width="1"/>
    <rect x="592" y="170" width="16" height="70" rx="1" fill="#26a69a"/>
    <line x1="640" y1="110" x2="640" y2="210" stroke="#26a69a" stroke-width="1"/>
    <rect x="632" y="120" width="16" height="70" rx="1" fill="#26a69a"/>
  </g>
  <text x="560" y="95" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#26a69a">Cấu trúc thật: chỉ là internal move, uptrend tiếp diễn</text>

  <rect x="720" y="560" width="500" height="50" rx="8" fill="#f2c94c" opacity="0.14" stroke="#f2c94c" stroke-dasharray="6 4"/>
  <text x="735" y="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#f2c94c">Rule: CHoCH chỉ hợp lệ khi phá ĐÚNG degree đang xét (ITL/LTL)</text>

  <text x="40" y="665" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">XAUUSD H1 · minh họa cấu trúc — phá STL nội bộ không nâng cấp thành CHoCH của ITL</text>
</svg>
