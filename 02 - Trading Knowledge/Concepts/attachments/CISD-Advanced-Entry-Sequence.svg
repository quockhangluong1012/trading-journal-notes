<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs><marker id="ces" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6B7280"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Quy trình 4 bước vào lệnh bằng CISD</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Bias &amp; draw → chờ sweep + vẽ level → nến đóng qua level (displacement) → entry ở retrace, không đuổi</text>

  <rect x="30" y="86" width="160" height="150" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="110" y="112" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">① BIAS &amp; DRAW</text>
  <text x="110" y="140" font-size="10" fill="#7F1D1D" text-anchor="middle">Giá muốn về BSL hay SSL?</text>
  <text x="110" y="158" font-size="10" fill="#7F1D1D" text-anchor="middle">Premium hay Discount?</text>
  <text x="110" y="186" font-size="10" fill="#7F1D1D" text-anchor="middle">CISD chỉ tradeable khi</text>
  <text x="110" y="202" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">thuận hướng này</text>

  <rect x="212" y="86" width="160" height="150" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="292" y="112" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">② SWEEP + LEVEL</text>
  <text x="292" y="140" font-size="10" fill="#78350F" text-anchor="middle">Chờ quét SSL/BSL,</text>
  <text x="292" y="156" font-size="10" fill="#78350F" text-anchor="middle">equal highs/lows</text>
  <text x="292" y="184" font-size="10" fill="#78350F" text-anchor="middle">Vẽ CISD tại open</text>
  <text x="292" y="200" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">chuỗi đẩy cuối</text>

  <rect x="394" y="86" width="160" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="474" y="112" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">③ ĐÓNG QUA LEVEL</text>
  <text x="474" y="140" font-size="10" fill="#1E3A8A" text-anchor="middle">Thân nến đối hướng</text>
  <text x="474" y="156" font-size="10" fill="#1E3A8A" text-anchor="middle">đóng qua level</text>
  <text x="474" y="184" font-size="10" fill="#1E3A8A" text-anchor="middle">tốt nhất là displacement</text>
  <text x="474" y="200" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">để lại FVG</text>

  <rect x="576" y="86" width="160" height="150" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="656" y="112" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">④ ENTRY RETRACE</text>
  <text x="656" y="140" font-size="10" fill="#14532D" text-anchor="middle">Limit tại FVG (50% CE)</text>
  <text x="656" y="156" font-size="10" fill="#14532D" text-anchor="middle">hoặc OB trùng level</text>
  <text x="656" y="184" font-size="10" fill="#14532D" text-anchor="middle">Stop dưới/trên wick sweep</text>
  <text x="656" y="200" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">T1=IRL, T2=ERL</text>

  <line x1="190" y1="161" x2="212" y2="161" stroke="#6B7280" stroke-width="2" marker-end="url(#ces)"/>
  <line x1="372" y1="161" x2="394" y2="161" stroke="#6B7280" stroke-width="2" marker-end="url(#ces)"/>
  <line x1="554" y1="161" x2="576" y2="161" stroke="#6B7280" stroke-width="2" marker-end="url(#ces)"/>
  <text x="380" y="270" font-size="10.5" fill="#6B7280" text-anchor="middle">Dời BE sau T1. Bỏ lỡ retrace đầu → chờ CISD nội bộ tiếp theo (nested), KHÔNG đuổi giá.</text>
</svg>
