  <text x="760" y="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#26a69a">Body lớn, đóng xa LH 18 pip, để lại FVG</text>
  <text x="760" y="380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Chạy trọn leg 84% mẫu</text>

  <line x1="640" y1="60" x2="640" y2="400" stroke="#2a2e39" stroke-width="1"/>

  <!-- bottom: percentile distribution chart -->
  <text x="40" y="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#d1d4dc">Phân phối win-rate theo percentile body/ATR(14) M5 — n=400</text>

  <line x1="60" y1="640" x2="1220" y2="640" stroke="#565b66" stroke-width="1"/>
  <line x1="60" y1="470" x2="60" y2="640" stroke="#565b66" stroke-width="1"/>

  <rect x="110" y="590" width="90" height="50" fill="#ef5350" opacity="0.55"/>
  <text x="120" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">P0-P25</text>
  <text x="122" y="605" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d4dc">22%</text>

  <rect x="280" y="560" width="90" height="80" fill="#ef5350" opacity="0.55"/>
  <text x="290" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">P25-P50</text>
  <text x="292" y="575" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d4dc">35%</text>

  <rect x="450" y="490" width="90" height="150" fill="#f2c94c" opacity="0.65"/>
  <text x="452" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">P50-P70 (ngưỡng)</text>
  <text x="462" y="505" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d4dc">58%</text>

  <rect x="650" y="440" width="90" height="200" fill="#26a69a" opacity="0.7"/>
  <text x="662" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">P70-P90</text>
  <text x="670" y="455" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d4dc">76%</text>

  <rect x="820" y="410" width="90" height="230" fill="#26a69a" opacity="0.85"/>
  <text x="832" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">P90-P100</text>
  <text x="842" y="425" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d4dc">81%</text>

  <line x1="450" y1="470" x2="450" y2="645" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="960" y="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">Ngưỡng đề xuất: P60</text>
  <text x="960" y="522" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">≈ body/ATR(14) ≥ 1.1</text>
  <text x="960" y="544" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Dưới ngưỡng: coi là</text>
  <text x="960" y="566" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">"break without delivery"</text>

  <text x="40" y="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">EURUSD M5 · minh họa từ backtest tổng hợp — ngưỡng percentile cần tự hiệu chỉnh theo symbol/session</text>
