<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Displacement đo được: body/ATR(14) M5 quyết định MSS "thật" hay "cosmetic"</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Backtest 400 mẫu MSS EURUSD M5 — phân theo percentile body/ATR</text>

  <line x1="40" y1="400" x2="1240" y2="400" stroke="#2a2e39" stroke-width="1"/>

  <!-- left panel: weak MSS body barely above prior high, small body vs ATR -->
  <rect x="60" y="90" width="330" height="34" rx="6" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b"/>
  <text x="78" y="113" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#ff6b6b">✗ body/ATR = 0.6 — dưới ngưỡng P40</text>

  <g>
    <line x1="120" y1="260" x2="120" y2="340" stroke="#ef5350" stroke-width="1"/>
    <rect x="112" y="270" width="16" height="55" rx="1" fill="#ef5350"/>
    <line x1="160" y1="250" x2="160" y2="330" stroke="#ef5350" stroke-width="1"/>
    <rect x="152" y="260" width="16" height="55" rx="1" fill="#ef5350"/>
  </g>
  <line x1="200" y1="230" x2="200" y2="300" stroke="#787b86" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="205" y="235" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">LH 1.0850</text>
  <!-- weak MSS candle small body barely closing above LH -->
  <line x1="240" y1="215" x2="240" y2="290" stroke="#26a69a" stroke-width="1"/>
  <rect x="232" y="222" width="16" height="30" rx="1" fill="#26a69a"/>
  <text x="205" y="310" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">body nhỏ, đóng cách LH 3 pip</text>
  <line x1="280" y1="225" x2="280" y2="295" stroke="#ef5350" stroke-width="1"/>
  <rect x="272" y="232" width="16" height="35" rx="1" fill="#ef5350"/>
  <text x="120" y="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">"Structure break without delivery"</text>
  <text x="120" y="380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Giá lùi lại ngay, không FVG, fail 71% mẫu</text>

  <!-- right panel: strong MSS -->
  <rect x="700" y="90" width="330" height="34" rx="6" fill="#26a69a" opacity="0.18" stroke="#26a69a"/>
  <text x="718" y="113" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#26a69a">✓ body/ATR = 1.8 — trên ngưỡng P70</text>

  <g>
    <line x1="760" y1="270" x2="760" y2="350" stroke="#ef5350" stroke-width="1"/>
    <rect x="752" y="280" width="16" height="55" rx="1" fill="#ef5350"/>
    <line x1="800" y1="260" x2="800" y2="340" stroke="#ef5350" stroke-width="1"/>
    <rect x="792" y="270" width="16" height="55" rx="1" fill="#ef5350"/>
  </g>
  <line x1="840" y1="240" x2="840" y2="310" stroke="#787b86" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="845" y="245" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">LH 1.0850</text>
  <!-- strong displacement candle large body -->
  <line x1="880" y1="120" x2="880" y2="300" stroke="#26a69a" stroke-width="1"/>
  <rect x="872" y="130" width="16" height="150" rx="1" fill="#26a69a"/>
  <rect x="900" y="140" width="60" height="70" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4"/>
