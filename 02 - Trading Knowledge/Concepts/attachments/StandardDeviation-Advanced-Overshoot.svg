<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="sdov1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Overshoot vs Undershoot — giá hiếm khi dừng ĐÚNG mức SD</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Round number + cụm stop kéo giá vọt QUA mức; FVG/OB đối nghịch làm giá dừng NON</text>

  <rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- divider -->
  <line x1="380" y1="80" x2="380" y2="410" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="60" y="92" font-size="12" font-weight="700" fill="#B91C1C">OVERSHOOT — vọt QUA -2 SD</text>
  <text x="410" y="92" font-size="12" font-weight="700" fill="#1D4ED8">UNDERSHOOT — dừng NON trước -2 SD</text>

  <!-- ===== LEFT: OVERSHOOT ===== -->
  <!-- round number + stop cluster band -->
  <rect x="54" y="118" width="306" height="26" fill="#FEF3C7"/>
  <line x1="54" y1="131" x2="360" y2="131" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="58" y="114" font-size="10" font-weight="700" fill="#B45309">② Round number (20000 / .00) + cụm stop &amp; pending orders</text>

  <!-- -2SD level (target) -->
  <line x1="54" y1="172" x2="360" y2="172" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="356" y="188" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end">-2 SD (target)</text>

  <!-- price path rising then overshoot spike then reverse -->
  <path d="M60,345 L92,318 L128,300 L166,262 L206,232 L246,205 L286,178" fill="none" stroke="#374151" stroke-width="2.2"/>
  <!-- overshoot candle: long upper wick through band, close back below round number -->
  <rect x="285" y="120" width="2" height="86" fill="#DC2626"/>
  <rect x="279" y="178" width="12" height="28" fill="#DC2626" rx="1"/>
  <circle cx="286" cy="122" r="6" fill="none" stroke="#B45309" stroke-width="2.2"/>
  <text x="150" y="150" font-size="10" font-weight="700" fill="#B91C1C">① Wick xuyên qua -2 SD + round</text>
  <text x="150" y="163" font-size="10" fill="#B91C1C">number rồi ĐÓNG lại = phản ứng thật</text>
  <!-- reversal down -->
  <path d="M292,206 L326,250 L360,300" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#sdov1)"/>
  <text x="70" y="392" font-size="10" font-weight="700" fill="#374151">③ Đặt TP một phần TRƯỚC -2 SD; để runner hấp thụ cú overshoot</text>

  <!-- ===== RIGHT: UNDERSHOOT ===== -->
  <!-- -2SD level (target) -->
  <line x1="400" y1="150" x2="710" y2="150" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="706" y="145" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end">-2 SD (target dự kiến)</text>

  <!-- opposing FVG box blocking approach (just below SD) -->
  <rect x="520" y="176" width="186" height="44" fill="#3B82F6" opacity="0.16"/>
  <text x="524" y="172" font-size="9.5" font-weight="700" fill="#1D4ED8">⑤ FVG/OB đối nghịch chắn đường</text>

  <!-- price path rising, stalls before SD at bottom of FVG, rejects -->
  <path d="M410,345 L448,320 L492,296 L540,264 L586,232 L628,224" fill="none" stroke="#374151" stroke-width="2.2"/>
  <circle cx="628" cy="224" r="6" fill="none" stroke="#1D4ED8" stroke-width="2.2"/>
  <text x="430" y="255" font-size="10" font-weight="700" fill="#1D4ED8">④ Dừng NON, chưa chạm -2 SD</text>
  <!-- reversal down -->
  <path d="M634,226 L664,272 L700,320" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#sdov1)"/>

  <rect x="24" y="416" width="712" height="30" rx="6" fill="#FEF3C7"/>
  <text x="36" y="435" font-size="11" font-weight="700" fill="#92400E">Đọc close-vs-wick tại mức: wick xuyên rồi đóng lại = phản ứng thật; đóng BODY xuyên qua = target dịch sang mức SD kế tiếp.</text>
</svg>
