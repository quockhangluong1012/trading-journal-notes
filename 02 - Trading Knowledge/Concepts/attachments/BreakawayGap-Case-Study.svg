<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1278 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1278" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: USDJPY Long 05/03/2026 — Breakaway Gap sau BoJ, +3.1R</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">Tích lũy 3 tuần trước gap, displacement 3.4x ATR, retest giữ, tiếp diễn tới draw on liquidity</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="60" y1="120" x2="1150" y2="120"/>
    <line x1="60" y1="230" x2="1150" y2="230"/>
    <line x1="60" y1="340" x2="1150" y2="340"/>
    <line x1="60" y1="450" x2="1150" y2="450"/>
    <line x1="60" y1="560" x2="1150" y2="560"/>
  </g>
  <text x="1155" y="124" font-size="9.0" fill="#a78bfa">152.40 TP (equal highs T1)</text>
  <text x="1155" y="234" font-size="12" fill="#94a3b8">151.20</text>
  <text x="1155" y="344" font-size="9.0" fill="#38bdf8">150.35 entry</text>
  <text x="1155" y="454" font-size="12" fill="#94a3b8">150.10</text>
  <text x="1155" y="564" font-size="9.0" fill="#ef4444">149.95 SL</text>

  <!-- accumulation range before -->
  <g>
    <rect x="70" y="400" width="12" height="30" fill="#94a3b8" opacity="0.5"/>
    <rect x="90" y="410" width="12" height="25" fill="#94a3b8" opacity="0.5"/>
    <rect x="110" y="395" width="12" height="30" fill="#94a3b8" opacity="0.5"/>
    <rect x="130" y="405" width="12" height="28" fill="#94a3b8" opacity="0.5"/>
  </g>
  <text x="60" y="470" font-size="12" fill="#94a3b8">3 tuần tích lũy 148.50-150.20</text>

  <!-- gap up candle -->
  <rect x="170" y="230" width="18" height="150" fill="#22c55e"/><line x1="179" y1="215" x2="179" y2="400" stroke="#22c55e" stroke-width="2"/>
  <text x="160" y="200" font-size="13" fill="#22c55e" font-weight="bold">① 23:30 EST BoJ ôn hòa hơn kỳ vọng — gap 150.10→150.85</text>

  <!-- retest -->
  <rect x="220" y="340" width="16" height="45" fill="#ef4444"/>
  <rect x="250" y="335" width="16" height="35" fill="#22c55e"/>
  <text x="200" y="325" font-size="13" fill="#38bdf8" font-weight="bold">② 09:00 JST retest — thân giữ trên 150.10</text>

  <!-- entry -->
  <line x1="60" y1="340" x2="1150" y2="340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="290" y="334" font-size="14" fill="#38bdf8" font-weight="bold">③ 09:46 Entry Long 150.35</text>

  <!-- SL -->
  <line x1="60" y1="450" x2="1150" y2="450" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="290" y="470" font-size="13" fill="#ef4444" font-weight="bold">SL 149.95 (40 pip, ~$400/lot)</text>

  <!-- continuation candles up -->
  <g>
    <rect x="330" y="290" width="14" height="45" fill="#22c55e"/>
    <rect x="370" y="240" width="14" height="55" fill="#22c55e"/>
    <rect x="410" y="180" width="14" height="65" fill="#22c55e"/>
    <rect x="450" y="140" width="14" height="45" fill="#22c55e"/>
    <rect x="490" y="100" width="14" height="45" fill="#22c55e"/>
  </g>
  <text x="330" y="600" font-size="13" fill="#22c55e">④ 12:00-18:00 JST tiếp diễn qua London, không pullback sâu</text>

  <!-- TP zone -->
  <line x1="60" y1="120" x2="1150" y2="120" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="540" y="114" font-size="14" fill="#a78bfa" font-weight="bold">⑤ 20:15 EST chạm 152.40 — quét equal highs T1</text>

  <g transform="translate(750,270)">
    <rect x="0" y="0" width="380" height="150" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="16" y="26" font-size="15" fill="#e2e8f0" font-weight="bold">Kết quả</text>
    <text x="16" y="50" font-size="13" fill="#94a3b8">Rủi ro: 40 pip (~$400/lot)</text>
    <text x="16" y="70" font-size="13" fill="#94a3b8">Chốt: 151.80 (một phần, thận trọng cuối phiên NY)</text>
    <text x="16" y="90" font-size="13" fill="#94a3b8">Lợi nhuận thực: 145 pip (~$1450/lot)</text>
    <text x="16" y="118" font-size="16" fill="#22c55e" font-weight="bold">R-multiple thực = +3.1R</text>
    <text x="16" y="138" font-size="12" fill="#94a3b8">(lý thuyết full TP = +5.1R nếu giữ tới 152.40)</text>
  </g>
</svg>