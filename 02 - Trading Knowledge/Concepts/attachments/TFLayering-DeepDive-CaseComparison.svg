<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="480" y1="70" x2="480" y2="500"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Case 2 (Layering dung) vs Case 4 (Setup bien thai bi chan)</text>

  <!-- LEFT: Case 2 correct -->
  <text x="30" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">Case 2: NQ1 Long - layering D1-H1-M15-M5</text>

  <!-- POI + SSL sweep -->
  <rect x="60" y="150" width="60" height="30" fill="rgba(255,152,0,0.25)"/>
  <text x="60" y="145" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">POI H1</text>

  <line x1="60" y1="210" x2="180" y2="210" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="185" y="214" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">SSL pool</text>

  <rect x="90" y="195" width="8" height="20" fill="#ef5350"/><line x1="94" y1="188" x2="94" y2="218" stroke="#ef5350" stroke-width="1.5"/>
  <text x="95" y="235" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Sweep SSL</text>

  <!-- displacement M15 -->
  <rect x="140" y="150" width="14" height="45" fill="#26a69a"/><line x1="147" y1="140" x2="147" y2="200" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="160" y="120" width="14" height="50" fill="#26a69a"/><line x1="167" y1="110" x2="167" y2="175" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="180" y="95" width="14" height="45" fill="#26a69a"/><line x1="187" y1="88" x2="187" y2="145" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="163" y="118" width="28" height="27" fill="rgba(41,98,255,0.25)"/>
  <text x="163" y="112" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">FVG M15</text>

  <line x1="130" y1="150" x2="220" y2="150" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="225" y="153" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">Swing high ref</text>

  <text x="60" y="255" font-family="Arial, sans-serif" font-size="15" fill="#26a69a">MSS M15 that: sweep truoc + FVG + dong than</text>

  <!-- entry M5 -->
  <rect x="80" y="330" width="12" height="18" fill="#26a69a"/><line x1="86" y1="322" x2="86" y2="352" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="95" y="320" width="12" height="16" fill="#26a69a"/><line x1="101" y1="313" x2="101" y2="340" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="85" y="325" width="30" height="18" fill="rgba(255,152,0,0.25)"/>
  <text x="120" y="335" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Entry CE M5</text>
  <line x1="80" y1="360" x2="230" y2="360" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="235" y="364" font-family="Arial, sans-serif" font-size="15" fill="#ef5350">Stop duoi sweep</text>

  <text x="30" y="410" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ket qua: +1.5R (internal) roi +3.5R</text>
  <text x="30" y="430" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">(runner toi BSL) - so lieu minh hoa</text>
  <text x="30" y="460" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">Bai hoc: neo pool + swing TRUOC khi xuong LTF</text>

  <!-- RIGHT: Case 4 mutation blocked -->
  <text x="510" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Case 4: XAUUSD - setup bien thai bi checklist chan</text>

  <rect x="540" y="150" width="60" height="30" fill="rgba(255,152,0,0.25)"/>
  <text x="540" y="145" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">"POI" H1 (FVG cu)</text>

  <rect x="570" y="195" width="8" height="14" fill="#ef5350"/><line x1="574" y1="190" x2="574" y2="212" stroke="#ef5350" stroke-width="1.5"/>
  <rect x="585" y="188" width="8" height="12" fill="#26a69a"/><line x1="589" y1="182" x2="589" y2="203" stroke="#26a69a" stroke-width="1.5"/>
  <text x="565" y="230" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">"Nem giam roi nen tang" = chi cham POI</text>

  <!-- M15 fake break, no sweep no fvg -->
  <rect x="640" y="160" width="12" height="25" fill="#26a69a"/><line x1="646" y1="152" x2="646" y2="188" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="655" y="150" width="12" height="20" fill="#26a69a"/><line x1="661" y1="143" x2="661" y2="173" stroke="#26a69a" stroke-width="1.5"/>
  <line x1="630" y1="160" x2="700" y2="160" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="705" y="163" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">"Pha dinh" - khong sweep truoc</text>
  <text x="565" y="255" font-family="Arial, sans-serif" font-size="15" fill="#ef5350">Khong SSL pool ro rang duoi POI</text>
  <text x="565" y="275" font-family="Arial, sans-serif" font-size="15" fill="#ef5350">Displacement nho, khong FVG dang ke</text>

  <!-- X mark blocked entry -->
  <g stroke="#ef5350" stroke-width="4">
    <line x1="640" y1="330" x2="700" y2="380"/>
    <line x1="700" y1="330" x2="640" y2="380"/>
  </g>
  <text x="565" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Checklist chan: "khong sweep / khong FVG -&gt; khong vao"</text>
  <text x="565" y="435" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ket qua: khong lenh nao duoc thuc hien</text>
  <text x="565" y="460" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Bai hoc: setup bien thai trong giong that nhung thieu loi</text>

  <text x="30" y="520" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#d1d4dc">Minh hoa khai niem, khong phai du lieu giao dich that. Xanh=tang, do=giam, cam=OB/POI, xanh duong=FVG, vang net dut=lieu vuc/swing.</text>
</svg>
