  <text x="645" y="656" font-size="16" fill="#22c55e" font-weight="bold">Kết quả thực: +2.8R</text>
  <text x="645" y="680" font-size="13" fill="#94a3b8">Bài học: OB tại true origin của leg (tự sweep SSL) cho stop ngắn,</text>
