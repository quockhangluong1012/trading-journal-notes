  <rect x="30" y="560" width="560" height="150" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="55" y="588" font-size="16" fill="#e2e8f0" font-weight="bold">Bối cảnh HTF</text>
  <text x="55" y="612" font-size="13" fill="#94a3b8">XAUUSD, thứ Ba 14/01, phiên London→NY AM, không có</text>
  <text x="55" y="630" font-size="13" fill="#94a3b8">tin high-impact. Daily Bias Bullish, giá về discount của</text>
  <text x="55" y="648" font-size="13" fill="#94a3b8">dealing range D1. Draw on liquidity: BSL 2038.40 (equal</text>
  <text x="55" y="666" font-size="13" fill="#94a3b8">highs H4). OB tự sweep liquidity = true origin của leg,</text>
  <text x="55" y="684" font-size="13" fill="#94a3b8">chồng FVG → entry tại CE của vùng chồng lấp.</text>
</svg>