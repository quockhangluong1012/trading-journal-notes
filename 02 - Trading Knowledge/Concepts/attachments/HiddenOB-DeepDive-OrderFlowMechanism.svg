<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Co che order flow: vi sao Hidden OB "an" tren HTF</text>

  <!-- HTF panel -->
  <rect x="40" y="70" width="420" height="220" fill="#1a1e28" stroke="#2a2e39"/>
  <text x="55" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#d1d4dc">HTF (H1) - chi thay 2 nen xanh</text>
  <line x1="180" y1="120" x2="180" y2="260" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="165" y="150" width="30" height="90" fill="#26a69a"/>
  <line x1="280" y1="110" x2="280" y2="255" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="265" y="140" width="30" height="95" fill="#26a69a"/>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Wick chong nhau (vung mo)</text>
  <rect x="180" y="150" width="115" height="90" fill="rgba(255,152,0,0.15)" stroke="#f2c94c" stroke-dasharray="4,3"/>

  <!-- arrow to LTF -->
  <path d="M 460 180 L 540 180" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Zoom LTF</text>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- LTF panel showing hidden OB revealed -->
  <rect x="540" y="70" width="380" height="220" fill="#1a1e28" stroke="#2a2e39"/>
  <text x="555" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#d1d4dc">LTF (M5) - OB sach hien ra</text>
  <line x1="600" y1="230" x2="600" y2="270" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="592" y="240" width="16" height="25" fill="#26a69a"/>
  <line x1="630" y1="150" x2="630" y2="240" stroke="#ef5350" stroke-width="1.5"/>
  <rect x="622" y="150" width="16" height="55" fill="#ef5350"/>
  <text x="590" y="145" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">OB (nen giam cuoi)</text>
  <line x1="670" y1="90" x2="670" y2="230" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="662" y="90" width="16" height="110" fill="#26a69a"/>
  <text x="640" y="82" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Displacement len</text>
  <rect x="650" y="150" width="30" height="30" fill="rgba(41,98,255,0.25)"/>
  <text x="700" y="270" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">FVG di kem</text>

  <!-- bottom explanation -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">(a) Lenh institutional nam trong overlap, than nen HTF che di.</text>
  <text x="40" y="360" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">(b) Retail nhin HTF thay "2 nen xanh" - khong zoom vao wick chong nen bo qua vung nay.</text>
  <text x="40" y="390" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">(c) Vi vung con nguyen lenh chua lap, phan ung sach hon khi gia quay lai - proximal gan hon OB HTF "hien nhien".</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">
    <rect x="40" y="470" width="14" height="14" fill="rgba(255,152,0,0.15)" stroke="#f2c94c"/>
    <text x="60" y="482">Vung wick chong (Hidden OB box)</text>
    <rect x="320" y="470" width="14" height="14" fill="rgba(41,98,255,0.25)"/>
    <text x="340" y="482">FVG</text>
  </g>
</svg>
