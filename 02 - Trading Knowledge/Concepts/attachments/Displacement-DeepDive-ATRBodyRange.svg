<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="210" x2="960" y2="210"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="330" x2="960" y2="330"/>
    <line x1="0" y1="390" x2="960" y2="390"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">ATR Multiple va Body-to-Range: Informed Flow vs Momentum Ignition</text>
  <text x="30" y="62" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Hinh dang nen giong het nhau tai thoi diem hinh thanh - chi phan biet duoc o cac nen SAU</text>

  <!-- Baseline ATR reference -->
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">ATR(14) baseline (nen thuong):</text>
  <rect x="250" y="85" width="12" height="16" fill="#26a69a"/><line x1="256" y1="80" x2="256" y2="106" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="270" y="88" width="12" height="12" fill="#ef5350"/><line x1="276" y1="83" x2="276" y2="105" stroke="#ef5350" stroke-width="1.5"/>
  <rect x="290" y="86" width="12" height="15" fill="#26a69a"/><line x1="296" y1="81" x2="296" y2="106" stroke="#26a69a" stroke-width="1.5"/>

  <!-- Displacement candle sequence 1: continues (informed flow) -->
  <text x="30" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">Chuoi 1: displacement + tiep dien (informed flow)</text>
  <rect x="60" y="175" width="18" height="45" fill="#26a69a"/><line x1="69" y1="165" x2="69" y2="223" stroke="#26a69a" stroke-width="2"/>
  <rect x="85" y="150" width="18" height="48" fill="#26a69a"/><line x1="94" y1="140" x2="94" y2="201" stroke="#26a69a" stroke-width="2"/>
  <rect x="110" y="125" width="18" height="46" fill="#26a69a"/><line x1="119" y1="115" x2="119" y2="174" stroke="#26a69a" stroke-width="2"/>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">ATR mult approx 1.8x</text>
  <text x="60" y="258" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">body/range approx 0.78</text>
  <!-- continuation candles after -->
  <rect x="140" y="110" width="14" height="30" fill="#26a69a"/><line x1="147" y1="102" x2="147" y2="143" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="160" y="95" width="14" height="28" fill="#26a69a"/><line x1="167" y1="88" x2="167" y2="126" stroke="#26a69a" stroke-width="1.5"/>
  <text x="235" y="240" font-family="Arial, sans-serif" font-size="14" fill="#26a69a">Nen sau: tiep dien, khong hoi</text>
  <text x="30" y="314" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">-&gt; ket luan sau: informed flow that</text>

  <!-- Displacement candle sequence 2: reverses (momentum ignition) -->
  <text x="500" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Chuoi 2: displacement + dao nguoc (momentum ignition)</text>
  <rect x="530" y="175" width="18" height="45" fill="#26a69a"/><line x1="539" y1="165" x2="539" y2="223" stroke="#26a69a" stroke-width="2"/>
  <rect x="555" y="150" width="18" height="48" fill="#26a69a"/><line x1="564" y1="140" x2="564" y2="201" stroke="#26a69a" stroke-width="2"/>
  <rect x="580" y="125" width="18" height="46" fill="#26a69a"/><line x1="589" y1="115" x2="589" y2="174" stroke="#26a69a" stroke-width="2"/>
  <text x="530" y="240" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">ATR mult approx 1.9x</text>
  <text x="530" y="258" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">body/range approx 0.80</text>
  <text x="700" y="200" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c">Hinh dang giong het chuoi 1</text>
  <!-- reversal candles after -->
  <rect x="610" y="130" width="14" height="35" fill="#ef5350"/><line x1="617" y1="122" x2="617" y2="170" stroke="#ef5350" stroke-width="1.5"/>
  <rect x="630" y="150" width="14" height="45" fill="#ef5350"/><line x1="637" y1="142" x2="637" y2="200" stroke="#ef5350" stroke-width="1.5"/>
  <text x="690" y="240" font-family="Arial, sans-serif" font-size="14" fill="#ef5350">Nen sau: dao nguoc gan het, lap FVG</text>
  <text x="500" y="314" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">-&gt; ket luan sau: momentum ignition / exhaustion</text>

  <!-- shared FVG -->
  <rect x="88" y="123" width="35" height="27" fill="rgba(41,98,255,0.25)"/>
  <rect x="558" y="123" width="35" height="27" fill="rgba(41,98,255,0.25)"/>
  <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">FVG</text>
  <text x="558" y="118" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">FVG</text>

  <!-- bottom zone chart: gray zone table visual -->
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#d1d4dc">Vung so lieu minh hoa (khong phai nguong pho quat):</text>
  <rect x="30" y="360" width="180" height="26" fill="#1e222d"/>
  <text x="40" y="377" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Thap: ATR &lt;1.0x</text>
  <rect x="220" y="360" width="180" height="26" fill="#26372f"/>
  <text x="230" y="377" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Vung xam: 1.0-1.3x</text>
  <rect x="410" y="360" width="180" height="26" fill="#1b474d"/>
  <text x="420" y="377" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Dat nguong: 1.3-2.0x</text>
  <rect x="600" y="360" width="180" height="26" fill="#3a2020"/>
  <text x="610" y="377" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Rat manh: &gt;2.0x (2 chieu)</text>

  <text x="30" y="420" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Diem mau chot: vung "rat manh" KHONG don dieu tang do tin cay.</text>
  <text x="30" y="442" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ca hai chuoi tren co so lieu gan nhu giong nhau - chi 1-2 nen sau moi phan biet duoc.</text>

  <text x="30" y="510" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#d1d4dc">Legend: xanh=tang, do=giam, xanh duong=FVG, vang=vung canh bao/vung xam. So lieu minh hoa, khong phai thong ke thuc.</text>
</svg>
