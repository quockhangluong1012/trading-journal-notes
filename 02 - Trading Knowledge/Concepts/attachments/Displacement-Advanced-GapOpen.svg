<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Gap mở phiên/tuần: "displacement giả" — không có sweep phía sau</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Gap trông như nến displacement khổng lồ nhưng KHÔNG có order flow được giao qua vùng gap; hỏi: gap-and-go hay gap-fill?</text>

  <!-- LEFT: gap-and-go -->
  <rect x="24" y="70" width="345" height="382" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#15803D">A. Gap-and-go (tiếp diễn)</text>
  <!-- pre-close candles low -->
  <rect x="70" y="300" width="2" height="46" fill="#16A34A"/><rect x="62" y="306" width="12" height="34" fill="#16A34A" rx="1" opacity="0.6"/>
  <rect x="98" y="290" width="2" height="46" fill="#16A34A"/><rect x="90" y="296" width="12" height="34" fill="#16A34A" rx="1" opacity="0.6"/>
  <text x="60" y="366" font-size="9" fill="#6B7280">đóng cửa phiên trước</text>
  <!-- gap zone -->
  <rect x="130" y="190" width="220" height="100" fill="#F59E0B" opacity="0.14"/>
  <line x1="130" y1="190" x2="350" y2="190" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="130" y1="290" x2="350" y2="290" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="245" font-size="9.5" font-weight="700" fill="#B45309">GAP (NDOG/NWOG) = imbalance</text>
  <!-- open above gap, continue up -->
  <rect x="170" y="150" width="2" height="46" fill="#16A34A"/><rect x="162" y="156" width="12" height="34" fill="#16A34A" rx="1"/>
  <text x="150" y="140" font-size="9" fill="#15803D">mở cửa TRÊN gap</text>
  <path d="M174,170 L220,150 L280,128 L330,115" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="44" y="410" font-size="9.5" fill="#374151">Giá không lấp gap, tiếp diễn. Nhưng chưa có sweep →</text>
  <text x="44" y="426" font-size="9.5" font-weight="700" fill="#B45309">chờ một sweep/MSS THẬT sau mở phiên rồi mới tin</text>

  <!-- RIGHT: gap-fill -->
  <rect x="391" y="70" width="345" height="382" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="407" y="96" font-size="12.5" font-weight="700" fill="#B91C1C">B. Gap-fill (đảo lấp gap)</text>
  <rect x="437" y="300" width="2" height="46" fill="#16A34A"/><rect x="429" y="306" width="12" height="34" fill="#16A34A" rx="1" opacity="0.6"/>
  <rect x="465" y="290" width="2" height="46" fill="#16A34A"/><rect x="457" y="296" width="12" height="34" fill="#16A34A" rx="1" opacity="0.6"/>
  <rect x="497" y="190" width="220" height="100" fill="#F59E0B" opacity="0.14"/>
  <line x1="497" y1="190" x2="717" y2="190" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="497" y1="290" x2="717" y2="290" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="515" y="215" font-size="9.5" font-weight="700" fill="#B45309">GAP = draw (cần rebalance)</text>
  <rect x="537" y="150" width="2" height="46" fill="#16A34A"/><rect x="529" y="156" width="12" height="34" fill="#16A34A" rx="1"/>
  <text x="517" y="140" font-size="9" fill="#15803D">mở cửa TRÊN gap</text>
  <!-- price reverses down to fill gap -->
  <path d="M541,170 L580,220 L620,270 L660,320" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <text x="560" y="360" font-size="9.5" font-weight="700" fill="#B91C1C">giá quay lại LẤP gap</text>
  <text x="407" y="410" font-size="9.5" fill="#374151">Gap chính là imbalance/IRL → là DRAW, không phải</text>
  <text x="407" y="426" font-size="9.5" font-weight="700" fill="#B91C1C">bằng chứng displacement. Đừng đuổi nến mở gap.</text>
</svg>
