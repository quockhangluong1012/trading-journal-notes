<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1F2937">Case study minh họa — NAS100 Long: hai kịch bản, cùng POI</text>
<text x="24" y="52" font-size="11.5" fill="#6B7280">Minh họa khái niệm, KHÔNG phải dữ liệu giao dịch thật · so người vào đúng scale vs người chờ nhầm bể HTF</text>
<!-- LEFT: correct -->
<rect x="24" y="66" width="356" height="330" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="38" y="88" font-size="12.5" font-weight="700" fill="#166534">✓ Vào đúng — trigger cùng khung entry</text>
<line x1="44" y1="118" x2="372" y2="118" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="46" y="113" font-size="9" fill="#1D4ED8">BSL trên = TARGET (draw)</text>
<rect x="44" y="250" width="328" height="46" fill="#16A34A" opacity="0.10"/>
<text x="48" y="264" font-size="9.5" font-weight="700" fill="#15803D">OB H1 discount (POI)</text>
<line x1="44" y1="300" x2="372" y2="300" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="48" y="313" font-size="8.5" fill="#6B7280">STL cục bộ (SSL LTF) — bị quét</text>
<path d="M60,180 L92,215 L120,255 L150,285 L168,312 L182,300 L200,262 L230,215 L262,175 L300,140 L340,118" fill="none" stroke="#374151" stroke-width="2.1"/>
<circle cx="168" cy="312" r="5" fill="none" stroke="#B45309" stroke-width="2.2"/>
<text x="70" y="345" font-size="9" fill="#374151">① quét STL cục bộ tại POI (LTF)</text>
<circle cx="200" cy="262" r="5" fill="none" stroke="#15803D" stroke-width="2.2"/>
<text x="70" y="360" font-size="9" fill="#15803D">② M5 MSS + FVG → ③ Long tại FVG</text>
<circle cx="340" cy="118" r="5" fill="#2563EB"/>
<text x="70" y="375" font-size="9" font-weight="700" fill="#1D4ED8">④ chạy tới BSL = target · +R lớn</text>
<!-- RIGHT: wrong -->
<rect x="388" y="66" width="348" height="330" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
<text x="402" y="88" font-size="12.5" font-weight="700" fill="#B91C1C">✗ Chờ nhầm — đòi quét SSL lớn HTF</text>
<line x1="408" y1="300" x2="728" y2="300" stroke="#B91C1C" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="412" y="295" font-size="9" font-weight="700" fill="#B91C1C">SSL lớn HTF (dưới POI) — chờ quét cái này</text>
<rect x="408" y="200" width="320" height="46" fill="#16A34A" opacity="0.10"/>
<text x="412" y="214" font-size="9.5" font-weight="700" fill="#15803D">OB H1 discount (POI) — giá đảo TỪ ĐÂY</text>
<path d="M420,150 L452,180 L484,206 L508,224 L520,214 L540,180 L570,150 L610,120 L650,100" fill="none" stroke="#374151" stroke-width="2.1"/>
<circle cx="520" cy="214" r="5" fill="none" stroke="#15803D" stroke-width="2.2"/>
<text x="500" y="250" font-size="9" fill="#15803D">M5 đã MSS tại POI</text>
<text x="402" y="330" font-size="10" fill="#374151">Giá đảo ngay từ OB, KHÔNG xuống quét SSL HTF.</text>
<text x="402" y="348" font-size="10" font-weight="700" fill="#B91C1C">Người "chờ quét SSL mới long" → đứng nhìn lệnh trôi.</text>
<text x="402" y="370" font-size="9.5" fill="#374151">Nếu giá THẬT xuống quét SSL HTF → OB có thể hỏng.</text>
<!-- bottom -->
<rect x="24" y="406" width="712" height="60" rx="8" fill="#F3F4F6"/>
<text x="38" y="428" font-size="12" font-weight="700" fill="#1F2937">Why — cùng một POI, khác nhau ở việc HỎI ĐÚNG câu hỏi scale</text>
<text x="38" y="448" font-size="10.5" fill="#374151">Người thắng chỉ đòi sweep CÙNG khung entry (STL cục bộ tại POI). Người thua nhập một bể HTF (khác scale) vào làm điều</text>
<text x="38" y="462" font-size="10.5" fill="#374151">kiện vào lệnh — bộ lọc quá chặt loại đúng cú thắng sạch nhất. Bể HTF luôn là nơi ĐI TỚI, không phải nơi XIN PHÉP.</text>
</svg>