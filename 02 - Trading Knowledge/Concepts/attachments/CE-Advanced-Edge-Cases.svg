<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="700" fill="#0f1420" rx="12"/>

<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case: CE của gap quá nhỏ so với ATR — SL bị nuốt bởi nhiễu, không phải lực bán</text>
<text x="40" y="64" font-size="15" fill="#94a3b8">NQ1, gap 9 điểm trong khi ATR M5 ~14 điểm — CE và mép gần như vô nghĩa</text>

<!-- left: normal size gap -->
<rect x="40" y="90" width="540" height="560" rx="10" fill="#141a29" stroke="#334155"/>
<text x="60" y="120" font-size="16" fill="#22c55e" font-weight="bold">Gap cỡ vừa (bình thường, CE hữu ích)</text>

<g stroke="#1c2333"><line x1="60" y1="160" x2="560" y2="160"/><line x1="60" y1="260" x2="560" y2="260"/><line x1="60" y1="360" x2="560" y2="360"/><line x1="60" y1="460" x2="560" y2="460"/></g>

<rect x="90" y="380" width="18" height="30" fill="#22c55e"/><line x1="99" y1="372" x2="99" y2="418" stroke="#22c55e" stroke-width="2"/>
<rect x="130" y="280" width="22" height="100" fill="#22c55e"/><line x1="141" y1="270" x2="141" y2="388" stroke="#22c55e" stroke-width="2"/>
<rect x="180" y="260" width="18" height="30" fill="#22c55e"/><line x1="189" y1="250" x2="189" y2="298" stroke="#22c55e" stroke-width="2"/>

<rect x="105" y="298" width="90" height="80" fill="#22c55e" opacity="0.18" stroke="#22c55e" stroke-dasharray="3,3"/>
<line x1="105" y1="338" x2="450" y2="338" stroke="#eab308" stroke-width="2" stroke-dasharray="6,3"/>
<text x="200" y="333" font-size="13" fill="#eab308">CE (gap 60pt, đủ rộng so với ATR)</text>

<rect x="240" y="330" width="18" height="40" fill="#ef4444"/><line x1="249" y1="322" x2="249" y2="380" stroke="#ef4444" stroke-width="2"/>
<rect x="280" y="300" width="20" height="30" fill="#22c55e"/><line x1="290" y1="292" x2="290" y2="340" stroke="#22c55e" stroke-width="2"/>
<text x="230" y="410" font-size="13" fill="#38bdf8" font-weight="bold">Respect: giá chạm CE, phản ứng rõ</text>

<rect x="330" y="230" width="18" height="45" fill="#22c55e"/><line x1="339" y1="220" x2="339" y2="285" stroke="#22c55e" stroke-width="2"/>
<rect x="370" y="180" width="18" height="45" fill="#22c55e"/><line x1="379" y1="170" x2="379" y2="235" stroke="#22c55e" stroke-width="2"/>

<rect x="60" y="490" width="500" height="140" rx="8" fill="#1e293b" stroke="#22c55e"/>
<text x="76" y="515" font-size="14" fill="#22c55e" font-weight="bold">Vì sao hoạt động</text>
<text x="76" y="538" font-size="13" fill="#94a3b8">Biên độ gap (60 điểm) lớn hơn nhiều lần</text>
<text x="76" y="558" font-size="13" fill="#94a3b8">nhiễu ngẫu nhiên bình thường (ATR ~14).</text>
<text x="76" y="578" font-size="13" fill="#94a3b8">CE cách mép đủ xa để SL ngoài mép xa</text>
<text x="76" y="598" font-size="13" fill="#94a3b8">không bị quét bởi dao động thông thường.</text>

<!-- right: tiny gap -->
<rect x="620" y="90" width="540" height="560" rx="10" fill="#141a29" stroke="#334155"/>
<text x="640" y="120" font-size="16" fill="#ef4444" font-weight="bold">Gap quá nhỏ (9pt, CE vô nghĩa)</text>

<g stroke="#1c2333"><line x1="640" y1="160" x2="1140" y2="160"/><line x1="640" y1="260" x2="1140" y2="260"/><line x1="640" y1="360" x2="1140" y2="360"/><line x1="640" y1="460" x2="1140" y2="460"/></g>

<rect x="670" y="380" width="18" height="20" fill="#22c55e"/><line x1="679" y1="374" x2="679" y2="408" stroke="#22c55e" stroke-width="2"/>
<rect x="710" y="360" width="20" height="22" fill="#22c55e"/><line x1="720" y1="352" x2="720" y2="390" stroke="#22c55e" stroke-width="2"/>
<rect x="760" y="358" width="18" height="18" fill="#22c55e"/><line x1="769" y1="350" x2="769" y2="384" stroke="#22c55e" stroke-width="2"/>

<rect x="685" y="362" width="90" height="20" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-dasharray="3,3"/>
<line x1="685" y1="372" x2="1000" y2="372" stroke="#eab308" stroke-width="2" stroke-dasharray="6,3"/>
<text x="800" y="367" font-size="12" fill="#eab308">CE (gap chỉ 9pt ≈ ATR M5)</text>

<!-- SL line very close -->
<line x1="685" y1="392" x2="1000" y2="392" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
<text x="800" y="410" font-size="12" fill="#ef4444">SL (chỉ 9.5pt — sát mép xa)</text>

<!-- noise candle wiping through -->
<rect x="810" y="365" width="18" height="45" fill="#ef4444"/><line x1="819" y1="355" x2="819" y2="415" stroke="#ef4444" stroke-width="2.5"/>
<text x="840" y="400" font-size="13" fill="#f97316" font-weight="bold">Nhiễu ngẫu nhiên xuyên</text>
<text x="840" y="418" font-size="13" fill="#f97316" font-weight="bold">thẳng qua CE và SL</text>

<rect x="860" y="400" width="18" height="30" fill="#ef4444"/><line x1="869" y1="392" x2="869" y2="438" stroke="#ef4444" stroke-width="2"/>

<rect x="640" y="490" width="500" height="140" rx="8" fill="#1e293b" stroke="#ef4444"/>
<text x="656" y="515" font-size="14" fill="#ef4444" font-weight="bold">Vì sao thất bại</text>
<text x="656" y="538" font-size="13" fill="#94a3b8">Gap 9 điểm ≈ ATR M5 hiện tại (~14 điểm).</text>
<text x="656" y="558" font-size="13" fill="#94a3b8">CE và mép gần như trùng nhau — không có</text>
<text x="656" y="578" font-size="13" fill="#94a3b8">"chỗ" để dao động ngẫu nhiên và SL cùng tồn tại.</text>
<text x="656" y="598" font-size="13" fill="#94a3b8">Một cây nến nhiễu bình thường đủ nuốt cả hai.</text>

</svg>
