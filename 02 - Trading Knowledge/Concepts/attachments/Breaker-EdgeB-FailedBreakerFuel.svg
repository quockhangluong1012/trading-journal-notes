<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#d1d4dc">Failed breaker làm nhiên liệu: stop của breaker trader = liquidity cho leg kế</text>
<text x="40" y="70" font-size="15" fill="#787b86">NQ M5 — chuỗi 2 bước: breaker fail → stop cluster → leg tiếp diễn hút thanh khoản đó</text>

<!-- breaker zone -->
<rect x="80" y="330" width="380" height="50" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4"/>
<text x="90" y="323" font-size="13" fill="#4a90d9">Bullish Breaker 18420-18440</text>

<!-- candles: retest respects briefly then closes through -->
<g>
<line x1="120" y1="240" x2="120" y2="335" stroke="#26a69a" stroke-width="1.5"/>
<rect x="112" y="250" width="16" height="80" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="150" y1="300" x2="150" y2="378" stroke="#26a69a" stroke-width="1.5"/>
<rect x="142" y="310" width="16" height="55" fill="#26a69a" rx="1"/>
</g>
<!-- stops placed just under breaker by breaker-longs -->
<line x1="80" y1="392" x2="460" y2="392" stroke="#f2c94c" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="90" y="410" font-size="12" fill="#f2c94c">Cluster stop của Long-breaker: 18412-18418</text>

<!-- failure candle closing through the breaker -->
<g>
<line x1="200" y1="335" x2="200" y2="440" stroke="#ef5350" stroke-width="1.5"/>
<rect x="190" y="345" width="18" height="85" fill="#ef5350" rx="1"/>
</g>
<circle cx="200" cy="425" r="5" fill="#ff6b6b"/>
<text x="150" y="465" font-size="12" fill="#ff6b6b">Nến đóng xuyên qua breaker (fail chính thức)</text>

<!-- holding candle below confirming fail -->
<g>
<line x1="240" y1="400" x2="240" y2="450" stroke="#ef5350" stroke-width="1.5"/>
<rect x="230" y="410" width="18" height="35" fill="#ef5350" rx="1"/>
</g>

<!-- sweep of the stop cluster -->
<g>
<line x1="290" y1="405" x2="290" y2="470" stroke="#ef5350" stroke-width="1.5"/>
<rect x="280" y="415" width="18" height="45" fill="#ef5350" rx="1"/>
</g>
<circle cx="290" cy="465" r="5" fill="#b48ead"/>
<text x="220" y="495" font-size="12" fill="#b48ead">Quét sạch stop cluster 18412-18418</text>

<!-- new leg down after fuel consumed -->
<g>
<line x1="500" y1="440" x2="500" y2="540" stroke="#ef5350" stroke-width="1.8"/>
<rect x="488" y="450" width="24" height="90" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="540" y1="480" x2="540" y2="580" stroke="#ef5350" stroke-width="1.8"/>
<rect x="528" y="490" width="24" height="90" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="580" y1="540" x2="580" y2="620" stroke="#ef5350" stroke-width="1.8"/>
<rect x="568" y="550" width="24" height="70" fill="#ef5350" rx="1"/>
</g>

<path d="M 300 460 L 495 445" stroke="#ff9800" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="330" y="440" font-size="13" fill="#ff9800">Fuel: displacement mới ăn theo thanh khoản vừa giải phóng</text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#ff9800"/>
</marker>
</defs>

<!-- target below: SSL pool -->
<line x1="620" y1="640" x2="1220" y2="640" stroke="#b48ead" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="630" y="658" font-size="12" fill="#b48ead">SSL pool ngày trước (target leg mới)</text>

<text x="60" y="150" font-size="14" fill="#d1d4dc">Cơ chế: người trade breaker Long đặt stop ngay dưới vùng — chính cụm stop đó</text>
<text x="60" y="175" font-size="14" fill="#d1d4dc">trở thành liquidity cho leg giảm tiếp diễn ngay sau khi breaker fail.</text>
<text x="700" y="150" font-size="13" fill="#787b86">Ghi chú: quan sát trên NQ/ES phiên NY, đặc biệt sau chuỗi breaker</text>
<text x="700" y="175" font-size="13" fill="#787b86">liên tiếp thất bại quanh vùng đỉnh choppy trước một selloff thật.</text>
</svg>
