<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="sdgap1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Neo SD qua gap làm méo reference leg</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Reference leg vắt qua RTH gap / rollover bị "phồng" biên độ → mọi mức chiếu SD sai lệch</text>

  <rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- divider -->
  <line x1="380" y1="80" x2="380" y2="410" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="52" y="92" font-size="12" font-weight="700" fill="#B91C1C">SAI — leg vắt qua gap (index NQ1)</text>
  <text x="410" y="92" font-size="12" font-weight="700" fill="#15803D">ĐÚNG — leg trong phiên liên tục</text>

  <!-- ===== LEFT: WRONG (leg spans gap) ===== -->
  <!-- gap band (time gap, empty) -->
  <rect x="150" y="110" width="34" height="230" fill="#9CA3AF" opacity="0.22"/>
  <text x="122" y="356" font-size="9.5" font-weight="700" fill="#6B7280">② Khoảng trống thời gian</text>
  <text x="122" y="368" font-size="9.5" fill="#6B7280">(RTH gap 09:30 / rollover 17:00 ET)</text>

  <!-- point A before gap (high) -->
  <path d="M60,150 L100,168 L140,150" fill="none" stroke="#374151" stroke-width="2.2"/>
  <circle cx="140" cy="150" r="6" fill="#3B82F6"/>
  <text x="56" y="140" font-size="10" font-weight="700" fill="#1D4ED8">A (high, trước gap)</text>
  <!-- jump across gap to point B after gap (low) -->
  <path d="M140,150 L184,300" fill="none" stroke="#374151" stroke-width="2.2" stroke-dasharray="3 3"/>
  <path d="M184,300 L224,320 L264,300" fill="none" stroke="#374151" stroke-width="2.2"/>
  <circle cx="184" cy="300" r="7" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <text x="188" y="316" font-size="10" font-weight="700" fill="#B91C1C">B (low, sau gap)</text>

  <!-- inflated measured amplitude bracket -->
  <path d="M112,150 L112,300" stroke="#DC2626" stroke-width="1.6" marker-end="url(#sdgap1)"/>
  <text x="66" y="235" font-size="9.5" font-weight="700" fill="#B91C1C">① Leg đo</text>
  <text x="66" y="247" font-size="9.5" font-weight="700" fill="#B91C1C">bị phồng</text>

  <!-- inflated (wrong) SD ladder — pushed too far -->
  <line x1="60" y1="128" x2="360" y2="128" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="356" y="124" font-size="9.5" fill="#B91C1C" text-anchor="end">-1 SD (sai)</text>
  <line x1="60" y1="104" x2="360" y2="104" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="356" y="118" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="end">③ -2 SD lệch quá xa</text>

  <!-- ===== RIGHT: CORRECT (continuous leg) ===== -->
  <!-- continuous session background (no gap) -->
  <text x="410" y="360" font-size="9.5" font-weight="700" fill="#15803D">④ Chỉ đo leg TRONG một phiên liên tục (không dính gap)</text>

  <!-- point A' high -->
  <path d="M410,168 L444,182 L478,168" fill="none" stroke="#374151" stroke-width="2.2"/>
  <circle cx="478" cy="168" r="6" fill="#3B82F6"/>
  <text x="410" y="158" font-size="10" font-weight="700" fill="#1D4ED8">A'</text>
  <!-- continuous drop to B' low -->
  <path d="M478,168 L512,208 L548,244 L586,276" fill="none" stroke="#374151" stroke-width="2.2"/>
  <circle cx="586" cy="276" r="7" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="590" y="292" font-size="10" font-weight="700" fill="#15803D">B'</text>

  <!-- true amplitude bracket -->
  <path d="M430,168 L430,276" stroke="#16A34A" stroke-width="1.6" marker-end="url(#sdgap1)"/>
  <text x="410" y="228" font-size="9.5" font-weight="700" fill="#15803D">Biên độ thật</text>

  <!-- correct SD ladder -->
  <line x1="410" y1="152" x2="710" y2="152" stroke="#16A34A" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="706" y="148" font-size="9.5" fill="#15803D" text-anchor="end">-1 SD</text>
  <line x1="410" y1="128" x2="710" y2="128" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="706" y="124" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="end">⑤ -2 SD chuẩn xác</text>
  <!-- continuation to correct target -->
  <path d="M586,276 L624,224 L662,176 L698,150" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#sdgap1)"/>

  <rect x="24" y="416" width="712" height="30" rx="6" fill="#FEF3C7"/>
  <text x="36" y="435" font-size="11" font-weight="700" fill="#92400E">FX chỉ dính weekend gap; index dính RTH gap 09:30 + rollover 17:00 ET. Judas leg bị gap chia đôi → reset, đo lại từ sau gap.</text>
</svg>
