<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="750" fill="#0f1420" rx="12"/>

<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case: RB "đẹp như sách" fail vì MSS xác nhận trên swing yếu</text>
<text x="40" y="64" font-size="15" fill="#94a3b8">NQ1, 15/07 — sweep đúng, tỉ lệ wick mạnh, nhưng swing dùng để xác nhận MSS quá non</text>

<!-- left panel: setup looks perfect -->
<rect x="40" y="90" width="540" height="600" rx="10" fill="#141a29" stroke="#334155"/>
<text x="60" y="120" font-size="17" fill="#22c55e" font-weight="bold">Setup nhìn như sách giáo khoa</text>

<g stroke="#1c2333"><line x1="60" y1="160" x2="560" y2="160"/><line x1="60" y1="260" x2="560" y2="260"/><line x1="60" y1="360" x2="560" y2="360"/><line x1="60" y1="460" x2="560" y2="460"/></g>

<!-- downmove candles -->
<rect x="100" y="200" width="16" height="40" fill="#ef4444"/><line x1="108" y1="190" x2="108" y2="250" stroke="#ef4444" stroke-width="2"/>
<rect x="140" y="240" width="16" height="45" fill="#ef4444"/><line x1="148" y1="230" x2="148" y2="295" stroke="#ef4444" stroke-width="2"/>
<rect x="180" y="290" width="16" height="40" fill="#ef4444"/><line x1="188" y1="280" x2="188" y2="335" stroke="#ef4444" stroke-width="2"/>

<!-- liquidity level -->
<line x1="60" y1="430" x2="560" y2="430" stroke="#eab308" stroke-dasharray="6,4" stroke-width="2"/>
<text x="65" y="425" font-size="12" fill="#eab308">SSL 18,088 (đáy phiên trước)</text>

<!-- RB candle with long wick -->
<rect x="230" y="360" width="20" height="25" fill="#22c55e"/>
<line x1="240" y1="352" x2="240" y2="440" stroke="#22c55e" stroke-width="2.5"/>
<rect x="220" y="370" width="55" height="90" fill="#22c55e" opacity="0.18" stroke="#22c55e" stroke-dasharray="3,3"/>
<text x="285" y="400" font-size="13" fill="#22c55e">RB zone: 18,110–18,088</text>
<text x="285" y="418" font-size="12" fill="#94a3b8">wick/body ~4.4x — tier "mạnh"</text>

<!-- small weak MSS swing -->
<rect x="280" y="330" width="16" height="20" fill="#22c55e"/><line x1="288" y1="322" x2="288" y2="358" stroke="#22c55e" stroke-width="2"/>
<circle cx="288" cy="330" r="4" fill="#f97316"/>
<text x="300" y="325" font-size="12" fill="#f97316">Swing high nội bộ 18,125</text>
<text x="300" y="341" font-size="11" fill="#f97316">chỉ hình thành 10 phút trước!</text>

<!-- MSS break arrow -->
<path d="M 296 340 L 340 320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr1)"/>
<text x="345" y="315" font-size="13" fill="#38bdf8" font-weight="bold">"MSS bullish" @ 18,125</text>

<!-- entry / SL / TP -->
<line x1="60" y1="380" x2="560" y2="380" stroke="#38bdf8" stroke-dasharray="4,3"/>
<text x="65" y="376" font-size="12" fill="#38bdf8">Entry 18,112</text>
<line x1="60" y1="445" x2="560" y2="445" stroke="#ef4444" stroke-dasharray="4,3"/>
<text x="65" y="460" font-size="12" fill="#ef4444">SL 18,082 (dưới low wick)</text>

<!-- price continues down through everything -->
<rect x="320" y="440" width="16" height="60" fill="#ef4444"/><line x1="328" y1="430" x2="328" y2="520" stroke="#ef4444" stroke-width="2"/>
<rect x="360" y="490" width="16" height="70" fill="#ef4444"/><line x1="368" y1="480" x2="368" y2="565" stroke="#ef4444" stroke-width="2"/>
<rect x="400" y="540" width="16" height="60" fill="#ef4444"/><line x1="408" y1="530" x2="408" y2="605" stroke="#ef4444" stroke-width="2"/>
<text x="420" y="630" font-size="13" fill="#ef4444" font-weight="bold">Giá xuyên SL, tiếp tục giảm tới 17,995</text>
<text x="420" y="650" font-size="12" fill="#94a3b8">trước khi đảo chiều tăng thật vào buổi chiều</text>

<text x="65" y="670" font-size="14" fill="#ef4444" font-weight="bold">Kết quả: -1R (30 điểm)</text>

<!-- right panel: lesson -->
<rect x="620" y="90" width="540" height="600" rx="10" fill="#141a29" stroke="#334155"/>
<text x="640" y="120" font-size="17" fill="#a78bfa" font-weight="bold">Vì sao checklist đạt hết mà vẫn thua?</text>

<rect x="640" y="150" width="500" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="656" y="175" font-size="14" fill="#e2e8f0" font-weight="bold">✓ Sweep có thật</text>
<text x="656" y="195" font-size="13" fill="#94a3b8">Quét đúng đáy phiên trước 18,088</text>
<text x="656" y="215" font-size="13" fill="#94a3b8">Tỉ lệ wick/body 4.4x — vượt ngưỡng "mạnh"</text>
<text x="656" y="235" font-size="13" fill="#94a3b8">Đúng discount H4, đúng bias, trong kill zone</text>

<rect x="640" y="270" width="500" height="110" rx="8" fill="#1e293b" stroke="#f97316"/>
<text x="656" y="295" font-size="14" fill="#f97316" font-weight="bold">✗ Nhưng MSS xác nhận trên swing "non"</text>
<text x="656" y="317" font-size="13" fill="#94a3b8">Swing high 18,125 mới hình thành 10 phút</text>
<text x="656" y="337" font-size="13" fill="#94a3b8">→ không có sức nặng cấu trúc thật</text>
<text x="656" y="357" font-size="13" fill="#94a3b8">→ dễ bị phá ngược lại gần như ngay lập tức</text>

<rect x="640" y="400" width="500" height="140" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="656" y="425" font-size="14" fill="#e2e8f0" font-weight="bold">Bài học cốt lõi</text>
<text x="656" y="450" font-size="13" fill="#94a3b8">Chất lượng của swing dùng để xác nhận MSS</text>
<text x="656" y="470" font-size="13" fill="#94a3b8">quan trọng NGANG chất lượng của RB.</text>
<text x="656" y="495" font-size="13" fill="#94a3b8">Một MSS phá đỉnh 10 phút tuổi ≠ MSS phá</text>
<text x="656" y="515" font-size="13" fill="#94a3b8">đỉnh đã đứng vững hàng giờ.</text>

<rect x="640" y="560" width="500" height="100" rx="8" fill="#1e293b" stroke="#22c55e"/>
<text x="656" y="585" font-size="14" fill="#22c55e" font-weight="bold">Cách xử lý</text>
<text x="656" y="608" font-size="13" fill="#94a3b8">Ưu tiên MSS phá swing đã tồn tại đủ lâu</text>
<text x="656" y="628" font-size="13" fill="#94a3b8">(nhiều nến, nhiều lần test) hơn swing vừa mới</text>
<text x="656" y="648" font-size="13" fill="#94a3b8">tạo ra trong chính nhịp phản ứng.</text>

<defs>
<marker id="arr1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#38bdf8"/>
</marker>
</defs>
</svg>
