<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="760" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study — GBPUSD, thứ Hai đầu tuần, Long từ Discount đúng sách</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Weekend gap + Monday reversal — discount D1 trùng OTE, MSS xác nhận trong London kill zone</text>

<rect x="40" y="90" width="1120" height="420" fill="#1e293b" stroke="#334155" rx="8"/>
<line x1="70" y1="470" x2="1130" y2="470" stroke="#1c2333"/>

<!-- range box -->
<line x1="90" y1="140" x2="1110" y2="140" stroke="#eab308" stroke-dasharray="5,3"/>
<text x="920" y="135" font-size="12" fill="#eab308">D1 range high (BSL) 1.2680</text>
<line x1="90" y1="420" x2="1110" y2="420" stroke="#eab308" stroke-dasharray="5,3"/>
<text x="920" y="436" font-size="12" fill="#eab308">D1 range low (SSL) 1.2510</text>
<line x1="90" y1="280" x2="1110" y2="280" stroke="#a78bfa" stroke-dasharray="4,2"/>
<text x="1000" y="276" font-size="11" fill="#a78bfa">EQ 1.2595</text>

<!-- OTE zone -->
<rect x="90" y="330" width="1020" height="55" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-dasharray="3,3"/>
<text x="100" y="325" font-size="12" fill="#22c55e">OTE 62-79% (1.2542-1.2563)</text>

<!-- weekend gap candles -->
<rect x="120" y="180" width="14" height="30" fill="#22c55e"/><line x1="127" y1="170" x2="127" y2="220" stroke="#22c55e" stroke-width="2"/>
<rect x="150" y="200" width="14" height="20" fill="#ef4444"/><line x1="157" y1="192" x2="157" y2="228" stroke="#ef4444" stroke-width="2"/>
<!-- gap -->
<text x="180" y="240" font-size="12" fill="#f97316">Gap thứ Hai mở cửa: 1.2620 → 1.2580</text>
<rect x="220" y="260" width="14" height="45" fill="#ef4444"/><line x1="227" y1="250" x2="227" y2="315" stroke="#ef4444" stroke-width="2"/>
<rect x="245" y="300" width="14" height="40" fill="#ef4444"/><line x1="252" y1="290" x2="252" y2="350" stroke="#ef4444" stroke-width="2"/>
<rect x="270" y="335" width="14" height="20" fill="#ef4444"/><line x1="277" y1="325" x2="277" y2="365" stroke="#ef4444" stroke-width="2"/>

<!-- sweep + reclaim into OTE -->
<rect x="700" y="345" width="14" height="30" fill="#ef4444"/><line x1="707" y1="335" x2="707" y2="385" stroke="#ef4444" stroke-width="2"/>
<circle cx="707" cy="378" r="7" fill="#f97316"/>
<text x="720" y="382" font-size="12" fill="#f97316" font-weight="bold">Sweep SSL nội bộ 1.2548 (London KZ 08:15)</text>
<rect x="725" y="320" width="14" height="35" fill="#22c55e"/><line x1="732" y1="310" x2="732" y2="365" stroke="#22c55e" stroke-width="2"/>
<rect x="750" y="290" width="14" height="40" fill="#22c55e"/><line x1="757" y1="280" x2="757" y2="335" stroke="#22c55e" stroke-width="2"/>
<circle cx="757" cy="300" r="7" fill="#38bdf8"/>
<text x="770" y="285" font-size="13" fill="#38bdf8" font-weight="bold">① Entry Long 1.2554 (M5 FVG trong OTE) — 08:32</text>

<!-- target path -->
<rect x="800" y="240" width="14" height="45" fill="#22c55e"/><line x1="807" y1="230" x2="807" y2="290" stroke="#22c55e" stroke-width="2"/>
<rect x="850" y="190" width="14" height="45" fill="#22c55e"/><line x1="857" y1="180" x2="857" y2="240" stroke="#22c55e" stroke-width="2"/>
<rect x="900" y="150" width="14" height="35" fill="#22c55e"/><line x1="907" y1="140" x2="907" y2="190" stroke="#22c55e" stroke-width="2"/>
<circle cx="907" cy="145" r="7" fill="#a78bfa"/>
<text x="850" y="130" font-size="13" fill="#a78bfa" font-weight="bold">② TP internal OB 1.2635 → ③ TP external BSL 1.2678</text>

<!-- bottom summary -->
<rect x="40" y="530" width="1120" height="200" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="560" font-size="14" fill="#e2e8f0">HTF Bias: Bullish. D1 range 1.2510-1.2680, EQ 1.2595. Gap cuối tuần đẩy giá xuống OTE 62-79% (1.2542-1.2563) ngay phiên mở cửa thứ Hai.</text>
<text x="60" y="585" font-size="14" fill="#e2e8f0">08:15 London KZ: sweep SSL nội bộ 1.2548 (equal lows), reclaim nhanh. 08:32: M5 MSS bullish + displacement, FVG 1.2551-1.2557.</text>
<text x="60" y="610" font-size="14" fill="#e2e8f0">Entry 1.2554, Stop 1.2536 (dưới sweep, buffer 12 pip) = risk 18 pip. TP1 1.2635 (+81 pip, chốt 50%). TP2 1.2678 (+124 pip).</text>
<text x="60" y="640" font-size="14" fill="#22c55e" font-weight="bold">Kết quả: R-multiple tổng hợp +5.4R — OTE + Premium/Discount + liquidity sweep cộng hưởng đúng như lý thuyết.</text>
<text x="60" y="665" font-size="13" fill="#94a3b8">Bài học: gap cuối tuần đẩy giá thẳng vào OTE là một trong số ít trường hợp discount "tự đến" mà không cần chờ retrace nhiều giờ.</text>
<text x="60" y="690" font-size="13" fill="#94a3b8">Instrument: GBPUSD, pip = 0.0001, giá trị pip ~10 USD/lot chuẩn — risk 18 pip ≈ 180 USD/lot.</text>
</svg>
