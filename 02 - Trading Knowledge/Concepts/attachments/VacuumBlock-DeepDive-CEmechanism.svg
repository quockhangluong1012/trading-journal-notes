<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="260" x2="960" y2="260"/>
    <line x1="0" y1="340" x2="960" y2="340"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
  </g>

  <text x="480" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc" text-anchor="middle">CE 50% va co che repricing sau gap (minh hoa)</text>

  <!-- Pre-gap candles (order flow deep) -->
  <g>
    <rect x="80" y="300" width="18" height="40" fill="#26a69a"/>
    <line x1="89" y1="290" x2="89" y2="300" stroke="#26a69a" stroke-width="2"/>
    <line x1="89" y1="340" x2="89" y2="350" stroke="#26a69a" stroke-width="2"/>
    <rect x="120" y="290" width="18" height="45" fill="#26a69a"/>
    <line x1="129" y1="278" x2="129" y2="290" stroke="#26a69a" stroke-width="2"/>
    <line x1="129" y1="335" x2="129" y2="348" stroke="#26a69a" stroke-width="2"/>
    <rect x="160" y="280" width="18" height="45" fill="#26a69a"/>
    <line x1="169" y1="268" x2="169" y2="280" stroke="#26a69a" stroke-width="2"/>
    <line x1="169" y1="325" x2="169" y2="338" stroke="#26a69a" stroke-width="2"/>
  </g>
  <text x="130" y="380" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">Order flow that (truoc gap)</text>

  <!-- Gap zone -->
  <rect x="200" y="130" width="200" height="160" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-dasharray="5,4" stroke-width="2"/>
  <line x1="200" y1="210" x2="400" y2="210" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="300" y="205" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c" text-anchor="middle" font-weight="bold">CE 50%</text>
  <text x="300" y="150" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">Vacuum (khong co lenh cho)</text>
  <text x="300" y="310" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">Gap range (mep tren-duoi)</text>

  <!-- Post-gap candles (order flow deep, new level) -->
  <g>
    <rect x="420" y="150" width="18" height="45" fill="#26a69a"/>
    <line x1="429" y1="138" x2="429" y2="150" stroke="#26a69a" stroke-width="2"/>
    <line x1="429" y1="195" x2="429" y2="208" stroke="#26a69a" stroke-width="2"/>
    <rect x="460" y="140" width="18" height="45" fill="#26a69a"/>
    <line x1="469" y1="128" x2="469" y2="140" stroke="#26a69a" stroke-width="2"/>
    <line x1="469" y1="185" x2="469" y2="198" stroke="#26a69a" stroke-width="2"/>
  </g>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc" text-anchor="middle">Order flow moi (sau gap)</text>

  <!-- Return path -->
  <path d="M 600 160 Q 480 190 402 208" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <text x="620" y="150" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Gia quay lai CE</text>

  <g>
    <rect x="600" y="150" width="18" height="40" fill="#ef5350"/>
    <line x1="609" y1="140" x2="609" y2="150" stroke="#ef5350" stroke-width="2"/>
    <line x1="609" y1="190" x2="609" y2="200" stroke="#ef5350" stroke-width="2"/>
    <rect x="640" y="160" width="18" height="40" fill="#ef5350"/>
    <line x1="649" y1="150" x2="649" y2="160" stroke="#ef5350" stroke-width="2"/>
    <line x1="649" y1="200" x2="649" y2="210" stroke="#ef5350" stroke-width="2"/>
  </g>

  <!-- Liquidity line at current price zone -->
  <line x1="700" y1="145" x2="900" y2="145" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="800" y="130" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c" text-anchor="middle">Gia hien tai / DOL ke tiep</text>

  <!-- Explanatory box -->
  <rect x="60" y="440" width="840" height="70" fill="#1e222d" stroke="#787b86"/>
  <text x="480" y="465" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc" text-anchor="middle">Nguyen tac: CE = trung diem phan phoi xac suat "gia tri hop ly" khi khong co</text>
  <text x="480" y="486" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc" text-anchor="middle">thong tin them de thien vi ve mot phia -&gt; xac suat dung lai quanh CE cao hon full-fill.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
