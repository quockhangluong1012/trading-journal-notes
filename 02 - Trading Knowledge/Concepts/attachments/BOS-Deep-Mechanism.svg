<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="780" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế Order Flow đằng sau Break of Structure</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Vì sao "body close qua swing" ≠ "wick qua swing" ở cấp độ đấu giá &amp; thanh khoản</text>

<!-- Left: acceptance vs excess -->
<rect x="40" y="90" width="540" height="300" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="118" font-size="17" fill="#e2e8f0" font-weight="bold">1. Acceptance vs Excess (Auction Theory)</text>
<line x1="80" y1="340" x2="550" y2="340" stroke="#1c2333"/>
<!-- swing high level -->
<line x1="80" y1="220" x2="550" y2="220" stroke="#eab308" stroke-dasharray="6,4"/>
<text x="490" y="215" font-size="12" fill="#eab308">swing high</text>
<!-- wick sweep candle -->
<rect x="110" y="180" width="18" height="20" fill="#22c55e"/>
<line x1="119" y1="150" x2="119" y2="230" stroke="#22c55e" stroke-width="2"/>
<text x="95" y="145" font-size="12" fill="#f97316">wick vượt (excess)</text>
<!-- body close candle real BOS -->
<rect x="160" y="150" width="18" height="65" fill="#22c55e"/>
<line x1="169" y1="140" x2="169" y2="225" stroke="#22c55e" stroke-width="2"/>
<text x="150" y="130" font-size="12" fill="#22c55e" font-weight="bold">body close (acceptance)</text>
<rect x="90" y="150" width="440" height="70" fill="#22c55e" opacity="0.08"/>
<text x="60" y="260" font-size="13" fill="#94a3b8">Wick = giá "ghé thăm" mức mới, order thị trường chạm limit</text>
<text x="60" y="280" font-size="13" fill="#94a3b8">đối ứng, bị đẩy lùi ngay — chưa có "chấp nhận" giá mới.</text>
<text x="60" y="305" font-size="13" fill="#94a3b8">Body close = auction giữ giá ngoài swing tới hết nến →</text>
<text x="60" y="325" font-size="13" fill="#94a3b8">chứng minh bên thắng đã hấp thụ hết đối ứng ở đó.</text>

<!-- Right: displacement & FVG mechanism -->
<rect x="620" y="90" width="540" height="300" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="640" y="118" font-size="17" fill="#e2e8f0" font-weight="bold">2. Displacement &amp; imbalance (FVG) sinh ra thế nào</text>
<!-- 3 candle displacement showing gap -->
<rect x="680" y="280" width="20" height="40" fill="#22c55e"/><line x1="690" y1="265" x2="690" y2="330" stroke="#22c55e" stroke-width="2"/>
<rect x="720" y="200" width="20" height="90" fill="#22c55e"/><line x1="730" y1="185" x2="730" y2="300" stroke="#22c55e" stroke-width="2"/>
<rect x="760" y="150" width="20" height="60" fill="#22c55e"/><line x1="770" y1="135" x2="770" y2="220" stroke="#22c55e" stroke-width="2"/>
<rect x="700" y="200" width="20" height="8" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-dasharray="3,2"/>
<text x="800" y="210" font-size="12" fill="#22c55e" font-weight="bold">FVG (candle 1 high → candle 3 low)</text>
<text x="640" y="345" font-size="13" fill="#94a3b8">Một market order lớn quét hết limit order 2 phía trong</text>
<text x="640" y="365" font-size="13" fill="#94a3b8">3 nến liên tiếp — không đủ đối ứng để lấp khoảng trống giá.</text>

<!-- Bottom: 3-asset table -->
<rect x="40" y="410" width="1120" height="290" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="438" font-size="17" fill="#e2e8f0" font-weight="bold">3. Hành vi BOS theo loại tài sản</text>
<line x1="60" y1="452" x2="1160" y2="452" stroke="#334155"/>
<text x="70" y="480" font-size="14" fill="#94a3b8" font-weight="bold">Tiêu chí</text>
<text x="330" y="480" font-size="14" fill="#94a3b8" font-weight="bold">FX majors</text>
<text x="650" y="480" font-size="14" fill="#94a3b8" font-weight="bold">Index futures NQ/ES</text>
<text x="960" y="480" font-size="14" fill="#94a3b8" font-weight="bold">Crypto BTC/ETH</text>
<line x1="60" y1="492" x2="1160" y2="492" stroke="#1c2333"/>
<text x="70" y="518" font-size="13" fill="#e2e8f0">Ai tạo displacement</text>
<text x="330" y="518" font-size="13" fill="#e2e8f0">Bank/dealer flow lúc fixing, London open</text>
<text x="650" y="518" font-size="13" fill="#e2e8f0">Quỹ CTA + options gamma dealer hedging</text>
<text x="960" y="518" font-size="13" fill="#e2e8f0">Liquidation cascade (đòn bẩy 20-100x)</text>
<line x1="60" y1="530" x2="1160" y2="530" stroke="#1c2333"/>
<text x="70" y="555" font-size="13" fill="#e2e8f0">Độ tin cậy body close</text>
<text x="330" y="555" font-size="13" fill="#e2e8f0">Cao trong overlap London-NY</text>
<text x="650" y="555" font-size="13" fill="#e2e8f0">Cao giờ RTH; thấp phiên Á/tối</text>
<text x="960" y="555" font-size="13" fill="#e2e8f0" textLength="234" lengthAdjust="spacingAndGlyphs">Thấp — nến 1 phút hay bị "wick giả" do funding</text>
<line x1="60" y1="567" x2="1160" y2="567" stroke="#1c2333"/>
<text x="70" y="592" font-size="13" fill="#e2e8f0">Rủi ro exhaustion</text>
<text x="330" y="592" font-size="13" fill="#e2e8f0">Trung bình — ADR ~70-90 pip</text>
<text x="650" y="592" font-size="13" fill="#e2e8f0">Cao cuối phiên NY khi ADR đã cạn</text>
<text x="960" y="592" font-size="13" fill="#e2e8f0" textLength="234" lengthAdjust="spacingAndGlyphs">Rất cao sau cú pump/dump mạnh trong giờ</text>
<line x1="60" y1="604" x2="1160" y2="604" stroke="#1c2333"/>
<text x="70" y="629" font-size="13" fill="#e2e8f0">Wyckoff tương ứng</text>
<text x="330" y="629" font-size="13" fill="#e2e8f0">Sign of Strength (SOS) sau Spring</text>
<text x="650" y="629" font-size="13" fill="#e2e8f0">SOS + Jump Across the Creek</text>
<text x="960" y="629" font-size="13" fill="#e2e8f0">SOS nhưng dễ lẫn "upthrust" giả</text>
<text x="60" y="670" font-size="13" fill="#94a3b8" font-style="italic">BOS (ICT) = Sign of Strength/Weakness (Wyckoff) = breakout được xác nhận volume (Footprint) — 3 tên, 1 hiện tượng.</text>
</svg>