<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="450" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Double Judas — hai cú thao túng trong một ngày (London raid + NY re-raid)</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Bullish day: cú Judas ĐẦU (London) không phải cú cuối. NY thường re-raid trước khi phân phối thật.</text>

  <rect x="24" y="66" width="712" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- session bands -->
  <rect x="40" y="80" width="150" height="272" fill="#EEF2FF" opacity="0.6"/>
  <text x="52" y="96" font-size="10" fill="#4338CA">ASIA — accumulation</text>
  <rect x="190" y="80" width="230" height="272" fill="#FEF3C7" opacity="0.5"/>
  <text x="202" y="96" font-size="10" fill="#B45309">LONDON — Judas #1</text>
  <rect x="420" y="80" width="300" height="272" fill="#FEE2E2" opacity="0.45"/>
  <text x="432" y="96" font-size="10" fill="#B91C1C">NY — Judas #2 → distribution</text>

  <!-- daily open -->
  <line x1="40" y1="200" x2="720" y2="200" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="600" y="196" font-size="9" fill="#6B7280">Midnight NY Open (day open thật)</text>

  <!-- asia range -->
  <line x1="40" y1="175" x2="190" y2="175" stroke="#4338CA" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="40" y1="235" x2="190" y2="235" stroke="#4338CA" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="44" y="250" font-size="8.5" fill="#4338CA">Asia Low (SSL)</text>
  <path d="M48,205 L70,215 L95,195 L120,220 L150,200 L185,215" fill="none" stroke="#4338CA" stroke-width="1.8"/>

  <!-- London Judas #1: sweep asia low -->
  <path d="M185,215 L215,255 L235,240 L250,258" fill="none" stroke="#B45309" stroke-width="2.4"/>
  <circle cx="250" cy="258" r="4" fill="#B45309"/>
  <text x="205" y="285" font-size="9.5" font-weight="700" fill="#B45309">Judas #1 quét Asia Low</text>
  <!-- small distribution up (trap: looks like the move) -->
  <path d="M250,258 L285,205 L310,225 L350,170 L380,185 L410,150" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="300" y="140" font-size="9" fill="#374151">pop lên — bẫy "đã xong Judas"</text>
  <text x="300" y="152" font-size="8.5" fill="#6B7280">→ ai Long ở đây bị Judas #2 quét</text>

  <!-- NY Judas #2: re-raid down (sweeps London low / new higher low) -->
  <path d="M410,150 L440,215 L460,200 L485,270" fill="none" stroke="#DC2626" stroke-width="2.6"/>
  <circle cx="485" cy="270" r="5" fill="#DC2626"/>
  <line x1="250" y1="272" x2="500" y2="272" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="292" font-size="9.5" font-weight="700" fill="#B91C1C">Judas #2 (NY) quét sâu hơn → SSL thật</text>

  <!-- real distribution up to BSL -->
  <path d="M485,270 L520,200 L550,220 L590,150 L620,168 L660,110 L700,120" fill="none" stroke="#16A34A" stroke-width="2.8"/>
  <circle cx="500" cy="262" r="4" fill="#16A34A"/>
  <text x="505" y="255" font-size="9.5" font-weight="700" fill="#166534">ENTRY thật (sau Judas #2)</text>
  <line x1="560" y1="108" x2="720" y2="108" stroke="#16A34A" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="600" y="103" font-size="9" fill="#166534">Target: BSL / PDH</text>

  <rect x="24" y="374" width="712" height="66" rx="6" fill="#EDE9FE"/>
  <text x="36" y="394" font-size="11.5" font-weight="700" fill="#5B21B6">Bài học: đừng cho rằng cú Judas ĐẦU TIÊN là cú cuối. Hỏi "pool nào là draw thật của ngày?" — nếu còn một cụm SSL sâu hơn</text>
  <text x="36" y="412" font-size="11.5" fill="#5B21B6">chưa bị quét, NY nhiều khả năng re-raid tới đó trước khi phân phối. Vào sau cú sweep pool SÂU NHẤT, không phải cú sweep đầu tiên.</text>
  <text x="36" y="430" font-size="11.5" fill="#5B21B6">Kỷ luật "2 lần thử": nếu bị stop ở Judas #1, KHÔNG vào lại mù — chờ NY re-raid xác nhận rồi mới vào.</text>
</svg>
