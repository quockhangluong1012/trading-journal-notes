<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="480" y1="60" x2="480" y2="500" stroke-dasharray="4,4"/>
  </g>

  <text x="480" y="36" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Case C1 (thang) vs Case C2 (thua do tin)</text>

  <!-- Left: C1 win -->
  <text x="230" y="70" fill="#26a69a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">C1: EURUSD, RDRB dung quy trinh</text>

  <line x1="100" y1="300" x2="100" y2="340" stroke="#26a69a" stroke-width="2"/>
  <rect x="92" y="305" width="16" height="30" fill="#26a69a"/>
  <line x1="140" y1="260" x2="140" y2="300" stroke="#26a69a" stroke-width="2"/>
  <rect x="132" y="265" width="16" height="30" fill="#26a69a"/>

  <rect x="85" y="290" width="70" height="25" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="120" y="330" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">RDRB range</text>

  <line x1="180" y1="230" x2="180" y2="270" stroke="#26a69a" stroke-width="2"/>
  <rect x="172" y="235" width="16" height="30" fill="#26a69a"/>
  <line x1="220" y1="270" x2="220" y2="310" stroke="#ef5350" stroke-width="2"/>
  <rect x="212" y="280" width="16" height="25" fill="#ef5350"/>
  <line x1="260" y1="240" x2="260" y2="290" stroke="#26a69a" stroke-width="2"/>
  <rect x="252" y="245" width="16" height="35" fill="#26a69a"/>

  <circle cx="230" cy="300" r="5" fill="#ffffff"/>
  <text x="270" y="200" fill="#ffffff" font-family="Arial, sans-serif" font-size="13">MSS + Entry</text>
  <path d="M 240 290 L 300 150" stroke="#26a69a" stroke-width="2" fill="none" marker-end="url(#arrowg)"/>

  <line x1="300" y1="120" x2="300" y2="160" stroke="#26a69a" stroke-width="2"/>
  <rect x="292" y="125" width="16" height="30" fill="#26a69a"/>

  <text x="230" y="380" fill="#26a69a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Ket qua: +2.2R den +3R (minh hoa)</text>

  <!-- Right: C2 loss -->
  <text x="730" y="70" fill="#ef5350" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">C2: GBPUSD, tin bat ngo</text>

  <line x1="600" y1="150" x2="600" y2="190" stroke="#ef5350" stroke-width="2"/>
  <rect x="592" y="155" width="16" height="30" fill="#ef5350"/>
  <line x1="640" y1="190" x2="640" y2="230" stroke="#ef5350" stroke-width="2"/>
  <rect x="632" y="195" width="16" height="30" fill="#ef5350"/>

  <rect x="585" y="220" width="70" height="25" fill="rgba(41,98,255,0.25)" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="620" y="260" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">RDRB range</text>

  <line x1="680" y1="230" x2="680" y2="270" stroke="#ef5350" stroke-width="2"/>
  <rect x="672" y="235" width="16" height="30" fill="#ef5350"/>
  <circle cx="680" cy="245" r="5" fill="#ffffff"/>
  <text x="720" y="230" fill="#ffffff" font-family="Arial, sans-serif" font-size="13">MSS + Entry short</text>

  <!-- sudden news spike up (invalidation) -->
  <path d="M 690 250 L 760 100" stroke="#ef5350" stroke-width="3" fill="none" marker-end="url(#arrowr)"/>
  <text x="800" y="130" fill="#ef5350" font-family="Arial, sans-serif" font-size="13">Tin bat ngo</text>

  <line x1="740" y1="120" x2="740" y2="180" stroke="#26a69a" stroke-width="2"/>
  <rect x="732" y="125" width="16" height="50" fill="#26a69a"/>

  <line x1="580" y1="250" x2="900" y2="250" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="900" y="245" fill="#f2c94c" font-family="Arial, sans-serif" font-size="11" text-anchor="end">Stop</text>

  <text x="730" y="380" fill="#ef5350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Ket qua: -1R (quy trinh dung, rui ro ngoai sinh)</text>

  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#26a69a"/>
    </marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef5350"/>
    </marker>
  </defs>

  <text x="480" y="500" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Ca hai case deu dung quy trinh RDRB - ket qua khac nhau vi ban chat xac suat</text>
</svg>
