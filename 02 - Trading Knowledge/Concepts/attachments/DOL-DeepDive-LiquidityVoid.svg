<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Liquidity Void: sweep binh thuong vs khoang trong thanh khoan</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="340" x2="960" y2="340"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="480" y1="70" x2="480" y2="470"/>
  </g>

  <text x="30" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc">Pha 1: Sweep co mat do lenh (binh thuong)</text>
  <line x1="60" y1="260" x2="430" y2="260" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="65" y="255" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Pool day lenh cho</text>
  <g>
    <line x1="110" y1="220" x2="110" y2="260" stroke="#ef5350" stroke-width="1"/>
    <rect x="100" y="230" width="20" height="25" fill="#ef5350"/>
    <line x1="150" y1="240" x2="150" y2="300" stroke="#ef5350" stroke-width="1"/>
    <rect x="140" y="255" width="20" height="30" fill="#ef5350"/>
  </g>
  <!-- small clean sweep wick then reversal -->
  <line x1="200" y1="250" x2="200" y2="300" stroke="#ef5350" stroke-width="1"/>
  <rect x="190" y="265" width="20" height="20" fill="#ef5350"/>
  <text x="180" y="315" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Sweep gon, chi qua vai diem</text>
  <g>
    <line x1="250" y1="220" x2="250" y2="270" stroke="#26a69a" stroke-width="1"/>
    <rect x="240" y="225" width="20" height="35" fill="#26a69a"/>
    <line x1="290" y1="180" x2="290" y2="240" stroke="#26a69a" stroke-width="1"/>
    <rect x="280" y="185" width="20" height="45" fill="#26a69a"/>
  </g>
  <text x="230" y="170" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Rejection ro rang, dao chieu</text>

  <text x="510" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc">Pha 2: Liquidity void (phien A, thanh khoan mong)</text>
  <line x1="540" y1="260" x2="910" y2="260" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="545" y="255" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Muc tuong tu, nhung it lenh cho</text>
  <g>
    <line x1="590" y1="230" x2="590" y2="260" stroke="#ef5350" stroke-width="1"/>
    <rect x="580" y="240" width="20" height="20" fill="#ef5350"/>
  </g>
  <!-- long thin candle plunging through many levels, no reaction -->
  <line x1="650" y1="200" x2="650" y2="420" stroke="#ef5350" stroke-width="1"/>
  <rect x="640" y="220" width="20" height="180" fill="#ef5350"/>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Truot qua nhieu muc</text>
  <text x="670" y="248" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">lien tiep, khong doi ung</text>
  <line x1="700" y1="380" x2="700" y2="440" stroke="#ef5350" stroke-width="1"/>
  <rect x="690" y="390" width="20" height="45" fill="#ef5350"/>
  <!-- partial recovery -->
  <line x1="760" y1="360" x2="760" y2="410" stroke="#26a69a" stroke-width="1"/>
  <rect x="750" y="370" width="20" height="35" fill="#26a69a"/>
  <text x="740" y="345" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Hoi phuc mot phan sau do</text>

  <rect x="30" y="440" width="900" height="70" fill="none" stroke="#f2c94c" stroke-width="1"/>
  <text x="45" y="462" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Khac biet chinh: sweep binh thuong co mat do lenh thuc su hap thu ngay,</text>
  <text x="45" y="484" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">liquidity void thi truot qua nhieu muc vi khong co doi ung tu nhien vao dung luc do (thuong la phien A / tin soc).</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">
    <rect x="30" y="510" width="14" height="14" fill="#ef5350"/>
    <text x="50" y="521">Nen giam</text>
    <rect x="150" y="510" width="14" height="14" fill="#26a69a"/>
    <text x="170" y="521">Nen tang</text>
  </g>
</svg>
