<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">CE stack: FVG vs OB vs BPR lệch nhau vài tick</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Backtest 95 mẫu: OB mean threshold thắng 47%, CE FVG thắng 33%, CE BPR thắng 20%</text>

  <line x1="180" y1="180" x2="1120" y2="180" stroke="#2a2e39" stroke-width="1"/>
  <line x1="180" y1="620" x2="1120" y2="620" stroke="#2a2e39" stroke-width="1"/>

  <g>
    <line x1="220" y1="250" x2="220" y2="310" stroke="#26a69a" stroke-width="2"/>
    <rect x="210" y="260" width="20" height="35" fill="#26a69a" rx="1"/>
    <line x1="270" y1="220" x2="270" y2="280" stroke="#26a69a" stroke-width="2"/>
    <rect x="260" y="230" width="20" height="35" fill="#26a69a" rx="1"/>
  </g>
  <text x="245" y="330" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">displacement lên</text>

  <rect x="350" y="380" width="500" height="90" fill="#4a90d9" opacity="0.13" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">Bullish OB (thân nến cuối trước displacement)</text>
  <line x1="350" y1="415" x2="850" y2="415" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="860" y="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90d9">OB mean threshold 1.08312</text>

  <rect x="350" y="440" width="500" height="70" fill="#f2c94c" opacity="0.13" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="458" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">Bullish FVG (khoảng trống sau đó)</text>
  <line x1="350" y1="475" x2="850" y2="475" stroke="#f2c94c" stroke-width="2.5"/>
  <text x="860" y="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#f2c94c">CE FVG 1.08296 (lệch 1.6 pip)</text>

  <g>
    <line x1="900" y1="360" x2="900" y2="430" stroke="#ef5350" stroke-width="2"/>
    <rect x="890" y="365" width="20" height="55" fill="#ef5350" rx="1"/>
  </g>
  <line x1="900" y1="425" x2="960" y2="415" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="860" y="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">giá chạm dứt khoát tại OB, không tới CE FVG</text>

  <g>
    <line x1="950" y1="300" x2="950" y2="360" stroke="#26a69a" stroke-width="2"/>
    <rect x="940" y="310" width="20" height="35" fill="#26a69a" rx="1"/>
    <line x1="1000" y1="260" x2="1000" y2="320" stroke="#26a69a" stroke-width="2"/>
    <rect x="990" y="270" width="20" height="35" fill="#26a69a" rx="1"/>
  </g>

  <rect x="200" y="560" width="880" height="120" rx="8" fill="#131722" stroke="#565b66" stroke-width="1"/>
  <text x="640" y="585" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#d1d4dc">Thứ hạng khi CE stack lệch nhau (backtest 95 mẫu)</text>
  <text x="640" y="612" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#4a90d9">1. OB mean threshold - thắng 47%</text>
  <text x="640" y="636" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">2. CE của FVG - thắng 33%</text>
  <text x="640" y="660" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#b48ead">3. CE của BPR - thắng 20%</text>

  <text x="640" y="705" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem CS-C1 - ví dụ thực chiến khớp đúng EC-C2</text>
</svg>
