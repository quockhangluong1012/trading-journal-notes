<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="500" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1F2937">4 edge case của Scale Alignment (chỉ gặp khi trade/backtest nhiều)</text>
<text x="24" y="52" font-size="12" fill="#6B7280">Khi nào "cùng khung" bị đánh lừa, và khi nào bể HTF thực sự đáng chờ.</text>
<!-- P1 -->
<rect x="24" y="66" width="352" height="196" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="38" y="88" font-size="12.5" font-weight="700" fill="#92400E">A. POI CHÍNH LÀ bể (Turtle Soup)</text>
<rect x="44" y="100" width="322" height="26" fill="#DC2626" opacity="0.14"/>
<text x="50" y="117" font-size="9.5" font-weight="700" fill="#B91C1C">EQH = POI (trùng nhau)</text>
<line x1="44" y1="100" x2="366" y2="100" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M60,190 L110,150 L150,112 L175,92 L195,120 L235,170 L300,210" fill="none" stroke="#374151" stroke-width="2"/>
<circle cx="175" cy="92" r="5" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<text x="120" y="238" font-size="10" fill="#374151">Khi POI = bể, sweep POI và sweep bể</text>
<text x="120" y="252" font-size="10" fill="#374151">là MỘT → phải chờ wick qua bể.</text>
<text x="44" y="238" font-size="10" font-weight="700" fill="#15803D">✓ Đúng</text>
<!-- P2 -->
<rect x="384" y="66" width="352" height="196" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="398" y="88" font-size="12.5" font-weight="700" fill="#B91C1C">B. Bể HTF quá "béo" &amp; quá sát POI</text>
<rect x="404" y="102" width="322" height="20" fill="#B91C1C" opacity="0.18"/>
<text x="410" y="116" font-size="9.5" font-weight="700" fill="#B91C1C">EQH lớn ngay sát trên POI (chênh vài pip)</text>
<rect x="404" y="128" width="322" height="30" fill="#DC2626" opacity="0.10"/>
<text x="410" y="147" font-size="9" fill="#B91C1C">OB (POI)</text>
<path d="M404,220 L450,190 L500,150 L560,120 L600,100 L640,118 L690,160" fill="none" stroke="#374151" stroke-width="2"/>
<circle cx="600" cy="100" r="5" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<text x="398" y="238" font-size="10" fill="#374151">Giá dễ bị hút LÊN quét EQH TRƯỚC.</text>
<text x="398" y="252" font-size="10" fill="#374151">→ hạ size / scale-in / chờ giá quét bể xong.</text>
<!-- P3 -->
<rect x="24" y="274" width="352" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="38" y="296" font-size="12.5" font-weight="700" fill="#B91C1C">C. Nested sweep — sweep chồng sweep</text>
<line x1="44" y1="330" x2="366" y2="330" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="48" y="325" font-size="9" fill="#6B7280">STH-1 (LTF)</text>
<line x1="44" y1="356" x2="366" y2="356" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="48" y="351" font-size="9" fill="#6B7280">STH-2 sâu hơn (LTF)</text>
<path d="M60,430 L100,400 L130,332 L150,320 L165,345 L195,375 L215,358 L235,320 L250,308 L268,340 L300,400" fill="none" stroke="#374151" stroke-width="2"/>
<circle cx="150" cy="320" r="4.5" fill="none" stroke="#B45309" stroke-width="2"/>
<circle cx="250" cy="308" r="4.5" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<text x="38" y="452" font-size="9.5" fill="#374151">Sweep-1 chưa đảo → sweep-2 mới thật.</text>
<text x="38" y="466" font-size="9.5" fill="#374151">Lọc: chỉ tính MSS SAU sweep + có FVG.</text>
<!-- P4 -->
<rect x="384" y="274" width="352" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="398" y="296" font-size="12.5" font-weight="700" fill="#15803D">D. Khi nào bể HTF THỰC SỰ là trigger</text>
<text x="398" y="318" font-size="10" fill="#374151">Bể HTF trở thành trigger CHỈ KHI:</text>
<text x="404" y="338" font-size="10" fill="#15803D">• POI của bạn nằm ĐÚNG tại bể đó, hoặc</text>
<text x="404" y="356" font-size="10" fill="#15803D">• entry model của bạn = sweep bể HTF</text>
<text x="412" y="372" font-size="10" fill="#15803D">rồi vào ngay trên khung đó (không mismatch)</text>
<line x1="398" y1="386" x2="722" y2="386" stroke="#E5E7EB"/>
<text x="398" y="406" font-size="10" fill="#374151">Ngược lại: bể HTF ở xa POI, khác khung →</text>
<text x="398" y="422" font-size="10" font-weight="700" fill="#B91C1C">nó là TARGET, đừng biến thành điều kiện vào.</text>
<rect x="398" y="434" width="324" height="30" rx="6" fill="#ECFDF5"/>
<text x="406" y="453" font-size="9.5" fill="#065F46">Test 1 câu: "Bể này cùng khung entry không?" Không → target.</text>
</svg>