<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Ngày FOMC: tách bias AM và PM độc lập</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Backtest 34 ngày sự kiện: bias AM giữ đúng hướng sau tin chỉ 26%</text>

  <!-- AM section -->
  <rect x="60" y="110" width="480" height="30" rx="6" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="300" y="131" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90d9">Phiên AM (trước 14:00 ET)</text>

  <g>
    <line x1="110" y1="280" x2="110" y2="330" stroke="#26a69a" stroke-width="2"/>
    <rect x="100" y="290" width="20" height="35" fill="#26a69a" rx="1"/>
    <line x1="160" y1="250" x2="160" y2="300" stroke="#26a69a" stroke-width="2"/>
    <rect x="150" y="260" width="20" height="35" fill="#26a69a" rx="1"/>
    <line x1="210" y1="220" x2="210" y2="270" stroke="#26a69a" stroke-width="2"/>
    <rect x="200" y="230" width="20" height="35" fill="#26a69a" rx="1"/>
  </g>
  <text x="160" y="360" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#26a69a">bias AM: bullish (sweep + MSS)</text>

  <rect x="240" y="380" width="240" height="42" rx="8" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">13:45 ET: đóng băng bias AM</text>

  <!-- news candle -->
  <line x1="640" y1="150" x2="640" y2="660" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="640" y="135" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">14:00 ET FOMC</text>

  <line x1="640" y1="200" x2="640" y2="420" stroke="#ff6b6b" stroke-width="3"/>
  <rect x="622" y="220" width="36" height="180" fill="#ff6b6b" rx="1"/>
  <text x="640" y="440" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff6b6b">nến tin: reset cấu trúc</text>

  <!-- PM section -->
  <rect x="740" y="110" width="480" height="30" rx="6" fill="#b48ead" opacity="0.16" stroke="#b48ead" stroke-width="1.2"/>
  <text x="980" y="131" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b48ead">Phiên PM (sau 14:35 ET)</text>

  <g>
    <line x1="780" y1="440" x2="780" y2="490" stroke="#ef5350" stroke-width="2"/>
    <rect x="770" y="445" width="20" height="35" fill="#ef5350" rx="1"/>
    <line x1="830" y1="470" x2="830" y2="520" stroke="#ef5350" stroke-width="2"/>
    <rect x="820" y="475" width="20" height="35" fill="#ef5350" rx="1"/>
    <line x1="880" y1="500" x2="880" y2="550" stroke="#ef5350" stroke-width="2"/>
    <rect x="870" y="505" width="20" height="35" fill="#ef5350" rx="1"/>
  </g>
  <text x="830" y="580" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ef5350">bias PM: bearish (xây lại từ đầu)</text>

  <rect x="900" y="380" width="280" height="42" rx="8" fill="#b48ead" opacity="0.16" stroke="#b48ead" stroke-width="1.5"/>
  <text x="1040" y="406" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b48ead">xây bias PM sau nến H1 đầu tiên</text>

  <rect x="200" y="620" width="880" height="46" rx="8" fill="#131722" stroke="#565b66" stroke-width="1"/>
  <text x="640" y="649" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">Cấm mang bias sang từ AM sang PM - hai chế độ thị trường tách biệt</text>

  <text x="640" y="695" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem EC-D1 và CS-D1 - ví dụ thực chiến khớp đúng quy tắc này</text>
</svg>
