<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="700" fill="#0f1420" rx="12"/>

<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế Orderflow đằng sau Wick dài (Rejection Block)</text>
<text x="40" y="64" font-size="15" fill="#94a3b8">Stop cluster + limit order tổ chức + hấp thụ = wick tại swing low</text>

<!-- grid -->
<g stroke="#1c2333" stroke-width="1">
<line x1="40" y1="120" x2="1160" y2="120"/>
<line x1="40" y1="220" x2="1160" y2="220"/>
<line x1="40" y1="320" x2="1160" y2="320"/>
<line x1="40" y1="420" x2="1160" y2="420"/>
<line x1="40" y1="520" x2="1160" y2="520"/>
</g>

<!-- price axis labels -->
<text x="45" y="115" font-size="13" fill="#94a3b8">Swing high vùng</text>
<text x="45" y="415" font-size="13" fill="#eab308">Mức thanh khoản (SSL)</text>

<!-- candles leading down to swing -->
<g>
<rect x="150" y="180" width="18" height="60" fill="#22c55e"/>
<line x1="159" y1="165" x2="159" y2="250" stroke="#22c55e" stroke-width="2"/>
<rect x="200" y="230" width="18" height="50" fill="#ef4444"/>
<line x1="209" y1="220" x2="209" y2="290" stroke="#ef4444" stroke-width="2"/>
<rect x="250" y="270" width="18" height="55" fill="#ef4444"/>
<line x1="259" y1="260" x2="259" y2="335" stroke="#ef4444" stroke-width="2"/>
<rect x="300" y="330" width="18" height="45" fill="#ef4444"/>
<line x1="309" y1="320" x2="309" y2="385" stroke="#ef4444" stroke-width="2"/>
</g>

<!-- liquidity level dashed -->
<line x1="40" y1="420" x2="1160" y2="420" stroke="#eab308" stroke-dasharray="6,4" stroke-width="2"/>

<!-- the rejection candle: long wick below -->
<rect x="380" y="370" width="22" height="30" fill="#22c55e"/>
<line x1="391" y1="360" x2="391" y2="500" stroke="#22c55e" stroke-width="2.5"/>

<!-- annotation boxes explaining layers -->
<rect x="440" y="440" width="260" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="455" y="465" font-size="14" fill="#e2e8f0" font-weight="bold">Lớp 1: Stop cluster</text>
<text x="455" y="485" font-size="13" fill="#94a3b8">Stop của Long cũ dưới swing</text>
<text x="455" y="503" font-size="13" fill="#94a3b8">→ kích hoạt market sell dồn dập</text>

<rect x="440" y="540" width="260" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="455" y="565" font-size="14" fill="#e2e8f0" font-weight="bold">Lớp 2: Limit tổ chức</text>
<text x="455" y="585" font-size="13" fill="#94a3b8">Limit buy chờ sẵn tại value area</text>
<text x="455" y="603" font-size="13" fill="#94a3b8">→ hấp thụ toàn bộ market sell</text>

<!-- arrow down to wick extreme then bounce -->
<path d="M 391 400 L 391 495" stroke="#f97316" stroke-width="3" marker-end="url(#arrowOrange)"/>
<path d="M 391 495 L 440 400" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

<defs>
<marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#f97316"/>
</marker>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#38bdf8"/>
</marker>
</defs>

<!-- next candles reversing up -->
<rect x="470" y="330" width="18" height="55" fill="#22c55e"/>
<line x1="479" y1="320" x2="479" y2="395" stroke="#22c55e" stroke-width="2"/>
<rect x="520" y="270" width="18" height="55" fill="#22c55e"/>
<line x1="529" y1="260" x2="529" y2="335" stroke="#22c55e" stroke-width="2"/>
<rect x="570" y="210" width="18" height="55" fill="#22c55e"/>
<line x1="579" y1="200" x2="579" y2="270" stroke="#22c55e" stroke-width="2"/>
<rect x="620" y="150" width="18" height="55" fill="#22c55e"/>
<line x1="629" y1="140" x2="629" y2="210" stroke="#22c55e" stroke-width="2"/>

<!-- RB zone rect -->
<rect x="370" y="380" width="90" height="120" fill="#22c55e" opacity="0.18" stroke="#22c55e" stroke-dasharray="4,3"/>
<text x="700" y="380" font-size="15" fill="#22c55e" font-weight="bold">← Vùng RB (mép body → low wick)</text>

<!-- sweep label -->
<text x="700" y="415" font-size="14" fill="#eab308">Sweep sell-side liquidity</text>
<text x="700" y="435" font-size="14" fill="#f97316">Đâm giá = market sell kích hoạt</text>
<text x="700" y="455" font-size="14" fill="#38bdf8">Bật ngược = limit buy áp đảo</text>

<!-- footer sequence -->
<rect x="40" y="600" width="1120" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="60" y="625" font-size="14" fill="#e2e8f0" font-weight="bold">1 → 2 → 3: Giá tiếp cận swing → đâm qua kích hoạt stop cluster (market sell) → gặp limit tổ chức → hấp thụ → bật ngược</text>
<text x="60" y="650" font-size="13" fill="#94a3b8">Đoạn đường giá đâm xuống rồi bật lại (mũi tên cam→xanh) chính là phần wick mà Rejection Block dùng làm vùng POI.</text>

</svg>
