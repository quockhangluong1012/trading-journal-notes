<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760">
  <rect width="1280" height="760" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">CS-C2. XAUUSD Short phiên Á - gap quá nhỏ, skip đúng (0R)</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Tái dựng minh họa từ mẫu backtest - M15, k-ratio 0.91 dưới ngưỡng 3, đứng ngoài</text>

  <!-- BSL sweep -->
  <line x1="60" y1="150" x2="1220" y2="150" stroke="#b48ead" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="1210" y="143" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#b48ead">BSL 2424</text>

  <g>
    <line x1="110" y1="120" x2="110" y2="170" stroke="#26a69a" stroke-width="2"/>
    <rect x="100" y="130" width="20" height="35" fill="#26a69a" rx="1"/>
    <line x1="160" y1="100" x2="160" y2="150" stroke="#26a69a" stroke-width="2"/>
    <rect x="150" y="110" width="20" height="35" fill="#26a69a" rx="1"/>
  </g>
  <text x="135" y="200" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#b48ead">sweep nhẹ BSL 2424</text>

  <!-- small down move creating tiny gap -->
  <g>
    <line x1="210" y1="180" x2="210" y2="230" stroke="#ef5350" stroke-width="2"/>
    <rect x="200" y="185" width="20" height="35" fill="#ef5350" rx="1"/>
  </g>
  <line x1="270" y1="215" x2="270" y2="270" stroke="#ef5350" stroke-width="2.5"/>
  <rect x="258" y="220" width="24" height="45" fill="#ef5350" rx="1"/>
  <g>
    <line x1="330" y1="255" x2="330" y2="300" stroke="#ef5350" stroke-width="2"/>
    <rect x="320" y="260" width="20" height="35" fill="#ef5350" rx="1"/>
  </g>

  <!-- tiny gap box -->
  <rect x="270" y="235" width="80" height="26" fill="#f2c94c" opacity="0.16" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="252" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">gap 3.2 USD (high 2421.4 / low 2418.2)</text>

  <!-- spread band overlay -->
  <rect x="270" y="238" width="80" height="20" fill="#ff6b6b" opacity="0.25"/>
  <text x="450" y="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff6b6b">spread phiên Á: 3.5 USD (giờ lẻ)</text>

  <rect x="900" y="230" width="300" height="46" rx="8" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="1050" y="259" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">k-ratio = 3.2/3.5 = 0.91</text>

  <!-- choppy price around gap - no trade -->
  <g>
    <line x1="400" y1="235" x2="400" y2="280" stroke="#787b86" stroke-width="2"/>
    <rect x="390" y="240" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="450" y1="245" x2="450" y2="290" stroke="#787b86" stroke-width="2"/>
    <rect x="440" y="250" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="500" y1="230" x2="500" y2="275" stroke="#787b86" stroke-width="2"/>
    <rect x="490" y="235" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="550" y1="240" x2="550" y2="285" stroke="#787b86" stroke-width="2"/>
    <rect x="540" y="245" width="20" height="35" fill="#787b86" rx="1" opacity="0.7"/>
  </g>
  <text x="475" y="330" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">40 phút: giá đập qua lại CE 5 lần, không dứt khoát</text>

  <rect x="330" y="350" width="300" height="42" rx="8" fill="#787b86" opacity="0.14" stroke="#787b86" stroke-width="1.5"/>
  <text x="480" y="376" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">Quyết định: KHÔNG Short (skip)</text>

  <!-- 3 hours later: London real displacement -->
  <line x1="650" y1="200" x2="650" y2="600" stroke="#2a2e39" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="650" y="440" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#787b86">3 giờ sau - London mở cửa</text>

  <g>
    <line x1="720" y1="260" x2="720" y2="310" stroke="#ef5350" stroke-width="2"/>
    <rect x="710" y="265" width="20" height="40" fill="#ef5350" rx="1"/>
  </g>
  <line x1="780" y1="290" x2="780" y2="450" stroke="#ef5350" stroke-width="2.5"/>
  <rect x="766" y="300" width="28" height="140" fill="#ef5350" rx="1"/>
  <text x="780" y="480" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ff6b6b">displacement thật: 14 USD (k=5.4)</text>

  <rect x="850" y="340" width="260" height="46" rx="8" fill="#26a69a" opacity="0.16" stroke="#26a69a" stroke-width="1.5"/>
  <text x="980" y="369" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#26a69a">setup Short hợp lệ xuất hiện</text>

  <rect x="500" y="560" width="280" height="46" rx="8" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="640" y="589" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff6b6b">✓ Kết quả gap nhỏ: 0R (đứng ngoài đúng)</text>

  <text x="640" y="660" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">Nếu vào theo checklist gốc thuần túy (không xét k-ratio) - dễ dính nhiễu bid/ask</text>

  <text x="640" y="720" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem EC-C1 - thêm bước lọc k-ratio &gt;= 3 vào checklist Execution</text>
</svg>
