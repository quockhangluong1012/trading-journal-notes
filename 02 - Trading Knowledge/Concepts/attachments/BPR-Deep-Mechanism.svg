<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế orderflow: BPR = vét sổ lệnh hai lần, hai hướng</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">Limit Order Book bị "ăn" hai lần ngược chiều tại cùng dải giá → dấu vết là hai FVG chồng nhau</text>

  <!-- Step 1 label -->
  <text x="30" y="105" font-size="16" fill="#f97316" font-weight="bold">① Market order bán lớn ăn hết bid depth</text>
  <!-- Order book depth chart step 1 -->
  <g transform="translate(30,120)">
    <rect x="0" y="0" width="330" height="150" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="12" y="20" font-size="13" fill="#94a3b8">Bid depth (mua) trước khi bị ăn</text>
    <rect x="20" y="35" width="60" height="90" fill="#22c55e" opacity="0.25"/>
    <rect x="90" y="55" width="60" height="70" fill="#22c55e" opacity="0.5"/>
    <rect x="160" y="75" width="60" height="50" fill="#ef4444" opacity="0.6"/>
    <rect x="230" y="95" width="60" height="30" fill="#ef4444" opacity="0.3"/>
    <text x="20" y="140" font-size="11" fill="#94a3b8">Bid dày</text>
    <text x="160" y="140" font-size="11" fill="#f97316">Bid mỏng → bị ăn hết</text>
  </g>

  <!-- Candle sequence 1: bearish FVG -->
  <g transform="translate(400,120)">
    <rect x="0" y="0" width="340" height="150" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="12" y="20" font-size="13" fill="#94a3b8">Kết quả: displacement giảm → bearish FVG (SIBI)</text>
    <line x1="40" y1="40" x2="40" y2="60" stroke="#22c55e" stroke-width="2"/>
    <rect x="32" y="40" width="16" height="18" fill="#22c55e"/>
    <line x1="90" y1="45" x2="90" y2="120" stroke="#ef4444" stroke-width="2"/>
    <rect x="82" y="50" width="16" height="60" fill="#ef4444"/>
    <line x1="140" y1="95" x2="140" y2="130" stroke="#ef4444" stroke-width="2"/>
    <rect x="132" y="100" width="16" height="20" fill="#ef4444"/>
    <rect x="48" y="58" width="86" height="42" fill="#ef4444" opacity="0.22"/>
    <text x="52" y="135" font-size="12" fill="#e2e8f0">SIBI 21418–21424</text>
  </g>

  <!-- Arrow down -->
  <text x="600" y="300" font-size="20" fill="#94a3b8" text-anchor="middle">↓ giá tạo đáy phản ứng — bid mới đặt lại tại vùng vừa bị ăn</text>

  <!-- Step 2 label -->
  <text x="30" y="345" font-size="16" fill="#38bdf8" font-weight="bold">② Market order mua lớn đảo hướng, ăn hết ask depth đúng dải đó</text>
  <g transform="translate(30,360)">
    <rect x="0" y="0" width="330" height="150" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="12" y="20" font-size="13" fill="#94a3b8">Ask depth (bán) tại cùng dải giá</text>
    <rect x="20" y="35" width="60" height="90" fill="#ef4444" opacity="0.25"/>
    <rect x="90" y="55" width="60" height="70" fill="#ef4444" opacity="0.5"/>
    <rect x="160" y="75" width="60" height="50" fill="#22c55e" opacity="0.6"/>
    <rect x="230" y="95" width="60" height="30" fill="#22c55e" opacity="0.3"/>
    <text x="160" y="140" font-size="11" fill="#38bdf8">Ask mỏng → bị ăn hết</text>
  </g>

  <g transform="translate(400,360)">
    <rect x="0" y="0" width="340" height="150" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="12" y="20" font-size="13" fill="#94a3b8">Kết quả: displacement tăng → bullish FVG (BISI)</text>
    <line x1="40" y1="120" x2="40" y2="140" stroke="#ef4444" stroke-width="2"/>
    <rect x="32" y="120" width="16" height="18" fill="#ef4444"/>
    <line x1="90" y1="40" x2="90" y2="115" stroke="#22c55e" stroke-width="2"/>
    <rect x="82" y="45" width="16" height="60" fill="#22c55e"/>
    <line x1="140" y1="20" x2="140" y2="55" stroke="#22c55e" stroke-width="2"/>
    <rect x="132" y="25" width="16" height="20" fill="#22c55e"/>
    <rect x="48" y="45" width="86" height="42" fill="#22c55e" opacity="0.22"/>
    <text x="52" y="135" font-size="12" fill="#e2e8f0">BISI 21412–21421</text>
  </g>

  <!-- Result panel -->
  <g transform="translate(790,120)">
    <rect x="0" y="0" width="380" height="390" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="16" y="28" font-size="17" fill="#e2e8f0" font-weight="bold">③ Kết quả: sổ lệnh bị dọn sạch 2 lần</text>
    <rect x="16" y="45" width="348" height="70" fill="#a78bfa" opacity="0.2" stroke="#a78bfa"/>
    <text x="24" y="65" font-size="13" fill="#e2e8f0">Overlap (BPR) = 21418–21421</text>
    <text x="24" y="83" font-size="13" fill="#e2e8f0">CE = 21419.5</text>
    <text x="24" y="101" font-size="12" fill="#94a3b8">Vùng này gần như trống limit order cũ</text>

    <text x="16" y="140" font-size="14" fill="#eab308" font-weight="bold">Vì sao CE phản ứng sắc bén:</text>
    <text x="16" y="163" font-size="13" fill="#94a3b8">Market maker phải RE-QUOTE toàn bộ</text>
    <text x="16" y="181" font-size="13" fill="#94a3b8">vùng dựa trên đợt lệnh mới nhất khi</text>
    <text x="16" y="199" font-size="13" fill="#94a3b8">giá quay lại — không còn limit cũ</text>
    <text x="16" y="217" font-size="13" fill="#94a3b8">nào chặn ở giữa dải.</text>

    <text x="16" y="255" font-size="14" fill="#38bdf8" font-weight="bold">Đối chiếu khung khác:</text>
    <text x="16" y="278" font-size="12" fill="#94a3b8">• AMT: BPR = low-volume node kẹp</text>
    <text x="16" y="295" font-size="12" fill="#94a3b8">  giữa 2 high-volume node ngược chiều</text>
    <text x="16" y="313" font-size="12" fill="#94a3b8">• Wyckoff: Spring → Sign of Strength</text>
    <text x="16" y="331" font-size="12" fill="#94a3b8">• Footprint: stacked imbalance đảo</text>
    <text x="16" y="349" font-size="12" fill="#94a3b8">  hướng tại đúng dải giá (delta lệch)</text>

    <text x="16" y="378" font-size="12" fill="#94a3b8" font-style="italic">Proxy OHLC đúng hướng, có thể sai độ lớn</text>
  </g>

  <text x="30" y="720" font-size="13" fill="#94a3b8" font-style="italic">BPR không phải "hình học đẹp" — là dấu vết hai lần vét sổ lệnh ngược hướng tại cùng dải giá, buộc re-quote khi retest.</text>
</svg>
