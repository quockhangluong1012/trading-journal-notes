<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#d1d4dc">BOS giả quanh futures rollover/settlement 17:00-18:00 ET — volume mỏng</text>
<text x="40" y="70" font-size="15" fill="#787b86">ES M15 — cú "phá swing" trong giờ giao ca hợp đồng, không có order flow thật đứng sau</text>

<!-- time bands -->
<rect x="60" y="100" width="1160" height="26" fill="#131722"/>
<rect x="60" y="100" width="420" height="26" fill="#4a90d9" opacity="0.14"/>
<text x="70" y="118" font-size="13" fill="#4a90d9">NY PM 15:00-17:00 ET (thanh khoản bình thường)</text>
<rect x="480" y="100" width="260" height="26" fill="#ff6b6b" opacity="0.16"/>
<text x="490" y="118" font-size="13" fill="#ff6b6b">Rollover/settlement 17:00-18:00 ET</text>
<rect x="740" y="100" width="480" height="26" fill="#4a90d9" opacity="0.14"/>
<text x="750" y="118" font-size="13" fill="#4a90d9">Globex mở lại, thanh khoản phục hồi</text>

<!-- swing high reference -->
<line x1="60" y1="330" x2="1220" y2="330" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1080" y="323" font-size="12" fill="#f2c94c">Swing High = 4512.50</text>

<!-- normal uptrend before rollover -->
<g>
<line x1="120" y1="400" x2="120" y2="470" stroke="#26a69a" stroke-width="1.8"/>
<rect x="108" y="410" width="24" height="55" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="170" y1="360" x2="170" y2="430" stroke="#26a69a" stroke-width="1.8"/>
<rect x="158" y="370" width="24" height="55" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="220" y1="330" x2="220" y2="395" stroke="#26a69a" stroke-width="1.8"/>
<rect x="208" y="340" width="24" height="50" fill="#26a69a" rx="1"/>
</g>

<!-- rollover candles: thin body, wide wicks, low volume -->
<g>
<line x1="540" y1="260" x2="540" y2="400" stroke="#26a69a" stroke-width="1.3"/>
<rect x="530" y="320" width="18" height="18" fill="#26a69a" rx="1" opacity="0.7"/>
</g>
<circle cx="540" cy="262" r="4" fill="#f2c94c"/>
<text x="500" y="248" font-size="12" fill="#f2c94c">Wick chạm 4514 rồi rút — thân nến bé tí</text>

<g>
<line x1="590" y1="280" x2="590" y2="410" stroke="#787b86" stroke-width="1.3"/>
<rect x="580" y="335" width="18" height="20" fill="#787b86" rx="1" opacity="0.6"/>
</g>
<g>
<line x1="640" y1="290" x2="640" y2="420" stroke="#ef5350" stroke-width="1.3"/>
<rect x="630" y="330" width="18" height="35" fill="#ef5350" rx="1" opacity="0.7"/>
</g>

<!-- volume bars beneath, showing thin volume during rollover window -->
<rect x="60" y="560" width="1160" height="100" fill="#131722" stroke="#2a2e39"/>
<text x="70" y="580" font-size="12" fill="#787b86">Volume M15</text>
<rect x="108" y="610" width="24" height="40" fill="#4a90d9" opacity="0.6"/>
<rect x="158" y="600" width="24" height="50" fill="#4a90d9" opacity="0.6"/>
<rect x="208" y="605" width="24" height="45" fill="#4a90d9" opacity="0.6"/>
<rect x="530" y="642" width="18" height="8" fill="#ff6b6b" opacity="0.7"/>
<rect x="580" y="644" width="18" height="6" fill="#ff6b6b" opacity="0.7"/>
<rect x="630" y="640" width="18" height="10" fill="#ff6b6b" opacity="0.7"/>
<text x="520" y="665" font-size="11" fill="#ff6b6b">Volume tụt còn ~12% trung bình</text>
<rect x="850" y="595" width="24" height="55" fill="#4a90d9" opacity="0.6"/>
<rect x="900" y="590" width="24" height="60" fill="#4a90d9" opacity="0.6"/>
<rect x="950" y="600" width="24" height="50" fill="#4a90d9" opacity="0.6"/>
<text x="850" y="580" font-size="11" fill="#4a90d9">Volume phục hồi sau Globex mở</text>

<!-- reclaim after globex opens: real BOS forms later -->
<g>
<line x1="900" y1="300" x2="900" y2="380" stroke="#26a69a" stroke-width="1.8"/>
<rect x="888" y="315" width="24" height="55" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="950" y1="250" x2="950" y2="330" stroke="#26a69a" stroke-width="1.8"/>
<rect x="938" y="270" width="24" height="55" fill="#26a69a" rx="1"/>
</g>
<circle cx="950" cy="253" r="5" fill="#f2c94c"/>
<text x="880" y="235" font-size="12" fill="#f2c94c">BOS thật: đóng thân 4516, volume bình thường</text>

<line x1="60" y1="200" x2="1220" y2="200" stroke="#2a2e39"/>
<text x="60" y="185" font-size="14" fill="#d1d4dc">Trong 17:00-18:00 ET, CME chuyển sổ lệnh giữa các hợp đồng tháng — thanh khoản rút gần hết trong 15-20 phút.</text>
</svg>
