<text x="568" y="155" font-size="10" fill="#15803D">khung entry (M5).</text>
<line x1="560" y1="168" x2="722" y2="168" stroke="#E5E7EB"/>
<text x="560" y="188" font-size="10" fill="#374151">TARGET (nơi đi tới):</text>
