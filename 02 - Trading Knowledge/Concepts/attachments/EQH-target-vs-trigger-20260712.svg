<text x="568" y="217" font-size="10" fill="#1D4ED8">— unfinished business,</text>
<text x="568" y="231" font-size="10" fill="#1D4ED8">KHÔNG phải điều kiện vào.</text>
<line x1="560" y1="244" x2="722" y2="244" stroke="#E5E7EB"/>
<text x="560" y="264" font-size="10.5" font-weight="700" fill="#B91C1C">Lỗi scale mismatch:</text>
<text x="560" y="280" font-size="10" fill="#374151">"phải quét EQH mới short"</text>
<text x="560" y="294" font-size="10" fill="#374151">→ giá đảo ngay từ OB,</text>
<text x="560" y="308" font-size="10" fill="#374151">không lên EQH → bỏ lỡ.</text>
<text x="560" y="330" font-size="10" fill="#374151">Tệ hơn: nếu giá THẬT lên</text>
<text x="560" y="344" font-size="10" fill="#374151">quét EQH, OB đã hỏng →</text>
<text x="560" y="358" font-size="10" fill="#374151">đòi hỏi đó tự mâu thuẫn.</text>
<rect x="556" y="374" width="174" height="66" rx="6" fill="#FEF9C3"/>
<text x="564" y="393" font-size="9.5" font-weight="700" fill="#92400E">Quy tắc:</text>
