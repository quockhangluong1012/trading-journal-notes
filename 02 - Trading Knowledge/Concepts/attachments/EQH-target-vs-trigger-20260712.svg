<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1F2937">Case tham chiếu — GBPUSD Short: EQH = TARGET, sweep trên OB = TRIGGER</text>
<text x="24" y="52" font-size="12" fill="#6B7280">Bias D1 giảm · POI = OB H1 premium 1.75360–1.74360 · EQH (4 đỉnh) phía trên = bể BSL / draw, KHÔNG cần quét để vào lệnh</text>
<rect x="24" y="66" width="510" height="386" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
