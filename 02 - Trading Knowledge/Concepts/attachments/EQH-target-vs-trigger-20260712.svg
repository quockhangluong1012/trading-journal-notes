<!-- price path -->
<path d="M60,372 L92,330 L120,300 L150,246 L172,208 L190,172 L202,156 L214,182 L230,208 L252,262 L272,300 L292,330 L308,318 L326,266 L344,232 L360,224 L376,232 L396,286 L416,340 L440,378 L470,406"
