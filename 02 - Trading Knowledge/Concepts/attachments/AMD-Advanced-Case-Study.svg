<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="42" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study — AMD fractal thất bại: XAUUSD "AMD trong AMD"</text>
  <text x="40" y="66" font-size="15" fill="#94a3b8">Thứ Năm 05/03, phân phối H1 đẹp bị nuốt bởi Judas thứ hai ở khung M15 lồng trong nó</text>

  <line x1="60" y1="700" x2="1150" y2="700" stroke="#334155" stroke-width="2"/>
  <text x="70" y="722" font-size="13" fill="#94a3b8">08:30 NY (CPI)</text>
  <text x="330" y="722" font-size="13" fill="#94a3b8">09:00</text>
  <text x="560" y="722" font-size="13" fill="#94a3b8">09:35 — MSS H1 bullish</text>
  <text x="880" y="722" font-size="13" fill="#94a3b8">10:15 — Judas M15 lồng trong</text>

  <!-- price reference: daily open -->
  <line x1="60" y1="480" x2="1150" y2="480" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1075" y="473" font-size="13" fill="#eab308">Daily Open 2,382.0</text>

  <!-- CPI spike down = Judas H1 -->
  <g>
    <rect x="100" y="470" width="16" height="20" fill="#ef4444"/>
    <line x1="108" y1="462" x2="108" y2="500" stroke="#ef4444" stroke-width="2"/>
    <rect x="130" y="490" width="16" height="35" fill="#ef4444"/>
    <line x1="138" y1="480" x2="138" y2="535" stroke="#ef4444" stroke-width="2"/>
    <rect x="160" y="520" width="16" height="25" fill="#ef4444"/>
    <line x1="168" y1="510" x2="168" y2="555" stroke="#ef4444" stroke-width="2"/>
  </g>
  <line x1="90" y1="555" x2="220" y2="555" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="90" y="573" font-size="12" fill="#f97316">Judas H1 quét SSL 2,374.5 sau CPI</text>

  <!-- H1 MSS + displacement up (looks like distribution) -->
  <g>
    <rect x="250" y="500" width="16" height="25" fill="#22c55e"/>
    <line x1="258" y1="490" x2="258" y2="530" stroke="#22c55e" stroke-width="2"/>
    <rect x="290" y="460" width="16" height="30" fill="#22c55e"/>
    <line x1="298" y1="448" x2="298" y2="495" stroke="#22c55e" stroke-width="2"/>
    <rect x="330" y="420" width="16" height="35" fill="#22c55e"/>
    <line x1="338" y1="408" x2="338" y2="460" stroke="#22c55e" stroke-width="2"/>
    <rect x="370" y="390" width="16" height="30" fill="#22c55e"/>
    <line x1="378" y1="378" x2="378" y2="425" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="250" y="370" font-size="13" fill="#22c55e" font-weight="bold">MSS bullish H1 + FVG</text>
  <text x="250" y="388" font-size="12" fill="#94a3b8">trông giống early distribution sách giáo khoa</text>

  <!-- Entry marker -->
  <circle cx="395" cy="405" r="7" fill="#38bdf8"/>
  <text x="405" y="402" font-size="13" fill="#38bdf8">Entry Long 2,381.0 (FVG H1)</text>
  <line x1="60" y1="555" x2="1150" y2="555" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="405" y="420" font-size="12" fill="#94a3b8">Stop 2,373.0 (dưới Judas H1)</text>

  <!-- consolidation then M15 Judas nested -->
  <g>
    <rect x="440" y="390" width="14" height="18" fill="#22c55e"/>
    <line x1="447" y1="382" x2="447" y2="412" stroke="#22c55e" stroke-width="2"/>
    <rect x="465" y="395" width="14" height="16" fill="#ef4444"/>
    <line x1="472" y1="387" x2="472" y2="418" stroke="#ef4444" stroke-width="2"/>
    <rect x="490" y="392" width="14" height="18" fill="#22c55e"/>
    <line x1="497" y1="384" x2="497" y2="416" stroke="#22c55e" stroke-width="2"/>
  </g>
  <rect x="435" y="370" width="90" height="55" fill="#f97316" opacity="0.12"/>
  <text x="440" y="450" font-size="12" fill="#94a3b8">Range M15 nhỏ hình thành ngay trong nhịp phân phối</text>

  <!-- nested Judas M15 sweeping the H1 FVG / entry stop zone -->
  <g>
    <rect x="900" y="410" width="16" height="30" fill="#ef4444"/>
    <line x1="908" y1="400" x2="908" y2="450" stroke="#ef4444" stroke-width="2"/>
    <rect x="930" y="440" width="16" height="45" fill="#ef4444"/>
    <line x1="938" y1="430" x2="938" y2="495" stroke="#ef4444" stroke-width="2"/>
    <rect x="960" y="480" width="16" height="65" fill="#ef4444"/>
    <line x1="968" y1="470" x2="968" y2="555" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="900" y="595" font-size="13" fill="#ef4444" font-weight="bold">Judas M15 lồng trong — quét luôn 2,373.0</text>
  <text x="900" y="612" font-size="12" fill="#94a3b8">Stop bị chạm 10:22 NY, giá "hụt" đúng entry cũ</text>
  <line x1="895" y1="555" x2="985" y2="555" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- true distribution after nested sweep -->
  <g>
    <rect x="1010" y="460" width="16" height="30" fill="#22c55e"/>
    <line x1="1018" y1="448" x2="1018" y2="495" stroke="#22c55e" stroke-width="2"/>
    <rect x="1045" y="410" width="16" height="35" fill="#22c55e"/>
    <line x1="1053" y1="398" x2="1053" y2="450" stroke="#22c55e" stroke-width="2"/>
    <rect x="1080" y="360" width="16" height="35" fill="#22c55e"/>
    <line x1="1088" y1="348" x2="1088" y2="400" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="1000" y="330" font-size="9.4" fill="#94a3b8">Giá tiếp tục lên đúng hướng — không có mình</text>

  <!-- Result box -->
  <rect x="700" y="80" width="440" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="715" y="105" font-size="14" fill="#e2e8f0" font-weight="bold">Kết quả bằng số</text>
  <text x="715" y="126" font-size="13" fill="#94a3b8">Entry 2,381.0 → Stop 2,373.0 (−80 pip/8.0 USD)</text>
  <text x="715" y="144" font-size="13" fill="#94a3b8">Risk 1R = 800 USD/lot chuẩn XAUUSD</text>
  <text x="715" y="162" font-size="13" fill="#94a3b8">Kết quả: −1R, giá sau đó chạy lên 2,410 (+29 pip)</text>
  <text x="715" y="180" font-size="13" fill="#94a3b8">mà không có lệnh nào tham gia được</text>
  <text x="715" y="198" font-size="13" fill="#eab308">Bài học: MSS H1 vẫn có thể là Judas ở cấp M15</text>
</svg>