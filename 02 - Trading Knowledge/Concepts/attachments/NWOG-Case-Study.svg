<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="700" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: EURUSD Long tại CE NWOG — London KZ Thứ Hai (+1.83R)</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Friday Close 1.0920 → Sunday Open 1.0894, NWOG gap-down, CE = 1.0907, bias D1 bullish</text>

<!-- price axis -->
<text x="1075" y="120" font-size="13" fill="#94a3b8">1.0920</text>
<text x="1075" y="230" font-size="13" fill="#38bdf8">1.0907 CE</text>
<text x="1075" y="330" font-size="13" fill="#94a3b8">1.0894</text>
<text x="1075" y="380" font-size="13" fill="#ef4444">1.0886 SL</text>

<!-- NWOG zone -->
<rect x="60" y="150" width="1000" height="180" fill="#ef4444" opacity="0.10"/>
<line x1="60" y1="150" x2="1060" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="60" y1="330" x2="1060" y2="330" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="60" y1="240" x2="1060" y2="240" stroke="#38bdf8" stroke-width="2"/>

<!-- Friday/weekend label -->
<text x="90" y="140" font-size="13" fill="#94a3b8">Friday Close 1.0920 (cạnh trên NWOG)</text>
<text x="90" y="350" font-size="13" fill="#94a3b8">Sunday Open 1.0894 (cạnh dưới NWOG)</text>

<!-- Asian session Monday candles small range -->
<rect x="120" y="300" width="14" height="15" fill="#ef4444"/><line x1="127" y1="292" x2="127" y2="322" stroke="#ef4444" stroke-width="2"/>
<rect x="150" y="298" width="14" height="14" fill="#22c55e"/><line x1="157" y1="290" x2="157" y2="318" stroke="#22c55e" stroke-width="2"/>
<rect x="180" y="302" width="14" height="16" fill="#ef4444"/><line x1="187" y1="294" x2="187" y2="325" stroke="#ef4444" stroke-width="2"/>
<text x="100" y="280" font-size="12" fill="#94a3b8">Phiên Á Thứ Hai: dao động hẹp 1.0895-1.0905</text>

<!-- London sweep candle -->
<rect x="260" y="310" width="18" height="20" fill="#ef4444"/>
<line x1="269" y1="298" x2="269" y2="345" stroke="#ef4444" stroke-width="2"/>
<circle cx="269" cy="340" r="5" fill="#f97316"/>
<text x="220" y="400" font-size="13" fill="#f97316" font-weight="bold">① 02:10 ET sweep đáy phiên Á</text>
<text x="220" y="418" font-size="12" fill="#94a3b8">1.0891, wick dài M15</text>

<!-- MSS + FVG -->
<rect x="310" y="285" width="18" height="30" fill="#22c55e"/><line x1="319" y1="275" x2="319" y2="322" stroke="#22c55e" stroke-width="2"/>
<rect x="350" y="270" width="18" height="28" fill="#22c55e"/><line x1="359" y1="260" x2="359" y2="305" stroke="#22c55e" stroke-width="2"/>
<rect x="320" y="290" width="55" height="15" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-dasharray="2,2"/>
<text x="300" y="440" font-size="13" fill="#22c55e" font-weight="bold">② 02:25 ET MSS tăng + FVG 1.0896-1.0900</text>

<!-- entry + SL -->
<line x1="380" y1="297" x2="1060" y2="297" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
<text x="385" y="290" font-size="13" fill="#38bdf8" font-weight="bold">③ Entry 1.0898</text>
<line x1="380" y1="360" x2="1060" y2="360" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
<text x="385" y="378" font-size="12" fill="#ef4444">SL 1.0886</text>

<!-- path to TP1 -->
<rect x="400" y="255" width="16" height="25" fill="#22c55e"/><line x1="408" y1="245" x2="408" y2="285" stroke="#22c55e" stroke-width="2"/>
<rect x="440" y="245" width="16" height="20" fill="#22c55e"/><line x1="448" y1="235" x2="448" y2="270" stroke="#22c55e" stroke-width="2"/>
<text x="460" y="235" font-size="12" fill="#a78bfa" font-weight="bold">④ 03:40 ET TP1 CE 1.0907</text>

<!-- path to TP2 -->
<rect x="600" y="200" width="16" height="25" fill="#22c55e"/><line x1="608" y1="190" x2="608" y2="230" stroke="#22c55e" stroke-width="2"/>
<rect x="700" y="175" width="16" height="25" fill="#22c55e"/><line x1="708" y1="165" x2="708" y2="205" stroke="#22c55e" stroke-width="2"/>
<rect x="820" y="150" width="16" height="20" fill="#22c55e"/><line x1="828" y1="140" x2="828" y2="175" stroke="#22c55e" stroke-width="2"/>
<line x1="900" y1="150" x2="1010" y2="150" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,3"/>
<text x="850" y="140" font-size="13" fill="#a78bfa" font-weight="bold">⑤ 07:15 ET TP2 1.0920 (cạnh trên NWOG)</text>

<!-- result box -->
<rect x="60" y="460" width="1080" height="210" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="80" y="490" font-size="16" fill="#e2e8f0" font-weight="bold">Kết quả bằng số</text>
<text x="80" y="518" font-size="14" fill="#94a3b8">Risk: 1.0898 − 1.0886 = 12 pip</text>
<text x="80" y="542" font-size="14" fill="#94a3b8">Reward tới TP2: 1.0920 − 1.0898 = 22 pip</text>
<text x="80" y="566" font-size="14" fill="#22c55e" font-weight="bold">R-multiple ≈ +1.83R | 1 lot chuẩn × 10 USD/pip → lãi 220 USD (risk 120 USD)</text>
<text x="80" y="600" font-size="14" fill="#eab308" font-weight="bold">Bài học: NWOG hiệu quả nhờ thanh khoản đầu tuần cực mỏng khiến sweep "dễ" xảy ra hơn —</text>
<text x="80" y="622" font-size="14" fill="#eab308" font-weight="bold">không phải vì thị trường "cố tình" nhắm vào NWOG.</text>
</svg>
