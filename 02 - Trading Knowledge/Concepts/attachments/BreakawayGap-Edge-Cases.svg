<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Cases đắt giá nhất: Breakaway vs Common Gap real-time, và Friday Squaring</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">Hai bẫy phổ biến nhất khi phân loại gap ngay tại thời điểm nó xảy ra</text>

  <!-- LEFT: real-time distinguishing -->
  <g transform="translate(40,100)">
    <rect x="0" y="0" width="520" height="580" fill="#1e293b" opacity="0.3" stroke="#334155" rx="8"/>
    <text x="16" y="30" font-size="18" fill="#e2e8f0" font-weight="bold">16.1 Breakaway vs Common Gap — real-time</text>

    <g stroke="#1c2333"><line x1="16" y1="120" x2="500" y2="120"/><line x1="16" y1="200" x2="500" y2="200"/></g>
    <!-- looks the same at t=0 -->
    <rect x="60" y="150" width="16" height="45" fill="#22c55e"/><line x1="68" y1="140" x2="68" y2="200" stroke="#22c55e" stroke-width="2"/>
    <text x="40" y="230" font-size="13" fill="#94a3b8" font-weight="bold">t=0: giống nhau 100% về hình dạng OHLC</text>
    <text x="40" y="248" font-size="12" fill="#94a3b8">Không chỉ báo nào phân biệt được ngay lúc này</text>

    <rect x="16" y="270" width="488" height="290" fill="#0f1420" stroke="#334155" rx="6"/>
    <text x="30" y="295" font-size="14" fill="#e2e8f0" font-weight="bold">4 tiêu chí real-time (không cần hindsight):</text>
    <text x="30" y="320" font-size="12" fill="#94a3b8">1. Tích lũy ≥10-15 nến rõ ràng NGAY TRƯỚC gap?</text>
    <text x="30" y="340" font-size="12" fill="#94a3b8">2. Volume/tốc độ vượt trội so với 20 nến gần nhất?</text>
    <text x="30" y="360" font-size="12" fill="#94a3b8">3. Retest đầu tiên: thân nến giữ ngoài gap</text>
    <text x="42" y="378" font-size="12" fill="#94a3b8">(không xuyên quá 50%)?</text>
    <text x="30" y="398" font-size="12" fill="#94a3b8">4. Có draw on liquidity rõ ràng ở HTF phía trước?</text>
    <rect x="30" y="415" width="440" height="55" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-dasharray="3,2"/>
    <text x="40" y="435" font-size="12" fill="#a78bfa" font-weight="bold">Không gọi tên ngay — chờ tiêu chí 3 (retest)</text>
    <text x="40" y="453" font-size="12" fill="#a78bfa">trước khi tăng size hoặc tin tưởng cao</text>
    <text x="30" y="500" font-size="12" fill="#94a3b8">Common gap thường: thiếu tích lũy trước,</text>
    <text x="30" y="518" font-size="12" fill="#94a3b8">retest xuyên >70% ngay lần đầu, không có target rõ</text>
  </g>

  <!-- RIGHT: Friday squaring -->
  <g transform="translate(600,100)">
    <rect x="0" y="0" width="520" height="580" fill="#1e293b" opacity="0.3" stroke="#334155" rx="8"/>
    <text x="16" y="30" font-size="18" fill="#e2e8f0" font-weight="bold">16.2 Friday Squaring "giả trang" breakaway</text>

    <g stroke="#1c2333"><line x1="16" y1="150" x2="500" y2="150"/><line x1="16" y1="230" x2="500" y2="230"/></g>
    <!-- Friday close, position squaring -->
    <rect x="40" y="190" width="14" height="30" fill="#94a3b8" opacity="0.5"/>
    <rect x="70" y="140" width="14" height="60" fill="#f97316" opacity="0.6"/><line x1="77" y1="125" x2="77" y2="210" stroke="#f97316" stroke-width="2"/>
    <text x="20" y="270" font-size="12" fill="#f97316" font-weight="bold">Thứ Sáu cuối phiên: position squaring</text>
    <text x="20" y="288" font-size="12" fill="#94a3b8">(chốt lời/cắt lỗ kỹ thuật, KHÔNG phải dòng</text>
    <text x="20" y="306" font-size="12" fill="#94a3b8">tiền định hướng thật)</text>

    <!-- weekend gap -->
    <rect x="110" y="80" width="180" height="90" fill="#eab308" opacity="0.1" stroke="#eab308" stroke-dasharray="4,3"/>
    <text x="115" y="70" font-size="12" fill="#eab308">gap cuối tuần "trông to" nhưng phần lớn</text>
    <text x="115" y="55" font-size="12" fill="#eab308">là khoảng không giao dịch, không phải lực thật</text>

    <!-- Monday open -->
    <rect x="300" y="60" width="14" height="45" fill="#22c55e"/><line x1="307" y1="45" x2="307" y2="110" stroke="#22c55e" stroke-width="2"/>
    <text x="290" y="30" font-size="12" fill="#94a3b8">Thứ Hai mở — nhìn tổng thể giống breakaway</text>

    <rect x="16" y="340" width="488" height="220" fill="#0f1420" stroke="#334155" rx="6"/>
    <text x="30" y="365" font-size="14" fill="#e2e8f0" font-weight="bold">Vì sao bẫy được:</text>
    <text x="30" y="386" font-size="12" fill="#94a3b8">Khoảng cách giá qua 2.5 ngày nghỉ luôn "trông to"</text>
    <text x="30" y="404" font-size="12" fill="#94a3b8">→ dễ nhầm độ lớn tuyệt đối với độ mạnh thật</text>
    <text x="30" y="430" font-size="14" fill="#e2e8f0" font-weight="bold">Nhận diện sớm:</text>
    <text x="30" y="451" font-size="12" fill="#94a3b8">Đo riêng phần displacement TRONG giờ thứ Sáu,</text>
    <text x="30" y="469" font-size="12" fill="#94a3b8">tách khỏi phần gap qua đêm cuối tuần</text>
    <text x="30" y="495" font-size="14" fill="#e2e8f0" font-weight="bold">Xử lý:</text>
    <text x="30" y="516" font-size="12" fill="#94a3b8">Chờ ít nhất nửa phiên thứ Hai (London/NY mở)</text>
    <text x="30" y="534" font-size="12" fill="#94a3b8">để xác nhận dòng tiền thật, trước khi tin gap này</text>
  </g>
</svg>
