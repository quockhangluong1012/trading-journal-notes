<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="450" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Nhiều FVG chồng nhau — nên tin CE của cái nào?</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Khi một leg để lại 2–3 FVG chồng lấn, mỗi cái có CE riêng. Đừng bình quân mù — chọn theo tính hợp lệ &amp; HTF.</text>

  <rect x="24" y="68" width="470" height="366" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- price axis feel: three stacked bullish FVGs on a rising leg -->
  <!-- dealing range equilibrium -->
  <line x1="40" y1="250" x2="478" y2="250" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="360" y="245" font-size="9.5" fill="#7C3AED">Equilibrium dealing range HTF</text>

  <!-- FVG 1 (highest, freshest, top) -->
  <rect x="120" y="120" width="300" height="34" fill="#16A34A" opacity="0.16"/>
  <line x1="120" y1="137" x2="420" y2="137" stroke="#166534" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="424" y="130" font-size="9" fill="#166534">FVG-1 (mới nhất) CE</text>
  <text x="126" y="115" font-size="9" fill="#166534">FVG-1</text>

  <!-- FVG 2 (middle, overlaps EQ) -->
  <rect x="120" y="228" width="300" height="46" fill="#16A34A" opacity="0.16"/>
  <line x1="120" y1="251" x2="420" y2="251" stroke="#166534" stroke-width="1.6"/>
  <text x="424" y="256" font-size="9" font-weight="700" fill="#166534">FVG-2 CE ≈ Equilibrium ★</text>
  <text x="126" y="223" font-size="9" fill="#166534">FVG-2</text>

  <!-- FVG 3 (lowest, partially mitigated) -->
  <rect x="120" y="330" width="300" height="34" fill="#9CA3AF" opacity="0.28"/>
  <line x1="120" y1="347" x2="300" y2="347" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="126" y="325" font-size="9" fill="#6B7280">FVG-3 (đã bị test 1 phần → yếu)</text>
  <text x="308" y="351" font-size="9" fill="#6B7280">CE FVG-3 (kém tin)</text>

  <!-- retrace path touching FVG-2 CE -->
  <path d="M60,140 L100,175 L140,150 L200,205 L250,251 L300,235" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="250" cy="251" r="5" fill="#16A34A"/>
  <text x="150" y="290" font-size="9.5" font-weight="700" fill="#166534">Entry: CE FVG-2 (trùng equilibrium)</text>

  <!-- decision panel -->
  <rect x="510" y="68" width="226" height="366" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="510" y="68" width="226" height="30" rx="8" fill="#EDE9FE"/>
  <text x="524" y="88" font-size="12" font-weight="800" fill="#5B21B6">Ưu tiên chọn CE</text>
  <text x="524" y="122" font-size="10.5" fill="#374151">1. CE trùng HTF equilibrium /</text>
  <text x="524" y="137" font-size="10.5" fill="#374151">   OTE / OB → tin nhất</text>
  <text x="524" y="164" font-size="10.5" fill="#374151">2. CE của FVG còn</text>
  <text x="524" y="179" font-size="10.5" fill="#374151">   unmitigated (chưa test)</text>
  <text x="524" y="206" font-size="10.5" fill="#374151">3. FVG mới nhất trong leg</text>
  <text x="524" y="221" font-size="10.5" fill="#374151">   thường ưu tiên hơn cũ</text>
  <text x="524" y="248" font-size="10.5" fill="#B91C1C">✗ FVG đã bị test 1 phần</text>
  <text x="524" y="263" font-size="10.5" fill="#B91C1C">   → CE bị "ăn mòn", bỏ</text>
  <text x="524" y="290" font-size="10.5" fill="#B91C1C">✗ Đừng bình quân CE của</text>
  <text x="524" y="305" font-size="10.5" fill="#B91C1C">   nhiều gap thành 1 điểm ảo</text>
  <line x1="524" y1="322" x2="722" y2="322" stroke="#E5E7EB"/>
  <text x="524" y="346" font-size="10" fill="#6B7280">Mẹo: nếu 2 FVG rất gần</text>
  <text x="524" y="360" font-size="10" fill="#6B7280">nhau, coi cả cụm là một</text>
  <text x="524" y="374" font-size="10" fill="#6B7280">"consolidated array" và</text>
  <text x="524" y="388" font-size="10" fill="#6B7280">lấy CE của toàn vùng —</text>
  <text x="524" y="402" font-size="10" fill="#6B7280">nhưng chỉ khi chúng</text>
  <text x="524" y="416" font-size="10" fill="#6B7280">thực sự overlap liền mạch.</text>
</svg>
