<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="450" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Case study EURUSD — lệch pha Tuần/Ngày: cú giảm Thứ 2 là Judas của TUẦN</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Weekly bias bullish. Thứ 2 giảm quét dưới Weekly Open → không phải "ngày bearish" mà là manipulation của tuần.</text>

  <rect x="24" y="66" width="712" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- weekday bands -->
  <g font-size="10" fill="#6B7280">
    <line x1="160" y1="80" x2="160" y2="352" stroke="#EEF0F4"/>
    <line x1="290" y1="80" x2="290" y2="352" stroke="#EEF0F4"/>
    <line x1="430" y1="80" x2="430" y2="352" stroke="#EEF0F4"/>
    <line x1="570" y1="80" x2="570" y2="352" stroke="#EEF0F4"/>
    <text x="85" y="346">Thứ 2</text>
    <text x="210" y="346">Thứ 3</text>
    <text x="345" y="346">Thứ 4</text>
    <text x="485" y="346">Thứ 5</text>
    <text x="625" y="346">Thứ 6</text>
  </g>

  <!-- weekly open line -->
  <line x1="40" y1="210" x2="720" y2="210" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="44" y="205" font-size="9" fill="#6B7280">Weekly Open</text>

  <!-- Monday: dip below weekly open = weekly Judas -->
  <path d="M55,205 L80,235 L100,225 L125,270 L150,255" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <circle cx="125" cy="270" r="5" fill="#DC2626"/>
  <text x="46" y="292" font-size="9.5" font-weight="700" fill="#B91C1C">Thứ 2: quét dưới Weekly Open</text>
  <text x="46" y="304" font-size="8.5" fill="#B91C1C">(Judas TUẦN — SSL bị lấy)</text>
  <!-- trap label -->
  <text x="150" y="245" font-size="9" fill="#92400E">Trader short "vì ngày giảm" → bẫy</text>

  <!-- Tue-Thu distribution up -->
  <path d="M150,255 L185,200 L220,225 L260,175 L295,195 L340,140 L380,158 L430,110 L470,128 L520,95" fill="none" stroke="#16A34A" stroke-width="2.8"/>
  <circle cx="150" cy="255" r="4" fill="#16A34A"/>
  <text x="158" y="250" font-size="9.5" font-weight="700" fill="#166534">Long (sau sweep Weekly Open)</text>
  <text x="300" y="120" font-size="9.5" fill="#166534">Phân phối tuần LÊN (Thứ 3–Thứ 5)</text>

  <!-- Fri: reach BSL / prior week high -->
  <line x1="470" y1="92" x2="720" y2="92" stroke="#16A34A" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="560" y="87" font-size="9" fill="#166534">Target: PWH / BSL tuần</text>
  <path d="M520,95 L560,110 L600,100 L640,120 L680,112" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="600" y="140" font-size="8.5" fill="#6B7280">Thứ 6: giữ / phân phối cạn</text>

  <rect x="24" y="374" width="712" height="66" rx="6" fill="#FEF3C7"/>
  <text x="36" y="394" font-size="11.5" font-weight="700" fill="#92400E">Chẩn đoán: cấp NGÀY và cấp TUẦN lệch pha — cú giảm Thứ 2 nhìn ở khung ngày là "bearish day", nhưng ở khung TUẦN</text>
  <text x="36" y="412" font-size="11.5" fill="#92400E">nó là pha manipulation (low của tuần in vào Thứ 2). Short theo cấp ngày = trade ngược pha phân phối của tuần.</text>
  <text x="36" y="430" font-size="11.5" fill="#92400E">Quy tắc: khi bias tuần bullish, coi cú quét dưới Weekly Open đầu tuần là cơ hội Long, KHÔNG phải tín hiệu bán.</text>
</svg>
