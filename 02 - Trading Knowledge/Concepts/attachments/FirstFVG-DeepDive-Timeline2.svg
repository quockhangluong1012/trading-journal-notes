<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="270" x2="960" y2="270"/>
  </g>

  <text x="480" y="35" fill="#d1d4dc" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Timeline tong hop va cac lop rui ro xuyen suot phien</text>

  <!-- main timeline -->
  <line x1="50" y1="260" x2="910" y2="260" stroke="#d1d4dc" stroke-width="2"/>

  <!-- markers -->
  <g font-family="Arial" font-size="13" fill="#d1d4dc">
    <circle cx="90" cy="260" r="6" fill="#787b86"/>
    <text x="90" y="240" text-anchor="middle">Pre-market</text>
    <text x="90" y="285" text-anchor="middle">04:00-09:30</text>

    <circle cx="260" cy="260" r="7" fill="#f2c94c"/>
    <text x="260" y="240" text-anchor="middle" fill="#f2c94c" font-weight="bold">09:30 Open</text>
    <text x="260" y="285" text-anchor="middle">Giai phong thanh khoan</text>

    <circle cx="380" cy="260" r="6" fill="#2962ff"/>
    <text x="380" y="240" text-anchor="middle" fill="#2962ff">Cua so Qualify</text>
    <text x="380" y="285" text-anchor="middle">09:30-10:00</text>

    <circle cx="540" cy="260" r="6" fill="#26a69a"/>
    <text x="540" y="240" text-anchor="middle" fill="#26a69a">Extend + Retest</text>
    <text x="540" y="285" text-anchor="middle">Ca ngay giao dich</text>

    <circle cx="740" cy="260" r="6" fill="#ef5350"/>
    <text x="740" y="240" text-anchor="middle" fill="#ef5350">03:45 PM</text>
    <text x="740" y="285" text-anchor="middle">Truoc MOC - het extend</text>

    <circle cx="870" cy="260" r="6" fill="#787b86"/>
    <text x="870" y="240" text-anchor="middle">Close</text>
    <text x="870" y="285" text-anchor="middle">04:14 PM</text>
  </g>

  <!-- FVG qualify window box -->
  <rect x="260" y="245" width="120" height="30" fill="rgba(41,98,255,0.2)" stroke="#2962ff"/>

  <!-- risk layer callouts above -->
  <g font-family="Arial" font-size="12" fill="#d1d4dc">
    <rect x="30" y="330" width="200" height="55" fill="#1e222d" stroke="#787b86"/>
    <text x="130" y="350" text-anchor="middle" fill="#f2c94c">Tin truoc mo cua</text>
    <text x="130" y="368" text-anchor="middle">Du am NFP 08:30</text>
    <text x="130" y="382" text-anchor="middle">keo dai qua cua so</text>

    <rect x="250" y="330" width="200" height="55" fill="#1e222d" stroke="#787b86"/>
    <text x="350" y="350" text-anchor="middle" fill="#f2c94c">DST lech gio</text>
    <text x="350" y="368" text-anchor="middle">EDT/EST doi 2 lan/nam</text>
    <text x="350" y="382" text-anchor="middle">Kiem tra gio VN</text>

    <rect x="470" y="330" width="200" height="55" fill="#1e222d" stroke="#787b86"/>
    <text x="570" y="350" text-anchor="middle" fill="#f2c94c">iFVG re-invert</text>
    <text x="570" y="368" text-anchor="middle">Ngay choppy</text>
    <text x="570" y="382" text-anchor="middle">Ha conviction</text>

    <rect x="690" y="330" width="200" height="55" fill="#1e222d" stroke="#787b86"/>
    <text x="790" y="350" text-anchor="middle" fill="#f2c94c">Tam ly buoi toi VN</text>
    <text x="790" y="368" text-anchor="middle">De met, de sai checklist</text>
    <text x="790" y="382" text-anchor="middle">Dung ngoai neu khong tinh tao</text>
  </g>

  <!-- connecting lines from timeline to callouts -->
  <g stroke="#787b86" stroke-width="1" stroke-dasharray="3,3">
    <line x1="130" y1="330" x2="200" y2="270"/>
    <line x1="350" y1="330" x2="320" y2="270"/>
    <line x1="570" y1="330" x2="540" y2="270"/>
    <line x1="790" y1="330" x2="740" y2="270"/>
  </g>

  <text x="480" y="430" fill="#d1d4dc" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">Pre-market chuan bi -&gt; giai phong thanh khoan 09:30 -&gt; qualify trong cua so -&gt; extend toi 03:45 PM</text>
  <text x="480" y="455" fill="#787b86" font-family="Arial" font-size="13" text-anchor="middle">Cac lop rui ro (tin tuc, DST, iFVG choppy, tam ly) can theo doi xuyen suot toan bo qua trinh</text>

</svg>
