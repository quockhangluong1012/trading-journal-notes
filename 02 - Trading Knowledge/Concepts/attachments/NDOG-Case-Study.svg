<!-- Result box -->
<rect x="60" y="470" width="1080" height="200" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="80" y="500" font-size="16" fill="#e2e8f0" font-weight="bold">Kết quả bằng số</text>
<text x="80" y="528" font-size="14" fill="#94a3b8">Risk: 18,268 − 18,252 = 16 điểm NQ</text>
<text x="80" y="552" font-size="14" fill="#94a3b8">Reward tới TP2: 18,318 − 18,268 = 50 điểm</text>
<text x="80" y="576" font-size="14" fill="#22c55e" font-weight="bold">R-multiple ≈ +3.1R  |  1 lot × 20 USD/điểm → lãi 1,000 USD (risk 320 USD)</text>
<text x="80" y="610" font-size="14" fill="#eab308" font-weight="bold">Bài học: CE hiệu quả vì TRÙNG với sweep thanh khoản có sẵn (đáy phiên Á),</text>
<text x="80" y="632" font-size="14" fill="#eab308" font-weight="bold">không phải vì bản thân CE có "sức hút" độc lập — confluence mới là edge thật.</text>
