<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="780" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế Order Flow đằng sau Change of Character</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Vì sao CHoCH là "phe kiểm soát lần đầu thất bại bảo vệ mốc" — không chỉ là một đường giá bị xuyên</text>

<!-- Left: buyers fail to defend HL -->
<rect x="40" y="90" width="540" height="300" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="118" font-size="17" fill="#e2e8f0" font-weight="bold">1. Buyers thất bại bảo vệ higher-low</text>
<line x1="80" y1="340" x2="550" y2="340" stroke="#1c2333"/>
<!-- uptrend candles into HL -->
<rect x="90" y="260" width="16" height="40" fill="#22c55e"/><line x1="98" y1="245" x2="98" y2="315" stroke="#22c55e" stroke-width="2"/>
<rect x="115" y="230" width="16" height="45" fill="#22c55e"/><line x1="123" y1="215" x2="123" y2="290" stroke="#22c55e" stroke-width="2"/>
<rect x="145" y="270" width="16" height="30" fill="#ef4444"/><line x1="153" y1="255" x2="153" y2="315" stroke="#ef4444" stroke-width="2"/>
<line x1="70" y1="300" x2="230" y2="300" stroke="#eab308" stroke-dasharray="6,4"/>
<text x="70" y="318" font-size="12" fill="#eab308">higher-low được bảo vệ</text>
<!-- expected buy defense that fails -->
<rect x="175" y="290" width="16" height="35" fill="#ef4444"/><line x1="183" y1="275" x2="183" y2="345" stroke="#ef4444" stroke-width="2"/>
<rect x="205" y="300" width="16" height="70" fill="#ef4444"/>
<line x1="213" y1="290" x2="213" y2="380" stroke="#ef4444" stroke-width="3"/>
<text x="220" y="365" font-size="12" fill="#f97316" font-weight="bold">body close dưới HL (buyers không mua lên)</text>
<text x="60" y="365" font-size="13" fill="#94a3b8">Đáng lẽ buyers phải mua lên tại HL để giữ chuỗi —</text>
<text x="60" y="382" font-size="13" fill="#94a3b8">họ không làm vậy → character của delivery đổi.</text>

<!-- Right: order book flip -->
<rect x="620" y="90" width="540" height="300" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="640" y="118" font-size="17" fill="#e2e8f0" font-weight="bold">2. Vì sao cần SWEEP trước CHoCH mới đáng tin</text>
<rect x="650" y="150" width="460" height="60" fill="#eab308" opacity="0.12" stroke="#eab308" stroke-dasharray="4,3"/>
<text x="660" y="172" font-size="13" fill="#eab308">Equal highs/PDH = stop dồn 1 mức → sweep giải phóng</text>
<text x="660" y="192" font-size="13" fill="#eab308">"nhiên liệu" đủ lớn để smart money khớp lệnh ngược</text>
<rect x="650" y="230" width="460" height="60" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-dasharray="4,3"/>
<text x="660" y="252" font-size="13" fill="#f97316">Không sweep = chưa đủ nhiên liệu → CHoCH "trần" dễ</text>
<text x="660" y="272" font-size="13" fill="#f97316">chỉ là inducement, trend cũ đủ lực kéo giá lại</text>
<text x="640" y="330" font-size="13" fill="#94a3b8">CHoCH chất lượng cao = sweep pool lớn (equal highs/</text>
<text x="640" y="350" font-size="13" fill="#94a3b8">PDH-PDL) TRƯỚC + body close ngược trend + displacement.</text>
<text x="640" y="375" font-size="13" fill="#94a3b8">Thiếu sweep → giống lý thuyết Wyckoff "Upthrust" giả.</text>

<!-- Bottom: 3-asset table -->
<rect x="40" y="410" width="1120" height="290" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="438" font-size="17" fill="#e2e8f0" font-weight="bold">3. Hành vi CHoCH theo loại tài sản</text>
<line x1="60" y1="452" x2="1160" y2="452" stroke="#334155"/>
<text x="70" y="480" font-size="14" fill="#94a3b8" font-weight="bold">Tiêu chí</text>
<text x="330" y="480" font-size="14" fill="#94a3b8" font-weight="bold">FX majors</text>
<text x="650" y="480" font-size="14" fill="#94a3b8" font-weight="bold">Index futures NQ/ES</text>
<text x="960" y="480" font-size="14" fill="#94a3b8" font-weight="bold">Crypto BTC/ETH</text>
<line x1="60" y1="492" x2="1160" y2="492" stroke="#1c2333"/>
<text x="70" y="518" font-size="13" fill="#e2e8f0">Tỷ lệ CHoCH thành công</text>
<text x="330" y="518" font-size="13" fill="#e2e8f0">Cao hơn khi sweep PDH/PDL rõ</text>
<text x="650" y="518" font-size="13" fill="#e2e8f0">Cao quanh phiên mở/đóng RTH</text>
<text x="960" y="518" font-size="13" fill="#e2e8f0" textLength="234" lengthAdjust="spacingAndGlyphs">Thấp hơn — liquidation gây false CHoCH nhiều</text>
<line x1="60" y1="530" x2="1160" y2="530" stroke="#1c2333"/>
<text x="70" y="555" font-size="13" fill="#e2e8f0">Nguồn nhiên liệu sweep</text>
<text x="330" y="555" font-size="13" fill="#e2e8f0">Stop retail + fixing order 16:00 London</text>
<text x="650" y="555" font-size="13" fill="#e2e8f0">Stop + options gamma flip quanh strike lớn</text>
<text x="960" y="555" font-size="13" fill="#e2e8f0">Liquidation cascade (đòn bẩy cao)</text>
<line x1="60" y1="567" x2="1160" y2="567" stroke="#1c2333"/>
<text x="70" y="592" font-size="13" fill="#e2e8f0">Wyckoff tương ứng</text>
<text x="330" y="592" font-size="13" fill="#e2e8f0">Upthrust/Spring tùy hướng</text>
<text x="650" y="592" font-size="13" fill="#e2e8f0">Upthrust After Distribution / Spring</text>
<text x="960" y="592" font-size="13" fill="#e2e8f0">Spring rất dễ lẫn với liquidation thật</text>
<line x1="60" y1="604" x2="1160" y2="604" stroke="#1c2333"/>
<text x="70" y="629" font-size="13" fill="#e2e8f0">Rủi ro chính</text>
<text x="330" y="629" font-size="13" fill="#e2e8f0">False break quanh London/NY open</text>
<text x="650" y="629" font-size="13" fill="#e2e8f0">CHoCH giả cuối phiên khi thanh khoản rút</text>
<text x="960" y="629" font-size="13" fill="#e2e8f0" textLength="234" lengthAdjust="spacingAndGlyphs">Funding time tạo wick giả nhìn như CHoCH</text>
<text x="60" y="670" font-size="13" fill="#94a3b8" font-style="italic">CHoCH (SMC) ≈ Upthrust/Spring (Wyckoff) ≈ absorption đảo delta (Footprint) — áp chuẩn MSS để lọc false.</text>
</svg>