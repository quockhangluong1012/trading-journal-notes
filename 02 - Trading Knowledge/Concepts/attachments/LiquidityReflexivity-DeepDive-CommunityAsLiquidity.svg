<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="38" fill="#d1d4dc" font-size="20" font-weight="bold" text-anchor="middle">Cong dong ICT tro thanh thanh khoan: truoc va sau khi pho bien</text>
  <text x="480" y="60" fill="#787b86" font-size="13" text-anchor="middle">Thanh khoan khong mat di, no chi doi hinh dang</text>

  <!-- LEFT: before ICT popular -->
  <text x="230" y="90" fill="#787b86" font-size="15" font-weight="bold" text-anchor="middle">TRUOC: stop retail truyen thong</text>
  <rect x="40" y="105" width="380" height="220" fill="#1e222d" stroke="#2a2e39"/>

  <line x1="60" y1="180" x2="400" y2="180" stroke="#f2c94c" stroke-dasharray="5,3"/>
  <text x="410" y="184" fill="#f2c94c" font-size="10">equal highs</text>

  <rect x="90" y="200" width="12" height="30" fill="#26a69a"/>
  <rect x="110" y="190" width="12" height="30" fill="#26a69a"/>
  <rect x="130" y="185" width="12" height="20" fill="#26a69a"/>
  <rect x="150" y="230" width="12" height="20" fill="#ef5350"/>
  <rect x="170" y="240" width="12" height="25" fill="#ef5350"/>

  <text x="230" y="260" fill="#d1d4dc" font-size="11" text-anchor="middle">Stop retail dat ngay tren</text>
  <text x="230" y="276" fill="#d1d4dc" font-size="11" text-anchor="middle">equal highs (de doan)</text>

  <rect x="90" y="300" width="300" height="18" fill="rgba(239,83,80,0.15)" stroke="#ef5350"/>
  <text x="240" y="313" fill="#ef5350" font-size="10" text-anchor="middle">Vung stop = target ro rang, don gian</text>

  <!-- RIGHT: after ICT popular -->
  <text x="730" y="90" fill="#f2c94c" font-size="15" font-weight="bold" text-anchor="middle">SAU: stop dam dong ICT</text>
  <rect x="540" y="105" width="380" height="220" fill="#1e222d" stroke="#2a2e39"/>

  <rect x="600" y="170" width="70" height="35" fill="rgba(41,98,255,0.25)" stroke="#2962ff"/>
  <text x="635" y="163" fill="#5b8def" font-size="10" text-anchor="middle">FVG "dep"</text>

  <rect x="590" y="205" width="12" height="30" fill="#26a69a"/>
  <rect x="610" y="195" width="12" height="30" fill="#26a69a"/>
  <rect x="630" y="185" width="12" height="25" fill="#26a69a"/>
  <rect x="650" y="230" width="12" height="20" fill="#ef5350"/>
  <rect x="670" y="240" width="12" height="25" fill="#ef5350"/>

  <text x="730" y="260" fill="#d1d4dc" font-size="11" text-anchor="middle">Stop dam ICT dat duoi FVG/OB</text>
  <text x="730" y="276" fill="#d1d4dc" font-size="11" text-anchor="middle">(theo dung sach ICT day)</text>

  <rect x="590" y="300" width="300" height="18" fill="rgba(242,201,76,0.2)" stroke="#f2c94c"/>
  <text x="740" y="313" fill="#f2c94c" font-size="10" text-anchor="middle">Vung stop MOI = target moi, van de doan</text>

  <line x1="480" y1="105" x2="480" y2="325" stroke="#2a2e39" stroke-dasharray="4,4"/>
  <text x="480" y="120" fill="#787b86" font-size="20" text-anchor="middle">→</text>

  <!-- Bottom takeaway -->
  <rect x="40" y="350" width="880" height="150" fill="#181c27" stroke="#2a2e39"/>
  <text x="480" y="375" fill="#d1d4dc" font-size="14" font-weight="bold" text-anchor="middle">Diem mau chot</text>
  <text x="60" y="405" fill="#d1d4dc" font-size="12">- Doi tuong bi quet khong bien mat, chi doi vi tri: tu "tren equal high" sang "duoi FVG/OB"</text>
  <text x="60" y="430" fill="#d1d4dc" font-size="12">- Nhung day CHI la mot lop khuech dai bien; da so khoi luong thi truong (NQ/ES) van den tu dealer</text>
  <text x="60" y="450" fill="#d1d4dc" font-size="12">  hedging, real money, arbitrage - khong phai tu retail (xem muc A5 Deep Dive)</text>
  <text x="60" y="475" fill="#787b86" font-size="11">Ham y thuc chien: cang nhieu nguoi dung mot mo hinh giong het nhau, cang de bi "target" chinh xac tai do</text>
</svg>
