<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="750" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế thật đằng sau NWOG: 49 Giờ Ngắt Quãng vs 1¾ Giờ của NDOG</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Khoảng đóng cửa CME dài hơn ~28 lần NDOG → nhiều thông tin dồn nén hơn chờ định giá lại tại Sunday Open</text>

<!-- timeline -->
<line x1="60" y1="380" x2="1140" y2="380" stroke="#334155" stroke-width="2"/>
<text x="60" y="400" font-size="13" fill="#94a3b8">Thứ Sáu 17:00 ET</text>
<text x="330" y="400" font-size="13" fill="#eab308">Thứ Bảy (đóng hoàn toàn)</text>
<text x="620" y="400" font-size="13" fill="#eab308">Chủ Nhật ngày (đóng)</text>
<text x="900" y="400" font-size="13" fill="#eab308">18:00 ET Chủ Nhật</text>
<text x="1080" y="400" font-size="13" fill="#94a3b8">Thứ Hai</text>

<!-- Friday candles -->
<rect x="90" y="300" width="16" height="40" fill="#22c55e"/><line x1="98" y1="285" x2="98" y2="350" stroke="#22c55e" stroke-width="2"/>
<rect x="130" y="290" width="16" height="35" fill="#22c55e"/><line x1="138" y1="275" x2="138" y2="335" stroke="#22c55e" stroke-width="2"/>
<rect x="170" y="280" width="16" height="30" fill="#ef4444"/><line x1="178" y1="265" x2="178" y2="320" stroke="#ef4444" stroke-width="2"/>

<!-- Friday close line -->
<line x1="60" y1="270" x2="900" y2="270" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4"/>
<text x="230" y="260" font-size="15" fill="#eab308" font-weight="bold">Friday Close ~16:59–17:00 ET (~18,450)</text>

<!-- long halt box spanning ~49h -->
<rect x="215" y="150" width="680" height="450" fill="#1e293b" opacity="0.45" stroke="#334155" stroke-dasharray="4,3"/>
<text x="245" y="175" font-size="17" fill="#f97316" font-weight="bold">CME ĐÓNG CỬA HOÀN TOÀN ~49 GIỜ</text>
<text x="245" y="198" font-size="13" fill="#94a3b8">(so với ~1¾ giờ halt hằng ngày của NDOG)</text>
<text x="245" y="230" font-size="14" fill="#e2e8f0">Trong khi CME đứng yên:</text>
<text x="245" y="255" font-size="13" fill="#94a3b8">• FX spot OTC vẫn rải rác hoạt động</text>
<text x="245" y="273" font-size="13" fill="#94a3b8">  qua các trung tâm mở sớm cuối tuần</text>
<text x="245" y="295" font-size="13" fill="#94a3b8">• Tin địa chính trị / phát biểu NHTW</text>
<text x="245" y="313" font-size="13" fill="#94a3b8">  thường "chọn" công bố cuối tuần</text>
<text x="245" y="335" font-size="13" fill="#94a3b8">• Dealer FX toàn cầu neo giá quote</text>
<text x="245" y="353" font-size="13" fill="#94a3b8">  Thứ Hai theo world events</text>
<text x="245" y="385" font-size="15" fill="#38bdf8" font-weight="bold">→ Sunday Open = re-auction 49 giờ</text>
<text x="245" y="405" font-size="15" fill="#38bdf8" font-weight="bold">   thông tin dồn nén — nặng hơn NDOG</text>

<!-- Sunday reopen -->
<rect x="900" y="290" width="240" height="60" fill="#ef4444" opacity="0.18"/>
<line x1="900" y1="290" x2="1140" y2="290" stroke="#94a3b8" stroke-width="2"/>
<text x="905" y="285" font-size="13" fill="#94a3b8">Sunday Open ~18:00 ET (~18,405)</text>
<line x1="900" y1="320" x2="1140" y2="320" stroke="#38bdf8" stroke-width="2"/>
<text x="905" y="340" font-size="13" fill="#38bdf8" font-weight="bold">CE tuần (~18,427.5)</text>

<rect x="960" y="300" width="16" height="30" fill="#ef4444"/><line x1="968" y1="290" x2="968" y2="340" stroke="#ef4444" stroke-width="2"/>
<rect x="1000" y="295" width="16" height="25" fill="#22c55e"/><line x1="1008" y1="285" x2="1008" y2="330" stroke="#22c55e" stroke-width="2"/>
<rect x="1040" y="290" width="16" height="30" fill="#22c55e"/><line x1="1048" y1="278" x2="1048" y2="330" stroke="#22c55e" stroke-width="2"/>

<!-- theory comparison bottom -->
<rect x="40" y="450" width="350" height="260" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="480" font-size="16" fill="#a78bfa" font-weight="bold">Auction Market Theory</text>
<text x="60" y="505" font-size="13" fill="#e2e8f0">"Gap ngoài giờ" kinh điển nhất</text>
<text x="60" y="523" font-size="13" fill="#94a3b8">Giá "auction back" khi TK đầy đủ</text>
<text x="60" y="541" font-size="13" fill="#94a3b8">quay lại (Thứ Hai/Ba)</text>
<text x="60" y="565" font-size="13" fill="#94a3b8">Khác: không phân biệt NWOG/NDOG</text>
<text x="60" y="583" font-size="13" fill="#94a3b8">theo "sức nặng" cố định</text>

<rect x="420" y="450" width="350" height="260" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="440" y="480" font-size="16" fill="#a78bfa" font-weight="bold">Wyckoff Composite Man</text>
<text x="440" y="505" font-size="13" fill="#e2e8f0">Cuối tuần = giai đoạn "chuẩn bị"</text>
<text x="440" y="523" font-size="13" fill="#94a3b8">Sunday Open phản ánh vị thế</text>
<text x="440" y="541" font-size="13" fill="#94a3b8">đã tích lũy/phân phối trước đó</text>
<text x="440" y="565" font-size="13" fill="#94a3b8">Khác: xét cấu trúc nhiều tuần</text>
<text x="440" y="583" font-size="13" fill="#94a3b8">bằng volume, không riêng 2 điểm giá</text>

<rect x="800" y="450" width="350" height="260" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="820" y="480" font-size="16" fill="#a78bfa" font-weight="bold">Orderflow / Footprint</text>
<text x="820" y="505" font-size="13" fill="#e2e8f0">Volume nến Sunday đầu tiên</text>
<text x="820" y="523" font-size="13" fill="#94a3b8">cực thấp trên footprint</text>
<text x="820" y="541" font-size="13" fill="#94a3b8">→ xác nhận "vùng chưa kiểm định"</text>
<text x="820" y="565" font-size="13" fill="#94a3b8">Khác: cần dữ liệu tick thật,</text>
<text x="820" y="583" font-size="13" fill="#94a3b8">NWOG chỉ dựa 2 điểm OHLC</text>

<text x="40" y="730" font-size="14" fill="#f97316" font-weight="bold">Kết luận cơ chế: NWOG mạnh hơn NDOG vì khoảng ngắt quãng dài hơn ~28 lần — lý do cơ học, đo lường được.</text>
</svg>
