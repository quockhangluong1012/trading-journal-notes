<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">Range mở màn bằng Opening Gap — không có leg thật để đo</text>
  <text x="32" y="66" font-size="15" fill="#787b86">NQ futures — Sunday open nhảy gap qua cuối tuần, chưa có displacement nào tạo swing mới</text>

  <!-- Friday close candles -->
  <g>
    <rect x="120" y="420" width="18" height="60" fill="#26a69a" rx="1"/>
    <line x1="129" y1="405" x2="129" y2="490" stroke="#26a69a"/>
    <rect x="150" y="400" width="18" height="50" fill="#26a69a" rx="1"/>
    <line x1="159" y1="385" x2="159" y2="460" stroke="#26a69a"/>
    <rect x="180" y="390" width="18" height="40" fill="#26a69a" rx="1"/>
    <line x1="189" y1="378" x2="189" y2="440" stroke="#26a69a"/>
  </g>
  <text x="110" y="510" font-size="13" fill="#787b86">Fri 17:00 ET close</text>
  <line x1="120" y1="378" x2="230" y2="378" stroke="#787b86" stroke-dasharray="4 3"/>
  <text x="232" y="382" font-size="13" fill="#787b86">Fri close @ 20,340</text>

  <!-- gap zone -->
  <rect x="230" y="260" width="90" height="118" fill="#ff9800" opacity="0.14" stroke="#ff9800" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="236" y="252" font-size="13" fill="#ff9800">Weekend gap ~140pt</text>

  <!-- Sunday open candles jumped up, no leg formed yet -->
  <g>
    <rect x="330" y="240" width="18" height="35" fill="#26a69a" rx="1"/>
    <line x1="339" y1="228" x2="339" y2="285" stroke="#26a69a"/>
    <rect x="360" y="230" width="18" height="30" fill="#26a69a" rx="1"/>
    <line x1="369" y1="215" x2="369" y2="270" stroke="#26a69a"/>
  </g>
  <line x1="330" y1="215" x2="440" y2="215" stroke="#787b86" stroke-dasharray="4 3"/>
  <text x="442" y="219" font-size="13" fill="#787b86">Sun open @ 20,480</text>

  <!-- Question mark box: no valid range yet -->
  <rect x="470" y="200" width="300" height="290" fill="#ef5350" opacity="0.10" stroke="#ef5350" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="486" y="230" font-size="18" font-weight="bold" fill="#ff6b6b">✗ CHUA CO RANGE HOP LE</text>
  <text x="486" y="256" font-size="14" fill="#d1d4dc">Khong co swing high/low moi</text>
  <text x="486" y="278" font-size="14" fill="#d1d4dc">duoc tao boi displacement that</text>
  <text x="486" y="300" font-size="14" fill="#d1d4dc">Gap la buoc nhay cua dong ho san</text>
  <text x="486" y="322" font-size="14" fill="#d1d4dc">xuat, khong phai dong lenh</text>
  <text x="486" y="358" font-size="14" fill="#f2c94c">Xu ly: giu range D1/W truoc gap</text>
  <text x="486" y="380" font-size="14" fill="#f2c94c">lam khung tam thoi cho toi khi</text>
  <text x="486" y="402" font-size="14" fill="#f2c94c">Chau A/London tao swing dau tien</text>
  <text x="486" y="440" font-size="13" fill="#787b86">Alternative: dung gap edges (Fri</text>
  <text x="486" y="460" font-size="13" fill="#787b86">close - Sun open) lam CBDR tam thoi</text>

  <!-- Monday structure forming -->
  <g>
    <rect x="820" y="300" width="18" height="45" fill="#ef5350" rx="1"/>
    <line x1="829" y1="285" x2="829" y2="360" stroke="#ef5350"/>
    <rect x="850" y="330" width="18" height="60" fill="#ef5350" rx="1"/>
    <line x1="859" y1="315" x2="859" y2="405" stroke="#ef5350"/>
    <rect x="880" y="380" width="18" height="40" fill="#26a69a" rx="1"/>
    <line x1="889" y1="368" x2="889" y2="435" stroke="#26a69a"/>
    <rect x="910" y="340" width="18" height="70" fill="#26a69a" rx="1"/>
    <line x1="919" y1="325" x2="919" y2="422" stroke="#26a69a"/>
  </g>
  <rect x="800" y="260" width="150" height="30" rx="5" fill="#1c2030" stroke="#4a90d9" stroke-opacity="0.6"/>
  <text x="812" y="280" font-size="13" fill="#4a90d9">Asia tao swing low that</text>
  <text x="800" y="470" font-size="14" fill="#4a90d9">-&gt; Asia low + London high dau tien</text>
  <text x="800" y="490" font-size="14" fill="#4a90d9">= range moi hop le de do P/D</text>

  <text x="140" y="670" font-size="14" fill="#d1d4dc">Nguyen tac: gap KHONG phai leg — no la khoang trong khong ai giao dich, khong the dung lam bien range.</text>
  <text x="140" y="694" font-size="13" fill="#787b86">Cho toi khi mot displacement that (thuong la Asia/London dau tuan) tao swing moi.</text>
</svg>
