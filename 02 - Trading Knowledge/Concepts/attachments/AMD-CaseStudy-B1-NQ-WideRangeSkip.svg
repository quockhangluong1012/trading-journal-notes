<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <rect width="1280" height="800" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">NQ — bỏ qua đúng khung AMD vì Asia range đã chiếm 82% ADR</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Tái dựng từ mẫu backtest · phiên Á-London-NY một ngày CPI ngoài dự kiến rơi vào tuần rảnh tin</text>

  <line x1="40" y1="460" x2="1240" y2="460" stroke="#2a2e39" stroke-width="1"/>

  <!-- ADR reference band -->
  <rect x="80" y="140" width="1120" height="260" rx="4" fill="#787b86" opacity="0.08" stroke="#787b86" stroke-dasharray="4 3"/>
  <text x="90" y="130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">ADR(20) tham chiếu ≈ 260 điểm NQ</text>

  <!-- asia session candles spanning almost the full ADR band -->
  <g>
    <line x1="130" y1="160" x2="130" y2="220" stroke="#26a69a" stroke-width="1"/>
    <rect x="122" y="170" width="16" height="40" rx="1" fill="#26a69a"/>
    <line x1="170" y1="220" x2="170" y2="290" stroke="#ef5350" stroke-width="1"/>
    <rect x="162" y="230" width="16" height="50" rx="1" fill="#ef5350"/>
    <line x1="210" y1="180" x2="210" y2="250" stroke="#26a69a" stroke-width="1"/>
    <rect x="202" y="190" width="16" height="50" rx="1" fill="#26a69a"/>
    <line x1="250" y1="280" x2="250" y2="360" stroke="#ef5350" stroke-width="1"/>
    <rect x="242" y="290" width="16" height="60" rx="1" fill="#ef5350"/>
    <line x1="290" y1="230" x2="290" y2="310" stroke="#26a69a" stroke-width="1"/>
    <rect x="282" y="240" width="16" height="60" rx="1" fill="#26a69a"/>
  </g>
  <line x1="120" y1="165" x2="330" y2="165" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="120" y1="345" x2="330" y2="345" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="160" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#f2c94c">Asia range: 21150-21362 = 212 điểm (82% ADR)</text>

  <!-- london breakout - small relative to already wide range -->
  <g>
    <line x1="360" y1="200" x2="360" y2="270" stroke="#ef5350" stroke-width="1"/>
    <rect x="352" y="210" width="16" height="50" rx="1" fill="#ef5350"/>
    <line x1="400" y1="240" x2="400" y2="320" stroke="#ef5350" stroke-width="1"/>
    <rect x="392" y="250" width="16" height="60" rx="1" fill="#ef5350"/>
  </g>
  <text x="350" y="365" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">London "Judas" — chỉ retest đáy range Á, không sweep mới</text>

  <!-- decision box: no trade -->
  <rect x="450" y="150" width="330" height="110" rx="8" fill="#ff6b6b" opacity="0.14" stroke="#ff6b6b" stroke-dasharray="6 4"/>
  <text x="465" y="175" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#ff6b6b">Quyết định: NO TRADE</text>
  <text x="465" y="197" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Asia range &gt; 60% ADR → không còn</text>
  <text x="465" y="219" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">"không gian" cho Judas quét + phân phối thật</text>
  <text x="465" y="241" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Ghi log, đứng ngoài toàn phiên London</text>

  <!-- what happened after: choppy whipsaw all day -->
  <g>
    <line x1="820" y1="220" x2="820" y2="290" stroke="#26a69a" stroke-width="1"/>
    <rect x="812" y="230" width="16" height="50" rx="1" fill="#26a69a"/>
    <line x1="860" y1="260" x2="860" y2="330" stroke="#ef5350" stroke-width="1"/>
    <rect x="852" y="270" width="16" height="50" rx="1" fill="#ef5350"/>
    <line x1="900" y1="210" x2="900" y2="280" stroke="#26a69a" stroke-width="1"/>
    <rect x="892" y="220" width="16" height="50" rx="1" fill="#26a69a"/>
    <line x1="940" y1="270" x2="940" y2="340" stroke="#ef5350" stroke-width="1"/>
    <rect x="932" y="280" width="16" height="50" rx="1" fill="#ef5350"/>
    <line x1="980" y1="200" x2="980" y2="270" stroke="#26a69a" stroke-width="1"/>
    <rect x="972" y="210" width="16" height="50" rx="1" fill="#26a69a"/>
  </g>
  <text x="800" y="365" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">NY: whipsaw hai chiều trong đúng dải Asia</text>
  <text x="800" y="387" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">— không có distribution sạch</text>

  <!-- confirmation box -->
  <rect x="800" y="150" width="380" height="60" rx="8" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-dasharray="6 4"/>
  <text x="815" y="175" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#26a69a">Kết quả: skip ĐÚNG — cả ngày còn lại</text>
  <text x="815" y="197" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#26a69a">chỉ là whipsaw, không ai theo AMD kiếm được lãi sạch</text>

  <text x="40" y="720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">NQ M15/H1 · tái dựng minh họa từ mẫu backtest — không trade không phải là không có kết quả, đây là 0R có kỷ luật</text>
</svg>
