<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Change of Character THẬT vs Failed CHoCH (deviation dưới protected low)</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Cùng một cú "đóng nến thủng protected low" — cái nào đảo cấu trúc, cái nào chỉ là quét thanh khoản rồi reclaim?</text>

  <!-- LEFT panel: REAL CoS -->
  <rect x="24" y="68" width="350" height="300" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <rect x="24" y="68" width="350" height="30" rx="8" fill="#FEE2E2"/>
  <text x="38" y="88" font-size="13" font-weight="800" fill="#B91C1C">CoS THẬT — thủng &amp; KHÔNG reclaim</text>

  <!-- rising ITLs then break -->
  <path d="M50,300 L85,255 L110,275 L150,215 L178,240 L215,180" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <!-- protected low line -->
  <line x1="150" y1="215" x2="360" y2="215" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="250" y="210" font-size="9.5" fill="#374151">Protected Low (ITL)</text>
  <circle cx="150" cy="215" r="4" fill="#16A34A"/>
  <!-- break down through and hold -->
  <path d="M215,180 L245,235 L268,220 L300,290 L330,330" fill="none" stroke="#DC2626" stroke-width="2.6"/>
  <text x="230" y="258" font-size="9.5" font-weight="700" fill="#B91C1C">body close xuyên</text>
  <!-- lower ITH forms -->
  <circle cx="268" cy="220" r="4" fill="#DC2626"/>
  <text x="278" y="212" font-size="9" fill="#B91C1C">lower ITH</text>
  <text x="40" y="352" font-size="10.5" fill="#374151">→ Không reclaim + tạo lower ITH → downtrend mới xác nhận</text>

  <!-- RIGHT panel: FAILED CHoCH -->
  <rect x="386" y="68" width="350" height="300" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <rect x="386" y="68" width="350" height="30" rx="8" fill="#DCFCE7"/>
  <text x="400" y="88" font-size="13" font-weight="800" fill="#166534">FAILED CHoCH — deviation rồi reclaim</text>

  <path d="M412,300 L447,255 L472,275 L512,215 L540,240 L560,205" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <line x1="512" y1="215" x2="722" y2="215" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="600" y="210" font-size="9.5" fill="#374151">Protected Low (ITL)</text>
  <circle cx="512" cy="215" r="4" fill="#16A34A"/>
  <!-- deviation just below then snap back -->
  <path d="M560,205 L585,245 L600,238 L612,236" fill="none" stroke="#DC2626" stroke-width="2.2"/>
  <text x="556" y="270" font-size="9" fill="#B91C1C">close nhẹ dưới rồi</text>
  <text x="556" y="282" font-size="9" fill="#B91C1C">reclaim ngay</text>
  <!-- reclaim strong up -->
  <path d="M612,236 L640,180 L665,200 L700,130" fill="none" stroke="#16A34A" stroke-width="2.8"/>
  <circle cx="700" cy="130" r="5" fill="#16A34A"/>
  <text x="620" y="150" font-size="9.5" font-weight="700" fill="#166534">reclaim → uptrend tiếp</text>
  <text x="400" y="352" font-size="10.5" fill="#374151">→ Đây là stop-hunt dưới protected low (deviation), KHÔNG phải CoS</text>

  <!-- bottom takeaway -->
  <rect x="24" y="378" width="712" height="50" rx="6" fill="#EDE9FE"/>
  <text x="36" y="398" font-size="11.5" font-weight="700" fill="#5B21B6">Quy tắc thực chiến: một body close thủng protected low CHƯA đủ. Chờ (1) không reclaim trong 1–2 nến VÀ (2) tạo được lower ITH mới.</text>
  <text x="36" y="418" font-size="11.5" fill="#5B21B6">Rất nhiều "đảo chiều" thực chất là deviation sâu quét SSL dưới protected low rồi bật lại — nhầm nó là CoS = short đúng đáy.</text>
</svg>
