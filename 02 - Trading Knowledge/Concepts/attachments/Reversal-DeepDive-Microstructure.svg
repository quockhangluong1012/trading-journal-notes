<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <!-- grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="60" x2="160" y2="500"/>
    <line x1="380" y1="60" x2="380" y2="500"/>
    <line x1="620" y1="60" x2="620" y2="500"/>
    <line x1="840" y1="60" x2="840" y2="500"/>
  </g>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Order Flow phia sau 3 tang Reversal</text>
  <text x="30" y="60" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Moi tang la mot nguong can thanh khoan khac nhau, khong phai tin hieu doc lap</text>

  <!-- candles downtrend then reversal -->
  <g>
    <!-- down candles -->
    <rect x="90" y="150" width="16" height="60" fill="#ef5350"/><line x1="98" y1="140" x2="98" y2="220" stroke="#ef5350" stroke-width="2"/>
    <rect x="130" y="170" width="16" height="55" fill="#ef5350"/><line x1="138" y1="160" x2="138" y2="235" stroke="#ef5350" stroke-width="2"/>
    <rect x="170" y="190" width="16" height="50" fill="#ef5350"/><line x1="178" y1="180" x2="178" y2="250" stroke="#ef5350" stroke-width="2"/>
    <!-- FVG zone stage1 -->
    <rect x="150" y="185" width="60" height="45" fill="rgba(41,98,255,0.25)"/>
    <!-- stage1 breaking candle bullish closing above -->
    <rect x="210" y="150" width="16" height="70" fill="#26a69a"/><line x1="218" y1="140" x2="218" y2="230" stroke="#26a69a" stroke-width="2"/>
    <text x="150" y="330" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Stage 1: IFVG</text>
    <text x="150" y="348" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Can thanh khoan CUC BO</text>
  </g>

  <!-- stage 2 CISD zone -->
  <g>
    <rect x="250" y="140" width="16" height="65" fill="#26a69a"/><line x1="258" y1="130" x2="258" y2="215" stroke="#26a69a" stroke-width="2"/>
    <rect x="290" y="120" width="16" height="70" fill="#26a69a"/><line x1="298" y1="108" x2="298" y2="200" stroke="#26a69a" stroke-width="2"/>
    <line x1="240" y1="205" x2="400" y2="205" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="405" y="209" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c">CISD level (body)</text>
    <text x="250" y="330" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Stage 2: CISD</text>
    <text x="250" y="348" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Can thanh khoan BEN trong nen</text>
  </g>

  <!-- stage 3 MSS -->
  <g>
    <rect x="410" y="95" width="16" height="70" fill="#26a69a"/><line x1="418" y1="85" x2="418" y2="175" stroke="#26a69a" stroke-width="2"/>
    <rect x="450" y="75" width="16" height="70" fill="#26a69a"/><line x1="458" y1="65" x2="458" y2="155" stroke="#26a69a" stroke-width="2"/>
    <circle cx="418" cy="150" r="10" fill="none" stroke="#26a69a" stroke-width="2"/>
    <line x1="380" y1="150" x2="560" y2="150" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="470" y="130" font-family="Arial, sans-serif" font-size="14" fill="#f2c94c">Swing gan nhat (MSS)</text>
    <text x="410" y="330" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Stage 3: MSS</text>
    <text x="410" y="348" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Xoa cau truc + stop cascade</text>
  </g>

  <!-- retest and entry -->
  <g>
    <rect x="520" y="120" width="16" height="60" fill="#ef5350"/><line x1="528" y1="110" x2="528" y2="195" stroke="#ef5350" stroke-width="2"/>
    <rect x="560" y="95" width="16" height="65" fill="#26a69a"/><line x1="568" y1="85" x2="568" y2="175" stroke="#26a69a" stroke-width="2"/>
    <rect x="600" y="70" width="16" height="60" fill="#26a69a"/><line x1="608" y1="60" x2="608" y2="145" stroke="#26a69a" stroke-width="2"/>
    <rect x="505" y="150" width="60" height="35" fill="rgba(255,152,0,0.25)"/>
    <text x="505" y="410" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Retest POI</text>
    <text x="505" y="428" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Entry sau khi dong nen</text>
  </g>

  <text x="30" y="480" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Conviction tang dan: Stage1 (mot muc) &lt; Stage2 (mot nen) &lt; Stage3 (ca cau truc + stop cascade)</text>
  <g>
    <rect x="30" y="500" width="14" height="14" fill="rgba(41,98,255,0.25)"/><text x="50" y="512" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">FVG/IFVG zone</text>
    <rect x="180" y="500" width="14" height="14" fill="rgba(255,152,0,0.25)"/><text x="200" y="512" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Retest POI</text>
    <line x1="330" y1="507" x2="360" y2="507" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/><text x="366" y="512" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Muc CISD / swing</text>
  </g>
</svg>
