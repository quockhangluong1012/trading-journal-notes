<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">Partial fill rồi runaway — không khớp tại CE, giá chạy luôn</text>
  <text x="32" y="66" font-size="15" fill="#787b86">XAUUSD M15 — giá chỉ nhúng vào 30% mép ngoài FVG rồi bật, limit tại CE không bao giờ khớp</text>

  <!-- displacement leg -->
  <g>
    <rect x="120" y="480" width="20" height="60" fill="#26a69a" rx="1"/><line x1="130" y1="465" x2="130" y2="550" stroke="#26a69a"/>
    <rect x="155" y="380" width="20" height="110" fill="#26a69a" rx="1"/><line x1="165" y1="365" x2="165" y2="500" stroke="#26a69a"/>
    <rect x="190" y="320" width="20" height="70" fill="#26a69a" rx="1"/><line x1="200" y1="305" x2="200" y2="400" stroke="#26a69a"/>
  </g>

  <!-- FVG zone -->
  <rect x="100" y="380" width="200" height="100" fill="#26a69a" opacity="0.14" stroke="#26a69a" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="106" y="372" font-size="13" fill="#26a69a">Bullish FVG proximal 2418 - distal 2408</text>

  <line x1="80" y1="430" x2="1200" y2="430" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1080" y="424" font-size="13" fill="#f2c94c">CE = 2413</text>

  <line x1="80" y1="480" x2="1200" y2="480" stroke="#787b86" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1080" y="474" font-size="13" fill="#787b86">Fill 30% = 2415</text>

  <!-- retrace candles only touching proximal region -->
  <g>
    <rect x="330" y="440" width="20" height="35" fill="#ef5350" rx="1"/><line x1="340" y1="425" x2="340" y2="480" stroke="#ef5350"/>
    <rect x="365" y="430" width="20" height="25" fill="#26a69a" rx="1"/><line x1="375" y1="415" x2="375" y2="465" stroke="#26a69a"/>
  </g>

  <!-- limit order marker sitting unfilled at CE -->
  <circle cx="1080" cy="430" r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="1095" y="435" font-size="13" fill="#ff6b6b">Limit tai CE — KHONG KHOP</text>

  <!-- runaway continuation -->
  <g>
    <rect x="420" y="360" width="20" height="60" fill="#26a69a" rx="1"/><line x1="430" y1="345" x2="430" y2="440" stroke="#26a69a"/>
    <rect x="460" y="300" width="20" height="65" fill="#26a69a" rx="1"/><line x1="470" y1="285" x2="470" y2="375" stroke="#26a69a"/>
    <rect x="500" y="230" width="20" height="75" fill="#26a69a" rx="1"/><line x1="510" y1="215" x2="510" y2="310" stroke="#26a69a"/>
    <rect x="600" y="180" width="20" height="55" fill="#26a69a" rx="1"/><line x1="610" y1="165" x2="610" y2="245" stroke="#26a69a"/>
    <rect x="750" y="150" width="20" height="40" fill="#26a69a" rx="1"/><line x1="760" y1="138" x2="760" y2="200" stroke="#26a69a"/>
  </g>

  <!-- re-entry protocol box -->
  <rect x="850" y="220" width="380" height="220" fill="#1c2030" stroke="#4a90d9" stroke-dasharray="6 4"/>
  <text x="866" y="248" font-size="15" font-weight="bold" fill="#4a90d9">RE-ENTRY PROTOCOL (khong chase)</text>
  <text x="866" y="274" font-size="13" fill="#d1d4dc">1. Khong market-order duoi theo</text>
  <text x="866" y="294" font-size="13" fill="#d1d4dc">2. Cho FVG con moi hinh thanh tren</text>
  <text x="866" y="312" font-size="13" fill="#d1d4dc">   leg tiep dien (M5/M15)</text>
  <text x="866" y="332" font-size="13" fill="#d1d4dc">3. Entry tai CE cua FVG con do,</text>
  <text x="866" y="350" font-size="13" fill="#d1d4dc">   size giam vi da tre nhip</text>
  <text x="866" y="370" font-size="13" fill="#d1d4dc">4. Neu khong co FVG con -&gt; No Trade</text>
  <text x="866" y="390" font-size="13" fill="#d1d4dc">   ghi missed_valid_setup, khong tiec</text>
  <text x="866" y="416" font-size="13" fill="#f2c94c">Fill nong = demand cuc manh -&gt; dung chase</text>

  <text x="60" y="680" font-size="14" fill="#d1d4dc">Fill cang nong (%) = sponsorship cang manh -&gt; xac suat cham lai CE giam manh.</text>
</svg>
