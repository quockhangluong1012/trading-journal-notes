<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="40" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Displacement thuc vs Displacement gia</text>

  <!-- divider -->
  <line x1="480" y1="65" x2="480" y2="470" stroke="#1e222d" stroke-width="2"/>

  <!-- LEFT: real displacement -->
  <text x="240" y="75" fill="#26a69a" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Displacement thuc (aggressive)</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="60" y1="120" x2="440" y2="120"/>
    <line x1="60" y1="200" x2="440" y2="200"/>
    <line x1="60" y1="280" x2="440" y2="280"/>
    <line x1="60" y1="360" x2="440" y2="360"/>
  </g>

  <!-- candles: strong body, tiny wick -->
  <rect x="90" y="230" width="18" height="120" fill="#26a69a"/>
  <line x1="99" y1="222" x2="99" y2="356" stroke="#26a69a" stroke-width="2"/>

  <rect x="130" y="190" width="18" height="110" fill="#26a69a"/>
  <line x1="139" y1="183" x2="139" y2="304" stroke="#26a69a" stroke-width="2"/>

  <rect x="170" y="150" width="18" height="105" fill="#26a69a"/>
  <line x1="179" y1="144" x2="179" y2="259" stroke="#26a69a" stroke-width="2"/>

  <!-- FVG clear -->
  <rect x="130" y="180" width="58" height="90" fill="rgba(41,98,255,0.25)"/>
  <text x="133" y="176" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">FVG ro</text>

  <line x1="130" y1="225" x2="188" y2="225" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="192" y="229" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">CE</text>

  <!-- shallow retrace candle -->
  <rect x="230" y="205" width="18" height="35" fill="#ef5350"/>
  <line x1="239" y1="200" x2="239" y2="243" stroke="#ef5350" stroke-width="2"/>

  <!-- continuation -->
  <rect x="270" y="140" width="18" height="80" fill="#26a69a"/>
  <line x1="279" y1="132" x2="279" y2="225" stroke="#26a69a" stroke-width="2"/>
  <rect x="310" y="110" width="18" height="70" fill="#26a69a"/>
  <line x1="319" y1="102" x2="319" y2="185" stroke="#26a69a" stroke-width="2"/>
  <rect x="350" y="90" width="18" height="65" fill="#26a69a"/>
  <line x1="359" y1="83" x2="359" y2="160" stroke="#26a69a" stroke-width="2"/>

  <text x="240" y="400" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Retrace nong, giu CE, tiep dien</text>
  <text x="240" y="422" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Body lon, wick doi nghich nho</text>
  <text x="240" y="444" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Bien do vuot 1.5-2x ATR</text>

  <!-- RIGHT: fake displacement -->
  <text x="720" y="75" fill="#ef5350" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Displacement gia (thin liquidity)</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="540" y1="120" x2="920" y2="120"/>
    <line x1="540" y1="200" x2="920" y2="200"/>
    <line x1="540" y1="280" x2="920" y2="280"/>
    <line x1="540" y1="360" x2="920" y2="360"/>
  </g>

  <!-- candles: small body, huge wick -->
  <rect x="570" y="255" width="18" height="35" fill="#26a69a"/>
  <line x1="579" y1="160" x2="579" y2="340" stroke="#26a69a" stroke-width="2"/>

  <rect x="610" y="240" width="18" height="30" fill="#26a69a"/>
  <line x1="619" y1="150" x2="619" y2="330" stroke="#26a69a" stroke-width="2"/>

  <!-- FVG mờ/không rõ -->
  <rect x="600" y="248" width="35" height="20" fill="rgba(41,98,255,0.12)"/>
  <text x="600" y="243" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">FVG mo</text>

  <line x1="600" y1="258" x2="635" y2="258" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="262" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">CE khong ro</text>

  <!-- deep retrace piercing through -->
  <rect x="660" y="270" width="18" height="90" fill="#ef5350"/>
  <line x1="669" y1="250" x2="669" y2="390" stroke="#ef5350" stroke-width="2"/>

  <rect x="700" y="290" width="18" height="70" fill="#ef5350"/>
  <line x1="709" y1="275" x2="709" y2="400" stroke="#ef5350" stroke-width="2"/>

  <path d="M 660 268 L 730 268" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="735" y="272" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">Xuyen FVG</text>

  <text x="720" y="400" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Retrace sau, lap FVG</text>
  <text x="720" y="422" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Wick dai truoc tin, body nho</text>
  <text x="720" y="444" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Fakeout, khong sponsorship thuc</text>

  <!-- legend -->
  <rect x="40" y="495" width="16" height="16" fill="#26a69a"/>
  <text x="62" y="508" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">Nen tang</text>
  <rect x="160" y="495" width="16" height="16" fill="#ef5350"/>
  <text x="182" y="508" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">Nen giam</text>
  <rect x="280" y="495" width="16" height="16" fill="rgba(41,98,255,0.25)"/>
  <text x="302" y="508" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15">FVG</text>
</svg>
