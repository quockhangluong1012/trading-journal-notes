<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Range Maturity Scorecard — 4 tiêu chí</text>
<!-- 4 rows -->
<rect x="32" y="66" width="896" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="52" y="90" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="start">1. % Average Weekly Range đã đi (tới hết Thứ Năm)</text>
<rect x="52" y="100" width="300" height="12" rx="4" fill="#1f2937"/>
<rect x="52" y="100" width="240" height="12" rx="4" fill="#4ade80"/>
<text x="700" y="100" font-size="13" fill="#4ade80" text-anchor="start">Yes — ≥70-80% AWR</text>
<rect x="32" y="136" width="896" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="52" y="160" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="start">2. Đỉnh/đáy tuần lập Tue-Thu (có MSS + displacement)</text>
<text x="52" y="180" font-size="12" fill="#94a3b8" text-anchor="start">Đồng hồ: lập trước hết Thu</text>
<text x="700" y="170" font-size="13" fill="#4ade80" text-anchor="start">Yes</text>
<rect x="32" y="206" width="896" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="52" y="230" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="start">3. Đã sweep pool thanh khoản chính của tuần</text>
<text x="700" y="240" font-size="13" fill="#4ade80" text-anchor="start">Yes</text>
<rect x="32" y="276" width="896" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="52" y="300" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="start">4. Không NFP/CPI/FOMC/month-end/quarter-end/đáo hạn</text>
<text x="700" y="310" font-size="13" fill="#4ade80" text-anchor="start">Yes</text>
<!-- Gauge -->
<text x="480" y="370" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Đồng hồ đo tổng hợp</text>
<path d="M 280 470 A 200 200 0 0 1 373 320" stroke="#f87171" stroke-width="24" fill="none"/>
<path d="M 373 320 A 200 200 0 0 1 587 320" stroke="#eab308" stroke-width="24" fill="none"/>
<path d="M 587 320 A 200 200 0 0 1 680 470" stroke="#4ade80" stroke-width="24" fill="none"/>
<text x="330" y="500" font-size="12" fill="#f87171" text-anchor="middle">0-1/4</text>
<text x="480" y="500" font-size="12" fill="#eab308" text-anchor="middle">2-3/4</text>
<text x="630" y="500" font-size="12" fill="#4ade80" text-anchor="middle">4/4</text>
<line x1="480" y1="470" x2="620" y2="360" stroke="#e5e7eb" stroke-width="3"/>
<circle cx="480" cy="470" r="8" fill="#e5e7eb"/>
<text x="480" y="540" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">Kim chỉ về vùng xanh: Range đã chín — áp dụng reversion</text>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Sơ đồ khái niệm khung đánh giá, không phải chart giá thật.</text>
</svg>
