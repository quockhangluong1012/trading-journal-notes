<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="520" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Timeline phiên giao dịch &amp; cửa sổ Venom (giờ NY)</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Sơ đồ khái niệm — không phải dữ liệu giá thật</text>

  <!-- axis -->
  <line x1="60" y1="440" x2="920" y2="440" stroke="#334155" stroke-width="2"/>
  <!-- time scale: 18:00 (prev day) to 16:00 NY next day mapped across width. We'll show 00:00-16:00 NY simplified -->
  <!-- Session bars -->
  <!-- Asia 18:00-03:00 -->
  <rect x="60" y="120" width="230" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="175" y="145" font-size="13" fill="#e5e7eb" text-anchor="middle">Asia (18:00–03:00 NY)</text>

  <!-- London 03:00-09:30 -->
  <rect x="290" y="120" width="255" height="40" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="417" y="145" font-size="13" fill="#e5e7eb" text-anchor="middle">London (03:00–09:30 NY)</text>

  <!-- New York 09:30-16:00 -->
  <rect x="545" y="120" width="330" height="40" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="710" y="145" font-size="13" fill="#e5e7eb" text-anchor="middle">New York (09:30–16:00 NY)</text>

  <!-- Venom box formation 07:00-09:30 -->
  <rect x="460" y="190" width="85" height="50" rx="4" fill="rgba(234,179,8,0.18)" stroke="#eab308" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="502" y="213" font-size="12" fill="#eab308" text-anchor="middle">Venom Box</text>
  <text x="502" y="228" font-size="11" fill="#94a3b8" text-anchor="middle">07:00–09:30</text>

  <!-- Venom Cutting Zone 09:30-10:30 highlighted -->
  <rect x="545" y="190" width="95" height="50" rx="4" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3" stroke-width="2"/>
  <text x="592" y="209" font-size="12" fill="#e5e7eb" text-anchor="middle">Venom Cutting</text>
  <text x="592" y="223" font-size="12" fill="#e5e7eb" text-anchor="middle">Zone</text>
  <text x="592" y="236" font-size="11" fill="#94a3b8" text-anchor="middle">09:30–10:30</text>

  <!-- Fading window 10:30-10:45 -->
  <rect x="640" y="190" width="45" height="50" rx="4" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="662" y="213" font-size="10.5" fill="#94a3b8" text-anchor="middle">Fading</text>
  <text x="662" y="226" font-size="10" fill="#94a3b8" text-anchor="middle">10:30–10:45</text>

  <!-- News cluster marker 08:30 -->
  <line x1="502" y1="120" x2="502" y2="90" stroke="#f97316" stroke-width="2"/>
  <circle cx="502" cy="85" r="4" fill="#f97316"/>
  <text x="502" y="72" font-size="11" fill="#f97316" text-anchor="middle">News cluster 08:30</text>

  <!-- time labels on axis -->
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="60" y="460">18:00</text>
    <text x="290" y="460">03:00</text>
    <text x="502" y="460">08:30</text>
    <text x="545" y="460">09:30</text>
    <text x="640" y="460">10:30</text>
    <text x="875" y="460">16:00</text>
  </g>
  <g stroke="#334155" stroke-width="1">
    <line x1="60" y1="435" x2="60" y2="445"/>
    <line x1="290" y1="435" x2="290" y2="445"/>
    <line x1="545" y1="435" x2="545" y2="445"/>
    <line x1="640" y1="435" x2="640" y2="445"/>
    <line x1="875" y1="435" x2="875" y2="445"/>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#94a3b8">
    <rect x="60" y="300" width="14" height="14" fill="rgba(234,179,8,0.18)" stroke="#eab308" stroke-dasharray="4 3"/>
    <text x="80" y="311" fill="#e5e7eb">Venom Box — hình thành range, KHÔNG vào lệnh</text>
    <rect x="60" y="326" width="14" height="14" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
    <text x="80" y="337" fill="#e5e7eb">Venom Cutting Zone — cửa sổ vào lệnh chính</text>
    <rect x="60" y="352" width="14" height="14" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="80" y="363" fill="#e5e7eb">Fading Window — động lực cạn dần</text>
  </g>

  <text x="60" y="400" font-size="12" fill="#94a3b8">Quy tắc: đánh dấu Venom Box trước 09:30, chỉ săn sweep+displacement trong Cutting Zone, hard cutoff 10:30.</text>
</svg>
