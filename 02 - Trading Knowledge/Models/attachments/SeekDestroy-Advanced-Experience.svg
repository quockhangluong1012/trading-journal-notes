<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#1F2937">Quy trình nhận diện Seek &amp; Destroy — kinh nghiệm live/backtest</text>
<text x="24" y="52" font-size="12.5" fill="#6B7280">Kiểm TRƯỚC phiên: weekly range chín? → 3 cú fail? → tin/lịch? → verdict no-trade/scalp. Luật cứng 2 thua → dừng.</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9CA3AF"/></marker></defs>
<rect x="24" y="72" width="712" height="196" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="40" y="96" width="150" height="150" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-opacity="0.5"/>
<text x="115" y="120" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Bước 1</text>
<text x="115" y="140" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">Weekly range</text>
<text x="115" y="155" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">đã chín?</text>
<text x="115" y="177" font-size="8.5" fill="#374151" text-anchor="middle">Đỉnh/đáy tuần lập</text>
<text x="115" y="190" font-size="8.5" fill="#374151" text-anchor="middle">Tue–Thu? Còn DOL</text>
<text x="115" y="203" font-size="8.5" fill="#374151" text-anchor="middle">HTF rõ không?</text>
<rect x="208" y="96" width="150" height="150" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-opacity="0.5"/>
<text x="283" y="120" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Bước 2</text>
<text x="283" y="140" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">"3 cú fail"</text>
<text x="283" y="155" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">đầu phiên?</text>
<text x="216" y="177" font-size="8.5" fill="#374151">• breakout London/NY</text>
<text x="216" y="190" font-size="8.5" fill="#374151">  đều FAIL &amp; đảo</text>
<text x="216" y="203" font-size="8.5" fill="#374151">• MSS LTF liên tục lật</text>
<text x="216" y="216" font-size="8.5" fill="#374151">• cả BSL &amp; SSL bị quét</text>
<rect x="376" y="96" width="150" height="150" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-opacity="0.5"/>
<text x="451" y="120" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Bước 3</text>
<text x="451" y="140" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">Kiểm tin / lịch</text>
<text x="384" y="164" font-size="8.5" fill="#374151">• NFP / FOMC / CPI</text>
<text x="384" y="177" font-size="8.5" fill="#374151">  → là NGÀY TIN,</text>
<text x="384" y="190" font-size="8.5" fill="#374151">  không phải S&D thuần</text>
<text x="384" y="210" font-size="8.5" fill="#374151">• đáo hạn (nếu NQ1),</text>
<text x="384" y="223" font-size="8.5" fill="#374151">  month-end (FX)</text>
<rect x="544" y="96" width="176" height="150" rx="7" fill="#F8FAFC" stroke="#374151" stroke-opacity="0.4"/>
<text x="632" y="120" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Bước 4 — Verdict</text>
<text x="556" y="144" font-size="8.5" fill="#374151" font-weight="600">Xác nhận S&D →</text>
<text x="556" y="157" font-size="8.5" fill="#374151">NO-TRADE hoặc scalp</text>
<text x="556" y="170" font-size="8.5" fill="#374151">tick-by-tick, size cực nhỏ.</text>
<text x="556" y="192" font-size="8.5" fill="#DC2626" font-weight="600">Luật cứng: 2 lệnh thua</text>
<text x="556" y="205" font-size="8.5" fill="#DC2626" font-weight="600">liên tiếp → DỪNG.</text>
<text x="556" y="225" font-size="8.5" fill="#374151">Giảm size/đứng ngoài</text>
<text x="556" y="238" font-size="8.5" fill="#374151">là một quyết định trade.</text>
<path d="M190 171 L206 171" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ar)"/>
<path d="M358 171 L374 171" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ar)"/>
<path d="M526 171 L542 171" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="284" width="712" height="118" rx="8" fill="#F8FAFC" stroke="#E5E7EB"/>
<text x="36" y="306" font-size="12" font-weight="700" fill="#111827">Ghi chú cross-market &amp; kỷ luật review</text>
<rect x="36" y="316" width="222" height="76" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="48" y="336" font-size="10" font-weight="700" fill="#1D4ED8">NQ1 / NDX</text>
<text x="48" y="354" font-size="8.5" fill="#374151">Chop &amp; whipsaw quanh ngày</text>
<text x="48" y="367" font-size="8.5" fill="#374151">đáo hạn phái sinh; kiểm lịch</text>
<text x="48" y="380" font-size="8.5" fill="#374151">expiry trước khi kết luận S&D.</text>
<rect x="269" y="316" width="222" height="76" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="281" y="336" font-size="10" font-weight="700" fill="#15803D">EURUSD / GBPUSD</text>
<text x="281" y="354" font-size="8.5" fill="#374151">Chop cuối tuần, đặc biệt tuần</text>
<text x="281" y="367" font-size="8.5" fill="#374151">month-end khi weekly range đã</text>
<text x="281" y="380" font-size="8.5" fill="#374151">chín và thanh khoản cạn.</text>
<rect x="502" y="316" width="222" height="76" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="514" y="336" font-size="10" font-weight="700" fill="#B45309">XAUUSD</text>
<text x="514" y="354" font-size="8.5" fill="#374151">Whipsaw mạnh quanh tin; dễ</text>
<text x="514" y="367" font-size="8.5" fill="#374151">bị quét hai chiều — ưu tiên</text>
<text x="514" y="380" font-size="8.5" fill="#374151">lịch tin hơn giả định profile.</text>
<text x="24" y="422" font-size="10.5" fill="#374151">Nhận diện qua "3 cú fail" đầu phiên; kiểm weekly range maturity TRƯỚC (liên hệ Friday Profit-Taking).</text>
<text x="24" y="438" font-size="10.5" fill="#374151">Ghi profile: seek-destroy vào mỗi trade/ngày để thống kê tần suất kiểu ngày này theo thời gian.</text>
<text x="24" y="456" font-size="10.5" fill="#6B7280">Giảm size / đứng ngoài KHÔNG phải "bỏ lỡ" — trong S&amp;D nó là quyết định thắng, bảo toàn vốn cho ngày trend thật.</text>
</svg>
