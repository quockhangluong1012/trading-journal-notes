  <path d="M 230 155 l 0 -25" stroke="#4ade80" stroke-width="3" marker-end="url(#arrUp)"/>

  <rect x="620" y="110" width="220" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="730" y="140" font-size="13" fill="#e5e7eb" text-anchor="middle">D1 bias: Bearish</text>
  <path d="M 730 155 l 0 25" stroke="#f87171" stroke-width="3" marker-end="url(#arrDown)"/>

  <g stroke="#f87171" stroke-width="3">
