    <line x1="470" y1="140" x2="440" y2="165"/>
  </g>
  <text x="455" y="190" font-size="12" fill="#f87171" text-anchor="middle">MÂU THUẪN</text>

  <rect x="60" y="250" width="840" height="90" rx="8" fill="rgba(74,222,128,0.10)" stroke="#4ade80" stroke-dasharray="4 3"/>
  <text x="480" y="278" font-size="13.5" fill="#4ade80" text-anchor="middle" font-weight="700">Quyết định: KHÔNG VÀO LỆNH CẢ TUẦN</text>
  <text x="480" y="300" font-size="12" fill="#e5e7eb" text-anchor="middle">trades_this_week: 0 · hit_weekly_target: false</text>
  <text x="480" y="318" font-size="12" fill="#94a3b8" text-anchor="middle">Lý do ghi lại: "W1 vs D1 mâu thuẫn" — bộ lọc đang bảo vệ tài khoản</text>

  <defs>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4ade80"/></marker>
    <marker id="arrDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f87171"/></marker>
