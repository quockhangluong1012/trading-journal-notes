<text x="601.0" y="210" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Trong/sát Killzone London-NY AM, không</text>
<text x="601.0" y="226" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle">tin đỏ 15p</text>
