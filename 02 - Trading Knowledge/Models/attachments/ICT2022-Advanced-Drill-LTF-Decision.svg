<text x="480" y="320" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">Thiếu BẤT KỲ gate nào → chưa được xuống LTF, M5/M1 lúc đó chỉ là noise.</text>
<text x="480" y="344" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa quy trình quyết định — không phải chart giá thật.</text>
