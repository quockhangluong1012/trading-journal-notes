<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Scorecard A+ OSOK — 6 tiêu chí, thang 0/1/2</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Sơ đồ khái niệm minh họa cách chấm điểm, không phải lệnh thật</text>

  <!-- 6 horizontal sliders -->
  <g font-size="13" fill="#e5e7eb">
    <text x="60" y="110">Weekly bias</text>
    <rect x="260" y="95" width="200" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="95" width="200" height="22" rx="4" fill="#4ade80" opacity="0.6"/>
    <text x="470" y="111" font-size="12" fill="#4ade80">2</text>

    <text x="60" y="150">Draw on liquidity</text>
    <rect x="260" y="135" width="200" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="135" width="200" height="22" rx="4" fill="#4ade80" opacity="0.6"/>
    <text x="470" y="151" font-size="12" fill="#4ade80">2</text>

    <text x="60" y="190">Sweep</text>
    <rect x="260" y="175" width="200" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="175" width="100" height="22" rx="4" fill="#eab308" opacity="0.6"/>
    <text x="470" y="191" font-size="12" fill="#eab308">1</text>

    <text x="60" y="230">Displacement</text>
    <rect x="260" y="215" width="200" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="215" width="200" height="22" rx="4" fill="#4ade80" opacity="0.6"/>
    <text x="470" y="231" font-size="12" fill="#4ade80">2</text>

    <text x="60" y="270">Kill zone timing</text>
    <rect x="260" y="255" width="200" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="255" width="200" height="22" rx="4" fill="#4ade80" opacity="0.6"/>
    <text x="470" y="271" font-size="12" fill="#4ade80">2</text>

    <text x="60" y="310">Confluence OTE/OB</text>
    <rect x="260" y="295" width="200" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="295" width="100" height="22" rx="4" fill="#eab308" opacity="0.6"/>
    <text x="470" y="311" font-size="12" fill="#eab308">1</text>
  </g>

  <!-- Gauge 0-12 -->
  <text x="720" y="110" font-size="13.5" fill="#e5e7eb" text-anchor="middle">Tổng điểm (gauge 0–12)</text>
  <rect x="560" y="130" width="320" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <rect x="560" y="130" width="160" height="36" rx="8" fill="#f87171" opacity="0.5"/>
  <rect x="720" y="130" width="80" height="36" fill="#eab308" opacity="0.5"/>
  <rect x="800" y="130" width="80" height="36" rx="8" fill="#4ade80" opacity="0.5"/>
  <text x="640" y="153" font-size="11.5" fill="#f87171" text-anchor="middle">≤6 Không trade</text>
  <text x="760" y="153" font-size="11.5" fill="#eab308" text-anchor="middle">7–9 Cân nhắc</text>
  <text x="840" y="153" font-size="11.5" fill="#4ade80" text-anchor="middle">10–12 A+</text>

  <!-- needle at 10 -->
  <line x1="800" y1="200" x2="800" y2="170" stroke="#e5e7eb" stroke-width="3"/>
  <circle cx="800" cy="200" r="6" fill="#e5e7eb"/>
  <text x="800" y="225" font-size="13" fill="#e5e7eb" text-anchor="middle" font-weight="700">Tổng: 10/12 → A+, bắn</text>

  <rect x="60" y="400" width="840" height="120" rx="8" fill="rgba(168,85,247,0.10)" stroke="#a855f7" stroke-dasharray="4 3"/>
  <text x="480" y="430" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="700">Quy tắc scorecard</text>
  <text x="480" y="455" font-size="12" fill="#e5e7eb" text-anchor="middle">Chấm điểm TRƯỚC khi vào lệnh, không hồi tố sau khi biết kết quả.</text>
  <text x="480" y="475" font-size="12" fill="#e5e7eb" text-anchor="middle">≤6 = không trade; 7–9 = cân nhắc kỹ (thường là B-setup); 10–12 = A+ mới bắn.</text>
  <text x="480" y="495" font-size="12" fill="#e5e7eb" text-anchor="middle">Thang điểm là công cụ hỗ trợ tính nhất quán — không phải công thức toán học đã kiểm chứng.</text>
</svg>
