<text x="500" y="172" font-size="12" fill="#eab308" text-anchor="end">Đỉnh tuần đã chín (4/4)</text>
<line x1="300" y1="190" x2="300" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="294.0" y="200" width="12" height="35" fill="#ef4444"/>
