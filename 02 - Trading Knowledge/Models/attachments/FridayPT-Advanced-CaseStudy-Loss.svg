<line x1="600" y1="380" x2="600" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="594.0" y="390" width="12" height="45" fill="#ef4444"/>
<line x1="60" y1="410" x2="900" y2="410" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2"/>
<text x="610" y="402" font-size="11" fill="#f87171" text-anchor="start">Stop quét, xóa lợi nhuận tuần</text>
<path d="M 400 195 L 600 425" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#arrLoss)"/>
<rect x="60" y="440" width="836" height="80" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="80" y="464" font-size="12" fill="#e5e7eb" text-anchor="start">missing_step: range-maturity check + calendar check bị bỏ qua.</text>
<text x="80" y="486" font-size="12" fill="#e5e7eb" text-anchor="start">Đu trend đúng lúc dòng vốn tổ chức giảm exposure = đứng sai phía dòng tiền.</text>
<text x="80" y="508" font-size="12" fill="#e5e7eb" text-anchor="start">friday_action sai: vào lệnh mới không kiểm tra thay vì take-profit/manage.</text>
<defs><marker id="arrLoss" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa.</text>
</svg>
