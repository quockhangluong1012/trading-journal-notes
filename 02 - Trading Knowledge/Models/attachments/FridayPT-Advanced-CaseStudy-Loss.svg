<rect x="344.0" y="215" width="12" height="35" fill="#ef4444"/>
<!-- Fri: FOMO entry long near high without checking maturity -->
<line x1="400" y1="195" x2="400" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="394.0" y="200" width="12" height="35" fill="#22c55e"/>
<circle cx="400" cy="195" r="5" fill="#f87171"/>
<text x="406" y="185" font-size="11" font-weight="700" fill="#f87171" text-anchor="start">FOMO entry — không check</text>
<text x="406" y="200" font-size="10" fill="#f87171" text-anchor="start">range maturity/lịch</text>
<!-- then reversion crashes through weekly open sweeping stop -->
<line x1="450" y1="220" x2="450" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="444.0" y="230" width="12" height="55" fill="#ef4444"/>
