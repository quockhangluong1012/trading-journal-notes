<text x="42" y="360" font-size="9.8" fill="#374151">Dụ sellers vào ở deep discount, rồi đảo lên mạnh</text><text x="42" y="378" font-size="9.8" fill="#374151">cho long entry — sweep là dấu vết dòng lệnh.</text>
