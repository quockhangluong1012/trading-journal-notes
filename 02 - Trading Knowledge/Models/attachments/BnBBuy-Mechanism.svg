<text x="404" y="360" font-size="9.8" fill="#374151">Induce selling + cung cấp sell-side liquidity để</text><text x="404" y="378" font-size="9.8" fill="#374151">tổ chức vào long ngay tại discount (giá hời).</text>
<text x="24" y="446" font-size="10.5" fill="#6B7280">Cả hai engine đều kết thúc bằng một cú đảo lên tại discount — đó là nơi tìm 5m MSS để vào long.</text>
