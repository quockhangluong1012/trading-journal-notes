<text x="100.0" y="288.0" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Sau DST (lệch 1 giờ) — khối CBDR dịch lệch so với nhãn giờ</text>
<path d="M 350,230 Q 380,260.0 410,290" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#arrRedDST)"/>
<text x="480.0" y="460.0" font-size="13" font-weight="400" fill="#f87171" text-anchor="middle">Lệch 1 giờ nếu nguồn dữ liệu chưa đổi timezone</text>
