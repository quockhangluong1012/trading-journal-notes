<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Chọn PD array sau MSS — thứ tự ưu tiên khi vào retest</text>
<!-- price path with 3 PD arrays after displacement -->
<line x1="40" y1="450" x2="920" y2="450" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="350" x2="920" y2="350" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="250" x2="920" y2="250" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="150" x2="920" y2="150" stroke="#1f2937" stroke-width="1"/>
<!-- displacement candles going up -->
<line x1="100" y1="400" x2="100" y2="460" stroke="#9ca3af" stroke-width="1.5"/><rect x="94" y="410" width="12" height="45" fill="#22c55e"/>
<line x1="140" y1="330" x2="140" y2="410" stroke="#9ca3af" stroke-width="1.5"/><rect x="134" y="345" width="12" height="60" fill="#22c55e"/>
<line x1="180" y1="230" x2="180" y2="340" stroke="#9ca3af" stroke-width="1.5"/><rect x="174" y="245" width="12" height="80" fill="#22c55e"/>
<text x="90" y="200" font-size="13" font-weight="700" fill="#e5e7eb" text-anchor="start">Displacement (MSS lên)</text>
<!-- Unicorn overlap zone -->
<rect x="150" y="330" width="60" height="55" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="150" y="345" width="60" height="35" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="180" y="410" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="700">① Unicorn (overlap)</text>
<!-- FVG only zone -->
<rect x="290" y="345" width="70" height="35" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="325" y="400" font-size="11" fill="#3b82f6" text-anchor="middle">② FVG sạch</text>
<!-- OB only zone -->
<rect x="430" y="380" width="70" height="35" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="465" y="435" font-size="11" fill="#ec4899" text-anchor="middle">③ Order Block</text>
<!-- Breaker zone -->
<rect x="570" y="410" width="70" height="35" fill="rgba(236,72,153,0.12)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="605" y="465" font-size="11" fill="#94a3b8" text-anchor="middle">④ Breaker (dự phòng)</text>
<!-- continuation candles -->
<line x1="240" y1="250" x2="240" y2="330" stroke="#9ca3af" stroke-width="1.5"/><rect x="234" y="265" width="12" height="60" fill="#22c55e"/>
<line x1="700" y1="200" x2="700" y2="280" stroke="#9ca3af" stroke-width="1.5"/><rect x="694" y="215" width="12" height="60" fill="#22c55e"/>
<line x1="760" y1="160" x2="760" y2="230" stroke="#9ca3af" stroke-width="1.5"/><rect x="754" y="175" width="12" height="50" fill="#22c55e"/>
<!-- priority table box -->
<rect x="40" y="490" width="880" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="60" y="514" font-size="12.5" font-weight="700" fill="#e5e7eb" text-anchor="start">Nguyên tắc: vào PD array ĐẦU TIÊN giá chạm sau MSS — chờ hồi sâu hơn thường lỡ lệnh.</text>
<text x="60" y="538" font-size="12" fill="#94a3b8" text-anchor="start">① Unicorn (Breaker+FVG overlap): stop chặt nhất, RR cao nhất → ưu tiên tuyệt đối khi có.</text>
<text x="60" y="558" font-size="12" fill="#94a3b8" text-anchor="start">② FVG sạch → ③ Order Block (khi FVG lấp nhanh) → ④ Breaker (dự phòng khi không còn lựa chọn khác).</text>
</svg>
