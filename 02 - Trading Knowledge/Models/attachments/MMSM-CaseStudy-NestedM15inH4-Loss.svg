<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case Study — Loss: MMSM M15 "sạch" chỉ là 1 bậc LRB trong MMSM H4 (-1R)</text>

<text x="60" y="65" font-size="12" fill="#94a3b8">H4: buy program lớn vẫn đang chạy (chưa Smart Money High H4)</text>
<polyline points="60,375 160,335 260,295 360,255 460,215 560,175 660,145 760,120 860,100" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.45"/>

<rect x="330" y="200" width="260" height="160" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-dasharray="4 3"/>
<text x="340" y="218" font-size="11" fill="#38bdf8">M15 MMSM "sạch" bên trong</text>

<line x1="340" y1="240" x2="580" y2="240" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="350,300 380,300 380,270 410,270 410,240" fill="none" stroke="#22c55e" stroke-width="2"/>
<circle cx="440" cy="240" r="12" fill="none" stroke="#f87171" stroke-width="2"/>
<polyline points="440,240 470,270 510,295" fill="none" stroke="#ef4444" stroke-width="2"/>
<circle cx="470" cy="270" r="5" fill="#f87171"/>
<text x="470" y="320" font-size="10" fill="#f87171">Entry Sell M15</text>

<polyline points="510,295 560,250 620,210 680,180" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<line x1="470" y1="270" x2="960" y2="270" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="700" y="300" font-size="11" fill="#f87171">SL quét — H4 nuốt luôn nhịp hồi M15</text>

<rect x="60" y="420" width="560" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="76" y="442" font-size="12" fill="#e5e7eb">M15 có đủ sweep + MSS + LRS, trông hoàn hảo trên M15</text>
<text x="76" y="462" font-size="12" fill="#e5e7eb">Nhưng H4 chưa hề có Smart Money High + MSS giảm —</text>
<text x="76" y="482" font-size="12" fill="#e5e7eb">SMH M15 chỉ là đỉnh của 1 bậc LRB bên trong buy program H4</text>
<text x="76" y="505" font-size="12" fill="#f87171">Kết quả: Loss -1R — giữ lệnh quá lâu, không chốt sớm tại H1</text>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa</text>
</svg>
