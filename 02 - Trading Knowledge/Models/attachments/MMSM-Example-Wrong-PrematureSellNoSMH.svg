<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ví dụ sai — Bán sớm khi chưa có Smart Money High xác nhận</text>

<!-- up leg still in progress -->
<rect x="90" y="480" width="12" height="50" fill="#22c55e"/><line x1="96" y1="470" x2="96" y2="540" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="440" width="12" height="55" fill="#22c55e"/><line x1="126" y1="428" x2="126" y2="505" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="150" y="395" width="12" height="60" fill="#22c55e"/><line x1="156" y1="382" x2="156" y2="465" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="180" y="355" width="12" height="55" fill="#22c55e"/><line x1="186" y1="343" x2="186" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
<!-- small red candle mistaken as reversal -->
<rect x="210" y="345" width="12" height="20" fill="#ef4444"/><line x1="216" y1="330" x2="216" y2="368" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="216" cy="355" r="20" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="216" y="300" font-size="11" fill="#f87171" text-anchor="middle">Nến đỏ nhỏ</text>
<text x="216" y="314" font-size="11" fill="#f87171" text-anchor="middle">— chưa phải MSS</text>

<!-- entry marker wrong -->
<line x1="0" y1="355" x2="960" y2="355" stroke="#f87171" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
<circle cx="222" cy="360" r="6" fill="#f87171"/>
<text x="240" y="380" font-size="12" fill="#f87171">Entry Sell — chưa có sweep BSL rõ, chưa MSS</text>

<!-- continues rising with more legs -->
<rect x="240" y="300" width="12" height="60" fill="#22c55e"/><line x1="246" y1="288" x2="246" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="270" y="255" width="12" height="65" fill="#22c55e"/><line x1="276" y1="242" x2="276" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="300" y="205" width="12" height="70" fill="#22c55e"/><line x1="306" y1="192" x2="306" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="330" y="155" width="12" height="75" fill="#22c55e"/><line x1="336" y1="142" x2="336" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="360" y="115" width="12" height="70" fill="#22c55e"/><line x1="366" y1="102" x2="366" y2="150" stroke="#9ca3af" stroke-width="1.5"/>

<!-- SL hit -->
<line x1="180" y1="230" x2="960" y2="230" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="700" y="225" font-size="12" fill="#f87171">Stop-loss bị quét</text>

<!-- Real SMH further up -->
<circle cx="366" cy="108" r="16" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="450" y="90" font-size="12" fill="#f87171">Smart Money High thật ở xa hơn</text>
<polyline points="372,115 420,145 470,175" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Chart minh họa khái niệm — vào lệnh khi cấu trúc chưa xác nhận, không phải dữ liệu giao dịch thật</text>
</svg>
