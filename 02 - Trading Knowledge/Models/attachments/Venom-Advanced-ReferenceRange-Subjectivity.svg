<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="480" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Tính chủ quan khi chọn "range tham chiếu" của Venom Box</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Sơ đồ minh họa phản biện — 3 người chọn 3 range khác nhau từ cùng một chart</text>

  <g stroke="#1f2937" stroke-width="1">
    <line x1="60" y1="130" x2="920" y2="130"/>
    <line x1="60" y1="210" x2="920" y2="210"/>
    <line x1="60" y1="290" x2="920" y2="290"/>
  </g>

  <!-- price action candles same for all 3 -->
  <g>
    <line x1="120" y1="160" x2="120" y2="240" stroke="#9ca3af" stroke-width="1.5"/><rect x="114" y="170" width="12" height="55" fill="#ef4444"/>
    <line x1="160" y1="150" x2="160" y2="230" stroke="#9ca3af" stroke-width="1.5"/><rect x="154" y="160" width="12" height="55" fill="#22c55e"/>
    <line x1="200" y1="170" x2="200" y2="260" stroke="#9ca3af" stroke-width="1.5"/><rect x="194" y="180" width="12" height="55" fill="#ef4444"/>
    <line x1="240" y1="140" x2="240" y2="220" stroke="#9ca3af" stroke-width="1.5"/><rect x="234" y="150" width="12" height="55" fill="#22c55e"/>
  </g>

  <!-- Trader A: uses Asia range -->
  <line x1="60" y1="245" x2="380" y2="245" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="238" font-size="12" fill="#3b82f6">Trader A: Asia range low</text>

  <!-- Trader B: uses pre-market 07:00-09:30 only -->
  <line x1="180" y1="225" x2="380" y2="225" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="218" font-size="12" fill="#eab308">Trader B: chỉ pre-market 07:00–09:30</text>

  <!-- Trader C: uses PDH/PDL -->
  <line x1="60" y1="270" x2="380" y2="270" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="285" font-size="12" fill="#a855f7">Trader C: PDH/PDL (Previous Day)</text>

  <rect x="440" y="140" width="460" height="160" rx="8" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="670" y="168" font-size="13.5" fill="#f87171" text-anchor="middle" font-weight="700">Vấn đề</text>
  <text x="670" y="192" font-size="12" fill="#e5e7eb" text-anchor="middle">3 mốc tham chiếu khác nhau → 3 kết luận</text>
  <text x="670" y="210" font-size="12" fill="#e5e7eb" text-anchor="middle">"đã sweep" hoặc "chưa sweep" khác nhau</text>
  <text x="670" y="234" font-size="12" fill="#e5e7eb" text-anchor="middle">trên CÙNG một chart, CÙNG một thời điểm.</text>
  <text x="670" y="258" font-size="12" fill="#e5e7eb" text-anchor="middle">Không có định nghĩa "chính thức" duy nhất</text>
  <text x="670" y="278" font-size="12" fill="#e5e7eb" text-anchor="middle">— dễ hindsight-fit range theo kết quả.</text>

  <rect x="60" y="340" width="840" height="110" rx="8" fill="rgba(168,85,247,0.10)" stroke="#a855f7" stroke-dasharray="4 3"/>
  <text x="480" y="366" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="700">Giảm thiểu</text>
  <text x="480" y="390" font-size="12" fill="#e5e7eb" text-anchor="middle">Cố định TRƯỚC 1 quy tắc chọn range cho mỗi thị trường (đã ghi ở Chuyên sâu B #3),</text>
  <text x="480" y="410" font-size="12" fill="#e5e7eb" text-anchor="middle">không đổi quy tắc theo từng ngày để "khớp" với setup đang thấy.</text>
  <text x="480" y="430" font-size="11.5" fill="#94a3b8" text-anchor="middle">Vẫn không loại bỏ được chủ quan ban đầu khi CHỌN quy tắc — chỉ giảm chủ quan LẶP LẠI mỗi ngày.</text>
</svg>
