<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="520" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="18" font-weight="700" fill="#f87171" text-anchor="start">Case 6 — Loss: entry market đúng 08:30:00 dính spread giãn (XAUUSD)</text>
<line x1="24" y1="80" x2="936" y2="80" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="160" x2="936" y2="160" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="240" x2="936" y2="240" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="320" x2="936" y2="320" stroke="#1f2937" stroke-width="1"/>
<!-- price shown as thin structure with a gap between intended and actual fill -->
<line x1="150" y1="180" x2="150" y2="260" stroke="#9ca3af" stroke-width="1.5"/><rect x="144" y="200" width="12" height="45" fill="#ef4444"/>
<text x="70" y="165" font-size="12" font-weight="700" fill="#eab308" text-anchor="start">08:30:00 NFP</text>
<!-- intended fill line -->
<line x1="90" y1="220" x2="500" y2="220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
<text x="510" y="224" font-size="11" fill="#38bdf8" text-anchor="start">Giá dự kiến khớp (theo chart)</text>
<!-- actual fill line, worse -->
<line x1="90" y1="250" x2="500" y2="250" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2"/>
<text x="510" y="254" font-size="11" fill="#f87171" text-anchor="start">Giá khớp thật (spread giãn ~15-25 pip)</text>
<path d="M300,220 L300,250" stroke="#f87171" stroke-width="2" marker-end="url(#arrSS)"/>
<text x="310" y="240" font-size="10.5" fill="#f87171" text-anchor="start">Chênh lệch</text>
<!-- continuation candles showing price still moves favorably but stop already wider -->
<line x1="350" y1="230" x2="350" y2="290" stroke="#9ca3af" stroke-width="1.5"/><rect x="344" y="240" width="12" height="45" fill="#ef4444"/>
<line x1="400" y1="270" x2="400" y2="330" stroke="#9ca3af" stroke-width="1.5"/><rect x="394" y="280" width="12" height="45" fill="#ef4444"/>
<line x1="450" y1="240" x2="450" y2="310" stroke="#9ca3af" stroke-width="1.5"/><rect x="444" y="250" width="12" height="45" fill="#22c55e"/>
<text x="450" y="345" font-size="11" fill="#f87171" text-anchor="middle">Nến hồi wick quét đúng SL đã bị "kéo giãn" bởi entry xấu</text>
<rect x="60" y="380" width="840" height="120" rx="8" fill="rgba(248,113,113,0.08)" stroke="#f87171" stroke-width="1.5"/>
<text x="480" y="406" font-size="13" fill="#f87171" font-weight="700" text-anchor="middle">missing_step: news (spread/slippage chưa tính vào kế hoạch)</text>
<text x="90" y="430" font-size="12" fill="#e5e7eb" text-anchor="start">Vào market ngay 08:30:00 khi NFP ra trên XAUUSD — spread giãn khiến entry xấu hơn 15-25 pip.</text>
<text x="90" y="452" font-size="12" fill="#e5e7eb" text-anchor="start">SL tính theo giá chart bị chạm sớm hơn dự kiến dù hướng phân tích đúng.</text>
<text x="90" y="478" font-size="12" fill="#94a3b8" text-anchor="start">Bài học: dùng limit tại PD array hoặc chờ 10-15 giây đầu ổn định thay vì market ngay giây phát tin.</text>
<defs><marker id="arrSS" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker></defs>
</svg>
