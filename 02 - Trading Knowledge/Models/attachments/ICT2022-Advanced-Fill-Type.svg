<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="480" y="32" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Bốn kiểu fill FVG — và bẫy R:R</text>
<text x="145.0" y="90" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Wick-fill</text>
<rect x="40" y="120" width="210" height="340" fill="none" stroke="#334155" stroke-width="1"/>
<rect x="50" y="240" width="190" height="100" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="50" y1="290.0" x2="240" y2="290.0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="145.0" y1="246" x2="145.0" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="137.0" y="180" width="16" height="30" fill="#ef4444"/>
<text x="145.0" y="482" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Chỉ râu chạm mép — fill nông</text>
<text x="375.0" y="90" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">CE-fill (50%)</text>
<rect x="270" y="120" width="210" height="340" fill="none" stroke="#334155" stroke-width="1"/>
<rect x="280" y="240" width="190" height="100" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="280" y1="290.0" x2="470" y2="290.0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="375.0" y1="294.0" x2="375.0" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="367.0" y="200" width="16" height="30" fill="#ef4444"/>
<text x="375.0" y="482" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Điểm tham chiếu chuẩn</text>
<text x="605.0" y="90" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">Body-through</text>
<rect x="500" y="120" width="210" height="340" fill="none" stroke="#334155" stroke-width="1"/>
<rect x="510" y="240" width="190" height="100" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="510" y1="290.0" x2="700" y2="290.0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="605.0" y1="210" x2="605.0" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="597.0" y="210" width="16" height="160" fill="#ef4444"/>
<text x="605.0" y="482" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Đóng xuyên qua = INVALID</text>
<text x="835.0" y="90" font-size="13" font-weight="700" fill="#eab308" text-anchor="middle">Partial-fill</text>
<rect x="730" y="120" width="210" height="340" fill="none" stroke="#334155" stroke-width="1"/>
<rect x="740" y="240" width="190" height="100" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="740" y1="290.0" x2="930" y2="290.0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="835.0" y1="286.0" x2="835.0" y2="210" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="827.0" y="210" width="16" height="82.0" fill="#ef4444"/>
<line x1="857.0" y1="170" x2="857.0" y2="298.0" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="850.0" y="180" width="14" height="112.0" fill="#22c55e"/>
<text x="835.0" y="482" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Khớp 1 phần rồi chạy</text>
<text x="480" y="570" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa 4 kiểu fill — không phải chart giá thật.</text>
</svg>
