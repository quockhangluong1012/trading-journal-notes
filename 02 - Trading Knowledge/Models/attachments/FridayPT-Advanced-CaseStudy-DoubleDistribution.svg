<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Case 7 — Double distribution: hồi xong rồi đẩy tiếp (Win, A+ chọn lọc)</text>
<line x1="24" y1="480" x2="936" y2="480" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="380" x2="936" y2="380" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="280" x2="936" y2="280" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="180" x2="936" y2="180" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="360" x2="900" y2="360" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
<text x="66" y="352" font-size="12" fill="#38bdf8" text-anchor="start">Weekly Open</text>
<text x="112" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Tue-Thu</text>
<text x="500" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Fri sáng</text>
<text x="800" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Fri chiều</text>
<!-- prior uptrend making weekly high -->
<line x1="130" y1="260" x2="130" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="124.0" y="270" width="12" height="45" fill="#22c55e"/>
<line x1="190" y1="220" x2="190" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="184.0" y="230" width="12" height="45" fill="#22c55e"/>
<line x1="250" y1="180" x2="250" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="244.0" y="190" width="12" height="45" fill="#22c55e"/>
<line x1="60" y1="180" x2="330" y2="180" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="336" y="184" font-size="11" fill="#eab308" text-anchor="start">Đỉnh tuần</text>
<!-- Fri morning: reversion down to weekly open -->
<line x1="330" y1="220" x2="330" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="324.0" y="230" width="12" height="45" fill="#ef4444"/>
<line x1="390" y1="260" x2="390" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="384.0" y="270" width="12" height="55" fill="#ef4444"/>
<line x1="450" y1="300" x2="450" y2="365" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="444.0" y="310" width="12" height="50" fill="#ef4444"/>
<text x="390" y="410" font-size="11" fill="#4ade80" text-anchor="middle">Reversion sáng — "tưởng đã xong"</text>
<!-- Fri afternoon: fresh MSS up, second leg continuation -->
<line x1="510" y1="330" x2="510" y2="370" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="504.0" y="335" width="12" height="30" fill="#22c55e"/>
<line x1="510" y1="330" x2="530" y2="300" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="540" y="298" font-size="11" fill="#a855f7" text-anchor="start">MSS mới đồng bias tuần</text>
<line x1="570" y1="270" x2="570" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="564.0" y="280" width="12" height="50" fill="#22c55e"/>
<circle cx="570" cy="270" r="5" fill="#4ade80"/>
<text x="576" y="260" font-size="11" font-weight="700" fill="#4ade80" text-anchor="start">Entry A+ (không phải FOMO)</text>
<line x1="630" y1="220" x2="630" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="624.0" y="230" width="12" height="50" fill="#22c55e"/>
<line x1="690" y1="190" x2="690" y2="245" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="684.0" y="195" width="12" height="45" fill="#22c55e"/>
<line x1="750" y1="170" x2="750" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="744.0" y="175" width="12" height="35" fill="#22c55e"/>
<rect x="60" y="420" width="836" height="90" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
<text x="80" y="444" font-size="12" fill="#e5e7eb" text-anchor="start">Sau khi hồi về weekly open sáng, chiều xuất hiện MSS mới đồng hướng bias tuần</text>
<text x="80" y="466" font-size="12" fill="#e5e7eb" text-anchor="start">với displacement rõ — không phải đu FOMO mà là entry A+ hợp lệ vì có cấu trúc mới.</text>
<text x="80" y="488" font-size="12" fill="#e5e7eb" text-anchor="start">friday_action: a-plus-entry. Bài học: chạm weekly open không phải "hết film".</text>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa.</text>
</svg>
