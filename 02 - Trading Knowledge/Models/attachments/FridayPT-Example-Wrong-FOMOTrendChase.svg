<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Ví dụ SAI: đu trend chiều Fri, bị reversion quét stop</text>
<line x1="24" y1="120" x2="936" y2="120" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="220" x2="936" y2="220" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="320" x2="936" y2="320" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="420" x2="936" y2="420" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="400" x2="900" y2="400" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
<text x="66" y="392" font-size="12" fill="#38bdf8" text-anchor="start">Weekly Opening Price</text>
<text x="112" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Mon</text>
<text x="292" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Tue</text>
<text x="472" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Wed</text>
<text x="652" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Thu</text>
<text x="832" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Fri</text>
<!-- same Tue-Wed expansion as correct example -->
<line x1="178" y1="330" x2="178" y2="390" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="172.0" y="335" width="12" height="45" fill="#22c55e"/>
<line x1="222" y1="270" x2="222" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="216.0" y="275" width="12" height="60" fill="#22c55e"/>
<line x1="266" y1="200" x2="266" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="260.0" y="210" width="12" height="65" fill="#22c55e"/>
<line x1="310" y1="150" x2="310" y2="230" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="304.0" y="160" width="12" height="55" fill="#22c55e"/>
<line x1="60" y1="150" x2="500" y2="150" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="500" y="142" font-size="12" fill="#eab308" text-anchor="end">Đỉnh tuần đã lập</text>
<!-- Thu distribution -->
<line x1="398" y1="160" x2="398" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="392.0" y="170" width="12" height="40" fill="#ef4444"/>
<line x1="442" y1="180" x2="442" y2="235" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="436.0" y="190" width="12" height="35" fill="#ef4444"/>
<line x1="486" y1="195" x2="486" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="480.0" y="205" width="12" height="35" fill="#ef4444"/>
<!-- Fri: trader enters new LONG (FOMO) near the high, marked entry -->
<line x1="530" y1="210" x2="530" y2="265" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="524.0" y="220" width="12" height="35" fill="#22c55e"/>
<line x1="574" y1="195" x2="574" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="568.0" y="200" width="12" height="35" fill="#22c55e"/>
<circle cx="574" cy="195" r="5" fill="#f87171"/>
<text x="580" y="185" font-size="12" font-weight="700" fill="#f87171" text-anchor="start">FOMO entry LONG</text>
<!-- then reversion down through weekly open sweeping stop -->
<line x1="618" y1="220" x2="618" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="612.0" y="230" width="12" height="50" fill="#ef4444"/>
<line x1="662" y1="270" x2="662" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="656.0" y="280" width="12" height="55" fill="#ef4444"/>
<line x1="706" y1="320" x2="706" y2="405" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="700.0" y="330" width="12" height="65" fill="#ef4444"/>
<line x1="750" y1="380" x2="750" y2="450" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="744.0" y="390" width="12" height="55" fill="#ef4444"/>
<line x1="60" y1="290" x2="900" y2="290" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2"/>
<text x="760" y="282" font-size="11" fill="#f87171" text-anchor="start">Stop bị quét tại đây</text>
<path d="M 574 195 L 750 430" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#arrWrong)"/>
<text x="700" y="480" font-size="12" fill="#f87171" text-anchor="middle">Reversion về/qua weekly open — xóa lợi nhuận tuần</text>
<defs><marker id="arrWrong" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Chart minh họa lỗi thường gặp, không phải dữ liệu giao dịch thật.</text>
</svg>
