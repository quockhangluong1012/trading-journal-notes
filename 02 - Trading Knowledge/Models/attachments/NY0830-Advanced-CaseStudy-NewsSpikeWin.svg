<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="560" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="18" font-weight="700" fill="#4ade80" text-anchor="start">Case 5 — Win: chờ nến tin đầu đóng qua double-sided spike rồi mới vào</text>
<line x1="24" y1="80" x2="936" y2="80" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="160" x2="936" y2="160" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="240" x2="936" y2="240" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="320" x2="936" y2="320" stroke="#1f2937" stroke-width="1"/>
<text x="60" y="105" font-size="12" font-weight="700" fill="#eab308" text-anchor="start">08:30:00 CPI ra — nến quét 2 chiều</text>
<line x1="150" y1="120" x2="150" y2="280" stroke="#9ca3af" stroke-width="1.5"/><rect x="144" y="150" width="12" height="90" fill="#ef4444"/>
<text x="60" y="300" font-size="11" fill="#94a3b8" text-anchor="start">Wick quét cả 2 phía trong &lt;15 giây — nến "tin đầu" chưa đóng ổn định</text>
<!-- second candle after settling -->
<line x1="230" y1="200" x2="230" y2="290" stroke="#9ca3af" stroke-width="1.5"/><rect x="224" y="215" width="12" height="60" fill="#ef4444"/>
<text x="230" y="185" font-size="11" fill="#a855f7" text-anchor="middle">MSS thật xác nhận sau 1-2 nến 1m</text>
<line x1="200" y1="270" x2="600" y2="270" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>
<!-- entry + continuation -->
<line x1="300" y1="240" x2="300" y2="280" stroke="#9ca3af" stroke-width="1.5"/><rect x="294" y="245" width="12" height="25" fill="#22c55e"/>
<path d="M306,260 L350,260" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrNS)"/>
<text x="355" y="255" font-size="11" fill="#22c55e" font-weight="700" text-anchor="start">Entry SELL sau khi nến ổn định</text>
<line x1="420" y1="270" x2="420" y2="340" stroke="#9ca3af" stroke-width="1.5"/><rect x="414" y="280" width="12" height="55" fill="#ef4444"/>
<line x1="480" y1="320" x2="480" y2="390" stroke="#9ca3af" stroke-width="1.5"/><rect x="474" y="330" width="12" height="55" fill="#ef4444"/>
<line x1="540" y1="370" x2="540" y2="430" stroke="#9ca3af" stroke-width="1.5"/><rect x="534" y="380" width="12" height="45" fill="#ef4444"/>
<line x1="500" y1="430" x2="900" y2="430" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="505" y="450" font-size="11" fill="#eab308" text-anchor="start">TP tại DOL kế</text>
<rect x="60" y="470" width="840" height="70" rx="8" fill="rgba(74,222,128,0.08)" stroke="#4ade80" stroke-width="1.5"/>
<text x="480" y="494" font-size="12.5" fill="#4ade80" font-weight="700" text-anchor="middle">missing_step: none — kỷ luật chờ nến tin ổn định trước khi đọc MSS</text>
<text x="480" y="516" font-size="11.5" fill="#94a3b8" text-anchor="middle">Kết quả minh họa: +2.2R. Bài học: raid đầu tiên trong 15 giây sau tin thường là nhiễu, không phải cấu trúc thật.</text>
<defs><marker id="arrNS" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker></defs>
</svg>
