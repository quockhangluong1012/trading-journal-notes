<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">IPDA lookback 20/40/60 ngày — quy ước chưa kiểm chứng độc lập</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Sơ đồ minh họa khái niệm phản biện, không phải dữ liệu giá thật</text>

  <g>
    <rect x="80" y="110" width="240" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="140" font-size="13" fill="#e5e7eb" text-anchor="middle">20 ngày (~4 tuần)</text>
    <text x="200" y="160" font-size="11" fill="#94a3b8" text-anchor="middle">"IPDA lookback ngắn"</text>

    <rect x="360" y="110" width="240" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="480" y="140" font-size="13" fill="#e5e7eb" text-anchor="middle">40 ngày (~8 tuần)</text>
    <text x="480" y="160" font-size="11" fill="#94a3b8" text-anchor="middle">"IPDA lookback trung"</text>

    <rect x="640" y="110" width="240" height="70" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="760" y="140" font-size="13" fill="#e5e7eb" text-anchor="middle">60 ngày (~12 tuần)</text>
    <text x="760" y="160" font-size="11" fill="#94a3b8" text-anchor="middle">"IPDA lookback dài"</text>
  </g>

  <rect x="60" y="220" width="840" height="150" rx="8" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="480" y="248" font-size="13" fill="#f87171" text-anchor="middle" font-weight="700">Vấn đề nguồn gốc</text>
  <text x="480" y="272" font-size="12" fill="#e5e7eb" text-anchor="middle">Bộ số 20/40/60 ngày xuất phát từ thuật ngữ ICT truyền miệng (Interbank Price</text>
  <text x="480" y="292" font-size="12" fill="#e5e7eb" text-anchor="middle">Delivery Algorithm), không có tài liệu học thuật hay dữ liệu định lượng công khai</text>
  <text x="480" y="312" font-size="12" fill="#e5e7eb" text-anchor="middle">nào xác nhận đây là chu kỳ "thuật toán ngân hàng" thực sự sử dụng.</text>
  <text x="480" y="336" font-size="11.5" fill="#94a3b8" text-anchor="middle">OSOK dùng "20 tuần" cho weekly bias (mục 2) — một biến thể khác của cùng quy ước —</text>
  <text x="480" y="354" font-size="11.5" fill="#94a3b8" text-anchor="middle">nên kế thừa luôn sự thiếu kiểm chứng độc lập của khái niệm gốc.</text>
</svg>
