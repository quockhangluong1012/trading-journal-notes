<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ví dụ đúng — Sweep BSL → MSS → vào Sell tại FVG của LRS1</text>

<rect x="48" y="60" width="864" height="180" fill="rgba(239,68,68,0.08)"/>
<rect x="48" y="240" width="864" height="260" fill="rgba(34,197,94,0.08)"/>
<line x1="48" y1="240" x2="912" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="860" y="255" font-size="12" fill="#38bdf8">CE/50%</text>

<!-- up leg -->
<rect x="90" y="390" width="12" height="55" fill="#22c55e"/><line x1="96" y1="380" x2="96" y2="455" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="355" width="12" height="60" fill="#22c55e"/><line x1="126" y1="342" x2="126" y2="425" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="150" y="310" width="12" height="65" fill="#22c55e"/><line x1="156" y1="298" x2="156" y2="385" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="180" y="250" width="12" height="90" fill="#22c55e"/><line x1="186" y1="238" x2="186" y2="358" stroke="#9ca3af" stroke-width="1.5"/>

<!-- BSL -->
<line x1="48" y1="238" x2="500" y2="238" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="228" font-size="12" fill="#eab308">BSL</text>

<!-- sweep candle -->
<defs><marker id="arrOMMSM3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,6 L6,3 L0,0 Z" fill="#f97316"/></marker></defs>
<rect x="210" y="200" width="14" height="60" fill="#ef4444"/><line x1="217" y1="180" x2="217" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<path d="M280,150 C250,165 230,190 220,215" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOMMSM3)"/>
<text x="255" y="140" font-size="12" fill="#f97316">Sweep BSL</text>

<!-- MSS -->
<line x1="150" y1="385" x2="360" y2="385" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="365" y="400" font-size="12" fill="#a855f7">MSS (đóng nến dưới swing low)</text>

<!-- displacement + FVG (LRS1) down -->
<rect x="250" y="270" width="16" height="180" fill="#ef4444"/><line x1="258" y1="260" x2="258" y2="460" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="280" y="320" width="16" height="180" fill="#ef4444"/><line x1="288" y1="310" x2="288" y2="510" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="310" y="380" width="16" height="150" fill="#ef4444"/><line x1="318" y1="370" x2="318" y2="540" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="250" y="380" width="76" height="60" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
<text x="256" y="412" font-size="12" fill="#93c5fd">FVG LRS1</text>

<!-- entry marker -->
<circle cx="288" cy="410" r="6" fill="#f87171"/>
<text x="330" y="150" font-size="12" fill="#f87171">Entry Sell tại 50% FVG LRS1, SL trên Smart Money High</text>
<text x="330" y="170" font-size="12" fill="#f87171">TP tại SSL / vùng Original Consolidation</text>

<!-- SSL target -->
<line x1="48" y1="500" x2="912" y2="500" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="513" font-size="12" fill="#eab308">SSL (mục tiêu)</text>

<!-- continuation down -->
<polyline points="326,450 400,480 480,495 560,500" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Chart minh họa khái niệm, không phải dữ liệu giao dịch thật</text>
</svg>
