<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="620" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Ma trận xếp hạng Unicorn (Grading)</text>
<rect x="32" y="90" width="130" height="90" fill="rgba(0,0,0,0)" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="0"/>
<text x="97" y="140" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">A+</text>
<text x="182" y="128" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">FVG trọn trong Breaker + P/D đúng + displacement sạch (CISD)</text>
<text x="182" y="148" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">+ killzone/macro + SMT + thuận DOL (≥5/6)</text>
<rect x="32" y="208" width="130" height="90" fill="rgba(0,0,0,0)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="0"/>
<text x="97" y="258" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle">A</text>
<text x="182" y="246" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Overlap rõ + đúng bias/P/D + displacement ổn,</text>
<text x="182" y="266" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">thiếu 1-2 confluence phụ (3-4/6)</text>
<rect x="32" y="326" width="130" height="90" fill="rgba(0,0,0,0)" stroke="#eab308" stroke-width="1.5" stroke-dasharray="0"/>
<text x="97" y="376" font-size="20" font-weight="700" fill="#eab308" text-anchor="middle">B</text>
<text x="182" y="364" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Overlap nhỏ/mỏng, displacement trung bình,</text>
<text x="182" y="384" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">hoặc ngoài killzone (2/6)</text>
<rect x="32" y="444" width="130" height="90" fill="rgba(0,0,0,0)" stroke="#f87171" stroke-width="1.5" stroke-dasharray="0"/>
<text x="97" y="494" font-size="20" font-weight="700" fill="#f87171" text-anchor="middle">Bỏ qua</text>
<text x="182" y="482" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Không overlap thật / ngược bias /</text>
<text x="182" y="502" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">không sweep trước / chỉ chase</text>
<text x="32" y="582" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">Ghi grade vào frontmatter mỗi trade; sau 20-30 lệnh so win-rate theo grade để quyết định bỏ hẳn B hay không.</text>
<text x="32" y="604" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Sơ đồ khái niệm minh họa thang xếp hạng — không phải chart giá thật.</text>
</svg>
