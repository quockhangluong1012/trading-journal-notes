<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Định nghĩa chủ chốt — Relative Equal H/L, Displacement, OB/Breaker, BISI/SIBI</text>
<!-- panel 1: relative equal high -->
<rect x="40" y="70" width="420" height="150" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
<text x="58" y="98" font-size="14" font-weight="700" fill="#eab308" text-anchor="start">Relative Equal High</text>
<line x1="80" y1="170" x2="440" y2="170" stroke="#1f2937" stroke-width="1"/>
<polyline points="80,160 110,120 140,135 170,115 200,140" fill="none" stroke="#9ca3af" stroke-width="2"/>
<line x1="110" y1="120" x2="200" y2="120" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="230" y="124" font-size="11" fill="#eab308" text-anchor="start">Đỉnh 2 &lt; đỉnh 1 = swing failure</text>
<text x="58" y="200" font-size="11.5" fill="#94a3b8" text-anchor="start">Thanh khoản nằm TRÊN cụm đỉnh = BSL, mồi cho raid.</text>
<!-- panel 2: relative equal low -->
<rect x="500" y="70" width="420" height="150" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
<text x="518" y="98" font-size="14" font-weight="700" fill="#eab308" text-anchor="start">Relative Equal Low</text>
<polyline points="540,140 570,175 600,165 630,185 660,168" fill="none" stroke="#9ca3af" stroke-width="2"/>
<line x1="570" y1="175" x2="660" y2="175" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="690" y="179" font-size="11" fill="#eab308" text-anchor="start">Đáy 2 &gt; đáy 1</text>
<text x="518" y="200" font-size="11.5" fill="#94a3b8" text-anchor="start">Thanh khoản nằm DƯỚI cụm đáy = SSL, mồi cho raid.</text>
<!-- panel 3: displacement -->
<rect x="40" y="250" width="420" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
<text x="58" y="278" font-size="14" font-weight="700" fill="#22c55e" text-anchor="start">Displacement + BISI (FVG)</text>
<line x1="80" y1="340" x2="90" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="84" y="345" width="12" height="30" fill="#22c55e"/>
<line x1="124" y1="310" x2="134" y2="370" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="128" y="315" width="12" height="50" fill="#22c55e"/>
<line x1="168" y1="280" x2="178" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="172" y="285" width="12" height="50" fill="#22c55e"/>
<rect x="96" y="335" width="32" height="18" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="220" y="325" font-size="11" fill="#3b82f6" text-anchor="start">BISI = FVG up-closed</text>
<text x="58" y="382" font-size="11.5" fill="#94a3b8" text-anchor="start">3 nến thân lớn cùng chiều, ngược swing pre-session.</text>
<!-- panel 4: OB + breaker -->
<rect x="500" y="250" width="420" height="150" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
<text x="518" y="278" font-size="14" font-weight="700" fill="#ec4899" text-anchor="start">Order Block &amp; Breaker Block</text>
<rect x="540" y="330" width="14" height="34" fill="#ef4444"/>
<line x1="547" y1="320" x2="547" y2="374" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="540" y="316" width="60" height="60" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="612" y="330" font-size="11" fill="#ec4899" text-anchor="start">OB: nến cuối trước displacement</text>
<path d="M600,376 L560,340" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrD2)"/>
<text x="612" y="360" font-size="11" fill="#94a3b8" text-anchor="start">Breaker: quét SSL rồi phá swing high</text>
<defs><marker id="arrD2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker></defs>
<text x="480" y="440" font-size="12" fill="#94a3b8" text-anchor="middle">SIBI (giảm) là ảnh gương của BISI; bearish breaker là ảnh gương của bullish breaker.</text>
<text x="480" y="465" font-size="12" fill="#94a3b8" text-anchor="middle">NWOG: gap giữa đóng cửa thứ Sáu và mở cửa Chủ nhật — không vẽ chi tiết trong hình này.</text>
</svg>
