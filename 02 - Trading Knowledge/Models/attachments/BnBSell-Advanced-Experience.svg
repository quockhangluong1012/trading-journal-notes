<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Kinh nghiệm live/backtest — Bread and Butter Sell</text>
<text x="32" y="58" font-size="13" fill="#94a3b8" text-anchor="start">12 quan sát tổng hợp từ theo dõi thực chiến nhiều tháng</text>

<!-- panel 1: win rate by session -->
<rect x="40" y="80" width="420" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="250" y="104" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Win-rate ước tính theo phiên</text>
<line x1="70" y1="220" x2="430" y2="220" stroke="#1f2937" stroke-width="1"/>
<rect x="90" y="160" width="40" height="60" fill="#4ade80"/>
<text x="110" y="152" font-size="11" fill="#94a3b8" text-anchor="middle">62%</text>
<text x="110" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">London</text>
<rect x="160" y="150" width="40" height="70" fill="#4ade80"/>
<text x="180" y="142" font-size="11" fill="#94a3b8" text-anchor="middle">65%</text>
<text x="180" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">NY Open</text>
<rect x="230" y="185" width="40" height="35" fill="#f87171"/>
<text x="250" y="177" font-size="11" fill="#94a3b8" text-anchor="middle">41%</text>
<text x="250" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">London Close</text>
<rect x="300" y="170" width="40" height="50" fill="#eab308"/>
<text x="320" y="162" font-size="11" fill="#94a3b8" text-anchor="middle">55%</text>
<text x="320" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">Asia</text>
<rect x="370" y="145" width="40" height="75" fill="#4ade80"/>
<text x="390" y="137" font-size="11" fill="#94a3b8" text-anchor="middle">68%</text>
<text x="390" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">Chỉ A+ setup</text>

<!-- panel 2: setup frequency reality -->
<rect x="500" y="80" width="420" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="710" y="104" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Tần suất setup A+ thực tế / tuần</text>
<line x1="530" y1="220" x2="890" y2="220" stroke="#1f2937" stroke-width="1"/>
<rect x="550" y="150" width="50" height="70" fill="#3b82f6"/>
<text x="575" y="142" font-size="11" fill="#94a3b8" text-anchor="middle">2-3</text>
<text x="575" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">Marketing hứa</text>
<rect x="650" y="185" width="50" height="35" fill="#f87171"/>
<text x="675" y="177" font-size="11" fill="#94a3b8" text-anchor="middle">0-1</text>
<text x="675" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">Thực tế backtest</text>
<rect x="750" y="165" width="50" height="55" fill="#eab308"/>
<text x="775" y="157" font-size="11" fill="#94a3b8" text-anchor="middle">~5/tuần</text>
<text x="775" y="234" font-size="10" fill="#94a3b8" text-anchor="middle">A+ trung bình/tuần</text>

<!-- panel 3: binomial losing streak table -->
<rect x="40" y="260" width="420" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="250" y="284" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Xác suất gặp chuỗi thua (win-rate 55%)</text>
<text x="60" y="310" font-size="12" fill="#e5e7eb" text-anchor="start">Thua liên tiếp 3 lệnh:</text>
<text x="440" y="310" font-size="12" fill="#eab308" text-anchor="end">~9%/chuỗi 10 lệnh</text>
<text x="60" y="332" font-size="12" fill="#e5e7eb" text-anchor="start">Thua liên tiếp 5 lệnh:</text>
<text x="440" y="332" font-size="12" fill="#f87171" text-anchor="end">~1.8%/chuỗi 10 lệnh</text>
<text x="60" y="354" font-size="12" fill="#e5e7eb" text-anchor="start">Qua 60 lệnh (≈ 3 tháng):</text>
<text x="440" y="354" font-size="12" fill="#f87171" text-anchor="end">chuỗi 5 thua gần như chắc chắn xảy ra</text>
<text x="60" y="384" font-size="11" fill="#94a3b8" text-anchor="start">→ Kích thước lệnh phải sống sót được chuỗi 5-6 thua liên tiếp mà không cháy tài khoản</text>

<!-- panel 4: demo vs live vs funded -->
<rect x="500" y="260" width="420" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="710" y="284" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Demo vs Live vs Funded</text>
<text x="520" y="310" font-size="12" fill="#4ade80" text-anchor="start">Demo:</text>
<text x="900" y="310" font-size="12" fill="#94a3b8" text-anchor="end">vào lệnh máy móc, không lỡ entry</text>
<text x="520" y="332" font-size="12" fill="#eab308" text-anchor="start">Live nhỏ:</text>
<text x="900" y="332" font-size="12" fill="#94a3b8" text-anchor="end">do dự tại retest, hay bỏ lỡ MSS thật</text>
<text x="520" y="354" font-size="12" fill="#f87171" text-anchor="start">Funded:</text>
<text x="900" y="354" font-size="12" fill="#94a3b8" text-anchor="end">áp lực daily-loss-limit làm siết SL sớm hơn kế hoạch</text>
<text x="520" y="384" font-size="11" fill="#94a3b8" text-anchor="start">→ Chênh lệch 3 môi trường có thể tới 15-20 điểm win-rate</text>

<!-- panel 5: when to size up -->
<rect x="40" y="430" width="880" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="480" y="454" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Khi nào tăng size — checklist tối thiểu</text>
<text x="70" y="480" font-size="12" fill="#4ade80" text-anchor="start">✓ ≥100 lệnh đã forward-test với size hiện tại</text>
<text x="70" y="500" font-size="12" fill="#4ade80" text-anchor="start">✓ Max drawdown thực tế nằm trong kế hoạch rủi ro</text>
<text x="70" y="520" font-size="12" fill="#4ade80" text-anchor="start">✓ Win-rate ổn định qua ≥2 regime biến động khác nhau</text>
<text x="500" y="480" font-size="12" fill="#f87171" text-anchor="start">✗ Không tăng size chỉ vì vừa thắng 3-4 lệnh liên tiếp</text>
<text x="500" y="500" font-size="12" fill="#f87171" text-anchor="start">✗ Không tăng size để "gỡ" sau chuỗi thua</text>
<text x="500" y="520" font-size="12" fill="#f87171" text-anchor="start">✗ Không tăng size khi chưa qua mùa volatility thấp lẫn cao</text>
<text x="480" y="558" font-size="11" fill="#94a3b8" text-anchor="middle">Số liệu trong biểu đồ là minh họa tổng hợp kinh nghiệm, không phải kết quả backtest chính thức</text>
</svg>
