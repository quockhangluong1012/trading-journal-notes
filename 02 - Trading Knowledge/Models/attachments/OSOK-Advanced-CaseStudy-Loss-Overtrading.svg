  <!-- 4 small scattered trade markers, mostly losses -->
  <g>
    <circle cx="150" cy="200" r="9" fill="#ef4444"/><text x="150" y="185" font-size="10.5" fill="#f87171" text-anchor="middle">Lệnh 1 (6/12) Loss</text>
    <circle cx="350" cy="150" r="9" fill="#4ade80"/><text x="350" y="135" font-size="10.5" fill="#4ade80" text-anchor="middle">Lệnh 2 (7/12) Win nhỏ</text>
    <circle cx="550" cy="230" r="9" fill="#ef4444"/><text x="550" y="215" font-size="10.5" fill="#f87171" text-anchor="middle">Lệnh 3 (5/12) Loss, ngược bias</text>
    <circle cx="750" cy="260" r="9" fill="#ef4444"/><text x="750" y="245" font-size="10.5" fill="#f87171" text-anchor="middle">Lệnh 4 (8/12) Loss, ngoài KZ</text>
