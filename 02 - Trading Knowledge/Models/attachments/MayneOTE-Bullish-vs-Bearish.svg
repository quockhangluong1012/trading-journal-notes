<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Bullish vs Bearish — Mayne Structure + OTE</text>

<defs>
<marker id="arrOrangeB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/>
</marker>
<marker id="arrPurpleB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/>
</marker>
</defs>

<!-- Left panel: Bullish -->
<rect x="30" y="60" width="440" height="500" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
<text x="250" y="88" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">BULLISH (uptrend HH-HL)</text>

<rect x="55" y="105" width="390" height="60" fill="rgba(34,197,94,0.08)" stroke="none"/>
<text x="65" y="122" font-size="11" fill="#94a3b8" text-anchor="start">Discount</text>
<line x1="55" y1="230" x2="445" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="380" y="226" font-size="10" fill="#94a3b8" text-anchor="start">EQ 50%</text>
<rect x="55" y="230" width="390" height="60" fill="rgba(239,68,68,0.08)" stroke="none"/>
<text x="65" y="248" font-size="11" fill="#94a3b8" text-anchor="start">Premium</text>

<!-- swing low -->
<line x1="80" y1="380" x2="80" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="73.5" y="360" width="13" height="15" fill="#ef4444"/>
<text x="80" y="398" font-size="10" fill="#94a3b8" text-anchor="middle">Swing Low</text>

<!-- push up leg -->
<line x1="104" y1="360" x2="104" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="97.5" y="305" width="13" height="45" fill="#22c55e"/>
<line x1="128" y1="305" x2="128" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="121.5" y="225" width="13" height="60" fill="#22c55e"/>
<line x1="152" y1="225" x2="152" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="145.5" y="155" width="13" height="55" fill="#22c55e"/>
<text x="152" y="140" font-size="10" fill="#94a3b8" text-anchor="middle">Swing High</text>

<!-- OTE zone -->
<rect x="176" y="230" width="90" height="66" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="180" y="226" font-size="10" fill="#3b82f6" text-anchor="start">OTE 62–79%</text>
<line x1="176" y1="260" x2="266" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="196" y="313" font-size="10" fill="#3b82f6" text-anchor="start">POI (OB/FVG)</text>

<!-- pullback candles into OTE -->
<line x1="176" y1="150" x2="176" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="169.5" y="155" width="13" height="20" fill="#ef4444"/>
<line x1="200" y1="170" x2="200" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="193.5" y="175" width="13" height="35" fill="#ef4444"/>
<line x1="224" y1="200" x2="224" y2="260" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="217.5" y="205" width="13" height="50" fill="#ef4444"/>
<line x1="248" y1="245" x2="248" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="241.5" y="250" width="13" height="20" fill="#ef4444"/>

<!-- sweep of SSL -->
<line x1="266" y1="290" x2="410" y2="290" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="270" y="305" font-size="10" fill="#94a3b8" text-anchor="start">SSL nội vi</text>
<line x1="272" y1="275" x2="272" y2="298" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOrangeB)"/>
<text x="290" y="330" font-size="11" fill="#f97316" text-anchor="start">Sweep SSL</text>

<!-- MSS + long -->
<line x1="200" y1="255" x2="330" y2="255" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="200" y="349" font-size="11" fill="#a855f7" text-anchor="start">MSS lên (khung nhỏ)</text>

<line x1="296" y1="270" x2="296" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="289.5" y="225" width="13" height="45" fill="#22c55e"/>
<line x1="320" y1="225" x2="320" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="313.5" y="165" width="13" height="60" fill="#22c55e"/>
<line x1="344" y1="165" x2="344" y2="100" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="337.5" y="105" width="13" height="60" fill="#22c55e"/>

<line x1="55" y1="100" x2="445" y2="100" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="350" y="96" font-size="10" fill="#94a3b8" text-anchor="start">BSL — target</text>
<text x="200" y="418" font-size="12" font-weight="700" fill="#4ade80" text-anchor="start">LONG: sweep SSL → MSS lên → target BSL</text>
<text x="55" y="445" font-size="11" fill="#94a3b8" text-anchor="start">Entry tại OTE + confirmation, stop dưới đáy sweep.</text>

<!-- Right panel: Bearish -->
<rect x="490" y="60" width="440" height="500" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
<text x="710" y="88" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle">BEARISH (downtrend LH-LL)</text>

<rect x="515" y="105" width="390" height="60" fill="rgba(239,68,68,0.08)" stroke="none"/>
<text x="525" y="122" font-size="11" fill="#94a3b8" text-anchor="start">Premium</text>
<line x1="515" y1="230" x2="905" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="840" y="226" font-size="10" fill="#94a3b8" text-anchor="start">EQ 50%</text>
<rect x="515" y="230" width="390" height="60" fill="rgba(34,197,94,0.08)" stroke="none"/>
<text x="525" y="248" font-size="11" fill="#94a3b8" text-anchor="start">Discount</text>

<!-- swing high -->
<line x1="540" y1="150" x2="540" y2="120" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="533.5" y="125" width="13" height="15" fill="#22c55e"/>
<text x="540" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">Swing High</text>

<!-- push down leg -->
<line x1="564" y1="140" x2="564" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="557.5" y="140" width="13" height="45" fill="#ef4444"/>
<line x1="588" y1="185" x2="588" y2="260" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="581.5" y="185" width="13" height="60" fill="#ef4444"/>
<line x1="612" y1="245" x2="612" y2="315" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="605.5" y="245" width="13" height="55" fill="#ef4444"/>
<text x="612" y="335" font-size="10" fill="#94a3b8" text-anchor="middle">Swing Low</text>

<!-- OTE zone bearish -->
<rect x="636" y="150" width="90" height="66" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="640" y="146" font-size="10" fill="#3b82f6" text-anchor="start">OTE 62–79%</text>
<line x1="636" y1="180" x2="726" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="656" y="230" font-size="10" fill="#3b82f6" text-anchor="start">POI (OB/FVG)</text>

<!-- pullback candles up into OTE -->
<line x1="636" y1="300" x2="636" y2="260" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="629.5" y="265" width="13" height="20" fill="#22c55e"/>
<line x1="660" y1="270" x2="660" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="653.5" y="220" width="13" height="35" fill="#22c55e"/>
<line x1="684" y1="225" x2="684" y2="165" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="677.5" y="170" width="13" height="50" fill="#22c55e"/>
<line x1="708" y1="185" x2="708" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="701.5" y="155" width="13" height="20" fill="#22c55e"/>

<!-- sweep of BSL -->
<line x1="726" y1="140" x2="870" y2="140" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="730" y="135" font-size="10" fill="#94a3b8" text-anchor="start">BSL nội vi</text>
<line x1="732" y1="155" x2="732" y2="132" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOrangeB)"/>
<text x="750" y="330" font-size="11" fill="#f97316" text-anchor="start">Sweep BSL</text>

<!-- MSS + short -->
<line x1="660" y1="185" x2="790" y2="185" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="660" y="349" font-size="11" fill="#a855f7" text-anchor="start">MSS xuống (khung nhỏ)</text>

<line x1="756" y1="170" x2="756" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="749.5" y="170" width="13" height="45" fill="#ef4444"/>
<line x1="780" y1="215" x2="780" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="773.5" y="215" width="13" height="60" fill="#ef4444"/>
<line x1="804" y1="275" x2="804" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="797.5" y="275" width="13" height="60" fill="#ef4444"/>

<line x1="515" y1="380" x2="905" y2="380" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="810" y="376" font-size="10" fill="#94a3b8" text-anchor="start">SSL — target</text>
<text x="660" y="418" font-size="12" font-weight="700" fill="#f87171" text-anchor="start">SHORT: sweep BSL → MSS xuống → target SSL</text>
<text x="515" y="445" font-size="11" fill="#94a3b8" text-anchor="start">Entry tại OTE + confirmation, stop trên đỉnh sweep.</text>

<!-- legend -->
<rect x="55" y="470" width="12" height="12" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5"/>
<text x="73" y="481" font-size="11" fill="#94a3b8" text-anchor="start">POI OB/FVG</text>
<line x1="180" y1="476" x2="192" y2="476" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="198" y="481" font-size="11" fill="#94a3b8" text-anchor="start">CE 0.705 / EQ</text>
<line x1="320" y1="476" x2="332" y2="476" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="338" y="481" font-size="11" fill="#94a3b8" text-anchor="start">Liquidity</text>
</svg>
