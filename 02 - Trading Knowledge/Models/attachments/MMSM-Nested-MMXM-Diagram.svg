<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">MMSM lồng nhau — H4 chứa M15</text>

<!-- Outer H4 MMSM curve -->
<text x="60" y="70" font-size="14" font-weight="700" fill="#94a3b8">H4 — MMSM lớn</text>
<line x1="48" y1="130" x2="910" y2="130" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="124" font-size="12" fill="#eab308">BSL (H4)</text>
<polyline points="60,470 160,470 160,370 260,370 260,270 360,270 360,170 430,170 430,130" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.55"/>
<polyline points="430,130 600,300 780,440 900,500" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.55"/>
<circle cx="430" cy="130" r="20" fill="none" stroke="#f87171" stroke-width="2" opacity="0.8"/>
<text x="430" y="105" font-size="12" fill="#f87171" text-anchor="middle">Smart Money High (H4)</text>

<!-- Inner M15 zoom box -->
<rect x="330" y="120" width="220" height="150" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-dasharray="4 3"/>
<text x="340" y="280" font-size="11" fill="#38bdf8">Vùng zoom M15</text>

<!-- zoom callout lines -->
<line x1="330" y1="270" x2="620" y2="470" stroke="#334155" stroke-width="1"/>
<line x1="550" y1="120" x2="620" y2="120" stroke="#334155" stroke-width="1"/>

<!-- M15 detail box -->
<rect x="600" y="280" width="330" height="200" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
<text x="615" y="300" font-size="13" font-weight="700" fill="#e5e7eb">M15 — MMSM nhỏ bên trong</text>
<line x1="615" y1="330" x2="900" y2="330" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="620,460 650,460 650,430 680,430 680,400 710,400 710,330" fill="none" stroke="#22c55e" stroke-width="2"/>
<circle cx="710" cy="330" r="10" fill="none" stroke="#f87171" stroke-width="1.5"/>
<polyline points="710,330 750,370 800,420 860,445 900,450" fill="none" stroke="#ef4444" stroke-width="2"/>
<text x="710" y="480" font-size="10" fill="#f87171">SMH nhỏ = 1 phần</text>
<text x="800" y="480" font-size="10" fill="#f87171">của LRB lớn (H4)</text>

<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm: đỉnh của MMSM khung nhỏ chỉ là bước điều chỉnh trong MMSM khung lớn</text>
</svg>
