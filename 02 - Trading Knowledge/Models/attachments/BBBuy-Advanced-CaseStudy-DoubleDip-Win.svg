<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Case 4 — WIN: Double dip trước MSS thật (edge case ⑦)</text>
<text x="32" y="58" font-size="13" fill="#94a3b8" text-anchor="start">XAUUSD, phiên London Open, hai lần quét đáy trước khi đảo thật</text>

<line x1="60" y1="500" x2="900" y2="500" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="400" x2="900" y2="400" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="300" x2="900" y2="300" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="200" x2="900" y2="200" stroke="#1f2937" stroke-width="1"/>

<rect x="60" y="380" width="840" height="100" fill="rgba(34,197,94,0.08)"/>
<line x1="60" y1="420" x2="900" y2="420" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="70" y="415" font-size="12" fill="#eab308" text-anchor="start">SSL old low</text>

<rect x="90" y="260" width="12" height="40" fill="#ef4444"/>
<line x1="96" y1="252" x2="96" y2="305" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="115" y="295" width="12" height="45" fill="#ef4444"/>
<line x1="121" y1="285" x2="121" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="140" y="335" width="12" height="45" fill="#ef4444"/>
<line x1="146" y1="325" x2="146" y2="385" stroke="#9ca3af" stroke-width="1.5"/>

<!-- Dip 1: fake sweep + fake weak MSS -->
<rect x="165" y="375" width="12" height="45" fill="#ef4444"/>
<line x1="171" y1="365" x2="171" y2="435" stroke="#f97316" stroke-width="2.5"/>
<path d="M 171 435 L 163 448 L 179 448 Z" fill="#f97316"/>
<text x="171" y="465" font-size="11" fill="#f97316" text-anchor="middle">Dip 1 (bẫy)</text>
<rect x="190" y="400" width="12" height="20" fill="#22c55e"/>
<line x1="196" y1="393" x2="196" y2="425" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="185" y1="405" x2="260" y2="405" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="262" y="401" font-size="10" fill="#a855f7" text-anchor="start">MSS yếu (fail)</text>

<!-- price falls again to sweep dip 1 low -->
<rect x="220" y="395" width="12" height="30" fill="#ef4444"/>
<line x1="226" y1="385" x2="226" y2="430" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="245" y="415" width="12" height="35" fill="#ef4444"/>
<line x1="251" y1="405" x2="251" y2="455" stroke="#9ca3af" stroke-width="1.5"/>

<!-- Dip 2: real sweep + strong MSS -->
<rect x="270" y="440" width="12" height="35" fill="#ef4444"/>
<line x1="276" y1="430" x2="276" y2="482" stroke="#f97316" stroke-width="2.5"/>
<path d="M 276 482 L 268 495 L 284 495 Z" fill="#f97316"/>
<text x="276" y="512" font-size="12" font-weight="700" fill="#f97316" text-anchor="middle">Dip 2 (thật)</text>

<rect x="330" y="400" width="12" height="35" fill="#22c55e"/>
<line x1="336" y1="392" x2="336" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="355" y="350" width="12" height="45" fill="#22c55e"/>
<line x1="361" y1="340" x2="361" y2="400" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="380" y="305" width="12" height="45" fill="#22c55e"/>
<line x1="386" y1="295" x2="386" y2="355" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="300" y1="400" x2="500" y2="400" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="505" y="396" font-size="12" fill="#a855f7" text-anchor="start">MSS mạnh, displacement rõ</text>

<rect x="410" y="230" width="70" height="35" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-dasharray="4 3"/>
<text x="480" y="248" font-size="12" font-weight="700" fill="#4ade80" text-anchor="start">LONG retest</text>

<rect x="430" y="180" width="12" height="45" fill="#22c55e"/>
<line x1="436" y1="170" x2="436" y2="230" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="455" y="140" width="12" height="45" fill="#22c55e"/>
<line x1="461" y1="130" x2="461" y2="190" stroke="#9ca3af" stroke-width="1.5"/>

<rect x="700" y="90" width="220" height="230" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
<text x="716" y="114" font-size="13" font-weight="700" fill="#4ade80" text-anchor="start">Kết quả: WIN</text>
<text x="716" y="140" font-size="12" fill="#e5e7eb" text-anchor="start">Dip 1: MSS yếu, không vào</text>
<text x="716" y="160" font-size="12" fill="#e5e7eb" text-anchor="start">Dip 2: MSS mạnh, có displacement</text>
<text x="716" y="184" font-size="12" font-weight="700" fill="#4ade80" text-anchor="start">+21 pips</text>
<text x="716" y="208" font-size="11.5" fill="#94a3b8" text-anchor="start">Bài học: MSS đầu tiên không</text>
<text x="716" y="226" font-size="11.5" fill="#94a3b8" text-anchor="start">phải lúc nào cũng là MSS thật</text>
<text x="716" y="250" font-size="11.5" fill="#94a3b8" text-anchor="start">Kiên nhẫn chờ displacement rõ</text>
<text x="716" y="268" font-size="11.5" fill="#94a3b8" text-anchor="start">ràng tránh bị vào lệnh non</text>
<text x="716" y="292" font-size="11" fill="#f87171" text-anchor="start">missing_step: none (đợi đủ)</text>

<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Double dip là bẫy phổ biến — MSS yếu lần 1 dễ khiến trader vào sớm và bị stop trước khi MSS thật xuất hiện</text>
</svg>
