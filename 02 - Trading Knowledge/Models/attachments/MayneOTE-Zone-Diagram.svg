<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">OTE — vùng Fibonacci 62–79%, sweet spot 0.705 (CE)</text>
<text x="32" y="58" font-size="13" fill="#94a3b8" text-anchor="start">Kéo fib từ swing low → swing high (bullish); vùng vào nằm ở phần discount của nhịp đẩy</text>

<!-- price chart: impulse leg -->
<line x1="60" y1="500" x2="900" y2="500" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="400" x2="900" y2="400" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="300" x2="900" y2="300" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="200" x2="900" y2="200" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="100" x2="900" y2="100" stroke="#1f2937" stroke-width="1"/>

<!-- swing low candle (fib anchor 0%) -->
<line x1="110" y1="490" x2="110" y2="460" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="103.5" y="470" width="13" height="15" fill="#ef4444"/>
<text x="110" y="518" font-size="12" fill="#94a3b8" text-anchor="middle">Swing Low (0%)</text>

<!-- impulse up candles -->
<line x1="134" y1="470" x2="134" y2="400" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="127.5" y="405" width="13" height="60" fill="#22c55e"/>
<line x1="158" y1="405" x2="158" y2="310" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="151.5" y="315" width="13" height="85" fill="#22c55e"/>
<line x1="182" y1="315" x2="182" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="175.5" y="135" width="13" height="175" fill="#22c55e"/>

<!-- swing high candle (fib anchor 100%) -->
<line x1="206" y1="140" x2="206" y2="110" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="199.5" y="115" width="13" height="20" fill="#22c55e"/>
<text x="206" y="98" font-size="12" fill="#94a3b8" text-anchor="middle">Swing High (100%)</text>

<!-- Fib levels lines spanning across chart -->
<line x1="60" y1="120" x2="900" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="905" y="124" font-size="11" fill="#94a3b8" text-anchor="start">1.0</text>

<line x1="60" y1="240" x2="900" y2="240" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="905" y="244" font-size="11" fill="#ec4899" text-anchor="start">0.79</text>

<line x1="60" y1="290" x2="900" y2="290" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
<text x="905" y="294" font-size="11" fill="#38bdf8" text-anchor="start">0.705 CE</text>

<line x1="60" y1="330" x2="900" y2="330" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="905" y="334" font-size="11" fill="#ec4899" text-anchor="start">0.62</text>

<line x1="60" y1="410" x2="900" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="905" y="414" font-size="11" fill="#94a3b8" text-anchor="start">0.5 EQ</text>

<line x1="60" y1="480" x2="900" y2="480" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="905" y="484" font-size="11" fill="#94a3b8" text-anchor="start">0.0</text>

<!-- OTE zone highlight -->
<rect x="60" y="240" width="840" height="90" fill="rgba(236,72,153,0.20)" stroke="none"/>
<text x="70" y="232" font-size="14" font-weight="700" fill="#ec4899" text-anchor="start">Vùng OTE (0.62 → 0.79)</text>

<!-- POI overlap box -->
<rect x="230" y="255" width="110" height="65" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="235" y="335" font-size="11" fill="#3b82f6" text-anchor="start">POI (OB/FVG) chồng OTE</text>

<!-- pullback candles retracing into OTE -->
<line x1="230" y1="145" x2="230" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="223.5" y="150" width="13" height="30" fill="#ef4444"/>
<line x1="254" y1="170" x2="254" y2="230" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="247.5" y="175" width="13" height="55" fill="#ef4444"/>
<line x1="278" y1="220" x2="278" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="271.5" y="225" width="13" height="55" fill="#ef4444"/>
<line x1="302" y1="270" x2="302" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="295.5" y="275" width="13" height="25" fill="#ef4444"/>

<!-- reaction/entry candles -->
<line x1="326" y1="288" x2="326" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="319.5" y="245" width="13" height="43" fill="#22c55e"/>
<text x="326" y="228" font-size="12" fill="#4ade80" text-anchor="middle">Entry ~0.705</text>
<line x1="350" y1="245" x2="350" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="343.5" y="185" width="13" height="60" fill="#22c55e"/>
<line x1="374" y1="185" x2="374" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="367.5" y="135" width="13" height="50" fill="#22c55e"/>

<text x="380" y="560" font-size="12" fill="#94a3b8" text-anchor="start">Vì sao không phải 50%: EQ chưa quét đủ thanh khoản nội vi, chưa cho stop chặt.</text>
<text x="380" y="580" font-size="12" fill="#94a3b8" text-anchor="start">62–79% "làm sạch" SSL/BSL nhỏ, cho stop ngay ngoài đáy sweep → RR tối ưu.</text>
</svg>
