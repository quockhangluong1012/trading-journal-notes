<text x="700" y="322" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">không có MSS đáng tin — chỉ nhiễu</text>

<rect x="620" y="340" width="200" height="1" stroke="#f87171" stroke-width="0"/>
