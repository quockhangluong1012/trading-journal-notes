<text x="700" y="445" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">KHÔNG VÀO LỆNH</text>

<rect x="60" y="440" width="840" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="80" y="465" font-size="13" font-weight="700" fill="#e5e7eb" text-anchor="start">Vì sao đứng ngoài: D1/H4 đi ngang trong range hẹp, ADR ngày hôm đó chỉ đạt 35% trung bình</text>
<text x="80" y="485" font-size="12" fill="#94a3b8" text-anchor="start">Không xác định được đâu là "old high" đáng tin để chờ sweep — mọi đỉnh đều là nhiễu ngắn hạn</text>
<text x="80" y="505" font-size="12" fill="#94a3b8" text-anchor="start">Kỷ luật đúng ở đây là KHÔNG giao dịch, dù cảm giác "cả ngày chưa có lệnh nào" rất khó chịu</text>
<text x="80" y="525" font-size="12" fill="#94a3b8" text-anchor="start">Bài học: setup A+ đòi hỏi bối cảnh rõ ràng — thà bỏ lỡ một ngày còn hơn ép một lệnh không có edge</text>
