<defs><marker id="arrWW" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker></defs>
<text x="32" y="300" font-size="12" fill="#94a3b8" text-anchor="start">FVG khác (sau/trước cú hunt) không tập trung lệnh mắc kẹt nên phản ứng tại CE yếu và trễ hơn.</text>
