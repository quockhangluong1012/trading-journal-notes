<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Hai engine IPDA của Bread and Butter Buy</text>
<text x="32" y="58" font-size="13" fill="#94a3b8" text-anchor="start">Cả hai đều đẩy giá xuống discount để gom sell-side liquidity trước khi đẩy lên</text>

<!-- Left panel: Offset-Accumulation -->
<rect x="40" y="90" width="420" height="230" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250" y="116" font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">Offset-Accumulation</text>
<line x1="70" y1="290" x2="430" y2="290" stroke="#1f2937" stroke-width="1"/>
<line x1="70" y1="250" x2="430" y2="250" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="80" y="245" font-size="12" fill="#94a3b8" text-anchor="start">old low (SSL)</text>
<!-- price path: falling candles to sweep old low then rise -->
<rect x="90" y="150" width="12" height="35" fill="#ef4444"/>
<line x1="96" y1="145" x2="96" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="115" y="180" width="12" height="35" fill="#ef4444"/>
<line x1="121" y1="170" x2="121" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="140" y="215" width="12" height="35" fill="#ef4444"/>
<line x1="146" y1="205" x2="146" y2="255" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="165" y="245" width="12" height="30" fill="#ef4444"/>
<line x1="171" y1="235" x2="171" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<!-- sweep candle piercing old low -->
<rect x="190" y="255" width="12" height="26" fill="#ef4444"/>
<line x1="196" y1="248" x2="196" y2="298" stroke="#f97316" stroke-width="2.5"/>
<path d="M 196 298 L 190 312 L 202 312 Z" fill="#f97316"/>
<text x="196" y="326" font-size="12" fill="#f97316" text-anchor="middle">sweep SSL</text>
<!-- MSS up + displacement rise -->
<rect x="215" y="230" width="12" height="30" fill="#22c55e"/>
<rect x="240" y="185" width="12" height="45" fill="#22c55e"/>
<rect x="265" y="140" width="12" height="45" fill="#22c55e"/>
<line x1="221" y1="222" x2="221" y2="263" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="246" y1="178" x2="246" y2="233" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="271" y1="133" x2="271" y2="188" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="205" y1="230" x2="330" y2="230" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="330" y="225" font-size="11" fill="#a855f7" text-anchor="end">MSS lên</text>
<rect x="290" y="115" width="12" height="30" fill="#22c55e"/>
<line x1="296" y1="108" x2="296" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
<text x="250" y="308" font-size="12" fill="#94a3b8" text-anchor="middle">Quét dưới old low → kích sell stops → đảo tăng mạnh</text>

<!-- Right panel: Re-Accumulation -->
<rect x="500" y="90" width="420" height="230" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
<text x="710" y="116" font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">Re-Accumulation</text>
<line x1="530" y1="290" x2="890" y2="290" stroke="#1f2937" stroke-width="1"/>
<rect x="545" y="190" width="180" height="60" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-dasharray="4 3"/>
<text x="635" y="270" font-size="12" fill="#ec4899" text-anchor="middle">fair-value discount PD array</text>
<rect x="550" y="130" width="12" height="35" fill="#ef4444"/>
<line x1="556" y1="125" x2="556" y2="170" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="575" y="160" width="12" height="40" fill="#ef4444"/>
<line x1="581" y1="150" x2="581" y2="205" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="600" y="195" width="12" height="40" fill="#ef4444"/>
<line x1="606" y1="185" x2="606" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
<!-- reaches into FVG zone -->
<rect x="630" y="220" width="12" height="35" fill="#ef4444"/>
<line x1="636" y1="215" x2="636" y2="263" stroke="#f97316" stroke-width="2.5"/>
<path d="M 636 263 L 630 275 L 642 275 Z" fill="#f97316"/>
<text x="636" y="290" font-size="11" fill="#f97316" text-anchor="middle">induce selling</text>
<!-- MSS up + displacement -->
<rect x="660" y="195" width="12" height="30" fill="#22c55e"/>
<rect x="685" y="150" width="12" height="45" fill="#22c55e"/>
<rect x="710" y="115" width="12" height="35" fill="#22c55e"/>
<line x1="666" y1="188" x2="666" y2="228" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="691" y1="143" x2="691" y2="199" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="716" y1="108" x2="716" y2="153" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="650" y1="195" x2="790" y2="195" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="790" y="190" font-size="11" fill="#a855f7" text-anchor="end">MSS lên</text>
<text x="710" y="308" font-size="12" fill="#94a3b8" text-anchor="middle">Hồi xuống fair-value → áp lực cover + induce selling → tích lũy mua</text>

<!-- Legend -->
<rect x="40" y="345" width="12" height="12" fill="#ef4444"/>
<text x="58" y="355" font-size="12" fill="#94a3b8" text-anchor="start">Nến giảm (đẩy xuống discount)</text>
<rect x="300" y="345" width="12" height="12" fill="#22c55e"/>
<text x="318" y="355" font-size="12" fill="#94a3b8" text-anchor="start">Nến tăng (displacement)</text>
<rect x="560" y="345" width="14" height="3" fill="#f97316"/>
<text x="580" y="350" font-size="12" fill="#94a3b8" text-anchor="start">Sweep / Judas</text>
<rect x="720" y="345" width="14" height="3" fill="#a855f7"/>
<text x="740" y="350" font-size="12" fill="#94a3b8" text-anchor="start">MSS 5m</text>

<text x="480" y="400" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Điểm chung: giá xuống discount không phải để đi tiếp, mà để tạo nhiên liệu cho một cú mua</text>

<rect x="60" y="430" width="840" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="480" y="460" font-size="13" font-weight="700" fill="#e5e7eb" text-anchor="middle">Quy trình chung sau khi nhận diện engine</text>
<text x="480" y="486" font-size="13" fill="#e5e7eb" text-anchor="middle">HTF bullish bias xác nhận trước → giá chạm discount (offset hoặc re-accumulation) → CHỜ 5m MSS</text>
<text x="480" y="508" font-size="13" fill="#e5e7eb" text-anchor="middle">→ vào LONG tại retest post-MSS PD array → stop ngoài đáy bị quét → target 15–30 pips (max 50)</text>
<text x="480" y="540" font-size="12" fill="#94a3b8" text-anchor="middle">Chạm discount KHÔNG phải entry — 5m MSS mới là trigger thật của cả hai engine</text>
</svg>
