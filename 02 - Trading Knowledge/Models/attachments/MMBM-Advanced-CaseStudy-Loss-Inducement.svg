<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case Study — Loss: Mắc bẫy Inducement, vào Buy sớm (-1R)</text>

<line x1="48" y1="360" x2="910" y2="360" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="374" font-size="12" fill="#eab308">SSL nhìn thấy trên chart</text>

<rect x="90" y="250" width="12" height="50" fill="#ef4444"/><line x1="96" y1="240" x2="96" y2="315" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="275" width="12" height="55" fill="#ef4444"/><line x1="126" y1="262" x2="126" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
<!-- weak bounce mistaken for MSS -->
<rect x="150" y="300" width="12" height="25" fill="#22c55e"/><line x1="156" y1="292" x2="156" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="156" cy="310" r="18" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="156" y="350" font-size="10" fill="#f87171" text-anchor="middle">Nến xanh nhỏ,</text>
<text x="156" y="362" font-size="10" fill="#f87171" text-anchor="middle">chưa MSS thật</text>

<circle cx="165" cy="305" r="6" fill="#f87171"/>
<text x="185" y="290" font-size="11" fill="#f87171">Entry Buy 09:12 — vội vào theo cảm giác</text>

<!-- continues down, SL hit -->
<rect x="180" y="330" width="12" height="55" fill="#ef4444"/><line x1="186" y1="318" x2="186" y2="395" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="210" y="370" width="12" height="60" fill="#ef4444"/><line x1="216" y1="358" x2="216" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="240" y="410" width="12" height="65" fill="#ef4444"/><line x1="246" y1="398" x2="246" y2="485" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="150" y1="385" x2="910" y2="385" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="700" y="380" font-size="12" fill="#f87171">SL bị quét 09:30</text>

<!-- real SML further -->
<rect x="270" y="450" width="12" height="60" fill="#ef4444"/><line x1="276" y1="438" x2="276" y2="518" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="282" cy="510" r="18" fill="none" stroke="#4ade80" stroke-width="2"/>
<text x="282" y="535" font-size="11" fill="#4ade80" text-anchor="middle">SML thật, 30 phút sau</text>
<polyline points="288,502 350,470 420,440 500,410" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.7"/>

<rect x="560" y="120" width="330" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="576" y="142" font-size="12" fill="#e5e7eb">Lỗi: coi nến xanh nhỏ đầu tiên là MSS</text>
<text x="576" y="162" font-size="12" fill="#e5e7eb">Đúng ra: chờ đóng nến vượt swing high</text>
<text x="576" y="182" font-size="12" fill="#e5e7eb">rõ ràng trước khi vào lệnh</text>
<text x="576" y="205" font-size="12" fill="#f87171">Kết quả: Loss -1R, SML thật đến sau</text>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa</text>
</svg>
