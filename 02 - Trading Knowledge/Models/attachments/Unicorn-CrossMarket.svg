<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="560" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Unicorn theo từng thị trường</text>
<rect x="40" y="90" width="280" height="320" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180.0" y="250.0" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="middle"></text>
<text x="180.0" y="120" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">NQ1 / NDX</text>
<text x="60" y="170" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Overlap sắc nét trên</text>
<text x="60" y="206" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">1m/5m, nhiều FVG nhỏ</text>
<text x="60" y="242" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">chồng — chọn nhầm dễ</text>
<text x="60" y="278" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">→ ưu tiên FVG "first &amp; clean"</text>
<rect x="340" y="90" width="280" height="320" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
<text x="480.0" y="250.0" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="middle"></text>
<text x="480.0" y="120" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">EURUSD/GBPUSD</text>
<text x="360" y="170" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Overlap thường mỏng</text>
<text x="360" y="206" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">hơn (range hẹp)</text>
<text x="360" y="242" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Spread dễ "nuốt"</text>
<text x="360" y="278" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">→ đòi overlap đủ rộng</text>
<rect x="640" y="90" width="280" height="320" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
<text x="780.0" y="250.0" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="middle"></text>
<text x="780.0" y="120" font-size="16" font-weight="700" fill="#eab308" text-anchor="middle">XAUUSD</text>
<text x="660" y="170" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Overlap rộng, wick dài</text>
<text x="660" y="206" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Rất mạnh quanh tin</text>
<text x="660" y="242" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">Wick quét stop dù đúng</text>
<text x="660" y="278" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="start">→ nới stop + giảm size</text>
<text x="480" y="460" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">Cùng cấu trúc overlap Breaker+FVG, nhưng độ sạch displacement &amp; độ dài wick khác nhau theo thị trường.</text>
<text x="480" y="482" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Sơ đồ minh họa khái niệm, không phải chart giá thật.</text>
</svg>
