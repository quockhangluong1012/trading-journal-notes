<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="560" rx="12" fill="#0d1117"/>
<text x="480" y="32" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Hai narrative cho cùng một cú di chuyển sau 08:30</text>
<!-- left: same price path -->
<rect x="40" y="60" width="420" height="360" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
<text x="250" y="88" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle">Narrative ICT: "Raid thanh khoản có chủ đích"</text>
<line x1="70" y1="200" x2="70" y2="240" stroke="#9ca3af" stroke-width="1.5"/><rect x="64" y="205" width="12" height="25" fill="#22c55e"/>
<line x1="110" y1="190" x2="110" y2="235" stroke="#9ca3af" stroke-width="1.5"/><rect x="104" y="195" width="12" height="25" fill="#22c55e"/>
<line x1="90" y1="188" x2="150" y2="190" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="155" y="184" font-size="10.5" fill="#eab308" text-anchor="start">Relative equal high</text>
<line x1="180" y1="150" x2="180" y2="250" stroke="#9ca3af" stroke-width="1.5"/><rect x="174" y="205" width="12" height="30" fill="#ef4444"/>
<path d="M180,160 L215,135" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrC1)"/>
<text x="220" y="130" font-size="10.5" fill="#f97316" text-anchor="start">"Smart money raid BSL"</text>
<line x1="220" y1="240" x2="220" y2="320" stroke="#9ca3af" stroke-width="1.5"/><rect x="214" y="250" width="12" height="65" fill="#ef4444"/>
<line x1="260" y1="300" x2="260" y2="370" stroke="#9ca3af" stroke-width="1.5"/><rect x="254" y="310" width="12" height="55" fill="#ef4444"/>
<text x="65" y="345" font-size="11" fill="#a855f7" text-anchor="start">"MSS = tổ chức xác nhận</text>
<text x="65" y="363" font-size="11" fill="#a855f7" text-anchor="start">đã hoàn thành nạp thanh khoản"</text>
<text x="65" y="395" font-size="11" fill="#94a3b8" text-anchor="start">→ Không thể kiểm chứng trực tiếp có</text>
<text x="65" y="411" font-size="11" fill="#94a3b8" text-anchor="start">"tổ chức" hành động hay không.</text>
<!-- right: same price path, different label -->
<rect x="500" y="60" width="420" height="360" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="710" y="88" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Narrative thống kê: "Volatility clustering quanh tin"</text>
<line x1="530" y1="200" x2="530" y2="240" stroke="#9ca3af" stroke-width="1.5"/><rect x="524" y="205" width="12" height="25" fill="#22c55e"/>
<line x1="570" y1="190" x2="570" y2="235" stroke="#9ca3af" stroke-width="1.5"/><rect x="564" y="195" width="12" height="25" fill="#22c55e"/>
<line x1="550" y1="188" x2="610" y2="190" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="615" y="184" font-size="10.5" fill="#eab308" text-anchor="start">Vùng swing failure (ngẫu nhiên)</text>
<line x1="640" y1="150" x2="640" y2="250" stroke="#9ca3af" stroke-width="1.5"/><rect x="634" y="205" width="12" height="30" fill="#ef4444"/>
<path d="M640,160 L675,135" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrC2)"/>
<text x="680" y="130" font-size="10.5" fill="#f97316" text-anchor="start">Overshoot do tin CPI/NFP</text>
<line x1="680" y1="240" x2="680" y2="320" stroke="#9ca3af" stroke-width="1.5"/><rect x="674" y="250" width="12" height="65" fill="#ef4444"/>
<line x1="720" y1="300" x2="720" y2="370" stroke="#9ca3af" stroke-width="1.5"/><rect x="714" y="310" width="12" height="55" fill="#ef4444"/>
<text x="525" y="345" font-size="11" fill="#38bdf8" text-anchor="start">"Mean-reversion sau overshoot,</text>
<text x="525" y="363" font-size="11" fill="#38bdf8" text-anchor="start">không cần khái niệm thanh khoản"</text>
<text x="525" y="395" font-size="11" fill="#94a3b8" text-anchor="start">→ Khớp với dữ liệu tài chính định</text>
<text x="525" y="411" font-size="11" fill="#94a3b8" text-anchor="start">lượng đã biết từ lâu.</text>
<defs>
<marker id="arrC1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
<marker id="arrC2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
</defs>
<rect x="60" y="450" width="840" height="80" rx="8" fill="rgba(148,163,184,0.08)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="478" font-size="12.5" fill="#e5e7eb" font-weight="700" text-anchor="middle">Cùng một chart giá — hai lời giải thích không thể phân biệt bằng mắt thường</text>
<text x="480" y="502" font-size="11.5" fill="#94a3b8" text-anchor="middle">Model vẫn có thể hữu ích như một khung quan sát, nhưng đừng coi "smart money điều phối" là sự thật đã chứng minh.</text>
</svg>
