<rect x="40" y="310" width="430" height="96" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
<text x="58" y="340" font-size="14" font-weight="700" fill="#f97316" text-anchor="start">⑤ Gap cuối tuần</text>
<text x="58" y="364" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Nuốt POI, tính lại R:R</text>
<text x="58" y="386" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">Hiện tượng → nhận diện sớm → hành động đúng → bài học</text>
<rect x="510" y="310" width="430" height="96" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
<text x="528" y="340" font-size="14" font-weight="700" fill="#a855f7" text-anchor="start">⑥ Tin ra giữa retrace</text>
<text x="528" y="364" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Hủy limit, chờ displacement mới</text>
<text x="528" y="386" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">Hiện tượng → nhận diện sớm → hành động đúng → bài học</text>
<rect x="40" y="430" width="430" height="96" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
<text x="58" y="460" font-size="14" font-weight="700" fill="#f97316" text-anchor="start">⑦ Unswept liquidity</text>
<text x="58" y="484" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Draw ngược chưa giải quyết</text>
