<text x="58" y="266" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">Hiện tượng → nhận diện sớm → hành động đúng → bài học</text>
<rect x="510" y="190" width="430" height="96" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
<text x="528" y="220" font-size="14" font-weight="700" fill="#a855f7" text-anchor="start">④ MSS giả</text>
<text x="528" y="244" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">Failure to accept, liquidity grab</text>
