<text x="80" y="114" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Accumulation (Á) — Manipulation (sweep London/NY) — Distribution (move chính)</text>
<text x="130" y="140" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Accumulation</text>
<text x="420" y="140" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Manipulation</text>
<text x="700" y="140" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Distribution</text>
<line x1="230" y1="130" x2="230" y2="530" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="560" y1="130" x2="560" y2="530" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
