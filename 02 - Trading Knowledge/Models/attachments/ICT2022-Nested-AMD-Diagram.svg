<text x="678" y="539" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">5-phút AMD (entry thật)</text>
<text x="480" y="570" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Daily AMD ⊃ Hourly AMD ⊃ 5-min AMD — sơ đồ khái niệm tính fractal, không phải chart giá thật.</text>
