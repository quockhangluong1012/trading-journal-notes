<rect x="577.0" y="380" width="10" height="12" fill="#22c55e"/>
<line x1="604" y1="335" x2="604" y2="385" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="599.0" y="340" width="10" height="40" fill="#22c55e"/>
<rect x="596" y="335" width="40" height="20" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="660" y="489" width="12" height="12" fill="#38bdf8"/>
<text x="678" y="499" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">Daily AMD (tầng ngoài)</text>
