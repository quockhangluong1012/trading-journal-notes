<text x="555" y="282" font-size="13" font-weight="700" fill="#f97316" text-anchor="start">5-phút AMD</text>
<text x="555" y="300" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">Entry thực tế:</text>
<text x="555" y="315" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">sweep+displace M1-M5</text>
<line x1="560" y1="387" x2="560" y2="405" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="555.0" y="392" width="10" height="8" fill="#22c55e"/>
