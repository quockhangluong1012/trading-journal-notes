<text x="480" y="524" font-size="12.5" fill="#4ade80" font-weight="700" text-anchor="middle">missing_step: none — chuỗi chuẩn: raid + MSS + PD array đồng hướng DOL 15m</text>
<text x="480" y="546" font-size="11.5" fill="#94a3b8" text-anchor="middle">Kết quả minh họa: +2.8R. Bài học: khi chuỗi đúng, kể cả một lần thua vẫn là "good loss".</text>
