<text x="480" y="32" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Case 5 — GBPUSD: Miss setup A+ vì lệch giờ do DST (đầu tháng 11)</text>
<text x="480" y="56" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Tuần chuyển DST Mỹ (Chủ nhật đầu tháng 11) — giờ NY lùi lại 1 tiếng, giờ VN quy đổi cứng KHÔNG cập nhật</text>
<text x="60" y="110" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">Giờ bạn canh (quy đổi cứng cũ)</text>
