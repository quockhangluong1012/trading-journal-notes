<rect x="200" y="360" width="560" height="150" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
<text x="220" y="386" font-size="13" font-weight="700" fill="#a855f7" text-anchor="start">Hậu quả</text>
<text x="220" y="406" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">Trader đóng nền tảng lúc 20:30 VN (nghĩ đã hết NY AM killzone),</text>
<text x="220" y="422" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">bỏ lỡ chuỗi sweep → MSS + displacement + FVG hợp lệ</text>
<text x="220" y="438" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">xảy ra đúng 21:30-22:00 VN (NY AM killzone thật sau DST).</text>
<text x="220" y="458" font-size="11.5" font-weight="400" fill="#f87171" text-anchor="start">Setup grade A+ đầy đủ 7 bước — 0 lệnh vào vì canh sai giờ.</text>
<text x="220" y="478" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">→ log là "miss", missing_step: ngoài giờ canh (do DST, không do phân tích)</text>
<text x="480" y="535" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest — số liệu minh họa, không phải dữ liệu giao dịch thật kiểm chứng được.</text>
