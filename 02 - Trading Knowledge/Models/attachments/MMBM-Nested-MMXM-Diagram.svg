<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">MMBM lồng nhau — H4 chứa M15</text>

<!-- Outer H4 MMBM curve -->
<text x="60" y="70" font-size="14" font-weight="700" fill="#94a3b8">H4 — MMBM lớn</text>
<line x1="48" y1="470" x2="910" y2="470" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="484" font-size="12" fill="#eab308">SSL (H4)</text>
<polyline points="60,120 160,120 160,220 260,220 260,320 360,320 360,420 430,420 430,470" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.55"/>
<polyline points="430,470 600,300 780,160 900,100" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.55"/>
<circle cx="430" cy="470" r="20" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.8"/>
<text x="430" y="500" font-size="12" fill="#4ade80" text-anchor="middle">Smart Money Low (H4)</text>

<!-- Inner M15 zoom box -->
<rect x="330" y="330" width="220" height="150" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-dasharray="4 3"/>
<text x="340" y="345" font-size="11" fill="#38bdf8">Vùng zoom M15</text>

<!-- zoom callout lines -->
<line x1="330" y1="330" x2="620" y2="130" stroke="#334155" stroke-width="1"/>
<line x1="550" y1="480" x2="620" y2="480" stroke="#334155" stroke-width="1"/>

<!-- M15 detail box -->
<rect x="600" y="120" width="330" height="200" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
<text x="615" y="140" font-size="13" font-weight="700" fill="#e5e7eb">M15 — MMBM nhỏ bên trong</text>
<line x1="615" y1="270" x2="900" y2="270" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="620,190 650,190 650,220 680,220 680,250 710,250 710,270" fill="none" stroke="#ef4444" stroke-width="2"/>
<circle cx="710" cy="270" r="10" fill="none" stroke="#4ade80" stroke-width="1.5"/>
<polyline points="710,270 750,230 800,180 860,155 900,150" fill="none" stroke="#22c55e" stroke-width="2"/>
<text x="710" y="290" font-size="10" fill="#4ade80">SML nhỏ = 1 phần</text>
<text x="710" y="303" font-size="10" fill="#4ade80">của LRS lớn (H4)</text>

<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm: đáy của MMBM khung nhỏ chỉ là bước điều chỉnh trong MMBM khung lớn</text>
</svg>
