<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="18" font-weight="700" fill="#e5e7eb" text-anchor="start">Kịch bản BEARISH: grab relative equal highs → MSS xuống → SIBI/OB/Breaker → SELL</text>
<line x1="24" y1="80" x2="936" y2="80" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="150" x2="936" y2="150" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="220" x2="936" y2="220" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="290" x2="936" y2="290" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="360" x2="936" y2="360" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="430" x2="936" y2="430" stroke="#1f2937" stroke-width="1"/>
<!-- build-up 08:00-08:30 forming relative equal highs -->
<line x1="60" y1="200" x2="60" y2="240" stroke="#9ca3af" stroke-width="1.5"/><rect x="54" y="205" width="12" height="25" fill="#22c55e"/>
<line x1="100" y1="180" x2="100" y2="230" stroke="#9ca3af" stroke-width="1.5"/><rect x="94" y="185" width="12" height="30" fill="#22c55e"/>
<line x1="140" y1="185" x2="140" y2="240" stroke="#9ca3af" stroke-width="1.5"/><rect x="134" y="195" width="12" height="30" fill="#ef4444"/>
<line x1="180" y1="182" x2="180" y2="235" stroke="#9ca3af" stroke-width="1.5"/><rect x="174" y="190" width="12" height="28" fill="#22c55e"/>
<!-- relative equal highs line -->
<line x1="80" y1="180" x2="200" y2="182" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="205" y="176" font-size="12" fill="#eab308" text-anchor="start">Relative equal highs (build-up)</text>
<!-- raid wick after 08:30 -->
<line x1="230" y1="140" x2="230" y2="245" stroke="#9ca3af" stroke-width="1.5"/><rect x="224" y="200" width="12" height="30" fill="#ef4444"/>
<path d="M230,150 L260,120" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrBE)"/>
<text x="264" y="116" font-size="12" fill="#f97316" text-anchor="start">Raid BSL sau 08:30</text>
<!-- swing low reference -->
<line x1="140" y1="330" x2="600" y2="330" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>
<text x="145" y="322" font-size="11" fill="#a855f7" text-anchor="start">Swing low pre-MSS</text>
<!-- displacement down: 3 big red candles -->
<line x1="270" y1="235" x2="270" y2="330" stroke="#9ca3af" stroke-width="1.5"/><rect x="264" y="240" width="12" height="80" fill="#ef4444"/>
<line x1="310" y1="300" x2="310" y2="400" stroke="#9ca3af" stroke-width="1.5"/><rect x="304" y="305" width="12" height="85" fill="#ef4444"/>
<line x1="350" y1="370" x2="350" y2="460" stroke="#9ca3af" stroke-width="1.5"/><rect x="344" y="375" width="12" height="80" fill="#ef4444"/>
<!-- MSS marker: close below swing low -->
<text x="350" y="345" font-size="11" fill="#a855f7" text-anchor="start">MSS: đóng dưới swing low</text>
<!-- SIBI FVG zone between candle1 wick and candle3 wick -->
<rect x="270" y="320" width="80" height="55" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="310" y="405" font-size="11" fill="#3b82f6" text-anchor="middle">SIBI (FVG)</text>
<!-- bearish OB (last up candle before drop) -->
<rect x="255" y="225" width="30" height="20" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="270" y="215" font-size="10.5" fill="#ec4899" text-anchor="middle">Bearish OB</text>
<!-- retracement candle into SIBI/OB (entry) -->
<line x1="410" y1="330" x2="410" y2="370" stroke="#9ca3af" stroke-width="1.5"/><rect x="404" y="335" width="12" height="25" fill="#22c55e"/>
<line x1="450" y1="335" x2="450" y2="375" stroke="#9ca3af" stroke-width="1.5"/><rect x="444" y="340" width="12" height="25" fill="#22c55e"/>
<path d="M456,352 L490,352" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrBEsell)"/>
<text x="494" y="348" font-size="12" fill="#22c55e" font-weight="700" text-anchor="start">SELL tại retest</text>
<!-- continuation down to DOL -->
<line x1="530" y1="360" x2="530" y2="440" stroke="#9ca3af" stroke-width="1.5"/><rect x="524" y="365" width="12" height="70" fill="#ef4444"/>
<line x1="570" y1="420" x2="570" y2="480" stroke="#9ca3af" stroke-width="1.5"/><rect x="564" y="425" width="12" height="50" fill="#ef4444"/>
<line x1="610" y1="460" x2="610" y2="500" stroke="#9ca3af" stroke-width="1.5"/><rect x="604" y="465" width="12" height="30" fill="#ef4444"/>
<!-- DOL target line -->
<line x1="600" y1="500" x2="900" y2="500" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="895" y="504" font-size="11" fill="#eab308" text-anchor="end">DOL: equal lows</text>
<!-- stop line above post-08:30 high -->
<line x1="215" y1="115" x2="900" y2="115" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2"/>
<text x="895" y="106" font-size="11" fill="#f87171" text-anchor="end">Stop trên đỉnh post-08:30</text>
<defs>
<marker id="arrBE" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
<marker id="arrBEsell" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
</defs>
<rect x="700" y="150" width="12" height="12" fill="#eab308"/><text x="718" y="160" font-size="12" fill="#94a3b8">Liquidity (relative equal)</text>
<rect x="700" y="170" width="12" height="12" fill="#3b82f6"/><text x="718" y="180" font-size="12" fill="#94a3b8">SIBI (FVG)</text>
<rect x="700" y="190" width="12" height="12" fill="#ec4899"/><text x="718" y="200" font-size="12" fill="#94a3b8">Bearish OB</text>
<rect x="700" y="210" width="12" height="12" fill="#a855f7"/><text x="718" y="220" font-size="12" fill="#94a3b8">MSS</text>
<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Chart minh họa kịch bản Bearish, không phải dữ liệu giao dịch thật.</text>
</svg>
