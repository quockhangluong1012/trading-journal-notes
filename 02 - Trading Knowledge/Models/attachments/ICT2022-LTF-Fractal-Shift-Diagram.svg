<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="520" rx="12" fill="#0d1117"/>
<text x="480" y="32" font-size="15.5" font-weight="700" fill="#e5e7eb" text-anchor="middle">Dịch một tầng khung thời gian: Gốc D1→H1→M5 vs Biến thể LTF H1/H4→M5→M1</text>
<text x="160" y="80" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">MÔ HÌNH GỐC</text>
<rect x="60" y="120" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="76" y="150" font-size="16" font-weight="700" fill="#a855f7" text-anchor="start">D1</text>
<text x="76" y="172" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Bias / Draw on liquidity</text>
<rect x="60" y="220" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="76" y="250" font-size="16" font-weight="700" fill="#a855f7" text-anchor="start">H1</text>
<text x="76" y="272" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">POI / Sweep / MSS</text>
<rect x="60" y="320" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="76" y="350" font-size="16" font-weight="700" fill="#a855f7" text-anchor="start">M5</text>
<text x="76" y="372" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Entry refine</text>
<line x1="220.0" y1="190" x2="220.0" y2="220" stroke="#4ade80" stroke-width="2.5"/>
<polygon points="215.0,218 225.0,218 220.0,226" fill="#4ade80"/>
<line x1="220.0" y1="290" x2="220.0" y2="320" stroke="#4ade80" stroke-width="2.5"/>
<polygon points="215.0,318 225.0,318 220.0,326" fill="#4ade80"/>
<text x="740.0" y="80" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">BIẾN THỂ LTF</text>
<rect x="580" y="120" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="596" y="150" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="start">H1/H4</text>
<text x="596" y="172" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Bias / Draw on liquidity</text>
<rect x="580" y="220" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="596" y="250" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="start">M5</text>
<text x="596" y="272" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">POI / Sweep / MSS</text>
<rect x="580" y="320" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="596" y="350" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="start">M1</text>
<text x="596" y="372" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Entry refine</text>
<line x1="740.0" y1="190" x2="740.0" y2="220" stroke="#4ade80" stroke-width="2.5"/>
<polygon points="735.0,218 745.0,218 740.0,226" fill="#4ade80"/>
<line x1="740.0" y1="290" x2="740.0" y2="320" stroke="#4ade80" stroke-width="2.5"/>
<polygon points="735.0,318 745.0,318 740.0,326" fill="#4ade80"/>
<line x1="380" y1="155" x2="580" y2="155" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="380" y1="255" x2="580" y2="255" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="380" y1="355" x2="580" y2="355" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="480" y="440" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="middle">Cùng vai trò, khác khung — cùng 7 bước, chỉ trượt thang khung thời gian xuống một nấc</text>
<text x="480" y="480" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa phép "trượt fractal" — không phải chart giá thật.</text>
</svg>
