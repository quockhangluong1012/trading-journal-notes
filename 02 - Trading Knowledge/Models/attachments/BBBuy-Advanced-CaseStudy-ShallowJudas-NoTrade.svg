<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Case 6 — NO-TRADE: NY Judas quá nông (edge case ⑫)</text>
<text x="32" y="58" font-size="13" fill="#94a3b8" text-anchor="start">EURUSD, phiên NY Open, swing chỉ ~30% ATR(5) trung bình</text>

<line x1="60" y1="500" x2="900" y2="500" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="400" x2="900" y2="400" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="300" x2="900" y2="300" stroke="#1f2937" stroke-width="1"/>
<line x1="60" y1="200" x2="900" y2="200" stroke="#1f2937" stroke-width="1"/>

<!-- reference: average ATR swing shown as dashed guide -->
<rect x="60" y="200" width="840" height="250" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
<text x="70" y="215" font-size="11" fill="#94a3b8" text-anchor="start">Biên độ swing trung bình (ATR5) tham chiếu</text>

<rect x="90" y="250" width="12" height="35" fill="#ef4444"/>
<line x1="96" y1="242" x2="96" y2="292" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="115" y="275" width="12" height="35" fill="#ef4444"/>
<line x1="121" y1="265" x2="121" y2="317" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="140" y="295" width="12" height="30" fill="#ef4444"/>
<line x1="146" y1="285" x2="146" y2="332" stroke="#9ca3af" stroke-width="1.5"/>

<!-- shallow judas: small dip, only ~30% of typical range -->
<rect x="165" y="315" width="12" height="18" fill="#ef4444"/>
<line x1="171" y1="308" x2="171" y2="340" stroke="#f97316" stroke-width="2.5"/>
<path d="M 171 340 L 165 350 L 177 350 Z" fill="#f97316"/>
<text x="171" y="366" font-size="11" font-weight="700" fill="#f97316" text-anchor="middle">Judas nông (~30% ATR5)</text>

<line x1="60" y1="450" x2="900" y2="450" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
<text x="70" y="465" font-size="10" fill="#94a3b8" text-anchor="start">SSL kỳ vọng (chưa chạm tới)</text>

<!-- weak MSS with tiny displacement -->
<rect x="195" y="305" width="12" height="15" fill="#22c55e"/>
<line x1="201" y1="298" x2="201" y2="328" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="185" y1="308" x2="280" y2="308" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="285" y="304" font-size="11" fill="#a855f7" text-anchor="start">MSS yếu, displacement nhỏ</text>

<!-- price fails and reverses back down through the weak MSS -->
<rect x="220" y="300" width="12" height="20" fill="#ef4444"/>
<line x1="226" y1="290" x2="226" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="245" y="315" width="12" height="25" fill="#ef4444"/>
<line x1="251" y1="305" x2="251" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="270" y="330" width="12" height="25" fill="#ef4444"/>
<line x1="276" y1="320" x2="276" y2="365" stroke="#9ca3af" stroke-width="1.5"/>
<text x="253" y="385" font-size="11" fill="#f87171" text-anchor="middle">MSS bị vô hiệu ngay sau đó</text>

<rect x="640" y="90" width="280" height="230" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
<text x="656" y="114" font-size="13" font-weight="700" fill="#e5e7eb" text-anchor="start">Kết quả: NO-TRADE</text>
<text x="656" y="140" font-size="12" fill="#94a3b8" text-anchor="start">Judas swing chỉ ~30% ATR(5)</text>
<text x="656" y="158" font-size="12" fill="#94a3b8" text-anchor="start">trung bình — quá nông để tin cậy</text>
<text x="656" y="182" font-size="12" fill="#94a3b8" text-anchor="start">MSS hình thành nhưng displacement</text>
<text x="656" y="200" font-size="12" fill="#94a3b8" text-anchor="start">yếu, bị vô hiệu gần như ngay lập tức</text>
<text x="656" y="224" font-size="12" font-weight="700" fill="#4ade80" text-anchor="start">Quyết định: bỏ qua, không vào</text>
<text x="656" y="248" font-size="11.5" fill="#94a3b8" text-anchor="start">Trader đo biên độ trước khi xét</text>
<text x="656" y="266" font-size="11.5" fill="#94a3b8" text-anchor="start">MSS — thấy dưới ngưỡng nên bỏ</text>
<text x="656" y="290" font-size="11.5" fill="#4ade80" text-anchor="start">missing_step: none (đứng ngoài đúng)</text>
<text x="656" y="308" font-size="11" fill="#94a3b8" text-anchor="start">Tránh được một lệnh xác suất thấp</text>

<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Đo biên độ Judas so với ATR(5) trước khi tin MSS — swing quá nông thường báo hiệu MSS sẽ thất bại</text>
</svg>
