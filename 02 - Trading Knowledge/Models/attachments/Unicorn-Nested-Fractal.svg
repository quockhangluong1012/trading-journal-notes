<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Unicorn lồng trong PD array HTF (Nested/Fractal)</text>
<rect x="80" y="100" width="800" height="420" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="100" y="130" font-size="15" font-weight="700" fill="#ec4899" text-anchor="start">H4/H1 — POI HTF (Discount Order Block)</text>
<rect x="260" y="220" width="440" height="200" fill="rgba(168,85,247,0.20)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="280" y="250" font-size="14" font-weight="700" fill="#a855f7" text-anchor="start">M5/M1 — Unicorn LTF</text>
<text x="280" y="272" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">(Breaker ∩ FVG cùng hướng)</text>
<line x1="320" y1="450" x2="320" y2="412" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="314.0" y="420" width="12" height="20" fill="#ef4444"/>
<line x1="360" y1="428" x2="360" y2="392" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="354.0" y="400" width="12" height="20" fill="#ef4444"/>
<line x1="400" y1="408" x2="400" y2="334" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="394.0" y="340" width="12" height="60" fill="#22c55e"/>
<line x1="440" y1="346" x2="440" y2="314" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="434.0" y="320" width="12" height="20" fill="#22c55e"/>
<text x="480" y="470" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">HTF cho "nơi" — LTF cho "thời điểm &amp; entry"</text>
<text x="32" y="545" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">Unicorn LTF mạnh nhất khi hình thành BÊN TRONG một POI HTF cùng hướng.</text>
<text x="32" y="565" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Sơ đồ khái niệm minh họa tính fractal — không phải chart giá thật.</text>
</svg>
