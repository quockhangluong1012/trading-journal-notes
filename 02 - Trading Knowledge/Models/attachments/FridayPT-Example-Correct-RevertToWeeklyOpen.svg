<defs><marker id="arrPTC" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker></defs>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Chart minh họa sequence đúng, không phải dữ liệu giao dịch thật.</text>
