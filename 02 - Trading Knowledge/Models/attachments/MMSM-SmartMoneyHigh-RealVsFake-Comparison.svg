<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Smart Money High thật vs. Inducement (sweep giả)</text>

<line x1="480" y1="60" x2="480" y2="540" stroke="#1f2937" stroke-width="1"/>

<!-- LEFT: valid SMH -->
<text x="70" y="70" font-size="15" font-weight="700" fill="#f87171">Smart Money High hợp lệ</text>
<line x1="48" y1="220" x2="430" y2="220" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="214" font-size="12" fill="#eab308">BSL cũ</text>

<!-- candles up into sweep -->
<rect x="90" y="290" width="12" height="60" fill="#22c55e"/><line x1="96" y1="280" x2="96" y2="360" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="260" width="12" height="60" fill="#22c55e"/><line x1="126" y1="248" x2="126" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="150" y="230" width="12" height="65" fill="#22c55e"/><line x1="156" y1="215" x2="156" y2="305" stroke="#9ca3af" stroke-width="1.5"/>
<!-- sweep candle: wick pierces BSL, close reclaims below -->
<rect x="180" y="235" width="12" height="35" fill="#ef4444"/><line x1="186" y1="205" x2="186" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<!-- reclaim candles down -->
<rect x="210" y="265" width="12" height="35" fill="#ef4444"/><line x1="216" y1="260" x2="216" y2="312" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="240" y="295" width="14" height="45" fill="#ef4444"/><line x1="247" y1="285" x2="247" y2="355" stroke="#9ca3af" stroke-width="1.5"/>
<text x="150" y="415" font-size="11" fill="#94a3b8">Reclaim nhanh</text>

<!-- MSS + displacement + FVG down -->
<line x1="90" y1="310" x2="300" y2="310" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="300" y="325" font-size="11" fill="#a855f7">Swing low</text>
<rect x="270" y="330" width="16" height="90" fill="#ef4444"/><line x1="278" y1="325" x2="278" y2="435" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="300" y="360" width="16" height="80" fill="#ef4444"/><line x1="308" y1="352" x2="308" y2="450" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="330" y="390" width="16" height="60" fill="#ef4444"/><line x1="338" y1="382" x2="338" y2="465" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="270" y="335" width="76" height="35" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
<text x="290" y="392" font-size="11" fill="#93c5fd">FVG</text>
<text x="80" y="440" font-size="12" fill="#f87171">Reclaim nhanh + MSS thật</text>

<!-- RIGHT: Inducement fake -->
<text x="540" y="70" font-size="15" font-weight="700" fill="#4ade80">Inducement / sweep giả</text>
<line x1="510" y1="220" x2="910" y2="220" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="514" y="214" font-size="12" fill="#eab308">Đỉnh cũ</text>

<rect x="560" y="290" width="12" height="60" fill="#22c55e"/><line x1="566" y1="280" x2="566" y2="360" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="590" y="260" width="12" height="55" fill="#22c55e"/><line x1="596" y1="248" x2="596" y2="325" stroke="#9ca3af" stroke-width="1.5"/>
<!-- sweep candle pierces then weak drop -->
<rect x="620" y="235" width="12" height="30" fill="#ef4444"/><line x1="626" y1="205" x2="626" y2="270" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="650" y="245" width="12" height="25" fill="#ef4444"/><line x1="656" y1="238" x2="656" y2="278" stroke="#9ca3af" stroke-width="1.5"/>
<text x="600" y="300" font-size="11" fill="#94a3b8">Rơi yếu</text>
<!-- continues higher, no MSS -->
<rect x="680" y="200" width="12" height="55" fill="#22c55e"/><line x1="686" y1="190" x2="686" y2="270" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="710" y="160" width="12" height="65" fill="#22c55e"/><line x1="716" y1="148" x2="716" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="740" y="115" width="12" height="70" fill="#22c55e"/><line x1="746" y1="103" x2="746" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<text x="640" y="100" font-size="12" fill="#4ade80">Rơi yếu, không MSS,</text>
<text x="640" y="116" font-size="12" fill="#4ade80">buy program tiếp diễn</text>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Chart minh họa khái niệm, không phải dữ liệu giao dịch thật</text>
</svg>
