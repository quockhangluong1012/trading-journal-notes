  <text x="620" y="230" font-size="12" fill="#a04000">that bai ro rang, can nhac cho</text>
  <text x="620" y="248" font-size="12" fill="#a04000">POI sau hon phan ung truoc</text>
  <text x="600" y="280" font-size="11" fill="#888">[HEURISTIC - n=1 trong cum nay]</text>
  <text x="600" y="298" font-size="11" fill="#888">khong phai luat ICT co san</text>
