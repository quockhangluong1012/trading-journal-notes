  <text x="615" y="382" font-size="11" fill="#a04000">(xem Doctrine check, muc 11)</text>

  <text x="540" y="530" text-anchor="middle" font-size="12" fill="#444">First error = poi (chon cap do), nhung nhan Breaker cho POI nong van UNSUPPORTED theo canon.</text>

