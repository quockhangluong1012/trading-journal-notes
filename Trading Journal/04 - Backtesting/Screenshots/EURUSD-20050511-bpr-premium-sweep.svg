<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">BPR Premium Sweep - Short tai Balance Price Range</text>
  <text x="540" y="52" text-anchor="middle" font-size="13" fill="#666">EURUSD 2005-05-11 Short - sweep EQH named level truoc khi Displacement + MSS</text>

  <!-- LEFT: chart timeline -->
  <text x="235" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">DIEN BIEN THUC TE (Win)</text>
  <rect x="70" y="100" width="330" height="410" fill="#fafafa" stroke="#ddd"/>

  <!-- dealing range -->
  <line x1="70" y1="140" x2="400" y2="140" stroke="#999" stroke-dasharray="2 2"/>
  <text x="405" y="144" font-size="10" fill="#999">Range High 1.29884</text>
  <line x1="70" y1="470" x2="400" y2="470" stroke="#999" stroke-dasharray="2 2"/>
  <text x="405" y="474" font-size="10" fill="#999">Range Low 1.27889</text>
  <line x1="70" y1="305" x2="400" y2="305" stroke="#bbb" stroke-dasharray="3 3"/>
  <text x="405" y="309" font-size="10" fill="#888">EQ 1.28887</text>

  <!-- BPR box -->
  <rect x="70" y="230" width="330" height="70" fill="#f5b7b1" fill-opacity="0.5"/>
  <text x="150" y="225" font-size="11" fill="#943126">BPR (2 FVG doi nghich chong nhau)</text>

  <!-- EQH sweep marker -->
  <line x1="70" y1="235" x2="400" y2="235" stroke="#c0392b" stroke-width="1.5"/>
  <text x="405" y="239" font-size="10" fill="#c0392b">EQH 1.28912 (named, SWEPT)</text>

  <!-- CE -->
  <line x1="70" y1="262" x2="400" y2="262" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="405" y="266" font-size="10" fill="#e67e22">CE 1.28886 (tinh lai)</text>

  <!-- Entry -->
  <line x1="70" y1="266" x2="400" y2="266" stroke="#1e8449" stroke-width="2"/>
  <text x="130" y="255" font-size="11" font-weight="700" fill="#1e8449">Entry 1.28878 (M5 FVG)</text>

  <!-- SL -->
  <line x1="70" y1="200" x2="400" y2="200" stroke="#c0392b" stroke-dasharray="5 3"/>
  <text x="405" y="204" font-size="10" fill="#c0392b">SL 1.29117</text>

  <!-- TP -->
  <line x1="70" y1="445" x2="400" y2="445" stroke="#1e8449" stroke-dasharray="5 3"/>
  <text x="405" y="449" font-size="10" fill="#1e8449">TP 1.28123</text>

  <path d="M 235 266 Q 260 350 260 440" stroke="#1e8449" stroke-width="2.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="235" y="490" text-anchor="middle" font-size="11" fill="#1e8449">Sweep EQH -&gt; Displacement -&gt; MSS M5 -&gt; giam ve TP</text>

  <!-- RIGHT: sequence diagram -->
  <text x="745" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#2874a6">TRINH TU 7-BUOC</text>
  <rect x="580" y="100" width="330" height="410" fill="#fafafa" stroke="#ddd"/>

  <g font-size="12" fill="#1a1a1a">
    <text x="600" y="140">1. D1 Bias: Bearish (LH/LL)</text>
    <text x="600" y="175">2. H1 POI: BPR trong Premium</text>
    <text x="600" y="210">3. Sweep: EQH 1.28912 (named)</text>
    <text x="600" y="245">4. Displacement: nen than lon</text>
    <text x="600" y="280">5. MSS: pha higher-low M5</text>
    <text x="600" y="315">6. FVG M5: entry tai CE 1.28878</text>
    <text x="600" y="350">7. Entry: dung ke hoach, khong chase</text>
  </g>

  <rect x="590" y="120" width="300" height="245" fill="none" stroke="#2874a6" stroke-dasharray="2 2"/>

  <text x="745" y="400" text-anchor="middle" font-size="11" fill="#2874a6" font-weight="700">Khac biet vs 07-08: EQH duoc dat ten TRUOC,</text>
  <text x="745" y="416" text-anchor="middle" font-size="11" fill="#2874a6" font-weight="700">khong phai goi ten sau khi thay gia phan ung</text>

  <text x="540" y="540" text-anchor="middle" font-size="12" fill="#444">Bai hoc: Sweep phai neo named level xac dinh truoc, moi tinh la structural.</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e8449"/>
    </marker>
  </defs>
</svg>
