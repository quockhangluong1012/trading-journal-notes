<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#0e1726"/>
  <text x="30" y="38" fill="#e2e8f0" font-size="19" font-weight="bold">Case study — Sweep vs Acceptance: cùng "quét" nhưng khác bậc chứng cứ</text>

  <!-- Panel A -->
  <rect x="40" y="70" width="400" height="330" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="60" y="100" fill="#4ade80" font-size="15" font-weight="bold">A · Textbook sweep</text>
  <line x1="60" y1="280" x2="420" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="272" fill="#f59e0b" font-size="11">EQL pool</text>
  <!-- candles A -->
  <line x1="129" y1="205" x2="129" y2="268" stroke="#f87171" stroke-width="2"/>
  <rect x="120" y="215" width="18" height="40" fill="#ef4444"/>
  <line x1="209" y1="235" x2="209" y2="350" stroke="#4ade80" stroke-width="2"/>
  <rect x="200" y="235" width="18" height="27" fill="#22c55e"/>
  <line x1="289" y1="170" x2="289" y2="245" stroke="#4ade80" stroke-width="2"/>
  <rect x="280" y="180" width="18" height="55" fill="#22c55e"/>
  <text x="228" y="345" fill="#94a3b8" font-size="11">wick xuyên pool</text>
  <!-- captions A -->
  <text x="60" y="435" fill="#cbd5e1" font-size="13">• Wick xuyên pool, body close ngay bên trên</text>
  <text x="60" y="459" fill="#cbd5e1" font-size="13">• 1–2 nến, không có close nào dưới pool</text>
  <text x="60" y="483" fill="#cbd5e1" font-size="13">• Level có tên + bị reject = đủ evidence bar</text>
  <text x="60" y="516" fill="#4ade80" font-size="14" font-weight="bold">→ Label "sweep": PASS</text>

  <!-- Panel B -->
  <rect x="480" y="70" width="400" height="330" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="500" y="100" fill="#fbbf24" font-size="15" font-weight="bold">B · Đợt 24–29/7 trên NDX (case thật)</text>
  <line x1="500" y1="280" x2="860" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="502" y="272" fill="#f59e0b" font-size="11">EQL 28,192–28,237</text>
  <!-- candles B -->
  <line x1="618" y1="240" x2="618" y2="300" stroke="#f87171" stroke-width="2"/>
  <rect x="610" y="250" width="16" height="42" fill="#ef4444"/>
  <line x1="658" y1="275" x2="658" y2="315" stroke="#f87171" stroke-width="2"/>
  <rect x="650" y="285" width="16" height="20" fill="#ef4444"/>
  <line x1="698" y1="292" x2="698" y2="332" stroke="#f87171" stroke-width="2"/>
  <rect x="690" y="300" width="16" height="25" fill="#ef4444"/>
  <line x1="738" y1="315" x2="738" y2="375" stroke="#f87171" stroke-width="2"/>
  <rect x="730" y="322" width="16" height="46" fill="#ef4444"/>
  <line x1="778" y1="258" x2="778" y2="375" stroke="#4ade80" stroke-width="2"/>
  <rect x="770" y="284" width="16" height="88" fill="#22c55e"/>
  <line x1="818" y1="270" x2="818" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <rect x="810" y="286" width="16" height="6" fill="#94a3b8"/>
  <line x1="858" y1="288" x2="858" y2="254" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="858" y1="220" x2="858" y2="258" stroke="#4ade80" stroke-width="2"/>
  <rect x="850" y="226" width="16" height="26" fill="#22c55e"/>
  <text x="858" y="210" fill="#f472b6" font-size="11" text-anchor="middle">NWOG</text>
  <!-- date labels -->
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="618" y="392">24/7</text><text x="658" y="392">27/7</text><text x="698" y="392">28/7</text>
    <text x="738" y="392">29/7</text><text x="778" y="392">30/7</text><text x="818" y="392">31/7</text><text x="858" y="392">3/8</text>
  </g>
  <!-- captions B -->
  <text x="500" y="435" fill="#cbd5e1" font-size="13">• Break + 3 close D1 rõ dưới pool · sâu −4.06% · 4–5 phiên</text>
  <text x="500" y="459" fill="#cbd5e1" font-size="13">• Quay về nhờ 1 nến +1,130 pts, rồi gap 286.9 pts qua biên</text>
  <text x="500" y="483" fill="#cbd5e1" font-size="13">• Doctrine không fix độ sâu / số phiên tối đa của sweep</text>
  <text x="500" y="516" fill="#fbbf24" font-size="14" font-weight="bold">→ AMBIGUOUS (fork O1′) · phân xử bằng backtest T3</text>
</svg>
