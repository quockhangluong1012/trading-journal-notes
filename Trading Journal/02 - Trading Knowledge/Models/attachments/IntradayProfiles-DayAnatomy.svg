<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1F2937">Intraday Profile - Giai phau mot ngay giao dich (Classic Buy Day)</text>
  <text x="24" y="52" font-size="12.5" fill="#6B7280">Power of Three cap ngay: Asia gom - London protraction (Judas) - NY expansion - NY PM reversal.</text>
  <rect x="40" y="74" width="680" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
  <rect x="60" y="76" width="140" height="256" fill="#F8FAFC" opacity="0.7"/>
  <line x1="200" y1="76" x2="200" y2="332" stroke="#E5E7EB" stroke-width="1"/>
  <text x="130" y="94" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Asia (Accumulation)</text>
  <rect x="200" y="76" width="160" height="256" fill="#FEF3C7" opacity="0.7"/>
  <line x1="360" y1="76" x2="360" y2="332" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="94" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">London (Manipulation / Judas)</text>
  <rect x="360" y="76" width="200" height="256" fill="#ECFDF5" opacity="0.7"/>
  <line x1="560" y1="76" x2="560" y2="332" stroke="#E5E7EB" stroke-width="1"/>
  <text x="460" y="94" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">NY AM (Distribution / Expansion)</text>
  <rect x="560" y="76" width="140" height="256" fill="#F8FAFC" opacity="0.7"/>
  <line x1="700" y1="76" x2="700" y2="332" stroke="#E5E7EB" stroke-width="1"/>
  <text x="630" y="94" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">NY PM (Reversal / PT)</text>
  <text x="60" y="350" font-size="9.5" fill="#9CA3AF" text-anchor="middle">00:00 NY</text>
  <text x="200" y="350" font-size="9.5" fill="#9CA3AF" text-anchor="middle">02:00 NY</text>
  <text x="360" y="350" font-size="9.5" fill="#9CA3AF" text-anchor="middle">08:30 NY</text>
  <text x="560" y="350" font-size="9.5" fill="#9CA3AF" text-anchor="middle">13:30 NY</text>
  <text x="700" y="350" font-size="9.5" fill="#9CA3AF" text-anchor="middle">16:00 NY</text>
  <polyline points="60,215 110,210 160,218 200,215 250,255 300,300 340,275 360,255 410,210 470,165 520,130 560,120 610,110 650,120 700,150" fill="none" stroke="#374151" stroke-width="2.2"/>
  <line x1="300" y1="300" x2="710" y2="300" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="300" cy="300" r="8.5" fill="#DC2626"/>
  <text x="300" y="304" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
  <text x="300" y="322" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Low of day (London Judas)</text>
  <line x1="610" y1="110" x2="710" y2="110" stroke="#16A34A" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="610" cy="110" r="8.5" fill="#16A34A"/>
  <text x="610" y="114" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text>
  <text x="610" y="104" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">High of day (NY PM)</text>
  <text x="130" y="128" font-size="10" fill="#6B7280" text-anchor="middle">range hep - gom TP</text>
  <text x="280" y="132" font-size="10" fill="#B45309" text-anchor="middle">Judas nguoc bias</text>
  <text x="460" y="128" font-size="10" fill="#15803D" text-anchor="middle">move that len DOL</text>
  <text x="630" y="132" font-size="10" fill="#6B7280" text-anchor="middle">chot loi / dao nhe</text>
  <rect x="40" y="388" width="680" height="44" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="56" y="406" font-size="11" font-weight="700" fill="#374151">A = Accumulation</text>
  <text x="240" y="406" font-size="11" font-weight="700" fill="#B45309">M = Manipulation (protraction)</text>
  <text x="520" y="406" font-size="11" font-weight="700" fill="#15803D">D = Distribution (expansion)</text>
  <text x="56" y="424" font-size="10" fill="#6B7280">Dinh/day ngay hinh thanh tuy daily bias: buy day - low o London, high o NY PM; sell day nguoc lai.</text>
  <text x="24" y="456" font-size="10.5" fill="#6B7280">So do khai niem minh hoa nhip dieu mot ngay - khong phai du lieu gia that.</text>
</svg>
