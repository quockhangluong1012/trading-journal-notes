<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Window creep — cửa sổ bị nới ra sau hard cutoff</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Minh họa hành vi kỷ luật, không phải dữ liệu giá thật</text>

  <line x1="60" y1="300" x2="920" y2="300" stroke="#334155" stroke-width="2"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="320">09:30</text>
    <text x="500" y="320">10:30 (cutoff)</text>
    <text x="700" y="320">10:50</text>
    <text x="880" y="320">11:00</text>
  </g>

  <!-- valid window -->
  <rect x="200" y="150" width="300" height="60" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3" stroke-width="2"/>
  <text x="350" y="184" font-size="13" fill="#e5e7eb" text-anchor="middle">Venom Cutting Zone hợp lệ</text>

  <!-- hard cutoff line -->
  <line x1="500" y1="120" x2="500" y2="290" stroke="#ef4444" stroke-width="3"/>
  <text x="500" y="110" font-size="12.5" fill="#ef4444" text-anchor="middle" font-weight="700">HARD CUTOFF</text>

  <!-- creep zone -->
  <rect x="500" y="150" width="200" height="60" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-dasharray="4 3" stroke-width="2"/>
  <text x="600" y="184" font-size="12.5" fill="#f97316" text-anchor="middle">"Chờ thêm chút" — window creep</text>

  <!-- late entry marker -->
  <circle cx="700" cy="180" r="8" fill="#f87171"/>
  <path d="M 700 190 l 0 40" stroke="#f87171" stroke-width="2"/>
  <text x="700" y="250" font-size="12" fill="#f87171" text-anchor="middle">Entry muộn 10:50</text>
  <text x="700" y="266" font-size="11" fill="#94a3b8" text-anchor="middle">dán nhãn "Venom" sai</text>

  <!-- decaying momentum arrow -->
  <path d="M 500 240 Q 650 260 850 275" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrDecay)"/>
  <text x="850" y="290" font-size="11" fill="#94a3b8" text-anchor="end">động lực cash-open cạn dần</text>

  <defs>
    <marker id="arrDecay" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
