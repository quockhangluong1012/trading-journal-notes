<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="720" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Chuỗi thua liên tiếp là BÌNH THƯỜNG về thống kê — kể cả với hệ thống có lợi thế</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Xác suất gặp ít nhất một chuỗi thua dài (lệnh độc lập, win rate cố định — giả định đơn giản hóa)</text>
<text x="600.0" y="706.0" font-size="11.5" font-weight="400" fill="#484f58" text-anchor="middle" font-style="italic">Tính chính xác bằng quy hoạch động (không phải ước lượng) · win rate là giả định minh họa, không phải số liệu của bạn</text>
