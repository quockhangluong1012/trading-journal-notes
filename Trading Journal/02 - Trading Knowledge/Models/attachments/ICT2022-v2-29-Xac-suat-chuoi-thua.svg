<text x="600.0" y="124.0" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">≥ 5 thua liên tiếp trong 100 lệnh</text>
<rect x="860.0" y="95.0" width="300.0" height="290.0" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
<text x="872.0" y="117.0" font-size="14" font-weight="700" fill="#e3b341" text-anchor="start">Chuỗi thua dài nhất trong 100 lệnh</text>
<text x="872.0" y="137.3" font-size="12.3" font-weight="400" fill="#8b949e" text-anchor="start">(mô phỏng 20.000 lần)</text>
<text x="872.0" y="156.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="872.0" y="175.3" font-size="12.3" font-weight="700" fill="#e6edf3" text-anchor="start">Win rate 55%:</text>
<text x="872.0" y="194.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  trung vị 5 lệnh · 10% số lần ≥ 7</text>
<text x="872.0" y="213.3" font-size="12.3" font-weight="700" fill="#e6edf3" text-anchor="start">Win rate 45%:</text>
<text x="872.0" y="232.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  trung vị 6 lệnh · 10% số lần ≥ 10</text>
<text x="872.0" y="251.3" font-size="12.3" font-weight="700" fill="#e6edf3" text-anchor="start">Win rate 35%:</text>
<text x="872.0" y="270.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  trung vị 9 lệnh · 10% số lần ≥ 13</text>
<text x="872.0" y="289.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="872.0" y="308.3" font-size="12.3" font-weight="700" fill="#e3b341" text-anchor="start">→ Đặt circuit breaker theo con số</text>
<text x="872.0" y="327.3" font-size="12.3" font-weight="700" fill="#e3b341" text-anchor="start">   này, không theo cảm xúc.</text>
<rect x="860.0" y="400.0" width="300.0" height="285.0" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="872.0" y="422.0" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="start">Đọc đúng</text>
<text x="872.0" y="442.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• 3–4 lệnh thua liên tiếp KHÔNG</text>
<text x="872.0" y="461.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  phải bằng chứng mô hình hỏng.</text>
<text x="872.0" y="480.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Tín hiệu thật: các lệnh thua có</text>
<text x="872.0" y="499.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  CÙNG first_error_step lặp lại.</text>
<text x="872.0" y="518.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Lệnh thực tế không độc lập (cùng</text>
<text x="872.0" y="537.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  regime) → chuỗi thua có thể còn</text>
<text x="872.0" y="556.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  dài hơn mô phỏng.</text>
<text x="872.0" y="575.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Dùng để đặt circuit breaker,</text>
<text x="872.0" y="594.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  không để chấm mô hình.</text></svg>