<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="me3b341" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker></defs><rect width="1200" height="720" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Giải thích cho trẻ 5 tuổi — Bản đồ thành phố, khu phố, con đường</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">D1 cho biết mình ở đâu và muốn tới đâu · H1 khoanh khu cần chú ý · M5 chỉ đường đi cụ thể</text>
<text x="600.0" y="706.0" font-size="11.5" font-weight="400" fill="#484f58" text-anchor="middle" font-style="italic">Sơ đồ minh họa khái niệm — dữ liệu giá giả lập, không phải chart thật</text>
<rect x="40.0" y="100.0" width="360.0" height="420.0" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="220.0" y="128.0" font-size="15" font-weight="800" fill="#58a6ff" text-anchor="middle">D1 = BẢN ĐỒ THÀNH PHỐ</text>
<line x1="60.0" y1="145.0" x2="60.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="110.0" y1="145.0" x2="110.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="160.0" y1="145.0" x2="160.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="210.0" y1="145.0" x2="210.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="260.0" y1="145.0" x2="260.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="310.0" y1="145.0" x2="310.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="360.0" y1="145.0" x2="360.0" y2="505.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="150.0" x2="385.0" y2="150.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="205.0" x2="385.0" y2="205.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="260.0" x2="385.0" y2="260.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="315.0" x2="385.0" y2="315.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="370.0" x2="385.0" y2="370.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="425.0" x2="385.0" y2="425.0" stroke="#30363d" stroke-width="1"/>
<line x1="55.0" y1="480.0" x2="385.0" y2="480.0" stroke="#30363d" stroke-width="1"/>
<rect x="70.0" y="160.0" width="110.0" height="60.0" rx="8" fill="#e3b341" fill-opacity="0.25" stroke="#e3b341" stroke-width="1.5"/>
<text x="125.0" y="186.0" font-size="12" font-weight="800" fill="#e3b341" text-anchor="middle">ĐIỂM ĐẾN</text>
<text x="125.0" y="204.0" font-size="11" font-weight="600" fill="#e3b341" text-anchor="middle">(DOL = BSL)</text>
<circle cx="300.0" cy="440.0" r="9" fill="#f778ba"/>
<text x="300.0" y="468.0" font-size="12" font-weight="700" fill="#f778ba" text-anchor="middle">Mình đang ở đây</text>
<text x="300.0" y="484.0" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">(vị trí trong range)</text>
<rect x="220.0" y="330.0" width="140.0" height="90.0" rx="6" fill="none" stroke="#bc8cff" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="290.0" y="322.0" font-size="11.5" font-weight="700" fill="#bc8cff" text-anchor="middle">khu cần chú ý</text>
<line x1="300.0" y1="430.0" x2="140.0" y2="225.0" stroke="#e3b341" stroke-width="2" marker-end="url(#me3b341)" stroke-dasharray="7 5"/>
<rect x="430.0" y="100.0" width="340.0" height="420.0" rx="14" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<text x="600.0" y="128.0" font-size="15" font-weight="800" fill="#bc8cff" text-anchor="middle">H1 = BẢN ĐỒ KHU PHỐ</text>
<line x1="360.0" y1="330.0" x2="430.0" y2="150.0" stroke="#bc8cff" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="360.0" y1="420.0" x2="430.0" y2="515.0" stroke="#bc8cff" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="470.0" y="330.0" width="260.0" height="110.0" rx="8" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-width="1.5"/>
<text x="600.0" y="360.0" font-size="13" font-weight="700" fill="#bc8cff" text-anchor="middle">Cửa hàng mình muốn vào</text>
<text x="600.0" y="380.0" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">(POI H1 bên trong POI D1)</text>
<text x="600.0" y="404.0" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="middle">Chưa tới cửa thì chưa cần</text>
<text x="600.0" y="420.0" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="middle">nhìn biển số nhà (M5)</text>
<polyline points="480.0,170.0 540.0,210.0 600.0,200.0 650.0,260.0 640.0,320.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="560.0" y="180.0" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">đường hồi về khu</text>
<rect x="500.0" y="455.0" width="200.0" height="40.0" rx="6" fill="#d29922" fill-opacity="0.18" stroke="#d29922" stroke-width="1.5"/>
<text x="600.0" y="480.0" font-size="12" font-weight="700" fill="#d29922" text-anchor="middle">Bãi xe đông người (SSL)</text>
<rect x="800.0" y="100.0" width="360.0" height="420.0" rx="14" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
<text x="980.0" y="128.0" font-size="15" font-weight="800" fill="#39c5cf" text-anchor="middle">M5 = CON ĐƯỜNG NHỎ</text>
<line x1="730.0" y1="330.0" x2="800.0" y2="150.0" stroke="#39c5cf" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="730.0" y1="440.0" x2="800.0" y2="515.0" stroke="#39c5cf" stroke-width="1" stroke-dasharray="3 4"/>
<text x="818.0" y="170.0" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">① Đi vòng qua bãi xe (quét SSL)</text>
<text x="818.0" y="196.0" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">② Rẽ mạnh, bỏ hẳn hướng cũ (MSS + displacement)</text>
<text x="818.0" y="222.0" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">③ Để lại 'ổ gà' trên đường (FVG)</text>
<text x="818.0" y="248.0" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">④ Quay lại đúng ổ gà để lên xe (entry)</text>
<text x="818.0" y="274.0" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">⑤ Nếu đi lùi quá bãi xe → sai đường (SL)</text>
<text x="818.0" y="300.0" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">⑥ Đi tới điểm đến (target)</text>
<polyline points="830.0,470.0 860.0,495.0 885.0,505.0 905.0,470.0 940.0,420.0 965.0,440.0 1000.0,400.0 1060.0,340.0" fill="none" stroke="#39c5cf" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="885.0" cy="505.0" r="5" fill="#d29922"/>
<circle cx="965.0" cy="440.0" r="6" fill="#39c5cf"/>
<text x="975.0" y="460.0" font-size="11" font-weight="700" fill="#39c5cf" text-anchor="start">lên xe</text>
<rect x="40.0" y="545.0" width="1120.0" height="140.0" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.6"/>
<text x="52.0" y="567.0" font-size="14" font-weight="700" fill="#f0883e" text-anchor="start">Giới hạn của phép so sánh (Level 5)</text>
<text x="52.0" y="587.3" font-size="12.8" font-weight="400" fill="#e6edf3" text-anchor="start">• Bản đồ thành phố KHÔNG biết trước tương lai: 'điểm đến' (DOL) chỉ là giả thuyết có điều kiện, có thể bị thay bằng điểm đến khác.</text>
<text x="52.0" y="605.0" font-size="12.8" font-weight="400" fill="#e6edf3" text-anchor="start">• Con đường nhỏ (M5) không cho biết hướng của thành phố: một khúc rẽ trên M5 không làm đổi bias D1.</text>
<text x="52.0" y="622.6" font-size="12.8" font-weight="400" fill="#e6edf3" text-anchor="start">• Trong đời thật, bản đồ đứng yên; trên chart, 'bản đồ' (range, DOL, POI) tự thay đổi khi giá tạo cấu trúc mới → phải re-map.</text>
<text x="52.0" y="640.3" font-size="12.8" font-weight="400" fill="#e6edf3" text-anchor="start">• Không có 'người lái xe' để đọc ý định: chart chỉ cho thấy giá đã đi đâu, không cho thấy AI đi và VÌ SAO.</text></svg>