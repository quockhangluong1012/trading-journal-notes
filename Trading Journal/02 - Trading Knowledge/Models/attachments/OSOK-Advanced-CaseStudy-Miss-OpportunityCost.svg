<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case 5 — Bỏ lỡ 2 setup B tốt vì kỷ luật "chỉ 1 phát/tuần"</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Case tái dựng minh họa, số liệu hypothetical — không phải lệnh thật</text>

  <rect x="80" y="100" width="240" height="90" rx="8" fill="rgba(74,222,128,0.10)" stroke="#4ade80" stroke-width="2"/>
  <text x="200" y="128" font-size="12.5" fill="#4ade80" text-anchor="middle">Thứ Ba: setup A+ 11/12</text>
  <text x="200" y="148" font-size="11.5" fill="#e5e7eb" text-anchor="middle">Vào lệnh, đạt target +55 pip</text>
  <text x="200" y="168" font-size="11" fill="#94a3b8" text-anchor="middle">Đóng sổ tuần theo luật</text>

  <rect x="360" y="100" width="240" height="90" rx="8" fill="rgba(148,163,184,0.10)" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="480" y="128" font-size="12.5" fill="#94a3b8" text-anchor="middle">Thứ Tư: setup 9/12 (B)</text>
  <text x="480" y="148" font-size="11.5" fill="#94a3b8" text-anchor="middle">Bỏ qua đúng luật</text>
  <text x="480" y="168" font-size="11" fill="#f87171" text-anchor="middle">(giá sau đó chạy +80 pip)</text>

  <rect x="640" y="100" width="240" height="90" rx="8" fill="rgba(148,163,184,0.10)" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="760" y="128" font-size="12.5" fill="#94a3b8" text-anchor="middle">Thứ Sáu: setup 8/12 (B)</text>
  <text x="760" y="148" font-size="11.5" fill="#94a3b8" text-anchor="middle">Bỏ qua đúng luật</text>
  <text x="760" y="168" font-size="11" fill="#f87171" text-anchor="middle">(giá sau đó chạy +40 pip)</text>

  <rect x="150" y="230" width="660" height="120" rx="8" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="480" y="256" font-size="13" fill="#f87171" text-anchor="middle" font-weight="700">Chi phí cơ hội thực tế trong tuần này</text>
  <text x="480" y="278" font-size="12" fill="#e5e7eb" text-anchor="middle">Hai setup B bị bỏ qua đều đi đúng hướng và đáng lẽ có lời —</text>
  <text x="480" y="298" font-size="12" fill="#e5e7eb" text-anchor="middle">nhưng đây là hindsight, không phải bằng chứng nên phá luật.</text>
  <text x="480" y="320" font-size="11.5" fill="#94a3b8" text-anchor="middle">Bài học: đánh giá luật "1 phát/tuần" bằng kỳ vọng dài hạn, không bằng từng tuần lẻ.</text>
</svg>
