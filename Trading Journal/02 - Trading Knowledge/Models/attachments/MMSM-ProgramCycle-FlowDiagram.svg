<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">MMSM — Chu kỳ Buy Program → Smart Money High → Sell Program</text>

<rect x="48" y="70" width="150" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
<text x="123" y="98" font-size="13" fill="#e5e7eb" text-anchor="middle">Original</text>
<text x="123" y="112" font-size="13" fill="#e5e7eb" text-anchor="middle">Consolidation</text>

<!-- Buy program green zone (rising leg first) -->
<rect x="48" y="130" width="430" height="300" fill="rgba(34,197,94,0.08)"/>
<text x="60" y="150" font-size="13" fill="#4ade80">Buy Program — Nửa A</text>

<!-- step up staircase -->
<polyline points="90,400 170,400 170,340 250,340 250,280 330,280 330,220 410,220 410,160 470,160" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<text x="150" y="330" font-size="12" fill="#94a3b8">LRB 1</text>
<text x="230" y="270" font-size="12" fill="#94a3b8">LRB 2</text>
<text x="310" y="210" font-size="12" fill="#94a3b8">LRB 3</text>

<!-- BSL line -->
<line x1="48" y1="140" x2="500" y2="140" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="134" font-size="13" fill="#eab308">BSL</text>

<!-- sweep arrow up into BSL -->
<defs><marker id="arrOrangeMMSM1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,6 L6,3 L0,0 Z" fill="#f97316"/></marker></defs>
<line x1="470" y1="160" x2="470" y2="140" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOrangeMMSM1)"/>

<!-- Smart Money High circle -->
<circle cx="470" cy="140" r="26" fill="none" stroke="#f87171" stroke-width="2.5"/>
<text x="470" y="115" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">Smart Money High</text>

<!-- MSS giảm line -->
<line x1="470" y1="250" x2="620" y2="250" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="620" y="246" font-size="12" fill="#a855f7">MSS giảm</text>

<!-- drop arrow down -->
<defs><marker id="arrRedMMSM1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker></defs>
<line x1="470" y1="140" x2="500" y2="250" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrRedMMSM1)"/>

<!-- Sell program red zone -->
<rect x="500" y="180" width="410" height="330" fill="rgba(239,68,68,0.08)"/>
<text x="770" y="240" font-size="13" fill="#f87171">Sell Program — Nửa B</text>

<!-- step down staircase -->
<polyline points="500,250 560,250 560,300 630,300 630,350 700,350 700,400 780,400 780,450 850,450" fill="none" stroke="#ef4444" stroke-width="2.5"/>
<text x="565" y="290" font-size="12" fill="#94a3b8">LRS 1</text>
<text x="635" y="340" font-size="12" fill="#94a3b8">LRS 2</text>
<text x="705" y="390" font-size="12" fill="#94a3b8">LRS 3</text>

<!-- SSL target line -->
<line x1="500" y1="470" x2="910" y2="470" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="670" y="486" font-size="11" fill="#eab308">SSL / Original Consolidation (Target)</text>

<!-- Legend -->
<rect x="700" y="60" width="12" height="12" fill="#22c55e"/>
<text x="718" y="70" font-size="12" fill="#94a3b8">Buy Program</text>
<rect x="700" y="80" width="12" height="12" fill="#ef4444"/>
<text x="718" y="90" font-size="12" fill="#94a3b8">Sell Program</text>
<rect x="700" y="100" width="12" height="2" fill="#eab308"/>
<text x="718" y="106" font-size="12" fill="#94a3b8">Liquidity pool (BSL/SSL)</text>

<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa cấu trúc mô hình — không phải chart giá thật</text>
</svg>
