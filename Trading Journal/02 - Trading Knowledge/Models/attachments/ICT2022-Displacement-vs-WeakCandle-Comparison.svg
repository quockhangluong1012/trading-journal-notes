<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Displacement hợp lệ vs. Nến to nhưng yếu</text>
<line x1="480" y1="60" x2="480" y2="560" stroke="#334155" stroke-width="1"/>
<text x="240" y="72" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">Displacement hợp lệ</text>
<line x1="60" y1="466" x2="60" y2="444" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="54.0" y="450" width="12" height="10" fill="#22c55e"/>
<line x1="90" y1="456" x2="90" y2="432" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="84.0" y="438" width="12" height="12" fill="#22c55e"/>
<line x1="150" y1="442" x2="150" y2="326" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="143.0" y="330" width="14" height="108" fill="#22c55e"/>
<line x1="180" y1="334" x2="180" y2="236" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="173.0" y="240" width="14" height="90" fill="#22c55e"/>
<line x1="210" y1="244" x2="210" y2="171" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="203.0" y="175" width="14" height="65" fill="#22c55e"/>
<rect x="142" y="242" width="46" height="194" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="142" y="258" font-size="12" font-weight="400" fill="#3b82f6" text-anchor="start">FVG rõ</text>
<line x1="40" y1="438" x2="300" y2="438" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="40" y="430" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">swing high cũ</text>
<line x1="240" y1="178" x2="240" y2="155" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="234.0" y="160" width="12" height="15" fill="#22c55e"/>
<text x="130" y="470" font-size="12" font-weight="400" fill="#4ade80" text-anchor="start">Nến sau KHÔNG lấp lại</text>
<text x="130" y="486" font-size="12" font-weight="400" fill="#4ade80" text-anchor="start">(acceptance)</text>
<text x="130" y="510" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">CLV cao, thân lớn, bấc ngắn</text>
<text x="130" y="528" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Phá swing + acceptance + FVG sạch</text>
<text x="720" y="72" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle">Nến to nhưng yếu</text>
<line x1="630" y1="460" x2="630" y2="385" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="622.0" y="400" width="16" height="38" fill="#22c55e"/>
<line x1="590" y1="438" x2="850" y2="438" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="590" y="430" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">swing high cũ</text>
<line x1="660" y1="405" x2="660" y2="445" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="653.0" y="400" width="14" height="35" fill="#ef4444"/>
<text x="720" y="470" font-size="12" font-weight="400" fill="#f87171" text-anchor="middle">Phá rồi bị LẤP ngay</text>
<text x="720" y="486" font-size="12" font-weight="400" fill="#f87171" text-anchor="middle">(failure to accept)</text>
<text x="720" y="510" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">CLV ~0.5, bấc 2 đầu dài</text>
<text x="720" y="528" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Không để lại FVG sạch</text>
<text x="480" y="560" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Chart minh họa khái niệm — không phải dữ liệu giao dịch thật.</text>
</svg>
