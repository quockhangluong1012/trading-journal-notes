<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="520" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">Fib kéo trên Wick vs Body — hai vùng OTE lệch nhau</text>

<!-- Left: wick-based -->
<rect x="30" y="60" width="440" height="420" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
<text x="250" y="88" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Kéo theo WICK (đuôi nến)</text>

<line x1="230" y1="430" x2="230" y2="400" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="223.5" y="410" width="13" height="15" fill="#ef4444"/>
<text x="230" y="448" font-size="11" fill="#94a3b8" text-anchor="middle">Low = đáy wick</text>

<line x1="254" y1="410" x2="254" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="247.5" y="150" width="13" height="240" fill="#22c55e"/>
<text x="254" y="118" font-size="11" fill="#94a3b8" text-anchor="middle">High = đỉnh wick</text>

<line x1="60" y1="150" x2="450" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="60" y="146" font-size="10" fill="#94a3b8" text-anchor="start">1.0</text>
<rect x="60" y="245" width="390" height="65" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="65" y="240" font-size="11" fill="#38bdf8" text-anchor="start">OTE (wick-based) 0.62–0.79</text>
<line x1="60" y1="410" x2="450" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="60" y="406" font-size="10" fill="#94a3b8" text-anchor="start">0.0</text>

<text x="60" y="465" font-size="11" fill="#94a3b8" text-anchor="start">Vùng OTE rộng hơn, sâu hơn — dễ khớp entry hơn nhưng đôi khi "quá xa"</text>

<!-- Right: body-based -->
<rect x="490" y="60" width="440" height="420" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
<text x="710" y="88" font-size="14" font-weight="700" fill="#ec4899" text-anchor="middle">Kéo theo BODY (thân nến close)</text>

<line x1="690" y1="430" x2="690" y2="400" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="683.5" y="410" width="13" height="15" fill="#ef4444"/>
<text x="690" y="448" font-size="11" fill="#94a3b8" text-anchor="middle">Low = đáy body (open/close)</text>

<line x1="714" y1="410" x2="714" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="707.5" y="165" width="13" height="210" fill="#22c55e"/>
<text x="714" y="153" font-size="11" fill="#94a3b8" text-anchor="middle">High = đỉnh body</text>

<line x1="520" y1="165" x2="910" y2="165" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="520" y="161" font-size="10" fill="#94a3b8" text-anchor="start">1.0</text>
<rect x="520" y="250" width="390" height="60" fill="rgba(236,72,153,0.15)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="525" y="245" font-size="11" fill="#ec4899" text-anchor="start">OTE (body-based) 0.62–0.79</text>
<line x1="520" y1="375" x2="910" y2="375" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="520" y="371" font-size="10" fill="#94a3b8" text-anchor="start">0.0</text>

<text x="520" y="455" font-size="11" fill="#94a3b8" text-anchor="start">Vùng OTE hẹp hơn, nông hơn — entry "sát" hơn</text>
<text x="520" y="470" font-size="11" fill="#94a3b8" text-anchor="start">nhưng dễ bị hụt nếu giá chạm wick</text>

<text x="480" y="500" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">Không có chuẩn thống nhất → hai trader vẽ đúng "quy trình" vẫn ra 2 entry khác nhau</text>
</svg>
