<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case Study — Loss: Mắc bẫy Inducement, vào Sell sớm (-1R)</text>

<line x1="48" y1="240" x2="910" y2="240" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="230" font-size="12" fill="#eab308">BSL nhìn thấy trên chart</text>

<rect x="90" y="330" width="12" height="50" fill="#22c55e"/><line x1="96" y1="320" x2="96" y2="395" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="300" width="12" height="55" fill="#22c55e"/><line x1="126" y1="288" x2="126" y2="360" stroke="#9ca3af" stroke-width="1.5"/>
<!-- weak drop mistaken for MSS -->
<rect x="150" y="290" width="12" height="25" fill="#ef4444"/><line x1="156" y1="285" x2="156" y2="322" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="156" cy="305" r="18" fill="none" stroke="#4ade80" stroke-width="2"/>
<text x="156" y="270" font-size="10" fill="#4ade80" text-anchor="middle">Nến đỏ nhỏ,</text>
<text x="156" y="258" font-size="10" fill="#4ade80" text-anchor="middle">chưa MSS thật</text>

<circle cx="165" cy="300" r="6" fill="#4ade80"/>
<text x="185" y="320" font-size="11" fill="#4ade80">Entry Sell 10:12 — vội vào theo cảm giác</text>

<!-- continues up, SL hit -->
<rect x="180" y="255" width="12" height="55" fill="#22c55e"/><line x1="186" y1="215" x2="186" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="210" y="200" width="12" height="60" fill="#22c55e"/><line x1="216" y1="160" x2="216" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="240" y="145" width="12" height="65" fill="#22c55e"/><line x1="246" y1="105" x2="246" y2="165" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="150" y1="200" x2="910" y2="200" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="700" y="195" font-size="12" fill="#4ade80">SL bị quét 10:30</text>

<!-- real SMH further -->
<rect x="270" y="90" width="12" height="60" fill="#22c55e"/><line x1="276" y1="80" x2="276" y2="158" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="282" cy="95" r="18" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="282" y="70" font-size="11" fill="#f87171" text-anchor="middle">SMH thật, 30 phút sau</text>
<polyline points="288,103 350,140 420,170 500,200" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7"/>

<rect x="560" y="330" width="330" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="576" y="352" font-size="12" fill="#e5e7eb">Lỗi: coi nến đỏ nhỏ đầu tiên là MSS</text>
<text x="576" y="372" font-size="12" fill="#e5e7eb">Đúng ra: chờ đóng nến vượt swing low</text>
<text x="576" y="392" font-size="12" fill="#e5e7eb">rõ ràng trước khi vào lệnh</text>
<text x="576" y="415" font-size="12" fill="#f87171">Kết quả: Loss -1R, SMH thật đến sau</text>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa</text>
</svg>
