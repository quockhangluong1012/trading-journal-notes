<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Tỷ lệ dương tính giả — nhận diện S&amp;D week trước thứ Sáu</text>
<rect x="60" y="90" width="380" height="220" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250" y="120" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="middle">Nhận diện Thứ Năm (dự đoán)</text>
<text x="250" y="150" font-size="30" font-weight="700" fill="#e5e7eb" text-anchor="middle">"Tuần này là S&amp;D"</text>
<text x="250" y="185" font-size="12" fill="#94a3b8" text-anchor="middle">Đủ 3 dấu hiệu: tin lớn thứ Sáu +</text>
<text x="250" y="205" font-size="12" fill="#94a3b8" text-anchor="middle">Mon-Thu chop + weekly bias rõ</text>
<text x="250" y="270" font-size="12" fill="#f87171" text-anchor="middle">→ nhưng đây là dự đoán, chưa</text>
<text x="250" y="290" font-size="12" fill="#f87171" text-anchor="middle">phải xác nhận thực tế thứ Sáu</text>
<path d="M 460 200 L 520 200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrFP)"/>
<defs><marker id="arrFP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs>
<rect x="540" y="60" width="360" height="110" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
<text x="720" y="88" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">Thực tế A: sweep đúng cả 2 phía</text>
<text x="720" y="112" font-size="12" fill="#94a3b8" text-anchor="middle">MSS/CISD rõ, distribution đúng bias</text>
<text x="720" y="134" font-size="12" fill="#4ade80" text-anchor="middle">→ true positive: trade theo mô hình</text>
<text x="720" y="152" font-size="11" fill="#94a3b8" text-anchor="middle">(tỷ lệ thấp hơn kỳ vọng ban đầu)</text>
<rect x="540" y="190" width="360" height="110" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="720" y="218" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">Thực tế B: chỉ sweep 1 phía / trend thẳng</text>
<text x="720" y="242" font-size="12" fill="#94a3b8" text-anchor="middle">Không có sweep đối lập, hoặc giá</text>
<text x="720" y="260" font-size="12" fill="#94a3b8" text-anchor="middle">chạy thẳng không hồi sau tin</text>
<text x="720" y="282" font-size="12" fill="#f87171" text-anchor="middle">→ false positive: không có S&amp;D thật</text>
<rect x="540" y="320" width="360" height="90" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
<text x="720" y="348" font-size="13" font-weight="700" fill="#eab308" text-anchor="middle">Thực tế C: OPEX/lịch trùng khác</text>
<text x="720" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">Regime khác chen vào (xem edge case)</text>
<text x="720" y="392" font-size="12" fill="#eab308" text-anchor="middle">→ cần tái phân loại, không ép khung S&amp;D</text>
<rect x="60" y="440" width="836" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="80" y="466" font-size="12" fill="#e5e7eb" text-anchor="start">Nhận diện trước thứ Sáu (3 dấu hiệu ở mục Cấu trúc nhận diện) chỉ là một GIẢ THUYẾT có xác suất cao hơn</text>
<text x="80" y="488" font-size="12" fill="#e5e7eb" text-anchor="start">ngẫu nhiên — không phải xác nhận. Chỉ khi cả sweep 2 phía + MSS/CISD thật diễn ra vào chính thứ Sáu</text>
<text x="80" y="510" font-size="12" fill="#e5e7eb" text-anchor="start">mới coi là "S&amp;D week xác nhận" — trước đó luôn giữ thái độ giả thuyết, không chốt kết luận sớm.</text>
<text x="80" y="532" font-size="12" fill="#94a3b8" text-anchor="start">Đây là lý do phần lớn giá trị mô hình nằm ở việc ĐỨNG NGOÀI cho tới khi có xác nhận thật.</text>
</svg>
