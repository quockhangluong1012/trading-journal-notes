<text x="892.0" y="137.3" font-size="12.3" font-weight="700" fill="#e6edf3" text-anchor="start">[OBSERVABLE]</text>
<text x="892.0" y="156.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  close trên swing high — có thật.</text>
<text x="892.0" y="175.3" font-size="12.3" font-weight="700" fill="#bc8cff" text-anchor="start">[ICT FRAMEWORK]</text>
<text x="892.0" y="194.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  MSS; nhiều tài liệu gắn MSS với</text>
<text x="892.0" y="213.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  sweep trước đó.</text>
<text x="892.0" y="232.3" font-size="12.3" font-weight="700" fill="#e3b341" text-anchor="start">[HYPOTHESIS] HYP-03</text>
<text x="892.0" y="251.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  MSS có sweep cho expectancy</text>
<text x="892.0" y="270.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  khác MSS không sweep.</text>
<text x="892.0" y="289.3" font-size="12.3" font-weight="700" fill="#f85149" text-anchor="start">[BACKTEST REQUIRED]</text>
<text x="892.0" y="308.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  chưa có dữ liệu của bạn.</text>
