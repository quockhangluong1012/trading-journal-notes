<text x="892.0" y="452.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Không vào: thiếu EVENT bắt buộc.</text>
<text x="892.0" y="471.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Ghi vào log 'setup bị loại' với</text>
<text x="892.0" y="490.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  missing_step: sweep.</text>
<text x="892.0" y="509.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Đánh dấu pool còn nguyên như</text>
<text x="892.0" y="528.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">  mục tiêu tiềm năng của giá.</text>
<text x="892.0" y="547.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">• Muốn trade loại này: tạo biến</text>
