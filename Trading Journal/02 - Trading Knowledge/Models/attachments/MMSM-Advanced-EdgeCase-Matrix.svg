<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ma trận Edge Case MMSM — Nhận diện nhanh</text>

<line x1="32" y1="60" x2="928" y2="60" stroke="#334155"/>
<line x1="32" y1="540" x2="928" y2="540" stroke="#334155"/>
<line x1="32" y1="60" x2="32" y2="540" stroke="#334155"/>
<line x1="928" y1="60" x2="928" y2="540" stroke="#334155"/>
<line x1="260" y1="60" x2="260" y2="540" stroke="#334155"/>
<line x1="620" y1="60" x2="620" y2="540" stroke="#334155"/>

<text x="146" y="80" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Edge case</text>
<text x="440" y="80" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Dấu hiệu nhận diện</text>
<text x="774" y="80" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Hành động đúng</text>
<line x1="32" y1="90" x2="928" y2="90" stroke="#334155"/>

<g font-size="11" fill="#e5e7eb">
<text x="44" y="115">① Inducement / sweep giả</text>
<text x="272" y="115">Rơi yếu, không MSS</text>
<text x="632" y="115">Chờ MSS thật, không vào ngay</text>
<line x1="32" y1="128" x2="928" y2="128" stroke="#1f2937"/>

<text x="44" y="150">② Nested trong MMBM D1</text>
<text x="272" y="150">HTF vẫn tăng mạnh</text>
<text x="632" y="150">Giảm size, target gần hơn</text>
<line x1="32" y1="163" x2="928" y2="163" stroke="#1f2937"/>

<text x="44" y="185">③ Compound SMH (2+ đỉnh)</text>
<text x="272" y="185">Đỉnh sau cao hơn đỉnh trước</text>
<text x="632" y="185">Lấy đỉnh sau cùng làm mốc SL</text>
<line x1="32" y1="198" x2="928" y2="198" stroke="#1f2937"/>

<text x="44" y="220">④ BSL quét giữa range</text>
<text x="272" y="220">Không phải đỉnh rõ ràng</text>
<text x="632" y="220">Xác nhận bằng MSS trước</text>
<line x1="32" y1="233" x2="928" y2="233" stroke="#1f2937"/>

<text x="44" y="255">⑤ XAU SMH nhanh quanh tin</text>
<text x="272" y="255">Giật mạnh trong 1-2 nến</text>
<text x="632" y="255">Đứng ngoài đến khi ổn định</text>
<line x1="32" y1="268" x2="928" y2="268" stroke="#1f2937"/>

<text x="44" y="290">⑥ Chase sell program muộn</text>
<text x="272" y="290">Giá đã rời FVG xa</text>
<text x="632" y="290">Bỏ qua, chờ setup mới</text>
<line x1="32" y1="303" x2="928" y2="303" stroke="#1f2937"/>

<text x="44" y="325" fill="#fbbf24">⑦ Curve bất đối xứng</text>
<text x="272" y="325" fill="#fbbf24">Leg lên chậm hơn leg xuống</text>
<text x="632" y="325" fill="#fbbf24">Không ép TP theo thời gian gương</text>
<line x1="32" y1="338" x2="928" y2="338" stroke="#1f2937"/>

<text x="44" y="360" fill="#fbbf24">⑧ Reversal sớm ở SMR</text>
<text x="272" y="360" fill="#fbbf24">Chưa đủ leg đã đảo</text>
<text x="632" y="360" fill="#fbbf24">Kiểm tra MSS + FVG trước khi vào</text>
<line x1="32" y1="373" x2="928" y2="373" stroke="#1f2937"/>

<text x="44" y="395" fill="#fbbf24">⑨ Nested M15 trong H4</text>
<text x="272" y="395" fill="#fbbf24">SMH nhỏ chỉ là điều chỉnh</text>
<text x="632" y="395" fill="#fbbf24">Đối chiếu cấu trúc H4 trước khi giữ lệnh</text>
<line x1="32" y1="408" x2="928" y2="408" stroke="#1f2937"/>

<text x="44" y="430" fill="#fbbf24">⑩ Double purge BSL</text>
<text x="272" y="430" fill="#fbbf24">Quét 2 lần liên tiếp</text>
<text x="632" y="430" fill="#fbbf24">Ưu tiên lần quét có MSS xác nhận</text>
<line x1="32" y1="443" x2="928" y2="443" stroke="#1f2937"/>

<text x="44" y="465" fill="#fbbf24">⑪ FVG chỉ chạm biên rồi chạy</text>
<text x="272" y="465" fill="#fbbf24">Không hồi về 50%</text>
<text x="632" y="465" fill="#fbbf24">Chấp nhận bỏ lệnh, không đuổi giá</text>
<line x1="32" y1="478" x2="928" y2="478" stroke="#1f2937"/>

<text x="44" y="500" fill="#fbbf24">⑫ Spread giãn London/NY rollover</text>
<text x="272" y="500" fill="#fbbf24">SL bị quét do spread</text>
<text x="632" y="500" fill="#fbbf24">Né giờ rollover, nới buffer SL</text>
</g>

<text x="480" y="565" font-size="11" fill="#94a3b8" text-anchor="middle">Vàng = edge case mở rộng mới · Trắng = edge case gốc</text>
</svg>
