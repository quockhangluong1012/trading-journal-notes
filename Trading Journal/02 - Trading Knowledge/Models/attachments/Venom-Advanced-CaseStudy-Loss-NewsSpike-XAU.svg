<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case 2 — XAUUSD Loss (news spike nhầm Venom strike)</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Case tái dựng minh họa, số liệu hypothetical — không phải lệnh thật</text>

  <line x1="60" y1="240" x2="920" y2="240" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="232" font-size="12" fill="#eab308">Asia Low (pool tham chiếu)</text>

  <line x1="300" y1="240" x2="300" y2="120" stroke="#f97316" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="300" y="108" font-size="12" fill="#f97316" text-anchor="middle">08:30 CPI release</text>

  <g>
    <line x1="260" y1="200" x2="260" y2="245" stroke="#9ca3af" stroke-width="1.5"/><rect x="254" y="205" width="12" height="35" fill="#ef4444"/>
  </g>

  <!-- spike candle: huge wick punching through pool, closes OUTSIDE (below) the pool line, no reclaim -->
  <line x1="300" y1="150" x2="300" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="292" y="270" width="16" height="45" fill="#ef4444"/>
  <text x="300" y="345" font-size="11.5" fill="#f87171" text-anchor="middle">Đóng NGOÀI pool</text>
  <text x="300" y="360" font-size="11" fill="#f87171" text-anchor="middle">(no reclaim)</text>

  <g stroke="#f87171" stroke-width="3">
    <line x1="355" y1="200" x2="375" y2="220"/>
    <line x1="375" y1="200" x2="355" y2="220"/>
  </g>
  <text x="365" y="185" font-size="11.5" fill="#f87171" text-anchor="middle">Trader nhầm = sweep</text>

  <!-- reversal after news -->
  <g>
    <line x1="420" y1="260" x2="420" y2="330" stroke="#9ca3af" stroke-width="1.5"/><rect x="412" y="270" width="16" height="50" fill="#22c55e"/>
    <line x1="470" y1="220" x2="470" y2="290" stroke="#9ca3af" stroke-width="1.5"/><rect x="462" y="228" width="16" height="52" fill="#22c55e"/>
    <line x1="520" y1="180" x2="520" y2="250" stroke="#9ca3af" stroke-width="1.5"/><rect x="512" y="188" width="16" height="52" fill="#22c55e"/>
  </g>
  <path d="M 430 300 Q 480 260 520 200" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrRev)"/>
  <text x="650" y="180" font-size="12" fill="#f87171">Giá đảo chiều mạnh → quét stop long</text>

  <defs><marker id="arrRev" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f87171"/></marker></defs>
</svg>
