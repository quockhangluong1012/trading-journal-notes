<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="18" font-weight="700" fill="#e5e7eb">Case Study — Win: Curve bất đối xứng, sell nhanh hơn dự kiến (+2.4R)</text>

<text x="60" y="65" font-size="12" fill="#94a3b8">Buy program: 4 bậc LRB, kéo dài ~6 giờ</text>
<line x1="48" y1="220" x2="500" y2="220" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<polyline points="60,380 130,380 130,320 200,320 200,260 270,260 270,200 340,200 340,140 400,140" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<text x="90" y="400" font-size="11" fill="#94a3b8">08:00</text>
<text x="360" y="130" font-size="11" fill="#94a3b8">14:00</text>

<circle cx="400" cy="140" r="16" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="400" y="120" font-size="11" fill="#f87171" text-anchor="middle">SMH 14:05</text>

<!-- fast sell program -->
<line x1="48" y1="460" x2="900" y2="460" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="480" font-size="12" fill="#eab308">SSL target</text>
<rect x="420" y="180" width="18" height="150" fill="#ef4444"/><line x1="429" y1="170" x2="429" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="450" y="290" width="18" height="140" fill="#ef4444"/><line x1="459" y1="280" x2="459" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="480" y="400" width="18" height="70" fill="#ef4444"/><line x1="489" y1="392" x2="489" y2="480" stroke="#9ca3af" stroke-width="1.5"/>
<text x="600" y="410" font-size="12" fill="#f87171">Sell program: chỉ ~70 phút, 3 nến displacement</text>
<text x="600" y="428" font-size="12" fill="#f87171">đã chạm gần SSL — KHÔNG có bậc LRS rõ ràng</text>
<circle cx="489" cy="435" r="6" fill="#f87171"/>
<polyline points="498,470 560,478 650,485 750,490" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

<rect x="60" y="80" width="500" height="30" rx="6" fill="none"/>
<rect x="60" y="500" width="500" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="76" y="522" font-size="12" fill="#e5e7eb">Không đặt time-stop theo "đối xứng"; quản lý theo cấu</text>
<text x="76" y="542" font-size="12" fill="#4ade80">trúc giá (đã gần SSL chưa). Kết quả: Win +2.4R</text>

<text x="480" y="580" font-size="12" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa</text>
</svg>
