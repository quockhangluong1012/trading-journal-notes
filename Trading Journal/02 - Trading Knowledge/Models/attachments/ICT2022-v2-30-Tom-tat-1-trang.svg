<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m58a6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="mbc8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker></defs><rect width="1200" height="820" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">ICT 2022 Model — Tóm tắt một trang (phiên bản Core D1-H1-M5 v0.2)</text>
<rect x="40.0" y="70.0" width="360.0" height="410.0" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="220.0" y="100.0" font-size="17" font-weight="800" fill="#58a6ff" text-anchor="middle">D1 · BỐI CẢNH</text>
<text x="58.0" y="134.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">Hỏi: tôi ở đâu, ưu tiên hướng nào?</text>
<text x="58.0" y="160.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="58.0" y="186.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Structure bằng ITH/LTH</text>
<text x="58.0" y="212.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Range operative + EQ</text>
<text x="58.0" y="238.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Pool 2 phía → primary/secondary DOL</text>
<text x="58.0" y="264.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Bias: Bull / Bear / Neutral / Conflict</text>
<text x="58.0" y="290.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ HTF POI + invalidation (viết ra)</text>
<text x="58.0" y="316.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="58.0" y="342.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">GATE G1: tất cả Required,</text>
<text x="58.0" y="368.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">không Disqualifying → H1</text>
<text x="58.0" y="394.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="58.0" y="420.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">Neutral = kết quả hợp lệ</text>
<line x1="402.0" y1="300.0" x2="418.0" y2="300.0" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#m58a6ff)"/>
<rect x="420.0" y="70.0" width="360.0" height="410.0" rx="14" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<text x="600.0" y="100.0" font-size="17" font-weight="800" fill="#bc8cff" text-anchor="middle">H1 · SETUP</text>
<text x="438.0" y="134.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">Hỏi: cơ hội có đang hình thành?</text>
<text x="438.0" y="160.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="438.0" y="186.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ H1 đang hồi về D1 POI?</text>
<text x="438.0" y="212.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ H1 POI refine (chưa accept)</text>
<text x="438.0" y="238.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Inducement / SSL H1</text>
<text x="438.0" y="264.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ T1 = H1 ERL, còn chỗ đi</text>
<text x="438.0" y="290.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ State: NOT READY / MONITORING</text>
<text x="438.0" y="316.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">   / EXECUTION ELIGIBLE</text>
<text x="438.0" y="342.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="438.0" y="368.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">GATE G2: neo HTF + vị trí +</text>
<text x="438.0" y="394.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">thời gian + pre-mark + R_proxy ≥ 1.5</text>
<text x="438.0" y="420.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<line x1="782.0" y1="300.0" x2="798.0" y2="300.0" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#mbc8cff)"/>
<rect x="800.0" y="70.0" width="360.0" height="410.0" rx="14" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
<text x="980.0" y="100.0" font-size="17" font-weight="800" fill="#39c5cf" text-anchor="middle">M5 · THỰC THI</text>
<text x="818.0" y="134.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">Hỏi: đủ bằng chứng chưa?</text>
<text x="818.0" y="160.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="818.0" y="186.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Sweep pool đánh dấu, reclaim ≤3</text>
<text x="818.0" y="212.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ MSS: close vượt ITH ≤12 nến</text>
<text x="818.0" y="238.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Displacement ≥3/4 + FVG</text>
<text x="818.0" y="264.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ Entry theo rule (E1/E2/E3)</text>
<text x="818.0" y="290.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ SL = cực trị sweep ± buffer</text>
<text x="818.0" y="316.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">□ R(T1) ≥ 2 · conf ≥ 2 · risk ≤ 0.5%</text>
<text x="818.0" y="342.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="818.0" y="368.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">Order TTL: 12 nến / hết KZ /</text>
<text x="818.0" y="394.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">+1R chưa khớp → hủy</text>
<text x="818.0" y="420.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<rect x="40.0" y="500.0" width="560.0" height="300.0" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.6"/>
<text x="52.0" y="522.0" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">NO TRADE khi (bất kỳ)</text>
<text x="52.0" y="542.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• D1 Neutral / Conflicting / thiếu DOL / thiếu invalidation</text>
<text x="52.0" y="568.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Giá chưa ở POI (H1) hoặc POI đã bị accept xuyên</text>
<text x="52.0" y="594.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Ngoài killzone · tin đỏ ±15 phút</text>
<text x="52.0" y="620.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Không có sweep (Core) · sweep thành run</text>
<text x="52.0" y="646.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• MSS phá STH thay vì ITH · không close · không displacement</text>
<text x="52.0" y="672.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Chỉ vào được bằng chase · R(T1) &lt; 2 khi SL đúng chỗ</text>
<text x="52.0" y="698.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Đã chạm giới hạn rủi ro ngày / số lệnh / 2 lần fail cùng zone</text>
<text x="52.0" y="724.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Context Note viết SAU khi đã nhìn H1/M5</text>
<rect x="620.0" y="500.0" width="540.0" height="300.0" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="632.0" y="522.0" font-size="14" font-weight="700" fill="#3fb950" text-anchor="start">Sau mỗi phiên</text>
<text x="632.0" y="542.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Log MỌI ngày (kể cả ngày dừng ở D1)</text>
<text x="632.0" y="569.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Lệnh: step1…7_ok, first_error_step, missing_step</text>
<text x="632.0" y="596.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Setup bị loại: dừng ở bước nào, vì sao</text>
<text x="632.0" y="623.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Missed/expired: missed_by, would_have_result</text>
<text x="632.0" y="650.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Không đổi definition giữa chừng → đổi = version mới</text>
<text x="632.0" y="677.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• ≥ 30–50 mẫu/biến thể mới đọc thống kê</text>
<text x="632.0" y="704.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="632.0" y="731.3" font-size="12.6" font-weight="800" fill="#e3b341" text-anchor="start">'Thắng/thua là nhiễu; quy trình là tín hiệu.'</text></svg>