<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="560" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Biến thể Nested — MSS 1m phải đồng hướng DOL 15m/H1</text>
<!-- HTF context box top -->
<rect x="60" y="70" width="840" height="120" rx="10" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1.5"/>
<text x="80" y="96" font-size="13" font-weight="700" fill="#22c55e" text-anchor="start">15m/H1: bias BULLISH — DOL = BSL phía trên (chưa chạm)</text>
<polyline points="90,160 160,140 230,150 300,120 370,130 440,100 520,110 600,80" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<line x1="600" y1="80" x2="860" y2="80" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="865" y="84" font-size="11" fill="#eab308" text-anchor="start">BSL (DOL 15m)</text>
<!-- 1m zoom box: false MSS down inside the uptrend (raid SSL) -->
<rect x="60" y="230" width="400" height="260" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="260" y="256" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">1m: MSS xuống — NHƯNG ngược DOL 15m</text>
<polyline points="90,320 130,300 170,340 210,280 250,360" fill="none" stroke="#ef4444" stroke-width="2.5"/>
<line x1="170" y1="340" x2="170" y2="400" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="180" y="400" font-size="10.5" fill="#a855f7" text-anchor="start">"MSS" 1m (bẫy nested)</text>
<path d="M250,360 L290,320" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrN)"/>
<text x="90" y="420" font-size="11.5" fill="#f87171" text-anchor="start">Đây chỉ là raid SSL —</text>
<text x="90" y="438" font-size="11.5" fill="#f87171" text-anchor="start">nhịp hồi bên trong dòng tăng lớn hơn</text>
<text x="90" y="465" font-size="11.5" fill="#e5e7eb" text-anchor="start">Trader short ở đây = counter-trend, dễ bị "nuốt"</text>
<!-- 1m zoom box correct: MSS up aligned -->
<rect x="500" y="230" width="400" height="260" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
<text x="700" y="256" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">1m: MSS lên — ĐỒNG HƯỚNG DOL 15m</text>
<polyline points="530,400 570,380 610,420 650,360 690,300" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<line x1="610" y1="420" x2="610" y2="360" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="620" y="440" font-size="10.5" fill="#a855f7" text-anchor="start">MSS 1m hợp lệ</text>
<path d="M690,300 L740,260" stroke="#4ade80" stroke-width="2.5" fill="none" marker-end="url(#arrN2)"/>
<text x="530" y="460" font-size="11.5" fill="#4ade80" text-anchor="start">BUY tại PD array — target DOL 15m (BSL)</text>
<defs>
<marker id="arrN" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
<marker id="arrN2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker>
</defs>
<text x="480" y="525" font-size="12" fill="#94a3b8" text-anchor="middle">Quy trình: 15m/H1 xác định bias+DOL trước → raid ngược DOL (nạp nhiên liệu) → MSS 1m ĐÚNG hướng DOL mới vào lệnh.</text>
</svg>
