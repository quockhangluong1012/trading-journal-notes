<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ví dụ sai — Vào ngoài cửa sổ, chưa quét session pool</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Chart minh họa khái niệm, không phải dữ liệu giao dịch thật</text>

  <g stroke="#1f2937" stroke-width="1">
    <line x1="60" y1="140" x2="920" y2="140"/>
    <line x1="60" y1="220" x2="920" y2="220"/>
    <line x1="60" y1="300" x2="920" y2="300"/>
    <line x1="60" y1="380" x2="920" y2="380"/>
    <line x1="60" y1="460" x2="920" y2="460"/>
  </g>

  <!-- "dead session" fading zone shading -->
  <rect x="60" y="120" width="860" height="360" fill="rgba(148,163,184,0.06)"/>
  <text x="490" y="500" font-size="12" fill="#94a3b8" text-anchor="middle">"Giữa phiên chết" — ngoài cửa sổ Venom (không tô đậm Venom Box/Cutting Zone)</text>

  <!-- choppy sideways candles, no clear pool marked -->
  <g>
    <line x1="120" y1="260" x2="120" y2="320" stroke="#9ca3af" stroke-width="1.5"/><rect x="114" y="270" width="12" height="30" fill="#ef4444"/>
    <line x1="170" y1="240" x2="170" y2="300" stroke="#9ca3af" stroke-width="1.5"/><rect x="164" y="250" width="12" height="30" fill="#22c55e"/>
    <line x1="220" y1="260" x2="220" y2="330" stroke="#9ca3af" stroke-width="1.5"/><rect x="214" y="270" width="12" height="35" fill="#ef4444"/>
    <line x1="270" y1="230" x2="270" y2="290" stroke="#9ca3af" stroke-width="1.5"/><rect x="264" y="240" width="12" height="30" fill="#22c55e"/>
  </g>

  <!-- a "nice-looking" FVG but with no prior sweep -->
  <rect x="330" y="230" width="80" height="40" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
  <text x="370" y="215" font-size="12" fill="#3b82f6" text-anchor="middle">FVG "đẹp"</text>
  <g>
    <line x1="330" y1="200" x2="330" y2="260" stroke="#9ca3af" stroke-width="1.5"/><rect x="322" y="205" width="16" height="55" fill="#22c55e"/>
    <line x1="380" y1="170" x2="380" y2="235" stroke="#9ca3af" stroke-width="1.5"/><rect x="372" y="178" width="16" height="55" fill="#22c55e"/>
  </g>

  <!-- X mark showing entry without sweep -->
  <g stroke="#f87171" stroke-width="3">
    <line x1="440" y1="290" x2="465" y2="315"/>
    <line x1="465" y1="290" x2="440" y2="315"/>
  </g>
  <text x="453" y="335" font-size="12" fill="#f87171" text-anchor="middle">Entry sai:</text>
  <text x="453" y="350" font-size="11" fill="#f87171" text-anchor="middle">chưa quét session pool</text>

  <!-- price whipsaws after entry, no real move -->
  <g>
    <line x1="500" y1="255" x2="500" y2="310" stroke="#9ca3af" stroke-width="1.5"/><rect x="494" y="260" width="12" height="30" fill="#ef4444"/>
    <line x1="550" y1="270" x2="550" y2="325" stroke="#9ca3af" stroke-width="1.5"/><rect x="544" y="275" width="12" height="30" fill="#ef4444"/>
    <line x1="600" y1="285" x2="600" y2="345" stroke="#9ca3af" stroke-width="1.5"/><rect x="594" y="290" width="12" height="35" fill="#ef4444"/>
  </g>
  <path d="M 620 350 l 30 20" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrRedW)"/>
  <text x="700" y="380" font-size="12" fill="#f87171">Giá đi loanh quanh rồi quét stop</text>

  <!-- no pool marked anywhere as contrast -->
  <text x="490" y="120" font-size="13" fill="#94a3b8" text-anchor="middle">(Không có pool session nào được đánh dấu / bị quét trước entry)</text>

  <defs>
    <marker id="arrRedW" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f87171"/>
    </marker>
  </defs>
</svg>
