<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Đếm bậc LRB &amp; kiểm tra nested D1/H4 trước khi vào lệnh</text>

<!-- staircase up with numbered legs -->
<polyline points="60,350 130,350 130,290 200,290 200,230 270,230 270,170 340,170 340,110 410,110" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<text x="95" y="330" font-size="12" fill="#94a3b8">LRB 1</text>
<text x="165" y="270" font-size="12" fill="#94a3b8">LRB 2</text>
<text x="235" y="210" font-size="12" fill="#94a3b8">LRB 3</text>
<text x="305" y="150" font-size="12" fill="#94a3b8">LRB 4</text>

<circle cx="410" cy="110" r="18" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="410" y="90" font-size="12" fill="#f87171" text-anchor="middle">Smart Money High</text>

<!-- rule box -->
<rect x="470" y="100" width="440" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="486" y="124" font-size="13" font-weight="700" fill="#e5e7eb">Quy tắc đếm nhanh</text>
<text x="486" y="148" font-size="12" fill="#94a3b8">• 1-2 bậc: điều chỉnh nhỏ, dễ là inducement</text>
<text x="486" y="170" font-size="12" fill="#94a3b8">• 3-4 bậc: buy program đầy đủ, SMH đáng tin hơn</text>
<text x="486" y="192" font-size="12" fill="#94a3b8">• 5+ bậc: kiểm tra lại HTF — có thể đang</text>
<text x="486" y="212" font-size="12" fill="#94a3b8">  trong MMBM lớn, SMH chỉ là tạm dừng</text>

<!-- Nested check flow -->
<rect x="60" y="420" width="200" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="160" y="445" font-size="12" fill="#e5e7eb" text-anchor="middle">Xem D1: xu hướng</text>
<text x="160" y="462" font-size="12" fill="#e5e7eb" text-anchor="middle">chính là gì?</text>

<defs><marker id="arrPurpleMMSM8" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker></defs>
<line x1="260" y1="450" x2="360" y2="450" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrPurpleMMSM8)"/>

<rect x="370" y="420" width="220" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="480" y="445" font-size="12" fill="#e5e7eb" text-anchor="middle">D1 tăng mạnh?</text>
<text x="480" y="462" font-size="12" fill="#e5e7eb" text-anchor="middle">→ H4 MMSM chỉ là hồi kỹ thuật</text>

<line x1="590" y1="450" x2="690" y2="450" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrPurpleMMSM8)"/>

<rect x="700" y="420" width="210" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="805" y="445" font-size="12" fill="#e5e7eb" text-anchor="middle">→ Giảm size, target</text>
<text x="805" y="462" font-size="12" fill="#e5e7eb" text-anchor="middle">gần, không đuổi SSL xa</text>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa quy trình đếm bậc và kiểm tra khung lớn</text>
</svg>
