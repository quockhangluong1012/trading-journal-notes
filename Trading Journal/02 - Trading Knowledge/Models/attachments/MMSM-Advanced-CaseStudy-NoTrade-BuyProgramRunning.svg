<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case Study — No-trade: Buy program vẫn đang chạy, đứng ngoài đúng</text>

<!-- persistent uptrend, no clear reversal -->
<rect x="90" y="480" width="12" height="50" fill="#22c55e"/><line x1="96" y1="470" x2="96" y2="540" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="440" width="12" height="55" fill="#22c55e"/><line x1="126" y1="428" x2="126" y2="505" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="150" y="405" width="12" height="55" fill="#22c55e"/><line x1="156" y1="392" x2="156" y2="470" stroke="#9ca3af" stroke-width="1.5"/>
<!-- weak pullback, no MSS -->
<rect x="180" y="395" width="12" height="20" fill="#ef4444"/><line x1="186" y1="388" x2="186" y2="422" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="210" y="360" width="12" height="45" fill="#22c55e"/><line x1="216" y1="350" x2="216" y2="413" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="240" y="320" width="12" height="50" fill="#22c55e"/><line x1="246" y1="308" x2="246" y2="378" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="270" y="280" width="12" height="55" fill="#22c55e"/><line x1="276" y1="268" x2="276" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="300" y="240" width="12" height="55" fill="#22c55e"/><line x1="306" y1="228" x2="306" y2="305" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="330" y="200" width="12" height="60" fill="#22c55e"/><line x1="336" y1="188" x2="336" y2="270" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="360" y="160" width="12" height="65" fill="#22c55e"/><line x1="366" y1="148" x2="366" y2="235" stroke="#9ca3af" stroke-width="1.5"/>

<!-- "no MSS yet" annotation -->
<rect x="420" y="330" width="330" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="436" y="352" font-size="12" fill="#e5e7eb">Quan sát: chưa có sweep BSL rõ ràng,</text>
<text x="436" y="372" font-size="12" fill="#e5e7eb">chưa MSS, buy program vẫn đang chạy</text>
<text x="436" y="392" font-size="12" fill="#94a3b8">Quyết định: KHÔNG vào lệnh, chờ cấu trúc</text>
<text x="436" y="412" font-size="12" fill="#94a3b8">rõ hơn dù giá có vẻ "đắt"</text>
<text x="436" y="435" font-size="12" fill="#f87171">Kết quả: giá tăng thêm ~2R nữa mới có SMH thật</text>
<text x="436" y="452" font-size="12" fill="#f87171">→ đứng ngoài là quyết định đúng</text>

<!-- eventual real reversal much higher -->
<polyline points="366,235 420,190 480,180" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
<circle cx="480" cy="180" r="14" fill="none" stroke="#f87171" stroke-width="2" opacity="0.7"/>
<text x="480" y="162" font-size="11" fill="#f87171" text-anchor="middle">SMH thật xảy ra sau đó</text>

<text x="480" y="580" font-size="12" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa</text>
</svg>
