<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="900" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">ICT 2022 Model — Kiến trúc D1 → H1 → M5</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Mỗi khung trả lời MỘT câu hỏi; tầng dưới kế thừa tầng trên như tham số, không tự tạo lại bối cảnh</text>
<text x="600.0" y="886.0" font-size="11.5" font-weight="400" fill="#484f58" text-anchor="middle" font-style="italic">Kiến trúc nghiên cứu &amp; quy trình ra quyết định — KHÔNG phải quy luật nhân quả bảo đảm giá đi theo trình tự</text>
<rect x="40.0" y="100.0" width="860.0" height="220.0" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<rect x="40.0" y="100.0" width="120.0" height="220.0" rx="14" fill="#58a6ff" fill-opacity="0.16"/>
<text x="100.0" y="192.0" font-size="44" font-weight="800" fill="#58a6ff" text-anchor="middle">D1</text>
<text x="100.0" y="224.0" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle">BỐI CẢNH</text>
<text x="180.0" y="132.0" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="start">"Tôi đang ở đâu? Ưu tiên hướng nào? Giá đang bị hút về đâu?"</text>
<text x="180.0" y="160.0" font-size="12.5" font-weight="700" fill="#8b949e" text-anchor="start">Quan sát &amp; xác định:</text>
<text x="196.0" y="184.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Major structure · cấp swing</text>
<text x="196.0" y="209.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Dealing range · EQ · P/D</text>
<text x="196.0" y="234.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• IRL / ERL · DOL</text>
<text x="196.0" y="259.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Daily Bias (4 trạng thái)</text>
<text x="196.0" y="284.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• HTF POI · invalidation</text>
<rect x="575.0" y="146.0" width="305.0" height="160.0" rx="10" fill="#1c2330" stroke="#58a6ff" stroke-width="1.6"/>
<text x="587.0" y="168.0" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="start">D1 CONTEXT NOTE</text>
<text x="587.0" y="188.3" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Hướng được phép</text>
<text x="587.0" y="205.6" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Vùng được phép (HTF POI)</text>
<text x="587.0" y="222.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Mục tiêu (DOL) + mức sai</text>
<rect x="40.0" y="370.0" width="860.0" height="220.0" rx="14" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<rect x="40.0" y="370.0" width="120.0" height="220.0" rx="14" fill="#bc8cff" fill-opacity="0.16"/>
<text x="100.0" y="462.0" font-size="44" font-weight="800" fill="#bc8cff" text-anchor="middle">H1</text>
<text x="100.0" y="494.0" font-size="15" font-weight="700" fill="#bc8cff" text-anchor="middle">SETUP</text>
<text x="180.0" y="402.0" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="start">"Cơ hội có đang hình thành bên trong bối cảnh đó không?"</text>
<text x="180.0" y="430.0" font-size="12.5" font-weight="700" fill="#8b949e" text-anchor="start">Quan sát &amp; xác định:</text>
<text x="196.0" y="454.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Cấu trúc trung gian (hồi hay đảo?)</text>
<text x="196.0" y="479.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Liquidity H1 · inducement</text>
<text x="196.0" y="504.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• POI refinement (D1 POI → H1 POI)</text>
<text x="196.0" y="529.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Setup qualification</text>
<text x="196.0" y="554.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Điều kiện chờ · invalidation H1</text>
<rect x="575.0" y="416.0" width="305.0" height="160.0" rx="10" fill="#1c2330" stroke="#bc8cff" stroke-width="1.6"/>
<text x="587.0" y="438.0" font-size="14" font-weight="700" fill="#bc8cff" text-anchor="start">H1 HANDOFF</text>
<text x="587.0" y="458.3" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Zone đã 'armed' + pool sẽ bị sweep</text>
<text x="587.0" y="475.6" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Trạng thái:</text>
<text x="587.0" y="492.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→   NOT READY / MONITORING /</text>
<text x="587.0" y="510.1" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→   EXECUTION ELIGIBLE</text>
<rect x="40.0" y="640.0" width="860.0" height="220.0" rx="14" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
<rect x="40.0" y="640.0" width="120.0" height="220.0" rx="14" fill="#39c5cf" fill-opacity="0.16"/>
<text x="100.0" y="732.0" font-size="44" font-weight="800" fill="#39c5cf" text-anchor="middle">M5</text>
<text x="100.0" y="764.0" font-size="15" font-weight="700" fill="#39c5cf" text-anchor="middle">THỰC THI</text>
<text x="180.0" y="672.0" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="start">"Tại đúng vùng, đúng giờ — đã đủ bằng chứng đo được chưa?"</text>
<text x="180.0" y="700.0" font-size="12.5" font-weight="700" fill="#8b949e" text-anchor="start">Quan sát &amp; xác định:</text>
<text x="196.0" y="724.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Liquidity sweep (pool đánh dấu trước)</text>
<text x="196.0" y="749.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• MSS (phá ITH đánh dấu trước, close)</text>
<text x="196.0" y="774.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• Displacement (0–4 điểm)</text>
<text x="196.0" y="799.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• FVG → Entry (E1/E2/E3)</text>
<text x="196.0" y="824.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">• SL cấu trúc · Target liquidity</text>
<rect x="575.0" y="686.0" width="305.0" height="160.0" rx="10" fill="#1c2330" stroke="#39c5cf" stroke-width="1.6"/>
<text x="587.0" y="708.0" font-size="14" font-weight="700" fill="#39c5cf" text-anchor="start">EXECUTION PLAN</text>
<text x="587.0" y="728.3" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Entry · SL · T1 (R ≥ 2)</text>
<text x="587.0" y="745.5" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Order TTL</text>
<text x="587.0" y="762.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Hoặc: KHÔNG GIAO DỊCH</text>
<polygon points="470.0,322.0 590.0,345.0 470.0,368.0 350.0,345.0" fill="#1c2330" fill-opacity="1" stroke="#e3b341"/>
<text x="470.0" y="342.0" font-size="13" font-weight="800" fill="#e3b341" text-anchor="middle">GATE G1</text>
<text x="470.0" y="358.0" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">PASS ↓</text>
<text x="605.0" y="342.0" font-size="12" font-weight="600" fill="#e3b341" text-anchor="start">D1 đủ rõ để định hướng việc quan sát H1?</text>
<text x="605.0" y="359.0" font-size="12" font-weight="600" fill="#f85149" text-anchor="start">FAIL → ở lại tầng trên: chờ / Neutral / No Trade</text>
<polygon points="470.0,592.0 590.0,615.0 470.0,638.0 350.0,615.0" fill="#1c2330" fill-opacity="1" stroke="#e3b341"/>
<text x="470.0" y="612.0" font-size="13" font-weight="800" fill="#e3b341" text-anchor="middle">GATE G2</text>
<text x="470.0" y="628.0" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">PASS ↓</text>
<text x="605.0" y="612.0" font-size="12" font-weight="600" fill="#e3b341" text-anchor="start">Đủ 3 điều kiện: neo HTF + đúng vị trí + đúng giờ?</text>
<text x="605.0" y="629.0" font-size="12" font-weight="600" fill="#f85149" text-anchor="start">FAIL → ở lại tầng trên: chờ / Neutral / No Trade</text>
<rect x="930.0" y="100.0" width="230.0" height="760.0" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="1045.0" y="130.0" font-size="14" font-weight="800" fill="#e3b341" text-anchor="middle">TRỤC THỜI GIAN</text>
<text x="950.0" y="160.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Ranh giới ngày 17:00 NY</text>
<text x="950.0" y="177.2" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Killzone London 02–05 NY</text>
<text x="950.0" y="194.5" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Killzone NY AM 07–10 NY</text>
<text x="950.0" y="211.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">(index: 08:30–11:00 NY)</text>
<text x="950.0" y="229.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">TTL của từng trạng thái</text>
<text x="950.0" y="246.2" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Tin đỏ ±15 phút → chặn</text>
<line x1="950.0" y1="260.0" x2="1140.0" y2="260.0" stroke="#30363d" stroke-width="1"/>
<text x="1045.0" y="290.0" font-size="14" font-weight="800" fill="#f778ba" text-anchor="middle">QUYỀN CỦA TẦNG DƯỚI</text>
<text x="950.0" y="318.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Tạm dừng (veto) tầng trên</text>
<text x="950.0" y="335.2" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Báo 'cần đánh giá lại'</text>
<text x="950.0" y="352.5" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">✗ KHÔNG tạo ra bias mới</text>
<text x="950.0" y="369.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">✗ KHÔNG đảo bias D1</text>
<text x="950.0" y="387.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="950.0" y="404.2" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Chỉ D1 close xuyên</text>
<text x="950.0" y="421.5" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">protected swing mới</text>
<text x="950.0" y="438.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">đổi cấu trúc D1.</text>
<line x1="950.0" y1="480.0" x2="1140.0" y2="480.0" stroke="#30363d" stroke-width="1"/>
<text x="1045.0" y="510.0" font-size="14" font-weight="800" fill="#f0883e" text-anchor="middle">RESET</text>
<text x="950.0" y="538.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Về tầng sâu nhất</text>
<text x="950.0" y="555.2" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">còn hợp lệ:</text>
<text x="950.0" y="572.5" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">M5 fail → giữ H1</text>
<text x="950.0" y="589.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">H1 POI fail → giữ D1</text>
<text x="950.0" y="607.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">D1 structure fail → S0</text>
<line x1="950.0" y1="660.0" x2="1140.0" y2="660.0" stroke="#30363d" stroke-width="1"/>
<text x="1045.0" y="690.0" font-size="14" font-weight="800" fill="#3fb950" text-anchor="middle">KẾT QUẢ HỢP LỆ</text>
<text x="950.0" y="718.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">• Có lệnh theo plan</text>
<text x="950.0" y="735.2" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">• Chờ tiếp</text>
<text x="950.0" y="752.5" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">• Hủy setup</text>
<text x="950.0" y="769.8" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">• NO TRADE  ← thường gặp nhất</text></svg>