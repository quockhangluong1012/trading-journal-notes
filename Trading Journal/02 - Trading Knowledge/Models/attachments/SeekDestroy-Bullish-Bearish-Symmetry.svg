<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Tính đối xứng: Bullish vs Bearish Seek and Destroy</text>
<line x1="480" y1="70" x2="480" y2="560" stroke="#334155" stroke-width="1.5"/>
<text x="240" y="70" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">(I) Bullish market</text>
<text x="720" y="70" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle">(II) Bearish market</text>
<rect x="60" y="150" width="380" height="90" fill="rgba(59,130,246,0.10)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="250" y="142" font-size="12" fill="#3b82f6" text-anchor="middle">Mon–Thu range (chop / irregular HH+LL)</text>
<line x1="60" y1="160" x2="440" y2="160" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="60" y1="230" x2="440" y2="230" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="520" y="150" width="380" height="90" fill="rgba(59,130,246,0.10)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="710" y="142" font-size="12" fill="#3b82f6" text-anchor="middle">Mon–Thu range (chop / irregular HH+LL)</text>
<line x1="520" y1="160" x2="900" y2="160" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="520" y1="230" x2="900" y2="230" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="66" y="270" font-size="12" fill="#eab308" text-anchor="start">Range High = BSL</text>
<text x="66" y="150" font-size="12" fill="#eab308" text-anchor="start">Range Low = SSL</text>
<path d="M 200 230 L 230 280 L 260 190" fill="none" stroke="#f97316" stroke-width="2.5"/>
<text x="230" y="300" font-size="11" fill="#f97316" text-anchor="middle">Sweep SSL trước (sau tin)</text>
<line x1="250" y1="230" x2="320" y2="120" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="320" y="110" font-size="11" fill="#a855f7" text-anchor="middle">MSS/CISD lên → Long</text>
<path d="M 330 150 L 420 90" fill="none" stroke="#4ade80" stroke-width="3"/>
<text x="400" y="80" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">→ HTF draw phía trên</text>
<text x="250" y="330" font-size="12" fill="#94a3b8" text-anchor="middle">Weekly bias bullish: sweep SSL trước, displace lên</text>
<text x="526" y="270" font-size="12" fill="#eab308" text-anchor="start">Range High = BSL</text>
<text x="526" y="150" font-size="12" fill="#eab308" text-anchor="start">Range Low = SSL</text>
<path d="M 660 160 L 690 110 L 720 200" fill="none" stroke="#f97316" stroke-width="2.5"/>
<text x="690" y="98" font-size="11" fill="#f97316" text-anchor="middle">Sweep BSL trước (sau tin)</text>
<line x1="710" y1="160" x2="780" y2="270" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="780" y="285" font-size="11" fill="#a855f7" text-anchor="middle">MSS/CISD xuống → Short</text>
<path d="M 790 240 L 880 340" fill="none" stroke="#f87171" stroke-width="3"/>
<text x="850" y="360" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">→ HTF draw phía dưới</text>
<text x="710" y="330" font-size="12" fill="#94a3b8" text-anchor="middle">Weekly bias bearish: sweep BSL trước, displace xuống</text>
<rect x="60" y="420" width="836" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="80" y="446" font-size="12" fill="#e5e7eb" text-anchor="start">Cơ chế đối xứng: cùng một chuỗi thao tác (chop Mon–Thu → sweep phía ngược bias trước → MSS/CISD LTF →</text>
<text x="80" y="466" font-size="12" fill="#e5e7eb" text-anchor="start">entry đồng hướng bias → target HTF draw), chỉ đổi hướng theo weekly order flow.</text>
<text x="80" y="488" font-size="12" fill="#94a3b8" text-anchor="start">Không tự suy luận hướng — luôn cần HTF weekly bias RÕ trước khi áp mô hình cho bên nào.</text>
<text x="80" y="510" font-size="12" fill="#94a3b8" text-anchor="start">Không có bias rõ → không có target → không có lý do trade (Bonus Tip trong nguồn gốc).</text>
</svg>
