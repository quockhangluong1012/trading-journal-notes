<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ví dụ sai — Mua sớm khi chưa có Smart Money Low xác nhận</text>

<!-- down leg still in progress -->
<rect x="90" y="120" width="12" height="50" fill="#ef4444"/><line x1="96" y1="110" x2="96" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="150" width="12" height="55" fill="#ef4444"/><line x1="126" y1="140" x2="126" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="150" y="185" width="12" height="60" fill="#ef4444"/><line x1="156" y1="172" x2="156" y2="255" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="180" y="220" width="12" height="55" fill="#ef4444"/><line x1="186" y1="208" x2="186" y2="285" stroke="#9ca3af" stroke-width="1.5"/>
<!-- small green candle mistaken as reversal -->
<rect x="210" y="245" width="12" height="20" fill="#22c55e"/><line x1="216" y1="238" x2="216" y2="272" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="216" cy="255" r="20" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="216" y="300" font-size="11" fill="#f87171" text-anchor="middle">Nến xanh nhỏ</text>
<text x="216" y="314" font-size="11" fill="#f87171" text-anchor="middle">— chưa phải MSS</text>

<!-- entry marker wrong -->
<line x1="0" y1="255" x2="960" y2="255" stroke="#f87171" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
<circle cx="222" cy="250" r="6" fill="#f87171"/>
<text x="240" y="240" font-size="12" fill="#f87171">Entry Buy — chưa có sweep SSL rõ, chưa MSS</text>

<!-- continues falling with more legs -->
<rect x="240" y="270" width="12" height="60" fill="#ef4444"/><line x1="246" y1="258" x2="246" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="270" y="310" width="12" height="65" fill="#ef4444"/><line x1="276" y1="298" x2="276" y2="385" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="300" y="355" width="12" height="70" fill="#ef4444"/><line x1="306" y1="342" x2="306" y2="435" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="330" y="400" width="12" height="75" fill="#ef4444"/><line x1="336" y1="388" x2="336" y2="485" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="360" y="445" width="12" height="70" fill="#ef4444"/><line x1="366" y1="432" x2="366" y2="525" stroke="#9ca3af" stroke-width="1.5"/>

<!-- SL hit -->
<line x1="180" y1="330" x2="960" y2="330" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="700" y="325" font-size="12" fill="#f87171">Stop-loss bị quét</text>

<!-- Real SML further down -->
<circle cx="366" cy="516" r="16" fill="none" stroke="#4ade80" stroke-width="2"/>
<text x="450" y="520" font-size="12" fill="#4ade80">Smart Money Low thật ở xa hơn</text>
<polyline points="372,510 420,480 470,450" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Chart minh họa khái niệm — vào lệnh khi cấu trúc chưa xác nhận, không phải dữ liệu giao dịch thật</text>
</svg>
