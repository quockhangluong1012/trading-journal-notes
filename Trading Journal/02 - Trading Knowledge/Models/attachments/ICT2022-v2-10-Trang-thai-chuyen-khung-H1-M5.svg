<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="mbc8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="mf85149" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker></defs><rect width="1200" height="740" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Khi nào được chuyển từ H1 xuống M5? — ba trạng thái, không đồng nhất 'mở M5' với 'được vào lệnh'</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Mở M5 để QUAN SÁT (đánh dấu pool &amp; swing trước) ≠ được phép THỰC THI</text>
<rect x="40.0" y="100.0" width="360.0" height="400.0" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<rect x="40.0" y="100.0" width="360.0" height="56.0" rx="14" fill="#8b949e" fill-opacity="0.18"/>
<text x="220.0" y="128.0" font-size="15.5" font-weight="800" fill="#8b949e" text-anchor="middle">STATE A — NOT READY</text>
<text x="220.0" y="148.0" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Ở lại H1. Đặt alert.</text>
<text x="56.0" y="186.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Điều kiện (bất kỳ):</text>
<text x="56.0" y="208.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Giá còn xa H1 POI</text>
<text x="56.0" y="230.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Context D1 chưa 'armed'</text>
<text x="56.0" y="252.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Killzone còn &gt; 30' mới mở</text>
<text x="56.0" y="274.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• H1 POI chưa xác định / đã bị</text>
<text x="56.0" y="296.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">  accept xuyên</text>
<line x1="56.0" y1="334.0" x2="384.0" y2="334.0" stroke="#30363d" stroke-width="1"/>
<text x="56.0" y="358.0" font-size="12.5" font-weight="700" fill="#8b949e" text-anchor="start">Được làm / không được làm:</text>
<text x="56.0" y="384.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Cập nhật bản đồ H1</text>
<text x="56.0" y="408.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Đặt alert tại POI</text>
<text x="56.0" y="432.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✗ Không mở M5 tìm MSS</text>
<text x="56.0" y="456.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✗ Không 'đoán' trước sweep</text>
<line x1="402.0" y1="300.0" x2="418.0" y2="300.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m8b949e)"/>
<rect x="420.0" y="100.0" width="360.0" height="400.0" rx="14" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<rect x="420.0" y="100.0" width="360.0" height="56.0" rx="14" fill="#bc8cff" fill-opacity="0.18"/>
<text x="600.0" y="128.0" font-size="15.5" font-weight="800" fill="#bc8cff" text-anchor="middle">STATE B — MONITORING</text>
<text x="600.0" y="148.0" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Mở M5 để chuẩn bị, CHƯA vào lệnh.</text>
<text x="436.0" y="186.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Điều kiện (đủ cả):</text>
<text x="436.0" y="208.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Context D1 còn hiệu lực</text>
<text x="436.0" y="230.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Giá đang tiến vào / vừa chạm</text>
<text x="436.0" y="252.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">  H1 POI</text>
<text x="436.0" y="274.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Killzone mở / mở trong ≤ 30'</text>
<text x="436.0" y="296.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• (chưa đủ: pre-mark, R_proxy, tin)</text>
<line x1="436.0" y1="334.0" x2="764.0" y2="334.0" stroke="#30363d" stroke-width="1"/>
<text x="436.0" y="358.0" font-size="12.5" font-weight="700" fill="#8b949e" text-anchor="start">Được làm / không được làm:</text>
<text x="436.0" y="384.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Đánh dấu pool sẽ bị sweep</text>
<text x="436.0" y="408.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Đánh dấu ITH (mss_reference)</text>
<text x="436.0" y="432.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Tính R_proxy tới T1</text>
<text x="436.0" y="456.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✗ Chưa được đặt lệnh</text>
<line x1="782.0" y1="300.0" x2="798.0" y2="300.0" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#mbc8cff)"/>
<rect x="800.0" y="100.0" width="360.0" height="400.0" rx="14" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
<rect x="800.0" y="100.0" width="360.0" height="56.0" rx="14" fill="#39c5cf" fill-opacity="0.18"/>
<text x="980.0" y="128.0" font-size="15.5" font-weight="800" fill="#39c5cf" text-anchor="middle">STATE C — EXECUTION ELIGIBLE</text>
<text x="980.0" y="148.0" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Được CHỜ trigger M5 theo rule.</text>
<text x="816.0" y="186.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Đủ 3 điều kiện lõi:</text>
<text x="816.0" y="208.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">① Neo HTF: bias + DOL còn hiệu lực</text>
<text x="816.0" y="230.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">② Vị trí: giá trong H1 POI, đúng P/D</text>
<text x="816.0" y="252.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">   (D1 &amp; H1 đồng pha), POI chưa accept</text>
<text x="816.0" y="274.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">③ Thời gian: trong killzone</text>
<text x="816.0" y="296.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">+ pre-mark · R_proxy ≥ 1.5 · không tin đỏ ±15'</text>
<line x1="816.0" y1="334.0" x2="1144.0" y2="334.0" stroke="#30363d" stroke-width="1"/>
<text x="816.0" y="358.0" font-size="12.5" font-weight="700" fill="#8b949e" text-anchor="start">Được làm / không được làm:</text>
<text x="816.0" y="384.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Chờ sweep → MSS → disp → FVG</text>
<text x="816.0" y="408.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✓ Phát hành Execution Plan khi đủ</text>
<text x="816.0" y="432.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✗ Không vào khi trigger thiếu</text>
<text x="816.0" y="456.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">✗ Không nới điều kiện vì 'sắp hết giờ'</text>
<path d="M780.0,505.0 Q600.0,565.0 420.0,505.0" fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#mf85149)" stroke-dasharray="5 4"/>
<text x="600.0" y="585.0" font-size="12.5" font-weight="600" fill="#f85149" text-anchor="middle">Context/POI/giờ không còn đúng → lùi về trạng thái trước (không 'cố' tìm entry)</text>
<rect x="40.0" y="610.0" width="1120.0" height="110.0" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
<text x="52.0" y="632.0" font-size="14" font-weight="700" fill="#e3b341" text-anchor="start">Mapping với state machine ở [[01c]] (để không lặp định nghĩa)</text>
<text x="52.0" y="652.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">NOT READY ≈ S4 H1 Setup Search / S5 Setup Valid (chưa arrival)   ·   MONITORING ≈ S5 → S6 Price At POI (arrival, gate G2 chưa pass)</text>
<text x="52.0" y="675.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">EXECUTION ELIGIBLE ≈ G2 pass → S7 M5 Trigger Search   ·   Execution Plan ≈ S8 M5 Confirmation (lệnh chờ, có TTL)</text>
<text x="52.0" y="698.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">Quy tắc của bạn 'H1→M5 cần đủ 3/3' được giữ nguyên làm 3 điều kiện lõi; 4 kiểm tra vận hành lấy từ gate G2 của 01c.</text></svg>