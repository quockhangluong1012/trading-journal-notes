<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="840" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Thành phần cốt lõi · bộ lọc của phiên bản · confluence chấm điểm · biến thể cộng đồng</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Không âm thầm biến OTE / Killzone / P-D thành 'điều kiện của mọi ICT 2022 Model' — ghi rõ lớp nào thuộc phiên bản nào</text>
<rect x="40.0" y="100.0" width="1120.0" height="560.0" rx="18" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="60.0" y="130.0" font-size="14" font-weight="800" fill="#8b949e" text-anchor="start">LỚP 4 — BIẾN THỂ CỘNG ĐỒNG (spec riêng, thống kê riêng, KHÔNG trộn vào Core)</text>
<text x="60.0" y="158.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Silver Bullet (thuần cửa sổ giờ 10–11 NY) · Unicorn (Breaker ∩ FVG) · Entry aggressive tại MSS close (E4) · MSS-only (không sweep)</text>
<text x="60.0" y="180.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Thực thi M1/M2 như bản gốc ICT dạy · Multi-leg continuation · Countertrend tại HTF POI · Biến thể LTF H1→M5→M1 ([[01b]])</text>
<rect x="90.0" y="200.0" width="1020.0" height="440.0" rx="18" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<text x="110.0" y="230.0" font-size="14" font-weight="800" fill="#bc8cff" text-anchor="start">LỚP 3 — CONFLUENCE CHẤM ĐIỂM (0–8 → hạng → size; chỉ chấm SAU khi GATE pass)</text>
<text x="110.0" y="258.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">POI rank ≥ 3 · CE ∩ OTE 62–79% · SMT tại sweep · CISD · macro time · NWOG/NDOG/HTF PD array · target ∩ −2SD/ERL · inducement đã quét</text>
<rect x="140.0" y="290.0" width="920.0" height="330.0" rx="18" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
<text x="160.0" y="320.0" font-size="14" font-weight="800" fill="#e3b341" text-anchor="start">LỚP 2 — BỘ LỌC BẮT BUỘC CỦA PHIÊN BẢN NÀY (do bạn chọn, không phải luật ICT phổ quát)</text>
<text x="160.0" y="348.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Killzone (London / NY AM) · P/D đồng pha D1↔H1 · risk ≤ 0.5%/lệnh, daily/weekly limit · R(T1) ≥ 2 · không tin đỏ ±15'</text>
<rect x="190.0" y="380.0" width="820.0" height="220.0" rx="18" fill="#1c2330" stroke="#39c5cf" stroke-width="2"/>
<text x="210.0" y="410.0" font-size="14" font-weight="800" fill="#39c5cf" text-anchor="start">LỚP 1 — CORE (theo mô tả phổ biến của ICT 2022 Model)</text>
<text x="210.0" y="438.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">Bối cảnh HTF + DOL → giá tới vùng quan tâm → liquidity sweep → displacement + MSS</text>
<text x="210.0" y="460.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">→ FVG → entry khi retrace → SL ngoài cực trị sweep → target = thanh khoản đối diện</text>
<text x="210.0" y="482.0" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start"></text>
<text x="210.0" y="504.0" font-size="12.6" font-weight="700" fill="#39c5cf" text-anchor="start">Chỉ setup qua đủ lớp 1 + lớp 2 mới được log với setup: ICT 2022 Model (Core).</text>
<text x="210.0" y="526.0" font-size="12.6" font-weight="700" fill="#39c5cf" text-anchor="start">Lớp 3 quyết định HẠNG và SIZE; lớp 4 luôn là file/thống kê riêng.</text>
<rect x="40.0" y="680.0" width="1120.0" height="140.0" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.6"/>
<text x="52.0" y="702.0" font-size="14" font-weight="700" fill="#f0883e" text-anchor="start">Câu hỏi kiểm tra cho MỖI yếu tố (trước khi thêm vào phiên bản)</text>
<text x="52.0" y="722.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">1. Core hay bộ lọc trong phiên bản đang nghiên cứu?   2. Giải quyết vấn đề gì?</text>
<text x="52.0" y="746.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">3. Cung cấp thông tin MỚI hay chỉ diễn đạt lại? (FVG M5 ⊂ FVG H1 = cùng đoạn giá)</text>
<text x="52.0" y="770.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">4. Bỏ nó đi mô hình còn chạy theo definition không?   5. Có dữ liệu cho thấy nó cải thiện expectancy?</text>
<text x="52.0" y="794.3" font-size="12.3" font-weight="400" fill="#e6edf3" text-anchor="start">→ Mỗi yếu tố thêm = 1 bậc tự do → tăng nguy cơ overfit. Thêm bằng ablation test, không bằng cảm giác.</text></svg>