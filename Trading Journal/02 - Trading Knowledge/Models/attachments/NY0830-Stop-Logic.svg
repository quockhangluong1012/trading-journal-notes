<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="520" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Logic đặt Stop — ngoài toàn bộ range post-08:30, không chỉ tại swing MSS</text>
<line x1="40" y1="440" x2="920" y2="440" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="350" x2="920" y2="350" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="260" x2="920" y2="260" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="170" x2="920" y2="170" stroke="#1f2937" stroke-width="1"/>
<!-- post 08:30 range high wick -->
<line x1="150" y1="120" x2="150" y2="260" stroke="#9ca3af" stroke-width="1.5"/><rect x="144" y="180" width="12" height="40" fill="#ef4444"/>
<text x="150" y="108" font-size="12" fill="#94a3b8" text-anchor="middle">Đỉnh post-08:30</text>
<!-- swing MSS point (tighter, wrong stop location) -->
<line x1="300" y1="260" x2="300" y2="340" stroke="#9ca3af" stroke-width="1.5"/><rect x="294" y="290" width="12" height="30" fill="#ef4444"/>
<text x="300" y="360" font-size="11" fill="#f87171" text-anchor="middle">Swing MSS (sai nếu đặt stop ở đây)</text>
<!-- displacement + retest + continuation -->
<line x1="380" y1="260" x2="380" y2="380" stroke="#9ca3af" stroke-width="1.5"/><rect x="374" y="280" width="12" height="80" fill="#ef4444"/>
<line x1="440" y1="300" x2="440" y2="360" stroke="#9ca3af" stroke-width="1.5"/><rect x="434" y="310" width="12" height="30" fill="#22c55e"/>
<line x1="500" y1="330" x2="500" y2="420" stroke="#9ca3af" stroke-width="1.5"/><rect x="494" y="340" width="12" height="60" fill="#ef4444"/>
<line x1="560" y1="380" x2="560" y2="440" stroke="#9ca3af" stroke-width="1.5"/><rect x="554" y="390" width="12" height="40" fill="#ef4444"/>
<!-- wick spike back near swing MSS that would falsely stop out tight stop -->
<line x1="440" y1="295" x2="440" y2="240" stroke="#f87171" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="440" y="230" font-size="10.5" fill="#f87171" text-anchor="middle">Wick quét lại swing MSS</text>
<!-- correct stop line: entire post 08:30 range high -->
<line x1="100" y1="118" x2="900" y2="118" stroke="#f87171" stroke-width="2.5" stroke-dasharray="3 2"/>
<text x="895" y="105" font-size="12" fill="#f87171" text-anchor="end" font-weight="700">Stop ĐÚNG: ngoài toàn bộ range post-08:30</text>
<!-- entry marker -->
<path d="M446,320 L490,340" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrSL)"/>
<text x="360" y="300" font-size="12" fill="#22c55e" font-weight="700" text-anchor="start">Entry SELL tại PD array</text>
<defs><marker id="arrSL" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker></defs>
<rect x="60" y="470" width="840" height="34" rx="6" fill="rgba(248,113,113,0.08)" stroke="#f87171" stroke-width="1"/>
<text x="480" y="492" font-size="12" fill="#e5e7eb" text-anchor="middle">Biến động post-08:30 rất rộng — wick dễ quét đúng swing MSS dù hướng cuối cùng đúng.</text>
</svg>
