<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case 6 — Hai lookback IPDA khác nhau, hai weekly bias khác nhau</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Case tái dựng minh họa, số liệu hypothetical — không phải lệnh thật</text>

  <rect x="80" y="100" width="360" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="260" y="128" font-size="12.5" fill="#e5e7eb" text-anchor="middle">Trader A dùng lookback 20 ngày</text>
  <text x="260" y="150" font-size="11.5" fill="#4ade80" text-anchor="middle">→ Weekly bias: Bullish</text>
  <text x="260" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Range gần nhất hẹp, đáy cao dần</text>

  <rect x="520" y="100" width="360" height="100" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="700" y="128" font-size="12.5" fill="#e5e7eb" text-anchor="middle">Trader B dùng lookback 60 ngày</text>
  <text x="700" y="150" font-size="11.5" fill="#ef4444" text-anchor="middle">→ Weekly bias: Bearish</text>
  <text x="700" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Range dài hơn, đỉnh thấp dần</text>

  <rect x="150" y="230" width="660" height="130" rx="8" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="480" y="256" font-size="13" fill="#f87171" text-anchor="middle" font-weight="700">Cùng một cặp tiền, hai bias trái ngược</text>
  <text x="480" y="278" font-size="12" fill="#e5e7eb" text-anchor="middle">Không có quy tắc khách quan nào trong tài liệu ICT gốc quy định</text>
  <text x="480" y="298" font-size="12" fill="#e5e7eb" text-anchor="middle">lookback nào (20/40/60 ngày) là "đúng" cho tuần hiện tại.</text>
  <text x="480" y="320" font-size="11.5" fill="#94a3b8" text-anchor="middle">Trader A vào Long theo bias của mình; Trader B đứng ngoài vì thấy Bearish.</text>
  <text x="480" y="340" font-size="11.5" fill="#94a3b8" text-anchor="middle">Bài học: cố định 1 lookback trước, chấp nhận đây là quy ước — không phải sự thật tuyệt đối.</text>
</svg>
