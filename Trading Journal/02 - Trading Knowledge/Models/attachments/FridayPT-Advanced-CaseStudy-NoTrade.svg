<text x="80" y="498" font-size="12" fill="#e5e7eb" text-anchor="start">Không có tín hiệu thì đứng ngoài chính là quyết định thắng.</text>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa.</text>
