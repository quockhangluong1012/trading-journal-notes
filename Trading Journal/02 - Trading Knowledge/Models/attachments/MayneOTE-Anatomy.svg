<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Anatomy — 4 cấu phần ICT tạo nên Mayne Model</text>
<text x="32" y="58" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">Structure (hướng) + Liquidity (đích) + POI (nơi) + OTE (giá vào) — đóng gói thuận xu hướng</text>

<defs>
<marker id="arrBlueA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
</marker>
</defs>

<!-- 4 boxes -->
<rect x="40" y="100" width="200" height="130" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
<text x="140" y="128" font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">Market Structure</text>
<text x="140" y="152" font-size="12" fill="#94a3b8" text-anchor="middle">BOS / CHOCH / MSS</text>
<text x="140" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">HH-HL hay LH-LL</text>
<text x="140" y="200" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">→ Xác định HƯỚNG</text>

<rect x="260" y="100" width="200" height="130" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
<text x="360" y="128" font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">Liquidity</text>
<text x="360" y="152" font-size="12" fill="#94a3b8" text-anchor="middle">BSL / SSL / DOL</text>
<text x="360" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Sweep nội vi</text>
<text x="360" y="200" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">→ Xác định ĐÍCH + NHIÊN LIỆU</text>

<rect x="480" y="100" width="200" height="130" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
<text x="580" y="128" font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">PD Array / POI</text>
<text x="580" y="152" font-size="12" fill="#94a3b8" text-anchor="middle">OB / FVG / Breaker</text>
<text x="580" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Vùng phản ứng</text>
<text x="580" y="200" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">→ Xác định NƠI</text>

<rect x="700" y="100" width="220" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="810" y="128" font-size="15" font-weight="700" fill="#e5e7eb" text-anchor="middle">OTE (Fib 62–79%)</text>
<text x="810" y="152" font-size="12" fill="#94a3b8" text-anchor="middle">0.705 = CE</text>
<text x="810" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Điểm vào cụ thể</text>
<text x="810" y="200" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">→ GIÁ VÀO CHÍNH XÁC</text>

<line x1="240" y1="165" x2="256" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlueA)"/>
<line x1="460" y1="165" x2="476" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlueA)"/>
<line x1="680" y1="165" x2="696" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlueA)"/>

<!-- Mini price chart demonstrating the concept -->
<rect x="40" y="270" width="880" height="260" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
<text x="60" y="296" font-size="13" font-weight="700" fill="#e5e7eb" text-anchor="start">Minh họa trên chart: HTF uptrend → pullback → OTE chồng POI → entry</text>

<!-- swing structure: HL up trend then pullback into OTE zone -->
<line x1="80" y1="470" x2="880" y2="470" stroke="#1f2937" stroke-width="1"/>
<line x1="80" y1="420" x2="880" y2="420" stroke="#1f2937" stroke-width="1"/>
<line x1="80" y1="370" x2="880" y2="370" stroke="#1f2937" stroke-width="1"/>

<!-- Up-leg candles (swing low to swing high) -->
<line x1="120" y1="470" x2="120" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="113.5" y="450" width="13" height="15" fill="#22c55e"/>
<line x1="144" y1="450" x2="144" y2="400" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="137.5" y="405" width="13" height="40" fill="#22c55e"/>
<line x1="168" y1="405" x2="168" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="161.5" y="350" width="13" height="50" fill="#22c55e"/>
<line x1="192" y1="350" x2="192" y2="310" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="185.5" y="315" width="13" height="30" fill="#22c55e"/>
<text x="192" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">Swing High</text>

<!-- OTE zone box between 62-79% of the up-leg -->
<rect x="216" y="370" width="90" height="60" fill="rgba(59,130,246,0.10)" stroke="none"/>
<rect x="216" y="382" width="90" height="36" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="220" y="378" font-size="11" fill="#3b82f6" text-anchor="start">OTE 62–79%</text>
<line x1="216" y1="400" x2="306" y2="400" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="310" y="404" font-size="11" fill="#38bdf8" text-anchor="start">0.705 CE</text>

<!-- pullback candles into the OTE zone -->
<line x1="216" y1="315" x2="216" y2="345" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="209.5" y="320" width="13" height="20" fill="#ef4444"/>
<line x1="240" y1="330" x2="240" y2="375" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="233.5" y="335" width="13" height="35" fill="#ef4444"/>
<line x1="264" y1="360" x2="264" y2="405" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="257.5" y="365" width="13" height="35" fill="#ef4444"/>
<line x1="288" y1="385" x2="288" y2="412" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="281.5" y="390" width="13" height="18" fill="#ef4444"/>

<!-- reaction candles back up after OTE -->
<line x1="312" y1="395" x2="312" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="305.5" y="355" width="13" height="35" fill="#22c55e"/>
<line x1="336" y1="355" x2="336" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="329.5" y="305" width="13" height="45" fill="#22c55e"/>
<line x1="360" y1="305" x2="360" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="353.5" y="255" width="13" height="45" fill="#22c55e"/>

<text x="240" y="440" font-size="11" fill="#94a3b8" text-anchor="middle">Pullback vào POI</text>
<text x="360" y="425" font-size="12" fill="#4ade80" text-anchor="middle">Entry sau confirmation</text>

<!-- Liquidity target line -->
<line x1="400" y1="255" x2="880" y2="255" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="700" y="248" font-size="12" fill="#94a3b8" text-anchor="start">BSL — target (DOL)</text>

<!-- legend -->
<rect x="620" y="480" width="12" height="12" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5"/>
<text x="638" y="491" font-size="12" fill="#94a3b8" text-anchor="start">POI (OB/FVG)</text>
<line x1="620" y1="510" x2="632" y2="510" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="638" y="514" font-size="12" fill="#94a3b8" text-anchor="start">CE 0.705</text>
<line x1="760" y1="510" x2="772" y2="510" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="778" y="514" font-size="12" fill="#94a3b8" text-anchor="start">Liquidity / DOL</text>
</svg>
