<text x="1148.0" y="258.7" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="end">Low nến 1 = distal</text>
<line x1="628.0" y1="346.6" x2="1152.0" y2="346.6" stroke="#e6edf3" stroke-width="1.2" stroke-dasharray="0"/>
<text x="1148.0" y="361.6" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="end">High nến 3 = proximal</text>
<line x1="728.0" y1="305.1" x2="1152.0" y2="305.1" stroke="#e3b341" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="1148.0" y="300.1" font-size="11" font-weight="600" fill="#e3b341" text-anchor="end">CE 50% = 111.35</text>
<text x="790.0" y="514.2" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">nến 1</text>
<text x="890.0" y="514.2" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">nến 2 (displacement)</text>
<text x="990.0" y="514.2" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">nến 3</text>
<text x="890.0" y="127.4" font-size="12" font-weight="600" fill="#f85149" text-anchor="middle">điều kiện: High(3) &lt; Low(1)</text>
<rect x="40.0" y="585.0" width="365.0" height="160.0" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/>
<text x="52.0" y="607.0" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Quan sát được (OHLC)</text>
<text x="52.0" y="627.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Một khoảng giá chỉ được giao dịch</text>
<text x="52.0" y="648.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">  bởi MỘT nến (nến 2).</text>
<text x="52.0" y="669.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Có thể đo: kích thước, vị trí so</text>
<text x="52.0" y="690.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">  với range, có bị lấp hay chưa.</text>
<rect x="418.0" y="585.0" width="365.0" height="160.0" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
<text x="430.0" y="607.0" font-size="14" font-weight="700" fill="#bc8cff" text-anchor="start">ICT diễn giải [ICT FRAMEWORK]</text>
<text x="430.0" y="627.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• 'Imbalance' — giao dịch một chiều,</text>
<text x="430.0" y="648.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">  giá có xu hướng quay lại 'cân bằng'.</text>
<text x="430.0" y="669.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• FVG sau displacement tại POI là</text>
<text x="430.0" y="690.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">  vùng entry của 2022 Model.</text>
<rect x="796.0" y="585.0" width="364.0" height="160.0" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.6"/>
<text x="808.0" y="607.0" font-size="14" font-weight="700" fill="#f0883e" text-anchor="start">Chưa chứng minh [BACKTEST REQUIRED]</text>
<text x="808.0" y="627.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Giá KHÔNG bắt buộc quay lại FVG.</text>
<text x="808.0" y="648.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Phản ứng tại CE &gt; tại mép? — HYP.</text>
<text x="808.0" y="669.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• FVG không từ displacement (grind</text>
<text x="808.0" y="690.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">  chậm) có giá trị thấp hơn? — HYP.</text></svg>