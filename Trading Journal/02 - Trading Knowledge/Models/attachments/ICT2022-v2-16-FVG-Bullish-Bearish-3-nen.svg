<text x="568.0" y="409.5" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="end">High nến 1 = distal (mép xa)</text>
<line x1="48.0" y1="315.3" x2="572.0" y2="315.3" stroke="#e6edf3" stroke-width="1.2" stroke-dasharray="0"/>
<text x="568.0" y="310.3" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="end">Low nến 3 = proximal (mép gần)</text>
<line x1="148.0" y1="354.9" x2="572.0" y2="354.9" stroke="#e3b341" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="568.0" y="349.9" font-size="11" font-weight="600" fill="#e3b341" text-anchor="end">CE 50% = 108.65</text>
<text x="210.0" y="514.2" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">nến 1</text>
<text x="310.0" y="514.2" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">nến 2 (displacement)</text>
<text x="410.0" y="514.2" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">nến 3</text>
<text x="310.0" y="127.4" font-size="12" font-weight="600" fill="#3fb950" text-anchor="middle">điều kiện: Low(3) &gt; High(1)</text>
