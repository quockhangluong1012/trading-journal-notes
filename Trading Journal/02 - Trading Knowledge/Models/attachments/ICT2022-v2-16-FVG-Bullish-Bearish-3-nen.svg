<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 785" width="1200" height="785" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="785" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Fair Value Gap — giải phẫu mô hình 3 nến (bullish &amp; bearish)</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">FVG = cấu trúc giá cụ thể · Displacement = đặc điểm chuyển động · MSS = sự kiện cấu trúc — ba khái niệm khác nhau</text>
<text x="600.0" y="771.0" font-size="11.5" font-weight="400" fill="#484f58" text-anchor="middle" font-style="italic">Sơ đồ minh họa khái niệm — dữ liệu giá giả lập, không phải chart thật</text>
