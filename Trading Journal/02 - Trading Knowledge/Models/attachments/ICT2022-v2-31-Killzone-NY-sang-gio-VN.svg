<text x="52.0" y="407.0" font-size="14" font-weight="700" fill="#e3b341" text-anchor="start">Lưu ý vận hành (edge case DST)</text>
<text x="52.0" y="427.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• 2026: Anh lùi giờ 25/10, Mỹ lùi giờ 1/11 → tuần 25/10–1/11: London 08:00 = 04:00 NY (bình thường 03:00 NY). London 'mở cửa' lệch 1 giờ so với KZ định nghĩa theo NY.</text>
<text x="52.0" y="454.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• 2027: Mỹ tiến giờ 14/3, Anh tiến giờ 28/3 → hai tuần lệch tương tự.</text>
<text x="52.0" y="481.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Checklist hiện có ghi 'killzone 20:30–23:00 VN': = 08:30–11:00 NY khi Mỹ dùng EST (khớp KZ index) nhưng = 09:30–12:00 NY khi EDT (lệch 1 giờ).</text>
<text x="52.0" y="508.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Cách an toàn: đặt đồng hồ NY trên chart (TradingView đã để giờ NY) và định nghĩa KZ bằng giờ NY; giờ VN chỉ để nhắc lịch.</text>
<text x="52.0" y="535.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">• Ngày cần kiểm: Mỹ — CN thứ 2 tháng 3 &amp; CN đầu tháng 11; Anh — CN cuối tháng 3 &amp; CN cuối tháng 10 (Case 5).</text></svg>