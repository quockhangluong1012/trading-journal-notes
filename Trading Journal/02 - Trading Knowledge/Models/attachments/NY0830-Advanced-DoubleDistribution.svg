<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="520" rx="12" fill="#0d1117"/>
<text x="480" y="32" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Double distribution — sweep 08:30 xong, 09:30 sweep ngược lại</text>
<line x1="40" y1="440" x2="920" y2="440" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="350" x2="920" y2="350" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="260" x2="920" y2="260" stroke="#1f2937" stroke-width="1"/>
<line x1="40" y1="170" x2="920" y2="170" stroke="#1f2937" stroke-width="1"/>
<!-- phase 1: 08:30 raid + MSS up -->
<line x1="90" y1="380" x2="90" y2="420" stroke="#9ca3af" stroke-width="1.5"/><rect x="84" y="390" width="12" height="25" fill="#ef4444"/>
<path d="M90,390 L125,360" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrDD1)"/>
<text x="60" y="150" font-size="12" font-weight="700" fill="#eab308" text-anchor="start">08:30</text>
<line x1="80" y1="165" x2="80" y2="450" stroke="#eab308" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="150" y1="300" x2="150" y2="370" stroke="#9ca3af" stroke-width="1.5"/><rect x="144" y="310" width="12" height="55" fill="#22c55e"/>
<line x1="190" y1="240" x2="190" y2="305" stroke="#9ca3af" stroke-width="1.5"/><rect x="184" y="250" width="12" height="50" fill="#22c55e"/>
<line x1="230" y1="200" x2="230" y2="245" stroke="#9ca3af" stroke-width="1.5"/><rect x="224" y="210" width="12" height="30" fill="#22c55e"/>
<text x="150" y="190" font-size="11" fill="#4ade80" text-anchor="start">MSS lên — chạy có lãi (T1 hit)</text>
<!-- phase 2: 09:30 reversal sweep -->
<text x="490" y="150" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="start">09:30 (mở NYSE)</text>
<line x1="510" y1="165" x2="510" y2="450" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="280" y1="195" x2="280" y2="230" stroke="#9ca3af" stroke-width="1.5"/><rect x="274" y="200" width="12" height="25" fill="#22c55e"/>
<line x1="330" y1="185" x2="330" y2="220" stroke="#9ca3af" stroke-width="1.5"/><rect x="324" y="192" width="12" height="20" fill="#22c55e"/>
<line x1="380" y1="190" x2="380" y2="225" stroke="#9ca3af" stroke-width="1.5"/><rect x="374" y="195" width="12" height="22" fill="#ef4444"/>
<line x1="430" y1="188" x2="430" y2="222" stroke="#9ca3af" stroke-width="1.5"/><rect x="424" y="193" width="12" height="20" fill="#22c55e"/>
<line x1="300" y1="185" x2="450" y2="185" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="300" y="178" font-size="10.5" fill="#a855f7" text-anchor="start">Đỉnh phụ trước 09:30</text>
<line x1="530" y1="175" x2="530" y2="230" stroke="#9ca3af" stroke-width="1.5"/><rect x="524" y="180" width="12" height="30" fill="#ef4444"/>
<path d="M530,225 L570,270" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrDD2)"/>
<text x="575" y="255" font-size="11" fill="#f97316" text-anchor="start">Sweep ngược lại tại 09:30</text>
<line x1="600" y1="270" x2="600" y2="340" stroke="#9ca3af" stroke-width="1.5"/><rect x="594" y="280" width="12" height="50" fill="#ef4444"/>
<line x1="650" y1="320" x2="650" y2="390" stroke="#9ca3af" stroke-width="1.5"/><rect x="644" y="330" width="12" height="50" fill="#ef4444"/>
<line x1="580" y1="260" x2="900" y2="260" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="700" y="252" font-size="10.5" fill="#a855f7" text-anchor="start">MSS đối nghịch — phân phối lần 2</text>
<line x1="700" y1="380" x2="700" y2="430" stroke="#9ca3af" stroke-width="1.5"/><rect x="694" y="390" width="12" height="35" fill="#ef4444"/>
<line x1="750" y1="400" x2="750" y2="440" stroke="#9ca3af" stroke-width="1.5"/><rect x="744" y="405" width="12" height="30" fill="#ef4444"/>
<rect x="60" y="470" width="840" height="40" rx="6" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1"/>
<text x="480" y="495" font-size="12" fill="#e5e7eb" text-anchor="middle">Quy tắc: chốt một phần trước 09:30, dời BE — không giữ full size xuyên qua mốc mở NYSE nếu chưa đạt T2.</text>
<defs>
<marker id="arrDD1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
<marker id="arrDD2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
</defs>
</svg>
