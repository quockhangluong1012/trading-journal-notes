<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Giải phẫu một Venom Strike hợp lệ (M5/M15)</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Chart minh họa khái niệm — không phải dữ liệu giao dịch thật</text>

  <!-- gridlines -->
  <g stroke="#1f2937" stroke-width="1">
    <line x1="60" y1="140" x2="920" y2="140"/>
    <line x1="60" y1="220" x2="920" y2="220"/>
    <line x1="60" y1="300" x2="920" y2="300"/>
    <line x1="60" y1="380" x2="920" y2="380"/>
    <line x1="60" y1="460" x2="920" y2="460"/>
  </g>

  <!-- Session low reference line -->
  <line x1="60" y1="380" x2="500" y2="380" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="372" font-size="12" fill="#eab308">Pre-market / Session Low (pool tham chiếu)</text>

  <!-- pre-sweep candles (drifting down toward the pool) -->
  <g>
    <line x1="120" y1="300" x2="120" y2="360" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="114" y="310" width="12" height="35" fill="#ef4444"/>
    <line x1="160" y1="310" x2="160" y2="370" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="154" y="320" width="12" height="35" fill="#ef4444"/>
    <line x1="200" y1="320" x2="200" y2="378" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="194" y="330" width="12" height="33" fill="#ef4444"/>
  </g>

  <!-- sweep candle: long wick below the line, close back above -->
  <line x1="245" y1="330" x2="245" y2="415" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="239" y="345" width="12" height="30" fill="#22c55e"/>
  <path d="M 270 400 q 20 25 -5 45" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <text x="245" y="440" font-size="12" fill="#f97316" text-anchor="middle">Venom Strike</text>
  <text x="245" y="454" font-size="11" fill="#94a3b8" text-anchor="middle">sweep + reclaim</text>

  <!-- displacement candles up -->
  <g>
    <line x1="300" y1="220" x2="300" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="292" y="230" width="16" height="105" fill="#22c55e"/>
    <line x1="340" y1="170" x2="340" y2="245" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="332" y="180" width="16" height="60" fill="#22c55e"/>
    <line x1="380" y1="150" x2="380" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="372" y="158" width="16" height="52" fill="#22c55e"/>
  </g>
  <text x="340" y="140" font-size="13" fill="#e5e7eb" text-anchor="middle">Displacement + MSS</text>
  <text x="340" y="155" font-size="0" fill="#e5e7eb"></text>

  <!-- swing high broken -->
  <line x1="230" y1="230" x2="470" y2="230" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="475" y="234" font-size="11" fill="#a855f7">MSS — phá swing high</text>

  <!-- FVG zone between candle1 wick and candle3 wick -->
  <rect x="300" y="200" width="80" height="35" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
  <text x="340" y="500" font-size="12" fill="#3b82f6" text-anchor="middle">FVG — POI chờ retrace</text>
  <line x1="340" y1="480" x2="340" y2="240" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- retrace candles back down to FVG -->
  <g>
    <line x1="420" y1="200" x2="420" y2="260" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="414" y="205" width="12" height="35" fill="#ef4444"/>
    <line x1="460" y1="205" x2="460" y2="245" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="454" y="210" width="12" height="25" fill="#ef4444"/>
  </g>

  <!-- CE line -->
  <line x1="380" y1="217" x2="600" y2="217" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="605" y="221" font-size="11" fill="#38bdf8">CE (50% FVG)</text>

  <defs>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g font-size="12" fill="#94a3b8">
    <rect x="700" y="480" width="14" height="14" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
    <text x="720" y="491" fill="#e5e7eb">FVG zone</text>
    <line x1="700" y1="510" x2="714" y2="510" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="720" y="514" fill="#e5e7eb">Session pool (liquidity)</text>
    <line x1="700" y1="530" x2="714" y2="530" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="720" y="534" fill="#e5e7eb">CE / 50%</text>
  </g>
</svg>
