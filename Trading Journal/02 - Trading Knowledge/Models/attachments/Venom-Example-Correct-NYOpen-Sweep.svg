<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ví dụ đúng — NY Open: sweep London Low → Displacement → FVG → Session High</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Chart minh họa khái niệm, không phải dữ liệu giao dịch thật</text>

  <g stroke="#1f2937" stroke-width="1">
    <line x1="60" y1="130" x2="920" y2="130"/>
    <line x1="60" y1="210" x2="920" y2="210"/>
    <line x1="60" y1="290" x2="920" y2="290"/>
    <line x1="60" y1="370" x2="920" y2="370"/>
    <line x1="60" y1="450" x2="920" y2="450"/>
  </g>

  <!-- London Low pool -->
  <line x1="60" y1="400" x2="380" y2="400" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="392" font-size="12" fill="#eab308">London Low (session pool)</text>

  <!-- drift down candles pre-sweep -->
  <g>
    <line x1="120" y1="320" x2="120" y2="380" stroke="#9ca3af" stroke-width="1.5"/><rect x="114" y="330" width="12" height="35" fill="#ef4444"/>
    <line x1="160" y1="330" x2="160" y2="392" stroke="#9ca3af" stroke-width="1.5"/><rect x="154" y="340" width="12" height="35" fill="#ef4444"/>
    <line x1="200" y1="340" x2="200" y2="398" stroke="#9ca3af" stroke-width="1.5"/><rect x="194" y="350" width="12" height="32" fill="#ef4444"/>
  </g>

  <!-- sweep candle wick below London low, reclaim close -->
  <line x1="245" y1="350" x2="245" y2="430" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="239" y="360" width="12" height="30" fill="#22c55e"/>
  <path d="M 265 415 q 20 25 -5 40" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOrangeC)"/>
  <text x="245" y="465" font-size="12" fill="#f97316" text-anchor="middle">(1) Sweep + reclaim</text>

  <!-- displacement candles up -->
  <g>
    <line x1="300" y1="230" x2="300" y2="360" stroke="#9ca3af" stroke-width="1.5"/><rect x="292" y="240" width="16" height="110" fill="#22c55e"/>
    <line x1="340" y1="180" x2="340" y2="255" stroke="#9ca3af" stroke-width="1.5"/><rect x="332" y="190" width="16" height="60" fill="#22c55e"/>
    <line x1="380" y1="150" x2="380" y2="220" stroke="#9ca3af" stroke-width="1.5"/><rect x="372" y="158" width="16" height="55" fill="#22c55e"/>
  </g>
  <line x1="230" y1="245" x2="470" y2="245" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="475" y="249" font-size="11" fill="#a855f7">(2) MSS + Displacement</text>

  <!-- FVG zone -->
  <rect x="300" y="215" width="80" height="35" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
  <line x1="380" y1="232" x2="600" y2="232" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="605" y="236" font-size="11" fill="#38bdf8">CE</text>

  <!-- retrace candles -->
  <g>
    <line x1="430" y1="215" x2="430" y2="270" stroke="#9ca3af" stroke-width="1.5"/><rect x="424" y="220" width="12" height="35" fill="#ef4444"/>
    <line x1="470" y1="220" x2="470" y2="255" stroke="#9ca3af" stroke-width="1.5"/><rect x="464" y="225" width="12" height="22" fill="#ef4444"/>
  </g>
  <text x="450" y="500" font-size="12" fill="#3b82f6" text-anchor="middle">(3) Entry tại FVG (CE)</text>

  <!-- run to session high -->
  <g>
    <line x1="560" y1="150" x2="560" y2="230" stroke="#9ca3af" stroke-width="1.5"/><rect x="552" y="160" width="16" height="60" fill="#22c55e"/>
    <line x1="610" y1="110" x2="610" y2="190" stroke="#9ca3af" stroke-width="1.5"/><rect x="602" y="120" width="16" height="60" fill="#22c55e"/>
    <line x1="660" y1="90" x2="660" y2="160" stroke="#9ca3af" stroke-width="1.5"/><rect x="652" y="98" width="16" height="55" fill="#22c55e"/>
  </g>
  <line x1="640" y1="100" x2="900" y2="100" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="900" y="92" font-size="12" fill="#eab308" text-anchor="end">(4) Target: Session High / PDH</text>

  <defs>
    <marker id="arrOrangeC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
