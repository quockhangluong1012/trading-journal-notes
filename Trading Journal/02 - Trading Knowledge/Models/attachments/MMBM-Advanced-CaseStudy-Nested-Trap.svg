<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Case Study — Nested trap: H4 MMBM trong D1 MMSM (-0.5R, thoát sớm)</text>

<!-- D1 downtrend backdrop -->
<text x="60" y="70" font-size="13" fill="#94a3b8">D1: xu hướng giảm chính (MMSM lớn)</text>
<polyline points="60,90 200,140 350,190 500,240 650,290 800,330 900,360" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>

<!-- H4 MMBM inside -->
<rect x="330" y="260" width="300" height="180" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-dasharray="4 3"/>
<text x="340" y="278" font-size="11" fill="#38bdf8">H4 MMBM bên trong</text>

<line x1="330" y1="400" x2="630" y2="400" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<polyline points="340,300 380,300 380,340 420,340 420,380 460,380 460,400" fill="none" stroke="#ef4444" stroke-width="2"/>
<circle cx="460" cy="400" r="14" fill="none" stroke="#4ade80" stroke-width="2"/>
<polyline points="460,400 500,370 540,345" fill="none" stroke="#22c55e" stroke-width="2"/>
<circle cx="500" cy="370" r="5" fill="#4ade80"/>
<text x="500" y="420" font-size="11" fill="#4ade80">Entry Buy tại FVG H4</text>

<!-- then D1 trend resumes down -->
<polyline points="540,345 580,380 620,420 660,460" fill="none" stroke="#ef4444" stroke-width="2.5"/>
<text x="660" y="480" font-size="11" fill="#f87171">D1 tiếp tục giảm, nuốt luôn hồi H4</text>
<line x1="500" y1="380" x2="960" y2="380" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="640" y="375" font-size="11" fill="#f87171">SL một phần bị chạm — thoát sớm</text>

<rect x="60" y="460" width="560" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="76" y="482" font-size="12" fill="#e5e7eb">D1 đang giảm mạnh → H4 MMBM chỉ là hồi kỹ thuật, không phải đảo chiều</text>
<text x="76" y="502" font-size="12" fill="#e5e7eb">Đúng ra: giảm size, chốt lời sớm tại đối trọng gần, không kỳ vọng BSL xa</text>
<text x="76" y="522" font-size="12" fill="#4ade80">Kết quả: thoát sớm theo kế hoạch, -0.5R (đã giảm size trước)</text>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Case tái dựng từ pattern lặp lại trong backtest, số liệu minh họa</text>
</svg>
