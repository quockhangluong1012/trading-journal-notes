<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="800" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Sáu khái niệm thường bị gộp làm một: invalidation ở từng tầng ≠ chạm SL ≠ lệnh thua đúng quy trình</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Mỗi tầng có điều kiện chết riêng, bằng chứng riêng và đích reset riêng</text>
<rect x="40.0" y="100.0" width="1120.0" height="36.0" rx="6" fill="#1c2330" stroke="#30363d" stroke-width="1.5"/>
<text x="56.0" y="124.0" font-size="12.8" font-weight="700" fill="#8b949e" text-anchor="start">Khái niệm</text>
<text x="330.0" y="124.0" font-size="12.8" font-weight="700" fill="#8b949e" text-anchor="start">Trigger (quan sát được)</text>
<text x="650.0" y="124.0" font-size="12.8" font-weight="700" fill="#8b949e" text-anchor="start">Nếu CHƯA vào lệnh</text>
<text x="920.0" y="124.0" font-size="12.8" font-weight="700" fill="#8b949e" text-anchor="start">Nếu ĐÃ vào lệnh</text>
<rect x="40.0" y="136.0" width="1120.0" height="104.0" rx="0" fill="#161b22" stroke="#30363d" stroke-width="0.7"/>
<rect x="40.0" y="136.0" width="6.0" height="104.0" rx="0" fill="#58a6ff"/>
<text x="56.0" y="166.0" font-size="13.5" font-weight="800" fill="#58a6ff" text-anchor="start">D1 Bias invalidation</text>
<text x="330.0" y="162.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Thân nến D1 close xuyên protected swing</text>
<text x="330.0" y="180.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">(ITH/LTH)</text>
<text x="650.0" y="162.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Ngừng mọi setup cùng hướng; reset</text>
<text x="650.0" y="180.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">về S0, viết lại Context Note</text>
<text x="920.0" y="162.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Không chạm vào lệnh đang mở</text>
<text x="920.0" y="180.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">theo v0.2 (SL làm việc); ghi</text>
<text x="920.0" y="198.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">nhận cho review</text>
<rect x="40.0" y="240.0" width="1120.0" height="104.0" rx="0" fill="#0d1117" stroke="#30363d" stroke-width="0.7"/>
<rect x="40.0" y="240.0" width="6.0" height="104.0" rx="0" fill="#bc8cff"/>
<text x="56.0" y="270.0" font-size="13.5" font-weight="800" fill="#bc8cff" text-anchor="start">H1 Setup invalidation</text>
<text x="330.0" y="266.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Acceptance xuyên distal H1 POI (≥ 2 thân</text>
<text x="330.0" y="284.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">H1) / opposing pool mới chen giữa / T1</text>
<text x="330.0" y="302.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">chạm trước arrival</text>
<text x="650.0" y="266.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Hủy setup tại POI này → POI kế</text>
<text x="650.0" y="284.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">tiếp hoặc REASSESS D1</text>
<text x="920.0" y="266.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Không can thiệp v0.2; log</text>
<rect x="40.0" y="344.0" width="1120.0" height="104.0" rx="0" fill="#161b22" stroke="#30363d" stroke-width="0.7"/>
<rect x="40.0" y="344.0" width="6.0" height="104.0" rx="0" fill="#39c5cf"/>
<text x="56.0" y="374.0" font-size="13.5" font-weight="800" fill="#39c5cf" text-anchor="start">M5 Entry invalidation</text>
<text x="330.0" y="370.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Trước MSS: close dưới cực trị sweep.</text>
<text x="330.0" y="388.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Lệnh chờ: MSS fail (E2/E3) · TTL / hết</text>
<text x="330.0" y="406.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">KZ / +1R chưa khớp (FVG close-through:</text>
<text x="330.0" y="424.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">chỉ E3/gap)</text>
<text x="650.0" y="370.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Hủy lệnh chờ; zone còn armed &amp; còn</text>
<text x="650.0" y="388.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">killzone → chờ chuỗi mới (tối đa 2</text>
<text x="650.0" y="406.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">lần/zone)</text>
<text x="920.0" y="370.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">—</text>
<rect x="40.0" y="448.0" width="1120.0" height="104.0" rx="0" fill="#0d1117" stroke="#30363d" stroke-width="0.7"/>
<rect x="40.0" y="448.0" width="6.0" height="104.0" rx="0" fill="#f85149"/>
<text x="56.0" y="478.0" font-size="13.5" font-weight="800" fill="#f85149" text-anchor="start">Stop Loss bị chạm</text>
<text x="330.0" y="474.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Giá chạm mức SL đã đặt (sau khi đã có vị</text>
<text x="330.0" y="492.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">thế)</text>
<text x="650.0" y="474.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">—</text>
<text x="920.0" y="474.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Lệnh đóng −1R (± trượt giá);</text>
<text x="920.0" y="492.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">đánh giá tầng nào đã sai</text>
<rect x="40.0" y="552.0" width="1120.0" height="104.0" rx="0" fill="#161b22" stroke="#30363d" stroke-width="0.7"/>
<rect x="40.0" y="552.0" width="6.0" height="104.0" rx="0" fill="#f0883e"/>
<text x="56.0" y="582.0" font-size="13.5" font-weight="800" fill="#f0883e" text-anchor="start">Giả thuyết giao dịch</text>
<text x="56.0" y="600.0" font-size="13.5" font-weight="800" fill="#f0883e" text-anchor="start">không còn hợp lệ</text>
<text x="330.0" y="578.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Bất kỳ tầng trên invalid, hoặc DOL</text>
<text x="330.0" y="596.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">fulfilled/superseded</text>
<text x="650.0" y="578.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Không mở lệnh mới theo giả thuyết</text>
<text x="650.0" y="596.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">đó</text>
<text x="920.0" y="578.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Quản lý theo luật đã định</text>
<text x="920.0" y="596.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">trước, không tùy hứng</text>
<rect x="40.0" y="656.0" width="1120.0" height="104.0" rx="0" fill="#0d1117" stroke="#30363d" stroke-width="0.7"/>
<rect x="40.0" y="656.0" width="6.0" height="104.0" rx="0" fill="#3fb950"/>
<text x="56.0" y="686.0" font-size="13.5" font-weight="800" fill="#3fb950" text-anchor="start">Lệnh thua NHƯNG tuân thủ</text>
<text x="330.0" y="682.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">Mọi bước đúng spec, SL chạm</text>
<text x="650.0" y="682.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">—</text>
<text x="920.0" y="682.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">first_error_step: none ·</text>
<text x="920.0" y="700.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">followed_plan: Yes → 'good</text>
<text x="920.0" y="718.0" font-size="12.2" font-weight="400" fill="#e6edf3" text-anchor="start">loss', không sửa hành vi</text>
<text x="40.0" y="790.0" font-size="12.4" font-weight="600" fill="#e3b341" text-anchor="start">Quy tắc: tầng dưới chỉ được SUSPEND tầng trên, không được INVALIDATE; wick không bao giờ invalidate — acceptance (≥ 2 thân nến) mới invalidate (HEURISTIC N = 2).</text></svg>