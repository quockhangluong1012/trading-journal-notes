<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m58a6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="me3b341" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker><marker id="md29922" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="m39c5cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="m3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="mf85149" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="m8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="mf0883e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker></defs><rect width="1200" height="820" rx="14" fill="#0d1117"/>
<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Daily Bias — tổng hợp bằng chứng thành 1 trong 4 trạng thái</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Bias = giả thuyết hướng có điều kiện ('chỉ xét setup hướng X'), không phải dự báo 'hôm nay chắc chắn tăng'</text>
<rect x="40.0" y="100.0" width="330.0" height="76.0" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="56.0" y="128.0" font-size="14.5" font-weight="800" fill="#58a6ff" text-anchor="start">Major structure</text>
<text x="56.0" y="152.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">ITH/LTH gần nhất bị phá theo hướng nào?</text>
<line x1="372.0" y1="138.0" x2="470.0" y2="390.0" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#m58a6ff)"/>
<rect x="40.0" y="192.0" width="330.0" height="76.0" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="56.0" y="220.0" font-size="14.5" font-weight="800" fill="#58a6ff" text-anchor="start">Dealing range</text>
<text x="56.0" y="244.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Range D1 nào đang operative?</text>
<line x1="372.0" y1="230.0" x2="470.0" y2="390.0" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#m58a6ff)"/>
<rect x="40.0" y="284.0" width="330.0" height="76.0" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
<text x="56.0" y="312.0" font-size="14.5" font-weight="800" fill="#e3b341" text-anchor="start">Location</text>
<text x="56.0" y="336.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Discount / Premium / gần EQ?</text>
<line x1="372.0" y1="322.0" x2="470.0" y2="390.0" stroke="#e3b341" stroke-width="1.4" marker-end="url(#me3b341)"/>
<rect x="40.0" y="376.0" width="330.0" height="76.0" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
<text x="56.0" y="404.0" font-size="14.5" font-weight="800" fill="#d29922" text-anchor="start">Liquidity</text>
<text x="56.0" y="428.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Phía nào vừa bị lấy? phía nào còn nguyên?</text>
<line x1="372.0" y1="414.0" x2="470.0" y2="390.0" stroke="#d29922" stroke-width="1.4" marker-end="url(#md29922)"/>
<rect x="40.0" y="468.0" width="330.0" height="76.0" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
<text x="56.0" y="496.0" font-size="14.5" font-weight="800" fill="#d29922" text-anchor="start">DOL</text>
<text x="56.0" y="520.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Primary/secondary có cơ sở?</text>
<line x1="372.0" y1="506.0" x2="470.0" y2="390.0" stroke="#d29922" stroke-width="1.4" marker-end="url(#md29922)"/>
<rect x="40.0" y="560.0" width="330.0" height="76.0" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="1.6"/>
<text x="56.0" y="588.0" font-size="14.5" font-weight="800" fill="#39c5cf" text-anchor="start">HTF POI</text>
<text x="56.0" y="612.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Giá đang ở/tiến về vùng phản ứng?</text>
<line x1="372.0" y1="598.0" x2="470.0" y2="390.0" stroke="#39c5cf" stroke-width="1.4" marker-end="url(#m39c5cf)"/>
<rect x="470.0" y="300.0" width="230.0" height="180.0" rx="14" fill="#1c2330" stroke="#e3b341" stroke-width="2"/>
<text x="585.0" y="345.0" font-size="13" font-weight="800" fill="#e3b341" text-anchor="middle">TỔNG HỢP</text>
<text x="585.0" y="371.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">Ủng hộ vs mâu thuẫn</text>
<text x="585.0" y="397.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">Thiếu thông tin gì?</text>
<text x="585.0" y="423.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">Điều gì làm sai?</text>
<text x="585.0" y="449.0" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">→ ghi INVALIDATION</text>
<line x1="702.0" y1="390.0" x2="790.0" y2="155.0" stroke="#3fb950" stroke-width="1.6" marker-end="url(#m3fb950)"/>
<rect x="790.0" y="100.0" width="370.0" height="120.0" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="808.0" y="130.0" font-size="17" font-weight="800" fill="#3fb950" text-anchor="start">BULLISH</text>
<text x="808.0" y="156.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Structure tăng + giá ở discount/POI</text>
<text x="808.0" y="177.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">+ DOL phía trên có cơ sở</text>
<text x="808.0" y="198.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Chỉ xét LONG; tìm H1 setup</text>
<line x1="702.0" y1="390.0" x2="790.0" y2="295.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#mf85149)"/>
<rect x="790.0" y="240.0" width="370.0" height="120.0" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="808.0" y="270.0" font-size="17" font-weight="800" fill="#f85149" text-anchor="start">BEARISH</text>
<text x="808.0" y="296.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Structure giảm + giá ở premium/POI</text>
<text x="808.0" y="317.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">+ DOL phía dưới có cơ sở</text>
<text x="808.0" y="338.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Chỉ xét SHORT; tìm H1 setup</text>
<line x1="702.0" y1="390.0" x2="790.0" y2="435.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m8b949e)"/>
<rect x="790.0" y="380.0" width="370.0" height="120.0" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="808.0" y="410.0" font-size="17" font-weight="800" fill="#8b949e" text-anchor="start">NEUTRAL</text>
<text x="808.0" y="436.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Không đủ swing rõ / giá ở EQ /</text>
<text x="808.0" y="457.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">không DOL nổi trội</text>
<text x="808.0" y="478.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Đứng ngoài, viết kịch bản 'nếu…thì…'</text>
<line x1="702.0" y1="390.0" x2="790.0" y2="575.0" stroke="#f0883e" stroke-width="1.6" marker-end="url(#mf0883e)"/>
<rect x="790.0" y="520.0" width="370.0" height="120.0" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
<text x="808.0" y="550.0" font-size="17" font-weight="800" fill="#f0883e" text-anchor="start">CONFLICTING</text>
<text x="808.0" y="576.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Structure một hướng, location/DOL</text>
<text x="808.0" y="597.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">hướng kia (vd bullish nhưng ở premium)</text>
<text x="808.0" y="618.0" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ Chờ giá về vị trí, hoặc đứng ngoài</text>
<rect x="40.0" y="668.0" width="1120.0" height="128.0" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
<text x="52.0" y="690.0" font-size="14" font-weight="700" fill="#bc8cff" text-anchor="start">Bias ≠ DOL ≠ Setup ≠ Entry direction</text>
<text x="52.0" y="710.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Bias: hướng được phép xét (D1).   • DOL: nơi giá có thể bị hút tới (mục tiêu giả thuyết).   • Setup: cơ hội cụ thể tại POI (H1).</text>
<text x="52.0" y="734.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Entry direction: hướng lệnh tại thời điểm thực thi (M5) — thường trùng bias, nhưng countertrend là MỘT MÔ HÌNH KHÁC, phải spec riêng.</text>
<text x="52.0" y="758.3" font-size="12.6" font-weight="400" fill="#e6edf3" text-anchor="start">• Chấm bias bằng 'hôm nay nến D1 đóng đúng hướng không' = outcome bias. Chấm bằng: setup được phép có expectancy tốt hơn setup bị chặn không? [BACKTEST REQUIRED]</text></svg>