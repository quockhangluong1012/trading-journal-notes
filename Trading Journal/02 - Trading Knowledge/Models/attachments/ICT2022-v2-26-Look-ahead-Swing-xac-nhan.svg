<text x="600.0" y="38.0" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">Look-ahead bias — một swing chỉ được xác nhận SAU khi các nến bên phải đã đóng</text>
<text x="600.0" y="64.0" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="middle">Fractal 2L2R: swing high tại nến t chỉ biết chắc khi nến t+2 đóng. Dùng nó tại nến t = dùng dữ liệu tương lai.</text>
<text x="600.0" y="706.0" font-size="11.5" font-weight="400" fill="#484f58" text-anchor="middle" font-style="italic">Sơ đồ minh họa khái niệm — dữ liệu giá giả lập, không phải chart thật</text>
