<text x="52.0" y="567.0" font-size="14" font-weight="700" fill="#f0883e" text-anchor="start">Ba nguồn look-ahead phổ biến trong backtest ICT thủ công</text>
<text x="52.0" y="587.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">① Swing/ITH được 'nhìn thấy' trước khi các nến xác nhận đóng (như hình).   ② Chọn dealing range/DOL sau khi đã thấy giá đi tới đâu.</text>
<text x="52.0" y="613.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">③ Sweep extreme dùng mức thấp nhất của cả đoạn — kể cả nến sau thời điểm entry (01c §4.6 ghi nhận một lỗi như vậy tạo 'edge' +0.10R trên dữ liệu ngẫu nhiên).</text>
<text x="52.0" y="639.3" font-size="12.4" font-weight="400" fill="#e6edf3" text-anchor="start">Cách chặn: (a) định nghĩa swing bằng số nến xác nhận cố định; (b) mọi đối tượng có 'confirmed_at'; (c) replay từng nến; (d) ghi ảnh chụp có timestamp trước sự kiện.</text></svg>