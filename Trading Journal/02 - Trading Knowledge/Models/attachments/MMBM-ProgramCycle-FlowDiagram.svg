<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">MMBM — Chu kỳ Sell Program → Smart Money Low → Buy Program</text>

<!-- Original consolidation box -->
<rect x="48" y="70" width="150" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
<text x="123" y="98" font-size="13" fill="#e5e7eb" text-anchor="middle">Original</text>
<text x="123" y="112" font-size="13" fill="#e5e7eb" text-anchor="middle">Consolidation</text>

<!-- Sell program red zone -->
<rect x="48" y="130" width="430" height="300" fill="rgba(239,68,68,0.08)"/>
<text x="60" y="150" font-size="13" fill="#f87171">Sell Program — Nửa A</text>

<!-- step down staircase -->
<polyline points="90,130 170,130 170,190 250,190 250,250 330,250 330,310 410,310 410,370 470,370" fill="none" stroke="#ef4444" stroke-width="2.5"/>
<text x="150" y="180" font-size="12" fill="#94a3b8">LRS 1</text>
<text x="230" y="240" font-size="12" fill="#94a3b8">LRS 2</text>
<text x="310" y="300" font-size="12" fill="#94a3b8">LRS 3</text>

<!-- SSL line -->
<line x1="48" y1="390" x2="500" y2="390" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="405" font-size="13" fill="#eab308">SSL</text>

<!-- sweep arrow -->
<defs>
  <marker id="arrOrangeMMBM1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/>
  </marker>
</defs>
<line x1="470" y1="370" x2="470" y2="405" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOrangeMMBM1)"/>

<!-- Smart Money Low circle -->
<circle cx="470" cy="405" r="26" fill="none" stroke="#4ade80" stroke-width="2.5"/>
<text x="470" y="450" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">Smart Money Low</text>

<!-- MSS tăng line -->
<line x1="470" y1="300" x2="620" y2="300" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="620" y="296" font-size="12" fill="#a855f7">MSS tăng</text>

<!-- bounce arrow up -->
<defs>
  <marker id="arrGreenMMBM1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
    <path d="M0,6 L6,3 L0,0 Z" fill="#4ade80"/>
  </marker>
</defs>
<line x1="470" y1="405" x2="500" y2="300" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrGreenMMBM1)"/>

<!-- Buy program green zone -->
<rect x="500" y="90" width="410" height="330" fill="rgba(34,197,94,0.08)"/>
<text x="770" y="150" font-size="13" fill="#4ade80">Buy Program — Nửa B</text>

<!-- step up staircase -->
<polyline points="500,300 560,300 560,250 630,250 630,200 700,200 700,150 780,150 780,110 850,110" fill="none" stroke="#22c55e" stroke-width="2.5"/>
<text x="565" y="240" font-size="12" fill="#94a3b8">LRB 1</text>
<text x="635" y="190" font-size="12" fill="#94a3b8">LRB 2</text>
<text x="705" y="140" font-size="12" fill="#94a3b8">LRB 3</text>

<!-- BSL target line -->
<line x1="500" y1="90" x2="910" y2="90" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="670" y="82" font-size="11" fill="#eab308">BSL / Original Consolidation (Target)</text>

<!-- Legend -->
<rect x="700" y="440" width="12" height="12" fill="#ef4444"/>
<text x="718" y="450" font-size="12" fill="#94a3b8">Sell Program</text>
<rect x="700" y="460" width="12" height="12" fill="#22c55e"/>
<text x="718" y="470" font-size="12" fill="#94a3b8">Buy Program</text>
<rect x="700" y="480" width="12" height="2" fill="#eab308"/>
<text x="718" y="486" font-size="12" fill="#94a3b8">Liquidity pool (SSL/BSL)</text>

<text x="480" y="560" font-size="12" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa cấu trúc mô hình — không phải chart giá thật</text>
</svg>
