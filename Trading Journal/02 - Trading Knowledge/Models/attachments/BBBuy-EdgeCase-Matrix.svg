<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="400" rx="12" fill="#0d1117"/>
<text x="32" y="30" font-size="18" font-weight="700" fill="#e5e7eb" text-anchor="start">Edge case ①–⑥ — Bread and Butter Buy</text>

<!-- Cell 1 -->
<rect x="24" y="48" width="296" height="105" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="40" y="68" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">① Sai timezone</text>
<text x="40" y="86" font-size="11.5" fill="#94a3b8" text-anchor="start">Đổi giờ mùa hè NY/London lệch</text>
<text x="40" y="102" font-size="11.5" fill="#94a3b8" text-anchor="start">→ vào lệnh trật giờ Judas thật</text>
<text x="40" y="118" font-size="11.5" fill="#94a3b8" text-anchor="start">Xử lý: luôn quy đổi theo NY,</text>
<text x="40" y="134" font-size="11.5" fill="#94a3b8" text-anchor="start">kiểm tra DST 2 lần/năm</text>

<!-- Cell 2 -->
<rect x="332" y="48" width="296" height="105" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="348" y="68" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">② Long không có bullish bias</text>
<text x="348" y="86" font-size="11.5" fill="#94a3b8" text-anchor="start">HTF trung tính/giảm nhưng vẫn</text>
<text x="348" y="102" font-size="11.5" fill="#94a3b8" text-anchor="start">long tại discount vì "đúng vùng"</text>
<text x="348" y="118" font-size="11.5" fill="#94a3b8" text-anchor="start">Xử lý: bias D1/H4 là điều kiện</text>
<text x="348" y="134" font-size="11.5" fill="#94a3b8" text-anchor="start">tiên quyết, không thương lượng</text>

<!-- Cell 3 -->
<rect x="640" y="48" width="296" height="105" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="656" y="68" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">③ Bỏ qua xác nhận 5m MSS</text>
<text x="656" y="86" font-size="11.5" fill="#94a3b8" text-anchor="start">Long ngay khi giá chạm vùng</text>
<text x="656" y="102" font-size="11.5" fill="#94a3b8" text-anchor="start">discount, không chờ đảo cấu trúc</text>
<text x="656" y="118" font-size="11.5" fill="#94a3b8" text-anchor="start">Xử lý: chạm discount = chờ,</text>
<text x="656" y="134" font-size="11.5" fill="#94a3b8" text-anchor="start">MSS xác nhận = trigger thật</text>

<!-- Cell 4 -->
<rect x="24" y="165" width="296" height="105" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="40" y="185" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">④ Target tham lam</text>
<text x="40" y="203" font-size="11.5" fill="#94a3b8" text-anchor="start">Giữ lệnh qua target 15–30 pip</text>
<text x="40" y="219" font-size="11.5" fill="#94a3b8" text-anchor="start">chờ thêm → giá hồi ngược premium</text>
<text x="40" y="235" font-size="11.5" fill="#94a3b8" text-anchor="start">Xử lý: chốt theo kế hoạch,</text>
<text x="40" y="251" font-size="11.5" fill="#94a3b8" text-anchor="start">runner nhỏ nếu có PD array kế tiếp</text>

<!-- Cell 5 -->
<rect x="332" y="165" width="296" height="105" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="348" y="185" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">⑤ Ép London Close ngày nào cũng có</text>
<text x="348" y="203" font-size="11.5" fill="#94a3b8" text-anchor="start">Setup ngược khó nhất bị ép giao dịch</text>
<text x="348" y="219" font-size="11.5" fill="#94a3b8" text-anchor="start">dù thiếu điều kiện đồng thuận 2 phiên</text>
<text x="348" y="235" font-size="11.5" fill="#94a3b8" text-anchor="start">Xử lý: bỏ qua nếu London+NY</text>
<text x="348" y="251" font-size="11.5" fill="#94a3b8" text-anchor="start">chưa đồng tăng rõ ràng</text>

<!-- Cell 6 -->
<rect x="640" y="165" width="296" height="105" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="656" y="185" font-size="13" font-weight="700" fill="#f87171" text-anchor="start">⑥ NQ/XAU whipsaw tin tức</text>
<text x="656" y="203" font-size="11.5" fill="#94a3b8" text-anchor="start">Judas swing giả do spike tin tức,</text>
<text x="656" y="219" font-size="11.5" fill="#94a3b8" text-anchor="start">MSS bị quét ngược ngay sau đó</text>
<text x="656" y="235" font-size="11.5" fill="#94a3b8" text-anchor="start">Xử lý: tránh 15 phút quanh tin,</text>
<text x="656" y="251" font-size="11.5" fill="#94a3b8" text-anchor="start">giảm size với NQ/XAU high-impact</text>

<rect x="24" y="290" width="912" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="40" y="312" font-size="12.5" font-weight="700" fill="#e5e7eb" text-anchor="start">Điểm chung của cả 6 lỗi</text>
<text x="40" y="332" font-size="12" fill="#94a3b8" text-anchor="start">Phần lớn lỗi đến từ việc bỏ qua điều kiện tiên quyết (bias, timezone, MSS) hoặc phá vỡ kỷ luật quản trị</text>
<text x="40" y="350" font-size="12" fill="#94a3b8" text-anchor="start">rủi ro (target, ép giao dịch, tin tức) — không phải do mô hình IPDA sai, mà do thực thi sai quy trình</text>
<text x="40" y="368" font-size="11.5" fill="#94a3b8" text-anchor="start">Xem thêm 6 edge case ⑦–⑫ tại BBBuy-EdgeCase-Matrix2.svg</text>
</svg>
