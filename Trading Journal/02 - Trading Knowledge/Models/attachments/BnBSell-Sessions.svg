<text x="560" y="240" font-size="11" fill="#94a3b8" text-anchor="middle">+ đã chạm HTF discount</text>

<!-- Asia Open block -->
<rect x="730" y="150" width="180" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
