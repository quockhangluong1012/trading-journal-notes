<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="480" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Vì sao Unicorn hoạt động — cơ chế hai lực</text>
<defs>
<marker id="arrBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
</marker>
<marker id="arrPink" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#ec4899"/>
</marker>
</defs>
<rect x="80" y="140" width="320" height="160" rx="10" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="1.5"/>
<text x="240.0" y="192.7" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">🧲 Lực 1 — FVG</text>
<text x="240.0" y="210.89999999999998" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">Rebalance imbalance</text>
<text x="240.0" y="229.1" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">"Nam châm" kéo giá hồi về</text>
<text x="240.0" y="247.29999999999998" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">vùng bị bỏ qua</text>
<rect x="560" y="140" width="320" height="160" rx="10" fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1.5"/>
<text x="720.0" y="192.7" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">🧱 Lực 2 — Breaker</text>
<text x="720.0" y="210.89999999999998" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">Dấu chân tổ chức</text>
<text x="720.0" y="229.1" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">"Bức tường" hỗ trợ/</text>
<text x="720.0" y="247.29999999999998" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="middle">kháng cự cấu trúc</text>
<line x1="240" y1="300" x2="420" y2="340" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrBlue)"/>
<line x1="720" y1="300" x2="540" y2="340" stroke="#ec4899" stroke-width="3" marker-end="url(#arrPink)"/>
<rect x="380" y="360" width="200" height="70" fill="rgba(168,85,247,0.30)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="480" y="390" font-size="16" font-weight="700" fill="#a855f7" text-anchor="middle">Vùng UNICORN</text>
<text x="480" y="410" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Hai lực cộng dồn → không cộng tuyến tính</text>
<text x="480" y="470" font-size="13" font-weight="400" fill="#e5e7eb" text-anchor="middle">Xác suất phản ứng cộng dồn tại 1 điểm giá →</text>
<text x="480" y="490" font-size="13" font-weight="700" fill="#e5e7eb" text-anchor="middle">cho phép Stop chặt hơn + RR lớn hơn</text>
<text x="480" y="540" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">Điều kiện: Breaker &amp; FVG phải sinh từ CÙNG một cú displacement/MSS để hai lực thật sự chung một câu chuyện.</text>
<text x="480" y="560" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Sơ đồ khái niệm minh họa cơ chế — không phải chart giá thật.</text>
</svg>
