<text x="80" y="524" font-size="12" fill="#e5e7eb" text-anchor="start">Power of 3 nén vào 1 tuần: Accumulation (Mon–Thu) → Manipulation (sweep tại tin) → Distribution (sau sweep).</text>
<text x="80" y="546" font-size="12" fill="#94a3b8" text-anchor="start">Cả 2 phía range đều bị quét trước khi move thật xảy ra — đây là lý do gọi "Seek and Destroy".</text>
