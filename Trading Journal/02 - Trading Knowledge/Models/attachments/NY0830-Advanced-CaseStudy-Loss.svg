<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="560" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="18" font-weight="700" fill="#f87171" text-anchor="start">Case 2 — Loss: front-run vào ngay sau raid, CHƯA có MSS</text>
<line x1="24" y1="80" x2="936" y2="80" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="160" x2="936" y2="160" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="240" x2="936" y2="240" stroke="#1f2937" stroke-width="1"/>
<line x1="24" y1="320" x2="936" y2="320" stroke="#1f2937" stroke-width="1"/>
<!-- build up relative equal highs -->
<line x1="80" y1="230" x2="80" y2="270" stroke="#9ca3af" stroke-width="1.5"/><rect x="74" y="235" width="12" height="25" fill="#22c55e"/>
<line x1="120" y1="220" x2="120" y2="265" stroke="#9ca3af" stroke-width="1.5"/><rect x="114" y="225" width="12" height="25" fill="#22c55e"/>
<line x1="95" y1="218" x2="150" y2="220" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<!-- raid up -->
<line x1="180" y1="150" x2="180" y2="255" stroke="#9ca3af" stroke-width="1.5"/><rect x="174" y="210" width="12" height="30" fill="#ef4444"/>
<path d="M180,160 L215,135" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrL1)"/>
<text x="220" y="130" font-size="11" fill="#f97316" text-anchor="start">Raid BSL sau 08:30</text>
<!-- premature entry (no MSS) -->
<path d="M186,190 L230,190" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#arrL2)" stroke-dasharray="4 2"/>
<text x="235" y="186" font-size="11" fill="#f87171" text-anchor="start">SELL ngay — CHƯA MSS</text>
<!-- price continues up, no reversal -->
<line x1="260" y1="200" x2="260" y2="260" stroke="#9ca3af" stroke-width="1.5"/><rect x="254" y="210" width="12" height="40" fill="#22c55e"/>
<line x1="300" y1="150" x2="300" y2="210" stroke="#9ca3af" stroke-width="1.5"/><rect x="294" y="160" width="12" height="40" fill="#22c55e"/>
<line x1="340" y1="100" x2="340" y2="165" stroke="#9ca3af" stroke-width="1.5"/><rect x="334" y="110" width="12" height="45" fill="#22c55e"/>
<line x1="380" y1="70" x2="380" y2="120" stroke="#9ca3af" stroke-width="1.5"/><rect x="374" y="80" width="12" height="35" fill="#22c55e"/>
<!-- stop hit line -->
<line x1="180" y1="205" x2="380" y2="205" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2"/>
<text x="390" y="209" font-size="11" fill="#f87171" text-anchor="start">Stop bị quét — giá phá luôn đỉnh</text>
<defs>
<marker id="arrL1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker>
<marker id="arrL2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker>
</defs>
<rect x="60" y="360" width="840" height="150" rx="8" fill="rgba(248,113,113,0.08)" stroke="#f87171" stroke-width="1.5"/>
<text x="480" y="388" font-size="13" fill="#f87171" font-weight="700" text-anchor="middle">missing_step: mss</text>
<text x="90" y="416" font-size="12" fill="#e5e7eb" text-anchor="start">Chuỗi (gãy): thấy giá raid relative equal highs là vào SELL ngay, chưa chờ MSS.</text>
<text x="90" y="438" font-size="12" fill="#e5e7eb" text-anchor="start">Giá tiếp tục lên phá đỉnh (raid chưa "cam kết" hướng) và quét stop.</text>
<text x="90" y="466" font-size="12" fill="#94a3b8" text-anchor="start">Kết quả minh họa: -1R. Bài học: raid chỉ là mồi; MSS + displacement mới xác nhận hướng thật.</text>
<text x="90" y="488" font-size="12" fill="#94a3b8" text-anchor="start">Không có displacement, không có PD array, không có edge — đây là entry đoán mò, không phải setup.</text>
</svg>
