<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="500" rx="12" fill="#0d1117"/>
<text x="480" y="32" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Spread giãn tại London Open / Rollover 5PM NY — SL bị quét oan</text>
<line x1="60" y1="400" x2="900" y2="400" stroke="#334155" stroke-width="1.5"/>
<line x1="130" y1="395" x2="130" y2="405" stroke="#94a3b8" stroke-width="1.5"/>
<text x="130" y="420" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">09:00 VN</text>
<text x="130" y="434" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle">(Á muộn)</text>
<line x1="350" y1="395" x2="350" y2="405" stroke="#94a3b8" stroke-width="1.5"/>
<text x="350" y="420" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">14:00 VN</text>
<text x="350" y="434" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle">(London Open)</text>
<line x1="570" y1="395" x2="570" y2="405" stroke="#94a3b8" stroke-width="1.5"/>
<text x="570" y="420" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">21:00 VN</text>
<text x="570" y="434" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle">(NY AM)</text>
<line x1="790" y1="395" x2="790" y2="405" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790" y="420" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">04:00 VN</text>
<text x="790" y="434" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle">(Rollover 5PM NY)</text>
<rect x="114" y="350.0" width="32" height="30.0" fill="#4ade80" fill-opacity="0.55" stroke="#4ade80" stroke-width="1.5"/>
<text x="130" y="342.0" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">~1 pip</text>
<rect x="334" y="275.0" width="32" height="105.0" fill="#f87171" fill-opacity="0.55" stroke="#f87171" stroke-width="1.5"/>
<text x="350" y="267.0" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">~3.5 pip (giãn)</text>
<rect x="554" y="344.0" width="32" height="36.0" fill="#4ade80" fill-opacity="0.55" stroke="#4ade80" stroke-width="1.5"/>
<text x="570" y="336.0" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">~1.2 pip</text>
<rect x="774" y="260.0" width="32" height="120.0" fill="#f87171" fill-opacity="0.55" stroke="#f87171" stroke-width="1.5"/>
<text x="790" y="252.0" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">~4 pip (giãn)</text>
<rect x="270" y="130" width="180" height="80" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
<text x="282" y="152" font-size="11.5" font-weight="400" fill="#f87171" text-anchor="start">SL tính theo giá MID</text>
<text x="282" y="168" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">nhưng khớp theo giá ASK/BID</text>
<text x="282" y="184" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">→ spread giãn = SL bị quét</text>
<text x="282" y="200" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">dù giá thị trường chưa thật sự</text>
<text x="480" y="470" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Bài học: nới buffer SL hoặc tránh đặt lệnh mới trong 2-3 phút quanh giờ mở phiên/rollover.</text>
</svg>
