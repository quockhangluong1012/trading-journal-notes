<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="start">Lịch ngoại lệ — Các loại thứ Sáu</text>
<!-- calendar grid 5 cols x 4 rows of Fridays representation: simplified as 4 weeks x 7 days -->
<!-- Header days -->
<text x="102" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">T2</text>
<text x="222" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">T3</text>
<text x="342" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">T4</text>
<text x="462" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">T5</text>
<text x="582" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">T6</text>
<text x="702" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">T7</text>
<text x="822" y="76" font-size="12" fill="#94a3b8" text-anchor="middle">CN</text>
<!-- 4 week rows, each 60px, only draw Friday col highlighted with type -->
<!-- generic grid cells -->
<!-- Week 1: normal Friday (green) -->
<rect x="42" y="88" width="876" height="80" fill="none" stroke="#1f2937" stroke-width="1"/>
<rect x="542" y="88" width="80" height="80" fill="rgba(34,197,94,0.18)" stroke="#4ade80" stroke-width="2"/>
<text x="582" y="112" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">Thứ Sáu</text>
<text x="582" y="130" font-size="11" fill="#4ade80" text-anchor="middle">thường</text>
<text x="582" y="148" font-size="10" fill="#94a3b8" text-anchor="middle">Reversion áp dụng</text>
<!-- Week 2: NFP Friday (orange) -->
<rect x="42" y="176" width="876" height="80" fill="none" stroke="#1f2937" stroke-width="1"/>
<rect x="542" y="176" width="80" height="80" fill="rgba(249,115,22,0.18)" stroke="#f97316" stroke-width="2"/>
<text x="582" y="200" font-size="12" font-weight="700" fill="#f97316" text-anchor="middle">📢 NFP/CPI</text>
<text x="582" y="218" font-size="11" fill="#f97316" text-anchor="middle">/FOMC</text>
<text x="582" y="236" font-size="10" fill="#94a3b8" text-anchor="middle">Ngày tin — gác giả định</text>
<!-- Week 3: month-end/quarter-end/expiry Friday (purple) -->
<rect x="42" y="264" width="876" height="80" fill="none" stroke="#1f2937" stroke-width="1"/>
<rect x="542" y="264" width="80" height="80" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="2"/>
<text x="582" y="288" font-size="12" font-weight="700" fill="#a855f7" text-anchor="middle">⏳ Month/Q-end</text>
<text x="582" y="306" font-size="11" fill="#a855f7" text-anchor="middle">/ đáo hạn</text>
<text x="582" y="324" font-size="10" fill="#94a3b8" text-anchor="middle">Rebalancing flows</text>
<!-- Week 4: normal Friday again (green) -->
<rect x="42" y="352" width="876" height="80" fill="none" stroke="#1f2937" stroke-width="1"/>
<rect x="542" y="352" width="80" height="80" fill="rgba(34,197,94,0.18)" stroke="#4ade80" stroke-width="2"/>
<text x="582" y="376" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">Thứ Sáu</text>
<text x="582" y="394" font-size="11" fill="#4ade80" text-anchor="middle">thường</text>
<text x="582" y="412" font-size="10" fill="#94a3b8" text-anchor="middle">Reversion áp dụng</text>
<!-- Legend -->
<rect x="60" y="460" width="16" height="16" fill="rgba(34,197,94,0.18)" stroke="#4ade80" stroke-width="1.5"/>
<text x="84" y="473" font-size="13" fill="#e5e7eb" text-anchor="start">Thứ Sáu thường — áp giả định reversion bình thường</text>
<rect x="60" y="490" width="16" height="16" fill="rgba(249,115,22,0.18)" stroke="#f97316" stroke-width="1.5"/>
<text x="84" y="503" font-size="13" fill="#e5e7eb" text-anchor="start">Thứ Sáu có tin lớn (NFP/CPI/FOMC) — xử lý như ngày tin</text>
<rect x="60" y="520" width="16" height="16" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="1.5"/>
<text x="84" y="533" font-size="13" fill="#e5e7eb" text-anchor="start">Month-end/quarter-end/đáo hạn phái sinh — hạ độ tin cậy</text>
<text x="32" y="576" font-size="12" fill="#94a3b8" text-anchor="start">Sơ đồ khái niệm minh họa các ngoại lệ lịch, không phải chart giá thật.</text>
</svg>
