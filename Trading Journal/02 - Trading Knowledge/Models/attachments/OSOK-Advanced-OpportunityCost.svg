<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="440" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Chi phí cơ hội của tần suất thấp (1 setup/tuần)</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Sơ đồ minh họa khái niệm phản biện, không phải dữ liệu giá thật</text>

  <line x1="60" y1="380" x2="920" y2="380" stroke="#334155" stroke-width="2"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="400">Tuần 1</text>
    <text x="400" y="400">Tuần 2</text>
    <text x="600" y="400">Tuần 3</text>
    <text x="800" y="400">Tuần 4</text>
  </g>

  <!-- OSOK: 1 trade per week taken, others visible but skipped -->
  <text x="60" y="110" font-size="13" fill="#3b82f6" font-weight="700">OSOK — 1 setup A+/tuần</text>
  <circle cx="200" cy="150" r="9" fill="#4ade80"/>
  <circle cx="400" cy="230" r="7" fill="#94a3b8" opacity="0.4"/><text x="400" y="215" font-size="10" fill="#94a3b8" text-anchor="middle">setup B bỏ qua</text>
  <circle cx="600" cy="150" r="9" fill="#4ade80"/>
  <circle cx="800" cy="230" r="7" fill="#94a3b8" opacity="0.4"/><text x="800" y="215" font-size="10" fill="#94a3b8" text-anchor="middle">setup B bỏ qua</text>

  <!-- Comparison: higher-frequency model captures more setups -->
  <text x="60" y="290" font-size="13" fill="#a855f7" font-weight="700">Model tần suất cao hơn (giả định cùng winrate/R)</text>
  <circle cx="200" cy="330" r="7" fill="#4ade80"/>
  <circle cx="260" cy="330" r="7" fill="#4ade80"/>
  <circle cx="400" cy="330" r="7" fill="#4ade80"/>
  <circle cx="460" cy="330" r="7" fill="#ef4444"/>
  <circle cx="600" cy="330" r="7" fill="#4ade80"/>
  <circle cx="660" cy="330" r="7" fill="#4ade80"/>
  <circle cx="800" cy="330" r="7" fill="#4ade80"/>
  <circle cx="860" cy="330" r="7" fill="#ef4444"/>

  <rect x="60" y="80" width="840" height="0" fill="none"/>
  <rect x="500" y="90" width="400" height="90" rx="8" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="700" y="115" font-size="12.5" fill="#f87171" text-anchor="middle" font-weight="700">Câu hỏi chưa có câu trả lời chắc chắn</text>
  <text x="700" y="138" font-size="11.5" fill="#e5e7eb" text-anchor="middle">Setup "B" bị bỏ qua mỗi tuần — nếu chúng có</text>
  <text x="700" y="156" font-size="11.5" fill="#e5e7eb" text-anchor="middle">kỳ vọng dương (dù nhỏ), OSOK đang từ bỏ EV thực</text>
  <text x="700" y="174" font-size="11" fill="#94a3b8" text-anchor="middle">để đổi lấy ít quyết định hơn — chưa được đo lường.</text>
</svg>
