<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="600" rx="12" fill="#0d1117"/>
<text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Ví dụ đúng — Sweep SSL → MSS → vào Buy tại FVG của LRB1</text>

<!-- discount/premium bands -->
<rect x="48" y="60" width="864" height="180" fill="rgba(239,68,68,0.08)"/>
<rect x="48" y="240" width="864" height="260" fill="rgba(34,197,94,0.08)"/>
<line x1="48" y1="240" x2="912" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="860" y="235" font-size="12" fill="#38bdf8">CE/50%</text>

<!-- down leg -->
<rect x="90" y="150" width="12" height="55" fill="#ef4444"/><line x1="96" y1="140" x2="96" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="120" y="180" width="12" height="60" fill="#ef4444"/><line x1="126" y1="168" x2="126" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="150" y="220" width="12" height="65" fill="#ef4444"/><line x1="156" y1="205" x2="156" y2="295" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="180" y="255" width="12" height="90" fill="#ef4444"/><line x1="186" y1="240" x2="186" y2="360" stroke="#9ca3af" stroke-width="1.5"/>

<!-- SSL -->
<line x1="48" y1="360" x2="500" y2="360" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="374" font-size="12" fill="#eab308">SSL</text>

<!-- sweep candle -->
<defs><marker id="arrOMMBM3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/></marker></defs>
<rect x="210" y="330" width="14" height="60" fill="#22c55e"/><line x1="217" y1="310" x2="217" y2="410" stroke="#9ca3af" stroke-width="1.5"/>
<path d="M280,440 C250,430 230,410 220,395" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrOMMBM3)"/>
<text x="255" y="455" font-size="12" fill="#f97316">Sweep SSL</text>

<!-- MSS -->
<line x1="150" y1="205" x2="360" y2="205" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
<text x="365" y="201" font-size="12" fill="#a855f7">MSS (đóng nến trên swing high)</text>

<!-- displacement + FVG (LRB1) -->
<rect x="250" y="140" width="16" height="180" fill="#22c55e"/><line x1="258" y1="130" x2="258" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="280" y="90" width="16" height="180" fill="#22c55e"/><line x1="288" y1="80" x2="288" y2="278" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="310" y="60" width="16" height="150" fill="#22c55e"/><line x1="318" y1="50" x2="318" y2="215" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="250" y="150" width="76" height="60" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-dasharray="4 3"/>
<text x="256" y="178" font-size="12" fill="#93c5fd">FVG LRB1</text>

<!-- entry marker -->
<circle cx="288" cy="180" r="6" fill="#4ade80"/>
<text x="330" y="440" font-size="12" fill="#4ade80">Entry Buy tại 50% FVG LRB1, SL dưới Smart Money Low</text>
<text x="330" y="460" font-size="12" fill="#4ade80">TP tại BSL / vùng Original Consolidation</text>

<!-- BSL target -->
<line x1="48" y1="90" x2="912" y2="90" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="84" font-size="12" fill="#eab308">BSL (mục tiêu)</text>

<!-- continuation up -->
<polyline points="326,140 400,120 480,100 560,90" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>

<text x="480" y="565" font-size="12" fill="#94a3b8" text-anchor="middle">Chart minh họa khái niệm, không phải dữ liệu giao dịch thật</text>
</svg>
