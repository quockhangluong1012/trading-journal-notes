<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#0d1117"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#e5e7eb">Rủi ro lệch giờ do DST — Mỹ vs Châu Âu đổi giờ không cùng ngày</text>
  <text x="32" y="58" font-size="12" fill="#94a3b8">Sơ đồ minh họa khái niệm, không phải dữ liệu giá thật</text>

  <line x1="60" y1="330" x2="920" y2="330" stroke="#334155" stroke-width="2"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="350">Giữa tháng 3</text>
    <text x="500" y="350">Cuối tháng 3</text>
    <text x="800" y="350">Đầu tháng 11</text>
  </g>

  <rect x="120" y="150" width="200" height="50" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="220" y="180" font-size="12" fill="#e5e7eb" text-anchor="middle">US chưa đổi DST</text>

  <rect x="380" y="150" width="200" height="50" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="480" y="180" font-size="12" fill="#f97316" text-anchor="middle">US đổi DST (Chủ Nhật 2)</text>

  <rect x="640" y="150" width="200" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="740" y="180" font-size="12" fill="#a855f7" text-anchor="middle">EU đổi DST (cuối tháng 3)</text>

  <rect x="60" y="230" width="840" height="80" rx="8" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="480" y="256" font-size="12.5" fill="#f87171" text-anchor="middle" font-weight="700">Cửa sổ lệch: có ~1–3 tuần mỗi năm (tháng 3 và tháng 11)</text>
  <text x="480" y="278" font-size="12" fill="#e5e7eb" text-anchor="middle">nơi ET và giờ local trader lệch 1 giờ so với công thức quy đổi "mặc định"</text>
  <text x="480" y="298" font-size="11.5" fill="#94a3b8" text-anchor="middle">→ săn nhầm cửa sổ 09:30–10:30 thực tế đã là 10:30–11:30 hoặc ngược lại</text>
</svg>
