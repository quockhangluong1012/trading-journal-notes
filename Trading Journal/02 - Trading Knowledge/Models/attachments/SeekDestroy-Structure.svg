<text x="36" y="388" font-size="10.5" font-weight="700" fill="#111827">Checklist nhận diện sớm</text>
<text x="36" y="405" font-size="9.3" fill="#374151">(1) breakout đầu London/NY đều FAIL &amp; đảo · (2) cả equal highs VÀ equal lows đều bị quét · (3) MSS trên LTF liên tục lật</text>
<text x="36" y="419" font-size="9.3" fill="#374151">(4) không displacement nào giữ được · (5) nến overlap, choppy, ADR co lại · càng nhiều dấu hiệu → càng chắc là S&amp;D.</text>
<text x="24" y="446" font-size="10.5" fill="#6B7280">Ba cú fail liên tiếp đầu phiên là "chuông báo" S&amp;D — chuyển sang chế độ quan sát, đừng coi mỗi cú quét là entry trend.</text>
