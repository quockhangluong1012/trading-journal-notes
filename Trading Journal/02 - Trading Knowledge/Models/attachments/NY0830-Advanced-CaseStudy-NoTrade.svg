<text x="70" y="140" font-size="11.5" fill="#94a3b8" text-anchor="start">08:30: không có tin, không có DOL rõ</text>
<!-- tight range box -->
<rect x="90" y="150" width="350" height="50" fill="rgba(148,163,184,0.10)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="265" y="215" font-size="11" fill="#94a3b8" text-anchor="middle">Đi ngang chặt — không raid sạch biên nào</text>
<!-- X mark for no entry -->
<text x="600" y="180" font-size="60" fill="#f87171" text-anchor="middle" font-weight="700">✕</text>
<text x="600" y="220" font-size="13" fill="#f87171" font-weight="700" text-anchor="middle">Không có setup — đứng ngoài</text>
<rect x="60" y="270" width="840" height="190" rx="8" fill="rgba(74,222,128,0.06)" stroke="#4ade80" stroke-width="1.5"/>
<text x="480" y="298" font-size="13" fill="#4ade80" font-weight="700" text-anchor="middle">Chẩn đoán: thiếu raid + MSS → No-Trade ĐÚNG</text>
<text x="90" y="328" font-size="12" fill="#e5e7eb" text-anchor="start">Chuỗi: ngày không có tin 08:30, không có DOL rõ; sau 08:30 giá đi ngang chặt,</text>
<text x="90" y="350" font-size="12" fill="#e5e7eb" text-anchor="start">không raid sạch biên nào → trader đứng ngoài.</text>
<text x="90" y="380" font-size="12" fill="#94a3b8" text-anchor="start">Bài học: đứng ngoài cũng là một quyết định process A+; bảo toàn vốn cho ngày có</text>
<text x="90" y="402" font-size="12" fill="#94a3b8" text-anchor="start">setup A+ quan trọng hơn việc "phải giao dịch".</text>
<text x="90" y="432" font-size="12" fill="#94a3b8" text-anchor="start">Kết quả minh họa: 0R (không vào lệnh) — vẫn tính là một quan sát hợp lệ trong review tuần.</text>
</svg>
