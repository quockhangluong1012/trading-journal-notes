<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Giải phẫu một Bearish Breakaway Gap</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phiên bản đảo chiều: giá rời vùng đi ngang bằng một khoảng trống đi XUỐNG. Mọi nguyên tắc giống hệt, chỉ đảo hướng.</text>
