<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="780" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế đằng sau Dealing Range: bản đồ lệnh, không phải hình vẽ</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Vì sao hai đầu range + EQ trùng với stop cluster, value area (Auction Theory) và composite operator range (Wyckoff)</text>

<!-- Panel 1: order book at both ends -->
<rect x="40" y="90" width="560" height="310" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="118" font-size="17" fill="#e2e8f0" font-weight="bold">1. Hai đầu range = hai cụm stop thật</text>
<text x="60" y="140" font-size="13" fill="#94a3b8">Đỉnh: buy-stop của short + breakout buy (BSL)</text>
<text x="60" y="158" font-size="13" fill="#94a3b8">Đáy: sell-stop của long + breakout sell (SSL)</text>
<!-- mini candles forming range -->
<rect x="80" y="200" width="14" height="30" fill="#22c55e"/><line x1="87" y1="190" x2="87" y2="235" stroke="#22c55e" stroke-width="2"/>
<rect x="105" y="185" width="14" height="35" fill="#22c55e"/><line x1="112" y1="175" x2="112" y2="225" stroke="#22c55e" stroke-width="2"/>
<rect x="130" y="230" width="14" height="40" fill="#ef4444"/><line x1="137" y1="220" x2="137" y2="275" stroke="#ef4444" stroke-width="2"/>
<rect x="155" y="260" width="14" height="45" fill="#ef4444"/><line x1="162" y1="250" x2="162" y2="310" stroke="#ef4444" stroke-width="2"/>
<line x1="70" y1="182" x2="450" y2="182" stroke="#eab308" stroke-dasharray="5,3" stroke-width="1.5"/>
<text x="460" y="186" font-size="13" fill="#eab308" font-weight="bold">BSL (range high)</text>
<line x1="70" y1="308" x2="450" y2="308" stroke="#eab308" stroke-dasharray="5,3" stroke-width="1.5"/>
<text x="460" y="312" font-size="13" fill="#eab308" font-weight="bold">SSL (range low)</text>
<rect x="70" y="172" width="200" height="12" fill="#eab308" opacity="0.18"/>
<rect x="70" y="308" width="200" height="12" fill="#eab308" opacity="0.18"/>
<text x="60" y="345" font-size="13" fill="#e2e8f0">→ Giá bị hút về hai biên vì đó là nơi lệnh chờ (stop) dày nhất — không phải vì "đường kẻ" có phép thuật.</text>
<text x="60" y="368" font-size="12" fill="#94a3b8">Draw on liquidity = tên ICT gọi cho "nơi có đối tác khớp lệnh dày nhất".</text>
<text x="60" y="388" font-size="12" fill="#94a3b8">Xem [[39 - Draw on Liquidity]] cho cơ chế đầy đủ.</text>

<!-- Panel 2: EQ as value area -->
<rect x="620" y="90" width="540" height="310" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="640" y="118" font-size="17" fill="#e2e8f0" font-weight="bold">2. EQ 50% = value area, không phải Fibonacci ma thuật</text>
<rect x="650" y="150" width="460" height="180" fill="#0f1420" stroke="#334155"/>
<line x1="650" y1="240" x2="1110" y2="240" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3"/>
<text x="1000" y="235" font-size="13" fill="#a78bfa" font-weight="bold">EQ 50%</text>
<rect x="650" y="150" width="460" height="90" fill="#ef4444" opacity="0.12"/>
<text x="660" y="168" font-size="13" fill="#94a3b8">Premium — bên bán có lợi thế</text>
<rect x="650" y="240" width="460" height="90" fill="#22c55e" opacity="0.12"/>
<text x="660" y="326" font-size="13" fill="#94a3b8">Discount — bên mua có lợi thế</text>
<text x="660" y="350" font-size="12" fill="#94a3b8">Auction Market Theory: value area = nơi 2 phía đã đồng thuận từng phần.</text>
<text x="640" y="375" font-size="13" fill="#e2e8f0">→ EQ hoạt động vì là điểm giữa hai mức thị trường ĐÃ TỪ CHỐI, không cần đúng từng tick.</text>

<!-- Bottom: comparison table across markets -->
<rect x="40" y="420" width="1120" height="320" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="450" font-size="17" fill="#e2e8f0" font-weight="bold">3. Hành vi Dealing Range theo loại tài sản</text>
<line x1="60" y1="465" x2="1140" y2="465" stroke="#334155"/>
<text x="60" y="490" font-size="14" fill="#94a3b8" font-weight="bold">Tiêu chí</text>
<text x="330" y="490" font-size="14" fill="#94a3b8" font-weight="bold">FX majors (EURUSD)</text>
<text x="640" y="490" font-size="14" fill="#94a3b8" font-weight="bold">Index futures (NQ/ES)</text>
<text x="940" y="490" font-size="14" fill="#94a3b8" font-weight="bold">Crypto (BTC/ETH)</text>
<line x1="60" y1="502" x2="1140" y2="502" stroke="#1c2333"/>
<text x="60" y="528" font-size="13" fill="#e2e8f0">Độ tôn trọng EQ</text>
<text x="330" y="528" font-size="13" fill="#e2e8f0">Cao — interbank liquidity sâu</text>
<text x="640" y="528" font-size="13" fill="#e2e8f0">Cao trong RTH, nhiễu overnight</text>
<text x="940" y="528" font-size="13" fill="#e2e8f0">Thấp hơn — 24/7, ít phiên nghỉ</text>
<line x1="60" y1="540" x2="1140" y2="540" stroke="#1c2333"/>
<text x="60" y="566" font-size="13" fill="#e2e8f0">Tần suất re-map</text>
<text x="330" y="566" font-size="13" fill="#e2e8f0">Thấp, range bền vài phiên</text>
<text x="640" y="566" font-size="13" fill="#e2e8f0">Trung bình, theo phiên RTH/ETH</text>
<text x="940" y="566" font-size="13" fill="#e2e8f0">Cao — expansion đột ngột do funding/tin</text>
<line x1="60" y1="578" x2="1140" y2="578" stroke="#1c2333"/>
<text x="60" y="604" font-size="13" fill="#e2e8f0">Rủi ro chọn sai range</text>
<text x="330" y="604" font-size="13" fill="#e2e8f0">Chênh feed nhỏ (vài pip)</text>
<text x="640" y="604" font-size="13" fill="#e2e8f0">CFD thiếu đỉnh/đáy overnight CME</text>
<text x="940" y="604" font-size="13" fill="#e2e8f0">Chênh lớn giữa các sàn (Binance/Coinbase)</text>
<line x1="60" y1="616" x2="1140" y2="616" stroke="#1c2333"/>
<text x="60" y="642" font-size="13" fill="#e2e8f0">Khi range mạnh nhất</text>
<text x="330" y="642" font-size="13" fill="#e2e8f0">London/NY overlap</text>
<text x="640" y="642" font-size="13" fill="#e2e8f0">RTH, quanh open/close</text>
<text x="940" y="642" font-size="13" fill="#e2e8f0">Quanh funding time 00:00/08:00/16:00 UTC</text>
<text x="60" y="700" font-size="13" fill="#94a3b8">Kết luận: cơ chế lệnh chờ + value area là phổ quát, nhưng ĐỘ DÀY thanh khoản quyết định range "đáng tin" tới đâu.</text>
<text x="60" y="720" font-size="13" fill="#94a3b8">Thị trường mỏng thanh khoản = range dễ bị phá giả (fakeout) và cần re-map thường xuyên hơn.</text>
</svg>
