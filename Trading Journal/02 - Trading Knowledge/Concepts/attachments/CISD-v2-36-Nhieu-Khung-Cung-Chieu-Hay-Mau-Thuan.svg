<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Nhiều khung cùng lúc: CISD có thể cùng chiều — hoặc mâu thuẫn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi khung có “trạng thái delivery” riêng. Khung nhỏ đổi trạng thái rất thường xuyên; khung lớn hiếm hơn. Khi M5 và H1 mâu thuẫn,</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">hỏi: CISD M5 đang lấy lại chặng NÀO của H1?</text>
