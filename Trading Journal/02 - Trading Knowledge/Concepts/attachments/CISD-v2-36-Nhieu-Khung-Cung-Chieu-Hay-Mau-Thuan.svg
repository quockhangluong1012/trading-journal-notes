<text x="40.0" y="496.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chặng giảm gần nhất của D1 là một nhịp hồi</text>
<text x="40.0" y="512.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">trong xu hướng tăng. D1 chưa có bearish CISD có</text>
<text x="40.0" y="528.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ý nghĩa.</text>
<rect x="346.0" y="450.0" width="300.0" height="93.5" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
