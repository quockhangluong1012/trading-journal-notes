<text x="358.0" y="496.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chặng xuống H1 đang chạy. Mức CISD H1 ở xa</text>
<text x="358.0" y="512.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">phía trên. Cho tới khi H1 ĐÓNG trên mức đó,</text>
<text x="358.0" y="528.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">trạng thái H1 vẫn là xuống.</text>
