<text x="676.0" y="512.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đảo chiều — hoặc chỉ là nhịp hồi trong chặng xuống</text>
<text x="676.0" y="528.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">H1.</text>
<rect x="28.0" y="600.0" width="944.0" height="54.2" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="40.0" y="622.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cách đọc: CISD M5 thuận D1 nhưng ngược trạng thái H1 → không tự động là setup. Hỏi thêm: H1 đã chạm POI chưa? Đã quét thanh khoản chưa? Có cần chờ H1 tự xác</text>
<text x="40.0" y="639.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nhận không? Khung lớn KHÔNG luôn đúng hơn — nhưng khung nhỏ không được bỏ qua khung lớn.</text>
