<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="42" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế orderflow đằng sau AMD: Judas swing = bơm thanh khoản</text>
  <text x="40" y="66" font-size="15" fill="#94a3b8">Vì sao lệnh lớn CẦN một cú quét ngược hướng trước khi phân phối thật</text>

  <!-- lane labels -->
  <text x="40" y="110" font-size="15" fill="#94a3b8">Order book / dealer</text>
  <text x="40" y="360" font-size="15" fill="#94a3b8">Giá (Daily Open = trục giữa)</text>
  <text x="40" y="640" font-size="15" fill="#94a3b8">Auction Market Theory</text>

  <!-- grid -->
  <line x1="40" y1="130" x2="1160" y2="130" stroke="#1c2333" stroke-width="1"/>
  <line x1="40" y1="620" x2="1160" y2="620" stroke="#1c2333" stroke-width="1"/>

  <!-- Daily open reference line -->
  <line x1="90" y1="380" x2="1140" y2="380" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1000" y="373" font-size="14" fill="#eab308">Daily Open</text>

  <!-- Phase 1: accumulation candles -->
  <g>
    <rect x="110" y="360" width="16" height="22" fill="#22c55e"/>
    <line x1="118" y1="352" x2="118" y2="392" stroke="#22c55e" stroke-width="2"/>
    <rect x="140" y="368" width="16" height="18" fill="#ef4444"/>
    <line x1="148" y1="360" x2="148" y2="396" stroke="#ef4444" stroke-width="2"/>
    <rect x="170" y="362" width="16" height="20" fill="#22c55e"/>
    <line x1="178" y1="354" x2="178" y2="392" stroke="#22c55e" stroke-width="2"/>
    <rect x="200" y="366" width="16" height="18" fill="#ef4444"/>
    <line x1="208" y1="358" x2="208" y2="394" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="95" y="345" width="140" height="55" fill="#22c55e" opacity="0.12"/>
  <text x="100" y="410" font-size="14" fill="#e2e8f0">1. Accumulation</text>
  <text x="100" y="428" font-size="13" fill="#94a3b8">Limit order 2 phía gom quanh</text>
  <text x="100" y="444" font-size="13" fill="#94a3b8">open — chưa đủ counterparty</text>

  <!-- order book annotation for phase1 -->
  <rect x="95" y="150" width="140" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="105" y="172" font-size="13" fill="#e2e8f0">Book cân bằng:</text>
  <text x="105" y="190" font-size="13" fill="#94a3b8">bid ≈ ask, spread hẹp</text>
  <text x="105" y="207" font-size="13" fill="#94a3b8">TWAP/VWAP algo âm thầm gom</text>
  <line x1="165" y1="220" x2="165" y2="345" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Phase 2: Judas leg down -->
  <g>
    <rect x="260" y="380" width="16" height="24" fill="#ef4444"/>
    <line x1="268" y1="372" x2="268" y2="440" stroke="#ef4444" stroke-width="2"/>
    <rect x="290" y="404" width="16" height="30" fill="#ef4444"/>
    <line x1="298" y1="396" x2="298" y2="452" stroke="#ef4444" stroke-width="2"/>
    <rect x="320" y="420" width="16" height="20" fill="#ef4444"/>
    <line x1="328" y1="412" x2="328" y2="455" stroke="#ef4444" stroke-width="2"/>
  </g>
  <line x1="245" y1="452" x2="345" y2="452" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="245" y="470" font-size="13" fill="#f97316">Sweep SSL (stop phe mua + sell-breakout)</text>
  <polygon points="345,452 355,447 355,457" fill="#f97316"/>

  <rect x="245" y="490" width="150" height="72" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="255" y="510" font-size="13" fill="#e2e8f0">2. Manipulation (Judas)</text>
  <text x="255" y="528" font-size="13" fill="#94a3b8">Đẩy giá xuống kích hoạt</text>
  <text x="255" y="544" font-size="13" fill="#94a3b8">stop-loss + sell order mới</text>
  <text x="255" y="560" font-size="13" fill="#94a3b8">→ nguồn cung để dealer MUA</text>

  <rect x="245" y="150" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="255" y="172" font-size="13" fill="#e2e8f0">Dealer hedging:</text>
  <text x="255" y="190" font-size="13" fill="#94a3b8">bán ép để lấy fill giá thấp,</text>
  <text x="255" y="207" font-size="13" fill="#94a3b8">nạp inventory trước leg thật</text>
  <line x1="325" y1="220" x2="298" y2="396" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Phase 3: distribution up -->
  <g>
    <rect x="420" y="330" width="18" height="26" fill="#22c55e"/>
    <line x1="429" y1="318" x2="429" y2="368" stroke="#22c55e" stroke-width="2"/>
    <rect x="455" y="290" width="18" height="30" fill="#22c55e"/>
    <line x1="464" y1="278" x2="464" y2="330" stroke="#22c55e" stroke-width="2"/>
    <rect x="490" y="250" width="18" height="30" fill="#22c55e"/>
    <line x1="499" y1="238" x2="499" y2="290" stroke="#22c55e" stroke-width="2"/>
    <rect x="525" y="210" width="18" height="30" fill="#22c55e"/>
    <line x1="534" y1="198" x2="534" y2="250" stroke="#22c55e" stroke-width="2"/>
    <rect x="560" y="175" width="18" height="25" fill="#22c55e"/>
    <line x1="569" y1="165" x2="569" y2="210" stroke="#22c55e" stroke-width="2"/>
  </g>
  <rect x="420" y="130" width="175" height="45" fill="#eab308" opacity="0.15"/>
  <text x="425" y="150" font-size="13" fill="#eab308">BSL target — draw on liquidity</text>
  <text x="425" y="166" font-size="13" fill="#eab308">nơi phân phối chạy tới</text>

  <rect x="420" y="500" width="170" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="430" y="520" font-size="13" fill="#e2e8f0">3. Distribution</text>
  <text x="430" y="538" font-size="13" fill="#94a3b8">Dealer bán ra inventory đã</text>
  <text x="430" y="554" font-size="13" fill="#94a3b8">gom giá thấp → displacement</text>

  <!-- Auction market theory lane -->
  <rect x="95" y="645" width="1050" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="672" font-size="15" fill="#e2e8f0" font-weight="bold">Đối chiếu khung lý thuyết khác</text>
  <text x="115" y="696" font-size="13" fill="#94a3b8">Wyckoff: Accumulation → Spring (=Judas) → Markup. Cùng cơ chế, tên khác.</text>
  <text x="115" y="716" font-size="13" fill="#94a3b8">Auction Market Theory: giá "excess" ra ngoài value area rồi bị từ chối = Judas; "initiative" mới = Distribution.</text>
  <text x="115" y="736" font-size="13" fill="#94a3b8">Orderflow/footprint: cụm delta âm bất thường tại đáy Judas = hấp thụ (absorption) — dấu vết thật của dealer đang mua.</text>
</svg>
