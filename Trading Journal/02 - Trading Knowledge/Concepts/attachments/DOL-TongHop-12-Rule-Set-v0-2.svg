<svg viewBox="0 0 760 640" width="760" height="640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bộ quy tắc DOL v0.2 (hợp nhất): Required · Supporting · Tier · Disqualifying</title>
<desc>Bản đồ bộ quy tắc: R1-R5 bắt buộc, S1-S5 hỗ trợ, phân tier A/B/C, D1-D6 loại trừ, chuỗi trigger M5, invalidation và quản lý lệnh.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Bộ quy tắc DOL v0.2 (hợp nhất): Required · Supporting · Tier · Disqualifying</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Ngưỡng số là [HEURISTIC]. Thiếu Required = không có DOL; dính Disqualifying = không trade.</text>
<rect x="24" y="76" width="352" height="196" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="76" width="352" height="26" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="36" y="94" font-size="12.5" fill="#1F2937" font-weight="700">Bắt buộc (Required)</text>
<text x="36" y="122" font-size="11" fill="#2563EB" font-weight="700">R1</text>
<text x="70" y="122" font-size="10.5" fill="#4B5563">Có dealing range rõ ràng và đã chốt cố định trước</text>
<text x="70" y="136.2" font-size="10.5" fill="#4B5563">phiên.</text>
<text x="36" y="155.39999999999998" font-size="11" fill="#2563EB" font-weight="700">R2</text>
<text x="70" y="155.39999999999998" font-size="10.5" fill="#4B5563">DOL là pool CHƯA TIÊU (chưa bị xuyên ≥ τ), ở khung</text>
<text x="70" y="169.59999999999997" font-size="10.5" fill="#4B5563">≥ khung xác định bias.</text>
<text x="36" y="188.79999999999995" font-size="11" fill="#2563EB" font-weight="700">R3</text>
<text x="70" y="188.79999999999995" font-size="10.5" fill="#4B5563">Đã ghi đối thủ, horizon và invalidation trước thời</text>
<text x="70" y="202.99999999999994" font-size="10.5" fill="#4B5563">điểm khóa.</text>
<text x="36" y="222.19999999999993" font-size="11" fill="#2563EB" font-weight="700">R4</text>
<text x="70" y="222.19999999999993" font-size="10.5" fill="#4B5563">DOL trong tầm với của horizon: ≤ 1.0–1.5 ATR D1</text>
<text x="70" y="236.39999999999992" font-size="10.5" fill="#4B5563">nếu horizon 1–2 ngày.</text>
<text x="36" y="255.5999999999999" font-size="11" fill="#2563EB" font-weight="700">R5</text>
<text x="70" y="255.5999999999999" font-size="10.5" fill="#4B5563">Biết trạng thái con lắc, hoặc ghi rõ “trạng thái</text>
<text x="70" y="269.7999999999999" font-size="10.5" fill="#4B5563">3: chưa có hướng”.</text>
<rect x="384" y="76" width="352" height="196" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="384" y="76" width="352" height="26" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="396" y="94" font-size="12.5" fill="#1F2937" font-weight="700">Hỗ trợ (Supporting) — xếp tier</text>
<text x="396" y="122" font-size="11" fill="#1D9E75" font-weight="700">S1</text>
<text x="430" y="122" font-size="10.5" fill="#4B5563">Displacement cấu trúc hướng về DOL.</text>
<text x="396" y="141.2" font-size="11" fill="#1D9E75" font-weight="700">S2</text>
<text x="430" y="141.2" font-size="10.5" fill="#4B5563">Vị trí premium/discount thuận lợi cho entry.</text>
<text x="396" y="160.39999999999998" font-size="11" fill="#1D9E75" font-weight="700">S3</text>
<text x="430" y="160.39999999999998" font-size="10.5" fill="#4B5563">Đường đi là LRLR (không PD array ngược chiều chưa</text>
<text x="430" y="174.59999999999997" font-size="10.5" fill="#4B5563">mitigate).</text>
<text x="396" y="193.79999999999995" font-size="11" fill="#1D9E75" font-weight="700">S4</text>
<text x="430" y="193.79999999999995" font-size="10.5" fill="#4B5563">Sắp có killzone và không có tin tier-1.</text>
<text x="396" y="212.99999999999994" font-size="11" fill="#1D9E75" font-weight="700">S5</text>
<text x="430" y="212.99999999999994" font-size="10.5" fill="#4B5563">SMT: chỉ để phá thế hòa.</text>
<rect x="24" y="284" width="352" height="178" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="284" width="352" height="26" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.2"/>
<text x="36" y="302" font-size="12.5" fill="#1F2937" font-weight="700">Tier</text>
<circle cx="46" cy="324" r="11" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="46" y="328" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>
<text x="66" y="328" font-size="10.5" fill="#4B5563">R1–R5 + S1 + (S2 hoặc S3), không dính điều</text>
<text x="66" y="342.2" font-size="10.5" fill="#4B5563">kiện loại trừ nào.</text>
<circle cx="46" cy="364.4" r="11" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="46" y="368.4" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">B</text>
<text x="66" y="368.4" font-size="10.5" fill="#4B5563">R1–R5 + một trong S1/S2/S3.</text>
<circle cx="46" cy="390.59999999999997" r="11" fill="#6B7280" stroke="none" stroke-width="1"/>
<text x="46" y="394.59999999999997" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="66" y="394.59999999999997" font-size="10.5" fill="#4B5563">Các trường hợp còn lại: chỉ quan sát, KHÔNG</text>
<text x="66" y="408.79999999999995" font-size="10.5" fill="#4B5563">trade.</text>
<text x="36" y="436" font-size="10.5" fill="#1F2937" font-weight="700">Runner chỉ khi tier A và đường đi LRLR.</text>
<rect x="384" y="284" width="352" height="178" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="384" y="284" width="352" height="26" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="396" y="302" font-size="12.5" fill="#1F2937" font-weight="700">Loại trừ (Disqualifying)</text>
<text x="396" y="330" font-size="11" fill="#DC2626" font-weight="700">D1</text>
<text x="430" y="330" font-size="10" fill="#4B5563">Pool chưa quét trong 0.5 ATR H1 phía sau SL (cổng</text>
<text x="430" y="343.5" font-size="10" fill="#4B5563">Mistake 13).</text>
<text x="396" y="362.0" font-size="11" fill="#DC2626" font-weight="700">D2</text>
<text x="430" y="362.0" font-size="10" fill="#4B5563">Cửa sổ từ 10 phút trước đến 15 phút sau tin tier-1.</text>
<text x="396" y="380.5" font-size="11" fill="#DC2626" font-weight="700">D3</text>
<text x="430" y="380.5" font-size="10" fill="#4B5563">Cả hai phía đã bị lấy trong ngày.</text>
<text x="396" y="399.0" font-size="11" fill="#DC2626" font-weight="700">D4</text>
<text x="430" y="399.0" font-size="10" fill="#4B5563">R:R tới vật cản đầu tiên &lt; 2.</text>
<text x="396" y="417.5" font-size="11" fill="#DC2626" font-weight="700">D5</text>
<text x="430" y="417.5" font-size="10" fill="#4B5563">DOL đã tiêu.</text>
<text x="396" y="436.0" font-size="11" fill="#DC2626" font-weight="700">D6</text>
<text x="430" y="436.0" font-size="10" fill="#4B5563">Tuần roll NQ / ngày lễ: không loại hẳn, tối đa tier</text>
<text x="430" y="449.5" font-size="10" fill="#4B5563">B.</text>
<rect x="24" y="474" width="352" height="150" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="474" width="352" height="26" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
<text x="36" y="492" font-size="12.5" fill="#1F2937" font-weight="700">Xác nhận: trigger M5 — MỘT chuỗi duy nhất</text>
<rect x="40" y="512" width="320" height="26" rx="6" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1"/>
<text x="50" y="529" font-size="10.5" fill="#1F2937" font-weight="700">1. Sweep phía ngược tại POI</text>
<line x1="200" y1="538" x2="200" y2="546" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#arG)"/>
<rect x="40" y="546" width="320" height="26" rx="6" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1"/>
<text x="50" y="563" font-size="10.5" fill="#1F2937" font-weight="700">2. MSS phá swing cấu trúc + displacement về DOL</text>
<line x1="200" y1="572" x2="200" y2="580" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#arG)"/>
<rect x="40" y="580" width="320" height="26" rx="6" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1"/>
<text x="50" y="597" font-size="10.5" fill="#1F2937" font-weight="700">3. FVG → limit ở CE</text>
<text x="36" y="620" font-size="10" fill="#6B7280" font-style="italic">Thiếu một mắt xích = chưa có trigger.</text>
<rect x="384" y="474" width="352" height="150" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="384" y="474" width="352" height="26" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1.2"/>
<text x="396" y="492" font-size="12.5" fill="#1F2937" font-weight="700">Vô hiệu (Invalidation) và quản lý lệnh</text>
<text x="396" y="518" font-size="11" fill="#92400E" font-weight="700">•</text>
<text x="410" y="518" font-size="10.5" fill="#4B5563">Đóng nến ở khung của DOL và được chấp nhận theo hướng</text>
<text x="410" y="532.2" font-size="10.5" fill="#4B5563">ngược lại.</text>
<text x="396" y="550.4000000000001" font-size="11" fill="#92400E" font-weight="700">•</text>
<text x="410" y="550.4000000000001" font-size="10.5" fill="#4B5563">MSS từ H1 trở lên ngược hướng DOL; tin làm đổi bối</text>
<text x="410" y="564.6000000000001" font-size="10.5" fill="#4B5563">cảnh.</text>
<text x="396" y="582.8000000000002" font-size="11" fill="#92400E" font-weight="700">•</text>
<text x="410" y="582.8000000000002" font-size="10.5" fill="#4B5563">T1 trước bậc thang đầu; T2 trước DOL.</text>
<text x="396" y="601.0000000000002" font-size="11" fill="#92400E" font-weight="700">•</text>
<text x="410" y="601.0000000000002" font-size="10.5" fill="#4B5563">Lệnh ngược khung lớn: rủi ro 0.25%, chỉ nhắm IRL,</text>
<text x="410" y="615.2000000000003" font-size="10.5" fill="#4B5563">không runner.</text>
</svg>
