<svg viewBox="0 0 980 560" width="980" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vòng phản hồi: giá tạo cấu trúc → cấu trúc gom lệnh → lệnh ảnh hưởng giá tương lai</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Structure không phải "nguyên nhân" của giá. Nó là dấu vết của giá — nhưng là dấu vết mà con người nhìn vào để đặt lệnh (reflexivity).</text>
<rect x="350.0" y="96.0" width="280.0" height="70.0" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.6"/>
<text x="490.0" y="122.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">① Giá di chuyển</text>
<text x="490.0" y="144.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">chuỗi giao dịch ở các mức khác nhau</text>
<rect x="640.0" y="246.0" width="280.0" height="70.0" rx="10" fill="#F3F4F6" stroke="#334155" stroke-width="1.6"/>
<text x="780.0" y="272.0" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">② Swing high / low</text>
<text x="780.0" y="294.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">đỉnh, đáy hiện ra trên chart</text>
<rect x="350.0" y="396.0" width="280.0" height="70.0" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/>
<text x="490.0" y="422.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">③ Mọi người nhìn thấy</text>
<text x="490.0" y="444.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">đặt stop trên/dưới, limit, breakout</text>
<rect x="60.0" y="246.0" width="280.0" height="70.0" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.6"/>
<text x="200.0" y="272.0" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="middle">④ Liquidity tập trung</text>
<text x="200.0" y="294.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">lệnh chờ gom quanh mức rõ ràng</text>
<path d="M 630,140 C 720,150 780,190 780,244" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aS)"/>
<path d="M 780,316 C 780,380 720,420 632,428" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aS)"/>
<path d="M 350,428 C 260,420 200,380 200,316" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aS)"/>
<path d="M 200,244 C 200,190 260,150 348,138" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aS)"/>
<text x="490.0" y="270.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Khi giá quay lại các mức đó,</text>
<text x="490.0" y="288.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">lệnh chờ được khớp → ảnh hưởng</text>
<text x="490.0" y="306.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">tốc độ &amp; hướng của nhịp kế tiếp</text>
<rect x="26.0" y="470.0" width="928.0" height="74.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/>
<text x="40.0" y="492.0" font-size="11.6" font-weight="700" fill="#B91C1C" text-anchor="start">Đầu vào NGOÀI vòng lặp (vòng lặp không giải thích được những thứ này):</text>
<text x="40.0" y="508.8" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">tin vĩ mô &amp; lãi suất · dòng tiền thương mại/đầu tư · hedging của doanh nghiệp · tái cân bằng danh mục cuối tháng · can thiệp ngân hàng trung ương</text>
<text x="40.0" y="525.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">→ Structure/liquidity là MỘT lớp giải thích. Coi nó là lớp DUY NHẤT là sai lầm về nhân quả.</text>
<rect x="40.0" y="94.5" width="129.2" height="18.5" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
<text x="46.0" y="109.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">[MARKET MECHANICS]</text>
<text x="40.0" y="128.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">Osler: lệnh gom quanh số tròn</text>
<rect x="827.8" y="94.5" width="116.2" height="18.5" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
<text x="833.8" y="109.0" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="start">[INTERPRETATION]</text>
<text x="944.0" y="128.0" font-size="11" font-weight="400" fill="#334155" text-anchor="end">mở rộng ra swing rõ: hợp lý, cần test</text>
</svg>
