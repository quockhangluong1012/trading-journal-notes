<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">FVG trong continuation vs FVG trong reversal — cùng hình, khác bằng chứng cần có</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Continuation: FVG nằm trong leg cùng chiều với cấu trúc đang có. Reversal: FVG nằm trên leg ĐẦU TIÊN phá cấu trúc cũ sau một liquidity event.</text>
<rect x="30.0" y="96.0" width="450.0" height="448.0" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/>
<text x="46.0" y="120.0" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">FVG → continuation</text>
<text x="46.0" y="140.0" font-size="10.4" font-weight="600" fill="#6B7280" text-anchor="start">Trend → displacement → FVG → retrace → tiếp diễn</text>
<rect x="50.0" y="277.3" width="410.0" height="18.7" rx="0" fill="#16A34A" fill-opacity="0.2"/>
<line x1="50.0" y1="277.3" x2="460.0" y2="277.3" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="50.0" y1="296.0" x2="460.0" y2="296.0" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="458.0" y="271.3" font-size="10" font-weight="700" fill="#15803D" text-anchor="end">FVG</text>
<path d="M60.0,360.0 L103.3,320.0 L146.7,338.7 L190.0,285.3 L233.3,304.0 L276.7,245.3 L320.0,264.0 L363.3,258.7 L406.7,213.3 L450.0,184.0" stroke="#334155" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="46.0" y="428.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Cấu trúc đã cùng chiều (HH-HL) — FVG là chỗ 'nghỉ'</text>
<text x="46.0" y="448.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Rủi ro: trend đã già, retrace sâu biến thành đảo chiều</text>
<text x="46.0" y="468.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Bằng chứng cần: HTF context cùng chiều, DOL phía trước</text>
<text x="46.0" y="488.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Thất bại điển hình: FVG mới nhất bị close xuyên → đổi state</text>
<rect x="500.0" y="96.0" width="450.0" height="448.0" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="516.0" y="120.0" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="start">FVG → reversal</text>
<text x="516.0" y="140.0" font-size="10.4" font-weight="600" fill="#6B7280" text-anchor="start">Liquidity event → displacement → MSS → FVG → retrace</text>
<rect x="520.0" y="314.7" width="410.0" height="21.3" rx="0" fill="#16A34A" fill-opacity="0.2"/>
<line x1="520.0" y1="314.7" x2="930.0" y2="314.7" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="520.0" y1="336.0" x2="930.0" y2="336.0" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="928.0" y="308.7" font-size="10" font-weight="700" fill="#15803D" text-anchor="end">FVG</text>
<path d="M530.0,226.7 L569.0,266.7 L608.0,250.7 L647.0,298.7 L686.0,285.3 L725.0,341.3 L764.0,365.3 L803.0,306.7 L842.0,325.3 L881.0,314.7 L920.0,269.3" stroke="#334155" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="520.0" y1="360.0" x2="760.0" y2="360.0" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="524.0" y="374.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="start">SSL (ex-ante)</text>
<line x1="620.0" y1="285.3" x2="930.0" y2="285.3" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
<text x="800.0" y="280.3" font-size="9.5" font-weight="600" fill="#334155" text-anchor="start">swing high bị phá = MSS</text>
<text x="516.0" y="428.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">FVG nằm trên leg đầu tiên NGƯỢC cấu trúc cũ</text>
<text x="516.0" y="448.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Rủi ro: chỉ là pullback của trend cũ (MSS vi mô)</text>
<text x="516.0" y="468.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Bằng chứng cần: sweep mức ex-ante + MSS swing có ý nghĩa</text>
<text x="516.0" y="488.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Thất bại điển hình: liquidity-type displacement → lấp hết</text>
</svg>