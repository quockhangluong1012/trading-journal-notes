<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="558.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Định nghĩa · Xác nhận · Bối cảnh</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đừng biến mọi thứ 'tốt' thành điều kiện bắt buộc. Cột 1 trả lời 'CÓ PHẢI IFVG không?'. Cột 2 và 3 trả lời 'IFVG này có ĐÁNG chú ý /</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">đáng giao dịch không?'. Cột 4 là những thứ hay bị nhầm vào cột 1.</text>
<rect x="798.2" y="22.0" width="173.8" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="885.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ĐIỀU KIỆN · PHÂN LOẠI</text>
<rect x="28.0" y="104.0" width="226.0" height="330.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="42.0" y="130.0" font-size="13" font-weight="800" fill="#1D4ED8" text-anchor="start">1. ĐỊNH NGHĨA</text>
<text x="42.0" y="150.0" font-size="10.8" font-weight="600" fill="#6B7280" text-anchor="start">bắt buộc — thiếu là không phải IFVG</text>
<circle cx="48.0" cy="188.0" r="3.5" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1"/>
<text x="60.0" y="192.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Có một FVG hợp lệ (3 nến, cùng</text>
<text x="60.0" y="208.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">khung).</text>
<circle cx="48.0" cy="232.6" r="3.5" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1"/>
<text x="60.0" y="236.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Một nến CÙNG KHUNG đóng cửa</text>
<text x="60.0" y="253.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">qua mép xa của FVG.</text>
<circle cx="48.0" cy="277.1" r="3.5" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1"/>
<text x="60.0" y="281.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ghi thời điểm biết = lúc nến đó</text>
<text x="60.0" y="297.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đóng cửa.</text>
<rect x="267.3" y="104.0" width="226.0" height="330.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.3"/>
<text x="281.3" y="130.0" font-size="13" font-weight="800" fill="#15803D" text-anchor="start">2. XÁC NHẬN</text>
<text x="281.3" y="150.0" font-size="10.8" font-weight="600" fill="#6B7280" text-anchor="start">tăng độ tin cậy về HÀNH VI</text>
<circle cx="287.3" cy="188.0" r="3.5" fill="#15803D" stroke="#15803D" stroke-width="1"/>
<text x="299.3" y="192.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nến sau không lấy lại vùng (giá</text>
<text x="299.3" y="208.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">được chấp nhận).</text>
<circle cx="287.3" cy="232.6" r="3.5" fill="#15803D" stroke="#15803D" stroke-width="1"/>
<text x="299.3" y="236.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Cú phá có displacement.</text>
<circle cx="287.3" cy="260.6" r="3.5" fill="#15803D" stroke="#15803D" stroke-width="1"/>
<text x="299.3" y="264.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Cú phá làm gãy một swing có ý</text>
<text x="299.3" y="281.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nghĩa (MSS).</text>
<circle cx="287.3" cy="305.1" r="3.5" fill="#15803D" stroke="#15803D" stroke-width="1"/>
<text x="299.3" y="309.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Retest bị từ chối.</text>
<rect x="506.6" y="104.0" width="226.0" height="330.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="520.6" y="130.0" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start">3. BỐI CẢNH</text>
<text x="520.6" y="150.0" font-size="10.8" font-weight="600" fill="#6B7280" text-anchor="start">confluence — tăng độ phù hợp với kế</text>
<text x="520.6" y="164.9" font-size="10.8" font-weight="600" fill="#6B7280" text-anchor="start">hoạch</text>
<circle cx="526.6" cy="188.0" r="3.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="538.6" y="192.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Cùng hướng D1 bias và DOL.</text>
<circle cx="526.6" cy="216.0" r="3.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="538.6" y="220.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Xuất hiện sau một liquidity</text>
<text x="538.6" y="236.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">sweep.</text>
<circle cx="526.6" cy="260.6" r="3.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="538.6" y="264.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bearish IFVG ở premium /</text>
<text x="538.6" y="281.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bullish IFVG ở discount.</text>
<circle cx="526.6" cy="305.1" r="3.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="538.6" y="309.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nằm trong HTF POI.</text>
<circle cx="526.6" cy="333.1" r="3.5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="538.6" y="337.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Trong killzone.</text>
<rect x="745.9" y="104.0" width="226.0" height="330.0" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="759.9" y="130.0" font-size="13" font-weight="800" fill="#EA580C" text-anchor="start">4. HAY BỊ NHẦM LÀ BẮT BUỘC</text>
<text x="759.9" y="150.0" font-size="10.8" font-weight="600" fill="#6B7280" text-anchor="start">thật ra thuộc cột 2 hoặc 3</text>
<circle cx="765.9" cy="188.0" r="3.5" fill="#EA580C" stroke="#EA580C" stroke-width="1"/>
<text x="777.9" y="192.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">'Phải có sweep trước.'</text>
<circle cx="765.9" cy="216.0" r="3.5" fill="#EA580C" stroke="#EA580C" stroke-width="1"/>
<text x="777.9" y="220.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">'Phải có MSS.'</text>
<circle cx="765.9" cy="244.0" r="3.5" fill="#EA580C" stroke="#EA580C" stroke-width="1"/>
<text x="777.9" y="248.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">'Phải có retest mới là IFVG.'</text>
<circle cx="765.9" cy="272.0" r="3.5" fill="#EA580C" stroke="#EA580C" stroke-width="1"/>
<text x="777.9" y="276.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">'FVG gốc phải to, phải đẹp.'</text>
<circle cx="765.9" cy="300.0" r="3.5" fill="#EA580C" stroke="#EA580C" stroke-width="1"/>
<text x="777.9" y="304.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">'Phải ở HTF POI.'</text>
<line x1="141.0" y1="448.0" x2="141.0" y2="460.8" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round"/>
<path d="M141.0,468.0 L137.7,460.7 L144.3,460.7 Z" fill="#1D4ED8"/>
<line x1="386.3" y1="448.0" x2="386.3" y2="460.8" stroke="#15803D" stroke-width="1.6" stroke-linecap="round"/>
<path d="M386.3,468.0 L383.0,460.7 L389.6,460.7 Z" fill="#15803D"/>
<rect x="28.0" y="472.0" width="226.0" height="64.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="141.0" y="509.0" font-size="12.5" font-weight="800" fill="#1D4ED8" text-anchor="middle">→ Valid IFVG? (có / không)</text>
<rect x="267.3" y="472.0" width="704.6" height="64.0" rx="8" fill="#ECFDF3" stroke="#15803D" stroke-width="1.2"/>
<text x="283.3" y="496.0" font-size="12" font-weight="600" fill="#15803D" text-anchor="start">→ Tradeable IFVG? Một IFVG hợp lệ vẫn có thể KHÔNG đáng giao dịch: sai bias, hết room tới DOL, ngoài</text>
<text x="283.3" y="512.6" font-size="12" font-weight="600" fill="#15803D" text-anchor="start">killzone, R:R xấu.</text>
</svg>
