<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bốn tầng chất lượng: Valid → Meaningful → High-quality → Tradeable</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi tầng là một bộ lọc. Đi xuống càng sâu, số CISD còn lại càng ít. Một CISD “hợp lệ” mới chỉ qua tầng đầu tiên.</text>
<rect x="884.8" y="22" width="87.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">PHÂN LOẠI</text>
<text x="28.0" y="588.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<path d="M50.0,95.0 L950.0,95.0 L890.0,199.0 L110.0,199.0 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="125.0" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">VALID — đúng định nghĩa</text>
<text x="500.0" y="149.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Có chuỗi rõ ràng, nến đóng cửa vượt open đầu chuỗi trên khung đã khai báo.</text>
<path d="M120.0,209.0 L880.0,209.0 L820.0,313.0 L180.0,313.0 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="239.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">MEANINGFUL — có ý nghĩa</text>
<text x="500.0" y="263.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Chặng bị lấy lại là chặng QUAN TRỌNG: chạy vào thanh khoản / POI, không nằm giữa range nhiễu.</text>
<path d="M190.0,323.0 L810.0,323.0 L750.0,427.0 L250.0,427.0 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="353.0" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">HIGH-QUALITY — chất lượng cao</text>
<text x="500.0" y="377.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Thêm bằng chứng: displacement, FVG, không đóng lại phía bên kia, thuận bối cảnh</text>
<text x="500.0" y="392.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">HTF, phiên có thanh khoản.</text>
<path d="M260.0,437.0 L740.0,437.0 L680.0,541.0 L320.0,541.0 Z" fill="#ECFDF5" stroke="#059669" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="467.0" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">TRADEABLE — có thể giao dịch</text>
<text x="500.0" y="491.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Khớp với kế hoạch của bạn: có điểm vào, stop logic, mục</text>
<text x="500.0" y="506.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">tiêu thanh khoản, R:R đạt, rủi ro ≤ quy tắc tài khoản.</text>
</svg>
