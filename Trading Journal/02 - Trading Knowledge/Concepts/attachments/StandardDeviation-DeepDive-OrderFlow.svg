<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <!-- grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="240" y1="60" x2="240" y2="500"/>
    <line x1="480" y1="60" x2="480" y2="500"/>
    <line x1="720" y1="60" x2="720" y2="500"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Order-flow mechanism behind a manipulation leg</text>

  <!-- Panel 1: Stop cluster swept -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">Phase 1: Stop cluster swept</text>
  <line x1="40" y1="360" x2="220" y2="360" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="45" y="352" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Equal lows (SSL)</text>
  <!-- small bearish candles into the sweep -->
  <rect x="70" y="300" width="14" height="40" fill="#ef5350"/>
  <line x1="77" y1="290" x2="77" y2="350" stroke="#ef5350" stroke-width="2"/>
  <rect x="100" y="310" width="14" height="45" fill="#ef5350"/>
  <line x1="107" y1="300" x2="107" y2="365" stroke="#ef5350" stroke-width="2"/>
  <rect x="130" y="330" width="14" height="30" fill="#ef5350"/>
  <line x1="137" y1="315" x2="137" y2="378" stroke="#ef5350" stroke-width="2"/>
  <!-- sweep wick below the liquidity line -->
  <rect x="160" y="335" width="14" height="20" fill="#ef5350"/>
  <line x1="167" y1="325" x2="167" y2="395" stroke="#ef5350" stroke-width="2"/>
  <text x="150" y="415" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Sweep wick</text>
  <path d="M167,398 L167,420" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Panel 2: MM inventory accumulation -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">Phase 2: MM inventory accumulation</text>
  <rect x="280" y="280" width="180" height="90" fill="rgba(255,152,0,0.25)" stroke="#ff9800" stroke-width="1"/>
  <text x="290" y="270" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Absorption zone (long inventory)</text>
  <rect x="300" y="345" width="14" height="15" fill="#ef5350"/>
  <line x1="307" y1="335" x2="307" y2="365" stroke="#ef5350" stroke-width="2"/>
  <rect x="330" y="340" width="14" height="15" fill="#26a69a"/>
  <line x1="337" y1="330" x2="337" y2="362" stroke="#26a69a" stroke-width="2"/>
  <rect x="360" y="325" width="14" height="18" fill="#26a69a"/>
  <line x1="367" y1="315" x2="367" y2="350" stroke="#26a69a" stroke-width="2"/>
  <rect x="390" y="310" width="14" height="18" fill="#26a69a"/>
  <line x1="397" y1="300" x2="397" y2="335" stroke="#26a69a" stroke-width="2"/>
  <text x="285" y="395" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">Sell orders absorbed by</text>
  <text x="285" y="412" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">market maker at good price</text>

  <!-- Panel 3: Displacement funded by inventory -->
  <text x="540" y="80" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">Phase 3: Displacement (funded move)</text>
  <rect x="560" y="200" width="14" height="30" fill="#26a69a"/>
  <line x1="567" y1="190" x2="567" y2="240" stroke="#26a69a" stroke-width="2"/>
  <rect x="590" y="160" width="14" height="40" fill="#26a69a"/>
  <line x1="597" y1="150" x2="597" y2="205" stroke="#26a69a" stroke-width="2"/>
  <rect x="620" y="120" width="14" height="40" fill="#26a69a"/>
  <line x1="627" y1="110" x2="627" y2="165" stroke="#26a69a" stroke-width="2"/>
  <rect x="650" y="95" width="14" height="30" fill="#26a69a"/>
  <line x1="657" y1="85" x2="657" y2="130" stroke="#26a69a" stroke-width="2"/>
  <path d="M580,260 C620,220 640,160 660,110" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="140" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Displacement, biên do</text>
  <text x="700" y="158" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">ty le voi leg goc (SD)</text>

  <!-- ladder projection lines on right -->
  <line x1="700" y1="200" x2="940" y2="200" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="900" y="196" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">-1 SD</text>
  <line x1="700" y1="150" x2="940" y2="150" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="900" y="146" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">-2 SD</text>

  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">
    <rect x="30" y="470" width="14" height="14" fill="#26a69a"/>
    <text x="50" y="481">Bullish candle</text>
    <rect x="180" y="470" width="14" height="14" fill="#ef5350"/>
    <text x="200" y="481">Bearish candle</text>
    <rect x="330" y="470" width="14" height="14" fill="rgba(255,152,0,0.25)" stroke="#ff9800"/>
    <text x="350" y="481">MM absorption zone</text>
    <line x1="560" y1="477" x2="590" y2="477" stroke="#f2c94c" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="600" y="481">SD projection level</text>
  </g>

  <text x="30" y="520" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Note: bien do displacement o Phase 3 la mot ham (proxy) cua luong thanh khoan bi hap thu o Phase 1-2, khong phai quan he nhan qua chat.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
