<svg viewBox="0 0 980 650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="650" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Máy trạng thái của Daily Bias — có hysteresis</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Hạ cấp dễ, lật khó. Không bao giờ BULLISH → BEARISH trong một bước; tối đa 1 lần lật mỗi ngày (RULE-DB-006).</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C2410C"/></marker>
  </defs>

  <!-- NEUTRAL -->
  <rect x="385" y="80" width="210" height="70" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
  <text x="490" y="106" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">NEUTRAL</text>
  <text x="490" y="125" font-size="10.5" fill="#374151" text-anchor="middle">D1 RANGE, giá giữa container,</text>
  <text x="490" y="140" font-size="10.5" fill="#374151" text-anchor="middle">DOL hai phía tương đương</text>

  <!-- BULLISH -->
  <rect x="40" y="236" width="210" height="96" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="145" y="264" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">BULLISH</text>
  <text x="145" y="284" font-size="10.5" fill="#374151" text-anchor="middle">tier A / B / C</text>
  <text x="145" y="301" font-size="10.5" fill="#374151" text-anchor="middle">thesis: protected low D1</text>
  <text x="145" y="318" font-size="10.5" fill="#374151" text-anchor="middle">chỉ setup long theo model</text>

  <!-- TRANSITION / UNCLEAR -->
  <rect x="385" y="236" width="210" height="96" rx="9" fill="#F9FAFB" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="490" y="262" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">TRANSITION / UNCLEAR</text>
  <text x="490" y="281" font-size="10.5" fill="#374151" text-anchor="middle">vùng đệm BẮT BUỘC — không trade</text>
  <text x="490" y="298" font-size="10.5" fill="#374151" text-anchor="middle">vào khi: thesis chết (F), DOL đạt (D/I),</text>
  <text x="490" y="315" font-size="10.5" fill="#374151" text-anchor="middle">range FORMING, LRI thấp</text>

  <!-- BEARISH -->
  <rect x="730" y="236" width="210" height="96" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="835" y="264" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">BEARISH</text>
  <text x="835" y="284" font-size="10.5" fill="#374151" text-anchor="middle">tier A / B / C</text>
  <text x="835" y="301" font-size="10.5" fill="#374151" text-anchor="middle">thesis: protected high D1</text>
  <text x="835" y="318" font-size="10.5" fill="#374151" text-anchor="middle">chỉ setup short theo model</text>

  <!-- CONFLICTED -->
  <rect x="150" y="440" width="220" height="66" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="260" y="466" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="middle">CONFLICTED</text>
  <text x="260" y="486" font-size="10.5" fill="#374151" text-anchor="middle">bằng chứng MẠNH ở cả hai phía</text>

  <!-- SUSPENDED -->
  <rect x="610" y="440" width="220" height="66" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="720" y="466" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">SUSPENDED</text>
  <text x="720" y="486" font-size="10.5" fill="#374151" text-anchor="middle">cửa sổ tin tier-1 (từ MỌI state)</text>

  <!-- transitions main -->
  <path d="M252 262 L381 262" stroke="#B91C1C" stroke-width="2" marker-end="url(#arR)"/>
  <text x="316" y="244" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">F: HARD invalidation</text>
  <text x="316" y="256" font-size="9.5" fill="#B91C1C" text-anchor="middle">close + acceptance</text>
  <path d="M597 262 L726 262" stroke="#B91C1C" stroke-width="2" marker-end="url(#arR)"/>
  <text x="661" y="244" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">leg ngược ACTIVE</text>
  <text x="661" y="256" font-size="9.5" fill="#B91C1C" text-anchor="middle">+ DOL_down</text>
  <path d="M726 308 L597 308" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="661" y="324" font-size="9.5" fill="#6B7280" text-anchor="middle">đối xứng</text>
  <path d="M381 308 L252 308" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="316" y="324" font-size="9.5" fill="#6B7280" text-anchor="middle">leg mới ACTIVE + DOL_up</text>

  <!-- self loops on BULLISH -->
  <path d="M80 234 C 80 180, 210 180, 210 230" fill="none" stroke="#15803D" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="145" y="172" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">KEEP / nâng tier</text>
  <text x="145" y="186" font-size="9.5" fill="#15803D" text-anchor="middle">A, B, C (sweep + reclaim), E, G(C1/C2)</text>
  <path d="M60 334 C 60 392, 130 392, 130 338" fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#arO)"/>
  <text x="30" y="410" font-size="10" font-weight="700" fill="#C2410C">DOWNGRADE (tier ↓)</text>
  <text x="30" y="424" font-size="9.5" fill="#C2410C">C', E', G(C4)</text>

  <!-- BULLISH -> CONFLICTED -->
  <path d="M215 334 L245 436" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="236" y="392" font-size="9.5" fill="#6D28D9">thang lớn ngược tại POI (K3, K4)</text>

  <!-- NEUTRAL <-> TRANSITION -->
  <path d="M470 234 L470 154" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="462" y="200" font-size="9.5" fill="#6B7280" text-anchor="end">range hình thành</text>
  <path d="M510 154 L510 232" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="518" y="200" font-size="9.5" fill="#6B7280">breakout + acceptance</text>

  <!-- SUSPENDED -> TRANSITION -->
  <path d="M650 438 L560 336" stroke="#D97706" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="596" y="400" font-size="9.5" fill="#B45309" text-anchor="end">hết cửa sổ:</text>
  <text x="596" y="413" font-size="9.5" fill="#B45309" text-anchor="end">đánh giá lại từ đầu</text>

  <!-- hysteresis band -->
  <text x="26" y="540" font-size="12.5" font-weight="700" fill="#1F2937">Hysteresis (Schmitt trigger): hai ngưỡng khác nhau để bias không dao động quanh một ngưỡng duy nhất</text>
  <rect x="60" y="556" width="300" height="34" fill="#DCFCE7"/>
  <rect x="360" y="556" width="340" height="34" fill="#FFEDD5"/>
  <rect x="700" y="556" width="220" height="34" fill="#FEE2E2"/>
  <text x="210" y="578" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">KEEP (nhiễu, temporary contradiction)</text>
  <text x="530" y="578" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">DOWNGRADE → TRANSITION</text>
  <text x="810" y="578" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">đủ để có thesis mới</text>
  <line x1="360" y1="550" x2="360" y2="598" stroke="#C2410C" stroke-width="2"/>
  <line x1="700" y1="550" x2="700" y2="598" stroke="#B91C1C" stroke-width="2"/>
  <text x="360" y="614" font-size="10" fill="#C2410C" text-anchor="middle">ngưỡng HẠ CẤP</text>
  <text x="700" y="614" font-size="10" fill="#B91C1C" text-anchor="middle">ngưỡng LẬT = invalidation + confirmation</text>
  <text x="60" y="632" font-size="10" fill="#6B7280">mức bằng chứng ngược hướng →</text>
</svg>
