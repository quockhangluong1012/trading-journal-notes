<line x1="957" y1="178" x2="957" y2="220" stroke="#22c55e" stroke-width="2"/>

<text x="650" y="340" font-size="13" fill="#ef4444" font-weight="bold">✗ Giá chạy liên tục qua "giờ nghỉ" CME</text>
<text x="650" y="360" font-size="13" fill="#ef4444" font-weight="bold">✗ Không có gap nào để vẽ NDOG thật</text>

<!-- Bottom takeaway -->
<rect x="60" y="440" width="1080" height="270" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="80" y="470" font-size="16" fill="#eab308" font-weight="bold">Bước xử lý khi trade CFD index (US100/US500/GER40...)</text>
<text x="80" y="500" font-size="14" fill="#e2e8f0">1 → Xác định server đang chạy GMT+2 (mùa đông) hay GMT+3 (mùa hè, DST Israel/Cyprus)</text>
<text x="80" y="525" font-size="14" fill="#e2e8f0">2 → Quy đổi: 17:00–18:00 ET = 20:00–21:00 GMT+3 hoặc 21:00–22:00 GMT+2, KHÔNG dùng giờ 00:00 server</text>
<text x="80" y="550" font-size="14" fill="#e2e8f0">3 → Mở song song chart NQ1! (continuous futures, CME) để lấy NDOG THẬT tại đúng giờ ET</text>
<text x="80" y="575" font-size="14" fill="#e2e8f0">4 → Áp mức giá NDOG/CE từ NQ1! sang chart CFD (quy đổi chênh lệch cơ bản nếu basis rộng)</text>
<text x="80" y="600" font-size="14" fill="#38bdf8" font-weight="bold">5 → Không bao giờ cố "tìm gap" trên chính chart CFD synthetic — nó không tồn tại về mặt cơ chế</text>
<text x="80" y="640" font-size="13" fill="#94a3b8">DST Mỹ (Chủ Nhật 2 tháng 3 → Chủ Nhật đầu tháng 11) và DST EU/Israel (khác ngày chuyển 2-3 tuần)</text>
<text x="80" y="660" font-size="13" fill="#94a3b8">khiến độ lệch giờ server-ET dao động thêm ±1 giờ trong các tuần giao thời — kiểm tra lại mỗi lần đổi giờ.</text>
</svg>
