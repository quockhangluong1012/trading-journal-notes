<line x1="887" y1="186" x2="887" y2="228" stroke="#22c55e" stroke-width="2"/>
<rect x="915" y="192" width="14" height="22" fill="#ef4444"/>
<line x1="922" y1="182" x2="922" y2="222" stroke="#ef4444" stroke-width="2"/>
