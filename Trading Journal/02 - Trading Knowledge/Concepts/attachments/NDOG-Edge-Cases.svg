<line x1="187" y1="205" x2="187" y2="250" stroke="#ef4444" stroke-width="2"/>

<line x1="90" y1="225" x2="280" y2="225" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
<text x="90" y="216" font-size="12" fill="#eab308">Prior Close 18,240</text>

<!-- gap box -->
<rect x="280" y="170" width="140" height="55" fill="#22c55e" opacity="0.2"/>
<text x="285" y="165" font-size="12" fill="#38bdf8" font-weight="bold">CE 18,259 (khoảng trống thật)</text>
<line x1="280" y1="170" x2="420" y2="170" stroke="#94a3b8" stroke-width="2"/>
<text x="285" y="185" font-size="11" fill="#e2e8f0">GAP RÕ - không có nến</text>

<rect x="420" y="160" width="14" height="30" fill="#22c55e"/>
<line x1="427" y1="150" x2="427" y2="200" stroke="#22c55e" stroke-width="2"/>
<text x="440" y="180" font-size="12" fill="#94a3b8">Reopen 18,278</text>
<rect x="460" y="155" width="14" height="28" fill="#22c55e"/>
<line x1="467" y1="145" x2="467" y2="195" stroke="#22c55e" stroke-width="2"/>
<rect x="500" y="150" width="14" height="30" fill="#22c55e"/>
<line x1="507" y1="140" x2="507" y2="190" stroke="#22c55e" stroke-width="2"/>

<text x="90" y="340" font-size="13" fill="#22c55e" font-weight="bold">✓ Order book đóng hoàn toàn 17:00-18:00 ET</text>
<text x="90" y="360" font-size="13" fill="#22c55e" font-weight="bold">✓ NDOG = inefficiency thật, CE đáng tin</text>

<!-- Panel 2: CFD broker synthetic -->
<text x="620" y="105" font-size="17" fill="#e2e8f0" font-weight="bold">US100 CFD, server GMT+3 — không halt</text>
<rect x="620" y="120" width="520" height="260" fill="#111827" stroke="#334155" rx="6"/>
<line x1="650" y1="380" x2="1110" y2="380" stroke="#334155" stroke-width="1"/>
<text x="650" y="398" font-size="12" fill="#94a3b8">19:00 srv</text>
<text x="850" y="398" font-size="12" fill="#f97316">20:00–21:00 srv (=17-18 ET)</text>
<text x="1060" y="398" font-size="12" fill="#94a3b8">21:15 srv</text>

<rect x="670" y="230" width="14" height="30" fill="#22c55e"/>
