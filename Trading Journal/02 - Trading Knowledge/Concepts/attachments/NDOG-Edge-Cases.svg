<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="750" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case: Broker CFD GMT+2/+3 vs CME Futures — NDOG "Biến Mất"</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">So sánh cùng thời điểm: chart NQ1! (CME) có gap thật vs chart CFD US100 chạy liên tục không halt</text>

<!-- Panel 1: CME futures with real gap -->
<text x="60" y="105" font-size="17" fill="#e2e8f0" font-weight="bold">NQ1! trên CME (giờ ET) — NDOG thật</text>
<rect x="60" y="120" width="520" height="260" fill="#111827" stroke="#334155" rx="6"/>
<line x1="90" y1="380" x2="550" y2="380" stroke="#334155" stroke-width="1"/>
<text x="90" y="398" font-size="12" fill="#94a3b8">16:00 ET</text>
<text x="280" y="398" font-size="12" fill="#eab308">17:00–18:00 ET (halt)</text>
<text x="500" y="398" font-size="12" fill="#94a3b8">18:15 ET</text>

<rect x="110" y="230" width="14" height="30" fill="#22c55e"/>
<line x1="117" y1="220" x2="117" y2="270" stroke="#22c55e" stroke-width="2"/>
<rect x="145" y="220" width="14" height="30" fill="#22c55e"/>
<line x1="152" y1="210" x2="152" y2="260" stroke="#22c55e" stroke-width="2"/>
