<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD trong vùng đi ngang: đèn nhấp nháy liên tục</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trong một range hẹp, chuỗi nến rất ngắn và đổi chiều liên tục. CISD xuất hiện hết lần này tới lần khác theo cả hai hướng. Mỗi cái</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">đều “đúng định nghĩa” nhưng gần như không mang thông tin.</text>
