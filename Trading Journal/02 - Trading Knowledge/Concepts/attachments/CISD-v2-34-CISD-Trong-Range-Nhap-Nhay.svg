<rect x="28.0" y="450.0" width="460.0" height="77.4" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="40.0" y="474.4" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Vì sao ít ý nghĩa?</text>
<text x="40.0" y="496.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chặng càng ngắn thì “lấy lại cả chặng” càng dễ. Khi giá chỉ dao động qua lại,</text>
<text x="40.0" y="512.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">CISD chỉ mô tả lại chính sự dao động đó.</text>
<rect x="512.0" y="450.0" width="460.0" height="77.4" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="524.0" y="474.4" font-size="13" font-weight="700" fill="#059669" text-anchor="start">Nên làm gì?</text>
<text x="524.0" y="496.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Trong range: ưu tiên chờ giá ra MÉP range, quét thanh khoản ở mép, rồi mới</text>
<text x="524.0" y="512.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đọc CISD. CISD giữa range → bỏ qua.</text>
<text x="44.0" y="128.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">Trong đoạn này có 4 lần CISD (▲ bullish, ▼ bearish) — không lần nào dẫn tới đâu.</text>
