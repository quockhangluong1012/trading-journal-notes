<text x="44.0" y="472.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,473.0">Mọi thứ khớp: quét đáy, phá đỉnh, quay lại, bật lên. Não tự động kể một</text>
<text x="44.0" y="490.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,473.0">câu chuyện liền mạch — và quên rằng lúc đó không ai biết đoạn sau.</text>
