<text x="890.9" y="316.9" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">chưa biết</text>
<text x="528.0" y="472.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="527.0,957.0">Biết: đủ ba mắt xích → vùng được gọi là Breaker. CHƯA biết: giá có</text>
<text x="528.0" y="490.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="527.0,957.0">quay lại không, nếu quay lại thì giữ hay thủng. Việc được làm: vẽ vùng,</text>
<text x="528.0" y="507.6" font-size="12.2" font-weight="400" fill="#111827" data-bx="527.0,957.0">đặt cảnh báo, chờ.</text>
<text x="28.0" y="587.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Phép thử chống hindsight: che nửa phải chart bằng tay rồi tự hỏi “tại nến này, tôi có đủ thông tin để gọi tên vùng chưa? để vào lệnh chưa?”. Hai câu hỏi đó hiếm</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">khi có cùng câu trả lời.</text>
