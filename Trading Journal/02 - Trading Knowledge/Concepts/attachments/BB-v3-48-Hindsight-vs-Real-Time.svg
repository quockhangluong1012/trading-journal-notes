<text x="928.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">HINDSIGHT</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bên trái là thứ bạn thấy khi lật lại lịch sử. Bên phải là thứ bạn thật sự có trong tay ngay lúc Breaker vừa được xác nhận. Chỉ bên phải mới là điều kiện</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">giao dịch thật.</text>
