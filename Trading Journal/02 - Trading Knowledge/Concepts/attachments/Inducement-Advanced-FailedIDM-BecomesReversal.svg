<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Khi mồi (IDM) tự nó biến thành điểm đảo thật</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">OB phía sau đã bị test nhiều lần, phản ứng yếu dần — giá quét IDM lần này lại tạo MSS thật, không bao giờ tới OB cũ</text>

  <rect x="24" y="70" width="712" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- OB zone, deep, marked as "exhausted" -->
  <rect x="44" y="300" width="660" height="50" fill="#9CA3AF" opacity="0.18"/>
  <text x="52" y="316" font-size="10" font-weight="700" fill="#6B7280">OB cũ — đã test 2-3 lần trước, phản ứng ngày càng yếu ("cạn hàng")</text>

  <!-- previous weak tests of OB -->
  <path d="M80,150 L110,220 L140,270 L160,320 L175,335" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="175" cy="335" r="5" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="70" y="150" font-size="9" fill="#6B7280">Test lần 1 (phản ứng mạnh)</text>

  <path d="M175,335 L210,280 L240,300 L260,335" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="260" cy="335" r="5" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <text x="200" y="270" font-size="9" fill="#6B7280">Test lần 2 (phản ứng yếu hơn)</text>

  <!-- new IDM forms above OB -->
  <line x1="290" y1="255" x2="430" y2="255" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="300" y="248" font-size="10.5" font-weight="700" fill="#B45309">"IDM" mới — đáy nhỏ nằm trên OB đã cạn</text>

  <path d="M260,335 L290,290 L320,255 L340,270" fill="none" stroke="#374151" stroke-width="2.2"/>
  <circle cx="340" cy="270" r="6" fill="none" stroke="#F59E0B" stroke-width="2.4"/>

  <!-- price sweeps this "IDM" but reverses HERE with real MSS instead of going to OB -->
  <path d="M340,270 L365,245 L390,265 L410,225" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420" y="225" font-size="9.5" fill="#B91C1C">Giá quét "IDM" — kỳ vọng: tiếp tục xuống tới OB cũ</text>

  <!-- but real MSS + displacement happens right at the IDM zone -->
  <rect x="450" y="150" width="2" height="90" fill="#16A34A"/><rect x="444" y="156" width="12" height="78" fill="#16A34A" rx="1"/>
  <rect x="478" y="110" width="2" height="90" fill="#16A34A"/><rect x="472" y="116" width="12" height="78" fill="#16A34A" rx="1"/>
  <text x="440" y="100" font-size="10.5" font-weight="700" fill="#15803D">MSS + displacement THẬT xảy ra ngay TẠI vùng IDM</text>
  <text x="440" y="114" font-size="10.5" font-weight="700" fill="#15803D">— giá KHÔNG BAO GIỜ tới OB cũ phía dưới</text>

  <path d="M480,190 L530,150 L580,120 L630,95" fill="none" stroke="#16A34A" stroke-width="2.4"/>

  <rect x="24" y="412" width="712" height="56" rx="6" fill="#FEF3C7"/>
  <text x="36" y="432" font-size="11" font-weight="700" fill="#92400E">Bài học: trước khi cam kết "chờ IDM bị quét rồi giá mới tới POI", kiểm tra lịch sử mitigate của OB phía sau.</text>
  <text x="36" y="450" font-size="11" font-weight="700" fill="#92400E">OB đã cạn (test nhiều lần, phản ứng yếu dần) → chuẩn bị kịch bản: chính IDM có thể tự tạo MSS thật, không phải chỉ là mồi.</text>
</svg>
