<text x="714.5" y="184.1" font-size="10.5" fill="#DC2626" text-anchor="start"><tspan font-weight="700">vùng POI ngược chiều của khung lớn</tspan></text>
<line x1="547.7" y1="226.1" x2="721.3" y2="226.1" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="547.7" y="221.1" font-size="11" fill="#2563EB" text-anchor="start"><tspan>đỉnh lớn (thanh khoản)</tspan></text>
<line x1="591.1" y1="247.9" x2="808.1" y2="247.9" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="591.1" y="261.9" font-size="11" fill="#D85A30" text-anchor="start"><tspan>đỉnh bị phá</tspan></text>
<polyline points="526.0,318.8 591.1,247.9 645.4,286.1 721.3,209.8 753.9,231.6" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="753.9,231.6 797.2,220.7 862.4,280.6 938.3,307.9" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="721.3" y1="209.8" x2="602.0" y2="331.1" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="602.0" y="343.1" font-size="11" fill="#DC2626" text-anchor="start"><tspan>cú phá vừa lấy luôn thanh khoản mục tiêu</tspan></text>
<rect x="24.0" y="380.0" width="952.0" height="76.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="24.0" y="380.0" width="5.0" height="76.0" rx="2" fill="#B45309"/>
<text x="38.0" y="400.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Hai câu hỏi sau mọi BOS (trước khi nghĩ tới điểm vào)</tspan></text>
<text x="38.0" y="419.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>(1) Sau cú phá, phía trước còn thanh khoản nào chưa bị lấy không? (2) Cú phá đang chạy VÀO vùng gì của khung lớn hơn? Nếu thanh khoản mục tiêu vừa bị lấy và phía</tspan></text>
<text x="38.0" y="435.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>trước là vùng ngược chiều của HTF, BOS có thể là cú &quot;vét cạn&quot; cuối.</tspan></text>
