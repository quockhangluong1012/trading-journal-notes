<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">BOS đúng luật vẫn có thể là điểm tệ: còn đường chạy không?</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Hai cú phá giống hệt nhau về hình dạng. Khác nhau ở thứ nằm PHÍA TRƯỚC chúng. Đây là bộ lọc [HYPOTHESIS] — cần backtest trước khi thành quy tắc.</tspan></text>
