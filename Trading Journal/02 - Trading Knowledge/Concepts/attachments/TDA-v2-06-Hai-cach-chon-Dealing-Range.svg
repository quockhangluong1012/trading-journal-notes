<line x1="530.0" y1="134.3" x2="958.0" y2="134.3" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="534.0" y="131.3" font-size="10" font-weight="400" fill="#B91C1C" text-anchor="start">neo trên 1200</text>
<line x1="530.0" y1="264.7" x2="958.0" y2="264.7" stroke="#15803D" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="534.0" y="277.7" font-size="10" font-weight="400" fill="#15803D" text-anchor="start">neo dưới 1080</text>
<line x1="530.0" y1="199.5" x2="958.0" y2="199.5" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="534.0" y="196.5" font-size="10" font-weight="400" fill="#4B5563" text-anchor="start">EQ 1140</text>
<circle cx="906.6" cy="207.1" r="5" fill="#1D4ED8" stroke="white" stroke-width="1.2"/>
<text x="898.1" y="216.9" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="end">giá 1133</text>
<rect x="530.0" y="380.0" width="428.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<text x="744.0" y="399.5" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="middle">z = (1133 − 1080) / (1200 − 1080) = 0.44  →  DISCOUNT</text>
<text x="530.0" y="434.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="543.0" y="434.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Định nghĩa B: fractal n=2, không lọc ý nghĩa swing</text>
<text x="530.0" y="452.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="543.0" y="452.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">1080 = strong low (origin leg phá 1158) → protected</text>
<text x="530.0" y="471.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="543.0" y="471.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hệ quả: giá xuống dưới 1080 &gt; 0.5 ATR → SUSPEND</text>
<text x="530.0" y="490.6" font-size="11.5" font-weight="400" fill="#B91C1C" text-anchor="start">•</text>
<text x="543.0" y="490.6" font-size="11.5" font-weight="400" fill="#B91C1C" text-anchor="start">Bẫy: đổi A ↔ B tùy lệnh mình muốn vào</text>
