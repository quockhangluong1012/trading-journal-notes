<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cùng một giá 1133 — 'premium' hay 'discount'? Tùy Dealing Range bạn chọn</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Hai định nghĩa swing hợp lệ → hai range → hai kết luận. Không cái nào 'đúng tuyệt đối'; sai là chọn SAU khi thấy giá.</text>
<rect x="26.0" y="84.0" width="460.0" height="456.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Lựa chọn A · có lọc ý nghĩa: 1000 → 1200</text>
<rect x="42.0" y="118.0" width="428.0" height="250.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<rect x="42.0" y="134.3" width="428.0" height="108.7" rx="2" fill="#FEE2E2" stroke="none" stroke-width="0" opacity="0.55"/>
<rect x="42.0" y="243.0" width="428.0" height="108.7" rx="2" fill="#DCFCE7" stroke="none" stroke-width="0" opacity="0.55"/>
<polyline points="42.0,221.3 84.8,188.7 144.7,351.7 213.2,180.0 256.0,264.7 333.0,134.3 418.6,207.1" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
