<text x="46.0" y="131.3" font-size="10" font-weight="400" fill="#B91C1C" text-anchor="start">neo trên 1200</text>
<line x1="42.0" y1="351.7" x2="470.0" y2="351.7" stroke="#15803D" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="46.0" y="364.7" font-size="10" font-weight="400" fill="#15803D" text-anchor="start">neo dưới 1000</text>
<line x1="42.0" y1="243.0" x2="470.0" y2="243.0" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="46.0" y="240.0" font-size="10" font-weight="400" fill="#4B5563" text-anchor="start">EQ 1100</text>
<circle cx="418.6" cy="207.1" r="5" fill="#1D4ED8" stroke="white" stroke-width="1.2"/>
<text x="410.1" y="216.9" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="end">giá 1133</text>
<rect x="42.0" y="380.0" width="428.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="256.0" y="399.5" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">z = (1133 − 1000) / (1200 − 1000) = 0.67  →  PREMIUM</text>
<text x="42.0" y="434.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="434.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Định nghĩa A: swing L4 cần hồi ≥ 50% leg hoặc ≥ 3 ATR</text>
<text x="42.0" y="452.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="452.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hồi 1158→1080 = 49%, 2.2 ATR → L3 → leg L4 = 1000→1200</text>
<text x="42.0" y="471.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="471.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">protected low 1000; trả lời: 'leg L4 đang ở đâu?'</text>
<text x="42.0" y="490.6" font-size="11.5" font-weight="400" fill="#15803D" text-anchor="start">•</text>
<text x="55.0" y="490.6" font-size="11.5" font-weight="400" fill="#15803D" text-anchor="start">→ 1133 là premium: chờ về discount / POI</text>
<rect x="514.0" y="84.0" width="460.0" height="456.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="528.0" y="108.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">Lựa chọn B · fractal thuần: 1080 → 1200</text>
<rect x="530.0" y="118.0" width="428.0" height="250.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<rect x="530.0" y="134.3" width="428.0" height="65.2" rx="2" fill="#FEE2E2" stroke="none" stroke-width="0" opacity="0.55"/>
<rect x="530.0" y="199.5" width="428.0" height="65.2" rx="2" fill="#DCFCE7" stroke="none" stroke-width="0" opacity="0.55"/>
