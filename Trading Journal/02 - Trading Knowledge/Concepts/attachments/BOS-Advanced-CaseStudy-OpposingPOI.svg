<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Case study XAUUSD — Bearish BOS THẬT nhưng phá thẳng vào HTF discount OB</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Cú BOS giảm hoàn hảo (body + FVG) lại là cú quét SSL cuối cùng ngay trên một weekly bullish OB → đảo.</text>

  <rect x="24" y="68" width="712" height="322" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- HTF bullish OB / weekly discount zone at bottom -->
  <rect x="40" y="300" width="680" height="40" fill="#16A34A" opacity="0.13"/>
  <text x="48" y="356" font-size="10" fill="#166534">Weekly bullish OB / discount HTF — draw ngược đang chờ (đối ứng cho phe short)</text>

  <!-- downtrend legs -->
  <path d="M55,120 L95,175 L120,155 L160,215 L188,195 L230,255" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <text x="70" y="112" font-size="9" fill="#B91C1C">Downtrend LTF (chuỗi LH/LL)</text>

  <!-- swing low being broken -->
  <line x1="160" y1="215" x2="700" y2="215" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="470" y="210" font-size="9" fill="#374151">swing low (SSL cuối) — dưới nó là weekly OB</text>

  <!-- pullback then bearish BOS with displacement + FVG into the OB -->
  <path d="M230,255 L265,210 L290,228 L320,205" fill="none" stroke="#374151" stroke-width="1.9"/>
  <path d="M320,205 L350,265 L372,250 L400,318" fill="none" stroke="#DC2626" stroke-width="2.8"/>
  <text x="322" y="245" font-size="9.5" font-weight="700" fill="#B91C1C">Bearish BOS (body close + FVG) — trông sách giáo khoa</text>
  <circle cx="400" cy="318" r="5" fill="#DC2626"/>
  <text x="300" y="300" font-size="9.5" fill="#92400E">Trader Short tiếp diễn tại FVG</text>

  <!-- reversal from weekly OB -->
  <path d="M400,318 L435,255 L465,275 L510,200 L545,220 L590,150 L630,168 L680,110" fill="none" stroke="#16A34A" stroke-width="2.8"/>
  <text x="470" y="140" font-size="9.5" font-weight="700" fill="#166534">Đảo mạnh từ weekly OB → Short bị stop</text>
  <line x1="330" y1="185" x2="430" y2="185" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="330" y="180" font-size="8.5" fill="#B91C1C">Short stop out</text>

  <rect x="24" y="398" width="712" height="58" rx="6" fill="#FEF3C7"/>
  <text x="36" y="418" font-size="11.5" font-weight="700" fill="#92400E">Chẩn đoán: BOS này HỢP LỆ về mọi tiêu chí kỹ thuật (thuận trend + body close + displacement + FVG) — nhưng nó phá</text>
  <text x="36" y="436" font-size="11.5" fill="#92400E">thẳng vào một HTF POI ngược hướng và quét nốt SSL cuối. "BOS đúng" nhưng "leg hết đất". Đây là exhaustion + opposing draw.</text>
  <text x="36" y="452" font-size="11.5" fill="#92400E">Sửa: trước khi theo BOS, luôn hỏi cú phá đang chạy VÀO đâu ở HTF — nếu vào POI ngược, giảm size/target hoặc bỏ.</text>
</svg>
