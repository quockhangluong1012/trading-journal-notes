<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="480" y1="60" x2="480" y2="500"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Case comparison: clean win vs correct-process loss</text>

  <!-- LEFT: clean win -->
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="16" fill="#26a69a">Case 1 - NQ1 NY AM: clean win</text>

  <!-- sweep -->
  <rect x="70" y="360" width="12" height="30" fill="#ef5350"/>
  <line x1="76" y1="350" x2="76" y2="400" stroke="#ef5350" stroke-width="2"/>
  <line x1="50" y1="395" x2="140" y2="395" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="52" y="410" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">SSL sweep</text>

  <!-- FVG / liquidity void -->
  <rect x="110" y="230" width="60" height="120" fill="rgba(41,98,255,0.25)"/>
  <text x="112" y="225" font-family="Arial, sans-serif" font-size="12" fill="#d1d4dc">Liquidity void</text>

  <!-- displacement candles -->
  <rect x="100" y="330" width="12" height="30" fill="#26a69a"/>
  <line x1="106" y1="320" x2="106" y2="365" stroke="#26a69a" stroke-width="2"/>
  <rect x="125" y="280" width="12" height="45" fill="#26a69a"/>
  <line x1="131" y1="270" x2="131" y2="330" stroke="#26a69a" stroke-width="2"/>
  <rect x="150" y="230" width="12" height="45" fill="#26a69a"/>
  <line x1="156" y1="220" x2="156" y2="280" stroke="#26a69a" stroke-width="2"/>
  <rect x="175" y="195" width="12" height="35" fill="#26a69a"/>
  <line x1="181" y1="185" x2="181" y2="235" stroke="#26a69a" stroke-width="2"/>

  <!-- TP1 line -1SD -->
  <line x1="60" y1="235" x2="220" y2="235" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="185" y="230" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">-1 SD (TP1)</text>

  <!-- TP2 -2SD with confluence FVG HTF -->
  <rect x="60" y="150" width="160" height="35" fill="rgba(41,98,255,0.25)" stroke="#2962ff"/>
  <line x1="60" y1="167" x2="220" y2="167" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="60" y="146" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">-2 SD = FVG HTF confluence (TP2)</text>

  <!-- reaction wick at TP2 -->
  <rect x="200" y="165" width="12" height="20" fill="#ef5350"/>
  <line x1="206" y1="150" x2="206" y2="190" stroke="#ef5350" stroke-width="2"/>
  <path d="M212,168 L240,168" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="215" y="200" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Rejection ro rang</text>

  <!-- RIGHT: correct-process loss -->
  <text x="540" y="75" font-family="Arial, sans-serif" font-size="16" fill="#ef5350">Case 2 - EURUSD London: correct-process loss</text>

  <!-- sweep -->
  <rect x="560" y="150" width="12" height="30" fill="#26a69a"/>
  <line x1="566" y1="140" x2="566" y2="190" stroke="#26a69a" stroke-width="2"/>
  <line x1="540" y1="145" x2="630" y2="145" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="542" y="138" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">BSL sweep</text>

  <!-- displacement down -->
  <rect x="590" y="200" width="12" height="30" fill="#ef5350"/>
  <line x1="596" y1="190" x2="596" y2="240" stroke="#ef5350" stroke-width="2"/>
  <rect x="615" y="235" width="12" height="35" fill="#ef5350"/>
  <line x1="621" y1="225" x2="621" y2="280" stroke="#ef5350" stroke-width="2"/>
  <rect x="640" y="275" width="12" height="40" fill="#ef5350"/>
  <line x1="646" y1="265" x2="646" y2="325" stroke="#ef5350" stroke-width="2"/>

  <!-- TP1 -1SD hit -->
  <line x1="540" y1="320" x2="700" y2="320" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="545" y="335" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">-1 SD (TP1 hit, +1R)</text>
  <rect x="660" y="310" width="12" height="20" fill="#ef5350"/>
  <line x1="666" y1="300" x2="666" y2="335" stroke="#ef5350" stroke-width="2"/>

  <!-- news reversal candles going back up before -2SD -->
  <rect x="690" y="270" width="12" height="35" fill="#26a69a"/>
  <line x1="696" y1="255" x2="696" y2="315" stroke="#26a69a" stroke-width="2"/>
  <rect x="715" y="220" width="12" height="45" fill="#26a69a"/>
  <line x1="721" y1="205" x2="721" y2="270" stroke="#26a69a" stroke-width="2"/>
  <rect x="740" y="175" width="12" height="40" fill="#26a69a"/>
  <line x1="746" y1="160" x2="746" y2="220" stroke="#26a69a" stroke-width="2"/>

  <!-- news marker -->
  <path d="M700,260 L700,150" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="705" y="150" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">News event bat ngo</text>
  <text x="705" y="168" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">dao chieu manh</text>

  <!-- SL stop line for runner -->
  <line x1="540" y1="250" x2="700" y2="250" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="545" y="245" font-family="Arial, sans-serif" font-size="12" fill="#ef5350">SL runner (quet truoc khi toi -2 SD)</text>

  <!-- -2SD target never reached -->
  <line x1="540" y1="185" x2="700" y2="185" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
  <text x="545" y="180" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c" opacity="0.6">-2 SD (khong bao gio dat toi)</text>

  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">
    <rect x="30" y="470" width="14" height="14" fill="#26a69a"/>
    <text x="50" y="481">Bullish candle</text>
    <rect x="180" y="470" width="14" height="14" fill="#ef5350"/>
    <text x="200" y="481">Bearish candle</text>
    <rect x="330" y="470" width="14" height="14" fill="rgba(41,98,255,0.25)" stroke="#2962ff"/>
    <text x="350" y="481">FVG / confluence zone</text>
    <line x1="560" y1="477" x2="590" y2="477" stroke="#f2c94c" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="600" y="481">SD projection level</text>
  </g>
  <text x="30" y="515" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Ca hai case deu neo dung manipulation leg va co confluence hop le - ket qua khac nhau chi vi rui ro mo hinh (news) khong the loai tru.</text>

  <defs>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
