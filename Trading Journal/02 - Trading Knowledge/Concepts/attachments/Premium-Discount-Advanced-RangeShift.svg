<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Tin tức mở rộng range giữa lệnh — Discount cũ có thể là Premium của range mới</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Một displacement bất ngờ phá đáy dealing range đang dùng, buộc phải vẽ lại toàn bộ bản đồ Premium/Discount</text>

  <!-- Panel 1: original range -->
  <rect x="24" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="94" font-size="13.5" font-weight="700" fill="#1D4ED8">① Range H4 gốc lúc vào lệnh</text>

  <line x1="44" y1="120" x2="340" y2="120" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="48" y="114" font-size="8.5" fill="#6B7280">100% (swing high)</text>
  <line x1="44" y1="240" x2="340" y2="240" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="48" y="234" font-size="8.5" fill="#1D4ED8" font-weight="700">50% Equilibrium</text>
  <line x1="44" y1="360" x2="340" y2="360" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="48" y="374" font-size="8.5" fill="#6B7280">0% (swing low)</text>

  <rect x="44" y="240" width="296" height="120" fill="#16A34A" opacity="0.1"/>
  <text x="200" y="300" font-size="9.5" fill="#166534">Discount (0-50%)</text>

  <circle cx="180" cy="312" r="7" fill="#16A34A"/>
  <text x="192" y="316" font-size="9.5" font-weight="700" fill="#166534">Entry Long tại ~30% (discount)</text>

  <!-- Panel 2: new range after news breaks low -->
  <rect x="392" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="404" y="94" font-size="13.5" font-weight="700" fill="#B91C1C">② Sau displacement tin tức phá đáy</text>

  <line x1="412" y1="120" x2="708" y2="120" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="416" y="114" font-size="8.5" fill="#6B7280">100% (swing high — không đổi)</text>
  <line x1="412" y1="200" x2="708" y2="200" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="416" y="194" font-size="8.5" fill="#1D4ED8" font-weight="700">50% Equilibrium MỚI</text>
  <line x1="412" y1="400" x2="708" y2="400" stroke="#DC2626" stroke-width="1.6"/>
  <text x="416" y="414" font-size="8.5" fill="#B91C1C" font-weight="700">0% (swing low MỚI — thấp hơn nhiều)</text>

  <rect x="412" y="72" width="296" height="128" fill="#DC2626" opacity="0.1"/>
  <text x="560" y="150" font-size="9.5" fill="#B91C1C">Premium (50-100%) của range MỚI</text>

  <!-- same absolute price level as entry, now in premium -->
  <circle cx="548" cy="180" r="7" fill="#B91C1C"/>
  <text x="420" y="230" font-size="9.5" font-weight="700" fill="#B91C1C">Cùng mức giá entry ban đầu —</text>
  <text x="420" y="244" font-size="9.5" font-weight="700" fill="#B91C1C">giờ nằm ở ~65% (premium của range mới)</text>

  <!-- arrow showing the break -->
  <path d="M180,360 L180,400 L548,400 L548,180" fill="none" stroke="#B45309" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="200" y="392" font-size="9" fill="#92400E" font-weight="700">displacement phá đáy range cũ</text>

  <rect x="40" y="412" width="656" height="0"/>
</svg>
