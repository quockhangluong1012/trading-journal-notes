<text x="492.0" y="320.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">6. THEO DÕI</text>
<text x="491.0" y="350.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Sự kiện E0–E9: chạm,</text>
<text x="491.0" y="365.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">xuyên, rejection,</text>
<text x="491.0" y="381.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">acceptance, run, gap</text>
<text x="491.0" y="397.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">known_at cho mỗi nhãn</text>
<rect x="252.0" y="300.0" width="205.0" height="150.0" rx="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
<rect x="252.0" y="300.0" width="205.0" height="30.0" rx="9" fill="#C2410C"/>
<rect x="252.0" y="318.0" width="205.0" height="12.0" rx="0" fill="#C2410C"/>
<text x="264.0" y="320.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">7. CẬP NHẬT</text>
<text x="263.0" y="350.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">DOL: projected → active →</text>
<text x="263.0" y="365.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">delivered → spent / flip</text>
<text x="263.0" y="381.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Ghi lý do; không xóa</text>
<text x="263.0" y="397.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">nhãn cũ (append-only)</text>
<rect x="24.0" y="300.0" width="205.0" height="150.0" rx="9" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.8"/>
<rect x="24.0" y="300.0" width="205.0" height="30.0" rx="9" fill="#B91C1C"/>
<rect x="24.0" y="318.0" width="205.0" height="12.0" rx="0" fill="#B91C1C"/>
<text x="36.0" y="320.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">8. KIỂM CHỨNG</text>
<text x="35.0" y="350.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Mức chốt TRƯỚC phiên</text>
<text x="35.0" y="365.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">So với baseline hình học</text>
<text x="35.0" y="381.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Mẫu đủ lớn, OOS</text>
<text x="35.0" y="397.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Mô tả ≠ Dự báo ≠ Edge</text>
