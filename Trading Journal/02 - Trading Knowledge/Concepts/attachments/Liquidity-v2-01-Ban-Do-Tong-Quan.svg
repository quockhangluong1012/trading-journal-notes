<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Bản đồ tổng quan: Liquidity trong framework nghiên cứu</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Đi theo thứ tự — không nhảy thẳng tới sweep. Mỗi bước có đầu ra cụ thể; bước 8 quay lại sửa định nghĩa ở bước 2–3.</text>
