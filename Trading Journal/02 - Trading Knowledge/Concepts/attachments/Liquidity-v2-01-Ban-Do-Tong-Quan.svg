<text x="720.0" y="104.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">4. BỐI CẢNH</text>
<text x="719.0" y="134.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Market structure (swing nào</text>
<text x="719.0" y="149.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">bảo vệ cấu trúc?)</text>
<text x="719.0" y="165.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Dealing range · Premium/</text>
<text x="719.0" y="181.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Discount · POI HTF</text>
<rect x="708.0" y="300.0" width="205.0" height="150.0" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
<rect x="708.0" y="300.0" width="205.0" height="30.0" rx="9" fill="#7C3AED"/>
