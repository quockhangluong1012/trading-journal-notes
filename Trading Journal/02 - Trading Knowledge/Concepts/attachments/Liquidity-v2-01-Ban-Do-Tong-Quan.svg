<text x="491.0" y="134.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Level 1→5 (micro → HTF)</text>
<text x="491.0" y="149.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Internal / External</text>
<text x="491.0" y="165.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">theo range ĐÃ khai báo</text>
<text x="491.0" y="181.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Cổng G1–G5 (ex-ante…)</text>
