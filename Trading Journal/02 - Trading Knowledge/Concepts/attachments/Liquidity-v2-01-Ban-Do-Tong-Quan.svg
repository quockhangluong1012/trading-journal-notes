<text x="264.0" y="104.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">2. XÁC ĐỊNH</text>
<text x="263.0" y="134.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Swing H/L (thuật toán khai báo)</text>
<text x="263.0" y="149.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">EQH/EQL (dung sai ATR)</text>
<text x="263.0" y="165.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">PDH/PDL · PWH/PWL</text>
<text x="263.0" y="181.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Asia/London H-L  → BSL / SSL</text>
