<text x="720.0" y="320.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">5. MỤC TIÊU</text>
<text x="719.0" y="350.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Ứng viên DOL + đối thủ</text>
<text x="719.0" y="365.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">horizon + invalidation</text>
<text x="719.0" y="381.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Có thể kết luận:</text>
<text x="719.0" y="397.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;chưa có DOL rõ&quot;</text>
<rect x="480.0" y="300.0" width="205.0" height="150.0" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/>
