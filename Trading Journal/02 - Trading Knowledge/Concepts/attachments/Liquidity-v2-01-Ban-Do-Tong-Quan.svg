<text x="36.0" y="104.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="start">1. HIỂU</text>
<text x="35.0" y="134.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Nghĩa thị trường: spread,</text>
<text x="35.0" y="149.9" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">độ sâu, khả năng hồi phục</text>
<text x="35.0" y="165.7" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Nghĩa ICT: mức tham chiếu</text>
<text x="35.0" y="181.6" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">nơi lệnh CÓ THỂ tập trung</text>
