<text x="391.1" y="151.8" font-size="10.5" font-weight="600" fill="#E0464B" text-anchor="end">hôm nay: quét đỉnh cũ</text>
<text x="391.1" y="165.5" font-size="10.5" font-weight="600" fill="#E0464B" text-anchor="end">rồi đóng đỏ</text>
<line x1="268.6" y1="294.3" x2="410.0" y2="294.3" stroke="#15803D" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="408.0" y="308.3" font-size="10" font-weight="600" fill="#15803D" text-anchor="end">đáy swing có ý nghĩa</text>
<rect x="442.0" y="100.0" width="530.0" height="100.0" rx="9" fill="#ECFDF3" stroke="#15803D" stroke-width="1.1"/>
<text x="456.0" y="122.0" font-size="12.8" font-weight="800" fill="#15803D" text-anchor="start">A. Nhịp hồi bình thường</text>
<text x="462.0" y="142.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Không phá đáy swing có ý nghĩa của D1</text>
<text x="462.0" y="157.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Giá đang đi về vùng discount / POI</text>
<text x="462.0" y="173.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Nến giảm không có displacement đặc biệt</text>
<text x="462.0" y="189.6" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="start">→ Bối cảnh tăng còn nguyên. Tìm bullish AMD ở khung nhỏ khi tới POI.</text>
<rect x="442.0" y="210.0" width="530.0" height="116.0" rx="9" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.1"/>
<text x="456.0" y="232.0" font-size="12.8" font-weight="800" fill="#EA580C" text-anchor="start">B. Pha M của một PO3 TUẦN</text>
<text x="462.0" y="252.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Đầu tuần, giá đi XUỐNG dưới giá mở cửa tuần</text>
<text x="462.0" y="267.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Quét một đáy rõ (vd. đáy tuần trước) rồi quay vào</text>
<text x="462.0" y="283.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Đích tuần vẫn ở phía trên</text>
<text x="462.0" y="299.6" font-size="11.5" font-weight="700" fill="#EA580C" text-anchor="start">→ “Ngày giảm” là cú lệch của tuần. Short theo nó = bán đúng đáy của câu chuyện</text>
<text x="462.0" y="315.5" font-size="11.5" font-weight="700" fill="#EA580C" text-anchor="start">tuần.</text>
<rect x="442.0" y="336.0" width="530.0" height="100.0" rx="9" fill="#FEF2F2" stroke="#E0464B" stroke-width="1.1"/>
<text x="456.0" y="358.0" font-size="12.8" font-weight="800" fill="#E0464B" text-anchor="start">C. Bearish AMD thật / đảo chiều</text>
<text x="462.0" y="378.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Trước đó đã quét BSL (đỉnh cũ) rồi thua</text>
<text x="462.0" y="393.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Giá đang ở premium của dealing range</text>
<text x="462.0" y="409.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Phá đáy swing có ý nghĩa bằng thân nến + displacement</text>
<text x="462.0" y="425.6" font-size="11.5" font-weight="700" fill="#E0464B" text-anchor="start">→ Mới đủ để coi bối cảnh có thể đã đổi. Vẫn là giả thuyết.</text>
<rect x="28.0" y="544.0" width="944.0" height="48.6" rx="8" fill="#FFF0F3" stroke="#BE123C" stroke-width="1"/>
<text x="38.0" y="566.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ví dụ trong hình: nến hôm nay vượt đỉnh cũ (quét BSL) rồi đóng đỏ — trông như C. Nhưng nó CHƯA phá đáy swing có ý nghĩa. Ở thời điểm đóng nến, A và C đều</text>
<text x="38.0" y="582.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">còn mở. Câu trả lời trung thực: “chưa đủ bằng chứng” — đứng ngoài hoặc chờ phiên sau, không chọn câu chuyện mình thích.</text>
</svg>
