<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ngày D1 giảm: nhịp hồi trong xu hướng tăng hay Bearish AMD thật?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một cây nến D1 đỏ có thể là ba thứ khác nhau. Chỉ nhìn màu nến thì không phân biệt được — phải nhìn liquidity, vị trí và cấu trúc</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">khung lớn.</text>
<rect x="934.1" y="22.0" width="37.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="953.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">D1</text>
<rect x="28.0" y="100.0" width="400.0" height="430.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="320.0" y1="188.8" x2="410.0" y2="188.8" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="322.0" y="202.8" font-size="10" font-weight="600" fill="#B91C1C" text-anchor="start">đỉnh cũ (BSL)</text>
