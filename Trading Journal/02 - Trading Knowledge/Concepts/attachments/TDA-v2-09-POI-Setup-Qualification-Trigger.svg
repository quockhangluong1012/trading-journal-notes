<svg viewBox="0 0 1000 520" width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1F2937" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="0" y="0" width="1000" height="520" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Bốn khái niệm KHÔNG dùng thay nhau: POI → Development → Qualification → Trigger</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi bậc là điều kiện cần của bậc sau, không phải điều kiện đủ. Phần lớn ngày dừng ở bậc 1 hoặc 2 — và đó là bình thường.</text>
<rect x="26.0" y="96.0" width="228.0" height="380.0" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="40.0" y="124.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">1 · POI</text>
<text x="40.0" y="150.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Vùng giá CẦN QUAN SÁT</text>
<text x="40.0" y="184.2" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">VÍ DỤ (XYZ)</text>
<text x="40.0" y="204.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">D1 FVG 1045–1065 trong</text>
<text x="40.0" y="219.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">discount</text>
<rect x="36.0" y="380.0" width="208.0" height="84.0" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="46.0" y="402.0" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">Không phải: lý do để đặt</text>
<text x="46.0" y="417.1" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">lệnh chờ tại vùng</text>
<line x1="255.0" y1="280.0" x2="264.0" y2="280.0" stroke="#1F2937" stroke-width="2" marker-end="url(#m1F2937)"/>
<rect x="264.0" y="96.0" width="228.0" height="380.0" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="278.0" y="124.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">2 · SETUP DEVELOPMENT</text>
<text x="278.0" y="150.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Diễn biến cho thấy cơ hội</text>
<text x="278.0" y="166.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">CÓ THỂ đang hình thành</text>
<text x="278.0" y="200.4" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">VÍ DỤ (XYZ)</text>
<text x="278.0" y="220.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">H1 hồi về POI, tạo equal</text>
<text x="278.0" y="235.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lows/SSL 1080 ngay phía trên</text>
<rect x="274.0" y="380.0" width="208.0" height="84.0" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="284.0" y="402.0" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">Không phải: 'setup đã có' —</text>
<text x="284.0" y="417.1" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">vẫn có thể tan rã</text>
<line x1="493.0" y1="280.0" x2="502.0" y2="280.0" stroke="#1F2937" stroke-width="2" marker-end="url(#m1F2937)"/>
<rect x="502.0" y="96.0" width="228.0" height="380.0" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="516.0" y="124.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">3 · SETUP QUALIFICATION</text>
<text x="516.0" y="150.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Điều kiện được định nghĩa</text>
<text x="516.0" y="166.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">trước để TIẾP TỤC theo dõi</text>
<text x="516.0" y="182.4" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">ở M5</text>
<text x="516.0" y="216.6" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">VÍ DỤ (XYZ)</text>
<text x="516.0" y="236.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">giá vào zone + trong</text>
<text x="516.0" y="252.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">killzone + pool &amp; mốc MSS đã</text>
<text x="516.0" y="267.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đánh dấu</text>
<rect x="512.0" y="380.0" width="208.0" height="84.0" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="522.0" y="402.0" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">Không phải: tín hiệu vào</text>
<text x="522.0" y="417.1" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">lệnh</text>
<line x1="731.0" y1="280.0" x2="740.0" y2="280.0" stroke="#1F2937" stroke-width="2" marker-end="url(#m1F2937)"/>
<rect x="740.0" y="96.0" width="228.0" height="380.0" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="1.3"/>
<text x="754.0" y="124.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">4 · ENTRY TRIGGER</text>
<text x="754.0" y="150.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Sự kiện cụ thể của MÔ HÌNH</text>
<text x="754.0" y="166.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">cho phép thực thi</text>
<text x="754.0" y="200.4" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">VÍ DỤ (XYZ)</text>
<text x="754.0" y="220.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">sweep pool M5 → MSS có</text>
<text x="754.0" y="235.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">displacement → FVG (theo</text>
<text x="754.0" y="251.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">2022 Model)</text>
<rect x="750.0" y="380.0" width="208.0" height="84.0" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="760.0" y="402.0" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">Không phải: bất kỳ MSS nào ở</text>
<text x="760.0" y="417.1" font-size="11.2" font-weight="400" fill="#B91C1C" text-anchor="start">bất kỳ đâu</text>
<text x="500.0" y="500.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="middle">Lỗi gốc: dùng chữ 'confirmation' cho cả 4 bậc → không biết mình đang ở bậc nào, nên không biết mình đang chờ điều gì.</text>
