<svg viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="568.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Internal vs External cho bé: con tàu, hành khách và con kiến</text>
<rect x="923.4" y="23.0" width="48.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="947.7" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">ELI5</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Ba chuyển động lồng vào nhau. Cái nhỏ đi ngược cái lớn không có nghĩa cái lớn đã đổi hướng.</text>
<rect x="28.0" y="98.5" width="944.0" height="300.0" rx="12" fill="#EFF6FF" stroke="#DADDE3" stroke-width="1.2"/>
<path d="M190.0 258.5 L810.0 258.5 L760.0 318.5 L240.0 318.5 Z" fill="#475569"/>
<rect x="300.0" y="200.5" width="380.0" height="58.0" rx="6" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
<rect x="318.0" y="212.5" width="42.0" height="24.0" rx="3" fill="#E0F2FE" stroke="#475569" stroke-width="1"/>
<rect x="390.0" y="212.5" width="42.0" height="24.0" rx="3" fill="#E0F2FE" stroke="#475569" stroke-width="1"/>
<rect x="462.0" y="212.5" width="42.0" height="24.0" rx="3" fill="#E0F2FE" stroke="#475569" stroke-width="1"/>
<rect x="534.0" y="212.5" width="42.0" height="24.0" rx="3" fill="#E0F2FE" stroke="#475569" stroke-width="1"/>
<rect x="606.0" y="212.5" width="42.0" height="24.0" rx="3" fill="#E0F2FE" stroke="#475569" stroke-width="1"/>
<path d="M40 328.5 Q120 316.5 200 328.5 T360 328.5 T520 328.5 T680 328.5 T840 328.5 T960 328.5" fill="none" stroke="#3B82F6" stroke-width="3"/>
<line x1="560.0" y1="138.5" x2="850.2" y2="138.5" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<polygon points="860.0,138.5 849.2,145.7 849.2,131.2" fill="#2563EB"/>
<text x="710.0" y="128.5" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">CON TÀU đi sang phải (D1)</text>
<circle cx="540.0" cy="224.0" r="6.9" fill="#C026D3"/>
<line x1="540.0" y1="230.9" x2="540.0" y2="245.8" stroke="#C026D3" stroke-width="2.53" stroke-linecap="round"/>
<line x1="540.0" y1="245.8" x2="534.2" y2="258.5" stroke="#C026D3" stroke-width="2.53" stroke-linecap="round"/>
<line x1="540.0" y1="245.8" x2="545.8" y2="258.5" stroke="#C026D3" stroke-width="2.53" stroke-linecap="round"/>
<line x1="540.0" y1="234.3" x2="532.0" y2="242.4" stroke="#C026D3" stroke-width="2.3" stroke-linecap="round"/>
<line x1="540.0" y1="234.3" x2="548.0" y2="242.4" stroke="#C026D3" stroke-width="2.3" stroke-linecap="round"/>
<line x1="520.0" y1="220.5" x2="418.2" y2="220.5" stroke="#C026D3" stroke-width="3" stroke-linecap="round"/>
<polygon points="410.0,220.5 419.1,214.3 419.1,226.6" fill="#C026D3"/>
<text x="470.0" y="188.5" font-size="12" font-weight="700" fill="#C026D3" text-anchor="middle">HÀNH KHÁCH đi sang trái (H1)</text>
<circle cx="552.0" cy="254.5" r="3.0" fill="#111827"/>
<line x1="556.0" y1="244.5" x2="594.8" y2="244.5" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
<polygon points="600.0,244.5 594.2,248.4 594.2,240.6" fill="#0E9F6E"/>
<text x="605.0" y="249.5" font-size="11" font-weight="700" fill="#0E9F6E">con kiến trên giày bò sang phải (M5)</text>
<rect x="28.0" y="410.5" width="306.0" height="150.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="436.0" font-size="13.5" font-weight="700" fill="#2563EB" data-bx="41.0,323.0">Con tàu (D1)</text>
<text x="42.0" y="464.5" font-size="12" font-weight="400" fill="#111827" data-bx="41.0,321.0">Đi sang phải suốt. Đây là cấu trúc EXTERNAL</text>
<text x="42.0" y="481.5" font-size="12" font-weight="400" fill="#111827" data-bx="41.0,321.0">lớn nhất.</text>
<rect x="346.0" y="410.5" width="306.0" height="150.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="360.0" y="436.0" font-size="13.5" font-weight="700" fill="#C026D3" data-bx="359.0,641.0">Hành khách (H1)</text>
<text x="360.0" y="464.5" font-size="12" font-weight="400" fill="#111827" data-bx="359.0,639.0">Đi ngược về bên trái — một pullback. Đổi</text>
<text x="360.0" y="481.5" font-size="12" font-weight="400" fill="#111827" data-bx="359.0,639.0">hướng của hành khách KHÔNG làm con tàu</text>
<text x="360.0" y="498.5" font-size="12" font-weight="400" fill="#111827" data-bx="359.0,639.0">quay đầu.</text>
<rect x="664.0" y="410.5" width="306.0" height="150.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="678.0" y="436.0" font-size="13.5" font-weight="700" fill="#0E9F6E" data-bx="677.0,959.0">Con kiến (M5)</text>
<text x="678.0" y="464.5" font-size="12" font-weight="400" fill="#111827" data-bx="677.0,957.0">Bò sang phải trên giày người đang đi trái. Một</text>
<text x="678.0" y="481.5" font-size="12" font-weight="400" fill="#111827" data-bx="677.0,957.0">M5 CHoCH tăng trong H1 đang giảm có thể chỉ</text>
<text x="678.0" y="498.5" font-size="12" font-weight="400" fill="#111827" data-bx="677.0,957.0">là “kiến đổi hướng”.</text>
<text x="28.0" y="554.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Muốn biết con tàu có quay đầu không, phải nhìn con tàu (khung lớn, lớp external). Nhìn con kiến thì chỉ biết con kiến.</text>
