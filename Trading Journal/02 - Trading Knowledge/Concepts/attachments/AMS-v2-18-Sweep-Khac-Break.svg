<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="498" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Quét (sweep) hay phá (break)? Nhìn chỗ nến ĐÓNG và chuyện xảy ra SAU đó</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một mức đáy. Bên trái: râu chọc qua rồi đóng lại phía trên. Bên phải: thân nến đóng hẳn phía dưới và ở lại đó.</text>
<rect x="843.4" y="22.0" width="128.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="907.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SWEEP ≠ BREAK</text>
<rect x="28.0" y="84.0" width="466.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="104.0" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">A. Quét đáy (liquidity sweep)</text>
<line x1="73.2" y1="144.3" x2="73.2" y2="209.4" stroke="#374151" stroke-width="1.6"/>
<rect x="62.2" y="160.6" width="22.0" height="32.6" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="115.6" y1="183.4" x2="115.6" y2="238.7" stroke="#374151" stroke-width="1.6"/>
<rect x="104.6" y="193.1" width="22.0" height="32.6" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="158.0" y1="212.7" x2="158.0" y2="284.3" stroke="#374151" stroke-width="1.6"/>
<rect x="147.0" y="225.7" width="22.0" height="6.5" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="200.4" y1="176.9" x2="200.4" y2="238.7" stroke="#374151" stroke-width="1.6"/>
<rect x="189.4" y="183.4" width="22.0" height="48.9" rx="2" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/>
<line x1="242.8" y1="141.0" x2="242.8" y2="193.1" stroke="#374151" stroke-width="1.6"/>
<rect x="231.8" y="147.5" width="22.0" height="35.8" rx="2" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/>
<line x1="40.0" y1="258.3" x2="290.0" y2="258.3" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="44.0" y="252.3" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="start">mức đáy cũ</text>
<text x="302.0" y="150.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Râu nến xuống dưới mức đáy.</text>
<text x="302.0" y="171.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nến ĐÓNG lại phía trên.</text>
<text x="302.0" y="192.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nến sau đi lên tiếp.</text>
<text x="302.0" y="213.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">→ Đáy chỉ bị "chọc" qua.</text>
<text x="302.0" y="234.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">→ Cấu trúc CHƯA đổi.</text>
<rect x="506.0" y="84.0" width="466.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="104.0" font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="start">B. Phá đáy (structural break)</text>
<line x1="551.2" y1="144.3" x2="551.2" y2="209.4" stroke="#374151" stroke-width="1.6"/>
<rect x="540.2" y="160.6" width="22.0" height="32.6" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="593.6" y1="183.4" x2="593.6" y2="238.7" stroke="#374151" stroke-width="1.6"/>
<rect x="582.6" y="193.1" width="22.0" height="32.6" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="636.0" y1="219.2" x2="636.0" y2="297.4" stroke="#374151" stroke-width="1.6"/>
<rect x="625.0" y="225.7" width="22.0" height="65.1" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="678.4" y1="261.5" x2="678.4" y2="316.9" stroke="#374151" stroke-width="1.6"/>
<rect x="667.4" y="290.9" width="22.0" height="16.3" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="720.8" y1="271.3" x2="720.8" y2="343.0" stroke="#374151" stroke-width="1.6"/>
<rect x="709.8" y="307.1" width="22.0" height="22.8" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="518.0" y1="258.3" x2="768.0" y2="258.3" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="522.0" y="252.3" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="start">mức đáy cũ</text>
<text x="780.0" y="150.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Thân nến ĐÓNG dưới mức đáy.</text>
<text x="780.0" y="171.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nến sau hồi lên nhưng</text>
<text x="780.0" y="192.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">không lấy lại được mức cũ.</text>
<text x="780.0" y="213.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá ở lại phía dưới.</text>
<text x="780.0" y="234.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">→ Cấu trúc cấp đó đã đổi.</text>
<rect x="28.0" y="396.0" width="944.0" height="47.4" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="28.0" y="396.0" width="5.0" height="47.4" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="42.0" y="415.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đây là KINH NGHIỆM (heuristic), không phải luật tuyệt đối. Một nến đóng dưới đáy vẫn có thể bị kéo ngược lên ở nến sau.</text>
<text x="42.0" y="432.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Vì vậy: lúc nến vừa đóng, chỉ nói "ứng viên phá" hoặc "ứng viên quét". Kết luận đến từ những nến tiếp theo. [BACKTEST REQUIRED]</text>
