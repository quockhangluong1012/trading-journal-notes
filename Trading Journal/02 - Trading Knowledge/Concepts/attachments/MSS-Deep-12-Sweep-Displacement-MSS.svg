<rect x="0" y="0" width="980" height="620" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Sweep → Displacement → MSS → FVG: THỨ TỰ quan sát được, chưa phải nhân quả</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi mắt xích là một sự kiện riêng, có known_at riêng. Chúng thường đi cùng nhau trong ví dụ đẹp — và cũng xuất hiện cùng nhau trên dữ liệu ngẫu nhiên.</text>
<rect x="26.0" y="84.0" width="600.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="270.0" y1="335.0" x2="606.0" y2="335.0" stroke="#D97706" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="606.0" y="351.0" font-size="10" font-weight="600" fill="#B45309" text-anchor="end">① mức ex-ante: đáy cũ (SSL)</text>
<rect x="432.4" y="255.8" width="106.4" height="33.0" rx="2" fill="#F0FDF4" fill-opacity="0.85" stroke="#16A34A" stroke-width="1" stroke-dasharray="3 3"/>
<text x="542.8" y="276.3" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">⑤ FVG</text>
<path d="M46.0,143.6 L90.8,229.4 L124.4,189.8 L180.4,302.0 L219.6,249.2 L270.0,335.0 L309.2,282.2 L359.6,361.4 L382.0,321.8 L415.6,335.0 L460.4,222.8 L488.4,265.7 L538.8,176.6 L566.8,203.0 L606.0,137.0" stroke="#111827" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="415.6" y1="335.0" x2="460.4" y2="222.8" stroke="#7C3AED" stroke-width="5" opacity="0.35"/>
<circle cx="359.6" cy="361.4" r="6" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="359.6" y="383.4" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">② sweep: xuyên + close lại trong</text>
<line x1="309.2" y1="282.2" x2="426.8" y2="282.2" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="309.2" cy="282.2" r="5" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="309.2" y="270.2" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">short-term high</text>
<circle cx="441.9" cy="282.2" r="6" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="429.9" y="252.2" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="end">③ displacement + ④ MSS</text>
<text x="429.9" y="266.2" font-size="9.5" font-weight="400" fill="#6D28D9" text-anchor="end">(close vượt short-term high)</text>
<circle cx="488.4" cy="265.7" r="4.5" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
<text x="488.4" y="285.7" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">⑥</text>
<text x="566.8" y="133.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">⑦ BOS ↑ (G3)</text>
<line x1="60.0" y1="452.0" x2="610.0" y2="452.0" stroke="#475569" stroke-width="1.2"/>
<line x1="359.6" y1="446.0" x2="359.6" y2="458.0" stroke="#475569" stroke-width="1.4"/>
<text x="359.6" y="474.0" font-size="9.3" font-weight="600" fill="#334155" text-anchor="middle">t_sweep</text>
<line x1="441.9" y1="446.0" x2="441.9" y2="458.0" stroke="#475569" stroke-width="1.4"/>
<text x="441.9" y="474.0" font-size="9.3" font-weight="600" fill="#334155" text-anchor="middle">t_MSS</text>
<line x1="471.6" y1="446.0" x2="471.6" y2="458.0" stroke="#475569" stroke-width="1.4"/>
<text x="471.6" y="486.0" font-size="9.3" font-weight="600" fill="#334155" text-anchor="middle">t_FVG</text>
<line x1="496.8" y1="446.0" x2="496.8" y2="458.0" stroke="#475569" stroke-width="1.4"/>
<text x="496.8" y="474.0" font-size="9.3" font-weight="600" fill="#334155" text-anchor="middle">⑥ retrace</text>
<line x1="566.8" y1="446.0" x2="566.8" y2="458.0" stroke="#475569" stroke-width="1.4"/>
<text x="566.8" y="474.0" font-size="9.3" font-weight="600" fill="#334155" text-anchor="middle">t_BOS</text>
<text x="398.8" y="444.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">≤ m nến?</text>
<rect x="640.0" y="84.0" width="314.0" height="400.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="652.0" y="106.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Thứ tự ≠ nhân quả: 4 lời giải thích</text>
<text x="652.0" y="123.0" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="start">A. Câu chuyện ICT [INTERPRETATION]</text>
<text x="652.0" y="137.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">thanh khoản bị lấy để khớp lệnh lớn, rồi</text>
<text x="652.0" y="152.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">giá được 'giao' về phía đối diện.</text>
<text x="652.0" y="166.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="181.4" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">B. Vi cấu trúc [MARKET MECHANICS]</text>
<text x="652.0" y="196.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">stop kích hoạt → impact tạm thời → hết</text>
<text x="652.0" y="210.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">lệnh cùng chiều → hồi về; đôi khi có dòng</text>
<text x="652.0" y="225.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">lệnh ngược chiều thật dùng stop làm đối ứng.</text>
<text x="652.0" y="239.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="254.4" font-size="10" font-weight="700" fill="#334155" text-anchor="start">C. Thông tin/dòng lệnh mới tới trùng lúc</text>
<text x="652.0" y="269.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">(tin, rebalancing, phiên mở) — không liên</text>
<text x="652.0" y="283.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">quan tới 'mức' nào cả.</text>
<text x="652.0" y="298.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="312.8" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">D. Chọn mẫu [BIAS]</text>
<text x="652.0" y="327.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start">ta nhớ chuỗi khi nó thành công; chuỗi giống</text>
<text x="652.0" y="342.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">hệt mà thất bại thì quên.</text>
<text x="652.0" y="356.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="371.2" font-size="10" font-weight="600" fill="#6B7280" text-anchor="start">Phân biệt A/B/C cần dữ liệu ngoài OHLC</text>
<text x="652.0" y="385.8" font-size="10" font-weight="600" fill="#6B7280" text-anchor="start">(sổ lệnh, footprint, tin) — chart không đủ.</text>
<rect x="26.0" y="496.0" width="928.0" height="108.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="42.0" y="518.0" font-size="10.2" font-weight="700" fill="#B45309" text-anchor="start">Dữ liệu ngẫu nhiên cũng tạo ra chuỗi này (MSS-Sim-04, 63.725 MSS internal trên random walk):</text>
<text x="42.0" y="535.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• 9% MSS có cực trị trước đó XUYÊN một đáy/đỉnh đã xác nhận bằng wick rồi close lại (đúng hình 'sweep → MSS').</text>
<text x="42.0" y="552.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• 48% có đáy cũ bị phá bằng CLOSE trước đó (một 'run', không phải sweep). 43% không lấy mức nào.</text>
<text x="42.0" y="569.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Cả ba nhóm có E[R] ≈ 0 và win ≈ null. Vậy: 'có sweep trước MSS' là điều kiện phân loại hữu ích, chưa phải bằng chứng edge. [SIMULATION · BACKTEST REQUIRED]</text>
</svg>