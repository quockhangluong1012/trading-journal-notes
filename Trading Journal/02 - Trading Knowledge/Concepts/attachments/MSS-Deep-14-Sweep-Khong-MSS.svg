<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Sweep KHÔNG có MSS — lấy thanh khoản rồi… không đổi cấu trúc</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Sweep là một PHÉP THỬ (note 20). Kết quả do dòng lệnh tới sau quyết định — và rất thường là tiếp diễn hoặc đi ngang.</text>
<rect x="26.0" y="84.0" width="454.0" height="340.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="104.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">A. Sweep → hồi yếu → tiếp diễn (liquidity run)</text>
<line x1="253.0" y1="303.4" x2="460.0" y2="303.4" stroke="#D97706" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="460.0" y="297.4" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="end">SSL (đáy cũ)</text>
<line x1="277.8" y1="274.4" x2="460.0" y2="274.4" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="460.0" y="268.4" font-size="9.5" font-weight="600" fill="#6D28D9" text-anchor="end">short-term high — không bị phá</text>
<path d="M46.0,135.2 L95.7,222.2 L128.8,187.4 L178.5,274.4 L211.6,233.8 L253.0,303.4 L277.8,274.4 L294.4,315.0 L319.2,283.1 L344.1,297.6 L393.8,355.6 L418.6,338.2 L451.7,384.6" stroke="#111827" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="294.4" cy="315.0" r="5.5" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="294.4" y="337.0" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="middle">sweep</text>
<circle cx="319.2" cy="283.1" r="4.5" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
<line x1="319.2" y1="283.1" x2="335.8" y2="232.0" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
<text x="335.8" y="228.0" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">hồi yếu: không close vượt STH</text>
<text x="393.8" y="377.6" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="middle">SSL kế tiếp bị lấy</text>
<rect x="500.0" y="84.0" width="454.0" height="340.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="512.0" y="104.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">B. Sweep → đi ngang (range), không ai thắng</text>
<line x1="727.0" y1="303.4" x2="934.0" y2="303.4" stroke="#D97706" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="934.0" y="317.4" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="end">SSL (đáy cũ)</text>
<line x1="751.8" y1="268.6" x2="934.0" y2="268.6" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="934.0" y="262.6" font-size="9.5" font-weight="600" fill="#6D28D9" text-anchor="end">short-term high</text>
<path d="M520.0,135.2 L569.7,222.2 L602.8,187.4 L652.5,274.4 L685.6,233.8 L727.0,303.4 L751.8,268.6 L768.4,315.0 L793.2,277.3 L818.1,309.2 L842.9,274.4 L867.8,310.6 L892.6,277.3 L925.7,297.6" stroke="#111827" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="768.4" cy="315.0" r="5.5" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="768.4" y="337.0" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="middle">sweep</text>
<text x="801.5" y="216.2" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">kẹt giữa SSL và STH: không MSS, không run</text>
<rect x="26.0" y="436.0" width="928.0" height="88.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="458.0" font-size="10.2" font-weight="700" fill="#334155" text-anchor="start">Vì sao sweep không đủ:</text>
<text x="42.0" y="474.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Trên random walk khoảng một nửa số lần xuyên mức tự đóng lại bên trong (reflection principle; LS-Sim-01) — 'hình sweep' không cần ai săn stop.</text>
<text x="42.0" y="491.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Chỉ khi rejection có HẬU QUẢ CẤU TRÚC (MSS phá một swing có ý nghĩa, trong m nến) mới thành ứng viên reversal theo framework.</text>
<text x="42.0" y="507.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Ô 'sweep không MSS' = không có setup reversal; nếu hồi yếu mà mất đáy mới → coi như run (note 20 §6).</text>
</svg>