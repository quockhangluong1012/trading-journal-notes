<svg viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="623.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">POI và CHoCH: hai bằng chứng độc lập, hay một bằng chứng đếm hai lần?</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Ma trận vị trí × cấu trúc. Câu hỏi ở dưới cùng quan trọng hơn cả bốn ô.</text>
<rect x="168.0" y="122.5" width="390.0" height="128.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="182.0" y="148.0" font-size="13.5" font-weight="700" fill="#15803D" data-bx="181.0,547.0">Ở POI + có CHoCH</text>
<text x="184.0" y="178.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="183.0,543.0">Trường hợp mô hình ICT 2022 tìm kiếm. Vẫn chỉ là ứng viên.</text>
<rect x="570.0" y="122.5" width="390.0" height="128.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="584.0" y="148.0" font-size="13.5" font-weight="700" fill="#B45309" data-bx="583.0,949.0">Ở POI, KHÔNG CHoCH</text>
<text x="586.0" y="178.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="585.0,945.0">Giá chạm vùng nhưng cấu trúc khung nhỏ chưa đổi. Chờ —</text>
<text x="586.0" y="195.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="585.0,945.0">hoặc giá đi xuyên POI.</text>
<rect x="168.0" y="260.5" width="390.0" height="128.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="182.0" y="286.0" font-size="13.5" font-weight="700" fill="#B45309" data-bx="181.0,547.0">Ngoài POI + có CHoCH</text>
<text x="184.0" y="316.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="183.0,543.0">Cấu trúc đổi giữa “không đâu cả”. Có thông tin, nhưng thiếu</text>
<text x="184.0" y="333.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="183.0,543.0">lý do vị trí.</text>
<rect x="570.0" y="260.5" width="390.0" height="128.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="584.0" y="286.0" font-size="13.5" font-weight="700" fill="#9CA3AF" data-bx="583.0,949.0">Ngoài POI, KHÔNG CHoCH</text>
<text x="586.0" y="316.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="585.0,945.0">Không có gì để làm.</text>
<text x="160.0" y="188.5" font-size="12" font-weight="700" fill="#111827" text-anchor="end">Ở POI</text>
<text x="160.0" y="326.5" font-size="12" font-weight="700" fill="#111827" text-anchor="end">Ngoài POI</text>
<text x="363.0" y="114.5" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">CÓ CHoCH khung nhỏ</text>
<text x="765.0" y="114.5" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">KHÔNG CHoCH</text>
<rect x="28.0" y="408.5" width="944.0" height="89.7" rx="8" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="408.5" width="4.0" height="89.7" rx="2" fill="#B91C1C"/>
<text x="42.0" y="429.0" font-size="12.4" font-weight="700" fill="#B91C1C" data-bx="28.0,972.0">Cái bẫy đếm hai lần</text>
<text x="42.0" y="449.6" font-size="12.4" font-weight="400" fill="#111827" data-bx="28.0,972.0">Nếu một POI là nơi giá hay đảo chiều, thì MỖI LẦN giá đảo chiều ở đó, khung nhỏ gần như chắc chắn sẽ in ra một CHoCH — vì đảo chiều nào cũng phải</text>
<text x="42.0" y="467.2" font-size="12.4" font-weight="400" fill="#111827" data-bx="28.0,972.0">phá một đỉnh/đáy nhỏ. Như vậy CHoCH tại POI một phần là HỆ QUẢ của việc giá đảo chiều tại POI, không phải một bằng chứng hoàn toàn mới. Cộng</text>
<text x="42.0" y="484.8" font-size="12.4" font-weight="400" fill="#111827" data-bx="28.0,972.0">“điểm POI” với “điểm CHoCH” như hai lý do độc lập có thể là đếm trùng.</text>
<rect x="28.0" y="528.5" width="944.0" height="72.1" rx="8" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="528.5" width="4.0" height="72.1" rx="2" fill="#2563EB"/>
<text x="42.0" y="549.0" font-size="12.4" font-weight="700" fill="#2563EB" data-bx="28.0,972.0">Kiểm chứng thế nào</text>
<text x="42.0" y="569.6" font-size="12.4" font-weight="400" fill="#111827" data-bx="28.0,972.0">Cách kiểm tra: so sánh kết quả của “POI + CHoCH” với “POI + vào lệnh ở lần chạm đầu” và với “CHoCH ngoài POI”. Nếu cộng thêm CHoCH không cải</text>
<text x="42.0" y="587.2" font-size="12.4" font-weight="400" fill="#111827" data-bx="28.0,972.0">thiện kỳ vọng (E[R]) so với POI đơn thuần, CHoCH đang không thêm thông tin. [HYPOTHESIS — BACKTEST REQUIRED]</text>
<text x="28.0" y="609.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">“Location” và “structural evidence” vẫn là hai câu hỏi khác nhau (hình 30). Điều chưa biết là chúng có cho hai mẩu thông tin khác nhau hay không.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
