<rect x="28.0" y="405.0" width="300.0" height="93.5" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="40.0" y="429.4" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">① Liquidity event — nến #9</text>
<text x="40.0" y="451.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi qua đáy cũ, nơi có thể có nhiều lệnh chờ.</text>
<text x="40.0" y="467.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Câu hỏi: “thanh khoản đã bị chạm chưa?”. Không</text>
<text x="40.0" y="483.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nói gì về hướng tiếp theo.</text>
<rect x="350.0" y="405.0" width="300.0" height="93.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="362.0" y="429.4" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">② Change in State of Delivery — nến #11</text>
<text x="362.0" y="451.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chặng xuống đã bị lấy lại theo giá đóng cửa. Câu</text>
<text x="362.0" y="467.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hỏi: “phản ứng sau cú quét có đủ để xóa chặng cũ</text>
<text x="362.0" y="483.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">không?”.</text>
<rect x="672.0" y="405.0" width="300.0" height="77.4" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.3"/>
<text x="684.0" y="429.4" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start">③ Market Structure Shift — nến #13</text>
<text x="684.0" y="451.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá đóng vượt swing high. Câu hỏi: “cấu trúc đã</text>
<text x="684.0" y="467.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đổi chưa?”. Muộn nhất, nhiều bằng chứng nhất.</text>
