<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba sự kiện khác nhau: Liquidity Sweep → CISD → MSS</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một chuỗi đảo chiều “sạch” thường chứa ba sự kiện riêng biệt. Mỗi sự kiện trả lời một câu hỏi khác. Đừng gộp chúng thành một.</text>
<rect x="888.3" y="22" width="83.7" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="930.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">TRÌNH TỰ</text>
<text x="28.0" y="588.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
