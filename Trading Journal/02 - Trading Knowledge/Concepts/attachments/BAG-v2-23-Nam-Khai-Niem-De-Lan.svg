<text x="44.0" y="506.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một chuyển động displacement có thể tạo FVG; nếu đi qua mở phiên, có thể có gap thật; nếu dài nhiều nến, có thể gọi là liquidity void; nếu trước đó vượt một đỉnh</text>
<text x="44.0" y="521.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">rồi quay lại, có sweep. Mỗi nhãn phải được kiểm tra RIÊNG.</text>
