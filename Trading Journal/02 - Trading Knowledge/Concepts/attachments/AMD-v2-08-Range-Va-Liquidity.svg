<line x1="615.5" y1="279.8" x2="645.5" y2="237.9" stroke="#B91C1C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="645.5" y="241.8" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">đỉnh bằng nhau (EQH)</text>
<text x="645.5" y="256.1" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">→ BSL của range</text>
<line x1="702.7" y1="397.3" x2="732.7" y2="439.5" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="732.7" y="437.3" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="start">đáy bằng nhau (EQL)</text>
<text x="732.7" y="451.6" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="start">→ SSL của range</text>
<line x1="353.6" y1="376.0" x2="333.6" y2="430.1" stroke="#64748B" stroke-width="1" stroke-dasharray="3,2"/>
<text x="333.6" y="428.0" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="end">đáy nhỏ bên trong</text>
<text x="333.6" y="441.6" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="end">= internal liquidity</text>
<text x="429.3" y="393.0" font-size="11" font-weight="700" fill="#2563EB" text-anchor="start">vùng tích lũy (accumulation candidate)</text>
<text x="806.0" y="136.0" font-size="12.5" font-weight="800" fill="#B91C1C" text-anchor="start">BSL</text>
<text x="806.0" y="154.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lệnh MUA chờ phía trên</text>
<text x="806.0" y="168.3" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đỉnh: chốt lỗ của người bán</text>
<text x="806.0" y="182.6" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">+ lệnh mua khi phá đỉnh</text>
<text x="806.0" y="208.9" font-size="12.5" font-weight="800" fill="#1D4ED8" text-anchor="start">SSL</text>
<text x="806.0" y="226.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lệnh BÁN chờ phía dưới đáy:</text>
<text x="806.0" y="241.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chốt lỗ của người mua +</text>
<text x="806.0" y="255.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lệnh bán khi phá đáy</text>
<text x="806.0" y="281.8" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start">Range</text>
<text x="806.0" y="299.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">nơi lệnh chờ được “xây dần”</text>
<text x="806.0" y="314.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">mỗi lần giá chạm mép mà</text>
<text x="806.0" y="328.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">không phá</text>
<text x="806.0" y="354.7" font-size="12.5" font-weight="800" fill="#64748B" text-anchor="start">Internal</text>
<text x="806.0" y="372.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đỉnh/đáy nhỏ bên trong —</text>
<text x="806.0" y="387.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">dễ bị quét, ít ý nghĩa hơn</text>
<rect x="28.0" y="558.0" width="944.0" height="48.6" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="1"/>
<text x="38.0" y="580.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ba trạng thái KHÁC nhau: liquidity TỒN TẠI (lệnh chờ đang tụ) ≠ liquidity BỊ LẤY (giá chạm và kích hoạt) ≠ liquidity LÀ ĐÍCH (giá đang hướng tới nó). Đừng</text>
<text x="38.0" y="596.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nói “range được tạo ra để thị trường lấy liquidity” — đó là DIỄN GIẢI. Lệnh tụ ở mép vì con người thích dùng mép làm mốc.</text>
