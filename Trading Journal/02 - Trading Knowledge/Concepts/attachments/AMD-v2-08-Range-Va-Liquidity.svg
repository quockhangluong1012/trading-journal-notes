<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Accumulation và liquidity: lệnh chờ tụ ở đâu?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Liquidity (theo nghĩa ICT) = chỗ có nhiều lệnh chờ có thể bị kích hoạt. Liquidity bên trong range nhỏ (internal) và bên ngoài range lớn</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">hơn (external) có tầm quan trọng khác nhau.</text>
