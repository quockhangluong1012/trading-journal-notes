<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Một chân tăng external chứa cả một cấu trúc giảm internal</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trong đợt hồi (pullback) của xu hướng tăng lớn, giá tạo LH–LL nhỏ và hai lần CHoCH internal. Protected low external chưa hề bị chạm.</text>
