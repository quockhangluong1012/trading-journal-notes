<text x="489.1" y="286.1" font-size="10" font-weight="700" fill="#C026D3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="44.0,656.0">internal</text>
<text x="553.1" y="196.2" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="44.0,656.0">BOS ↑ external</text>
<text x="664.0" y="122.5" font-size="14" font-weight="700" fill="#111827">Đọc từng lớp</text>
<text x="664.0" y="144.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="663.0,961.0">External (lớp lớn): 40 → 78 → (hồi) → 92. Trạng</text>
<text x="664.0" y="161.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="663.0,961.0">thái TĂNG chưa bao giờ đổi, vì protected low 40</text>
<text x="664.0" y="178.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="663.0,961.0">còn nguyên.</text>
<text x="664.0" y="209.6" font-size="12" font-weight="400" fill="#E5484D" data-bx="663.0,961.0">Internal (lớp nhỏ, bên trong đợt hồi): đỉnh thấp</text>
<text x="664.0" y="226.6" font-size="12" font-weight="400" fill="#E5484D" data-bx="663.0,961.0">dần, đáy thấp dần → trạng thái GIẢM nội bộ.</text>
<text x="664.0" y="257.7" font-size="12" font-weight="400" fill="#C026D3" data-bx="663.0,961.0">CHoCH ↓ internal: đầu đợt hồi, giá phá cái HL nhỏ</text>
<text x="664.0" y="274.7" font-size="12" font-weight="400" fill="#C026D3" data-bx="663.0,961.0">68 trong chân tăng. Chỉ lớp nhỏ đổi chiều.</text>
<text x="664.0" y="305.7" font-size="12" font-weight="400" fill="#C026D3" data-bx="663.0,961.0">CHoCH ↑ internal: cuối đợt hồi, giá vượt LH nhỏ</text>
<text x="664.0" y="322.8" font-size="12" font-weight="400" fill="#C026D3" data-bx="663.0,961.0">gần nhất 67.5. Đây là loại CHoCH mà mô hình ICT</text>
<text x="664.0" y="339.8" font-size="12" font-weight="400" fill="#C026D3" data-bx="663.0,961.0">2022 dùng để vào lệnh THUẬN chiều lớn.</text>
<text x="664.0" y="370.9" font-size="12" font-weight="400" fill="#B45309" data-bx="663.0,961.0">Cùng một chart: lớp nhỏ đổi chiều hai lần, lớp lớn</text>
<text x="664.0" y="387.9" font-size="12" font-weight="400" fill="#B45309" data-bx="663.0,961.0">không đổi lần nào.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">“Internal” và “external” là quan hệ tương đối với một chân sóng/range đã chọn, không gắn cứng với khung thời gian (LuxAlgo cũng định nghĩa như vậy).</text>
