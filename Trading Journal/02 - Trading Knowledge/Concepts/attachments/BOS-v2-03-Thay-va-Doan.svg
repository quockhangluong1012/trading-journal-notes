<svg viewBox="0 0 900 480" width="900" height="480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bốn lớp khi nhìn một cú phá: cái ta THẤY và cái ta ĐOÁN</title>
<desc>Bốn lớp khi nhìn một cú phá: cái ta THẤY và cái ta ĐOÁN. Cùng một cú phá đỉnh, nhưng mỗi câu nói về nó có độ chắc chắn khác nhau. Note này luôn ghi rõ một câu thuộc lớp nào.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Bốn lớp khi nhìn một cú phá: cái ta THẤY và cái ta ĐOÁN</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Cùng một cú phá đỉnh, nhưng mỗi câu nói về nó có độ chắc chắn khác nhau. Note này luôn ghi rõ một câu thuộc lớp nào.</tspan></text>
<rect x="70.0" y="92.0" width="530.0" height="88.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="70.0" y="92.0" width="5.0" height="88.0" rx="2" fill="#1D9E75"/>
<text x="84.0" y="112.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Lớp 1 — QUAN SÁT ĐƯỢC [MARKET MECHANICS]</tspan></text>
<text x="84.0" y="131.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Giá đã giao dịch cao hơn đỉnh cũ. Nến đóng cửa ở trên hoặc dưới đỉnh cũ. Có hoặc</tspan></text>
<text x="84.0" y="148.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>không có khoảng trống (FVG). Ai cũng kiểm tra lại được.</tspan></text>
<rect x="70.0" y="188.0" width="530.0" height="88.0" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.0"/>
<rect x="70.0" y="188.0" width="5.0" height="88.0" rx="2" fill="#2563EB"/>
<text x="84.0" y="208.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Lớp 2 — NHÃN ICT [ICT FRAMEWORK]</tspan></text>
<text x="84.0" y="227.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Ta GỌI sự kiện đó là &quot;bullish BOS&quot; nếu cấu trúc trước đó đang tăng và đỉnh bị phá là</tspan></text>
<text x="84.0" y="244.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>một swing có ý nghĩa. Nhãn là quy ước, không phải sự thật tự nhiên.</tspan></text>
<rect x="70.0" y="284.0" width="530.0" height="88.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="70.0" y="284.0" width="5.0" height="88.0" rx="2" fill="#B45309"/>
<text x="84.0" y="304.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Lớp 3 — CƠ CHẾ HỢP LÝ [INTERPRETATION]</tspan></text>
<text x="84.0" y="323.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Lệnh mua chủ động có thể đã ăn hết lệnh bán chờ quanh đỉnh; lệnh dừng lỗ phía trên</tspan></text>
<text x="84.0" y="340.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>có thể đã bị kích hoạt. Hợp lý, nhưng OHLC không chứng minh được.</tspan></text>
<rect x="70.0" y="380.0" width="530.0" height="88.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="70.0" y="380.0" width="5.0" height="88.0" rx="2" fill="#DC2626"/>
<text x="84.0" y="400.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Lớp 4 — KHÔNG THỂ BIẾT TỪ BIỂU ĐỒ</tspan></text>
<text x="84.0" y="419.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Ai đã mua? Họ có &quot;cố ý&quot; không? Có phải &quot;Smart Money&quot; không? Giá có chắc đi tiếp</tspan></text>
<text x="84.0" y="436.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>không? Biểu đồ nến không trả lời được những câu này.</tspan></text>
<line x1="44.0" y1="96.0" x2="44.0" y2="452.0" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ar_mute)"/>
<text x="34" y="300" font-size="12" fill="#6B7280" text-anchor="middle" transform="rotate(-90 34 300)" font-weight="700">độ chắc chắn giảm dần</text>
<rect x="616.0" y="92.0" width="260.0" height="376.0" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.0"/>
<rect x="616.0" y="92.0" width="5.0" height="376.0" rx="2" fill="#7C3AED"/>
<text x="630.0" y="112.0" font-size="13" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">Bé hiểu theo cách này</tspan></text>
<text x="630.0" y="131.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="642.0" y="131.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Nhìn dấu chân trên bãi cát.</tspan></text>
<text x="630.0" y="150.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="642.0" y="150.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>THẤY: chắc chắn có người đã đi qua</tspan></text>
<text x="642.0" y="167.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>(lớp 1).</tspan></text>
<text x="630.0" y="185.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="642.0" y="185.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>GỌI TÊN: &quot;dấu chân người lớn&quot; (lớp 2).</tspan></text>
<text x="630.0" y="204.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="642.0" y="204.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan>ĐOÁN: bước dài nên chắc họ đi vội (lớp</tspan></text>
<text x="642.0" y="220.7" font-size="12" fill="#1F2937" text-anchor="start"><tspan>3).</tspan></text>
<text x="630.0" y="239.3" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="642.0" y="239.3" font-size="12" fill="#1F2937" text-anchor="start"><tspan>KHÔNG BIẾT: họ là ai, vì sao đi, sẽ</tspan></text>
<text x="642.0" y="255.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>quay lại không (lớp 4).</tspan></text>
<text x="630.0" y="274.4" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="642.0" y="274.4" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Lỗi hay gặp: nói lớp 4 như thể đó là lớp</tspan></text>
<text x="642.0" y="291.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>1 — ví dụ &quot;Smart Money vừa phá đỉnh</tspan></text>
<text x="642.0" y="307.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>để gom hàng&quot;.</tspan></text>
</svg>
