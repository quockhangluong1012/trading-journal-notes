<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case: BPR xếp chồng trong 1 cú V — chọn overlap nào?</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">15.1 Nhiều cặp FVG hợp lệ về số học — chỉ CORE overlap gần điểm sweep mới đáng trade</text>

  <!-- Price path V shape -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.3">
    <line x1="60" y1="120" x2="1140" y2="120"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="360" x2="1140" y2="360"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="600" x2="1140" y2="600"/>
  </g>

  <!-- Candles down to sweep -->
  <g>
    <rect x="80" y="180" width="18" height="60" fill="#ef4444"/>
    <line x1="89" y1="170" x2="89" y2="250" stroke="#ef4444" stroke-width="2"/>
    <rect x="130" y="240" width="18" height="80" fill="#ef4444"/>
    <line x1="139" y1="230" x2="139" y2="330" stroke="#ef4444" stroke-width="2"/>
    <rect x="180" y="330" width="18" height="120" fill="#ef4444"/>
    <line x1="189" y1="320" x2="189" y2="460" stroke="#ef4444" stroke-width="2"/>
    <rect x="230" y="460" width="18" height="90" fill="#ef4444"/>
    <line x1="239" y1="450" x2="239" y2="565" stroke="#f97316" stroke-width="3"/>
    <text x="200" y="590" font-size="13" fill="#f97316" font-weight="bold">① Sweep SSL (đáy quét)</text>
  </g>

  <!-- Chop candles at bottom then reverse V -->
  <g>
    <rect x="290" y="500" width="16" height="45" fill="#22c55e"/>
    <rect x="330" y="480" width="16" height="50" fill="#ef4444"/>
    <rect x="370" y="460" width="16" height="55" fill="#22c55e"/>
    <text x="280" y="620" font-size="12" fill="#94a3b8">chop "trạm inducement" — nhiều overlap</text>
    <text x="280" y="638" font-size="12" fill="#94a3b8">hợp lệ về số học nhưng không ai bảo vệ</text>
  </g>

  <!-- reversal leg up -->
  <g>
    <rect x="420" y="380" width="18" height="90" fill="#22c55e"/>
    <line x1="429" y1="365" x2="429" y2="480" stroke="#22c55e" stroke-width="2"/>
    <rect x="470" y="270" width="18" height="110" fill="#22c55e"/>
    <line x1="479" y1="255" x2="479" y2="390" stroke="#22c55e" stroke-width="2"/>
    <rect x="520" y="180" width="18" height="90" fill="#22c55e"/>
    <line x1="529" y1="165" x2="529" y2="280" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Overlap zones: shallow, mid, core -->
  <rect x="240" y="440" width="330" height="45" fill="#eab308" opacity="0.18" stroke="#eab308" stroke-dasharray="4,3"/>
  <text x="580" y="465" font-size="13" fill="#eab308">Overlap NÔNG — bị xuyên qua, chỉ là mồi</text>

  <rect x="240" y="400" width="330" height="35" fill="#eab308" opacity="0.15" stroke="#eab308" stroke-dasharray="4,3"/>
  <text x="580" y="422" font-size="13" fill="#94a3b8">Overlap GIỮA — cũng bị xuyên</text>

  <rect x="240" y="330" width="330" height="40" fill="#a78bfa" opacity="0.3" stroke="#a78bfa" stroke-width="2"/>
  <text x="580" y="355" font-size="15" fill="#a78bfa" font-weight="bold">★ CORE overlap — gần điểm sweep nhất</text>
  <text x="580" y="373" font-size="13" fill="#a78bfa">→ giá phản ứng THẬT ở đây (CE)</text>

  <!-- price continues -->
  <line x1="538" y1="270" x2="620" y2="200" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="640" y="200" font-size="13" fill="#22c55e">giá chạy tiếp lên BSL</text>

  <!-- annotation box right side -->
  <g transform="translate(700,90)">
    <rect x="0" y="0" width="450" height="280" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="16" y="28" font-size="16" fill="#e2e8f0" font-weight="bold">Quy tắc chọn overlap đúng</text>
    <text x="16" y="55" font-size="13" fill="#94a3b8">1. Trong 1 cú V, chỉ tô đậm MỘT BPR:</text>
    <text x="30" y="75" font-size="13" fill="#94a3b8">overlap gần điểm sweep nhất.</text>
    <text x="16" y="100" font-size="13" fill="#94a3b8">2. Các overlap nông = "trạm inducement"</text>
    <text x="30" y="120" font-size="13" fill="#94a3b8">— retail đặt limit sớm ở đó, stop của họ</text>
    <text x="30" y="140" font-size="13" fill="#94a3b8">là nhiên liệu để giá về CORE.</text>
    <text x="16" y="165" font-size="13" fill="#94a3b8">3. Nếu giá phản ứng ở overlap nông và</text>
    <text x="30" y="185" font-size="13" fill="#94a3b8">chạy mất — chấp nhận lỡ, không đuổi giá.</text>
    <rect x="16" y="205" width="418" height="55" fill="#0f1420" stroke="#334155"/>
    <text x="26" y="225" font-size="12" fill="#38bdf8">Log: bpr_position_in_v: core | mid | shallow</text>
    <text x="26" y="245" font-size="12" fill="#94a3b8">→ đối chiếu win rate sau 20-30 mẫu</text>
  </g>

  <text x="30" y="700" font-size="13" fill="#94a3b8" font-style="italic">Không phải mọi cặp FVG chồng nhau kể cùng một câu chuyện — chỉ cặp "kẹp" đúng điểm đảo chiều mới có edge thật.</text>
</svg>
