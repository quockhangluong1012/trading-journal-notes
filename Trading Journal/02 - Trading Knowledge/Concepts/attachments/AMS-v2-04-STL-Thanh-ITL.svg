<svg viewBox="0 0 1000 520" width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="518" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Một STL trở thành ITL như thế nào?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">c là một STL bình thường. Nó được "lên cấp" chỉ khi STL bên trái (b) và STL bên phải (d) đều cao hơn nó.</text>
<rect x="876.2" y="22.0" width="95.8" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="924.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STL → ITL</text>
<rect x="28.0" y="84.0" width="620.0" height="410.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<polyline points="62.0,145.3 117.2,273.3 172.4,188.0 227.6,337.3 282.8,230.7 338.0,444.0 393.2,294.7 448.4,358.7 503.6,209.3 558.8,316.0 614.0,124.0" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="117.2" cy="273.3" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="117.2" y="289.3" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">a · STL</text>
<circle cx="227.6" cy="337.3" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="227.6" y="353.3" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">b · STL</text>
<circle cx="338.0" cy="444.0" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="338.0" cy="444.0" r="2.5" fill="#2563EB" stroke="none" stroke-width="2"/>
<text x="338.0" y="465.0" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">c · ITL</text>
<circle cx="448.4" cy="358.7" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="448.4" y="374.7" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">d · STL</text>
<circle cx="558.8" cy="316.0" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="558.8" y="332.0" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">e · STL</text>
<line x1="227.6" y1="444.0" x2="448.4" y2="444.0" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="227.6" y1="440.0" x2="227.6" y2="367.3" stroke="#2563EB" stroke-width="1.4"/>
<polygon points="227.6,367.3 230.7,374.7 224.5,374.7" fill="#2563EB"/>
<text x="217.6" y="412.7" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end">cao hơn c</text>
<line x1="448.4" y1="440.0" x2="448.4" y2="388.7" stroke="#2563EB" stroke-width="1.4"/>
<polygon points="448.4,388.7 451.5,396.0 445.3,396.0" fill="#2563EB"/>
<text x="458.4" y="423.3" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="start">cao hơn c</text>
<rect x="664.0" y="96.0" width="308.0" height="97.4" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.3"/>
<rect x="664.0" y="96.0" width="5.0" height="97.4" rx="2" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="0"/>
<text x="678.0" y="115.5" font-size="11.5" font-weight="700" fill="#9CA3AF" text-anchor="start">b · STL</text>
<text x="678.0" y="132.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Vì sao b KHÔNG phải ITL?</text>
<text x="678.0" y="148.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Bên trái b có a cao hơn — tốt.</text>
<text x="678.0" y="165.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nhưng bên phải b lại có c THẤP hơn.</text>
<text x="678.0" y="182.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">b thua hàng xóm → vẫn chỉ là STL.</text>
<rect x="664.0" y="196.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="664.0" y="196.0" width="5.0" height="80.7" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="678.0" y="215.5" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">c · ITL</text>
<text x="678.0" y="232.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Trái: b cao hơn c. Phải: d cao hơn c.</text>
<text x="678.0" y="248.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">c thấp hơn cả hai hàng xóm cùng cấp.</text>
<text x="678.0" y="265.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">→ c là ITL (và vẫn là STL).</text>
<rect x="664.0" y="280.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.3"/>
<rect x="664.0" y="280.0" width="5.0" height="80.7" rx="2" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="0"/>
<text x="678.0" y="299.5" font-size="11.5" font-weight="700" fill="#9CA3AF" text-anchor="start">d · STL</text>
<text x="678.0" y="316.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">d cao hơn c nên d không thể là ITL</text>
<text x="678.0" y="332.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ở đây. d đóng vai "người làm chứng"</text>
<text x="678.0" y="349.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bên phải cho c.</text>
<rect x="664.0" y="364.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="664.0" y="364.0" width="5.0" height="80.7" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="678.0" y="383.5" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">Lưu ý thời điểm</text>
<text x="678.0" y="400.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">c chỉ được gọi là ITL SAU KHI d đã</text>
<text x="678.0" y="416.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hình thành và được xác nhận.</text>
<text x="678.0" y="433.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Trước lúc đó: "ITL ứng viên".</text>
