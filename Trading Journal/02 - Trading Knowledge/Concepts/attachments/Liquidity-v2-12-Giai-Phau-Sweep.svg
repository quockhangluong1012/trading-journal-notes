<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Sweep là KẾT QUẢ PHÂN XỬ sau khi xuyên mức, không phải hình dạng của một cây nến lúc đang chạy.</text>
