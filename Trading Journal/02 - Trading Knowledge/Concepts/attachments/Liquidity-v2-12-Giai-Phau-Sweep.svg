<line x1="350.0" y1="231.7" x2="610.0" y2="231.7" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="614.0" y="243.7" font-size="10.5" fill="#6B7280" font-weight="700" text-anchor="start">L−δ</text>
<rect x="428.0" y="104.0" width="114.0" height="392.0" rx="4" fill="#B45309" fill-opacity="0.06" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
<text x="485.0" y="488.0" font-size="10.5" fill="#B45309" font-weight="700" text-anchor="middle">cửa sổ phân xử: nến j + k = 3 nến sau</text>
<text x="440.0" y="177.8" font-size="13" fill="#1F2937" font-weight="700" text-anchor="middle">j</text>
<text x="454.0" y="189.8" font-size="10" fill="#C2410C" font-weight="600" text-anchor="start">cực trị sweep</text>
<line x1="418.0" y1="185.8" x2="418.0" y2="217.3" stroke="#C2410C" stroke-width="1.2" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<text x="414.0" y="205.6" font-size="10" fill="#C2410C" font-weight="600" text-anchor="end">độ sâu</text>
<line x1="431.0" y1="237.4" x2="170.0" y2="142.8" stroke="#1F2937" stroke-width="1"/>
<text x="168.0" y="124.8" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">Close nến j &lt; L−δ ⇒ REJECTED (E2)</text>
<text x="168.0" y="139.8" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">known_at của nhãn = close nến j</text>
<line x1="312.0" y1="314.8" x2="510.0" y2="314.8" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="655.0" y="342.3" font-size="10.5" fill="#1D4ED8" font-weight="700" text-anchor="end">close &lt; swing low nội bộ → MSS?</text>
<rect x="432.0" y="240.3" width="158.0" height="37.3" rx="2" fill="#10B981" fill-opacity="0.25"/>
<text x="594.0" y="262.9" font-size="10.5" fill="#0F766E" font-weight="700" text-anchor="start">FVG</text>
<rect x="680.0" y="74.0" width="236.0" height="430.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="692.0" y="96.0" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">Trạng thái theo thời gian</text>
<rect x="692.0" y="112.0" width="212.0" height="48.0" rx="6" fill="#6B7280" fill-opacity="0.09" stroke="#6B7280" stroke-width="1"/>
<text x="702.0" y="131.0" font-size="10.8" fill="#6B7280" font-weight="700" text-anchor="start">Trước j</text>
<text x="702.0" y="149.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">ARMED — mức trong danh sách</text>
<line x1="798.0" y1="161.0" x2="798.0" y2="169.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#m2)"/>
<rect x="692.0" y="170.0" width="212.0" height="48.0" rx="6" fill="#B45309" fill-opacity="0.09" stroke="#B45309" stroke-width="1"/>
<text x="702.0" y="189.0" font-size="10.8" fill="#B45309" font-weight="700" text-anchor="start">Trong nến j</text>
<text x="702.0" y="207.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">PENETRATED — chưa phân loại</text>
<line x1="798.0" y1="219.0" x2="798.0" y2="227.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#m2)"/>
<rect x="692.0" y="228.0" width="212.0" height="48.0" rx="6" fill="#C2410C" fill-opacity="0.09" stroke="#C2410C" stroke-width="1"/>
<text x="702.0" y="247.0" font-size="10.8" fill="#C2410C" font-weight="700" text-anchor="start">Close nến j</text>
<text x="702.0" y="265.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">REJECTED → nhãn SWEEP (E2)</text>
<line x1="798.0" y1="277.0" x2="798.0" y2="285.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#m2)"/>
<rect x="692.0" y="286.0" width="212.0" height="48.0" rx="6" fill="#1D4ED8" fill-opacity="0.09" stroke="#1D4ED8" stroke-width="1"/>
<text x="702.0" y="305.0" font-size="10.8" fill="#1D4ED8" font-weight="700" text-anchor="start">j+1 … j+m</text>
<text x="702.0" y="323.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Chờ MSS + displacement</text>
<line x1="798.0" y1="335.0" x2="798.0" y2="343.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#m2)"/>
<rect x="692.0" y="344.0" width="212.0" height="48.0" rx="6" fill="#15803D" fill-opacity="0.09" stroke="#15803D" stroke-width="1"/>
<text x="702.0" y="363.0" font-size="10.8" fill="#15803D" font-weight="700" text-anchor="start">Nếu có</text>
<text x="702.0" y="381.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">REVERSAL CONF. (DEF-LS-06)</text>
<rect x="692.0" y="402.0" width="212.0" height="48.0" rx="6" fill="#B91C1C" fill-opacity="0.09" stroke="#B91C1C" stroke-width="1"/>
<text x="702.0" y="421.0" font-size="10.8" fill="#B91C1C" font-weight="700" text-anchor="start">Nếu không</text>
<text x="702.0" y="439.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">STALE — sweep không xác nhận</text>
<text x="692.0" y="470.0" font-size="10.8" fill="#B91C1C" font-weight="700" text-anchor="start">Chưa phải entry. Chưa biết kết quả.</text>
<text x="692.0" y="488.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">Tham số khai báo trước backtest.</text>
<rect x="24.0" y="514.0" width="892.0" height="72.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="534.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">DEF-LS-04 (tóm tắt): mức L có known_at trước sự kiện; nến j đầu tiên có high &gt; L+ε. SWEEP nếu trong [j, j+k] có close &lt; L−δ</text>
<text x="40.0" y="551.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">trước khi có acceptance (2 close liên tiếp &gt; L hoặc 1 close &gt; L + 0.5·ATR). Hết j + k chưa phân xử → EXPIRED. Mặc định M5–M15: ε = 0.02·ATR,</text>
<text x="40.0" y="568.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">δ = 0.25·ATR, k = 3. Displacement + MSS KHÔNG nằm trong định nghĩa sweep — chúng là lớp xác nhận riêng (DEF-LS-06).</text>
<text x="24.0" y="606.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-12 · Nến minh họa, giá giả định. Định nghĩa đầy đủ: [[20-Liquidity-Sweep]] §5.6, §11.3, §12.3.</text>
