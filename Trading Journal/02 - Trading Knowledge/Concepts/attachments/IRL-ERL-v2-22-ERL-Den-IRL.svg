<text x="658.0" y="109.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Trình tự</text>
<circle cx="668.0" cy="126.0" r="10" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="130.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="686.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Giá vượt đỉnh range: BSL (ERL trên) bị chạm.</text>
<circle cx="668.0" cy="156.0" r="10" fill="#475569" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="160.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="686.0" y="160.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Nến đóng cửa lại BÊN TRONG range — chưa</text>
<text x="686.0" y="176.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">được chấp nhận bên ngoài.</text>
<circle cx="668.0" cy="198.6" r="10" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="202.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="686.0" y="202.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Displacement xuống, phá đáy nội bộ gần nhất</text>
<text x="686.0" y="218.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">(MSS ở khung này).</text>
<circle cx="668.0" cy="241.1" r="10" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="245.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="686.0" y="245.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Giá về IRL bên trong: FVG tăng cũ nằm ở nửa</text>
<text x="686.0" y="261.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">discount, gần EQ.</text>
<circle cx="668.0" cy="283.7" r="10" fill="#475569" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="287.7" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="686.0" y="287.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Tại IRL: giá có thể phản ứng (bắt đầu nhịp mới)</text>
<text x="686.0" y="304.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">hoặc đi tiếp về ERL dưới. Chưa biết.</text>
<rect x="28.0" y="531.0" width="466.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="541.0" width="4.0" height="108.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="44.0" y="554.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Điều gì làm diễn giải mạnh lên</text>
<text x="44.0" y="575.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Râu vượt đỉnh nhưng thân nến đóng lại bên trong.</text>
<text x="44.0" y="591.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Displacement ngược chiều ngay sau đó, phá đáy nội bộ.</text>
<text x="44.0" y="608.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Cú vượt xảy ra tại POI khung lớn / trong killzone.</text>
<rect x="506.0" y="531.0" width="466.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="506.0" y="541.0" width="4.0" height="108.0" rx="2" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="522.0" y="554.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">Điều gì phủ nhận diễn giải</text>
<text x="522.0" y="575.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Hai–ba nến đóng cửa trên đỉnh và giữ được khi test lại.</text>
<text x="522.0" y="591.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Cú quay xuống yếu, không phá được đáy nội bộ.</text>
<text x="522.0" y="608.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Bias khung lớn vẫn tăng và đích lớn ở phía trên chưa bị lấy.</text>
<rect x="28.0" y="671.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="695.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Sweep ERL không TỰ ĐỘNG làm giá về IRL. Nó chỉ mở ra khả năng đó. Bước 2 và 3 mới là bằng chứng. Ở bước 1 một mình, cả “breakout” lẫn “sweep” đều còn</text>
<text x="42.0" y="711.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nguyên khả năng.</text>
</svg>
