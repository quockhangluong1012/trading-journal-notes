<text x="932.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DELIVERY</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">ERL → IRL: giá chạm “ga cuối” bên ngoài rồi quay về “trạm dừng” bên trong</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Nửa “đi vào” của nhịp con lắc. Sau khi một ERL bị lấy, IRL ở phía ngược lại thường là đích GẦN, trước khi tính tới ERL đối diện. Hình dựng (synthetic).</text>
