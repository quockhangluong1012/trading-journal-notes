<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="38" fill="#d1d4dc" font-size="20" font-weight="bold" text-anchor="middle">Reflexivity: vong lap phan hoi giua dam dong ICT va gia</text>
  <text x="480" y="60" fill="#787b86" font-size="13" text-anchor="middle">Tu Keynesian beauty contest den bay dam dong ICT</text>

  <!-- Loop diagram -->
  <circle cx="480" cy="230" r="150" fill="none" stroke="#2a2e39" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Node 1: Method popularized -->
  <rect x="380" y="90" width="200" height="60" rx="6" fill="#181c27" stroke="#f2c94c" stroke-width="1.5"/>
  <text x="480" y="115" fill="#f2c94c" font-size="12" font-weight="bold" text-anchor="middle">1. Mo hinh ICT tro nen</text>
  <text x="480" y="133" fill="#f2c94c" font-size="12" font-weight="bold" text-anchor="middle">pho bien (sweep-MSS-FVG)</text>

  <!-- Node 2: Crowd clusters orders -->
  <rect x="640" y="200" width="220" height="60" rx="6" fill="#181c27" stroke="#26a69a" stroke-width="1.5"/>
  <text x="750" y="225" fill="#26a69a" font-size="12" font-weight="bold" text-anchor="middle">2. Dam dong cum lenh entry</text>
  <text x="750" y="243" fill="#26a69a" font-size="12" font-weight="bold" text-anchor="middle">va stop tai cung vi tri</text>

  <!-- Node 3: New liquidity pool forms -->
  <rect x="380" y="360" width="200" height="60" rx="6" fill="#181c27" stroke="#ef5350" stroke-width="1.5"/>
  <text x="480" y="385" fill="#ef5350" font-size="12" font-weight="bold" text-anchor="middle">3. Cum lenh do thanh</text>
  <text x="480" y="403" fill="#ef5350" font-size="12" font-weight="bold" text-anchor="middle">vung thanh khoan moi</text>

  <!-- Node 4: SM adapts and targets -->
  <rect x="60" y="200" width="220" height="60" rx="6" fill="#181c27" stroke="#5b8def" stroke-width="1.5"/>
  <text x="170" y="225" fill="#5b8def" font-size="12" font-weight="bold" text-anchor="middle">4. Thuat toan/SM thich nghi,</text>
  <text x="170" y="243" fill="#5b8def" font-size="12" font-weight="bold" text-anchor="middle">nham vao vung do de khop lenh</text>

  <!-- Arrows -->
  <path d="M 560 150 Q 650 160 700 200" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 720 260 Q 620 340 580 375" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 390 Q 280 340 240 260" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 240 200 Q 300 160 400 148" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="480" y="235" fill="#787b86" font-size="11" text-anchor="middle">Vong lap</text>
  <text x="480" y="250" fill="#787b86" font-size="11" text-anchor="middle">tu cung co</text>

  <!-- Bottom: Keynesian beauty contest analogy -->
  <rect x="40" y="450" width="880" height="70" fill="#181c27" stroke="#2a2e39"/>
  <text x="480" y="472" fill="#d1d4dc" font-size="13" font-weight="bold" text-anchor="middle">An du Keynesian Beauty Contest</text>
  <text x="480" y="495" fill="#d1d4dc" font-size="11" text-anchor="middle">Nguoi thang khong phai nguoi chon dep nhat theo mat minh, ma la nguoi doan dung DA SO se chon ai</text>
  <text x="480" y="512" fill="#787b86" font-size="10" text-anchor="middle">Tuong tu: trader thanh cong la nguoi doan dung noi dam dong dat lenh, khong phai nguoi tim setup dung sach nhat</text>
</svg>
