<text x="924.4" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CASE STUDY</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Phân biệt pullback với reversal bằng cách hỏi: protected swing của KHUNG NÀO đã bị phá?</text>
