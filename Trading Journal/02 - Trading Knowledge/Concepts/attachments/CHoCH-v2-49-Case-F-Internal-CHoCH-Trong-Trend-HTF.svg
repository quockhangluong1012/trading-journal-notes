<text x="425.3" y="573.4" font-size="10" font-weight="700" fill="#0E9F6E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">đáy hồi</text>
<rect x="600.0" y="92.5" width="372.0" height="521.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="614.0" y="106.5" width="165.8" height="20.0" rx="10.0" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1"/>
<text x="696.9" y="118.7" font-size="11" font-weight="700" fill="#0D9488" text-anchor="middle">Internal CHoCH — pullback</text>
<text x="616.0" y="150.5" font-size="11" font-weight="700" fill="#6B7280">BỐI CẢNH</text>
<text x="616.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">H1 tăng, protected low H1 = 50 còn nguyên. Giá đang hồi.</text>
<text x="616.0" y="188.9" font-size="11" font-weight="700" fill="#6B7280">M5</text>
<text x="616.0" y="204.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đầu đợt hồi: CHoCH ↓ M5 (đổi lớp nhỏ sang giảm). Cuối đợt</text>
<text x="616.0" y="221.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">hồi: CHoCH ↑ M5 (đổi lại sang tăng).</text>
<text x="616.0" y="243.9" font-size="11" font-weight="700" fill="#6B7280">PHÂN LOẠI</text>
<text x="616.0" y="259.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Cả hai đều là CHoCH internal. Không cái nào đổi H1.</text>
<text x="616.0" y="282.3" font-size="11" font-weight="700" fill="#6B7280">REVERSAL hay PULLBACK?</text>
<text x="616.0" y="298.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Pullback — vì protected low H1 chưa bị phá. Muốn nói</text>
<text x="616.0" y="314.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">“reversal H1” cần H1 CHoCH ↓ (thủng 50) + LH mới + BOS</text>
<text x="616.0" y="331.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">↓ trên H1.</text>
<text x="616.0" y="353.8" font-size="11" font-weight="700" fill="#6B7280">HÀM Ý</text>
<text x="616.0" y="369.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">CHoCH ↓ M5 ở đầu đợt hồi: không phải lệnh Short. CHoCH</text>
<text x="616.0" y="386.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">↑ M5 ở cuối đợt hồi, tại POI: ứng viên Long thuận H1.</text>
<text x="616.0" y="408.7" font-size="11" font-weight="700" fill="#6B7280">VÔ HIỆU</text>
<text x="616.0" y="424.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đóng nến H1 dưới 50.</text>
<text x="28.0" y="644.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cùng một M5 CHoCH ↑ có thể là “kết thúc pullback” (thuận H1) hoặc “hồi trong downtrend H1” (ngược H1). Khung lớn quyết định cách đọc.</text>
