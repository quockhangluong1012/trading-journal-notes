<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Cases đắt giá nhất: Void giả cuối tuần vs Void trong nến tin</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">Hai bẫy phổ biến nhất khi phân loại và giao dịch Liquidity Void</text>

  <!-- LEFT PANEL: weekend gap -->
  <g transform="translate(40,100)">
    <rect x="0" y="0" width="520" height="580" fill="#1e293b" opacity="0.3" stroke="#334155" rx="8"/>
    <text x="16" y="30" font-size="18" fill="#e2e8f0" font-weight="bold">16.1 Void giả — gap cuối tuần</text>
    <g stroke="#1c2333"><line x1="16" y1="120" x2="500" y2="120"/><line x1="16" y1="200" x2="500" y2="200"/><line x1="16" y1="280" x2="500" y2="280"/></g>

    <!-- Friday close candles -->
    <rect x="40" y="150" width="16" height="40" fill="#ef4444"/><line x1="48" y1="140" x2="48" y2="200" stroke="#ef4444" stroke-width="2"/>
    <rect x="80" y="140" width="16" height="35" fill="#22c55e"/><line x1="88" y1="130" x2="88" y2="185" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="230" font-size="12" fill="#94a3b8">Đóng cửa thứ Sáu 17:00 EST</text>

    <!-- gap -->
    <rect x="110" y="90" width="200" height="90" fill="#eab308" opacity="0.1" stroke="#eab308" stroke-dasharray="4,3"/>
    <text x="120" y="80" font-size="13" fill="#eab308" font-weight="bold">"trông giống void" — nhưng chỉ 1 cạnh!</text>

    <!-- Monday open candles -->
    <rect x="320" y="70" width="16" height="45" fill="#22c55e"/><line x1="328" y1="60" x2="328" y2="125" stroke="#22c55e" stroke-width="2"/>
    <rect x="360" y="55" width="16" height="40" fill="#22c55e"/><line x1="368" y1="45" x2="368" y2="105" stroke="#22c55e" stroke-width="2"/>
    <text x="300" y="30" font-size="12" fill="#94a3b8">Mở cửa thứ Hai 18:00 EST (chỉ 1 khoảng cách)</text>

    <rect x="16" y="340" width="488" height="200" fill="#0f1420" stroke="#334155" rx="6"/>
    <text x="30" y="365" font-size="14" fill="#e2e8f0" font-weight="bold">Vì sao bẫy được:</text>
    <text x="30" y="386" font-size="12" fill="#94a3b8">Continuous chart nối liền cuối tuần —</text>
    <text x="30" y="404" font-size="12" fill="#94a3b8">hình dạng giống macro void thật khi zoom D1/H4</text>
    <text x="30" y="430" font-size="14" fill="#e2e8f0" font-weight="bold">Nhận diện sớm:</text>
    <text x="30" y="451" font-size="12" fill="#94a3b8">Chỉ MỘT khoảng cách giữa 2 nến (không phải</text>
    <text x="30" y="469" font-size="12" fill="#94a3b8">chuỗi ≥4-5 nến displacement) → đó là gap phiên</text>
    <text x="30" y="495" font-size="14" fill="#e2e8f0" font-weight="bold">Xử lý:</text>
    <text x="30" y="516" font-size="12" fill="#94a3b8">Loại các "void" có cạnh trùng giờ đóng/mở cuối</text>
    <text x="30" y="534" font-size="12" fill="#94a3b8">tuần khỏi danh sách void giao dịch được</text>
  </g>

  <!-- RIGHT PANEL: news candle void -->
  <g transform="translate(600,100)">
    <rect x="0" y="0" width="520" height="580" fill="#1e293b" opacity="0.3" stroke="#334155" rx="8"/>
    <text x="16" y="30" font-size="18" fill="#e2e8f0" font-weight="bold">16.3 Void trong nến tin (CPI/NFP)</text>
    <g stroke="#1c2333"><line x1="16" y1="120" x2="500" y2="120"/><line x1="16" y1="200" x2="500" y2="200"/><line x1="16" y1="280" x2="500" y2="280"/></g>

    <rect x="40" y="240" width="14" height="30" fill="#22c55e"/>
    <rect x="70" y="200" width="14" height="45" fill="#22c55e"/><line x1="77" y1="185" x2="77" y2="255" stroke="#22c55e" stroke-width="2"/>
    <rect x="100" y="150" width="14" height="55" fill="#22c55e"/><line x1="107" y1="135" x2="107" y2="215" stroke="#22c55e" stroke-width="2"/>
    <rect x="130" y="95" width="14" height="60" fill="#22c55e"/><line x1="137" y1="80" x2="137" y2="165" stroke="#22c55e" stroke-width="2"/>
    <rect x="160" y="55" width="14" height="45" fill="#22c55e"/><line x1="167" y1="40" x2="167" y2="110" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="30" font-size="12" fill="#f97316" font-weight="bold">08:30 EST CPI — 5 nến M1 displacement mạnh</text>

    <rect x="34" y="38" width="150" height="220" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-dasharray="4,3"/>

    <!-- fake entry attempt -->
    <line x1="190" y1="150" x2="280" y2="150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="195" y="145" font-size="12" fill="#38bdf8">entry limit 90s sau tin — RỦI RO CAO</text>

    <!-- slippage arrow -->
    <line x1="220" y1="155" x2="245" y2="180" stroke="#ef4444" stroke-width="2"/>
    <text x="250" y="185" font-size="12" fill="#ef4444">khớp lệch 12 tick (slippage)</text>

    <rect x="16" y="340" width="488" height="200" fill="#0f1420" stroke="#334155" rx="6"/>
    <text x="30" y="365" font-size="14" fill="#e2e8f0" font-weight="bold">Vì sao bẫy được:</text>
    <text x="30" y="386" font-size="12" fill="#94a3b8">Void trong tin thường "đẹp" hơn bình thường</text>
    <text x="30" y="404" font-size="12" fill="#94a3b8">→ tự tin sai lúc rủi ro khớp lệnh cao nhất</text>
    <text x="30" y="430" font-size="14" fill="#e2e8f0" font-weight="bold">Nhận diện sớm:</text>
    <text x="30" y="451" font-size="12" fill="#94a3b8">Timestamp nằm trong 3-5 phút đầu sau tin đã</text>
    <text x="30" y="469" font-size="12" fill="#94a3b8">biết trước → đánh dấu void_news_window: yes</text>
    <text x="30" y="495" font-size="14" fill="#e2e8f0" font-weight="bold">Xử lý:</text>
    <text x="30" y="516" font-size="12" fill="#94a3b8">Không entry trong 3-5 phút đầu; chờ 1 nến M5</text>
    <text x="30" y="534" font-size="12" fill="#94a3b8">đóng để volatility ổn định, hoặc nới SL/giảm size</text>
  </g>
</svg>
