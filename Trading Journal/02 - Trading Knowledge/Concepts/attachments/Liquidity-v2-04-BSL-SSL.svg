<text x="146.0" y="149.4" font-size="11" fill="#C2410C" font-weight="700" text-anchor="start">Vùng BSL [L, L + w] — buy-stop có thể dồn ở đây</text>
<text x="244.0" y="171.2" font-size="10.5" fill="#C2410C" font-weight="700" text-anchor="start">EQH</text>
<rect x="410.0" y="380.9" width="150.0" height="21.9" rx="2" fill="#1D4ED8" fill-opacity="0.13"/>
<line x1="410.0" y1="380.9" x2="560.0" y2="380.9" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="296.0" y="418.7" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">Vùng SSL [L − w, L] — sell-stop có thể dồn ở đây</text>
<text x="523.0" y="396.9" font-size="10.5" fill="#1D4ED8" font-weight="700" text-anchor="start">EQL</text>
<circle cx="567.5" cy="297.5" r="4.5" fill="#1F2937"/>
<text x="559.5" y="285.5" font-size="10.5" fill="#1F2937" font-weight="600" text-anchor="end">Giá hiện tại</text>
<rect x="600.0" y="72.0" width="316.0" height="136.8" rx="7" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.2"/>
<text x="609.0" y="91.5" font-size="11.5" fill="#C2410C" font-weight="700" text-anchor="start">BSL — nằm TRÊN đỉnh tham chiếu</text>
<text x="609.0" y="109.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Lệnh MUA có điều kiện (kích hoạt khi giá &gt; L):</text>
<text x="609.0" y="124.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• stop-loss của người đang SHORT</text>
<text x="609.0" y="139.5" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• buy-stop của người chờ breakout</text>
<text x="609.0" y="154.7" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• thanh lý vị thế short dùng đòn bẩy</text>
<text x="609.0" y="169.9" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Cùng vùng còn lệnh BÁN chờ (limit):</text>
<text x="609.0" y="185.1" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• chốt lời của người LONG, người bán đỉnh</text>
<text x="609.0" y="200.3" font-size="11" fill="#C2410C" font-weight="700" text-anchor="start">→ là ĐỐI ỨNG cho người cần BÁN lượng lớn</text>
<rect x="600.0" y="268.0" width="316.0" height="136.8" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="609.0" y="287.5" font-size="11.5" fill="#1D4ED8" font-weight="700" text-anchor="start">SSL — nằm DƯỚI đáy tham chiếu</text>
<text x="609.0" y="305.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Lệnh BÁN có điều kiện (kích hoạt khi giá &lt; L):</text>
<text x="609.0" y="320.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• stop-loss của người đang LONG</text>
<text x="609.0" y="335.5" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• sell-stop của người chờ breakdown</text>
<text x="609.0" y="350.7" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• thanh lý vị thế long dùng đòn bẩy</text>
<text x="609.0" y="365.9" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Cùng vùng còn lệnh MUA chờ (limit):</text>
<text x="609.0" y="381.1" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• chốt lời của người SHORT, người bắt đáy</text>
<text x="609.0" y="396.3" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">→ là ĐỐI ỨNG cho người cần MUA lượng lớn</text>
<rect x="600.0" y="462.0" width="316.0" height="59.4" rx="7" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="609.0" y="482.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">BSL ≠ kháng cự. SSL ≠ hỗ trợ. Kháng cự/hỗ trợ là</text>
<text x="609.0" y="497.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">dự đoán giá DỪNG; BSL/SSL là giả thuyết về</text>
<text x="609.0" y="512.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">LỆNH nằm ở đâu — giá có thể đi xuyên qua.</text>
<text x="24.0" y="546.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-04 · Chart minh họa (giá giả định). [ICT FRAMEWORK] tên gọi; [INTERPRETATION] thành phần lệnh; khối lượng không quan sát được.</text>
</svg>
