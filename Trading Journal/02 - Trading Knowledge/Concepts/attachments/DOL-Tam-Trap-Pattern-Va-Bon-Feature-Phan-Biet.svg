<svg viewBox="0 0 860 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="860" height="660" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Tám trap pattern — và bốn feature phân biệt rút ra từ chúng</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Setup trông giống DOL hợp lệ nhưng KHÔNG nên trade. Mục tiêu là tìm discriminating features, không phải kể chuyện.</text>

  <!-- ============ ROW 1 ============ -->
  <!-- T1 -->
  <rect x="24" y="72" width="196" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="24" y="72" width="196" height="26" rx="7" fill="#FEE2E2"/>
  <text x="36" y="90" font-size="10.5" font-weight="700" fill="#B91C1C">T1 — Counter-DOL sweep</text>
  <text x="36" y="112" font-size="9.5" fill="#374151">Sweep SSL + micro MSS trong khi</text>
  <text x="36" y="126" font-size="9.5" fill="#374151">D1 đang bearish expansion.</text>
  <text x="36" y="146" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="36" y="160" font-size="9.5" fill="#4B5563">đủ bộ ba sweep + MSS + FVG</text>
  <rect x="36" y="170" width="172" height="38" rx="5" fill="#FEF2F2"/>
  <text x="44" y="185" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="44" y="198" font-size="9" fill="#7F1D1D">equal low M5 là internal waypoint; HTF chưa reclaim</text>

  <!-- T2 -->
  <rect x="230" y="72" width="196" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="230" y="72" width="196" height="26" rx="7" fill="#FEE2E2"/>
  <text x="242" y="90" font-size="10.5" font-weight="700" fill="#B91C1C">T2 — Compression fade</text>
  <text x="242" y="112" font-size="9.5" fill="#374151">Buy-side sweep tại equal highs</text>
  <text x="242" y="126" font-size="9.5" fill="#374151">trong compression breakout.</text>
  <text x="242" y="146" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="242" y="160" font-size="9.5" fill="#4B5563">có sweep rõ, level rõ, "hết đà"</text>
  <rect x="242" y="170" width="172" height="38" rx="5" fill="#FEF2F2"/>
  <text x="250" y="185" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="250" y="198" font-size="9" fill="#7F1D1D">approach là compression + acceptance, không phải exhaustion</text>

  <!-- T3 -->
  <rect x="436" y="72" width="196" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="436" y="72" width="196" height="26" rx="7" fill="#FEE2E2"/>
  <text x="448" y="90" font-size="10.5" font-weight="700" fill="#B91C1C">T3 — Hindsight pivot MSS</text>
  <text x="448" y="112" font-size="9.5" fill="#374151">MSS "xác nhận" bằng micro pivot</text>
  <text x="448" y="126" font-size="9.5" fill="#374151">chỉ 2 nến trước; body nhỏ.</text>
  <text x="448" y="146" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="448" y="160" font-size="9.5" fill="#4B5563">có break, có nhãn MSS</text>
  <rect x="448" y="170" width="172" height="38" rx="5" fill="#FEF2F2"/>
  <text x="456" y="185" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="456" y="198" font-size="9" fill="#7F1D1D">pivot KHÔNG pre-confirmed; không displacement</text>

  <!-- T4 -->
  <rect x="642" y="72" width="194" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="642" y="72" width="194" height="26" rx="7" fill="#FEE2E2"/>
  <text x="654" y="90" font-size="10.5" font-weight="700" fill="#B91C1C">T4 — News repricing</text>
  <text x="654" y="112" font-size="9.5" fill="#374151">Setup hoàn hảo vài phút trước</text>
  <text x="654" y="126" font-size="9.5" fill="#374151">CPI / NFP / FOMC.</text>
  <text x="654" y="146" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="654" y="160" font-size="9.5" fill="#4B5563">mọi thành phần ICT đều đủ</text>
  <rect x="654" y="170" width="170" height="38" rx="5" fill="#FEF2F2"/>
  <text x="662" y="185" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="662" y="198" font-size="9" fill="#7F1D1D">depth giảm, spread tăng → đây là REGIME KHÁC</text>

  <!-- ============ ROW 2 ============ -->
  <!-- T5 -->
  <rect x="24" y="228" width="196" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="24" y="228" width="196" height="26" rx="7" fill="#FEE2E2"/>
  <text x="36" y="246" font-size="10.5" font-weight="700" fill="#B91C1C">T5 — No expectancy</text>
  <text x="36" y="268" font-size="9.5" fill="#374151">DOL đúng hướng nhưng chỉ cách</text>
  <text x="36" y="282" font-size="9.5" fill="#374151">entry chưa tới một structural stop.</text>
  <text x="36" y="302" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="36" y="316" font-size="9.5" fill="#4B5563">dự báo đúng</text>
  <rect x="36" y="326" width="172" height="38" rx="5" fill="#FEF2F2"/>
  <text x="44" y="341" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="44" y="354" font-size="9" fill="#7F1D1D">prediction edge ≠ execution edge; net R sau costs không đủ</text>

  <!-- T6 -->
  <rect x="230" y="228" width="196" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="230" y="228" width="196" height="26" rx="7" fill="#FEE2E2"/>
  <text x="242" y="246" font-size="10.5" font-weight="700" fill="#B91C1C">T6 — Midpoint balance</text>
  <text x="242" y="268" font-size="9.5" fill="#374151">Giá giữa range; hai candidate</text>
  <text x="242" y="282" font-size="9.5" fill="#374151">tương đương; M5 sweep hai phía.</text>
  <text x="242" y="302" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="242" y="316" font-size="9.5" fill="#4B5563">luôn có MSS mới để theo</text>
  <rect x="242" y="326" width="172" height="38" rx="5" fill="#FEF2F2"/>
  <text x="250" y="341" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="250" y="354" font-size="9" fill="#7F1D1D">không asymmetry → đây là NEUTRAL, không phải setup</text>

  <!-- T7 -->
  <rect x="436" y="228" width="196" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="436" y="228" width="196" height="26" rx="7" fill="#FEE2E2"/>
  <text x="448" y="246" font-size="10.5" font-weight="700" fill="#B91C1C">T7 — Swept pool reuse</text>
  <text x="448" y="268" font-size="9.5" fill="#374151">Target lại PDH đã bị quét phiên</text>
  <text x="448" y="282" font-size="9.5" fill="#374151">trước, vì "nó vẫn quan trọng".</text>
  <text x="448" y="302" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="448" y="316" font-size="9.5" fill="#4B5563">level rất dễ thấy, ai cũng mark</text>
  <rect x="448" y="326" width="172" height="38" rx="5" fill="#FEF2F2"/>
  <text x="456" y="341" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="456" y="354" font-size="9" fill="#7F1D1D">Freshness fail: conditional orders đã tiêu thụ</text>

  <!-- T8 -->
  <rect x="642" y="228" width="194" height="146" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="642" y="228" width="194" height="26" rx="7" fill="#FEE2E2"/>
  <text x="654" y="246" font-size="10.5" font-weight="700" fill="#B91C1C">T8 — Evidence double-count</text>
  <text x="654" y="268" font-size="9.5" fill="#374151">MSS + displacement + FVG từ CÙNG</text>
  <text x="654" y="282" font-size="9.5" fill="#374151">một cây nến = "3 confirmations".</text>
  <text x="654" y="302" font-size="9.5" font-weight="700" fill="#B91C1C">Trông hợp lệ:</text>
  <text x="654" y="316" font-size="9.5" fill="#4B5563">nhiều xác nhận trùng nhau</text>
  <rect x="654" y="326" width="170" height="38" rx="5" fill="#FEF2F2"/>
  <text x="662" y="341" font-size="9" font-weight="700" fill="#B91C1C">Failure:</text>
  <text x="662" y="354" font-size="9" fill="#7F1D1D">một causal chain, không phải ba vote độc lập</text>

  <!-- ============ DISCRIMINATING FEATURES ============ -->
  <rect x="24" y="386" width="812" height="164" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="44" y="410" font-size="13" font-weight="700" fill="#1D4ED8">BỐN FEATURE PHÂN BIỆT — xuất hiện lặp lại trong cả tám trap</text>
  <text x="44" y="428" font-size="10" font-style="italic" fill="#1E3A8A">Chú ý: KHÔNG feature nào là một mẫu hình nến. Cả bốn đều là thuộc tính của BỐI CẢNH hoặc của QUY TRÌNH.</text>

  <rect x="44" y="440" width="188" height="94" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="138" y="460" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">1. STRUCTURAL STATE</text>
  <text x="138" y="476" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">CỦA TẦNG TRÊN</text>
  <text x="138" y="496" font-size="9" fill="#4B5563" text-anchor="middle">Không phải hình dạng của M5.</text>
  <text x="138" y="510" font-size="9" fill="#4B5563" text-anchor="middle">Phân biệt T1, T7</text>
  <text x="138" y="526" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">CE1 · CE4 · CE6</text>

  <rect x="242" y="440" width="188" height="94" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="336" y="460" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">2. APPROACH</text>
  <text x="336" y="476" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">STRUCTURE</text>
  <text x="336" y="496" font-size="9" fill="#4B5563" text-anchor="middle">compression vs exhaustion —</text>
  <text x="336" y="510" font-size="9" fill="#4B5563" text-anchor="middle">feature BỊ ĐÁNH GIÁ THẤP NHẤT</text>
  <text x="336" y="526" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">CE2</text>

  <rect x="440" y="440" width="188" height="94" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="534" y="460" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">3. PRE-CONFIRMATION</text>
  <text x="534" y="476" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">CỦA PIVOT</text>
  <text x="534" y="496" font-size="9" fill="#4B5563" text-anchor="middle">Thuộc về QUY TRÌNH,</text>
  <text x="534" y="510" font-size="9" fill="#4B5563" text-anchor="middle">không thuộc về chart</text>
  <text x="534" y="526" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">CE3</text>

  <rect x="638" y="440" width="182" height="94" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="729" y="460" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">4. ASYMMETRY</text>
  <text x="729" y="476" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">HAI PHÍA</text>
  <text x="729" y="496" font-size="9" fill="#4B5563" text-anchor="middle">Điều kiện TIÊN QUYẾT,</text>
  <text x="729" y="510" font-size="9" fill="#4B5563" text-anchor="middle">không phải yếu tố cộng thêm</text>
  <text x="729" y="526" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">CE6</text>

  <!-- ============ CONCLUSION ============ -->
  <rect x="24" y="562" width="812" height="80" rx="8" fill="#0F172A"/>
  <text x="44" y="586" font-size="12" font-weight="700" fill="#7DD3FC">KẾT LUẬN PHƯƠNG PHÁP — điều tám trap pattern thực sự dạy</text>
  <text x="44" y="608" font-size="11" fill="#F8FAFC">Không có feature phân biệt nào là một MẪU HÌNH nhận diện được bằng mắt. Cả bốn đều là thuộc tính của bối cảnh hoặc của quy trình.</text>
  <text x="44" y="628" font-size="11" fill="#FCA5A5">→ Edge (nếu có) nằm ở BỐI CẢNH và KỶ LUẬT QUY TRÌNH — không nằm ở pattern recognition. Đây là luận điểm trung tâm của toàn bộ nghiên cứu.</text>
</svg>
