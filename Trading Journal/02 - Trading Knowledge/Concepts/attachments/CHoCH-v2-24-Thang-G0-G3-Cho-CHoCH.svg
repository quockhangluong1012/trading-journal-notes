<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="618.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Thang bằng chứng của một CHoCH: từ “chạm vạch” đến “xây nhà mới bên kia”</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cùng thang G0–G3 của note 21 (MSS), thêm bậc “chạm” ở dưới cùng. Mỗi bậc thêm thông tin VÀ thêm độ trễ.</text>
<rect x="28.0" y="434.5" width="944.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<rect x="28.0" y="434.5" width="64.0" height="76.0" rx="10" fill="#9CA3AF" fill-opacity="0.14"/>
<text x="60.0" y="479.5" font-size="20" font-weight="700" fill="#9CA3AF" text-anchor="middle">—</text>
<text x="106.0" y="460.5" font-size="14" font-weight="700" fill="#9CA3AF">Chạm vạch</text>
<text x="106.0" y="481.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="105.0,537.0">Râu nến xuyên qua protected swing, thân đóng lại bên trong.</text>
<text x="560.0" y="462.5" font-size="10.5" font-weight="400" fill="#6B7280">Thường được gọi là</text>
<text x="560.0" y="480.5" font-size="11.8" font-weight="700" fill="#111827" data-bx="559.0,761.0">chưa phải CHoCH</text>
<text x="780.0" y="462.5" font-size="10.5" font-weight="400" fill="#6B7280">Biết được khi nào</text>
<text x="780.0" y="480.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,961.0">ngay khi râu xuất hiện</text>
<rect x="54.0" y="350.5" width="918.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.5"/>
<rect x="54.0" y="350.5" width="64.0" height="76.0" rx="10" fill="#C026D3" fill-opacity="0.14"/>
<text x="86.0" y="395.5" font-size="20" font-weight="700" fill="#C026D3" text-anchor="middle">G0</text>
<text x="132.0" y="376.5" font-size="14" font-weight="700" fill="#C026D3">Bước qua vạch</text>
<text x="132.0" y="397.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="131.0,537.0">Thân nến ĐÓNG ngoài protected swing, ngược trạng thái.</text>
<text x="560.0" y="378.5" font-size="10.5" font-weight="400" fill="#6B7280">Thường được gọi là</text>
<text x="560.0" y="396.5" font-size="11.8" font-weight="700" fill="#111827" data-bx="559.0,761.0">“CHoCH” (đa số SMC)</text>
<text x="780.0" y="378.5" font-size="10.5" font-weight="400" fill="#6B7280">Biết được khi nào</text>
<text x="780.0" y="396.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,961.0">lúc nến phá đóng cửa</text>
<rect x="80.0" y="266.5" width="892.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="80.0" y="266.5" width="64.0" height="76.0" rx="10" fill="#7C3AED" fill-opacity="0.14"/>
<text x="112.0" y="311.5" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="middle">G1</text>
<text x="158.0" y="292.5" font-size="14" font-weight="700" fill="#7C3AED">Bước MẠNH qua vạch</text>
<text x="158.0" y="313.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="157.0,537.0">G0 + displacement: chân sóng nhanh, thân nến lớn, thường để lại</text>
<text x="158.0" y="330.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="157.0,537.0">FVG.</text>
<text x="560.0" y="294.5" font-size="10.5" font-weight="400" fill="#6B7280">Thường được gọi là</text>
<text x="560.0" y="312.5" font-size="11.8" font-weight="700" fill="#111827" data-bx="559.0,761.0">“MSS” (ICT 2022,</text>
<text x="560.0" y="329.2" font-size="11.8" font-weight="700" fill="#111827" data-bx="559.0,761.0">innercircletrader.net)</text>
<text x="780.0" y="294.5" font-size="10.5" font-weight="400" fill="#6B7280">Biết được khi nào</text>
<text x="780.0" y="312.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,961.0">nến phá (FVG: nến kế tiếp)</text>
<rect x="106.0" y="182.5" width="866.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
<rect x="106.0" y="182.5" width="64.0" height="76.0" rx="10" fill="#0D9488" fill-opacity="0.14"/>
<text x="138.0" y="227.5" font-size="20" font-weight="700" fill="#0D9488" text-anchor="middle">G2</text>
<text x="184.0" y="208.5" font-size="14" font-weight="700" fill="#0D9488">Đứng vững bên kia</text>
<text x="184.0" y="229.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="183.0,537.0">G1 + giá không đóng ngược trở lại qua mức trong vài nến đã</text>
<text x="184.0" y="246.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="183.0,537.0">khai báo trước.</text>
<text x="560.0" y="210.5" font-size="10.5" font-weight="400" fill="#6B7280">Thường được gọi là</text>
<text x="560.0" y="228.5" font-size="11.8" font-weight="700" fill="#111827" data-bx="559.0,761.0">“MSS được chấp nhận”</text>
<text x="780.0" y="210.5" font-size="10.5" font-weight="400" fill="#6B7280">Biết được khi nào</text>
<text x="780.0" y="228.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,961.0">sau vài nến</text>
<rect x="132.0" y="98.5" width="840.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
<rect x="132.0" y="98.5" width="64.0" height="76.0" rx="10" fill="#15803D" fill-opacity="0.14"/>
<text x="164.0" y="143.5" font-size="20" font-weight="700" fill="#15803D" text-anchor="middle">G3</text>
<text x="210.0" y="124.5" font-size="14" font-weight="700" fill="#15803D">Xây nhà mới bên kia</text>
<text x="210.0" y="145.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="209.0,537.0">G2 + có HL (hoặc LH) mới VÀ một BOS đầu tiên theo</text>
<text x="210.0" y="162.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="209.0,537.0">chiều mới.</text>
<text x="560.0" y="126.5" font-size="10.5" font-weight="400" fill="#6B7280">Thường được gọi là</text>
<text x="560.0" y="144.5" font-size="11.8" font-weight="700" fill="#111827" data-bx="559.0,761.0">“shift thật” / ATAS</text>
<text x="780.0" y="126.5" font-size="10.5" font-weight="400" fill="#6B7280">Biết được khi nào</text>
<text x="780.0" y="144.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,961.0">muộn nhất</text>
<rect x="28.0" y="522.5" width="944.0" height="51.0" rx="8" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="522.5" width="4.0" height="51.0" rx="2" fill="#B91C1C"/>
<text x="42.0" y="542.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="28.0,972.0">Quy tắc vàng (RULE-MSS-012 của note 21): bậc dùng để LỌC lệnh phải là bậc ĐÃ CÓ tại thời điểm vào lệnh. Lọc bằng G3 nhưng vào lệnh lúc G1 = dùng</text>
<text x="42.0" y="560.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="28.0,972.0">thông tin tương lai.</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Ghi journal theo quy ước của note 21: ví dụ “M5 MSS-I G1” hoặc “H1 MSS-P G2”. Chữ “CHoCH” chỉ dùng khi đọc tài liệu SMC (≈ G0).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
