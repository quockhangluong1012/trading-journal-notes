<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Khi nói 'market structure shifted' — CHÍNH XÁC cái gì đã đổi?</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Chín ứng viên, bốn loại bằng chứng. Câu 'cấu trúc đã đổi' chỉ không vòng tròn khi ta nói rõ đang nói về ứng viên nào.</text>
<rect x="30.0" y="90.0" width="296.0" height="118.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="44.0" y="116.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">1. Thứ tự swing</text>
<rect x="224.4" y="103.0" width="87.6" height="19.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="268.2" y="116.0" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">THEO ĐỊNH NGHĨA</text>
<text x="44.0" y="146.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">LH/LL → giờ có một close vượt LH;</text>
<text x="44.0" y="164.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">nhãn chuỗi đổi theo thuật toán.</text>
<rect x="342.0" y="90.0" width="296.0" height="118.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="356.0" y="116.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">2. Mức được bảo vệ</text>
<rect x="536.4" y="103.0" width="87.6" height="19.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="580.2" y="116.0" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">THEO ĐỊNH NGHĨA</text>
<text x="356.0" y="146.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">P-H bị tiêu thụ; cực trị sweep</text>
<text x="356.0" y="164.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">trở thành P-L mới của lớp.</text>
<rect x="654.0" y="90.0" width="296.0" height="118.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="668.0" y="116.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">3. Thứ bậc cấu trúc</text>
<rect x="848.4" y="103.0" width="87.6" height="19.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="892.2" y="116.0" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">THEO ĐỊNH NGHĨA</text>
<text x="668.0" y="146.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">swing nào là reference đổi;</text>
<text x="668.0" y="164.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">range của lớp được neo lại.</text>
<rect x="30.0" y="222.0" width="296.0" height="118.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="44.0" y="248.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">4. Kỳ vọng hướng đi</text>
<rect x="224.4" y="235.0" width="87.6" height="19.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="268.2" y="248.0" font-size="9" font-weight="600" fill="#B91C1C" text-anchor="middle">GIẢ THUYẾT · ĐO</text>
<text x="44.0" y="278.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">phân phối lợi nhuận tương lai</text>
<text x="44.0" y="296.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">có lệch so với baseline? — phải đo.</text>
<rect x="342.0" y="222.0" width="296.0" height="118.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="356.0" y="248.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">5. Price acceptance</text>
<rect x="546.5" y="235.0" width="77.5" height="19.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="585.2" y="248.0" font-size="9" font-weight="600" fill="#15803D" text-anchor="middle">QUAN SÁT ĐƯỢC</text>
<text x="356.0" y="278.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">có close (và k close) ở phía bên kia;</text>
<text x="356.0" y="296.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">giá được giao dịch tại vùng mới.</text>
<rect x="654.0" y="222.0" width="296.0" height="118.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="668.0" y="248.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">6. Internal structure</text>
<rect x="848.4" y="235.0" width="87.6" height="19.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="892.2" y="248.0" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">THEO ĐỊNH NGHĨA</text>
<text x="668.0" y="278.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">đổi ở lớp internal của khung đó —</text>
<text x="668.0" y="296.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">gần như luôn luôn khi có MSS-I.</text>
<rect x="30.0" y="354.0" width="296.0" height="118.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="44.0" y="380.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">7. External structure</text>
<rect x="224.4" y="367.0" width="87.6" height="19.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="268.2" y="380.0" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">THEO ĐỊNH NGHĨA</text>
<text x="44.0" y="410.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">CHỈ đổi nếu mức bị phá là</text>
<text x="44.0" y="428.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">neo external (MSS-P, đúng khung).</text>
<rect x="342.0" y="354.0" width="296.0" height="118.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="356.0" y="380.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">8. Quan hệ thanh khoản</text>
<rect x="571.7" y="367.0" width="52.3" height="19.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="597.8" y="380.0" font-size="9" font-weight="600" fill="#B45309" text-anchor="middle">SUY LUẬN</text>
<text x="356.0" y="410.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">pool phía trước thành DOL ứng viên;</text>
<text x="356.0" y="428.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">ai bị stop — không thấy trên chart.</text>
<rect x="654.0" y="354.0" width="296.0" height="118.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="668.0" y="380.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">9. Cách ta mô tả giá</text>
<rect x="858.5" y="367.0" width="77.5" height="19.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="897.2" y="380.0" font-size="9" font-weight="600" fill="#15803D" text-anchor="middle">QUAN SÁT ĐƯỢC</text>
<text x="668.0" y="410.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">luôn đổi (chắc chắn nhất) — và</text>
<text x="668.0" y="428.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">đó là lý do dễ lập luận vòng tròn.</text>
<rect x="26.0" y="494.0" width="928.0" height="130.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="516.0" font-size="10.1" font-weight="700" fill="#334155" text-anchor="start">Câu trả lời không vòng tròn (đề xuất của note):</text>
<text x="42.0" y="533.5" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• CHẮC CHẮN đổi (theo định nghĩa): nhãn trạng thái của lớp ℓ trên khung τ, và bộ mức tham chiếu (1, 2, 3, 6, 9). Đây là kế toán, không phải dự báo.</text>
<text x="42.0" y="551.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• QUAN SÁT được thêm: mức độ chấp nhận giá (5) — có thể đo bằng k close, thời gian ở phía mới, khoảng cách theo ATR.</text>
<text x="42.0" y="568.5" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• CÓ THỂ đổi (cần dữ liệu): phân phối lợi nhuận/kết cục có điều kiện sau sự kiện (4). MSS 'có ý nghĩa dự báo' ⇔ (4) khác baseline cùng khoảng cách.</text>
<text x="42.0" y="586.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• KHÔNG quan sát được từ OHLC: ai đã thua, ai đang nắm vị thế, ý định (8). Trên random walk (1–3, 5, 6, 9) vẫn xảy ra đầy đủ; (4) thì không (MSS-Sim-03).</text>
</svg>