<text x="422.0" y="108.0" font-size="12.2" font-weight="700" fill="#B45309" text-anchor="start">Bóng tới mép xa</text>
<rect x="427.5" y="198.7" width="145.0" height="83.3" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
<line x1="427.5" y1="240.4" x2="572.5" y2="240.4" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="2,3"/>
<line x1="485.2" y1="160.5" x2="485.2" y2="279.7" stroke="#E0464B" stroke-width="1.2" opacity="1"/>
<rect x="476.0" y="174.0" width="18.4" height="27.0" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6" opacity="1"/>
<text x="416.0" y="448.0" font-size="11.3" font-weight="700" fill="#B45309" text-anchor="start">Full fill bằng bóng, chưa vô</text>
<text x="416.0" y="463.6" font-size="11.3" font-weight="700" fill="#B45309" text-anchor="start">hiệu</text>
<rect x="601.0" y="86.0" width="180.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="613.0" y="108.0" font-size="12.2" font-weight="700" fill="#B45309" text-anchor="start">Bóng xuyên, đóng lại</text>
<text x="613.0" y="123.9" font-size="12.2" font-weight="700" fill="#B45309" text-anchor="start">trong</text>
<rect x="618.5" y="198.7" width="145.0" height="83.3" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
