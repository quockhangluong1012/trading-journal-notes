<rect x="667.0" y="174.0" width="18.4" height="81.0" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6" opacity="1"/>
<text x="607.0" y="448.0" font-size="11.3" font-weight="700" fill="#B45309" text-anchor="start">Chưa vô hiệu — có thể là</text>
<text x="607.0" y="463.6" font-size="11.3" font-weight="700" fill="#B45309" text-anchor="start">sweep</text>
<rect x="792.0" y="86.0" width="180.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="804.0" y="108.0" font-size="12.2" font-weight="700" fill="#B91C1C" text-anchor="start">Đóng dưới và đứng được</text>
<rect x="809.5" y="198.7" width="145.0" height="83.3" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
<line x1="809.5" y1="240.4" x2="954.5" y2="240.4" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="2,3"/>
