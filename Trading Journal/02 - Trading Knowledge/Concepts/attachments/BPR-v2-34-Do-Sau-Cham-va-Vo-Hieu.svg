<rect x="94.0" y="178.5" width="18.4" height="4.5" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<text x="34.0" y="448.0" font-size="11.3" font-weight="700" fill="#0F7A5A" text-anchor="start">Partial — rất nông</text>
<rect x="219.0" y="86.0" width="180.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="231.0" y="108.0" font-size="12.2" font-weight="700" fill="#0F7A5A" text-anchor="start">Tới giữa vùng</text>
