<svg viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="608" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="877.8" y="22" width="94.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="924.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">MITIGATION</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Độ sâu chạm và vô hiệu: bóng nến khác đóng nến</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bullish BPR (tím), giá quay xuống từ trên. Năm mức độ, từ nhẹ nhất tới mạnh nhất. Chỉ trường hợp cuối mới là mất vai trò.</text>
<rect x="28.0" y="86.0" width="180.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.2" font-weight="700" fill="#0F7A5A" text-anchor="start">Chạm mép gần</text>
<rect x="45.5" y="198.7" width="145.0" height="83.3" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
