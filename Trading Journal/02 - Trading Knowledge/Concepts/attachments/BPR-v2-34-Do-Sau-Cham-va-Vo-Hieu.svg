<line x1="920.5" y1="304.5" x2="920.5" y2="372.0" stroke="#E0464B" stroke-width="1.2" opacity="1"/>
<rect x="911.3" y="336.0" width="18.4" height="18.0" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6" opacity="1"/>
<text x="798.0" y="448.0" font-size="11.3" font-weight="700" fill="#B91C1C" text-anchor="start">Mất vai trò hỗ trợ</text>
<rect x="28.0" y="490.0" width="944.0" height="60.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="40.0" y="514.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đường chấm ở giữa là điểm 50% của BPR (giống Consequent Encroachment của FVG). Nó là một mốc để GHI độ sâu, không phải mức giá “thần kỳ”.</text>
<text x="28.0" y="590.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Trên khung nào thì đánh giá đóng nến trên khung đó: BPR H1 được đánh giá bằng nến H1, không phải một nến M1 đóng dưới mép.</text>
</svg>
