<rect x="642.0" y="92.5" width="330.0" height="519.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Bối cảnh và diễn biến</text>
<text x="656.0" y="142.5" font-size="11.8" font-weight="700" fill="#2563EB">Bối cảnh</text>
<text x="656.0" y="158.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">D1 hướng xuống; nhịp tăng H1 này là nhịp hồi vào nửa</text>
<text x="656.0" y="174.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">trên của khoảng giá lớn.</text>
<text x="656.0" y="198.1" font-size="11.8" font-weight="700" fill="#2563EB">① Retest</text>
<text x="656.0" y="214.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá về vùng, nến đóng cửa trong vùng.</text>
<text x="656.0" y="237.4" font-size="11.8" font-weight="700" fill="#2563EB">② Phản ứng yếu</text>
<text x="656.0" y="253.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Một nến tăng nhỏ, không tạo đỉnh mới, không có</text>
<text x="656.0" y="269.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">displacement.</text>
<text x="656.0" y="293.1" font-size="11.8" font-weight="700" fill="#2563EB">③ Thất bại</text>
<text x="656.0" y="309.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Nến đóng cửa dưới mép xa của vùng và giá đi tiếp</text>
<text x="656.0" y="325.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">xuống.</text>
<rect x="656.0" y="493.0" width="302.0" height="101.9" rx="8" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="493.0" width="4.0" height="101.9" rx="2" fill="#B91C1C"/>
<text x="670.0" y="512.9" font-size="11.6" font-weight="700" fill="#B91C1C" data-bx="656.0,958.0">Điều thật sự kết luận được</text>
<text x="670.0" y="532.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Vùng đúng tên, sai bối cảnh. Một mẫu không</text>
<text x="670.0" y="548.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">chứng minh “Breaker ngược khung lớn thì hỏng”</text>
<text x="670.0" y="565.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">— nhưng nó cho một giả thuyết đáng đếm: tỷ lệ</text>
<text x="670.0" y="581.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">giữ khi thuận so với khi ngược khung lớn.</text>
