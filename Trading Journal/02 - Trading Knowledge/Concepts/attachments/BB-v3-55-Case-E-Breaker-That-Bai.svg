<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đủ ba mắt xích. Giá quay lại, bật nhẹ một nến rồi đóng cửa xuyên qua vùng. Bối cảnh: khung lớn đang hướng xuống.</text>
