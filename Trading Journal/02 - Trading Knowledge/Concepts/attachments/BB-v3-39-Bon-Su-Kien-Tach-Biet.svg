<rect x="42.0" y="452.0" width="222.0" height="114.0" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="52.0" y="472.0" font-size="11.8" font-weight="700" fill="#B45309">1 · HÌNH THÀNH (ứng viên)</text>
<text x="52.0" y="492.0" font-size="11.2" font-weight="400" fill="#111827" data-bx="51.0,255.0">Cực trị cũ vừa bị vi phạm. Trình tự</text>
<text x="52.0" y="507.9" font-size="11.2" font-weight="400" fill="#111827" data-bx="51.0,255.0">đang dở dang.</text>
<text x="52.0" y="527.8" font-size="11.2" font-weight="700" fill="#B45309" data-bx="51.0,255.0">Được: ghi chú, đánh dấu mức cần bị</text>
<text x="52.0" y="543.7" font-size="11.2" font-weight="700" fill="#B45309" data-bx="51.0,255.0">phá.</text>
<line x1="645.3" y1="122.5" x2="645.3" y2="446.0" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5,4"/>
