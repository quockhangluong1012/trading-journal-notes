<text x="645.3" y="120.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="274.0" y="452.0" width="222.0" height="114.0" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="284.0" y="472.0" font-size="11.8" font-weight="700" fill="#2563EB">2 · XÁC NHẬN</text>
<text x="284.0" y="492.0" font-size="11.2" font-weight="400" fill="#111827" data-bx="283.0,487.0">Nến đóng cửa qua swing giữa.</text>
<text x="284.0" y="507.9" font-size="11.2" font-weight="400" fill="#111827" data-bx="283.0,487.0">Breaker có tên.</text>
<text x="284.0" y="527.8" font-size="11.2" font-weight="700" fill="#2563EB" data-bx="283.0,487.0">Được: vẽ vùng, khoá biên, đặt cảnh</text>
<text x="284.0" y="543.7" font-size="11.2" font-weight="700" fill="#2563EB" data-bx="283.0,487.0">báo.</text>
<line x1="790.6" y1="122.5" x2="790.6" y2="446.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5,4"/>
<circle cx="790.6" cy="116.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="790.6" y="120.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="506.0" y="452.0" width="222.0" height="114.0" rx="9" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
<text x="516.0" y="472.0" font-size="11.8" font-weight="700" fill="#111827">3 · RETEST</text>
<text x="516.0" y="492.0" font-size="11.2" font-weight="400" fill="#111827" data-bx="515.0,719.0">Giá chạm vùng. Mới là “đến nơi”.</text>
<text x="516.0" y="511.9" font-size="11.2" font-weight="700" fill="#111827" data-bx="515.0,719.0">Được: xuống khung nhỏ quan sát.</text>
<line x1="845.0" y1="122.5" x2="845.0" y2="446.0" stroke="#15803D" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5,4"/>
<circle cx="845.0" cy="116.5" r="10.0" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="845.0" y="120.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="738.0" y="452.0" width="222.0" height="114.0" rx="9" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
<text x="748.0" y="472.0" font-size="11.8" font-weight="700" fill="#15803D">4 · VÀO LỆNH (nếu có)</text>
<text x="748.0" y="492.0" font-size="11.2" font-weight="400" fill="#111827" data-bx="747.0,951.0">Khung nhỏ cho sweep + MSS + FVG.</text>
<text x="748.0" y="511.9" font-size="11.2" font-weight="700" fill="#15803D" data-bx="747.0,951.0">Được: đặt lệnh theo kế hoạch.</text>
<text x="28.0" y="607.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Giữa mốc 2 và mốc 3 có thể không có gì xảy ra (giá không quay lại). Giữa mốc 3 và mốc 4 cũng vậy (giá chạm vùng rồi xuyên qua, không cho tín hiệu). Cả hai</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">đều bình thường.</text>
