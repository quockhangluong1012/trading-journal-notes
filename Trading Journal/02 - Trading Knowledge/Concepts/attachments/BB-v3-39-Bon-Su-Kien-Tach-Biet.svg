<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Gộp bốn mốc này làm một là nguồn gốc của phần lớn lỗi hindsight. Mỗi mốc trả lời một câu hỏi khác và cho phép một việc khác.</text>
