<svg viewBox="0 0 1000 640" width="1000" height="640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="889.7" y="22" width="82.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="930.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bản đồ họ 'gap' — Đừng gọi mọi khoảng trống bằng cùng một tên</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba câu hỏi khác nhau: (A) gap xảy ra KHI NÀO, (B) gap nằm Ở ĐÂU trong cấu trúc, (C) đó có thật sự là gap không hay là một khái niệm khác.</text>
<rect x="380.0" y="100.0" width="240.0" height="46.0" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
<text x="500.0" y="120.0" font-size="13" font-weight="800" fill="#1F2937" text-anchor="middle">Price discontinuity</text>
<text x="500.0" y="138.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">giá liền kề không nối nhau</text>
<line x1="500.0" y1="147.0" x2="176.0" y2="180.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M176.0,180.0 L182.8,175.8 L183.5,182.7 Z" fill="#94A3B8"/>
<rect x="28.0" y="182.0" width="296.0" height="36.0" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="176.0" y="205.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="middle">A. Theo THỜI ĐIỂM</text>
<line x1="500.0" y1="147.0" x2="500.0" y2="180.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M500.0,180.0 L496.5,172.8 L503.5,172.8 Z" fill="#94A3B8"/>
<rect x="352.0" y="182.0" width="296.0" height="36.0" rx="8" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.4"/>
<text x="500.0" y="205.0" font-size="12.5" font-weight="800" fill="#0F9D74" text-anchor="middle">B. Theo VỊ TRÍ (TA cổ điển)</text>
<line x1="500.0" y1="147.0" x2="824.0" y2="180.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M824.0,180.0 L816.5,182.7 L817.2,175.8 Z" fill="#94A3B8"/>
<rect x="676.0" y="182.0" width="296.0" height="36.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="824.0" y="205.0" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="middle">C. KHÔNG phải gap thật</text>
<rect x="28.0" y="230.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="248.0" font-size="11.5" font-weight="800" fill="#2563EB" text-anchor="start">Opening gap</text>
<text x="40.0" y="264.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Giữa giá đóng cửa và giá mở cửa của hai phiên (qua</text>
<text x="40.0" y="278.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">đêm, cuối tuần, sau nghỉ).</text>
<rect x="28.0" y="293.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="311.0" font-size="11.5" font-weight="800" fill="#2563EB" text-anchor="start">Intraday discontinuity</text>
<text x="40.0" y="327.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Bước nhảy giữa hai nến TRONG phiên khi các mức giữa</text>
<text x="40.0" y="341.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">không có lệnh chờ (tin nóng, thanh khoản mỏng).</text>
<rect x="28.0" y="356.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="374.0" font-size="11.5" font-weight="800" fill="#2563EB" text-anchor="start">Gap do dữ liệu</text>
<text x="40.0" y="390.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Do cách vẽ chart: thiếu giờ mở rộng, đổi hợp đồng</text>
<text x="40.0" y="404.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">futures, khác múi giờ, mất dữ liệu.</text>
<rect x="352.0" y="230.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="364.0" y="248.0" font-size="11.5" font-weight="800" fill="#0F9D74" text-anchor="start">Common gap</text>
<text x="364.0" y="264.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Trong vùng đi ngang; thường bị lấp nhanh; ít ý nghĩa</text>
<text x="364.0" y="278.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">cấu trúc.</text>
<rect x="352.0" y="293.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="364.0" y="311.0" font-size="11.5" font-weight="800" fill="#0F9D74" text-anchor="start">Breakaway gap</text>
<text x="364.0" y="327.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Khi giá RỜI một vùng tích lũy / cấu trúc quan</text>
<text x="364.0" y="341.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">trọng.</text>
<rect x="352.0" y="356.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="364.0" y="374.0" font-size="11.5" font-weight="800" fill="#0F9D74" text-anchor="start">Runaway gap</text>
<text x="364.0" y="390.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Giữa một nhịp đang chạy mạnh (còn gọi measuring /</text>
<text x="364.0" y="404.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">continuation).</text>
<rect x="352.0" y="419.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="364.0" y="437.0" font-size="11.5" font-weight="800" fill="#0F9D74" text-anchor="start">Exhaustion gap</text>
<text x="364.0" y="453.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Gần cuối một nhịp dài; thường bị lấp nhanh rồi giá</text>
<text x="364.0" y="467.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">đứng lại/đảo chiều.</text>
<rect x="352.0" y="482.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="364.0" y="500.0" font-size="11.5" font-weight="800" fill="#0F9D74" text-anchor="start">Island reversal</text>
<text x="364.0" y="516.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Một mô hình: gap đi, đi ngang, rồi gap ngược lại bỏ</text>
<text x="364.0" y="530.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">lại 'hòn đảo'.</text>
<rect x="676.0" y="230.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="688.0" y="248.0" font-size="11.5" font-weight="800" fill="#7C3AED" text-anchor="start">ICT Fair Value Gap</text>
<text x="688.0" y="264.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Mẫu 3 nến: vùng giá chỉ nến giữa đi qua. Có thể có,</text>
<text x="688.0" y="278.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">hoặc không, kèm gap thật.</text>
<rect x="676.0" y="293.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="688.0" y="311.0" font-size="11.5" font-weight="800" fill="#7C3AED" text-anchor="start">Imbalance / inefficiency</text>
<text x="688.0" y="327.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Cách DIỄN GIẢI một vùng giá đi nhanh một chiều.</text>
<text x="688.0" y="341.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Không phải đo đạc.</text>
<rect x="676.0" y="356.0" width="296.0" height="55.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="688.0" y="374.0" font-size="11.5" font-weight="800" fill="#7C3AED" text-anchor="start">Liquidity void</text>
<text x="688.0" y="390.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">Một đoạn giá dài đi qua rất nhanh (thường nhiều nến),</text>
<text x="688.0" y="404.5" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">ít giao dịch hai chiều.</text>
<rect x="28.0" y="574.0" width="944.0" height="50.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="44.0" y="594.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">A và B là hai trục KHÁC nhau: một opening gap có thể là common hoặc breakaway; một breakaway có thể là opening gap hoặc intraday. Cột C dùng chữ 'gap' nhưng</text>
<text x="44.0" y="609.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">định nghĩa khác — đừng đánh đồng.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
