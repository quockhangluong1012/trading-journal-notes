<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Internal vs External liquidity là QUAN HỆ với một range, không phải thuộc tính của mức giá</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một mức X: là EXTERNAL đối với range H1 (vì là biên của nó), nhưng là INTERNAL đối với range D1 (vì nằm bên trong).</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Câu "giá đang đi lấy external liquidity" vô nghĩa nếu không nói range nào. Luôn ghi: ERL/IRL của range nào, timeframe nào, neo bởi swing nào.</text>
<rect x="40.0" y="104.0" width="560.0" height="470.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<text x="54.0" y="126.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Range D1 (dealing range lớn)</text>
<line x1="48.0" y1="160.0" x2="592.0" y2="160.0" stroke="#B91C1C" stroke-width="2"/>
<text x="586.0" y="154.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="end">D1 high = ERL(D1) — BSL ngoài</text>
<line x1="48.0" y1="528.0" x2="592.0" y2="528.0" stroke="#15803D" stroke-width="2"/>
<text x="586.0" y="544.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="end">D1 low = ERL(D1) — SSL ngoài</text>
<line x1="48.0" y1="344.0" x2="592.0" y2="344.0" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="54.0" y="339.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start">EQ(D1)</text>
<rect x="160.0" y="232.0" width="330.0" height="192.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="172.0" y="252.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Range H1 (bên trong D1)</text>
<line x1="160.0" y1="232.0" x2="490.0" y2="232.0" stroke="#B45309" stroke-width="2.6"/>
<text x="498.0" y="236.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">X</text>
<line x1="160.0" y1="424.0" x2="490.0" y2="424.0" stroke="#1D4ED8" stroke-width="1.6"/>
<text x="480.0" y="418.0" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="end">H1 low = ERL(H1)</text>
<rect x="250.0" y="292.0" width="150.0" height="90.0" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="260.0" y="310.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="start">Range M5</text>
<line x1="250.0" y1="382.0" x2="400.0" y2="382.0" stroke="#6D28D9" stroke-width="1.4"/>
<text x="394.0" y="376.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="end">Y</text>
<rect x="510.0" y="288.0" width="60.0" height="32.0" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="540.0" y="334.0" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="middle">FVG = IRL(D1)</text>
<rect x="620.0" y="104.0" width="320.0" height="470.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="634.0" y="128.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Mức X đóng vai gì?</text>
<rect x="632.0" y="150.0" width="296.0" height="54.0" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
<text x="642.0" y="170.0" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="start">Khi range tham chiếu = H1</text>
<text x="642.0" y="190.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">X = biên trên = EXTERNAL (BSL ngoài)</text>
<rect x="632.0" y="214.0" width="296.0" height="54.0" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1.3"/>
<text x="642.0" y="234.0" font-size="10.8" font-weight="700" fill="#334155" text-anchor="start">Khi range tham chiếu = D1</text>
<text x="642.0" y="254.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">X = nằm trong = INTERNAL</text>
<rect x="632.0" y="278.0" width="296.0" height="54.0" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="642.0" y="298.0" font-size="10.8" font-weight="700" fill="#6D28D9" text-anchor="start">Khi range tham chiếu = M5</text>
<text x="642.0" y="318.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">X = mục tiêu NGOÀI range M5</text>
<text x="634.0" y="360.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="start">Quy tắc ghi chép (v0.1)</text>
<text x="634.0" y="378.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">1. Mọi nhãn ERL/IRL kèm range tham chiếu:</text>
<text x="634.0" y="396.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">   "ERL(H1-range 1.0812–1.0868)".</text>
<text x="634.0" y="414.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">2. Range tham chiếu lấy từ khung CONTEXT</text>
<text x="634.0" y="432.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">   (D1 trong framework D1→H1→M5).</text>
<text x="634.0" y="450.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">3. Sweep "external" ở M5 thường chỉ là</text>
<text x="634.0" y="468.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">   internal ở H1 — ý nghĩa thuộc về swing</text>
<text x="634.0" y="486.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">   bị lấy, không thuộc chart bạn đang xem.</text>
<text x="634.0" y="504.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">4. Khi range được re-map (sau displacement),</text>
<text x="634.0" y="522.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">   vai trò của mọi mức phải tính lại.</text>
</svg>