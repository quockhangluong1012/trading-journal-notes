<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Accumulation Range ≠ Trading Range ≠ Dealing Range</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba khái niệm lồng nhau nhưng trả lời ba câu hỏi khác nhau. Vẽ nhầm cấp range là nguồn gốc của rất nhiều cú “sweep” tưởng tượng.</text>
<rect x="851.5" y="22.0" width="120.5" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="911.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DEALING RANGE</text>
<rect x="28.0" y="100.0" width="560.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="60.0" y="165.7" width="517.2" height="317.2" rx="2" fill="#FBFBFD" stroke="#64748B" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="570.3" y="181.7" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="end">Dealing Range D1 (đỉnh swing → đáy swing)</text>
<line x1="60.0" y1="324.4" x2="577.2" y2="324.4" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="575.2" y="320.4" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="end">EQ — cân bằng</text>
<text x="570.3" y="237.2" font-size="11" font-weight="800" fill="#E0464B" text-anchor="end">PREMIUM</text>
<text x="570.3" y="362.3" font-size="11" font-weight="800" fill="#15803D" text-anchor="end">DISCOUNT</text>
<rect x="129.0" y="389.1" width="344.8" height="125.1" rx="2" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="5,3"/>
<text x="134.1" y="508.3" font-size="11" font-weight="700" fill="#1F2937" text-anchor="start">Trading Range H1 (đi ngang vài phiên)</text>
<rect x="284.1" y="429.4" width="137.9" height="31.3" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="287.6" y="423.4" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="start">Accumulation candidate (1 phiên)</text>
<path d="M60.0,165.7 L77.2,210.4 L94.5,255.1 L111.7,317.7 L129.0,371.3 L146.2,407.0 L163.4,478.5 L180.7,442.8 L197.9,398.1 L215.2,469.6 L232.4,416.0 L249.7,483.0 L266.9,424.9 L284.1,398.1 L301.4,442.8 L318.6,431.6 L335.9,456.2 L353.1,433.8 L370.3,458.4 L387.6,436.1 L404.8,451.7 L422.1,465.1 L439.3,420.4 L456.6,389.1 L473.8,371.3 L491.0,331.1 L508.3,299.8 L525.5,264.0 L542.8,219.4 L560.0,183.6" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="602.0" y="100.0" width="370.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="610.0" y="112.0" width="354.0" height="26.0" rx="4" fill="#F3F4F6"/>
<text x="614.0" y="128.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start"></text>
<text x="676.0" y="128.0" font-size="10.8" font-weight="700" fill="#64748B" text-anchor="start">Dealing Range</text>
<text x="786.0" y="128.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Trading Range</text>
<text x="878.0" y="128.0" font-size="10.8" font-weight="700" fill="#2563EB" text-anchor="start">Accum. Range</text>
<line x1="610.0" y1="140.0" x2="964.0" y2="140.0" stroke="#EEF0F4" stroke-width="1"/>
<text x="614.0" y="158.0" font-size="10.8" font-weight="700" fill="#6B7280" text-anchor="start">Là gì</text>
<text x="676.0" y="158.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Khoảng giữa một</text>
<text x="676.0" y="172.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">đỉnh và một đáy</text>
<text x="676.0" y="186.1" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">swing CÓ Ý NGHĨA</text>
<text x="786.0" y="158.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Vùng giá đi</text>
<text x="786.0" y="172.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">ngang có hai</text>
<text x="786.0" y="186.1" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">mép rõ</text>
<text x="878.0" y="158.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Trading range</text>
<text x="878.0" y="172.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">nhỏ ở vị trí</text>
<text x="878.0" y="186.1" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">PO3 quan tâm</text>
<line x1="610.0" y1="198.0" x2="964.0" y2="198.0" stroke="#EEF0F4" stroke-width="1"/>
<text x="614.0" y="216.0" font-size="10.8" font-weight="700" fill="#6B7280" text-anchor="start">Dùng để</text>
<text x="676.0" y="216.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Biết rẻ / đắt</text>
<text x="676.0" y="230.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">(premium /</text>
<text x="676.0" y="244.1" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">discount), đâu là</text>
<text x="676.0" y="258.1" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">liquidity bên ngoài</text>
<text x="786.0" y="216.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Mô tả trạng</text>
<text x="786.0" y="230.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">thái cân bằng</text>
<text x="878.0" y="216.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đặt mốc để đo</text>
<text x="878.0" y="230.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">cú lệch (M)</text>
<line x1="610.0" y1="270.0" x2="964.0" y2="270.0" stroke="#EEF0F4" stroke-width="1"/>
<text x="614.0" y="288.0" font-size="10.8" font-weight="700" fill="#6B7280" text-anchor="start">Cần đi</text>
<text x="614.0" y="302.0" font-size="10.8" font-weight="700" fill="#6B7280" text-anchor="start">ngang?</text>
<text x="676.0" y="288.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">KHÔNG — có thể là</text>
<text x="676.0" y="302.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">một chân sóng</text>
<text x="786.0" y="288.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">CÓ</text>
<text x="878.0" y="288.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">CÓ</text>
<line x1="610.0" y1="314.0" x2="964.0" y2="314.0" stroke="#EEF0F4" stroke-width="1"/>
<text x="614.0" y="332.0" font-size="10.8" font-weight="700" fill="#6B7280" text-anchor="start">Có phải</text>
<text x="614.0" y="346.0" font-size="10.8" font-weight="700" fill="#6B7280" text-anchor="start">AMD?</text>
<text x="676.0" y="332.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Không — là khung</text>
<text x="676.0" y="346.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">tham chiếu</text>
<text x="786.0" y="332.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Chưa — chỉ là</text>
<text x="786.0" y="346.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">hình dạng</text>
<text x="878.0" y="332.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ là ứng viên</text>
<text x="878.0" y="346.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">cho chữ A</text>
<line x1="610.0" y1="358.0" x2="964.0" y2="358.0" stroke="#EEF0F4" stroke-width="1"/>
<rect x="610.0" y="366.0" width="354.0" height="62.1" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="620.0" y="387.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Mép của Accumulation range phải được vẽ TRƯỚC cú lệch. Vẽ</text>
<text x="620.0" y="402.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">lại mép sau khi giá đã chạy là cách tạo ra “sweep” không tồn</text>
<text x="620.0" y="418.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">tại.</text>
</svg>
