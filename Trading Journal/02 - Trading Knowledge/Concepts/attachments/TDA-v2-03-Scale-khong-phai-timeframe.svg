<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Ý nghĩa thuộc về THANG của swing bị phá — không thuộc về khung bạn nhìn thấy sự kiện</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng là 'một MSS', hai hệ quả hoàn toàn khác nhau cho Daily Bias (TDA-R02 — gốc là R7 của Dealing Range v0.1 / Daily Bias §4.1.3).</text>
<rect x="26.0" y="84.0" width="460.0" height="370.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">A · M5 bearish MSS phá một micro swing</text>
<rect x="44.0" y="120.0" width="424.0" height="210.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="52.0" y="136.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">M5 (bên trong nhịp hồi H1)</text>
<line x1="171.2" y1="221.0" x2="468.0" y2="221.0" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="175.2" y="236.0" font-size="10" font-weight="400" fill="#B45309" text-anchor="start">micro swing low (L1) — phạm vi vài chục phút</text>
<polyline points="52.5,265.4 94.9,192.7 137.3,216.9 179.7,221.0 234.8,168.5 289.9,180.6 323.8,156.3 366.2,200.8 408.6,245.2 451.0,265.4" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="395.9" cy="221.0" r="4" fill="#B91C1C" stroke="white" stroke-width="1.2"/>
<text x="306.9" y="281.5" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">đóng nến dưới L1 = 'bearish MSS'</text>
<rect x="44.0" y="342.0" width="424.0" height="98.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
<text x="58.0" y="364.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">Hệ quả cho tầng trên</text>
<text x="58.0" y="384.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="71.0" y="384.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Thang bị ảnh hưởng: L1 — rất nhỏ so với thang D1</text>
<text x="58.0" y="402.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="71.0" y="402.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Daily Bias: KHÔNG đổi. H1/D1 POI: không đổi</text>
<text x="58.0" y="421.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="71.0" y="421.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ có nghĩa: setup long M5 lúc này chưa có</text>
<rect x="514.0" y="84.0" width="460.0" height="370.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="528.0" y="108.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">B · H1 displacement phá protected low của D1</text>
<rect x="532.0" y="120.0" width="424.0" height="210.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="540.0" y="136.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">H1 (nhìn trên khung giờ)</text>
<line x1="532.0" y1="304.8" x2="956.0" y2="304.8" stroke="#15803D" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="536.0" y="299.8" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">protected low D1 (L4) — origin của leg BOS</text>
<rect x="532.0" y="195.6" width="424.0" height="33.6" rx="2" fill="#DBEAFE" stroke="none" stroke-width="0" opacity="0.9"/>
<text x="952.0" y="226.2" font-size="9.5" font-weight="400" fill="#1D4ED8" text-anchor="end">D1 FVG</text>
<polyline points="540.5,140.2 591.4,163.7 625.3,153.6 684.6,193.9 718.6,183.8 769.4,224.2 794.9,214.1 845.8,291.4 896.6,318.2 939.0,311.5" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="867.0" cy="304.8" r="4" fill="#B91C1C" stroke="white" stroke-width="1.2"/>
<text x="544.7" y="274.6" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">thân nến H1 xuyên 1000 bằng displacement →</text>
<rect x="532.0" y="342.0" width="424.0" height="98.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="546.0" y="364.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">Hệ quả cho tầng trên</text>
<text x="546.0" y="384.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="559.0" y="384.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Thang bị ảnh hưởng: L4 — chính swing neo bối cảnh D1</text>
<text x="546.0" y="402.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="559.0" y="402.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Ngay lập tức: SUSPEND mọi setup long mới</text>
<text x="546.0" y="421.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="559.0" y="421.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Tại D1 close: xác nhận INVALIDATED hay phục hồi</text>
<rect x="26.0" y="468.0" width="948.0" height="74.0" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="42.0" y="492.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Quy tắc vận hành:</text>
<text x="42.0" y="514.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Trước khi kết luận từ một sự kiện cấu trúc, hỏi: swing bị phá thuộc cấp nào (L1–L5)? Cấp đó có quyền thay đổi quyết định của tầng nào?</text>
<text x="42.0" y="532.0" font-size="11.8" font-weight="400" fill="#6B7280" text-anchor="start">Thấy sự kiện trên M5 không có nghĩa nó nhỏ; thấy trên D1 không có nghĩa nó lớn — nhưng M5 hầu như chỉ phá được swing nhỏ.</text>
</svg>
