<circle cx="550.0" cy="154.4" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="242.0" y="451.1" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">“CHoCH” internal</text>
<text x="396.0" y="367.2" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">“CHoCH” internal</text>
<text x="312.4" y="290.3" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">HH</text>
<text x="462.0" y="218.4" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">HH</text>
<text x="544.0" y="146.4" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">HH</text>
<rect x="600.0" y="92.5" width="372.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="614.0" y="106.5" width="165.3" height="20.0" rx="10.0" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="696.7" y="118.7" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">Not CHoCH (ở lớp external)</text>
<text x="616.0" y="150.5" font-size="11" font-weight="700" fill="#6B7280">BỐI CẢNH</text>
<text x="616.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">H1 tăng mạnh. Khung nhìn: M15 bên trong chân tăng H1.</text>
<text x="616.0" y="188.9" font-size="11" font-weight="700" fill="#6B7280">CẤU TRÚC</text>
<text x="616.0" y="204.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Lớp external: tăng. Lớp internal: mỗi đợt hồi có đỉnh/đáy</text>
<text x="616.0" y="221.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">nhỏ.</text>
<text x="616.0" y="243.9" font-size="11" font-weight="700" fill="#6B7280">CHỌN SWING</text>
<text x="616.0" y="259.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đáy 50 và 64 là đáy NỘI BỘ của đợt hồi, không phải gốc</text>
<text x="616.0" y="276.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">của BOS H1.</text>
<text x="616.0" y="298.8" font-size="11" font-weight="700" fill="#6B7280">CHUỖI GIÁ</text>
<text x="616.0" y="314.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Mỗi lần hồi, giá thủng một đáy nhỏ → nhiều indicator in</text>
<text x="616.0" y="331.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">“CHoCH”. Sau đó giá vượt đỉnh mới.</text>
<text x="616.0" y="353.8" font-size="11" font-weight="700" fill="#6B7280">PHÂN LOẠI</text>
<text x="616.0" y="369.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">CHoCH internal — đúng ở lớp nhỏ, VÔ NGHĨA ở lớp</text>
<text x="616.0" y="386.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">external.</text>
<text x="616.0" y="408.7" font-size="11" font-weight="700" fill="#6B7280">HÀM Ý</text>
<text x="616.0" y="424.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Không Short. Ngược lại: các CHoCH ↑ ở cuối mỗi đợt hồi</text>
<text x="616.0" y="441.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">mới là chỗ cần chú ý.</text>
<text x="616.0" y="463.7" font-size="11" font-weight="700" fill="#6B7280">VÔ HIỆU</text>
<text x="616.0" y="479.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Chỉ khi protected low external bị đóng nến xuyên.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đây là lỗi phổ biến nhất khi dùng indicator CHoCH tự động: không khai báo lớp nên mọi cú phá nhỏ đều trông như đảo chiều.</text>
