<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Case C — “CHoCH” giả: phá internal, xu hướng external vẫn chạy</text>
<rect x="876.7" y="23.0" width="95.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.4" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CASE STUDY</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Nhãn CHoCH đúng về mặt kỹ thuật ở lớp nhỏ nhưng bị đọc sai thành đảo chiều.</text>
<rect x="28.0" y="92.5" width="560.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
