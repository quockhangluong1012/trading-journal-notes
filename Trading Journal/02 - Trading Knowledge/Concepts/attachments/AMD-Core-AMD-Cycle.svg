<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
  <text x="24" y="30" font-size="18" font-weight="700" fill="currentColor">Chu kỳ AMD — Tích lũy → Thao túng → Phân phối</text>
  <text x="24" y="50" font-size="12.5" fill="var(--muted)">Đọc market trước, đặt tên sau. Cùng một đường giá, ba việc khác nhau.</text>
  <line x1="330" y1="64" x2="330" y2="268" stroke="var(--border)" stroke-dasharray="4 3"/>
  <line x1="470" y1="64" x2="470" y2="268" stroke="var(--border)" stroke-dasharray="4 3"/>
  <text x="40" y="80" font-size="12" font-weight="700" fill="var(--accent)">A · ACCUMULATION</text>
  <text x="338" y="80" font-size="12" font-weight="700" fill="var(--warning)">M · MANIPULATION</text>
  <text x="478" y="80" font-size="12" font-weight="700" fill="var(--success)">D · DISTRIBUTION</text>
  <line x1="30" y1="175" x2="870" y2="175" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="782" y="169" font-size="11" fill="var(--muted)">Daily Open</text>
  <rect x="40" y="145" width="280" height="60" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="40" y1="208" x2="470" y2="208" stroke="var(--error)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="44" y="222" font-size="11" fill="var(--error)">SSL dưới đáy range</text>
  <path d="M40,175 L90,165 L140,185 L190,160 L240,182 L290,168 L320,178 L360,222 L390,200 L420,178 L460,160 L510,130 L550,142 L610,108 L660,116 L730,86 L800,94 L860,70" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="360" cy="222" r="5" fill="var(--warning)"/>
  <text x="292" y="248" font-size="11.5" font-weight="700" fill="var(--warning)">Judas quét SSL</text>
  <circle cx="460" cy="160" r="4" fill="var(--success)"/>
  <text x="470" y="152" font-size="11.5" font-weight="700" fill="var(--success)">reclaim + MSS</text>
  <line x1="600" y1="70" x2="870" y2="70" stroke="var(--success)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="766" y="63" font-size="11" fill="var(--success)">Target: BSL</text>
  <text x="40" y="292" font-size="12" fill="var(--accent)">A = chuẩn bị: đánh dấu range, KHÔNG trade breakout</text>
  <text x="40" y="312" font-size="12" fill="var(--warning)">M = quan sát: cú phá đầu tiên mặc định là bẫy, chờ reclaim</text>
  <text x="40" y="332" font-size="12" fill="var(--success)">D = thực thi: chỉ entry sau sweep + displacement, về phía DOL</text>
</svg>
