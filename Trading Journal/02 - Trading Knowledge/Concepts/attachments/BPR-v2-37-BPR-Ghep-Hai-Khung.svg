<text x="40.0" y="522.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hai FVG được đo trên hai “lưới nến” khác nhau. Trên M5, FVG đỏ không tồn tại.</text>
<text x="40.0" y="538.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Trên M15, FVG xanh không tồn tại. Phần chồng không là BPR trên khung nào cả.</text>
<rect x="506.0" y="478.0" width="466.0" height="90.0" rx="10" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="518.0" y="502.5" font-size="12.5" font-weight="700" fill="#0F7A5A" text-anchor="start">Cách gọi đúng hơn</text>
<text x="518.0" y="522.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Gọi đó là “confluence giữa FVG M5 và FVG M15” và ghi riêng. Nếu muốn dùng</text>
<text x="518.0" y="538.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhãn BPR, hãy yêu cầu cả hai FVG cùng một khung. [Quy ước nghiên cứu của note</text>
<text x="518.0" y="553.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">này]</text>
<text x="28.0" y="600.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Hệ quả cho D1 → H1 → M5: một H1 BPR khi nhìn trên M5 chỉ là một chữ V gồm nhiều nến; nó không cần “hiện ra” thành BPR trên M5 mới có giá trị.</text>
