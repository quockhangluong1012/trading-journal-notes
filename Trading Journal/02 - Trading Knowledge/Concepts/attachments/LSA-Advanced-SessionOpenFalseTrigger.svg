<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<defs>
<marker id="lsafs1" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 Z" fill="#15803D"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Sweep cùng khung vẫn có thể là nhiễu — same-scale là cần, chưa đủ</text>
<text x="24" y="54" font-size="13" fill="#6B7280">Spike mở phiên (quét rỗng) vs quét equal lows THẬT tại POI — bộ lọc: "wick này quét CÁI GÌ?"</text>
<rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<!-- LEFT: session-open false spike -->
<rect x="40" y="86" width="336" height="248" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
<text x="54" y="108" font-size="12" font-weight="700" fill="#B91C1C">✗ Spike mở phiên — quét RỖNG</text>
<!-- session open vertical -->
<line x1="150" y1="122" x2="150" y2="316" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="156" y="134" font-size="9" fill="#6B7280">NY 09:30 open</text>
<!-- price path with mechanical spike -->
<path d="M60,180 L92,196 L120,186 L150,208 L150,286 L150,214 L182,196 L214,206 L246,190 L288,200 L332,186"
 fill="none" stroke="#374151" stroke-width="2.1"/>
<circle cx="150" cy="286" r="5" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<text x="60" y="304" font-size="9.5" fill="#374151">wick mở phiên — spike cơ học, snap lại ngay</text>
<text x="60" y="320" font-size="9.5" font-weight="700" fill="#B91C1C">không có pool nào ở dưới → không ai kẹt → KHÔNG phải trigger</text>
<!-- RIGHT: real EQL sweep -->
<rect x="392" y="86" width="336" height="248" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="406" y="108" font-size="12" font-weight="700" fill="#166534">✓ Quét equal lows THẬT tại POI = trigger</text>
<!-- POI box -->
<rect x="408" y="150" width="304" height="40" fill="#16A34A" opacity="0.10"/>
<text x="414" y="166" font-size="9.5" font-weight="700" fill="#15803D">POI (OB / FVG discount)</text>
<!-- EQL dashed line -->
<line x1="408" y1="262" x2="712" y2="262" stroke="#B45309" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="414" y="276" font-size="9.5" font-weight="700" fill="#B45309">SSL thật = equal lows (EQL) — trader kẹt bên dưới</text>
<!-- equal lows dots -->
<circle cx="470" cy="262" r="3.4" fill="#B45309"/>
<circle cx="540" cy="262" r="3.4" fill="#B45309"/>
<circle cx="600" cy="262" r="3.4" fill="#B45309"/>
<!-- price path sweeping EQL then reversing -->
<path d="M408,180 L440,206 L470,262 L500,262 L520,284 L540,262 L560,230 L600,262 L620,238 L660,196 L700,160"
 fill="none" stroke="#374151" stroke-width="2.1"/>
<circle cx="520" cy="284" r="5" fill="none" stroke="#B45309" stroke-width="2.2"/>
<circle cx="620" cy="238" r="5" fill="none" stroke="#15803D" stroke-width="2.2"/>
<path d="M660,196 L700,160" fill="none" stroke="#15803D" stroke-width="1.6" marker-end="url(#lsafs1)"/>
<text x="408" y="308" font-size="9.5" fill="#374151">① wick xuyên EQL rồi đóng lại → ② M5 MSS + FVG → Long</text>
<text x="408" y="324" font-size="9.5" font-weight="700" fill="#15803D">quét đúng một pool CÓ Ý NGHĨA = trigger hợp lệ</text>
<!-- bottom band -->
<rect x="40" y="348" width="680" height="86" rx="8" fill="#F3F4F6"/>
<text x="54" y="372" font-size="12.5" font-weight="700" fill="#1F2937">Bộ lọc 1 câu: "Wick này quét CÁI GÌ? Ai kẹt ở đó?"</text>
<text x="54" y="393" font-size="10.5" fill="#374151">Không chỉ ra được một pool cụ thể (equal highs/lows, old high/low, session liquidity) → KHÔNG phải trigger, dù cùng khung.</text>
<text x="54" y="410" font-size="10.5" fill="#374151">§8 đo được SCALE (khung); bộ lọc này kiểm tra NỘI DUNG thanh khoản — scale đúng nhưng pool rỗng thì vẫn là nhiễu.</text>
<text x="54" y="427" font-size="10.5" font-weight="700" fill="#B45309">Ghi journal: sweep_target_named = yes / no.</text>
</svg>
