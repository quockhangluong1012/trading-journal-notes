<svg viewBox="0 0 980 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="580" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao giá hay đi tới vùng liquidity? — bảy cơ chế và một baseline</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Không cơ chế nào cần giả định một "Smart Money" toàn năng. Chúng có thể cùng đúng, ở các mức độ khác nhau, tùy thị trường và thời điểm.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Ô cuối cùng là phép thử bắt buộc: một random walk cũng "tìm tới" mức gần nhất.</text>
<rect x="40.0" y="102.0" width="214.0" height="214.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
<text x="52.0" y="126.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">A · Kích hoạt stop</text>
<text x="52.0" y="150.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Giá chạm mức → stop thành lệnh market</text>
<text x="52.0" y="165.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">→ phản hồi dương, có thể dây chuyền.</text>
<line x1="52.0" y1="190.0" x2="242.0" y2="190.0" stroke="#DC2626" stroke-width="0.8" opacity="0.6"/>
<text x="52.0" y="210.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Dấu vết: tăng tốc ngay sau mức,</text>
<text x="52.0" y="225.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">wick dài khi sổ mỏng.</text>
<text x="52.0" y="264.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">[MARKET MECHANICS]</text>
<text x="52.0" y="284.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Osler 2005; Fett &amp; McPhail 2017</text>
<rect x="268.0" y="102.0" width="214.0" height="214.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="280.0" y="126.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">B · Nhu cầu khớp lệnh lớn</text>
<text x="280.0" y="150.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Lệnh lớn cần đối ứng để khớp</text>
<text x="280.0" y="165.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">ít trượt giá → nơi có lệnh ngược chiều.</text>
<line x1="280.0" y1="190.0" x2="470.0" y2="190.0" stroke="#2563EB" stroke-width="0.8" opacity="0.6"/>
<text x="280.0" y="210.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Dấu vết: không quan sát được</text>
<text x="280.0" y="225.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">ý định trên OHLC.</text>
<text x="280.0" y="264.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">[INTERPRETATION]</text>
<text x="280.0" y="284.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Kyle 1985; Bouchaud et al. 2018</text>
<rect x="496.0" y="102.0" width="214.0" height="214.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="508.0" y="126.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">C · Price discovery</text>
<text x="508.0" y="150.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Vượt mức cũ = thông tin mới về</text>
<text x="508.0" y="165.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">cung–cầu; giá dò tìm điểm cân bằng.</text>
<line x1="508.0" y1="190.0" x2="698.0" y2="190.0" stroke="#16A34A" stroke-width="0.8" opacity="0.6"/>
<text x="508.0" y="210.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Dấu vết: acceptance hoặc</text>
<text x="508.0" y="225.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">rejection sau khi vượt mức.</text>
<text x="508.0" y="264.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">[MARKET MECHANICS]</text>
<text x="508.0" y="284.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Auction / microstructure</text>
<rect x="724.0" y="102.0" width="214.0" height="214.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
<text x="736.0" y="126.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">D · Người tham gia breakout</text>
<text x="736.0" y="150.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Trader kỹ thuật vào lệnh khi phá</text>
<text x="736.0" y="165.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">→ dòng lệnh cùng chiều tại mức nổi bật.</text>
<line x1="736.0" y1="190.0" x2="926.0" y2="190.0" stroke="#D97706" stroke-width="0.8" opacity="0.6"/>
<text x="736.0" y="210.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Dấu vết: khối lượng tăng tại mức</text>
<text x="736.0" y="225.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">(nếu có dữ liệu volume).</text>
<text x="736.0" y="264.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">[MARKET MECHANICS]</text>
<text x="736.0" y="284.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Osler 2003; Kavajecz &amp; O-W 2004</text>
<rect x="40.0" y="330.0" width="214.0" height="214.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="52.0" y="354.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">E · Thuật toán tìm thanh khoản</text>
<text x="52.0" y="378.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Thuật toán thực thi đặt/khớp</text>
<text x="52.0" y="393.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">lệnh nơi có depth; market maker</text>
<text x="52.0" y="408.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">chỉnh quote theo tồn kho.</text>
<line x1="52.0" y1="418.0" x2="242.0" y2="418.0" stroke="#7C3AED" stroke-width="0.8" opacity="0.6"/>
<text x="52.0" y="438.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Dấu vết: chỉ thấy bằng dữ liệu</text>
<text x="52.0" y="453.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">sổ lệnh, không thấy trên nến.</text>
<text x="52.0" y="492.0" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="start">[INTERPRETATION]</text>
<text x="52.0" y="512.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Harris 2003; Bouchaud et al.</text>
<rect x="268.0" y="330.0" width="214.0" height="214.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="280.0" y="354.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">F · Kích hoạt có chủ đích</text>
<text x="280.0" y="378.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Lệnh nhỏ đẩy giá tới cụm stop để</text>
<text x="280.0" y="393.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">hưởng chuyển động dây chuyền.</text>
<line x1="280.0" y1="418.0" x2="470.0" y2="418.0" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
<text x="280.0" y="438.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Có trong tài liệu quản lý; trên OHLC</text>
<text x="280.0" y="453.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">KHÔNG phân biệt được với A.</text>
<text x="280.0" y="492.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">[INTERPRETATION]</text>
<text x="280.0" y="512.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Brunnermeier &amp; Pedersen 2005</text>
<rect x="496.0" y="330.0" width="214.0" height="214.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="508.0" y="354.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">G · Động lực đấu giá (AMT)</text>
<text x="508.0" y="378.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Giá "quảng bá" tới mức xa để tìm</text>
<text x="508.0" y="393.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">đối ứng; không có phản hồi → excess.</text>
<line x1="508.0" y1="418.0" x2="698.0" y2="418.0" stroke="#16A34A" stroke-width="0.8" opacity="0.6"/>
<text x="508.0" y="438.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Dấu vết: đuôi dài (excess) +</text>
<text x="508.0" y="453.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">giá quay về vùng giá trị.</text>
<text x="508.0" y="492.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">[FRAMEWORK — AMT]</text>
<text x="508.0" y="512.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Auction Market Theory</text>
<rect x="724.0" y="330.0" width="214.0" height="214.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="6 3"/>
<text x="736.0" y="354.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">H · Baseline hình học</text>
<text x="736.0" y="378.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Random walk KHÔNG có cơ chế</text>
<text x="736.0" y="393.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">nào ở trên vẫn chạm mức gần</text>
<text x="736.0" y="408.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">trước với xác suất:</text>
<line x1="736.0" y1="418.0" x2="926.0" y2="418.0" stroke="#DC2626" stroke-width="0.8" opacity="0.6"/>
<text x="736.0" y="438.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">P(gần trước) = d_xa / (d_gần + d_xa)</text>
<text x="736.0" y="453.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">1 vs 3 ATR → 75%. Không phải edge.</text>
<text x="736.0" y="492.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">[MATHEMATICAL]</text>
<text x="736.0" y="512.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">gambler's ruin</text>
</svg>