<svg viewBox="0 0 1000 470" width="1000" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="468" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mental model cuối cùng — Năm câu để mang theo</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Nếu chỉ nhớ một hình trong note này, hãy nhớ hình này.</text>
<rect x="884.4" y="22.0" width="87.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">TỔNG KẾT</text>
<rect x="28.0" y="90.0" width="944.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<circle cx="64.0" cy="120.0" r="18" fill="#9CA3AF" stroke="none" stroke-width="2"/>
<text x="64.0" y="126.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="100.0" y="116.0" font-size="14.5" font-weight="700" fill="#1F2937" text-anchor="start">Mọi đáy bắt đầu là đáy nhỏ.</text>
<text x="100.0" y="136.0" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">STL là viên gạch. ITL và LTL chỉ là STL được lên cấp.</text>
<rect x="28.0" y="162.0" width="944.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<circle cx="64.0" cy="192.0" r="18" fill="#2563EB" stroke="none" stroke-width="2"/>
<text x="64.0" y="198.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="100.0" y="188.0" font-size="14.5" font-weight="700" fill="#1F2937" text-anchor="start">Lên cấp = thấp hơn hàng xóm CÙNG CẤP ở hai bên.</text>
<text x="100.0" y="208.0" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Không do rơi sâu bao nhiêu, không do mất bao lâu.</text>
<rect x="28.0" y="234.0" width="944.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
<circle cx="64.0" cy="264.0" r="18" fill="#D97706" stroke="none" stroke-width="2"/>
<text x="64.0" y="270.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="100.0" y="260.0" font-size="14.5" font-weight="700" fill="#1F2937" text-anchor="start">Cấp càng cao, biết càng muộn.</text>
<text x="100.0" y="280.0" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Mép phải của chart luôn là "ứng viên". Không dùng tương lai.</text>
<rect x="28.0" y="306.0" width="944.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<circle cx="64.0" cy="336.0" r="18" fill="#7C3AED" stroke="none" stroke-width="2"/>
<text x="64.0" y="342.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="100.0" y="332.0" font-size="14.5" font-weight="700" fill="#1F2937" text-anchor="start">Cấp độ ≠ protected ≠ liquidity ≠ đảo chiều.</text>
<text x="100.0" y="352.0" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Bốn câu hỏi khác nhau. Trả lời từng câu một.</text>
<rect x="28.0" y="378.0" width="944.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
<circle cx="64.0" cy="408.0" r="18" fill="#DC2626" stroke="none" stroke-width="2"/>
<text x="64.0" y="414.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="100.0" y="404.0" font-size="14.5" font-weight="700" fill="#1F2937" text-anchor="start">Phá cấp nào, kết luận cấp đó — và luôn kèm tên khung.</text>
<text x="100.0" y="424.0" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">M5 không cãi H1. H1 không cãi D1.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
