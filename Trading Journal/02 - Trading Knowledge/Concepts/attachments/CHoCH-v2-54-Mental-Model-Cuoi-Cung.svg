<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Mental model cuối cùng: CHoCH trên một trang</text>
<rect x="897.6" y="23.0" width="74.4" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="934.8" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">TÓM TẮT</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đọc từ trái sang phải. Dòng trên: câu cho bé 5 tuổi. Dòng dưới: câu kỹ thuật.</text>
<rect x="28.0" y="94.5" width="151.0" height="380.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="28.0" y="94.5" width="151.0" height="50.0" rx="12" fill="#2563EB" fill-opacity="0.12"/>
<text x="38.0" y="116.5" font-size="12.5" font-weight="700" fill="#2563EB" data-bx="37.0,170.0">1. Có thói quen</text>
<text x="38.0" y="170.5" font-size="10.5" font-weight="700" fill="#6B7280">Cho bé</text>
<text x="38.0" y="188.5" font-size="12" font-weight="400" fill="#111827" data-bx="37.0,170.0" font-style="italic">Nam leo “tiến ba lùi</text>
<text x="38.0" y="205.5" font-size="12" font-weight="400" fill="#111827" data-bx="37.0,170.0" font-style="italic">một”.</text>
<line x1="38.0" y1="264.5" x2="169.0" y2="264.5" stroke="#DADDE3" stroke-width="1" stroke-linecap="round"/>
<text x="38.0" y="286.5" font-size="10.5" font-weight="700" fill="#6B7280">Kỹ thuật</text>
<text x="38.0" y="304.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="37.0,170.0">Khai báo trạng thái:</text>
<text x="38.0" y="320.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="37.0,170.0">khung, lớp, tăng/giảm.</text>
<rect x="186.6" y="94.5" width="151.0" height="380.0" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<rect x="186.6" y="94.5" width="151.0" height="50.0" rx="12" fill="#B45309" fill-opacity="0.12"/>
<text x="196.6" y="116.5" font-size="12.5" font-weight="700" fill="#B45309" data-bx="195.6,328.6">2. Có bậc lấy đà</text>
<text x="196.6" y="170.5" font-size="10.5" font-weight="700" fill="#6B7280">Cho bé</text>
<text x="196.6" y="188.5" font-size="12" font-weight="400" fill="#111827" data-bx="195.6,328.6" font-style="italic">Bậc giúp Nam leo lần</text>
<text x="196.6" y="205.5" font-size="12" font-weight="400" fill="#111827" data-bx="195.6,328.6" font-style="italic">gần nhất.</text>
<line x1="196.6" y1="264.5" x2="327.6" y2="264.5" stroke="#DADDE3" stroke-width="1" stroke-linecap="round"/>
<text x="196.6" y="286.5" font-size="10.5" font-weight="700" fill="#6B7280">Kỹ thuật</text>
<text x="196.6" y="304.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="195.6,328.6">Protected swing = gốc</text>
<text x="196.6" y="320.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="195.6,328.6">chân tạo BOS gần</text>
<text x="196.6" y="337.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="195.6,328.6">nhất.</text>
<rect x="345.2" y="94.5" width="151.0" height="380.0" rx="12" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.6"/>
<rect x="345.2" y="94.5" width="151.0" height="50.0" rx="12" fill="#C026D3" fill-opacity="0.12"/>
<text x="355.2" y="116.5" font-size="12.5" font-weight="700" fill="#C026D3" data-bx="354.2,487.2">3. Thói quen bị phá</text>
<text x="355.2" y="170.5" font-size="10.5" font-weight="700" fill="#6B7280">Cho bé</text>
<text x="355.2" y="188.5" font-size="12" font-weight="400" fill="#111827" data-bx="354.2,487.2" font-style="italic">Nam đứng hẳn xuống</text>
<text x="355.2" y="205.5" font-size="12" font-weight="400" fill="#111827" data-bx="354.2,487.2" font-style="italic">dưới bậc lấy đà.</text>
<line x1="355.2" y1="264.5" x2="486.2" y2="264.5" stroke="#DADDE3" stroke-width="1" stroke-linecap="round"/>
<text x="355.2" y="286.5" font-size="10.5" font-weight="700" fill="#6B7280">Kỹ thuật</text>
<text x="355.2" y="304.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="354.2,487.2">Thân nến ĐÓNG ngược</text>
<text x="355.2" y="320.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="354.2,487.2">trạng thái qua</text>
<text x="355.2" y="337.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="354.2,487.2">protected swing (G0).</text>
<rect x="503.8" y="94.5" width="151.0" height="380.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<rect x="503.8" y="94.5" width="151.0" height="50.0" rx="12" fill="#7C3AED" fill-opacity="0.12"/>
<text x="513.8" y="116.5" font-size="12.5" font-weight="700" fill="#7C3AED" data-bx="512.8,645.8">4. Phá mạnh hay</text>
<text x="513.8" y="132.1" font-size="12.5" font-weight="700" fill="#7C3AED" data-bx="512.8,645.8">yếu?</text>
<text x="513.8" y="170.5" font-size="10.5" font-weight="700" fill="#6B7280">Cho bé</text>
<text x="513.8" y="188.5" font-size="12" font-weight="400" fill="#111827" data-bx="512.8,645.8" font-style="italic">Đạp tung cửa hay hé</text>
<text x="513.8" y="205.5" font-size="12" font-weight="400" fill="#111827" data-bx="512.8,645.8" font-style="italic">từng chút?</text>
<line x1="513.8" y1="264.5" x2="644.8" y2="264.5" stroke="#DADDE3" stroke-width="1" stroke-linecap="round"/>
<text x="513.8" y="286.5" font-size="10.5" font-weight="700" fill="#6B7280">Kỹ thuật</text>
<text x="513.8" y="304.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="512.8,645.8">Displacement (G1),</text>
<text x="513.8" y="320.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="512.8,645.8">FVG, quét trước đó:</text>
<text x="513.8" y="337.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="512.8,645.8">chất lượng, không phải</text>
<text x="513.8" y="353.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="512.8,645.8">định nghĩa.</text>
<rect x="662.4" y="94.5" width="151.0" height="380.0" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
<rect x="662.4" y="94.5" width="151.0" height="50.0" rx="12" fill="#0D9488" fill-opacity="0.12"/>
<text x="672.4" y="116.5" font-size="12.5" font-weight="700" fill="#0D9488" data-bx="671.4,804.4">5. Ở đâu?</text>
<text x="672.4" y="170.5" font-size="10.5" font-weight="700" fill="#6B7280">Cho bé</text>
<text x="672.4" y="188.5" font-size="12" font-weight="400" fill="#111827" data-bx="671.4,804.4" font-style="italic">Đúng nhà chưa?</text>
<line x1="672.4" y1="264.5" x2="803.4" y2="264.5" stroke="#DADDE3" stroke-width="1" stroke-linecap="round"/>
<text x="672.4" y="286.5" font-size="10.5" font-weight="700" fill="#6B7280">Kỹ thuật</text>
<text x="672.4" y="304.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="671.4,804.4">HTF POI,</text>
<text x="672.4" y="320.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="671.4,804.4">premium/discount,</text>
<text x="672.4" y="337.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="671.4,804.4">khung lớn — quyết</text>
<text x="672.4" y="353.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="671.4,804.4">định có nên đọc tiếp.</text>
<rect x="821.0" y="94.5" width="151.0" height="380.0" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>
<rect x="821.0" y="94.5" width="151.0" height="50.0" rx="12" fill="#15803D" fill-opacity="0.12"/>
<text x="831.0" y="116.5" font-size="12.5" font-weight="700" fill="#15803D" data-bx="830.0,963.0">6. Rồi sao?</text>
<text x="831.0" y="170.5" font-size="10.5" font-weight="700" fill="#6B7280">Cho bé</text>
<text x="831.0" y="188.5" font-size="12" font-weight="400" fill="#111827" data-bx="830.0,963.0" font-style="italic">Leo tiếp? Nghỉ? Đi</text>
<text x="831.0" y="205.5" font-size="12" font-weight="400" fill="#111827" data-bx="830.0,963.0" font-style="italic">xuống?</text>
<line x1="831.0" y1="264.5" x2="962.0" y2="264.5" stroke="#DADDE3" stroke-width="1" stroke-linecap="round"/>
<text x="831.0" y="286.5" font-size="10.5" font-weight="700" fill="#6B7280">Kỹ thuật</text>
<text x="831.0" y="304.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="830.0,963.0">G2 (đứng vững) → G3</text>
<text x="831.0" y="320.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="830.0,963.0">(HL/LH mới + BOS).</text>
<text x="831.0" y="337.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="830.0,963.0">Chỉ lúc đó mới bàn đến</text>
<text x="831.0" y="353.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="830.0,963.0">“xu hướng mới”.</text>
<rect x="28.0" y="490.5" width="944.0" height="74.5" rx="8" fill="#C026D3" fill-opacity="0.07" stroke="#C026D3" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="490.5" width="4.0" height="74.5" rx="2" fill="#C026D3"/>
<text x="42.0" y="511.5" font-size="13" font-weight="700" fill="#C026D3" data-bx="28.0,972.0">Một câu để nhớ</text>
<text x="42.0" y="533.0" font-size="13" font-weight="400" fill="#111827" data-bx="28.0,972.0">CHoCH trả lời câu hỏi: “Cái thói quen mà cấu trúc này dựa vào có vừa bị phá ở đúng chỗ quan trọng không?” Nó KHÔNG trả lời: “Giá sẽ đi đâu?”,</text>
<text x="42.0" y="551.4" font-size="13" font-weight="400" fill="#111827" data-bx="28.0,972.0">“Ai đang mua?”, hay “Có nên vào lệnh không?”.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Mọi thứ trong hình này đã được giải thích chi tiết trong note. Nếu một ô ở đây chưa rõ, quay lại mục tương ứng.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
