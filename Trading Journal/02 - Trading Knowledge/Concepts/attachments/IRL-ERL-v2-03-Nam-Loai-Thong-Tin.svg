<rect x="404.0" y="87.0" width="568.0" height="59.6" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="404.0" y="95.0" width="4.0" height="43.6" rx="2" fill="#475569" stroke="none" stroke-width="1.2"/>
<rect x="418.0" y="107.8" width="66.0" height="18.0" rx="9.0" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="451.0" y="120.8" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">QUAN SÁT</text>
<text x="516.0" y="113.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">Giá đã giao dịch trên A. Cây nến đó đóng cửa dưới A. Ai nhìn chart cũng thấy</text>
<text x="516.0" y="130.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">giống nhau.</text>
<rect x="404.0" y="154.6" width="568.0" height="59.6" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="404.0" y="162.6" width="4.0" height="43.6" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<rect x="418.0" y="175.4" width="30.9" height="18.0" rx="9.0" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="433.4" y="188.4" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<text x="516.0" y="181.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">Buy-side liquidity trên A đã bị lấy — một cú “sweep” ERL (nếu A là biên range</text>
<text x="516.0" y="198.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">đang dùng).</text>
<rect x="404.0" y="222.2" width="568.0" height="59.6" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="404.0" y="230.2" width="4.0" height="43.6" rx="2" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<rect x="418.0" y="243.0" width="52.5" height="18.0" rx="9.0" fill="#E6F6F4" stroke="#0F766E" stroke-width="1.1"/>
<text x="444.3" y="256.0" font-size="10" font-weight="700" fill="#0F766E" text-anchor="middle">CƠ CHẾ</text>
<text x="516.0" y="249.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">NẾU có lệnh stop mua nằm trên A, khi giá chạm tới chúng thức dậy thành lệnh</text>
<text x="516.0" y="265.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">mua và khớp với người đang bán.</text>
<rect x="404.0" y="289.8" width="568.0" height="59.6" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="404.0" y="297.8" width="4.0" height="43.6" rx="2" fill="#B45309" stroke="none" stroke-width="1.2"/>
<rect x="418.0" y="310.6" width="60.7" height="18.0" rx="9.0" fill="#FFF7E6" stroke="#B45309" stroke-width="1.1"/>
<text x="448.3" y="323.6" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<text x="516.0" y="316.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">Có một bên lớn đã dùng dòng lệnh mua đó để bán ra. Hợp lý — nhưng chart</text>
<text x="516.0" y="333.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">không chứng minh được.</text>
<rect x="404.0" y="357.4" width="568.0" height="59.6" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="404.0" y="365.4" width="4.0" height="43.6" rx="2" fill="#BE123C" stroke="none" stroke-width="1.2"/>
<rect x="418.0" y="378.2" width="75.7" height="18.0" rx="9.0" fill="#FFF1F3" stroke="#BE123C" stroke-width="1.1"/>
<text x="455.8" y="391.2" font-size="10" font-weight="700" fill="#BE123C" text-anchor="middle">GIẢ THUYẾT</text>
<text x="516.0" y="384.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">Sau cú này giá sẽ quay vào IRL bên trong range. Cần ghi trước, rồi kiểm chứng</text>
<text x="516.0" y="400.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="444.0">bằng nhiều mẫu.</text>
<rect x="28.0" y="433.0" width="944.0" height="51.6" rx="10" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="457.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chart cho ta thấy GIÁ và THỜI GIAN. Nó không cho thấy ai đặt lệnh, đặt bao nhiêu lệnh, hay vì sao họ đặt. Mọi câu “Smart Money cố tình…” đều thuộc loại DIỄN</text>
<text x="42.0" y="473.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">GIẢI.</text>
