<text x="926.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">FACT vs ICT</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cùng một sự kiện, năm loại câu nói khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sự kiện: giá vượt lên trên đỉnh cũ A rồi đóng nến lại bên dưới A. Lỗi phổ biến nhất của người học ICT là đọc câu DIỄN GIẢI như thể nó là QUAN SÁT.</text>
