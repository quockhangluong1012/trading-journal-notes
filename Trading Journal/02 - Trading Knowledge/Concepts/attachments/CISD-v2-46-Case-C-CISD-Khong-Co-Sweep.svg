<text x="655.0" y="131.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc tăng (HH–HL). Đỉnh mới ở #9.</text>
<rect x="646.0" y="149.7" width="326.0" height="67.8" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="655.0" y="169.9" font-size="11.8" font-weight="700" fill="#2563EB" text-anchor="start">T1 · Nhịp hồi (#10–#12)</text>
<text x="655.0" y="190.5" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Chặng xuống ngắn. Đáy #12 cao hơn HL #4: KHÔNG có</text>
<text x="655.0" y="205.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">sweep thanh khoản quan trọng nào.</text>
<rect x="646.0" y="223.5" width="326.0" height="52.7" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="655.0" y="243.7" font-size="11.8" font-weight="700" fill="#6B7280" text-anchor="start">T2 · (#13)</text>
<text x="655.0" y="264.3" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Nến tăng đóng dưới mức → chưa.</text>
<rect x="646.0" y="282.2" width="326.0" height="52.7" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="655.0" y="302.4" font-size="11.8" font-weight="700" fill="#D97706" text-anchor="start">T3 · CISD (#14)</text>
<text x="655.0" y="323.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng trên open #10 → bullish CISD thuận xu hướng.</text>
<rect x="646.0" y="340.9" width="326.0" height="52.7" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="655.0" y="361.1" font-size="11.8" font-weight="700" fill="#059669" text-anchor="start">T4 · (#15)</text>
<text x="655.0" y="381.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đỉnh mới. Delivery quay lại chiều của cấu trúc.</text>
<rect x="646.0" y="399.6" width="326.0" height="82.9" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="655.0" y="419.8" font-size="11.8" font-weight="700" fill="#EA580C" text-anchor="start">Kết luận được gì?</text>
<text x="655.0" y="440.4" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">CISD không cần sweep để tồn tại. Nhưng không có sweep</text>
<text x="655.0" y="455.6" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">thì cũng không có “cực trị bị quét” làm điểm sai rõ ràng;</text>
<text x="655.0" y="470.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">ý nghĩa đến từ cấu trúc tăng.</text>
