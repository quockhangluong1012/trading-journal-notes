<svg viewBox="0 0 980 510" width="980" height="510" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="510" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Displacement và FVG — hình học của một lần giá đi rất nhanh</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Khi lệnh chủ động gặp sổ lệnh mỏng (hoặc một chuỗi stop), giá nhảy nhiều tầng trong ít thời gian → nến dài → có thể để lại khoảng trống 3 nến.</text>
<rect x="26.0" y="74.0" width="450.0" height="420.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="98.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Cơ chế → hình dạng</text>
<rect x="80.0" y="303.2" width="280.0" height="87.4" rx="0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2" opacity="0.8"/>
<line x1="130.0" y1="390.6" x2="130.0" y2="432.4" stroke="#15803D" stroke-width="1.3"/>
<rect x="113.0" y="402.0" width="34.0" height="15.2" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
<line x1="210.0" y1="234.8" x2="210.0" y2="409.6" stroke="#15803D" stroke-width="1.3"/>
<rect x="193.0" y="246.2" width="34.0" height="155.8" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
<line x1="290.0" y1="204.4" x2="290.0" y2="303.2" stroke="#15803D" stroke-width="1.3"/>
<rect x="273.0" y="219.6" width="34.0" height="26.6" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
<text x="130.0" y="454.4" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">nến 1</text>
<text x="210.0" y="429.6" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">nến 2</text>
<text x="290.0" y="194.4" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">nến 3</text>
<text x="366.0" y="350.9" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">FVG</text>
<text x="366.0" y="366.9" font-size="10.5" font-weight="400" fill="#0F766E" text-anchor="start">H nến 1 → L nến 3</text>
<line x1="110.0" y1="390.6" x2="380.0" y2="390.6" stroke="#0F766E" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="110.0" y1="303.2" x2="380.0" y2="303.2" stroke="#0F766E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Nến 2 = displacement: lệnh chủ động ăn</text>
<text x="40.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">nhiều tầng giá rất nhanh. Vùng giữa high</text>
<text x="40.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">nến 1 và low nến 3 chỉ được giao dịch</text>
<text x="40.0" y="181.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">MỘT CHIỀU, trong thời gian ngắn.</text>
<rect x="490.0" y="74.0" width="464.0" height="168.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
<text x="504.0" y="98.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">✗ Cách nói vòng tròn</text>
<text x="504.0" y="115.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">"IPDA tạo FVG để sau đó quay lại rebalance."</text>
<text x="504.0" y="132.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">"FVG tồn tại vì thuật toán cần lấp inefficiency."</text>
<text x="504.0" y="149.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="504.0" y="166.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Vấn đề: dùng mục đích (teleology) để giải thích</text>
<text x="504.0" y="183.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">hình dạng. Không chỉ ra được AI đặt lệnh gì, và</text>
<text x="504.0" y="200.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">không thể bị chứng minh sai.</text>
<rect x="490.0" y="254.0" width="464.0" height="240.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="504.0" y="278.0" font-size="11.6" font-weight="700" fill="#15803D" text-anchor="start">✓ Cách nói cơ chế</text>
<text x="504.0" y="294.8" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">[MARKET MECHANICS] Giá đi nhanh qua một vùng khi</text>
<text x="504.0" y="311.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">dòng lệnh chủ động lớn so với độ sâu sổ lệnh.</text>
<text x="504.0" y="328.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">[MATHEMATICAL] Nến OHLC đi nhanh → 3 nến có thể không</text>
<text x="504.0" y="345.3" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">chồng lên nhau → khoảng trống HÌNH HỌC.</text>
<text x="504.0" y="362.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">[ICT FRAMEWORK] Gọi đó là FVG / imbalance / inefficiency.</text>
<text x="504.0" y="378.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">[HYPOTHESIS] Giá quay lại vùng đó với xác suất cao hơn</text>
<text x="504.0" y="395.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">baseline cùng khoảng cách, và phản ứng tại đó.</text>
<text x="504.0" y="412.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="504.0" y="429.4" font-size="11.6" font-weight="600" fill="#6D28D9" text-anchor="start">Lưu ý: random walk cũng tạo ~30 FVG/100 nến và cũng</text>
<text x="504.0" y="446.2" font-size="11.6" font-weight="600" fill="#6D28D9" text-anchor="start">quay lại rất thường (xem FVG-Sim trong note 13 — FVG).</text>
</svg>
