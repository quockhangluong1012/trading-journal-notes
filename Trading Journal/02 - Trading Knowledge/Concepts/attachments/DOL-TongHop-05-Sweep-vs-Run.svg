<svg viewBox="0 0 760 456" width="760" height="456" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Chạm cụm stop: quét rồi đảo (sweep) hay chạy tiếp (run)</title>
<desc>Hai khung. Khung trái: giá xuyên đỉnh cũ, kích hoạt stop, bị lệnh limit bán lớn hấp thụ và rơi lại vào range. Khung phải: giá xuyên đỉnh cũ, không có bên hấp thụ, thông tin mới khiến giá chạy tiếp lên.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="456" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Chạm cụm stop: quét rồi đảo (sweep) hay chạy tiếp (run)</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Vài nến đầu trông giống hệt nhau. Chỗ khác nhau chỉ lộ ra sau đó: nến đóng cửa ở đâu và có ai hấp thụ</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">dòng lệnh hay không.</text>
<g transform="translate(40,74)">

<line x1="50" y1="130" x2="310" y2="130" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="370" y1="130" x2="630" y2="130" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<g fill="#D85A30">
<circle cx="120" cy="121" r="2.5"/><circle cx="140" cy="118" r="2.5"/><circle cx="160" cy="122" r="2.5"/><circle cx="180" cy="119" r="2.5"/><circle cx="200" cy="122" r="2.5"/><circle cx="270" cy="119" r="2.5"/><circle cx="290" cy="122" r="2.5"/>
<circle cx="440" cy="121" r="2.5"/><circle cx="460" cy="118" r="2.5"/><circle cx="480" cy="122" r="2.5"/><circle cx="500" cy="119" r="2.5"/><circle cx="520" cy="122" r="2.5"/><circle cx="580" cy="121" r="2.5"/><circle cx="600" cy="118" r="2.5"/>
</g>
