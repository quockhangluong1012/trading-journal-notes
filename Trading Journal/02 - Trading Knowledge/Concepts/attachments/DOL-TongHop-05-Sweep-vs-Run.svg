<line stroke="#9CA3AF" stroke-width="1" x1="245" y1="80" x2="241" y2="104"/>
<g><rect fill="#F3F4F6" stroke="#9CA3AF" x="384" y="50" width="160" height="28" rx="4" stroke-width="0.5"/><text font-size="12" fill="#4B5563" x="464" y="68" text-anchor="middle">tin mới, không ai chặn</text></g>
<polyline points="60,270 110,215 150,240 205,165 240,110 262,178 300,245" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<polyline points="380,270 430,215 470,240 525,165 560,110 590,80 626,58" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<text font-size="12" fill="#4B5563" x="54" y="150">đỉnh cũ</text>
<text font-size="12" fill="#4B5563" x="374" y="150">đỉnh cũ</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="180" y="300" text-anchor="middle">Quét rồi đảo (sweep)</text>
<text font-size="12" fill="#4B5563" x="180" y="318" text-anchor="middle">stop cạn, có bên hấp thụ</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="500" y="300" text-anchor="middle">Chạy tiếp (run)</text>
<text font-size="12" fill="#4B5563" x="500" y="318" text-anchor="middle">dòng lệnh có thông tin</text>
<circle cx="56" cy="342" r="2.5" fill="#D85A30"/>
<text font-size="12" fill="#4B5563" x="66" y="346">chấm cam = stop đang ngủ, không hiện trong sổ lệnh</text>

