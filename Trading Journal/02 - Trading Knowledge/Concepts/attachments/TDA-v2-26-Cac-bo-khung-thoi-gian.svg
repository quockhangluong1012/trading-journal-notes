<text x="560.0" y="396.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nhanh, nhiều tín hiệu hơn</text>
<text x="770.0" y="396.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Mất tầng lọc bối cảnh; chỉ</text>
<text x="770.0" y="411.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">sau backtest riêng</text>
