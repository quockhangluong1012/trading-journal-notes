<svg viewBox="0 0 1000 650" width="1000" height="650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="650" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Các bộ khung thời gian — mỗi tầng phải có NHIỆM VỤ riêng, tỷ lệ chỉ là heuristic</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">'Hệ số ~5' giữa các khung (thực hành thường nới 4–6) bắt nguồn từ Triple Screen của Alexander Elder — một quy ước thực hành, không phải định luật.</text>
<text x="26.0" y="73.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Chính bộ mặc định D1 → H1 → M5 có tỷ lệ 24 và 12 — vượt xa 4–6 — và vẫn hợp lý vì mỗi tầng trả lời một câu hỏi khác nhau.</text>
<text x="40.0" y="104.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">BỘ KHUNG</text>
<text x="250.0" y="104.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">TỶ LỆ GIỮA CÁC TẦNG (thang log)</text>
<text x="560.0" y="104.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">DÙNG KHI</text>
