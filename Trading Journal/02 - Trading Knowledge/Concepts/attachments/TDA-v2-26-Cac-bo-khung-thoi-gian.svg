<text x="42.0" y="578.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Quy tắc chọn:</text>
<text x="132.0" y="578.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chọn MỘT bộ khung theo horizon giữ lệnh và thời gian ngồi chart; cố định nó trong suốt một giai đoạn nghiên cứu (≥ vài chục setup)</text>
<text x="132.0" y="598.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">rồi mới so sánh với bộ khác trên CÙNG dữ liệu. Đổi bộ khung theo cảm giác mỗi ngày = không bao giờ có dữ liệu để đánh giá.</text>
