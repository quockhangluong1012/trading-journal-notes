<text x="308.5" y="451.1" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">✓ đã bị lấy</text>
<line x1="103.2" y1="237.2" x2="121.2" y2="207.2" stroke="#B91C1C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="124.2" y="205.2" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start" data-maxw="170.0">External high = biên trên</text>
<line x1="434.9" y1="522.8" x2="404.9" y2="556.8" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="401.9" y="560.8" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="end" data-maxw="170.0">External low = biên dưới</text>
<line x1="308.5" y1="303.8" x2="368.5" y2="273.8" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>
<text x="371.5" y="271.8" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="start" data-maxw="220.0">đỉnh nội bộ → BSL nội bộ (IRL họ 1)</text>
<line x1="245.3" y1="437.1" x2="215.3" y2="467.1" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>
<text x="212.3" y="471.1" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="end" data-maxw="170.0">đáy nội bộ → SSL nội bộ</text>
<text x="545.4" y="355.4" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG giảm (IRL họ 2)</text>
<text x="592.8" y="453.0" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG tăng (IRL họ 2)</text>
<text x="654.0" y="376.0" font-size="9.5" font-weight="700" fill="#64748B" text-anchor="end">EQ</text>
<rect x="684.0" y="130.0" width="288.0" height="119.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="684.0" y="140.0" width="4.0" height="99.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="700.0" y="153.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">ERL — liquidity ngoài biên</text>
<text x="700.0" y="174.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">BSL trên external high; SSL dưới external low.</text>
<text x="700.0" y="190.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">Có thể kéo dài lên các mốc xa hơn (PDH,</text>
<text x="700.0" y="206.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">PWH…) nếu chúng cũng nằm ngoài biên.</text>
<rect x="684.0" y="257.0" width="288.0" height="119.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="684.0" y="267.0" width="4.0" height="99.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="700.0" y="280.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">IRL họ 1 — pool nội bộ</text>
<text x="700.0" y="301.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">Đỉnh/đáy ngắn hạn bên trong range. ICT: “a</text>
<text x="700.0" y="317.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">short-term higher low with stops above or</text>
<text x="700.0" y="333.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">below it”. Có stop, nhưng nhỏ và nhiều nhiễu.</text>
<rect x="684.0" y="384.0" width="288.0" height="119.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="684.0" y="394.0" width="4.0" height="99.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="700.0" y="407.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">IRL họ 2 — imbalance</text>
<text x="700.0" y="428.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">FVG chưa lấp hoặc mới lấp một phần. Không</text>
<text x="700.0" y="444.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">phải cụm stop — là vùng giá từng chạy một</text>
<text x="700.0" y="460.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">chiều. ICT vẫn xếp vào IRL.</text>
<rect x="684.0" y="511.0" width="288.0" height="119.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="684.0" y="521.0" width="4.0" height="99.0" rx="2" fill="#475569" stroke="none" stroke-width="1.2"/>
<text x="700.0" y="534.0" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">Một mức có thể đã “tiêu”</text>
<text x="700.0" y="555.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">Đáy nội bộ ở giữa hình đã bị giá đi qua. Nó vẫn</text>
<text x="700.0" y="571.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">nằm trong range, nhưng không còn là đích —</text>
<text x="700.0" y="587.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="258.0">hãy đánh dấu “đã lấy”.</text>
<rect x="28.0" y="644.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="668.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đọc hình theo câu hỏi: (1) hàng rào ở đâu? (2) cái gì nằm ngoài rào, cái gì trong rào? (3) cái nào đã bị lấy, cái nào còn? Chỉ sau ba câu này mới nói tới “giá có thể</text>
<text x="42.0" y="684.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đi đâu”.</text>
</svg>
