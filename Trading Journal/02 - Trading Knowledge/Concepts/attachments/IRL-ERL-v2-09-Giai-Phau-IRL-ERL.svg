<rect x="889.4" y="22" width="82.6" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="930.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">GIẢI PHẪU</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Giải phẫu một dealing range: ERL ở NGOÀI hai biên, IRL ở BÊN TRONG — với hai “họ”</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">IRL</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bản vẽ sửa lại sơ đồ ASCII của protocol: ERL không phải một đường kẻ lơ lửng — nó là vùng NGAY NGOÀI đỉnh và đáy range, nơi lệnh chờ có thể nằm. IRL gồm</text>
<text x="28.0" y="107.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">cả đỉnh/đáy ngắn hạn bên trong lẫn imbalance (FVG).</text>
<rect x="28.0" y="130.0" width="640.0" height="500.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
