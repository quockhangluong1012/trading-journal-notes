<rect x="103.2" y="522.8" width="552.8" height="85.7" rx="0" fill="#EAF2FF" stroke="none" stroke-width="1.2" opacity="0.9"/>
<text x="109.2" y="165.5" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">VÙNG ERL TRÊN — ngoài biên trên</text>
<text x="109.2" y="602.5" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">VÙNG ERL DƯỚI — ngoài biên dưới</text>
<text x="403.3" y="252.2" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="start">BÊN TRONG RANGE (IRL)</text>
