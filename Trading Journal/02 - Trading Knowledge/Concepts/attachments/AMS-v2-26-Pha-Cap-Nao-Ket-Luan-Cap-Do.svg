<svg viewBox="0 0 1000 470" width="1000" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="468" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Phá STL, phá ITL, phá LTL — mỗi lần đổi gì và CHƯA đổi gì</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Quy tắc nhớ: phá cấp nào thì chỉ được kết luận về cấp đó (trên khung đó).</text>
<rect x="802.4" y="22.0" width="169.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="887.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SCENARIO D · E · F</text>
<text x="190.0" y="104.0" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">Cái ĐÃ đổi</text>
<text x="470.0" y="104.0" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start">Cái CHƯA đổi</text>
<text x="740.0" y="104.0" font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="start">Cái KHÔNG kết luận được</text>
<rect x="28.0" y="116.0" width="944.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="28.0" y="116.0" width="140.0" height="100.0" rx="10" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="0"/>
<text x="98.0" y="172.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Phá STL</text>
<text x="190.0" y="146.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cấp ngắn hạn có đáy thấp hơn.</text>
<text x="190.0" y="165.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Nhịp tăng nhỏ gần nhất hết hiệu lực.</text>
<text x="470.0" y="146.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">ITL còn nguyên.</text>
<text x="470.0" y="165.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">LTL còn nguyên.</text>
<text x="470.0" y="184.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hướng trung hạn chưa đổi.</text>
<text x="740.0" y="146.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không nói được là đảo chiều.</text>
<text x="740.0" y="165.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Rất thường chỉ là nhịp hồi.</text>
<line x1="452.0" y1="128.0" x2="452.0" y2="204.0" stroke="#E5E7EB" stroke-width="1.2"/>
<line x1="722.0" y1="128.0" x2="722.0" y2="204.0" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="28.0" y="228.0" width="944.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="28.0" y="228.0" width="140.0" height="100.0" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="98.0" y="284.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Phá ITL</text>
<text x="190.0" y="258.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cấp trung hạn có đáy thấp hơn.</text>
<text x="190.0" y="277.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Nhịp tăng trung hạn hết hiệu lực.</text>
<text x="190.0" y="296.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vùng trong/ngoài phải vẽ lại.</text>
<text x="470.0" y="258.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">LTL còn nguyên.</text>
<text x="470.0" y="277.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc lớn chưa đổi.</text>
<text x="740.0" y="258.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không nói được khung lớn</text>
<text x="740.0" y="277.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">hơn đã đảo chiều.</text>
<line x1="452.0" y1="240.0" x2="452.0" y2="316.0" stroke="#E5E7EB" stroke-width="1.2"/>
<line x1="722.0" y1="240.0" x2="722.0" y2="316.0" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="28.0" y="340.0" width="944.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
<rect x="28.0" y="340.0" width="140.0" height="100.0" rx="10" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="98.0" y="396.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Phá LTL</text>
<text x="190.0" y="370.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Đáy lớn nhất của khung này vỡ.</text>
<text x="190.0" y="389.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc tăng trên khung này</text>
<text x="190.0" y="408.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">không còn chỗ dựa.</text>
<text x="470.0" y="370.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc của khung LỚN HƠN</text>
<text x="470.0" y="389.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">(nếu LTL này chỉ là đáy nhỏ ở đó).</text>
<text x="740.0" y="370.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không chắc giá sẽ rơi tiếp.</text>
<text x="740.0" y="389.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Có thể là cú quét lớn rồi quay lên.</text>
<line x1="452.0" y1="352.0" x2="452.0" y2="428.0" stroke="#E5E7EB" stroke-width="1.2"/>
<line x1="722.0" y1="352.0" x2="722.0" y2="428.0" stroke="#E5E7EB" stroke-width="1.2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
