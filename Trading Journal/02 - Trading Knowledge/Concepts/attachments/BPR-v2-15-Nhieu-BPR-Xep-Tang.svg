<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Nhiều BPR cùng lúc: đừng chọn cái gần nhất theo phản xạ</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một xu hướng tăng có hai nhịp hồi dữ dội → hai Bullish BPR ở hai tầng giá. Khi giá quay xuống, câu hỏi là: BPR nào gắn với sự kiện quan trọng hơn?</text>
