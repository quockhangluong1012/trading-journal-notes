<text x="557.0" y="137.2" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">giá quay xuống?</text>
<rect x="646.0" y="86.0" width="326.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="658.0" y="110.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">BPR #2 (gần hơn)</text>
<circle cx="661.0" cy="126.8" r="2.2" fill="#7C3AED"/>
<text x="670.0" y="130.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Gần giá hiện tại → giá chạm trước.</text>
<circle cx="661.0" cy="145.3" r="2.2" fill="#7C3AED"/>
<text x="670.0" y="149.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Là nhịp hồi trong nhịp tăng thứ hai.</text>
<circle cx="661.0" cy="163.7" r="2.2" fill="#7C3AED"/>
<text x="670.0" y="167.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nếu bị xuyên, chưa chắc cấu trúc lớn hỏng.</text>
<rect x="646.0" y="236.0" width="326.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="658.0" y="260.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">BPR #1 (xa hơn)</text>
<circle cx="661.0" cy="276.8" r="2.2" fill="#7C3AED"/>
<text x="670.0" y="280.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nằm ở gốc của nhịp phá đỉnh đầu tiên.</text>
<circle cx="661.0" cy="295.3" r="2.2" fill="#7C3AED"/>
<text x="670.0" y="299.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Có thể gắn với swing low bảo vệ cả xu hướng.</text>
<circle cx="661.0" cy="313.7" r="2.2" fill="#7C3AED"/>
<text x="670.0" y="317.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Xa hơn → R:R khác, cần chờ lâu hơn.</text>
<rect x="646.0" y="386.0" width="326.0" height="130.0" rx="10" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="658.0" y="410.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Không chọn theo khoảng cách</text>
<text x="658.0" y="430.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Chọn theo: khung thời gian, swing nào nó gắn vào, có</text>
<text x="658.0" y="446.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">nằm trong POI HTF không, vị trí premium/discount, còn</text>
<text x="658.0" y="461.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">mới hay đã bị chạm. Nếu vẫn mơ hồ → ghi “mơ hồ”,</text>
<text x="658.0" y="477.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">không ép chọn.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Khi hai BPR chồng lên nhau, đừng gộp thành một hộp lớn. Ghi riêng từng cái và xem giá phản ứng với cái nào — đó là dữ liệu cho backtest.</text>
