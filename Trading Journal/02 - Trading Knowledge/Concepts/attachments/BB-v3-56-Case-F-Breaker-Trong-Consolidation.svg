<text x="241.2" y="253.6" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">“Breaker”?</text>
<text x="317.2" y="457.1" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">“Breaker”?</text>
<text x="469.0" y="243.8" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">“Breaker”?</text>
<rect x="642.0" y="92.5" width="330.0" height="519.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Bối cảnh và diễn biến</text>
<text x="656.0" y="142.5" font-size="11.8" font-weight="700" fill="#2563EB">Cấu trúc</text>
<text x="656.0" y="158.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Không có chuỗi đỉnh/đáy cao hơn hay thấp hơn. Mọi</text>
<text x="656.0" y="174.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">swing đều là gợn nhỏ bên trong vùng.</text>
<text x="656.0" y="198.1" font-size="11.8" font-weight="700" fill="#2563EB">Liquidity</text>
<text x="656.0" y="214.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Các túi lệnh nhỏ trên/dưới từng gợn bị lấy liên tục,</text>
<text x="656.0" y="230.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">không túi nào quan trọng.</text>
<text x="656.0" y="253.8" font-size="11.8" font-weight="700" fill="#2563EB">Kết cục</text>
<text x="656.0" y="269.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Mỗi “Breaker” bị xuyên qua sau vài nến. Vai đỡ/chặn</text>
<text x="656.0" y="286.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">đổi liên tục.</text>
<text x="656.0" y="309.4" font-size="11.8" font-weight="700" fill="#2563EB">Thứ đáng nhìn</text>
<text x="656.0" y="325.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Hai mép ngoài của vùng đi ngang — nơi có liquidity</text>
<text x="656.0" y="341.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">lớn hơn.</text>
<rect x="656.0" y="476.4" width="302.0" height="118.4" rx="8" fill="#6B7280" fill-opacity="0.07" stroke="#6B7280" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="476.4" width="4.0" height="118.4" rx="2" fill="#6B7280"/>
<text x="670.0" y="496.3" font-size="11.6" font-weight="700" fill="#6B7280" data-bx="656.0,958.0">Điều thật sự kết luận được</text>
<text x="670.0" y="515.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Trong vùng đi ngang, định nghĩa vẫn “đúng”</text>
<text x="670.0" y="532.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">nhưng vô dụng: swing bị phá không quan trọng,</text>
<text x="670.0" y="548.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">liquidity bị lấy không đáng kể. Việc nên làm là</text>
<text x="670.0" y="565.1" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">chờ giá rời vùng, không phải chọn Breaker đẹp</text>
<text x="670.0" y="581.6" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">nhất bên trong.</text>
