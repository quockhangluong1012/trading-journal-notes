<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="518" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="886.7" y="22" width="85.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="929.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Displacement và FVG là hai thứ khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Displacement = giá di chuyển mạnh, nhanh so với bình thường. FVG = khoảng hở theo quy tắc ba nến. Chúng hay đi cùng nhau nhưng không bắt buộc.</text>
<rect x="28.0" y="86.0" width="304.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Displacement nhưng KHÔNG có FVG</text>
<line x1="112.0" y1="292.3" x2="112.0" y2="352.3" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="102.0" y="302.7" width="20.0" height="39.2" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="157.3" y1="214.0" x2="157.3" y2="313.2" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="147.3" y="224.4" width="20.0" height="78.3" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="202.7" y1="216.6" x2="202.7" y2="310.6" stroke="#E0464B" stroke-width="1.2" opacity="1"/>
<rect x="192.7" y="224.4" width="20.0" height="18.3" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6" opacity="1"/>
<line x1="248.0" y1="135.7" x2="248.0" y2="253.1" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="238.0" y="146.1" width="20.0" height="96.6" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<text x="34.0" y="410.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hai nến tăng dài, nhưng nến ở giữa lùi lại chạm vào</text>
<text x="34.0" y="425.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bóng nến trước → các bóng nến chồng nhau, không</text>
<text x="34.0" y="441.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">có khoảng hở.</text>
<rect x="344.0" y="86.0" width="304.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="356.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">FVG nhưng KHÔNG có displacement</text>
<line x1="418.3" y1="330.9" x2="418.3" y2="345.0" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="408.3" y="334.1" width="20.0" height="7.8" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="457.1" y1="325.7" x2="457.1" y2="337.2" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="447.1" y="328.8" width="20.0" height="5.2" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="496.0" y1="304.8" x2="496.0" y2="332.0" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="486.0" y="308.0" width="20.0" height="20.9" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="534.9" y1="297.0" x2="534.9" y2="311.1" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="524.9" y="300.1" width="20.0" height="7.8" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="573.7" y1="291.8" x2="573.7" y2="303.3" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="563.7" y="294.9" width="20.0" height="5.2" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<rect x="439.7" y="311.1" width="190.4" height="14.6" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="628.1" y="307.1" font-size="10" font-weight="700" fill="#0F9D74" text-anchor="end">FVG</text>
<text x="350.0" y="410.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thị trường rất lặng, nến nhỏ. Một nến nhỉnh hơn một</text>
<text x="350.0" y="425.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chút vẫn đủ tạo khoảng hở tí hon. Đúng định nghĩa,</text>
<text x="350.0" y="441.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nhưng ít thông tin.</text>
<rect x="660.0" y="86.0" width="304.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="672.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Displacement CÓ để lại FVG</text>
<line x1="744.0" y1="318.4" x2="744.0" y2="349.7" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="734.0" y="326.2" width="20.0" height="15.7" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="789.3" y1="214.0" x2="789.3" y2="334.1" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="779.3" y="221.8" width="20.0" height="104.4" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="834.7" y1="193.1" x2="834.7" y2="229.6" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="824.7" y="200.9" width="20.0" height="20.9" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="880.0" y1="177.4" x2="880.0" y2="208.8" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="870.0" y="185.3" width="20.0" height="15.7" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<rect x="723.6" y="229.6" width="222.1" height="88.8" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="943.7" y="225.6" font-size="10" font-weight="700" fill="#0F9D74" text-anchor="end">FVG</text>
<text x="666.0" y="410.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến giữa dài vượt trội VÀ bóng nến 1, nến 3 không</text>
<text x="666.0" y="425.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chạm nhau. Đây là trường hợp FVG mang nhiều thông</text>
<text x="666.0" y="441.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tin nhất.</text>
<text x="28.0" y="484.5" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Hệ quả cho BPR: hai FVG ngược chiều có thể đến từ hai cú displacement rất mạnh, hoặc từ hai nến nhỉnh hơn bình thường trong thị trường lặng. Hình dạng giống nhau, thông</text>
<text x="28.0" y="500.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">tin rất khác.</text>
</svg>
