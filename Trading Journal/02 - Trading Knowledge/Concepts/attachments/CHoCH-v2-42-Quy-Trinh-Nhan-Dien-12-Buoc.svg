<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="758.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Quy trình nhận diện CHoCH trong 12 bước — mỗi bước có lý do</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Ba nhóm: KHAI BÁO (trước khi nhìn cú phá), SỰ KIỆN (cú phá), PHÂN LOẠI (sau cú phá). Thứ tự có chủ ý: khai báo trước để không chọn swing theo</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">kết quả.</text>
<rect x="28.0" y="114.9" width="944.0" height="242.0" rx="12" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4"/>
<text x="46.0" y="138.9" font-size="12" font-weight="700" fill="#2563EB">KHAI BÁO</text>
<rect x="170.0" y="122.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="142.9" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="146.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="212.0" y="147.9" font-size="12.5" font-weight="700" fill="#2563EB">Cấu trúc hiện tại</text>
<text x="420.0" y="147.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Khung nào? Lớp nào? Đang tăng/giảm/không rõ.</text>
<rect x="170.0" y="168.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="188.9" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="192.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="212.0" y="193.9" font-size="12.5" font-weight="700" fill="#2563EB">Hành vi hiện tại</text>
<text x="420.0" y="193.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Chân đẩy và chân hồi trông thế nào? Có suy yếu không?</text>
<rect x="170.0" y="214.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="234.9" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="238.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="212.0" y="239.9" font-size="12.5" font-weight="700" fill="#2563EB">Swing liên quan</text>
<text x="420.0" y="239.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Đỉnh/đáy nào ĐÃ được xác nhận trước thời điểm này?</text>
<rect x="170.0" y="260.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="280.9" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="284.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="212.0" y="285.9" font-size="12.5" font-weight="700" fill="#2563EB">Protected high/low</text>
<text x="420.0" y="285.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Gốc của chân sóng tạo BOS gần nhất.</text>
<rect x="170.0" y="306.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="326.9" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="330.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="212.0" y="331.9" font-size="12.5" font-weight="700" fill="#2563EB">Internal hay external</text>
<text x="420.0" y="331.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Mức đó thuộc lớp nào so với range lớn?</text>
<rect x="28.0" y="366.9" width="944.0" height="242.0" rx="12" fill="#C026D3" fill-opacity="0.05" stroke="#C026D3" stroke-width="1" stroke-opacity="0.4"/>
<text x="46.0" y="390.9" font-size="12" font-weight="700" fill="#C026D3">SỰ KIỆN</text>
<rect x="170.0" y="374.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="394.9" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="398.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="212.0" y="399.9" font-size="12.5" font-weight="700" fill="#C026D3">Bối cảnh thanh khoản</text>
<text x="420.0" y="399.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Có quét đỉnh/đáy nào phía đối diện không?</text>
<rect x="170.0" y="420.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="440.9" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="444.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="212.0" y="445.9" font-size="12.5" font-weight="700" fill="#C026D3">Cú phá</text>
<text x="420.0" y="445.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Thân nến đóng ngoài protected swing? Hay chỉ râu?</text>
<rect x="170.0" y="466.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="486.9" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="490.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="212.0" y="491.9" font-size="12.5" font-weight="700" fill="#C026D3">Displacement</text>
<text x="420.0" y="491.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Chân sóng nhanh, thân to, một chiều?</text>
<rect x="170.0" y="512.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="532.9" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="536.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="212.0" y="537.9" font-size="12.5" font-weight="700" fill="#C026D3">FVG</text>
<text x="420.0" y="537.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Có khoảng trống để lại không? (ghi riêng)</text>
<rect x="170.0" y="558.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="578.9" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="582.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="212.0" y="583.9" font-size="12.5" font-weight="700" fill="#C026D3">Follow-through</text>
<text x="420.0" y="583.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Vài nến sau có đóng ngược trở lại không? (G2)</text>
<rect x="28.0" y="618.9" width="944.0" height="104.0" rx="12" fill="#0E9F6E" fill-opacity="0.05" stroke="#0E9F6E" stroke-width="1" stroke-opacity="0.4"/>
<text x="46.0" y="642.9" font-size="12" font-weight="700" fill="#0E9F6E">PHÂN LOẠI</text>
<rect x="170.0" y="626.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="646.9" r="10.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="650.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text>
<text x="212.0" y="651.9" font-size="12.5" font-weight="700" fill="#0E9F6E">Bối cảnh HTF</text>
<text x="420.0" y="651.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Có ở POI? Thuận hay ngược khung lớn? Tin tức?</text>
<rect x="170.0" y="672.9" width="790.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<circle cx="192.0" cy="692.9" r="10.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="192.0" y="696.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text>
<text x="212.0" y="697.9" font-size="12.5" font-weight="700" fill="#0E9F6E">Kết luận</text>
<text x="420.0" y="697.9" font-size="12" font-weight="400" fill="#111827" data-bx="418.0,958.0">Valid CHoCH · Weak CHoCH · Không phải CHoCH — kèm bậc G và known-at.</text>
<text x="28.0" y="744.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bước 1–5 phải xong TRƯỚC khi nến phá xuất hiện. Nếu bạn chỉ xác định được protected swing sau khi thấy cú phá, đó là dấu hiệu hindsight.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
