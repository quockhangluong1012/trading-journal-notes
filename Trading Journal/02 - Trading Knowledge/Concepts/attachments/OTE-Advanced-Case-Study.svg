<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>
  <g stroke="#1c2333" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <text x="600" y="40" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Case Study: XAUUSD Short — OTE 70.5% + OB + Sweep London</text>
  <text x="600" y="63" text-anchor="middle" fill="#94a3b8" font-size="15">20/07, kill zone London — R:R 5.5, risk 38 USD</text>

  <!-- price scale labels -->
  <text x="1120" y="120" fill="#94a3b8" font-size="13">2,465</text>
  <text x="1120" y="230" fill="#94a3b8" font-size="13">2,451 (62%)</text>
  <text x="1120" y="255" fill="#eab308" font-size="10.4" font-weight="bold">2,447.9 (70.5%)</text>
  <text x="1120" y="280" fill="#94a3b8" font-size="13">2,444.2 (79%)</text>
  <text x="1120" y="430" fill="#94a3b8" font-size="13">2,428</text>

  <!-- sweep candle (orange) -->
  <rect x="140" y="110" width="20" height="20" fill="#f97316"/><line x1="150" y1="100" x2="150" y2="140" stroke="#f97316" stroke-width="2"/>
  <text x="100" y="95" fill="#f97316" font-size="14" font-weight="bold">① Sweep 2,465</text>

  <!-- displacement down candles -->
  <g>
    <rect x="180" y="140" width="18" height="60" fill="#ef4444"/><line x1="189" y1="130" x2="189" y2="210" stroke="#ef4444" stroke-width="2"/>
    <rect x="210" y="200" width="18" height="70" fill="#ef4444"/><line x1="219" y1="190" x2="219" y2="280" stroke="#ef4444" stroke-width="2"/>
    <rect x="240" y="270" width="18" height="80" fill="#ef4444"/><line x1="249" y1="258" x2="249" y2="360" stroke="#ef4444" stroke-width="2"/>
    <rect x="270" y="350" width="18" height="60" fill="#ef4444"/><line x1="279" y1="340" x2="279" y2="418" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="200" y="440" fill="#94a3b8" font-size="13" font-weight="bold">② MSS bearish, impulse tới 2,428</text>

  <!-- OB zone -->
  <rect x="330" y="222" width="740" height="50" fill="#ef4444" opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="218" fill="#ef4444" font-size="14" font-weight="bold">Bearish OB H1 2,446-2,450</text>

  <!-- OTE zone -->
  <rect x="330" y="228" width="740" height="52" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- retrace candles up into OTE -->
  <g>
    <rect x="330" y="360" width="18" height="40" fill="#22c55e"/><line x1="339" y1="350" x2="339" y2="410" stroke="#22c55e" stroke-width="2"/>
    <rect x="360" y="320" width="18" height="45" fill="#22c55e"/><line x1="369" y1="310" x2="369" y2="375" stroke="#22c55e" stroke-width="2"/>
    <rect x="390" y="275" width="18" height="50" fill="#22c55e"/><line x1="399" y1="260" x2="399" y2="335" stroke="#22c55e" stroke-width="2"/>
    <rect x="420" y="248" width="18" height="30" fill="#22c55e"/><line x1="429" y1="238" x2="429" y2="288" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="330" y="300" fill="#22c55e" font-size="13" font-weight="bold">③ Retrace vào OTE (08:20)</text>

  <!-- entry marker -->
  <circle cx="450" cy="250" r="7" fill="#38bdf8"/>
  <text x="465" y="245" fill="#38bdf8" font-size="15" font-weight="bold">④ Entry Short 2,448</text>

  <!-- SL line -->
  <line x1="330" y1="118" x2="1000" y2="118" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1005" y="122" fill="#ef4444" font-size="14" font-weight="bold">SL 2,466</text>

  <!-- TP lines -->
  <line x1="450" y1="470" x2="1000" y2="470" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1005" y="474" fill="#a78bfa" font-size="14" font-weight="bold">TP1 2,435</text>
  <line x1="450" y1="580" x2="1000" y2="580" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1005" y="584" fill="#a78bfa" font-size="14" font-weight="bold">TP2 2,410 (SSL H4)</text>

  <!-- continuation down candles after entry -->
  <g>
    <rect x="470" y="278" width="16" height="50" fill="#ef4444"/><line x1="478" y1="268" x2="478" y2="335" stroke="#ef4444" stroke-width="2"/>
    <rect x="500" y="325" width="16" height="70" fill="#ef4444"/><line x1="508" y1="315" x2="508" y2="405" stroke="#ef4444" stroke-width="2"/>
    <rect x="530" y="393" width="16" height="80" fill="#ef4444"/><line x1="538" y1="380" x2="538" y2="480" stroke="#ef4444" stroke-width="2"/>
    <rect x="560" y="465" width="16" height="60" fill="#ef4444"/><line x1="568" y1="455" x2="568" y2="533" stroke="#ef4444" stroke-width="2"/>
    <rect x="590" y="520" width="16" height="55" fill="#ef4444"/><line x1="598" y1="510" x2="598" y2="583" stroke="#ef4444" stroke-width="2"/>
  </g>

  <rect x="700" y="500" width="440" height="130" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="720" y="528" fill="#e2e8f0" font-size="15" font-weight="bold">Kết quả: TP1 +0.72R (11:40)</text>
  <text x="720" y="550" fill="#e2e8f0" font-size="15" font-weight="bold">TP2 +2.1R (15:10)</text>
  <text x="720" y="574" fill="#94a3b8" font-size="13">Weighted trung bình ~1.4R</text>
  <text x="720" y="596" fill="#94a3b8" font-size="13">Confluence: OTE 70.5% + OB H1</text>
  <text x="720" y="616" fill="#94a3b8" font-size="13">+ sweep London — 3 lớp xác nhận</text>

  <text x="600" y="670" text-anchor="middle" fill="#94a3b8" font-size="14">Confluence tăng xác suất thắng, nhưng R:R vẫn phụ thuộc khoảng cách thật tới draw on liquidity kế tiếp</text>
</svg>