<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="893.9" y="22" width="78.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="932.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SO SÁNH</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">BPR, Equilibrium và Dealing Range là ba thứ khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Dealing range là tấm bản đồ lớn giữa hai swing quan trọng. Equilibrium là đường chia đôi tấm bản đồ. BPR là một ô nhỏ có thể nằm ở bất cứ đâu trên bản đồ.</text>
<rect x="28.0" y="86.0" width="620.0" height="440.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Dealing range D1 (sơ đồ)</text>
<rect x="112.6" y="165.6" width="509.6" height="148.4" rx="0" fill="#FDF2F2"/>
<rect x="112.6" y="314.0" width="509.6" height="148.4" rx="0" fill="#EFF8F4"/>
<text x="616.2" y="181.6" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="end">PREMIUM</text>
<text x="616.2" y="454.4" font-size="11" font-weight="700" fill="#0F7A5A" text-anchor="end">DISCOUNT</text>
<line x1="103.8" y1="165.6" x2="631.0" y2="165.6" stroke="#1F2937" stroke-width="1.3"/>
<text x="103.8" y="160.6" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="start">swing high</text>
<line x1="103.8" y1="462.4" x2="631.0" y2="462.4" stroke="#1F2937" stroke-width="1.3"/>
<text x="103.8" y="475.9" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="start">swing low</text>
<line x1="103.8" y1="314.0" x2="631.0" y2="314.0" stroke="#64748B" stroke-width="1.3" stroke-dasharray="6,4"/>
<text x="103.8" y="309.0" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start">Equilibrium (50%)</text>
<polyline points="93.0,234.1 112.6,462.4 171.4,348.2 200.8,382.5 249.8,268.4 289.0,314.0 347.8,165.6 387.0,225.0 406.6,197.6 426.2,279.8 465.4,256.9 524.2,407.6 543.8,380.2 563.4,425.8 602.6,348.2" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="378.2" y="220.4" width="233.2" height="22.8" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="609.4" y="216.4" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="end">BPR ở premium</text>
<rect x="535.0" y="396.2" width="76.4" height="20.5" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="609.4" y="428.7" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="end">BPR ở discount</text>
<rect x="666.0" y="86.0" width="306.0" height="132.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="678.0" y="111.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Dealing Range</text>
<text x="678.0" y="131.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Khoảng giá giữa hai swing được chọn là quan trọng.</text>
<text x="678.0" y="147.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Trả lời: “Tôi đang ở đâu trên bản đồ lớn?” Phụ thuộc</text>
<text x="678.0" y="163.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">vào việc chọn swing nào.</text>
<rect x="666.0" y="228.0" width="306.0" height="132.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
<text x="678.0" y="253.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">Equilibrium</text>
<text x="678.0" y="273.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Một MỨC giá: điểm giữa của dealing range. Không</text>
<text x="678.0" y="289.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">phải vùng do nến tạo ra. Đổi swing → đổi</text>
<text x="678.0" y="305.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">equilibrium.</text>
<rect x="666.0" y="370.0" width="306.0" height="156.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="678.0" y="395.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">BPR</text>
<text x="678.0" y="415.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Một VÙNG nhỏ do hai FVG ngược chiều tạo ra. Có</text>
<text x="678.0" y="431.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">thể ở premium, ở discount, hay ngay EQ. Không phải</text>
<text x="678.0" y="447.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">một dealing range thu nhỏ, dù chữ V tạo ra BPR đôi</text>
<text x="678.0" y="462.7" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">khi cũng tạo ra swing mới.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Câu hỏi đúng không phải “BPR có phải EQ không” mà là “BPR này nằm ở ĐÂU so với EQ của dealing range đang dùng” — đó là thông tin vị trí, rất có ích.</text>
</svg>
