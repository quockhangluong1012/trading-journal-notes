<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">known_at: một range chỉ tồn tại từ lúc nó có thể được biết</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Low tại bar 100 chỉ là swing khi fractal xác nhận (102), chỉ là protected khi BOS xảy ra (110), và range chỉ ACTIVE khi termination đóng (127).</text>
