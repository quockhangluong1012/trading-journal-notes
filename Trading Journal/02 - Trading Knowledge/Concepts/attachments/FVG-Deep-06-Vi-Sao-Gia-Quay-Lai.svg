<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="660" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao giá hay quay lại FVG? — bảy lời giải thích, xếp theo mức bằng chứng</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Câu 'giá quay lại để rebalance imbalance' là NHÃN của ICT, không phải một cơ chế. Bên dưới là các cơ chế có thể đứng sau nhãn đó.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Chúng không loại trừ nhau. Câu hỏi nghiên cứu: FVG có quay lại NHIỀU HƠN / PHẢN ỨNG KHÁC so với một vùng cùng khoảng cách không phải FVG?</text>
<rect x="30.0" y="108.0" width="920.0" height="68.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<circle cx="56.0" cy="142.0" r="15" fill="#2563EB"/>
<text x="56.0" y="147.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="84.0" y="130.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Hình học + tính hồi quy của random walk</text>
<rect x="854.9" y="116.0" width="85.1" height="20.0" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="897.4" y="130.0" font-size="9.6" font-weight="700" fill="#1D4ED8" text-anchor="middle">MATHEMATICAL</text>
<text x="84.0" y="150.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Vùng nằm ngay sau lưng giá (khoảng cách 0–1 ATR) → chạm là chuyện thường. RW không drift: 83% FVG bị chạm trong 20 nến,</text>
<text x="84.0" y="166.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">97% bị lấp hết trong 2000 nến (FVG-Sim-02). 'Gap nào cũng lấp' đúng cả khi KHÔNG có ai.</text>
<rect x="30.0" y="184.0" width="920.0" height="68.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
<circle cx="56.0" cy="218.0" r="15" fill="#16A34A"/>
<text x="56.0" y="223.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="84.0" y="206.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">Impact tạm thời phai dần (transient impact)</text>
<rect x="831.8" y="192.0" width="108.2" height="20.0" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="885.9" y="206.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="middle">MARKET MECHANICS</text>
<text x="84.0" y="226.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Lệnh chủ động lớn đẩy giá; một phần tác động tự hồi lại sau khi dòng lệnh dừng. Nghiên cứu metaorder: impact vĩnh viễn ≈ 0.5–0.7</text>
<text x="84.0" y="242.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">lần đỉnh (Moro 2009; Bershova &amp; Rakhlin 2013; Farmer et al. 2013 dự đoán ≈ 2/3). → hồi lại ~⅓ cú đẩy, không nhất thiết tới CE.</text>
<rect x="30.0" y="260.0" width="920.0" height="68.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
<circle cx="56.0" cy="294.0" r="15" fill="#16A34A"/>
<text x="56.0" y="299.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="84.0" y="282.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">Phần thưởng cho người cung cấp thanh khoản</text>
<rect x="831.8" y="268.0" width="108.2" height="20.0" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="885.9" y="282.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="middle">MARKET MECHANICS</text>
<text x="84.0" y="302.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Dòng lệnh KHÔNG mang thông tin cần đối tác → giá phải nhượng bộ để có người nhận → sau đó hồi lại (Grossman &amp; Miller 1988;</text>
<text x="84.0" y="318.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Campbell, Grossman &amp; Wang 1993; Nagel 2012). Dự báo: displacement do thanh khoản → bị lấp sâu; do thông tin → giữ giá.</text>
<rect x="30.0" y="336.0" width="920.0" height="68.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
<circle cx="56.0" cy="370.0" r="15" fill="#D97706"/>
<text x="56.0" y="375.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text>
<text x="84.0" y="358.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Short-term reversal / phản ứng thái quá</text>
<rect x="797.3" y="344.0" width="142.7" height="20.0" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<text x="868.6" y="358.0" font-size="9.6" font-weight="700" fill="#B45309" text-anchor="middle">EMPIRICAL (khung khác)</text>
<text x="84.0" y="378.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Lợi suất ngắn hạn có tự tương quan âm ở nhiều thị trường/khung (Lehmann 1990; Jegadeesh 1990), mạnh hơn khi thanh khoản kém.</text>
<text x="84.0" y="394.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Bằng chứng chủ yếu ở cổ phiếu, khung ngày–tuần; chưa có bằng chứng công khai gắn riêng với FVG intraday.</text>
<rect x="30.0" y="412.0" width="920.0" height="68.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
<circle cx="56.0" cy="446.0" r="15" fill="#D97706"/>
<text x="56.0" y="451.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>
<text x="84.0" y="434.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Chốt lời / cân lại tồn kho sau cú chạy</text>
<rect x="843.4" y="420.0" width="96.6" height="20.0" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<text x="891.7" y="434.0" font-size="9.6" font-weight="700" fill="#B45309" text-anchor="middle">INTERPRETATION</text>
<text x="84.0" y="454.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Người vừa mua trong cú đẩy chốt một phần; market maker bị lệch vị thế muốn cân lại. Hợp lý về cơ chế, nhưng KHÔNG quan sát</text>
<text x="84.0" y="470.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">được từ OHLC và không cho biết điểm dừng (CE hay distal).</text>
<rect x="30.0" y="488.0" width="920.0" height="68.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<circle cx="56.0" cy="522.0" r="15" fill="#DC2626"/>
<text x="56.0" y="527.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">F</text>
<text x="84.0" y="510.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Lệnh chờ 'bị bỏ lại' bên trong vùng gap</text>
<rect x="814.6" y="496.0" width="125.4" height="20.0" rx="9" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
<text x="877.3" y="510.0" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="middle">ICT NARRATIVE — yếu</text>
<text x="84.0" y="530.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Lệnh limit nằm SẴN trong vùng đã bị nến 2 khớp khi giá đi qua (FVG-Deep-01). Chỉ lệnh đặt MỚI sau đó mới có thể nằm chờ ở đó.</text>
<text x="84.0" y="546.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">→ 'kho lệnh dang dở' không phải cơ chế mặc định; cần dữ liệu sổ lệnh để chứng minh.</text>
<rect x="30.0" y="564.0" width="920.0" height="68.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
<circle cx="56.0" cy="598.0" r="15" fill="#7C3AED"/>
<text x="56.0" y="603.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">G</text>
<text x="84.0" y="586.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">Tự hiện thực hóa: nhiều người cùng vẽ FVG</text>
<rect x="866.4" y="572.0" width="73.6" height="20.0" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="903.2" y="586.0" font-size="9.6" font-weight="700" fill="#6D28D9" text-anchor="middle">HYPOTHESIS</text>
<text x="84.0" y="606.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Nếu đủ nhiều người đặt lệnh tại FVG/CE, mức đó có thể có phản ứng (bằng chứng 'memory effect' ở mức S/R: Garzarelli 2014).</text>
<text x="84.0" y="622.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Chưa có bằng chứng công khai riêng cho FVG; hiệu ứng (nếu có) có thể thay đổi theo thời gian.</text>
</svg>