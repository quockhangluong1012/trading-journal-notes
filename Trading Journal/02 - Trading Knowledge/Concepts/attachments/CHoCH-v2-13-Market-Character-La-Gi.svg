<text x="214.5" y="183.5" font-size="10" font-weight="700" fill="#0E9F6E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">chân tăng: ít nến,</text>
<text x="214.5" y="196.0" font-size="10" font-weight="700" fill="#0E9F6E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">thân to, đi nhanh</text>
<text x="293.7" y="397.5" font-size="10" font-weight="700" fill="#E5484D" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">chân giảm: nhiều nến</text>
<text x="293.7" y="410.0" font-size="10" font-weight="700" fill="#E5484D" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">nhỏ, chồng lên nhau</text>
<rect x="512.0" y="92.5" width="460.0" height="481.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="525.0,961.0">Bốn đặc điểm (bullish character)</text>
<circle cx="538.0" cy="142.5" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="538.0" y="146.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="556.0" y="146.5" font-size="13" font-weight="700" fill="#2563EB">Ai tạo được cực trị mới?</text>
<text x="556.0" y="164.5" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">Chỉ chân TĂNG vượt được đỉnh cũ. Chân giảm không bao giờ thủng</text>
<text x="556.0" y="181.5" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">được đáy cũ.</text>
<circle cx="538.0" cy="206.5" r="10.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="538.0" y="210.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="556.0" y="210.5" font-size="13" font-weight="700" fill="#0E9F6E">Pullback dừng ở đâu?</text>
<text x="556.0" y="228.5" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">Mỗi lần lùi đều dừng ở mức CAO HƠN lần trước (HL).</text>
<circle cx="538.0" cy="253.6" r="10.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="538.0" y="257.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="556.0" y="257.6" font-size="13" font-weight="700" fill="#0E9F6E">Chân đẩy vs chân hồi</text>
<text x="556.0" y="275.6" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">Chân tăng ít nến, thân to, đi nhanh. Chân giảm nhiều nến nhỏ,</text>
<text x="556.0" y="292.6" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">chồng lên nhau, đi chậm.</text>
<circle cx="538.0" cy="317.7" r="10.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="538.0" y="321.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="556.0" y="321.7" font-size="13" font-weight="700" fill="#B45309">Mức nào được giữ?</text>
<text x="556.0" y="339.7" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">Đáy đã phóng ra cú tăng gần nhất (protected low) chưa bao giờ bị</text>
<text x="556.0" y="356.7" font-size="12" font-weight="400" fill="#111827" data-bx="555.0,953.0">đóng nến xuyên qua.</text>
<rect x="528.0" y="389.7" width="428.0" height="104.6" rx="8" fill="#C026D3" fill-opacity="0.07" stroke="#C026D3" stroke-width="1" stroke-opacity="0.35"/>
<rect x="528.0" y="389.7" width="4.0" height="104.6" rx="2" fill="#C026D3"/>
<text x="542.0" y="409.9" font-size="12" font-weight="700" fill="#C026D3" data-bx="528.0,956.0">Change of Character = ① và ④ bị đảo</text>
<text x="542.0" y="430.0" font-size="12" font-weight="400" fill="#111827" data-bx="528.0,956.0">CHoCH xảy ra khi đặc điểm ① và ④ bị đảo: lần đầu tiên chân</text>
<text x="542.0" y="447.0" font-size="12" font-weight="400" fill="#111827" data-bx="528.0,956.0">NGƯỢC chiều làm được việc mà trước đây chỉ chân thuận chiều làm</text>
<text x="542.0" y="464.1" font-size="12" font-weight="400" fill="#111827" data-bx="528.0,956.0">được — phá mức mà cả cấu trúc dựa vào. Đặc điểm ② và ③</text>
<text x="542.0" y="481.1" font-size="12" font-weight="400" fill="#111827" data-bx="528.0,956.0">thường suy yếu TRƯỚC đó.</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">[OBSERVABLE] cả bốn đặc điểm đều đọc được từ OHLC. Còn “phe mua mạnh/yếu” là [INTERPRETATION] của những quan sát đó.</text>
