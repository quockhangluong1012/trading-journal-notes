<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">“Character” của thị trường gồm những gì? Bốn đặc điểm ta QUAN SÁT được</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trend chỉ là HƯỚNG. Character là CÁCH giá đi theo hướng đó. Ví dụ dưới là một character tăng khỏe.</text>
