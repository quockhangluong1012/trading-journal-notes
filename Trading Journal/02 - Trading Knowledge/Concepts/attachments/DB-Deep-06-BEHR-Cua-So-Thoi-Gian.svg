<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">BEHR — chấm bias so với baseline khoảng cách VÀ thời gian</text>
<text x="26" y="55" font-size="13" fill="#6B7280">Bias có validity window → ba kết cục: UP trước / DN trước / KHÔNG mức nào. Baseline đúng là p_null^T, không phải d_dn/(d_up+d_dn).</text>
<rect x="26" y="76" width="440" height="380" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<line x1="66" y1="146" x2="426" y2="146" stroke="#15803D" stroke-width="1.8"/>
<text x="66" y="138" font-size="11" font-weight="700" fill="#15803D">DOL_up (đăng ký trước) — d_up</text>
<line x1="66" y1="396" x2="426" y2="396" stroke="#B91C1C" stroke-width="1.8"/>
<text x="66" y="414" font-size="11" font-weight="700" fill="#B91C1C">Inv_dn (thesis invalidation) — d_dn</text>
<line x1="426" y1="116" x2="426" y2="426" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="422" y="110" font-size="10.5" fill="#6B7280" text-anchor="end">expiry (23:00 VN)</text>
<circle cx="66" cy="291" r="5" fill="#1F2937"/><text x="62" y="281" font-size="10.5" fill="#1F2937" text-anchor="middle">T0</text>
<polyline points="66,291 96,271 121,286 151,246 176,261 206,216 231,231 256,181 271,146" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round"/>
<circle cx="271" cy="146" r="4" fill="#15803D"/>
<polyline points="66,291 91,306 116,296 146,326 171,316 196,346 216,336 246,371 266,361 291,396" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round"/>
<circle cx="291" cy="396" r="4" fill="#B91C1C"/>
<polyline points="66,291 96,276 126,301 156,286 186,316 216,291 246,311 276,281 306,306 336,286 366,311 396,296 426,309" fill="none" stroke="#6B7280" stroke-width="2" stroke-linejoin="round"/>
<circle cx="426" cy="309" r="4" fill="#6B7280"/>
<text x="278" y="168" font-size="10.5" font-weight="700" fill="#15803D">UP trước → y = 1</text>
<text x="298" y="384" font-size="10.5" font-weight="700" fill="#B91C1C">DN trước → y = 0</text>
<text x="420" y="331" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="end">NONE (hết hạn) → y = 0</text>
<text x="42" y="442" font-size="10.5" fill="#6B7280">Ba đường đi minh họa (không phải dữ liệu).</text>
<rect x="486" y="76" width="468" height="380" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="502" y="102" font-size="13" font-weight="700" fill="#1F2937">BEHR = y − p_null^T</text>
<text x="502" y="122" font-size="11" fill="#374151">p_null^T = P_null(DOL_up chạm trước Inv_dn VÀ trước expiry | d_up, d_dn, σ_window)</text>
<text x="502" y="140" font-size="11" fill="#374151">E[BEHR] = 0 dưới null cùng volatility — bất kể DOL gần hay xa.</text>
<rect x="496" y="156" width="448" height="24" fill="#F3F4F6"/>
<text x="502" y="172" font-size="11" font-weight="700" fill="#1F2937">d_up / d_dn</text>
<text x="606" y="172" font-size="11" font-weight="700" fill="#1F2937">p∞</text>
<text x="686" y="172" font-size="11" font-weight="700" fill="#1F2937">P(UP)^T</text>
<text x="776" y="172" font-size="11" font-weight="700" fill="#1F2937">P(DN)^T</text>
<text x="866" y="172" font-size="11" font-weight="700" fill="#1F2937">P(NONE)^T</text>
<text x="502" y="200" font-size="11" font-weight="400" fill="#374151">20 / 60</text>
<text x="606" y="200" font-size="11" font-weight="400" fill="#374151">0.75</text>
<text x="686" y="200" font-size="11" font-weight="700" fill="#15803D">0.59</text>
<text x="776" y="200" font-size="11" font-weight="400" fill="#374151">0.10</text>
<text x="866" y="200" font-size="11" font-weight="400" fill="#374151">0.30</text>
<text x="502" y="228" font-size="11" font-weight="400" fill="#374151">60 / 20</text>
<text x="606" y="228" font-size="11" font-weight="400" fill="#374151">0.25</text>
<text x="686" y="228" font-size="11" font-weight="700" fill="#15803D">0.11</text>
<text x="776" y="228" font-size="11" font-weight="400" fill="#374151">0.59</text>
<text x="866" y="228" font-size="11" font-weight="400" fill="#374151">0.30</text>
<text x="502" y="256" font-size="11" font-weight="400" fill="#374151">35 / 35</text>
<text x="606" y="256" font-size="11" font-weight="400" fill="#374151">0.50</text>
<text x="686" y="256" font-size="11" font-weight="700" fill="#15803D">0.35</text>
<text x="776" y="256" font-size="11" font-weight="400" fill="#374151">0.35</text>
<text x="866" y="256" font-size="11" font-weight="400" fill="#374151">0.30</text>
<text x="502" y="284" font-size="11" font-weight="400" fill="#374151">56 / 74 (Case A)</text>
<text x="606" y="284" font-size="11" font-weight="400" fill="#374151">0.57</text>
<text x="686" y="284" font-size="11" font-weight="700" fill="#15803D">0.14</text>
<text x="776" y="284" font-size="11" font-weight="400" fill="#374151">0.05</text>
<text x="866" y="284" font-size="11" font-weight="400" fill="#374151">0.80</text>
<text x="502" y="312" font-size="11" font-weight="400" fill="#374151">70 / 85 (§4.8)</text>
<text x="606" y="312" font-size="11" font-weight="400" fill="#374151">0.55</text>
<text x="686" y="312" font-size="11" font-weight="700" fill="#15803D">0.07</text>
<text x="776" y="312" font-size="11" font-weight="400" fill="#374151">0.03</text>
<text x="866" y="312" font-size="11" font-weight="400" fill="#374151">0.91</text>
<text x="502" y="338" font-size="10" fill="#6B7280">[SIMULATION] ADR 70 pips, cửa sổ 00:00–12:00 NY, hồ sơ volatility phiên,</text>
<text x="502" y="352" font-size="10" fill="#6B7280">bước 1 phút, 60,000 đường đi mỗi dòng.</text>
<rect x="502" y="368" width="436" height="64" rx="7" fill="#FFFBEB" stroke="#F59E0B"/>
<text x="514" y="390" font-size="11" font-weight="700" fill="#92400E">Dùng p∞ khi có cửa sổ → BEHR âm có hệ thống,</text>
<text x="514" y="407" font-size="11" font-weight="700" fill="#92400E">âm hơn với mức xa → tái tạo proximity confound.</text>
<text x="514" y="424" font-size="10.5" fill="#92400E">Bỏ ngày NONE cũng không sửa được: 20/60 → 0.85, không phải 0.75.</text>
<rect x="26" y="472" width="928" height="72" rx="8" fill="#F3F4F6"/>
<text x="44" y="496" font-size="11.5" font-weight="700" fill="#1F2937">Cách tính p_null^T trong thực hành</text>
<text x="44" y="515" font-size="11" fill="#374151">1) Empirical null: lấy mẫu lại đường đi intraday của chính instrument (ngày khác, cùng giờ), chuẩn hóa theo ATR — giữ heavy tails &amp; mẫu hình phiên.</text>
<text x="44" y="533" font-size="11" fill="#374151">2) Monte Carlo Brown với σ_window = ATR(20) × hồ sơ phiên.   3) Báo cáo độ nhạy σ ± 20%.   Thay thế: Brier 3 lớp (UP / DN / NONE).</text>
</svg>