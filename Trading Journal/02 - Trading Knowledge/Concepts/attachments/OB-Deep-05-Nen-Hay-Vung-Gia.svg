<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Order Block: một cây nến hay một vùng giá? — giải phẫu các mức và cái giá của từng lựa chọn</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">OB là một VÙNG được SUY RA từ một (chuỗi) nến. Mỗi cách cắt vùng là một quy tắc khác nhau, cho tỷ lệ khớp và khoảng stop khác nhau.</text>
<rect x="26.0" y="80.0" width="430.0" height="500.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="100.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Bullish OB (nến giảm) — các mức</text>
<line x1="170.0" y1="153.2" x2="170.0" y2="429.8" stroke="#DC2626" stroke-width="2.4"/>
<rect x="144.0" y="190.9" width="52.0" height="188.7" rx="2" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.4"/>
<line x1="120.0" y1="153.2" x2="440.0" y2="153.2" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="210.0" y="148.2" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="start">High = proximal (vùng full)</text>
<line x1="120.0" y1="190.9" x2="440.0" y2="190.9" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="210.0" y="185.9" font-size="10.2" font-weight="700" fill="#6D28D9" text-anchor="start">Open = đỉnh thân = proximal (vùng body)</text>
<line x1="120.0" y1="285.2" x2="440.0" y2="285.2" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="210.0" y="280.2" font-size="10.2" font-weight="700" fill="#6D28D9" text-anchor="start">MT body = 50% thân</text>
<line x1="120.0" y1="379.5" x2="440.0" y2="379.5" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="210.0" y="374.5" font-size="10.2" font-weight="700" fill="#6D28D9" text-anchor="start">Close = đáy thân</text>
<line x1="120.0" y1="429.8" x2="440.0" y2="429.8" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="210.0" y="424.8" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="start">Low = distal (vùng full)</text>
<line x1="120.0" y1="291.5" x2="440.0" y2="291.5" stroke="#D97706" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="210.0" y="306.5" font-size="10.2" font-weight="700" fill="#B45309" text-anchor="start">CE range = 50% cả nến (khác MT body!)</text>
<text x="112.0" y="157.2" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="end">full</text>
<text x="112.0" y="433.8" font-size="9.5" font-weight="400" fill="#374151" text-anchor="start"></text>
<line x1="106.0" y1="153.2" x2="106.0" y2="429.8" stroke="#2563EB" stroke-width="2"/>
<line x1="94.0" y1="190.9" x2="94.0" y2="379.5" stroke="#7C3AED" stroke-width="2"/>
<text x="90.0" y="291.5" font-size="9.5" font-weight="600" fill="#6D28D9" text-anchor="end">body</text>
<rect x="40.0" y="470.0" width="402.0" height="96.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="52.0" y="490.0" font-size="11.2" font-weight="700" fill="#B45309" text-anchor="start">Vì sao quan trọng</text>
<text x="52.0" y="506.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Note 25 v1 viết 'CE/MT = 50% cả cây nến'. Nhiều nguồn ICT thứ cấp đo MT</text>
<text x="52.0" y="521.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">trên THÂN. Hai mức khác nhau → backtest trộn hai biến (55 Phụ lục A #1).</text>
<text x="52.0" y="536.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">v2: luôn ghi mt_body và ce_range riêng; khai báo dùng cái nào.</text>
<rect x="470.0" y="80.0" width="484.0" height="500.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="482.0" y="100.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Cái giá của từng mức entry (OB-Sim-06, random walk)</text>
<text x="484.0" y="120.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">mức entry</text>
<text x="640.0" y="120.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">tỷ lệ khớp</text>
<text x="730.0" y="120.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">khoảng stop*</text>
<text x="820.0" y="120.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">win (2R)</text>
<text x="900.0" y="120.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">E[R]</text>
<rect x="478.0" y="129.0" width="468.0" height="24.0" rx="4" fill="#F9FAFB"/>
<text x="484.0" y="146.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">proximal (râu)</text>
<text x="640.0" y="146.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">80%</text>
<text x="730.0" y="146.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">1.27 ATR</text>
<text x="820.0" y="146.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">31%</text>
<text x="900.0" y="146.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<rect x="478.0" y="157.0" width="468.0" height="24.0" rx="4" fill="#FFFFFF"/>
<text x="484.0" y="174.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">open = mép thân</text>
<text x="640.0" y="174.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">76%</text>
<text x="730.0" y="174.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">1.06 ATR</text>
<text x="820.0" y="174.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">30%</text>
<text x="900.0" y="174.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<rect x="478.0" y="185.0" width="468.0" height="24.0" rx="4" fill="#F9FAFB"/>
<text x="484.0" y="202.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">MT thân</text>
<text x="640.0" y="202.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">70%</text>
<text x="730.0" y="202.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">0.71 ATR</text>
<text x="820.0" y="202.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">29%</text>
<text x="900.0" y="202.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<rect x="478.0" y="213.0" width="468.0" height="24.0" rx="4" fill="#FFFFFF"/>
<text x="484.0" y="230.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">CE range</text>
<text x="640.0" y="230.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">70%</text>
<text x="730.0" y="230.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">0.68 ATR</text>
<text x="820.0" y="230.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">29%</text>
<text x="900.0" y="230.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<rect x="478.0" y="241.0" width="468.0" height="24.0" rx="4" fill="#F9FAFB"/>
<text x="484.0" y="258.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">75% độ sâu</text>
<text x="640.0" y="258.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">65%</text>
<text x="730.0" y="258.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">0.39 ATR</text>
<text x="820.0" y="258.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">27%</text>
<text x="900.0" y="258.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<text x="484.0" y="300.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start">* trung vị, stop = distal + 0.1 ATR. E[R] ≈ 0 ở MỌI mức: trên dữ liệu không có edge,</text>
<text x="484.0" y="314.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="start">  đổi mức entry chỉ đổi phân phối kết quả, không tạo edge.</text>
<text x="484.0" y="350.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Nến OB rộng vs hẹp</text>
<rect x="540.0" y="369.0" width="40.0" height="142.5" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="560.0" y="528.6" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">OB rộng (2.3 ATR)</text>
<rect x="770.0" y="369.0" width="40.0" height="41.8" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="790.0" y="528.6" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">OB hẹp (0.6 ATR)</text>
<text x="610.0" y="392.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">rộng: dễ khớp, stop xa,</text>
<text x="610.0" y="406.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">R:R xấu, 'luôn đúng'</text>
<text x="610.0" y="420.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">→ gần như không thể sai</text>
<text x="838.0" y="392.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">hẹp: hay hụt khớp,</text>
<text x="838.0" y="406.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">stop gần, dễ bị</text>
<text x="838.0" y="420.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">quét bởi nhiễu</text>
<text x="484.0" y="556.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">Chuẩn hoá: ghi ob_width_atr = độ rộng / ATR. Không có độ rộng 'đúng' — chỉ có đánh đổi.</text>
</svg>