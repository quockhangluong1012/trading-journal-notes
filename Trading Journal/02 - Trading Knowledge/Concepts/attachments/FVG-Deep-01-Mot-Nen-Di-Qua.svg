<text x="40.0" y="574.0" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="start">[MATHEMATICAL] Trong thị trường giao dịch liên tục (open nến sau = close nến trước):</text>
<text x="40.0" y="594.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Open₂ = Close₁ ≤ High₁  và  Close₂ = Open₃ ≥ Low₃   ⇒   nến 2 đã đi qua TOÀN BỘ vùng [High₁, Low₃].</text>
<text x="40.0" y="614.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Ngoại lệ duy nhất: có session/opening gap giữa các nến (futures mở phiên, cổ phiếu, cuối tuần FX) — khi đó một phần vùng có thể thật sự không có giao dịch.</text>
