<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Bullish FVG: High nến 1 = 100, Low nến 3 = 102. Vùng 100 → 102 KHÔNG trống: nến 2 đã đi xuyên qua nó.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cái 'gap' là: hai nến kề bên không chạm vào vùng này → thời gian giá ở lại đây rất ngắn.</text>
