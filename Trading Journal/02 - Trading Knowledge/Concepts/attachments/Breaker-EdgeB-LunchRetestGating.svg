<text x="640" y="475" font-size="12" fill="#26a69a">Retest #2: cùng vùng giá, PM macro window —</text>
<text x="640" y="492" font-size="12" fill="#26a69a">respect sạch, reject mạnh, đi tiếp lên BSL</text>

<line x1="60" y1="560" x2="1220" y2="560" stroke="#2a2e39"/>
<text x="60" y="588" font-size="14" fill="#f2c94c">Rule: gate mọi retest breaker theo cửa sổ thời gian — bỏ qua phản ứng xảy ra trong 12:00-13:30 NY.</text>
<text x="60" y="612" font-size="14" fill="#d1d4dc">Vùng chưa "chết"; chỉ cần đợi macro window kế tiếp retest lại với thanh khoản thật thay vì kết luận breaker fail.</text>
<text x="60" y="636" font-size="13" fill="#787b86">Backtest 40 mẫu breaker H1 bị "xuyên" trong 12:00-13:30 NY: 68% retest lại thành công trong PM macro cùng ngày.</text>
