<text x="654.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="667.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">'Bối cảnh đẹp thế này chắc chắn lên' → vào</text>
<text x="667.0" y="493.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">không trigger</text>
<text x="654.0" y="512.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="667.0" y="512.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hạ chuẩn displacement 'cho đủ' khi gần hết</text>
<text x="667.0" y="527.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">giờ</text>
<text x="654.0" y="546.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="667.0" y="546.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không log ngày No Trade → thống kê chỉ còn</text>
<text x="667.0" y="561.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">ngày có lệnh (selection bias)</text>
