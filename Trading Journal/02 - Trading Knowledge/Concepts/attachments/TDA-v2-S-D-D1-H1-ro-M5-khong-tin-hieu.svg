<text x="53.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không vào lệnh: điều kiện được định nghĩa trước đã không xảy ra</text>
<text x="40.0" y="497.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="497.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Zone vẫn còn hiệu lực cho phiên sau nếu không bị acceptance; D1 bias không đổi</text>
<text x="40.0" y="516.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="516.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Ghi ngày này vào log: nó cho biết bối cảnh tốt dẫn tới trigger bao nhiêu % thời</text>
<text x="53.0" y="531.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">gian</text>
