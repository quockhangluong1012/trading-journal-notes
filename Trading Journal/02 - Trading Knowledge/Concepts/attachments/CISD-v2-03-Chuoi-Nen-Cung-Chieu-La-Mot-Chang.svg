<rect x="670.0" y="108.0" width="302.0" height="95.6" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="682.0" y="132.3" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Delivery là gì (nói đơn giản)?</text>
<text x="682.0" y="154.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Là đoạn giá đang được “chở” đều đặn về một</text>
<text x="682.0" y="171.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">phía: hết nến này tới nến kia đều đóng cửa theo</text>
<text x="682.0" y="188.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">cùng một hướng.</text>
<rect x="670.0" y="213.6" width="302.0" height="118.4" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="682.0" y="237.9" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao gọi là một chặng?</text>
<circle cx="686.0" cy="256.2" r="2.6" fill="#6B7280" stroke="none" stroke-width="1.2"/>
<text x="696.0" y="260.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Các thân nến nối tiếp nhau, không bị nến</text>
<text x="696.0" y="276.9" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ngược chiều cắt ngang.</text>
<circle cx="686.0" cy="292.8" r="2.6" fill="#6B7280" stroke="none" stroke-width="1.2"/>
<text x="696.0" y="296.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chặng kết thúc khi xuất hiện nến đóng cửa</text>
<text x="696.0" y="313.5" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">theo chiều ngược lại.</text>
<rect x="670.0" y="341.9" width="302.0" height="95.6" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="682.0" y="366.3" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">Điều quan trọng cho CISD</text>
<text x="682.0" y="388.5" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Open của nến đầu chặng là chỗ chặng bắt đầu.</text>
<text x="682.0" y="405.3" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nếu sau này giá ĐÓNG CỬA vượt qua lại chỗ đó,</text>
<text x="682.0" y="422.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nghĩa là toàn bộ chặng đã bị lấy lại.</text>
