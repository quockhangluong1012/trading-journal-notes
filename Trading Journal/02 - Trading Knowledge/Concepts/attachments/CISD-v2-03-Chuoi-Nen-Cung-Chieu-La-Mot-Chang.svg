<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Chuỗi nến cùng chiều = một chặng “giao hàng” (delivery leg)</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi nến mở cửa gần chỗ nến trước đóng cửa, nên các thân nến nối vào nhau như những bậc thang. Cả chuỗi bắt đầu từ open của nến</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">ĐẦU TIÊN — đó là “vạch xuất phát” của chặng.</text>
<rect x="888.1" y="22" width="83.9" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="930.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DELIVERY</text>
<text x="28.0" y="548.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<rect x="28.0" y="108.0" width="620.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="130.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Chặng lên #3–#5, chặng xuống #6–#9</text>
