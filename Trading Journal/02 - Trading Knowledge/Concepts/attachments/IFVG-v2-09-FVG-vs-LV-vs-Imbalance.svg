<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba khái niệm hay bị dùng lẫn. Hai cái đầu là HÌNH HỌC trên nến (nhìn thấy được). Cái thứ ba là TRẠNG THÁI lệnh chờ mà nến không</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">ghi lại.</text>
