<text x="832.0" y="336.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">chờ BÁN</text>
<text x="42.0" y="372.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Thấy trên OHLC?</text>
<text x="42.0" y="390.0" font-size="12" font-weight="600" fill="#15803D" text-anchor="start">CÓ</text>
<text x="42.0" y="416.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Là gì?</text>
<text x="42.0" y="434.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Khoảng giữa bóng nến 1 và bóng nến 3 mà chỉ</text>
<text x="42.0" y="450.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nến 2 đi qua.</text>
<text x="42.0" y="476.6" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Quan hệ với FVG</text>
<text x="42.0" y="494.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">—</text>
<text x="364.0" y="372.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Thấy trên OHLC?</text>
<text x="364.0" y="390.0" font-size="12" font-weight="600" fill="#15803D" text-anchor="start">CÓ</text>
<text x="364.0" y="416.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Là gì?</text>
<text x="364.0" y="434.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Một đoạn dài giá chạy một chiều, các nến gần</text>
<text x="364.0" y="450.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">như không chồng nhau. Thường chứa nhiều FVG.</text>
<text x="364.0" y="476.6" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Quan hệ với FVG</text>
<text x="364.0" y="494.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">LV là 'cả con đường'; FVG là 'từng viên gạch</text>
<text x="364.0" y="511.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thiếu' bên trong.</text>
<text x="686.0" y="372.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Thấy trên OHLC?</text>
<text x="686.0" y="390.0" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="start">KHÔNG (cần dữ liệu sổ lệnh)</text>
<text x="686.0" y="416.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Là gì?</text>
<text x="686.0" y="434.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh chờ mua và chờ bán chênh lệch nhau tại</text>
<text x="686.0" y="450.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">một thời điểm.</text>
<text x="686.0" y="476.6" font-size="11" font-weight="800" fill="#6B7280" text-anchor="start">Quan hệ với FVG</text>
<text x="686.0" y="494.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Có thể là MỘT nguyên nhân khiến FVG xuất</text>
<text x="686.0" y="511.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hiện, nhưng không phải là FVG.</text>
