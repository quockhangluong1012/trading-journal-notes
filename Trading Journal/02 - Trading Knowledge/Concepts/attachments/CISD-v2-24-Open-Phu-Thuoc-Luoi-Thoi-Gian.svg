<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Open phụ thuộc vào lưới thời gian của chart</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một đường giá, nếu chuông reo ở thời điểm khác (khung khác, múi giờ server khác, giờ mở phiên khác) thì các cây nến khác</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nhau → open khác nhau → mức CISD khác nhau. Mức CISD là sản phẩm của cách ta cắt thời gian.</text>
