<text x="40.0" y="634.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cùng một đường giá: lưới B đã có CISD ở nến cuối (đóng trên mức B), lưới A thì CHƯA (mức A cao hơn). Hệ quả thực tế: CISD trên D1/H4 có thể khác nhau giữa các</text>
<text x="40.0" y="651.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">broker (giờ server) và cài đặt múi giờ. Hãy cố định MỘT cách hiển thị (vd. giờ New York) và dùng nhất quán.</text>
