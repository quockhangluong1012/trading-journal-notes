<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Ví dụ đúng — EURUSD, London (Short) — ảnh gương</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Bias D1 bearish (premium) → London quét đỉnh phiên Á (BSL/equal highs) → nến đỏ đóng dưới CISD level + FVG → SSL</text>
  <rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <line x1="140" y1="330" x2="700" y2="330" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="470" y="344" font-size="10.5" font-weight="700" fill="#0284C7">CISD level (open chuỗi xanh)</text>
  <line x1="60" y1="96" x2="320" y2="96" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="66" y="90" font-size="10" fill="#B45309">BSL — đỉnh phiên Á (equal highs)</text>
  <line x1="60" y1="392" x2="700" y2="392" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="600" y="386" font-size="10" font-weight="700" fill="#B91C1C">SSL = target (draw)</text>

  <rect x="140" y="272" width="2" height="66" fill="#16A34A"/><rect x="132" y="280" width="16" height="58" fill="#16A34A" rx="1"/>
  <rect x="176" y="214" width="2" height="70" fill="#16A34A"/><rect x="168" y="220" width="16" height="58" fill="#16A34A" rx="1"/>
  <rect x="212" y="140" width="2" height="86" fill="#16A34A"/><rect x="204" y="150" width="16" height="70" fill="#16A34A" rx="1"/>
  <rect x="248" y="90" width="2" height="80" fill="#16A34A"/><rect x="240" y="100" width="16" height="60" fill="#16A34A" rx="1"/>
  <circle cx="249" cy="92" r="7" fill="none" stroke="#B45309" stroke-width="2.4"/>
  <text x="150" y="80" font-size="10.5" font-weight="700" fill="#B45309">① Sweep BSL + rejection</text>

  <rect x="296" y="80" width="2" height="290" fill="#DC2626"/><rect x="288" y="95" width="16" height="255" fill="#DC2626" rx="1"/>
  <text x="312" y="374" font-size="10.5" font-weight="700" fill="#B91C1C">② Nến đỏ đóng dưới CISD level (displacement)</text>
  <rect x="326" y="274" width="66" height="56" fill="#3B82F6" opacity="0.2"/>
  <text x="396" y="306" font-size="10" font-weight="700" fill="#1D4ED8">③ FVG = vùng entry</text>
  <path d="M308,330 L340,304 L362,282" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="362" cy="284" r="6" fill="#DC2626"/>
  <text x="372" y="270" font-size="10" font-weight="700" fill="#B91C1C">④ Entry short ở retrace</text>
  <path d="M362,284 L440,330 L540,362 L640,380" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <text x="360" y="450" font-size="10.5" fill="#6B7280">Đối xứng hoàn toàn với ví dụ long → CISD fractal &amp; đối xứng hai chiều. Target là SSL (draw thật).</text>
</svg>
