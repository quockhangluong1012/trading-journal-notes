<text x="520.0" y="392.0" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="start">Ta BIẾT: kiểu đi cũ (cao hơn → lùi ít) vừa gãy.  Ta KHÔNG BIẾT: người đó sẽ đi đâu.</text>
