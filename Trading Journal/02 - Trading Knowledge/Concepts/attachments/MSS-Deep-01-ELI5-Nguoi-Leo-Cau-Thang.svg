<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">MSS cho đứa trẻ 5 tuổi — người leo cầu thang</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Trực giác trước, thuật ngữ sau. Ẩn dụ giúp hiểu CẤU TRÚC; nó không phải bằng chứng về cơ chế thị trường.</text>
