<rect x="30.0" y="532.0" width="920.0" height="92.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="46.0" y="554.0" font-size="10.6" font-weight="700" fill="#334155" text-anchor="start">Giới hạn của ẩn dụ (đọc kỹ):</text>
<text x="46.0" y="571.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">• Người leo có ý định; giá KHÔNG có ý định. Trên chart chỉ có dấu vết của các lệnh đã khớp — không có 'người' nào để đọc ý.</text>
<text x="46.0" y="588.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">• 'Bậc quan trọng' là do CÁCH TA ĐẾM (thuật toán chọn swing) quyết định — đổi cách đếm, bậc quan trọng đổi theo (xem MSS-Sim-06).</text>
<text x="46.0" y="605.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">• Cầu thang thật không tự sập; giá thì phá 'bậc quan trọng' rất thường xuyên ngay cả khi hoàn toàn ngẫu nhiên (MSS-Sim-01).</text>
</svg>