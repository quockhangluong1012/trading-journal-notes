<svg viewBox="0 0 980 540" width="980" height="540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">"Liquidity" có ít nhất BA nghĩa — đừng trộn chúng</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Nghĩa 1 là khái niệm kinh tế học thị trường (đo được ở sàn có dữ liệu). Nghĩa 2–3 là cách ICT dùng từ (suy luận từ hình dạng chart).</text>
<rect x="26.0" y="74.0" width="296.0" height="372.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<rect x="26.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<rect x="27.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#DBEAFE" stroke="#DBEAFE" stroke-width="0"/>
<text x="38.0" y="97.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">1. Thanh khoản (nghĩa thị trường)</text>
<text x="38.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Tầng 1: Chợ có rất nhiều người bán táo</text>
<text x="38.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">→ mua 100 quả dễ, giá không đổi mấy.</text>
<text x="38.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="38.0" y="181.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Định nghĩa:</text>
<text x="38.0" y="198.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Khả năng giao dịch khối lượng LỚN,</text>
<text x="38.0" y="215.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">NHANH, CHI PHÍ THẤP mà giá không bị</text>
<text x="38.0" y="232.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">đẩy đi nhiều.</text>
<text x="38.0" y="249.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="38.0" y="266.9" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Đo bằng:</text>
<text x="38.0" y="284.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">spread · độ sâu sổ lệnh · price impact</text>
<text x="38.0" y="301.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">· thời gian hồi phục sau lệnh lớn.</text>
<text x="38.0" y="318.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="38.0" y="335.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Ví dụ:</text>
<text x="38.0" y="352.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">EURUSD giờ London thanh khoản cao</text>
<text x="38.0" y="369.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">hơn EURUSD lúc 4h sáng thứ Hai.</text>
<rect x="38.0" y="420.5" width="129.2" height="18.5" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
<text x="44.0" y="435.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">[MARKET MECHANICS]</text>
<rect x="342.0" y="74.0" width="296.0" height="372.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="342.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="343.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#FEF3C7" stroke="#FEF3C7" stroke-width="0"/>
<text x="354.0" y="97.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">2. Liquidity pool (nghĩa ICT)</text>
<text x="354.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Tầng 1: "Chỗ mà rất nhiều người hẹn</text>
<text x="354.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">nhau" — ai cũng đặt lệnh ở đó.</text>
<text x="354.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="354.0" y="181.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Định nghĩa:</text>
<text x="354.0" y="198.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Vùng giá nơi NGHI LÀ có nhiều lệnh chờ</text>
<text x="354.0" y="215.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">tập trung: trên swing high (BSL),</text>
<text x="354.0" y="232.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">dưới swing low (SSL), equal highs/lows.</text>
<text x="354.0" y="249.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="354.0" y="266.9" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Cơ sở:</text>
<text x="354.0" y="284.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Osler: stop/take-profit gom quanh số</text>
<text x="354.0" y="301.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">tròn. Hợp lý khi suy rộng ra swing rõ.</text>
<text x="354.0" y="318.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="354.0" y="335.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Giới hạn:</text>
<text x="354.0" y="352.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Retail chart KHÔNG cho thấy lệnh</text>
<text x="354.0" y="369.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">chờ. Đây là suy luận, không phải đo.</text>
<rect x="354.0" y="420.5" width="109.7" height="18.5" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="360.0" y="435.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">[ICT FRAMEWORK]</text>
<rect x="658.0" y="74.0" width="296.0" height="372.0" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
<rect x="658.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<rect x="659.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#CCFBF1" stroke="#CCFBF1" stroke-width="0"/>
<text x="670.0" y="97.0" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">3. "Lấy liquidity" (sự kiện ICT)</text>
<text x="670.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Tầng 1: Ai đó đến đúng "chỗ hẹn" và</text>
<text x="670.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">giao dịch với những người đang chờ.</text>
<text x="670.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="670.0" y="181.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Quan sát được:</text>
<text x="670.0" y="198.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá đã giao dịch VƯỢT qua mức đỉnh/</text>
<text x="670.0" y="215.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">đáy đó (một wick, một nến đóng).</text>
<text x="670.0" y="232.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="670.0" y="249.8" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Diễn giải:</text>
<text x="670.0" y="266.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh chờ ở đó (nếu có) đã được khớp:</text>
<text x="670.0" y="284.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">stop thành market, limit được ăn.</text>
<text x="670.0" y="301.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="670.0" y="318.2" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Không biết:</text>
<text x="670.0" y="335.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">bao nhiêu lệnh thực sự được khớp, ai</text>
<text x="670.0" y="352.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">là đối ứng, và "ai muốn" điều đó.</text>
<rect x="670.0" y="420.5" width="116.2" height="18.5" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
<text x="676.0" y="435.0" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="start">[INTERPRETATION]</text>
<rect x="26.0" y="458.0" width="928.0" height="68.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="40.0" y="480.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">Lỗi phổ biến: dùng nghĩa 2 như thể nó là nghĩa 1. "Trên đỉnh có liquidity" (ICT) KHÔNG có nghĩa là "thị trường ở đó thanh khoản cao".</text>
<text x="40.0" y="500.0" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Thực tế thường NGƯỢC lại: vùng stop gom lại là nơi lệnh MARKET bùng ra → tiêu thụ thanh khoản → giá chạy nhanh qua (xem hình 07–08).</text>
<text x="40.0" y="518.0" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Từ "liquidity" trong ICT gần nghĩa "lệnh đối ứng tiềm năng" hơn là "độ sâu thị trường".</text>
</svg>
