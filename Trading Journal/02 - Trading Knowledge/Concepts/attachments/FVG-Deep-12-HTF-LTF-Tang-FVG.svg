<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="620" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">D1 → H1 → M5: FVG ở mỗi tầng trả lời một câu hỏi khác</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">HTF FVG cho LOCATION (nơi đáng chú ý). LTF FVG cho EXECUTION (điểm vào, stop ngắn). Không tầng nào tự nó là tín hiệu.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">M5 FVG ngược D1 context không được dùng — trừ khi đang test một mô hình countertrend riêng.</text>
<rect x="30.0" y="110.0" width="430.0" height="146.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="46.0" y="136.0" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="start">D1 — CONTEXT</text>
<text x="46.0" y="158.0" font-size="11" font-weight="600" fill="#1F2937" text-anchor="start">Ở đâu? Vùng nào đáng chờ?</text>
<text x="46.0" y="184.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">D1 bullish FVG trong discount của dealing range D1</text>
<text x="46.0" y="204.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">→ vùng quan tâm (location), KHÔNG phải điểm vào</text>
<text x="46.0" y="224.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Câu hỏi: FVG này có nằm trên đường tới DOL không?</text>
<line x1="245.0" y1="256.0" x2="245.0" y2="268.0" stroke="#334155" stroke-width="2" marker-end="url(#aS)"/>
<rect x="30.0" y="270.0" width="430.0" height="146.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="46.0" y="296.0" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="start">H1 — SETUP</text>
<text x="46.0" y="318.0" font-size="11" font-weight="600" fill="#1F2937" text-anchor="start">Trong vùng D1, phản ứng có hình thành?</text>
<text x="46.0" y="344.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Giá vào D1 FVG → sweep SSL H1 → displacement</text>
<text x="46.0" y="364.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">→ H1 FVG mới, nằm TRONG vùng D1 (nested)</text>
<text x="46.0" y="384.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Câu hỏi: H1 FVG có ở leg phá cấu trúc không?</text>
<line x1="245.0" y1="416.0" x2="245.0" y2="428.0" stroke="#334155" stroke-width="2" marker-end="url(#aS)"/>
<rect x="30.0" y="430.0" width="430.0" height="146.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="46.0" y="456.0" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">M5 — EXECUTION</text>
<text x="46.0" y="478.0" font-size="11" font-weight="600" fill="#1F2937" text-anchor="start">Khi nào vào, stop ở đâu?</text>
<text x="46.0" y="504.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Giá retrace vào H1 FVG → M5 MSS + M5 FVG</text>
<text x="46.0" y="524.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">→ limit tại M5 FVG / CE; stop sau distal M5 hoặc sweep low</text>
<text x="46.0" y="544.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Câu hỏi: R:R tới target H1/D1 còn đủ không?</text>
<rect x="480.0" y="110.0" width="470.0" height="466.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="496.0" y="134.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Ba lớp vùng lồng nhau (sơ đồ, không theo tỉ lệ)</text>
<rect x="500.0" y="293.5" width="430.0" height="164.0" rx="3" fill="#2563EB" fill-opacity="0.12"/>
<line x1="500.0" y1="293.5" x2="930.0" y2="293.5" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="6 3"/>
<line x1="500.0" y1="457.5" x2="930.0" y2="457.5" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="926.0" y="287.5" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="end">D1 FVG 100–108</text>
<rect x="640.0" y="365.2" width="290.0" height="51.2" rx="3" fill="#7C3AED" fill-opacity="0.18"/>
<line x1="640.0" y1="365.2" x2="930.0" y2="365.2" stroke="#6D28D9" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="640.0" y1="416.5" x2="930.0" y2="416.5" stroke="#6D28D9" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="926.0" y="359.2" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="end">H1 FVG 102–104.5</text>
<rect x="790.0" y="383.7" width="140.0" height="14.3" rx="3" fill="#16A34A" fill-opacity="0.35"/>
<text x="926.0" y="412.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="end">M5 FVG 102.9–103.6</text>
<path d="M510.0,191.0 L538.0,232.0 L566.0,273.0 L594.0,303.8 L622.0,344.8 L650.0,385.8 L678.0,432.9 L706.0,445.2 L734.0,400.1 L762.0,350.9 L790.0,367.3 L818.0,389.9 L846.0,363.2 L874.0,314.0 L902.0,252.5 L930.0,211.5" stroke="#334155" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="818.0" cy="389.9" r="6" fill="#16A34A" stroke="#fff" stroke-width="2"/>
<text x="808.0" y="411.9" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">entry</text>
<text x="706.0" y="463.2" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">sweep SSL H1</text>
<line x1="500.0" y1="453.4" x2="930.0" y2="453.4" stroke="#B45309" stroke-width="1" stroke-dasharray="2 3"/>
<text x="496.0" y="520.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Stop M5 ngắn → R:R cao. Nhưng tỷ lệ thắng và việc 'bị quét'</text>
<text x="496.0" y="537.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">phụ thuộc vào M5 noise; HTF đúng không bảo đảm entry LTF đúng.</text>
</svg>