<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="698" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="874.9" y="22" width="97.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="923.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">EDGE CASES</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Sáu edge case: BPR đúng định nghĩa nhưng dễ đọc sai</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sơ đồ đơn giản hóa bằng đường giá. Tím = BPR. Mỗi ô kèm một câu hỏi cần đặt ra.</text>
<rect x="28.0" y="86.0" width="304.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">BPR từ cú giật tin</text>
<rect x="136.0" y="157.4" width="176.0" height="71.4" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.4"/>
<polyline points="48.0,154.0 92.0,152.3 118.4,239.0 153.6,235.6 180.0,147.2 312.0,150.6" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="286.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Hai FVG là hai nến tin. BPR to gần bằng cả biên độ</text>
<text x="40.0" y="301.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">→ nói về biến động, ít nói về cấu trúc.</text>
<rect x="344.0" y="86.0" width="304.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="356.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">FVG “giả” do gap cuối tuần</text>
<rect x="452.0" y="150.6" width="176.0" height="44.2" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.4"/>
<polyline points="364.0,205.0 425.6,198.2 434.4,147.2 496.0,140.4 540.0,194.8 628.0,211.8" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="356.0" y="286.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Một phần “FVG” là khoảng nhảy mở cửa. Ghi riêng</text>
<text x="356.0" y="301.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">phần nào là gap thật, phần nào do nến tạo ra.</text>
<rect x="660.0" y="86.0" width="304.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="672.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">BPR trong vùng đi ngang</text>
<rect x="768.0" y="171.0" width="176.0" height="23.8" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.4"/>
<polyline points="680.0,188.0 724.0,154.0 768.0,211.8 812.0,150.6 856.0,208.4 900.0,155.7 944.0,201.6" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="672.0" y="286.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi qua lại vùng nhiều lần. Mỗi lần qua lại có thể</text>
<text x="672.0" y="301.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">tạo FVG mới → BPR mất ý nghĩa.</text>
<rect x="28.0" y="368.0" width="304.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="390.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Bị chạm rồi chạm lại</text>
<rect x="136.0" y="442.8" width="176.0" height="20.4" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.4"/>
<polyline points="48.0,419.0 92.0,415.6 136.0,453.0 162.4,425.8 206.4,459.8 232.8,429.2 276.8,464.9 312.0,487.0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="568.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Lần chạm thứ ba, thứ tư ít “người đợi” hơn. Ghi số lần</text>
<text x="40.0" y="583.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">chạm và độ sâu.</text>
<rect x="344.0" y="368.0" width="304.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="356.0" y="390.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Phần chồng siêu mỏng</text>
<rect x="452.0" y="451.0" width="176.0" height="2.9" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.4"/>
<polyline points="364.0,504.0 408.0,422.4 452.0,415.6 496.0,454.7 540.0,493.8 628.0,500.6" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="356.0" y="568.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Mỏng hơn spread. Có theo định nghĩa, nhưng không</text>
<text x="356.0" y="583.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">đặt lệnh được → xếp “không dùng”.</text>
<rect x="660.0" y="368.0" width="304.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="672.0" y="390.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">BPR to, nằm rất xa</text>
<rect x="768.0" y="429.2" width="176.0" height="61.2" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.4"/>
<polyline points="680.0,517.6 724.0,510.8 768.0,415.6 812.0,419.0 856.0,493.8 944.0,524.4" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="672.0" y="568.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Vùng lớn, stop xa, R:R xấu. Có thể chỉ dùng làm bối</text>
<text x="672.0" y="583.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">cảnh (context), không làm điểm vào.</text>
<text x="28.0" y="680.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Cách xử lý chung: không xóa các BPR này khỏi journal. Gắn nhãn edge case cho chúng — đó là những mẫu giúp bạn biết bộ lọc nào thật sự cần.</text>
</svg>
