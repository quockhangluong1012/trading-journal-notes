<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="658" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cái gì KHÔNG nên gọi là Accumulation?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mọi Accumulation (theo nghĩa PO3) đều trông như đi ngang — nhưng phần lớn các đoạn đi ngang KHÔNG phải ứng viên tốt. Gọi tên quá</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">sớm là bước đầu của việc ép câu chuyện lên chart.</text>
<rect x="852.8" y="22.0" width="119.2" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="912.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ACCUMULATION</text>
<rect x="28.0" y="96.0" width="306.0" height="268.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.1"/>
<circle cx="46.0" cy="115.0" r="9" fill="#15803D"/>
<text x="46.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="62.0" y="119.0" font-size="12.4" font-weight="700" fill="#15803D" text-anchor="start">Ứng viên tốt: mép rõ, chạm nhiều lần, có</text>
<text x="62.0" y="135.1" font-size="12.4" font-weight="700" fill="#15803D" text-anchor="start">vị trí</text>
<rect x="40.0" y="145.2" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="96.4" y="200.2" width="225.6" height="53.2" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M40.0,156.7 L61.7,180.9 L83.4,208.3 L105.1,237.3 L126.8,211.5 L148.5,201.8 L170.2,234.1 L191.8,251.8 L213.5,221.2 L235.2,201.8 L256.9,248.6 L278.6,214.7 L300.3,203.4 L322.0,230.9" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="281.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Có mép trên/dưới dễ thấy, giá phản ứng nhiều lần,</text>
<text x="40.0" y="296.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">và vùng này nằm ở chỗ có ý nghĩa trên khung lớn.</text>
<text x="40.0" y="313.6" font-size="11.4" font-weight="700" fill="#15803D" text-anchor="start">Đáng theo dõi — vẫn chỉ là ỨNG VIÊN.</text>
<rect x="346.0" y="96.0" width="306.0" height="268.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="364.0" cy="115.0" r="9" fill="#B91C1C"/>
<text x="364.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="380.0" y="119.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Nghỉ giữa xu hướng (cờ / pullback)</text>
<rect x="358.0" y="130.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<path d="M358.0,236.6 L386.2,213.5 L414.4,190.4 L442.6,164.5 L470.8,141.4 L499.0,147.2 L527.2,142.9 L555.4,151.5 L583.6,147.2 L611.8,154.4 L640.0,150.1" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="266.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá vừa chạy mạnh và chỉ đang nghỉ chân. Hộp</text>
<text x="358.0" y="281.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nghiêng theo kiểu “thở”, không có hai phía cân</text>
<text x="358.0" y="296.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">bằng.</text>
<text x="358.0" y="313.5" font-size="11.4" font-weight="700" fill="#B91C1C" text-anchor="start">Gọi là pause/pullback, không phải A.</text>
<rect x="664.0" y="96.0" width="306.0" height="268.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="682.0" cy="115.0" r="9" fill="#B91C1C"/>
<text x="682.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="698.0" y="119.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Trôi chậm, biên độ thấp, không có mép</text>
<rect x="676.0" y="130.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<path d="M676.0,236.6 L704.2,218.3 L732.4,229.3 L760.6,200.0 L788.8,211.0 L817.0,178.0 L845.2,192.7 L873.4,163.4 L901.6,170.7 L929.8,141.4 L958.0,152.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="266.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá bò chậm theo một hướng. Không có mép nào</text>
<text x="676.0" y="281.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">được chạm lặp lại → không biết lệnh chờ nằm ở đâu.</text>
<text x="676.0" y="298.3" font-size="11.4" font-weight="700" fill="#B91C1C" text-anchor="start">Không có mép = không có ứng viên.</text>
<rect x="28.0" y="376.0" width="306.0" height="268.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="46.0" cy="395.0" r="9" fill="#B91C1C"/>
<text x="46.0" y="399.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="62.0" y="399.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Mép lộn xộn: đỉnh/đáy mỗi lần một khác</text>
<rect x="40.0" y="410.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<path d="M40.0,479.1 L68.2,450.3 L96.4,493.5 L124.6,433.0 L152.8,502.2 L181.0,456.0 L209.2,516.6 L237.4,441.6 L265.6,490.6 L293.8,421.4 L322.0,507.9" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="546.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Muốn vẽ hộp kiểu nào cũng được → mỗi người vẽ</text>
<text x="40.0" y="561.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">một kiểu. Mép tự chọn thì “sweep” cũng tự chọn.</text>
<text x="40.0" y="578.3" font-size="11.4" font-weight="700" fill="#B91C1C" text-anchor="start">Mép phải rõ trước khi bàn chuyện quét mép.</text>
<rect x="346.0" y="376.0" width="306.0" height="268.0" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.1"/>
<circle cx="364.0" cy="395.0" r="9" fill="#B45309"/>
<text x="364.0" y="399.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="380.0" y="399.0" font-size="12.4" font-weight="700" fill="#B45309" text-anchor="start">Hộp quá rộng so với một ngày bình</text>
<text x="380.0" y="415.1" font-size="12.4" font-weight="700" fill="#B45309" text-anchor="start">thường</text>
<rect x="358.0" y="425.2" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="358.0" y="434.3" width="282.0" height="99.8" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M358.0,485.4 L389.3,436.7 L420.7,529.5 L452.0,443.6 L483.3,524.9 L514.7,439.0 L546.0,520.2 L577.3,445.9 L608.7,531.8 L640.0,452.9" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="561.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Hộp đã nuốt gần hết quãng đường giá hay đi trong</text>
<text x="358.0" y="576.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">ngày → không còn chỗ cho cú lệch (M) và cú chạy</text>
<text x="358.0" y="591.6" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">(D).</text>
<text x="358.0" y="608.7" font-size="11.4" font-weight="700" fill="#B45309" text-anchor="start">Coi cả ngày là một range lớn; đứng ngoài.</text>
<rect x="664.0" y="376.0" width="306.0" height="268.0" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.1"/>
<circle cx="682.0" cy="395.0" r="9" fill="#B45309"/>
<text x="682.0" y="399.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="698.0" y="399.0" font-size="12.4" font-weight="700" fill="#B45309" text-anchor="start">Đi ngang ngay trước tin lớn</text>
<rect x="676.0" y="410.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="859.3" y1="410.0" x2="859.3" y2="528.0" stroke="#BE123C" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="863.3" y="423.0" font-size="10" font-weight="700" fill="#BE123C" text-anchor="start">TIN</text>
<path d="M676.0,474.9 L704.2,470.2 L732.4,477.3 L760.6,471.4 L788.8,476.1 L817.0,472.6 L845.2,475.5 L873.4,421.4 L901.6,516.6 L929.8,445.2 L958.0,498.7" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="546.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Thị trường chỉ đang chờ tin. Tin ra có thể quét cả</text>
<text x="676.0" y="561.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">hai phía trong vài phút; mô hình không còn ý</text>
<text x="676.0" y="576.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nghĩa.</text>
<text x="676.0" y="593.5" font-size="11.4" font-weight="700" fill="#B45309" text-anchor="start">Đánh dấu giờ tin TRƯỚC; không ép AMD.</text>
</svg>
