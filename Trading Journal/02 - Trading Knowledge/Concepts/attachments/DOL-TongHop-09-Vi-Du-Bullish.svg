<svg viewBox="0 0 760 746" width="760" height="746" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ba ví dụ DOL tăng: NQ, EURUSD, XAUUSD</title>
