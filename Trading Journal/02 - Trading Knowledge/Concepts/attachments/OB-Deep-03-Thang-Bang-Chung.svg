<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cùng một Order Block — sáu loại mệnh đề, sáu mức độ chắc chắn</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Lỗi phổ biến nhất khi học OB: trộn các tầng. Một câu ở tầng dưới KHÔNG được dùng làm bằng chứng cho câu ở tầng trên.</text>
<rect x="26.0" y="86.0" width="928.0" height="64.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4"/>
<text x="40.0" y="112.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">OBSERVABLE</text>
<text x="40.0" y="132.0" font-size="9.8" font-weight="600" fill="#6B7280" text-anchor="start">Cao — nhưng chỉ mô tả</text>
<text x="260.0" y="116.0" font-size="11" font-weight="400" fill="#374151" text-anchor="start">“Nến H1 lúc 09:00 đóng giảm; ba nến sau tăng 2.1 ATR, close 11:00 vượt swing high 1.0852.”</text>
<line x1="140.0" y1="150.0" x2="140.0" y2="162.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="26.0" y="162.0" width="928.0" height="64.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="40.0" y="188.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">MARKET MECHANICS</text>
<text x="40.0" y="208.0" font-size="9.8" font-weight="600" fill="#6B7280" text-anchor="start">Cao (có tài liệu vi cấu trúc)</text>
<text x="260.0" y="192.0" font-size="11" font-weight="400" fill="#374151" text-anchor="start">“Giá tăng nhanh khi lệnh mua chủ động tiêu thụ hết lệnh bán chờ nhanh hơn tốc độ bổ sung.”</text>
<line x1="140.0" y1="226.0" x2="140.0" y2="238.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="26.0" y="238.0" width="928.0" height="64.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="40.0" y="264.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="start">ICT FRAMEWORK</text>
<text x="40.0" y="284.0" font-size="9.8" font-weight="600" fill="#6B7280" text-anchor="start">Cao về ĐỊNH NGHĨA; không nói gì về hiệu quả</text>
<text x="260.0" y="268.0" font-size="11" font-weight="400" fill="#374151" text-anchor="start">“ICT gọi nến 09:00 là bullish OB; giá 'nên' quay về mitigate trước khi đi tiếp.”</text>
<line x1="140.0" y1="302.0" x2="140.0" y2="314.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="26.0" y="314.0" width="928.0" height="64.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="40.0" y="340.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">INTERPRETATION</text>
<text x="40.0" y="360.0" font-size="9.8" font-weight="600" fill="#6B7280" text-anchor="start">Thấp — không quan sát được từ OHLC</text>
<text x="260.0" y="344.0" font-size="11" font-weight="400" fill="#374151" text-anchor="start">“Một người mua lớn đã mua ở đó và còn phần lệnh chưa khớp.”</text>
<line x1="140.0" y1="378.0" x2="140.0" y2="390.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="26.0" y="390.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="40.0" y="416.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">HYPOTHESIS</text>
<text x="40.0" y="436.0" font-size="9.8" font-weight="600" fill="#6B7280" text-anchor="start">Chưa biết — kiểm chứng được</text>
<text x="260.0" y="420.0" font-size="11" font-weight="400" fill="#374151" text-anchor="start">“Giá quay về vùng này có P(phản ứng ≥ 1 ATR) cao hơn vùng ngẫu nhiên cùng hình học.”</text>
<line x1="140.0" y1="454.0" x2="140.0" y2="466.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="26.0" y="466.0" width="928.0" height="64.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/>
<text x="40.0" y="492.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">BACKTEST RESULT</text>
<text x="40.0" y="512.0" font-size="9.8" font-weight="600" fill="#6B7280" text-anchor="start">Tùy thiết kế; chỉ ngày có dữ liệu</text>
<text x="260.0" y="496.0" font-size="11" font-weight="400" fill="#374151" text-anchor="start">“Trên N sự kiện theo OB-DEF v0.1, chênh lệch = x ± CI so với đối chứng.”</text>
<rect x="26.0" y="548.0" width="928.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
<text x="40.0" y="573.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">Quy tắc của note: mỗi mệnh đề quan trọng mang đúng một nhãn. 'Smart money đặt lệnh ở OB' là INTERPRETATION, không bao giờ là MECHANICS.</text>
</svg>