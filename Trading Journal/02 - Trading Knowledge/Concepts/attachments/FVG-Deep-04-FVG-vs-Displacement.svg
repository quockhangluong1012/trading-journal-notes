<text x="46.0" y="582.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Ba nến nhỏ bình thường, bóng nến ngắn.</text>
<text x="46.0" y="599.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Gap nhỏ do bóng nến 1 &amp; 3 ngắn — rất phổ biến, ít thông tin.</text>
<text x="320.0" y="440.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="start">Displacement:</text>
