<text x="46.0" y="320.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Nến 2 rất lớn, nến 1 và nến 3 không chạm vào thân.</text>
<text x="46.0" y="337.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Trường hợp 'sách giáo khoa'. Phổ biến khi nến 2 ≥ 2 ATR.</text>
