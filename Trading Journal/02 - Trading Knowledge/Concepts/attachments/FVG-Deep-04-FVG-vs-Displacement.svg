<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">FVG và Displacement — liên quan chặt nhưng KHÔNG đồng nhất</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Displacement = sự kiện của chuyển động (nhanh, lớn, một chiều). FVG = hình học của 3 nến. Thường đi kèm nhau — nhưng không luôn luôn.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Trên random walk: nến 2 có range ≥ 2 ATR tạo FVG ~88% lần; nhưng ~78% FVG lại sinh từ nến 2 &lt; 1.5 ATR (FVG-Sim-01).</text>
