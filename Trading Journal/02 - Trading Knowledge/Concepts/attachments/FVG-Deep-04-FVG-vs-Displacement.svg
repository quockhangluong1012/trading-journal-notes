<text x="320.0" y="228.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="start">FVG:</text>
<text x="320.0" y="246.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">CÓ</text>
