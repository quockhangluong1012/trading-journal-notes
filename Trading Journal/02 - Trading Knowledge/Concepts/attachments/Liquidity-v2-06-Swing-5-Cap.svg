<rect x="24.0" y="504.0" width="892.0" height="64.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="524.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Năm biến để xếp cấp (giải thích bằng lời, không cần chấm điểm phức tạp):</text>
<text x="40.0" y="542.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">S cấu trúc — swing có bảo vệ cấu trúc / làm biên range không?   L liquidity — tạo ra bằng một cú quét, hay tạo ra pool mới?</text>
<text x="40.0" y="558.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">D displacement — leg rời swing có mạnh không?   R phản ứng — biên độ hồi tính theo ATR   T khung thời gian — xác nhận ở khung nào?</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-06 · Level 1–5 là framework nghiên cứu của vault, không phải hệ phân cấp chính thức của ICT.</text>
