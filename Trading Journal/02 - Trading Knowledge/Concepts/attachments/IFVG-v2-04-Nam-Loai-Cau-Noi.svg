<text x="488.0" y="506.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST REQUIRED</text>
<text x="418.0" y="530.0" font-size="12.2" font-weight="600" fill="#1F2937" text-anchor="start">'Giá quay lại vùng này thường bị từ chối.'</text>
<text x="958.0" y="506.0" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="end">Chỉ là giả thuyết cho tới khi bạn đếm trên dữ liệu của mình.</text>
