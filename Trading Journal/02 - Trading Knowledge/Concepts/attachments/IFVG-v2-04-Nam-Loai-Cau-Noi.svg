<text x="447.2" y="224.0" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">CƠ CHẾ</text>
<text x="418.0" y="248.0" font-size="12.2" font-weight="600" fill="#1F2937" text-anchor="start">Giá chỉ xuống qua 104–106 được khi lệnh bán chủ động 'ăn' hết lệnh mua đang chờ ở đó</text>
<text x="418.0" y="264.8" font-size="12.2" font-weight="600" fill="#1F2937" text-anchor="start">(hoặc lệnh mua bị rút).</text>
<text x="958.0" y="224.0" font-size="10.5" font-weight="400" fill="#0F766E" text-anchor="end">Đúng về cách khớp lệnh — nhưng không cho biết AI làm.</text>
