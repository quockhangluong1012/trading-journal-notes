<text x="418.0" y="342.0" font-size="12.2" font-weight="600" fill="#1F2937" text-anchor="start">ICT gọi đây là FVG thất bại. Vùng 104–106 giờ được đọc là Bearish IFVG.</text>
<text x="958.0" y="318.0" font-size="10.5" font-weight="400" fill="#7C3AED" text-anchor="end">Một cái TÊN và một cách dùng, không phải bằng chứng.</text>
<rect x="404.0" y="386.0" width="568.0" height="86.0" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.1"/>
<rect x="418.0" y="398.0" width="80.7" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.1"/>
<text x="458.3" y="412.0" font-size="10.5" font-weight="700" fill="#EA580C" text-anchor="middle">DIỄN GIẢI</text>
<text x="418.0" y="436.0" font-size="12.2" font-weight="600" fill="#1F2937" text-anchor="start">Có thể nhiều người mua ở vùng này đang lỗ và sẽ bán khi giá quay về hòa vốn.</text>
<text x="958.0" y="412.0" font-size="10.5" font-weight="400" fill="#EA580C" text-anchor="end">Hợp lý, nhưng chart không xác nhận được.</text>
