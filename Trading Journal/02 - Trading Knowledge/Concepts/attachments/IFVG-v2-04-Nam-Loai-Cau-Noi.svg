<text x="418.0" y="154.0" font-size="12.2" font-weight="600" fill="#1F2937" text-anchor="start">Giá tạo một FVG tăng 104–106. Sau đó một nến đóng cửa ở 103.2 — thấp hơn cả vùng.</text>
<text x="958.0" y="130.0" font-size="10.5" font-weight="400" fill="#1D4ED8" text-anchor="end">Ai nhìn chart cũng thấy giống nhau.</text>
<rect x="404.0" y="198.0" width="568.0" height="86.0" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.1"/>
