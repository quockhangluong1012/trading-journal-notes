<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng là 'FVG 104–106 bị đóng cửa xuyên xuống', nhưng mỗi câu dưới đây thuộc một loại sự thật khác nhau. Lỗi phổ biến nhất: đọc</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">câu DIỄN GIẢI như thể nó là QUAN SÁT.</text>
