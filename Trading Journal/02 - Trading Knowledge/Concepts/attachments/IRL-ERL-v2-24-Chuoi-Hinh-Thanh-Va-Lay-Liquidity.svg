<rect x="593.6" y="246.4" width="366.4" height="24.8" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.75"/>
<text x="819.7" y="262.9" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG (IRL mới)</text>
<rect x="31.0" y="425.0" width="151.3" height="150.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="40.0" y="434.5" width="63.4" height="17.5" rx="8.75" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="71.7" y="447.0" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">QUAN SÁT</text>
<text x="40.0" y="471.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">Giá đi ngang trong một</text>
<text x="40.0" y="486.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">vùng hẹp, chạm hai</text>
<text x="40.0" y="502.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">mép nhiều lần.</text>
<rect x="188.3" y="425.0" width="151.3" height="150.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="197.3" y="434.5" width="63.4" height="17.5" rx="8.75" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="229.0" y="447.0" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">QUAN SÁT</text>
<text x="197.3" y="471.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">Các đỉnh/đáy nhỏ hình</text>
<text x="197.3" y="486.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">thành; mỗi cái là một</text>
<text x="197.3" y="502.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">mốc mới.</text>
<rect x="345.7" y="425.0" width="151.3" height="150.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="354.7" y="434.5" width="58.3" height="17.5" rx="8.75" fill="#FFF7E6" stroke="#B45309" stroke-width="1.1"/>
<text x="383.8" y="447.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<text x="354.7" y="471.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">EQH rõ ⇒ có thể nhiều</text>
<text x="354.7" y="486.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">stop mua tụ lại. Không</text>
<text x="354.7" y="502.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">đo được.</text>
<rect x="503.0" y="425.0" width="151.3" height="150.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="512.0" y="434.5" width="30.0" height="17.5" rx="8.75" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="527.0" y="447.0" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<text x="512.0" y="471.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">Giá vượt EQH rồi quay</text>
<text x="512.0" y="486.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">lại: “BSL đã bị lấy”.</text>
<rect x="660.3" y="425.0" width="151.3" height="150.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="669.3" y="434.5" width="63.4" height="17.5" rx="8.75" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="701.0" y="447.0" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">QUAN SÁT</text>
<text x="669.3" y="471.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">Nến lớn ngược chiều,</text>
<text x="669.3" y="486.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">để lại FVG, phá đáy</text>
<text x="669.3" y="502.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">vùng.</text>
<rect x="817.7" y="425.0" width="151.3" height="150.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="826.7" y="434.5" width="72.6" height="17.5" rx="8.75" fill="#FFF1F3" stroke="#BE123C" stroke-width="1.1"/>
<text x="863.0" y="447.0" font-size="9.5" font-weight="700" fill="#BE123C" text-anchor="middle">GIẢ THUYẾT</text>
<text x="826.7" y="471.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">“Bên lớn đã gom/xả</text>
<text x="826.7" y="486.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">xong” — hấp dẫn</text>
<text x="826.7" y="502.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">nhưng không kiểm</text>
<text x="826.7" y="518.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="131.3">chứng được.</text>
<rect x="28.0" y="587.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="611.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Phân biệt hai chữ: liquidity FORMATION (các mốc ai cũng thấy dần hình thành — quan sát được) và liquidity TAKING (giá đi qua các mốc đó — quan sát được).</text>
<text x="42.0" y="627.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Còn “ai đó cố tình xây rồi lấy” (engineering có chủ đích) là diễn giải: chart không cho biết ý định.</text>
