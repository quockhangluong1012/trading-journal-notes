<defs></defs>
<rect x="1" y="1" width="998" height="657" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="870.9" y="22" width="101.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="921.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ENGINEERING</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity được HÌNH THÀNH rồi mới bị LẤY: chuỗi sáu bước ICT hay kể — và mỗi bước</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">thuộc loại sự thật nào</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Câu chuyện “Liquidity Engineering” của ICT trộn lẫn điều quan sát được với điều không thể kiểm chứng. Tách chúng ra bằng nhãn ở hàng dưới.</text>
<rect x="28.0" y="113.0" width="944.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="40.0" y="125.0" width="187.1" height="276.0" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<text x="133.6" y="139.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1 · Đi ngang</text>
