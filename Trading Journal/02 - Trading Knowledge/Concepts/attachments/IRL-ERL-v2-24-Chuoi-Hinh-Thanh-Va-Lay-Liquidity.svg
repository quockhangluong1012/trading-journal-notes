<text x="305.1" y="139.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">2 · Swing nội bộ</text>
<rect x="383.1" y="125.0" width="155.9" height="276.0" rx="0" fill="#FEF2F2" stroke="none" stroke-width="1.2"/>
<text x="461.0" y="139.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">3 · Tích tụ (EQH)</text>
<rect x="539.0" y="125.0" width="93.6" height="276.0" rx="0" fill="#FFF1E6" stroke="none" stroke-width="1.2"/>
<text x="585.8" y="139.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">4 · Sweep</text>
<rect x="632.5" y="125.0" width="124.7" height="276.0" rx="0" fill="#ECFDF5" stroke="none" stroke-width="1.2"/>
<text x="694.9" y="139.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">5 · Displacement</text>
<rect x="757.3" y="125.0" width="202.7" height="276.0" rx="0" fill="#EAF2FF" stroke="none" stroke-width="1.2"/>
<text x="858.6" y="139.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">6 · Mở rộng</text>
