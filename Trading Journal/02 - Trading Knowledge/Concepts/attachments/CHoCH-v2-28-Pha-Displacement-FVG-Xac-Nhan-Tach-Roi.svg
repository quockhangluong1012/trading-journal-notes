<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="678.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="19.5" font-weight="700" fill="#111827">Bốn thứ KHÁC NHAU hay bị gộp làm một: phá cấu trúc, displacement, FVG, xác nhận</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Ma trận 2×2: hàng = có phá protected swing không; cột = có displacement không. Cả bốn ô đều xảy ra ngoài thị trường.</text>
<rect x="168.0" y="122.5" width="390.0" height="226.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="182.0" y="148.0" font-size="13.5" font-weight="700" fill="#15803D" data-bx="181.0,547.0">Phá + displacement</text>
<line x1="250.4" y1="262.5" x2="394.8" y2="262.5" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<polyline points="201.0,223.8 239.0,290.2 269.4,262.5 299.8,312.3 337.8,190.6 364.4,218.3" fill="none" stroke="#15803D" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="292.2" y="240.4" width="53.2" height="33.2" rx="2" fill="#0891B2" fill-opacity="0.2" stroke="#0891B2" stroke-width="1.2"/>
<text x="382.0" y="186.5" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">G1. Bằng chứng mạnh nhất</text>
<text x="382.0" y="203.5" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">mà cú phá có thể cho. Vẫn</text>
<text x="382.0" y="220.5" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">có thể thất bại.</text>
<rect x="570.0" y="122.5" width="390.0" height="226.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="584.0" y="148.0" font-size="13.5" font-weight="700" fill="#B45309" data-bx="583.0,949.0">Phá, KHÔNG displacement</text>
<line x1="652.4" y1="262.5" x2="796.8" y2="262.5" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<polyline points="603.0,223.8 641.0,290.2 671.4,262.5 701.8,312.3 717.0,284.7 728.4,295.7 747.4,268.1 758.8,276.4 777.8,251.5" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="784.0" y="186.5" font-size="12" font-weight="400" fill="#111827" data-bx="783.0,947.0">G0. Vẫn là CHoCH theo</text>
<text x="784.0" y="203.5" font-size="12" font-weight="400" fill="#111827" data-bx="783.0,947.0">định nghĩa. Ít thông tin về</text>
<text x="784.0" y="220.5" font-size="12" font-weight="400" fill="#111827" data-bx="783.0,947.0">lực.</text>
<rect x="168.0" y="358.5" width="390.0" height="226.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="182.0" y="384.0" font-size="13.5" font-weight="700" fill="#0D9488" data-bx="181.0,547.0">Displacement, KHÔNG phá</text>
<line x1="250.4" y1="498.5" x2="394.8" y2="498.5" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<polyline points="201.0,459.8 239.0,526.2 269.4,498.5 299.8,548.3 330.2,504.1 360.6,531.7" fill="none" stroke="#0D9488" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="382.0" y="422.5" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">Chân sóng mạnh nhưng</text>
<text x="382.0" y="439.5" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">dừng dưới protected high.</text>
<text x="382.0" y="456.5" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">Chưa đổi trạng thái — chỉ là</text>
<text x="382.0" y="473.6" font-size="12" font-weight="400" fill="#111827" data-bx="381.0,545.0">một cú hồi mạnh.</text>
<rect x="570.0" y="358.5" width="390.0" height="226.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="584.0" y="384.0" font-size="13.5" font-weight="700" fill="#9CA3AF" data-bx="583.0,949.0">Không phá, không displacement</text>
<line x1="652.4" y1="498.5" x2="796.8" y2="498.5" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<polyline points="603.0,459.8 641.0,526.2 671.4,498.5 701.8,548.3 720.8,526.2 736.0,537.3 762.6,515.1 777.8,531.7" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="784.0" y="422.5" font-size="12" font-weight="400" fill="#111827" data-bx="783.0,947.0">Hồi yếu trong cấu trúc</text>
<text x="784.0" y="439.5" font-size="12" font-weight="400" fill="#111827" data-bx="783.0,947.0">giảm. Không có gì để gọi</text>
<text x="784.0" y="456.5" font-size="12" font-weight="400" fill="#111827" data-bx="783.0,947.0">tên.</text>
<text x="160.0" y="242.5" font-size="12" font-weight="700" fill="#111827" text-anchor="end">PHÁ</text>
<text x="160.0" y="258.5" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">protected</text>
<text x="160.0" y="478.5" font-size="12" font-weight="700" fill="#111827" text-anchor="end">KHÔNG phá</text>
<text x="363.0" y="114.5" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">CÓ displacement</text>
<text x="765.0" y="114.5" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">KHÔNG displacement</text>
<rect x="28.0" y="602.5" width="944.0" height="51.0" rx="8" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="602.5" width="4.0" height="51.0" rx="2" fill="#2563EB"/>
<text x="42.0" y="622.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="28.0,972.0">FVG là DẤU VẾT để lại bởi displacement (khoảng trống giữa nến 1 và nến 3). “Xác nhận” là chuyện của các nến SAU (G2, G3). Bốn thứ này xảy ra ở những</text>
<text x="42.0" y="640.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="28.0,972.0">thời điểm khác nhau — ghi chúng thành bốn cột riêng trong journal.</text>
<text x="28.0" y="664.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đường cam = protected high của cấu trúc giảm. Nét dày = chân sóng có displacement. Ô xanh lam nhỏ = FVG.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
