<text x="305.5" y="520.7" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="start">← open</text>
<text x="305.5" y="585.2" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start">← close</text>
<text x="249.5" y="520.7" font-size="9.5" font-weight="600" fill="#6B7280" text-anchor="end">high = open</text>
<rect x="680.0" y="114.0" width="292.0" height="95.6" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="692.0" y="138.3" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">Open (mở cửa)</text>
<text x="692.0" y="160.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá ngay khi khoảng thời gian bắt đầu. Với các</text>
<text x="692.0" y="177.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nến liền nhau, open của nến sau thường gần</text>
<text x="692.0" y="194.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">bằng close của nến trước.</text>
<rect x="680.0" y="219.6" width="292.0" height="95.6" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="692.0" y="243.9" font-size="13" font-weight="700" fill="#059669" text-anchor="start">Close (đóng cửa)</text>
<text x="692.0" y="266.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá đúng lúc chuông reo. Đây là con số “chốt</text>
<text x="692.0" y="282.9" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">sổ” của cây nến — CISD được xét bằng con số</text>
<text x="692.0" y="299.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">này.</text>
<rect x="680.0" y="325.1" width="292.0" height="95.6" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="692.0" y="349.5" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">High / Low (râu nến)</text>
<text x="692.0" y="371.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chỗ xa nhất giá từng chạm trong khoảng đó.</text>
<text x="692.0" y="388.5" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá đã tới đó nhưng không ở lại tới lúc chuông</text>
<text x="692.0" y="405.3" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">reo.</text>
<rect x="680.0" y="430.7" width="292.0" height="78.8" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="692.0" y="455.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Thân nến (body)</text>
<text x="692.0" y="477.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Khoảng từ open tới close: giá đã dịch đi bao</text>
<text x="692.0" y="494.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">xa, tính từ lúc bắt đầu tới lúc chốt sổ.</text>
