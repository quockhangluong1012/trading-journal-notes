<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mỗi tiếng chuông tạo ra một cây nến</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Giá thật đi một đường ngoằn ngoèo. Cây nến chỉ giữ lại 4 điểm của đoạn đường giữa hai tiếng chuông: chỗ bắt đầu (open), chỗ cao</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nhất (high), chỗ thấp nhất (low), chỗ kết thúc (close).</text>
