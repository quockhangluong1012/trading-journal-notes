<text x="76.0" y="329.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;Ai muốn mua ở vạch,</text>
<text x="76.0" y="344.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">tớ bán cho!&quot;</text>
<circle cx="420.0" cy="400.0" r="16" fill="#B45309"/>
<text x="420.0" y="405.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">giá</text>
<path d="M300,420 Q360,330 420,400" stroke="#B45309" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="320.0" y="450.0" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">Quả bóng (giá) lăn tới gần vạch…</text>
<rect x="600.0" y="74.0" width="316.0" height="90.6" rx="7" fill="#ECFDF3" stroke="#15803D" stroke-width="1.2"/>
<text x="609.0" y="93.4" font-size="11.4" fill="#15803D" font-weight="700" text-anchor="start">Ý tưởng cốt lõi</text>
<text x="609.0" y="110.9" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Khi bóng vượt vạch, nhiều bạn cùng chạy một</text>
<text x="609.0" y="126.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">lúc → bóng có thể bị đẩy đi xa hơn (stop bị</text>
<text x="609.0" y="141.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">kích hoạt). Nhưng nếu có bạn đứng sẵn &quot;bán&quot;</text>
<text x="609.0" y="156.1" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">đủ nhiều, bóng có thể bị đẩy ngược lại.</text>
<rect x="600.0" y="214.0" width="316.0" height="135.7" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="609.0" y="233.4" font-size="11.4" fill="#B91C1C" font-weight="700" text-anchor="start">Chỗ ví dụ không còn đúng</text>
<text x="609.0" y="250.9" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">• Ta THẤY vạch. Ta KHÔNG đếm được có bao</text>
<text x="609.0" y="266.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">  nhiêu bạn đứng chờ, và họ có bỏ đi không.</text>
<text x="609.0" y="281.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">• Lệnh có thể bị hủy, thêm mới mỗi giây.</text>
<text x="609.0" y="296.1" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">• Bóng không &quot;muốn&quot; tới vạch. Nó tới đó hay</text>
<text x="609.0" y="311.1" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">  không còn tùy rất nhiều lực khác.</text>
<text x="609.0" y="326.1" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">• Vượt vạch rồi bóng đi tiếp hay quay lại —</text>
<text x="609.0" y="341.2" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">  chỉ biết SAU khi xem nó làm gì.</text>
<rect x="24.0" y="486.0" width="892.0" height="46.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
<text x="40.0" y="506.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Một câu: Liquidity là nơi có thể có nhiều người cùng chờ hành động vì họ nhìn cùng một mức giá —</text>
<text x="40.0" y="523.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">nó giúp ta biết NHÌN vào đâu và đặt câu hỏi gì, không cho ta biết trước giá sẽ đi đâu.</text>
<text x="24.0" y="546.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-35 · Phép ẩn dụ; giới hạn của phép ẩn dụ được nêu ngay trong hình.</text>
</svg>
