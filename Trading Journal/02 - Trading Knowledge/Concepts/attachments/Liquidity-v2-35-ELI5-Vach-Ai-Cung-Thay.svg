<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Giải thích cho trẻ 5 tuổi: &quot;vạch ai cũng nhìn thấy&quot;</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Một hình ảnh đơn giản — và chỗ nó KHÔNG còn đúng với thị trường thật.</text>
<rect x="24.0" y="74.0" width="560.0" height="400.0" rx="10" fill="#F0F9FF" stroke="#E5E7EB" stroke-width="1"/>
