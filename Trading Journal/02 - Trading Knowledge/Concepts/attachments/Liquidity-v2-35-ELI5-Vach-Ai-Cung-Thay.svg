<rect x="300.0" y="172.0" width="210.0" height="38.2" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.2"/>
<text x="306.0" y="189.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;Nếu bóng vượt vạch,</text>
<text x="306.0" y="204.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">tớ sẽ chạy theo (MUA)!&quot;</text>
<circle cx="110.0" cy="252.0" r="8" fill="#1D4ED8"/>
