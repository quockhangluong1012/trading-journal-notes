<svg viewBox="0 0 760 590" width="760" height="590" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lộ trình backtest DOL: bốn nghiên cứu A → D và các hàng rào chống sai lệch</title>
<desc>Bốn nghiên cứu: A chỉ dự báo, B ablation sáu lớp, C các bẫy, D vào lệnh thật có và không có bộ lọc DOL. Bên dưới là năm hàng rào chống sai lệch.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="590" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Lộ trình backtest DOL: bốn nghiên cứu A → D và các hàng rào chống sai lệch</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Chỉ giữ quy tắc nào cải thiện kết quả NGOÀI MẪU. HYP-DOL-001..010: UNTESTED.</text>
<rect x="24" y="76" width="172" height="262" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="76" width="172" height="50" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.2"/>
<circle cx="44" cy="101" r="12" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="106" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>
<text x="64" y="96" font-size="11" fill="#1F2937" font-weight="700">Chỉ dự báo, không</text>
<text x="64" y="110.9" font-size="11" fill="#1F2937" font-weight="700">vào lệnh</text>
<text x="36" y="146" font-size="10.5" fill="#4B5563">Đơn vị: 1 ngày; điền thẻ</text>
<text x="36" y="160.2" font-size="10.5" fill="#4B5563">DOL lúc 11:00 VN.</text>
<text x="36" y="179.39999999999998" font-size="10.5" fill="#4B5563">Kết quả: dol_first trong</text>
<text x="36" y="193.59999999999997" font-size="10.5" fill="#4B5563">horizon.</text>
<text x="36" y="212.79999999999995" font-size="10.5" fill="#4B5563">NQ, EURUSD, GBPUSD,</text>
<text x="36" y="226.99999999999994" font-size="10.5" fill="#4B5563">XAUUSD; ≥ 2 năm;</text>
<text x="36" y="241.19999999999993" font-size="10.5" fill="#4B5563">train/test theo thời</text>
<text x="36" y="255.39999999999992" font-size="10.5" fill="#4B5563">gian.</text>
<text x="36" y="274.5999999999999" font-size="10.5" fill="#4B5563">Chỉ số: tỷ lệ chạm, edge</text>
<text x="36" y="288.7999999999999" font-size="10.5" fill="#4B5563">vs baseline, Brier score.</text>
<line x1="197" y1="101" x2="203" y2="101" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arM)"/>
<rect x="204" y="76" width="172" height="262" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="204" y="76" width="172" height="50" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.2"/>
<circle cx="224" cy="101" r="12" fill="#7C3AED" stroke="none" stroke-width="1"/>
<text x="224" y="106" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">B</text>
<text x="244" y="96" font-size="11" fill="#1F2937" font-weight="700">Ablation: thêm dần</text>
<text x="244" y="110.9" font-size="11" fill="#1F2937" font-weight="700">từng lớp</text>
<text x="216" y="146" font-size="10.5" fill="#4B5563">1. Chỉ khoảng cách</text>
<text x="216" y="165.2" font-size="10.5" fill="#4B5563">2. + trạng thái con lắc</text>
<text x="216" y="184.39999999999998" font-size="10.5" fill="#4B5563">3. + displacement</text>
<text x="216" y="203.59999999999997" font-size="10.5" fill="#4B5563">4. + premium/discount</text>
<text x="216" y="222.79999999999995" font-size="10.5" fill="#4B5563">5. + đường đi</text>
<text x="216" y="241.99999999999994" font-size="10.5" fill="#4B5563">6. + thời gian</text>
<line x1="377" y1="101" x2="383" y2="101" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arM)"/>
<rect x="384" y="76" width="172" height="262" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="384" y="76" width="172" height="50" rx="8" fill="#FCEBE4" stroke="#D85A30" stroke-width="1.2"/>
<circle cx="404" cy="101" r="12" fill="#D85A30" stroke="none" stroke-width="1"/>
<text x="404" y="106" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="424" y="96" font-size="11" fill="#1F2937" font-weight="700">Các bẫy</text>
<text x="396" y="146" font-size="10.5" fill="#4B5563">unswept_pool_sl_side (cả</text>
<text x="396" y="160.2" font-size="10.5" fill="#4B5563">thắng lẫn thua).</text>
<text x="396" y="179.39999999999998" font-size="10.5" fill="#4B5563">Buffer SL: 0 / 0.1 / 0.2</text>
<text x="396" y="193.59999999999997" font-size="10.5" fill="#4B5563">ATR.</text>
<text x="396" y="212.79999999999995" font-size="10.5" fill="#4B5563">Near-miss của TP.</text>
<text x="396" y="231.99999999999994" font-size="10.5" fill="#4B5563">MSS cùng vs ngược chiều</text>
<text x="396" y="246.19999999999993" font-size="10.5" fill="#4B5563">khung lớn.</text>
<text x="396" y="265.3999999999999" font-size="10.5" fill="#4B5563">Điểm độ hiển nhiên 0–4</text>
<text x="396" y="279.5999999999999" font-size="10.5" fill="#4B5563">(HYP-008).</text>
<text x="396" y="298.7999999999999" font-size="10.5" fill="#4B5563">Cửa sổ tin ±5/10/15/30</text>
<text x="396" y="312.9999999999999" font-size="10.5" fill="#4B5563">phút.</text>
<line x1="557" y1="101" x2="563" y2="101" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arM)"/>
<rect x="564" y="76" width="172" height="262" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="564" y="76" width="172" height="50" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<circle cx="584" cy="101" r="12" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="584" y="106" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">D</text>
<text x="604" y="96" font-size="11" fill="#1F2937" font-weight="700">Vào lệnh thật theo</text>
<text x="604" y="110.9" font-size="11" fill="#1F2937" font-weight="700">mô hình</text>
<text x="576" y="146" font-size="10.5" fill="#4B5563">ICT 2022 CÓ bộ lọc DOL</text>
<text x="576" y="160.2" font-size="10.5" fill="#4B5563">v0.2 vs KHÔNG.</text>
<text x="576" y="179.39999999999998" font-size="10.5" fill="#4B5563">Expectancy (R), profit</text>
<text x="576" y="193.59999999999997" font-size="10.5" fill="#4B5563">factor, max drawdown.</text>
<text x="576" y="212.79999999999995" font-size="10.5" fill="#4B5563">MAE/MFE, chuỗi thua dài</text>
<text x="576" y="226.99999999999994" font-size="10.5" fill="#4B5563">nhất.</text>
<text x="24" y="366" font-size="13" fill="#1F2937" font-weight="700">Hàng rào chống sai lệch (áp dụng cho cả bốn nghiên cứu)</text>
<rect x="24" y="378" width="712" height="40" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="395" font-size="11" fill="#DC2626" font-weight="700">Lookahead</text>
<text x="160" y="395" font-size="10.5" fill="#4B5563">Swing fractal k nến chỉ được xác nhận sau k nến; FVG chỉ tồn tại sau khi nến thứ 3 đóng; EQH chỉ</text>
<text x="160" y="409.2" font-size="10.5" fill="#4B5563">tồn tại sau khi đỉnh thứ 2 hình thành và giá đã rời đi; close D1 chỉ có khi nến D1 đóng.</text>
<rect x="24" y="424" width="712" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="441" font-size="11" fill="#DC2626" font-weight="700">Hindsight</text>
<text x="160" y="441" font-size="10.5" fill="#4B5563">Điền thẻ DOL TRƯỚC khi bấm play.</text>
<rect x="24" y="456" width="712" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="473" font-size="11" fill="#DC2626" font-weight="700">Chọn mẫu</text>
<text x="160" y="473" font-size="10.5" fill="#4B5563">Ghi lại MỌI ngày, không chỉ ngày có setup đẹp; nếu backtest tay thì chọn ngày ngẫu nhiên.</text>
<rect x="24" y="488" width="712" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="505" font-size="11" fill="#DC2626" font-weight="700">Dữ liệu</text>
<text x="160" y="505" font-size="10.5" fill="#4B5563">Một feed, một định nghĩa ngày, xử lý roll của NQ.</text>
<rect x="24" y="520" width="712" height="40" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="537" font-size="11" fill="#DC2626" font-weight="700">Kiểm định nhiều lần</text>
<text x="160" y="537" font-size="10.5" fill="#4B5563">Thử 20 biến thể: 64% có ít nhất một biến thể “có ý nghĩa” chỉ vì may. Giữ một tập dữ liệu khóa, mở</text>
<text x="160" y="551.2" font-size="10.5" fill="#4B5563">đúng một lần.</text>
</svg>
