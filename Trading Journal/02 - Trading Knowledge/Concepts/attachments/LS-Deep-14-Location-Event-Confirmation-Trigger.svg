<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Location ≠ Liquidity Event ≠ Confirmation ≠ Entry Trigger ≠ Invalidation</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Năm thành phần trả lời năm câu hỏi khác nhau. Gộp chúng lại ("sweep là entry") là lỗi phổ biến nhất khi dùng liquidity sweep.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi thành phần có thể đúng trong khi thành phần kế tiếp sai — và mỗi cái cần được ghi riêng trong journal.</text>
<rect x="34.0" y="104.0" width="172.0" height="430.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="120.0" y="128.0" font-size="12.2" font-weight="700" fill="#334155" text-anchor="middle">1 · LOCATION</text>
<text x="120.0" y="150.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="middle" font-style="italic">"Ở đâu đáng chú ý?"</text>
<line x1="46.0" y1="164.0" x2="194.0" y2="164.0" stroke="#475569" stroke-width="0.8"/>
<text x="46.0" y="186.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Ví dụ</text>
<text x="46.0" y="204.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">HTF POI: FVG / OB D1–H1,</text>
<text x="46.0" y="219.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">discount/premium, ERL</text>
<text x="46.0" y="258.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Timeframe</text>
<text x="46.0" y="276.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">D1 / H1</text>
<text x="46.0" y="310.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Đo bằng</text>
<text x="46.0" y="328.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">vùng giá ex-ante</text>
<text x="46.0" y="362.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">Sai thế nào</text>
<text x="46.0" y="380.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">POI chọn sau khi thấy</text>
<text x="46.0" y="395.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">phản ứng (hindsight)</text>
<text x="120.0" y="470.0" font-size="10.2" font-weight="700" fill="#334155" text-anchor="middle">Có POI ≠ có setup</text>
<text x="120.0" y="500.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">field: poi_type</text>
<line x1="207.0" y1="320.0" x2="219.0" y2="320.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="220.0" y="104.0" width="172.0" height="430.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
<text x="306.0" y="128.0" font-size="12.2" font-weight="700" fill="#B45309" text-anchor="middle">2 · LIQUIDITY EVENT</text>
<text x="306.0" y="150.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="middle" font-style="italic">"Điều gì vừa xảy ra?"</text>
<line x1="232.0" y1="164.0" x2="380.0" y2="164.0" stroke="#D97706" stroke-width="0.8"/>
<text x="232.0" y="186.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Ví dụ</text>
<text x="232.0" y="204.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">mức ex-ante bị xuyên;</text>
<text x="232.0" y="219.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">E2/E3/E4… (taxonomy)</text>
<text x="232.0" y="258.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Timeframe</text>
<text x="232.0" y="276.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">khung của MỨC</text>
<text x="232.0" y="310.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Đo bằng</text>
<text x="232.0" y="328.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">high/low vs L, k nến</text>
<text x="232.0" y="362.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">Sai thế nào</text>
<text x="232.0" y="380.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">gọi mọi wick là sweep;</text>
<text x="232.0" y="395.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">mức không có trong list</text>
<text x="306.0" y="470.0" font-size="10.2" font-weight="700" fill="#B45309" text-anchor="middle">Có sweep ≠ có đảo chiều</text>
<text x="306.0" y="500.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">field: event_code</text>
<line x1="393.0" y1="320.0" x2="405.0" y2="320.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="406.0" y="104.0" width="172.0" height="430.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
<text x="492.0" y="128.0" font-size="12.2" font-weight="700" fill="#6D28D9" text-anchor="middle">3 · CONFIRMATION</text>
<text x="492.0" y="150.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="middle" font-style="italic">"Phản ứng có hậu quả không?"</text>
<line x1="418.0" y1="164.0" x2="566.0" y2="164.0" stroke="#7C3AED" stroke-width="0.8"/>
<text x="418.0" y="186.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Ví dụ</text>
<text x="418.0" y="204.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">rejection + MSS +</text>
<text x="418.0" y="219.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">displacement trong m nến</text>
<text x="418.0" y="258.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Timeframe</text>
<text x="418.0" y="276.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">H1 → M5</text>
<text x="418.0" y="310.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Đo bằng</text>
<text x="418.0" y="328.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">swing bị phá, |body|/ATR</text>
<text x="418.0" y="362.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">Sai thế nào</text>
<text x="418.0" y="380.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">MSS phá swing vi mô</text>
<text x="418.0" y="395.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">(không có ý nghĩa HTF)</text>
<text x="492.0" y="470.0" font-size="10.2" font-weight="700" fill="#6D28D9" text-anchor="middle">Có MSS ≠ có edge</text>
<text x="492.0" y="500.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">field: mss_tf, disp_atr</text>
<line x1="579.0" y1="320.0" x2="591.0" y2="320.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="592.0" y="104.0" width="172.0" height="430.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
<text x="678.0" y="128.0" font-size="12.2" font-weight="700" fill="#15803D" text-anchor="middle">4 · ENTRY TRIGGER</text>
<text x="678.0" y="150.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="middle" font-style="italic">"Vào ở đâu, khi nào?"</text>
<line x1="604.0" y1="164.0" x2="752.0" y2="164.0" stroke="#16A34A" stroke-width="0.8"/>
<text x="604.0" y="186.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Ví dụ</text>
<text x="604.0" y="204.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">retrace vào FVG/OB của</text>
<text x="604.0" y="219.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">leg displacement</text>
<text x="604.0" y="258.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Timeframe</text>
<text x="604.0" y="276.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">M5 / M1</text>
<text x="604.0" y="310.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Đo bằng</text>
<text x="604.0" y="328.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">giá chạm vùng, giờ</text>
<text x="604.0" y="362.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">Sai thế nào</text>
<text x="604.0" y="380.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">không khớp (W5, EC7);</text>
<text x="604.0" y="395.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">chase khi không retrace</text>
<text x="678.0" y="470.0" font-size="10.2" font-weight="700" fill="#15803D" text-anchor="middle">Có entry ≠ được khớp</text>
<text x="678.0" y="500.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">field: entry_type</text>
<line x1="765.0" y1="320.0" x2="777.0" y2="320.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="778.0" y="104.0" width="172.0" height="430.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="864.0" y="128.0" font-size="12.2" font-weight="700" fill="#B91C1C" text-anchor="middle">5 · INVALIDATION</text>
<text x="864.0" y="150.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="middle" font-style="italic">"Điều gì chứng minh tôi sai?"</text>
<line x1="790.0" y1="164.0" x2="938.0" y2="164.0" stroke="#DC2626" stroke-width="0.8"/>
<text x="790.0" y="186.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Ví dụ</text>
<text x="790.0" y="204.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">vượt cực trị sweep + buffer;</text>
<text x="790.0" y="219.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">acceptance lại bên kia L</text>
<text x="790.0" y="258.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Timeframe</text>
<text x="790.0" y="276.0" font-size="10.4" font-weight="600" fill="#374151" text-anchor="start">khung setup</text>
<text x="790.0" y="310.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">Đo bằng</text>
<text x="790.0" y="328.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">giá, thời gian (timer)</text>
<text x="790.0" y="362.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">Sai thế nào</text>
<text x="790.0" y="380.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">stop sát wick (double</text>
<text x="790.0" y="395.0" font-size="10.1" font-weight="400" fill="#B91C1C" text-anchor="start">sweep); dời stop cảm tính</text>
<text x="864.0" y="470.0" font-size="10.2" font-weight="700" fill="#B91C1C" text-anchor="middle">Có stop ≠ stop đúng chỗ</text>
<text x="864.0" y="500.0" font-size="9.6" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">field: invalid_rule</text>
</svg>