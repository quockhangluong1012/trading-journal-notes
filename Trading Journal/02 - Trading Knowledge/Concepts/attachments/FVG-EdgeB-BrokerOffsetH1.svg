<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">Chart offset broker — H1 lệch 1 giờ tạo/xóa FVG khác nhau</text>
  <text x="32" y="66" font-size="15" fill="#787b86">Cùng dữ liệu M1 gộp thành nến H1 theo hai mốc đóng nến khác nhau (GMT+2 vs GMT+3)</text>

  <line x1="640" y1="90" x2="640" y2="700" stroke="#2a2e39" stroke-width="1"/>

  <!-- LEFT: broker A candles closing on :00 -->
  <rect x="40" y="100" width="220" height="26" rx="5" fill="#1c2030" stroke="#4a90d9" stroke-opacity="0.6"/>
  <text x="52" y="118" font-size="14" fill="#4a90d9">Broker A — dong nen 00:00 server</text>

  <g>
    <rect x="80" y="380" width="30" height="60" fill="#26a69a" rx="1"/><line x1="95" y1="365" x2="95" y2="450" stroke="#26a69a"/>
    <rect x="130" y="300" width="30" height="90" fill="#26a69a" rx="1"/><line x1="145" y1="285" x2="145" y2="400" stroke="#26a69a"/>
    <rect x="180" y="340" width="30" height="40" fill="#ef5350" rx="1"/><line x1="195" y1="325" x2="195" y2="390" stroke="#ef5350"/>
  </g>
  <!-- FVG forms here: gap between candle1 high(380) and candle3 low(380) none... show valid FVG -->
  <rect x="70" y="300" width="150" height="40" fill="#26a69a" opacity="0.16" stroke="#26a69a" stroke-dasharray="5 4" stroke-opacity="0.6"/>
  <text x="76" y="292" font-size="13" fill="#26a69a">FVG H1 HOP LE (gap that giua n1-n3)</text>

  <text x="60" y="500" font-size="13" fill="#d1d4dc">Nen dong dung mac dinh gop 3 nen</text>
  <text x="60" y="520" font-size="13" fill="#d1d4dc">M1 thanh 1 khoi displacement lien tuc</text>

  <!-- RIGHT: broker B candles closing 1hr offset -->
  <rect x="700" y="100" width="220" height="26" rx="5" fill="#1c2030" stroke="#b48ead" stroke-opacity="0.6"/>
  <text x="712" y="118" font-size="14" fill="#b48ead">Broker B — dong nen le 1 gio (GMT+3)</text>

  <g>
    <rect x="740" y="410" width="30" height="70" fill="#26a69a" rx="1"/><line x1="755" y1="395" x2="755" y2="490" stroke="#26a69a"/>
    <rect x="790" y="330" width="30" height="60" fill="#26a69a" rx="1"/><line x1="805" y1="315" x2="805" y2="400" stroke="#26a69a"/>
    <rect x="840" y="300" width="30" height="70" fill="#ef5350" rx="1"/><line x1="855" y1="285" x2="855" y2="380" stroke="#ef5350"/>
  </g>
  <!-- because bar boundaries shifted, the gap is filled inside a single differently-composed candle => no FVG -->
  <rect x="730" y="330" width="150" height="0" fill="none"/>
  <text x="730" y="292" font-size="13" fill="#ff6b6b">KHONG CO FVG — cung du lieu M1 nhung</text>
  <text x="730" y="312" font-size="13" fill="#ff6b6b">chia lai thanh nen khac, gap bi "nuot"</text>
  <text x="730" y="332" font-size="13" fill="#ff6b6b">vao than nen giua</text>

  <rect x="40" y="560" width="1180" height="130" fill="#1c2030" stroke="#ff9800" stroke-dasharray="6 4"/>
  <text x="56" y="588" font-size="15" font-weight="bold" fill="#ff9800">Cung mot dot displacement, hai ket qua FVG khac nhau</text>
  <text x="56" y="612" font-size="13" fill="#d1d4dc">Vi tri bien nen H1 (server time offset GMT+2/+3, DST) quyet dinh cach 60 nen M1 duoc gop —</text>
  <text x="56" y="632" font-size="13" fill="#d1d4dc">gap co the "hien ra" o broker nay va "bien mat" o broker kia du cung mot nguon du lieu goc.</text>
  <text x="56" y="654" font-size="13" fill="#f2c94c">Rule: xac nhan FVG HTF quan trong tren it nhat 2 nguon du lieu / server-time truoc khi tin.</text>

  <text x="60" y="700" font-size="13" fill="#565b66">Anh huong manh nhat quanh DST chuyen gio (thang 3 va thang 11).</text>
</svg>
