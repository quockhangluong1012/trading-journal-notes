<svg viewBox="0 0 1000 520" width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="518" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Hai "ống kính" cùng nhìn một cái đỉnh — và chúng có thể không đồng ý</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ống kính VỊ TRÍ so với hàng xóm. Ống kính CHỨC NĂNG (ICT 2022, tập 12 — theo ghi chép lại) hỏi: đỉnh đó đã làm gì?</text>
<rect x="827.0" y="22.0" width="145.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="899.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">KHÁC BIỆT NGUỒN</text>
<rect x="28.0" y="84.0" width="560.0" height="410.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="231.1" y="261.5" width="195.7" height="34.4" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="434.9" y="282.7" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="start">khoảng trống giá (FVG)</text>
<polyline points="68.0,151.5 136.6,247.8 205.1,206.5 273.7,371.5 342.3,275.2 410.9,330.2 479.4,302.8 548.0,426.5" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="68.0" cy="151.5" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="68.0" y="137.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">đỉnh A</text>
<circle cx="205.1" cy="206.5" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="205.1" y="192.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">đỉnh B</text>
<circle cx="342.3" cy="275.2" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="342.3" cy="275.2" r="2.5" fill="#2563EB" stroke="none" stroke-width="2"/>
<text x="342.3" y="245.2" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">đỉnh C</text>
<circle cx="479.4" cy="302.8" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="479.4" y="288.8" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">đỉnh D</text>
<text x="277.4" y="289.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">rơi mạnh</text>
<rect x="604.0" y="96.0" width="368.0" height="97.4" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="604.0" y="96.0" width="5.0" height="97.4" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="618.0" y="115.5" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">Ống kính VỊ TRÍ (luật đệ quy)</text>
<text x="618.0" y="132.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Luật: đỉnh nhỏ cao hơn hai đỉnh nhỏ bên cạnh.</text>
<text x="618.0" y="148.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">C thấp hơn B (bên trái).</text>
<text x="618.0" y="165.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">→ C chỉ là STH.</text>
<text x="618.0" y="182.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Rõ ràng, lập trình được, không cần đoán.</text>
<rect x="604.0" y="208.0" width="368.0" height="97.4" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="604.0" y="208.0" width="5.0" height="97.4" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="618.0" y="227.5" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">Ống kính CHỨC NĂNG</text>
<text x="618.0" y="244.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ghi chép tập 12: đỉnh hình thành khi giá quay lại</text>
<text x="618.0" y="260.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lấp một khoảng trống giá được coi là ITH.</text>
<text x="618.0" y="277.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">C chui vào FVG rồi quay đầu → C là ITH.</text>
<text x="618.0" y="294.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có nghĩa hơn, nhưng phải nhận diện FVG trước.</text>
<rect x="604.0" y="320.0" width="368.0" height="97.4" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="604.0" y="320.0" width="5.0" height="97.4" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="618.0" y="339.5" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start">Kết luận trung thực</text>
<text x="618.0" y="356.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hai cách có thể cho hai nhãn khác nhau.</text>
<text x="618.0" y="372.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đừng tự gộp. Chọn MỘT cách làm luật chính,</text>
<text x="618.0" y="389.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ghi cách kia thành "ghi chú phụ".</text>
<text x="618.0" y="406.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Note này dùng ống kính vị trí làm luật chính.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
