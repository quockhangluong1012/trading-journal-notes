<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity Run — tiêu chí quan sát được, và các dấu hiệu run có thể đang kết thúc</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Run được định nghĩa bằng hành vi (nhiều mức cùng phía, acceptance, retracement nông), không bằng lời kể "giá đang chạy lấy liquidity".</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Không dấu hiệu kết thúc nào là đủ một mình; chúng là bằng chứng cộng dồn và phải được ghi kèm thời điểm biết (known_at).</text>
<rect x="34.0" y="100.0" width="560.0" height="470.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="90.8" y1="438.0" x2="141.2" y2="438.0" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="86.8" y="432.0" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="end">L1</text>
<line x1="145.6" y1="382.4" x2="195.9" y2="382.4" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="141.6" y="376.4" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="end">L2</text>
<line x1="200.3" y1="326.8" x2="250.7" y2="326.8" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="196.3" y="320.8" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="end">L3</text>
<line x1="255.1" y1="271.2" x2="305.4" y2="271.2" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="251.1" y="265.2" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="end">L4</text>
<line x1="309.8" y1="215.6" x2="371.1" y2="215.6" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="305.8" y="209.6" font-size="9.8" font-weight="700" fill="#B45309" text-anchor="end">L5</text>
<path d="M58.0,502.9 L90.8,438.0 L112.7,465.9 L145.6,382.4 L167.5,410.2 L200.3,326.8 L222.2,354.6 L255.1,271.2 L276.9,303.7 L309.8,215.6 L331.7,248.0 L364.5,197.1 L375.5,234.1 L391.9,248.0 L397.4,252.7 L419.3,285.1 L452.1,326.8" stroke="#111827" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="112.7" y="482.9" font-size="9.4" font-weight="600" fill="#1D4ED8" text-anchor="middle">r1 43%</text>
<text x="167.5" y="427.2" font-size="9.4" font-weight="600" fill="#1D4ED8" text-anchor="middle">r2 33%</text>
<text x="222.2" y="371.6" font-size="9.4" font-weight="600" fill="#1D4ED8" text-anchor="middle">r3 33%</text>
<text x="276.9" y="320.7" font-size="9.4" font-weight="600" fill="#1D4ED8" text-anchor="middle">r4 39%</text>
<text x="331.7" y="265.0" font-size="9.4" font-weight="600" fill="#1D4ED8" text-anchor="middle">r5 37%</text>
<circle cx="364.5" cy="197.1" r="5" fill="#DC2626"/>
<text x="372.5" y="189.1" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">lấy L5 nông rồi REJECTION</text>
<line x1="331.7" y1="248.0" x2="441.2" y2="248.0" stroke="#6D28D9" stroke-width="1.3" stroke-dasharray="2 3"/>
<text x="447.2" y="252.0" font-size="9.4" font-weight="700" fill="#6D28D9" text-anchor="start">HL gần nhất</text>
<circle cx="391.9" cy="248.0" r="5" fill="#7C3AED"/>
<text x="409.4" y="222.6" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="start">MSS ngược</text>
<text x="409.4" y="235.6" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="start">→ run có thể đã kết thúc</text>
<text x="48.0" y="124.0" font-size="10.4" font-weight="700" fill="#15803D" text-anchor="start">Run: L1 → L2 → L3 → L4 bị lấy, acceptance mỗi mức</text>
<text x="48.0" y="139.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">r_i = retracement sau khi lấy mức, theo % leg trước đó</text>
<rect x="610.0" y="100.0" width="336.0" height="182.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
<text x="622.0" y="122.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">Tiêu chí RUN v0.1 (HEURISTIC)</text>
<text x="622.0" y="139.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">1. ≥ 2 mức CÙNG PHÍA bị lấy, theo thứ tự thời gian</text>
<text x="622.0" y="153.8" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">2. mỗi mức: acceptance (≥2 close bên kia hoặc</text>
<text x="622.0" y="168.6" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">    close &gt; L + 0.5·ATR) trước mức kế tiếp</text>
<text x="622.0" y="183.4" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">3. retracement giữa hai lần lấy &lt; 50% leg</text>
<text x="622.0" y="198.2" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">4. không có sự kiện cấu trúc phía đối diện</text>
<text x="622.0" y="212.9" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">    (mất HL/LH gần nhất ở khung run)</text>
<rect x="610.0" y="294.0" width="336.0" height="276.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="622.0" y="316.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Dấu hiệu run có thể kết thúc</text>
<text x="622.0" y="333.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• tại một mức: rejection thay vì acceptance (T3)</text>
<text x="622.0" y="347.8" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• MSS ngược ở khung run (mất HL gần nhất)</text>
<text x="622.0" y="362.6" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• retracement sâu dần (r_i tăng) [HYPOTHESIS]</text>
<text x="622.0" y="377.4" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• displacement theo hướng run nhỏ dần (|body|/ATR)</text>
<text x="622.0" y="392.2" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• đã tới DOL / ERL của range context</text>
<text x="622.0" y="406.9" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• opposing liquidity ngay sau lưng bị lấy</text>
<text x="622.0" y="421.7" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• thời gian: hết phiên / killzone</text>
<text x="622.0" y="436.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="622.0" y="451.3" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Không dấu hiệu nào đủ một mình; LS-Sim-06:</text>
<text x="622.0" y="466.1" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">trên random walk 43% run dài ≥ 3 mức.</text>
</svg>