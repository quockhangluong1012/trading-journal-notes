<svg viewBox="0 0 980 580" width="980" height="580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="580" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Ba loại lệnh cơ bản — và mỗi loại làm gì với liquidity</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Market = tiêu thụ thanh khoản ngay. Limit = cung cấp thanh khoản, nằm chờ. Stop = ẩn cho tới khi chạm mức, rồi biến thành market.</text>
<rect x="26.0" y="74.0" width="296.0" height="246.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<rect x="26.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<rect x="27.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#DBEAFE" stroke="#DBEAFE" stroke-width="0"/>
<text x="40.0" y="97.0" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="start">MARKET ORDER</text>
<text x="40.0" y="132.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start" font-style="italic">"Mua ngay! Giá nào cũng được."</text>
<text x="40.0" y="160.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Khớp NGAY với lệnh chờ tốt nhất</text>
<text x="40.0" y="177.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đang có ở phía đối diện.</text>
<text x="40.0" y="194.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="40.0" y="212.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Với liquidity:</text>
<text x="40.0" y="229.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">TIÊU THỤ (taker) — ăn bớt lệnh</text>
<text x="40.0" y="247.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chờ trong sổ.</text>
<text x="40.0" y="264.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="40.0" y="281.8" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Rủi ro:</text>
<text x="40.0" y="299.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trượt giá nếu sổ mỏng.</text>
<rect x="342.0" y="74.0" width="296.0" height="246.0" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
<rect x="342.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
<rect x="343.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#DCFCE7" stroke="#DCFCE7" stroke-width="0"/>
<text x="356.0" y="97.0" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">LIMIT ORDER</text>
<text x="356.0" y="132.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start" font-style="italic">"Tôi chỉ mua nếu giá ≤ X. Tôi chờ."</text>
<text x="356.0" y="160.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nằm trong sổ lệnh cho tới khi có</text>
<text x="356.0" y="177.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">người chấp nhận giá X (hoặc bị hủy).</text>
<text x="356.0" y="194.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="356.0" y="212.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Với liquidity:</text>
<text x="356.0" y="229.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">CUNG CẤP (maker) — chính nó LÀ</text>
<text x="356.0" y="247.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thanh khoản cho người khác.</text>
<text x="356.0" y="264.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="356.0" y="281.8" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Rủi ro:</text>
<text x="356.0" y="299.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">có thể không bao giờ được khớp.</text>
<rect x="658.0" y="74.0" width="296.0" height="246.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="658.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="659.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#FEF3C7" stroke="#FEF3C7" stroke-width="0"/>
<text x="672.0" y="97.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">STOP ORDER</text>
<text x="672.0" y="132.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start" font-style="italic">"Nếu giá chạm X, kích hoạt tôi."</text>
<text x="672.0" y="160.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không nằm trong sổ như limit; chờ</text>
<text x="672.0" y="177.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">giá chạm X rồi gửi đi như market.</text>
<text x="672.0" y="194.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="672.0" y="212.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Với liquidity:</text>
<text x="672.0" y="229.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lúc chờ: ẨN. Lúc kích hoạt:</text>
<text x="672.0" y="247.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">TIÊU THỤ — như một lệnh market.</text>
<text x="672.0" y="264.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="672.0" y="281.8" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Hệ quả:</text>
<text x="672.0" y="299.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nhiều stop cùng chỗ → dây chuyền.</text>
<rect x="26.0" y="336.0" width="928.0" height="222.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="360.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Các lệnh thường nằm ở đâu so với giá hiện tại?</text>
<line x1="470.0" y1="374.0" x2="470.0" y2="546.0" stroke="#334155" stroke-width="2"/>
<rect x="400.0" y="446.0" width="140.0" height="26.0" rx="4" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="470.0" y="464.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">GIÁ HIỆN TẠI 100</text>
<text x="452.0" y="400.0" font-size="12" font-weight="700" fill="#334155" text-anchor="end">105 — đỉnh cũ</text>
<line x1="460.0" y1="396.0" x2="480.0" y2="396.0" stroke="#334155" stroke-width="2"/>
<text x="492.0" y="388.0" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="start">SELL LIMIT (người muốn bán khi giá lên cao) — cung cấp thanh khoản</text>
<text x="492.0" y="406.0" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">BUY STOP ngay trên đỉnh (stop-loss của người short + lệnh breakout) — ẩn</text>
<text x="492.0" y="428.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">BUY LIMIT không nằm ở đây — mua limit cao hơn giá hiện tại sẽ khớp ngay</text>
<text x="452.0" y="526.0" font-size="12" font-weight="700" fill="#334155" text-anchor="end">95 — đáy cũ</text>
<line x1="460.0" y1="522.0" x2="480.0" y2="522.0" stroke="#334155" stroke-width="2"/>
<text x="492.0" y="500.0" font-size="11.5" font-weight="600" fill="#15803D" text-anchor="start">BUY LIMIT (người muốn mua khi giá rẻ) — cung cấp thanh khoản</text>
<text x="492.0" y="518.0" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">SELL STOP ngay dưới đáy (stop-loss của người long + lệnh breakdown) — ẩn</text>
<text x="492.0" y="538.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Lệnh MARKET không "nằm" ở đâu cả — nó khớp ngay khi gửi</text>
<text x="40.0" y="390.0" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Tầng 2 (người mới):</text>
<text x="40.0" y="406.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Limit = cái bạn THẤY</text>
<text x="40.0" y="423.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">trong sổ lệnh (nếu sàn</text>
<text x="40.0" y="440.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">công bố). Stop = cái bạn</text>
<text x="40.0" y="456.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">KHÔNG thấy cho tới khi</text>
<text x="40.0" y="473.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nó được kích hoạt.</text>
<text x="40.0" y="490.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="40.0" y="506.7" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">Đây là lý do mọi câu</text>
<text x="40.0" y="523.4" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">"liquidity nằm trên đỉnh"</text>
<text x="40.0" y="540.1" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">đều là SUY LUẬN.</text>
</svg>
