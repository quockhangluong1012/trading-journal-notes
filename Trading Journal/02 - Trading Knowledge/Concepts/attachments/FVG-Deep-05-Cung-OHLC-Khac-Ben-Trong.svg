<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cùng một OHLC, hai câu chuyện bên trong nến 2 — chart nến KHÔNG cho biết điều gì</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Hai đường đi trong nến 2 dưới đây cho ra CÙNG Open/High/Low/Close, cùng một FVG trên chart. Nhưng chất lượng 'imbalance' rất khác nhau.</text>
<rect x="30.0" y="96.0" width="450.0" height="342.0" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
<text x="46.0" y="120.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">Đường A — một mạch, không dừng</text>
<rect x="50.0" y="213.5" width="410.0" height="53.0" rx="0" fill="#16A34A" fill-opacity="0.16"/>
<line x1="50.0" y1="213.5" x2="460.0" y2="213.5" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="50.0" y1="266.4" x2="460.0" y2="266.4" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="82.0" y1="266.4" x2="82.0" y2="319.4" stroke="#16A34A" stroke-width="1.6"/>
<rect x="70.0" y="277.0" width="24.0" height="15.9" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<line x1="132.0" y1="176.4" x2="132.0" y2="282.3" stroke="#16A34A" stroke-width="1.6"/>
<rect x="120.0" y="187.0" width="24.0" height="90.1" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<line x1="182.0" y1="155.2" x2="182.0" y2="213.5" stroke="#16A34A" stroke-width="1.6"/>
<rect x="170.0" y="165.8" width="24.0" height="21.2" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<text x="132.0" y="350.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">OHLC giống hệt</text>
<rect x="224.0" y="140.0" width="232.0" height="196.0" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="230.0" y="152.0" font-size="9.6" font-weight="600" fill="#6B7280" text-anchor="start">phóng to nến 2 (đường đi theo phút):</text>
<path d="M230.0,277.0 L248.3,279.7 L266.7,282.3 L285.0,271.7 L303.3,255.8 L321.7,239.9 L340.0,224.1 L358.3,208.2 L376.7,192.3 L395.0,179.0 L413.3,176.4 L431.7,181.7 L450.0,187.0" stroke="#15803D" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="46.0" y="370.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Giá đi xuyên 100–102 trong ~3 phút, không quay đầu.</text>
<text x="46.0" y="387.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Nhiều khả năng: dòng lệnh chủ động một chiều,</text>
<text x="46.0" y="404.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">sổ lệnh mỏng ở các mức này.</text>
<text x="46.0" y="421.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ 'imbalance' theo nghĩa thông thường.</text>
<rect x="500.0" y="96.0" width="450.0" height="342.0" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="516.0" y="120.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">Đường B — dừng lâu GIỮA vùng rồi mới đi</text>
<rect x="520.0" y="213.5" width="410.0" height="53.0" rx="0" fill="#16A34A" fill-opacity="0.16"/>
<line x1="520.0" y1="213.5" x2="930.0" y2="213.5" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="520.0" y1="266.4" x2="930.0" y2="266.4" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
