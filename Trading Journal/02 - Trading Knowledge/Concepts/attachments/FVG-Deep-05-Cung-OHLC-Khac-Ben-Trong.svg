<rect x="540.0" y="277.0" width="24.0" height="15.9" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<line x1="602.0" y1="176.4" x2="602.0" y2="282.3" stroke="#16A34A" stroke-width="1.6"/>
<rect x="590.0" y="187.0" width="24.0" height="90.1" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<line x1="652.0" y1="155.2" x2="652.0" y2="213.5" stroke="#16A34A" stroke-width="1.6"/>
<rect x="640.0" y="165.8" width="24.0" height="21.2" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<text x="602.0" y="350.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">OHLC giống hệt</text>
<rect x="694.0" y="140.0" width="232.0" height="196.0" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="700.0" y="152.0" font-size="9.6" font-weight="600" fill="#6B7280" text-anchor="start">phóng to nến 2 (đường đi theo phút):</text>
<path d="M700.0,277.0 L713.8,282.3 L727.5,269.1 L741.2,250.5 L755.0,234.6 L768.8,245.2 L782.5,232.0 L796.2,242.6 L810.0,229.4 L823.8,239.9 L837.5,226.7 L851.2,237.3 L865.0,224.1 L878.8,202.9 L892.5,181.7 L906.2,176.4 L920.0,187.0" stroke="#B45309" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="516.0" y="370.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Giá đi qua lại 100.6–101.6 khá lâu rồi mới bứt lên.</text>
<text x="516.0" y="387.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Vùng 'FVG' thực ra có giao dịch HAI CHIỀU đáng kể</text>
<text x="516.0" y="404.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">— nhưng OHLC của nến M15 giống hệt đường A.</text>
<text x="516.0" y="421.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ chỉ footprint / LTF / tick mới phân biệt được.</text>
<rect x="30.0" y="450.0" width="920.0" height="136.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/>
<text x="46.0" y="474.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">Chart cho biết (OBSERVABLE)</text>
<text x="46.0" y="496.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">• biên của 3 nến, vùng [High₁, Low₃], kích thước so với ATR</text>
<text x="46.0" y="515.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">• nến 2 đã đi qua toàn vùng trong một khung thời gian</text>
<text x="46.0" y="534.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">• thời điểm vùng được biết: đóng cửa nến 3</text>
<text x="46.0" y="553.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">• giá có quay lại chạm / lấp / đóng cửa xuyên qua hay không</text>
<text x="500.0" y="474.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">Chart KHÔNG cho biết</text>
<text x="500.0" y="496.0" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">• volume và thời gian ở từng mức bên trong nến 2</text>
<text x="500.0" y="515.0" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">• ai đã giao dịch, lệnh chủ động hay bị động, ý định của họ</text>
<text x="500.0" y="534.0" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">• còn lệnh chờ nào 'bị bỏ lại' trong vùng hay không</text>
<text x="500.0" y="553.0" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">• cú di chuyển là thông tin (giữ giá) hay thanh khoản (hồi lại)</text>
</svg>