<svg viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="623.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Ba câu hỏi khác nhau: Ở ĐÂU? — CẤU TRÚC ĐÃ ĐỔI CHƯA? — VÀO LỆNH KHI NÀO?</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">CHoCH chỉ trả lời câu hỏi thứ hai. Gộp ba câu làm một là lý do phổ biến nhất của việc “thấy CHoCH là vào lệnh”.</text>
<rect x="28.0" y="92.5" width="306.0" height="440.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<rect x="28.0" y="92.5" width="306.0" height="54.0" rx="12" fill="#2563EB" fill-opacity="0.12"/>
<circle cx="54.0" cy="119.5" r="12.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="54.0" y="123.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="74.0" y="116.5" font-size="13" font-weight="700" fill="#2563EB">LOCATION</text>
<text x="74.0" y="134.5" font-size="12" font-weight="400" fill="#111827">Giá đang ở đâu?</text>
<text x="46.0" y="176.5" font-size="12.5" font-weight="700" fill="#2563EB" font-style="italic">Cho bé: “Đúng nhà chưa?”</text>
<text x="48.0" y="210.5" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="60.0" y="210.5" font-size="12" font-weight="400" fill="#111827" data-bx="59.0,315.0">HTF POI (FVG, OB… của H1/D1)</text>
<text x="48.0" y="233.5" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="60.0" y="233.5" font-size="12" font-weight="400" fill="#111827" data-bx="59.0,315.0">Premium hay discount của dealing range</text>
<text x="48.0" y="256.5" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="60.0" y="256.5" font-size="12" font-weight="400" fill="#111827" data-bx="59.0,315.0">Gần thanh khoản nào, xa thanh khoản nào</text>
<rect x="42.0" y="422.5" width="278.0" height="50.5" rx="8" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
<rect x="42.0" y="422.5" width="4.0" height="50.5" rx="2" fill="#2563EB"/>
<text x="56.0" y="442.7" font-size="12" font-weight="400" fill="#111827" data-bx="42.0,320.0">Không thuộc về CHoCH. Trả lời TRƯỚC khi</text>
<text x="56.0" y="459.7" font-size="12" font-weight="400" fill="#111827" data-bx="42.0,320.0">nhìn khung nhỏ.</text>
<line x1="335.0" y1="312.5" x2="339.8" y2="312.5" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="345.0,312.5 339.2,316.4 339.2,308.6" fill="#6B7280"/>
<rect x="346.0" y="92.5" width="306.0" height="440.0" rx="12" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.8"/>
<rect x="346.0" y="92.5" width="306.0" height="54.0" rx="12" fill="#C026D3" fill-opacity="0.12"/>
<circle cx="372.0" cy="119.5" r="12.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="372.0" y="123.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="116.5" font-size="13" font-weight="700" fill="#C026D3">STRUCTURAL EVIDENCE</text>
<text x="392.0" y="134.5" font-size="12" font-weight="400" fill="#111827">Cấu trúc đã đổi chưa?</text>
<text x="364.0" y="176.5" font-size="12.5" font-weight="700" fill="#C026D3" font-style="italic">Cho bé: “Cửa đã mở chưa?”</text>
<text x="366.0" y="210.5" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="378.0" y="210.5" font-size="12" font-weight="400" fill="#111827" data-bx="377.0,633.0">CHoCH / MSS ở lớp và khung đã khai báo</text>
<text x="366.0" y="233.5" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="378.0" y="233.5" font-size="12" font-weight="400" fill="#111827" data-bx="377.0,633.0">Bậc G0 → G3</text>
<text x="366.0" y="256.5" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="378.0" y="256.5" font-size="12" font-weight="400" fill="#111827" data-bx="377.0,633.0">Có displacement không</text>
<rect x="360.0" y="422.5" width="278.0" height="50.5" rx="8" fill="#C026D3" fill-opacity="0.07" stroke="#C026D3" stroke-width="1" stroke-opacity="0.35"/>
<rect x="360.0" y="422.5" width="4.0" height="50.5" rx="2" fill="#C026D3"/>
<text x="374.0" y="442.7" font-size="12" font-weight="400" fill="#111827" data-bx="360.0,638.0">Đây là việc của CHoCH. Nó là BẰNG</text>
<text x="374.0" y="459.7" font-size="12" font-weight="400" fill="#111827" data-bx="360.0,638.0">CHỨNG, chưa phải lệnh.</text>
<line x1="653.0" y1="312.5" x2="657.8" y2="312.5" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="663.0,312.5 657.2,316.4 657.2,308.6" fill="#6B7280"/>
<rect x="664.0" y="92.5" width="306.0" height="440.0" rx="12" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="1.8"/>
<rect x="664.0" y="92.5" width="306.0" height="54.0" rx="12" fill="#0E9F6E" fill-opacity="0.12"/>
<circle cx="690.0" cy="119.5" r="12.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="690.0" y="123.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="710.0" y="116.5" font-size="13" font-weight="700" fill="#0E9F6E">ENTRY TRIGGER</text>
<text x="710.0" y="134.5" font-size="12" font-weight="400" fill="#111827">Vào lệnh khi nào, ở đâu?</text>
<text x="682.0" y="176.5" font-size="12.5" font-weight="700" fill="#0E9F6E" font-style="italic">Cho bé: “Được mời vào chưa?”</text>
<text x="684.0" y="210.5" font-size="12" font-weight="700" fill="#0E9F6E">•</text>
<text x="696.0" y="210.5" font-size="12" font-weight="400" fill="#111827" data-bx="695.0,951.0">Giá hồi vào FVG / OB của cú phá</text>
<text x="684.0" y="233.5" font-size="12" font-weight="700" fill="#0E9F6E">•</text>
<text x="696.0" y="233.5" font-size="12" font-weight="400" fill="#111827" data-bx="695.0,951.0">Dừng lỗ: bên kia điểm gốc cú phá</text>
<text x="684.0" y="256.5" font-size="12" font-weight="700" fill="#0E9F6E">•</text>
<text x="696.0" y="256.5" font-size="12" font-weight="400" fill="#111827" data-bx="695.0,951.0">Mục tiêu: thanh khoản phía trước, R:R đủ</text>
<rect x="678.0" y="422.5" width="278.0" height="50.5" rx="8" fill="#0E9F6E" fill-opacity="0.07" stroke="#0E9F6E" stroke-width="1" stroke-opacity="0.35"/>
<rect x="678.0" y="422.5" width="4.0" height="50.5" rx="2" fill="#0E9F6E"/>
<text x="692.0" y="442.7" font-size="12" font-weight="400" fill="#111827" data-bx="678.0,956.0">Quy tắc của MÔ HÌNH vào lệnh (ICT 2022),</text>
<text x="692.0" y="459.7" font-size="12" font-weight="400" fill="#111827" data-bx="678.0,956.0">không phải của CHoCH.</text>
<rect x="28.0" y="544.5" width="944.0" height="51.0" rx="8" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="544.5" width="4.0" height="51.0" rx="2" fill="#B91C1C"/>
<text x="42.0" y="564.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="28.0,972.0">Ba câu hỏi phải được trả lời ĐỘC LẬP và THEO THỨ TỰ. Một CHoCH đẹp ở sai nhà (câu 1 sai) vẫn là “không có lệnh”. Một CHoCH đúng nhà nhưng giá</text>
<text x="42.0" y="582.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="28.0,972.0">không hồi về vùng vào lệnh (câu 3 không xảy ra) cũng là “không có lệnh”.</text>
<text x="28.0" y="609.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">POI = Point of Interest. FVG/OB = các vùng giá theo ICT. Chi tiết ở note 13, 25, 27, 55.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
