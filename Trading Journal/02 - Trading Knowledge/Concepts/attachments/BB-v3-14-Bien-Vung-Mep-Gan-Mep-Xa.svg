<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Vẽ vùng Breaker: lấy cả râu hay chỉ thân? Mép nào là “mép gần”?</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">ICT trong bài giảng nói ông dùng “the entire range” (cả râu). Cộng đồng có nơi chỉ lấy thân. Điều quan trọng hơn: mép gần và mép xa ĐỔI CHỖ khi</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">vùng đổi vai.</text>
<rect x="28.0" y="112.9" width="300.0" height="450.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="138.4" font-size="13.5" font-weight="700" fill="#111827" data-bx="41.0,317.0">Phóng to cây nến ở đỉnh giữa</text>
<line x1="110.0" y1="202.9" x2="110.0" y2="492.9" stroke="#0E9F6E" stroke-width="3" stroke-linecap="round"/>
<rect x="80.0" y="262.9" width="60.0" height="180.0" rx="3" fill="#0E9F6E"/>
<rect x="58.0" y="202.9" width="104.0" height="290.0" rx="3" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5,3"/>
<rect x="68.0" y="262.9" width="84.0" height="180.0" rx="3" fill="none" stroke="#D97706" stroke-width="1.6"/>
<text x="170.0" y="206.9" font-size="11" font-weight="700" fill="#2563EB">cả râu (full range)</text>
<text x="170.0" y="221.9" font-size="10.5" font-weight="400" fill="#2563EB">← mặc định của note</text>
<text x="170.0" y="352.9" font-size="11" font-weight="700" fill="#D97706">chỉ thân</text>
<text x="170.0" y="367.9" font-size="10.5" font-weight="400" fill="#D97706">(body)</text>
<text x="42.0" y="522.9" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,315.0">Chọn một cách, ghi lại, không đổi sau khi thấy</text>
<text x="42.0" y="540.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,315.0">kết quả.</text>
<rect x="342.0" y="112.9" width="310.0" height="450.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="356.0" y="138.4" font-size="13.5" font-weight="700" fill="#D97706" data-bx="355.0,641.0">TRƯỚC: bearish OB — giá đến từ DƯỚI</text>
<rect x="382.0" y="302.9" width="230.0" height="80.0" rx="3" fill="#D97706" fill-opacity="0.14" stroke="#D97706" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="497.0" y="346.9" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">vùng</text>
<text x="618.0" y="398.9" font-size="11" font-weight="700" fill="#15803D" text-anchor="end">MÉP GẦN</text>
<text x="618.0" y="295.9" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="end">MÉP XA</text>
<line x1="432.0" y1="512.9" x2="432.0" y2="394.9" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<polygon points="432.0,388.9 436.5,395.6 427.5,395.6" fill="#475569"/>
<text x="442.0" y="504.9" font-size="11" font-weight="400" fill="#475569">giá đi lên chạm vùng</text>
<text x="386.0" y="276.9" font-size="11" font-weight="700" fill="#B91C1C">nến đóng trên mép xa</text>
<text x="386.0" y="290.9" font-size="11" font-weight="400" fill="#B91C1C">= OB thất bại</text>
<rect x="662.0" y="112.9" width="310.0" height="450.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="676.0" y="138.4" font-size="13.5" font-weight="700" fill="#2563EB" data-bx="675.0,961.0">SAU: Bullish Breaker — giá đến từ TRÊN</text>
<rect x="702.0" y="302.9" width="230.0" height="80.0" rx="3" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="817.0" y="346.9" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">vùng</text>
<text x="938.0" y="295.9" font-size="11" font-weight="700" fill="#15803D" text-anchor="end">MÉP GẦN</text>
<text x="938.0" y="398.9" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="end">MÉP XA</text>
<line x1="752.0" y1="182.9" x2="752.0" y2="290.9" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<polygon points="752.0,296.9 747.5,290.3 756.5,290.3" fill="#475569"/>
<text x="762.0" y="196.9" font-size="11" font-weight="400" fill="#475569">giá đi xuống chạm vùng</text>
<text x="706.0" y="412.9" font-size="11" font-weight="700" fill="#B91C1C">nến đóng dưới mép xa</text>
<text x="706.0" y="426.9" font-size="11" font-weight="400" fill="#B91C1C">= Breaker thất bại</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Lỗi hay gặp: vùng đã đổi vai nhưng vẫn đặt mức “sai” ở mép cũ. Sau khi thành Bullish Breaker, mức cho thấy vùng thất bại là mép DƯỚI, không còn là mép trên.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
