<text x="704.4" y="363.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">chưa biết</text>
<text x="768.0" y="180.9" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="780.0" y="180.9" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">Bên phải đáy chỉ có MỘT nến</text>
<text x="780.0" y="197.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">tăng, rồi nến tiếp theo đã đi</text>
<text x="780.0" y="214.4" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">thấp hơn đáy.</text>
<text x="768.0" y="239.2" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="780.0" y="239.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">Theo quy tắc fractal 2 nến, cái</text>
<text x="780.0" y="255.9" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">đáy đó KHÔNG BAO GIỜ được</text>
<text x="780.0" y="272.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">xác nhận là swing. Ở lớp này</text>
<text x="780.0" y="289.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">không có “HL” nào để phá.</text>
<text x="768.0" y="314.2" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="780.0" y="314.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">Câu hỏi đúng lúc này: trạng</text>
<text x="780.0" y="331.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">thái đã khai báo là gì, và mức</text>
<text x="780.0" y="347.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">tham chiếu ĐÃ XÁC NHẬN</text>
<text x="780.0" y="364.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="779.0,957.0">gần nhất nằm ở đâu?</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Hai lỗi hindsight phổ biến: (1) chọn swing SAU khi biết giá đi đâu; (2) dùng nhãn indicator đã vẽ lùi về quá khứ như thể nó có sẵn tại thời điểm đó.</text>
