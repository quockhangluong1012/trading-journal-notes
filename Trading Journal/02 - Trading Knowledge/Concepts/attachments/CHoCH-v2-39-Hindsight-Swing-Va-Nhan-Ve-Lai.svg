<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trái: chart đã xong, mắt ta thấy ngay một “HL” và một “CHoCH”. Phải: cùng chart lúc nến phá vừa đóng cửa — cái “HL” đó chưa bao giờ là swing đã</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">xác nhận.</text>
