<text x="290.0" y="180.9" font-size="12" font-weight="700" fill="#6B7280">•</text>
<text x="302.0" y="180.9" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">Mắt ta thấy một đáy rõ ràng và</text>
<text x="302.0" y="197.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">một cú phá đẹp.</text>
<text x="290.0" y="222.4" font-size="12" font-weight="700" fill="#6B7280">•</text>
<text x="302.0" y="222.4" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">Nhiều indicator vẽ nhãn swing</text>
<text x="302.0" y="239.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">LÙI VỀ đúng cây nến đáy —</text>
<text x="302.0" y="255.9" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">nhưng nhãn đó chỉ xuất hiện</text>
<text x="302.0" y="272.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">vài nến sau (LuxAlgo ghi rõ</text>
<text x="302.0" y="289.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">điều này).</text>
<text x="290.0" y="314.2" font-size="12" font-weight="700" fill="#6B7280">•</text>
<text x="302.0" y="314.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">Nhìn chart lưu, gần như mọi</text>
<text x="302.0" y="331.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="301.0,479.0">CHoCH đều “rõ ràng”.</text>
