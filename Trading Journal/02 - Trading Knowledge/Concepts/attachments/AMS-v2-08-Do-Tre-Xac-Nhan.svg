<circle cx="773.8" cy="378.4" r="2.5" fill="#2563EB" stroke="none" stroke-width="2"/>
<text x="773.8" y="399.4" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">g · ITL</text>
