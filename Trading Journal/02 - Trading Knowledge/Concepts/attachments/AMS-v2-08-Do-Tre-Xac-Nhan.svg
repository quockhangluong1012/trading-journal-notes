<text x="924.0" y="157.0" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="end">khi g đã là ITL (cần h)</text>
<rect x="584.8" y="432.0" width="345.2" height="8.0" rx="3" fill="#DC2626" stroke="#DC2626" stroke-width="0" fill-opacity="0.25"/>
<text x="746.4" y="458.0" font-size="11.5" font-weight="600" fill="#DC2626" text-anchor="middle">Suốt quãng này e đã tồn tại, nhưng chưa ai được phép gọi nó là LTL</text>
<rect x="28.0" y="468.0" width="944.0" height="30.7" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="28.0" y="468.0" width="5.0" height="30.7" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="42.0" y="487.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hệ quả: khi LTL được xác nhận thì giá thường đã đi xa khỏi nó. Nhãn LTL là bản đồ để ĐỌC bối cảnh, không phải tín hiệu để vào lệnh ngay.</text>
