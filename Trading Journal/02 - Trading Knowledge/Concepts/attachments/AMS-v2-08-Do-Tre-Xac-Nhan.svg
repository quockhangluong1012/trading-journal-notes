<text x="883.2" y="343.2" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">h · STL</text>
<line x1="584.8" y1="100.0" x2="584.8" y2="436.0" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="590.8" y="104.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">① Biết e là STL</text>
<text x="590.8" y="119.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">nến sau e đóng cao hơn</text>
<line x1="715.0" y1="100.0" x2="715.0" y2="436.0" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="721.0" y="104.0" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">② Biết e là ITL</text>
<text x="721.0" y="119.0" font-size="10.5" font-weight="400" fill="#2563EB" text-anchor="start">khi f được xác nhận</text>
<line x1="930.0" y1="100.0" x2="930.0" y2="436.0" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 4"/>
