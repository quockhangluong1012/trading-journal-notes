<svg viewBox="0 0 1000 605" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ahB91C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<rect x="1" y="1" width="998" height="603" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="903.6" y="22" width="68.4" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="937.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CƠ CHẾ</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba loại lệnh — nền móng của mọi câu chuyện về liquidity</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Market order LẤY thanh khoản, limit order CUNG CẤP thanh khoản, stop order NGỦ cho tới khi giá chạm rồi biến thành lệnh market.</text>
<rect x="28.0" y="87.0" width="306.7" height="118.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="97.0" width="4.0" height="98.0" rx="2" fill="#EA580C" stroke="none" stroke-width="1.2"/>
<text x="44.0" y="110.0" font-size="13.5" font-weight="700" fill="#EA580C" text-anchor="start">Market — “mua/bán ngay”</text>
<text x="44.0" y="131.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">Khớp ngay ở giá tốt nhất đang có. Nó ăn vào các</text>
<text x="44.0" y="148.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">lệnh limit đang chờ ⇒ LẤY thanh khoản. Ví dụ:</text>
<text x="44.0" y="164.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">“Mua ngay 1 lot”.</text>
<rect x="346.7" y="87.0" width="306.7" height="118.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="346.7" y="97.0" width="4.0" height="98.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="362.7" y="110.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">Limit — “đứng chờ ở một giá”</text>
<text x="362.7" y="131.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">Nằm chờ ở mức giá định sẵn, chờ người khác tới</text>
<text x="362.7" y="148.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">khớp ⇒ CUNG CẤP thanh khoản. Đây là “người</text>
<text x="362.7" y="164.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">đứng bên kia”.</text>
<rect x="665.3" y="87.0" width="306.7" height="118.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="665.3" y="97.0" width="4.0" height="98.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="681.3" y="110.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">Stop — “ngủ cho tới khi giá chạm”</text>
<text x="681.3" y="131.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">Không hiện ra cho tới khi giá chạm mức kích</text>
<text x="681.3" y="148.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">hoạt; rồi thành lệnh market ⇒ khi thức dậy nó</text>
<text x="681.3" y="164.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="276.7">LẤY thanh khoản.</text>
<rect x="28.0" y="219.0" width="944.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="241.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Chuyện gì xảy ra khi giá chạm một cụm stop mua nằm trên đỉnh cũ?</text>
<path d="M56.0,429.2 L85.2,402.1 L114.4,372.7 L143.5,347.8 L172.7,365.9 L201.9,384.0 L231.1,370.4 L260.2,356.9 L289.4,347.8 L318.6,352.4 L347.8,345.6 L376.9,341.1 L406.1,338.8" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M406.1,338.8 L435.3,311.7 L464.5,293.6 L493.6,286.8" fill="none" stroke="#B91C1C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahB91C1C)"/>
<line x1="143.5" y1="343.3" x2="552.0" y2="343.3" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="145.5" y="356.8" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start">đỉnh cũ</text>
<circle cx="187.3" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="216.5" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="245.6" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="274.8" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="304.0" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="333.2" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="362.4" cy="334.3" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<line x1="423.6" y1="338.8" x2="417.6" y2="416.8" stroke="#B91C1C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="414.6" y="420.8" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end" data-maxw="230.0">stop thức dậy → thành lệnh MUA market →</text>
<text x="414.6" y="434.4" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end" data-maxw="230.0">ăn các lệnh bán đang chờ → giá nhảy nhanh</text>
<circle cx="347.8" cy="325.6" r="9" fill="#475569" stroke="none" stroke-width="1.2"/>
<text x="347.8" y="329.6" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="419.3" cy="305.7" r="9" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="419.3" y="309.7" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="610.0" cy="267.0" r="10" fill="#475569" stroke="none" stroke-width="1.2"/>
<text x="610.0" y="271.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="628.0" y="271.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">Giá tiến lại gần đỉnh cũ. Lệnh stop vẫn ngủ — chart không</text>
<text x="628.0" y="287.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">cho thấy chúng.</text>
<circle cx="610.0" cy="314.1" r="10" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="610.0" y="318.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="628.0" y="318.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">Giá chạm mức kích hoạt. Nhiều lệnh mua xuất hiện gần</text>
<text x="628.0" y="334.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">như cùng lúc.</text>
<circle cx="610.0" cy="361.2" r="10" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="610.0" y="365.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="628.0" y="365.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">Chúng phải khớp với lệnh bán đang chờ ở các mức cao</text>
<text x="628.0" y="381.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">dần ⇒ giá có thể tăng tốc.</text>
<circle cx="610.0" cy="408.4" r="10" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="610.0" y="412.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="628.0" y="412.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">Sau đó: giá có thể đi tiếp (breakout), hoặc quay lại nếu</text>
<text x="628.0" y="428.9" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="330.0">bên bán đủ dày. Chart chưa trả lời ngay.</text>
<rect x="28.0" y="533.0" width="944.0" height="51.6" rx="10" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="557.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nghiên cứu sổ lệnh FX (Osler, NY Fed): lệnh stop-loss tụ ngay ngoài các số tròn và khi kích hoạt có xu hướng làm xu hướng MẠNH THÊM (price cascade); lệnh</text>
<text x="42.0" y="573.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chốt lời thì hay làm giá chững lại. Vì vậy “quét stop” tự nó KHÔNG phải lý do để đoán đảo chiều.</text>
</svg>
