<svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="680" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">Thiết kế backtest: tách thông tin của location khỏi chất lượng trigger</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Level 1 đo location thuần túy (MEHR theo p-bin). Level 2 giữ nguyên mọi thứ, chỉ đổi cách chọn DR. Kết luận chỉ hợp lệ nếu arm cấu trúc thắng arm</text>
  <text x="26.0" y="72.0" font-size="13" fill="#6B7280">anchor ngẫu nhiên OUT-OF-SAMPLE.</text>
  <rect x="26.0" y="101.0" width="300.0" height="150.0" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="36.0" y="121.0" font-size="12.5" font-weight="700" fill="#1D4ED8">LEVEL 1 · LOCATION STUDY</text>
  <text x="36.0" y="139.0" font-size="11" fill="#374151">Sự kiện: H1 close lần đầu vào p-bin của DR ACTIVE.</text>
  <text x="36.0" y="153.8" font-size="11" fill="#374151">Bracket: stop L* − buffer, target H*.</text>
  <text x="36.0" y="168.7" font-size="11" fill="#374151">Outcome: MEHR = y_hit − p_bracket.</text>
  <rect x="26.0" y="265.0" width="300.0" height="150.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="36.0" y="285.0" font-size="12.5" font-weight="700" fill="#7C3AED">LEVEL 2 · SYSTEM STUDY</text>
  <text x="36.0" y="303.0" font-size="11" fill="#374151">Giữ nguyên D1 rule, POI rule, M5 trigger, stop,</text>
  <text x="36.0" y="317.9" font-size="11" fill="#374151">target, session.</text>
  <text x="36.0" y="332.7" font-size="11" fill="#374151">Chỉ thay đổi: cách chọn DR (arm A–H).</text>
  <text x="36.0" y="347.6" font-size="11" fill="#374151">Outcome: E[R] sau chi phí, R/tháng.</text>
