<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Premium = nửa trên của một khoảng giá (đắt). Discount = nửa dưới (rẻ). Đây là thông tin về VỊ TRÍ — nó không tạo ra và cũng không xoá bỏ một</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Breaker.</text>
