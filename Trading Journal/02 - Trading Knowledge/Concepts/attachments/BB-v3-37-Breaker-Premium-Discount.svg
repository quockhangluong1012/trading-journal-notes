<text x="680.0" y="486.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="679.0,959.0">Cùng một Breaker, nhưng đặt trong khoảng giá</text>
<text x="680.0" y="504.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="679.0,959.0">lớn của khung D1, nó nằm sâu trong discount.</text>
<text x="28.0" y="607.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">“Mua ở discount, bán ở premium” là một gợi ý về vị trí, không phải luật. Một Bullish Breaker ở premium không bị “loại” — nó chỉ kém hấp dẫn hơn về khoảng chạy</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">còn lại.</text>
