<rect x="0.8" y="0.8" width="998.5" height="638.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Breaker nằm ở nửa trên hay nửa dưới? Tuỳ bạn đo bằng khoảng giá nào</text>
