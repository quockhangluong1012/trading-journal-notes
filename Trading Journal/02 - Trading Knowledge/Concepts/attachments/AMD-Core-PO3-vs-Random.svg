<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
  <text x="24" y="30" font-size="18" font-weight="700" fill="currentColor">PO3 tiềm năng vs chuỗi giá ngẫu nhiên</text>
  <text x="24" y="50" font-size="12.5" fill="var(--muted)">Điểm khác biệt không phải hình dạng — mà là liquidity rõ + reclaim + displacement + DOL.</text>
  <line x1="450" y1="60" x2="450" y2="370" stroke="var(--border)" stroke-dasharray="4 3"/>
  <text x="40" y="80" font-size="12.5" font-weight="700" fill="var(--success)">PO3 TIỀM NĂNG ✓</text>
  <rect x="40" y="100" width="180" height="70" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="40" y1="172" x2="280" y2="172" stroke="var(--error)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M50,135 L100,128 L150,140 L200,130 L220,132 L250,168 L275,145 L310,130 L350,105 L400,110" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <circle cx="250" cy="168" r="4" fill="var(--warning)"/>
  <circle cx="310" cy="130" r="4" fill="var(--success)"/>
  <line x1="330" y1="105" x2="430" y2="105" stroke="var(--success)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="210" font-size="12" fill="var(--success)">✓ Range rõ, biên đo được</text>
  <text x="40" y="230" font-size="12" fill="var(--success)">✓ Sweep MỘT phía + reclaim</text>
  <text x="40" y="250" font-size="12" fill="var(--success)">✓ Displacement + MSS sạch</text>
  <text x="40" y="270" font-size="12" fill="var(--success)">✓ DOL / pool target rõ phía trước</text>
  <text x="40" y="290" font-size="12" fill="var(--success)">✓ Trong kill zone, đúng bias</text>
  <text x="470" y="80" font-size="12.5" font-weight="700" fill="var(--error)">CHUỖI NGẪU NHIÊN ✗</text>
  <rect x="470" y="100" width="220" height="100" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="6 4"/>
  <path d="M480,150 L520,130 L540,165 L580,120 L600,175 L640,135 L660,168 L700,140 L730,170 L770,145 L800,165 L840,150" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="470" y="230" font-size="12" fill="var(--error)">✗ Range mơ hồ, biên vẽ kiểu nào cũng được</text>
  <text x="470" y="250" font-size="12" fill="var(--error)">✗ Phá hai chiều (whipsaw), không reclaim sạch</text>
  <text x="470" y="270" font-size="12" fill="var(--error)">✗ Không displacement, không MSS</text>
  <text x="470" y="290" font-size="12" fill="var(--error)">✗ Không có pool/DOL rõ để đi tới</text>
  <text x="470" y="310" font-size="12" fill="var(--error)">✗ Ngoài giờ chính / ngược bias</text>
  <text x="24" y="352" font-size="12.5" font-weight="700" fill="currentColor">Nếu chuỗi nào cũng gọi là PO3 thì khái niệm mất giá trị — càng ít tiêu chí đạt, càng gần random.</text>
  <text x="24" y="374" font-size="12" fill="var(--muted)">Bài kiểm tra honesty: che nửa phải chart lại — với chỉ nửa trái, bạn có dám gọi tên pha không? Nếu không, đó là hindsight.</text>
  <text x="24" y="396" font-size="12" fill="var(--muted)">PO3 mô tả tốt ≠ dự báo tốt. Chứng minh edge cần backtest có control group (xem §37).</text>
</svg>
