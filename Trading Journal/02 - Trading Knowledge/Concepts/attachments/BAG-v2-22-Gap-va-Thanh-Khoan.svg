<text x="925.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LIQUIDITY</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Gap và thanh khoản — Khi lệnh chờ trên đỉnh bị kích hoạt QUA một khoảng trống</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phía trên các đỉnh bằng nhau thường có lệnh chờ kích hoạt (dừng lỗ của người bán khống, lệnh mua chờ breakout). ICT gọi đó là buy-side</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">liquidity (BSL).</text>
