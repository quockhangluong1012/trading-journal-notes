<text x="459.1" y="306.4" font-size="10.5" font-weight="800" fill="#D97706" text-anchor="middle">lệnh stop khớp ở ~107+, không phải 104</text>
<rect x="606.0" y="100.0" width="366.0" height="93.2" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.1"/>
<text x="616.0" y="119.0" font-size="11" font-weight="700" fill="#2563EB" text-anchor="start">[CƠ CHẾ] Chuyện gì xảy ra với lệnh stop</text>
<text x="616.0" y="135.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh dừng lỗ (stop) thường trở thành lệnh thị trường khi giá</text>
<text x="616.0" y="150.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chạm mức kích hoạt. Nếu giá mở cửa ở 107, các lệnh kích hoạt ở</text>
<text x="616.0" y="165.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">104 sẽ khớp ở giá có sẵn — quanh 107 hoặc cao hơn. Đó là trượt</text>
<text x="616.0" y="181.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">giá (slippage), không phải 'được khớp ở 104'.</text>
<rect x="606.0" y="203.2" width="366.0" height="78.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.1"/>
<text x="616.0" y="222.2" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="start">[DIỄN GIẢI] Vì sao điều này quan trọng</text>
<text x="616.0" y="238.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Một phần lực mua lúc mở cửa có thể đến từ chính các lệnh bị</text>
<text x="616.0" y="253.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">kích hoạt này — một nguồn lực 'một lần'. Sau khi chúng khớp</text>
<text x="616.0" y="269.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">xong, không còn ai phải mua vì cùng lý do đó.</text>
<rect x="606.0" y="291.3" width="366.0" height="93.2" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
<text x="616.0" y="310.3" font-size="11" font-weight="700" fill="#64748B" text-anchor="start">[QUAN SÁT] Điều chart cho thấy</text>
<text x="616.0" y="326.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá đã giao dịch trên mức 104 → thanh khoản phía trên đỉnh đã</text>
<text x="616.0" y="341.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">được 'chạm tới'. Đó là tất cả những gì chart nói. Chart KHÔNG</text>
<text x="616.0" y="357.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">cho biết bao nhiêu lệnh stop có thật, ai đặt, hay có ai 'cố ý săn'</text>
<text x="616.0" y="372.3" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chúng.</text>
<rect x="606.0" y="394.5" width="366.0" height="78.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1.1"/>
<text x="616.0" y="413.5" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Cảnh báo</text>
<text x="616.0" y="430.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không phải breakaway gap nào cũng liên quan đến liquidity</text>
<text x="616.0" y="445.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">sweep. Một gap có thể vượt đỉnh (lấy BSL) rồi bị đảo ngược —</text>
<text x="616.0" y="460.3" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đó là kịch bản sweep/thất bại, không phải breakaway.</text>
