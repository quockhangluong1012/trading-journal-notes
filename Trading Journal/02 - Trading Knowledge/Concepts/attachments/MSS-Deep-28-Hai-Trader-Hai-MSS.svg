<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Bài toán khách quan — hai trader, cùng chart, hai bộ MSS khác nhau</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Trader A đếm swing 3 nến (n=1, như STH của ICT). Trader B dùng n=5. Không ai 'sai' — họ dùng hai thuật toán khác nhau.</text>
<rect x="26.0" y="84.0" width="620.0" height="230.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="104.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Trader A — fractal n=1</text>
<path d="M46.0,245.0 L75.0,207.0 L92.4,218.4 L115.6,184.2 L133.0,197.5 L150.4,172.8 L173.6,191.8 L196.8,180.4 L220.0,210.8 L237.4,199.4 L260.6,226.0 L278.0,212.7 L301.2,237.4 L318.6,222.2 L336.0,229.8 L359.2,203.2 L376.6,214.6 L399.8,191.8 L417.2,207.0 L440.4,176.6 L463.6,188.0 L486.8,161.4 L510.0,172.8 L544.8,142.4 L579.6,153.8 L614.4,127.2" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="196.8" cy="180.4" r="3.8" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="237.4" cy="199.4" r="3.8" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="278.0" cy="212.7" r="3.8" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="318.6" cy="222.2" r="3.8" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<line x1="318.6" y1="222.2" x2="394.0" y2="222.2" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="351.1" cy="222.2" r="6" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="359.1" y="240.2" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="start">MSS (A)</text>
<text x="46.0" y="304.0" font-size="9.8" font-weight="600" fill="#B45309" text-anchor="start">A thấy MSS ↑ khi giá vượt đỉnh nhỏ 47 → 'MSS ở 47'</text>
<rect x="26.0" y="330.0" width="620.0" height="230.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="350.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Trader B — fractal n=5</text>
<path d="M46.0,491.0 L75.0,453.0 L92.4,464.4 L115.6,430.2 L133.0,443.5 L150.4,418.8 L173.6,437.8 L196.8,426.4 L220.0,456.8 L237.4,445.4 L260.6,472.0 L278.0,458.7 L301.2,483.4 L318.6,468.2 L336.0,475.8 L359.2,449.2 L376.6,460.6 L399.8,437.8 L417.2,453.0 L440.4,422.6 L463.6,434.0 L486.8,407.4 L510.0,418.8 L544.8,388.4 L579.6,399.8 L614.4,373.2" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150.4" cy="418.8" r="4.5" fill="#2563EB" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="196.8" cy="426.4" r="4.5" fill="#2563EB" stroke="#ffffff" stroke-width="1.5"/>
<line x1="196.8" y1="426.4" x2="481.0" y2="426.4" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="436.9" cy="426.4" r="6" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="444.9" y="444.4" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="start">MSS (B)</text>
<text x="46.0" y="550.0" font-size="9.8" font-weight="600" fill="#1D4ED8" text-anchor="start">B chỉ thấy MSS ↑ khi giá vượt đỉnh lớn 64 → muộn hơn, giá cao hơn</text>
<rect x="660.0" y="84.0" width="294.0" height="476.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="672.0" y="106.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Đo bất đồng (MSS-Sim-06)</text>
<text x="672.0" y="123.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">Trên 300.000 nến M5 random walk:</text>
<text x="672.0" y="138.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Jaccard(n=1, n=5) = 0.16</text>
<text x="672.0" y="153.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• chỉ 18% MSS của A trùng một MSS</text>
<text x="672.0" y="168.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">  của B (±3 nến, cùng hướng)</text>
<text x="672.0" y="183.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• 57% MSS của B trùng một MSS của A</text>
<text x="672.0" y="199.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• internal vs protected (n=2): 0.24</text>
<text x="672.0" y="214.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="672.0" y="229.4" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">Hệ quả:</text>
<text x="672.0" y="244.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• 'MSS' không phải thuộc tính riêng của</text>
<text x="672.0" y="259.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start">  dữ liệu; nó là dữ liệu + thuật toán.</text>
<text x="672.0" y="275.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Thống kê MSS của người khác không</text>
<text x="672.0" y="290.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">  chuyển sang định nghĩa của bạn.</text>
<text x="672.0" y="305.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Vùng 'mơ hồ' (hai cách vẽ đều hợp</text>
<text x="672.0" y="320.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">  lý) nên tự động hạ hạng (v1 W6).</text>
<text x="672.0" y="335.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="672.0" y="351.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">Cách giảm (không loại bỏ) chủ quan:</text>
<text x="672.0" y="366.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">khai báo n/θ, lớp, close/wick, ε TRƯỚC</text>
<text x="672.0" y="381.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start">khi nhìn chart; ghi vào journal.</text>
</svg>