<svg viewBox="0 0 980 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="580" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">Valid → Relevant → Tradeable, và Location Robustness Index</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Phần lớn thời gian không có range nào tradeable — đó là thông tin đúng. LRI đo xem nhãn premium/discount có sống sót khi đổi anchor hợp lệ hay</text>
  <text x="26.0" y="72.0" font-size="13" fill="#6B7280">không.</text>
  <rect x="26.0" y="103.0" width="470.0" height="450.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/>
  <text x="40.0" y="127.0" font-size="13.5" font-weight="700" fill="#6B7280">VALID</text>
  <text x="40.0" y="147.0" font-size="11" fill="#374151">anchors thỏa định nghĩa · state ≠ INVALIDATED · W/ATR trong dải</text>
  <rect x="60.0" y="203.0" width="402.0" height="320.0" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="74.0" y="227.0" font-size="13.5" font-weight="700" fill="#1D4ED8">RELEVANT</text>
  <text x="74.0" y="247.0" font-size="11" fill="#374151">scale-matched với quyết định · nhất quán parent · giá đang tương tác</text>
  <rect x="94.0" y="303.0" width="334.0" height="190.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
  <text x="108.0" y="327.0" font-size="13.5" font-weight="700" fill="#15803D">TRADEABLE</text>
  <text x="108.0" y="347.0" font-size="11" fill="#374151">LRI cao · đủ room tới DOL · có POI · trigger khả thi ·</text>
  <text x="108.0" y="361.9" font-size="11" fill="#374151">chi phí chấp nhận được</text>
  <text x="128.0" y="433.0" font-size="10.5" fill="#6B7280">valid nhưng không relevant: range D1 hợp lệ, nhưng</text>
  <text x="128.0" y="447.2" font-size="10.5" fill="#6B7280">giá đã cách xa 3×W</text>
  <rect x="516.0" y="103.0" width="438.0" height="450.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="528.0" y="125.0" font-size="13" font-weight="700" fill="#7C3AED">Location Robustness Index</text>
  <text x="532.0" y="165.0" font-size="11.5" font-weight="700" fill="#1F2937">LRI = | Σ wᵢ·ℓᵢ | / Σ wᵢ ,   ℓᵢ = +1 nếu pᵢ &lt; 0.5, −1 nếu pᵢ &gt; 0.5</text>
  <text x="532.0" y="189.0" font-size="11" fill="#374151">Tính trên mọi candidate valid &amp; relevant (leg k, leg k+1, fallback, container,</text>
  <text x="532.0" y="203.8" font-size="11" fill="#374151">IPDA 20). LRI = 1: mọi frame đồng thuận; ≈ 0: chia đôi.</text>
  <text x="532.0" y="253.0" font-size="12" font-weight="700" fill="#1F2937">Case A — EURUSD uptrend</text>
  <rect x="532.0" y="265.0" width="120.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="540.0" y="283.0" font-size="10.5" font-weight="700" fill="#374151">D1 leg</text>
  <text x="540.0" y="301.0" font-size="11" fill="#374151">p = 0.35</text>
  <text x="540.0" y="318.0" font-size="10.5" font-weight="700" fill="#15803D">discount (+1)</text>
  <rect x="668.0" y="265.0" width="120.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="676.0" y="283.0" font-size="10.5" font-weight="700" fill="#374151">IPDA 40</text>
  <text x="676.0" y="301.0" font-size="11" fill="#374151">p = 0.40</text>
  <text x="676.0" y="318.0" font-size="10.5" font-weight="700" fill="#15803D">discount (+1)</text>
  <rect x="804.0" y="265.0" width="120.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="812.0" y="283.0" font-size="10.5" font-weight="700" fill="#374151">IPDA 20</text>
  <text x="812.0" y="301.0" font-size="11" fill="#374151">p = 0.35</text>
  <text x="812.0" y="318.0" font-size="10.5" font-weight="700" fill="#15803D">discount (+1)</text>
  <rect x="532.0" y="339.0" width="113.9" height="20.0" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
  <text x="539.0" y="354.0" font-size="11" font-weight="700" fill="#15803D">LRI = 1.00 → PASS</text>
  <text x="532.0" y="393.0" font-size="12" font-weight="700" fill="#1F2937">Case C — XAUUSD consolidation</text>
  <rect x="532.0" y="405.0" width="120.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="540.0" y="423.0" font-size="10.5" font-weight="700" fill="#374151">D1 leg</text>
  <text x="540.0" y="441.0" font-size="11" fill="#374151">p = 0.67</text>
  <text x="540.0" y="458.0" font-size="10.5" font-weight="700" fill="#B91C1C">premium (−1)</text>
  <rect x="668.0" y="405.0" width="120.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="676.0" y="423.0" font-size="10.5" font-weight="700" fill="#374151">Container</text>
  <text x="676.0" y="441.0" font-size="11" fill="#374151">p = 0.24</text>
  <text x="676.0" y="458.0" font-size="10.5" font-weight="700" fill="#15803D">discount (+1)</text>
  <rect x="804.0" y="405.0" width="120.0" height="62.0" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="812.0" y="423.0" font-size="10.5" font-weight="700" fill="#374151">IPDA 20</text>
  <text x="812.0" y="441.0" font-size="11" fill="#374151">p = 0.24</text>
  <text x="812.0" y="458.0" font-size="10.5" font-weight="700" fill="#15803D">discount (+1)</text>
  <rect x="532.0" y="479.0" width="151.5" height="20.0" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="539.0" y="494.0" font-size="11" font-weight="700" fill="#B45309">LRI = 0.33 → AMBIGUOUS</text>
</svg>
