<text x="26.0" y="380.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">7 · KẾT CỤC (ghi tất cả, kể cả kết cục xấu):</text>
<rect x="26.0" y="392.0" width="300.0" height="74.0" rx="8" fill="#ECFDF5" stroke="#15803D" stroke-width="1.2"/>
