<text x="686.0" y="153.0" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="start">Chờ retest</text>
<text x="662.0" y="200.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Giá có thể quay lại —</text>
