<rect x="0" y="0" width="980" height="530" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Bản đồ một trang: Breaker Block là một CHUỖI sự kiện, không phải một hình chữ nhật</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bốn ô đầu là ĐỊNH NGHĨA (quan sát được). Hai ô sau là THEO DÕI (giả thuyết). Ô cuối là KẾT CỤC — phải ghi cả ba nhánh.</text>
