<text x="38.0" y="414.5" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">A · Phản ứng theo kỳ vọng</text>
<text x="38.0" y="433.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá giữ vùng và đi xa khỏi nó. Vẫn chỉ là MỘT</text>
<text x="38.0" y="449.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">mẫu.</text>
<rect x="340.0" y="392.0" width="300.0" height="74.0" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<rect x="340.0" y="392.0" width="4.0" height="74.0" rx="2" fill="#B91C1C"/>
<text x="352.0" y="414.5" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">B · Xuyên qua vùng</text>
<text x="352.0" y="433.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Thân nến đóng qua mép xa và giữ ở đó → vùng</text>
<text x="352.0" y="449.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">vô hiệu. Không dời vùng.</text>
<rect x="654.0" y="392.0" width="300.0" height="74.0" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
<rect x="654.0" y="392.0" width="4.0" height="74.0" rx="2" fill="#B45309"/>
<text x="666.0" y="414.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">C · Không bao giờ retest</text>
<text x="666.0" y="433.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá chạy thẳng tới mục tiêu. Không phải thất bại</text>
<text x="666.0" y="449.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">— là một kết cục riêng.</text>
<text x="954.0" y="516.0" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">Không có ô nào trong chuỗi này nói rằng giá “phải” đi theo hướng nào.</text>
