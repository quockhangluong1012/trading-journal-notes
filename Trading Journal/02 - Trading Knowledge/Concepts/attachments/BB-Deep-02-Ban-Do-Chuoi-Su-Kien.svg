<text x="842.0" y="153.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">Quan sát phản</text>
<text x="842.0" y="169.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">ứng</text>
