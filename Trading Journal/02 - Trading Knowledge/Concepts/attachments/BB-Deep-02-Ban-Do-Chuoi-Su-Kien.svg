<text x="40.0" y="94.0" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="start">Bối cảnh D1 bao trùm toàn bộ chuỗi: cấu trúc lớn · dealing range · thanh khoản HTF · Daily Bias — Breaker nằm TRONG bối cảnh.</text>
