<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="480" y1="70" x2="480" y2="500"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Case 2 (Continuation thang) vs Case 4 (Nen to nhung thieu sweep)</text>

  <!-- LEFT: Case 2 -->
  <text x="30" y="78" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">Case 2: EURUSD London Open - continuation displacement</text>

  <!-- internal pullback -->
  <rect x="60" y="180" width="10" height="16" fill="#ef5350"/><line x1="65" y1="174" x2="65" y2="200" stroke="#ef5350" stroke-width="1.5"/>
  <text x="45" y="220" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Pullback noi bo</text>

  <!-- 3 candle displacement -->
  <rect x="85" y="160" width="14" height="30" fill="#26a69a"/><line x1="92" y1="152" x2="92" y2="194" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="105" y="135" width="14" height="32" fill="#26a69a"/><line x1="112" y1="126" x2="112" y2="170" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="125" y="112" width="14" height="30" fill="#26a69a"/><line x1="132" y1="104" x2="132" y2="145" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="108" y="133" width="28" height="27" fill="rgba(41,98,255,0.25)"/>
  <text x="108" y="128" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">FVG M15</text>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="13" fill="#26a69a">body/range approx 0.75, ATR mult approx 1.4x</text>

  <!-- entry at CE -->
  <line x1="108" y1="147" x2="230" y2="147" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="235" y="150" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">CE entry</text>
  <rect x="150" y="140" width="10" height="14" fill="#26a69a"/><line x1="155" y1="134" x2="155" y2="160" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="165" y="120" width="10" height="30" fill="#26a69a"/><line x1="170" y1="112" x2="170" y2="155" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="180" y="95" width="10" height="35" fill="#26a69a"/><line x1="185" y1="88" x2="185" y2="132" stroke="#26a69a" stroke-width="1.5"/>

  <text x="60" y="270" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Stop duoi pullback, target = draw HTF con xa</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="15" fill="#26a69a">Ket qua minh hoa: approx +2.2R</text>
  <text x="30" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">Bai hoc: dat displacement dung vi tri trong leg (continuation, target con xa)</text>

  <!-- RIGHT: Case 4 -->
  <text x="510" y="78" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Case 4: XAUUSD phien A - nen to nhung KHONG sweep truoc</text>

  <text x="510" y="105" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Chuoi tang cham keo dai, khong pool SSL/BSL ro rang gan day</text>

  <!-- slow rising candles -->
  <rect x="530" y="200" width="10" height="12" fill="#26a69a"/><line x1="535" y1="195" x2="535" y2="216" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="545" y="190" width="10" height="12" fill="#26a69a"/><line x1="550" y1="185" x2="550" y2="206" stroke="#26a69a" stroke-width="1.5"/>
  <rect x="560" y="180" width="10" height="12" fill="#26a69a"/><line x1="565" y1="175" x2="565" y2="196" stroke="#26a69a" stroke-width="1.5"/>

  <!-- big candle no sweep -->
  <rect x="580" y="115" width="20" height="55" fill="#26a69a"/><line x1="590" y1="105" x2="590" y2="175" stroke="#26a69a" stroke-width="2"/>
  <text x="565" y="100" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Nen "an tuong nhat" nhieu gio</text>
  <text x="565" y="205" font-family="Arial, sans-serif" font-size="13" fill="#ef5350">body/range approx 0.85, ATR mult approx 2.2x</text>
  <text x="565" y="225" font-family="Arial, sans-serif" font-size="13" fill="#ef5350">NHUNG: khong sweep pool nao truoc do</text>

  <!-- X mark -->
  <g stroke="#ef5350" stroke-width="4">
    <line x1="700" y1="130" x2="750" y2="180"/>
    <line x1="750" y1="130" x2="700" y2="180"/>
  </g>
  <text x="640" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef5350">Checklist chan: dieu kien tien quyet (sweep) khong dat</text>

  <!-- reversal after -->
  <rect x="600" y="180" width="14" height="45" fill="#ef5350"/><line x1="607" y1="172" x2="607" y2="230" stroke="#ef5350" stroke-width="1.5"/>
  <rect x="620" y="200" width="14" height="50" fill="#ef5350"/><line x1="627" y1="192" x2="627" y2="255" stroke="#ef5350" stroke-width="1.5"/>
  <text x="600" y="275" font-family="Arial, sans-serif" font-size="13" fill="#ef5350">Vai nen sau: dao chieu manh (exhaustion xac nhan)</text>

  <text x="510" y="310" font-family="Arial, sans-serif" font-size="15" fill="#ef5350">Ket qua: khong lenh nao duoc thuc hien</text>
  <text x="510" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Bai hoc: nen "dep" nhat khong dong nghia dang tin nhat</text>

  <text x="30" y="500" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#d1d4dc">Legend: xanh=tang, do=giam, xanh duong=FVG, trang net dut=CE entry. So lieu minh hoa, khong phai thong ke thuc.</text>
</svg>
