<text x="326.2" y="130.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">được chấp nhận ở vùng mới?</text>
<rect x="404.0" y="100.0" width="568.0" height="67.1" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
<text x="414.0" y="120.0" font-size="12" font-weight="700" fill="#D97706" text-anchor="start">① Gap là dấu vết</text>
<text x="414.0" y="138.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá xuất hiện ở mức mới mà không đi qua các mức giữa — vì lúc đó không có giao dịch liên tục</text>
<text x="414.0" y="154.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hoặc không có lệnh chờ ở giữa.</text>
<rect x="404.0" y="177.1" width="568.0" height="50.6" rx="8" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.1"/>
<text x="414.0" y="197.1" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="start">② Breakaway là VỊ TRÍ</text>
<text x="414.0" y="215.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Gap đó đưa giá RA KHỎI một vùng mà mọi người đã thấy. Không có vùng → không có breakaway.</text>
<rect x="404.0" y="237.7" width="568.0" height="67.1" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.1"/>
<text x="414.0" y="257.7" font-size="12" font-weight="700" fill="#2563EB" text-anchor="start">③ Tên gọi đến SAU</text>
<text x="414.0" y="275.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lúc gap xuất hiện chỉ là ứng viên. Hành vi sau đó (giữ / lấp / quay về range) mới cho phép gọi</text>
<text x="414.0" y="292.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">tên.</text>
<rect x="404.0" y="314.8" width="568.0" height="50.6" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.1"/>
<text x="414.0" y="334.8" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="start">④ Lấp gap ≠ thất bại</text>
<text x="414.0" y="352.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đường quyết định là biên range và nơi giá đóng cửa, không phải mép gap.</text>
<rect x="404.0" y="375.4" width="568.0" height="50.6" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1.1"/>
<text x="414.0" y="395.4" font-size="12" font-weight="700" fill="#E0464B" text-anchor="start">⑤ Bối cảnh, không phải cò súng</text>
<text x="414.0" y="413.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Breakaway Gap trả lời 'thị trường đang ở đâu'. Câu hỏi 'vào lệnh ở đâu' thuộc về H1 → M5.</text>
