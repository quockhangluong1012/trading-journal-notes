<text x="53.0" y="516.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Missed giảm số lệnh và có thể kéo expectancy nhóm đã khớp xuống (adverse</text>
<text x="53.0" y="531.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">selection) — đo bằng shadow R</text>
