<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity Significance Score (LSS) v0.1 — cổng bắt buộc + điểm hỗ trợ</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mục tiêu: biến câu "mức này quan trọng" thành các biến đo được TRƯỚC sự kiện. Trọng số KHÔNG chọn bằng mắt:</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">baseline = trọng số bằng nhau; sau đó ước lượng ngoài mẫu (logistic / ablation). Mọi thành phần: [HYPOTHESIS] [BACKTEST REQUIRED].</text>
<rect x="40.0" y="104.0" width="270.0" height="516.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="56.0" y="128.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">CỔNG (gate) — thiếu một = loại</text>
<rect x="54.0" y="144.0" width="242.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="66.0" y="166.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">G1 · Ex-ante</text>
<text x="66.0" y="186.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">mức xác định TRƯỚC sự kiện;</text>
<text x="66.0" y="201.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">ghi known_at</text>
<rect x="54.0" y="236.0" width="242.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="66.0" y="258.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">G2 · Swing đã xác nhận</text>
<text x="66.0" y="278.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">fractal n / directional-change θ</text>
<text x="66.0" y="293.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">ở timeframe T đã khai báo</text>
<rect x="54.0" y="328.0" width="242.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="66.0" y="350.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">G3 · Chưa bị lấy</text>
<text x="66.0" y="370.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">không có giao dịch vượt mức</text>
<text x="66.0" y="385.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">kể từ khi xác nhận</text>
<rect x="54.0" y="420.0" width="242.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="66.0" y="442.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">G4 · Đúng phía</text>
<text x="66.0" y="462.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">BSL phía trên giá hiện tại,</text>
<text x="66.0" y="477.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">SSL phía dưới</text>
<rect x="54.0" y="512.0" width="242.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="66.0" y="534.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">G5 · Không phải artifact</text>
<text x="66.0" y="554.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">không do gap rollover/DST,</text>
<text x="66.0" y="569.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">không phải spike tin dữ liệu bẩn</text>
<rect x="330.0" y="104.0" width="610.0" height="516.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<text x="346.0" y="128.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">ĐIỂM (score) — mỗi biến chuẩn hóa về 0–1</text>
<text x="346.0" y="152.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">Mã</text>
<text x="386.0" y="152.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">Thành phần</text>
<text x="550.0" y="152.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">Biến đo (ví dụ)</text>
<text x="760.0" y="152.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">Rủi ro tự lừa</text>
<line x1="342.0" y1="160.0" x2="928.0" y2="160.0" stroke="#D8DBE2" stroke-width="1"/>
<rect x="342.0" y="161.0" width="586.0" height="44.0" rx="4" fill="#EFF6FF"/>
<text x="350.0" y="190.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">S</text>
<text x="386.0" y="190.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Cấu trúc</text>
<text x="550.0" y="190.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">swing level 1–5; leg có displacement</text>
<text x="760.0" y="190.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">gán level sau khi biết kết quả</text>
<text x="350.0" y="236.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">T</text>
<text x="386.0" y="236.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Timeframe</text>
<text x="550.0" y="236.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">D1 &gt; H4 &gt; H1 &gt; M15 &gt; M5</text>
<text x="760.0" y="236.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">mặc định HTF luôn thắng</text>
<rect x="342.0" y="253.0" width="586.0" height="44.0" rx="4" fill="#EFF6FF"/>
<text x="350.0" y="282.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">V</text>
<text x="386.0" y="282.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Nhãn phiên/ngày</text>
<text x="550.0" y="282.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">PDH/PDL, PWH/PWL, Asia/London H-L</text>
<text x="760.0" y="282.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">đếm nhãn trùng = đếm 2 lần</text>
<text x="350.0" y="328.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">Q</text>
<text x="386.0" y="328.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Đối xứng</text>
<text x="550.0" y="328.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">EQH/EQL, |ΔH| ≤ tol·ATR</text>
<text x="760.0" y="328.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">tol nới ra cho vừa ý</text>
<rect x="342.0" y="345.0" width="586.0" height="44.0" rx="4" fill="#EFF6FF"/>
<text x="350.0" y="374.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">N</text>
<text x="386.0" y="374.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Số lần test</text>
<text x="550.0" y="374.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">số lần chạm mà không vượt</text>
<text x="760.0" y="374.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">test cũng có thể là hấp thụ</text>
<text x="350.0" y="420.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">A</text>
<text x="386.0" y="420.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Tuổi</text>
<text x="550.0" y="420.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">số nến từ khi hình thành</text>
<text x="760.0" y="420.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">chưa rõ dấu: tích lũy hay phai</text>
<rect x="342.0" y="437.0" width="586.0" height="44.0" rx="4" fill="#EFF6FF"/>
<text x="350.0" y="466.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">C</text>
<text x="386.0" y="466.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Bối cảnh range</text>
<text x="550.0" y="466.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">là ERL của range context?</text>
<text x="760.0" y="466.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">range chọn sau khi thấy giá</text>
<text x="350.0" y="512.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">D</text>
<text x="386.0" y="512.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Liên hệ DOL</text>
<text x="550.0" y="512.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">cùng hướng bias ex-ante?</text>
<text x="760.0" y="512.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">bias viết lại sau sự kiện</text>
<rect x="342.0" y="529.0" width="586.0" height="44.0" rx="4" fill="#EFF6FF"/>
<text x="350.0" y="558.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">X</text>
<text x="386.0" y="558.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">Khoảng cách</text>
<text x="550.0" y="558.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">(L − giá)/ATR → p_null</text>
<text x="760.0" y="558.0" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="start" font-style="italic">biến KIỂM SOÁT, không phải điểm</text>
<rect x="342.0" y="582.0" width="586.0" height="30.0" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
<text x="354.0" y="602.0" font-size="10.2" font-weight="600" fill="#B45309" text-anchor="start">LSS = Σ wᵢ·zᵢ  ·  phép thử: LSS có xếp hạng được tốc độ/độ sâu/phản ứng sau khi xuyên, SAU khi kiểm soát X?</text>
</svg>