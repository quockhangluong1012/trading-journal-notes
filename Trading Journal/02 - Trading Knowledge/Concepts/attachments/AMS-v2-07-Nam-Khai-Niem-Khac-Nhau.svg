<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="398" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Năm chuyện khác nhau về cùng một cái đáy</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đừng trộn chúng lại. Mỗi ô trả lời một câu hỏi riêng và xảy ra ở một thời điểm riêng.</text>
<rect x="827.0" y="22.0" width="145.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="899.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">KHÔNG ĐỒNG NHẤT</text>
<rect x="28.0" y="90.0" width="172.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.8"/>
<rect x="28.0" y="90.0" width="172.0" height="44.0" rx="10" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="0"/>
<text x="114.0" y="109.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Hình thành</text>
<text x="114.0" y="126.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Formation</text>
<text x="114.0" y="160.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Giá chạm một mức</text>
<text x="114.0" y="176.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">thấp rồi dừng rơi.</text>
<text x="114.0" y="192.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle"></text>
<text x="114.0" y="208.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Câu hỏi:</text>
<text x="114.0" y="224.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">"Có cái đáy nào</text>
<text x="114.0" y="240.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">vừa xuất hiện?"</text>
<line x1="201.0" y1="205.0" x2="217.0" y2="205.0" stroke="#6B7280" stroke-width="1.6"/>
<polygon points="217.0,205.0 209.6,208.1 209.6,201.9" fill="#6B7280"/>
<rect x="218.0" y="90.0" width="172.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
<rect x="218.0" y="90.0" width="172.0" height="44.0" rx="10" fill="#059669" stroke="#059669" stroke-width="0"/>
<text x="304.0" y="109.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Xác nhận</text>
<text x="304.0" y="126.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Confirmation</text>
<text x="304.0" y="160.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Nến bên phải đóng</text>
<text x="304.0" y="176.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">với đáy cao hơn.</text>
<text x="304.0" y="192.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle"></text>
<text x="304.0" y="208.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Câu hỏi:</text>
<text x="304.0" y="224.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">"Cái đáy đó đã</text>
<text x="304.0" y="240.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">chắc là đáy chưa?"</text>
<line x1="391.0" y1="205.0" x2="407.0" y2="205.0" stroke="#6B7280" stroke-width="1.6"/>
<polygon points="407.0,205.0 399.6,208.1 399.6,201.9" fill="#6B7280"/>
<rect x="408.0" y="90.0" width="172.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<rect x="408.0" y="90.0" width="172.0" height="44.0" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="494.0" y="109.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Phân loại</text>
<text x="494.0" y="126.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Classification</text>
<text x="494.0" y="160.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">So với hàng xóm</text>
<text x="494.0" y="176.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">cùng cấp ở hai bên.</text>
<text x="494.0" y="192.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle"></text>
<text x="494.0" y="208.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Câu hỏi:</text>
<text x="494.0" y="224.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">"Nó là STL, ITL</text>
<text x="494.0" y="240.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">hay LTL?"</text>
<line x1="581.0" y1="205.0" x2="597.0" y2="205.0" stroke="#6B7280" stroke-width="1.6"/>
<polygon points="597.0,205.0 589.6,208.1 589.6,201.9" fill="#6B7280"/>
<rect x="598.0" y="90.0" width="172.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
<rect x="598.0" y="90.0" width="172.0" height="44.0" rx="10" fill="#7C3AED" stroke="#7C3AED" stroke-width="0"/>
<text x="684.0" y="109.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Thứ bậc</text>
<text x="684.0" y="126.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Hierarchy</text>
<text x="684.0" y="160.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Đáy nào nằm trong</text>
<text x="684.0" y="176.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">vùng của đáy nào.</text>
<text x="684.0" y="192.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle"></text>
<text x="684.0" y="208.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Câu hỏi:</text>
<text x="684.0" y="224.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">"Ai là cha,</text>
<text x="684.0" y="240.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">ai là con?"</text>
<line x1="771.0" y1="205.0" x2="787.0" y2="205.0" stroke="#6B7280" stroke-width="1.6"/>
<polygon points="787.0,205.0 779.6,208.1 779.6,201.9" fill="#6B7280"/>
<rect x="788.0" y="90.0" width="172.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
<rect x="788.0" y="90.0" width="172.0" height="44.0" rx="10" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="874.0" y="109.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5. Ý nghĩa cấu trúc</text>
<text x="874.0" y="126.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Significance</text>
<text x="874.0" y="160.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Đáy đó đã LÀM gì:</text>
<text x="874.0" y="176.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">giữ xu hướng? bị phá?</text>
<text x="874.0" y="192.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle"></text>
<text x="874.0" y="208.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Câu hỏi:</text>
<text x="874.0" y="224.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">"Nếu nó vỡ thì</text>
<text x="874.0" y="240.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">điều gì thay đổi?"</text>
<text x="500.0" y="350.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Hình thành và xác nhận nhìn được trên nến. Phân loại và thứ bậc là quy ước của ICT.</text>
<text x="500.0" y="372.0" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Ý nghĩa cấu trúc là phần DIỄN GIẢI — phần duy nhất cần kiểm chứng bằng backtest.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
