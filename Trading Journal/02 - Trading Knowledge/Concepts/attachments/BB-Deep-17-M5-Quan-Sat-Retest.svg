<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ dựng. Vùng xanh rộng = Breaker H1. Các mức M5 (đáy sẽ bị quét, đỉnh cần bị phá) phải được đánh dấu TRƯỚC khi sự kiện xảy ra.</text>
