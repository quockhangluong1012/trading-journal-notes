<text x="32.0" y="605.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Phân biệt: Breaker H1 là VỊ TRÍ (location). Chuỗi sweep → MSS → FVG trên M5 là BẰNG CHỨNG phản ứng (evidence). Lệnh chỉ được xét khi có cả hai, đúng giờ, đúng</text>
<text x="32.0" y="620.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">gate.</text>
