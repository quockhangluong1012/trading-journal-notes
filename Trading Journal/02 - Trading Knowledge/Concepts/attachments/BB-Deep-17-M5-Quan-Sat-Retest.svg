<text x="718.0" y="115.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Đáy M5 bị quét bên trong vùng?</text>
<text x="718.0" y="133.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Ghi: có/không, sâu đến đâu trong vùng</text>
<text x="718.0" y="148.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">H1, có đóng dưới mép xa H1 không.</text>
<circle cx="699.0" cy="174.5" r="11" fill="#111827"/>
<text x="699.0" y="178.6" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="718.0" y="179.5" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">MSS M5 đóng trên swing đã đánh dấu?</text>
<text x="718.0" y="197.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ tính swing đã được đánh dấu TRƯỚC.</text>
<text x="718.0" y="213.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Swing tìm ra sau = mô tả, không phải</text>
<text x="718.0" y="228.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">bằng chứng.</text>
<circle cx="699.0" cy="254.7" r="11" fill="#6D28D9"/>
<text x="699.0" y="258.8" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="718.0" y="259.7" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">Có FVG / displacement để làm điểm vào?</text>
<text x="718.0" y="277.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Đây là quy tắc GIAO DỊCH, tách khỏi quy</text>
<text x="718.0" y="293.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">tắc NHẬN DIỆN breaker.</text>
<circle cx="699.0" cy="319.1" r="11" fill="#B45309"/>
<text x="699.0" y="323.3" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="718.0" y="324.1" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Nếu không có 1 + 2</text>
<text x="718.0" y="342.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Ghi “retest không có bằng chứng phản</text>
<text x="718.0" y="357.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">ứng”. Không ép kết luận.</text>
