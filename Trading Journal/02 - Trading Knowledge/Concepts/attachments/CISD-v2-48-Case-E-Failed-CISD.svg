<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case E — CISD thất bại: giá tiếp tục chặng cũ</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">CISD đúng định nghĩa, có cả phản ứng mạnh. Nhưng giá đóng lại dưới mức rồi phá đáy cú quét. Chặng xuống tiếp diễn.</text>
<rect x="903.9" y="22" width="68.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="937.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CASE E</text>
<text x="28.0" y="628.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
