<line x1="502.8" y1="103.0" x2="502.8" y2="547.0" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,3"/>
<text x="502.8" y="99.0" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">T3</text>
<line x1="534.6" y1="103.0" x2="534.6" y2="547.0" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,3"/>
<text x="534.6" y="99.0" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">T4</text>
<rect x="646.0" y="91.0" width="326.0" height="52.7" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="655.0" y="111.2" font-size="11.8" font-weight="700" fill="#2563EB" text-anchor="start">T0 · Sweep (#9)</text>
<text x="655.0" y="131.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Quét SSL. Kẻ mức CISD = open #6.</text>
<rect x="646.0" y="149.7" width="326.0" height="52.7" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="655.0" y="169.9" font-size="11.8" font-weight="700" fill="#D97706" text-anchor="start">T1 · CISD (#11)</text>
<text x="655.0" y="190.5" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng trên mức. Hợp lệ.</text>
<rect x="646.0" y="208.4" width="326.0" height="67.8" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="655.0" y="228.6" font-size="11.8" font-weight="700" fill="#EA580C" text-anchor="start">T2 · Thất bại mềm (#12)</text>
<text x="655.0" y="249.2" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng lại dưới mức. Lời “chặng xuống đã bị lấy lại” không</text>
<text x="655.0" y="264.3" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">còn đúng.</text>
<rect x="646.0" y="282.2" width="326.0" height="67.8" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="655.0" y="302.4" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start">T3 · (#13–#14)</text>
<text x="655.0" y="323.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Rơi tiếp. Nếu đã vào lệnh: stop ở đáy cú quét đang bị đe</text>
<text x="655.0" y="338.2" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">dọa.</text>
<rect x="646.0" y="356.0" width="326.0" height="52.7" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="655.0" y="376.2" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start">T4 · Thất bại cứng (#15)</text>
<text x="655.0" y="396.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Phá đáy cú quét. Kịch bản đảo chiều bị bác bỏ.</text>
<rect x="646.0" y="414.7" width="326.0" height="82.9" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="655.0" y="434.9" font-size="11.8" font-weight="700" fill="#059669" text-anchor="start">Kết luận được gì?</text>
<text x="655.0" y="455.6" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Thứ đã xảy ra ở #11 là thật, nhưng chỉ là MỘT nến. CISD là</text>
<text x="655.0" y="470.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">bằng chứng có thể bị rút lại; kế hoạch phải có sẵn điểm</text>
<text x="655.0" y="485.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">sai.</text>
