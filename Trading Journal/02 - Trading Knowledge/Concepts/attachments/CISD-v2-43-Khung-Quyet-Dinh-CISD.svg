<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs>
<rect x="1" y="1" width="998" height="678" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Khung quyết định CISD — 4 chặng, 13 câu hỏi</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đi từ trên xuống. Gặp ô đỏ → DỪNG, không phân tích CISD tiếp. Cuối cùng chỉ có 4 nhãn: Valid / Weak / Failed / Unclear, và một câu</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">hỏi riêng: có liên quan giao dịch không?</text>
<rect x="892.3" y="22" width="79.7" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="932.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DECISION</text>
<text x="28.0" y="668.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<rect x="28.0" y="112.0" width="228.0" height="30.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="142.0" y="132.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">A · BỐI CẢNH</text>
<rect x="28.0" y="156.0" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="38.0" y="176.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Biết bối cảnh HTF (bias, DOL, range)?</text>
<line x1="142.0" y1="190.1" x2="142.0" y2="200.1" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="85.1" y="202.1" width="113.9" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="142.0" y="217.1" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → đứng ngoài</text>
<line x1="142.0" y1="224.1" x2="142.0" y2="234.1" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="28.0" y="236.1" width="228.0" height="50.2" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="38.0" y="257.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Xác định được delivery hiện tại</text>
<text x="38.0" y="273.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(lên/xuống)?</text>
<line x1="142.0" y1="286.3" x2="142.0" y2="296.3" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="95.7" y="298.3" width="92.5" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="142.0" y="313.3" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không rõ → chờ</text>
<line x1="142.0" y1="320.3" x2="142.0" y2="330.3" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="28.0" y="332.3" width="228.0" height="50.2" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="38.0" y="353.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chặng đó chạy vào thanh khoản /</text>
<text x="38.0" y="369.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">POI?</text>
<line x1="142.0" y1="382.5" x2="142.0" y2="392.5" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="83.6" y="394.5" width="116.8" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="142.0" y="409.5" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Giữa range → bỏ qua</text>
<line x1="250.0" y1="127.0" x2="270.0" y2="127.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="266.0" y="112.0" width="228.0" height="30.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="380.0" y="132.0" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">B · ĐỊNH NGHĨA</text>
<rect x="266.0" y="156.0" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="276.0" y="176.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có chuỗi nến cùng chiều rõ ràng?</text>
<line x1="380.0" y1="190.1" x2="380.0" y2="200.1" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="314.0" y="202.1" width="132.0" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="380.0" y="217.1" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → không có CISD</text>
<line x1="380.0" y1="224.1" x2="380.0" y2="234.1" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="266.0" y="236.1" width="228.0" height="50.2" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="276.0" y="257.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đã kẻ mức = open nến đầu chuỗi</text>
<text x="276.0" y="273.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(trước khi biết kết quả)?</text>
<line x1="380.0" y1="286.3" x2="380.0" y2="296.3" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="312.4" y="298.3" width="135.2" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="380.0" y="313.3" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → đang hindsight</text>
<line x1="380.0" y1="320.3" x2="380.0" y2="330.3" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="266.0" y="332.3" width="228.0" height="50.2" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="276.0" y="353.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến của khung này ĐÃ ĐÓNG vượt</text>
<text x="276.0" y="369.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">mức?</text>
<line x1="380.0" y1="382.5" x2="380.0" y2="392.5" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="318.1" y="394.5" width="123.9" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="380.0" y="409.5" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Chưa → trạng thái S2</text>
<line x1="488.0" y1="127.0" x2="508.0" y2="127.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="504.0" y="112.0" width="228.0" height="30.0" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.4"/>
<text x="618.0" y="132.0" font-size="13" font-weight="700" fill="#4338CA" text-anchor="middle">C · CHẤT LƯỢNG</text>
<rect x="504.0" y="156.0" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="514.0" y="176.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không đóng lại phía bên kia mức?</text>
<line x1="618.0" y1="190.1" x2="618.0" y2="200.1" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="564.8" y="202.1" width="106.4" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="618.0" y="217.1" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Có → Failed (mềm)</text>
<line x1="618.0" y1="224.1" x2="618.0" y2="234.1" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="504.0" y="236.1" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="514.0" y="257.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có displacement / FVG?</text>
<line x1="618.0" y1="270.2" x2="618.0" y2="280.2" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="574.7" y="282.2" width="86.5" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="618.0" y="297.2" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → Weak</text>
<line x1="618.0" y1="304.2" x2="618.0" y2="314.2" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="504.0" y="316.2" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="514.0" y="337.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có MSS / cấu trúc theo sau?</text>
<line x1="618.0" y1="350.3" x2="618.0" y2="360.3" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="528.0" y="362.3" width="180.1" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="618.0" y="377.3" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → chưa xác nhận cấu trúc</text>
<line x1="618.0" y1="384.3" x2="618.0" y2="394.3" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="504.0" y="396.3" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="514.0" y="417.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thuận HTF hoặc có lý do HTF?</text>
<line x1="618.0" y1="430.4" x2="618.0" y2="440.4" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="544.4" y="442.4" width="147.1" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="618.0" y="457.4" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → Weak/ngược bias</text>
<line x1="726.0" y1="127.0" x2="746.0" y2="127.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="742.0" y="112.0" width="228.0" height="30.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="856.0" y="132.0" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">D · PHÂN LOẠI</text>
<rect x="742.0" y="156.0" width="228.0" height="50.2" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="752.0" y="176.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gắn nhãn: Valid / Weak / Failed /</text>
<text x="752.0" y="193.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Unclear</text>
<line x1="856.0" y1="208.2" x2="856.0" y2="218.2" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="742.0" y="220.2" width="228.0" height="50.2" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="752.0" y="241.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có liên quan giao dịch? (POI, R:R, kế</text>
<text x="752.0" y="257.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hoạch, killzone)</text>
<line x1="856.0" y1="270.4" x2="856.0" y2="280.4" stroke="#6B7280" stroke-width="1.2" marker-end="url(#ah6B7280)"/>
<rect x="791.5" y="282.4" width="129.1" height="20.0" rx="10.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="856.0" y="297.4" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Không → chỉ là dữ kiện</text>
<line x1="856.0" y1="304.4" x2="856.0" y2="314.4" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
<rect x="742.0" y="316.4" width="228.0" height="34.1" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="752.0" y="337.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ghi nhật ký + ảnh T0</text>
<rect x="28.0" y="488.0" width="228.0" height="77.4" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="40.0" y="512.4" font-size="13" font-weight="700" fill="#059669" text-anchor="start">VALID</text>
<text x="40.0" y="534.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đúng định nghĩa, có follow-through</text>
<text x="40.0" y="550.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ban đầu, bối cảnh rõ.</text>
<rect x="266.0" y="488.0" width="228.0" height="93.5" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="278.0" y="512.4" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">WEAK</text>
<text x="278.0" y="534.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đúng định nghĩa nhưng thiếu</text>
<text x="278.0" y="550.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">displacement / ngược HTF / ngoài</text>
<text x="278.0" y="566.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">POI.</text>
<rect x="504.0" y="488.0" width="228.0" height="77.4" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="516.0" y="512.4" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">FAILED</text>
<text x="516.0" y="534.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đã đóng lại phía bên kia mức (mềm)</text>
<text x="516.0" y="550.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hoặc phá cực trị (cứng).</text>
<rect x="742.0" y="488.0" width="228.0" height="77.4" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="754.0" y="512.4" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">UNCLEAR</text>
<text x="754.0" y="534.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không xác định được chuỗi, gap,</text>
<text x="754.0" y="550.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">khung lẫn lộn → không dùng.</text>
<rect x="28.0" y="608.0" width="944.0" height="54.2" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="40.0" y="630.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thứ tự A → B → C → D có lý do: không có bối cảnh thì “mức CISD” không có nghĩa (A); không đúng định nghĩa thì không cần chấm chất lượng (B); chất lượng cao vẫn</text>
<text x="40.0" y="647.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chưa chắc là lệnh (C → D).</text>
</svg>
