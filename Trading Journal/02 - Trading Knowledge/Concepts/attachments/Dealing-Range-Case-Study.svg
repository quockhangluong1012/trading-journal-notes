<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="760" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study — XAUUSD, thứ Năm, setup "đẹp như sách" nhưng THUA</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">Range D1 hợp lệ, discount rõ, FVG xác nhận — nhưng bỏ qua range tuần lớn hơn đang ở premium</text>

<!-- Chart area -->
<rect x="40" y="90" width="1120" height="420" fill="#1e293b" stroke="#334155" rx="8"/>
<line x1="70" y1="480" x2="1130" y2="480" stroke="#1c2333"/>

<!-- Weekly range (large, background) -->
<line x1="90" y1="140" x2="1110" y2="140" stroke="#f97316" stroke-dasharray="6,3" stroke-width="1.5"/>
<text x="900" y="135" font-size="12" fill="#f97316">Weekly range high (BSL) 2,412</text>
<line x1="90" y1="440" x2="1110" y2="440" stroke="#f97316" stroke-dasharray="6,3" stroke-width="1.5"/>
<text x="900" y="455" font-size="12" fill="#f97316">Weekly range low (SSL) 2,338</text>
<line x1="90" y1="290" x2="1110" y2="290" stroke="#f97316" stroke-width="1" stroke-dasharray="2,4" opacity="0.6"/>
<text x="1020" y="286" font-size="11" fill="#f97316">Weekly EQ 2,375</text>

<!-- D1 range (nested, smaller box near top = premium of weekly) -->
<rect x="600" y="160" width="480" height="140" fill="#ef4444" opacity="0.10" stroke="#ef4444" stroke-dasharray="3,3"/>
<text x="610" y="178" font-size="12" fill="#ef4444">D1 range: 2,388 (low) – 2,406 (high)</text>
<line x1="610" y1="230" x2="1070" y2="230" stroke="#a78bfa" stroke-dasharray="4,2"/>
<text x="1075" y="234" font-size="11" fill="#a78bfa">D1 EQ 2,397</text>

<!-- candles showing price near D1 discount but weekly premium -->
<rect x="650" y="255" width="14" height="30" fill="#ef4444"/><line x1="657" y1="245" x2="657" y2="295" stroke="#ef4444" stroke-width="2"/>
<rect x="675" y="240" width="14" height="35" fill="#22c55e"/><line x1="682" y1="230" x2="682" y2="285" stroke="#22c55e" stroke-width="2"/>
<rect x="700" y="220" width="14" height="30" fill="#22c55e"/><line x1="707" y1="210" x2="707" y2="260" stroke="#22c55e" stroke-width="2"/>
<circle cx="707" cy="240" r="7" fill="#38bdf8"/>
<text x="720" y="215" font-size="13" fill="#38bdf8" font-weight="bold">① Entry Long 2,391 — "D1 discount" (30% range D1)</text>

<!-- FVG box -->
<rect x="690" y="238" width="40" height="25" fill="#22c55e" opacity="0.2" stroke="#22c55e"/>
<text x="690" y="270" font-size="11" fill="#94a3b8">bullish D1 FVG</text>

<!-- price reversal after entry -->
<rect x="725" y="235" width="14" height="20" fill="#ef4444"/><line x1="732" y1="228" x2="732" y2="262" stroke="#ef4444" stroke-width="2"/>
<rect x="750" y="255" width="14" height="35" fill="#ef4444"/><line x1="757" y1="248" x2="757" y2="298" stroke="#ef4444" stroke-width="2"/>
<rect x="775" y="285" width="14" height="45" fill="#ef4444"/><line x1="782" y1="278" x2="782" y2="338" stroke="#ef4444" stroke-width="2"/>
<rect x="800" y="325" width="14" height="55" fill="#ef4444"/><line x1="807" y1="315" x2="807" y2="390" stroke="#ef4444" stroke-width="2"/>
<circle cx="807" cy="382" r="7" fill="#ef4444"/>
<text x="820" y="386" font-size="13" fill="#ef4444" font-weight="bold">② SL hit 2,378 (-1.3R) — giá xuyên thẳng về Weekly EQ</text>

<text x="60" y="500" font-size="13" fill="#eab308" font-weight="bold">Vì sao "đẹp như sách" vẫn thua:</text>

<!-- Bottom lesson box -->
<rect x="40" y="520" width="1120" height="210" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="550" font-size="14" fill="#e2e8f0">Entry 2,391 = discount 30% của range D1 (2,388–2,406) → trông hợp lệ theo checklist D1.</text>
<text x="60" y="575" font-size="14" fill="#e2e8f0">NHƯNG cùng mức giá 2,391 lại nằm ở khoảng 50-55% của Weekly range (2,338–2,412) → ngay sát Premium tuần.</text>
<text x="60" y="600" font-size="14" fill="#e2e8f0">Bẫy ma trận nested range (mục A2): "Discount D1, Premium Weekly" — trường hợp xung đột nguy hiểm nhất.</text>
<text x="60" y="630" font-size="14" fill="#f97316" font-weight="bold">Bài học: khi 2 tầng range mâu thuẫn, KHÔNG trade theo tầng nhỏ hơn một mình — giảm size hoặc đứng ngoài.</text>
<text x="60" y="655" font-size="13" fill="#94a3b8">Kết quả: -1.3R. Nếu kiểm tra Weekly range trước khi vào lệnh, setup này lẽ ra bị loại ngay ở bước Context.</text>
<text x="60" y="680" font-size="13" fill="#94a3b8">R:R kế hoạch 1:3 (target Weekly EQ 2,375→2,406) không bao giờ có cơ hội chạy vì hướng lệnh sai từ gốc.</text>
<text x="60" y="705" font-size="13" fill="#94a3b8">Instrument: XAUUSD, tick 0.1, 1 lot = 100oz — mức lệch 13 điểm entry tương đương 1,300 USD/lot rủi ro thực tế.</text>
</svg>
