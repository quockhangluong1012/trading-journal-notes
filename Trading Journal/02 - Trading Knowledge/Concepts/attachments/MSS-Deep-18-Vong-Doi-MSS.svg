<svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="520" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vòng đời một MSS — từ cấu trúc ổn định tới tiếp diễn / hồi / đảo / vô hiệu</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Màu = loại thông tin: xanh lá = quan sát được trực tiếp từ OHLC; tím = phân loại theo định nghĩa đã chọn; cam = diễn giải / giả thuyết.</text>
<rect x="30.0" y="100.0" width="214.0" height="92.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="137.0" y="130.0" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="middle">0. Cấu trúc ổn định</text>
<text x="137.0" y="154.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">chuỗi swing đã xác nhận</text>
<text x="137.0" y="176.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">known_at ≤ t</text>
<line x1="246.0" y1="146.0" x2="264.0" y2="146.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="266.0" y="100.0" width="214.0" height="92.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="373.0" y="130.0" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="middle">1. Tấn công mức</text>
<text x="373.0" y="154.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">giá tới gần mức tham chiếu</text>
<text x="373.0" y="176.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">known_at ≤ t</text>
<line x1="482.0" y1="146.0" x2="500.0" y2="146.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="502.0" y="100.0" width="214.0" height="92.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="609.0" y="130.0" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="middle">2. Vi phạm mức</text>
<text x="609.0" y="154.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">wick/close vượt</text>
<text x="609.0" y="176.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">known_at = t</text>
<line x1="718.0" y1="146.0" x2="736.0" y2="146.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="738.0" y="100.0" width="214.0" height="92.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="845.0" y="130.0" font-size="12.5" font-weight="800" fill="#6D28D9" text-anchor="middle">3. Break candidate</text>
<text x="845.0" y="154.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">G0: close ngược trạng thái</text>
<text x="845.0" y="176.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">known_at = t</text>
<rect x="30.0" y="250.0" width="214.0" height="92.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="137.0" y="280.0" font-size="12.5" font-weight="800" fill="#6D28D9" text-anchor="middle">4. Displacement?</text>
<text x="137.0" y="304.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">G1: leg/thân ≥ ngưỡng</text>
<text x="137.0" y="326.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">t (FVG: t+1)</text>
<line x1="246.0" y1="296.0" x2="264.0" y2="296.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="266.0" y="250.0" width="214.0" height="92.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="373.0" y="280.0" font-size="12.5" font-weight="800" fill="#6D28D9" text-anchor="middle">5. Giữ được?</text>
<text x="373.0" y="304.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">G2: không close ngược k nến</text>
<text x="373.0" y="326.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">t + k</text>
<line x1="482.0" y1="296.0" x2="500.0" y2="296.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="502.0" y="250.0" width="214.0" height="92.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="609.0" y="280.0" font-size="12.5" font-weight="800" fill="#6D28D9" text-anchor="middle">6. Cấu trúc mới?</text>
<text x="609.0" y="304.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">G3: HL/LH + BOS mới</text>
<text x="609.0" y="326.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">t + m</text>
<line x1="718.0" y1="296.0" x2="736.0" y2="296.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="738.0" y="250.0" width="214.0" height="92.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
<text x="845.0" y="280.0" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="middle">7. Kết cục</text>
<text x="845.0" y="304.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">tiếp diễn · hồi · đảo · vô hiệu</text>
<text x="845.0" y="326.0" font-size="9.4" font-weight="700" fill="#6B7280" text-anchor="middle">ex-post</text>
<path d="M 944 146 C 970 146, 970 250, 830 250 L 140 250 C 20 250, 20 280, 30 290" stroke="#9CA3AF" stroke-width="1.4" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="36.0" y1="288.0" x2="40.0" y2="296.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="26.0" y="410.0" width="928.0" height="94.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="431.0" font-size="10.2" font-weight="700" fill="#334155" text-anchor="start">Lối ra thất bại ở mỗi bậc (đều là dữ liệu, phải ghi lại):</text>
<text x="42.0" y="447.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Bậc 3→4: không đạt displacement → weak break.  • Bậc 4→5: close ngược qua mức trong k nến → FAILED MSS.  • Bậc 5→6: hết m nến → EXPIRED.</text>
<text x="42.0" y="464.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Mọi bậc: vi phạm ở HTF → đổi bối cảnh (không còn là câu hỏi của lớp này).</text>
<text x="42.0" y="480.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Chỉ ghi nhãn ở bậc mà known_at cho phép. Nhãn append-only — không sửa nhãn quá khứ khi biết kết cục (chống hindsight).</text>
</svg>