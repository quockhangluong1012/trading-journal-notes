<text x="38.0" y="394.0" font-size="13" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">Muốn biết bé có thật sự &quot;lên lầu&quot; không?</tspan></text>
<text x="38.0" y="413.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Phải xem bé có vượt qua đầu thang (đỉnh external) hay không — không phải đếm bé đã bước lên mấy bậc. Giới hạn: thị trường không có thang cuốn</tspan></text>
<text x="38.0" y="429.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>chạy đều; nhịp hồi có thể mạnh lên và phá đỉnh external thật.</tspan></text>
