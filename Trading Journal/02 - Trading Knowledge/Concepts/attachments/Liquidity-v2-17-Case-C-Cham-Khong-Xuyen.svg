<text x="655.0" y="212.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Lần này mức chưa bị giao dịch qua.</text>
<rect x="648.0" y="226.6" width="258.0" height="68.2" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="655.0" y="243.6" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Chưa thể kết luận</text>
<text x="655.0" y="260.6" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;Liquidity đã bị lấy&quot; — SAI về định nghĩa.</text>
<text x="655.0" y="274.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;Mức sẽ giữ được&quot; — chưa có cơ sở.</text>
<text x="655.0" y="288.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;Ai đó front-run&quot; — diễn giải.</text>
<rect x="648.0" y="302.9" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<text x="655.0" y="319.9" font-size="11" fill="#6B7280" font-weight="700" text-anchor="start">Theo dõi tiếp</text>
<text x="655.0" y="336.8" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Mức vẫn trong danh sách (G3 còn đúng).</text>
<text x="655.0" y="350.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Ghi số lần chạm N (biến của LSS).</text>
<rect x="648.0" y="365.1" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="655.0" y="382.1" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">Cập nhật khi</text>
<text x="655.0" y="399.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Giá quay lại xuyên L → phân xử mới;</text>
<text x="655.0" y="413.0" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">hoặc cấu trúc đổi làm mức mất vai trò.</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Nhiều trader gọi Case C là &quot;sweep yếu&quot; khi giá sau đó giảm — đó là đổi định nghĩa theo kết quả. Nếu muốn nghiên cứu &quot;front-run&quot;,</text>
<text x="40.0" y="559.5" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">tạo biến riêng (khoảng cách thiếu / ATR) và đo tách biệt, đừng gộp vào nhóm sweep.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-17-Case-C-Cham-Khong-Xuyen · Nến minh họa, giá giả định. T0…T5 = thứ tự thông tin xuất hiện; chỉ T5 là thông tin hậu kiểm (ex-post).</text>
