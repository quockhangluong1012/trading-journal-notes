<text x="655.0" y="149.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">High cách L dưới ε (E1) hoặc chưa tới</text>
<text x="655.0" y="163.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">(E0). Close dưới L.</text>
<rect x="648.0" y="178.3" width="258.0" height="40.4" rx="7" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
