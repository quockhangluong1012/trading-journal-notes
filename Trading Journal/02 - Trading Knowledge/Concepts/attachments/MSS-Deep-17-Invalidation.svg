<rect x="26.0" y="496.0" width="928.0" height="88.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="517.0" font-size="10.1" font-weight="700" fill="#334155" text-anchor="start">Phân biệt: 'MSS thất bại' (cấu trúc không giữ) ≠ 'lệnh thua' (stop bị chạm) ≠ 'bias sai' (HTF sai). Ba thứ, ba trường journal.</text>
<text x="42.0" y="534.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">Quy tắc v1 giữ nguyên (đã gắn nhãn): close ngược qua mức MSS + nến sau giữ bên kia = thoát (I2 + 1 nến xác nhận). [RULE-MSS-008 · BACKTEST REQUIRED]</text>
<text x="42.0" y="551.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">Chọn một định nghĩa cho STOP (I4 thường dùng) và một cho ĐÁNH GIÁ cấu trúc (I2/I6) — đừng trộn lẫn khi thống kê.</text>
