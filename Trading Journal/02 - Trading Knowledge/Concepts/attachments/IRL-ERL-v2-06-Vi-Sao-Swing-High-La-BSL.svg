<text x="679.3" y="399.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">• Hai đỉnh bằng nhau trông như một “trần nhà”</text>
<text x="679.3" y="415.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">chắc chắn ⇒ nhiều người dùng chung một chỗ.</text>
<text x="679.3" y="455.0" font-size="11.8" font-weight="700" fill="#D97706" text-anchor="start" data-maxw="278.7">[DIỄN GIẢI] cụm lệnh có thể dày hơn đỉnh đơn —</text>
<text x="679.3" y="471.3" font-size="11.8" font-weight="700" fill="#D97706" text-anchor="start" data-maxw="278.7">không đo được trên chart.</text>
<rect x="28.0" y="527.0" width="944.0" height="51.6" rx="10" fill="#FFFBEB" stroke="#F5D08A" stroke-width="1.2"/>
<text x="42.0" y="551.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giới hạn: chart KHÔNG hiển thị stop. Các chấm tròn trong hình là chỗ lệnh CÓ THỂ nằm, không phải dữ liệu. Một mức giá nhìn thấy trên chart không phải một</text>
<text x="42.0" y="567.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">“lượng liquidity” đo được.</text>
