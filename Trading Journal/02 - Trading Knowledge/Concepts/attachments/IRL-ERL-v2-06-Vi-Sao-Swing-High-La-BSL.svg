<circle cx="278.3" cy="206.6" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="302.5" cy="206.6" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="241.9" y="194.6" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">BSL</text>
<text x="42.0" y="399.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">• Người BÁN KHỐNG đặt stop-loss ngay trên đỉnh</text>
<text x="42.0" y="415.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">⇒ khi kích hoạt là lệnh MUA.</text>
<text x="42.0" y="439.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">• Người chờ phá đỉnh đặt buy stop ⇒ cũng là lệnh</text>
<text x="42.0" y="455.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">MUA.</text>
<text x="42.0" y="479.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start" data-maxw="278.7">⇒ Buy-side Liquidity = cụm lệnh MUA chờ trên</text>
<text x="42.0" y="495.3" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start" data-maxw="278.7">đỉnh.</text>
<rect x="346.7" y="113.0" width="306.7" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="360.7" y="135.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Swing low → SSL</text>
<path d="M366.7,222.8 L390.9,253.7 L415.2,243.4 L439.4,284.6 L463.6,313.4 L487.9,292.8 L512.1,274.3 L536.4,288.7 L560.6,264.0 L584.8,251.6 L609.1,268.1 L633.3,259.9" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
