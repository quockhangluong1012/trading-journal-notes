<circle cx="597.0" cy="321.4" r="2.8000000000000003" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="621.2" cy="321.4" r="2.8000000000000003" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="560.6" y="339.4" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">SSL</text>
<text x="360.7" y="399.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">• Người MUA đặt stop-loss ngay dưới đáy ⇒ khi</text>
<text x="360.7" y="415.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">kích hoạt là lệnh BÁN.</text>
<text x="360.7" y="439.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">• Người chờ phá đáy đặt sell stop ⇒ cũng là lệnh</text>
<text x="360.7" y="455.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">BÁN.</text>
<text x="360.7" y="479.0" font-size="11.8" font-weight="700" fill="#1D4ED8" text-anchor="start" data-maxw="278.7">⇒ Sell-side Liquidity = cụm lệnh BÁN chờ dưới</text>
<text x="360.7" y="495.3" font-size="11.8" font-weight="700" fill="#1D4ED8" text-anchor="start" data-maxw="278.7">đáy.</text>
<rect x="665.3" y="113.0" width="306.7" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="679.3" y="135.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">Equal Highs (EQH) — mốc “quá rõ”</text>
