<text x="312.7" y="228.1" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end">swing high</text>
<circle cx="181.3" cy="206.6" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="205.6" cy="206.6" r="2.8000000000000003" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
