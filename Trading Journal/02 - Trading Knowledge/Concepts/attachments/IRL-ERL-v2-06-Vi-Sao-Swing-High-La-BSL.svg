<svg viewBox="0 0 1000 599" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="597" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="895.2" y="22" width="76.8" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="933.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">BSL / SSL</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao một swing high có thể trở thành Buy-side Liquidity — và swing low thành</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Sell-side Liquidity</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mốc càng dễ thấy thì càng nhiều người dùng nó để đặt stop hoặc lệnh breakout. Đó là lý do ICT quan tâm tới đỉnh/đáy cũ và đỉnh/đáy bằng nhau.</text>
<rect x="28.0" y="113.0" width="306.7" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="135.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">Swing high → BSL</text>
<path d="M48.0,305.2 L72.2,274.3 L96.5,284.6 L120.7,243.4 L145.0,214.6 L169.2,235.2 L193.5,253.7 L217.7,239.3 L241.9,264.0 L266.2,276.4 L290.4,259.9 L314.7,268.1" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
