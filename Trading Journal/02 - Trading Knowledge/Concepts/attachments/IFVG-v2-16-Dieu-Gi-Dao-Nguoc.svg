<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Khi FVG thành IFVG — điều gì THỰC SỰ đảo ngược?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba thứ thay đổi, mỗi thứ thuộc một loại sự thật khác nhau. Và có một thứ KHÔNG hề thay đổi.</text>
