<text x="44.0" y="512.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">* Quan sát được NẾU bạn đã định nghĩa swing (đỉnh/đáy) bằng một quy tắc cố định trước khi nhìn kết quả.</text>
<rect x="28.0" y="561.0" width="944.0" height="57.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="46.0" y="587.0" font-size="12.5" font-weight="600" fill="#7C3AED" text-anchor="start">Thứ KHÔNG đảo: bản thân vùng 104–106. Không có 'năng lượng' hay 'trí nhớ' nằm trong vùng giá. Cái thay đổi là (1) giá đang ở phía nào, (2) cấu</text>
<text x="46.0" y="604.5" font-size="12.5" font-weight="600" fill="#7C3AED" text-anchor="start">trúc đã gãy chưa, (3) chúng ta kỳ vọng gì — và chỉ (1), (2) là thứ nhìn thấy được.</text>
