<text x="736.0" y="424.0" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="start">chặn?</text>
<text x="812.0" y="426.0" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="start">Vùng được kỳ vọng CHẶN</text>
