<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">D1 → H1 → M5: IRL/ERL ở mỗi tầng làm một việc khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">D1 = CONTEXT (range lớn, ERL đích, IRL nơi giá đang hồi về). H1 = SETUP (giá đang làm gì bên trong IRL của D1). M5 = EXECUTION (sweep → MSS →</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">displacement → FVG). M5 không tự đứng một mình.</text>
