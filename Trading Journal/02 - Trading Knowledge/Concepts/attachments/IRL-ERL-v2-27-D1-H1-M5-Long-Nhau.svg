<text x="42.0" y="802.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mục tiêu theo tầng: T1 = đỉnh H1 gần nhất (ERL-H1, chỉ là IRL với D1) · T2 = ERL D1. Stop dưới cực trị cú sweep M5. Nếu giá đóng cửa D1 xuyên qua FVG D1 ⇒</text>
