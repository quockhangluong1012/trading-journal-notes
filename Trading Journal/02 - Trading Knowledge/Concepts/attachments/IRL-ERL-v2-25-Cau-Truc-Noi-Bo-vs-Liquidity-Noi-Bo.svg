<text x="473.1" y="402.4" font-size="10.5" font-weight="600" fill="#059669" text-anchor="start" data-maxw="170.0">phá iLH = MSS NỘI BỘ: nhịp hồi</text>
<text x="473.1" y="416.0" font-size="10.5" font-weight="600" fill="#059669" text-anchor="start" data-maxw="170.0">kết thúc (ứng viên)</text>
<line x1="220.6" y1="281.7" x2="636.0" y2="281.7" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="285.6" y="276.7" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">HH cũ = ERL trên của nhịp hồi</text>
<text x="536.7" y="322.7" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG</text>
<rect x="664.0" y="104.0" width="308.0" height="109.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="114.0" width="4.0" height="89.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="127.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">Internal structure</text>
<text x="680.0" y="148.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Chuỗi iLH / iLL bên trong nhịp hồi. Trả lời: nhịp hồi</text>
<text x="680.0" y="164.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">còn đang chạy hay đã dừng?</text>
<rect x="664.0" y="221.0" width="308.0" height="109.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="231.0" width="4.0" height="89.0" rx="2" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="244.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">Internal liquidity</text>
<text x="680.0" y="265.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Stop trên các iLH (BSL nội bộ), stop dưới iLL, và</text>
<text x="680.0" y="281.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">FVG bên trong. Trả lời: giá có thể ghé đâu?</text>
<rect x="664.0" y="338.0" width="308.0" height="109.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="348.0" width="4.0" height="89.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="361.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">MSS bên trong range</text>
<text x="680.0" y="382.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Phá iLH sau khi lấy SSL nội bộ ⇒ nhịp hồi CÓ THỂ</text>
<text x="680.0" y="398.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">đã xong. Không đổi cấu trúc lớn (vẫn HH–HL).</text>
<rect x="664.0" y="455.0" width="308.0" height="109.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="465.0" width="4.0" height="89.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="478.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">MSS sau khi sweep ERL</text>
<text x="680.0" y="499.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Nếu cú phá xảy ra ngay sau khi lấy ERL của range</text>
<text x="680.0" y="515.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">lớn, nó có thể là dấu hiệu đổi nhịp của CẢ range.</text>
<text x="680.0" y="531.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Tầm lớn hơn — vẫn cần bằng chứng.</text>
<rect x="28.0" y="578.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="602.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không thể phân biệt internal/external structure CHỈ bằng khung thời gian. Một swing là “external” khi nó định ra range đang dùng; một swing H1 có thể là external</text>
<text x="42.0" y="618.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">của range H1 nhưng internal của range D1.</text>
