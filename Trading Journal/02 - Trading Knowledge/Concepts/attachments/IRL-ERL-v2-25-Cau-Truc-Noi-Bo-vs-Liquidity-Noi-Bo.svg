<text x="925.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STRUCTURE</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Internal STRUCTURE và internal LIQUIDITY không phải một thứ</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Structure mô tả giá ĐÃ ĐI như thế nào (chuỗi đỉnh/đáy). Liquidity mô tả giá CÓ THỂ ĐẾN đâu (chỗ lệnh chờ có thể nằm, chỗ imbalance). Cùng các đỉnh/đáy, hai</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">câu hỏi khác nhau.</text>
<rect x="28.0" y="104.0" width="620.0" height="460.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
