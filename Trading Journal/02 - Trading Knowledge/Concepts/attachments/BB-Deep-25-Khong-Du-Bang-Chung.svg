<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Không đủ bằng chứng để kết luận — UNCLEAR là một đầu ra HỢP LỆ</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ dựng: vùng đi ngang chồng chéo. Có thể vẽ “breaker” ở ba chỗ tùy cách chọn swing — dấu hiệu định nghĩa không áp dụng được ở đây.</text>
