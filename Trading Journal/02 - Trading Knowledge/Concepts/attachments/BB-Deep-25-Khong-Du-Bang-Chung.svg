<text x="498.6" y="128.7" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">đóng trên đỉnh nào?</text>
<rect x="636.0" y="74.0" width="324.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="648.0" y="95.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Vì sao giữ UNCLEAR</text>
<text x="650.0" y="116.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Nhiều đỉnh/đáy gần bằng nhau → không có swing</text>
<text x="650.0" y="131.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nào nổi bật về cấp.</text>
<text x="650.0" y="155.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Cú “phá” chỉ vượt đỉnh gần nhất một chút rồi đi</text>
<text x="650.0" y="171.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">ngang → không có hệ quả cấu trúc.</text>
<text x="650.0" y="194.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Đổi cách chọn swing → đổi vùng breaker. Một định</text>
<text x="650.0" y="210.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nghĩa tốt không được nhạy như vậy.</text>
<text x="650.0" y="234.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Kết luận đúng: “chưa xác định”. Ghi lại để thống kê</text>
<text x="650.0" y="250.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">tần suất UNCLEAR, không ép thành nhãn.</text>
<rect x="20.0" y="486.0" width="940.0" height="33.5" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
<rect x="20.0" y="486.0" width="4.0" height="33.5" rx="2" fill="#B45309"/>
<text x="32.0" y="507.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Một hệ thống trung thực có tỷ lệ UNCLEAR khác 0. Nếu journal của bạn không bao giờ có UNCLEAR, khả năng cao là bạn đang gán nhãn sau khi đã biết kết quả.</text>
