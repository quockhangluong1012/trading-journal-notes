<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="792.5" y="22" width="179.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="882.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LEVEL 2 · VÍ DỤ ĐƠN GIẢN</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Gap trên chart nến — Hai cách đo khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ đơn giản (số minh họa). Phiên trước giao dịch từ 100 đến 105, đóng cửa 104. Phiên sau mở cửa 110, thấp nhất 108, cao</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nhất 112.</text>
<rect x="28.0" y="100.0" width="520.0" height="440.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="120.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Chart ngày (D1)</text>
<rect x="372.0" y="270.5" width="168.0" height="70.2" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.85"/>
<line x1="64.0" y1="387.5" x2="64.0" y2="453.1" stroke="#0F9D74" stroke-width="1.2"/>
<rect x="46.6" y="399.2" width="34.7" height="35.1" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6"/>
<line x1="120.0" y1="350.1" x2="120.0" y2="425.0" stroke="#E0464B" stroke-width="1.2"/>
<rect x="102.6" y="399.2" width="34.7" height="16.4" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6"/>
<line x1="176.0" y1="378.2" x2="176.0" y2="448.4" stroke="#0F9D74" stroke-width="1.2"/>
<rect x="158.6" y="387.5" width="34.7" height="28.1" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6"/>
<line x1="232.0" y1="359.4" x2="232.0" y2="418.0" stroke="#E0464B" stroke-width="1.2"/>
<rect x="214.6" y="387.5" width="34.7" height="18.7" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6"/>
<line x1="288.0" y1="373.5" x2="288.0" y2="439.0" stroke="#E0464B" stroke-width="1.2"/>
<rect x="270.6" y="406.3" width="34.7" height="21.1" rx="0" fill="#E0464B" stroke="#E0464B" stroke-width="0.6"/>
<line x1="344.0" y1="340.7" x2="344.0" y2="446.1" stroke="#0F9D74" stroke-width="1.2"/>
<rect x="326.6" y="364.1" width="34.7" height="63.2" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6"/>
<line x1="400.0" y1="176.8" x2="400.0" y2="270.5" stroke="#0F9D74" stroke-width="1.2"/>
<rect x="382.6" y="188.5" width="34.7" height="35.1" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6"/>
<line x1="36.0" y1="340.7" x2="540.0" y2="340.7" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="538.0" y="336.7" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">high phiên trước = 105</text>
<line x1="372.0" y1="270.5" x2="540.0" y2="270.5" stroke="#0F9D74" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="538.0" y="266.5" font-size="10" font-weight="700" fill="#0F9D74" text-anchor="end">low phiên sau = 108</text>
<text x="353.0" y="368.1" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">đóng 104</text>
<text x="378.0" y="227.6" font-size="10" font-weight="700" fill="#E0464B" text-anchor="end">mở 110</text>
<line x1="462.0" y1="364.1" x2="462.0" y2="223.6" stroke="#D97706" stroke-width="2"/>
<line x1="457.0" y1="364.1" x2="467.0" y2="364.1" stroke="#D97706" stroke-width="2"/>
<line x1="457.0" y1="223.6" x2="467.0" y2="223.6" stroke="#D97706" stroke-width="2"/>
<text x="470.0" y="297.9" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="start">104 → 110</text>
<text x="334.0" y="309.6" font-size="10.5" font-weight="700" fill="#0F9D74" text-anchor="end">105 → 108</text>
<rect x="568.0" y="100.0" width="404.0" height="80.9" rx="8" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.1"/>
<text x="578.0" y="119.5" font-size="11.5" font-weight="700" fill="#0F9D74" text-anchor="start">Cách đo 1 — Full gap (High ↔ Low)</text>
<text x="578.0" y="136.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Lấy HIGH của nến trước và LOW của nến sau. Nếu hai đoạn này không</text>
<text x="578.0" y="152.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chạm nhau → có khoảng trống thật: cả phiên sau KHÔNG quay lại vùng</text>
<text x="578.0" y="168.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">105–108. Đây là cách đo trong TA cổ điển (Bulkowski, StockCharts).</text>
<rect x="568.0" y="190.9" width="404.0" height="65.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
<text x="578.0" y="210.4" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">Cách đo 2 — Opening gap (Close → Open)</text>
<text x="578.0" y="227.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Lấy giá ĐÓNG CỬA phiên trước và giá MỞ CỬA phiên sau. Đây là</text>
<text x="578.0" y="243.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">'opening gap'. ICT dùng kiểu đo này cho NDOG/NWOG.</text>
<rect x="568.0" y="265.9" width="404.0" height="80.9" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1.1"/>
<text x="578.0" y="285.4" font-size="11.5" font-weight="700" fill="#E0464B" text-anchor="start">Vì sao phải nói rõ đang đo kiểu nào?</text>
<text x="578.0" y="302.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nếu phiên sau mở ở 110 nhưng trong ngày rơi xuống 104: opening gap</text>
<text x="578.0" y="318.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">vẫn có (104 → 110), nhưng full gap không còn — trong ngày giá đã đi lại</text>
<text x="578.0" y="334.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">toàn bộ khoảng đó. Chart D1 sẽ không còn 'lỗ hổng' nào.</text>
<rect x="568.0" y="356.7" width="404.0" height="65.0" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.1"/>
<text x="578.0" y="376.2" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">Quy tắc ghi chép</text>
<text x="578.0" y="393.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Luôn ghi rõ: gap đo bằng High/Low hay Close/Open, trên khung nào,</text>
<text x="578.0" y="409.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">và phiên nào.</text>
