<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mk64748B" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect x="1" y="1" width="998" height="658" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mental model cuối cùng: AMD = 3 câu hỏi + 1 câu hỏi kiểm tra trung thực</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không cần nhớ hình mẫu. Chỉ cần hỏi đúng thứ tự, trong đúng bối cảnh, và biết mình đang hỏi TRƯỚC hay SAU khi giá chạy.</text>
<rect x="855.2" y="22.0" width="116.8" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="913.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">MENTAL MODEL</text>
<rect x="28.0" y="100.0" width="944.0" height="380.0" rx="14" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="48.0" y="128.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">BỐI CẢNH (D1 + thời gian): đích ở đâu? giá rẻ hay đắt? hôm nay có tin không? đang ở phiên nào?</text>
<rect x="48.0" y="148.0" width="284.0" height="250.0" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="74.0" cy="178.0" r="14" fill="#2563EB"/>
<text x="74.0" y="183.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="96.0" y="176.0" font-size="14" font-weight="800" fill="#2563EB" text-anchor="start">Giá đang CHỜ ở đâu?</text>
<text x="66.0" y="250.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Có vùng cân bằng với mép rõ không? Lệnh</text>
<text x="66.0" y="266.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chờ có thể nằm ở đâu?</text>
<rect x="60.0" y="336.0" width="260.0" height="50.0" rx="8" fill="#FFFFFF"/>
<text x="70.0" y="356.0" font-size="11.2" font-weight="700" fill="#B91C1C" text-anchor="start">Không → không có A, không có AMD.</text>
<line x1="334.0" y1="270.0" x2="346.0" y2="270.0" stroke="#64748B" stroke-width="2.4" marker-end="url(#mk64748B)"/>
<rect x="348.0" y="148.0" width="284.0" height="250.0" rx="12" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.5"/>
<circle cx="374.0" cy="178.0" r="14" fill="#EA580C"/>
<text x="374.0" y="183.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="396.0" y="176.0" font-size="14" font-weight="800" fill="#EA580C" text-anchor="start">Phía nào vừa bị THỬ — và có</text>
<text x="396.0" y="193.5" font-size="14" font-weight="800" fill="#EA580C" text-anchor="start">bị TỪ CHỐI không?</text>
<text x="366.0" y="250.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Cú lệch có ngược đích không? Có lấy pool</text>
<text x="366.0" y="266.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">rõ không? Có quay vào không?</text>
<rect x="360.0" y="336.0" width="260.0" height="50.0" rx="8" fill="#FFFFFF"/>
<text x="370.0" y="356.0" font-size="11.2" font-weight="700" fill="#B91C1C" text-anchor="start">Không bị từ chối → có thể là breakout</text>
<text x="370.0" y="370.6" font-size="11.2" font-weight="700" fill="#B91C1C" text-anchor="start">thật.</text>
<line x1="634.0" y1="270.0" x2="646.0" y2="270.0" stroke="#64748B" stroke-width="2.4" marker-end="url(#mk64748B)"/>
<rect x="648.0" y="148.0" width="284.0" height="250.0" rx="12" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="674.0" cy="178.0" r="14" fill="#7C3AED"/>
<text x="674.0" y="183.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="696.0" y="176.0" font-size="14" font-weight="800" fill="#7C3AED" text-anchor="start">Giá có ĐI THẬT về phía bên</text>
<text x="696.0" y="193.5" font-size="14" font-weight="800" fill="#7C3AED" text-anchor="start">kia không?</text>
<text x="666.0" y="250.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Displacement? MSS đúng swing? Giữ được</text>
<text x="666.0" y="266.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hướng? Đích còn đủ xa?</text>
<rect x="660.0" y="336.0" width="260.0" height="50.0" rx="8" fill="#FFFFFF"/>
<text x="670.0" y="356.0" font-size="11.2" font-weight="700" fill="#B91C1C" text-anchor="start">Không có lực → chỉ là range lớn hơn.</text>
<rect x="48.0" y="410.0" width="904.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#BE123C" stroke-width="1.5"/>
<text x="500.0" y="433.0" font-size="13" font-weight="800" fill="#BE123C" text-anchor="middle">CÂU HỎI KIỂM TRA: Mình trả lời 3 câu trên TRƯỚC khi giá chạy, hay SAU khi đã thấy kết quả?</text>
<text x="500.0" y="453.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Nếu là SAU → đó là một câu chuyện hay, không phải một tín hiệu.</text>
<rect x="28.0" y="496.0" width="306.0" height="70.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.2"/>
<text x="42.0" y="522.0" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="start">3 câu đều “có” + entry hợp lệ</text>
<text x="42.0" y="546.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Xem xét vào lệnh, rủi ro cố định</text>
<rect x="346.0" y="496.0" width="306.0" height="70.0" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
<text x="360.0" y="522.0" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="start">Đang dừng ở câu 1 hoặc 2</text>
<text x="360.0" y="546.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chờ — ghi trạng thái S1/S2</text>
<rect x="664.0" y="496.0" width="306.0" height="70.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="678.0" y="522.0" font-size="12.5" font-weight="800" fill="#B91C1C" text-anchor="start">Bất kỳ câu nào “không”</text>
<text x="678.0" y="546.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đứng ngoài — ghi lý do</text>
<rect x="28.0" y="580.0" width="944.0" height="32.5" rx="8" fill="#EEF0FF" stroke="#4338CA" stroke-width="1"/>
<text x="38.0" y="602.5" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Một câu để nhớ: “AMD không dự đoán giá. AMD sắp xếp thứ tự những bằng chứng mình cần thấy trước khi tin rằng giá đã chọn hướng.”</text>
</svg>
