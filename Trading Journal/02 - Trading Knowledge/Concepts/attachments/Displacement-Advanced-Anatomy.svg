<svg viewBox="0 0 760 490" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="dpa1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="490" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Giải phẫu định lượng một Displacement hợp lệ</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">5 yếu tố phải cùng xuất hiện để một cú đẩy giá được gọi là "displacement" — không phải chỉ nhìn thấy nến to</text>

  <rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- structure level -->
  <line x1="44" y1="300" x2="704" y2="300" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="52" y="294" font-size="10.5" fill="#6B7280">Mức cấu trúc (lower-high / higher-low) cần bị phá</text>

  <!-- SSL sweep level -->
  <line x1="44" y1="392" x2="230" y2="392" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="52" y="386" font-size="10.5" font-weight="700" fill="#B45309">① Liquidity sweep hợp lệ (SSL) — điều kiện bắt buộc đứng trước</text>

  <!-- pre-sweep small path -->
  <path d="M70,340 L110,360 L150,375 L185,392" fill="none" stroke="#6B7280" stroke-width="2"/>
  <circle cx="185" cy="392" r="6" fill="none" stroke="#B45309" stroke-width="2.4"/>

  <!-- displacement candle sequence (staircase of 3) -->
  <rect x="221" y="230" width="2" height="160" fill="#16A34A"/><rect x="215" y="238" width="12" height="146" fill="#16A34A" rx="1"/>
  <rect x="255" y="190" width="2" height="150" fill="#16A34A"/><rect x="249" y="196" width="12" height="136" fill="#16A34A" rx="1"/>
  <rect x="289" y="140" width="2" height="150" fill="#16A34A"/><rect x="283" y="146" width="12" height="136" fill="#16A34A" rx="1"/>

  <text x="221" y="120" font-size="10.5" font-weight="700" fill="#15803D">② Chuỗi nến thân lớn (body-to-range cao),</text>
  <text x="221" y="135" font-size="10.5" font-weight="700" fill="#15803D">wick hai đầu ngắn — lệch pha order flow thật</text>

  <!-- overlap indicator brackets -->
  <path d="M227,255 L249,255" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#dpa1)"/>
  <path d="M261,215 L283,215" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#dpa1)"/>
  <text x="330" y="205" font-size="10" font-weight="700" fill="#1D4ED8">③ Wick nến sau KHÔNG lấp thân nến trước</text>
  <text x="330" y="219" font-size="10" fill="#1D4ED8">(overlap thấp) — dấu hiệu lệch pha thật</text>

  <!-- close beyond structure -->
  <circle cx="289" cy="290" r="0" />
  <path d="M289,300 L289,270" stroke="#DC2626" stroke-width="0" />
  <text x="330" y="300" font-size="10.5" font-weight="700" fill="#B91C1C">④ Đóng cửa vượt mức cấu trúc — acceptance thật,</text>
  <text x="330" y="314" font-size="10.5" font-weight="700" fill="#B91C1C">không phải một wick xuyên qua tạm thời</text>

  <!-- FVG box -->
  <rect x="221" y="196" width="70" height="42" fill="#3B82F6" opacity="0.16"/>
  <text x="223" y="192" font-size="9.5" fill="#1D4ED8" font-weight="700">⑤ FVG để lại</text>
  <text x="405" y="230" font-size="10.5" font-weight="700" fill="#1D4ED8">⑤ FVG đủ rộng so với ATR — nguyên liệu cho POI kế tiếp,</text>
  <text x="405" y="244" font-size="10.5" font-weight="700" fill="#1D4ED8">không phải một khe hở vài tick không đáng kể</text>

  <!-- continuation candles after -->
  <rect x="323" y="110" width="2" height="60" fill="#16A34A"/><rect x="317" y="116" width="12" height="48" fill="#16A34A" rx="1" opacity="0.6"/>
  <path d="M335,130 L390,90" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#dpa1)"/>
  <text x="400" y="95" font-size="10" fill="#15803D">Tiếp diễn sau đó → xác nhận không phải exhaustion</text>

  <rect x="24" y="460" width="712" height="0" rx="6" fill="#FEF3C7"/>
  <text x="24" y="470" font-size="11" fill="#6B7280">Thiếu một trong 5 yếu tố trên, cú đẩy vẫn có thể chỉ là expansion thông thường, exhaustion spike, hoặc news wick — xem bảng chẩn đoán §3.3.</text>
</svg>
