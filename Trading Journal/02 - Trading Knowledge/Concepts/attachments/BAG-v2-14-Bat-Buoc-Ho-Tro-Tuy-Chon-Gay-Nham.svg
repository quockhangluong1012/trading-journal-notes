<svg viewBox="0 0 1000 470" width="1000" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="468" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="882.4" y="22" width="89.6" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="927.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NHẬN DIỆN</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Đặc điểm của Breakaway Gap — Bắt buộc, Hỗ trợ, Tùy chọn, Gây nhầm</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phân loại này là KHUNG NGHIÊN CỨU của note, dựa trên định nghĩa TA cổ điển. Chỉ cột 1 là định nghĩa; các cột còn lại là bằng chứng,</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">không phải điều kiện.</text>
<rect x="28.0" y="100.0" width="229.0" height="350.0" rx="10" fill="#FFFFFF" stroke="#0F9D74" stroke-width="1.6"/>
<rect x="28.0" y="100.0" width="229.0" height="58.0" rx="10" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.6"/>
<text x="142.5" y="126.0" font-size="13" font-weight="800" fill="#0F9D74" text-anchor="middle">BẮT BUỘC</text>
<text x="142.5" y="146.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">theo định nghĩa</text>
<text x="42.0" y="186.0" font-size="12" font-weight="800" fill="#0F9D74" text-anchor="start">✓</text>
<text x="58.0" y="186.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có khoảng trống giá thật theo</text>
<text x="58.0" y="201.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cách đo đã ghi rõ.</text>
<text x="42.0" y="229.7" font-size="12" font-weight="800" fill="#0F9D74" text-anchor="start">✓</text>
<text x="58.0" y="229.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có vùng tích lũy / cấu trúc xác</text>
<text x="58.0" y="245.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">định được TRƯỚC gap.</text>
<text x="42.0" y="273.5" font-size="12" font-weight="800" fill="#0F9D74" text-anchor="start">✓</text>
<text x="58.0" y="273.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gap đưa giá RA NGOÀI biên của</text>
<text x="58.0" y="289.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">vùng đó.</text>
<rect x="267.0" y="100.0" width="229.0" height="350.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="267.0" y="100.0" width="229.0" height="58.0" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<text x="381.5" y="126.0" font-size="13" font-weight="800" fill="#2563EB" text-anchor="middle">BẰNG CHỨNG HỖ TRỢ</text>
<text x="381.5" y="146.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">tăng độ tin cậy</text>
<text x="281.0" y="186.0" font-size="12" font-weight="800" fill="#2563EB" text-anchor="start">✓</text>
<text x="297.0" y="186.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá đóng cửa và tiếp tục giao</text>
<text x="297.0" y="201.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">dịch ngoài biên.</text>
<text x="281.0" y="229.7" font-size="12" font-weight="800" fill="#2563EB" text-anchor="start">✓</text>
<text x="297.0" y="229.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có follow-through theo hướng</text>
<text x="297.0" y="245.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">gap.</text>
<text x="281.0" y="273.5" font-size="12" font-weight="800" fill="#2563EB" text-anchor="start">✓</text>
<text x="297.0" y="273.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không quay lại vào range cũ.</text>
<text x="281.0" y="301.4" font-size="12" font-weight="800" fill="#2563EB" text-anchor="start">✓</text>
<text x="297.0" y="301.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Volume tăng rõ (nơi có volume</text>
<text x="297.0" y="317.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tập trung).</text>
<text x="281.0" y="345.1" font-size="12" font-weight="800" fill="#2563EB" text-anchor="start">✓</text>
<text x="297.0" y="345.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Bối cảnh khung lớn không chống</text>
<text x="297.0" y="361.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lại hướng gap.</text>
<rect x="506.0" y="100.0" width="229.0" height="350.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
<rect x="506.0" y="100.0" width="229.0" height="58.0" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
<text x="620.5" y="126.0" font-size="13" font-weight="800" fill="#64748B" text-anchor="middle">TÙY CHỌN</text>
<text x="620.5" y="146.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">có thì tốt, không có vẫn được</text>
<text x="520.0" y="186.0" font-size="12" font-weight="800" fill="#64748B" text-anchor="start">•</text>
<text x="536.0" y="186.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Biên đã được test nhiều lần.</text>
<text x="520.0" y="213.9" font-size="12" font-weight="800" fill="#64748B" text-anchor="start">•</text>
<text x="536.0" y="213.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có co hẹp biên độ trước đó.</text>
<text x="520.0" y="241.7" font-size="12" font-weight="800" fill="#64748B" text-anchor="start">•</text>
<text x="536.0" y="241.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Xảy ra lúc mở phiên.</text>
<text x="520.0" y="269.6" font-size="12" font-weight="800" fill="#64748B" text-anchor="start">•</text>
<text x="536.0" y="269.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có tin tức giải thích được.</text>
<rect x="745.0" y="100.0" width="229.0" height="350.0" rx="10" fill="#FFFFFF" stroke="#E0464B" stroke-width="1.6"/>
<rect x="745.0" y="100.0" width="229.0" height="58.0" rx="10" fill="#FBE3E4" stroke="#E0464B" stroke-width="1.6"/>
<text x="859.5" y="126.0" font-size="13" font-weight="800" fill="#E0464B" text-anchor="middle">GÂY NHẦM</text>
<text x="859.5" y="146.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="middle">trông mạnh nhưng không chứng minh gì</text>
<text x="759.0" y="186.0" font-size="12" font-weight="800" fill="#E0464B" text-anchor="start">✗</text>
<text x="775.0" y="186.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gap thật to.</text>
<text x="759.0" y="213.9" font-size="12" font-weight="800" fill="#E0464B" text-anchor="start">✗</text>
<text x="775.0" y="213.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một nến xanh/đỏ rất dài.</text>
<text x="759.0" y="241.7" font-size="12" font-weight="800" fill="#E0464B" text-anchor="start">✗</text>
<text x="775.0" y="241.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gap trên chart CFD/giờ lẻ mà</text>
<text x="775.0" y="257.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">feed khác không có.</text>
<text x="759.0" y="285.5" font-size="12" font-weight="800" fill="#E0464B" text-anchor="start">✗</text>
<text x="775.0" y="285.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gap trong 1–5 phút sau tin lớn.</text>
<text x="759.0" y="313.4" font-size="12" font-weight="800" fill="#E0464B" text-anchor="start">✗</text>
<text x="775.0" y="313.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gọi tên sau khi đã thấy cả đợt</text>
<text x="775.0" y="329.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tăng/giảm.</text>
