<svg viewBox="0 0 1000 677" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="675" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="892.7" y="22" width="79.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="932.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">HIỂU LẦM</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mười lăm hiểu lầm phổ biến về IRL/ERL — và cách hiểu đúng</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi ô: ✗ hiểu lầm (đỏ) → ✓ cách hiểu đúng hơn (xanh). Chi tiết và ví dụ chart ở §24 của note.</text>
<rect x="28.0" y="87.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="107.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#1</text>
<text x="68.0" y="107.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ IRL chỉ là FVG.</text>
<text x="68.0" y="129.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ IRL gồm cả đỉnh/đáy ngắn hạn bên trong</text>
<text x="68.0" y="145.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">range (định nghĩa ICT 2022 Ep.3).</text>
<rect x="346.0" y="87.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="358.0" y="107.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#2</text>
<text x="386.0" y="107.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ ERL chỉ là đỉnh/đáy cũ.</text>
<text x="386.0" y="129.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ ERL là liquidity ở/ngoài BIÊN range đang</text>
<text x="386.0" y="145.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">dùng — có thể là EQH, PDH, PWH… nếu chúng</text>
<text x="386.0" y="161.0" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">ở ngoài biên.</text>
<rect x="664.0" y="87.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="676.0" y="107.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#3</text>
<text x="704.0" y="107.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Mọi liquidity trong range quan trọng như</text>
<text x="704.0" y="123.3" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">nhau.</text>
<text x="704.0" y="145.6" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Có pool đáng kể và có gợn sóng. Xếp hạng</text>
<text x="704.0" y="161.4" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">theo khung, vị trí, phản ứng.</text>
<rect x="28.0" y="203.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="223.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#4</text>
<text x="68.0" y="223.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Mọi liquidity ngoài range quan trọng như</text>
<text x="68.0" y="239.3" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">nhau.</text>
<text x="68.0" y="261.6" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Biên kế tiếp khác “ERL xa”. Đích của khung</text>
<text x="68.0" y="277.4" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">lớn khác đích của khung nhỏ.</text>
<rect x="346.0" y="203.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="358.0" y="223.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#5</text>
<text x="386.0" y="223.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Giá luôn đi từ IRL đến ERL.</text>
<text x="386.0" y="245.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Thường gặp, không bắt buộc. Có lúc ERL →</text>
<text x="386.0" y="261.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">ERL, có lúc dao động mãi trong range.</text>
<rect x="664.0" y="203.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="676.0" y="223.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#6</text>
<text x="704.0" y="223.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Giá luôn lấy IRL trước rồi mới tới ERL.</text>
<text x="704.0" y="245.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Giá có thể bỏ qua IRL hoàn toàn (xu hướng</text>
<text x="704.0" y="261.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">mạnh, tin tức).</text>
<rect x="28.0" y="319.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="339.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#7</text>
<text x="68.0" y="339.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ ERL luôn “mạnh” hơn IRL.</text>
<text x="68.0" y="361.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ ERL có tầm lớn hơn với range đó; nhưng IRL</text>
<text x="68.0" y="377.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">khung lớn có thể quan trọng hơn ERL khung</text>
<text x="68.0" y="393.0" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">nhỏ.</text>
<rect x="346.0" y="319.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="358.0" y="339.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#8</text>
<text x="386.0" y="339.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Sweep một pool = giá phải đảo chiều.</text>
<text x="386.0" y="361.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Stop bị kích hoạt thường đẩy giá đi TIẾP.</text>
<text x="386.0" y="377.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">Đảo chiều cần bằng chứng sau sweep.</text>
<rect x="664.0" y="319.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="676.0" y="339.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#9</text>
<text x="704.0" y="339.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ FVG luôn chứa liquidity.</text>
<text x="704.0" y="361.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ FVG là vùng imbalance; nó không chứa</text>
<text x="704.0" y="377.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">stop. Có thể có lệnh limit chờ — không chắc.</text>
<rect x="28.0" y="435.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="455.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#10</text>
<text x="68.0" y="455.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Biên range tự động là liquidity.</text>
<text x="68.0" y="477.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Biên là mốc; liquidity là lệnh CÓ THỂ nằm</text>
<text x="68.0" y="493.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">quanh mốc. Mốc rõ thì khả năng cao hơn.</text>
<rect x="346.0" y="435.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="358.0" y="455.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#11</text>
<text x="386.0" y="455.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ DOL luôn là liquidity gần nhất.</text>
<text x="386.0" y="477.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Gần nhất có thể chỉ là trạm T1. DOL phụ</text>
<text x="386.0" y="493.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">thuộc bias, vị trí, vật cản, khung thời gian.</text>
<rect x="664.0" y="435.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="676.0" y="455.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#12</text>
<text x="704.0" y="455.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Liquidity target = tín hiệu vào lệnh.</text>
<text x="704.0" y="477.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Target nói ĐI ĐÂU; entry trigger nói KHI</text>
<text x="704.0" y="493.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">NÀO. Hai thứ khác nhau.</text>
<rect x="28.0" y="551.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="40.0" y="571.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#13</text>
<text x="68.0" y="571.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Internal structure = internal liquidity.</text>
<text x="68.0" y="593.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Structure: giá đã đi thế nào. Liquidity: giá có</text>
<text x="68.0" y="609.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">thể đến đâu.</text>
<rect x="346.0" y="551.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="358.0" y="571.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#14</text>
<text x="386.0" y="571.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Không cần nói rõ range tham chiếu.</text>
<text x="386.0" y="593.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Không có range ⇒ không có “trong/ngoài”.</text>
<text x="386.0" y="609.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">Luôn ghi “IRL/ERL của range nào, khung nào”.</text>
<rect x="664.0" y="551.0" width="308.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="676.0" y="571.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">#15</text>
<text x="704.0" y="571.0" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start" data-maxw="256.0">✗ Phân loại IRL/ERL nhìn lại chart là xong.</text>
<text x="704.0" y="593.3" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">✓ Nhìn lại thì cái gì cũng rõ. Hãy phân loại</text>
<text x="704.0" y="609.2" font-size="11.5" font-weight="400" fill="#059669" text-anchor="start" data-maxw="256.0">TRƯỚC khi giá đi, ghi giờ, rồi so.</text>
</svg>
