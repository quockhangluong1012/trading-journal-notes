<text x="764.1" y="305.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="516.0,962.0">vạch rút cuối</text>
