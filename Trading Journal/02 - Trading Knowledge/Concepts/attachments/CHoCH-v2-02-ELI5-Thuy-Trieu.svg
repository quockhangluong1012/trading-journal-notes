<text x="44.0" y="440.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,479.0">Mỗi con sóng vào xa hơn con trước, mỗi lần rút cũng không rút về sâu</text>
<text x="44.0" y="458.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,479.0">bằng lần trước. Nhìn là biết triều đang lên.</text>
