<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="558.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Một ví dụ khác cho bé: “tính cách” của sóng biển khi thủy triều lên và đổi chiều</text>
<rect x="923.4" y="23.0" width="48.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="947.7" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">ELI5</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đứng trên bãi cát, mỗi con sóng vào rồi rút. Ta đánh dấu chỗ xa nhất nước tràn tới và chỗ nước rút về. Trục dọc: càng cao = nước càng lên sâu vào</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">bãi cát.</text>
