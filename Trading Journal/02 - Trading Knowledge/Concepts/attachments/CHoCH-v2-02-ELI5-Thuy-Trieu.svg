<text x="828.1" y="256.8" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="516.0,962.0">vạch cũ</text>
<text x="882.9" y="341.2" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="516.0,962.0">rút SÂU HƠN vạch rút cũ</text>
<text x="882.9" y="354.4" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="516.0,962.0">= tính cách đổi</text>
<text x="522.0" y="440.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="521.0,957.0">Một con sóng không vào tới vạch cũ (dấu hiệu sớm). Rồi lần rút về sâu</text>
<text x="522.0" y="458.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="521.0,957.0">hơn vạch rút cuối cùng — “tính cách” của sóng đã khác.</text>
<text x="28.0" y="544.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Giới hạn: thủy triều đổi theo mặt trăng, đoán trước được bằng lịch. Giá thì không có “mặt trăng” — không có lịch nào nói trước khi nào xu hướng đổi.</text>
