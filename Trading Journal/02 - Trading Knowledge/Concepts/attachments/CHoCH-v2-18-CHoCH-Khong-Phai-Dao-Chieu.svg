<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="618.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">CHoCH không phải “đảo chiều”: năm bậc bằng chứng khác nhau</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Mỗi bậc cần THÊM thông tin, và vì vậy đến MUỘN hơn. Đa số sai lầm đến từ việc nhảy từ bậc 1 lên bậc 5 trong một bước.</text>
<rect x="28.0" y="392.5" width="178.0" height="146.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<circle cx="50.0" cy="414.5" r="10.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="50.0" y="418.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="68.0" y="418.5" font-size="13" font-weight="700" fill="#B45309" data-bx="67.0,197.0">Thay đổi tính cách</text>
<text x="40.0" y="462.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="39.0,195.0">Một cú phá ngược trạng</text>
<text x="40.0" y="478.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="39.0,195.0">thái ở MỘT lớp, MỘT</text>
<text x="40.0" y="495.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="39.0,195.0">khung.</text>
<rect x="40.0" y="502.5" width="89.7" height="19.0" rx="9.5" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="84.9" y="513.7" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">đèn vàng nháy</text>
<rect x="217.0" y="340.5" width="178.0" height="198.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<circle cx="239.0" cy="362.5" r="10.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="239.0" y="366.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="257.0" y="366.5" font-size="13" font-weight="700" fill="#B45309" data-bx="256.0,386.0">Cảnh báo sớm</text>
<text x="229.0" y="410.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="228.0,384.0">Có thêm dấu hiệu:</text>
<text x="229.0" y="426.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="228.0,384.0">displacement, cú quét</text>
<text x="229.0" y="443.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="228.0,384.0">trước đó, vị trí HTF hợp lý.</text>
<rect x="229.0" y="502.5" width="62.5" height="19.0" rx="9.5" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="260.2" y="513.7" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">đèn vàng</text>
<rect x="406.0" y="288.5" width="178.0" height="250.0" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
<circle cx="428.0" cy="310.5" r="10.0" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="428.0" y="314.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="446.0" y="314.5" font-size="13" font-weight="700" fill="#0D9488" data-bx="445.0,575.0">Shift internal</text>
<text x="418.0" y="358.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="417.0,573.0">Lớp nhỏ đã có đáy/đỉnh</text>
<text x="418.0" y="374.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="417.0,573.0">mới đúng chiều mới (HL</text>
<text x="418.0" y="391.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="417.0,573.0">hoặc LH) — vẫn trong</text>
<text x="418.0" y="407.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="417.0,573.0">khung lớn cũ.</text>
<rect x="418.0" y="502.5" width="105.5" height="19.0" rx="9.5" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1"/>
<text x="470.7" y="513.7" font-size="10" font-weight="700" fill="#0D9488" text-anchor="middle">vàng → xanh nhạt</text>
<rect x="595.0" y="236.5" width="178.0" height="302.0" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
<circle cx="617.0" cy="258.5" r="10.0" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="617.0" y="262.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="635.0" y="262.5" font-size="13" font-weight="700" fill="#0D9488" data-bx="634.0,764.0">Shift external</text>
<text x="607.0" y="306.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="606.0,762.0">Protected swing của LỚP</text>
<text x="607.0" y="322.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="606.0,762.0">LỚN bị phá, không chỉ lớp</text>
<text x="607.0" y="339.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="606.0,762.0">nhỏ.</text>
<rect x="607.0" y="502.5" width="65.8" height="19.0" rx="9.5" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1"/>
<text x="639.9" y="513.7" font-size="10" font-weight="700" fill="#0D9488" text-anchor="middle">xanh nhạt</text>
<rect x="784.0" y="184.5" width="178.0" height="354.0" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>
<circle cx="806.0" cy="206.5" r="10.0" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="806.0" y="210.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="824.0" y="210.5" font-size="13" font-weight="700" fill="#15803D" data-bx="823.0,953.0">Đảo chiều được xác</text>
<text x="824.0" y="226.7" font-size="13" font-weight="700" fill="#15803D" data-bx="823.0,953.0">nhận</text>
<text x="796.0" y="254.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="795.0,951.0">Lớp lớn có đáy/đỉnh mới</text>
<text x="796.0" y="270.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="795.0,951.0">đúng chiều mới VÀ một</text>
<text x="796.0" y="287.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="795.0,951.0">BOS đầu tiên theo chiều</text>
<text x="796.0" y="303.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="795.0,951.0">mới.</text>
<rect x="796.0" y="502.5" width="40.8" height="19.0" rx="9.5" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="816.4" y="513.7" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">xanh</text>
<line x1="60.0" y1="112.5" x2="894.0" y2="112.5" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6,4"/>
<polygon points="900.0,112.5 893.4,116.9 893.4,108.0" fill="#6B7280"/>
<text x="480.0" y="104.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">thêm bằng chứng — và thêm độ trễ</text>
<rect x="28.0" y="548.5" width="944.0" height="34.0" rx="8" fill="#C026D3" fill-opacity="0.07" stroke="#C026D3" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="548.5" width="4.0" height="34.0" rx="2" fill="#C026D3"/>
<text x="42.0" y="569.1" font-size="12.5" font-weight="400" fill="#111827" data-bx="28.0,972.0">Một CHoCH ở bậc 1 vẫn có ích: nó cho phép ĐẶT CÂU HỎI (“xu hướng cũ còn không?”). Nó chưa cho phép TRẢ LỜI (“xu hướng mới đã bắt đầu”).</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bậc 3–5 tương ứng thang G2–G3 và quan hệ nhiều khung ở note 21. Năm bậc ở đây là khung tư duy, không phải tiêu chuẩn ICT.</text>
