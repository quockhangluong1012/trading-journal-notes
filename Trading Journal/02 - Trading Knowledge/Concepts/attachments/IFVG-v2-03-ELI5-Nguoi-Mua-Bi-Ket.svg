<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="638.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao vùng cũ CÓ THỂ thành kháng cự? — Chuyện những bạn mua kem</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một câu chuyện giúp hiểu ý tưởng 'người bị kẹt'. Nó hợp lý, nhưng chart KHÔNG chứng minh được nó là thật.</text>
<rect x="833.7" y="22.0" width="138.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="902.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ELI5 · DIỄN GIẢI</text>
<rect x="28.0" y="96.0" width="600.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="50.0" y="272.0" width="550.0" height="36.0" rx="0" fill="#FECACA" opacity="0.35"/>
<line x1="50.0" y1="290.0" x2="600.0" y2="290.0" stroke="#B91C1C" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<text x="56.0" y="268.0" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="start">giá 10</text>
<path d="M70.0,338.0 L130.0,290.0 L175.0,272.0 L225.0,206.0 L270.0,230.0 L330.0,350.0 L380.0,410.0 L430.0,386.0 L480.0,326.0 L520.0,290.0 L560.0,356.0 L590.0,398.0" fill="none" stroke="#334155" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="130.0" cy="290.0" r="5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<circle cx="520.0" cy="290.0" r="5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="140.0" y="316.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">nhiều bạn mua ở 10</text>
<text x="300.0" y="414.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">giá rơi xuống 8</text>
<text x="505.0" y="316.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="end">giá quay lại 10</text>
<rect x="75.0" y="229.7" width="150.0" height="26.3" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<path d="M144.0,256.0 L150.0,274.0 L156.0,256.0" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="145.0" y1="256.0" x2="155.0" y2="256.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="150.0" y="248.7" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Mua! Sẽ lên 15!</text>
<rect x="310.0" y="432.0" width="140.0" height="26.3" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
<path d="M374.0,432.0 L380.0,416.0 L386.0,432.0" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="375.0" y1="432.0" x2="385.0" y2="432.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="380.0" y="451.0" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Ôi... lỗ rồi</text>
<rect x="437.0" y="229.7" width="150.0" height="26.3" rx="9" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<path d="M506.0,256.0 L512.0,274.0 L518.0,256.0" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="507.0" y1="256.0" x2="517.0" y2="256.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="512.0" y="248.7" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Về hòa vốn rồi, bán thôi!</text>
<text x="70.0" y="150.0" font-size="13" font-weight="800" fill="#1F2937" text-anchor="start">Câu chuyện:</text>
<text x="70.0" y="168.0" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">mua ở 10 → giá rơi → giá quay về 10 → nhiều người cùng bán</text>
<rect x="646.0" y="96.0" width="326.0" height="200.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="660.0" y="120.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Chart CHO THẤY</text>
<text x="660.0" y="146.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Giá từng ở 10, rơi xuống 8, quay lại 10 rồi đi</text>
<text x="660.0" y="162.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">xuống.</text>
<text x="660.0" y="196.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Vị trí, thời gian, độ dài các cây nến.</text>
<text x="660.0" y="236.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Đó là QUAN SÁT — ai nhìn cũng thấy giống nhau.</text>
<rect x="646.0" y="312.0" width="326.0" height="204.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="660.0" y="336.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">Chart KHÔNG cho thấy</text>
<text x="660.0" y="362.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Ai đã mua ở 10, mua bao nhiêu.</text>
<text x="660.0" y="388.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Họ còn giữ lệnh hay đã cắt lỗ ở 8.</text>
<text x="660.0" y="414.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Họ có thật sự bán khi về hòa vốn không.</text>
<text x="660.0" y="452.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">→ 'Người bị kẹt' là DIỄN GIẢI hợp lý, không phải</text>
<text x="660.0" y="468.6" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">sự thật đã chứng minh.</text>
<rect x="28.0" y="561.0" width="944.0" height="57.0" rx="10" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="46.0" y="587.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">Tài chính hành vi có mô tả xu hướng 'muốn gỡ hòa vốn' (disposition effect) ở nhà đầu tư nói chung. Điều đó KHÔNG chứng minh rằng ở vùng giá CỤ</text>
<text x="46.0" y="604.5" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">THỂ này có người bị kẹt. Muốn biết vùng cũ có hay phản ứng không → phải đếm trên dữ liệu (BACKTEST REQUIRED).</text>
</svg>
