<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" width="940" height="790" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0.0" y="0.0" width="940.0" height="790.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Toàn bộ quy trình Liquidity trên một trang</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">In ra, dán cạnh màn hình. Mỗi bước có đầu ra; thiếu đầu ra = chưa được sang bước sau.</text>
<rect x="24.0" y="76.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="1.4"/>
<rect x="24.0" y="76.0" width="52.0" height="56.0" rx="8" fill="#374151"/>
<rect x="64.0" y="76.0" width="12.0" height="56.0" rx="0" fill="#374151"/>
<text x="50.0" y="111.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="90.0" y="99.0" font-size="12.5" fill="#374151" font-weight="700" text-anchor="start">Trước phiên · D1</text>
<text x="90.0" y="119.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Swing D1 (N-bar), range D1 + lý do, BSL/SSL lớn, EQH/EQL D1, PWH/PWL, PDH/PDL.</text>
<rect x="833.6" y="89.5" width="70.4" height="19.0" rx="9.5" fill="#374151"/>
<text x="868.8" y="102.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Bản đồ D1</text>
<rect x="24.0" y="140.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<rect x="24.0" y="140.0" width="52.0" height="56.0" rx="8" fill="#0F766E"/>
<rect x="64.0" y="140.0" width="12.0" height="56.0" rx="0" fill="#0F766E"/>
<text x="50.0" y="175.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="90.0" y="163.0" font-size="12.5" fill="#0F766E" font-weight="700" text-anchor="start">Phân loại</text>
<text x="90.0" y="183.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Level 1–5; ERL/IRL theo range D1; cổng G1–G5; loại mức micro.</text>
<rect x="746.2" y="153.5" width="157.8" height="19.0" rx="9.5" fill="#0F766E"/>
<text x="825.1" y="166.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Danh sách mức (≤ 6–8 mức)</text>
<rect x="24.0" y="204.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="24.0" y="204.0" width="52.0" height="56.0" rx="8" fill="#7C3AED"/>
<rect x="64.0" y="204.0" width="12.0" height="56.0" rx="0" fill="#7C3AED"/>
<text x="50.0" y="239.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="90.0" y="227.0" font-size="12.5" fill="#7C3AED" font-weight="700" text-anchor="start">DOL</text>
<text x="90.0" y="247.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">DOL chính + thay thế + đối thủ + horizon + vô hiệu. Được phép: &quot;chưa rõ&quot;.</text>
<rect x="786.0" y="217.5" width="118.0" height="19.0" rx="9.5" fill="#7C3AED"/>
<text x="845.0" y="230.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Thẻ DOL (khóa giờ)</text>
<rect x="24.0" y="268.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<rect x="24.0" y="268.0" width="52.0" height="56.0" rx="8" fill="#0F766E"/>
<rect x="64.0" y="268.0" width="12.0" height="56.0" rx="0" fill="#0F766E"/>
<text x="50.0" y="303.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="90.0" y="291.0" font-size="12.5" fill="#0F766E" font-weight="700" text-anchor="start">H1</text>
<text x="90.0" y="311.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Cấu trúc H1 trong bối cảnh D1; liquidity H1 gần mức D1; đồng thuận hay mâu thuẫn.</text>
<rect x="689.8" y="281.5" width="214.2" height="19.0" rx="9.5" fill="#0F766E"/>
<text x="796.9" y="294.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Trạng thái NOT READY / MONITORING</text>
<rect x="24.0" y="332.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
<rect x="24.0" y="332.0" width="52.0" height="56.0" rx="8" fill="#B45309"/>
<rect x="64.0" y="332.0" width="12.0" height="56.0" rx="0" fill="#B45309"/>
<text x="50.0" y="367.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="90.0" y="355.0" font-size="12.5" fill="#B45309" font-weight="700" text-anchor="start">Cổng H1 → M5</text>
<text x="90.0" y="375.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Giá trong phạm vi 1.5·ATR(H1) của mức + killzone + ngoài cửa sổ tin tier-1.</text>
<rect x="760.8" y="345.5" width="143.2" height="19.0" rx="9.5" fill="#B45309"/>
<text x="832.4" y="358.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Mở M5 hoặc tiếp tục chờ</text>
<rect x="24.0" y="396.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4"/>
<rect x="24.0" y="396.0" width="52.0" height="56.0" rx="8" fill="#B91C1C"/>
<rect x="64.0" y="396.0" width="12.0" height="56.0" rx="0" fill="#B91C1C"/>
<text x="50.0" y="431.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="90.0" y="419.0" font-size="12.5" fill="#B91C1C" font-weight="700" text-anchor="start">M5 · sự kiện</text>
<text x="90.0" y="439.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Tiếp cận → xuyên (PENDING) → k nến → rejection / acceptance / EXPIRED.</text>
<rect x="786.8" y="409.5" width="117.2" height="19.0" rx="9.5" fill="#B91C1C"/>
<text x="845.4" y="422.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ E-code + known_at</text>
<rect x="24.0" y="460.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
<rect x="24.0" y="460.0" width="52.0" height="56.0" rx="8" fill="#1D4ED8"/>
<rect x="64.0" y="460.0" width="12.0" height="56.0" rx="0" fill="#1D4ED8"/>
<text x="50.0" y="495.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="90.0" y="483.0" font-size="12.5" fill="#1D4ED8" font-weight="700" text-anchor="start">Xác nhận</text>
<text x="90.0" y="503.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Sau rejection: MSS (swing Level ≥ 2) + displacement trong m nến?</text>
<rect x="763.6" y="473.5" width="140.4" height="19.0" rx="9.5" fill="#1D4ED8"/>
<text x="833.8" y="486.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ REV. CONF. hoặc STALE</text>
<rect x="24.0" y="524.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="24.0" y="524.0" width="52.0" height="56.0" rx="8" fill="#7C3AED"/>
<rect x="64.0" y="524.0" width="12.0" height="56.0" rx="0" fill="#7C3AED"/>
<text x="50.0" y="559.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
<text x="90.0" y="547.0" font-size="12.5" fill="#7C3AED" font-weight="700" text-anchor="start">Cập nhật</text>
<text x="90.0" y="567.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Gạch mức đã tiêu; DOL state; mức mới tại cực trị sweep; D1 chỉ đổi khi có sự kiện D1.</text>
<rect x="828.4" y="537.5" width="75.6" height="19.0" rx="9.5" fill="#7C3AED"/>
<text x="866.2" y="550.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Bản đồ mới</text>
<rect x="24.0" y="588.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="1.4"/>
<rect x="24.0" y="588.0" width="52.0" height="56.0" rx="8" fill="#374151"/>
<rect x="64.0" y="588.0" width="12.0" height="56.0" rx="0" fill="#374151"/>
<text x="50.0" y="623.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">9</text>
<text x="90.0" y="611.0" font-size="12.5" fill="#374151" font-weight="700" text-anchor="start">Ghi nhận</text>
<text x="90.0" y="631.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">Append-only; cả mức không bị chạm, sự kiện mơ hồ, sweep không đảo chiều.</text>
<rect x="805.8" y="601.5" width="98.2" height="19.0" rx="9.5" fill="#374151"/>
<text x="854.9" y="614.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Dòng log đầy đủ</text>
<rect x="24.0" y="652.0" width="892.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4"/>
<rect x="24.0" y="652.0" width="52.0" height="56.0" rx="8" fill="#B91C1C"/>
<rect x="64.0" y="652.0" width="12.0" height="56.0" rx="0" fill="#B91C1C"/>
<text x="50.0" y="687.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">10</text>
<text x="90.0" y="675.0" font-size="12.5" fill="#B91C1C" font-weight="700" text-anchor="start">Review &amp; kiểm chứng</text>
<text x="90.0" y="695.0" font-size="10.9" fill="#1F2937" font-weight="normal" text-anchor="start">So với baseline; mẫu đủ lớn; ngoài mẫu; mô tả ≠ dự báo ≠ edge.</text>
<rect x="728.4" y="665.5" width="175.6" height="19.0" rx="9.5" fill="#B91C1C"/>
<text x="816.2" y="678.6" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">→ Version mới của rule (nếu cần)</text>
<rect x="24.0" y="718.0" width="892.0" height="22.0" rx="6" fill="none"/>
<text x="470.0" y="746.0" font-size="12" fill="#B91C1C" font-weight="700" text-anchor="middle">Ba câu nhắc: Mức có từ TRƯỚC không? · Sự kiện đã PHÂN XỬ chưa? · Tôi đang MÔ TẢ hay DỰ BÁO?</text>
<text x="24.0" y="776.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-30 · Tham số mặc định v0.1 nằm trong mục Định nghĩa vận hành của note 19-Liquidity.</text>
</svg>
