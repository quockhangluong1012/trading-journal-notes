<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0.0" y="0.0" width="940.0" height="560.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Ba loại kết luận KHÔNG tương đương: Mô tả → Dự báo → Ứng dụng giao dịch</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Mỗi tầng cần bằng chứng mạnh hơn tầng dưới. Không suy ra tầng trên từ tầng dưới.</text>
<rect x="104.0" y="76.0" width="732.0" height="138.0" rx="10" fill="#B91C1C" fill-opacity="0.08" stroke="#B91C1C" stroke-width="1.8"/>
<text x="120.0" y="102.0" font-size="14" fill="#B91C1C" font-weight="700" text-anchor="start">3 · ỨNG DỤNG GIAO DỊCH</text>
<text x="120.0" y="124.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Thông tin đó có tạo lợi nhuận SAU chi phí trong một hệ thống cụ thể không?</text>
<text x="126.0" y="146.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Expectancy (R) sau spread, slippage, commission</text>
<text x="126.0" y="160.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Max drawdown, chuỗi thua, khả năng thực thi</text>
<text x="126.0" y="175.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Ổn định ngoài mẫu và theo regime</text>
<text x="506.6" y="146.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">Ví dụ: &quot;Short sau sweep PDH + MSS M5, SL trên cực trị +</text>
<text x="506.6" y="160.5" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">buffer, TP tại SSL đối diện có E[R] &gt; 0 sau phí trên 2 năm</text>
<text x="506.6" y="175.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">OOS&quot;</text>
<rect x="64.0" y="226.0" width="812.0" height="138.0" rx="10" fill="#B45309" fill-opacity="0.08" stroke="#B45309" stroke-width="1.8"/>
<text x="80.0" y="252.0" font-size="14" fill="#B45309" font-weight="700" text-anchor="start">2 · DỰ BÁO</text>
<text x="80.0" y="274.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Một đặc điểm có giúp đoán hành vi tiếp theo TỐT HƠN baseline không?</text>
<text x="86.0" y="296.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Tỷ lệ quan sát − baseline (p_null / mô phỏng)</text>
<text x="86.0" y="310.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Khoảng tin cậy; so nhóm có/không đặc điểm</text>
<text x="86.0" y="325.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Kiểm định ngoài mẫu</text>
<text x="510.6" y="296.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">Ví dụ: &quot;Sau sweep EQH H1, P(chạm SSL đối diện trước cực trị</text>
<text x="510.6" y="310.5" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">sweep) cao hơn baseline hình học 8 điểm %&quot;</text>
<rect x="24.0" y="376.0" width="892.0" height="138.0" rx="10" fill="#15803D" fill-opacity="0.08" stroke="#15803D" stroke-width="1.8"/>
<text x="40.0" y="402.0" font-size="14" fill="#15803D" font-weight="700" text-anchor="start">1 · MÔ TẢ</text>
<text x="40.0" y="424.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Giá đã làm gì quanh một mức liquidity?</text>
<text x="46.0" y="446.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Tần suất chạm / xuyên / quay lại / chấp nhận</text>
<text x="46.0" y="460.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Độ sâu xuyên, thời gian bên kia mức</text>
<text x="46.0" y="475.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Phân bố theo loại mức, khung, phiên</text>
<text x="514.6" y="446.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">Ví dụ: &quot;62% lần EQH H1 bị xuyên trong NY AM đóng nến quay lại trong 3</text>
<text x="514.6" y="460.5" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">nến M15&quot;</text>
<text x="470.0" y="538.0" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="middle">Các con số trong ví dụ là GIẢ ĐỊNH để minh họa dạng câu kết luận — chưa có dữ liệu nào trong vault hỗ trợ chúng.</text>
<text x="24.0" y="546.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-34</text>
</svg>
