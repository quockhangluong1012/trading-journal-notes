<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Co che Repricing: dong lenh to chuc tap trung theo chu ky phien</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="340" x2="960" y2="340"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
  </g>

  <!-- Timeline axis -->
  <line x1="40" y1="450" x2="920" y2="450" stroke="#d1d4dc" stroke-width="1"/>
  <text x="60" y="472" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">Tokyo</text>
  <text x="300" y="472" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">London open (02:00-03:00 ET)</text>
  <text x="650" y="472" font-family="Arial, sans-serif" font-size="13" fill="#d1d4dc">NY open (09:30 ET)</text>

  <!-- Volume bars increasing at session opens -->
  <g fill="rgba(41,98,255,0.25)">
    <rect x="60" y="420" width="16" height="30"/>
    <rect x="90" y="410" width="16" height="40"/>
    <rect x="260" y="360" width="16" height="90"/>
    <rect x="290" y="340" width="16" height="110"/>
    <rect x="320" y="370" width="16" height="80"/>
    <rect x="450" y="400" width="16" height="50"/>
    <rect x="480" y="405" width="16" height="45"/>
    <rect x="620" y="330" width="16" height="120"/>
    <rect x="650" y="310" width="16" height="140"/>
    <rect x="680" y="350" width="16" height="100"/>
    <rect x="800" y="405" width="16" height="45"/>
  </g>

  <!-- Macro window highlight boxes -->
  <rect x="255" y="90" width="90" height="330" fill="rgba(242,201,76,0.08)" stroke="#f2c94c" stroke-dasharray="4,4"/>
  <text x="260" y="110" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Macro 02:33-04:30</text>
  <rect x="610" y="90" width="90" height="330" fill="rgba(242,201,76,0.08)" stroke="#f2c94c" stroke-dasharray="4,4"/>
  <text x="615" y="110" font-family="Arial, sans-serif" font-size="13" fill="#f2c94c">Macro 09:50-10:10</text>

  <!-- Arrows depicting order flow -->
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <path d="M 120 200 L 250 200" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <text x="130" y="190" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Lenh cho qua dem</text>
  <path d="M 480 200 L 610 200" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <text x="490" y="190" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Execution algo + inventory rebalance</text>

  <text x="30" y="510" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Khoi luong tap trung tai cac phut chuyen giao phien -&gt; goc nhin vi mo hop ly cho "macro time", khong can mot thuat toan bi mat</text>
</svg>
