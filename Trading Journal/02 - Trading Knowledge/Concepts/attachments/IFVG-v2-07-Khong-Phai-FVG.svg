<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="558.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bốn thứ trông giống FVG nhưng KHÔNG phải (hoặc CHƯA phải)</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trước khi nói về IFVG, phải chắc chắn có FVG thật. Một 'IFVG' dựng trên một FVG không tồn tại thì cũng không tồn tại.</text>
<rect x="802.4" y="22.0" width="169.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
