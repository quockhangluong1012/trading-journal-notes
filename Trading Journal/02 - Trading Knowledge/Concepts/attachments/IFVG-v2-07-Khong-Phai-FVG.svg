<text x="522.0" y="422.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cú đẩy mạnh KHÔNG đảm bảo có</text>
<text x="522.0" y="437.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">FVG. Nến 3 lùi sâu, đáy 105.0 thấp</text>
<text x="522.0" y="453.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hơn đỉnh nến 1 (105.4).</text>
