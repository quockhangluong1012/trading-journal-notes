<text x="282.0" y="422.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thân nến 1 và thân nến 3 cách nhau,</text>
<text x="282.0" y="437.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nhưng bóng nến 3 (103.8) vẫn chạm</text>
<text x="282.0" y="453.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">vùng nến 1. Theo định nghĩa dùng</text>
<text x="282.0" y="469.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">BÓNG → không có FVG.</text>
