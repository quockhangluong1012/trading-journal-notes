<text x="762.0" y="437.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">trông như FVG. Nhưng nến còn chạy,</text>
<text x="762.0" y="453.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đáy có thể xuống dưới 104. Chỉ gọi</text>
<text x="762.0" y="469.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tên khi nến đã đóng.</text>
