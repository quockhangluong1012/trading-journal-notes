<text x="42.0" y="422.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đáy nến 3 (104.3) lùi xuống THẤP</text>
<text x="42.0" y="437.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">HƠN đỉnh nến 1 (104.6). Hai bóng</text>
<text x="42.0" y="453.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chạm nhau → không còn khoảng</text>
