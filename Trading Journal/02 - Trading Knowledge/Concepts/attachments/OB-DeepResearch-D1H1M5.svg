<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aK" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6B7280"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16A34A"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">OB qua D1 → H1 → M5: mỗi tầng trả lời một câu hỏi khác</text>
  <text x="24" y="52" font-size="12.5" fill="#6B7280">OB = location · MSS/displacement = evidence · entry rule = execution. Không gộp ba lớp.</text>

  <!-- ===== D1 panel ===== -->
  <rect x="20" y="66" width="226" height="348" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="20" y="66" width="226" height="30" rx="8" fill="#EDE9FE"/>
  <text x="32" y="86" font-size="12" font-weight="800" fill="#6D28D9">D1 — CONTEXT (location)</text>
  <text x="32" y="114" font-size="10.5" fill="#374151">"Nếu giá hồi, vùng nào hợp lý</text>
  <text x="32" y="128" font-size="10.5" fill="#374151">để narrative D1 tiếp tục?"</text>
  <line x1="30" y1="148" x2="236" y2="148" stroke="#16A34A" stroke-dasharray="5 3"/>
  <text x="34" y="143" font-size="9.5" fill="#166534">DOL: BSL D1 (equal highs)</text>
  <rect x="30" y="246" width="206" height="40" fill="#EDE9FE"/>
  <text x="60" y="280" font-size="9.5" font-weight="700" fill="#6D28D9">D1 OB (L4) · rộng ≈ 1 ATR D1</text>
  <g stroke-width="1.3">
    <line x1="52" y1="156" x2="52" y2="206" stroke="#DC2626"/><rect x="45" y="162" width="14" height="36" fill="#DC2626"/>
    <line x1="80" y1="190" x2="80" y2="236" stroke="#DC2626"/><rect x="73" y="196" width="14" height="32" fill="#DC2626"/>
    <line x1="108" y1="220" x2="108" y2="262" stroke="#DC2626"/><rect x="101" y="226" width="14" height="28" fill="#DC2626"/>
    <line x1="136" y1="244" x2="136" y2="276" stroke="#16A34A"/><rect x="129" y="250" width="14" height="10" fill="#16A34A"/>
  </g>
  <polyline points="150,252 190,200 226,160" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aG)"/>
  <text x="160" y="222" font-size="9.5" fill="#166534">giả thuyết</text>
  <line x1="30" y1="300" x2="236" y2="300" stroke="#E5E7EB"/>
  <text x="32" y="320" font-size="10.5" font-weight="700" fill="#1F2937">Output:</text>
  <text x="32" y="336" font-size="10" fill="#374151">• Vùng đáng chờ (zone L4)</text>
  <text x="32" y="351" font-size="10" fill="#374151">• Bias = giả thuyết + invalidation</text>
  <text x="32" y="366" font-size="10" fill="#374151">  (protected low D1)</text>
  <text x="32" y="388" font-size="10" font-weight="700" fill="#B91C1C">KHÔNG: trigger entry</text>
  <text x="32" y="403" font-size="9.5" fill="#6B7280">stop theo D1 quá rộng; nến D1 chưa đóng</text>

  <!-- arrow -->
  <line x1="248" y1="240" x2="264" y2="240" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aK)"/>

  <!-- ===== H1 panel ===== -->
  <rect x="267" y="66" width="226" height="348" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="267" y="66" width="226" height="30" rx="8" fill="#DBEAFE"/>
  <text x="279" y="86" font-size="12" font-weight="800" fill="#1D4ED8">H1 — SETUP (POI)</text>
  <text x="279" y="114" font-size="10.5" fill="#374151">"POI cụ thể nào? Thanh khoản</text>
  <text x="279" y="128" font-size="10.5" fill="#374151">nào vừa bị lấy?"</text>
  <rect x="277" y="170" width="206" height="116" fill="#F5F3FF"/>
  <text x="282" y="182" font-size="8.5" fill="#6D28D9">(bên trong zone D1)</text>
  <line x1="300" y1="252" x2="370" y2="252" stroke="#DC2626" stroke-dasharray="4 3"/>
  <text x="300" y="248" font-size="8.5" fill="#DC2626">equal lows</text>
  <rect x="368" y="244" width="115" height="20" fill="#93C5FD" opacity="0.7"/>
  <rect x="412" y="220" width="71" height="24" fill="#FEF3C7"/>
  <line x1="340" y1="200" x2="455" y2="200" stroke="#374151" stroke-dasharray="5 3"/>
  <text x="436" y="196" font-size="8.5" fill="#374151">LH → MSS</text>
  <g stroke-width="1.3">
    <line x1="300" y1="190" x2="300" y2="232" stroke="#DC2626"/><rect x="294" y="196" width="12" height="28" fill="#DC2626"/>
    <line x1="324" y1="212" x2="324" y2="250" stroke="#DC2626"/><rect x="318" y="218" width="12" height="24" fill="#DC2626"/>
    <line x1="348" y1="198" x2="348" y2="240" stroke="#16A34A"/><rect x="342" y="206" width="12" height="26" fill="#16A34A"/>
    <line x1="376" y1="244" x2="376" y2="266" stroke="#1D4ED8" stroke-width="1.6"/><rect x="370" y="246" width="12" height="12" fill="#1D4ED8"/>
    <line x1="400" y1="214" x2="400" y2="262" stroke="#16A34A"/><rect x="394" y="220" width="12" height="38" fill="#16A34A"/>
    <line x1="424" y1="176" x2="424" y2="222" stroke="#16A34A"/><rect x="418" y="180" width="12" height="38" fill="#16A34A"/>
  </g>
  <text x="438" y="236" font-size="8.5" fill="#B45309">FVG</text>
  <text x="440" y="258" font-size="8.5" fill="#1D4ED8">H1 OB</text>
  <line x1="277" y1="300" x2="483" y2="300" stroke="#E5E7EB"/>
  <text x="279" y="320" font-size="10.5" font-weight="700" fill="#1F2937">Output:</text>
  <text x="279" y="336" font-size="10" fill="#374151">• 1–2 POI qua cổng G0–G7</text>
  <text x="279" y="351" font-size="10" fill="#374151">• Plan A / B / D viết TRƯỚC</text>
  <text x="279" y="366" font-size="10" fill="#374151">• OB mới sau H1 MSS (R-H2) ưu tiên</text>
  <text x="279" y="388" font-size="10" font-weight="700" fill="#B91C1C">KHÔNG: vào lệnh khi chạm OB</text>
  <text x="279" y="403" font-size="9.5" fill="#6B7280">chạm = bắt đầu nghe, chưa phải bằng chứng</text>

  <line x1="495" y1="240" x2="511" y2="240" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aK)"/>

  <!-- ===== M5 panel ===== -->
  <rect x="514" y="66" width="226" height="348" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="514" y="66" width="226" height="30" rx="8" fill="#DCFCE7"/>
  <text x="526" y="86" font-size="12" font-weight="800" fill="#166534">M5 — EVIDENCE + TRIGGER</text>
  <text x="526" y="114" font-size="10.5" fill="#374151">"Phản ứng có thật không? Vào</text>
  <text x="526" y="128" font-size="10.5" fill="#374151">ở đâu, sai ở đâu?"</text>
  <rect x="524" y="226" width="206" height="44" fill="#DBEAFE" opacity="0.8"/>
  <text x="528" y="264" font-size="8.5" fill="#1D4ED8">bên trong H1 OB</text>
  <line x1="600" y1="196" x2="700" y2="196" stroke="#374151" stroke-dasharray="5 3"/>
  <text x="604" y="191" font-size="8.5" fill="#374151">MSS M5</text>
  <rect x="628" y="214" width="46" height="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.8"/>
  <polyline points="530,160 552,200 566,186 590,236 604,256 618,222 630,232 648,182 664,196 700,150" fill="none" stroke="#111827" stroke-width="1.8"/>
  <circle cx="604" cy="256" r="3.5" fill="#DC2626"/>
  <text x="560" y="283" font-size="8.5" fill="#DC2626">sweep low</text>
  <line x1="580" y1="264" x2="720" y2="264" stroke="#DC2626" stroke-width="1.3"/>
  <text x="676" y="276" font-size="8.5" fill="#DC2626">stop</text>
  <path d="M708 221 L680 221" stroke="#B45309" stroke-width="1.5" marker-end="url(#aK)"/>
  <text x="684" y="240" font-size="8.5" fill="#B45309">entry FVG</text>
  <path d="M700 150 L716 134" stroke="#16A34A" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="626" y="146" font-size="8.5" fill="#166534">target: IRL → DOL</text>
  <line x1="524" y1="300" x2="730" y2="300" stroke="#E5E7EB"/>
  <text x="526" y="320" font-size="10.5" font-weight="700" fill="#1F2937">Bắt buộc:</text>
  <text x="526" y="336" font-size="10" fill="#374151">• MSS đóng cửa, trong vùng POI</text>
  <text x="526" y="351" font-size="10" fill="#374151">• Displacement đạt ngưỡng plan</text>
  <text x="526" y="366" font-size="10" fill="#374151">• Entry/stop/target khai báo trước</text>
  <text x="526" y="388" font-size="10" font-weight="700" fill="#166534">Entry: FVG mặc định; M5 OB</text>
  <text x="526" y="403" font-size="9.5" fill="#6B7280">khi không có FVG hợp lệ; Plan D sau reclaim</text>
</svg>
