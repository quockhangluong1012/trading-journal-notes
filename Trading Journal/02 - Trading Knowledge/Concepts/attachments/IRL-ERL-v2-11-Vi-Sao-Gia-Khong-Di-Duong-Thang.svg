<circle cx="405.4" cy="351.8" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="433.7" cy="351.8" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<line x1="510.5" y1="269.9" x2="636.0" y2="269.9" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="534.1" cy="276.9" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="562.3" cy="276.9" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="590.5" cy="276.9" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<line x1="196.8" y1="419.7" x2="236.8" y2="459.7" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="239.8" y="463.7" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start" data-maxw="190.0">nghỉ → đáy nhỏ: stop của người mua</text>
<text x="239.8" y="477.3" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start" data-maxw="190.0">nằm dưới (SSL nội bộ)</text>
<text x="604.6" y="294.7" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG</text>
<text x="526.2" y="369.6" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG</text>
<text x="416.4" y="452.8" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG</text>
<line x1="429.0" y1="282.4" x2="309.0" y2="192.4" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>
<text x="306.0" y="176.7" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="end" data-maxw="170.0">đẩy mạnh → để lại FVG</text>
<text x="306.0" y="190.4" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="end" data-maxw="170.0">(imbalance)</text>
<line x1="604.6" y1="165.9" x2="636.0" y2="165.9" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="636.0" y="157.9" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="end">đỉnh mới = ERL kế tiếp</text>
<rect x="664.0" y="104.0" width="308.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="114.0" width="4.0" height="84.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="127.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">Lệnh đến theo đợt</text>
<rect x="911.4" y="113.5" width="50.6" height="17.5" rx="8.75" fill="#E6F6F4" stroke="#0F766E" stroke-width="1.1"/>
<text x="936.7" y="126.0" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">CƠ CHẾ</text>
<text x="680.0" y="148.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Người mua không vào cùng lúc. Có đợt dồn dập</text>
<text x="680.0" y="164.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">(giá chạy, để lại FVG), có lúc người chốt lời bán ra</text>
<text x="680.0" y="180.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">(giá nghỉ).</text>
<rect x="664.0" y="216.0" width="308.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="226.0" width="4.0" height="84.0" rx="2" fill="#475569" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="239.0" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">Mỗi lần nghỉ tạo một mốc mới</text>
<rect x="898.6" y="225.5" width="63.4" height="17.5" rx="8.75" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="930.3" y="238.0" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">QUAN SÁT</text>
<text x="680.0" y="260.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Đáy của nhịp nghỉ là chỗ người mua mới đặt</text>
<text x="680.0" y="276.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">stop-loss. Mỗi bậc thang để lại một pool nhỏ bên</text>
<text x="680.0" y="292.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">dưới.</text>
<rect x="664.0" y="328.0" width="308.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="338.0" width="4.0" height="84.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="351.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">ICT gọi chúng là IRL</text>
<rect x="932.0" y="337.5" width="30.0" height="17.5" rx="8.75" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="947.0" y="350.0" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<text x="680.0" y="372.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Đáy nhỏ (higher low) và FVG trong cùng nhịp giá là</text>
<text x="680.0" y="388.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">“internal range liquidity” của nhịp đó.</text>
<rect x="664.0" y="440.0" width="308.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="450.0" width="4.0" height="84.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="463.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">Vì sao giá hay quay lại?</text>
<rect x="903.7" y="449.5" width="58.3" height="17.5" rx="8.75" fill="#FFF7E6" stroke="#B45309" stroke-width="1.1"/>
<text x="932.8" y="462.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<text x="680.0" y="484.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Người lỡ tàu chờ giá rẻ hơn; người đã có lệnh muốn</text>
<text x="680.0" y="500.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">thêm. Hợp lý, nhưng không chắc — có nhịp không</text>
<text x="680.0" y="516.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">quay lại.</text>
<rect x="28.0" y="558.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="582.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ẩn dụ: leo cầu thang có chiếu nghỉ. Mỗi chiếu nghỉ là nơi người leo dừng lại (đáy nhỏ), mỗi đoạn chạy một mạch qua nhiều bậc là chỗ “bỏ sót” bậc (FVG). Giới</text>
<text x="42.0" y="598.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hạn: người leo cầu thang thật không bao giờ phải quay xuống chiếu nghỉ; giá thì có thể.</text>
</svg>
