<svg viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="628" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="903.6" y="22" width="68.4" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="937.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CƠ CHẾ</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao giá không đi một đường thẳng — và vì sao mỗi nhịp lại sinh ra IRL mới</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một nhịp tăng thường gồm nhiều bậc: đẩy mạnh → nghỉ → đẩy tiếp. Mỗi lần đẩy có thể để lại một FVG; mỗi lần nghỉ để lại một đáy nhỏ. Đó chính là IRL của nhịp</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">đó.</text>
<rect x="28.0" y="104.0" width="620.0" height="440.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="102.7" y="436.3" width="533.3" height="25.0" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<rect x="259.6" y="353.1" width="376.4" height="25.0" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<rect x="416.4" y="278.2" width="219.6" height="25.0" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<path d="M40.0,490.4 L71.4,473.8 L134.1,382.2 L165.5,403.0 L196.8,419.7 L228.2,394.7 L290.9,307.4 L322.3,328.2 L353.7,344.8 L385.1,319.8 L447.8,232.5 L479.2,253.3 L510.5,269.9 L541.9,249.1 L604.6,165.9 L636.0,178.4" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="196.8" y1="419.7" x2="636.0" y2="419.7" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="220.4" cy="426.7" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="248.6" cy="426.7" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="276.8" cy="426.7" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
