<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case đắt giá: OB bị tap bằng wick vs bằng body</text>
  <text x="40" y="63" font-size="15" fill="#94a3b8">Cùng chạm một vùng OB — hai cách chạm cho hai kết luận đối lập về việc OB còn sống hay đã chết</text>

  <!-- Panel A: wick tap - OB still valid -->
  <rect x="30" y="90" width="550" height="600" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="55" y="120" font-size="17" fill="#22c55e" font-weight="bold">A. Tap bằng WICK — OB còn sống</text>

  <!-- mini chart -->
  <line x1="70" y1="450" x2="70" y2="180" stroke="#1c2333" stroke-width="1"/>
  <!-- OB zone -->
  <rect x="150" y="330" width="380" height="55" fill="#22c55e" opacity="0.18"/>
  <text x="440" y="325" font-size="12" fill="#94a3b8">Vùng OB (proximal-distal)</text>
  <line x1="150" y1="357" x2="530" y2="357" stroke="#eab308" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="440" y="352" font-size="11" fill="#eab308">Mean Threshold 50%</text>

  <!-- candles down trend into OB -->
  <rect x="160" y="240" width="16" height="50" fill="#ef4444"/><line x1="168" y1="230" x2="168" y2="300" stroke="#ef4444" stroke-width="2"/>
  <rect x="195" y="260" width="16" height="55" fill="#ef4444"/><line x1="203" y1="250" x2="203" y2="330" stroke="#ef4444" stroke-width="2"/>
  <!-- wick tap candle: body stays above zone, wick pokes into zone -->
  <rect x="230" y="300" width="16" height="30" fill="#ef4444"/><line x1="238" y1="290" x2="238" y2="375" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="400" font-size="12" fill="#f97316">Wick chọc vào distal,</text>
  <text x="220" y="416" font-size="12" fill="#f97316">đóng thân TRÊN vùng OB</text>
  <!-- bounce candles up -->
  <rect x="265" y="255" width="16" height="45" fill="#22c55e"/><line x1="273" y1="245" x2="273" y2="308" stroke="#22c55e" stroke-width="2"/>
  <rect x="300" y="200" width="16" height="55" fill="#22c55e"/><line x1="308" y1="190" x2="308" y2="262" stroke="#22c55e" stroke-width="2"/>
  <rect x="335" y="160" width="16" height="45" fill="#22c55e"/><line x1="343" y1="150" x2="343" y2="212" stroke="#22c55e" stroke-width="2"/>

  <rect x="55" y="450" width="500" height="140" fill="#0f1420" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="70" y="474" font-size="13" fill="#e2e8f0" font-weight="bold">Cách đọc:</text>
  <text x="70" y="494" font-size="13" fill="#94a3b8">Chỉ RÂU (high-low) chọc vào vùng OB/distal;</text>
  <text x="70" y="512" font-size="13" fill="#94a3b8">nến vẫn ĐÓNG THÂN phía trên/ngoài vùng OB.</text>
  <text x="70" y="534" font-size="13" fill="#94a3b8">→ Đây chỉ là quét thanh khoản mỏng còn sót lại</text>
  <text x="70" y="552" font-size="13" fill="#94a3b8">trong vùng — chưa có acceptance ngược hướng.</text>
  <text x="70" y="574" font-size="13" fill="#22c55e" font-weight="bold">OB VẪN HỢP LỆ. Được phép giữ/vào lệnh theo bias gốc.</text>

  <!-- Panel B: body close through - OB dead -->
  <rect x="620" y="90" width="550" height="600" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="645" y="120" font-size="17" fill="#ef4444" font-weight="bold">B. Đóng THÂN xuyên qua — OB đã chết</text>

  <rect x="740" y="330" width="380" height="55" fill="#ef4444" opacity="0.15"/>
  <text x="1030" y="325" font-size="12" fill="#94a3b8">Vùng OB (proximal-distal)</text>
  <line x1="740" y1="357" x2="1120" y2="357" stroke="#eab308" stroke-dasharray="4,3" stroke-width="1.5"/>

  <rect x="750" y="240" width="16" height="50" fill="#ef4444"/><line x1="758" y1="230" x2="758" y2="300" stroke="#ef4444" stroke-width="2"/>
  <rect x="785" y="260" width="16" height="55" fill="#ef4444"/><line x1="793" y1="250" x2="793" y2="330" stroke="#ef4444" stroke-width="2"/>
  <!-- body close through zone -->
  <rect x="820" y="335" width="16" height="70" fill="#ef4444"/><line x1="828" y1="325" x2="828" y2="420" stroke="#ef4444" stroke-width="2"/>
  <text x="855" y="400" font-size="12" fill="#ef4444" font-weight="bold">Thân đóng cửa</text>
  <text x="855" y="416" font-size="12" fill="#ef4444" font-weight="bold">DƯỚI đáy vùng OB</text>
  <!-- follow-through candles staying outside, no reclaim -->
  <rect x="855" y="410" width="16" height="45" fill="#ef4444"/><line x1="863" y1="400" x2="863" y2="470" stroke="#ef4444" stroke-width="2"/>
  <rect x="890" y="440" width="16" height="50" fill="#ef4444"/><line x1="898" y1="430" x2="898" y2="505" stroke="#ef4444" stroke-width="2"/>
  <text x="820" y="530" font-size="12" fill="#f97316">Pullback nhẹ nhưng KHÔNG reclaim</text>
  <text x="820" y="546" font-size="12" fill="#f97316">lại vào trong vùng OB → acceptance ngoài</text>

  <rect x="645" y="450" width="500" height="140" fill="#0f1420" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="660" y="474" font-size="13" fill="#e2e8f0" font-weight="bold">Cách đọc:</text>
  <text x="660" y="494" font-size="13" fill="#94a3b8">Nến ĐÓNG THÂN xuyên qua đáy/đỉnh vùng OB,</text>
  <text x="660" y="512" font-size="13" fill="#94a3b8">các nến sau giữ giá bên ngoài (không reclaim).</text>
  <text x="660" y="534" font-size="13" fill="#94a3b8">→ Đây là acceptance thật: lệnh trong vùng đã bị</text>
  <text x="660" y="552" font-size="13" fill="#94a3b8">hấp thụ hết, phe cũ mất kiểm soát vùng giá.</text>
  <text x="660" y="574" font-size="13" fill="#ef4444" font-weight="bold">OB ĐÃ FAIL → xử lý như Breaker Block, không phải OB.</text>
</svg>
