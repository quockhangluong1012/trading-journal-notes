<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba giai đoạn: TRƯỚC — TRONG — SAU khi CISD hình thành</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bullish CISD điển hình: chặng xuống đưa giá quét đáy cũ → một nến đóng cửa lấy lại open đầu chặng → giá phải chứng minh bằng hành</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">động tiếp theo.</text>
