<text x="668.0" y="132.3" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">TRƯỚC: chặng cũ</text>
<circle cx="672.0" cy="150.3" r="2.6" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="154.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chuỗi #6–#9 đóng giảm liên tiếp → chặng xuống.</text>
<circle cx="672.0" cy="169.4" r="2.6" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="173.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">① Nến #9 thọc dưới đáy cũ rồi đóng lại phía trên</text>
<text x="682.0" y="189.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(sweep).</text>
<circle cx="672.0" cy="204.6" r="2.6" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="208.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ta đánh dấu open nến #6 TRƯỚC khi biết chuyện</text>
<text x="682.0" y="224.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">gì xảy ra.</text>
<rect x="656.0" y="250.7" width="316.0" height="99.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="668.0" y="275.0" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">TRONG: phép thử</text>
<circle cx="672.0" cy="292.9" r="2.6" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="296.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">② Nến #10 tăng nhưng đóng dưới mức → chưa.</text>
<circle cx="672.0" cy="312.1" r="2.6" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="315.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">③ Nến #11 ĐÓNG CỬA trên mức → CISD được xác</text>
<text x="682.0" y="331.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nhận đúng lúc nến đóng.</text>
<rect x="656.0" y="358.1" width="316.0" height="102.5" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="668.0" y="382.5" font-size="13" font-weight="700" fill="#059669" text-anchor="start">SAU: follow-through?</text>
<circle cx="672.0" cy="400.4" r="2.6" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="404.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không đóng lại dưới mức CISD.</text>
<circle cx="672.0" cy="419.5" r="2.6" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="423.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">④ Phá swing high (MSS) — cấu trúc theo sau.</text>
<circle cx="672.0" cy="438.6" r="2.6" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="682.0" y="442.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Để lại FVG, đi về phía thanh khoản đối diện.</text>
