<svg viewBox="0 0 980 1215" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="m0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker></defs>
<rect x="0" y="0" width="980" height="1215" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Decision Tree — Breaker Block (v0.1)</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đọc từ trên xuống. Mỗi ô hỏi một câu trả lời được bằng QUAN SÁT. Nhánh trái/phải là kết luận được phép tại thời điểm đó — không phải dự báo.</text>
<rect x="867.7" y="18" width="86.3" height="22" rx="11" fill="#F3F4F6" stroke="#D8DBE2"/>
<text x="910.9" y="33.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">QUYẾT ĐỊNH</text>
<rect x="60.0" y="84.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<circle cx="82.0" cy="115.0" r="13" fill="#334155"/>
<text x="82.0" y="119.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="106.0" y="119.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Đã có bối cảnh cấu trúc (D1 → H1)?</text>
<rect x="600.0" y="86.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="111.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Chưa → tiếp tục phân tích, hoặc ghi UNCLEAR. Không tìm</text>
<text x="610.0" y="126.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Breaker trên M5 để “tạo” bối cảnh.</text>
<line x1="532.0" y1="115.0" x2="598.0" y2="115.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="107.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="148.0" x2="295.0" y2="186.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="172.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="188.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<circle cx="82.0" cy="219.0" r="13" fill="#B45309"/>
<text x="82.0" y="223.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="106.0" y="214.5" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Đã xác định OB gốc theo định nghĩa (nến ngược hướng cuối tại</text>
<text x="106.0" y="231.6" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">swing)?</text>
<rect x="600.0" y="190.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="215.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Chưa → không tự tạo vùng chỉ vì giá phản ứng. Ghi “không có</text>
<text x="610.0" y="230.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">OB gốc”.</text>
<line x1="532.0" y1="219.0" x2="598.0" y2="219.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="211.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="252.0" x2="295.0" y2="290.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="276.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="292.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<circle cx="82.0" cy="323.0" r="13" fill="#B45309"/>
<text x="82.0" y="327.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="106.0" y="327.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">OB gốc được ghi lại TRƯỚC khi biết kết quả?</text>
<rect x="600.0" y="294.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="319.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Không → đánh dấu “quan sát hồi cứu”. Được học, KHÔNG được</text>
<text x="610.0" y="334.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">tính vào thống kê dự báo.</text>
<line x1="532.0" y1="323.0" x2="598.0" y2="323.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="315.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="356.0" x2="295.0" y2="394.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="380.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="396.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
<circle cx="82.0" cy="427.0" r="13" fill="#B91C1C"/>
<text x="82.0" y="431.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="106.0" y="431.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Cực trị cũ đã bị vi phạm (đáy mới / đỉnh mới)?</text>
<rect x="600.0" y="398.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="423.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Không → nếu sau đó vẫn đóng qua swing: gọi Mitigation Block.</text>
<text x="610.0" y="438.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Nếu không: chưa có sự kiện.</text>
<line x1="532.0" y1="427.0" x2="598.0" y2="427.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="419.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="460.0" x2="295.0" y2="498.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="484.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="500.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#111827" stroke-width="1.6"/>
<circle cx="82.0" cy="531.0" r="13" fill="#111827"/>
<text x="82.0" y="535.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="106.0" y="535.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Thân nến đã ĐÓNG qua swing H1 / L1 (trong W nến)?</text>
<rect x="600.0" y="502.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="527.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Chưa → CANDIDATE. Quá W nến mà chưa đóng qua →</text>
<text x="610.0" y="542.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">EXPIRED (không xác nhận).</text>
<line x1="532.0" y1="531.0" x2="598.0" y2="531.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="523.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="564.0" x2="295.0" y2="602.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="588.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="604.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<circle cx="82.0" cy="635.0" r="13" fill="#0F766E"/>
<text x="82.0" y="639.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="106.0" y="639.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">→ Breaker CONFIRMED tại t_avail. Giá đã retest chưa?</text>
<rect x="600.0" y="606.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="631.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Chưa → AWAITING RETEST. Không giả định giá sẽ quay lại.</text>
<text x="610.0" y="646.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">DOL bị lấy trước → EXPIRED.</text>
<line x1="532.0" y1="635.0" x2="598.0" y2="635.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="627.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="668.0" x2="295.0" y2="706.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="692.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="708.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.6"/>
<circle cx="82.0" cy="739.0" r="13" fill="#6D28D9"/>
<text x="82.0" y="743.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="106.0" y="743.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Hành vi khi retest là gì?</text>
<rect x="600.0" y="710.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="735.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Xuyên (thân đóng qua mép xa + giữ) → INVALIDATED · Dao</text>
<text x="610.0" y="750.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">động → chờ · Không đủ thông tin → UNCLEAR.</text>
<line x1="532.0" y1="739.0" x2="598.0" y2="739.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="731.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">NHÁNH KHÁC</text>
<line x1="295.0" y1="772.0" x2="295.0" y2="810.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="796.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">PHẢN ỨNG</text>
<rect x="60.0" y="812.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
<circle cx="82.0" cy="843.0" r="13" fill="#1D4ED8"/>
<text x="82.0" y="847.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="106.0" y="847.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Phản ứng đạt tiêu chí SETUP (gate G2 + bằng chứng M5)?</text>
<rect x="600.0" y="814.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="839.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Không → quan sát tiếp hoặc kết thúc. Ghi lại như một mẫu</text>
<text x="610.0" y="854.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">“retest không có setup”.</text>
<line x1="532.0" y1="843.0" x2="598.0" y2="843.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="835.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="876.0" x2="295.0" y2="914.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="900.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="60.0" y="916.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>
<circle cx="82.0" cy="947.0" r="13" fill="#15803D"/>
<text x="82.0" y="951.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="106.0" y="951.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">→ Đánh giá lệnh: entry · stop · target · R tối thiểu · risk ≤ 0,5%.</text>
<rect x="600.0" y="918.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="943.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Bất kỳ điều kiện rủi ro nào fail → không vào lệnh. Breaker hợp</text>
<text x="610.0" y="958.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">lệ ≠ lệnh hợp lệ.</text>
<line x1="532.0" y1="947.0" x2="598.0" y2="947.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="939.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG / CHƯA</text>
<line x1="295.0" y1="980.0" x2="295.0" y2="1018.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="303.0" y="1004.0" font-size="10.2" font-weight="800" fill="#15803D" text-anchor="start">SAU KHI VÀO / TRONG KHI THEO DÕI</text>
<rect x="60.0" y="1020.0" width="470.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
<circle cx="82.0" cy="1051.0" r="13" fill="#B91C1C"/>
<text x="82.0" y="1055.3" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="106.0" y="1055.0" font-size="12.4" font-weight="700" fill="#1F2937" text-anchor="start">Có invalidation nào xảy ra (vùng · luận điểm · setup · HTF)?</text>
<rect x="600.0" y="1022.0" width="354.0" height="58.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="610.0" y="1047.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">Có → cập nhật trạng thái. KHÔNG dời ranh giới vùng để giả</text>
<text x="610.0" y="1062.6" font-size="10.9" font-weight="400" fill="#1F2937" text-anchor="start">thuyết “vẫn đúng”.</text>
<line x1="532.0" y1="1051.0" x2="598.0" y2="1051.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m0)"/>
<text x="567.0" y="1043.0" font-size="9.2" font-weight="800" fill="#B91C1C" text-anchor="middle">CÓ</text>
<rect x="60.0" y="1116.0" width="894.0" height="67.5" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.2"/>
<rect x="60.0" y="1116.0" width="4.0" height="67.5" rx="2" fill="#334155"/>
<text x="72.0" y="1138.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Đọc đúng cây này</text>
<text x="72.0" y="1157.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Cây mô tả TRÌNH TỰ KIỂM TRA, không mô tả trình tự giá “phải” đi. Phần lớn đường đi trong thực tế dừng ở ô 5–8. Một Breaker đi hết tới ô 9 không có nghĩa</text>
<text x="72.0" y="1173.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">lệnh sẽ thắng.</text>
</svg>
