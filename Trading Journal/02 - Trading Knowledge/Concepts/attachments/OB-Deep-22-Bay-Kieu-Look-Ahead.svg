<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Bảy cách hindsight lọt vào nghiên cứu OB — và 'edge' giả mà nó tạo ra trên dữ liệu ngẫu nhiên</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Con số = E[R] vượt hình học trên random walk (OB-Sim-05). Trung thực: −0.01R. Mọi con số dương dưới đây là ẢO.</text>
<rect x="26.0" y="84.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="40.0" y="110.0" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">L1</text>
<text x="90.0" y="108.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Coi OB là 'đã biết' từ lúc nến OB đóng</text>
<text x="90.0" y="128.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: đặt limit trước displacement, chỉ giữ lần displacement xảy ra</text>
<text x="700.0" y="114.0" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="end">+1.31R</text>
<text x="718.0" y="108.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="126.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">chỉ dùng OB từ t_avail</text>
<rect x="26.0" y="156.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="40.0" y="182.0" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">L2</text>
<text x="90.0" y="180.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Chỉ giữ OB 'đã giữ được'</text>
<text x="90.0" y="200.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: loại OB bị phá sau lần chạm đầu (biết sau)</text>
<text x="700.0" y="186.0" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="end">+0.80R</text>
<text x="718.0" y="180.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="198.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">ghi MỌI OB, kể cả bị phá</text>
<rect x="26.0" y="228.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="40.0" y="254.0" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">L3</text>
<text x="90.0" y="252.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Chọn OB nơi giá đã quay đầu</text>
<text x="90.0" y="272.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: trong nhiều OB, chọn cái 'được tôn trọng'</text>
<text x="700.0" y="258.0" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="end">+0.39R</text>
<text x="718.0" y="252.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="270.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">khai báo luật chọn TRƯỚC (55 §9)</text>
<rect x="26.0" y="300.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="40.0" y="326.0" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">L4</text>
<text x="90.0" y="324.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">'Là OB vì sau đó giá chạy xa'</text>
<text x="90.0" y="344.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: lọc theo độ lớn cú đi SAU t_avail</text>
<text x="700.0" y="330.0" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="end">+0.21R</text>
<text x="718.0" y="324.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="342.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">đo độ lớn TRƯỚC t_avail</text>
<rect x="26.0" y="372.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="40.0" y="398.0" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">L5</text>
<text x="90.0" y="396.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Phân xử bằng OHLC lạc quan</text>
<text x="90.0" y="416.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: stop &amp; target cùng nến → giả định target trước</text>
<text x="700.0" y="402.0" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="end">+0.26R</text>
<text x="718.0" y="396.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="414.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">dùng dữ liệu tick/M1, hoặc giả định xấu nhất</text>
<rect x="26.0" y="444.0" width="928.0" height="64.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="40.0" y="470.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start">L6</text>
<text x="90.0" y="468.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Swing chưa xác nhận làm BOS</text>
<text x="90.0" y="488.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: dùng đỉnh mà chỉ biết là đỉnh sau n nến</text>
<text x="700.0" y="474.0" font-size="16" font-weight="700" fill="#334155" text-anchor="end">(không đo)</text>
<text x="718.0" y="468.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="486.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">known_at = i + n (54-Swing)</text>
<rect x="26.0" y="516.0" width="928.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="40.0" y="542.0" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">L7</text>
<text x="90.0" y="540.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Thử 3.240 biến thể, báo cáo cái tốt nhất</text>
<text x="90.0" y="560.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cách nó xảy ra: rơi về +0.04R OOS (không ý nghĩa)</text>
<text x="700.0" y="546.0" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="end">+0.19R IS</text>
<text x="718.0" y="540.0" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start">sửa:</text>
<text x="718.0" y="558.0" font-size="9.4" font-weight="600" fill="#15803D" text-anchor="start">khóa giả thuyết; OOS; hiệu chỉnh nhiều phép thử</text>
</svg>