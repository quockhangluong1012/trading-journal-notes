<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs><marker id="ctf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6B7280"/></marker></defs>
  <rect x="0" y="0" width="760" height="430" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">CISD là fractal — top-down: Bias → Context → Entry</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Cùng một logic đo bằng open, áp ở ba tỉ lệ; CISD M1 chỉ hợp lệ khi HTF + M5 đã đồng thuận</text>

  <rect x="24" y="72" width="230" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="139" y="98" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">H4 / H1 — BIAS</text>
  <text x="139" y="118" font-size="10" fill="#6B7280" text-anchor="middle">CISD HTF: draw đã đổi hướng</text>
  <rect x="58" y="140" width="2" height="46" fill="#DC2626"/><rect x="52" y="142" width="12" height="38" fill="#DC2626" rx="1"/>
  <rect x="86" y="176" width="2" height="50" fill="#DC2626"/><rect x="80" y="180" width="12" height="40" fill="#DC2626" rx="1"/>
  <line x1="52" y1="142" x2="210" y2="142" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="6 3"/>
  <rect x="124" y="130" width="2" height="130" fill="#16A34A"/><rect x="118" y="146" width="12" height="110" fill="#16A34A" rx="1"/>
  <text x="139" y="300" font-size="10.5" fill="#374151" text-anchor="middle">Dùng để CHỌN PHE</text>
  <text x="139" y="316" font-size="10" fill="#B91C1C" text-anchor="middle">Không entry (stop quá rộng)</text>

  <rect x="264" y="72" width="230" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="379" y="98" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">M15 / M5 — CONTEXT</text>
  <text x="379" y="118" font-size="10" fill="#6B7280" text-anchor="middle">CISD tại POI HTF trong killzone</text>
  <rect x="300" y="150" width="2" height="46" fill="#DC2626"/><rect x="294" y="152" width="12" height="38" fill="#DC2626" rx="1"/>
  <line x1="294" y1="152" x2="450" y2="152" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="6 3"/>
  <rect x="336" y="186" width="2" height="60" fill="#DC2626"/><rect x="330" y="190" width="12" height="48" fill="#DC2626" rx="1"/>
  <rect x="378" y="140" width="2" height="120" fill="#16A34A"/><rect x="372" y="156" width="12" height="100" fill="#16A34A" rx="1"/>
  <text x="379" y="300" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Cân bằng tốt nhất:</text>
  <text x="379" y="316" font-size="10" fill="#374151" text-anchor="middle">độ tin cậy vs giá entry</text>

  <rect x="504" y="72" width="230" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="619" y="98" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">M1 — ENTRY</text>
  <text x="619" y="118" font-size="10" fill="#6B7280" text-anchor="middle">stop nhỏ nhất, giá tốt nhất</text>
  <rect x="540" y="160" width="2" height="40" fill="#DC2626"/><rect x="534" y="162" width="12" height="32" fill="#DC2626" rx="1"/>
  <line x1="534" y1="162" x2="690" y2="162" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="6 3"/>
  <rect x="576" y="188" width="2" height="52" fill="#DC2626"/><rect x="570" y="192" width="12" height="42" fill="#DC2626" rx="1"/>
  <rect x="618" y="150" width="2" height="110" fill="#16A34A"/><rect x="612" y="164" width="12" height="92" fill="#16A34A" rx="1"/>
  <circle cx="618" cy="162" r="6" fill="#16A34A"/>
  <text x="619" y="300" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">Chỉ hợp lệ khi HTF+M5</text>
  <text x="619" y="316" font-size="10" fill="#B91C1C" text-anchor="middle">M1 đơn lẻ giữa nhiễu = bẫy</text>

  <line x1="254" y1="230" x2="264" y2="230" stroke="#6B7280" stroke-width="2" marker-end="url(#ctf)"/>
  <line x1="494" y1="230" x2="504" y2="230" stroke="#6B7280" stroke-width="2" marker-end="url(#ctf)"/>
</svg>
