<text x="330.4" y="221.8" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="start">đỉnh nội bộ (IRL) = T1</text>
<line x1="299.8" y1="243.8" x2="345.6" y2="243.8" stroke="#475569" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="322.7" y="256.8" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">✓ đã lấy</text>
<text x="253.9" y="348.0" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG ở discount (IRL) — giá đang ở đây</text>
