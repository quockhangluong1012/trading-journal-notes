<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case A — Bullish dealing range: giá hồi về IRL ở discount, ERL trên còn nguyên</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đứng tại T0 (đường xám). Bên phải đường xám là hai tương lai CÓ THỂ — không phải kết quả. Hình dựng (synthetic).</text>
