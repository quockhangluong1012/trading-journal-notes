<line x1="42.0" y1="121.0" x2="68.0" y2="121.0" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="74.0" y="125.0" font-size="10" font-weight="700" fill="#DC2626" text-anchor="start">kịch bản 2: xuyên FVG, về SSL</text>
<rect x="664.0" y="87.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="97.0" width="4.0" height="200.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="110.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Có thể kết luận (ex-ante)</text>
<text x="680.0" y="131.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Range: swing low → swing high vừa phá đỉnh cũ.</text>
<text x="680.0" y="147.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Giá ở nửa discount, đang chạm FVG (IRL).</text>
<text x="680.0" y="163.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• BSL trên và SSL dưới đều CHƯA bị lấy.</text>
<text x="680.0" y="179.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Đỉnh nội bộ gần nhất là T1 nếu giá bật lên.</text>
<text x="680.0" y="195.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Giả thuyết DOL: BSL trên (cùng hướng nhịp vừa</text>
<text x="680.0" y="210.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">rồi).</text>
<rect x="664.0" y="317.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="327.0" width="4.0" height="200.0" rx="2" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="340.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">KHÔNG thể kết luận</text>
<text x="680.0" y="361.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Rằng FVG sẽ giữ giá.</text>
<text x="680.0" y="377.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Rằng BSL sẽ bị lấy trước SSL.</text>
<text x="680.0" y="393.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Rằng “bên lớn” đang mua ở đây.</text>
<text x="680.0" y="409.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Bao lâu nữa giá tới đích.</text>
<text x="680.0" y="440.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Cần thêm: phản ứng tại FVG + MSS/displacement</text>
<text x="680.0" y="456.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">ở khung nhỏ.</text>
<rect x="28.0" y="551.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="575.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chuyển sang khung nhỏ CHỈ khi: giá đang ở IRL discount + bias khung lớn tăng + trong killzone. Nếu giá đóng cửa xuyên FVG và dưới đáy của nó ⇒ giả thuyết</text>
<text x="42.0" y="591.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">kịch bản 1 yếu đi rõ rệt.</text>
