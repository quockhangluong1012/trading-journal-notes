<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="718.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vòng đời của một FVG — và chỗ IFVG bước vào</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi mũi tên là một KHẢ NĂNG, không phải thứ tự bắt buộc. Đây là mô hình để ghi chép và kiểm chứng, không phải quy luật thị trường.</text>
<rect x="807.1" y="22.0" width="164.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="889.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">MÔ HÌNH · LIFECYCLE</text>
<rect x="40.0" y="104.0" width="200.0" height="62.0" rx="9" fill="#ECFDF3" stroke="#15803D" stroke-width="1.4"/>
<text x="140.0" y="126.0" font-size="12.2" font-weight="800" fill="#15803D" text-anchor="middle">1. FVG hình thành</text>
<text x="140.0" y="144.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">biết khi nến 3 đóng cửa</text>
<rect x="300.0" y="104.0" width="200.0" height="62.0" rx="9" fill="#ECFDF3" stroke="#15803D" stroke-width="1.4"/>
<text x="400.0" y="139.0" font-size="12.2" font-weight="800" fill="#15803D" text-anchor="middle">2. Giá đi xa khỏi vùng</text>
<rect x="560.0" y="104.0" width="200.0" height="62.0" rx="9" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4"/>
<text x="660.0" y="139.0" font-size="12.2" font-weight="800" fill="#1F2937" text-anchor="middle">3. Giá quay về, chạm vùng</text>
<rect x="800.0" y="104.0" width="172.0" height="62.0" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="886.0" y="126.0" font-size="12.2" font-weight="800" fill="#64748B" text-anchor="middle">Không bao giờ quay lại</text>
<text x="886.0" y="144.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">vùng bị bỏ lại phía sau</text>
<line x1="240.0" y1="135.0" x2="290.8" y2="135.0" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>
<path d="M298.0,135.0 L290.7,138.3 L290.7,131.7 Z" fill="#1F2937"/>
<line x1="500.0" y1="135.0" x2="550.8" y2="135.0" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>
<path d="M558.0,135.0 L550.7,138.3 L550.7,131.7 Z" fill="#1F2937"/>
<path d="M400,104 C400,80 886,70 886,102" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="884.0" y1="92.0" x2="884.7" y2="95.9" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
<path d="M886.0,103.0 L881.5,96.4 L887.9,95.2 Z" fill="#64748B"/>
<rect x="40.0" y="230.0" width="218.0" height="76.0" rx="9" fill="#ECFDF3" stroke="#15803D" stroke-width="1.4"/>
<text x="149.0" y="252.0" font-size="12.2" font-weight="800" fill="#15803D" text-anchor="middle">4a. Phản ứng, đi tiếp hướng cũ</text>
<text x="149.0" y="270.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">FVG được 'tôn trọng'</text>
<line x1="660.0" y1="166.0" x2="156.1" y2="227.1" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round"/>
<path d="M149.0,228.0 L155.9,223.9 L156.6,230.4 Z" fill="#1F2937"/>
<rect x="278.0" y="230.0" width="218.0" height="76.0" rx="9" fill="#ECFDF3" stroke="#15803D" stroke-width="1.4"/>
<text x="387.0" y="252.0" font-size="12.2" font-weight="800" fill="#15803D" text-anchor="middle">4b. Lấp một phần / tới CE</text>
<text x="387.0" y="270.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">chưa nói lên điều gì chắc chắn</text>
<line x1="660.0" y1="166.0" x2="394.0" y2="226.4" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round"/>
<path d="M387.0,228.0 L393.4,223.2 L394.8,229.6 Z" fill="#1F2937"/>
<rect x="516.0" y="230.0" width="218.0" height="76.0" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4"/>
<text x="625.0" y="252.0" font-size="12.2" font-weight="800" fill="#B45309" text-anchor="middle">4c. Lấp hết (chạm mép xa)</text>
<text x="625.0" y="270.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">nhưng chưa ĐÓNG CỬA qua</text>
<line x1="660.0" y1="166.0" x2="628.5" y2="221.7" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round"/>
<path d="M625.0,228.0 L625.8,220.0 L631.4,223.2 Z" fill="#1F2937"/>
<rect x="754.0" y="230.0" width="218.0" height="76.0" rx="9" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.4"/>
<text x="863.0" y="252.0" font-size="12.2" font-weight="800" fill="#B91C1C" text-anchor="middle">4d. Đóng cửa xuyên mép xa</text>
<text x="863.0" y="270.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">FVG bị vi phạm (vô hiệu)</text>
<line x1="660.0" y1="166.0" x2="856.1" y2="225.9" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round"/>
<path d="M863.0,228.0 L855.1,229.0 L857.0,222.7 Z" fill="#1F2937"/>
<path d="M387,306 C387,340 149,340 149,308" fill="none" stroke="#64748B" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,4"/>
<path d="M625,306 C625,342 863,342 863,308" fill="none" stroke="#64748B" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,4"/>
<text x="518.0" y="358.0" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">có thể chuyển tiếp sang 4a hoặc 4d</text>
<rect x="640.0" y="400.0" width="332.0" height="70.0" rx="9" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="806.0" y="422.0" font-size="12.2" font-weight="800" fill="#7C3AED" text-anchor="middle">5. Ứng viên IFVG</text>
<text x="806.0" y="440.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">giá đã ở phía bên kia vùng — câu hỏi mở</text>
<line x1="863.0" y1="308.0" x2="809.9" y2="391.9" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/>
<path d="M806.0,398.0 L807.2,390.1 L812.7,393.6 Z" fill="#B91C1C"/>
<rect x="40.0" y="530.0" width="292.0" height="84.0" rx="9" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="186.0" y="552.0" font-size="12.2" font-weight="800" fill="#7C3AED" text-anchor="middle">6a. Retest &amp; bị từ chối</text>
<text x="186.0" y="570.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">vùng 'hành xử' như IFVG — có thể dùng làm vị trí giao</text>
<text x="186.0" y="584.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">dịch</text>
<path d="M806,470 C806,500 186,490 186,524" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="186.0" y1="518.0" x2="186.0" y2="521.8" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
<path d="M186.0,529.0 L182.7,521.7 L189.3,521.7 Z" fill="#7C3AED"/>
<rect x="360.0" y="530.0" width="292.0" height="84.0" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
<text x="506.0" y="552.0" font-size="12.2" font-weight="800" fill="#EA580C" text-anchor="middle">6b. Bị lấy lại (reclaim)</text>
<text x="506.0" y="570.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">giá đóng cửa quay lại qua vùng → inversion giả</text>
<path d="M806,470 C806,500 506,490 506,524" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="506.0" y1="518.0" x2="506.0" y2="521.8" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
<path d="M506.0,529.0 L502.7,521.7 L509.3,521.7 Z" fill="#7C3AED"/>
<rect x="680.0" y="530.0" width="292.0" height="84.0" rx="9" fill="#F3F4F6" stroke="#64748B" stroke-width="1.4"/>
<text x="826.0" y="552.0" font-size="12.2" font-weight="800" fill="#64748B" text-anchor="middle">6c. Không retest, bỏ chạy</text>
<text x="826.0" y="570.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">đúng hướng nhưng không cho điểm vào</text>
<path d="M806,470 C806,500 826,490 826,524" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="826.0" y1="518.0" x2="826.0" y2="521.8" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
<path d="M826.0,529.0 L822.7,521.7 L829.3,521.7 Z" fill="#7C3AED"/>
<text x="40.0" y="422.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">Đọc sơ đồ này thế nào?</text>
<text x="40.0" y="444.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Bước 1–4: chuyện của FVG. Bước 5–6: chuyện của IFVG. IFVG chỉ bắt đầu SAU khi FVG bị</text>
<text x="40.0" y="459.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đóng cửa xuyên qua.</text>
<text x="40.0" y="480.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Lấp hết (4c) KHÔNG phải đảo ngược. Đảo ngược cần giá ở lại phía bên kia (4d → 5).</text>
<rect x="28.0" y="641.0" width="944.0" height="57.0" rx="10" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="46.0" y="667.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">Ghi chép mỗi FVG theo trạng thái nó đạt được (1 → 2 → 3 → 4x → 5 → 6x), thay vì gộp thành 'đúng/sai'. Gộp làm mất thông tin và mở cửa cho diễn</text>
<text x="46.0" y="684.5" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">giải sau sự kiện.</text>
</svg>
