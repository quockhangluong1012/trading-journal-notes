" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Bullish BOS qua 6 bước: HL1 → HH1 → lùi → HL2 → tăng → vượt HH1</tspan></text>
<rect x="24.0" y="96.0" width="570.0" height="364.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<line x1="228.3" y1="238.2" x2="567.2" y2="238.2" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="567.2" y="233.2" font-size="11" fill="#D85A30" text-anchor="end"><tspan>HH1 — mốc phải vượt</tspan></text>
<line x1="309.0" y1="317.8" x2="567.2" y2="317.8" stroke="#1D9E75" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="567.2" y="331.8" font-size="11" fill="#1D9E75" text-anchor="end"><tspan>HL2 — mức cần giữ (protected)</tspan></text>
<polyline points="40.0,344.4 93.8,404.2 228.3,238.2 309.0,317.8 448.9,161.8" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="93.8" cy="404.2" r="3.6" fill="#1D9E75"/>
<text x="93.8" y="423.7" font-size="12.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL1</tspan></text>
<circle cx="228.3" cy="238.2" r="3.6" fill="#2563EB"/>
<text x="228.3" y="229.2" font-size="12.5" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">HH1</tspan></text>
<circle cx="309.0" cy="317.8" r="3.6" fill="#1D9E75"/>
<text x="309.0" y="337.3" font-size="12.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL2</tspan></text>
<circle cx="448.9" cy="161.8" r="3.6" fill="#2563EB"/>
<text x="448.9" y="152.8" font-size="12.5" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">HH2</tspan></text>
<circle cx="71.8" cy="404.2" r="9.5" fill="#1F2937"/>
<text x="71.8" y="408.2" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<circle cx="206.3" cy="234.2" r="9.5" fill="#1F2937"/>
<text x="206.3" y="238.2" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<circle cx="284.6" cy="278.0" r="9.5" fill="#1F2937"/>
<text x="284.6" y="282.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<circle cx="287.0" cy="317.8" r="9.5" fill="#1F2937"/>
<text x="287.0" y="321.8" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<circle cx="321.3" cy="282.0" r="9.5" fill="#1F2937"/>
<text x="321.3" y="286.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<circle cx="358.4" cy="226.2" r="9.5" fill="#1F2937"/>
<text x="358.4" y="230.2" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">6</tspan></text>
<circle cx="380.4" cy="238.2" r="6" fill="#1D9E75"/>
<text x="390.4" y="258.2" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">BOS</tspan></text>
<text x="612.0" y="70.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>① HL1: đáy nơi người mua bắt đầu thắng thế.</tspan></text>
<text x="612.0" y="89.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>② HH1: đỉnh nơi lực mua gấp tạm hết.</tspan></text>
<text x="612.0" y="109.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>③ Lùi từ HH1: chốt lời và người bán chờ sẵn đẩy giá xuống.</tspan></text>
<text x="612.0" y="128.7" font-size="12" fill="#1F2937" text-anchor="start"><tspan>④ HL2: giá dừng giảm CAO HƠN HL1 — người mua quay lại sớm</tspan></text>
<text x="612.0" y="145.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan>hơn.</tspan></text>
<text x="612.0" y="164.8" font-size="12" fill="#1F2937" text-anchor="start"><tspan>⑤ Tăng lại: giá tiến về HH1, nơi có lệnh chờ hai phía.</tspan></text>
<text x="612.0" y="184.4" font-size="12" fill="#1F2937" text-anchor="start"><tspan>⑥ Vượt HH1 → bullish BOS (ứng viên). Xác nhận khi nến đóng</tspan></text>
<text x="612.0" y="200.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>và giá ở lại phía trên.</tspan></text>
<rect x="612.0" y="224.5" width="364.0" height="96.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="612.0" y="224.5" width="5.0" height="96.0" rx="2" fill="#1D9E75"/>
<text x="626.0" y="244.5" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Đã xác nhận</tspan></text>
<text x="626.0" y="264.4" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá làm được điều chưa từng làm trong cấu trúc này: giao</tspan></text>
<text x="626.0" y="280.3" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>dịch trên HH1. Cấu trúc tăng được &quot;gia hạn&quot;; HL2 thành mức</tspan></text>
<text x="626.0" y="296.2" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>cần giữ.</tspan></text>
<rect x="612.0" y="330.0" width="364.0" height="62.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="612.0" y="330.0" width="5.0" height="62.0" rx="2" fill="#B45309"/>
<text x="626.0" y="350.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Chưa xác nhận</tspan></text>
<text x="626.0" y="369.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá sẽ đi tiếp bao xa; khung lớn hơn có đồng ý không.</tspan></text>
<rect x="612.0" y="400.0" width="364.0" height="70.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="612.0" y="400.0" width="5.0" height="70.0" rx="2" fill="#DC2626"/>
<text x="626.0" y="420.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Thất bại khi</tspan></text>
<text x="626.0" y="439.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Đóng cửa lại dưới HH1 ngay sau đó (bẫy), hoặc thủng HL2</tspan></text>
<text x="626.0" y="455.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>(cấu trúc tăng bị phủ định).</tspan></text>
</svg>
