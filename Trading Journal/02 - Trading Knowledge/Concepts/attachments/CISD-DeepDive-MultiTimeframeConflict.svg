<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">CISD da khung thoi gian: M15 tang vs H1 chua xac nhan</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="340" x2="960" y2="340"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
  </g>

  <text x="30" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc">H1: chuoi giao hang giam van dang tiep dien</text>
  <line x1="60" y1="150" x2="900" y2="150" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="905" y="154" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">Open chuoi H1</text>
  <g>
    <line x1="100" y1="160" x2="100" y2="220" stroke="#ef5350" stroke-width="1"/>
    <rect x="85" y="170" width="30" height="40" fill="#ef5350"/>
    <line x1="200" y1="180" x2="200" y2="250" stroke="#ef5350" stroke-width="1"/>
    <rect x="185" y="195" width="30" height="45" fill="#ef5350"/>
    <line x1="300" y1="200" x2="300" y2="270" stroke="#ef5350" stroke-width="1"/>
    <rect x="285" y="215" width="30" height="45" fill="#ef5350"/>
  </g>
  <text x="330" y="260" font-family="Arial, sans-serif" font-size="13" fill="#ef5350">H1 chua dong cua vuot open -&gt; bias giam van dang chu dao</text>

  <text x="30" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1d4dc">M15: da xuat hien CISD tang (tin hieu chien thuat)</text>
  <g>
    <line x1="450" y1="360" x2="450" y2="400" stroke="#ef5350" stroke-width="1"/>
    <rect x="440" y="370" width="20" height="25" fill="#ef5350"/>
    <line x1="480" y1="370" x2="480" y2="410" stroke="#ef5350" stroke-width="1"/>
    <rect x="470" y="380" width="20" height="25" fill="#ef5350"/>
  </g>
  <line x1="440" y1="370" x2="700" y2="370" stroke="#f2c94c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="705" y="374" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">Open chuoi M15</text>
  <line x1="530" y1="330" x2="530" y2="385" stroke="#26a69a" stroke-width="1"/>
  <rect x="520" y="335" width="20" height="45" fill="#26a69a"/>
  <text x="510" y="320" font-family="Arial, sans-serif" font-size="13" fill="#26a69a">M15 dong cua vuot open -&gt; CISD tang</text>

  <rect x="30" y="440" width="900" height="80" fill="none" stroke="#f2c94c" stroke-width="1"/>
  <text x="45" y="465" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Quy tac phan xu: coi CISD M15 la tin hieu chien thuat trong ngay,</text>
  <text x="45" y="487" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">chi dung de tim diem vao theo huong H1 khi H1 xac nhan roi;</text>
  <text x="45" y="509" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">khong dung CISD M15 de danh nguoc han H1 chua xac nhan, tru khi y thuc ro day la lenh nguoc dong ngan han.</text>
</svg>
