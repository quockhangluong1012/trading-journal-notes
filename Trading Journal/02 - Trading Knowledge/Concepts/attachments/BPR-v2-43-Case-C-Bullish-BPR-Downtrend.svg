<text x="676.0" y="387.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Một Bullish BPR ngược bias D1 chỉ ghi lại một nhịp hồi</text>
<text x="676.0" y="402.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">dữ dội. Nó không đủ để đổi bias. Muốn đổi bias cần</text>
<text x="676.0" y="418.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">cấu trúc khung lớn đổi.</text>
<text x="28.0" y="620.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Trong real-time ở T2, ta KHÔNG biết T4 sẽ xảy ra. Điều ta biết: BPR này ngược bối cảnh → ưu tiên thấp, không mua chỉ vì tên “bullish”.</text>
