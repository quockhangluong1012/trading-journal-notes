<polyline points="400,398 434,368 469,336" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#aG)"/>
<rect x="510" y="288" width="232" height="212" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="522" y="310" font-size="12" font-weight="800" fill="#B91C1C">F — Acceptance bên ngoài</text>
