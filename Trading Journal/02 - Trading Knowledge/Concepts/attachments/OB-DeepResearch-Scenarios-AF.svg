<text x="480" y="216" font-size="8" fill="#1E3A8A" text-anchor="end">distal (1)</text>
<rect x="272" y="238" width="216" height="34" rx="5" fill="#EFF6FF"/>
<text x="278" y="252" font-size="9.5" font-weight="700" fill="#1D4ED8">Valid · penetration ≈ 0</text>
<text x="278" y="266" font-size="9" fill="#374151">Entry aggressive: cần OBQS cao, OB protected</text>
