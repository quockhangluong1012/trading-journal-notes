<text x="726" y="406" font-size="8" fill="#1D4ED8" text-anchor="end">MT (0.5)</text>
<text x="726" y="438" font-size="8" fill="#1E3A8A" text-anchor="end">distal (1)</text>
<rect x="518" y="460" width="216" height="34" rx="5" fill="#FEF2F2"/>
<text x="524" y="474" font-size="9.5" font-weight="700" fill="#B91C1C">INVALID → theo dõi Breaker (hướng ngược)</text>
