<svg viewBox="0 0 760 512" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16A34A"/></marker><marker id="aR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#DC2626"/></marker></defs>
<rect x="0" y="0" width="760" height="512" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Giá quay về Bullish OB — sáu kịch bản A–F</text>
<text x="24" y="52" font-size="12.5" fill="#6B7280">Tọa độ zone: 0 = proximal, 0.5 = MT, 1 = distal. Đếm nến theo TIMEFRAME CỦA OB. Râu không giết OB; acceptance mới giết.</text>
<rect x="18" y="66" width="232" height="212" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="30" y="88" font-size="12" font-weight="800" fill="#374151">A — Near miss</text>
<rect x="32" y="166" width="204" height="40" fill="#DBEAFE"/>
<line x1="32" y1="186" x2="236" y2="186" stroke="#1D4ED8" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="234" y="163" font-size="8" fill="#1E3A8A" text-anchor="end">proximal (0)</text>
<text x="234" y="184" font-size="8" fill="#1D4ED8" text-anchor="end">MT (0.5)</text>
<text x="234" y="216" font-size="8" fill="#1E3A8A" text-anchor="end">distal (1)</text>
<rect x="26" y="238" width="216" height="34" rx="5" fill="#F3F4F6"/>
<text x="32" y="252" font-size="9.5" font-weight="700" fill="#374151">OB vẫn valid · limit proximal KHÔNG khớp</text>
<text x="32" y="266" font-size="9" fill="#374151">Vào qua FVG phản ứng nếu có M5 evidence</text>
<polyline points="38,106 88,138 128,156 168,128 223,104" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#aG)"/>
<line x1="128" y1="157" x2="128" y2="166" stroke="#B45309" stroke-width="1" stroke-dasharray="2 2"/>
<text x="134" y="163" font-size="8.5" fill="#B45309">&lt; 0.25 ATR</text>
<rect x="264" y="66" width="232" height="212" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="276" y="88" font-size="12" font-weight="800" fill="#1D4ED8">B — Chạm proximal</text>
<rect x="278" y="166" width="204" height="40" fill="#DBEAFE"/>
<line x1="278" y1="186" x2="482" y2="186" stroke="#1D4ED8" stroke-width="0.9" stroke-dasharray="4 3"/>
