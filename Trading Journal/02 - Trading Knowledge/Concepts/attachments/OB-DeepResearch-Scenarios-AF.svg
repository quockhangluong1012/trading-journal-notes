<text x="480" y="406" font-size="8" fill="#1D4ED8" text-anchor="end">MT (0.5)</text>
<text x="480" y="438" font-size="8" fill="#1E3A8A" text-anchor="end">distal (1)</text>
<rect x="272" y="460" width="216" height="34" rx="5" fill="#F5F3FF"/>
<text x="278" y="474" font-size="9.5" font-weight="700" fill="#6D28D9">SUSPENDED → reclaim hoặc invalid</text>
<text x="278" y="488" font-size="9" fill="#374151">Reclaim = đóng lại trên MT kèm displacement</text>
