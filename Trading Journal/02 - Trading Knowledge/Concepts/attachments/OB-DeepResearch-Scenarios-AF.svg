<text x="234" y="406" font-size="8" fill="#1D4ED8" text-anchor="end">MT (0.5)</text>
<text x="234" y="438" font-size="8" fill="#1E3A8A" text-anchor="end">distal (1)</text>
<rect x="26" y="460" width="216" height="34" rx="5" fill="#FEF3C7"/>
<text x="32" y="474" font-size="9.5" font-weight="700" fill="#B45309">Valid · cờ distal_swept</text>
<text x="32" y="488" font-size="9" fill="#374151">Entry sau reclaim + MSS; stop dưới sweep low</text>
