<text x="920.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">GIÁ TRỊ THÊM</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">BPR cho ta thêm thông tin gì so với nhìn hai FVG riêng lẻ?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Câu hỏi quan trọng nhất của note. Câu trả lời trung thực: BPR là một cách GOM ba quan sát vào một vùng. Nó không thêm dữ liệu mới về người giao dịch.</text>
<rect x="28.0" y="86.0" width="400.0" height="440.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Ba quan sát gói trong một BPR</text>
