<text x="415.7" y="347.6" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="start">BPR</text>
<circle cx="204.3" cy="271.4" r="9" fill="#B45309"/>
<text x="204.3" y="275.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">a</text>
<line x1="220.1" y1="271.4" x2="275.3" y2="318.7" stroke="#B45309" stroke-width="1.4" marker-end="url(#ahB45309)"/>
<circle cx="188.6" cy="129.5" r="9" fill="#1F2937"/>
<text x="188.6" y="133.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">b</text>
<circle cx="380.5" cy="343.6" r="9" fill="#7C3AED"/>
<text x="380.5" y="347.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">c</text>
<rect x="446.0" y="86.0" width="526.0" height="98.0" rx="10" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="458.0" y="110.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">a · Trạng thái của FVG đầu</text>
<text x="458.0" y="130.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Bullish FVG không giữ được: leg giảm chạy xuyên qua nó rất nhanh. Nhìn riêng FVG xanh, ta</text>
<text x="458.0" y="146.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">dễ quên rằng nó đã bị phủ nhận.</text>
<rect x="446.0" y="194.0" width="526.0" height="98.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="458.0" y="218.5" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">b · Dấu vết một cú quay đầu nhanh</text>
<text x="458.0" y="238.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hai leg nhanh, ngược chiều, sát nhau → một chữ V (hoặc chữ V ngược) dữ dội. BPR đánh dấu</text>
<text x="458.0" y="254.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">“cổ” của chữ V đó.</text>
<rect x="446.0" y="302.0" width="526.0" height="98.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="458.0" y="326.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">c · Một vùng hẹp hơn, do hai sự kiện cùng xác định</text>
<text x="458.0" y="346.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Thay vì hai hộp lớn, ta có một hộp nhỏ nơi cả hai sự kiện cùng đi qua. Vùng hẹp giúp đặt lệnh</text>
<text x="458.0" y="362.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">và đặt stop rõ hơn.</text>
<rect x="446.0" y="410.0" width="526.0" height="116.0" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.3"/>
<text x="458.0" y="434.5" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ Điều BPR KHÔNG thêm</text>
<text x="458.0" y="454.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không thêm thông tin về khối lượng, vị thế, hay ý định của ai. Không chứng minh vùng này</text>
<text x="458.0" y="470.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">“mạnh hơn” FVG. Nếu ba quan sát a–b–c không giúp bạn ra quyết định tốt hơn trong backtest,</text>
<text x="458.0" y="485.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">thì BPR chỉ là một cái tên gọn.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">[HYPOTHESIS] Gói ba quan sát vào một vùng có thể giúp lọc POI tốt hơn FVG đơn lẻ. [BACKTEST REQUIRED] trước khi coi đó là lợi thế.</text>
</svg>
