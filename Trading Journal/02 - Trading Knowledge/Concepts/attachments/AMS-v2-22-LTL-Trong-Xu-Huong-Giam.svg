<text x="40.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Đáy đỏ có ITL cao hơn ở cả hai bên → nó LÀ một LTL hợp lệ trên khung này. Sau cú bật (ITH), giá vẫn quay xuống và xuyên qua nó.</text>
<text x="40.0" y="498.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Bài học: "LTL" mô tả VỊ TRÍ của một đáy so với hàng xóm. Nó không hứa rằng đáy đó sẽ giữ, cũng không hứa xu hướng lớn đã đổi.</text>
