<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một LTL được xác nhận đúng luật, nằm giữa một xu hướng giảm, rồi bị phá. Nhãn đúng — kỳ vọng sai.</text>
