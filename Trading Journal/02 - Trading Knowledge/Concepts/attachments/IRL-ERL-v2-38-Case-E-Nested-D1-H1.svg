<text x="362.0" y="625.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">displacement.</text>
<rect x="664.0" y="565.0" width="308.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
