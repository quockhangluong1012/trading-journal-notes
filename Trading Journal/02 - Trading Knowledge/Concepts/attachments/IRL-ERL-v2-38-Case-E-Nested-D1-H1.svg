<text x="680.0" y="609.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Hai tầng cùng chiều ⇒ đủ điều kiện xuống M5. T1</text>
<text x="680.0" y="625.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">= ERL-H1 dưới; T2 = IRL D1 thấp hơn; runner: ERL</text>
<text x="680.0" y="641.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">D1.</text>
<rect x="28.0" y="689.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="713.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lỗi cần tránh: thấy “sweep ERL” trên H1 rồi tin đó là đảo chiều LỚN. Với D1 nó chỉ là một cú chạm IRL. Ý nghĩa của cú quét H1 đến từ việc nó nằm ĐÚNG trong IRL</text>
<text x="42.0" y="729.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">premium của D1 và cùng chiều DOL D1.</text>
