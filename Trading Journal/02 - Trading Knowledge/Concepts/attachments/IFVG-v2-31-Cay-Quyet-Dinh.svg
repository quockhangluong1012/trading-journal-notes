<text x="300.0" y="428.0" font-size="13" font-weight="800" fill="#1D4ED8" text-anchor="middle">→ IFVG HỢP LỆ (valid)</text>
<line x1="300.0" y1="442.0" x2="300.0" y2="462.8" stroke="#15803D" stroke-width="1.8" stroke-linecap="round"/>
