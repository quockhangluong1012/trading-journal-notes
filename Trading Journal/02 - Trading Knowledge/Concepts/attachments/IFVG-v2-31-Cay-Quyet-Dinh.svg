<rect x="40.0" y="472.0" width="520.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="64.0" cy="507.0" r="11" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="64.0" y="511.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="86.0" y="503.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Cùng hướng D1 bias và DOL, còn room tới DOL?</text>
<line x1="560.0" y1="507.0" x2="632.8" y2="507.0" stroke="#B91C1C" stroke-width="1.8" stroke-linecap="round"/>
<path d="M640.0,507.0 L632.7,510.3 L632.7,503.7 Z" fill="#B91C1C"/>
<text x="600.0" y="500.0" font-size="10.5" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG</text>
<rect x="640.0" y="478.0" width="332.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="654.0" y="502.0" font-size="11.8" font-weight="600" fill="#B91C1C" text-anchor="start">IFVG hợp lệ nhưng ngược bối cảnh: chỉ ghi lại.</text>
<line x1="300.0" y1="542.0" x2="300.0" y2="562.8" stroke="#15803D" stroke-width="1.8" stroke-linecap="round"/>
<path d="M300.0,570.0 L296.7,562.7 L303.3,562.7 Z" fill="#15803D"/>
<text x="310.0" y="561.0" font-size="10.5" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
<rect x="40.0" y="572.0" width="520.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="64.0" cy="607.0" r="11" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="64.0" y="611.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="86.0" y="603.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Ở POI H1 / đúng premium–discount, không sát giờ tin?</text>
<line x1="560.0" y1="607.0" x2="632.8" y2="607.0" stroke="#B91C1C" stroke-width="1.8" stroke-linecap="round"/>
<path d="M640.0,607.0 L632.7,610.3 L632.7,603.7 Z" fill="#B91C1C"/>
<text x="600.0" y="600.0" font-size="10.5" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG</text>
<rect x="640.0" y="578.0" width="332.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="654.0" y="602.0" font-size="11.8" font-weight="600" fill="#B91C1C" text-anchor="start">Ưu tiên thấp. Thường bỏ qua.</text>
<line x1="300.0" y1="642.0" x2="300.0" y2="662.8" stroke="#15803D" stroke-width="1.8" stroke-linecap="round"/>
<path d="M300.0,670.0 L296.7,662.7 L303.3,662.7 Z" fill="#15803D"/>
<text x="310.0" y="661.0" font-size="10.5" font-weight="800" fill="#15803D" text-anchor="start">CÓ</text>
