<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="898.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cây quyết định: từ FVG tới một IFVG có thể giao dịch</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đi từ trên xuống. Mỗi câu 'KHÔNG' đưa bạn ra khỏi cây sang phải. Nửa trên trả lời 'có phải IFVG?'; nửa dưới trả lời 'có nên giao</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">dịch?'.</text>
<rect x="793.9" y="22.0" width="178.1" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="883.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">QUY TRÌNH · CHECKLIST</text>
<rect x="40.0" y="104.0" width="520.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="64.0" cy="139.0" r="11" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="64.0" y="143.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="86.0" y="135.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Có FVG hợp lệ? (3 nến cùng khung, nến 3 đã đóng)</text>
<line x1="560.0" y1="139.0" x2="632.8" y2="139.0" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
