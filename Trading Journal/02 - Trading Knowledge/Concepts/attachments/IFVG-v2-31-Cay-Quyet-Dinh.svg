<text x="600.0" y="132.0" font-size="10.5" font-weight="800" fill="#64748B" text-anchor="middle">KHÔNG</text>
<rect x="640.0" y="110.0" width="332.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
<text x="654.0" y="134.0" font-size="11.8" font-weight="600" fill="#64748B" text-anchor="start">Không có gì để đảo. Dừng.</text>
