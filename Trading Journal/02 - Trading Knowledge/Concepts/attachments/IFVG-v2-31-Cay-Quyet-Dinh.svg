<circle cx="64.0" cy="707.0" r="11" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="64.0" y="711.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="86.0" y="703.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Retest trong killzone + M5 xác nhận (MSS / displacement)?</text>
<line x1="560.0" y1="707.0" x2="632.8" y2="707.0" stroke="#B91C1C" stroke-width="1.8" stroke-linecap="round"/>
<path d="M640.0,707.0 L632.7,710.3 L632.7,703.7 Z" fill="#B91C1C"/>
<text x="600.0" y="700.0" font-size="10.5" font-weight="800" fill="#B91C1C" text-anchor="middle">KHÔNG</text>
<rect x="640.0" y="678.0" width="332.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="654.0" y="702.0" font-size="11.8" font-weight="600" fill="#B91C1C" text-anchor="start">Chờ. Nếu giá bỏ chạy không retest: KHÔNG đuổi.</text>
<rect x="40.0" y="770.0" width="520.0" height="74.0" rx="12" fill="#ECFDF3" stroke="#15803D" stroke-width="1.6"/>
<text x="60.0" y="796.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">IFVG CÓ THỂ GIAO DỊCH: vào ở retest, stop ngoài mép xa IFVG (+ đệm),</text>
<text x="60.0" y="813.2" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">mục tiêu là DOL. Ghi đầy đủ biến vào journal.</text>
<text x="40.0" y="876.0" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">Bước 1–3 = định nghĩa (khách quan). Bước 4–6 = bối cảnh &amp; thực thi (bán khách quan — phải viết quy tắc ra trước).</text>
