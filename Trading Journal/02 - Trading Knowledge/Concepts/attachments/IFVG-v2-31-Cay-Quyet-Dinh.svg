<text x="654.0" y="234.0" font-size="11.8" font-weight="600" fill="#EA580C" text-anchor="start">FVG còn sống (bóng) hoặc đang tranh chấp (đóng</text>
<text x="654.0" y="250.3" font-size="11.8" font-weight="600" fill="#EA580C" text-anchor="start">trong vùng). Chờ.</text>
<line x1="300.0" y1="274.0" x2="300.0" y2="294.8" stroke="#15803D" stroke-width="1.8" stroke-linecap="round"/>
