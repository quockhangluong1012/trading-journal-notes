<text x="64.0" y="243.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="86.0" y="235.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Một nến CÙNG KHUNG đã đóng cửa qua MÉP XA?</text>
<line x1="560.0" y1="239.0" x2="632.8" y2="239.0" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
