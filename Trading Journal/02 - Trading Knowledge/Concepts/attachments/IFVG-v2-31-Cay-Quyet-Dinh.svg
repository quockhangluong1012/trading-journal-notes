<text x="64.0" y="343.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="86.0" y="335.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Nến kế tiếp KHÔNG đóng cửa quay lại qua vùng?</text>
<line x1="560.0" y1="339.0" x2="632.8" y2="339.0" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
<path d="M640.0,339.0 L632.7,342.3 L632.7,335.7 Z" fill="#EA580C"/>
<text x="600.0" y="332.0" font-size="10.5" font-weight="800" fill="#EA580C" text-anchor="middle">KHÔNG</text>
<rect x="640.0" y="310.0" width="332.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2"/>
<text x="654.0" y="334.0" font-size="11.8" font-weight="600" fill="#EA580C" text-anchor="start">Bị lấy lại → inversion giả. Bỏ; FVG có thể còn sống.</text>
<line x1="300.0" y1="374.0" x2="300.0" y2="394.8" stroke="#15803D" stroke-width="1.8" stroke-linecap="round"/>
