<text x="42.0" y="594.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">kịp được xác nhận là swing (n=5: 34%). 'Vào ngay đáy' là ảo ảnh của chart nhìn ngược.</text>
