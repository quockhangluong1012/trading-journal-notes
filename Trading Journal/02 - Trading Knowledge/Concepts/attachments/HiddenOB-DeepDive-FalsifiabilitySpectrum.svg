<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Pho falsifiability: OB thuong vs Hidden OB</text>

  <line x1="100" y1="270" x2="880" y2="270" stroke="#2a2e39" stroke-width="2"/>

  <!-- left end: high falsifiability -->
  <circle cx="140" cy="270" r="10" fill="#26a69a"/>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="16" fill="#26a69a">De kiem chung</text>
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">OB HTF ro rang</text>
  <text x="50" y="332" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">(nen cuoi truoc</text>
  <text x="50" y="354" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">displacement manh,</text>
  <text x="50" y="376" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">moi trader ve giong nhau)</text>

  <!-- middle -->
  <circle cx="480" cy="270" r="10" fill="#f2c94c"/>
  <text x="410" y="230" font-family="Arial, sans-serif" font-size="16" fill="#f2c94c">Trung binh</text>
  <text x="390" y="310" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Hidden OB co dinh nghia</text>
  <text x="390" y="332" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">ro (vd overlap 2 nen +</text>
  <text x="390" y="354" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">rule zoom LTF cu the) -</text>
  <text x="390" y="376" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">van co the kiem tra lai</text>

  <!-- right end: low falsifiability -->
  <circle cx="820" cy="270" r="10" fill="#ef5350"/>
  <text x="740" y="230" font-family="Arial, sans-serif" font-size="16" fill="#ef5350">Kho/khong kiem chung</text>
  <text x="700" y="310" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">"OB an" duoc goi ten</text>
  <text x="700" y="332" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">sau khi da biet gia di</text>
  <text x="700" y="354" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">dau (khong co rule</text>
  <text x="700" y="376" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">khach quan truoc do)</text>

  <path d="M 140 270 L 820 270" stroke="none"/>
  <path d="M 200 270 L 780 270" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,4" fill="none"/>
  <text x="330" y="420" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">Cang "an" (nested sau, it duoc dinh nghia truoc) → cang gan pho phai</text>
  <text x="330" y="445" font-family="Arial, sans-serif" font-size="16" fill="#d1d4dc">→ nguy co hindsight labeling cang cao neu khong co checklist khach quan.</text>

  <text x="60" y="500" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">Vi tri tren pho la MINH HOA dinh tinh, khong phai thang do dinh luong da duoc kiem chung.</text>
</svg>
