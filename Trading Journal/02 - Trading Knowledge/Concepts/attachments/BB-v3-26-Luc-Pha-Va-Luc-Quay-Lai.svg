<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="638.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Hai khoảnh khắc, hai cơ chế: LÚC PHÁ và LÚC QUAY LẠI</text>
<rect x="904.4" y="23.0" width="67.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="938.2" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CƠ CHẾ</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Lúc phá, lệnh dừng (stop) đẩy giá đi nhanh hơn. Lúc quay lại, lệnh chờ (limit) và người muốn thoát có thể đỡ giá — hoặc không.</text>
<rect x="28.0" y="94.5" width="460.0" height="492.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="13.5" font-weight="700" fill="#7C3AED" data-bx="41.0,477.0">LÚC PHÁ — vì sao giá hay vọt qua đỉnh giữa</text>
<line x1="58.0" y1="316.5" x2="458.0" y2="316.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="456.0" y="332.5" font-size="11" font-weight="700" fill="#475569" text-anchor="end">đỉnh giữa</text>
<rect x="178.0" y="276.5" width="270.0" height="26.0" rx="6" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="1"/>
<text x="313.0" y="293.5" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">lệnh dừng lỗ của người đang bán</text>
<rect x="178.0" y="242.5" width="270.0" height="26.0" rx="6" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="1"/>
<text x="313.0" y="259.5" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">lệnh mua đuổi của người chờ breakout</text>
<line x1="118.0" y1="436.5" x2="118.0" y2="215.5" stroke="#0E9F6E" stroke-width="4" stroke-linecap="round"/>
<polygon points="118.0,206.5 124.7,216.4 111.3,216.4" fill="#0E9F6E"/>
<text x="132.0" y="416.5" font-size="11.5" font-weight="700" fill="#0E9F6E">giá đi lên…</text>
<text x="132.0" y="216.5" font-size="11.5" font-weight="700" fill="#0E9F6E">…và bị đẩy thêm</text>
<circle cx="90.0" cy="316.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="90.0" y="320.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="132.0" y="356.5" font-size="11" font-weight="400" fill="#111827">① chạm mức</text>
<text x="132.0" y="372.5" font-size="11" font-weight="400" fill="#111827">② lệnh dừng thành lệnh MUA NGAY</text>
<text x="132.0" y="388.5" font-size="11" font-weight="400" fill="#111827">③ mua dồn dập → giá nhảy</text>
<rect x="42.0" y="490.5" width="432.0" height="85.4" rx="8" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="1" stroke-opacity="0.35"/>
<rect x="42.0" y="490.5" width="4.0" height="85.4" rx="2" fill="#0891B2"/>
<text x="56.0" y="510.3" font-size="11.6" font-weight="700" fill="#0891B2" data-bx="42.0,474.0">[CƠ CHẾ] có bằng chứng, nhưng cho mức tròn</text>
<text x="56.0" y="529.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="42.0,474.0">Lệnh dừng khi bị chạm sẽ thành lệnh thị trường. Nghiên cứu lệnh FX</text>
<text x="56.0" y="546.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="42.0,474.0">quanh các mức tròn cho thấy hiệu ứng “thác stop” này (Osler 2003).</text>
<text x="56.0" y="562.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="42.0,474.0">Nghiên cứu đó KHÔNG nói về Order Block hay Breaker.</text>
<rect x="512.0" y="94.5" width="460.0" height="492.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="120.0" font-size="13.5" font-weight="700" fill="#2563EB" data-bx="525.0,961.0">LÚC QUAY LẠI — vì sao CÓ THỂ được đỡ, vì sao CÓ THỂ không</text>
<rect x="542.0" y="244.5" width="400.0" height="44.0" rx="4" fill="#2563EB" fill-opacity="0.13" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="742.0" y="271.5" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">vùng Breaker</text>
<line x1="742.0" y1="158.5" x2="742.0" y2="231.7" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="742.0,238.5 737.0,231.0 747.0,231.0" fill="#475569"/>
<text x="754.0" y="180.5" font-size="11" font-weight="700" fill="#475569">giá hồi về</text>
<text x="526.0" y="320.5" font-size="12.5" font-weight="700" fill="#15803D">Có thể ĐỠ, vì:</text>
<circle cx="530.0" cy="338.5" r="2.6" fill="#15803D"/>
<text x="540.0" y="342.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="539.0,734.0">Người bán bị kẹt mua lại để thoát</text>
<text x="540.0" y="359.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="539.0,734.0">gần hoà vốn</text>
<circle cx="530.0" cy="378.0" r="2.6" fill="#15803D"/>
<text x="540.0" y="382.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="539.0,734.0">Người lỡ cú phá đặt lệnh mua chờ</text>
<circle cx="530.0" cy="400.7" r="2.6" fill="#15803D"/>
<text x="540.0" y="404.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="539.0,734.0">Người mua từ đáy mua thêm</text>
<text x="749.0" y="320.5" font-size="12.5" font-weight="700" fill="#B91C1C">Có thể KHÔNG đỡ, vì:</text>
<circle cx="753.0" cy="338.5" r="2.6" fill="#B91C1C"/>
<text x="763.0" y="342.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="762.0,957.0">Người bị kẹt đã thoát hết từ lúc</text>
<text x="763.0" y="359.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="762.0,957.0">phá</text>
<circle cx="753.0" cy="378.0" r="2.6" fill="#B91C1C"/>
<text x="763.0" y="382.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="762.0,957.0">Lệnh mua chờ mỏng hơn lượng</text>
<text x="763.0" y="398.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="762.0,957.0">bán đang tới</text>
<circle cx="753.0" cy="417.5" r="2.6" fill="#B91C1C"/>
<text x="763.0" y="421.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="762.0,957.0">Khung lớn đang đi hướng ngược</text>
<text x="763.0" y="438.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="762.0,957.0">lại</text>
<rect x="526.0" y="490.5" width="432.0" height="68.9" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="526.0" y="490.5" width="4.0" height="68.9" rx="2" fill="#B45309"/>
<text x="540.0" y="510.3" font-size="11.6" font-weight="700" fill="#B45309" data-bx="526.0,958.0">[DIỄN GIẢI] hợp lý, không kiểm chứng được bằng OHLC</text>
<text x="540.0" y="529.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="526.0,958.0">Cả sáu dòng trên đều không nhìn thấy được trên chart nến. Điều nhìn</text>
<text x="540.0" y="546.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="526.0,958.0">thấy được chỉ là: giá chạm vùng, rồi nến đóng cửa ở đâu.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trẻ con: lúc phá giống đám đông đang chạy xô đổ hàng rào. Lúc quay lại giống hỏi “còn ai đứng giữ chỗ hàng rào cũ không?” — có thể còn, có thể đã về hết.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
