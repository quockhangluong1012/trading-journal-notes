<svg viewBox="0 0 760 566" width="760" height="566" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>DOL là một dự báo gồm 5 phần — không phải một đường kẻ trên chart</title>
<desc>Năm phần của một DOL và bốn khái niệm hay bị nhập làm một: liquidity pool, DOL, setup, target.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="566" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">DOL là một dự báo gồm 5 phần — không phải một đường kẻ trên chart</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Thiếu phần 3 (đối thủ) và 4 (horizon) thì DOL gần như luôn “đúng”: bạn không học được gì từ nó.</text>
<rect x="24" y="84" width="360" height="74" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="68" y="104.5" font-size="12.5" fill="#1F2937" font-weight="700">Thời điểm khóa (t)</text>
<text x="68" y="121.75" font-size="11" fill="#4B5563">Chốt dự báo trước khi giá chạy. Ví dụ 11:00 VN =</text>
<text x="68" y="136.65" font-size="11" fill="#4B5563">00:00 New York khi Mỹ dùng giờ mùa hè (EDT).</text>
<circle cx="38" cy="108" r="11" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="38" y="112.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<rect x="24" y="166" width="360" height="74" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="68" y="186.5" font-size="12.5" fill="#1F2937" font-weight="700">Mục tiêu</text>
<text x="68" y="203.75" font-size="11" fill="#4B5563">Một mức hoặc vùng giá cụ thể: ERL (đỉnh/đáy ngoài</text>
<text x="68" y="218.65" font-size="11" fill="#4B5563">range) hoặc IRL (FVG, gap, swing ngắn hạn bên</text>
<text x="68" y="233.55" font-size="11" fill="#4B5563">trong).</text>
<circle cx="38" cy="190" r="11" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="38" y="194.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<rect x="24" y="248" width="360" height="74" rx="8" fill="#FEF3C7" stroke="#D85A30" stroke-width="1.5"/>
<text x="68" y="268.5" font-size="12.5" fill="#1F2937" font-weight="700">Đối thủ (competitor)</text>
<text x="68" y="285.75" font-size="11" fill="#4B5563">Pool quan trọng nhất ở phía ngược lại. Câu đúng</text>
<text x="68" y="300.65" font-size="11" fill="#4B5563">phải là “giá chạm A TRƯỚC B”.</text>
<circle cx="38" cy="272" r="11" fill="#D85A30" stroke="none" stroke-width="1"/>
<text x="38" y="276.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<rect x="24" y="330" width="360" height="74" rx="8" fill="#FEF3C7" stroke="#D85A30" stroke-width="1.5"/>
<text x="68" y="350.5" font-size="12.5" fill="#1F2937" font-weight="700">Thời hạn (horizon)</text>
<text x="68" y="367.75" font-size="11" fill="#4B5563">Trong phiên này, hết ngày, hay trong tuần. Không</text>
<text x="68" y="382.65" font-size="11" fill="#4B5563">có horizon thì chờ đủ lâu là mức nào cũng bị chạm.</text>
<circle cx="38" cy="354" r="11" fill="#D85A30" stroke="none" stroke-width="1"/>
<text x="38" y="358.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<rect x="24" y="412" width="360" height="74" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="68" y="432.5" font-size="12.5" fill="#1F2937" font-weight="700">Điểm sai (invalidation)</text>
<text x="68" y="449.75" font-size="11" fill="#4B5563">Sự kiện khiến bạn bỏ dự báo trước khi A hoặc B bị</text>
<text x="68" y="464.65" font-size="11" fill="#4B5563">chạm.</text>
<circle cx="38" cy="436" r="11" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="38" y="440.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="24" y="500" font-size="11" fill="#6B7280" font-style="italic">Phần cam = hai phần hay bị bỏ sót nhất.</text>
<text x="404" y="100" font-size="13.5" fill="#1F2937" font-weight="700">Bốn thứ hay bị nhập làm một</text>
<rect x="404" y="114" width="332" height="76" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
<text x="418" y="136" font-size="13" fill="#1F2937" font-weight="700">Liquidity pool</text>
<text x="418" y="153" font-size="11" fill="#4B5563">Vật thể trên chart: PDH, EQL, high phiên Á, FVG…</text>
<text x="418" y="181" font-size="11.5" fill="#6B7280" font-weight="700">→ Lệnh đang nằm ở đâu?</text>
<line x1="570" y1="190" x2="570" y2="204" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arM)"/>
<rect x="404" y="204" width="332" height="76" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="418" y="226" font-size="13" fill="#1F2937" font-weight="700">DOL</text>
<text x="418" y="243" font-size="11" fill="#4B5563">Dự báo: pool nào bị chạm trước, trong bao lâu.</text>
<text x="418" y="271" font-size="11.5" fill="#2563EB" font-weight="700">→ Giá sẽ tới đâu trước?</text>
<line x1="570" y1="280" x2="570" y2="294" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arM)"/>
<rect x="404" y="294" width="332" height="76" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="418" y="316" font-size="13" fill="#1F2937" font-weight="700">Setup</text>
<text x="418" y="333" font-size="11" fill="#4B5563">Điều kiện vào lệnh trên đường tới DOL.</text>
<text x="418" y="361" font-size="11.5" fill="#1D9E75" font-weight="700">→ Lên tàu ở đâu, khi nào?</text>
<line x1="570" y1="370" x2="570" y2="384" stroke="#6B7280" stroke-width="1.4" marker-end="url(#arM)"/>
<rect x="404" y="384" width="332" height="76" rx="8" fill="#FCEBE4" stroke="#D85A30" stroke-width="1.2"/>
<text x="418" y="406" font-size="13" fill="#1F2937" font-weight="700">Target (TP)</text>
<text x="418" y="423" font-size="11" fill="#4B5563">Nơi thoát lệnh, đặt TRƯỚC DOL một chút.</text>
<text x="418" y="451" font-size="11.5" fill="#D85A30" font-weight="700">→ Xuống tàu ở đâu?</text>
<rect x="24" y="518" width="712" height="34" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="38" y="540" font-size="12" fill="#92400E" font-weight="700">Nhớ: DOL chọn ĐÍCH. POI chọn CHỖ LÊN TÀU. M5 chỉ quyết định CÓ LÊN TÀU HAY KHÔNG.</text>
</svg>
