<svg viewBox="0 0 1000 520" width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Internal BOS và External BOS: hai cấu trúc lồng vào nhau</title>
<desc>Internal BOS và External BOS: hai cấu trúc lồng vào nhau. Trong một cấu trúc GIẢM lớn (external), nhịp hồi có thể tạo cấu trúc TĂNG nhỏ (internal) và phá lên vài lần. Điều đó không mâu thuẫn.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="520" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Internal BOS và External BOS: hai cấu trúc lồng vào nhau</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Trong một cấu trúc GIẢM lớn (external), nhịp hồi có thể tạo cấu trúc TĂNG nhỏ (internal) và phá lên vài lần. Điều đó không mâu thuẫn.</tspan></text>
<rect x="24.0" y="92.0" width="600.0" height="406.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="229.3" y="246.2" width="179.9" height="146.3" rx="2" fill="#EAF1FE" stroke="#2563EB" stroke-width="0.8" opacity="0.45"/>
<text x="233.3" y="258.7" font-size="10.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">nhịp hồi (internal)</tspan></text>
<line x1="111.0" y1="140.5" x2="608.0" y2="140.5" stroke="#DC2626" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="608.0" y="135.5" font-size="11" fill="#DC2626" text-anchor="end"><tspan>external high — protected high của cấu trúc giảm</tspan></text>
<line x1="229.3" y1="392.6" x2="479.3" y2="392.6" stroke="#D85A30" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="267.2" y1="327.5" x2="319.3" y2="327.5" stroke="#2563EB" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="342.9" y1="278.7" x2="395.0" y2="278.7" stroke="#2563EB" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
<polyline points="40.0,189.3 111.0,140.5 229.3,392.6 267.2,327.5 295.6,360.0 342.9,278.7 371.3,311.3 409.2,246.2 489.7,433.2 537.0,384.4 589.1,465.7" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="111.0" cy="140.5" r="3.6" fill="#DC2626"/>
<text x="111.0" y="131.5" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH (external)</tspan></text>
<circle cx="229.3" cy="392.6" r="3.6" fill="#7C3AED"/>
<text x="229.3" y="411.1" font-size="11.5" fill="#7C3AED" text-anchor="middle"><tspan font-weight="700">LL (external)</tspan></text>
<circle cx="409.2" cy="246.2" r="3.6" fill="#DC2626"/>
<text x="409.2" y="237.2" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH mới</tspan></text>
<rect x="284.0" y="302.0" width="49.0" height="19.0" rx="9.5" fill="#EAF1FE" stroke="#2563EB" stroke-width="0.9"/>
<text x="308.5" y="315.1" font-size="10" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">iBOS ↑</tspan></text>
<rect x="357.8" y="253.2" width="49.0" height="19.0" rx="9.5" fill="#EAF1FE" stroke="#2563EB" stroke-width="0.9"/>
<text x="382.3" y="266.3" font-size="10" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">iBOS ↑</tspan></text>
<circle cx="472.2" cy="392.6" r="5.5" fill="#DC2626"/>
<text x="482.2" y="386.6" font-size="12" fill="#DC2626" text-anchor="start"><tspan font-weight="700">External BOS ↓</tspan></text>
<text x="243.5" y="173.0" font-size="11" fill="#2563EB" text-anchor="start"><tspan>giá phá lên 2 lần, nhưng đỉnh external vẫn nguyên</tspan></text>
<rect x="642.0" y="92.0" width="334.0" height="92.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="642.0" y="92.0" width="5.0" height="92.0" rx="2" fill="#DC2626"/>
<text x="656.0" y="112.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">External (khung chính)</tspan></text>
<text x="656.0" y="131.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Đỉnh LH và đáy LL lớn là biên của cấu trúc. Chỉ phá</tspan></text>
<text x="656.0" y="147.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>đỉnh LH mới phủ định cấu trúc giảm; phá đáy LL là</tspan></text>
<text x="656.0" y="163.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>BOS giảm của cấu trúc lớn.</tspan></text>
<rect x="642.0" y="196.0" width="334.0" height="104.0" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.0"/>
<rect x="642.0" y="196.0" width="5.0" height="104.0" rx="2" fill="#2563EB"/>
<text x="656.0" y="216.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Internal (bên trong nhịp hồi)</tspan></text>
<text x="656.0" y="235.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Nhịp hồi có đỉnh/đáy nhỏ riêng và phá lên hai lần (iBOS</tspan></text>
<text x="656.0" y="251.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>↑). Chúng mô tả nhịp hồi, không phủ định xu hướng</tspan></text>
<text x="656.0" y="267.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>giảm vì đỉnh external còn nguyên.</tspan></text>
<rect x="642.0" y="312.0" width="334.0" height="84.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="642.0" y="312.0" width="5.0" height="84.0" rx="2" fill="#1D9E75"/>
<text x="656.0" y="332.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Không mâu thuẫn</tspan></text>
<text x="656.0" y="351.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Hai câu đúng cùng lúc: &quot;nhịp hồi đang tăng&quot; (internal)</tspan></text>
<text x="656.0" y="367.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>và &quot;cấu trúc lớn đang giảm&quot; (external).</tspan></text>
<rect x="642.0" y="408.0" width="334.0" height="90.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="642.0" y="408.0" width="5.0" height="90.0" rx="2" fill="#B45309"/>
<text x="656.0" y="428.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Ai quyết định internal / external?</tspan></text>
<text x="656.0" y="447.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Không chỉ timeframe. Trên cùng một khung, swing là</tspan></text>
<text x="656.0" y="463.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>external nếu nó là biên của dealing range đang dùng;</tspan></text>
<text x="656.0" y="479.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>internal nếu nằm bên trong.</tspan></text>
</svg>
