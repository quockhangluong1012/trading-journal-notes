<svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="662.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Ta thật sự BIẾT gì, và ta đang GIẢ ĐỊNH gì?</text>
<rect x="813.3" y="23.0" width="158.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="892.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">TỔNG KẾT BẰNG CHỨNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bốn tầng, từ chắc nhất tới ít chắc nhất. Một câu nói về Breaker thuộc tầng nào thì chỉ đáng tin tới mức của tầng đó.</text>
<rect x="28.0" y="96.5" width="944.0" height="118.0" rx="11" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
<rect x="28.0" y="96.5" width="8.0" height="118.0" rx="4" fill="#15803D"/>
<text x="50.0" y="122.5" font-size="13.5" font-weight="700" fill="#15803D">NHÌN THẤY ĐƯỢC trên chart</text>
<text x="50.0" y="141.5" font-size="11.4" font-weight="400" fill="#6B7280">Ai nhìn cũng thấy giống nhau</text>
<rect x="50.0" y="156.5" width="187.2" height="19.8" rx="9.9" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="143.6" y="168.5" font-size="10.8" font-weight="700" fill="#15803D" text-anchor="middle">Có một cây nến ở đỉnh/đáy giữa</text>
<rect x="245.2" y="156.5" width="130.3" height="19.8" rx="9.9" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="310.4" y="168.5" font-size="10.8" font-weight="700" fill="#15803D" text-anchor="middle">Giá đã vượt cực trị cũ</text>
<rect x="383.5" y="156.5" width="192.3" height="19.8" rx="9.9" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="479.7" y="168.5" font-size="10.8" font-weight="700" fill="#15803D" text-anchor="middle">Nến đã đóng cửa qua swing giữa</text>
<rect x="583.9" y="156.5" width="124.8" height="19.8" rx="9.9" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="646.2" y="168.5" font-size="10.8" font-weight="700" fill="#15803D" text-anchor="middle">Giá đã quay lại vùng</text>
<rect x="716.6" y="156.5" width="185.9" height="19.8" rx="9.9" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="809.6" y="168.5" font-size="10.8" font-weight="700" fill="#15803D" text-anchor="middle">Nến đóng trong hay ngoài vùng</text>
<rect x="28.0" y="224.5" width="944.0" height="118.0" rx="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="28.0" y="224.5" width="8.0" height="118.0" rx="4" fill="#2563EB"/>
<text x="50.0" y="250.5" font-size="13.5" font-weight="700" fill="#2563EB">ICT ĐỊNH NGHĨA</text>
<text x="50.0" y="269.5" font-size="11.4" font-weight="400" fill="#6B7280">Là tên gọi và cách dùng — không phải bằng chứng về hiệu quả</text>
<rect x="50.0" y="284.5" width="161.8" height="19.8" rx="9.9" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1"/>
<text x="130.9" y="296.5" font-size="10.8" font-weight="700" fill="#2563EB" text-anchor="middle">Vùng nến đó tên là Breaker</text>
<rect x="219.8" y="284.5" width="249.4" height="19.8" rx="9.9" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1"/>
<text x="344.5" y="296.5" font-size="10.8" font-weight="700" fill="#2563EB" text-anchor="middle">Thiếu vi phạm cực trị cũ → Mitigation Block</text>
<rect x="477.3" y="284.5" width="235.8" height="19.8" rx="9.9" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1"/>
<text x="595.2" y="296.5" font-size="10.8" font-weight="700" fill="#2563EB" text-anchor="middle">Giá quay lại = “setup worth considering”</text>
<rect x="721.1" y="284.5" width="213.0" height="19.8" rx="9.9" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1"/>
<text x="827.6" y="296.5" font-size="10.8" font-weight="700" fill="#2563EB" text-anchor="middle">Dùng “the entire range” của cây nến</text>
<rect x="28.0" y="352.5" width="944.0" height="118.0" rx="11" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="28.0" y="352.5" width="8.0" height="118.0" rx="4" fill="#B45309"/>
<text x="50.0" y="378.5" font-size="13.5" font-weight="700" fill="#B45309">CỘNG ĐỒNG THÊM VÀO</text>
<text x="50.0" y="397.5" font-size="11.4" font-weight="400" fill="#6B7280">Phổ biến, hợp lý, nhưng không có trong bài giảng Breaker đã đối chiếu</text>
<rect x="50.0" y="412.5" width="181.8" height="19.8" rx="9.9" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="140.9" y="424.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="middle">“Breaker = Failed Order Block”</text>
<rect x="239.8" y="412.5" width="156.2" height="19.8" rx="9.9" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="317.9" y="424.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="middle">Bắt buộc có displacement</text>
<rect x="404.0" y="412.5" width="105.2" height="19.8" rx="9.9" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="456.6" y="424.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="middle">Bắt buộc có FVG</text>
<rect x="517.2" y="412.5" width="204.8" height="19.8" rx="9.9" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="619.6" y="424.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="middle">Breaker mạnh hơn Mitigation Block</text>
<rect x="730.0" y="412.5" width="131.2" height="19.8" rx="9.9" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="795.6" y="424.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="middle">Vào lệnh ở 50% vùng</text>
<rect x="50.0" y="438.5" width="148.0" height="19.8" rx="9.9" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="124.0" y="450.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="middle">Lần chạm đầu là tốt nhất</text>
<rect x="28.0" y="480.5" width="944.0" height="118.0" rx="11" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="28.0" y="480.5" width="8.0" height="118.0" rx="4" fill="#B91C1C"/>
<text x="50.0" y="506.5" font-size="13.5" font-weight="700" fill="#B91C1C">KHÔNG AI CHỨNG MINH ĐƯỢC TỪ CHART</text>
<text x="50.0" y="525.5" font-size="11.4" font-weight="400" fill="#6B7280">Giả định hoặc lời hứa — cần dữ liệu khác, hoặc cần backtest</text>
<rect x="50.0" y="540.5" width="200.1" height="19.8" rx="9.9" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="150.1" y="552.5" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="middle">Smart Money cố ý tạo ra vùng này</text>
<rect x="258.1" y="540.5" width="188.7" height="19.8" rx="9.9" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="352.5" y="552.5" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="middle">Có lệnh tổ chức nằm trong vùng</text>
<rect x="454.8" y="540.5" width="182.1" height="19.8" rx="9.9" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="545.9" y="552.5" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="middle">Người bị kẹt sẽ thoát ở hoà vốn</text>
<rect x="644.9" y="540.5" width="158.4" height="19.8" rx="9.9" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="724.1" y="552.5" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="middle">Breaker luôn tạo phản ứng</text>
<rect x="50.0" y="566.5" width="162.0" height="19.8" rx="9.9" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="131.0" y="578.5" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="middle">Breaker có lợi thế giao dịch</text>
<text x="28.0" y="631.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đi từ trên xuống, độ chắc chắn giảm dần. Phần lớn nội dung “dạy Breaker” trên mạng trộn cả bốn tầng trong một câu. Tách chúng ra là việc quan trọng nhất của</text>
<text x="28.0" y="648.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">note này.</text>
