<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Thang xác nhận BOS: B0 → B3 — biết thêm điều gì, và trả giá bằng độ trễ</title>
<desc>Thang xác nhận BOS: B0 → B3 — biết thêm điều gì, và trả giá bằng độ trễ. Mỗi bậc cộng thêm một điều kiện. Bậc càng cao càng chắc, nhưng càng biết muộn. Quy tắc vàng: bậc dùng để lọc phải là bậc đã có tại lúc ra quyết định.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="500" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Thang xác nhận BOS: B0 → B3 — biết thêm điều gì, và trả giá bằng độ trễ</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Mỗi bậc cộng thêm một điều kiện. Bậc càng cao càng chắc, nhưng càng biết muộn. Quy tắc vàng: bậc dùng để lọc phải là bậc đã có tại lúc ra quyết định.</tspan></text>
<rect x="24.0" y="290.0" width="228.0" height="102.0" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.0"/>
<text x="36.0" y="312.0" font-size="13" fill="#6B7280" text-anchor="start"><tspan font-weight="700">B0 — Đang chạm / xuyên</tspan></text>
<text x="36.0" y="334.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá đang giao dịch ngoài swing, nến</tspan></text>
<text x="36.0" y="349.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>chưa đóng.</tspan></text>
<text x="36.0" y="369.7" font-size="11.5" fill="#6B7280" text-anchor="start"><tspan font-weight="700">Trạng thái CHỜ. Chưa gọi là BOS.</tspan></text>
<rect x="264.0" y="240.0" width="228.0" height="152.0" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.0"/>
<text x="276.0" y="262.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">B1 — Đóng nến ngoài mức</tspan></text>
<text x="276.0" y="284.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Một nến của khung đang xét đóng</tspan></text>
<text x="276.0" y="299.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>ngoài swing.</tspan></text>
<text x="276.0" y="319.7" font-size="11.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Mức tối thiểu để GỌI BOS (quy ước</tspan></text>
<text x="276.0" y="335.6" font-size="11.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">của note này).</tspan></text>
<rect x="504.0" y="190.0" width="228.0" height="202.0" rx="8" fill="#E6F4F2" stroke="#0F766E" stroke-width="1.0"/>
<text x="516.0" y="212.0" font-size="13" fill="#0F766E" text-anchor="start"><tspan font-weight="700">B2 — Được chấp nhận</tspan></text>
<text x="516.0" y="234.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Trong một cửa sổ đã khai báo</tspan></text>
<text x="516.0" y="249.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>TRƯỚC, giá không đóng ngược vào</tspan></text>
<text x="516.0" y="265.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>trong.</tspan></text>
<text x="516.0" y="285.6" font-size="11.5" fill="#0F766E" text-anchor="start"><tspan font-weight="700">Loại bớt các cú phá thất bại.</tspan></text>
<rect x="744.0" y="140.0" width="228.0" height="252.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<text x="756.0" y="162.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">B3 — Có hậu quả cấu trúc</tspan></text>
<text x="756.0" y="184.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá tạo đáy/đỉnh mới cùng chiều và</tspan></text>
<text x="756.0" y="199.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>đi tiếp (hoặc có BOS kế tiếp).</tspan></text>
<text x="756.0" y="219.7" font-size="11.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Chắc nhất — nhưng thường đã đi</tspan></text>
<text x="756.0" y="235.6" font-size="11.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">xa.</tspan></text>
<line x1="40.0" y1="410.0" x2="960.0" y2="410.0" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ar_ink)"/>
<text x="500.0" y="428.0" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">thời gian trôi qua → biết nhiều hơn, nhưng muộn hơn</tspan></text>
<rect x="24.0" y="442.0" width="952.0" height="44.0" rx="8" fill="#FDF0EA" stroke="#D85A30" stroke-width="1.0"/>
<text x="38.0" y="462.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Displacement là một trục RIÊNG</tspan><tspan>, không phải một bậc: nó mô tả CHẤT LƯỢNG cú phá (gấp hay chậm) và có thể gắn từ B1 trở đi.</tspan></text>
<text x="38.0" y="479.0" font-size="12" fill="#6B7280" text-anchor="start"><tspan>Cùng logic với thang G0–G3 của MSS ở note 21 — chỉ khác hướng: BOS phá THUẬN trạng thái, MSS phá NGƯỢC trạng thái.</tspan></text>
</svg>
