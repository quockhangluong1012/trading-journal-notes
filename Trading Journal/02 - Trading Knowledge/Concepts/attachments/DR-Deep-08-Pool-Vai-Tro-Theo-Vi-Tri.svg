<svg viewBox="0 0 940 570" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="570" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Vai trò của một pool phụ thuộc VỊ TRÍ CỦA GIÁ</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Cùng một range. Cùng những pool. Vai trò ĐẢO HOÀN TOÀN. Vì vậy không thể nói “đây là draw” mà không nói giá đang ở đâu.</text>

  <!-- ================= LEFT : price at discount ================= -->
  <rect x="25" y="76" width="430" height="410" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="38" y="88" width="200" height="22" rx="5" fill="#DCFCE7"/>
  <text x="46" y="104" font-size="12" font-weight="700" fill="#15803D">Giá ở DEEP DISCOUNT (pd 0.2)</text>
  <rect x="38" y="118" width="404" height="352" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
  <g transform="translate(50,124)">
    <rect x="20" y="70" width="370" height="90" fill="#DC2626" opacity="0.07"/>
    <rect x="20" y="160" width="370" height="90" fill="#16A34A" opacity="0.08"/>
    <line x1="20" y1="70" x2="390" y2="70" stroke="#DC2626" stroke-width="1.8"/>
    <line x1="20" y1="250" x2="390" y2="250" stroke="#16A34A" stroke-width="1.8"/>
    <line x1="20" y1="160" x2="390" y2="160" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="330" y="156" font-size="10" fill="#6B7280">EQ 50%</text>

    <line x1="60" y1="52" x2="60" y2="70" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="46" y="46" font-size="10" font-weight="700" fill="#B91C1C">BSL — chưa spent</text>

    <line x1="60" y1="250" x2="60" y2="270" stroke="#15803D" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="46" y="284" font-size="10" font-weight="700" fill="#15803D">SSL — chưa spent</text>

    <rect x="196" y="196" width="56" height="16" fill="#3B82F6" opacity="0.20" stroke="#1D4ED8" stroke-width="0.9" stroke-dasharray="3 3"/>
    <text x="258" y="208" font-size="10" fill="#1D4ED8">FVG nội bộ</text>

    <circle cx="120" cy="222" r="5" fill="#111827"/>
    <text x="130" y="226" font-size="10.5" font-weight="700" fill="#111827">GIÁ</text>

    <path d="M120 212 C 150 150, 240 110, 300 78" fill="none" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 4"/>
    <polygon points="304,74 306,86 296,82" fill="#D97706"/>
    <text x="200" y="126" font-size="10.5" font-weight="700" fill="#B45309">DRAW hợp lệ — đích đến</text>

    <path d="M120 236 C 130 258, 150 268, 180 268" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="186" y="272" font-size="10.5" font-weight="700" fill="#6B7280">chỉ là JUDAS FUEL</text>

    <text x="196" y="236" font-size="10" fill="#1D4ED8">↑ POI để Long</text>
  </g>
  <rect x="38" y="478" width="404" height="0" fill="none"/>
  <text x="38" y="482" font-size="10.5" font-weight="700" fill="#15803D">Hành động: chờ sweep SSL (fuel) → MSS + displacement → Long về BSL (draw)</text>

  <!-- ================= RIGHT : price at premium ================= -->
  <rect x="485" y="76" width="430" height="410" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="498" y="88" width="212" height="22" rx="5" fill="#FEE2E2"/>
  <text x="506" y="104" font-size="12" font-weight="700" fill="#B91C1C">Giá ở DEEP PREMIUM (pd 0.8)</text>
  <rect x="498" y="118" width="404" height="352" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
  <g transform="translate(510,124)">
    <rect x="20" y="70" width="370" height="90" fill="#DC2626" opacity="0.07"/>
    <rect x="20" y="160" width="370" height="90" fill="#16A34A" opacity="0.08"/>
    <line x1="20" y1="70" x2="390" y2="70" stroke="#DC2626" stroke-width="1.8"/>
    <line x1="20" y1="250" x2="390" y2="250" stroke="#16A34A" stroke-width="1.8"/>
    <line x1="20" y1="160" x2="390" y2="160" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="330" y="156" font-size="10" fill="#6B7280">EQ 50%</text>

    <line x1="60" y1="52" x2="60" y2="70" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="46" y="46" font-size="10" font-weight="700" fill="#B91C1C">BSL — chưa spent</text>

    <line x1="60" y1="250" x2="60" y2="270" stroke="#15803D" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="46" y="284" font-size="10" font-weight="700" fill="#15803D">SSL — chưa spent</text>

    <rect x="196" y="130" width="56" height="16" fill="#3B82F6" opacity="0.20" stroke="#1D4ED8" stroke-width="0.9" stroke-dasharray="3 3"/>
    <text x="258" y="142" font-size="10" fill="#1D4ED8">FVG nội bộ</text>

    <circle cx="120" cy="100" r="5" fill="#111827"/>
    <text x="130" y="104" font-size="10.5" font-weight="700" fill="#111827">GIÁ</text>

    <path d="M120 114 C 160 160, 250 210, 300 242" fill="none" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 4"/>
    <polygon points="304,246 306,234 296,238" fill="#D97706"/>
    <text x="200" y="196" font-size="10.5" font-weight="700" fill="#B45309">DRAW hợp lệ — đích đến</text>

    <path d="M120 86 C 130 66, 150 56, 180 56" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="186" y="52" font-size="10.5" font-weight="700" fill="#6B7280">chỉ là JUDAS FUEL</text>

    <text x="196" y="170" font-size="10" fill="#1D4ED8">↓ POI để Short</text>
  </g>
  <text x="498" y="482" font-size="10.5" font-weight="700" fill="#B91C1C">Hành động: chờ sweep BSL (fuel) → MSS + displacement → Short về SSL (draw)</text>

  <!-- footer -->
  <rect x="25" y="502" width="890" height="48" rx="8" fill="#1F2937" opacity="0.05"/>
  <text x="38" y="521" font-size="11" font-weight="700" fill="#1F2937">Cơ chế phía sau (tầng [B], không phải narrative): stop orders tập trung ở các mức hiển nhiên; khi bị kích hoạt, chúng biến thành lệnh thị trường cùng chiều</text>
  <text x="38" y="538" font-size="10.5" fill="#4B5563">→ đó là lý do một cú vượt mức có thể tăng tốc. Nhưng nghiên cứu gốc (Osler) đo trên MỨC TRÒN ở FX, không phải trên swing high, và không chứng minh hỗ trợ/kháng cự sinh lời.</text>
</svg>
