<svg viewBox="0 0 1000 700" width="1000" height="700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="700" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Quan hệ D1 – H1: bốn trường hợp, bốn cách diễn giải mặc định — và điều làm chúng sai</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">H1 không có nghĩa vụ 'xác nhận ngay' D1. Câu hỏi đúng: H1 đang ở ĐÂU so với vùng D1, và nó đã phá swing CẤP NÀO?</text>
<rect x="26.0" y="84.0" width="470.0" height="294.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">A · D1 bullish, H1 bullish</text>
<rect x="40.0" y="122.0" width="150.0" height="110.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="40.0,199.0 70.0,181.4 85.0,187.6 122.5,163.8 137.5,170.0 182.5,146.2" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="204.0" y="140.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Diễn giải mặc định</text>
<text x="204.0" y="158.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">H1 đang trong nhịp đẩy (expansion) về</text>
<text x="204.0" y="173.5" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">phía DOL.</text>
<text x="204.0" y="199.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Điều làm diễn giải sai / thông tin còn thiếu</text>
<text x="204.0" y="217.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Thiếu: VỊ TRÍ. Giá thường đã ở premium →</text>
<text x="204.0" y="232.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">mua là đuổi giá.</text>
<rect x="40.0" y="296.0" width="442.0" height="70.0" rx="7" fill="#F9FAFB" stroke="#15803D" stroke-width="1.1"/>
<text x="52.0" y="316.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">HÀNH ĐỘNG</text>
<text x="52.0" y="336.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chờ nhịp hồi H1 về discount/POI; hoặc mô hình tiếp diễn có</text>
<text x="52.0" y="351.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">spec riêng.</text>
<rect x="504.0" y="84.0" width="470.0" height="294.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="108.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">B · D1 bullish, H1 bearish</text>
<rect x="518.0" y="122.0" width="150.0" height="110.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="518.0,146.2 540.5,159.4 555.5,155.0 585.5,177.0 600.5,171.7 638.0,194.6 660.5,191.1" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="682.0" y="140.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Diễn giải mặc định</text>
<text x="682.0" y="158.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Mặc định: nhịp HỒI đưa giá về</text>
<text x="682.0" y="173.5" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">discount/POI của D1.</text>
<text x="682.0" y="199.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Điều làm diễn giải sai / thông tin còn thiếu</text>
<text x="682.0" y="217.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Sai khi: H1 phá swing L3/L4 bằng</text>
<text x="682.0" y="232.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">displacement, ACCEPT xuyên POI, không</text>
<text x="682.0" y="247.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">phản ứng.</text>
<rect x="518.0" y="296.0" width="442.0" height="70.0" rx="7" fill="#F9FAFB" stroke="#B45309" stroke-width="1.1"/>
<text x="530.0" y="316.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">HÀNH ĐỘNG</text>
<text x="530.0" y="336.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không short theo H1; không long sớm. NOT READY → chờ giá vào</text>
<text x="530.0" y="351.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">POI.</text>
<rect x="26.0" y="388.0" width="470.0" height="294.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="412.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">C · D1 bearish, H1 bullish</text>
<rect x="40.0" y="426.0" width="150.0" height="110.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="40.0,511.8 62.5,498.6 77.5,503.0 107.5,481.0 122.5,486.3 160.0,463.4 182.5,466.9" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="204.0" y="444.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Diễn giải mặc định</text>
<text x="204.0" y="462.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Mặc định: nhịp HỒI LÊN về premium/POI</text>
<text x="204.0" y="477.5" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">của D1.</text>
<text x="204.0" y="503.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Điều làm diễn giải sai / thông tin còn thiếu</text>
<text x="204.0" y="521.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Sai khi: H1 phá protected high bằng</text>
<text x="204.0" y="536.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">displacement + đóng cửa giữ trên; hồi</text>
<text x="204.0" y="551.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">vượt EQ rồi tiếp tục.</text>
<rect x="40.0" y="600.0" width="442.0" height="70.0" rx="7" fill="#F9FAFB" stroke="#B45309" stroke-width="1.1"/>
<text x="52.0" y="620.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">HÀNH ĐỘNG</text>
<text x="52.0" y="640.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không long theo H1; không short sớm giữa đường. Chờ phản ứng</text>
<text x="52.0" y="655.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tại POI premium.</text>
<rect x="504.0" y="388.0" width="470.0" height="294.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="412.0" font-size="13.5" font-weight="700" fill="#4B5563" text-anchor="start">D · D1 và H1 đều không rõ</text>
<rect x="518.0" y="426.0" width="150.0" height="110.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="518.0,481.0 540.5,465.2 563.0,493.3 585.5,470.4 608.0,489.8 630.5,472.2 660.5,482.8" fill="none" stroke="#4B5563" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="682.0" y="444.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Diễn giải mặc định</text>
<text x="682.0" y="462.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Range/chuyển tiếp ở cả hai tầng.</text>
<text x="682.0" y="487.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Điều làm diễn giải sai / thông tin còn thiếu</text>
<text x="682.0" y="505.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không có giả thuyết hướng nào đủ cơ sở;</text>
<text x="682.0" y="520.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">mọi 'setup' là đọc nhiễu.</text>
<rect x="518.0" y="600.0" width="442.0" height="70.0" rx="7" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.1"/>
<text x="530.0" y="620.0" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="start">HÀNH ĐỘNG</text>
<text x="530.0" y="640.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Neutral / chờ. Ghi điều kiện nào sẽ làm rõ (phá range D1 có</text>
<text x="530.0" y="655.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">acceptance).</text>
