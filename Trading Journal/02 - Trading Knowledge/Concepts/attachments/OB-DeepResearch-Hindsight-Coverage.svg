<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16A34A"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Vì sao "perfect OB" chỉ hiện ra sau sự kiện</text>
  <text x="24" y="52" font-size="12.5" fill="#6B7280">Nhiều zone ứng viên phủ một phần lớn không gian hồi → một điểm quay đầu ngẫu nhiên cũng dễ "trúng" một OB.</text>

  <!-- LEFT: ex-ante -->
  <rect x="20" y="66" width="352" height="300" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="20" y="66" width="352" height="28" rx="8" fill="#F3F4F6"/>
  <text x="32" y="85" font-size="12" font-weight="800" fill="#374151">TRƯỚC quyết định (ex-ante)</text>
  <circle cx="330" cy="112" r="5" fill="#111827"/>
  <text x="252" y="116" font-size="9.5" fill="#111827">giá hiện tại</text>
  <!-- bracket retrace space -->
  <line x1="40" y1="112" x2="40" y2="350" stroke="#9CA3AF"/>
  <line x1="36" y1="112" x2="44" y2="112" stroke="#9CA3AF"/><line x1="36" y1="350" x2="44" y2="350" stroke="#9CA3AF"/>
  <text x="48" y="345" font-size="9" fill="#6B7280">không gian hồi ≈ 6 ATR</text>
  <g font-size="9.5">
    <rect x="60" y="124" width="250" height="10" fill="#E0F2FE"/><text x="316" y="133" fill="#0369A1">OB-e L1 ?</text>
    <rect x="60" y="148" width="250" height="16" fill="#BFDBFE"/><text x="316" y="160" fill="#1D4ED8">OB-a L2 ?</text>
    <rect x="60" y="186" width="250" height="16" fill="#BFDBFE"/><text x="316" y="198" fill="#1D4ED8">OB-b L2 ?</text>
    <rect x="60" y="236" width="250" height="16" fill="#1D4ED8" opacity="0.85"/><text x="316" y="248" font-weight="700" fill="#1D4ED8">OB-c L3</text>
    <rect x="60" y="292" width="250" height="24" fill="#DDD6FE"/><text x="316" y="308" fill="#6D28D9">OB-d L4</text>
  </g>
  <rect x="66" y="258" width="238" height="26" rx="5" fill="#ECFDF5" stroke="#16A34A" stroke-width="0.8"/>
  <text x="74" y="275" font-size="9.5" fill="#166534">Plan A (cam kết trước): chờ OB-c + M5 evidence</text>
  <text x="66" y="220" font-size="9" fill="#6B7280">OB-a, OB-b: internal → inducement (R-H4 không thỏa)</text>

  <!-- RIGHT: ex-post -->
  <rect x="388" y="66" width="352" height="300" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="388" y="66" width="352" height="28" rx="8" fill="#FEF2F2"/>
  <text x="400" y="85" font-size="12" font-weight="800" fill="#B91C1C">SAU sự kiện (ex-post)</text>
  <g font-size="9.5">
    <rect x="410" y="124" width="250" height="10" fill="#E0F2FE"/>
    <rect x="410" y="148" width="250" height="16" fill="#BFDBFE"/>
    <rect x="410" y="186" width="250" height="16" fill="#FECACA" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="410" y="236" width="250" height="16" fill="#1D4ED8" opacity="0.35"/>
    <rect x="410" y="292" width="250" height="24" fill="#DDD6FE" opacity="0.6"/>
    <text x="666" y="198" font-weight="800" fill="#DC2626">"OB hoàn hảo!"</text>
    <text x="666" y="248" fill="#6B7280">OB-c: không</text>
    <text x="666" y="260" fill="#6B7280">được chạm</text>
  </g>
  <polyline points="420,112 470,140 500,128 540,170 570,160 600,192 630,150 660,124 690,112" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#aG)"/>
  <circle cx="600" cy="192" r="4" fill="#DC2626"/>
  <rect x="404" y="324" width="320" height="34" rx="5" fill="#FFF7ED"/>
  <text x="412" y="338" font-size="9.5" fill="#9A3412">Độ phủ: 5 × 0.4 ATR / 6 ATR ≈ 33%</text>
  <text x="412" y="352" font-size="9.5" fill="#9A3412">Có near-miss ±0.2 ATR: ≈ 67% · thêm tự do chọn TF → cao hơn</text>

  <!-- bottom -->
  <rect x="20" y="378" width="720" height="40" rx="8" fill="#F3F4F6"/>
  <text x="32" y="396" font-size="11" font-weight="700" fill="#1F2937">Ví dụ hậu nghiệm ≠ bằng chứng.</text>
  <text x="32" y="411" font-size="10.5" fill="#374151">Bằng chứng = kế hoạch cam kết TRƯỚC × nhiều mẫu × so với vùng đối chứng (HYP-OB-001). Số liệu trên là số học minh họa.</text>
</svg>
