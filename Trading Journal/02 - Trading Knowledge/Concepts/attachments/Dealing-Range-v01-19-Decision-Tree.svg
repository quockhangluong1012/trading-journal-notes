  <text x="56.0" y="804.0" font-size="12" font-weight="700" fill="#1F2937">Monitor theo state machine (event-driven):</text>
  <text x="56.0" y="826.0" font-size="11.2" fill="#374151">INVALIDATED → quay lại câu hỏi 1   ·   EXTENDED / COMPLETED → dựng lại anchors   ·   ACTIVE / SWEPT → giữ nguyên</text>
  <text x="56.0" y="850.0" font-size="11.2" font-weight="700" fill="#7C3AED">Sau đó: lặp câu hỏi 1–6 ở scale H1 với parent constraint (R3) → H1 GATE → M5 GATE</text>
