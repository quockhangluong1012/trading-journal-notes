<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0.0" y="0.0" width="940.0" height="600.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Liquidity phải đặt trong Market Structure: mức nào bị phá thì câu chuyện đổi?</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Ví dụ cấu trúc tăng trên H1. Các mức SSL nhìn giống nhau trên chart nhưng ý nghĩa cấu trúc rất khác nhau.</text>
<rect x="24.0" y="74.0" width="560.0" height="440.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<path d="M50.0,461.2 L124.0,311.6 L164.7,368.8 L235.0,232.4 L286.8,320.4 L373.8,153.2 L397.8,223.6 L416.3,206.0 L438.5,258.8 L460.7,232.4 L482.9,250.0 L508.8,223.6 L534.7,241.2" stroke="#1F2937" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="50.0" cy="461.2" r="3.5" fill="#1F2937"/>
<text x="50.0" y="478.2" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">Range low</text>
<circle cx="124.0" cy="311.6" r="3.5" fill="#1F2937"/>
<text x="124.0" y="302.6" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">H</text>
<circle cx="164.7" cy="368.8" r="3.5" fill="#1F2937"/>
<text x="164.7" y="385.8" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">HL</text>
<circle cx="235.0" cy="232.4" r="3.5" fill="#1F2937"/>
<text x="235.0" y="223.4" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">HH (BOS)</text>
<circle cx="286.8" cy="320.4" r="3.5" fill="#1F2937"/>
<text x="286.8" y="337.4" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">HL = protected low</text>
<circle cx="373.8" cy="153.2" r="3.5" fill="#1F2937"/>
<text x="365.8" y="157.2" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="end">HH = range high</text>
<circle cx="416.3" cy="206.0" r="3.5" fill="#1F2937"/>
<text x="416.3" y="197.0" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">ih</text>
<circle cx="438.5" cy="258.8" r="3.5" fill="#1F2937"/>
<text x="438.5" y="275.8" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="middle">il</text>
<line x1="373.8" y1="153.2" x2="565.0" y2="153.2" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="148.2" font-size="10.3" fill="#C2410C" font-weight="700" text-anchor="end">BSL ngoài range high (Level 4)</text>
<line x1="416.3" y1="206.0" x2="565.0" y2="206.0" stroke="#C2410C" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="560.0" y="220.0" font-size="10.3" fill="#C2410C" font-weight="700" text-anchor="end">BSL trên ih (Level 2 — inducement?)</text>
<line x1="438.5" y1="258.8" x2="565.0" y2="258.8" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="560.0" y="272.8" font-size="10.3" fill="#1D4ED8" font-weight="700" text-anchor="end">SSL dưới il (Level 2)</text>
<line x1="286.8" y1="320.4" x2="565.0" y2="320.4" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="315.4" font-size="10.3" fill="#1D4ED8" font-weight="700" text-anchor="end">SSL dưới protected low (Level 3–4)</text>
<line x1="50.0" y1="461.2" x2="565.0" y2="461.2" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="456.2" font-size="10.3" fill="#1D4ED8" font-weight="700" text-anchor="end">SSL dưới range low (Level 4–5)</text>
<circle cx="534.7" cy="241.2" r="5" fill="#7C3AED"/>
<text x="542.7" y="245.2" font-size="10.5" fill="#7C3AED" font-weight="700" text-anchor="start">giá</text>
<text x="600.0" y="92.0" font-size="13" fill="#1F2937" font-weight="700" text-anchor="start">Nếu mức bị xuyên thì sao?</text>
<rect x="600.0" y="104.0" width="316.0" height="82.0" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="612.0" y="126.0" font-size="11.8" fill="#1D4ED8" font-weight="700" text-anchor="start">SSL dưới il (internal)</text>
<text x="612.0" y="148.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Thường chỉ là nhịp hồi trong</text>
<text x="612.0" y="166.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">cấu trúc tăng. Ít thay đổi câu chuyện.</text>
<rect x="600.0" y="196.0" width="316.0" height="82.0" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="612.0" y="218.0" font-size="11.8" fill="#1D4ED8" font-weight="700" text-anchor="start">SSL dưới protected low</text>
<text x="612.0" y="240.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Bị phá + acceptance = cấu trúc</text>
<text x="612.0" y="258.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">tăng H1 bị nghi ngờ (ứng viên MSS).</text>
<rect x="600.0" y="288.0" width="316.0" height="82.0" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.3"/>
<text x="612.0" y="310.0" font-size="11.8" fill="#C2410C" font-weight="700" text-anchor="start">BSL trên ih</text>
<text x="612.0" y="332.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Bị xuyên nhanh có thể chỉ là</text>
<text x="612.0" y="350.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">nhịp &quot;mồi&quot; trước POI sâu hơn.</text>
<rect x="600.0" y="380.0" width="316.0" height="82.0" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.3"/>
<text x="612.0" y="402.0" font-size="11.8" fill="#C2410C" font-weight="700" text-anchor="start">BSL ngoài range high</text>
<text x="612.0" y="424.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Bị phá + acceptance = range mới;</text>
<text x="612.0" y="442.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">bị xuyên + rejection = ứng viên sweep.</text>
<rect x="600.0" y="474.0" width="316.0" height="40.0" rx="7" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="612.0" y="498.0" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">Câu hỏi gốc: phá mức này có ĐỔI cách đọc không?</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Liquidity = MỨC (đối tượng). BOS/MSS = SỰ KIỆN cấu trúc. Sweep = SỰ KIỆN tương tác với mức. Displacement = TÍNH CHẤT</text>
<text x="40.0" y="561.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">của chuyển động. Bốn thứ liên quan nhưng không đồng nhất — một lần xuyên mức có thể là sweep, BOS, cả hai, hoặc chưa phải gì.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-09 · Cấu trúc minh họa trên H1. &quot;Protected low&quot; = đáy tạo ra nhịp phá đỉnh gần nhất (định nghĩa làm việc).</text>
</svg>
