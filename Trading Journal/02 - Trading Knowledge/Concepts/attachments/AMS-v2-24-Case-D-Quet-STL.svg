<circle cx="558.8" cy="324.0" r="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2"/>
<text x="562.8" y="344.0" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="middle">chọc qua STL</text>
<line x1="239.6" y1="444.0" x2="614.0" y2="444.0" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="610.0" y="437.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end">ITL — chưa bị chạm</text>
<rect x="664.0" y="96.0" width="308.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.3"/>
<rect x="664.0" y="96.0" width="5.0" height="64.0" rx="2" fill="#6B7280" stroke="#6B7280" stroke-width="0"/>
<text x="678.0" y="115.5" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">Quan sát được</text>
<text x="678.0" y="132.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá xuống dưới một STL một chút</text>
<text x="678.0" y="148.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">rồi quay lên và lập đỉnh mới.</text>
<rect x="664.0" y="172.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="664.0" y="172.0" width="5.0" height="80.7" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="678.0" y="191.5" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">Đọc theo ICT</text>
<text x="678.0" y="208.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Sell-side liquidity dưới STL đã bị lấy.</text>
<text x="678.0" y="224.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc trung hạn (ITL) không đổi.</text>
<text x="678.0" y="241.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Xu hướng tăng ở cấp ITL còn nguyên.</text>
<rect x="664.0" y="264.0" width="308.0" height="97.4" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
<rect x="664.0" y="264.0" width="5.0" height="97.4" rx="2" fill="#059669" stroke="#059669" stroke-width="0"/>
<text x="678.0" y="283.5" font-size="11.5" font-weight="700" fill="#059669" text-anchor="start">Cái đã đổi</text>
<text x="678.0" y="300.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cấp ngắn hạn có một đáy thấp hơn</text>
<text x="678.0" y="316.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(một lần phá nội bộ nhỏ).</text>
<text x="678.0" y="333.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Sau khi đỉnh mới xuất hiện, đáy vừa</text>
<text x="678.0" y="350.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chọc xuống trở thành STL mới.</text>
<rect x="664.0" y="372.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="664.0" y="372.0" width="5.0" height="80.7" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="678.0" y="391.5" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start">Không kết luận được</text>
<text x="678.0" y="408.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">"Ai đó cố ý săn stop" — chart không</text>
<text x="678.0" y="424.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cho biết danh tính hay ý định.</text>
<text x="678.0" y="441.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cũng không chắc lần sau sẽ lặp lại.</text>
