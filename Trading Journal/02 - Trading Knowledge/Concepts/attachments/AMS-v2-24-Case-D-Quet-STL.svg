<svg viewBox="0 0 1000 520" width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="518" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case D — Giá quét một STL, ITL còn nguyên</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Giá chọc nhẹ xuống dưới một đáy nhỏ rồi đi lên tiếp. Đáy vừa ở xa bên dưới không hề bị chạm.</text>
<rect x="900.8" y="22.0" width="71.2" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="936.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CASE D</text>
