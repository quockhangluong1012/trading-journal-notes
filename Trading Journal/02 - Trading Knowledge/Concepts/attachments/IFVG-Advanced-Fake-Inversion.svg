<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Inversion THẬT vs Fake inversion — ngay cả body close cũng có thể là bẫy</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Điều kiện sống còn không chỉ là "close qua FVG" mà là "close qua + GIỮ được (acceptance)".</text>

  <!-- LEFT: true inversion -->
  <rect x="24" y="68" width="350" height="300" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <rect x="24" y="68" width="350" height="30" rx="8" fill="#FEE2E2"/>
  <text x="38" y="88" font-size="13" font-weight="800" fill="#B91C1C">Inversion THẬT → bearish IFVG</text>

  <rect x="80" y="150" width="270" height="34" fill="#16A34A" opacity="0.15"/>
  <text x="86" y="145" font-size="9" fill="#166534">bullish FVG cũ</text>
  <path d="M55,240 L90,200 L115,215 L150,167" fill="none" stroke="#16A34A" stroke-width="2.2"/>
  <!-- close through and HOLD below -->
  <path d="M150,167 L180,215 L205,205 L235,270 L265,255 L295,300" fill="none" stroke="#DC2626" stroke-width="2.6"/>
  <text x="160" y="245" font-size="9" font-weight="700" fill="#B91C1C">close xuyên + GIỮ dưới</text>
  <text x="160" y="257" font-size="8.5" fill="#B91C1C">(acceptance, nhiều nến)</text>
  <!-- retest up reject -->
  <path d="M295,300 L320,255 L340,167" fill="none" stroke="#374151" stroke-width="1.9"/>
  <circle cx="337" cy="167" r="5" fill="#DC2626"/>
  <text x="240" y="150" font-size="9" font-weight="700" fill="#B91C1C">retest → reject → Short</text>
  <text x="40" y="352" font-size="10.5" fill="#374151">→ Đảo cực xác nhận: giá không quay lại gap</text>

  <!-- RIGHT: fake inversion -->
  <rect x="386" y="68" width="350" height="300" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <rect x="386" y="68" width="350" height="30" rx="8" fill="#DCFCE7"/>
  <text x="400" y="88" font-size="13" font-weight="800" fill="#166534">FAKE — close xuyên rồi RECLAIM ngay</text>

  <rect x="442" y="150" width="270" height="34" fill="#16A34A" opacity="0.15"/>
  <text x="448" y="145" font-size="9" fill="#166534">bullish FVG cũ (vẫn sống)</text>
  <path d="M417,240 L452,200 L477,215 L512,167" fill="none" stroke="#16A34A" stroke-width="2.2"/>
  <!-- one candle closes below then snaps back into gap -->
  <path d="M512,167 L535,205 L548,198" fill="none" stroke="#DC2626" stroke-width="2.2"/>
  <text x="500" y="228" font-size="8.5" fill="#B91C1C">1 nến close dưới</text>
  <!-- reclaim back up into/above gap -->
  <path d="M548,198 L575,160 L600,175 L640,120 L680,132" fill="none" stroke="#16A34A" stroke-width="2.8"/>
  <circle cx="548" cy="198" r="4" fill="#16A34A"/>
  <text x="560" y="150" font-size="9" font-weight="700" fill="#166534">reclaim vào gap → FVG còn sống</text>
  <text x="430" y="300" font-size="9.5" font-weight="700" fill="#B91C1C">Short "IFVG" ở đây = bị quét</text>
  <text x="400" y="352" font-size="10.5" fill="#374151">→ Đây là liquidity purge, KHÔNG phải inversion</text>

  <rect x="24" y="376" width="712" height="52" rx="6" fill="#EDE9FE"/>
  <text x="36" y="396" font-size="11.5" font-weight="700" fill="#5B21B6">Acceptance là trục hay bị bỏ qua nhất: một body close đẹp + MSS vẫn có thể FAIL nếu nến sau reclaim vào gap.</text>
  <text x="36" y="416" font-size="11.5" fill="#5B21B6">Chờ giá GIỮ bên kia (không đóng lại quá CE về phía gap) vài nến rồi mới coi là IFVG. Close-then-reclaim = purge.</text>
</svg>
