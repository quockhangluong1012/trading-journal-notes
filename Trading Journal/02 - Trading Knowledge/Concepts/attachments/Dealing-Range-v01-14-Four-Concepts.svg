<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">Boundary ≠ Liquidity pool ≠ Structural swing ≠ DOL</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Một mức giá có thể là cả bốn — nhưng đó là bốn claim khác nhau, mỗi claim cần bằng chứng riêng. Liquidity luôn là biến ẩn (latent) trên OHLC.</text>
