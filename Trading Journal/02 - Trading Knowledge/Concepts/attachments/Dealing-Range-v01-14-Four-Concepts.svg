  <text x="526.0" y="402.0" font-size="11.5" font-weight="700" fill="#1F2937">Quan sát được: CÓ (qua định nghĩa)</text>
  <rect x="512.0" y="450.0" width="442.0" height="104.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
