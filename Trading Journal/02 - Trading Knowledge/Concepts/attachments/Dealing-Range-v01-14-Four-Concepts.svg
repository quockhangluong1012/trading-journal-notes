  <text x="276.0" y="391.8" font-size="10" font-weight="700" fill="#1D4ED8">bullish FVG</text>
  <text x="78.0" y="354.3" font-size="10" fill="#1D4ED8">FVG = inefficiency (giao dịch một chiều, ít time-at-price). ICT gọi là IRL —</text>
  <text x="78.0" y="367.8" font-size="10" fill="#1D4ED8">nhưng nó KHÔNG phải liquidity theo nghĩa microstructure.</text>
