<svg viewBox="0 0 900 470" width="900" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cầu thang: vì sao xu hướng tăng tạo HH–HL, xu hướng giảm tạo LH–LL</title>
<desc>Cầu thang: vì sao xu hướng tăng tạo HH–HL, xu hướng giảm tạo LH–LL. Bé leo cầu thang: chân đặt lên bậc cao hơn bậc trước (đáy cao hơn = HL), tay với cao hơn lần trước (đỉnh cao hơn = HH). Mỗi lần tay với vượt mức cao nhất cũ, ta đánh dấu một BOS. Đi xuống cầu thang thì ngược lại.</desc>
