<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Cầu thang: vì sao xu hướng tăng tạo HH–HL, xu hướng giảm tạo LH–LL</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Bé leo cầu thang: chân đặt lên bậc cao hơn bậc trước (đáy cao hơn = HL), tay với cao hơn lần trước (đỉnh cao hơn = HH). Mỗi lần tay với vượt</tspan></text>
<text x="24.0" y="72.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>mức cao nhất cũ, ta đánh dấu một BOS. Đi xuống cầu thang thì ngược lại.</tspan></text>
