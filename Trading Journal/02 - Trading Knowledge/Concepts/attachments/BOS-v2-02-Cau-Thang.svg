<text x="24.0" y="418.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">HH</tspan><tspan> = đỉnh cao hơn · </tspan><tspan font-weight="700">HL</tspan><tspan> = đáy cao hơn · </tspan><tspan font-weight="700">LH</tspan><tspan> = đỉnh thấp hơn · </tspan><tspan font-weight="700">LL</tspan><tspan> = đáy thấp hơn. Bậc xám = chỗ &quot;chân đứng&quot; (đáy/đỉnh mà cấu trúc dựa vào).</tspan></text>
<text x="24.0" y="440.0" font-size="12" fill="#6B7280" text-anchor="start"><tspan>Lưu ý: vẽ là để HIỂU. Thị trường thật hiếm khi đều như cầu thang — bậc có thể dài ngắn khác nhau, có lúc giá đi ngang rất lâu.</tspan></text>
