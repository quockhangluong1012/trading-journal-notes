<text x="735.0" y="396.0" font-size="9.2" font-weight="400" fill="#6B7280" text-anchor="middle">H 101 · L 98.8</text>
<line x1="530.0" y1="236.8" x2="800.0" y2="236.8" stroke="#B91C1C" stroke-width="1" stroke-dasharray="2 3"/>
<text x="806.0" y="268.8" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">proximal 101</text>
<text x="806.0" y="240.8" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">CE 102</text>
<text x="806.0" y="212.8" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">distal 103</text>
<text x="516.0" y="422.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Điều kiện: High₃ &lt; Low₁  (101 &lt; 103)</text>
<text x="516.0" y="443.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Vùng: [High₃, Low₁] = [101, 103]</text>
<text x="516.0" y="464.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Proximal = High₃ = 101 · Distal = Low₁ = 103</text>
<text x="516.0" y="485.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">CE = (101 + 103)/2 = 102</text>
<text x="516.0" y="506.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Size = 2.0</text>
