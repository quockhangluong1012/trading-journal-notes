<line x1="735.0" y1="264.8" x2="735.0" y2="326.4" stroke="#DC2626" stroke-width="1.6"/>
<rect x="720.0" y="292.8" width="30.0" height="22.4" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="1.6"/>
