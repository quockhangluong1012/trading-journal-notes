<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Bullish FVG (BISI) và Bearish FVG (SIBI) — đọc bằng số OHLC</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">FVG chỉ TỒN TẠI khi nến 3 đã đóng cửa. Proximal = mép gần giá hiện tại (chạm trước khi retrace); distal = mép xa (cuối vùng).</text>
<rect x="30.0" y="92.0" width="450.0" height="450.0" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
<text x="46.0" y="116.0" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">Bullish FVG — BISI</text>
<rect x="60.0" y="236.8" width="270.0" height="56.0" rx="0" fill="#16A34A" fill-opacity="0.18"/>
<line x1="60.0" y1="236.8" x2="330.0" y2="236.8" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="60.0" y1="292.8" x2="330.0" y2="292.8" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="105.0" y1="292.8" x2="105.0" y2="348.8" stroke="#16A34A" stroke-width="1.6"/>
<rect x="90.0" y="304.0" width="30.0" height="16.8" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<text x="105.0" y="382.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Nến 1</text>
<text x="105.0" y="396.0" font-size="9.2" font-weight="400" fill="#6B7280" text-anchor="middle">H 100 · L 98</text>
<line x1="185.0" y1="197.6" x2="185.0" y2="309.6" stroke="#16A34A" stroke-width="1.6"/>
<rect x="170.0" y="208.8" width="30.0" height="95.2" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<text x="185.0" y="382.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Nến 2</text>
<text x="185.0" y="396.0" font-size="9.2" font-weight="400" fill="#6B7280" text-anchor="middle">H 103.4 · L 99.4</text>
<line x1="265.0" y1="175.2" x2="265.0" y2="236.8" stroke="#16A34A" stroke-width="1.6"/>
<rect x="250.0" y="186.4" width="30.0" height="22.4" rx="2" fill="#16A34A" fill-opacity="0.9" stroke="#16A34A" stroke-width="1.6"/>
<text x="265.0" y="382.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Nến 3</text>
<text x="265.0" y="396.0" font-size="9.2" font-weight="400" fill="#6B7280" text-anchor="middle">H 104.2 · L 102</text>
<line x1="60.0" y1="264.8" x2="330.0" y2="264.8" stroke="#15803D" stroke-width="1" stroke-dasharray="2 3"/>
<text x="336.0" y="240.8" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">proximal 102</text>
<text x="336.0" y="268.8" font-size="10.5" font-weight="400" fill="#15803D" text-anchor="start">CE 101</text>
<text x="336.0" y="296.8" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">distal 100</text>
<text x="46.0" y="422.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Điều kiện: Low₃ &gt; High₁  (102 &gt; 100)</text>
<text x="46.0" y="443.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Vùng: [High₁, Low₃] = [100, 102]</text>
<text x="46.0" y="464.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Proximal = Low₃ = 102 · Distal = High₁ = 100</text>
<text x="46.0" y="485.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">CE = (100 + 102)/2 = 101</text>
<text x="46.0" y="506.0" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">Size = 2.0 → chia ATR để so sánh giữa thị trường</text>
<rect x="500.0" y="92.0" width="450.0" height="450.0" rx="9" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
