<svg viewBox="0 0 980 830" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="830" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mô hình tư duy cuối cùng — từ giá tới MSS tới kết cục</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Màu = loại bằng chứng: xanh lá quan sát · tím phân loại theo định nghĩa · cam diễn giải/bối cảnh · đỏ giả thuyết cần đo.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Đây là framework nghiên cứu và mô hình giao dịch, không phải luật nhân quả của thị trường.</text>
<rect x="330.0" y="100.0" width="320.0" height="34.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="490.0" y="122.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">THỊ TRƯỜNG · LỆNH KHỚP</text>
<line x1="490.0" y1="134.0" x2="490.0" y2="144.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="146.0" width="320.0" height="34.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="490.0" y="168.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">CHUYỂN ĐỘNG GIÁ (OHLC)</text>
<line x1="490.0" y1="180.0" x2="490.0" y2="190.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="192.0" width="320.0" height="34.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="490.0" y="214.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">SWING (do thuật toán chọn + known_at)</text>
<line x1="490.0" y1="226.0" x2="490.0" y2="236.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="238.0" width="320.0" height="34.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="490.0" y="260.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">PHÂN CẤP L1–L5 · lớp internal / swing</text>
<line x1="490.0" y1="272.0" x2="490.0" y2="282.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="284.0" width="320.0" height="34.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="490.0" y="306.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">SIGNIFICANCE (gates → scores)</text>
<line x1="490.0" y1="318.0" x2="490.0" y2="328.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="330.0" width="320.0" height="34.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="490.0" y="352.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">PROTECTED SWING (gốc leg BOS)</text>
<line x1="490.0" y1="364.0" x2="490.0" y2="374.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="376.0" width="320.0" height="34.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="490.0" y="398.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">GIÁ TẤN CÔNG MỨC</text>
<line x1="490.0" y1="410.0" x2="490.0" y2="420.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="330.0" y="422.0" width="320.0" height="34.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="490.0" y="444.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">BREAK: close vượt (G0)</text>
<line x1="450.0" y1="456.0" x2="300.0" y2="490.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="530.0" y1="456.0" x2="680.0" y2="490.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="150.0" y="492.0" width="300.0" height="40.0" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="300.0" y="517.0" font-size="10.6" font-weight="700" fill="#6B7280" text-anchor="middle">yếu / nhiễu → weak break (không G1)</text>
<rect x="530.0" y="492.0" width="300.0" height="40.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="680.0" y="517.0" font-size="10.6" font-weight="700" fill="#6D28D9" text-anchor="middle">DISPLACEMENT đạt ngưỡng → MSS G1</text>
<line x1="680.0" y1="532.0" x2="680.0" y2="552.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="530.0" y="554.0" width="300.0" height="40.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="680.0" y="579.0" font-size="10.4" font-weight="700" fill="#1D4ED8" text-anchor="middle">giữ được? cấu trúc mới? (G2 → G3, muộn)</text>
<line x1="620.0" y1="594.0" x2="520.0" y2="618.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="740.0" y1="594.0" x2="800.0" y2="618.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="380.0" y="620.0" width="240.0" height="40.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="500.0" y="645.0" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="middle">FAILED / EXPIRED</text>
<rect x="700.0" y="620.0" width="220.0" height="40.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="810.0" y="645.0" font-size="11" font-weight="800" fill="#6D28D9" text-anchor="middle">MSS (lớp ℓ, khung τ)</text>
<line x1="810.0" y1="660.0" x2="688.0" y2="682.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="640.0" y="684.0" width="100.0" height="34.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="690.0" y="706.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">tiếp diễn HTF</text>
<line x1="810.0" y1="660.0" x2="796.0" y2="682.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="748.0" y="684.0" width="100.0" height="34.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="798.0" y="706.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">hồi / retrace</text>
<line x1="810.0" y1="660.0" x2="904.0" y2="682.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="856.0" y="684.0" width="100.0" height="34.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="906.0" y="706.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">đảo chiều</text>
<text x="800.0" y="736.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="middle">→ kết cục là giả thuyết; đo so với baseline</text>
<rect x="30.0" y="100.0" width="270.0" height="300.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
<text x="42.0" y="122.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Bối cảnh (lọc từ trên xuống)</text>
<text x="42.0" y="139.0" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="start">D1 = CONTEXT</text>
<text x="42.0" y="155.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">bias, dealing range, DOL HTF,</text>
<text x="42.0" y="171.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">external liquidity, protected D1</text>
<text x="42.0" y="187.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="42.0" y="203.0" font-size="10.2" font-weight="700" fill="#6D28D9" text-anchor="start">H1 = SETUP</text>
<text x="42.0" y="219.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">cấu trúc trung gian, POI,</text>
<text x="42.0" y="235.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">liquidity được 'engineer'</text>
<text x="42.0" y="251.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="42.0" y="267.0" font-size="10.2" font-weight="700" fill="#15803D" text-anchor="start">M5 = EXECUTION</text>
<text x="42.0" y="283.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">sweep · MSS · displacement ·</text>
<text x="42.0" y="299.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">FVG · entry · stop · target</text>
<rect x="690.0" y="100.0" width="264.0" height="300.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="702.0" y="122.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Điều MSS KHÔNG nói</text>
<text x="702.0" y="139.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• ai mua / ai bán / vì sao</text>
<text x="702.0" y="155.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• giá sẽ tới DOL</text>
<text x="702.0" y="171.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• cấu trúc khung trên đã đổi</text>
<text x="702.0" y="187.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• MSS này có 'edge'</text>
<text x="702.0" y="203.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="702.0" y="219.0" font-size="10.2" font-weight="700" fill="#15803D" text-anchor="start">Điều MSS nói:</text>
<text x="702.0" y="235.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• một close đã vượt một mức</text>
<text x="702.0" y="251.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">  đã biết trước, ngược trạng</text>
<text x="702.0" y="267.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">  thái của một lớp đã khai báo</text>
<text x="702.0" y="283.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• (G1+) với một mức displacement</text>
<text x="702.0" y="299.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">  đo được</text>
<rect x="26.0" y="776.0" width="928.0" height="40.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="42.0" y="801.0" font-size="10.4" font-weight="700" fill="#6D28D9" text-anchor="start">Một câu: MSS = sự kiện kế toán cấu trúc (chắc chắn, theo định nghĩa) + một giả thuyết dự báo (chưa chắc, phải đo so với baseline cùng khoảng cách).</text>
</svg>