<text x="680.0" y="115.3" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">① Bearish CISD</text>
<text x="680.0" y="137.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến #11 đóng dưới open #6. Chặng tăng #6–#9 đã</text>
<text x="680.0" y="153.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bị lấy lại tính theo giá đóng cửa.</text>
<rect x="668.0" y="176.4" width="304.0" height="77.4" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="680.0" y="200.7" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">② Thất bại MỀM</text>
<text x="680.0" y="222.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến #12 đóng lại TRÊN mức CISD. Lời “chặng tăng</text>
<text x="680.0" y="238.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đã bị lấy lại” không còn đúng.</text>
<rect x="668.0" y="261.7" width="304.0" height="77.4" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="680.0" y="286.1" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">③ Thất bại CỨNG</text>
<text x="680.0" y="307.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá vượt đỉnh cú quét. Cú quét BSL hóa ra là bứt</text>
<text x="680.0" y="323.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">phá thật; chặng tăng tiếp diễn.</text>
<rect x="668.0" y="347.1" width="304.0" height="77.4" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="680.0" y="371.4" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Bài học đối xứng</text>
<text x="680.0" y="393.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mọi điều đúng với bullish CISD đều đúng (lật ngược)</text>
<text x="680.0" y="409.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">với bearish CISD. Chỉ có hướng là khác.</text>
