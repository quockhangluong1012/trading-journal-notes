<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bearish CISD thất bại: đóng lại trên mức, rồi phá đỉnh cú quét</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đối xứng với hình 16. Thất bại mềm = đóng lại trên mức CISD. Thất bại cứng = giá vượt đỉnh của cú quét: chặng tăng cũ tiếp diễn.</text>
