<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Swing 'ứng viên' vs swing 'đã xác nhận' — và cái bẫy chọn lại swing sau khi biết kết quả</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một swing low fractal n=2 chỉ được BIẾT khi đã có 2 nến bên phải đóng cao hơn. Trước đó nó chỉ là ứng viên.</text>
<rect x="26.0" y="84.0" width="470.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">A · Độ trễ xác nhận (không thể tránh)</text>
<line x1="60.0" y1="168.0" x2="60.0" y2="276.0" stroke="#4B5563" stroke-width="1.4"/>
<rect x="51.0" y="175.2" width="18.0" height="93.6" rx="1" fill="#B91C1C" stroke="#B91C1C" stroke-width="1.2"/>
<line x1="118.0" y1="196.8" x2="118.0" y2="304.8" stroke="#4B5563" stroke-width="1.4"/>
