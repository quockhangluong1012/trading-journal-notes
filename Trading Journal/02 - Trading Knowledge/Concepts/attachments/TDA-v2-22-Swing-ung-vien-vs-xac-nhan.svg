<line x1="176.0" y1="222.0" x2="176.0" y2="333.6" stroke="#4B5563" stroke-width="1.4"/>
<rect x="167.0" y="229.2" width="18.0" height="97.2" rx="1" fill="#B91C1C" stroke="#B91C1C" stroke-width="1.2"/>
<line x1="234.0" y1="247.2" x2="234.0" y2="369.6" stroke="#4B5563" stroke-width="1.4"/>
<rect x="225.0" y="254.4" width="18.0" height="108.0" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<line x1="292.0" y1="232.8" x2="292.0" y2="348.0" stroke="#4B5563" stroke-width="1.4"/>
<rect x="283.0" y="240.0" width="18.0" height="100.8" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<line x1="350.0" y1="211.2" x2="350.0" y2="312.0" stroke="#4B5563" stroke-width="1.4"/>
<rect x="341.0" y="218.4" width="18.0" height="86.4" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<line x1="408.0" y1="182.4" x2="408.0" y2="283.2" stroke="#4B5563" stroke-width="1.4"/>
<rect x="399.0" y="189.6" width="18.0" height="86.4" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<circle cx="234.0" cy="381.6" r="6" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="234.0" y="403.6" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">nến t: đáy thấp nhất</text>
<line x1="234.0" y1="150.0" x2="234.0" y2="330.0" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="234.0" y="144.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">t: ỨNG VIÊN</text>
<line x1="350.0" y1="150.0" x2="350.0" y2="330.0" stroke="#15803D" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="354.0" y="144.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">t+2: XÁC NHẬN</text>
<text x="44.0" y="446.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Tại t và t+1, mọi kết luận dựa trên swing này là dùng thông tin</text>
<text x="44.0" y="461.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">chưa có. Backtest phải mô phỏng đúng độ trễ này.</text>
<rect x="504.0" y="84.0" width="470.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="108.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">B · Chọn lại swing sau khi biết giá đi đâu</text>
<rect x="518.0" y="118.0" width="442.0" height="230.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="518.0,187.0 584.3,244.5 615.2,221.5 672.7,279.0 716.9,251.4 761.1,290.5 805.3,260.6 871.6,210.0 937.9,152.5" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="672.7" cy="279.0" r="4" fill="#4B5563" stroke="white" stroke-width="1.2"/>
<circle cx="761.1" cy="290.5" r="4" fill="#B91C1C" stroke="white" stroke-width="1.2"/>
<line x1="526.8" y1="279.0" x2="849.5" y2="279.0" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="530.8" y="295.0" font-size="9.8" font-weight="400" fill="#4B5563" text-anchor="start">swing đã đánh dấu LÚC ĐÓ</text>
<line x1="739.0" y1="290.5" x2="960.0" y2="290.5" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="956.0" y="306.5" font-size="9.8" font-weight="400" fill="#B91C1C" text-anchor="end">swing 'đẹp hơn' chọn SAU KHI biết</text>
<text x="518.0" y="372.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="372.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Sau khi giá tăng, 'đáy thật' dễ được chọn lại thành đáy thấp</text>
<text x="531.0" y="387.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">hơn → stop/zone 'hoàn hảo' trên giấy</text>
<text x="518.0" y="406.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="406.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hậu quả: backtest đẹp hơn live; bias 'luôn đúng' khi review</text>
<text x="518.0" y="424.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="424.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Chống: ghi mốc + giờ trước sự kiện (screenshot có timestamp),</text>
<text x="531.0" y="440.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">không sửa log cũ</text>
<rect x="26.0" y="498.0" width="948.0" height="86.0" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="42.0" y="522.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Quy tắc real-time:</text>
<text x="42.0" y="544.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chỉ dùng swing ĐÃ XÁC NHẬN cho kết luận cấu trúc; swing ứng viên chỉ được ghi 'đang theo dõi'.</text>
<text x="42.0" y="564.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Mọi mốc dùng cho gate (pool, mốc MSS, protected level) phải có thời điểm đánh dấu SỚM HƠN sự kiện dùng nó.</text>
</svg>
