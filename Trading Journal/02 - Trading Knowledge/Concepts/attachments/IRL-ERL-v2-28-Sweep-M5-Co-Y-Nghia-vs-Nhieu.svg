<svg viewBox="0 0 1000 593" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="591" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="928.7" y="22" width="43.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="950.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">M5</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cùng một cú sweep trên M5 — lúc là tín hiệu, lúc chỉ là nhiễu</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">M5 lúc nào cũng có đỉnh/đáy bị quét. Cú quét chỉ đáng quan tâm khi nó xảy ra ĐÚNG CHỖ (POI khung lớn), ĐÚNG HƯỚNG (cùng DOL), ĐÚNG GIỜ (killzone).</text>
<rect x="28.0" y="87.0" width="466.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="109.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Có ý nghĩa</text>
<rect x="52.0" y="256.6" width="418.0" height="61.8" rx="0" fill="#FEF3C7" stroke="none" stroke-width="1.2"/>
<text x="56.0" y="268.6" font-size="9.5" font-weight="700" fill="#D97706" text-anchor="start">trong POI H1/D1 (discount)</text>
<path d="M52.0,194.8 L102.2,219.5 L135.6,211.3 L185.8,248.4 L219.2,236.0 L252.6,264.8 L269.4,256.6 L302.8,285.4 L319.5,271.0 L336.2,248.4 L353.0,256.6 L369.7,219.5 L386.4,227.8 L419.8,194.8 L470.0,166.0" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="252.6" y1="264.8" x2="336.2" y2="264.8" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="3,3"/>
<line x1="302.8" y1="285.4" x2="332.8" y2="299.4" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="335.8" y="303.4" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start" data-maxw="120.0">sweep đáy M5</text>
<text x="46.0" y="369.0" font-size="11.8" font-weight="600" fill="#059669" text-anchor="start">✓ D1 bias tăng, DOL = ERL D1 phía trên</text>
<text x="46.0" y="391.0" font-size="11.8" font-weight="600" fill="#059669" text-anchor="start">✓ Giá đang ở IRL D1 (FVG discount)</text>
<text x="46.0" y="413.0" font-size="11.8" font-weight="600" fill="#059669" text-anchor="start">✓ Sweep lấy SSL nội bộ H1</text>
<text x="46.0" y="435.0" font-size="11.8" font-weight="600" fill="#059669" text-anchor="start">✓ Trong killzone; MSS + displacement sau đó</text>
<text x="46.0" y="457.0" font-size="11.8" font-weight="600" fill="#059669" text-anchor="start">✓ Còn khoảng trống tới T1 đủ R:R</text>
<rect x="506.0" y="87.0" width="466.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="520.0" y="109.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">Chỉ là nhiễu</text>
<rect x="530.0" y="153.6" width="418.0" height="164.8" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<text x="534.0" y="165.6" font-size="9.5" font-weight="700" fill="#475569" text-anchor="start">giữa range H1, không có POI</text>
<path d="M530.0,194.8 L580.2,219.5 L613.6,211.3 L663.8,248.4 L697.2,236.0 L730.6,264.8 L747.4,256.6 L780.8,285.4 L797.5,271.0 L814.2,256.6 L831.0,264.8 L847.7,248.4 L864.4,273.1 L881.1,252.5 L914.6,264.8 L948.0,248.4" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="730.6" y1="264.8" x2="814.2" y2="264.8" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="3,3"/>
<line x1="780.8" y1="285.4" x2="810.8" y2="299.4" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="813.8" y="303.4" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start" data-maxw="120.0">sweep đáy M5</text>
<text x="524.0" y="369.0" font-size="11.8" font-weight="600" fill="#DC2626" text-anchor="start">✗ Không có POI khung lớn</text>
<text x="524.0" y="391.0" font-size="11.8" font-weight="600" fill="#DC2626" text-anchor="start">✗ Giữa range H1, ngay EQ</text>
<text x="524.0" y="413.0" font-size="11.8" font-weight="600" fill="#DC2626" text-anchor="start">✗ Không có displacement sau sweep</text>
<text x="524.0" y="435.0" font-size="11.8" font-weight="600" fill="#DC2626" text-anchor="start">✗ Ngoài killzone, thanh khoản mỏng</text>
<text x="524.0" y="457.0" font-size="11.8" font-weight="600" fill="#DC2626" text-anchor="start">✗ DOL không rõ ⇒ không biết đi đâu</text>
<rect x="28.0" y="521.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="545.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">M5 sweep KHÔNG cần là ERL của bất kỳ range nào. Nó chỉ cần là một sự kiện liquidity nhỏ xảy ra bên trong một vùng mà D1/H1 đã đánh dấu từ trước. Ý nghĩa</text>
<text x="42.0" y="561.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đến từ VỊ TRÍ, không đến từ bản thân cú quét.</text>
</svg>
