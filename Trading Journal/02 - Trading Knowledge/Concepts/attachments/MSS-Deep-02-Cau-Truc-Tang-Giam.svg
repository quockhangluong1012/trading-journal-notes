<text x="790.0" y="367.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">LL</text>
<circle cx="830.0" cy="289.6" r="4.5" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="830.0" y="279.6" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">LH</text>
<circle cx="902.0" cy="415.0" r="4.5" fill="#DC2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="902.0" y="433.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">LL</text>
<circle cx="830.0" cy="289.6" r="11" fill="none" stroke="#7C3AED" stroke-width="2.2"/>
<line x1="820.0" y1="289.6" x2="926.0" y2="289.6" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="736.0" y="112.0" width="206.0" height="74.0" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="746.0" y="130.0" font-size="9.8" font-weight="700" fill="#6D28D9" text-anchor="start">Protected high (vòng tím)</text>
<text x="746.0" y="144.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">= gốc của leg đã tạo LL cuối.</text>
<text x="746.0" y="158.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Close trên đường tím → cấu trúc</text>
<text x="746.0" y="172.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">giảm (lớp này) mất hiệu lực.</text>
<rect x="26.0" y="496.0" width="928.0" height="52.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="517.0" font-size="10.6" font-weight="600" fill="#334155" text-anchor="start">Định nghĩa Dow (1922) — được ICT/SMC kế thừa: xu hướng tăng = chuỗi HH + HL; xu hướng giảm = chuỗi LH + LL. [MARKET MECHANICS/TA cổ điển]</text>
<text x="42.0" y="534.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Điều KHÔNG có trong hình: ai mua, ai bán, vì sao. Nhãn chỉ mô tả thứ tự các cực trị theo một thuật toán đã chọn.</text>
</svg>