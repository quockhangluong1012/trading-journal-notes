<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cấu trúc tăng và cấu trúc giảm — HH/HL, LH/LL và điểm vô hiệu</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Market structure = QUAN HỆ THỨ TỰ giữa các swing đã xác nhận, không phải bản thân các đỉnh/đáy. Cùng chuỗi giá, đổi thuật toán swing → đổi nhãn.</text>
<rect x="26.0" y="84.0" width="454.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="104.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">Cấu trúc TĂNG (bullish)</text>
<path d="M60.0,428.2 L108.0,329.2 L148.0,388.6 L212.0,276.4 L252.0,335.8 L316.0,217.0 L356.0,276.4 L428.0,151.0" stroke="#111827" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
