<line x1="346.0" y1="276.4" x2="452.0" y2="276.4" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="256.0" y="400.0" width="210.0" height="74.0" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="266.0" y="418.0" font-size="9.8" font-weight="700" fill="#6D28D9" text-anchor="start">Protected low (vòng tím)</text>
<text x="266.0" y="432.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">= gốc của leg đã tạo HH cuối.</text>
<text x="266.0" y="446.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Close dưới đường tím → cấu trúc</text>
<text x="266.0" y="460.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">tăng (lớp này) mất hiệu lực.</text>
<text x="252.0" y="367.8" font-size="9.3" font-weight="400" fill="#6B7280" text-anchor="middle">HL cũ → 'reference sâu'</text>
<rect x="500.0" y="84.0" width="454.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="512.0" y="104.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Cấu trúc GIẢM (bearish)</text>
<path d="M534.0,137.8 L582.0,236.8 L622.0,177.4 L686.0,289.6 L726.0,230.2 L790.0,349.0 L830.0,289.6 L902.0,415.0" stroke="#111827" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
