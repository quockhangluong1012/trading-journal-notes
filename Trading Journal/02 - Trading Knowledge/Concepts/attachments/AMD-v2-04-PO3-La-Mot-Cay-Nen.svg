<text x="44.0" y="540.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mở cửa → đi ngang quanh Open (A) → chạy XUỐNG dưới Open, tạo Low (M)</text>
<text x="44.0" y="556.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">→ đảo lên, chạy xa, đóng gần High (D).</text>
