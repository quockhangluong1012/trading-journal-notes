<text x="587.8" y="476.4" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="start">Low</text>
<text x="567.8" y="514.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="middle">nến bạn thấy</text>
