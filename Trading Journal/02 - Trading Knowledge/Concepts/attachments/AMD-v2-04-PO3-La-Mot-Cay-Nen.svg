<circle cx="756.8" cy="214.0" r="5.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<line x1="756.8" y1="214.0" x2="778.8" y2="184.3" stroke="#EA580C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="778.8" y="188.0" font-size="10.5" font-weight="600" fill="#EA580C" text-anchor="start">High của ngày</text>
<text x="778.8" y="201.7" font-size="10.5" font-weight="600" fill="#EA580C" text-anchor="start">thường nằm ở pha M</text>
<text x="906.4" y="458.4" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="end">Close gần Low</text>
<text x="626.4" y="514.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="start">đường đi bên trong nến (khung nhỏ hơn)</text>
<text x="526.0" y="540.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mở cửa → đi ngang quanh Open (A) → chạy LÊN trên Open, tạo High (M) →</text>
<text x="526.0" y="556.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đảo xuống, chạy xa, đóng gần Low (D).</text>
<rect x="28.0" y="578.0" width="944.0" height="48.6" rx="8" fill="#EEF0FF" stroke="#4338CA" stroke-width="1"/>
<text x="38.0" y="600.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">[QUAN SÁT] Nhiều nến ngày có một râu dài ở phía ngược với thân — đó là hình dạng PO3 mô tả. [ICT] Gọi phần râu đó là dấu vết của Manipulation. [BACKTEST</text>
<text x="38.0" y="616.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">REQUIRED] Không phải ngày nào cũng có hình này; có ngày mở cửa là chạy luôn, có ngày đi ngang cả ngày.</text>
