<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Power of 3 = câu chuyện bên trong MỘT cây nến</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">ICT nhìn mỗi nến (ngày, tuần, phiên) qua 4 mốc: Open – Low – High – Close. Bên trái là nến bạn thấy; bên phải là đường đi bên trong nó</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">NẾU ngày đó đúng kịch bản PO3.</text>
<rect x="847.3" y="22.0" width="124.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="909.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ICT FRAMEWORK</text>
