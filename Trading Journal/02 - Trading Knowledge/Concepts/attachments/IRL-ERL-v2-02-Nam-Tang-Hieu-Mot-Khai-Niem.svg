<svg viewBox="0 0 1000 445" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="1" y="1" width="998" height="443" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="864.1" y="22" width="107.9" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="918.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">PHƯƠNG PHÁP</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Năm tầng hiểu một khái niệm — áp cho ERL và IRL</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi khái niệm trong note đi qua đúng 5 tầng, từ đời thường tới chart. Nếu bạn kẹt ở tầng nào, quay lại tầng trước nó.</text>
<rect x="98.0" y="87.0" width="168.4" height="30.0" rx="8" fill="#16A34A" stroke="none" stroke-width="1.2"/>
<text x="182.2" y="107.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 · Ví dụ đời thường</text>
<line x1="267.4" y1="102.0" x2="273.4" y2="102.0" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah94A3B8)"/>
<rect x="274.4" y="87.0" width="168.4" height="30.0" rx="8" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="358.6" y="107.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 · Trực giác</text>
<line x1="443.8" y1="102.0" x2="449.8" y2="102.0" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah94A3B8)"/>
<rect x="450.8" y="87.0" width="168.4" height="30.0" rx="8" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="535.0" y="107.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3 · Định nghĩa ICT</text>
<line x1="620.2" y1="102.0" x2="626.2" y2="102.0" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah94A3B8)"/>
<rect x="627.2" y="87.0" width="168.4" height="30.0" rx="8" fill="#2563EB" stroke="none" stroke-width="1.2"/>
<text x="711.4" y="107.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 · Cơ chế thị trường</text>
<line x1="796.6" y1="102.0" x2="802.6" y2="102.0" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah94A3B8)"/>
<rect x="803.6" y="87.0" width="168.4" height="30.0" rx="8" fill="#EA580C" stroke="none" stroke-width="1.2"/>
<text x="887.8" y="107.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5 · Đọc trên chart</text>
<rect x="28.0" y="127.0" width="64.0" height="112.0" rx="8" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="60.0" y="189.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">ERL</text>
<rect x="98.0" y="127.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="108.0" y="149.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Đống đồ chơi nằm ngay</text>
<text x="108.0" y="165.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">bên kia hàng rào.</text>
<rect x="274.4" y="127.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="284.4" y="149.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Chỗ rất nhiều người cùng</text>
<text x="284.4" y="165.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">nghĩ: “nếu giá vượt đỉnh</text>
<text x="284.4" y="181.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">này thì tôi sẽ…”.</text>
<rect x="450.8" y="127.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="460.8" y="149.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Liquidity nằm ngoài biên</text>
<text x="460.8" y="165.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">trên/dưới của dealing</text>
<text x="460.8" y="181.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">range đang tham chiếu.</text>
<rect x="627.2" y="127.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="637.2" y="149.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Stop-loss của người bán</text>
<text x="637.2" y="165.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">khống + lệnh</text>
<text x="637.2" y="181.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">mua-khi-phá-đỉnh = lệnh</text>
<text x="637.2" y="197.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">MUA chờ trên đỉnh; chúng</text>
<text x="637.2" y="214.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">khớp khi giá chạm tới.</text>
<rect x="803.6" y="127.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="813.6" y="149.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Kẻ đường ở đỉnh/đáy</text>
<text x="813.6" y="165.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">range; đánh dấu EQH,</text>
<text x="813.6" y="181.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">PDH… nằm ngoài biên; ghi</text>
<text x="813.6" y="197.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">rõ đã bị lấy hay chưa.</text>
<rect x="28.0" y="249.0" width="64.0" height="112.0" rx="8" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="60.0" y="311.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">IRL</text>
<rect x="98.0" y="249.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="108.0" y="271.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Đồ chơi và cái hố cát nằm</text>
<text x="108.0" y="287.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">bên trong vườn.</text>
<rect x="274.4" y="249.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="284.4" y="271.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Những chỗ giá có thể</text>
<text x="284.4" y="287.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">dừng chân hoặc quay lại</text>
<text x="284.4" y="303.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">trên đường đi.</text>
<rect x="450.8" y="249.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="460.8" y="271.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Liquidity bên trong range:</text>
<text x="460.8" y="287.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">đỉnh/đáy ngắn hạn trong</text>
<text x="460.8" y="303.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">một nhịp giá, hoặc một</text>
<text x="460.8" y="319.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">imbalance (FVG) trong</text>
<text x="460.8" y="336.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">cùng vùng đó.</text>
<rect x="627.2" y="249.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="637.2" y="271.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Quanh đỉnh/đáy nhỏ có</text>
<text x="637.2" y="287.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">thể có stop; vùng FVG là</text>
<text x="637.2" y="303.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">chỗ giá từng chạy một</text>
<text x="637.2" y="319.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">chiều rất nhanh, ít giao</text>
<text x="637.2" y="336.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">dịch hai chiều.</text>
<rect x="803.6" y="249.0" width="168.4" height="112.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="813.6" y="271.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">Đánh dấu đỉnh/đáy nội bộ</text>
<text x="813.6" y="287.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">đáng kể và FVG chưa lấp</text>
<text x="813.6" y="303.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="148.4">nằm giữa hai biên range.</text>
<rect x="28.0" y="373.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="397.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Quy tắc của note: KHÔNG dùng một thuật ngữ trước khi nó đã được giải thích ở tầng 1–2. Tầng 3 (ICT) và tầng 4 (cơ chế) luôn được tách riêng, vì chúng là hai loại</text>
<text x="42.0" y="413.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">sự thật khác nhau.</text>
</svg>
