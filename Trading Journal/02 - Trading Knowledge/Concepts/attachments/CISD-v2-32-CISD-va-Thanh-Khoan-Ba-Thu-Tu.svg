<text x="678.0" y="502.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chỉ là nhịp hồi. Giá quay lại quét SSL rồi mới có</text>
<text x="678.0" y="518.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">CISD #2 “đúng chỗ”.</text>
