<text x="359.0" y="502.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">stop bị kích hoạt có thể ĐẨY giá đi tiếp chứ</text>
<text x="359.0" y="518.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">không đảo chiều. Sweep một mình không phải tín</text>
