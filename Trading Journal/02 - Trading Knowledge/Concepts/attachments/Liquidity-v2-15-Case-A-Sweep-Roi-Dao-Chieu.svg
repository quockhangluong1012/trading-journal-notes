<text x="238.0" y="422.4" font-size="10" fill="#1D4ED8" font-weight="600" text-anchor="start">swing low nội bộ M5</text>
<rect x="356.0" y="252.9" width="110.0" height="35.2" rx="2" fill="#10B981" fill-opacity="0.25"/>
