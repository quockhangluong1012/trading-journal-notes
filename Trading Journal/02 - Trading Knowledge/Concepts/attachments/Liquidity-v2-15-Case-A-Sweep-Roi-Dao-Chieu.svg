<rect x="638.0" y="74.0" width="278.0" height="440.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="650.0" y="96.0" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">Ghi nhận theo thời gian</text>
<rect x="648.0" y="116.0" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<text x="655.0" y="133.0" font-size="11" fill="#6B7280" font-weight="700" text-anchor="start">T0–T1 · Nhận định ban đầu</text>
<text x="655.0" y="149.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">PDH là ứng viên BSL; giá đang tiến tới.</text>
<text x="655.0" y="163.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Chưa có sự kiện. Không hành động.</text>
<rect x="648.0" y="178.3" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.2"/>
<text x="655.0" y="195.3" font-size="11" fill="#C2410C" font-weight="700" text-anchor="start">T2–T3 · Đã xác nhận</text>
<text x="655.0" y="212.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">T2: close trên L (PENDING). T3: close &lt; L−δ</text>
<text x="655.0" y="226.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">trong k nến → SWEEP (E3). known_at = T3.</text>
<rect x="648.0" y="240.6" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="655.0" y="257.6" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">T4 · Thêm thông tin</text>
<text x="655.0" y="274.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Close dưới swing low nội bộ + thân lớn</text>
<text x="655.0" y="288.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">→ REVERSAL CONF. (DEF-LS-06).</text>
<rect x="648.0" y="302.9" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="655.0" y="319.9" font-size="11" fill="#B45309" font-weight="700" text-anchor="start">Chưa xác nhận</text>
<text x="655.0" y="336.8" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Giá có tới SSL đối diện không; có quay</text>
<text x="655.0" y="350.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">lại lấy cực trị sweep không.</text>
<rect x="648.0" y="365.1" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="655.0" y="382.1" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Hủy giả thuyết giảm khi</text>
<text x="655.0" y="399.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">2 close liên tiếp &gt; L (acceptance) hoặc</text>
<text x="655.0" y="413.0" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">close vượt cực trị sweep.</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Điểm mấu chốt: tại T2 (wick đang chạy) không ai biết đây là sweep. Nhãn chỉ có ở T3. &quot;Đảo chiều&quot; chỉ là giả thuyết ở T4 và</text>
<text x="40.0" y="559.5" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">chỉ được kiểm chứng ở T5 — nhưng T5 không được dùng để quyết định ở T2–T4. Ghi cả các lần T3 xảy ra mà T5 thất bại.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-15-Case-A-Sweep-Roi-Dao-Chieu · Nến minh họa, giá giả định. T0…T5 = thứ tự thông tin xuất hiện; chỉ T5 là thông tin hậu kiểm (ex-post).</text>
