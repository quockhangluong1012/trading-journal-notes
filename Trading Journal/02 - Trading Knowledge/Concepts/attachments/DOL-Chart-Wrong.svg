<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="420" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1F2937">Ví dụ sai — bán đuổi khi "phá đáy" = làm đối ứng cho SM</text>
<text x="24" y="52" font-size="11.5" fill="#6B7280">Minh họa khái niệm · tưởng phá đáy là trend giảm nên short, ngay sau đó giá đảo lên</text>
<rect x="24" y="66" width="712" height="330" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
<line x1="44" y1="280" x2="716" y2="280" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="48" y="274" font-size="9.5" fill="#6B7280">đáy cũ (SSL) — cụm stop dày</text>
<path d="M60,180 L100,215 L140,250 L175,285 L200,305 L214,292 L232,255 L255,220 L285,180 L320,150 L360,130 L400,120" fill="none" stroke="#374151" stroke-width="2.2"/>
<circle cx="200" cy="305" r="6" fill="#B91C1C"/>
<text x="150" y="335" font-size="10" font-weight="700" fill="#B91C1C">✗ short đuổi ở đây (dưới đáy)</text>
<path d="M206,312 L236,328 M236,328 L228,326 M236,328 L233,320" stroke="#B91C1C" stroke-width="1.6" fill="none"/>
<text x="330" y="200" font-size="10" font-weight="700" fill="#15803D">giá đảo lên ngay — SM đã mua vào</text>
<text x="330" y="216" font-size="9.5" fill="#374151">chính từ lệnh bán của bạn</text>
<circle cx="200" cy="305" r="11" fill="none" stroke="#B91C1C" stroke-width="1.3" stroke-dasharray="3 2"/>
<rect x="44" y="352" width="672" height="36" rx="6" fill="#FEF9C3"/>
<text x="52" y="368" font-size="10" font-weight="700" fill="#92400E">Bài học: phá đỉnh/đáy thường là hành động GOM đối ứng, không phải tín hiệu đi thẳng.</text>
<text x="52" y="382" font-size="9.5" fill="#78350F">Chờ rejection + MSS trước khi kết luận hướng — đừng đứng cùng phía đám đông tại đáy hiển nhiên.</text>
</svg>