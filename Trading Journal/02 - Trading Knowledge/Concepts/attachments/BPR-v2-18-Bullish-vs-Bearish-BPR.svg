<text x="28.0" y="600.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">“Đứng được” cần một quy tắc chấp nhận cụ thể (ví dụ quy tắc đóng nến + giữ vài nến của bạn). Một cây bóng nến chọc qua mép xa chưa đủ để gọi là vô hiệu.</text>
