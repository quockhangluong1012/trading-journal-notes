<text x="605.2" y="510.0" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="585.2" y="321.4" font-size="10" font-weight="700" fill="#15803D" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">dưới đáy cú chạm</text>
<text x="585.2" y="366.1" font-size="10" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">dưới mép xa Breaker</text>
<text x="585.2" y="501.2" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">dưới đáy mới (đáy quét)</text>
<text x="463.4" y="313.9" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">BREAKER</text>
<rect x="642.0" y="92.5" width="330.0" height="503.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Ba câu hỏi, ba mức</text>
<circle cx="666.0" cy="140.5" r="10.0" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="144.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="684.0" y="144.5" font-size="12.3" font-weight="700" fill="#15803D">SETUP sai</text>
<text x="684.0" y="160.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Giá xuống dưới đáy của cú chạm (trên M5: dưới</text>
<text x="684.0" y="177.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">đáy vừa quét). Chuỗi vào lệnh đã hỏng. Gần</text>
<text x="684.0" y="193.6" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">nhất → mất ít nhất khi sai, nhưng dễ bị nhiễu</text>
<text x="684.0" y="210.1" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">quét.</text>
<circle cx="666.0" cy="230.6" r="10.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="234.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="684.0" y="234.6" font-size="12.3" font-weight="700" fill="#B45309">VÙNG sai</text>
<text x="684.0" y="250.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Thân nến đóng dưới mép xa của Breaker và ở</text>
<text x="684.0" y="267.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">lại. Breaker này thất bại — ý tưởng tăng thì chưa</text>
<text x="684.0" y="283.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">chắc.</text>
<circle cx="666.0" cy="304.2" r="10.0" fill="#B91C1C" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="308.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="684.0" y="308.2" font-size="12.3" font-weight="700" fill="#B91C1C">Ý TƯỞNG sai</text>
<text x="684.0" y="324.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Giá xuống dưới đáy mới. Cả câu chuyện “đáy đã</text>
<text x="684.0" y="341.0" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">bị quét rồi đảo chiều” không còn. Xa nhất → khó</text>
<text x="684.0" y="357.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">bị quét, nhưng mất nhiều nhất khi sai.</text>
<rect x="656.0" y="383.9" width="302.0" height="100.5" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="383.9" width="4.0" height="100.5" rx="2" fill="#B45309"/>
<text x="670.0" y="403.6" font-size="11.4" font-weight="700" fill="#B45309" data-bx="656.0,958.0">Lưu ý về nguồn</text>
<text x="670.0" y="422.8" font-size="11.4" font-weight="400" fill="#111827" data-bx="656.0,958.0">ICT không nêu nơi đặt stop trong bài giảng</text>
<text x="670.0" y="439.0" font-size="11.4" font-weight="400" fill="#111827" data-bx="656.0,958.0">Breaker. Ba mức trên là khung làm việc của note;</text>
<text x="670.0" y="455.2" font-size="11.4" font-weight="400" fill="#111827" data-bx="656.0,958.0">chọn mức nào phải được quyết định TRƯỚC khi</text>
<text x="670.0" y="471.3" font-size="11.4" font-weight="400" fill="#111827" data-bx="656.0,958.0">vào lệnh và ghi vào nhật ký.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Quy ước “đóng cửa và ở lại”: một cái râu qua mép xa là cú quét, chưa phải vô hiệu. Vô hiệu khi thân nến đóng qua và vài nến sau vẫn nằm bên kia.</text>
