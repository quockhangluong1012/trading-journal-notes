<text x="648.0" y="177.0" font-size="12" fill="#C2410C" font-weight="700" text-anchor="start">L₄</text>
<text x="167.5" y="343.4" font-size="10.5" fill="#15803D" font-weight="700" text-anchor="end">E4: 2 close liên tiếp &gt; L₁</text>
<text x="278.5" y="301.2" font-size="10.5" fill="#15803D" font-weight="700" text-anchor="end">E4 tại L₂ → nhãn RUN (known_at)</text>
<text x="408.0" y="235.2" font-size="10.5" fill="#15803D" font-weight="700" text-anchor="end">E4 tại L₃ — RUN ACTIVE</text>
<text x="545.5" y="134.3" font-size="10.5" fill="#B91C1C" font-weight="700" text-anchor="middle">L₄: xuyên rồi close lại dưới</text>
<text x="545.5" y="148.3" font-size="10.5" fill="#B91C1C" font-weight="700" text-anchor="middle">→ sweep tại mức cuối = RUN ENDED</text>
<text x="247.5" y="380.8" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="middle">hồi &lt; 50% leg</text>
<text x="358.5" y="336.8" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="middle">hồi &lt; 50% leg</text>
<rect x="680.0" y="74.0" width="236.0" height="440.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="692.0" y="98.0" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">Điều kiện RUN (lên)</text>
<text x="692.0" y="113.6" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">1. ≥ 2 mức BSL ex-ante cùng phía</text>
<text x="692.0" y="129.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">2. Mỗi mức: acceptance trước</text>
<text x="692.0" y="144.9" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">   khi mức kế bị xuyên</text>
<text x="692.0" y="160.5" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">3. Nhịp hồi giữa hai lần lấy</text>
<text x="692.0" y="176.1" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">   &lt; 50% leg trước [HEURISTIC]</text>
<text x="692.0" y="191.7" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">4. Không có sự kiện cấu trúc</text>
<text x="692.0" y="207.3" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">   ngược chiều ở khung run</text>
<text x="692.0" y="223.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start"></text>
<text x="692.0" y="238.6" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">RUN kết thúc khi (DEF-LS-07)</text>
<text x="692.0" y="254.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• rejection ở mức kế (một sweep)</text>
<text x="692.0" y="269.8" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• MSS ngược ở khung run</text>
<text x="692.0" y="285.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">• hết phiên / cửa sổ khai báo</text>
<text x="692.0" y="301.1" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start"></text>
<text x="692.0" y="316.7" font-size="12.5" fill="#B91C1C" font-weight="700" text-anchor="start">Hệ quả thực hành</text>
<text x="692.0" y="332.3" font-size="11" fill="#B91C1C" font-weight="normal" text-anchor="start">Trong RUN ACTIVE: không tìm</text>
<text x="692.0" y="347.9" font-size="11" fill="#B91C1C" font-weight="normal" text-anchor="start">reversal ở từng mức nhỏ</text>
<text x="692.0" y="363.5" font-size="11" fill="#B91C1C" font-weight="normal" text-anchor="start">(RULE-LS-005).</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.3" fill="#1F2937" font-weight="normal" text-anchor="start">Sweep và Run khác nhau ở CÁCH PHÂN XỬ (rejection vs acceptance) và SỐ MỨC — không phải ở cảm giác &quot;mạnh hay yếu&quot;.</text>
<text x="40.0" y="561.0" font-size="11.3" fill="#1F2937" font-weight="normal" text-anchor="start">Một sweep có thể bị vô hiệu thành run (S1); một run có thể kết thúc bằng một sweep (S3).</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-13 · Nến minh họa. L₁…L₄ là các swing high cũ đã có trong danh sách trước phiên.</text>
