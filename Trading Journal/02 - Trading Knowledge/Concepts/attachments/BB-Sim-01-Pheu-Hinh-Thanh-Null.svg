<text x="38.0" y="493.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Trên dữ liệu ngẫu nhiên, mẫu hình Breaker vẫn xuất hiện nhiều lần mỗi ngày và gần như luôn được retest rất nhanh (vì vùng nằm sát ngay dưới giá đóng phá H1). Vậy:</text>
<text x="38.0" y="509.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">“thấy Breaker” và “thấy giá quay lại vùng” KHÔNG phải bằng chứng của bất kỳ điều gì. [SIMULATION]</text>
