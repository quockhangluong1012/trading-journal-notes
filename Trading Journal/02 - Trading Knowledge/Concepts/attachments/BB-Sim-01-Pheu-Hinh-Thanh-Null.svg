<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mô phỏng null (random walk): Breaker xuất hiện thường xuyên trên dữ liệu KHÔNG có ai đặt lệnh</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">400.000 nến giả lập từ bước ngẫu nhiên thuần túy. Áp dụng đúng định nghĩa BB-DEF v0.1 (bullish). Không có tổ chức, không có thanh khoản thật.</text>
