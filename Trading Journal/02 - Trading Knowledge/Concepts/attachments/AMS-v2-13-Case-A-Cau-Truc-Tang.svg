<text x="40.0" y="536.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Đọc: LTL ở đáy lớn. Sau đó ITL thứ nhất CAO HƠN LTL, ITL thứ hai cao hơn ITL thứ nhất. ITH thứ hai cao hơn ITH thứ nhất → cấp trung hạn đang tăng.</text>
<text x="40.0" y="551.7" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Chưa có LTH: trong lúc giá còn lập đỉnh mới thì chưa đỉnh nào "có hàng xóm thấp hơn bên phải" ở cấp trung hạn.</text>
