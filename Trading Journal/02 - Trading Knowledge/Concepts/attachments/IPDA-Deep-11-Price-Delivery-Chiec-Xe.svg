<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">"Price delivery" — hình ảnh chiếc xe đi qua các trạm (và giới hạn của hình ảnh đó)</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">ICT không chỉ nhìn "nến tăng/giảm" mà hỏi: giá đang được đưa TỪ đâu TỚI đâu? Đây là từ vựng của framework, không phải vật thể trong thị trường.</text>
<rect x="26.0" y="74.0" width="928.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="98.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Tầng 1 — Chiếc xe</text>
