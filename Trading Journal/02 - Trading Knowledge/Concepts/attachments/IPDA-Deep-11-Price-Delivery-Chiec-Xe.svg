<text x="70.0" y="206.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">xuất phát</text>
<circle cx="360.0" cy="170.0" r="15" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="360.0" y="175.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="360.0" y="146.0" font-size="12" font-weight="600" fill="#0F766E" text-anchor="middle">trạm xăng</text>
<circle cx="620.0" cy="170.0" r="15" fill="#B45309" stroke="none" stroke-width="1.2"/>
<text x="620.0" y="175.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="620.0" y="146.0" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">bến đông khách</text>
<circle cx="900.0" cy="130.0" r="15" fill="#334155" stroke="none" stroke-width="1.2"/>
<text x="900.0" y="135.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text>
<text x="900.0" y="106.0" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">điểm kế tiếp</text>
<rect x="96.0" y="216.0" width="30.0" height="16.0" rx="3" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1"/>
<text x="500.0" y="262.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">"Hành trình" = quá trình chiếc xe đi A → B → C → D theo thời gian.</text>
<rect x="26.0" y="286.0" width="600.0" height="340.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="310.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Tầng 2 — Cùng ý tưởng trên chart (ví dụ minh họa)</text>
<rect x="124.0" y="510.2" width="250.0" height="54.6" rx="0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1" opacity="0.7"/>
