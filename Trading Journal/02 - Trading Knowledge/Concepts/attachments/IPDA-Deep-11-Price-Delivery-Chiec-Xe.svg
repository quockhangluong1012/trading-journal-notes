<line x1="520.0" y1="356.8" x2="520.0" y2="419.2" stroke="#15803D" stroke-width="1.3"/>
<rect x="512.0" y="364.6" width="16.0" height="46.8" rx="1" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
<text x="384.0" y="542.8" font-size="11.5" font-weight="700" fill="#0F766E" text-anchor="start">← B: FVG (internal liquidity)</text>
<line x1="60.0" y1="398.4" x2="560.0" y2="398.4" stroke="#B45309" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="64.0" y="392.4" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="start">C: đỉnh cũ, hình thành trước đó (external liquidity — BSL)</text>
<circle cx="56.0" cy="575.2" r="9" fill="#334155" stroke="none" stroke-width="1.2"/>
<text x="56.0" y="579.2" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="40.0" y="616.0" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">ICT đọc: A → rebalance FVG (B) → lấy BSL (C) → đi tìm D.</text>
<rect x="640.0" y="286.0" width="314.0" height="340.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
<text x="654.0" y="310.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">Giới hạn của ẩn dụ</text>
<text x="654.0" y="327.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="654.0" y="344.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Chiếc xe có tài xế và điểm đến.</text>
<text x="654.0" y="361.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  Giá KHÔNG có tài xế nào nhìn</text>
<text x="654.0" y="378.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  thấy được.</text>
<text x="654.0" y="395.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="654.0" y="412.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Bản đồ hành trình A→B→C được</text>
<text x="654.0" y="429.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  VẼ SAU khi giá đã đi. Lúc giá</text>
<text x="654.0" y="446.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  đang ở A, ta chỉ có một danh</text>
<text x="654.0" y="464.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  sách điểm đến CÓ THỂ.</text>
<text x="654.0" y="481.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="654.0" y="498.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• "Delivery" mô tả ĐƯỜNG ĐI đã</text>
<text x="654.0" y="515.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  xảy ra; không chứng minh có</text>
<text x="654.0" y="532.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  "người giao hàng".</text>
<text x="654.0" y="549.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="654.0" y="566.6" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">→ Price delivery target là một</text>
<text x="654.0" y="583.8" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">   HYPOTHESIS, không phải lời</text>
<text x="654.0" y="600.9" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">   tiên tri.</text>
