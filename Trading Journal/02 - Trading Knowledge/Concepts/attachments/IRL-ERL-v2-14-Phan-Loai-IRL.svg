<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Phân loại Internal Range Liquidity — bốn thứ thường bị gọi chung là “IRL”</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không phải mọi thứ bên trong range đều cùng một loại. Hai loại đầu là POOL lệnh chờ (có thể có stop), loại 3 là IMBALANCE, loại 4 là vùng THAM CHIẾU.</text>
<rect x="28.0" y="87.0" width="466.0" height="228.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="97.0" width="4.0" height="208.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
