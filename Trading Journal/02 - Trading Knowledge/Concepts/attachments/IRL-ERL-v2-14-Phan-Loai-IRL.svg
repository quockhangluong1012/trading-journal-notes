<text x="248.0" y="143.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Đỉnh nhỏ giữa hai biên. Stop của người</text>
<text x="248.0" y="159.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">bán khống nhịp ngắn nằm trên nó. Nhỏ,</text>
<text x="248.0" y="176.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">nhiều, phần lớn là nhiễu nếu không chọn</text>
<text x="248.0" y="192.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">lọc.</text>
