<text x="726.0" y="383.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Vùng tham chiếu để chờ phản ứng (ICT</text>
<text x="726.0" y="399.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Core Content: order block bên trong</text>
<text x="726.0" y="416.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">range). Là nơi giá CÓ THỂ phản ứng,</text>
<text x="726.0" y="432.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">không phải pool lệnh chờ theo nghĩa</text>
<text x="726.0" y="449.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">hẹp.</text>
<rect x="884.9" y="338.5" width="75.1" height="17.5" rx="8.75" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.1"/>
<text x="922.4" y="351.0" font-size="9.5" font-weight="700" fill="#4F46E5" text-anchor="middle">THAM CHIẾU</text>
<rect x="28.0" y="567.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="591.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hệ quả: khi ai đó nói “giá về lấy IRL”, hãy hỏi lại: IRL loại nào? Về lấy STOP dưới một đáy nhỏ (loại 2) là sự kiện liquidity. Về chạm một FVG (loại 3) là sự kiện</text>
<text x="42.0" y="607.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">rebalance. Hai việc khác nhau, bằng chứng khác nhau.</text>
