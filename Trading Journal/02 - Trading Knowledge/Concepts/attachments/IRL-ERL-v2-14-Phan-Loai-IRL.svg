<text x="726.0" y="143.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Đúng định nghĩa ICT (2022 Ep.3):</text>
<text x="726.0" y="159.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">“short-term higher low with stops below</text>
<text x="726.0" y="176.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">it”. Đích tự nhiên của một nhịp hồi trong</text>
<text x="726.0" y="192.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">xu hướng tăng.</text>
