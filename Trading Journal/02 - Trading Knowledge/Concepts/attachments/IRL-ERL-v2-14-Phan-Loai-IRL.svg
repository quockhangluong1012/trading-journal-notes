<text x="248.0" y="383.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Vùng giá chạy một chiều quá nhanh. ICT</text>
<text x="248.0" y="399.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">xếp vào IRL (“an imbalance in that same</text>
<text x="248.0" y="416.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">range”). KHÔNG phải cụm stop; giá có</text>
<text x="248.0" y="432.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">thể quay lại hoặc không.</text>
