<text x="655.0" y="131.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Chặng xuống quét SSL. Kẻ mức CISD.</text>
<rect x="646.0" y="149.7" width="326.0" height="52.7" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="655.0" y="169.9" font-size="11.8" font-weight="700" fill="#D97706" text-anchor="start">T1 · CISD (#11)</text>
<text x="655.0" y="190.5" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng trên mức. Delivery đổi sang lên.</text>
<rect x="646.0" y="208.4" width="326.0" height="52.7" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="655.0" y="228.6" font-size="11.8" font-weight="700" fill="#EA580C" text-anchor="start">T2 · (#12)</text>
<text x="655.0" y="249.2" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng dưới mức (106.1 &lt; 106.6) → thất bại mềm ngay.</text>
<rect x="646.0" y="267.1" width="326.0" height="67.8" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="655.0" y="287.3" font-size="11.8" font-weight="700" fill="#6B7280" text-anchor="start">T3 · (#13–#14)</text>
<text x="655.0" y="307.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng lại trên mức, chạm sát swing high nhưng không đóng</text>
<text x="655.0" y="323.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">vượt.</text>
<rect x="646.0" y="340.9" width="326.0" height="52.7" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="655.0" y="361.1" font-size="11.8" font-weight="700" fill="#DC2626" text-anchor="start">T4 · (#15–#16)</text>
<text x="655.0" y="381.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Trôi xuống, lấp FVG. Không MSS.</text>
<rect x="646.0" y="399.6" width="326.0" height="82.9" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="655.0" y="419.8" font-size="11.8" font-weight="700" fill="#059669" text-anchor="start">Kết luận được gì?</text>
<text x="655.0" y="440.4" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Delivery có thể đổi qua lại quanh mức mà cấu trúc không</text>
<text x="655.0" y="455.6" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">đổi. Với khung yêu cầu MSS: không có lệnh — và đó là quyết</text>
<text x="655.0" y="470.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">định ĐÚNG.</text>
