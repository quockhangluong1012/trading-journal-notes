<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Delivery đổi (bullish CISD ở #11), nhưng giá không bao giờ đóng vượt swing high #5. Sau đó giá đi ngang rồi trôi xuống.</text>
