<text x="38.0" y="416.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Việc đầu tiên sau external BOS là vẽ lại bản đồ, không phải tìm điểm vào</tspan></text>
<text x="38.0" y="435.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Range mới đo từ protected low MỚI (đáy đã tạo ra cú phá) tới đỉnh mới. Đo &quot;rẻ / đắt&quot; trên bản đồ cũ là đo bằng một tấm bản đồ đã hết hạn. Xem note 37 và 12.</tspan></text>
