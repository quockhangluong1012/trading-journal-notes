<title>Sau một external BOS: phải vẽ lại bản đồ (dealing range, premium / discount)</title>
<desc>Sau một external BOS: phải vẽ lại bản đồ (dealing range, premium / discount). Cùng một mức giá, trước BOS nằm ở vùng &quot;đắt&quot; (premium) của range cũ; sau BOS có thể nằm ở vùng &quot;rẻ&quot; (discount) của range mới — vì bản đồ đã đổi.</desc>
