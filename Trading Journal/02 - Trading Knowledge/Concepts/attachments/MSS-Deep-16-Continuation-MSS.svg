<text x="612.0" y="514.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Đây là cấu hình 'MSS thuận HTF' trong ICT 2022.</text>
<text x="612.0" y="529.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Ngược lại: M5 bearish MSS ở đây = M5 reversal</text>
<text x="612.0" y="545.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">nhưng KHÔNG phải H1 reversal (P-L H1 còn).</text>
