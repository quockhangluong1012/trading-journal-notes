<svg viewBox="0 0 980 730" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="730" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mô hình tư duy cuối cùng — vòng lặp nghiên cứu cho mỗi Order Block</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Không phải 'thấy OB → vào lệnh'. Mỗi OB là một quan sát → một giả thuyết → một quyết định có quy tắc → một điểm dữ liệu.</text>
<rect x="372.0" y="122.0" width="236.0" height="80.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="490.0" y="146.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">1 QUAN SÁT</text>
<text x="490.0" y="166.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">cú mở rộng nào? bắt đầu ở đâu?</text>
<text x="490.0" y="181.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">phá swing nào, cấp nào?</text>
<rect x="624.1" y="189.4" width="236.0" height="80.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="742.1" y="213.4" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle">2 PHÂN LOẠI</text>
<text x="742.1" y="233.4" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">đạt OB-DEF? t_avail lúc nào?</text>
<text x="742.1" y="248.4" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">ghi đặc trưng — chưa lọc</text>
<rect x="728.5" y="352.0" width="236.0" height="80.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="846.5" y="376.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">3 BỐI CẢNH</text>
<text x="846.5" y="396.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">D1 bias, dealing range, DOL;</text>
<text x="846.5" y="411.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">OB nằm trên đường hay chặn đường?</text>
<rect x="624.1" y="514.6" width="236.0" height="80.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
<text x="742.1" y="538.6" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">4 GIẢ THUYẾT</text>
<text x="742.1" y="558.6" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">nếu giá quay lại, VÌ SAO có thể</text>
<text x="742.1" y="573.6" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">phản ứng? (A–G) — viết ra</text>
<rect x="372.0" y="582.0" width="236.0" height="80.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="490.0" y="606.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">5 KẾ HOẠCH</text>
<text x="490.0" y="626.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">entry/stop/target/invalidation</text>
<text x="490.0" y="641.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">viết TRƯỚC khi giá chạm</text>
<rect x="119.9" y="514.6" width="236.0" height="80.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="237.9" y="538.6" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">6 BẰNG CHỨNG</text>
<text x="237.9" y="558.6" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">tại vùng: sweep → MSS → displ.</text>
<text x="237.9" y="573.6" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">LTF? nếu không → không lệnh</text>
<rect x="15.5" y="352.0" width="236.0" height="80.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="133.5" y="376.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">7 HÀNH ĐỘNG</text>
<text x="133.5" y="396.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">trade / wait / ignore —</text>
<text x="133.5" y="411.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">theo quy tắc, không theo 'đẹp'</text>
<rect x="119.9" y="189.4" width="236.0" height="80.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
<text x="237.9" y="213.4" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">8 GHI &amp; ĐO</text>
<text x="237.9" y="233.4" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">kết cục, MFE/MAE, scenario;</text>
<text x="237.9" y="248.4" font-size="9.6" font-weight="400" fill="#374151" text-anchor="middle">so với baseline C1/C5</text>
<line x1="580.8" y1="186.3" x2="651.3" y2="205.1" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="779.7" y1="287.9" x2="808.9" y2="333.5" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="808.9" y1="450.5" x2="779.7" y2="496.1" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="651.3" y1="578.9" x2="580.8" y2="597.7" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="399.2" y1="597.7" x2="328.7" y2="578.9" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="200.3" y1="496.1" x2="171.1" y2="450.5" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="171.1" y1="333.5" x2="200.3" y2="287.9" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<line x1="328.7" y1="205.1" x2="399.2" y2="186.3" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<rect x="330.0" y="340.0" width="320.0" height="104.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="490.0" y="368.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle">OB = địa chỉ gốc của một cú</text>
<text x="490.0" y="386.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle">mất cân bằng ĐO ĐƯỢC.</text>
<text x="490.0" y="408.0" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">Nó là nơi để LẮNG NGHE,</text>
<text x="490.0" y="424.0" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">không phải lý do để bóp cò.</text>
<text x="26.0" y="716.0" font-size="10.4" font-weight="700" fill="#B91C1C" text-anchor="start">9 CẬP NHẬT: sau ≥ N mẫu theo cùng định nghĩa, đổi quy tắc bằng version mới (OLD → NEW → lý do → kỳ vọng → BACKTEST REQUIRED), không sửa âm thầm.</text>
</svg>