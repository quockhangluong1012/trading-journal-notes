<svg viewBox="0 0 1000 680" width="1000" height="680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m1F2937" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="0" y="0" width="1000" height="680" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Khung xử lý xung đột timeframe — bốn câu hỏi, sáu hành động</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không dùng 'khung lớn luôn đúng' hay 'khung nhỏ luôn sai'. Hướng từ trên, thời điểm từ dưới, veto từ bất kỳ đâu, vị trí làm trọng tài.</text>
<rect x="26.0" y="92.0" width="420.0" height="92.0" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<circle cx="56.0" cy="138.0" r="18" fill="#1D4ED8" stroke="none" stroke-width="1"/>
<text x="56.0" y="143.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q1</text>
<text x="86.0" y="126.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Mỗi khung đang mô tả cấu trúc CẤP NÀO?</text>
<text x="86.0" y="164.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Gắn L1–L5 cho swing mà mỗi khung đang dựa vào</text>
<line x1="446.0" y1="138.0" x2="474.0" y2="138.0" stroke="#1F2937" stroke-width="1.5" marker-end="url(#m1F2937)"/>
<rect x="26.0" y="196.0" width="420.0" height="92.0" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<circle cx="56.0" cy="242.0" r="18" fill="#1D4ED8" stroke="none" stroke-width="1"/>
<text x="56.0" y="247.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q2</text>
<text x="86.0" y="230.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Chuyển động ngược hướng đang ở ĐÂU so với vùng</text>
<text x="86.0" y="246.6" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">được phép?</text>
<text x="86.0" y="268.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">trước zone · trong zone · xuyên zone có acceptance</text>
<line x1="446.0" y1="242.0" x2="474.0" y2="242.0" stroke="#1F2937" stroke-width="1.5" marker-end="url(#m1F2937)"/>
<rect x="26.0" y="300.0" width="420.0" height="92.0" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<circle cx="56.0" cy="346.0" r="18" fill="#1D4ED8" stroke="none" stroke-width="1"/>
<text x="56.0" y="351.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q3</text>
<text x="86.0" y="334.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Nó đã PHÁ swing cấp nào, bằng gì?</text>
<text x="86.0" y="372.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">wick / thân nến · có displacement · có giữ</text>
<text x="86.0" y="386.9" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">(acceptance)</text>
<line x1="446.0" y1="346.0" x2="474.0" y2="346.0" stroke="#1F2937" stroke-width="1.5" marker-end="url(#m1F2937)"/>
<rect x="26.0" y="404.0" width="420.0" height="92.0" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<circle cx="56.0" cy="450.0" r="18" fill="#1D4ED8" stroke="none" stroke-width="1"/>
<text x="56.0" y="455.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q4</text>
<text x="86.0" y="438.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Mâu thuẫn đã kéo dài quá HẠN DÙNG chưa?</text>
<text x="86.0" y="476.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">quá horizon DOL / TTL của setup → hết hạn ≠ sai</text>
<line x1="446.0" y1="450.0" x2="474.0" y2="450.0" stroke="#1F2937" stroke-width="1.5" marker-end="url(#m1F2937)"/>
<rect x="486.0" y="92.0" width="488.0" height="66.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.3"/>
<text x="500.0" y="114.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">KEEP · WAIT</text>
<text x="500.0" y="133.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Khác biệt cấp độ; ngược hướng nằm trước zone; chỉ phá ≤ L2</text>
<rect x="486.0" y="164.0" width="488.0" height="66.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="500.0" y="186.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">MONITOR</text>
<text x="500.0" y="205.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá đã vào zone; chờ bằng chứng theo hướng tầng trên</text>
<rect x="486.0" y="236.0" width="488.0" height="66.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="500.0" y="258.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">DEGRADE</text>
<text x="500.0" y="277.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Phá L3 / POI bị xuyên tới CE: giữ hướng, giảm size, đòi thêm điều kiện</text>
<rect x="486.0" y="308.0" width="488.0" height="66.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="500.0" y="330.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">REASSESS</text>
<text x="500.0" y="349.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">≥ 3 chẩn đoán 'đổi cấu trúc' hoặc mâu thuẫn kéo dài quá TTL: đánh giá</text>
<text x="500.0" y="363.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">lại tầng trên</text>
<rect x="486.0" y="380.0" width="488.0" height="66.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/>
<text x="500.0" y="402.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">SUSPEND · ABANDON</text>
<text x="500.0" y="421.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Thân nến xuyên protected L4 / acceptance dưới distal: dừng mọi entry</text>
<text x="500.0" y="435.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">mới, bỏ kế hoạch</text>
<rect x="486.0" y="452.0" width="488.0" height="66.0" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.3"/>
<text x="500.0" y="474.0" font-size="12.5" font-weight="700" fill="#4B5563" text-anchor="start">NEUTRAL</text>
<text x="500.0" y="493.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Không còn giả thuyết đủ cơ sở ở cả hai phía: đứng ngoài, ghi trigger làm</text>
<text x="500.0" y="507.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">rõ</text>
<rect x="26.0" y="532.0" width="948.0" height="124.0" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="42.0" y="556.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Ba luật kèm theo</text>
<text x="42.0" y="578.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="578.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">NGÂN SÁCH XUNG ĐỘT: tối đa một xung đột chưa giải quyết khi vào lệnh (và giảm size); hai xung đột → không trade (theo 01c §18.1)</text>
<text x="42.0" y="598.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="598.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">COUNTERTREND không phải 'giải quyết xung đột' — nó là một mô hình khác, cần spec riêng, thống kê riêng, size nhỏ hơn</text>
<text x="42.0" y="619.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="619.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ghi lại xung đột NHƯ MỘT BIẾN trong log (loại, cấp, kết cục) — để đo xem loại nào thật sự có giá trị thông tin</text>
</svg>
