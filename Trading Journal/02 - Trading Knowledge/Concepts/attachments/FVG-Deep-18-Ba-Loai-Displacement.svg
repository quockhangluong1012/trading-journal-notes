<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Số liệu dưới đây là TOY MODEL với tham số minh họa — để hiểu cơ chế, không phải để ước lượng thị trường thật.</text>
