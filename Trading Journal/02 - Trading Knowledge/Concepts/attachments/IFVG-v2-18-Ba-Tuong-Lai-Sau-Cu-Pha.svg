<text x="46.0" y="607.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">Chỉ A mới tạo cơ hội giao dịch ở IFVG. B là lý do phải có điểm vô hiệu rõ ràng. C là lý do không 'đuổi theo' khi đã lỡ. Xác suất của A, B, C trên thị</text>
<text x="46.0" y="624.5" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">trường của bạn là bao nhiêu? → BACKTEST REQUIRED.</text>
