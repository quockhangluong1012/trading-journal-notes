<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">FVG không phải Liquidity, không phải OB, không phải POI, không phải tín hiệu vào lệnh</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Tám khái niệm hay bị gộp làm một. Mỗi cái trả lời một câu hỏi khác và có bằng chứng quan sát khác.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Một FVG có thể ĐÓNG vai trò của vài cái (vd: làm location trong một POI) — nhưng không LÀ chúng.</text>
<rect x="30.0" y="104.0" width="920.0" height="30.0" rx="6" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="44.0" y="124.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Khái niệm</text>
<text x="210.0" y="124.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Mô tả cái gì</text>
<text x="460.0" y="124.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Trả lời câu hỏi</text>
<text x="690.0" y="124.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Bằng chứng quan sát được</text>
<rect x="30.0" y="144.0" width="920.0" height="46.0" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
<text x="44.0" y="172.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">FVG</text>
<text x="210.0" y="172.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">hình học 3 nến: vùng chỉ nến 2 đi qua</text>
<text x="460.0" y="172.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">leg này có để lại vùng ít thời gian?</text>
<text x="690.0" y="172.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Low₃ &gt; High₁ (bull) tại close nến 3</text>
<rect x="30.0" y="196.0" width="920.0" height="46.0" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<text x="44.0" y="224.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">Liquidity</text>
<text x="210.0" y="224.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">nơi CÓ THỂ có cụm lệnh (stop/limit)</text>
<text x="460.0" y="224.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">giá có thể tìm đối ứng ở đâu?</text>
<text x="690.0" y="224.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">không trực tiếp — suy ra từ mức nổi bật</text>
<rect x="30.0" y="248.0" width="920.0" height="46.0" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
<text x="44.0" y="276.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">Displacement</text>
<text x="210.0" y="276.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">chuyển động nhanh, lớn, một chiều</text>
<text x="460.0" y="276.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">có dòng lệnh mạnh vừa xảy ra?</text>
<text x="690.0" y="276.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">range/body nến so với ATR, số nến liên tiếp</text>
<rect x="30.0" y="300.0" width="920.0" height="46.0" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="44.0" y="328.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="start">Order Block</text>
<text x="210.0" y="328.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">nến/vùng gốc của displacement</text>
<text x="460.0" y="328.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">cú đẩy xuất phát từ đâu?</text>
<text x="690.0" y="328.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">nến ngược màu cuối trước displacement</text>
<rect x="30.0" y="352.0" width="920.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
<text x="44.0" y="380.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">POI</text>
<text x="210.0" y="380.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">vùng đáng chú ý theo context HTF</text>
<text x="460.0" y="380.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">chờ giá ở đâu?</text>
<text x="690.0" y="380.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">là quyết định của người phân tích</text>
<rect x="30.0" y="404.0" width="920.0" height="46.0" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.1"/>
<text x="44.0" y="432.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Confirmation</text>
<text x="210.0" y="432.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">bằng chứng phản ứng đã xảy ra</text>
<text x="460.0" y="432.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">phản ứng có hậu quả cấu trúc?</text>
<text x="690.0" y="432.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">MSS + displacement sau khi tới POI</text>
<rect x="30.0" y="456.0" width="920.0" height="46.0" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="44.0" y="484.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">Entry trigger</text>
<text x="210.0" y="484.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">điều kiện bấm nút cụ thể</text>
<text x="460.0" y="484.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">khi nào vào, ở giá nào?</text>
<text x="690.0" y="484.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">limit chạm / M5 MSS trong FVG</text>
<rect x="30.0" y="508.0" width="920.0" height="46.0" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
<text x="44.0" y="536.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">Invalidation</text>
<text x="210.0" y="536.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">điều kiện bác bỏ ý tưởng</text>
<text x="460.0" y="536.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">khi nào tôi sai?</text>
<text x="690.0" y="536.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">close ngoài distal / swing bị phá</text>
<text x="30.0" y="582.0" font-size="10.3" font-weight="600" fill="#B91C1C" text-anchor="start">Lỗi phổ biến nhất: gộp FVG = POI = Entry. Kết quả: vào lệnh ở MỌI FVG chạm tới — chính là chiến lược 'FVG alone' (Model A), mà trên random walk không hơn vùng đối chứng (excess ≈ 0).</text>
</svg>