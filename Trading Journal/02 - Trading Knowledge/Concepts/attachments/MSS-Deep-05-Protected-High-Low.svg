<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Protected high / low — 'chưa bị phá' KHÁC 'được bảo vệ'</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Protection là thuộc tính của một LUẬN ĐIỂM cấu trúc (chuỗi BOS), không phải của mức giá. Hỏi: 'nếu mức này bị phá, chuỗi BOS nào mất hiệu lực?'</text>
<rect x="26.0" y="84.0" width="560.0" height="420.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="104.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">A. Ba đáy chưa bị phá — chỉ một đáy là protected</text>
<path d="M46.0,452.0 L98.0,338.0 L134.4,391.2 L202.0,277.2 L243.6,338.0 L332.0,178.4 L373.6,239.2 L420.4,208.8 L462.0,254.4 L503.6,224.0" stroke="#111827" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="134.4" cy="391.2" r="5.5" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
<text x="134.4" y="413.2" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">HL cũ → reference sâu</text>
<circle cx="243.6" cy="338.0" r="5.5" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="243.6" y="360.0" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">P-L: gốc leg tạo HH cuối</text>
<circle cx="462.0" cy="254.4" r="5.5" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="462.0" y="304.4" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">HL mới, CHƯA có BOS sau nó</text>
<circle cx="243.6" cy="338.0" r="11" fill="none" stroke="#7C3AED" stroke-width="2.2"/>
<line x1="243.6" y1="338.0" x2="566.0" y2="338.0" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="332.0" cy="178.4" r="5.5" fill="#16A34A" stroke="#ffffff" stroke-width="1.5"/>
<text x="332.0" y="166.4" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">HH (BOS)</text>
<line x1="191.6" y1="277.2" x2="566.0" y2="277.2" stroke="#16A34A" stroke-width="1.1" stroke-dasharray="3 4"/>
<text x="191.6" y="272.2" font-size="9.5" font-weight="600" fill="#15803D" text-anchor="start">đỉnh bị BOS phá</text>
<rect x="330.0" y="400.0" width="240.0" height="92.0" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
<text x="340.0" y="418.0" font-size="9.7" font-weight="700" fill="#334155" text-anchor="start">Kiểm tra cứng:</text>
<text x="340.0" y="432.0" font-size="9.7" font-weight="400" fill="#374151" text-anchor="start">• Phá HL mới → chưa chuỗi BOS nào mất</text>
<text x="340.0" y="446.0" font-size="9.7" font-weight="400" fill="#374151" text-anchor="start">  (nó chỉ là ứng viên).</text>
<text x="340.0" y="460.0" font-size="9.7" font-weight="400" fill="#374151" text-anchor="start">• Phá P-L → chuỗi HH/HL lớp này mất hiệu lực.</text>
<text x="340.0" y="474.0" font-size="9.7" font-weight="400" fill="#374151" text-anchor="start">• Phá HL cũ → đã bị vượt từ trước.</text>
<rect x="600.0" y="84.0" width="354.0" height="420.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="612.0" y="104.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">B. Vòng đời của một protected low</text>
<rect x="620.0" y="120.0" width="160.0" height="46.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/>
<text x="700.0" y="139.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Swing low đã xác nhận</text>
<text x="700.0" y="155.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">known_at = i + n</text>
<rect x="620.0" y="205.0" width="160.0" height="58.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="700.0" y="224.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">PROTECTED (P-L)</text>
<text x="700.0" y="240.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">sau khi một BOS tăng</text>
<text x="700.0" y="253.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">xuất phát từ nó</text>
<rect x="620.0" y="320.0" width="160.0" height="46.0" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="700.0" y="339.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">Reference sâu</text>
<text x="700.0" y="355.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">BOS mới cao hơn → P-L dời lên</text>
<rect x="790.0" y="320.0" width="150.0" height="58.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="865.0" y="339.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">CONSUMED</text>
<text x="865.0" y="355.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">close xuyên qua</text>
<text x="865.0" y="368.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">= MSS ở lớp này</text>
<rect x="620.0" y="420.0" width="160.0" height="46.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="700.0" y="439.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Không còn hiện hành</text>
<text x="700.0" y="455.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">khi đổi khung phán quyết</text>
<line x1="700.0" y1="166.0" x2="700.0" y2="203.0" stroke="#6D28D9" stroke-width="1.6" marker-end="url(#aP)"/>
<line x1="690.0" y1="263.0" x2="690.0" y2="318.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<line x1="760.0" y1="250.0" x2="850.0" y2="318.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="640.0" y="296.0" font-size="9.4" font-weight="600" fill="#334155" text-anchor="middle">supersession</text>
<text x="842.0" y="280.0" font-size="9.4" font-weight="600" fill="#B91C1C" text-anchor="start">consumption</text>
<line x1="640.0" y1="263.0" x2="640.0" y2="418.0" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#aO)"/>
<text x="645.0" y="400.0" font-size="9.2" font-weight="600" fill="#B45309" text-anchor="start">đổi luận điểm</text>
<rect x="26.0" y="516.0" width="928.0" height="70.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="537.0" font-size="10.2" font-weight="600" fill="#334155" text-anchor="start">Định nghĩa vận hành (DEF-MSS-03, kế thừa 57 §15.1): P-L = đáy thấp nhất giữa đỉnh bị phá và nến phá của BOS tăng gần nhất (gốc của leg phá). P-H đối xứng.</text>
<text x="42.0" y="554.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">MSS lớp protected = close vượt P-H (khi cấu trúc giảm) hoặc dưới P-L (khi cấu trúc tăng). Mọi 'đáy gần nhất' khác chỉ là internal. [ICT/SMC FRAMEWORK + định nghĩa vận hành]</text>
</svg>