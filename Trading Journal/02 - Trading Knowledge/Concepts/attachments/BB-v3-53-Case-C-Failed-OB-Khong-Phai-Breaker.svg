<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Case C — Order Block thất bại nhưng KHÔNG phải Breaker</text>
<rect x="882.1" y="23.0" width="89.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="927.1" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CASE DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Một bearish OB nằm giữa nhịp giảm bị giá đóng cửa xuyên qua. Trông giống “vùng kháng cự bị phá”, nhưng thiếu trình tự swing của Breaker.</text>
