<text x="208.6" y="268.0" font-size="10.5" font-weight="700" fill="#6B7280" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">bearish OB giữa nhịp</text>
