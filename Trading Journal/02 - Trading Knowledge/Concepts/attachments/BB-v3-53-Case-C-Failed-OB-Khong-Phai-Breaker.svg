<rect x="642.0" y="92.5" width="330.0" height="519.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Bối cảnh và diễn biến</text>
<text x="656.0" y="142.5" font-size="11.8" font-weight="700" fill="#2563EB">OB gốc</text>
<text x="656.0" y="158.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Nến tăng nhỏ GIỮA một nhịp giảm — không nằm tại</text>
<text x="656.0" y="174.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">đỉnh của nhịp.</text>
<text x="656.0" y="198.1" font-size="11.8" font-weight="700" fill="#2563EB">① OB thất bại</text>
<text x="656.0" y="214.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá hồi lên và đóng cửa trên OB. Theo nghĩa rộng:</text>
<text x="656.0" y="230.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Failed Order Block.</text>
<text x="656.0" y="253.8" font-size="11.8" font-weight="700" fill="#2563EB">Cấu trúc</text>
<text x="656.0" y="269.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Đỉnh gốc của nhịp giảm chưa bị phá. Chuỗi đỉnh thấp</text>
<text x="656.0" y="286.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">hơn còn nguyên. Không có MSS.</text>
<text x="656.0" y="309.4" font-size="11.8" font-weight="700" fill="#2563EB">② Sau đó</text>
<text x="656.0" y="325.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá quay xuống qua vùng OB cũ như không có gì ở</text>
<text x="656.0" y="341.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">đó.</text>
<rect x="656.0" y="493.0" width="302.0" height="101.9" rx="8" fill="#6B7280" fill-opacity="0.07" stroke="#6B7280" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="493.0" width="4.0" height="101.9" rx="2" fill="#6B7280"/>
<text x="670.0" y="512.9" font-size="11.6" font-weight="700" fill="#6B7280" data-bx="656.0,958.0">Điều thật sự kết luận được</text>
<text x="670.0" y="532.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Không phải mọi vùng bị đóng xuyên đều đổi vai.</text>
<text x="670.0" y="548.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Ở đây chỉ nói được: OB này vô hiệu. Không có cơ</text>
<text x="670.0" y="565.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">sở để gọi vùng là Bullish Breaker hay kỳ vọng nó</text>
<text x="670.0" y="581.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">đỡ giá.</text>
