<text x="580.7" y="131.1" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">'hòn đảo'</text>
<rect x="28.0" y="492.0" width="944.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="44.0" y="514.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cùng một hình dạng 'nến nhảy lên' có thể là bất kỳ loại nào. Thứ phân biệt là: trước đó có vùng tích lũy không, nhịp đã chạy bao xa, và giá làm gì SAU gap. Bulkowski</text>
<text x="44.0" y="529.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ghi rõ: khi nhận diện chắc chắn được thì nhịp giá đã đi gần hết.</text>
