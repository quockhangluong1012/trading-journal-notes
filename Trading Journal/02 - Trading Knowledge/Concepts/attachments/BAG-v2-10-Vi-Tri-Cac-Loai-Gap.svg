<text x="136.9" y="455.4" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">common gap</text>
<text x="136.9" y="470.4" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">trong range, lấp ngay</text>
<text x="320.5" y="405.2" font-size="11.5" font-weight="700" fill="#0F9D74" text-anchor="middle">breakaway gap</text>
<text x="320.5" y="420.2" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">rời range</text>
<text x="409.2" y="336.1" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">runaway gap</text>
<text x="409.2" y="351.1" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">giữa nhịp chạy</text>
<text x="479.8" y="158.1" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="middle">exhaustion gap</text>
<text x="479.8" y="173.1" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">cuối nhịp dài</text>
<text x="701.7" y="174.8" font-size="11.5" font-weight="700" fill="#E0464B" text-anchor="middle">gap ngược chiều</text>
<text x="701.7" y="189.8" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">→ island reversal</text>
