<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sơ đồ dựng (minh họa). Tên gọi chỉ rõ ràng khi nhìn lại cả chuỗi. Lúc gap mới xuất hiện, chưa ai biết nó sẽ thành loại nào.</text>
