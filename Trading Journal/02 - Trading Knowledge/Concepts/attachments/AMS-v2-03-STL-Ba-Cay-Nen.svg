<svg viewBox="0 0 1000 470" width="1000" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="468" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Short-Term Low (STL) ở cấp cây nến — đủ và chưa đủ</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Luật gốc: một cây nến có đáy thấp nhất, cây bên trái và cây bên phải đều có đáy CAO HƠN.</text>
<rect x="925.4" y="22.0" width="46.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="948.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STL</text>
<rect x="28.0" y="84.0" width="226.0" height="370.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="106.0" font-size="11.5" font-weight="700" fill="#059669" text-anchor="start">① ĐỦ điều kiện</text>
