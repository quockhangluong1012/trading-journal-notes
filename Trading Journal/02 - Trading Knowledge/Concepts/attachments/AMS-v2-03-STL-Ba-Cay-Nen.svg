<rect x="427.3" y="214.1" width="22.0" height="29.7" rx="2" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="280.0" y1="288.3" x2="478.0" y2="288.3" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="379.0" y="303.3" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="middle">đáy</text>
<text x="278.0" y="372.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nến phải còn đang chạy.</text>
<text x="278.0" y="387.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nó vẫn có thể rơi thấp hơn.</text>
<text x="278.0" y="403.4" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Gọi là: STL ứng viên.</text>
<rect x="504.0" y="84.0" width="226.0" height="370.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="516.0" y="106.0" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start">③ KHÔNG đủ — hai đáy bằng nhau</text>
<line x1="557.7" y1="154.8" x2="557.7" y2="229.0" stroke="#374151" stroke-width="1.6"/>
