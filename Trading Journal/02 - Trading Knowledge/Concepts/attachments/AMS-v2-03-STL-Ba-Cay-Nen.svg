<rect x="665.3" y="214.1" width="22.0" height="44.5" rx="2" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/>
<line x1="518.0" y1="288.3" x2="716.0" y2="288.3" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="617.0" y="303.3" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">đáy</text>
<text x="516.0" y="372.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nến phải KHÔNG cao hơn.</text>
<text x="516.0" y="387.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Chưa có một đáy duy nhất.</text>
<text x="516.0" y="403.4" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Coi cả cụm là một vùng đáy.</text>
<rect x="742.0" y="84.0" width="226.0" height="370.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="754.0" y="106.0" font-size="11.5" font-weight="700" fill="#7C3AED" text-anchor="start">④ MƠ HỒ — nến phải là inside bar</text>
