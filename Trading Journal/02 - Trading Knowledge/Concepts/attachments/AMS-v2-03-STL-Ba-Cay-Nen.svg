<rect x="189.3" y="184.5" width="22.0" height="59.4" rx="2" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/>
<line x1="42.0" y1="288.3" x2="240.0" y2="288.3" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="141.0" y="303.3" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">đáy</text>
<text x="40.0" y="372.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nến giữa thấp nhất.</text>
<text x="40.0" y="387.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Trái cao hơn. Phải cao hơn.</text>
<text x="40.0" y="403.4" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nến phải ĐÃ ĐÓNG → xác nhận.</text>
<rect x="266.0" y="84.0" width="226.0" height="370.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="278.0" y="106.0" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">② CHƯA đủ — nến phải chưa đóng</text>
<line x1="319.7" y1="154.8" x2="319.7" y2="229.0" stroke="#374151" stroke-width="1.6"/>
<rect x="308.7" y="169.6" width="22.0" height="44.5" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
<line x1="379.0" y1="199.3" x2="379.0" y2="288.3" stroke="#374151" stroke-width="1.6"/>
<rect x="368.0" y="214.1" width="22.0" height="29.7" rx="2" fill="#374151" stroke="#374151" stroke-width="1.6"/>
