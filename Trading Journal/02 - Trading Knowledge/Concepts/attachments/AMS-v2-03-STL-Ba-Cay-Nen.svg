<line x1="921.8" y1="154.8" x2="921.8" y2="243.8" stroke="#374151" stroke-width="1.6"/>
<rect x="910.8" y="169.6" width="22.0" height="59.4" rx="2" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/>
<line x1="756.0" y1="288.3" x2="954.0" y2="288.3" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="832.8" y="303.3" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">đáy</text>
<text x="754.0" y="372.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nến 3 nằm lọt trong nến 2.</text>
<text x="754.0" y="387.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Larry Williams: bỏ qua nến này,</text>
<text x="754.0" y="403.4" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">chờ nến kế tiếp rồi mới xác nhận.</text>
