<text x="131.0" y="475.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="131.0" y="495.7" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">L1</text>
<circle cx="221.0" cy="277.6" r="9" fill="#B45309"/>
<text x="221.0" y="281.4" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="329.0" cy="515.3" r="9" fill="#B91C1C"/>
<text x="329.0" y="519.1" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="329.0" y="539.3" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">L2 &lt; L1</text>
<circle cx="401.0" cy="212.7" r="9" fill="#111827"/>
<text x="401.0" y="216.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="508.0" cy="337.7" r="9" fill="#0F766E"/>
<text x="508.0" y="341.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<circle cx="473.0" cy="257.1" r="9" fill="#0F766E"/>
<text x="473.0" y="260.9" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="595.0" y="135.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="end">phản ứng?</text>
<rect x="636.0" y="74.0" width="324.0" height="500.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<circle cx="659.0" cy="100.0" r="11" fill="#334155"/>
<text x="659.0" y="104.1" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="678.0" y="105.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Đáy L1 được xác nhận</text>
<text x="678.0" y="123.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Một đáy rõ ràng. Bên dưới nó thường có lệnh</text>
<text x="678.0" y="139.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">dừng lỗ của người mua — ICT gọi là sell-side</text>
<text x="678.0" y="155.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">liquidity (SSL).</text>
<circle cx="659.0" cy="181.0" r="11" fill="#B45309"/>
<text x="659.0" y="185.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="678.0" y="186.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Đỉnh H1 và OB gốc</text>
<text x="678.0" y="204.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá tăng lên H1. Cây nến TĂNG cuối cùng trước</text>
<text x="678.0" y="220.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">cú giảm là bearish OB — vùng “đáng lẽ chặn giá</text>
<text x="678.0" y="236.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">đi lên”.</text>
<circle cx="659.0" cy="262.0" r="11" fill="#B91C1C"/>
<text x="659.0" y="266.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="678.0" y="267.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Giá phá xuống dưới L1 → L2</text>
<text x="678.0" y="285.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Đáy cũ bị vi phạm. Quan sát được: một đáy mới.</text>
<text x="678.0" y="301.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Diễn giải ICT: SSL bị quét. Chưa biết gì về đảo</text>
<text x="678.0" y="317.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">chiều.</text>
<circle cx="659.0" cy="343.1" r="11" fill="#111827"/>
<text x="659.0" y="347.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="678.0" y="348.1" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Thân nến đóng TRÊN H1</text>
<text x="678.0" y="366.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Thời điểm OB gốc thất bại VÀ cấu trúc đổi</text>
<text x="678.0" y="382.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">(MSS). Breaker chỉ “tồn tại” từ lúc nến này đóng</text>
<text x="678.0" y="398.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">cửa.</text>
<circle cx="659.0" cy="424.1" r="11" fill="#0F766E"/>
<text x="659.0" y="428.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="678.0" y="429.1" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="start">Vùng đổi vai</text>
<text x="678.0" y="447.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Vùng OB gốc (từng là trần) giờ được theo dõi</text>
<text x="678.0" y="463.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">như sàn tiềm năng: Bullish Breaker. Đây là một</text>
<text x="678.0" y="479.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">nhãn, chưa là lệnh.</text>
<circle cx="659.0" cy="505.1" r="11" fill="#0F766E"/>
<text x="659.0" y="509.3" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="678.0" y="510.1" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="start">Retest</text>
<text x="678.0" y="528.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá quay về vùng. Bây giờ mới quan sát phản</text>
<text x="678.0" y="544.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">ứng. Giữ được hay bị xuyên — đều phải ghi lại.</text>
<rect x="26.0" y="597.0" width="18.0" height="11.0" rx="2" fill="#F59E0B" fill-opacity="0.22" stroke="#B45309" stroke-width="1.1" stroke-dasharray="5,3"/>
<text x="50.0" y="606.0" font-size="11" font-weight="500" fill="#1F2937" text-anchor="start">OB gốc (trước khi thất bại)</text>
<rect x="207.3" y="597.0" width="18.0" height="11.0" rx="2" fill="#14B8A6" fill-opacity="0.22" stroke="#0F766E" stroke-width="1.1"/>
<text x="231.3" y="606.0" font-size="11" font-weight="500" fill="#1F2937" text-anchor="start">Bullish Breaker (sau khi xác nhận)</text>
<line x1="428.3" y1="602.0" x2="446.3" y2="602.0" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="452.3" y="606.0" font-size="11" font-weight="500" fill="#1F2937" text-anchor="start">Thanh khoản (SSL)</text>
<text x="954.0" y="628.0" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">Bước 1–4 là ĐỊNH NGHĨA; bước 5–6 là THEO DÕI GIẢ THUYẾT.</text>
</svg>
