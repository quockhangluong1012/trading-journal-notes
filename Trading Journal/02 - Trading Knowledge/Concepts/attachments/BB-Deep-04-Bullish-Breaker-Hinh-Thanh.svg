<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ dựng (synthetic). Đánh số theo thứ tự trader BIẾT được sự kiện. Vùng cam = OB gốc; vùng xanh ngọc = Breaker sau khi xác nhận.</text>
