<rect x="851.8" y="22" width="120.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="911.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CÁCH ĐỌC NOTE</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Một sự kiện, năm loại câu nói khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Khi nói về BPR, hãy luôn tự hỏi câu mình vừa nói thuộc loại nào. Lỗi phổ biến nhất: đọc một câu DIỄN GIẢI như thể đó là QUAN SÁT.</text>
