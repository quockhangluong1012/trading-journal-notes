<text x="393.3" y="111.0" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">QUAN SÁT</text>
<text x="512.0" y="108.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có một bullish FVG, sau đó có một bearish FVG đè lên một phần của nó. Ai nhìn</text>
<text x="512.0" y="123.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chart cũng thấy giống nhau.</text>
<rect x="346.0" y="157.0" width="626.0" height="64.0" rx="8" fill="#E6F6F8" stroke="#0E7490" stroke-width="1.2"/>
<rect x="358.0" y="167.5" width="56.4" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.1"/>
<text x="386.2" y="182.0" font-size="10.5" font-weight="700" fill="#0E7490" text-anchor="middle">CƠ CHẾ</text>
<text x="512.0" y="179.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi FVG là một cây nến chạy hết một dải giá trong khi nến trước và nến sau không</text>
<text x="512.0" y="194.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chạm tới dải đó. Giá ở đó CÓ được giao dịch, chỉ là rất nhanh.</text>
<rect x="346.0" y="228.0" width="626.0" height="64.0" rx="8" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/>
<rect x="358.0" y="238.5" width="33.7" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="374.9" y="253.0" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<text x="512.0" y="250.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ICT gọi phần chồng là Balanced Price Range — một PD array, tức một vùng giá</text>
<text x="512.0" y="265.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đáng theo dõi khi giá quay lại.</text>
<rect x="346.0" y="299.0" width="626.0" height="64.0" rx="8" fill="#FFF4E0" stroke="#B45309" stroke-width="1.2"/>
<rect x="358.0" y="309.5" width="65.0" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#B45309" stroke-width="1.1"/>
<text x="390.5" y="324.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<text x="512.0" y="321.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có thể đây là nơi hai nhóm người giao dịch ngược chiều đều có “giá tham chiếu”.</text>
<text x="512.0" y="336.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hợp lý, nhưng chart không chứng minh được.</text>
<rect x="346.0" y="370.0" width="626.0" height="64.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<rect x="358.0" y="380.5" width="128.3" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="422.2" y="395.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST REQUIRED</text>
<text x="512.0" y="392.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“Giá quay lại BPR sẽ phản ứng thường xuyên hơn một vùng bất kỳ.” Phải đếm trên</text>
<text x="512.0" y="407.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">dữ liệu của chính bạn mới biết.</text>
<rect x="346.0" y="441.0" width="626.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<rect x="358.0" y="451.5" width="81.1" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.1"/>
<text x="398.6" y="466.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">KHÔNG BIẾT</text>
<text x="512.0" y="463.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ai mua, ai bán, bao nhiêu, có thật sự “cân bằng” hay không. OHLC không chứa</text>
<text x="512.0" y="478.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">các thông tin này.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Nhãn dùng trong note: [QUAN SÁT] · [CƠ CHẾ] · [ICT] · [DIỄN GIẢI] · [HYPOTHESIS] · [BACKTEST REQUIRED].</text>
