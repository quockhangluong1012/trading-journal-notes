<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="498" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="894.3" y="22" width="77.7" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="933.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">BIÊN BPR</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bốn kiểu chồng nhau thường gặp</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi cột là một trường hợp. Xanh = bullish FVG, đỏ = bearish FVG, tím = BPR (nếu có).</text>
<rect x="28.0" y="86.0" width="229.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Chồng một phần</text>
<rect x="68.0" y="226.0" width="50.0" height="100.0" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.4"/>
<rect x="128.0" y="176.0" width="50.0" height="100.0" rx="2" fill="#FDE3E4" stroke="#E0464B" stroke-width="1.4"/>
<rect x="190.0" y="226.0" width="50.0" height="50.0" rx="2" fill="#E9DDFF" stroke="#7C3AED" stroke-width="2"/>
<text x="215.0" y="220.0" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<text x="38.0" y="402.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">BPR là phần giữa. Đây là kiểu phổ biến</text>
<text x="38.0" y="417.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">nhất.</text>
<rect x="267.0" y="86.0" width="229.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="279.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Nằm trọn bên trong</text>
<rect x="307.0" y="176.0" width="50.0" height="150.0" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.4"/>
<rect x="367.0" y="226.0" width="50.0" height="50.0" rx="2" fill="#FDE3E4" stroke="#E0464B" stroke-width="1.4"/>
<rect x="429.0" y="226.0" width="50.0" height="50.0" rx="2" fill="#E9DDFF" stroke="#7C3AED" stroke-width="2"/>
<text x="454.0" y="220.0" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<text x="277.0" y="402.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">FVG nhỏ nằm gọn trong FVG lớn → BPR</text>
<text x="277.0" y="417.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chính là FVG nhỏ.</text>
<rect x="506.0" y="86.0" width="229.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="518.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Chồng rất mỏng</text>
<rect x="546.0" y="226.0" width="50.0" height="100.0" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.4"/>
<rect x="606.0" y="151.0" width="50.0" height="85.0" rx="2" fill="#FDE3E4" stroke="#E0464B" stroke-width="1.4"/>
<rect x="668.0" y="226.0" width="50.0" height="10.0" rx="2" fill="#E9DDFF" stroke="#7C3AED" stroke-width="2"/>
<text x="693.0" y="220.0" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<text x="516.0" y="402.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Có BPR theo định nghĩa, nhưng mỏng</text>
<text x="516.0" y="417.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">tới mức sai lệch dữ liệu cũng có thể xóa</text>
<text x="516.0" y="432.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">nó.</text>
<rect x="745.0" y="86.0" width="229.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="757.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Không chồng</text>
<rect x="785.0" y="263.5" width="50.0" height="62.5" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.4"/>
<rect x="845.0" y="151.0" width="50.0" height="87.5" rx="2" fill="#FDE3E4" stroke="#E0464B" stroke-width="1.4"/>
<text x="932.0" y="255.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">không có</text>
<text x="755.0" y="402.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không có phần chung → không có BPR,</text>
<text x="755.0" y="417.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">dù hai FVG nằm gần nhau.</text>
<text x="28.0" y="480.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Kích thước BPR không tự nói lên chất lượng (xem phần Small vs Large BPR). Nhưng BPR quá mỏng so với spread/độ nhiễu thì gần như không dùng được để đặt lệnh.</text>
</svg>
