<svg viewBox="0 0 980 690" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="690" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Bốn thứ khác nhau đang được gọi là “Dealing Range”</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Cùng MỘT đường giá · bốn tiêu chí chọn neo · bốn ranh giới · bốn con số pd — và một trong bốn ĐẢO NGƯỢC ý nghĩa hành động</text>

  <defs>
    <g id="px">
      <path d="M 0,96 L 35,120 L 70,158 L 105,104 L 140,72 L 175,116 L 210,150 L 245,92 L 280,48 L 315,86 L 350,120 L 385,112 L 400,116"
            fill="none" stroke="#374151" stroke-width="1.7"/>
      <circle cx="400" cy="116" r="3.6" fill="#111827"/>
    </g>
  </defs>

  <!-- ============ PANEL A : DR-1 ============ -->
  <g>
    <rect x="25" y="76" width="455" height="275" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="36" y="88" width="86" height="20" rx="5" fill="#1D4ED8" opacity="0.12"/>
    <text x="44" y="103" font-size="12" font-weight="700" fill="#1D4ED8">DR-1</text>
    <text x="130" y="103" font-size="12.5" font-weight="700" fill="#374151">Range của hai swing CÓ Ý NGHĨA</text>
    <rect x="43" y="116" width="420" height="170" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
    <g transform="translate(53,121)">
      <rect x="210" y="48" width="190" height="102" fill="#16A34A" opacity="0.10"/>
      <line x1="205" y1="48" x2="400" y2="48" stroke="#DC2626" stroke-width="1.8"/>
      <line x1="205" y1="150" x2="400" y2="150" stroke="#16A34A" stroke-width="1.8"/>
      <line x1="205" y1="99" x2="400" y2="99" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 4"/>
      <use href="#px"/>
      <circle cx="210" cy="150" r="4.2" fill="#16A34A"/>
      <circle cx="280" cy="48" r="4.2" fill="#DC2626"/>
      <text x="292" y="30" font-size="10.5" font-weight="700" fill="#B91C1C">High 48 — BSL unswept</text>
      <text x="118" y="167" font-size="10.5" font-weight="700" fill="#15803D">Low 150 — gốc displacement leg</text>
      <text x="248" y="95" font-size="10" fill="#6B7280">EQ 99</text>
    </g>
    <text x="43" y="308" font-size="10.5" fill="#374151">Neo = 2 swing đã xác nhận, phá được cấu trúc (qua gate G2).</text>
    <text x="43" y="325" font-size="10.5" fill="#374151">Đây là định nghĩa dùng trong vault và trong hầu hết tài liệu ICT.</text>
    <text x="43" y="342" font-size="11.5" font-weight="700" fill="#15803D">pd = (150−116)/(150−48) = 0.33 → discount, hướng tăng còn hợp lệ</text>
  </g>

  <!-- ============ PANEL B : DR-2 ============ -->
  <g>
    <rect x="500" y="76" width="455" height="275" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="511" y="88" width="86" height="20" rx="5" fill="#7C3AED" opacity="0.12"/>
    <text x="519" y="103" font-size="12" font-weight="700" fill="#7C3AED">DR-2</text>
    <text x="605" y="103" font-size="12.5" font-weight="700" fill="#374151">Hộp consolidation (trading range)</text>
    <rect x="518" y="116" width="420" height="170" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
    <g transform="translate(528,121)">
      <rect x="315" y="86" width="85" height="34" fill="#7C3AED" opacity="0.14"/>
      <line x1="310" y1="86" x2="400" y2="86" stroke="#7C3AED" stroke-width="1.8"/>
      <line x1="310" y1="120" x2="400" y2="120" stroke="#7C3AED" stroke-width="1.8"/>
      <line x1="310" y1="103" x2="400" y2="103" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 4"/>
      <use href="#px"/>
      <circle cx="315" cy="86" r="4.2" fill="#7C3AED"/>
      <circle cx="350" cy="120" r="4.2" fill="#7C3AED"/>
      <text x="150" y="30" font-size="10.5" font-weight="700" fill="#6B7280">4 lần test hai biên → trông rất “đẹp”</text>
      <text x="238" y="80" font-size="10" fill="#6B7280">EQ 103</text>
    </g>
    <text x="518" y="308" font-size="10.5" fill="#374151">Neo = biên của vùng đi ngang. KHÔNG có neo nào gánh kết luận cấu trúc →</text>
    <text x="518" y="325" font-size="10.5" fill="#374151">thực chất là TEMPORARY INTERNAL RANGE, không phải range vận hành được.</text>
    <text x="518" y="342" font-size="11.5" font-weight="700" fill="#B91C1C">pd = (120−116)/(120−86) = 0.12 → “deep discount, mua ngay” — SAI</text>
  </g>

  <!-- ============ PANEL C : DR-3 ============ -->
  <g>
    <rect x="25" y="368" width="455" height="275" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="36" y="380" width="86" height="20" rx="5" fill="#D97706" opacity="0.14"/>
    <text x="44" y="395" font-size="12" font-weight="700" fill="#B45309">DR-3</text>
    <text x="130" y="395" font-size="12.5" font-weight="700" fill="#374151">Cửa sổ thời gian (IPDA 20/40/60)</text>
    <rect x="43" y="408" width="420" height="170" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
    <g transform="translate(53,413)">
      <rect x="70" y="48" width="330" height="110" fill="#D97706" opacity="0.10"/>
      <line x1="64" y1="48" x2="400" y2="48" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="1 0"/>
      <line x1="64" y1="158" x2="400" y2="158" stroke="#16A34A" stroke-width="1.8"/>
      <line x1="64" y1="103" x2="400" y2="103" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 4"/>
      <use href="#px"/>
      <circle cx="70" cy="158" r="4.2" fill="#16A34A"/>
      <circle cx="280" cy="48" r="4.2" fill="#DC2626"/>
      <text x="12" y="172" font-size="10.5" font-weight="700" fill="#15803D">Window low 158</text>
      <text x="292" y="30" font-size="10.5" font-weight="700" fill="#B91C1C">Window high 48</text>
      <text x="180" y="99" font-size="10" fill="#6B7280">EQ 103</text>
    </g>
    <text x="43" y="600" font-size="10.5" fill="#374151">Neo = cực trị cao nhất / thấp nhất trong N phiên — HOÀN TOÀN objective,</text>
    <text x="43" y="617" font-size="10.5" fill="#374151">nhưng rất nhạy với N, và tính lại mỗi phiên (không có “tuổi thọ”).</text>
    <text x="43" y="634" font-size="11.5" font-weight="700" fill="#15803D">pd = (158−116)/(158−48) = 0.38 → discount — bền với DR-1</text>
  </g>

  <!-- ============ PANEL D : DR-4 ============ -->
  <g>
    <rect x="500" y="368" width="455" height="275" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="511" y="380" width="86" height="20" rx="5" fill="#0891B2" opacity="0.14"/>
    <text x="519" y="395" font-size="12" font-weight="700" fill="#0E7490">DR-4</text>
    <text x="605" y="395" font-size="12.5" font-weight="700" fill="#374151">Range của CHÍNH leg đang chạy</text>
    <rect x="518" y="408" width="420" height="170" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
    <g transform="translate(528,413)">
      <rect x="280" y="48" width="120" height="72" fill="#DC2626" opacity="0.09"/>
      <line x1="275" y1="48" x2="400" y2="48" stroke="#DC2626" stroke-width="1.8"/>
      <line x1="275" y1="120" x2="400" y2="120" stroke="#DC2626" stroke-width="1.8"/>
      <line x1="275" y1="84" x2="400" y2="84" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 4"/>
      <use href="#px"/>
      <circle cx="280" cy="48" r="4.2" fill="#DC2626"/>
      <circle cx="350" cy="120" r="4.2" fill="#DC2626"/>
      <text x="150" y="167" font-size="10.5" font-weight="700" fill="#374151">leg TRƯỚC: 150 → 48 (up)</text>
      <text x="286" y="140" font-size="10.5" font-weight="700" fill="#B91C1C">leg đang chạy: 48 → 120 (DOWN)</text>
    </g>
    <text x="518" y="600" font-size="10.5" fill="#374151">Neo = điểm khởi phát leg + cực trị leg. Range này là range của một nhịp GIẢM.</text>
    <text x="518" y="617" font-size="10.5" fill="#374151">Đo OTE trên range này, không phải trên DR-1 — đây là lỗi O3 đã ghi trong vault.</text>
    <text x="518" y="634" font-size="11.5" font-weight="700" fill="#B91C1C">pd = (120−116)/(120−48) = 0.06 → “deep discount” nhưng CẤM MUA</text>
  </g>

  <rect x="25" y="656" width="930" height="24" rx="6" fill="#1F2937" opacity="0.05"/>
  <text x="38" y="672" font-size="11.5" font-weight="700" fill="#1F2937">→ Kết luận: mọi phép đo fib phải ghi rõ anchor_type. Trộn DR-1 và DR-4 vào cùng một cột dữ liệu = thống kê nhiễm, không cứu được về sau.</text>
</svg>
