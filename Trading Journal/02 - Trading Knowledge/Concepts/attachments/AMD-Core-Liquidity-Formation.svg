<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
  <text x="24" y="30" font-size="18" font-weight="700" fill="currentColor">Liquidity hình thành trong Accumulation như thế nào</text>
  <text x="24" y="50" font-size="12.5" fill="var(--muted)">Mỗi lần chạm mà không phá = một mốc tham chiếu rõ ràng hơn = thêm stop đặt quanh đó.</text>
  <rect x="60" y="110" width="780" height="130" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="70" y="102" font-size="11.5" fill="var(--accent)">Range tích lũy (đi ngang, biên độ hẹp)</text>
  <line x1="60" y1="110" x2="840" y2="110" stroke="var(--error)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="60" y1="240" x2="840" y2="240" stroke="var(--error)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M80,175 L150,160 L220,185 L290,158 L360,182 L430,160 L500,185 L570,162 L640,183 L710,161 L780,180 L830,170" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="220" cy="110" r="4" fill="var(--error)"/>
  <circle cx="430" cy="110" r="4" fill="var(--error)"/>
  <circle cx="640" cy="110" r="4" fill="var(--error)"/>
  <path d="M212,96 L220,84 L228,96 Z" fill="var(--error)"/>
  <path d="M422,96 L430,84 L438,96 Z" fill="var(--error)"/>
  <path d="M632,96 L640,84 L648,96 Z" fill="var(--error)"/>
  <text x="560" y="76" font-size="11.5" fill="var(--error)">Equal highs → pool BSL: stop phe Short + buy-stop breakout</text>
  <circle cx="290" cy="240" r="4" fill="var(--error)"/>
  <circle cx="500" cy="240" r="4" fill="var(--error)"/>
  <circle cx="710" cy="240" r="4" fill="var(--error)"/>
  <path d="M282,254 L290,266 L298,254 Z" fill="var(--error)"/>
  <path d="M492,254 L500,266 L508,254 Z" fill="var(--error)"/>
  <path d="M702,254 L710,266 L718,254 Z" fill="var(--error)"/>
  <text x="560" y="288" font-size="11.5" fill="var(--error)">Equal lows → pool SSL: stop phe Long + sell-stop breakout</text>
  <text x="60" y="316" font-size="12" fill="var(--fg)">Pool hình thành = liquidity TỒN TẠI. Chưa bị quét ≠ đã bị lấy ≠ sẽ đảo chiều.</text>
  <text x="60" y="338" font-size="12" fill="var(--muted)">Range càng ở lâu, càng nhiều lần chạm → pool càng lớn → Judas càng "đáng" quét (nhưng không đảm bảo nó xảy ra).</text>
  <text x="60" y="360" font-size="12" fill="var(--muted)">Phân biệt: vị trí pool (ở đâu) / sự kiện quét (khi nào) / target phân phối (đi về đâu).</text>
</svg>
