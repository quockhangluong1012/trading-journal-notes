<svg viewBox="0 0 1000 540" width="1000" height="540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="538" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="845.2" y="22" width="126.8" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="908.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LEVEL 3 · CƠ CHẾ</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Phiên đấu giá mở cửa — Vì sao giá mở cửa có thể cách xa giá đóng cửa</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ở nhiều sàn cổ phiếu, lệnh gửi trước giờ mở cửa được gom lại và khớp MỘT LẦN ở MỘT giá (ví dụ Nasdaq Opening Cross). Giá đó được</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">chọn để khớp được nhiều nhất.</text>
<rect x="28.0" y="100.0" width="300.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="122.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">① Hôm qua đóng cửa: 104</text>
<line x1="69.7" y1="303.4" x2="69.7" y2="351.9" stroke="#0F9D74" stroke-width="1.2"/>
