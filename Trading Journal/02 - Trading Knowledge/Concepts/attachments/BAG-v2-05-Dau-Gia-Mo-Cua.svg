<text x="306.0" y="283.3" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">đóng cửa 104</text>
<rect x="350.0" y="100.0" width="300.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="362.0" y="122.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">② Qua đêm: lệnh dồn lại, chưa khớp</text>
<text x="430.0" y="140.0" font-size="11" font-weight="800" fill="#0F9D74" text-anchor="middle">Người muốn MUA</text>
<text x="570.0" y="140.0" font-size="11" font-weight="800" fill="#E0464B" text-anchor="middle">Người muốn BÁN</text>
<rect x="364.0" y="152.0" width="132.0" height="34.0" rx="6" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1"/>
<text x="430.0" y="173.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">mua, chấp nhận đến 112</text>
<rect x="504.0" y="152.0" width="132.0" height="34.0" rx="6" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="570.0" y="173.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">bán, ít nhất 104</text>
