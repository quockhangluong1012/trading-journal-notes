<text x="903.0" y="194.4" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="start">mở 110</text>
<text x="843.7" y="246.1" font-size="11" font-weight="800" fill="#D97706" text-anchor="middle">gap</text>
<rect x="28.0" y="414.0" width="944.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="436.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Điều cần nhớ</text>
<text x="44.0" y="456.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Sàn chọn giá mở cửa sao cho nhiều lệnh được khớp nhất (Nasdaq ghi rõ: tối đa số cổ phiếu khớp, rồi tối thiểu phần lệch, rồi gần giá giữa nhất). Không có quy tắc nào</text>
<text x="44.0" y="471.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">buộc giá mở cửa phải gần giá đóng cửa hôm qua.</text>
<text x="44.0" y="494.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Gap mở cửa là KẾT QUẢ bình thường của việc thông tin và lệnh tích tụ trong lúc không có khớp lệnh liên tục. Bản thân nó chưa nói gì về 'breakaway' hay xu hướng.</text>
