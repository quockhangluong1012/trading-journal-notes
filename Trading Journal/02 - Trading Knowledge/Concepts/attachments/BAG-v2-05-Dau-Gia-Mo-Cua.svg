<text x="430.0" y="217.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">mua, chấp nhận đến 110</text>
<rect x="504.0" y="196.0" width="132.0" height="34.0" rx="6" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="570.0" y="217.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">bán, ít nhất 109</text>
<rect x="364.0" y="240.0" width="132.0" height="34.0" rx="6" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1"/>
<text x="430.0" y="261.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">mua, chấp nhận đến 106</text>
<rect x="504.0" y="240.0" width="132.0" height="34.0" rx="6" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="570.0" y="261.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">bán, ít nhất 110</text>
<text x="366.0" y="304.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có tin tốt qua đêm → nhiều người muốn mua ở giá</text>
<text x="366.0" y="319.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cao; ít người chịu bán rẻ.</text>
<text x="366.0" y="352.0" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">Giữa đêm không có khớp lệnh liên tục.</text>
<rect x="672.0" y="100.0" width="300.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="684.0" y="122.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">③ Mở cửa: khớp một lần ở 110</text>
