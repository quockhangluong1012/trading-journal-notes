<svg viewBox="0 0 760 486" width="760" height="486" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Từ lệnh chờ đến BSL và SSL: stop “ngủ” nằm ở đâu, thức dậy thành lệnh gì</title>
<desc>Buy-side liquidity nằm trên đỉnh cũ gồm stop-loss của người short và buy stop breakout, đều là lệnh mua. Sell-side liquidity nằm dưới đáy cũ gồm stop-loss của người long và sell stop breakout, đều là lệnh bán.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="486" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Từ lệnh chờ đến BSL và SSL: stop “ngủ” nằm ở đâu, thức dậy thành lệnh gì</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Số giá trong hình là minh họa. Stop không nằm trong sổ lệnh CME cho tới khi kích hoạt; với CFD/FX</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">retail, broker giữ stop.</text>
<rect x="24" y="76" width="452" height="392" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<line x1="44" y1="190" x2="456" y2="190" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="44" y1="352" x2="456" y2="352" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="48" y="206" font-size="11" fill="#6B7280">đỉnh cũ</text>
<text x="48" y="344" font-size="11" fill="#6B7280">đáy cũ</text>
<polyline points="50,300 95,230 135,192 175,250 215,300 255,262 300,208 335,250 372,330 410,300" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="184" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="320" cy="181" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="340" cy="184" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="360" cy="181" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="380" cy="184" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="400" cy="181" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="420" cy="184" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="440" cy="181" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="300" cy="365" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="320" cy="362" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="340" cy="365" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="360" cy="362" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="380" cy="365" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="400" cy="362" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="420" cy="365" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<circle cx="440" cy="362" r="3" fill="#D85A30" stroke="none" stroke-width="1"/>
<rect x="44" y="96" width="420" height="60" rx="8" fill="#FCEBE4" stroke="#D85A30" stroke-width="1"/>
<text x="56" y="114" font-size="12.5" fill="#1F2937" font-weight="700">BSL = cụm lệnh MUA đang ngủ trên đỉnh</text>
<text x="56" y="130" font-size="10.5" fill="#4B5563">① Stop-loss của người SHORT → khi kích hoạt thành lệnh MUA. ② Buy</text>
<text x="56" y="144.2" font-size="10.5" fill="#4B5563">stop của người đánh breakout → lệnh MUA.</text>
<line x1="380" y1="158" x2="380" y2="174" stroke="#D85A30" stroke-width="1" marker-end="url(#arO)"/>
<rect x="44" y="386" width="420" height="68" rx="8" fill="#FCEBE4" stroke="#D85A30" stroke-width="1"/>
<text x="56" y="404" font-size="12.5" fill="#1F2937" font-weight="700">SSL = cụm lệnh BÁN đang ngủ dưới đáy</text>
<text x="56" y="420" font-size="10.5" fill="#4B5563">① Stop-loss của người LONG → khi kích hoạt thành lệnh BÁN. ② Sell</text>
<text x="56" y="434.2" font-size="10.5" fill="#4B5563">stop của người đánh breakout → lệnh BÁN.</text>
<text x="56" y="314" font-size="10.5" fill="#4B5563">Giá chạm mức → hàng loạt lệnh market xuất hiện</text>
<text x="56" y="327" font-size="10.5" fill="#4B5563">gần như cùng lúc → cascade (Osler 2005).</text>
<text x="496" y="96" font-size="13.5" fill="#1F2937" font-weight="700">Ba loại lệnh</text>
<rect x="496" y="108" width="240" height="66" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="508" y="128" font-size="13" fill="#1F2937" font-weight="700">Market</text>
<text x="508" y="145" font-size="10.5" fill="#4B5563">Khớp ngay ở giá đang có.</text>
<text x="508" y="161.2" font-size="10.5" fill="#1D9E75" font-weight="700">LẤY thanh khoản</text>
<rect x="496" y="184" width="240" height="78" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
<text x="508" y="204" font-size="13" fill="#1F2937" font-weight="700">Limit</text>
<text x="508" y="221" font-size="10.5" fill="#4B5563">Nằm chờ ở một giá cố định; hiện trong</text>
<text x="508" y="235.2" font-size="10.5" fill="#4B5563">sổ lệnh (futures).</text>
<text x="508" y="251.39999999999998" font-size="10.5" fill="#2563EB" font-weight="700">CUNG CẤP thanh khoản</text>
<rect x="496" y="272" width="240" height="104" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.2"/>
<text x="508" y="292" font-size="13" fill="#1F2937" font-weight="700">Stop</text>
<text x="508" y="309" font-size="10.5" fill="#4B5563">“Ngủ”, không hiện cho tới khi giá</text>
<text x="508" y="323.2" font-size="10.5" fill="#4B5563">chạm; rồi thành lệnh market/limit.</text>
<text x="508" y="339.4" font-size="10.5" fill="#D85A30" font-weight="700">Dòng lệnh chủ động chờ sẵn: khi</text>
<text x="508" y="353.59999999999997" font-size="10.5" fill="#D85A30" font-weight="700">thức dậy, nó LẤY thanh khoản</text>
<rect x="496" y="388" width="240" height="74" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="508" y="406" font-size="10.5" fill="#92400E" font-weight="700">“Liquidity”: sách tài chính = độ</text>
<text x="508" y="420.2" font-size="10.5" fill="#92400E" font-weight="700">sâu lệnh limit; ICT = cụm lệnh sẽ</text>
<text x="508" y="434.4" font-size="10.5" fill="#92400E" font-weight="700">bị buộc khớp ở mức đoán trước</text>
<text x="508" y="448.59999999999997" font-size="10.5" fill="#92400E" font-weight="700">được.</text>
</svg>
