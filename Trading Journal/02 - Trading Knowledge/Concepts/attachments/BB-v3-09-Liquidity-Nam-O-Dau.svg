<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="578.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Liquidity: những “túi lệnh chờ” nằm sau các đỉnh và đáy dễ thấy</text>
<rect x="889.7" y="23.0" width="82.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="930.8" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Phía TRÊN đỉnh cũ thường có lệnh mua chờ (buy stop) = buy-side liquidity. Phía DƯỚI đáy cũ thường có lệnh bán chờ (sell stop) = sell-side liquidity.</text>
<rect x="28.0" y="94.5" width="600.0" height="430.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<polyline points="66.7,332.5 127.8,224.5 183.4,296.5 250.2,221.5 316.9,398.5 372.5,326.5 439.2,401.5 505.9,290.5 578.2,332.5" fill="none" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="117.8" y1="224.5" x2="264.2" y2="224.5" stroke="#7C3AED" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,3"/>
<line x1="117.8" y1="216.5" x2="264.2" y2="216.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
<line x1="117.8" y1="210.5" x2="264.2" y2="210.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
<line x1="117.8" y1="204.5" x2="264.2" y2="204.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.54"/>
<line x1="117.8" y1="198.5" x2="264.2" y2="198.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.36"/>
<text x="191.0" y="184.5" font-size="11.5" font-weight="700" fill="#7C3AED" text-anchor="middle">BUY-SIDE LIQUIDITY — lệnh mua chờ</text>
<line x1="306.9" y1="398.5" x2="453.2" y2="398.5" stroke="#DB2777" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,3"/>
<line x1="306.9" y1="406.5" x2="453.2" y2="406.5" stroke="#DB2777" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
<line x1="306.9" y1="412.5" x2="453.2" y2="412.5" stroke="#DB2777" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
<line x1="306.9" y1="418.5" x2="453.2" y2="418.5" stroke="#DB2777" stroke-width="2" stroke-linecap="round" opacity="0.54"/>
<line x1="306.9" y1="424.5" x2="453.2" y2="424.5" stroke="#DB2777" stroke-width="2" stroke-linecap="round" opacity="0.36"/>
<text x="380.0" y="448.5" font-size="11.5" font-weight="700" fill="#DB2777" text-anchor="middle">SELL-SIDE LIQUIDITY — lệnh bán chờ</text>
<text x="189.0" y="320.5" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">hai đỉnh bằng nhau (EQH)</text>
<text x="378.0" y="306.5" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">hai đáy bằng nhau (EQL)</text>
<rect x="642.0" y="94.5" width="330.0" height="430.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="120.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Ai để lệnh ở đó? (cho trẻ 5 tuổi)</text>
<text x="656.0" y="146.5" font-size="12.5" font-weight="700" fill="#7C3AED">Người đang BÁN</text>
<text x="656.0" y="163.5" font-size="12" font-weight="400" fill="#111827" data-bx="655.0,959.0">sợ giá lên quá đỉnh → đặt lệnh “nếu lên tới đây thì</text>
<text x="656.0" y="180.5" font-size="12" font-weight="400" fill="#111827" data-bx="655.0,959.0">mua lại giúp tôi” (stop loss).</text>
<text x="656.0" y="205.5" font-size="12.5" font-weight="700" fill="#7C3AED">Người chờ MUA đuổi</text>
<text x="656.0" y="222.5" font-size="12" font-weight="400" fill="#111827" data-bx="655.0,959.0">đặt lệnh “nếu vượt đỉnh thì mua giúp tôi” (breakout).</text>
<text x="656.0" y="247.6" font-size="12.5" font-weight="700" fill="#DB2777">Dưới đáy thì ngược lại</text>
<text x="656.0" y="264.6" font-size="12" font-weight="400" fill="#111827" data-bx="655.0,959.0">người đang mua đặt lệnh dừng lỗ bán; người chờ</text>
<text x="656.0" y="281.6" font-size="12" font-weight="400" fill="#111827" data-bx="655.0,959.0">bán đuổi đặt lệnh bán.</text>
<rect x="656.0" y="310.7" width="302.0" height="87.6" rx="8" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="310.7" width="4.0" height="87.6" rx="2" fill="#0891B2"/>
<text x="670.0" y="330.9" font-size="12" font-weight="700" fill="#0891B2" data-bx="656.0,958.0">[CƠ CHẾ]</text>
<text x="670.0" y="350.9" font-size="12" font-weight="400" fill="#111827" data-bx="656.0,958.0">Khi giá chạm tới, các lệnh chờ đó biến thành</text>
<text x="670.0" y="367.9" font-size="12" font-weight="400" fill="#111827" data-bx="656.0,958.0">lệnh mua/bán NGAY (market order). Giá vì thế</text>
<text x="670.0" y="385.0" font-size="12" font-weight="400" fill="#111827" data-bx="656.0,958.0">hay “giật” thêm một đoạn qua mức đó.</text>
<rect x="656.0" y="406.2" width="302.0" height="70.5" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="406.2" width="4.0" height="70.5" rx="2" fill="#B45309"/>
<text x="670.0" y="426.4" font-size="12" font-weight="700" fill="#B45309" data-bx="656.0,958.0">[GIỚI HẠN]</text>
<text x="670.0" y="446.5" font-size="12" font-weight="400" fill="#111827" data-bx="656.0,958.0">Chart nến KHÔNG cho thấy các lệnh này. Ta</text>
<text x="670.0" y="463.5" font-size="12" font-weight="400" fill="#111827" data-bx="656.0,958.0">chỉ đoán chúng ở đó vì mức ấy dễ thấy.</text>
<text x="28.0" y="564.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Liên hệ Breaker: bước “đáy cũ bị vi phạm” = giá đi vào túi sell-side. Bước “đỉnh giữa bị phá” = giá đi vào túi buy-side nằm trên đỉnh giữa.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
