<text x="439.0" y="303.0" font-size="10.5" fill="#1F2937" font-weight="700" text-anchor="start">giá</text>
<text x="40.0" y="512.0" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="start">ATR(14) D1 = 7 đơn vị. Nến = phiên hiện tại (sau Asia). Ví dụ giả định.</text>
<rect x="512.0" y="74.0" width="404.0" height="106.0" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.2"/>
<text x="521.0" y="93.3" font-size="11.3" fill="#C2410C" font-weight="700" text-anchor="start">Kịch bản A — PDH trước PDL</text>
<text x="521.0" y="110.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Ủng hộ: D1 cấu trúc tăng, displacement gần nhất đi lên</text>
<text x="521.0" y="125.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Chống: Asia H gần — có thể chỉ là nhịp lấy mức nhỏ</text>
<text x="521.0" y="140.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Vô hiệu: H1 close + acceptance dưới Asia L / protected low</text>
<rect x="512.0" y="190.0" width="404.0" height="106.0" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="521.0" y="209.3" font-size="11.3" fill="#1D4ED8" font-weight="700" text-anchor="start">Kịch bản B — PDL trước PDH</text>
<text x="521.0" y="226.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Ủng hộ: phản ứng yếu ở BSL gần, H1 tạo lower high</text>
<text x="521.0" y="241.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Chống: ngược cấu trúc D1</text>
<text x="521.0" y="256.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Vô hiệu: H1 acceptance trên PDH</text>
<rect x="512.0" y="306.0" width="404.0" height="106.0" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="521.0" y="325.3" font-size="11.3" fill="#B45309" font-weight="700" text-anchor="start">Kịch bản C — chưa có DOL rõ</text>
<text x="521.0" y="342.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Hai phía gần như cân bằng, tin tier-1 sắp ra</text>
<text x="521.0" y="357.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Hành động: chỉ quan sát, ghi nhận sự kiện</text>
<text x="521.0" y="372.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Đây là một KẾT LUẬN hợp lệ, không phải thất bại</text>
<rect x="512.0" y="426.0" width="404.0" height="98.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
<text x="524.0" y="446.0" font-size="12" fill="#1D4ED8" font-weight="700" text-anchor="start">Baseline hình học [MATHEMATICAL]</text>
<text x="524.0" y="466.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Random walk không drift: P(chạm PDH trước PDL)</text>
<text x="524.0" y="484.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">= khoảng cách tới PDL / (tổng hai khoảng cách)</text>
<text x="524.0" y="502.0" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">= 1.0 / (1.2 + 1.0) ≈ 45%  ·  (Asia H/L: 64% — chỉ minh họa)</text>
<text x="524.0" y="518.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start">Lý do &quot;ICT&quot; chỉ có giá trị nếu làm tốt HƠN con số này.</text>
<rect x="24.0" y="534.0" width="892.0" height="52.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="555.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Xếp hạng bằng lời (không cần công thức): khung thời gian của mức · có phải ERL của range D1 · cùng hướng cấu trúc HTF ·</text>
<text x="40.0" y="572.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">khoảng cách so với horizon (≤ 1–1.5 ATR D1 cho 1–2 ngày) · đường đi có bị POI ngược chiều chặn không · đối thủ gần hay xa.</text>
<text x="24.0" y="606.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-11 · Các mức và khoảng cách là giả định để minh họa. Xác suất baseline không chứa thông tin về edge.</text>
