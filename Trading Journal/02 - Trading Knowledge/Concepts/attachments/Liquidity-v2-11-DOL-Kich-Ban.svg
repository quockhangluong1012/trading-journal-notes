<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">DOL = giả thuyết mục tiêu có đối thủ, horizon và invalidation. Trước khi &quot;đọc&quot; ICT, so với baseline hình học.</text>
