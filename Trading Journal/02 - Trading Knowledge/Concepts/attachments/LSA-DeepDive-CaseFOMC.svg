<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
  </g>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Case: FOMC - HTF pool bi quet nhung POI da vo truoc</text>

  <!-- HTF pool line (EQL) -->
  <line x1="60" y1="400" x2="900" y2="400" stroke="#f2c94c" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="65" y="392" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">EQL / SSL HTF (target ban dau)</text>

  <!-- POI zone (discount OB) -->
  <rect x="150" y="300" width="200" height="60" fill="rgba(255,152,0,0.25)"/>
  <text x="155" y="295" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">POI (H1 OB discount)</text>

  <!-- candles: price comes down into POI, LTF MSS up (reject early, does not reach EQL) -->
  <g>
    <line x1="200" y1="180" x2="200" y2="330" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="192" y="230" width="16" height="90" fill="#ef5350"/>
    <line x1="250" y1="260" x2="250" y2="345" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="242" y="290" width="16" height="40" fill="#ef5350"/>
    <text x="150" y="255" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Sweep STL cuc bo tai POI</text>
    <line x1="248" y1="330" x2="270" y2="300" stroke="#ffffff" stroke-width="1.5"/>

    <!-- MSS up + FVG -->
    <line x1="300" y1="180" x2="300" y2="335" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="292" y="180" width="16" height="120" fill="#26a69a"/>
    <rect x="285" y="240" width="55" height="35" fill="rgba(41,98,255,0.25)"/>
    <text x="290" y="175" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">MSS + FVG (M5)</text>

    <!-- price runs up, news spike shown as tall wick candle near 700 -->
    <line x1="380" y1="60" x2="380" y2="200" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="372" y="90" width="16" height="90" fill="#26a69a"/>
    <line x1="450" y1="50" x2="450" y2="190" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="442" y="70" width="16" height="90" fill="#26a69a"/>

    <!-- FOMC spike candle - huge wick both directions -->
    <line x1="560" y1="40" x2="560" y2="480" stroke="#ef5350" stroke-width="2"/>
    <rect x="548" y="150" width="24" height="220" fill="#ef5350"/>
    <text x="480" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Nen tin FOMC - bien do gap doi binh thuong</text>

    <!-- price eventually retraces further down toward EQL after news -->
    <line x1="650" y1="330" x2="650" y2="420" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="642" y="335" width="16" height="80" fill="#ef5350"/>
    <line x1="700" y1="360" x2="700" y2="405" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="692" y="365" width="16" height="35" fill="#ef5350"/>
  </g>

  <text x="600" y="440" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">EQL bi quet SAU tin - nhung entry va TP da dong tu truoc, khong doi den day</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">
    <rect x="60" y="500" width="14" height="14" fill="rgba(255,152,0,0.25)"/>
    <text x="80" y="512">POI / OB</text>
    <rect x="220" y="500" width="14" height="14" fill="rgba(41,98,255,0.25)"/>
    <text x="240" y="512">FVG</text>
    <line x1="330" y1="507" x2="360" y2="507" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="365" y="512">Target HTF (EQL)</text>
  </g>
</svg>
