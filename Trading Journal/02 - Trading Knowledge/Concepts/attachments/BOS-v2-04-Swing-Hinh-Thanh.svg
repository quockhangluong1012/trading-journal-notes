<rect x="184.4" y="257.2" width="16.0" height="47.1" rx="1" fill="#1D9E75"/>
<line x1="243.2" y1="217.9" x2="243.2" y2="268.9" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
<rect x="235.2" y="229.7" width="16.0" height="27.4" rx="1" fill="#1D9E75"/>
<line x1="294.0" y1="170.9" x2="294.0" y2="237.6" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
<rect x="286.0" y="210.1" width="16.0" height="19.6" rx="1" fill="#1D9E75"/>
<line x1="344.8" y1="194.4" x2="344.8" y2="257.2" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round"/>
<rect x="336.8" y="210.1" width="16.0" height="39.2" rx="1" fill="#DC2626"/>
<line x1="395.6" y1="225.8" x2="395.6" y2="280.7" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round"/>
<rect x="387.6" y="249.3" width="16.0" height="23.5" rx="1" fill="#DC2626"/>
<line x1="446.4" y1="249.3" x2="446.4" y2="304.2" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
<rect x="438.4" y="265.0" width="16.0" height="7.8" rx="1" fill="#1D9E75"/>
<line x1="497.2" y1="237.6" x2="497.2" y2="276.8" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
<rect x="489.2" y="245.4" width="16.0" height="19.6" rx="1" fill="#1D9E75"/>
<line x1="294.0" y1="170.9" x2="527.7" y2="170.9" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="527.7" y="165.9" font-size="11" fill="#D85A30" text-anchor="end"><tspan>swing high (đỉnh cũ)</tspan></text>
<circle cx="243.2" cy="199.9" r="10" fill="#2563EB"/>
<text x="243.2" y="203.9" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<circle cx="294.0" cy="152.9" r="10" fill="#2563EB"/>
<text x="294.0" y="156.9" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<circle cx="344.8" cy="176.4" r="10" fill="#2563EB"/>
<text x="344.8" y="180.4" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<line x1="243.2" y1="217.9" x2="90.8" y2="182.7" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="90.8" y="160.7" font-size="11" fill="#2563EB" text-anchor="start"><tspan>① nến 4 đóng: &quot;đỉnh tạm&quot; mới,</tspan></text>
<text x="90.8" y="174.7" font-size="11" fill="#2563EB" text-anchor="start"><tspan>chưa phải swing</tspan></text>
<line x1="294.0" y1="170.9" x2="355.0" y2="143.5" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="355.0" y="135.5" font-size="11" fill="#2563EB" text-anchor="start"><tspan>② nến 5 in đỉnh cao nhất</tspan></text>
<line x1="355.0" y1="217.9" x2="395.6" y2="315.9" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="395.6" y="327.9" font-size="11" fill="#2563EB" text-anchor="start"><tspan>③ nến 6 ĐÓNG với đỉnh thấp hơn</tspan></text>
<text x="395.6" y="341.9" font-size="11" fill="#2563EB" text-anchor="start"><tspan>→ lúc này nến 5 mới được</tspan></text>
<text x="395.6" y="355.9" font-size="11" fill="#2563EB" text-anchor="start"><tspan>xác nhận là swing high</tspan></text>
<text x="327.0" y="390.5" font-size="10.5" fill="#6B7280" text-anchor="start"><tspan>vùng xám = thông tin mới có SAU nến 5</tspan></text>
<rect x="582.0" y="100.0" width="294.0" height="196.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="582.0" y="100.0" width="5.0" height="196.0" rx="2" fill="#B45309"/>
<text x="596.0" y="120.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Vì sao giá ngừng tăng và quay đầu?</tspan></text>
<text x="596.0" y="139.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="608.0" y="139.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Người mua gấp đã mua xong — không còn ai</tspan></text>
<text x="608.0" y="156.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>muốn mua ngay ở giá cao hơn.</tspan></text>
<text x="596.0" y="175.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="608.0" y="175.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Giá càng cao, càng nhiều người muốn bán</tspan></text>
<text x="608.0" y="191.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>(chốt lời, bán khống) xếp hàng chờ.</tspan></text>
<text x="596.0" y="210.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="608.0" y="210.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Khi lệnh bán chủ động lấn lệnh mua chủ</tspan></text>
<text x="608.0" y="226.7" font-size="12" fill="#1F2937" text-anchor="start"><tspan>động, giá đi xuống và để lại một &quot;đỉnh&quot;.</tspan></text>
<rect x="582.0" y="308.0" width="294.0" height="122.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="582.0" y="308.0" width="5.0" height="122.0" rx="2" fill="#DC2626"/>
<text x="596.0" y="328.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Điều quan trọng nhất</tspan></text>
<text x="596.0" y="347.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Mọi swing đều được biết muộn ít nhất một</tspan></text>
<text x="596.0" y="364.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>nến. Quy ước khác (nhiều nến mỗi bên) cho</tspan></text>
<text x="596.0" y="381.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>swing chắc hơn nhưng còn muộn hơn.</tspan></text>
<text x="24.0" y="458.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Hệ quả cho BOS: chỉ được dùng swing ĐÃ được xác nhận ở thời điểm đang xét. Không được &quot;mượn&quot; một swing mà chỉ sau này mới thấy.</tspan></text>
<text x="24.0" y="478.0" font-size="11.5" fill="#6B7280" text-anchor="start"><tspan>Xem thêm thuật toán swing ở note 54 và cấp STH/ITH/LTH ở note 01.</tspan></text>
</svg>
