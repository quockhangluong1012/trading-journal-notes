<rect x="24.0" y="360.0" width="5.0" height="76.0" rx="2" fill="#2563EB"/>
<text x="38.0" y="380.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Bài học</tspan></text>
<text x="38.0" y="399.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Cây nến phá giống hệt nhau, nhưng tên gọi khác. Nhãn do TRẠNG THÁI trước cú phá quyết định, không do hình dạng cây nến. Vì vậy phải khai báo trước: khung</tspan></text>
<text x="38.0" y="416.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>nào, lớp nào (internal hay external), trạng thái hiện tại là gì — rồi mới gọi tên.</tspan></text>
