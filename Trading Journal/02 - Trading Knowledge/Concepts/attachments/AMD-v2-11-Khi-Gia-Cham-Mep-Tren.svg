<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mk15803D" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="mkEA580C" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Giá chạm mép trên: kích hoạt stop ≠ đảo chiều</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Kích hoạt lệnh stop chỉ giải thích vì sao giá nhảy qua mép. Việc giá đi TIẾP hay QUAY VỀ phụ thuộc vào bên kia có đủ người khớp hay</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">không — điều mà chart OHLC không cho thấy.</text>
<rect x="907.0" y="22.0" width="65.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="939.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CƠ CHẾ</text>
<rect x="28.0" y="104.0" width="520.0" height="430.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="128.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Phóng to mép trên của vùng đi ngang</text>
<rect x="60.0" y="324.0" width="460.0" height="170.0" rx="2" fill="#F8FAFC"/>
<line x1="60.0" y1="324.0" x2="520.0" y2="324.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="62.0" y="320.0" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start">mép trên = 100</text>
<circle cx="283.4" cy="304.9" r="3.2" fill="#EA580C"/>
<circle cx="303.1" cy="304.9" r="3.2" fill="#EA580C"/>
<circle cx="322.9" cy="304.9" r="3.2" fill="#EA580C"/>
<circle cx="342.6" cy="304.9" r="3.2" fill="#EA580C"/>
<circle cx="362.3" cy="304.9" r="3.2" fill="#EA580C"/>
<path d="M60.0,430.2 L92.9,377.1 L125.7,440.9 L158.6,353.8 L191.4,409.0 L224.3,341.0 L257.1,387.8 L290.0,355.9 L322.9,319.7 L355.7,285.8" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M355.7,285.8 L388.6,268.8 L421.4,247.5 L454.3,222.0 L487.1,192.2" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#mk15803D)"/>
<path d="M355.7,285.8 L388.6,304.9 L421.4,336.7 L454.3,368.6 L487.1,402.6" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#mkEA580C)"/>
<circle cx="322.9" cy="319.7" r="4.5" fill="#1F2937" stroke="#FFFFFF" stroke-width="1.4"/>
<circle cx="355.7" cy="285.8" r="5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<circle cx="306.9" cy="335.7" r="10" fill="#1F2937"/>
<text x="306.9" y="339.7" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="318.9" cy="272.0" r="10" fill="#EA580C"/>
<text x="318.9" y="276.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="357.7" cy="263.8" r="10" fill="#EA580C"/>
<text x="357.7" y="267.7" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="493.7" y="182.2" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="end">4a — đi tiếp</text>
<text x="493.7" y="424.6" font-size="11.5" font-weight="700" fill="#EA580C" text-anchor="end">4b — quay về</text>
<rect x="562.0" y="104.0" width="410.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/>
<circle cx="582.0" cy="124.0" r="11" fill="#1F2937"/>
<text x="582.0" y="128.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="602.0" y="128.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Giá chạm 100.x</text>
<text x="602.0" y="148.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Chưa có gì đặc biệt. Chạm mép không phải tín hiệu.</text>
<rect x="562.0" y="168.0" width="410.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<circle cx="582.0" cy="188.0" r="11" fill="#EA580C"/>
<text x="582.0" y="192.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="602.0" y="192.0" font-size="12.5" font-weight="700" fill="#EA580C" text-anchor="start">Lệnh stop MUA thức dậy</text>
<text x="602.0" y="212.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Chốt lỗ của người bán và lệnh “mua khi phá” trở thành lệnh</text>
<text x="602.0" y="228.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">mua thị trường.</text>
<rect x="562.0" y="248.0" width="410.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<circle cx="582.0" cy="268.0" r="11" fill="#EA580C"/>
<text x="582.0" y="272.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="602.0" y="272.0" font-size="12.5" font-weight="700" fill="#EA580C" text-anchor="start">Giá nhảy lên một bậc</text>
<text x="602.0" y="292.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh mua ăn hết người bán đang xếp hàng gần nhất. Giá</text>
<text x="602.0" y="308.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">phải lên cao hơn để tìm người bán tiếp.</text>
<rect x="562.0" y="328.0" width="410.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
<circle cx="582.0" cy="348.0" r="11" fill="#15803D"/>
<text x="582.0" y="352.0" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4a</text>
<text x="602.0" y="352.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">Đi tiếp (breakout thật)</text>
<text x="602.0" y="372.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Người mua mới kéo đến, người bán rút lui. Lệnh stop vừa</text>
<text x="602.0" y="388.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">kích hoạt còn tiếp thêm đà.</text>
<rect x="562.0" y="408.0" width="410.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<circle cx="582.0" cy="428.0" r="11" fill="#EA580C"/>
<text x="582.0" y="432.0" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4b</text>
<text x="602.0" y="432.0" font-size="12.5" font-weight="700" fill="#EA580C" text-anchor="start">Quay về (ứng viên Manipulation)</text>
<text x="602.0" y="452.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Gặp người bán đứng chờ hoặc người chốt lời; người mua mới</text>
<text x="602.0" y="468.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">không đến. Lực mua cạn → giá rơi lại.</text>
<rect x="28.0" y="548.0" width="944.0" height="65.1" rx="8" fill="#E6F7F4" stroke="#0F766E" stroke-width="1"/>
<text x="38.0" y="570.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">[CƠ CHẾ — nghiên cứu lệnh FX của Osler, NY Fed] Lệnh stop có xu hướng làm xu hướng MẠNH THÊM (giá chạy tiếp, có khi thành “thác”), còn lệnh chốt lời tụ ở</text>
<text x="38.0" y="586.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">số tròn có xu hướng làm giá DỪNG lại. Hệ quả: một cú quét stop tự nó không phải lý do để đoán đảo chiều. Bằng chứng đảo chiều phải đến SAU đó (giá quay về,</text>
<text x="38.0" y="603.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không đi tiếp, rồi đi mạnh về phía ngược lại).</text>
</svg>
