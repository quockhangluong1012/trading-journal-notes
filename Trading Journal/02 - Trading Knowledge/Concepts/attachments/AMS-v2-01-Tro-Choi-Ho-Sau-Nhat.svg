<text x="500.0" y="545.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Điều quan trọng: hố lớn (LTL) vẫn chính là cái hố e của vòng 1. Nó không đổi. Chỉ có thêm "huy chương" sau mỗi vòng.</text>
