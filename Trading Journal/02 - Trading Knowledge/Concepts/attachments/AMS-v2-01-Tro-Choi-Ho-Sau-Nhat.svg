<text x="300.0" y="318.0" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">chưa có bạn bên trái</text>
<text x="888.0" y="338.0" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">chưa có bạn bên phải</text>
<text x="552.0" y="341.0" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">e sâu hơn → d thua</text>
<text x="28.0" y="431.0" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start">Vòng 3 — Hố lớn (LTL)</text>
<text x="28.0" y="453.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Chỉ ba hố thắng vòng 2 đứng</text>
<text x="28.0" y="469.1" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">cạnh nhau. Hố sâu hơn hai</text>
<text x="28.0" y="485.2" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">bạn bên cạnh thắng: e.</text>
