<text x="28.0" y="276.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">Vòng 2 — Hố vừa (ITL)</text>
<text x="28.0" y="298.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Hố nào SÂU HƠN cả hai hố</text>
<text x="28.0" y="314.1" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">bên cạnh thì thắng vòng 2.</text>
<text x="28.0" y="330.2" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Thắng: b, e, g.</text>
