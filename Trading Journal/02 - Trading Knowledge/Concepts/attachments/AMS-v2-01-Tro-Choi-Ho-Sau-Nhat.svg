<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Trò chơi "hố nào sâu nhất" — ba vòng thi</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi cái hố là một đáy. Mỗi vòng chỉ so một hố với HAI hố đứng cạnh nó trong cùng vòng.</text>
<rect x="917.2" y="22.0" width="54.8" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="944.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ELI5</text>
<text x="28.0" y="124.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">Vòng 1 — Hố nhỏ (STL)</text>
<text x="28.0" y="146.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Bé đi dọc đường và đếm</text>
<text x="28.0" y="162.1" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">mọi cái hố mình gặp.</text>
<text x="28.0" y="178.2" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Hố nào cũng được vào vòng 1.</text>
