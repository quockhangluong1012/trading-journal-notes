<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">CHoCH đầu tiên sau trend dài: tỷ lệ giữ hướng</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">Backtest 240 mẫu H1/H4 - EURUSD, GBPUSD, XAUUSD - trend trước đó ≥15 chân swing liên tiếp</text>

  <!-- Chart area -->
  <line x1="120" y1="600" x2="1180" y2="600" stroke="#2a2e39" stroke-width="2"/>
  <line x1="120" y1="140" x2="120" y2="600" stroke="#2a2e39" stroke-width="2"/>

  <!-- Y axis labels -->
  <text x="100" y="605" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">0%</text>
  <text x="100" y="465" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">30%</text>
  <text x="100" y="325" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">50%</text>
  <text x="100" y="185" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">70%</text>

  <line x1="120" y1="460" x2="1180" y2="460" stroke="#2a2e39" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="120" y1="320" x2="1180" y2="320" stroke="#2a2e39" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="120" y1="180" x2="1180" y2="180" stroke="#2a2e39" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Bars: CHoCH #1 34%, #2 49%, #3 71% -->
  <!-- scale: 0% at y=600, 70%->y=180, so per % = (600-180)/70 = 6 px -->
  <rect x="260" y="396" width="160" height="204" fill="#ff6b6b" opacity="0.75" rx="3"/>
  <text x="340" y="380" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ff6b6b">34%</text>
  <text x="340" y="630" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#d1d4dc">CHoCH #1</text>
  <text x="340" y="650" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">giữ hướng 10 nến</text>

  <rect x="560" y="306" width="160" height="294" fill="#f2c94c" opacity="0.75" rx="3"/>
  <text x="640" y="290" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#f2c94c">49%</text>
  <text x="640" y="630" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#d1d4dc">CHoCH #2</text>
  <text x="640" y="650" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">sau khi #1 fail</text>

  <rect x="860" y="174" width="160" height="426" fill="#26a69a" opacity="0.8" rx="3"/>
  <text x="940" y="158" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#26a69a">71%</text>
  <text x="940" y="630" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#d1d4dc">CHoCH #3</text>
  <text x="940" y="650" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">sau khi #1, #2 fail</text>

  <text x="640" y="685" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#787b86">Trend càng dài, càng cần nhiều lần CHoCH mới đảo thật</text>
  <text x="640" y="705" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Nguồn: backtest nội bộ, khung H1/H4, xem EC-B1</text>
</svg>
