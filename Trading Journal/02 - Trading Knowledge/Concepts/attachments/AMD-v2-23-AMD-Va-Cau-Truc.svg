<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">AMD và cấu trúc thị trường: đỉnh/đáy nào mới thật sự đáng quan tâm?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ bullish. Trong pha M, cấu trúc nhỏ trông như đang GIẢM (đáy thấp hơn). MSS có ý nghĩa là khi giá phá ĐỈNH đã khởi động cú giảm</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">cuối cùng — không phải bất kỳ đỉnh vụn nào.</text>
