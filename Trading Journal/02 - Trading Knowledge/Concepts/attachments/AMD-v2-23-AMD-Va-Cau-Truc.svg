<text x="436.3" y="273.8" font-size="10" font-weight="600" fill="#64748B" text-anchor="start">LH vụn bên trong — phá nó chưa</text>
<text x="436.3" y="286.8" font-size="10" font-weight="600" fill="#64748B" text-anchor="start">nói lên nhiều</text>
<rect x="28.0" y="512.0" width="466.0" height="64.4" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="1"/>
<text x="38.0" y="533.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc NỘI BỘ (khung nhỏ) đổi hướng nhiều lần trong một ngày. Cấu trúc</text>
<text x="38.0" y="550.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">BÊN NGOÀI (khung lớn) là bối cảnh: trong ví dụ này D1 vẫn tăng suốt — cú</text>
<text x="38.0" y="566.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">giảm trong M chỉ là nội bộ.</text>
<rect x="506.0" y="512.0" width="466.0" height="64.4" rx="8" fill="#EEF0FF" stroke="#4338CA" stroke-width="1"/>
<text x="516.0" y="533.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Một MSS có ý nghĩa thường: phá đúng đỉnh/đáy đã tạo ra cú lệch, phá bằng</text>
<text x="516.0" y="550.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">thân nến (không chỉ râu), có displacement đi kèm, và xảy ra SAU một sự kiện</text>
<text x="516.0" y="566.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">liquidity. [ICT] Thiếu mắt xích → MSS yếu.</text>
