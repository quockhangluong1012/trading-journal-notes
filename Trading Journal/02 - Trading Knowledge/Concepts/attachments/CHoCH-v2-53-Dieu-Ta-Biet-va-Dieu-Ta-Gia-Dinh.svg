<text x="142.0" y="121.5" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="middle">QUAN SÁT ĐƯỢC</text>
<text x="44.0" y="168.5" font-size="12" font-weight="700" fill="#15803D">•</text>
<text x="56.0" y="168.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">Giá tạo đỉnh/đáy; chuỗi HH–HL</text>
<text x="56.0" y="185.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">hoặc LH–LL</text>
<text x="44.0" y="215.1" font-size="12" font-weight="700" fill="#15803D">•</text>
<text x="56.0" y="215.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">Một thân nến đóng ngoài một</text>
<text x="56.0" y="232.4" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">mức</text>
<text x="44.0" y="261.8" font-size="12" font-weight="700" fill="#15803D">•</text>
<text x="56.0" y="261.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">Chân sóng nhanh/chậm,</text>
<text x="56.0" y="279.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">có/không để lại FVG</text>
<text x="44.0" y="308.4" font-size="12" font-weight="700" fill="#15803D">•</text>
<text x="56.0" y="308.4" font-size="12.2" font-weight="400" fill="#111827" data-bx="55.0,243.0">Có râu đi qua đỉnh/đáy cũ</text>
<rect x="266.0" y="92.5" width="228.0" height="470.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="266.0" y="92.5" width="228.0" height="46.0" rx="12" fill="#2563EB" fill-opacity="0.12"/>
<text x="380.0" y="121.5" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="middle">ĐỊNH NGHĨA / QUY ƯỚC</text>
<text x="282.0" y="168.5" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="294.0" y="168.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="293.0,481.0">Tên CHoCH, BOS, MSS</text>
<text x="282.0" y="197.8" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="294.0" y="197.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="293.0,481.0">Protected = gốc chân tạo BOS</text>
<text x="294.0" y="215.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="293.0,481.0">gần nhất</text>
<text x="282.0" y="244.4" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="294.0" y="244.4" font-size="12.2" font-weight="400" fill="#111827" data-bx="293.0,481.0">Internal vs external</text>
<text x="282.0" y="273.8" font-size="12" font-weight="700" fill="#2563EB">•</text>
<text x="294.0" y="273.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="293.0,481.0">Thang G0–G3, cửa sổ chấp</text>
<text x="294.0" y="291.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="293.0,481.0">nhận</text>
