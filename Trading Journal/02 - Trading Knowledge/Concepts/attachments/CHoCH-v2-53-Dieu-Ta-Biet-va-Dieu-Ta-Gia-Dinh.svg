<rect x="504.0" y="92.5" width="228.0" height="46.0" rx="12" fill="#B45309" fill-opacity="0.12"/>
<text x="618.0" y="121.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI HỢP LÝ</text>
<text x="520.0" y="168.5" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="532.0" y="168.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="531.0,719.0">Bên mua/bán không bảo vệ</text>
<text x="532.0" y="185.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="531.0,719.0">được mức</text>
<text x="520.0" y="215.1" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="532.0" y="215.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="531.0,719.0">Lệnh dừng lỗ đã bị kích hoạt</text>
<text x="520.0" y="244.4" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="532.0" y="244.4" font-size="12.2" font-weight="400" fill="#111827" data-bx="531.0,719.0">Character của dòng lệnh đang</text>
<text x="532.0" y="261.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="531.0,719.0">đổi</text>
<rect x="742.0" y="92.5" width="228.0" height="470.0" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
<rect x="742.0" y="92.5" width="228.0" height="46.0" rx="12" fill="#B91C1C" fill-opacity="0.12"/>
<text x="856.0" y="121.5" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">CHƯA CHẮC — CẦN ĐO</text>
<text x="758.0" y="168.5" font-size="12" font-weight="700" fill="#B91C1C">•</text>
<text x="770.0" y="168.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">Quét trước làm CHoCH tốt hơn</text>
<text x="758.0" y="197.8" font-size="12" font-weight="700" fill="#B91C1C">•</text>
<text x="770.0" y="197.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">Displacement làm CHoCH tốt</text>
<text x="770.0" y="215.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">hơn</text>
<text x="758.0" y="244.4" font-size="12" font-weight="700" fill="#B91C1C">•</text>
<text x="770.0" y="244.4" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">CHoCH tại POI tốt hơn ngoài</text>
<text x="770.0" y="261.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">POI</text>
<text x="758.0" y="291.1" font-size="12" font-weight="700" fill="#B91C1C">•</text>
<text x="770.0" y="291.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">CHoCH có lợi thế giao dịch nói</text>
<text x="770.0" y="308.4" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">chung</text>
<text x="758.0" y="337.7" font-size="12" font-weight="700" fill="#B91C1C">•</text>
<text x="770.0" y="337.7" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">“Smart Money quyết định đảo</text>
<text x="770.0" y="355.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="769.0,957.0">chiều”</text>
