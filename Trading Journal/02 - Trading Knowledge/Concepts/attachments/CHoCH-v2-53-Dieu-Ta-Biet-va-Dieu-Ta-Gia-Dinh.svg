<text x="940.0" y="604.5" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="end">cần bằng chứng</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bảng đầy đủ với từng claim và mức kết luận được ở mục 28 của note.</text>
