<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
  <text x="24" y="30" font-size="18" font-weight="700" fill="currentColor">Sweep → Reclaim → MSS → Displacement → FVG</text>
  <text x="24" y="50" font-size="12.5" fill="var(--muted)">Cận cảnh khúc quanh M → D. Thiếu bất kỳ mắt xích nào thì thesis yếu đi một bậc.</text>
  <line x1="40" y1="140" x2="300" y2="140" stroke="var(--border)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="44" y="132" font-size="11" fill="var(--muted)">đáy range / swing gần nhất</text>
  <line x1="40" y1="230" x2="620" y2="230" stroke="var(--error)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="44" y="244" font-size="11" fill="var(--error)">SSL bị quét</text>
  <path d="M40,180 L100,170 L160,185 L220,172 L280,182 L330,196 L370,248 L400,210 L430,188 L470,170 L520,130 L560,138 L620,100 L670,108 L740,72 L800,78 L860,55" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="370" cy="248" r="5" fill="var(--warning)"/>
  <text x="300" y="272" font-size="11.5" font-weight="700" fill="var(--warning)">① Sweep: wick xuyên SSL, kích hoạt stop</text>
  <circle cx="430" cy="188" r="5" fill="var(--success)"/>
  <text x="442" y="180" font-size="11.5" font-weight="700" fill="var(--success)">② Reclaim: đóng lại trong range</text>
  <text x="530" y="122" font-size="11.5" font-weight="700" fill="var(--success)">③ MSS + displacement</text>
  <rect x="540" y="108" width="110" height="44" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="548" y="126" font-size="11" fill="var(--accent)">④ FVG → entry</text>
  <text x="548" y="143" font-size="11" fill="var(--accent)">Stop dưới đáy Judas</text>
  <line x1="370" y1="253" x2="620" y2="253" stroke="var(--error)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="628" y="257" font-size="11" fill="var(--error)">cực điểm Judas = stop</text>
  <text x="40" y="310" font-size="12" fill="var(--fg)">Sweep ≠ breakout thật: sweep quay lại (reclaim), breakout thật giữ giá ngoài range (trend day, §38).</text>
  <text x="40" y="332" font-size="12" fill="var(--muted)">Nến quét đẹp: wick dài / body nhỏ tương đối, đóng lại trong range; nến distribution đẹp: body đặc, ít wick, đóng ngoài range.</text>
  <text x="40" y="354" font-size="12" fill="var(--muted)">Không có FVG rõ vẫn trade được nếu displacement + MSS sạch — FVG là refine entry, không phải điều kiện bắt buộc.</text>
</svg>
