<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Rejection ban đầu bị vô hiệu: giá quay lại, đóng trên L hai lần và đi tiếp. Không phải &quot;sweep thất bại&quot; chung chung — ghi đúng trạng thái.</text>
