<line x1="150.0" y1="154.2" x2="612.0" y2="154.2" stroke="#C2410C" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="44.0" y="148.2" font-size="10.5" fill="#C2410C" font-weight="700" text-anchor="start">BSL kế tiếp (L₂ trong danh sách)</text>
<text x="360.0" y="225.9" font-size="10.5" fill="#C2410C" font-weight="700" text-anchor="start">&quot;sweep&quot;</text>
<rect x="638.0" y="74.0" width="278.0" height="440.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="650.0" y="96.0" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">Ghi nhận theo thời gian</text>
<rect x="648.0" y="116.0" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.2"/>
<text x="655.0" y="133.0" font-size="11" fill="#C2410C" font-weight="700" text-anchor="start">T3 · Đã xác nhận</text>
<text x="655.0" y="149.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Close &lt; L−δ → nhãn SWEEP (E3) — đúng</text>
<text x="655.0" y="163.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">định nghĩa tại thời điểm đó.</text>
<rect x="648.0" y="178.3" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<text x="655.0" y="195.3" font-size="11" fill="#15803D" font-weight="700" text-anchor="start">T4 · Thông tin mới</text>
<text x="655.0" y="212.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">2 close liên tiếp &gt; L → acceptance. Ghi THÊM</text>
<text x="655.0" y="226.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">dòng &quot;rejection failed&quot;; không xóa nhãn T3.</text>
<rect x="648.0" y="240.6" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<text x="655.0" y="257.6" font-size="11" fill="#15803D" font-weight="700" text-anchor="start">Phân loại cập nhật</text>
<text x="655.0" y="274.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Chuyển trạng thái S1: sweep → RUN nếu</text>
<text x="655.0" y="288.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">L₂ cũng được chấp nhận (DEF-LS-05).</text>
<rect x="648.0" y="302.9" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="655.0" y="319.9" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Không được làm</text>
<text x="655.0" y="336.8" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Gọi lại T3 là &quot;không phải sweep&quot; sau khi</text>
<text x="655.0" y="350.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">biết kết quả (sửa lịch sử = hindsight).</text>
<rect x="648.0" y="365.1" width="258.0" height="40.4" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<text x="655.0" y="382.1" font-size="11" fill="#6B7280" font-weight="700" text-anchor="start">Theo dõi tiếp</text>
<text x="655.0" y="399.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Phản ứng tại L₂; trạng thái run H1.</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Một sweep theo định nghĩa không hứa hẹn đảo chiều. Nếu bạn xóa các Case B khỏi journal, tỷ lệ &quot;sweep → đảo chiều&quot; của bạn sẽ</text>
<text x="40.0" y="559.5" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">bị thổi phồng. Case B là dữ liệu quan trọng nhất để đo xem bộ lọc (MSS + displacement + bối cảnh HTF) có giá trị không.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-16-Case-B-Sweep-Roi-Tiep-Dien · Nến minh họa, giá giả định. T0…T5 = thứ tự thông tin xuất hiện; chỉ T5 là thông tin hậu kiểm (ex-post).</text>
