<svg viewBox="0 0 760 492" width="760" height="492" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>DOL lồng nhau (nested): bốn tầng, mỗi tầng một vai</title>
<desc>Bốn tầng DOL: tuần/tháng, ngày, phiên, thực thi. Mỗi tầng có ứng viên, vai trò và sự kiện được phép đổi nó. M5 không có DOL riêng.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="492" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">DOL lồng nhau (nested): bốn tầng, mỗi tầng một vai</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Sự kiện ở tầng dưới KHÔNG đổi được DOL của tầng trên. Trigger và target phải thuộc hai tầng khác nhau.</text>
<rect x="24" y="76" width="712" height="28" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="32" y="95" font-size="11.5" fill="#6B7280" font-weight="700">Tầng</text>
<text x="140" y="95" font-size="11.5" fill="#6B7280" font-weight="700">Ứng viên điển hình</text>
<text x="364" y="95" font-size="11.5" fill="#6B7280" font-weight="700">Vai trò</text>
<text x="536" y="95" font-size="11.5" fill="#6B7280" font-weight="700">Sự kiện được phép đổi</text>
<rect x="24" y="112" width="712" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="112" width="100" height="72" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.2"/>
<text x="34" y="152" font-size="12.5" fill="#1F2937" font-weight="700">Tuần / tháng</text>
<text x="140" y="136" font-size="11" fill="#4B5563">PWH/PWL, đỉnh/đáy tháng, đỉnh/đáy</text>
<text x="140" y="150.9" font-size="11" fill="#4B5563">20–60 ngày, FVG W1/D1</text>
<text x="364" y="136" font-size="11" fill="#4B5563">Đích “chiến lược”, dành</text>
<text x="364" y="150.9" font-size="11" fill="#4B5563">cho runner</text>
<text x="536" y="136" font-size="11" fill="#4B5563">MSS trên D1/W1, hoặc nến D1</text>
<text x="536" y="150.9" font-size="11" fill="#4B5563">đóng cửa chấp nhận vượt mức</text>
<rect x="24" y="192" width="712" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="192" width="100" height="72" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="34" y="232" font-size="12.5" fill="#1F2937" font-weight="700">Ngày</text>
<text x="140" y="216" font-size="11" fill="#4B5563">PDH/PDL, swing D1, FVG D1/H4,</text>
<text x="140" y="230.9" font-size="11" fill="#4B5563">NWOG/NDOG</text>
<text x="364" y="216" font-size="11" fill="#4B5563">DOL của Daily Bias; dùng</text>
<text x="364" y="230.9" font-size="11" fill="#4B5563">làm T2</text>
<text x="536" y="216" font-size="11" fill="#4B5563">MSS trên H4/H1 có displacement</text>
<rect x="24" y="272" width="712" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="272" width="100" height="72" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="34" y="312" font-size="12.5" fill="#1F2937" font-weight="700">Phiên</text>
<text x="140" y="296" font-size="11" fill="#4B5563">High/low phiên Á và London,</text>
<text x="140" y="310.9" font-size="11" fill="#4B5563">EQH/EQL H1, FVG H1</text>
<text x="364" y="296" font-size="11" fill="#4B5563">T1 (trạm trung gian)</text>
<text x="364" y="310.9" font-size="11" fill="#4B5563">hoặc “nhiên liệu” cho</text>
<text x="364" y="325.79999999999995" font-size="11" fill="#4B5563">Judas</text>
<text x="536" y="296" font-size="11" fill="#4B5563">MSS trên M15/M5</text>
<rect x="24" y="352" width="712" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="352" width="100" height="72" rx="8" fill="#FCEBE4" stroke="#D85A30" stroke-width="1.2"/>
<text x="34" y="392" font-size="12.5" fill="#1F2937" font-weight="700">Thực thi</text>
<text x="140" y="376" font-size="11" fill="#4B5563">Swing M5/M1</text>
<text x="364" y="376" font-size="11" fill="#4B5563">KHÔNG phải DOL: chỉ là</text>
<text x="364" y="390.9" font-size="11" fill="#4B5563">trigger và công cụ quản</text>
<text x="364" y="405.79999999999995" font-size="11" fill="#4B5563">lý lệnh</text>
<text x="536" y="376" font-size="11" fill="#4B5563">—</text>
<rect x="24" y="440" width="712" height="34" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="38" y="462" font-size="11" fill="#92400E" font-weight="700">Tầng dưới luôn là: (a) bậc thang cùng chiều DOL tầng trên, hoặc (b) nhịp retrace về IRL. Không có khả năng thứ ba.</text>
</svg>
