<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0.0" y="0.0" width="940.0" height="560.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Baseline hình học: phần nào chỉ là khoảng cách?</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Random walk không drift bắt đầu giữa hai mức: P(chạm mức gần trước) = d_xa / (d_gần + d_xa). Đây là toán, không phải dữ liệu thị trường.</text>
<rect x="810.5" y="16.0" width="105.5" height="20.0" rx="10.0" fill="#1D4ED8"/>
<text x="863.2" y="30.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">MATHEMATICAL</text>
<rect x="90.0" y="92.0" width="520.0" height="334.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
