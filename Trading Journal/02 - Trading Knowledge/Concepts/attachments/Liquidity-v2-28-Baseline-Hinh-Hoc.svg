<text x="82.0" y="296.4" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="end">70%</text>
<line x1="90.0" y1="225.6" x2="610.0" y2="225.6" stroke="#F3F4F6" stroke-width="1"/>
<text x="82.0" y="229.6" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="end">80%</text>
<line x1="90.0" y1="158.8" x2="610.0" y2="158.8" stroke="#F3F4F6" stroke-width="1"/>
<text x="82.0" y="162.8" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="end">90%</text>
<line x1="90.0" y1="92.0" x2="610.0" y2="92.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="82.0" y="96.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="end">100%</text>
<line x1="90.0" y1="92.0" x2="90.0" y2="426.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="90.0" y="444.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="middle">1×</text>
<line x1="194.0" y1="92.0" x2="194.0" y2="426.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="194.0" y="444.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="middle">2×</text>
<line x1="298.0" y1="92.0" x2="298.0" y2="426.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="298.0" y="444.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="middle">3×</text>
<line x1="402.0" y1="92.0" x2="402.0" y2="426.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="402.0" y="444.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="middle">4×</text>
<line x1="506.0" y1="92.0" x2="506.0" y2="426.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="506.0" y="444.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="middle">5×</text>
<line x1="610.0" y1="92.0" x2="610.0" y2="426.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="610.0" y="444.0" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="middle">6×</text>
<text x="350.0" y="464.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="middle">Tỷ lệ khoảng cách d_xa / d_gần</text>
<text x="38.0" y="259.0" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="middle" transform="rotate(-90 38 259.0)">P(mức gần bị chạm trước)</text>
<path d="M90.0,426.0 L95.2,417.9 L100.4,410.1 L105.6,402.7 L110.8,395.6 L116.0,388.9 L121.2,382.4 L126.4,376.3 L131.6,370.3 L136.8,364.7 L142.0,359.2 L147.2,354.0 L152.4,348.9 L157.6,344.1 L162.8,339.4 L168.0,334.9 L173.2,330.6 L178.4,326.4 L183.6,322.3 L188.8,318.4 L194.0,314.7 L199.2,311.0 L204.4,307.5 L209.6,304.1 L214.8,300.8 L220.0,297.5 L225.2,294.4 L230.4,291.4 L235.6,288.5 L240.8,285.6 L246.0,282.9 L251.2,280.2 L256.4,277.6 L261.6,275.0 L266.8,272.5 L272.0,270.1 L277.2,267.8 L282.4,265.5 L287.6,263.3 L292.8,261.1 L298.0,259.0 L303.2,256.9 L308.4,254.9 L313.6,253.0 L318.8,251.0 L324.0,249.2 L329.2,247.3 L334.4,245.6 L339.6,243.8 L344.8,242.1 L350.0,240.4 L355.2,238.8 L360.4,237.2 L365.6,235.7 L370.8,234.1 L376.0,232.6 L381.2,231.2 L386.4,229.7 L391.6,228.3 L396.8,226.9 L402.0,225.6 L407.2,224.3 L412.4,223.0 L417.6,221.7 L422.8,220.5 L428.0,219.2 L433.2,218.0 L438.4,216.9 L443.6,215.7 L448.8,214.6 L454.0,213.5 L459.2,212.4 L464.4,211.3 L469.6,210.2 L474.8,209.2 L480.0,208.2 L485.2,207.2 L490.4,206.2 L495.6,205.2 L500.8,204.3 L506.0,203.3 L511.2,202.4 L516.4,201.5 L521.6,200.6 L526.8,199.7 L532.0,198.9 L537.2,198.0 L542.4,197.2 L547.6,196.4 L552.8,195.6 L558.0,194.8 L563.2,194.0 L568.4,193.2 L573.6,192.5 L578.8,191.7 L584.0,191.0 L589.2,190.2 L594.4,189.5 L599.6,188.8 L604.8,188.1 L610.0,187.4" stroke="#1D4ED8" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="90.0" cy="426.0" r="5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="98.0" y="442.0" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">50%</text>
<circle cx="194.0" cy="314.7" r="5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="202.0" y="330.7" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">67%</text>
<circle cx="298.0" cy="259.0" r="5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="306.0" y="275.0" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">75%</text>
<circle cx="402.0" cy="225.6" r="5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="410.0" y="241.6" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">80%</text>
<rect x="632.0" y="100.0" width="284.0" height="134.6" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="641.0" y="119.3" font-size="11.3" fill="#1D4ED8" font-weight="700" text-anchor="start">Đọc biểu đồ thế nào</text>
<text x="641.0" y="136.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Mức gần cách 1 ATR, mức xa cách 3 ATR:</text>
<text x="641.0" y="151.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">P(gần trước) = 3 / (1 + 3) = 75%.</text>
<text x="641.0" y="166.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">Nếu journal của bạn ghi &quot;78% lần giá lấy</text>
<text x="641.0" y="181.4" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">liquidity gần trước&quot;, thì ~75 điểm % đến</text>
<text x="641.0" y="196.3" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">từ hình học. Phần vượt baseline (~3 điểm %)</text>
<text x="641.0" y="211.2" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">mới là thứ cần giải thích — và cần mẫu</text>
<text x="641.0" y="226.1" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">lớn để phân biệt với nhiễu.</text>
<rect x="632.0" y="300.0" width="284.0" height="119.7" rx="7" fill="#FFF7E6" stroke="#B45309" stroke-width="1.2"/>
<text x="641.0" y="319.3" font-size="11.3" fill="#B45309" font-weight="700" text-anchor="start">Giới hạn của baseline đơn giản</text>
<text x="641.0" y="336.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Drift (xu hướng) làm lệch về phía drift.</text>
<text x="641.0" y="351.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Cửa sổ thời gian hữu hạn: cả hai mức</text>
<text x="641.0" y="366.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">  có thể không bị chạm.</text>
<text x="641.0" y="381.4" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Biến động thay đổi theo phiên.</text>
<text x="641.0" y="396.3" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">→ Baseline nâng cao: mô phỏng trên chính</text>
<text x="641.0" y="411.2" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">  dữ liệu của bạn (block bootstrap).</text>
<rect x="24.0" y="494.0" width="892.0" height="40.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="519.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Edge (nếu có) = tỷ lệ quan sát − baseline, đo ngoài mẫu. &quot;Giá tới liquidity gần&quot; tự nó KHÔNG phải bằng chứng cho mô hình ICT.</text>
<text x="24.0" y="546.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-28 · Công thức gambler&#x27;s ruin cho chuyển động Brown không drift (xem [[20-Liquidity-Sweep]] §4.2).</text>
</svg>
