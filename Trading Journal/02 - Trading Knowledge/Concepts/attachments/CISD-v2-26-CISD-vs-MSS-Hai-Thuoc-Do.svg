<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD vs MSS: hai thước đo khác nhau, thường đến ở hai thời điểm khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">CISD đo bằng OPEN của chuỗi nến (thân nến). MSS đo bằng SWING (đỉnh/đáy có ý nghĩa cấu trúc). Trong hình dạng phổ biến này,</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">mốc CISD thấp hơn mốc MSS nên CISD đến trước.</text>
<rect x="896.1" y="22" width="75.9" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="934.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SO SÁNH</text>
<text x="28.0" y="548.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
