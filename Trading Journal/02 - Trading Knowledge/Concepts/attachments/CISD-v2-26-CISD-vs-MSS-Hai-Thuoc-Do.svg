<rect x="650.0" y="108.0" width="322.0" height="77.4" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="662.0" y="132.3" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">CISD hỏi</text>
<text x="662.0" y="154.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“Chặng nến cùng chiều gần nhất đã bị lấy lại hết</text>
<text x="662.0" y="170.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(theo giá đóng cửa) chưa?” → nói về DELIVERY.</text>
<rect x="650.0" y="193.4" width="322.0" height="93.5" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.3"/>
<text x="662.0" y="217.7" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start">MSS hỏi</text>
<text x="662.0" y="239.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“Giá đã đóng vượt một swing có ý nghĩa, theo hướng</text>
<text x="662.0" y="255.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ngược cấu trúc đang theo dõi chưa?” → nói về</text>
<text x="662.0" y="271.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">STRUCTURE.</text>
<rect x="650.0" y="294.8" width="322.0" height="83.4" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="662.0" y="319.2" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Đánh đổi</text>
<circle cx="666.0" cy="337.1" r="2.6" fill="#2563EB" stroke="none" stroke-width="1.2"/>
<text x="676.0" y="340.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">CISD: sớm hơn, điểm vào tốt hơn, nhiễu hơn.</text>
<circle cx="666.0" cy="356.2" r="2.6" fill="#2563EB" stroke="none" stroke-width="1.2"/>
<text x="676.0" y="360.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">MSS: muộn hơn, có thêm bằng chứng cấu trúc.</text>
<rect x="650.0" y="386.2" width="322.0" height="77.4" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="662.0" y="410.5" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Không phải quy luật</text>
<text x="662.0" y="432.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“CISD luôn đến trước MSS” là SAI. Thứ tự phụ thuộc</text>
<text x="662.0" y="448.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hình dạng và cách đếm (xem hình 27).</text>
