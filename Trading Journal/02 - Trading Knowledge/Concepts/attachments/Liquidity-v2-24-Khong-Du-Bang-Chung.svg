<rect x="648.0" y="112.0" width="258.0" height="54.7" rx="7" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<text x="655.0" y="129.0" font-size="11" fill="#15803D" font-weight="700" text-anchor="start">Đã biết</text>
<text x="655.0" y="145.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Cả Asia H và Asia L đều bị xuyên rồi</text>
<text x="655.0" y="160.3" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">close quay lại (E8 — hai phía).</text>
<rect x="648.0" y="174.7" width="258.0" height="54.7" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="655.0" y="191.7" font-size="11" fill="#B45309" font-weight="700" text-anchor="start">Chưa biết</text>
<text x="655.0" y="208.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Phía nào sẽ là hướng sau tin; DOL</text>
<text x="655.0" y="223.0" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">nào (PDH hay PDL) sẽ bị chạm trước.</text>
<rect x="648.0" y="237.4" width="258.0" height="69.1" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="655.0" y="254.4" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Vì sao không kết luận</text>
<text x="655.0" y="271.4" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Không có MSS ở khung setup (H1).</text>
<text x="655.0" y="285.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Không có displacement thật sự.</text>
<text x="655.0" y="300.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Hai phía đối xứng; tin sắp ra (D2).</text>
<rect x="648.0" y="314.5" width="258.0" height="69.1" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="655.0" y="331.5" font-size="11" fill="#B45309" font-weight="700" text-anchor="start">Trạng thái</text>
<text x="655.0" y="348.4" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Liquidity events: ghi đủ, phân loại E8.</text>
<text x="655.0" y="362.8" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">DOL: &quot;chưa rõ&quot; (kịch bản C).</text>
<text x="655.0" y="377.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Hành động: không trade; chờ sau tin.</text>
<rect x="648.0" y="391.5" width="258.0" height="54.7" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="655.0" y="408.5" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">Khi nào mở lại</text>
<text x="655.0" y="425.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Sau tin ≥ 15 phút: vẽ lại danh sách mức</text>
<text x="655.0" y="439.8" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">(biến động đã đổi thang).</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Cố ép một câu chuyện (&quot;London quét Asia L nên hôm nay tăng&quot;) khi bằng chứng hai phía cân bằng là nguồn thua lỗ âm thầm.</text>
<text x="40.0" y="561.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Ghi &quot;UNDETERMINED&quot; vẫn tạo ra dữ liệu: sau 50 phiên, bạn biết những ngày như vậy thực sự diễn biến ra sao.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-24 · Nến M15 minh họa, giá giả định. D2 = điều kiện loại trừ &quot;cửa sổ tin tier-1&quot; trong bộ quy tắc DOL v0.2.</text>
