<text x="665.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">T3</tspan></text>
<rect x="768.6" y="132.7" width="84.4" height="178.6" rx="2" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8" opacity="0.35"/>
<text x="772.6" y="301.9" font-size="10.5" fill="#6B7280" text-anchor="start"><tspan>chưa xảy ra</tspan></text>
<polyline points="673.0,292.5 701.1,226.7 718.0,254.9 751.8,193.8 768.6,217.3 768.6,217.3" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="701.1" y1="226.7" x2="757.4" y2="226.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="718.0" cy="254.9" r="3.6" fill="#1D9E75"/>
<text x="718.0" y="272.9" font-size="11" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<circle cx="733.6" cy="226.7" r="4.5" fill="#1D9E75"/>
<text x="663.0" y="352.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>T3: đã đóng trên 58 và giữ được</tspan></text>
<text x="663.0" y="367.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>(B2). 46 thành protected low.</tspan></text>
<rect x="876.0" y="112.0" width="200.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
