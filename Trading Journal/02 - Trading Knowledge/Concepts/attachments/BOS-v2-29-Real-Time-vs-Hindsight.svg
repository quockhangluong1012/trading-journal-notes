<polyline points="886.0,292.5 914.1,226.7 931.0,254.9 964.8,193.8 981.6,217.3 1009.8,165.6 1026.6,189.1 1054.8,142.1" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="914.1" y1="226.7" x2="970.4" y2="226.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="931.0" cy="254.9" r="3.6" fill="#1D9E75"/>
<text x="931.0" y="272.9" font-size="11" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<circle cx="946.6" cy="226.7" r="4.5" fill="#1D9E75"/>
<text x="876.0" y="352.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>T4 — nhìn lại: mọi thứ trông &quot;rõ</tspan></text>
<text x="876.0" y="367.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>ràng&quot;. Nhưng ở T0–T2 không ai thấy</tspan></text>
<text x="876.0" y="383.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>trước được.</tspan></text>
<rect x="24.0" y="430.0" width="1052.0" height="72.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="24.0" y="430.0" width="5.0" height="72.0" rx="2" fill="#DC2626"/>
<text x="38.0" y="450.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Quy tắc chống hindsight</tspan></text>
<text x="38.0" y="469.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Mỗi nhãn trong journal phải ghi thời điểm nó được biết (known at). Không dùng một swing chỉ xuất hiện ở tương lai để giải thích một BOS trong quá khứ; không đổi swing tham chiếu sau</tspan></text>
<text x="38.0" y="485.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>khi đã thấy kết quả.</tspan></text>
</svg>
