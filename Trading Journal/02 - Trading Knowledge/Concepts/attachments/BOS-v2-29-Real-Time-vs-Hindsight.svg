" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1100" height="516" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Real-time và hindsight: cùng một đoạn giá, ở mỗi thời điểm ta biết những gì?</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Vùng xám là tương lai — lúc đó chưa xảy ra. Chuỗi &quot;HL → HH → HL → BOS → HH&quot; chỉ trông hiển nhiên khi nhìn lại toàn bộ.</tspan></text>
<rect x="24.0" y="112.0" width="200.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="26.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">T0</tspan></text>
<rect x="70.6" y="132.7" width="143.4" height="178.6" rx="2" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8" opacity="0.35"/>
<text x="74.6" y="301.9" font-size="10.5" fill="#6B7280" text-anchor="start"><tspan>chưa xảy ra</tspan></text>
<polyline points="34.0,292.5 62.1,226.7 70.6,240.8" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="62.1" y1="226.7" x2="70.6" y2="226.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="24.0" y="352.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>T0: đỉnh 58 vừa được xác nhận (nến</tspan></text>
<text x="24.0" y="367.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>sau đóng thấp hơn). Chưa có đáy HL</tspan></text>
<text x="24.0" y="383.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>nào.</tspan></text>
<rect x="237.0" y="112.0" width="200.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="239.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">T1</tspan></text>
<rect x="304.7" y="132.7" width="122.3" height="178.6" rx="2" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8" opacity="0.35"/>
<text x="308.7" y="301.9" font-size="10.5" fill="#6B7280" text-anchor="start"><tspan>chưa xảy ra</tspan></text>
<polyline points="247.0,292.5 275.1,226.7 292.0,254.9 304.7,232.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="275.1" y1="226.7" x2="304.7" y2="226.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="237.0" y="352.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>T1: giá dừng giảm ở 46 rồi nhích</tspan></text>
<text x="237.0" y="367.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>lên. 46 CÓ THỂ là HL — chưa chắc.</tspan></text>
<rect x="450.0" y="112.0" width="200.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="452.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">T2</tspan></text>
