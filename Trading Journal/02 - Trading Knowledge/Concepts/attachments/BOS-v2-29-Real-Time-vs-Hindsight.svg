<svg viewBox="0 0 1100 516" width="1100" height="516" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Real-time và hindsight: cùng một đoạn giá, ở mỗi thời điểm ta biết những gì?</title>
<desc>Real-time và hindsight: cùng một đoạn giá, ở mỗi thời điểm ta biết những gì?. Vùng xám là tương lai — lúc đó chưa xảy ra. Chuỗi &quot;HL → HH → HL → BOS → HH&quot; chỉ trông hiển nhiên khi nhìn lại toàn bộ.</desc>
