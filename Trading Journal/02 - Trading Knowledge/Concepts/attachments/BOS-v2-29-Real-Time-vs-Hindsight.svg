<text x="534.3" y="301.9" font-size="10.5" fill="#6B7280" text-anchor="start"><tspan>chưa xảy ra</tspan></text>
<polyline points="460.0,292.5 488.1,226.7 505.0,254.9 530.3,209.1" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="488.1" y1="226.7" x2="530.3" y2="226.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="520.6" cy="226.7" r="4.5" fill="#2563EB"/>
<text x="450.0" y="352.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>T2: giá đang vượt 58. Ứng viên BOS</tspan></text>
<text x="450.0" y="367.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>(B0) — nến chưa đóng.</tspan></text>
