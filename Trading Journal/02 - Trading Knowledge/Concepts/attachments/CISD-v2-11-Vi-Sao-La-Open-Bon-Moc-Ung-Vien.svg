<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao lại là OPEN của nến đầu chặng? So sánh 4 mốc có thể chọn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một chặng xuống, có 4 mốc ứng viên. Mốc càng thấp thì càng dễ vượt (sớm nhưng nhiễu). Mốc càng cao thì càng khó vượt</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">(chắc nhưng muộn). Open đầu chặng nằm ở giữa và có một ý nghĩa rõ: “điểm xuất phát của cả chặng”.</text>
<rect x="869.5" y="22" width="102.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="920.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">VÌ SAO OPEN</text>
<text x="28.0" y="628.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<rect x="28.0" y="108.0" width="560.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="56.8" y1="280.9" x2="56.8" y2="346.6" stroke="#0F9D74" stroke-width="1.3"/>
