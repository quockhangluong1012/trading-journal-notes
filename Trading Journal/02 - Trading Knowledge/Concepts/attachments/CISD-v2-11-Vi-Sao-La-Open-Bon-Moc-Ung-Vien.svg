<line x1="175.0" y1="514.6" x2="574.0" y2="514.6" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="572.0" y="528.1" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">A · đáy chặng (low)</text>
<line x1="175.0" y1="456.1" x2="574.0" y2="456.1" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="572.0" y="469.6" font-size="10.5" font-weight="700" fill="#9CA3AF" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">B · close nến cuối chặng</text>
<line x1="175.0" y1="229.9" x2="574.0" y2="229.9" stroke="#D97706" stroke-width="2.2" stroke-dasharray="8,4"/>
<text x="572.0" y="224.9" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">C · open nến ĐẦU chặng</text>
<line x1="175.0" y1="200.6" x2="574.0" y2="200.6" stroke="#4338CA" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="572.0" y="195.6" font-size="10.5" font-weight="700" fill="#4338CA" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">D · đỉnh swing (high)</text>
<rect x="606.0" y="108.0" width="366.0" height="77.4" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="618.0" y="132.3" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">A · Đáy chặng</text>
<text x="618.0" y="154.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Vượt lên trên đáy là chuyện của mọi cú nảy. Không nói được</text>
<text x="618.0" y="170.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">gì về việc chặng đã bị lấy lại.</text>
<rect x="606.0" y="193.4" width="366.0" height="77.4" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="618.0" y="217.7" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">B · Close nến cuối</text>
<text x="618.0" y="239.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ xóa được nến cuối cùng. Quá gần → báo hiệu liên tục, rất</text>
<text x="618.0" y="255.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nhiễu.</text>
<rect x="606.0" y="278.7" width="366.0" height="93.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="618.0" y="303.1" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">C · Open nến đầu chặng (CISD)</text>
<text x="618.0" y="324.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đây là chỗ cả chặng bắt đầu. Đóng cửa trên mốc này = mọi</text>
<text x="618.0" y="340.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bước xuống của chặng đều đã bị đi ngược lại. Đủ “ý nghĩa” mà</text>
<text x="618.0" y="357.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">vẫn còn sớm.</text>
<rect x="606.0" y="380.2" width="366.0" height="77.4" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.3"/>
<text x="618.0" y="404.5" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start">D · Đỉnh swing (MSS)</text>
<text x="618.0" y="426.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phải vượt cả râu nến cao nhất trước chặng. Chắc hơn về cấu</text>
<text x="618.0" y="442.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">trúc, nhưng thường đến muộn hơn — điểm vào kém hơn.</text>
<rect x="606.0" y="465.5" width="366.0" height="109.6" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="618.0" y="489.9" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Giới hạn trung thực</text>
<text x="618.0" y="511.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Open là một con số do lưới thời gian của chart tạo ra (khung,</text>
<text x="618.0" y="527.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">múi giờ). Nó không phải “dấu vân tay” của ai cả. Giá trị của</text>
<text x="618.0" y="543.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nó là một cách TÓM TẮT gọn: chặng đã bị lấy lại hết hay</text>
<text x="618.0" y="559.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chưa.</text>
</svg>
