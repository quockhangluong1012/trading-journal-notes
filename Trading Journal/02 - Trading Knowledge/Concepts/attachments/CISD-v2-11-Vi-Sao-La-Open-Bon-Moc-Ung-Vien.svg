<line x1="322.8" y1="416.0" x2="322.8" y2="514.6" stroke="#E0464B" stroke-width="1.3"/>
<rect x="314.2" y="423.3" width="17.1" height="32.8" fill="#E0464B" stroke="#E0464B" stroke-width="0.6"/>
