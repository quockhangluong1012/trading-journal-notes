<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Horizon quan trọng đến mức nào? P(chạm mức d ATR trong T ngày)</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Mô hình ngẫu nhiên không xu hướng. “PWH sẽ bị lấy” mà không có horizon thì gần như luôn đúng.</text>
