<svg viewBox="0 0 760 512" width="760" height="512" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Horizon quan trọng đến mức nào? P(chạm mức d ATR trong T ngày)</title>
