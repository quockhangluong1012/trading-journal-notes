<rect x="596" y="96" width="128" height="210" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="606" y="116" font-size="10" fill="#92400E" font-weight="700">Mức cách 1 ATR bị</text>
<text x="606" y="129.5" font-size="10" fill="#92400E" font-weight="700">chạm ngay trong</text>
<text x="606" y="143.0" font-size="10" fill="#92400E" font-weight="700">ngày: baseline chỉ</text>
<text x="606" y="156.5" font-size="10" fill="#92400E" font-weight="700">11%. Nếu các dự</text>
<text x="606" y="170.0" font-size="10" fill="#92400E" font-weight="700">báo DOL trong ngày</text>
<text x="606" y="183.5" font-size="10" fill="#92400E" font-weight="700">của bạn chạm 30% ở</text>
<text x="606" y="197.0" font-size="10" fill="#92400E" font-weight="700">khoảng cách đó, đó</text>
<text x="606" y="210.5" font-size="10" fill="#92400E" font-weight="700">mới là tín hiệu.</text>
<rect x="24" y="430" width="712" height="70" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="38" y="450" font-size="11" fill="#4B5563">Thị trường thật có đuôi dày, có xu hướng và biến động dồn thành cụm, nên bảng này chỉ là mốc lý thuyết. Hãy thay</text>
<text x="38" y="464.9" font-size="11" fill="#4B5563">bằng baseline thực nghiệm từ chính dữ liệu của bạn: chọn các thời điểm ngẫu nhiên và đo tỷ lệ chạm theo từng</text>
<text x="38" y="479.79999999999995" font-size="11" fill="#4B5563">khoảng cách.</text>
