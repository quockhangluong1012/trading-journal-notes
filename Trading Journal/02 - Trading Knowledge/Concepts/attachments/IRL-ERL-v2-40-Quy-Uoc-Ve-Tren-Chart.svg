<text x="42.0" y="605.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ba thói quen: (1) mỗi khi một mức bị lấy, đổi nó sang xám NGAY — đừng để chart “nói dối”. (2) Chỉ một DOL tại một thời điểm. (3) Ghi khung vào nhãn; một mức</text>
<text x="42.0" y="621.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không có khung là một mức gây nhầm.</text>
