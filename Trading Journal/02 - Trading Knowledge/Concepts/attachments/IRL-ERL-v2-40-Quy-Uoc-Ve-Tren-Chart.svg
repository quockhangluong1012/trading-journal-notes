<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Quy ước vẽ IRL/ERL trên TradingView — để chart tự kể trạng thái liquidity</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một hệ màu và nét cố định giúp bạn nhìn chart là biết ngay: cái gì còn, cái gì đã bị lấy, cái gì là đích. Gợi ý — chỉnh theo thói quen của bạn.</text>
