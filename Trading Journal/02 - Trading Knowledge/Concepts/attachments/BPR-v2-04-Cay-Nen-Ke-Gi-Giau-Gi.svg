<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="518" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="886.7" y="22" width="85.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="929.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Một cây nến kể gì — và giấu gì</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Nến chỉ ghi bốn con số: Mở (O), Cao nhất (H), Thấp nhất (L), Đóng (C). Đường đi bên trong nến, khối lượng và người giao dịch đều không hiện ra.</text>
<rect x="28.0" y="86.0" width="300.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Một nến tăng</text>
<line x1="178.0" y1="174.4" x2="178.0" y2="391.8" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="168.0" y="210.6" width="20.0" height="144.9" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="192.0" y1="174.4" x2="218.0" y2="174.4" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2"/>
<text x="222.0" y="178.4" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">H — cao nhất</text>
<line x1="192.0" y1="210.6" x2="218.0" y2="210.6" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2"/>
<text x="222.0" y="214.6" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">C — đóng cửa</text>
<line x1="192.0" y1="355.5" x2="218.0" y2="355.5" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2"/>
<text x="222.0" y="359.5" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">O — mở cửa</text>
<line x1="192.0" y1="391.8" x2="218.0" y2="391.8" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2"/>
<text x="222.0" y="395.8" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">L — thấp nhất</text>
<text x="160.0" y="287.1" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">thân</text>
<text x="164.0" y="192.8" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">bóng trên</text>
<text x="164.0" y="381.3" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">bóng dưới</text>
<rect x="346.0" y="86.0" width="200.0" height="260.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="356.0" y="106.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Đường đi 1: xuống trước, lên sau</text>
<polyline points="366.0,276.0 396.0,296.0 478.5,176.0 516.0,196.0" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="361.0" y1="176.0" x2="531.0" y2="176.0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="361.0" y1="296.0" x2="531.0" y2="296.0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
<text x="531.0" y="172.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end">H</text>
<text x="531.0" y="309.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end">L</text>
<rect x="558.0" y="86.0" width="200.0" height="260.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="568.0" y="106.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Đường đi 2: lên trước, sụt, lên lại</text>
<polyline points="578.0,276.0 623.0,176.0 675.5,296.0 728.0,196.0" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="573.0" y1="176.0" x2="743.0" y2="176.0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="573.0" y1="296.0" x2="743.0" y2="296.0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
<text x="743.0" y="172.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end">H</text>
<text x="743.0" y="309.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end">L</text>
<rect x="770.0" y="86.0" width="200.0" height="260.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="780.0" y="106.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Đường đi 3: lắc qua lắc lại rất lâu</text>
<polyline points="790.0,276.0 805.0,256.0 820.0,286.0 835.0,246.0 850.0,276.0 865.0,236.0 872.5,296.0 895.0,226.0 910.0,176.0 925.0,216.0 940.0,196.0" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="785.0" y1="176.0" x2="955.0" y2="176.0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="785.0" y1="296.0" x2="955.0" y2="296.0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
<text x="955.0" y="172.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end">H</text>
<text x="955.0" y="309.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end">L</text>
<rect x="346.0" y="358.0" width="624.0" height="88.0" rx="10" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="358.0" y="382.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Cả ba đường đi tạo ra CÙNG MỘT cây nến.</text>
<text x="358.0" y="402.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Vì vậy khi nói “FVG là vùng giá không được giao dịch” hay “phe mua đã áp đảo”, ta đang suy ra nhiều hơn</text>
<text x="358.0" y="418.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">những gì cây nến ghi lại. Ta chỉ biết chắc: giá đã chạm tới H, xuống tới L, mở ở O và đóng ở C.</text>
<text x="28.0" y="500.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Bài học cho BPR: mọi kết luận về “ai làm gì” bên trong FVG hay BPR đều là diễn giải, vì nến không cho ta xem đường đi bên trong.</text>
</svg>
