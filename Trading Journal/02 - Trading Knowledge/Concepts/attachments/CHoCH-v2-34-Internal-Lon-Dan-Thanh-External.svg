<rect x="28.0" y="544.5" width="4.0" height="33.4" rx="2" fill="#C026D3"/>
<text x="42.0" y="564.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">Không có quy luật nào nói M5 CHoCH sẽ đi tiếp tới ô 4. Tỷ lệ chuyển từ ô 1 → 2 → 3 → 4 là thứ cần ĐO trên dữ liệu của chính bạn. [BACKTEST REQUIRED]</text>
<text x="28.0" y="609.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cùng logic cho chiều ngược lại. Một H1 CHoCH cũng chỉ là “ô 1” của D1.</text>
