<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Thu hẹp POI từ D1 xuống H1 — hẹp hơn để rõ hơn, không phải hẹp hơn để stop nhỏ hơn</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Zone H1 phải nằm BÊN TRONG vùng D1 và có lý do cấu trúc riêng. Không có zone H1 hợp lệ → dùng nguyên vùng D1, không bịa.</text>
<rect x="26.0" y="84.0" width="420.0" height="490.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="34.0" y="100.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">D1 FVG 1045–1065 nhìn trên H1</text>
<rect x="26.0" y="329.0" width="420.0" height="140.0" rx="2" fill="#DBEAFE" stroke="none" stroke-width="0" opacity="0.7"/>
<line x1="26.0" y1="399.0" x2="446.0" y2="399.0" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="30.0" y="395.0" font-size="10" font-weight="400" fill="#1D4ED8" text-anchor="start">CE 1055 (giữa FVG)</text>
<rect x="236.0" y="329.0" width="210.0" height="70.0" rx="2" fill="#BFDBFE" stroke="none" stroke-width="0" opacity="0.9"/>
<text x="244.4" y="357.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">Zone A 1055–1065 (nửa trên)</text>
<rect x="236.0" y="399.0" width="210.0" height="70.0" rx="2" fill="#E0E7FF" stroke="none" stroke-width="0" opacity="0.9"/>
<text x="244.4" y="437.5" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="start">Zone B 1045–1055 (dự phòng)</text>
<line x1="26.0" y1="224.0" x2="446.0" y2="224.0" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30.0" y="220.0" font-size="10" font-weight="400" fill="#B45309" text-anchor="start">SSL 1080 — pool sẽ bị quét</text>
<line x1="26.0" y1="469.0" x2="446.0" y2="469.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="30.0" y="483.0" font-size="10" font-weight="400" fill="#B91C1C" text-anchor="start">distal 1045 · 2 nến H1 đóng dưới + không reclaim = POI fail</text>
<polyline points="26.0,112.0 76.4,168.0 101.6,140.0 152.0,210.0 177.2,196.0 210.8,245.0 227.6,217.0 261.2,322.0 286.4,350.0 303.2,308.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="462.0" y="84.0" width="512.0" height="236.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="476.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Trình tự thu hẹp (dừng ở bước đầu tiên không có câu trả lời)</text>
<text x="476.0" y="124.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="124.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">1 · Giữ vùng D1 làm khung ngoài — mọi zone H1 phải nằm trong nó</text>
<text x="476.0" y="144.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="144.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">2 · Tìm trong vùng D1: FVG/OB H1 có nguồn gốc displacement, chưa bị</text>
<text x="489.0" y="160.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lấp/mitigate</text>
<text x="476.0" y="181.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="181.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">3 · Ưu tiên zone gần pool sẽ bị quét (SSL 1080) và đúng phía CE</text>
<text x="489.0" y="197.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(long: không quá sâu)</text>
<text x="476.0" y="218.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="218.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">4 · Viết invalidation của zone TRƯỚC khi giá tới</text>
<text x="476.0" y="239.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="239.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">5 · Ghi zone dự phòng và điều kiện chuyển sang nó (cascade)</text>
<rect x="462.0" y="334.0" width="250.0" height="240.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="462.0" y="334.0" width="250.0" height="6.0" rx="3" fill="#15803D" stroke="none" stroke-width="0"/>
<text x="476.0" y="358.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">Thu hẹp hợp lý</text>
<text x="476.0" y="376.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="376.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Zone 5–10 điểm có lý do cấu</text>
<text x="489.0" y="391.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">trúc</text>
<text x="476.0" y="410.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="410.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Có dự phòng (B) và mức fail</text>
<text x="489.0" y="425.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">(1045)</text>
<text x="476.0" y="444.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="489.0" y="444.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Stop theo cấu trúc (dưới</text>
<text x="489.0" y="460.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">sweep), không theo độ rộng</text>
<text x="489.0" y="475.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">zone mong muốn</text>
<rect x="724.0" y="334.0" width="250.0" height="240.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="724.0" y="334.0" width="250.0" height="6.0" rx="3" fill="#B91C1C" stroke="none" stroke-width="0"/>
<text x="738.0" y="358.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">Thu hẹp để 'R đẹp'</text>
<text x="738.0" y="376.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="751.0" y="376.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Chọn 1 nến OB 2 điểm để stop</text>
<text x="751.0" y="391.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhỏ</text>
<text x="738.0" y="410.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="751.0" y="410.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Giá phản ứng ở vùng rộng hơn →</text>
<text x="751.0" y="425.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">quét stop rồi mới đi</text>
<text x="738.0" y="444.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="751.0" y="444.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">R:R đẹp trên giấy, expectancy</text>
<text x="751.0" y="460.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">xấu trên thực tế — BACKTEST</text>
<text x="751.0" y="475.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">REQUIRED</text>
</svg>
