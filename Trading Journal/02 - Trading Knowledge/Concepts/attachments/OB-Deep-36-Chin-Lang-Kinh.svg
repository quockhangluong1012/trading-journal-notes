<text x="686.0" y="486.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">sự kiện = (displacement, BOS); đặc trưng →</text>
<text x="686.0" y="502.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">mô hình P(react) so với baseline</text>
