<text x="362.0" y="486.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">thị trường tìm mức giá mới; vùng cũ là 'giá</text>
<text x="362.0" y="502.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">cũ' — có thể không còn liên quan</text>
