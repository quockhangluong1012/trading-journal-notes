<text x="686.0" y="150.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">trước rally</text>
<rect x="26.0" y="250.0" width="280.0" height="132.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="38.0" y="274.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Auction Market Theory</text>
<text x="38.0" y="300.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">vùng giao dịch hai chiều → rời bỏ nhanh</text>
<text x="38.0" y="316.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">(low-volume) → giá thăm lại để kiểm tra</text>
<text x="38.0" y="332.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">'value'</text>
