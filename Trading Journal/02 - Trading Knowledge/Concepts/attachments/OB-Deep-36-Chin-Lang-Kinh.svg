<text x="362.0" y="134.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">đáy pullback + nến tăng mạnh: 'bullish</text>
<text x="362.0" y="150.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">engulfing / breakout'</text>
