<text x="686.0" y="274.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Vi cấu trúc</text>
<text x="686.0" y="300.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">lệnh market tiêu thụ sổ lệnh mỏng; impact</text>
<text x="686.0" y="316.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">một phần tạm thời → hồi</text>
