<text x="38.0" y="134.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">bullish OB: smart money mua ở đây, giá quay</text>
<text x="38.0" y="150.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">về mitigate rồi đi tới DOL</text>
