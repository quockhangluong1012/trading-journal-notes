<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="620" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Thang nhận thức — một sự kiện, năm tầng câu chữ</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Sự kiện: nến M15 đi lên vượt PDH 6 pip rồi đóng cửa trở lại dưới PDH.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một hình ảnh, nhưng mỗi câu mô tả nằm ở một tầng chắc chắn khác nhau — và cần một loại bằng chứng khác nhau.</text>
<rect x="40.0" y="100.0" width="700.0" height="88.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
<text x="54.0" y="122.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">1 · QUAN SÁT ĐƯỢC</text>
<text x="205.1" y="122.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="start">[OBSERVABLE]</text>
<text x="54.0" y="143.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">High M15 = PDH + 6 pip. Close &lt; PDH. Thời gian ở trên PDH: một nến.</text>
<text x="54.0" y="158.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Biên độ nến = 1.4× ATR(14). Xảy ra 08:35 NY (killzone).</text>
<text x="54.0" y="180.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Bằng chứng: chính chart (OHLC + giờ)</text>
<rect x="770.0" y="118.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3"/>
<text x="855.0" y="138.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">Mức tin cậy</text>
<text x="855.0" y="158.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">Rất cao</text>
<rect x="62.0" y="200.0" width="678.0" height="88.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="76.0" y="222.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">2 · CƠ CHẾ CÓ THỂ</text>
<text x="227.1" y="222.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">[MARKET MECHANICS]</text>
<text x="76.0" y="243.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Lệnh MUA bị kích hoạt (stop của short, buy-stop breakout) CÓ THỂ đã khớp trên PDH;</text>
<text x="76.0" y="258.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">lệnh BÁN limit hấp thụ chúng; sau đó dòng mua ròng không đủ để giữ giá trên mức.</text>
<text x="76.0" y="280.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Bằng chứng: dữ liệu sổ lệnh / khớp lệnh (thường không có)</text>
<rect x="770.0" y="218.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="855.0" y="238.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">Mức tin cậy</text>
<text x="855.0" y="258.0" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Hợp lý (định tính)</text>
<rect x="84.0" y="300.0" width="656.0" height="88.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
<text x="98.0" y="322.0" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">3 · DIỄN GIẢI THEO ICT</text>
<text x="290.6" y="322.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="start">[ICT FRAMEWORK]</text>
<text x="98.0" y="343.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">"BSL tại PDH đã bị raid / sweep." "Đây có thể là Judas swing trước leg giảm."</text>
<text x="98.0" y="358.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Đúng về định nghĩa thuật ngữ — không nói gì về hiệu quả dự báo.</text>
<text x="98.0" y="380.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Bằng chứng: định nghĩa của khung</text>
<rect x="770.0" y="318.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="855.0" y="338.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">Mức tin cậy</text>
<text x="855.0" y="358.0" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Đúng theo định nghĩa</text>
<rect x="106.0" y="400.0" width="634.0" height="88.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
<text x="120.0" y="422.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">4 · GIẢ THUYẾT</text>
<text x="246.2" y="422.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="start">[HYPOTHESIS] [BACKTEST REQUIRED]</text>
<text x="120.0" y="443.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">"Sau kiểu sự kiện này, P(chạm SSL đối diện trước stop) &gt; p_null hình học"</text>
<text x="120.0" y="458.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">"…và expectancy &gt; 0 sau spread/slippage."</text>
<text x="120.0" y="480.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Bằng chứng: thống kê ngoài mẫu, đủ cỡ mẫu</text>
<rect x="770.0" y="418.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<text x="855.0" y="438.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">Mức tin cậy</text>
<text x="855.0" y="458.0" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Chưa biết</text>
<rect x="128.0" y="500.0" width="612.0" height="88.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="142.0" y="522.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">5 · KHÔNG THỂ BIẾT TỪ OHLC</text>
<text x="367.8" y="522.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">[UNKNOWN]</text>
<text x="142.0" y="543.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Ai đã mua/bán; có "ý định" săn stop hay không; có bao nhiêu stop thật sự ở đó;</text>
<text x="142.0" y="558.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">mức có bị "engineer" hay hình thành tự nhiên; "Smart Money" có tham gia không.</text>
<text x="142.0" y="580.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Bằng chứng: không có trên chart</text>
<rect x="770.0" y="518.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<text x="855.0" y="538.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">Mức tin cậy</text>
<text x="855.0" y="558.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="middle">—</text>
<line x1="750.0" y1="110.0" x2="750.0" y2="585.0" stroke="#475569" stroke-width="2" marker-end="url(#aS)"/>
<text x="744.0" y="600.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="end">độ chắc chắn giảm dần</text>
