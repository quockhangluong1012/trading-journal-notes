<svg viewBox="0 0 1000 480" width="1000" height="480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bearish BOS qua 6 bước: LH1 → LL1 → hồi → LH2 → giảm → thủng LL1</title>
<desc>Bearish BOS qua 6 bước: LH1 → LL1 → hồi → LH2 → giảm → thủng LL1</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Bearish BOS qua 6 bước: LH1 → LL1 → hồi → LH2 → giảm → thủng LL1</tspan></text>
<rect x="24.0" y="96.0" width="570.0" height="364.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<line x1="228.3" y1="317.8" x2="567.2" y2="317.8" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="567.2" y="331.8" font-size="11" fill="#D85A30" text-anchor="end"><tspan>LL1 — mốc phải vượt</tspan></text>
<line x1="309.0" y1="238.2" x2="567.2" y2="238.2" stroke="#DC2626" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="567.2" y="233.2" font-size="11" fill="#DC2626" text-anchor="end"><tspan>LH2 — mức cần giữ (protected)</tspan></text>
<polyline points="40.0,211.6 93.8,151.8 228.3,317.8 309.0,238.2 448.9,394.2" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="93.8" cy="151.8" r="3.6" fill="#DC2626"/>
<text x="93.8" y="142.8" font-size="12.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH1</tspan></text>
<circle cx="228.3" cy="317.8" r="3.6" fill="#7C3AED"/>
<text x="228.3" y="337.3" font-size="12.5" fill="#7C3AED" text-anchor="middle"><tspan font-weight="700">LL1</tspan></text>
<circle cx="309.0" cy="238.2" r="3.6" fill="#DC2626"/>
<text x="309.0" y="229.2" font-size="12.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH2</tspan></text>
<circle cx="448.9" cy="394.2" r="3.6" fill="#7C3AED"/>
<text x="448.9" y="413.7" font-size="12.5" fill="#7C3AED" text-anchor="middle"><tspan font-weight="700">LL2</tspan></text>
<circle cx="71.8" cy="151.8" r="9.5" fill="#1F2937"/>
<text x="71.8" y="155.8" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<circle cx="206.3" cy="321.8" r="9.5" fill="#1F2937"/>
<text x="206.3" y="325.8" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<circle cx="284.6" cy="278.0" r="9.5" fill="#1F2937"/>
<text x="284.6" y="282.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<circle cx="287.0" cy="238.2" r="9.5" fill="#1F2937"/>
<text x="287.0" y="242.2" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<circle cx="321.3" cy="274.0" r="9.5" fill="#1F2937"/>
<text x="321.3" y="278.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<circle cx="358.4" cy="329.8" r="9.5" fill="#1F2937"/>
<text x="358.4" y="333.8" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">6</tspan></text>
<circle cx="380.4" cy="317.8" r="6" fill="#DC2626"/>
<text x="390.4" y="307.8" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">BOS</tspan></text>
<text x="612.0" y="70.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>① LH1: đỉnh nơi người bán gấp bắt đầu thắng thế.</tspan></text>
<text x="612.0" y="89.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>② LL1: đáy nơi lực bán gấp tạm hết.</tspan></text>
<text x="612.0" y="109.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>③ Hồi từ LL1: người bán khống chốt lời, người mua chờ sẵn đỡ</tspan></text>
<text x="612.0" y="125.7" font-size="12" fill="#1F2937" text-anchor="start"><tspan>giá.</tspan></text>
<text x="612.0" y="145.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan>④ LH2: giá dừng hồi THẤP HƠN LH1 — người bán quay lại sớm</tspan></text>
<text x="612.0" y="161.8" font-size="12" fill="#1F2937" text-anchor="start"><tspan>hơn.</tspan></text>
<text x="612.0" y="181.4" font-size="12" fill="#1F2937" text-anchor="start"><tspan>⑤ Giảm lại: giá tiến về LL1, nơi có lệnh chờ hai phía.</tspan></text>
<text x="612.0" y="200.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>⑥ Thủng LL1 → bearish BOS (ứng viên). Xác nhận khi nến đóng</tspan></text>
<text x="612.0" y="217.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>và giá ở lại phía dưới.</tspan></text>
<rect x="612.0" y="241.0" width="364.0" height="96.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="612.0" y="241.0" width="5.0" height="96.0" rx="2" fill="#1D9E75"/>
<text x="626.0" y="261.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Đã xác nhận</tspan></text>
<text x="626.0" y="281.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá giao dịch thấp hơn LL1 — điều chưa từng xảy ra trong cấu</tspan></text>
<text x="626.0" y="296.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>trúc này. Cấu trúc giảm được &quot;gia hạn&quot;; LH2 thành mức cần</tspan></text>
<text x="626.0" y="312.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>giữ.</tspan></text>
<rect x="612.0" y="330.0" width="364.0" height="62.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="612.0" y="330.0" width="5.0" height="62.0" rx="2" fill="#B45309"/>
<text x="626.0" y="350.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Chưa xác nhận</tspan></text>
<text x="626.0" y="369.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá sẽ giảm tiếp bao xa; khung lớn hơn có đồng ý không.</tspan></text>
<rect x="612.0" y="400.0" width="364.0" height="70.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="612.0" y="400.0" width="5.0" height="70.0" rx="2" fill="#DC2626"/>
<text x="626.0" y="420.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Thất bại khi</tspan></text>
<text x="626.0" y="439.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Đóng cửa lại trên LL1 ngay sau đó (bẫy), hoặc vượt LH2 (cấu</tspan></text>
<text x="626.0" y="455.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>trúc giảm bị phủ định).</tspan></text>
</svg>
