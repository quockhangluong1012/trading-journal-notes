<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Fragility test — thao tác 30 giây kiểm tra kết luận premium/discount có BỀN không</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Đổi neo ±1 bậc rồi đo lại pd. Kết luận giữ nguyên = bền. Kết luận lật = range nằm sát EQ và mọi kết luận P/D đều là nhiễu.</text>

  <!-- ===== panel 1 ===== -->
  <rect x="25" y="76" width="290" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="38" y="88" width="150" height="22" rx="5" fill="#DCFCE7"/>
  <text x="46" y="104" font-size="11.5" font-weight="700" fill="#15803D">BỀN · discount sâu</text>

  <g transform="translate(72,132)">
    <rect x="60" y="0" width="34" height="230" fill="#16A34A" opacity="0.09" stroke="#16A34A"/>
    <rect x="102" y="10" width="34" height="220" fill="none" stroke="#9CA3AF" stroke-dasharray="4 3"/>
    <line x1="52" y1="0" x2="144" y2="0" stroke="#DC2626" stroke-width="1.6"/>
    <line x1="52" y1="230" x2="144" y2="230" stroke="#16A34A" stroke-width="1.8"/>
    <line x1="52" y1="240" x2="144" y2="240" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="52" y1="115" x2="144" y2="115" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="150" y="6" font-size="10" fill="#B91C1C">h₁ = 200</text>
    <text x="150" y="119" font-size="10" fill="#6B7280">EQ</text>
    <text x="150" y="234" font-size="10" fill="#15803D">l₁ = 100</text>
    <text x="150" y="248" font-size="10" fill="#6B7280">l₂ = 105 (thay thế)</text>

    <circle cx="94" cy="175" r="6" fill="#111827"/>
    <text x="26" y="179" font-size="10.5" font-weight="700" fill="#111827">GIÁ</text>
    <line x1="60" y1="175" x2="88" y2="175" stroke="#111827" stroke-width="1" stroke-dasharray="3 2"/>
  </g>

  <text x="38" y="388" font-size="10.5" fill="#374151">Neo gốc: pd = (124−100)/100 = 0.24</text>
  <text x="38" y="402" font-size="10.5" fill="#374151">Neo thay thế: pd = (124−105)/95 = 0.20</text>

  <!-- ===== panel 2 ===== -->
  <rect x="325" y="76" width="290" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="338" y="88" width="170" height="22" rx="5" fill="#FEE2E2"/>
  <text x="346" y="104" font-size="11.5" font-weight="700" fill="#B91C1C">BỀN · premium sâu</text>

  <g transform="translate(372,132)">
    <rect x="60" y="0" width="34" height="230" fill="#DC2626" opacity="0.08" stroke="#DC2626"/>
    <rect x="102" y="20" width="34" height="210" fill="none" stroke="#9CA3AF" stroke-dasharray="4 3"/>
    <rect x="18" y="-6" width="34" height="242" fill="none" stroke="#9CA3AF" stroke-dasharray="4 3"/>
    <line x1="10" y1="0" x2="144" y2="0" stroke="#DC2626" stroke-width="1.6"/>
    <line x1="10" y1="230" x2="144" y2="230" stroke="#16A34A" stroke-width="1.8"/>
    <line x1="10" y1="115" x2="144" y2="115" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="150" y="6" font-size="10" fill="#B91C1C">h = 20.900</text>
    <text x="150" y="119" font-size="10" fill="#6B7280">EQ</text>
    <text x="150" y="234" font-size="10" fill="#15803D">l₁ = 20.410</text>
    <text x="150" y="248" font-size="10" fill="#6B7280">l₂ = 20.455</text>

    <circle cx="94" cy="54" r="6" fill="#111827"/>
    <text x="142" y="58" font-size="10.5" font-weight="700" fill="#111827">GIÁ</text>
    <line x1="60" y1="54" x2="88" y2="54" stroke="#111827" stroke-width="1" stroke-dasharray="3 2"/>
  </g>

  <text x="338" y="388" font-size="10.5" fill="#374151">Neo gốc: pd = 0.755 · neo thay thế: 0.730</text>
  <text x="338" y="402" font-size="10.5" fill="#374151">Đổi cả neo high: 0.808 → vẫn premium</text>

  <!-- ===== panel 3 ===== -->
  <rect x="625" y="76" width="290" height="330" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
  <rect x="638" y="88" width="180" height="22" rx="5" fill="#FEF3C7"/>
  <text x="646" y="104" font-size="11.5" font-weight="700" fill="#B45309">KHÔNG BỀN · lật kết luận</text>

  <g transform="translate(672,132)">
    <rect x="60" y="0" width="34" height="230" fill="#16A34A" opacity="0.09" stroke="#16A34A"/>
    <rect x="102" y="30" width="34" height="200" fill="none" stroke="#B45309" stroke-dasharray="4 3"/>
    <line x1="52" y1="0" x2="144" y2="0" stroke="#DC2626" stroke-width="1.6"/>
    <line x1="52" y1="230" x2="144" y2="230" stroke="#16A34A" stroke-width="1.8"/>
    <line x1="52" y1="115" x2="144" y2="115" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="150" y="6" font-size="10" fill="#B91C1C">h₁ = 138</text>
    <text x="150" y="119" font-size="10" fill="#6B7280">EQ₁</text>
    <text x="150" y="234" font-size="10" fill="#15803D">l₁ = 100</text>
    <text x="150" y="42" font-size="10" fill="#B45309">h₂ = 122</text>
    <text x="150" y="248" font-size="10" fill="#B45309">l₂ = 110</text>

    <circle cx="94" cy="98" r="6" fill="#111827"/>
    <text x="26" y="102" font-size="10.5" font-weight="700" fill="#111827">GIÁ</text>
    <line x1="60" y1="98" x2="88" y2="98" stroke="#111827" stroke-width="1" stroke-dasharray="3 2"/>
  </g>

  <text x="638" y="388" font-size="10.5" fill="#374151">Neo gốc (l₁,h₁): pd = 18/38 = 0.47 → discount</text>
  <text x="638" y="402" font-size="10.5" font-weight="700" fill="#B45309">Neo thay thế (l₂,h₂): pd = 8/12 = 0.67 → premium</text>

  <!-- footer -->
  <rect x="25" y="418" width="890" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="38" y="438" font-size="11" font-weight="700" fill="#1F2937">Quy trình 30 giây — làm trước mọi lệnh, và ghi cả hai con số vào log</text>
  <text x="38" y="456" font-size="10.5" fill="#374151">1. Đổi neo low sang ứng viên hợp lý kế tiếp (wick sâu hơn / swing nhỏ hơn trước nó). 2. Đổi neo high tương tự. 3. Tính lại pd cho từng tổ hợp.</text>
  <text x="38" y="472" font-size="10.5" fill="#374151">Nếu mọi tổ hợp cho CÙNG kết luận (đều premium hoặc đều discount) → kết luận bền, tự tin về vị trí. Nếu lật → ghi <tspan font-weight="700">fragility_stable = false</tspan> và cân nhắc no-trade.</text>

  <rect x="25" y="488" width="890" height="58" rx="8" fill="#1F2937" opacity="0.05"/>
  <text x="38" y="508" font-size="11" font-weight="700" fill="#1F2937">Vì sao đây là thao tác có giá trị cao nhất trên mỗi phút bỏ ra</text>
  <text x="38" y="527" font-size="10.5" fill="#374151">Nó không cần dữ liệu, không cần backtest, không cần thêm chỉ báo — nhưng nó phát hiện được lớp lỗi nguy hiểm nhất: <tspan font-weight="700">kết luận đúng chữ nhưng vô nghĩa về số</tspan>.</text>
  <text x="38" y="542" font-size="10.5" fill="#374151">Trong vault đã có tiền lệ làm đúng: một kết luận “9,3% depth” được kiểm lại với neo thay thế và ra 37,3% — khác số nhưng cùng kết luận, nên bền.</text>
</svg>
