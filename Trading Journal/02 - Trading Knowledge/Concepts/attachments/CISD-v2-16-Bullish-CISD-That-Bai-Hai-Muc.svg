<line x1="91.9" y1="406.5" x2="338.0" y2="406.5" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="93.9" y="401.5" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="start" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">SSL</text>
<circle cx="400.3" cy="161.4" r="10" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="400.3" y="165.3" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="431.5" cy="272.7" r="10" fill="#EA580C" stroke="none" stroke-width="1.2"/>
<text x="431.5" y="276.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="524.9" cy="520.6" r="10" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="524.9" y="524.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="668.0" y="108.0" width="304.0" height="77.4" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="680.0" y="132.3" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">① CISD đã xác nhận</text>
<text x="680.0" y="154.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến #11 đóng trên mức. Đúng định nghĩa — nhưng</text>
<text x="680.0" y="170.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">định nghĩa không hứa hẹn tương lai.</text>
<rect x="668.0" y="193.4" width="304.0" height="93.5" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="680.0" y="217.7" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">② Thất bại MỀM</text>
<text x="680.0" y="239.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến #12 đóng lại dưới mức CISD. Điều CISD vừa nói</text>
<text x="680.0" y="255.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(“chặng xuống đã bị lấy lại”) không còn đúng ở giá</text>
<text x="680.0" y="271.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đóng cửa. Tín hiệu bị nghi ngờ nặng.</text>
<rect x="668.0" y="294.8" width="304.0" height="93.5" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="680.0" y="319.2" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">③ Thất bại CỨNG</text>
<text x="680.0" y="340.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá phá đáy của cú quét. Chặng xuống cũ đã tiếp</text>
<text x="680.0" y="357.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">diễn: cú quét hóa ra là phá vỡ thật, không phải</text>
<text x="680.0" y="373.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đảo chiều.</text>
<rect x="668.0" y="396.3" width="304.0" height="93.5" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="680.0" y="420.6" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">Vì sao có thể thất bại?</text>
<text x="680.0" y="442.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Lực mua của #10–#11 có thể chỉ là lệnh chốt</text>
<text x="680.0" y="458.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lời/đóng vị thế bán ngắn hạn. Khi lực đó hết, người</text>
<text x="680.0" y="474.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bán quay lại. Chart không cho biết trước.</text>
</svg>
