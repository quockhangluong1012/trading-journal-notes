<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vào lệnh ở mép gần, CE hay mép xa? — đánh đổi giữa khả năng khớp và khoảng stop</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Số liệu: null model random walk (FVG-Sim-02, FVG-Sim-04) — chỉ là đường nền HÌNH HỌC, không phải hiệu quả của FVG trên thị trường thật.</text>
<rect x="30.0" y="96.0" width="420.0" height="440.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="70.0" y="265.8" width="260.0" height="116.7" rx="0" fill="#16A34A" fill-opacity="0.2"/>
<line x1="70.0" y1="265.8" x2="330.0" y2="265.8" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="70.0" y1="382.5" x2="330.0" y2="382.5" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="70.0" y1="324.2" x2="330.0" y2="324.2" stroke="#15803D" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="70.0" y1="405.8" x2="330.0" y2="405.8" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6 3"/>
<text x="336.0" y="409.8" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">stop = distal − buffer</text>
<circle cx="96.0" cy="265.8" r="6" fill="#2563EB" stroke="#fff" stroke-width="1.5"/>
<text x="108.0" y="269.8" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">E1 proximal</text>
<circle cx="96.0" cy="324.2" r="6" fill="#16A34A" stroke="#fff" stroke-width="1.5"/>
<text x="108.0" y="328.2" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">E2 CE</text>
<circle cx="96.0" cy="373.7" r="6" fill="#D97706" stroke="#fff" stroke-width="1.5"/>
<text x="108.0" y="377.7" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">E3 gần distal</text>
<path d="M215.0,137.5 L234.0,172.5 L253.0,207.5 L272.0,242.5 L291.0,277.5 L310.0,312.5 L329.0,347.5 L348.0,300.8 L367.0,242.5 L386.0,184.2 L405.0,137.5" stroke="#334155" stroke-width="1.4" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="46.0" y="500.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">Càng vào sâu: stop càng ngắn (R:R tốt hơn) nhưng càng ít lệnh</text>
<text x="46.0" y="518.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">được khớp, và lệnh khớp càng hay là lệnh giá đang chạy NGƯỢC.</text>
<rect x="470.0" y="96.0" width="480.0" height="440.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="486.0" y="120.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Đường nền hình học (random walk, FVG ≥ 0.1 ATR)</text>
<text x="486.0" y="150.0" font-size="10.8" font-weight="700" fill="#334155" text-anchor="start"></text>
<text x="666.0" y="150.0" font-size="10.8" font-weight="700" fill="#334155" text-anchor="start">E1 proximal</text>
<text x="766.0" y="150.0" font-size="10.8" font-weight="700" fill="#334155" text-anchor="start">E2 CE</text>
<text x="856.0" y="150.0" font-size="10.8" font-weight="700" fill="#334155" text-anchor="start">E3 distal</text>
<rect x="480.0" y="160.0" width="460.0" height="26.0" rx="4" fill="#F9FAFB"/>
<text x="486.0" y="178.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Được chạm trong 20 nến</text>
<text x="666.0" y="178.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">83%</text>
<text x="766.0" y="178.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">77%</text>
<text x="856.0" y="178.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">71%</text>
<rect x="480.0" y="190.0" width="460.0" height="26.0" rx="4" fill="#FFFFFF"/>
<text x="486.0" y="208.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Được chạm trong 100 nến</text>
<text x="666.0" y="208.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">92%</text>
<text x="766.0" y="208.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">89%</text>
<text x="856.0" y="208.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">87%</text>
<rect x="480.0" y="220.0" width="460.0" height="26.0" rx="4" fill="#F9FAFB"/>
<text x="486.0" y="238.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Chạm ngay nến kế tiếp</text>
<text x="666.0" y="238.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">43%</text>
<text x="766.0" y="238.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">27%</text>
<text x="856.0" y="238.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">18%</text>
<rect x="480.0" y="250.0" width="460.0" height="26.0" rx="4" fill="#FFFFFF"/>
<text x="486.0" y="268.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Đóng cửa xuyên distal trong 20 nến</text>
<text x="666.0" y="268.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">64%</text>
<text x="766.0" y="268.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">64%</text>
<text x="856.0" y="268.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">64%</text>
<rect x="480.0" y="280.0" width="460.0" height="26.0" rx="4" fill="#F9FAFB"/>
<text x="486.0" y="298.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Khoảng stop (đơn vị size)</text>
<text x="666.0" y="298.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">1 + b</text>
<text x="766.0" y="298.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">0.5 + b</text>
<text x="856.0" y="298.0" font-size="10.4" font-weight="700" fill="#374151" text-anchor="start">b</text>
<rect x="480.0" y="338.0" width="460.0" height="182.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="494.0" y="360.0" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="start">Hai điều quan trọng hơn con số</text>
<text x="494.0" y="382.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">1. Sau khi chạm proximal, xác suất giá đi sâu hơn CE trước khi bật</text>
<text x="494.0" y="401.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">   ra 1 lần size là ~69% trên random walk — đúng công thức 1/(1+q).</text>
<text x="494.0" y="420.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">   'CE giữ được' 31% lần là HÌNH HỌC, chưa phải edge (FVG-Sim-04B).</text>
<text x="494.0" y="439.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">2. Edge (nếu có) phải hiện ra như CHÊNH LỆCH so với đường nền này,</text>
<text x="494.0" y="458.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">   trên dữ liệu thật, cho từng symbol và từng timeframe.</text>
<text x="494.0" y="477.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">b = buffer (vd 0.1 ATR) — phần bảo hiểm spread/wick.</text>
</svg>