<rect x="201.2" y="205.3" width="20.6" height="24.4" rx="0" fill="#16A34A" stroke="#16A34A" stroke-width="1"/>
<line x1="245.8" y1="181.0" x2="245.8" y2="237.8" stroke="#DC2626" stroke-width="1.3"/>
<rect x="235.6" y="205.3" width="20.6" height="16.2" rx="0" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<line x1="280.2" y1="213.4" x2="280.2" y2="270.3" stroke="#DC2626" stroke-width="1.3"/>
<rect x="269.9" y="221.6" width="20.6" height="40.6" rx="0" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<line x1="314.5" y1="254.0" x2="314.5" y2="310.9" stroke="#DC2626" stroke-width="1.3"/>
<rect x="304.2" y="262.2" width="20.6" height="32.5" rx="0" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<line x1="348.8" y1="254.0" x2="348.8" y2="319.0" stroke="#16A34A" stroke-width="1.3"/>
<rect x="338.5" y="270.3" width="20.6" height="24.4" rx="0" fill="#16A34A" stroke="#16A34A" stroke-width="1"/>
<line x1="383.1" y1="205.3" x2="383.1" y2="278.4" stroke="#16A34A" stroke-width="1.3"/>
<rect x="372.8" y="213.4" width="20.6" height="56.8" rx="0" fill="#16A34A" stroke="#16A34A" stroke-width="1"/>
<text x="142.9" y="465.2" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">nến 1</text>
<text x="177.2" y="465.2" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">nến 2</text>
<text x="211.5" y="465.2" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">nến 3</text>
<line x1="142.9" y1="359.6" x2="486.0" y2="359.6" stroke="#D97706" stroke-width="1" stroke-dasharray="2,2"/>
<text x="484.0" y="373.1" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="end">đỉnh nến 1</text>
<line x1="211.5" y1="286.5" x2="486.0" y2="286.5" stroke="#D97706" stroke-width="1" stroke-dasharray="2,2"/>
<text x="484.0" y="281.5" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="end">đáy nến 3</text>
<text x="400.2" y="327.1" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">FVG</text>
<line x1="177.2" y1="254.0" x2="207.2" y2="159.0" stroke="#1F2937" stroke-width="1" stroke-dasharray="3,2"/>
<text x="210.2" y="143.4" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="220.0">nến 2 chạy rất nhanh: phần lớn khoảng này</text>
<text x="210.2" y="157.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="220.0">chỉ có lệnh MUA được khớp</text>
<line x1="348.8" y1="314.9" x2="378.8" y2="384.9" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
<text x="381.8" y="388.9" font-size="10.5" font-weight="600" fill="#059669" text-anchor="start" data-maxw="150.0">sau đó giá QUAY LẠI vào</text>
<text x="381.8" y="402.6" font-size="10.5" font-weight="600" fill="#059669" text-anchor="start" data-maxw="150.0">vùng này (có thể, không</text>
<text x="381.8" y="416.2" font-size="10.5" font-weight="600" fill="#059669" text-anchor="start" data-maxw="150.0">chắc)</text>
<rect x="512.0" y="104.0" width="460.0" height="430.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="526.0" y="126.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Ba thứ hay bị đánh đồng</text>
<rect x="524.0" y="144.0" width="436.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="524.0" y="152.0" width="4.0" height="76.0" rx="2" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="538.0" y="166.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Liquidity pool (đỉnh/đáy)</text>
<text x="538.0" y="186.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="408.0">Chỗ lệnh CHỜ có thể tụ lại (stop, lệnh breakout). Bị “lấy” khi giá vượt qua</text>
<text x="538.0" y="202.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="408.0">và lệnh được khớp.</text>
<rect x="524.0" y="246.0" width="436.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="524.0" y="254.0" width="4.0" height="76.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="538.0" y="268.0" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="start">FVG (imbalance)</text>
<text x="538.0" y="288.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="408.0">Vùng giá từng chạy MỘT chiều. Không “chứa” stop. ICT xếp vào IRL; khi</text>
<text x="538.0" y="304.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="408.0">giá quay lại gọi là rebalance / mitigation.</text>
<rect x="524.0" y="348.0" width="436.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<rect x="524.0" y="356.0" width="4.0" height="76.0" rx="2" fill="#4F46E5" stroke="none" stroke-width="1.2"/>
<text x="538.0" y="370.0" font-size="12.5" font-weight="700" fill="#4F46E5" text-anchor="start">PD Array</text>
<text x="538.0" y="390.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="408.0">Tên chung của ICT cho các vùng tham chiếu (FVG, OB, breaker…) dùng</text>
<text x="538.0" y="406.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="408.0">để chờ phản ứng theo premium/discount.</text>
<text x="526.0" y="458.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="432.0">[CƠ CHẾ] Khi giá quay lại FVG, lệnh limit có thể đã được đặt chờ ở đó, và giá</text>
<text x="526.0" y="474.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="432.0">đi chậm hơn qua vùng từng bị bỏ qua. Đó là lý do HỢP LÝ để quan sát FVG —</text>
<text x="526.0" y="490.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="432.0">không phải bằng chứng nó sẽ giữ giá.</text>
<rect x="28.0" y="548.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="572.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Câu cần nhớ: “Mọi FVG đều là vùng IMBALANCE; không phải FVG nào cũng có lệnh chờ; không FVG nào bắt buộc phải được lấp.” FVG nằm NGOÀI range đang</text>
<text x="42.0" y="588.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">dùng thì không gọi là IRL của range đó.</text>
</svg>
