<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="618" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="923.5" y="22" width="48.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="947.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">FVG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">FVG là gì, và vì sao ICT xếp nó vào Internal Range Liquidity</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">FVG (Fair Value Gap) = khoảng giá giữa râu nến 1 và râu nến 3 không chạm nhau, vì nến 2 chạy quá nhanh. Trong khoảng đó, giá chỉ được giao dịch theo MỘT</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">chiều.</text>
<rect x="28.0" y="104.0" width="470.0" height="430.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="108.6" y="286.5" width="377.4" height="73.1" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.85"/>
<line x1="108.6" y1="375.8" x2="108.6" y2="424.6" stroke="#16A34A" stroke-width="1.3"/>
<rect x="98.3" y="384.0" width="20.6" height="16.2" rx="0" fill="#16A34A" stroke="#16A34A" stroke-width="1"/>
