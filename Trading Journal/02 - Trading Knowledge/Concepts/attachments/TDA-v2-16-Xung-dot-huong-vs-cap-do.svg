<svg viewBox="0 0 1000 590" width="1000" height="590" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="590" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Hai loại 'mâu thuẫn' khác nhau: XUNG ĐỘT HƯỚNG vs KHÁC BIỆT CẤP ĐỘ</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phần lớn cái trader gọi là 'timeframe mâu thuẫn' chỉ là khác biệt cấp độ — hình học bình thường của thị trường lồng nhau.</text>
<rect x="504.0" y="84.0" width="470.0" height="340.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="108.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">Vấn đề 2 · Khác biệt cấp độ (thường gặp, BÌNH THƯỜNG)</text>
<rect x="518.0" y="118.0" width="442.0" height="200.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="526.8,288.0 597.6,234.0 624.1,250.0 650.6,246.0 703.6,198.0 739.0,218.0 765.5,214.0 827.4,166.0 862.8,190.0 889.3,186.0 942.3,142.0" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="597.6,234.0 624.1,250.0" fill="none" stroke="#B91C1C" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="703.6,198.0 739.0,218.0" fill="none" stroke="#B91C1C" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="827.4,166.0 862.8,190.0" fill="none" stroke="#B91C1C" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="531.3" y="132.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">đường xanh: D1 tăng · đoạn đỏ: H1/M5 giảm</text>
<text x="531.3" y="146.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">đoạn đỏ nằm BÊN TRONG nhịp lớn, không phá swing L4</text>
<text x="518.0" y="340.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="340.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi khung mô tả một cấp swing khác nhau</text>
<text x="518.0" y="359.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="359.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Đoạn ngược hướng = nhịp hồi/nhịp nội bộ</text>
<text x="518.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Hành động: dùng nó để định thời điểm, không để đổi hướng</text>
<rect x="26.0" y="84.0" width="470.0" height="340.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Vấn đề 1 · Xung đột hướng (ít gặp hơn, QUAN TRỌNG)</text>
<rect x="40.0" y="118.0" width="442.0" height="200.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<polyline points="48.8,288.0 128.4,228.0 172.6,242.0 252.2,168.0" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="252.2,168.0 305.2,208.0 331.7,198.0 393.6,258.0 420.1,250.0 468.7,294.0" fill="none" stroke="#B91C1C" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="163.8" y1="242.0" x2="482.0" y2="242.0" stroke="#15803D" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="167.8" y="256.0" font-size="10" font-weight="400" fill="#15803D" text-anchor="start">swing L4 bảo vệ xu hướng tăng</text>
<circle cx="411.3" cy="242.0" r="5" fill="#B91C1C" stroke="white" stroke-width="1.2"/>
<text x="261.0" y="132.0" font-size="10.5" font-weight="400" fill="#1F2937" text-anchor="start">nhịp giảm có CÙNG CẤP với nhịp tăng</text>
<text x="261.0" y="146.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">và đã phá swing L4</text>
<text x="40.0" y="340.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="340.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Hai đánh giá cùng cấp chỉ hướng ngược nhau</text>
<text x="40.0" y="359.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="359.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Nhịp ngược hướng phá swing neo bối cảnh (L3+)</text>
<text x="40.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Hành động: DEGRADE (L3) / SUSPEND (L4) — không 'chọn phe'</text>
<rect x="26.0" y="440.0" width="948.0" height="130.0" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="42.0" y="464.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Ba câu hỏi phân biệt (trả lời bằng chart, không bằng cảm giác):</text>
<text x="42.0" y="488.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="488.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nhịp ngược hướng có biên độ / thời gian tương đương nhịp chính không? (so bằng ATR của khung lớn)</text>
<text x="42.0" y="507.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="507.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nó đã phá swing cấp nào? ≤ L2 → khác biệt cấp độ · L3 bằng displacement → xung đột (DEGRADE) · L4 bằng thân nến → SUSPEND</text>
<text x="42.0" y="527.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="527.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nó đang ở đâu so với vùng được phép: trước zone (hồi) · trong zone (arrival) · xuyên zone có acceptance (thất bại)</text>
</svg>
