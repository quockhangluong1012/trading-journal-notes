<svg viewBox="0 0 1000 760" width="1000" height="760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="760" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Kiểm chứng QUY TRÌNH top-down — ba câu hỏi khác nhau, ba thiết kế khác nhau</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">(1) Quy trình có NHẤT QUÁN không? (2) Mỗi tầng có THÊM giá trị so với tầng dưới không? (3) Có thắng một bộ lọc đơn giản không?</text>
<text x="26.0" y="73.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mọi kết quả dưới đây là THIẾT KẾ — chưa có số liệu. BACKTEST REQUIRED.</text>
<rect x="26.0" y="98.0" width="470.0" height="364.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="122.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">② Ablation theo tầng — mỗi tầng phải trả tiền thuê</text>
<rect x="40.0" y="134.0" width="442.0" height="42.0" rx="7" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<circle cx="66.0" cy="155.0" r="14" fill="#4B5563" stroke="none" stroke-width="1"/>
<text x="66.0" y="159.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">M0</text>
<text x="90.0" y="159.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ trigger M5 trong killzone (mọi chuỗi sweep→MSS→FVG)</text>
<rect x="40.0" y="182.0" width="442.0" height="42.0" rx="7" fill="#F9FAFB" stroke="#1D4ED8" stroke-width="1.2"/>
<circle cx="66.0" cy="203.0" r="14" fill="#1D4ED8" stroke="none" stroke-width="1"/>
<text x="66.0" y="207.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">M1</text>
<text x="90.0" y="207.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">M0 + bộ lọc hướng Daily Bias</text>
<rect x="40.0" y="230.0" width="442.0" height="42.0" rx="7" fill="#F9FAFB" stroke="#B45309" stroke-width="1.2"/>
<circle cx="66.0" cy="251.0" r="14" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="66.0" y="255.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">M2</text>
<text x="90.0" y="255.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">M1 + yêu cầu giá đã vào POI D1/H1</text>
<rect x="40.0" y="278.0" width="442.0" height="42.0" rx="7" fill="#F9FAFB" stroke="#15803D" stroke-width="1.2"/>
<circle cx="66.0" cy="299.0" r="14" fill="#15803D" stroke="none" stroke-width="1"/>
<text x="66.0" y="303.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">M3</text>
<text x="90.0" y="303.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">M2 + Gate 2/3 đầy đủ (pre-mark, R_proxy, đồng pha P/D)</text>
<rect x="40.0" y="326.0" width="442.0" height="42.0" rx="7" fill="#F9FAFB" stroke="#B91C1C" stroke-width="1.2"/>
<circle cx="66.0" cy="347.0" r="14" fill="#B91C1C" stroke="none" stroke-width="1"/>
<text x="66.0" y="351.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">MS</text>
<text x="90.0" y="351.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Bộ lọc ĐƠN GIẢN thay D1: giá trên/dưới MA 20 ngày</text>
<text x="40.0" y="384.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">So sánh M(k) với M(k−1) trên CÙNG dữ liệu: coverage (số setup),</text>
<text x="40.0" y="398.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">expectancy (R), MAE, win rate, profit factor. M1 phải thắng MS,</text>
<text x="40.0" y="412.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">nếu không 'Daily Bias' chưa chứng minh được giá trị vượt bộ lọc</text>
<text x="40.0" y="426.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">xu hướng thô.</text>
<rect x="504.0" y="98.0" width="470.0" height="364.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="122.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">① Nhất quán — hai người, một chart</text>
<text x="518.0" y="140.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="140.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Inter-rater: 2 người phân tích độc lập cùng 50 chart (ẩn tương</text>
<text x="531.0" y="155.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lai) → Cohen's κ cho: trạng thái cấu trúc, Daily Bias, range,</text>
<text x="531.0" y="171.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">trạng thái NR/MON/EE</text>
<text x="518.0" y="191.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="191.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Test-retest: một người, cùng 50 chart, cách 2–3 tuần → κ</text>
<text x="518.0" y="212.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="212.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Độ nhạy định nghĩa: đổi 1 tham số swing (Sim-03) → % ngày đổi</text>
<text x="531.0" y="228.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhãn</text>
<text x="518.0" y="248.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="248.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Ngưỡng làm việc (HEURISTIC): κ ≥ 0.6 'chấp nhận được', ≥ 0.8</text>
<text x="531.0" y="264.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">'tốt' (thang Landis &amp; Koch 1977)</text>
<text x="518.0" y="284.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="284.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">κ thấp → sửa ĐỊNH NGHĨA trước, không backtest kết quả</text>
<rect x="26.0" y="476.0" width="470.0" height="270.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="500.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">③ Shadow trades — đo cả những gì bị loại</text>
<text x="40.0" y="518.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="518.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi tín hiệu bị một gate loại → vẫn ghi entry/stop/target giả</text>
<text x="53.0" y="533.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">định theo rule</text>
<text x="40.0" y="554.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="554.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">So expectancy: tín hiệu ĐƯỢC NHẬN vs tín hiệu BỊ LOẠI tại từng</text>
<text x="53.0" y="569.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">gate</text>
<text x="40.0" y="590.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="590.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Gate có giá trị khi nhóm bị loại xấu hơn nhóm được nhận một</text>
<text x="53.0" y="606.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">cách có ý nghĩa</text>
<text x="40.0" y="626.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="626.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không có shadow log → không biết bộ lọc đang loại setup xấu</text>
<text x="53.0" y="642.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">hay loại setup tốt</text>
<rect x="504.0" y="476.0" width="470.0" height="270.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="518.0" y="500.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Kỷ luật dữ liệu</text>
<text x="518.0" y="518.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="518.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Đơn vị phân tích = NGÀY (daily state log), không phải lệnh —</text>
<text x="531.0" y="533.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">để đo cả ngày No Trade</text>
<text x="518.0" y="554.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="554.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Tách in-sample (xây rule) / out-of-sample (kiểm tra) /</text>
<text x="531.0" y="569.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">walk-forward</text>
<text x="518.0" y="590.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="590.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Ẩn nến tương lai khi gán nhãn; mốc có timestamp</text>
<text x="518.0" y="611.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="611.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Tính spread, slippage, giờ rollover/DST; phân tầng theo regime</text>
<text x="531.0" y="626.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">(trend / range) và theo tài sản</text>
<text x="518.0" y="647.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="647.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Báo cáo cả khoảng tin cậy; dưới ~30 mẫu mỗi nhóm → chỉ là quan</text>
<text x="531.0" y="662.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">sát</text>
</svg>
