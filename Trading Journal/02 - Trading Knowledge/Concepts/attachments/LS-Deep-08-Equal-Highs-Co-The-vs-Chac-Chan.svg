<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Equal Highs / Equal Lows — vì sao có thể là liquidity, và vì sao "có thể" ≠ "chắc chắn"</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Hai đỉnh gần bằng nhau tạo một đường tham chiếu "hiển nhiên". Cơ chế đề xuất là SALIENCE: nhiều người cùng dùng một mức</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">→ stop/lệnh breakout CÓ THỂ dồn sát phía trên. Nhưng trên random walk, equal highs cũng tự xuất hiện và không "hút" giá hơn một đỉnh đơn.</text>
<rect x="40.0" y="108.0" width="440.0" height="330.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="50.0" y="152.9" width="420.0" height="24.9" rx="4" fill="#F5F3FF" fill-opacity="0.8" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="464.0" y="146.9" font-size="10" font-weight="600" fill="#6D28D9" text-anchor="end">vùng có thể có buy stops (không quan sát được)</text>
<rect x="50.0" y="175.9" width="420.0" height="5.0" rx="2" fill="#FFFBEB" fill-opacity="0.9" stroke="#D97706" stroke-width="1"/>
<line x1="50.0" y1="177.7" x2="470.0" y2="177.7" stroke="#B45309" stroke-width="1.6"/>
<text x="464.0" y="352.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end">đường cam = EQH: |H1 − H2| ≤ tol × ATR</text>
<path d="M70.0,333.1 L91.0,302.1 L112.0,264.8 L133.0,224.4 L154.0,190.2 L175.0,177.7 L196.0,196.4 L217.0,227.5 L238.0,252.3 L259.0,271.0 L280.0,258.5 L301.0,233.7 L322.0,205.7 L343.0,179.3 L364.0,196.4 L385.0,221.2 L406.0,239.9 L427.0,249.2 L448.0,233.7 L469.0,215.0" stroke="#111827" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="175.0" y="167.7" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">H1</text>
<text x="343.0" y="167.7" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">H2</text>
<text x="56.0" y="374.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">Người short ở H1 và H2 thường đặt stop ở cùng một chỗ;</text>
<text x="56.0" y="389.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">người chờ "phá double top" đặt buy-stop ở cùng chỗ đó.</text>
<text x="56.0" y="404.0" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">→ mật độ lệnh CÓ THỂ cao hơn một đỉnh đơn [HYPOTHESIS].</text>
<rect x="500.0" y="108.0" width="440.0" height="72.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<rect x="512.0" y="118.0" width="60.8" height="20.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="542.4" y="132.0" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">Có cơ sở</text>
<text x="512.0" y="154.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Lệnh dồn quanh mức nổi bật (salient)</text>
<text x="512.0" y="171.0" font-size="9.8" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Osler 2003/2005 (FX, số tròn); Kavajecz &amp; O-W 2004 (S/R ↔ depth)</text>
<rect x="500.0" y="190.0" width="440.0" height="72.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<rect x="512.0" y="200.0" width="83.2" height="20.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="553.6" y="214.0" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">Có cơ sở yếu</text>
<text x="512.0" y="236.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">Số lần test càng nhiều, giá càng hay 'bật'</text>
<text x="512.0" y="253.0" font-size="9.8" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Garzarelli et al. 2014 — cổ phiếu LSE, thang 45–90 giây</text>
<rect x="500.0" y="272.0" width="440.0" height="72.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<rect x="512.0" y="282.0" width="116.8" height="20.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="570.4" y="296.0" font-size="10" font-weight="600" fill="#B91C1C" text-anchor="middle">Chưa có bằng chứng</text>
<text x="512.0" y="318.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">EQH "hút" giá hơn đỉnh đơn cùng khoảng cách</text>
<text x="512.0" y="335.0" font-size="9.8" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Random walk: hai đường trùng nhau (LS-Sim-07)</text>
<rect x="500.0" y="354.0" width="440.0" height="72.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<rect x="512.0" y="364.0" width="122.4" height="20.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="573.2" y="378.0" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Không quan sát được</text>
<text x="512.0" y="400.0" font-size="11.2" font-weight="700" fill="#1F2937" text-anchor="start">EQH được "engineer" để làm mồi</text>
<text x="512.0" y="417.0" font-size="9.8" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Ý định không có trên OHLC</text>
<rect x="40.0" y="452.0" width="900.0" height="128.0" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="56.0" y="474.0" font-size="10.4" font-weight="700" fill="#1D4ED8" text-anchor="start">Biến thể &amp; bẫy thường gặp</text>
<text x="56.0" y="493.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• Tolerance quyết định tất cả: 0.05 ATR vs 0.3 ATR cho ra số EQH khác nhau gấp ~5 lần (random walk: 1.5 → 8.0 / 1.000 nến M15).</text>
<text x="56.0" y="512.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• EQH trên M5 thường chỉ là nhiễu bên trong một nến H1 — ý nghĩa thuộc về khung của swing, không thuộc khung bạn đang nhìn.</text>
<text x="56.0" y="531.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• "Engineered EQH" (hai đỉnh quá đều, ngay trước POI) là diễn giải hậu kiểm; ghi lại TRƯỚC khi biết kết quả, rồi đếm.</text>
<text x="56.0" y="550.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• Phép thử: cùng khoảng cách tới mức, EQH có bị xuyên nhanh hơn / sâu hơn / tăng tốc mạnh hơn đỉnh đơn không? (HYP-LS-006, HYP-LS-007)</text>
</svg>