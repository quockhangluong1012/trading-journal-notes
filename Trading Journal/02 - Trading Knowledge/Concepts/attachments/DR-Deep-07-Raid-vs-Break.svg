<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Liquidity raid vs Structural break — cùng “giá vượt một mức”, ngược hệ quả</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Phân biệt bằng CÁCH PHÁ và PHẢN ỨNG SAU, không bằng cảm giác. Đây là câu hỏi quyết định range sống hay chết.</text>

  <!-- ============ LEFT : RAID ============ -->
  <rect x="25" y="76" width="430" height="270" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="38" y="88" width="150" height="22" rx="5" fill="#DCFCE7"/>
  <text x="46" y="104" font-size="12" font-weight="700" fill="#15803D">LIQUIDITY RAID</text>
  <text x="200" y="104" font-size="11" fill="#6B7280">wick xuyên, close ở trong</text>
  <rect x="38" y="118" width="404" height="170" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
  <g transform="translate(50,124)">
    <line x1="10" y1="64" x2="390" y2="64" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="14" y="58" font-size="10" font-weight="700" fill="#B91C1C">mức bị test</text>

    <line x1="40" y1="110" x2="40" y2="140" stroke="#374151" stroke-width="1.4"/>
    <rect x="35" y="118" width="10" height="16" fill="#374151"/>
    <line x1="64" y1="86" x2="64" y2="120" stroke="#374151" stroke-width="1.4"/>
    <rect x="59" y="94" width="10" height="20" fill="#374151"/>
    <line x1="88" y1="58" x2="88" y2="96" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="83" y="66" width="10" height="22" fill="#16A34A"/>
    <line x1="112" y1="80" x2="112" y2="118" stroke="#374151" stroke-width="1.4"/>
    <rect x="107" y="88" width="10" height="22" fill="#374151"/>
    <line x1="136" y1="100" x2="136" y2="140" stroke="#374151" stroke-width="1.4"/>
    <rect x="131" y="108" width="10" height="24" fill="#374151"/>

    <text x="238" y="44" font-size="10" font-weight="700" fill="#B91C1C">wick vượt lên trên mức</text>
    <text x="238" y="106" font-size="10" font-weight="700" fill="#15803D">nhưng thân ĐÓNG DƯỚI mức</text>
    <text x="238" y="124" font-size="10" fill="#15803D">→ thất bại, quay về trong range</text>

    <line x1="20" y1="158" x2="150" y2="158" stroke="#16A34A" stroke-width="1.2"/>
    <polygon points="150,154 160,158 150,162" fill="#16A34A"/>
    <text x="24" y="172" font-size="10" font-weight="700" fill="#15803D">reclaim nhanh (1–3 nến)</text>
  </g>
  <rect x="38" y="300" width="404" height="34" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="46" y="314" font-size="10" fill="#374151">penetration ≤ 0.3 × ATR · bars_outside ≤ 3 · có reclaim   [practice number]</text>
  <text x="46" y="328" font-size="10.5" font-weight="700" fill="#15803D">→ range VALID, unswept −1, đổi vai draw sang đầu kia</text>

  <!-- ============ RIGHT : BREAK ============ -->
  <rect x="465" y="76" width="430" height="270" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="478" y="88" width="176" height="22" rx="5" fill="#FEE2E2"/>
  <text x="486" y="104" font-size="12" font-weight="700" fill="#B91C1C">STRUCTURAL BREAK</text>
  <text x="662" y="104" font-size="11" fill="#6B7280">thân đóng ngoài, giữ ngoài</text>
  <rect x="478" y="118" width="404" height="170" rx="5" fill="#FFFFFF" stroke="#EFF1F5"/>
  <g transform="translate(490,124)">
    <line x1="10" y1="64" x2="390" y2="64" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="322" y="58" font-size="10" font-weight="700" fill="#B91C1C">mức bị phá</text>

    <line x1="40" y1="110" x2="40" y2="140" stroke="#374151" stroke-width="1.4"/>
    <rect x="35" y="118" width="10" height="16" fill="#374151"/>
    <line x1="64" y1="88" x2="64" y2="124" stroke="#374151" stroke-width="1.4"/>
    <rect x="59" y="96" width="10" height="20" fill="#374151"/>
    <line x1="88" y1="44" x2="88" y2="92" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="83" y="48" width="10" height="14" fill="#16A34A"/>
    <line x1="112" y1="52" x2="112" y2="86" stroke="#374151" stroke-width="1.4"/>
    <rect x="107" y="56" width="10" height="22" fill="#16A34A"/>
    <line x1="136" y1="58" x2="136" y2="90" stroke="#374151" stroke-width="1.4"/>
    <rect x="131" y="62" width="10" height="20" fill="#16A34A"/>
    <line x1="160" y1="48" x2="160" y2="82" stroke="#374151" stroke-width="1.4"/>
    <rect x="155" y="52" width="10" height="22" fill="#16A34A"/>

    <text x="96" y="36" font-size="10" font-weight="700" fill="#B91C1C">thân ĐÓNG TRÊN mức</text>
    <text x="180" y="70" font-size="10" font-weight="700" fill="#15803D">3 nến giữ ngoài = acceptance</text>
  </g>
  <rect x="478" y="300" width="404" height="34" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="486" y="314" font-size="10" fill="#374151">penetration &gt; 0.5 × ATR · bars_outside &gt; 3 · KHÔNG reclaim</text>
  <text x="486" y="328" font-size="10.5" font-weight="700" fill="#B91C1C">→ REPLACED: neo mới, EQ mới, pd mới</text>
  <text x="700" y="328" font-size="10.5" font-weight="700" fill="#6B7280">[practice number]</text>

  <!-- ===== comparison ===== -->
  <rect x="25" y="360" width="870" height="152" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="38" y="382" font-size="12.5" font-weight="700" fill="#1F2937">Hệ quả khác nhau ở đâu</text>
  <line x1="38" y1="392" x2="882" y2="392" stroke="#E5E7EB"/>
  <text x="46" y="412" font-size="11" font-weight="700" fill="#6B7280">Tiêu chí</text>
  <text x="290" y="412" font-size="11" font-weight="700" fill="#15803D">Raid</text>
  <text x="620" y="412" font-size="11" font-weight="700" fill="#B91C1C">Break</text>
  <line x1="38" y1="420" x2="882" y2="420" stroke="#E5E7EB"/>
  <text x="46" y="440" font-size="10.5" fill="#374151">Thanh khoản sau đó</text>
  <text x="290" y="440" font-size="10.5" fill="#374151">Mức đó spent; pool đối diện thành draw</text>
  <text x="620" y="440" font-size="10.5" fill="#374151">Mức đó spent; cấu trúc được viết lại</text>
  <text x="46" y="460" font-size="10.5" fill="#374151">Trạng thái range</text>
  <text x="290" y="460" font-size="10.5" font-weight="700" fill="#15803D">VALID (giữ nguyên)</text>
  <text x="620" y="460" font-size="10.5" font-weight="700" fill="#B91C1C">REPLACED / INVALIDATED</text>
  <text x="46" y="480" font-size="10.5" fill="#374151">Bias khung đó</text>
  <text x="290" y="480" font-size="10.5" fill="#374151">Không đổi</text>
  <text x="620" y="480" font-size="10.5" fill="#374151">Đổi nếu neo thuộc cấp bias</text>
  <text x="46" y="500" font-size="10.5" fill="#374151">Thuật ngữ ICT</text>
  <text x="290" y="500" font-size="10.5" fill="#374151">Sweep / raid / purge / turtle soup</text>
  <text x="620" y="500" font-size="10.5" fill="#374151">BOS (thuận trend) / MSS-CHoCH (ngược)</text>

  <rect x="25" y="516" width="870" height="38" rx="6" fill="#1F2937" opacity="0.05"/>
  <text x="38" y="533" font-size="10.5" font-weight="700" fill="#1F2937">Điều KHÔNG phân biệt được: Ý ĐỊNH. Cả hai đều có dạng “giá vượt mức rồi hoặc không quay lại”.</text>
  <text x="38" y="548" font-size="10.5" fill="#4B5563">Không có cách nào từ chart phân biệt “ai đó cố tình quét stop” với “cung cầu đơn thuần mạnh hơn ở phía đó”.</text>
</svg>
