<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity nằm ở đâu? Pool lệnh chờ khác với mốc tham chiếu</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không phải mọi đường kẻ trên chart đều là chỗ có lệnh chờ. Hãy tách: ● nơi CÓ THỂ có lệnh chờ (pool) và ◆ vùng giá ICT dùng làm tham chiếu (PD array).</text>
<rect x="28.0" y="87.0" width="612.0" height="470.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
