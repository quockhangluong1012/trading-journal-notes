<text x="533.9" y="437.9" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="start" data-maxw="105.0">low)</text>
<rect x="656.0" y="87.0" width="316.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="670.0" y="109.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">● Ứng viên POOL lệnh chờ</text>
<text x="674.0" y="129.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">● Swing high / swing low có ý nghĩa</text>
<text x="674.0" y="151.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">● EQH / EQL (đỉnh/đáy bằng nhau)</text>
<text x="674.0" y="173.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">● PDH / PDL (đỉnh/đáy hôm qua)</text>
<text x="674.0" y="195.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">● PWH / PWL (đỉnh/đáy tuần trước)</text>
<text x="674.0" y="217.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">● Đỉnh/đáy nội bộ đáng kể trong range</text>
<text x="670.0" y="249.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">◆ MỐC THAM CHIẾU / PD ARRAY</text>
<text x="674.0" y="273.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">◆ FVG (khoảng giá mất cân bằng)</text>
<text x="674.0" y="295.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">◆ Order Block</text>
<text x="674.0" y="317.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">◆ EQ 50% của range</text>
<text x="670.0" y="347.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="288.0">Khác biệt: ● là nơi stop/lệnh breakout CÓ THỂ tụ</text>
<text x="670.0" y="363.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="288.0">lại, vì ai cũng thấy mốc đó. ◆ là vùng giá ICT dùng</text>
<text x="670.0" y="379.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="288.0">để chờ phản ứng; nó không “chứa” stop theo nghĩa</text>
<text x="670.0" y="395.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="288.0">hẹp.</text>
<text x="670.0" y="455.0" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="288.0">Cả hai đều có thể là IRL hoặc ERL — tùy chúng</text>
<text x="670.0" y="471.3" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="288.0">nằm trong hay ngoài range bạn đang dùng.</text>
<rect x="28.0" y="571.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="595.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hình dựng (synthetic) — không phải dữ liệu thật. PDH/PDL hay PWH/PWL chỉ là ERL khi chúng nằm NGOÀI biên range đang tham chiếu; nếu nằm bên trong,</text>
<text x="42.0" y="611.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chúng là IRL.</text>
