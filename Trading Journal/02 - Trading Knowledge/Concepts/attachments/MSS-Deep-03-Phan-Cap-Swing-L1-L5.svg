<text x="662.0" y="203.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="start">L2 Internal</text>
<text x="662.0" y="219.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">mốc trong nội bộ một leg</text>
<text x="662.0" y="233.5" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">(≈ STH/STL của ICT trên khung exec.)</text>
<text x="662.0" y="248.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">→ phá nó: internal MSS/BOS</text>
