<text x="662.0" y="398.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">→ phá nó: range REPLACED</text>
<rect x="652.0" y="413.0" width="290.0" height="63.0" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
<text x="662.0" y="428.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="start">L5 Major HTF</text>
<text x="662.0" y="444.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">phá nó vô hiệu cấu trúc khung</text>
<text x="662.0" y="458.5" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">cao hơn (D1/W1)</text>
<text x="662.0" y="473.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">→ phá nó: xét lại bias</text>
<rect x="26.0" y="566.0" width="928.0" height="60.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="587.0" font-size="10.3" font-weight="600" fill="#334155" text-anchor="start">Quy tắc (theo 57-Dealing-Range §11.2): cấp của swing = cấp cao nhất mà việc PHÁ nó làm đổi một kết luận cấu trúc. Không dùng kích thước (pip/point).</text>
<text x="42.0" y="604.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">Cấp đổi theo thời gian (promotion / supersession / consumption). STH→ITH→LTH của ICT là phép đệ quy cùng tinh thần. [ICT FRAMEWORK + INTERPRETATION]</text>
