<text x="662.0" y="294.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">phá nó đổi nhãn cấu trúc ở</text>
<text x="662.0" y="308.5" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">khung SETUP (H1) (≈ ITH/ITL)</text>
<text x="662.0" y="323.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">→ phá nó: MSS khung setup</text>
