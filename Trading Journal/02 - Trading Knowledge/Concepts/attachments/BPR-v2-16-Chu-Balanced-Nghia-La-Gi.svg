<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah0F9D74" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F9D74"/></marker><marker id="ahE0464B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0464B"/></marker></defs>
<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="856.0" y="22" width="116.0" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="914.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NGHĨA CỦA TÊN</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Chữ “Balanced” trong BPR nghĩa là gì — và KHÔNG nghĩa là gì</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Tên gọi dễ gây hiểu lầm. “Balanced” ở đây nói về việc giá đã được giao qua dải giá theo HAI chiều, không phải chuyện người mua bằng người bán.</text>
<rect x="28.0" y="86.0" width="300.0" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Hai lần “giao hàng” qua cùng dải</text>
<rect x="118.0" y="226.0" width="120.0" height="90.0" rx="3" fill="#E9DDFF" stroke="#7C3AED" stroke-width="2"/>
<text x="178.0" y="276.0" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<line x1="100.0" y1="426.0" x2="100.0" y2="146.0" stroke="#0F9D74" stroke-width="3" marker-end="url(#ah0F9D74)"/>
<text x="92.0" y="406.0" font-size="11" font-weight="700" fill="#0F9D74" text-anchor="end">lần 1: lên</text>
<line x1="256.0" y1="146.0" x2="256.0" y2="426.0" stroke="#E0464B" stroke-width="3" marker-end="url(#ahE0464B)"/>
<text x="264.0" y="166.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">lần 2:</text>
<text x="264.0" y="181.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">xuống</text>
<text x="40.0" y="454.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi lần đều rất nhanh. “Balanced” = đã có cả hai</text>
<text x="40.0" y="469.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chiều, không phải “đã giao dịch nhiều”.</text>
<rect x="346.0" y="86.0" width="300.0" height="230.0" rx="10" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="358.0" y="111.0" font-size="13" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ Có cơ sở (từ chart)</text>
<circle cx="361.0" cy="127.9" r="2.2" fill="#0F7A5A"/>
<text x="370.0" y="131.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Giá đã chạy qua dải này một lần đi lên và một lần</text>
<text x="370.0" y="147.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">đi xuống.</text>
<circle cx="361.0" cy="162.1" r="2.2" fill="#0F7A5A"/>
<text x="370.0" y="166.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Theo ngôn ngữ ICT: FVG đầu chỉ “giao” một phía;</text>
<text x="370.0" y="181.7" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">FVG thứ hai đã “giao” phía còn lại → dải giá được</text>
<text x="370.0" y="197.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">giao hai chiều.</text>
<circle cx="361.0" cy="211.9" r="2.2" fill="#0F7A5A"/>
<text x="370.0" y="215.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cả hai lần đều nhanh → dải giá này vẫn là chỗ giá</text>
<text x="370.0" y="231.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">ít dừng lại.</text>
<rect x="658.0" y="86.0" width="314.0" height="230.0" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.3"/>
<text x="670.0" y="111.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start">✗ Không có bằng chứng</text>
<circle cx="673.0" cy="127.9" r="2.2" fill="#B91C1C"/>
<text x="682.0" y="131.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Khối lượng mua bằng khối lượng bán.</text>
<circle cx="673.0" cy="146.5" r="2.2" fill="#B91C1C"/>
<text x="682.0" y="150.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cung và cầu “cân bằng” hay “công bằng” tại đây.</text>
<circle cx="673.0" cy="165.1" r="2.2" fill="#B91C1C"/>
<text x="682.0" y="169.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Các tổ chức đã “cân bằng sổ lệnh” ở vùng này.</text>
<circle cx="673.0" cy="183.7" r="2.2" fill="#B91C1C"/>
<text x="682.0" y="187.7" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vì “cân bằng” nên giá chắc chắn sẽ tôn trọng vùng</text>
<text x="682.0" y="203.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">này.</text>
<rect x="346.0" y="328.0" width="626.0" height="158.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
<text x="358.0" y="353.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">Đừng nhầm với Equilibrium</text>
<text x="358.0" y="373.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Equilibrium (EQ) là điểm giữa của một dealing range — đo từ swing low tới swing high. BPR là phần chồng của</text>
<text x="358.0" y="389.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hai FVG — có thể nằm ở premium, ở discount, hay ở EQ. Hai chữ “cân bằng” này nói về hai thứ khác nhau. Một</text>
<text x="358.0" y="405.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">BPR có thể nằm rất xa EQ, và EQ có thể không có BPR nào.</text>
<text x="28.0" y="540.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Cách nói an toàn: “BPR là dải giá đã được giao nhanh theo cả hai chiều”. Mọi câu về cân bằng cung cầu là diễn giải.</text>
</svg>
