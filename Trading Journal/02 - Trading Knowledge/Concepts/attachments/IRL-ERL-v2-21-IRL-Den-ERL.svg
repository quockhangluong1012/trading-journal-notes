<rect x="892.2" y="22" width="79.8" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="932.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DELIVERY</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">IRL → ERL: giá ghé “trạm dừng” bên trong rồi đi ra “ga cuối” bên ngoài</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đây là nửa “đi ra” của nhịp con lắc mà ICT mô tả. Nó là một trình tự THƯỜNG GẶP, không phải quy luật. Hình dựng (synthetic).</text>
