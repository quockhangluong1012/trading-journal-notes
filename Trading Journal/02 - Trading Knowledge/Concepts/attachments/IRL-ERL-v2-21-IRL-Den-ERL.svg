<text x="225.8" y="152.1" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">ERL trên (BSL)</text>
<text x="551.0" y="360.8" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG ở discount (IRL)</text>
<text x="281.5" y="245.1" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG giảm cũ (IRL)</text>
<line x1="318.7" y1="277.6" x2="467.4" y2="277.6" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="318.7" y="272.6" font-size="10" font-weight="700" fill="#D97706" text-anchor="start">đỉnh nội bộ</text>
<circle cx="411.6" cy="389.0" r="9" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="411.6" y="393.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="416.2" cy="328.6" r="9" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="416.2" y="332.6" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="451.4" cy="261.4" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="451.4" y="265.4" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="518.5" cy="251.0" r="9" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="518.5" y="255.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="597.4" cy="146.0" r="9" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="597.4" y="150.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="644.0" y="87.0" width="328.0" height="430.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="658.0" y="109.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Trình tự</text>
<circle cx="668.0" cy="126.0" r="10" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="130.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="686.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Giá hồi về IRL: một FVG tăng nằm ở nửa discount</text>
<text x="686.0" y="146.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">của range.</text>
<circle cx="668.0" cy="168.6" r="10" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="172.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="686.0" y="172.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Phản ứng: nến từ chối, không đóng cửa xuyên</text>
<text x="686.0" y="188.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">qua FVG.</text>
<circle cx="668.0" cy="211.1" r="10" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="215.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="686.0" y="215.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Displacement lên, phá đỉnh nội bộ gần nhất.</text>
<circle cx="668.0" cy="241.1" r="10" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="245.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="686.0" y="245.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Đi qua FVG giảm cũ (IRL phía trên) — đây là chỗ</text>
<text x="686.0" y="261.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">có thể khựng lại.</text>
<circle cx="668.0" cy="283.7" r="10" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="287.7" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="686.0" y="287.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">Chạm ERL trên: BSL trên đỉnh range bị lấy. Câu</text>
<text x="686.0" y="304.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="272.0">chuyện của range này kết thúc ở đây.</text>
<rect x="28.0" y="531.0" width="466.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="541.0" width="4.0" height="108.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="44.0" y="554.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Điều gì làm diễn giải mạnh lên</text>
<text x="44.0" y="575.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Phản ứng tại IRL nằm ở discount (với hướng tăng).</text>
<text x="44.0" y="591.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Có displacement + phá cấu trúc nội bộ sau phản ứng.</text>
<text x="44.0" y="608.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Bias khung lớn cùng hướng; ERL trên chưa bị lấy.</text>
<rect x="506.0" y="531.0" width="466.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="506.0" y="541.0" width="4.0" height="108.0" rx="2" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="522.0" y="554.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">Điều gì phủ nhận diễn giải</text>
<text x="522.0" y="575.5" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Nến đóng cửa xuyên qua FVG và xuống dưới đáy nội bộ gần nhất.</text>
<text x="522.0" y="591.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• Giá đi ngang lâu dưới EQ, không có displacement.</text>
<text x="522.0" y="608.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">• SSL ngoài range (đáy) bị lấy trước.</text>
<rect x="28.0" y="671.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="695.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Câu chuyện “IRL → ERL” chỉ là nhãn dán SAU khi đã thấy bước 3. Ở bước 1, bạn mới chỉ có một ỨNG VIÊN: giá đang ở IRL. Đó là lý do model ICT 2022 chờ sweep</text>
<text x="42.0" y="711.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">+ MSS + displacement ở khung nhỏ trước khi vào lệnh.</text>
</svg>
