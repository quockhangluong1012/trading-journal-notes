<rect x="170.1" y="228.9" width="334.5" height="24.4" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.9"/>
<path d="M40.0,342.6 L77.2,431.9 L132.9,383.2 L151.5,391.3 L170.1,358.8 L188.6,302.0 L207.2,172.1 L225.8,196.4 L244.4,220.8 L263.0,261.4 L281.5,293.9 L318.7,277.6 L355.9,326.4 L393.0,358.8 L411.6,371.0 L430.2,342.6 L448.8,350.7 L467.4,261.4 L485.9,269.5 L504.5,237.0 L523.1,245.2 L560.3,196.4 L597.4,164.0 L616.0,180.2" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
