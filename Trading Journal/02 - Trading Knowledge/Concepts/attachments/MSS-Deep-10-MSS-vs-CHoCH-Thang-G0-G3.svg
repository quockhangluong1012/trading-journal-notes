<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="700" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">MSS vs CHoCH — thuật ngữ KHÔNG thống nhất; giải pháp: thang tiêu chí G0–G3</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Thay vì cãi nhau 'cái này là MSS hay CHoCH', ghi rõ cú phá đạt TIÊU CHÍ nào. Bảng trái tóm tắt cách các nguồn dùng từ (Tier 3–4, kiểm tra 2026-10-07).</text>
<rect x="26.0" y="84.0" width="560.0" height="470.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="106.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Nguồn</text>
<text x="250.0" y="106.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Cách dùng (tóm tắt) → ≈ thang G</text>
<line x1="36.0" y1="114.0" x2="576.0" y2="114.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="130.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">ICT 2022 Mentorship (tóm tắt video)</text>
<text x="250.0" y="130.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">MSS = short-term low/high bị phá sau khi liquidity</text>
<text x="250.0" y="143.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">bị lấy; FVG trong displacement</text>
<text x="250.0" y="156.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ ≈ G1 · lớp internal</text>
<line x1="36.0" y1="175.0" x2="576.0" y2="175.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="191.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">innercircletrader.net</text>
<text x="250.0" y="191.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">CHoCH = phá swing ngược trend, KHÔNG cần</text>
<text x="250.0" y="204.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">displacement; MSS = cùng cú phá + displacement close</text>
<text x="250.0" y="217.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ CHoCH=G0 · MSS=G1</text>
<line x1="36.0" y1="236.0" x2="576.0" y2="236.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="252.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">ATAS blog</text>
<text x="250.0" y="252.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">CHoCH = tín hiệu cục bộ, sớm, có thể tạm thời; MSS =</text>
<text x="250.0" y="265.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">xung lực lớn hơn, xác nhận đổi trend</text>
<text x="250.0" y="278.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ CHoCH≈G0–G1 · MSS≈G2–G3</text>
<line x1="36.0" y1="297.0" x2="576.0" y2="297.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="313.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">AlphaEx Capital</text>
<text x="250.0" y="313.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">MSS dùng không nhất quán: hoặc ≡ CHoCH, hoặc 'shift</text>
<text x="250.0" y="326.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">đa khung đầy đủ'</text>
<text x="250.0" y="339.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ mơ hồ</text>
<line x1="36.0" y1="358.0" x2="576.0" y2="358.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="374.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">smartmoneyconcepts (Python)</text>
<text x="250.0" y="374.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">CHOCH = mẫu 4 swing: đáy thấp hơn rồi phá đỉnh;</text>
<text x="250.0" y="387.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">không có khái niệm MSS</text>
<text x="250.0" y="400.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ CHoCH=G0 · lớp swing</text>
<line x1="36.0" y1="419.0" x2="576.0" y2="419.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="435.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">LuxAlgo SMC</text>
<text x="250.0" y="435.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">CHoCH/BOS ở 2 lớp (internal, swing); strong/weak =</text>
<text x="250.0" y="448.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">protected</text>
<text x="250.0" y="461.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ G0 · hai lớp</text>
<line x1="36.0" y1="480.0" x2="576.0" y2="480.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="496.0" font-size="9.6" font-weight="700" fill="#1F2937" text-anchor="start">Vault: 09-CHoCH, MSS v1</text>
<text x="250.0" y="496.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">CHoCH ≈ MSS (cùng sự kiện), MSS chặt hơn</text>
<text x="250.0" y="509.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">(displacement + sweep)</text>
<text x="250.0" y="522.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">→ CHoCH=G0 · MSS=G1+</text>
<text x="40.0" y="540.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="start">Nhận xét: cùng chữ, khác tiêu chí; cùng tiêu chí, khác chữ. Không nguồn nào là văn bản chuẩn của ICT.</text>
<rect x="600.0" y="84.0" width="354.0" height="104.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="612.0" y="106.0" font-size="12" font-weight="800" fill="#334155" text-anchor="start">G0 · COUNTER-STATE BREAK</text>
<text x="612.0" y="128.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">close vượt mức tham chiếu NGƯỢC trạng thái ở lớp ℓ</text>
<text x="612.0" y="146.0" font-size="9.6" font-weight="600" fill="#6B7280" text-anchor="start">≈ 'CHoCH' trong đa số tài liệu SMC</text>
<text x="612.0" y="166.0" font-size="9.8" font-weight="700" fill="#334155" text-anchor="start">known_at: t</text>
<line x1="777.0" y1="188.0" x2="777.0" y2="202.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="600.0" y="202.0" width="354.0" height="104.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="612.0" y="224.0" font-size="12" font-weight="800" fill="#6D28D9" text-anchor="start">G1 · DISPLACEMENT-QUALIFIED</text>
<text x="612.0" y="246.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">G0 + leg phá ≥ x·ATR / thân ≥ y·ATR (+FVG tùy chọn)</text>
<text x="612.0" y="264.0" font-size="9.6" font-weight="600" fill="#6B7280" text-anchor="start">≈ 'MSS' theo innercircletrader.net, ICT 2022</text>
<text x="612.0" y="284.0" font-size="9.8" font-weight="700" fill="#6D28D9" text-anchor="start">known_at: t (FVG: t+1)</text>
<line x1="777.0" y1="306.0" x2="777.0" y2="320.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="600.0" y="320.0" width="354.0" height="104.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="612.0" y="342.0" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="start">G2 · ACCEPTED</text>
<text x="612.0" y="364.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">G1 + không close ngược qua mức trong k nến</text>
<text x="612.0" y="382.0" font-size="9.6" font-weight="600" fill="#6B7280" text-anchor="start">≈ 'MSS xác nhận' (nhiều giáo trình)</text>
<text x="612.0" y="402.0" font-size="9.8" font-weight="700" fill="#1D4ED8" text-anchor="start">known_at: t + k</text>
<line x1="777.0" y1="424.0" x2="777.0" y2="438.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="600.0" y="438.0" width="354.0" height="104.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="612.0" y="460.0" font-size="12" font-weight="800" fill="#15803D" text-anchor="start">G3 · STRUCTURALLY CONFIRMED</text>
<text x="612.0" y="482.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">G2 + HL/LH mới + BOS cùng hướng mới</text>
<text x="612.0" y="500.0" font-size="9.6" font-weight="600" fill="#6B7280" text-anchor="start">≈ 'MSS' theo ATAS / 'shift thật'</text>
<text x="612.0" y="520.0" font-size="9.8" font-weight="700" fill="#15803D" text-anchor="start">known_at: t + m</text>
<rect x="26.0" y="566.0" width="928.0" height="118.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="42.0" y="588.0" font-size="10.1" font-weight="700" fill="#6D28D9" text-anchor="start">Quy ước của note này (v2):</text>
<text x="42.0" y="605.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• Ghi MSS kèm grade + lớp + khung: ví dụ 'M5 MSS-I G1' (M5, lớp internal, có displacement) hoặc 'H1 MSS-P G2'.</text>
<text x="42.0" y="622.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• 'CHoCH' được hiểu là G0 khi đọc tài liệu SMC; không dùng như một khái niệm riêng trong journal để tránh trùng lặp.</text>
<text x="42.0" y="639.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• Mỗi bậc thêm thông tin NHƯNG thêm độ trễ: G3 chỉ biết sau m nến — lọc bằng xác nhận muộn mà vào lệnh tại G0 là RÒ RỈ TƯƠNG LAI (MSS-Sim-03: lọc 'BOS kế tiếp' → +0.62R ảo).</text>
<text x="42.0" y="656.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">• CISD (Change in State of Delivery) đo bằng giá MỞ của chuỗi nến giao hàng — là một trigger khác, thường sớm hơn G0 (xem §13.4 và note 41-Change-in-State-of-Delivery).</text>
</svg>