<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Chuỗi hình thành OB — chín bước: cái gì quan sát được, cái gì bắt buộc, cái gì biết được KHI NÀO</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cột 'biết lúc' là cột quan trọng nhất: mọi điều kiện chỉ biết sau t_avail không được dùng để chọn OB tại thời điểm trước đó.</text>
<text x="34.0" y="98.0" font-size="10.4" font-weight="700" fill="#6B7280" text-anchor="start">#</text>
<text x="60.0" y="98.0" font-size="10.4" font-weight="700" fill="#6B7280" text-anchor="start">bước</text>
<text x="262.0" y="98.0" font-size="10.4" font-weight="700" fill="#6B7280" text-anchor="start">quan sát được bằng gì</text>
<text x="560.0" y="98.0" font-size="10.4" font-weight="700" fill="#6B7280" text-anchor="start">bắt buộc?</text>
<text x="690.0" y="98.0" font-size="10.4" font-weight="700" fill="#6B7280" text-anchor="start">biết lúc</text>
<text x="790.0" y="98.0" font-size="10.4" font-weight="700" fill="#6B7280" text-anchor="start">nếu thiếu thì sao</text>
<rect x="26.0" y="106.0" width="928.0" height="44.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="34.0" y="132.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">1</text>
<text x="60.0" y="132.0" font-size="10.6" font-weight="700" fill="#334155" text-anchor="start">Bối cảnh trước đó</text>
<text x="262.0" y="132.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">xu hướng/range trên TF cao; vị trí trong dealing range</text>
<text x="560.0" y="132.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">không (định nghĩa)</text>
<text x="690.0" y="132.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">trước OB</text>
<text x="790.0" y="126.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">OB vẫn tồn tại; chất lượng là</text>
<text x="790.0" y="139.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">biến</text>
<rect x="26.0" y="158.0" width="928.0" height="44.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.1"/>
<text x="34.0" y="184.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">2</text>
<text x="60.0" y="184.0" font-size="10.6" font-weight="700" fill="#B45309" text-anchor="start">Điều kiện thanh khoản</text>
<text x="262.0" y="184.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">swing/equal lows đã xác nhận phía dưới; có bị quét không</text>
<text x="560.0" y="184.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">không — là BIẾN</text>
<text x="690.0" y="184.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">trước/đang OB</text>
<text x="790.0" y="178.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">OB 'không sweep' = một lớp</text>
<text x="790.0" y="191.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">khác, đo riêng</text>
<rect x="26.0" y="210.0" width="928.0" height="44.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
<text x="34.0" y="236.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">3</text>
<text x="60.0" y="236.0" font-size="10.6" font-weight="700" fill="#15803D" text-anchor="start">Nến/vùng ngược hướng</text>
<text x="262.0" y="236.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">close &lt; open (bullish OB); chuỗi liên tiếp</text>
<text x="560.0" y="236.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">CÓ (Tầng 1)</text>
<text x="690.0" y="236.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">close nến OB</text>
<text x="790.0" y="230.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">không có OB — chỉ có</text>
<text x="790.0" y="243.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">displacement</text>
<rect x="26.0" y="262.0" width="928.0" height="44.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
<text x="34.0" y="288.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">4</text>
<text x="60.0" y="288.0" font-size="10.6" font-weight="700" fill="#15803D" text-anchor="start">Displacement</text>
<text x="262.0" y="288.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Net ≥ x·ATR trong ≤ 5 nến; thân/range ≥ y</text>
<text x="560.0" y="288.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">CÓ (Tầng 1)</text>
<text x="690.0" y="288.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">close nến e</text>
<text x="790.0" y="288.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">chỉ là một nến — không phải OB</text>
<rect x="26.0" y="314.0" width="928.0" height="44.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
<text x="34.0" y="340.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">5</text>
<text x="60.0" y="340.0" font-size="10.6" font-weight="700" fill="#15803D" text-anchor="start">Hệ quả cấu trúc</text>
<text x="262.0" y="340.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">close vượt swing đã xác nhận (BOS/MSS); cấp swing</text>
<text x="560.0" y="340.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">CÓ (Tầng 2, ICT)</text>
<text x="690.0" y="340.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">close nến BOS</text>
<text x="790.0" y="334.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">OB 'không cấu trúc' — giá trị</text>
<text x="790.0" y="347.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">thấp hơn? (HYP)</text>
<rect x="26.0" y="366.0" width="928.0" height="44.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="34.0" y="392.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start">6</text>
<text x="60.0" y="392.0" font-size="10.6" font-weight="700" fill="#6D28D9" text-anchor="start">Xác định OB</text>
<text x="262.0" y="392.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">gán nhãn + đo vùng (full/body, MT, CE)</text>
<text x="560.0" y="392.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">—</text>
<text x="690.0" y="392.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">t_avail</text>
<text x="790.0" y="386.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">trước t_avail mọi nhãn là</text>
<text x="790.0" y="399.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">hindsight</text>
<rect x="26.0" y="418.0" width="928.0" height="44.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.1"/>
<text x="34.0" y="444.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">7</text>
<text x="60.0" y="444.0" font-size="10.6" font-weight="700" fill="#334155" text-anchor="start">Giá rời đi</text>
<text x="262.0" y="444.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">khoảng cách giá ↔ proximal tại t_avail (ATR)</text>
<text x="560.0" y="444.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">không</text>
<text x="690.0" y="444.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">t_avail</text>
<text x="790.0" y="438.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">giá vẫn trong vùng = không có</text>
<text x="790.0" y="451.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">lệnh limit sạch</text>
<rect x="26.0" y="470.0" width="928.0" height="44.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
<text x="34.0" y="496.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">8</text>
<text x="60.0" y="496.0" font-size="10.6" font-weight="700" fill="#1D4ED8" text-anchor="start">Giá quay lại</text>
<text x="262.0" y="496.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">chạm proximal trong W nến</text>
<text x="560.0" y="496.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">không — là KẾT CỤC</text>
<text x="690.0" y="496.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">sau t_avail</text>
<text x="790.0" y="496.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">OB 'chưa test' (unmitigated)</text>
<rect x="26.0" y="522.0" width="928.0" height="44.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="34.0" y="548.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start">9</text>
<text x="60.0" y="548.0" font-size="10.6" font-weight="700" fill="#B91C1C" text-anchor="start">Phản ứng / thất bại</text>
<text x="262.0" y="548.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">kết cục ①–⑥ ở OB-Deep-08</text>
<text x="560.0" y="548.0" font-size="9.8" font-weight="700" fill="#374151" text-anchor="start">không — là KẾT CỤC</text>
<text x="690.0" y="548.0" font-size="9.8" font-weight="600" fill="#6D28D9" text-anchor="start">sau t_avail</text>
<text x="790.0" y="542.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">đây là thứ phải dự báo, không</text>
<text x="790.0" y="555.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="start">được dùng để chọn</text>
<text x="26.0" y="600.0" font-size="10.6" font-weight="700" fill="#334155" text-anchor="start">Tầng 1 + 2 = định nghĩa tối thiểu (55 §3.2). Sweep, FVG, premium/discount, HTF… là CỘT DỮ LIỆU để đo — không nhồi vào định nghĩa.</text>
<text x="26.0" y="620.0" font-size="10.6" font-weight="700" fill="#B91C1C" text-anchor="start">Bước 8–9 là kết cục: dùng chúng để chọn OB = chọn theo kết quả (OB-Sim-05: +0.2R đến +1.3R 'edge' giả trên random walk).</text>
</svg>