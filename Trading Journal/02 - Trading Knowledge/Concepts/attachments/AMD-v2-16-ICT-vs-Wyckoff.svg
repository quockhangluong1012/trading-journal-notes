<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="738" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cùng chữ “Distribution”, hai nghĩa khác nhau: ICT Power of 3 và Wyckoff</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Wyckoff dùng Accumulation/Distribution để chỉ các VÙNG đi ngang ở đáy/đỉnh. ICT PO3 dùng Distribution để chỉ ĐOẠN giá chạy. Cú</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Spring / UTAD của Wyckoff có hình dạng rất giống pha Manipulation của ICT.</text>
<rect x="899.0" y="22.0" width="73.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="935.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SO SÁNH</text>
<rect x="28.0" y="104.0" width="470.0" height="280.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="128.0" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">Wyckoff Accumulation (đơn giản hóa)</text>
<rect x="111.1" y="224.0" width="260.4" height="68.0" rx="2" fill="#EAF2FF"/>
<path d="M46.0,164.0 L67.7,204.0 L89.4,254.0 L111.1,290.0 L132.8,226.0 L154.5,276.0 L176.2,236.0 L197.9,284.0 L219.6,232.0 L241.3,280.0 L263.0,312.0 L284.7,272.0 L306.4,216.0 L328.1,242.0 L349.8,196.0 L371.5,176.0 L393.2,188.0 L414.9,164.0 L436.6,152.0" fill="none" stroke="#334155" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="111.1" cy="290.0" r="3.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="111.1" y="306.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">SC</text>
<circle cx="132.8" cy="226.0" r="3.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="132.8" y="218.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">AR</text>
<circle cx="263.0" cy="312.0" r="3.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="263.0" y="328.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">Spring</text>
<circle cx="306.4" cy="216.0" r="3.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="306.4" y="208.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">SOS</text>
<circle cx="328.1" cy="242.0" r="3.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="328.1" y="258.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">LPS</text>
<text x="414.9" y="154.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="end">Markup</text>
<text x="44.0" y="366.0" font-size="11.5" font-weight="600" fill="#EA580C" text-anchor="start">Spring = cú thủng đáy range rồi quay vào ≈ hình dạng M của bullish PO3.</text>
<rect x="28.0" y="396.0" width="470.0" height="280.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="420.0" font-size="13.5" font-weight="700" fill="#E0464B" text-anchor="start">Wyckoff Distribution (đơn giản hóa)</text>
<rect x="111.1" y="488.0" width="260.4" height="68.0" rx="2" fill="#FDECEC"/>
<path d="M46.0,616.0 L67.7,576.0 L89.4,526.0 L111.1,490.0 L132.8,554.0 L154.5,504.0 L176.2,544.0 L197.9,496.0 L219.6,548.0 L241.3,500.0 L263.0,468.0 L284.7,508.0 L306.4,564.0 L328.1,538.0 L349.8,584.0 L371.5,604.0 L393.2,592.0 L414.9,616.0 L436.6,628.0" fill="none" stroke="#334155" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="111.1" cy="490.0" r="3.5" fill="#E0464B" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="111.1" y="482.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">BC</text>
<circle cx="132.8" cy="554.0" r="3.5" fill="#E0464B" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="132.8" y="570.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">AR</text>
<circle cx="263.0" cy="468.0" r="3.5" fill="#E0464B" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="263.0" y="460.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">UTAD</text>
<circle cx="306.4" cy="564.0" r="3.5" fill="#E0464B" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="306.4" y="580.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">SOW</text>
<circle cx="328.1" cy="538.0" r="3.5" fill="#E0464B" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="328.1" y="530.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">LPSY</text>
<text x="414.9" y="644.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="end">Markdown</text>
<text x="44.0" y="658.0" font-size="11.5" font-weight="600" fill="#EA580C" text-anchor="start">UTAD = cú vượt đỉnh range rồi quay vào ≈ hình dạng M của bearish PO3.</text>
<rect x="512.0" y="104.0" width="460.0" height="572.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="526.0" y="128.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Bảng nghĩa của từ</text>
<rect x="524.0" y="152.0" width="436.0" height="34.0" rx="4" fill="#F3F4F6" stroke="#EEF0F4" stroke-width="1.2"/>
<text x="532.0" y="172.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Từ</text>
<text x="640.0" y="172.0" font-size="11.3" font-weight="700" fill="#E0464B" text-anchor="start">Wyckoff</text>
<text x="802.0" y="172.0" font-size="11.3" font-weight="700" fill="#4338CA" text-anchor="start">ICT Power of 3</text>
<rect x="524.0" y="190.0" width="436.0" height="64.5" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<text x="532.0" y="210.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Accumulation</text>
<text x="640.0" y="210.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vùng đi ngang ở ĐÁY, trước</text>
<text x="640.0" y="225.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">khi tăng (markup).</text>
<text x="802.0" y="210.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vùng đi ngang TRƯỚC cú</text>
<text x="802.0" y="225.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lệch — dùng cho cả ngày</text>
<text x="802.0" y="241.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">tăng lẫn ngày giảm.</text>
<rect x="524.0" y="258.5" width="436.0" height="64.5" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<text x="532.0" y="278.5" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Manipulation</text>
<text x="640.0" y="278.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">(không dùng chữ này) — gần</text>
<text x="640.0" y="294.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhất là Spring / Upthrust</text>
<text x="640.0" y="309.7" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">/ UTAD.</text>
<text x="802.0" y="278.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Cú lệch khỏi vùng đi ngang,</text>
<text x="802.0" y="294.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lấy liquidity, rồi thua.</text>
<rect x="524.0" y="327.0" width="436.0" height="64.5" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<text x="532.0" y="347.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Distribution</text>
<text x="640.0" y="347.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vùng đi ngang ở ĐỈNH, nơi</text>
<text x="640.0" y="362.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">hàng được bán ra, trước</text>
<text x="640.0" y="378.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">khi giảm (markdown).</text>
<text x="802.0" y="347.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">ĐOẠN giá chạy theo hướng</text>
<text x="802.0" y="362.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">thật sau cú lệch — có thể</text>
<text x="802.0" y="378.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">đi lên hoặc đi xuống.</text>
<rect x="524.0" y="395.5" width="436.0" height="64.5" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<text x="532.0" y="415.5" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Bearish ngày</text>
<text x="640.0" y="415.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Distribution (đỉnh) →</text>
<text x="640.0" y="431.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Markdown.</text>
<text x="802.0" y="415.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vẫn gọi A → M → D: tích</text>
<text x="802.0" y="431.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lũy → vượt đỉnh → chạy</text>
<text x="802.0" y="446.7" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">xuống.</text>
<rect x="524.0" y="472.0" width="436.0" height="47.4" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
<text x="534.0" y="493.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đừng trộn hai nghĩa. Khi đọc “distribution” trong tài liệu ICT, hiểu là</text>
<text x="534.0" y="509.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“đoạn giá chạy về đích”, không phải “tổ chức đang xả hàng ở đỉnh”.</text>
<rect x="524.0" y="527.4" width="436.0" height="63.2" rx="8" fill="#FFF7E6" stroke="#B45309" stroke-width="1"/>
<text x="534.0" y="548.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">[DIỄN GIẢI] Wyckoff gán vùng đi ngang cho “composite operator”; ICT</text>
<text x="534.0" y="564.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">gán cho “smart money/thuật toán”. Cả hai đều là câu chuyện về người</text>
<text x="534.0" y="580.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tham gia — chart không xác nhận được.</text>
</svg>
