<svg viewBox="0 0 1100 640" width="1100" height="640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>BOS qua ba khung D1 → H1 → M5: cùng chữ &quot;BOS&quot;, ba quy mô sự kiện khác nhau</title>
<desc>BOS qua ba khung D1 → H1 → M5: cùng chữ &quot;BOS&quot;, ba quy mô sự kiện khác nhau. Đọc từ trái sang phải. Khung chữ nhật nét đứt là phần được phóng to sang khung kế tiếp. Minh họa, không phải dữ liệu thật.</desc>
