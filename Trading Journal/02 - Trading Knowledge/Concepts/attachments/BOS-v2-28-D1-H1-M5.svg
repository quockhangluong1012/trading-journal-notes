" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1100" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">BOS qua ba khung D1 → H1 → M5: cùng chữ &quot;BOS&quot;, ba quy mô sự kiện khác nhau</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Đọc từ trái sang phải. Khung chữ nhật nét đứt là phần được phóng to sang khung kế tiếp. Minh họa, không phải dữ liệu thật.</tspan></text>
<rect x="24.0" y="112.0" width="340.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="26.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">D1 = BỐI CẢNH</tspan></text>
<rect x="243.3" y="256.6" width="104.7" height="59.0" rx="2" fill="#E8F6F0" stroke="#1D9E75" stroke-width="0.8" opacity="0.4"/>
<text x="246.4" y="331.6" font-size="11" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">discount D1</tspan></text>
<line x1="169.4" y1="256.6" x2="348.0" y2="256.6" stroke="#6B7280" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="169.4" y="270.6" font-size="11" fill="#6B7280" text-anchor="start"><tspan>EQ</tspan></text>
<polyline points="40.0,363.8 101.6,262.0 132.4,304.9 169.4,197.7 194.0,235.2 231.0,149.4 267.9,219.1 298.7,203.0 329.5,278.1" fill="none" stroke="#1F2937" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="169.4" y1="197.7" x2="221.7" y2="197.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="162.4" y="172.2" width="63.1" height="19.0" rx="9.5" fill="#EAF1FE" stroke="#2563EB" stroke-width="0.9"/>
<text x="194.0" y="185.3" font-size="10" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">BOS ↑ D1</tspan></text>
<circle cx="194.0" cy="235.2" r="3.6" fill="#1D9E75"/>
<text x="202.0" y="251.2" font-size="10.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">protected low</tspan></text>
<rect x="261.8" y="192.3" width="80.1" height="101.8" rx="2" fill="#FEF7E6" stroke="#B45309" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.25"/>
<rect x="380.0" y="112.0" width="340.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="382.0" y="104.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">H1 = SETUP</tspan></text>
<rect x="396.0" y="304.9" width="308.0" height="80.4" rx="2" fill="#EAF1FE" stroke="#2563EB" stroke-width="0.8" opacity="0.4"/>
<text x="400.0" y="317.4" font-size="10.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">POI D1 (vùng quan tâm)</tspan></text>
<polyline points="396.0,149.4 433.0,224.5 454.5,192.3 500.7,272.7 525.4,240.6 568.5,315.6 590.0,283.4 623.9,337.0 639.3,315.6 654.7,347.8 685.5,288.8" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="568.5" y1="315.6" x2="660.9" y2="315.6" stroke="#D85A30" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="624.1" y="357.8" font-size="11" fill="#DC2626" text-anchor="end"><tspan font-weight="700">quét đáy H1</tspan></text>
<text x="453.3" y="165.5" font-size="11" fill="#B45309" text-anchor="start"><tspan font-weight="700">nhịp lùi: LH–LL (BOS ↓ H1)</tspan></text>
<rect x="636.2" y="267.4" width="64.7" height="96.5" rx="2" fill="#E8F6F0" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.25"/>
<rect x="736.0" y="112.0" width="340.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="738.0" y="104.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">M5 = THỰC THI</tspan></text>
<line x1="795.1" y1="256.6" x2="887.5" y2="256.6" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="924.5" y1="224.5" x2="986.1" y2="224.5" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="752.0,208.4 795.1,256.6 813.6,240.6 844.4,358.5 893.7,224.5 912.2,251.3 924.5,224.5 949.1,245.9 1010.7,165.5 1047.7,181.6" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="862.9" y="272.7" width="24.6" height="32.2" rx="2" fill="#F1EBFD" stroke="#7C3AED" stroke-width="0.8" opacity="0.55"/>
<text x="892.5" y="292.8" font-size="10.5" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">FVG</tspan></text>
<text x="844.4" y="374.5" font-size="11" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">quét</tspan></text>
<circle cx="879.8" cy="256.6" r="5" fill="#7C3AED"/>
<text x="871.8" y="250.6" font-size="12" fill="#7C3AED" text-anchor="end"><tspan font-weight="700">MSS ↑</tspan></text>
<circle cx="967.6" cy="224.5" r="5" fill="#1D9E75"/>
<text x="975.6" y="240.5" font-size="12" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">BOS ↑ M5</tspan></text>
<line x1="366.0" y1="260.0" x2="378.0" y2="260.0" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar_mute)"/>
<line x1="722.0" y1="260.0" x2="734.0" y2="260.0" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar_mute)"/>
<rect x="24.0" y="428.0" width="340.0" height="196.0" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.0"/>
<rect x="24.0" y="428.0" width="5.0" height="196.0" rx="2" fill="#2563EB"/>
<text x="38.0" y="448.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">D1 trả lời: &quot;Tôi đang ở đâu?&quot;</tspan></text>
<text x="38.0" y="467.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Cấu trúc lớn tăng (BOS ↑ D1 gần nhất), giá đang lùi về</tspan></text>
<text x="38.0" y="484.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>discount. D1 BOS là bối cảnh: nói chiều chính, không</tspan></text>
<text x="38.0" y="501.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>nói khi nào vào. Chỉ thủng protected low D1 mới đổi</tspan></text>
<text x="38.0" y="517.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>bối cảnh.</tspan></text>
<rect x="380.0" y="428.0" width="340.0" height="196.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="380.0" y="428.0" width="5.0" height="196.0" rx="2" fill="#B45309"/>
<text x="394.0" y="448.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">H1 trả lời: &quot;Giá đang làm gì?&quot;</tspan></text>
<text x="394.0" y="467.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Nhịp lùi có cấu trúc giảm nhỏ. BOS ↓ H1 trong nhịp lùi</tspan></text>
<text x="394.0" y="484.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>là BÌNH THƯỜNG, không phủ định D1. Setup bắt đầu</tspan></text>
<text x="394.0" y="501.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>khi giá vào POI D1 và quét thanh khoản.</tspan></text>
<rect x="736.0" y="428.0" width="340.0" height="196.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="736.0" y="428.0" width="5.0" height="196.0" rx="2" fill="#1D9E75"/>
<text x="750.0" y="448.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">M5 trả lời: &quot;Có cò chưa?&quot;</tspan></text>
<text x="750.0" y="467.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Quét → MSS ↑ có displacement → FVG. BOS ↑ M5</tspan></text>
<text x="750.0" y="484.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>sau đó chỉ xác nhận nhịp ngắn hạn. M5 BOS ≠ H1 đổi</tspan></text>
<text x="750.0" y="501.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>chiều ≠ D1 BOS.</tspan></text>
</svg>
