<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Micro-gap: CE chìm trong spread và noise</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">GBPNZD phiên Á - gap 4.5 pip, CE cách hai mép 2.2 pip, spread trung bình phiên 2.6 pip</text>

  <line x1="640" y1="110" x2="640" y2="660" stroke="#2a2e39" stroke-width="2"/>

  <!-- Left: micro gap zoomed -->
  <text x="60" y="140" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff6b6b">Gap 4.5 pip (k=1.7)</text>

  <g>
    <line x1="120" y1="280" x2="120" y2="330" stroke="#26a69a" stroke-width="2"/>
    <rect x="112" y="285" width="16" height="35" fill="#26a69a" rx="1"/>
    <line x1="170" y1="260" x2="170" y2="310" stroke="#26a69a" stroke-width="2"/>
    <rect x="162" y="265" width="16" height="35" fill="#26a69a" rx="1"/>
  </g>
  <!-- FVG box small -->
  <rect x="190" y="330" width="120" height="55" fill="#f2c94c" opacity="0.14" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="190" y1="357" x2="310" y2="357" stroke="#f2c94c" stroke-width="1.5"/>
  <text x="250" y="350" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#f2c94c">CE</text>
  <text x="250" y="410" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#787b86">gap 4.5 pip / CE 2.2 pip từ mép</text>

  <!-- spread band overlay -->
  <rect x="190" y="343" width="120" height="28" fill="#ff6b6b" opacity="0.22"/>
  <text x="250" y="440" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ff6b6b">băng spread 2.6 pip trùm lên CE</text>

  <g>
    <line x1="330" y1="330" x2="330" y2="390" stroke="#787b86" stroke-width="2"/>
    <rect x="322" y="335" width="16" height="50" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="380" y1="340" x2="380" y2="400" stroke="#787b86" stroke-width="2"/>
    <rect x="372" y="345" width="16" height="50" fill="#787b86" rx="1" opacity="0.7"/>
    <line x1="430" y1="335" x2="430" y2="395" stroke="#787b86" stroke-width="2"/>
    <rect x="422" y="340" width="16" height="50" fill="#787b86" rx="1" opacity="0.7"/>
  </g>
  <text x="380" y="440" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">giá dập dềnh, không thể phân biệt</text>
  <text x="380" y="460" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#787b86">với random walk quanh CE</text>

  <rect x="150" y="500" width="300" height="46" rx="8" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="300" y="529" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">✗ k=1.7, dưới ngưỡng 3</text>

  <!-- Right: large gap for comparison -->
  <text x="700" y="140" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#26a69a">Gap 14 pip (k=5.4)</text>

  <g>
    <line x1="760" y1="240" x2="760" y2="290" stroke="#26a69a" stroke-width="2"/>
    <rect x="752" y="245" width="16" height="35" fill="#26a69a" rx="1"/>
    <line x1="810" y1="220" x2="810" y2="270" stroke="#26a69a" stroke-width="2"/>
    <rect x="802" y="225" width="16" height="35" fill="#26a69a" rx="1"/>
  </g>
  <rect x="830" y="290" width="160" height="140" fill="#f2c94c" opacity="0.14" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="830" y1="360" x2="990" y2="360" stroke="#f2c94c" stroke-width="2"/>
  <text x="910" y="353" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#f2c94c">CE rõ ràng</text>

  <g>
    <line x1="1010" y1="300" x2="1010" y2="350" stroke="#787b86" stroke-width="2"/>
    <rect x="1002" y="305" width="16" height="35" fill="#787b86" rx="1" opacity="0.7"/>
  </g>
  <!-- reaction candle bouncing off CE -->
  <line x1="1060" y1="355" x2="1060" y2="420" stroke="#26a69a" stroke-width="2.5"/>
  <rect x="1050" y="360" width="20" height="40" fill="#26a69a" rx="1"/>
  <text x="910" y="470" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#26a69a">reject dứt khoát tại CE, displacement rõ</text>

  <rect x="790" y="500" width="300" height="46" rx="8" fill="#26a69a" opacity="0.18" stroke="#26a69a" stroke-width="1.5"/>
  <text x="940" y="529" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">✓ k=5.4, CE có nghĩa</text>

  <text x="640" y="695" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Rule: k = độ rộng gap / spread trung bình phiên, cần k ≥ 3 để CE có ý nghĩa - xem EC-C1</text>
</svg>
