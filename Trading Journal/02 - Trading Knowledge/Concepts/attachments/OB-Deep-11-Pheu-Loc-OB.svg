<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Từ 'nến ngược hướng' tới 'OB đủ narrative' — phễu lọc trên dữ liệu KHÔNG có edge</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Số liệu OB-Sim-01 (random walk Gaussian, nến M5). Lọc càng chặt, OB càng ít và trông càng 'đẹp' — nhưng vẫn sinh ra từ nhiễu thuần túy.</text>
<rect x="65.0" y="90.0" width="850.0" height="54.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="490.0" y="112.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="middle">D0  nến giảm + ≥ 2 nến tăng</text>
<text x="490.0" y="131.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="middle">250 / 1.000 nến  ·  ≈ 72 / ngày M5</text>
<rect x="155.2" y="160.0" width="669.6" height="54.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
<text x="490.0" y="182.0" font-size="11.2" font-weight="700" fill="#B45309" text-anchor="middle">D3a + displacement ≥ 1.5 ATR</text>
<text x="490.0" y="201.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="middle">168 / 1.000 nến  ·  ≈ 48 / ngày</text>
<rect x="257.5" y="230.0" width="465.0" height="54.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="490.0" y="252.0" font-size="11.2" font-weight="700" fill="#1D4ED8" text-anchor="middle">D3b + BOS (close qua swing đã xác nhận)</text>
<text x="490.0" y="271.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="middle">75 / 1.000 nến  ·  ≈ 21.5 / ngày</text>
<rect x="285.0" y="300.0" width="410.0" height="54.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="490.0" y="322.0" font-size="11.2" font-weight="700" fill="#6D28D9" text-anchor="middle">D3c + FVG trong leg</text>
<text x="490.0" y="341.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="middle">50 / 1.000 nến  ·  ≈ 14.5 / ngày</text>
<rect x="329.0" y="370.0" width="322.0" height="54.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="490.0" y="392.0" font-size="11.2" font-weight="700" fill="#15803D" text-anchor="middle">D3d + sweep swing đối diện trước đó</text>
<text x="490.0" y="411.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="middle">10 / 1.000 nến  ·  ≈ 3 / ngày</text>
<rect x="26.0" y="448.0" width="928.0" height="98.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="38.0" y="468.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="start">Đọc thế nào</text>
<text x="38.0" y="486.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Tần suất cao KHÔNG nói OB vô dụng — nó nói 'sự xuất hiện của một OB đẹp' không phải bằng chứng gì. Bằng chứng chỉ đến từ so sánh với đối chứng (OB-Sim-02).</text>
<text x="38.0" y="503.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• 18% OB D3b trên random walk có 'sweep' trước đó, 68% có FVG: hai 'confluence' này xuất hiện tự nhiên với tần suất cao — phải đo giá trị GIA TĂNG của chúng, không phải sự hiện diện.</text>
<text x="38.0" y="520.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Một ngày M5 của dữ liệu ngẫu nhiên cho ~3 OB 'sách giáo khoa'. Bộ sưu tập ảnh chụp 'OB đẹp' không bao giờ là thiếu.</text>
</svg>