<rect x="512.0" y="92.5" width="460.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="525.0,961.0">Bảng cấp độ (khung nghiên cứu, không phải luật)</text>
<rect x="528.0" y="142.5" width="130.0" height="29.0" rx="0" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="536.0" y="160.8" font-size="11.5" font-weight="700" fill="#111827" data-bx="528.0,658.0">Cấp</text>
<rect x="658.0" y="142.5" width="298.0" height="29.0" rx="0" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="666.0" y="160.8" font-size="11.5" font-weight="700" fill="#111827" data-bx="658.0,956.0">Phá nó nói lên điều gì?</text>
<rect x="528.0" y="171.5" width="130.0" height="29.0" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="536.0" y="189.8" font-size="11.5" font-weight="700" fill="#6B7280" data-bx="528.0,658.0">L1 Micro</text>
<rect x="658.0" y="171.5" width="298.0" height="29.0" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="666.0" y="189.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">Gần như không gì. Nhiễu trong một cụm vài nến.</text>
<rect x="528.0" y="200.5" width="130.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="536.0" y="218.8" font-size="11.5" font-weight="700" fill="#475569" data-bx="528.0,658.0">L2 Internal</text>
<rect x="658.0" y="200.5" width="298.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="666.0" y="218.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">Đợt hồi đang sâu hơn. Lớp nhỏ có thể đổi chiều</text>
<text x="666.0" y="234.7" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">(CHoCH internal).</text>
<rect x="528.0" y="245.3" width="130.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="536.0" y="263.7" font-size="11.5" font-weight="700" fill="#2563EB" data-bx="528.0,658.0">L3 Trung gian</text>
<rect x="658.0" y="245.3" width="298.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="666.0" y="263.7" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">Một nhịp con của chân sóng bị xoá. Cảnh báo</text>
<text x="666.0" y="279.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">nhưng chưa đổi lớp chính.</text>
<rect x="528.0" y="290.2" width="130.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="536.0" y="308.5" font-size="11.5" font-weight="700" fill="#B45309" data-bx="528.0,658.0">L4 Protected</text>
<rect x="658.0" y="290.2" width="298.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="666.0" y="308.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">Cú tăng gần nhất bị xoá. Trạng thái của lớp/khung</text>
<text x="666.0" y="324.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">này đổi: CHoCH đúng nghĩa.</text>
<rect x="528.0" y="335.0" width="130.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="536.0" y="353.4" font-size="11.5" font-weight="700" fill="#B91C1C" data-bx="528.0,658.0">L5 External / HTF</text>
<rect x="658.0" y="335.0" width="298.0" height="44.9" rx="0" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1"/>
<text x="666.0" y="353.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">Ranh của dealing range hoặc swing khung lớn.</text>
<text x="666.0" y="369.3" font-size="11.5" font-weight="400" fill="#111827" data-bx="658.0,956.0">Đổi câu chuyện của cả khung lớn.</text>
<text x="528.0" y="401.9" font-size="11.8" font-weight="400" fill="#6B7280" data-bx="527.0,957.0">Trọng lượng của một swing đến từ việc nó đã LÀM gì (phóng ra BOS, giới</text>
<text x="528.0" y="418.7" font-size="11.8" font-weight="400" fill="#6B7280" data-bx="527.0,957.0">hạn range, bị quét…), không đến từ việc nó “trông to”. Thang L1–L5 dùng</text>
<text x="528.0" y="435.4" font-size="11.8" font-weight="400" fill="#6B7280" data-bx="527.0,957.0">chung với note 21 và 57.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Thang L1–L5 là [FRAMEWORK-DEPENDENT]: cách chia cấp là một quy ước nghiên cứu của vault, cần khai báo trước khi backtest.</text>
