<line x1="346.7" y1="300.5" x2="482.0" y2="300.5" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="480.0" y="317.5" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">protected low = L4</text>
<line x1="158.8" y1="421.6" x2="482.0" y2="421.6" stroke="#B91C1C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
