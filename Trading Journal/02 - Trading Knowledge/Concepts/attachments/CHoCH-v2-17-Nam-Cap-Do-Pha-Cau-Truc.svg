<text x="445.9" y="199.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">L1 micro</text>
<text x="301.3" y="291.6" font-size="10" font-weight="700" fill="#475569" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">L2 internal</text>
<text x="388.0" y="278.3" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,488.0">L3</text>
