<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="498.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">MSS, BOS, displacement, FVG đứng ở đâu? Ba ngăn kéo khác nhau</text>
<rect x="844.5" y="23.0" width="127.5" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="908.3" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">KHUNG PHÂN LOẠI</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Lỗi phổ biến: thấy các yếu tố hay đi cùng nhau rồi biến tất cả thành “điều kiện bắt buộc”. Hãy cất mỗi thứ vào đúng ngăn.</text>
<rect x="28.0" y="94.5" width="306.0" height="344.0" rx="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="28.0" y="94.5" width="306.0" height="58.0" rx="11" fill="#2563EB" fill-opacity="0.1"/>
<text x="42.0" y="119.5" font-size="13" font-weight="700" fill="#2563EB">NGĂN 1 · Điều kiện HÌNH THÀNH</text>
<text x="42.0" y="139.5" font-size="11.2" font-weight="400" fill="#111827">Thiếu một thứ → không gọi là Breaker</text>
<circle cx="48.0" cy="174.5" r="4.0" fill="#2563EB"/>
<text x="60.0" y="178.5" font-size="12.3" font-weight="700" fill="#111827">Nến tại đỉnh/đáy giữa</text>
<text x="60.0" y="195.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="59.0,321.0">ICT: up-close / down-close candle ở swing</text>
<text x="60.0" y="211.9" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="59.0,321.0">gần nhất.</text>
<circle cx="48.0" cy="234.4" r="4.0" fill="#2563EB"/>
<text x="60.0" y="238.4" font-size="12.3" font-weight="700" fill="#111827">Cực trị cũ bị vi phạm</text>
<text x="60.0" y="255.4" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="59.0,321.0">ICT: “prior to an old low/high being violated”.</text>
<circle cx="48.0" cy="277.9" r="4.0" fill="#2563EB"/>
<text x="60.0" y="281.9" font-size="12.3" font-weight="700" fill="#111827">Swing giữa bị phá</text>
<text x="60.0" y="298.9" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="59.0,321.0">ICT: “break through that swing high to</text>
<text x="60.0" y="315.3" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="59.0,321.0">confirm”. Trên khung đó, sự kiện này là một</text>
<text x="60.0" y="331.8" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="59.0,321.0">MSS.</text>
<line x1="335.0" y1="266.5" x2="341.5" y2="266.5" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<polygon points="346.0,266.5 341.0,269.8 341.0,263.1" fill="#475569"/>
<rect x="347.0" y="94.5" width="306.0" height="344.0" rx="11" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<rect x="347.0" y="94.5" width="306.0" height="58.0" rx="11" fill="#B45309" fill-opacity="0.1"/>
<text x="361.0" y="119.5" font-size="13" font-weight="700" fill="#B45309">NGĂN 2 · Bằng chứng CHẤT LƯỢNG</text>
<text x="361.0" y="139.5" font-size="11.2" font-weight="400" fill="#111827">Có thì tốt hơn (giả thuyết), thiếu vẫn là Breaker</text>
<circle cx="367.0" cy="174.5" r="4.0" fill="#B45309"/>
<text x="379.0" y="178.5" font-size="12.3" font-weight="700" fill="#111827">Thân nến ĐÓNG qua swing</text>
<text x="379.0" y="195.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">Quy ước của note. ICT không nói rõ thân hay</text>
<text x="379.0" y="211.9" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">râu.</text>
<circle cx="367.0" cy="234.4" r="4.0" fill="#B45309"/>
<text x="379.0" y="238.4" font-size="12.3" font-weight="700" fill="#111827">Displacement</text>
<text x="379.0" y="255.4" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">Cú phá nhanh, thân dài. ICT chỉ tả là</text>
<text x="379.0" y="271.9" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">“explosive”.</text>
<circle cx="367.0" cy="294.3" r="4.0" fill="#B45309"/>
<text x="379.0" y="298.3" font-size="12.3" font-weight="700" fill="#111827">FVG trong nhịp phá</text>
<text x="379.0" y="315.3" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">Không có trong bài giảng Breaker. Chồng lên</text>
<text x="379.0" y="331.8" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">Breaker → cộng đồng gọi “Unicorn”.</text>
<circle cx="367.0" cy="354.3" r="4.0" fill="#B45309"/>
<text x="379.0" y="358.3" font-size="12.3" font-weight="700" fill="#111827">Túi liquidity lớn, cùng hướng khung lớn</text>
<text x="379.0" y="375.3" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="378.0,640.0">Là bộ lọc của bạn, không phải định nghĩa.</text>
<line x1="654.0" y1="266.5" x2="660.5" y2="266.5" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<polygon points="665.0,266.5 660.0,269.8 660.0,263.1" fill="#475569"/>
<rect x="666.0" y="94.5" width="306.0" height="344.0" rx="11" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>
<rect x="666.0" y="94.5" width="306.0" height="58.0" rx="11" fill="#15803D" fill-opacity="0.1"/>
<text x="680.0" y="119.5" font-size="13" font-weight="700" fill="#15803D">NGĂN 3 · Tín hiệu VÀO LỆNH</text>
<text x="680.0" y="139.5" font-size="11.2" font-weight="400" fill="#111827">Chỉ xét khi giá ĐÃ quay lại vùng, trên khung nhỏ</text>
<circle cx="686.0" cy="174.5" r="4.0" fill="#15803D"/>
<text x="698.0" y="178.5" font-size="12.3" font-weight="700" fill="#111827">Giá chạm vùng Breaker</text>
<text x="698.0" y="195.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="697.0,959.0">Mới là “đến nơi”, chưa phải tín hiệu.</text>
<circle cx="686.0" cy="217.9" r="4.0" fill="#15803D"/>
<text x="698.0" y="221.9" font-size="12.3" font-weight="700" fill="#111827">Sweep nhỏ + MSS khung nhỏ</text>
<text x="698.0" y="238.9" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="697.0,959.0">Bằng chứng rằng vùng đang được bảo vệ.</text>
<circle cx="686.0" cy="261.4" r="4.0" fill="#15803D"/>
<text x="698.0" y="265.4" font-size="12.3" font-weight="700" fill="#111827">Displacement + FVG khung nhỏ</text>
<text x="698.0" y="282.4" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="697.0,959.0">Nơi đặt lệnh và nơi đặt mức dừng.</text>
<text x="28.0" y="467.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">BOS và MSS: cùng một cú phá có thể mang hai tên. So với nhịp vừa tạo cực trị mới thì nó là MSS; nếu khung lớn vốn đang đi cùng hướng thì trên khung lớn nó là</text>
<text x="28.0" y="484.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">BOS (tiếp diễn).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
