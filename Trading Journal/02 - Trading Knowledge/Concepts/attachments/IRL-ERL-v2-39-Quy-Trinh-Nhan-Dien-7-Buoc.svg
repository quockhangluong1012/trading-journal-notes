<text x="652.0" y="305.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="323.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">IRL: … (loại 1/2/3/4)</text>
<line x1="57.0" y1="356.0" x2="57.0" y2="362.0" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah94A3B8)"/>
<rect x="28.0" y="363.0" width="944.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
