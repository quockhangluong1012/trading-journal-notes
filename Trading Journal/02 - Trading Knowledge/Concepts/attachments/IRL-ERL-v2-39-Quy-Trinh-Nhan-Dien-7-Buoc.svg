<text x="100.0" y="297.0" font-size="14" font-weight="700" fill="#D97706" text-anchor="start">Đánh dấu IRL</text>
<text x="100.0" y="319.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Đỉnh/đáy nội bộ đáng kể nào? FVG chưa lấp nào? Loại pool hay imbalance?</text>
