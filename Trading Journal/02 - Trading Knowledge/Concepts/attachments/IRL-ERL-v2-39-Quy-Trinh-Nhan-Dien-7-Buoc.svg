<rect x="70.0" y="455.0" width="16.0" height="84.0" rx="0" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="57.0" y="505.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="100.0" y="481.0" font-size="14" font-weight="700" fill="#059669" text-anchor="start">Bối cảnh liquidity</text>
<text x="100.0" y="503.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Cái gì đã bị lấy? Cái gì còn? Cái nào là ứng viên DOL, cái nào là đối thủ?</text>
<rect x="640.0" y="469.0" width="318.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="652.0" y="489.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="507.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">Đã lấy: …  Còn: …  DOL: …</text>
<line x1="57.0" y1="540.0" x2="57.0" y2="546.0" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah94A3B8)"/>
<rect x="28.0" y="547.0" width="944.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="547.0" width="58.0" height="84.0" rx="10" fill="#2563EB" stroke="none" stroke-width="1.2"/>
<rect x="70.0" y="547.0" width="16.0" height="84.0" rx="0" fill="#2563EB" stroke="none" stroke-width="1.2"/>
