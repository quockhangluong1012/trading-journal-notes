<text x="100.0" y="389.0" font-size="14" font-weight="700" fill="#0F766E" text-anchor="start">Định vị giá hiện tại</text>
<text x="100.0" y="411.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Giá ở trong range? Premium hay discount? Gần IRL hay gần ERL? Đang quay lại range?</text>
<rect x="640.0" y="377.0" width="318.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="652.0" y="397.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="415.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">Vị trí: …</text>
<line x1="57.0" y1="448.0" x2="57.0" y2="454.0" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah94A3B8)"/>
<rect x="28.0" y="455.0" width="944.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
