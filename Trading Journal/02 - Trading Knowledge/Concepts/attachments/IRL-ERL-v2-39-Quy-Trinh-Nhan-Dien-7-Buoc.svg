<rect x="70.0" y="179.0" width="16.0" height="84.0" rx="0" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="57.0" y="229.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="100.0" y="205.0" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="start">Đánh dấu ERL</text>
<text x="100.0" y="227.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Liquidity nào nằm Ở/NGOÀI hai biên? EQH/EQL, PDH/PDL, PWH/PWL nào nằm ngoài?</text>
<rect x="640.0" y="193.0" width="318.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="652.0" y="213.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="231.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">ERL trên: …  ERL dưới: …</text>
<line x1="57.0" y1="264.0" x2="57.0" y2="270.0" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah94A3B8)"/>
<rect x="28.0" y="271.0" width="944.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="271.0" width="58.0" height="84.0" rx="10" fill="#D97706" stroke="none" stroke-width="1.2"/>
<rect x="70.0" y="271.0" width="16.0" height="84.0" rx="0" fill="#D97706" stroke="none" stroke-width="1.2"/>
