<text x="100.0" y="573.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">Đọc price delivery</text>
<text x="100.0" y="595.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Giá đang đi về IRL hay ERL? Có sweep không? Có displacement / MSS xác nhận không?</text>
<rect x="640.0" y="561.0" width="318.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="652.0" y="581.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="599.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">Trạng thái: …</text>
<line x1="57.0" y1="632.0" x2="57.0" y2="638.0" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah94A3B8)"/>
<rect x="28.0" y="639.0" width="944.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="639.0" width="58.0" height="84.0" rx="10" fill="#EA580C" stroke="none" stroke-width="1.2"/>
<rect x="70.0" y="639.0" width="16.0" height="84.0" rx="0" fill="#EA580C" stroke="none" stroke-width="1.2"/>
<text x="57.0" y="689.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="100.0" y="665.0" font-size="14" font-weight="700" fill="#EA580C" text-anchor="start">Chuyển xuống khung nhỏ</text>
<text x="100.0" y="687.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Đủ context chưa? Nếu chưa ⇒ dừng. Nếu rồi ⇒ chỉ tìm trigger ở đúng POI.</text>
<rect x="640.0" y="653.0" width="318.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="652.0" y="673.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="691.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">Xuống H1/M5: có / không</text>
<rect x="28.0" y="735.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="759.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bước 1–5 làm MỘT LẦN trước phiên (trên D1, rồi tinh chỉnh ở H1). Bước 6 cập nhật mỗi khi có sự kiện: một pool bị lấy, một MSS, một displacement. Bước 7 chỉ mở</text>
<text x="42.0" y="775.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">cửa khi bước 1–6 cùng chiều.</text>
