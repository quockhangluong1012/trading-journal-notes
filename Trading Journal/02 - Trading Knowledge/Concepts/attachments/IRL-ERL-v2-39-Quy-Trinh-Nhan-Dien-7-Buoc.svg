<svg viewBox="0 0 1000 807" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="1" y="1" width="998" height="805" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="884.5" y="22" width="87.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">QUY TRÌNH</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Quy trình nhận diện IRL/ERL — 7 bước, mỗi bước một câu hỏi và một thứ phải ghi lại</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Làm từ trên xuống. Không được nhảy sang bước 6 (diễn giải) khi bước 1 (range tham chiếu) chưa được viết ra.</text>
<rect x="28.0" y="87.0" width="944.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="87.0" width="58.0" height="84.0" rx="10" fill="#92400E" stroke="none" stroke-width="1.2"/>
<rect x="70.0" y="87.0" width="16.0" height="84.0" rx="0" fill="#92400E" stroke="none" stroke-width="1.2"/>
<text x="57.0" y="137.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="100.0" y="113.0" font-size="14" font-weight="700" fill="#92400E" text-anchor="start">Chọn range tham chiếu</text>
<text x="100.0" y="135.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="520.0">Range nào, khung nào, hai biên ở đâu, vì sao chọn hai swing đó?</text>
<rect x="640.0" y="101.0" width="318.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="652.0" y="121.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">Ghi lại:</text>
<text x="652.0" y="139.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start" data-maxw="296.0">Range D1: [đáy] → [đỉnh]; lý do</text>
<line x1="57.0" y1="172.0" x2="57.0" y2="178.0" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah94A3B8)"/>
