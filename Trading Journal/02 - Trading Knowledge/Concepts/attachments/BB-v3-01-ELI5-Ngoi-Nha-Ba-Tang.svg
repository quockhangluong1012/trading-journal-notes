<text x="759.0" y="448.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="758.0,959.0">Bóng rơi lại. Tấm trần cũ giờ nằm</text>
<text x="759.0" y="465.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="758.0,959.0">dưới chân: có thể đỡ bóng… hoặc</text>
<text x="759.0" y="483.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="758.0,959.0">thủng tiếp. Không ai biết trước.</text>
<text x="28.0" y="544.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Giới hạn của ví dụ: thị trường không có “tấm trần” vật lý. Thứ chặn hay đỡ giá là LỆNH của con người — ta không nhìn thấy chúng và chúng có thể đã biến mất.</text>
