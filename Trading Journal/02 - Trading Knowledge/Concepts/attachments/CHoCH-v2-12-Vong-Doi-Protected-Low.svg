<text x="627.4" y="201.1" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="514.0,725.0">BOS</text>
<text x="685.0" y="158.0" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="514.0,725.0">BOS</text>
<text x="520.0" y="382.5" font-size="12" font-weight="400" fill="#111827" data-bx="519.0,720.0">Từ đáy 55 có BOS mới qua 63.</text>
<text x="520.0" y="399.5" font-size="12" font-weight="400" fill="#111827" data-bx="519.0,720.0">Protected dời lên 55. Đáy 48</text>
<text x="520.0" y="416.5" font-size="12" font-weight="400" fill="#111827" data-bx="519.0,720.0">thành mức tham chiếu sâu.</text>
<rect x="745.0" y="92.5" width="227.0" height="420.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="769.0" cy="113.5" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="769.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="786.0" y="118.0" font-size="13.5" font-weight="700" fill="#C026D3" data-bx="785.0,961.0">Bị tiêu thụ</text>
<line x1="879.4" y1="252.2" x2="958.0" y2="252.2" stroke="#C026D3" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="956.0" y="246.2" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="753.0,964.0">đã bị phá</text>
