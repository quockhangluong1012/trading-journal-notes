<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="558.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Vòng đời của một protected low: ứng viên → được bảo vệ → bị dời → bị tiêu thụ</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Một đáy không “sinh ra” là protected. Nó trở thành protected khi phóng ra một BOS, và mất vai trò khi có BOS mới hoặc khi bị phá.</text>
<rect x="28.0" y="92.5" width="227.0" height="420.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="52.0" cy="113.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="69.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="68.0,244.0">Ứng viên</text>
<line x1="42.0" y1="332.9" x2="241.0" y2="332.9" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="239.0" y="348.9" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="36.0,247.0">protected = 40</text>
<polyline points="55.1,332.9 81.3,246.8 107.5,289.8 128.4,262.9" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
