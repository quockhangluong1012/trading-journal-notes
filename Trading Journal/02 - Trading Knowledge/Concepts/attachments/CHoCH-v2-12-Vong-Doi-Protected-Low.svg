<text x="866.4" y="201.1" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="753.0,964.0">BOS</text>
<text x="924.0" y="158.0" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="753.0,964.0">BOS</text>
<text x="945.4" y="289.7" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="753.0,964.0">CHoCH ↓</text>
<text x="759.0" y="382.5" font-size="12" font-weight="400" fill="#111827" data-bx="758.0,959.0">Giá đóng dưới 55: protected low</text>
<text x="759.0" y="399.5" font-size="12" font-weight="400" fill="#111827" data-bx="758.0,959.0">bị phá = CHoCH ↓ ở lớp này. Kết</text>
<text x="759.0" y="416.5" font-size="12" font-weight="400" fill="#111827" data-bx="758.0,959.0">luận “đang tăng” mất hiệu lực.</text>
<text x="28.0" y="544.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cái bẫy: nhiều người coi MỌI đáy gần nhất là protected (như ở ô 1). Khi đó “CHoCH” xuất hiện liên tục và bias bị lật qua lật lại.</text>
