<text x="388.4" y="201.1" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="275.0,486.0">BOS</text>
<text x="281.0" y="382.5" font-size="12" font-weight="400" fill="#111827" data-bx="280.0,481.0">Giá từ 48 vượt đỉnh 56 (BOS). Đáy</text>
<text x="281.0" y="399.5" font-size="12" font-weight="400" fill="#111827" data-bx="280.0,481.0">48 được “thăng chức” thành</text>
<text x="281.0" y="416.5" font-size="12" font-weight="400" fill="#111827" data-bx="280.0,481.0">protected low.</text>
<rect x="506.0" y="92.5" width="227.0" height="420.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="530.0" cy="113.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="530.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="547.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="546.0,722.0">Bị dời lên</text>
<line x1="640.4" y1="252.2" x2="719.0" y2="252.2" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6,4"/>
