<circle cx="107.5" cy="289.8" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="128.4" cy="262.9" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="42.0" y="382.5" font-size="12" font-weight="400" fill="#111827" data-bx="41.0,242.0">Đáy 48 mới hình thành. Nó CHƯA</text>
<text x="42.0" y="399.5" font-size="12" font-weight="400" fill="#111827" data-bx="41.0,242.0">phóng ra BOS nào → chưa</text>
<text x="42.0" y="416.5" font-size="12" font-weight="400" fill="#111827" data-bx="41.0,242.0">protected. Protected vẫn là đáy</text>
<text x="42.0" y="433.6" font-size="12" font-weight="400" fill="#111827" data-bx="41.0,242.0">40.</text>
