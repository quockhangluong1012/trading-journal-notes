<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="760" rx="14" fill="#131722" stroke="#2a2e39"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#d1d4dc">GBPUSD Long NY AM 14/09/2022 — Failed Breaker, -1.2R</text>
<text x="40" y="70" font-size="15" fill="#787b86">Tái dựng minh họa từ mẫu backtest — sweep+MSS thật, nhưng breaker fail và trở thành fuel</text>

<!-- time axis -->
<rect x="60" y="95" width="1160" height="24" fill="#131722"/>
<text x="70" y="112" font-size="12" fill="#ff9800">08:30 sweep+MSS</text>
<text x="330" y="112" font-size="12" fill="#ff9800">09:10 retest #1 (entry)</text>
<text x="620" y="112" font-size="12" fill="#ff9800">09:35 đóng xuyên qua (fail)</text>
<text x="900" y="112" font-size="12" fill="#ff9800">10:05 stop hit + leg tiếp diễn giảm</text>

<!-- reference levels -->
<line x1="60" y1="330" x2="1220" y2="330" stroke="#f2c94c" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.7"/>
<text x="1070" y="323" font-size="12" fill="#f2c94c">High1 = 1.15420</text>
<line x1="60" y1="470" x2="1220" y2="470" stroke="#f2c94c" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.7"/>
<text x="1070" y="463" font-size="12" fill="#f2c94c">Low1 = 1.15180</text>

<!-- breaker zone -->
<rect x="60" y="330" width="1160" height="55" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4"/>
<text x="70" y="405" font-size="13" fill="#4a90d9">Bullish Breaker 1.15330-1.15420 (sweep SSL 1.15150 + MSS phá High1)</text>

<!-- pre-sweep down candles -->
<g>
<line x1="110" y1="380" x2="110" y2="460" stroke="#ef5350" stroke-width="1.5"/>
<rect x="100" y="390" width="18" height="55" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="150" y1="400" x2="150" y2="490" stroke="#ef5350" stroke-width="1.5"/>
<rect x="140" y="415" width="18" height="55" fill="#ef5350" rx="1"/>
</g>
<!-- sweep candle -->
<g>
<line x1="190" y1="420" x2="190" y2="520" stroke="#ef5350" stroke-width="1.5"/>
<rect x="180" y="435" width="18" height="60" fill="#ef5350" rx="1"/>
</g>
<circle cx="190" cy="516" r="5" fill="#b48ead"/>
<text x="150" y="545" font-size="12" fill="#b48ead">Sweep SSL 1.15150 (Low2)</text>

<!-- displacement up MSS -->
<g>
<line x1="240" y1="330" x2="240" y2="500" stroke="#26a69a" stroke-width="1.8"/>
<rect x="228" y="345" width="24" height="140" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="280" y1="290" x2="280" y2="350" stroke="#26a69a" stroke-width="1.8"/>
<rect x="268" y="300" width="24" height="45" fill="#26a69a" rx="1"/>
</g>
<text x="230" y="270" font-size="12" fill="#26a69a">Displacement phá High1 → MSS bullish</text>

<!-- retest into breaker, entry -->
<g>
<line x1="420" y1="360" x2="420" y2="440" stroke="#26a69a" stroke-width="1.5"/>
<rect x="410" y="370" width="18" height="60" fill="#26a69a" rx="1"/>
</g>
<g>
<line x1="460" y1="370" x2="460" y2="420" stroke="#26a69a" stroke-width="1.5"/>
<rect x="450" y="378" width="18" height="35" fill="#26a69a" rx="1"/>
</g>
<circle cx="460" cy="374" r="6" fill="#f2c94c"/>
<path d="M 460 374 L 500 300" stroke="#787b86" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="470" y="290" font-size="13" fill="#f2c94c">Entry Long 1.15360</text>

<!-- stop line -->
<line x1="60" y1="512" x2="1220" y2="512" stroke="#ff6b6b" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="70" y="530" font-size="12" fill="#ff6b6b">Stop 1.15140 (dưới Low2)</text>

<!-- fail candle closing through breaker -->
<g>
<line x1="640" y1="360" x2="640" y2="470" stroke="#ef5350" stroke-width="1.8"/>
<rect x="628" y="375" width="24" height="90" fill="#ef5350" rx="1"/>
</g>
<circle cx="640" cy="463" r="5" fill="#ff6b6b"/>
<text x="590" y="500" font-size="12" fill="#ff6b6b">Đóng nến xuyên breaker (fail chính thức)</text>

<g>
<line x1="700" y1="440" x2="700" y2="500" stroke="#ef5350" stroke-width="1.5"/>
<rect x="690" y="450" width="18" height="45" fill="#ef5350" rx="1"/>
</g>

<!-- stop hunt candle at 1.15140 -->
<g>
<line x1="760" y1="460" x2="760" y2="530" stroke="#ef5350" stroke-width="1.8"/>
<rect x="748" y="470" width="24" height="55" fill="#ef5350" rx="1"/>
</g>
<circle cx="760" cy="522" r="5" fill="#ff6b6b"/>
<text x="770" y="540" font-size="12" fill="#ff6b6b">Stop hit 1.15140 (-1.2R)</text>

<!-- continuation leg down consuming the stop liquidity -->
<g>
<line x1="850" y1="500" x2="850" y2="600" stroke="#ef5350" stroke-width="1.8"/>
<rect x="838" y="515" width="24" height="80" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="900" y1="560" x2="900" y2="650" stroke="#ef5350" stroke-width="1.8"/>
<rect x="888" y="575" width="24" height="70" fill="#ef5350" rx="1"/>
</g>
<path d="M 770 528 L 845 515" stroke="#ff9800" stroke-width="1.6" fill="none" marker-end="url(#arrowB2)"/>
<text x="900" y="500" font-size="13" fill="#ff9800">Fuel: leg giảm mới ăn theo stop vừa quét</text>

<defs>
<marker id="arrowB2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#ff9800"/>
</marker>
</defs>

<line x1="60" y1="670" x2="1220" y2="670" stroke="#2a2e39"/>
<text x="60" y="698" font-size="14" fill="#d1d4dc">Bài học: sweep + MSS đúng chuẩn không bảo đảm retest ăn — cần đợi acceptance tại retest, không chỉ ở bước tạo breaker.</text>
<text x="60" y="722" font-size="14" fill="#d1d4dc">Nến đóng xuyên qua breaker + nến sau giữ bên kia = tín hiệu thoát ngay, không "gồng" chờ hồi lại.</text>
<text x="60" y="746" font-size="13" fill="#787b86">Nguồn: tái dựng minh họa từ mẫu backtest GBPUSD NY AM, kill zone 08:30-11:00 ET.</text>
</svg>
