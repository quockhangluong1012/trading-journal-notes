<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Bối cảnh và diễn biến</text>
<text x="656.0" y="142.5" font-size="11.8" font-weight="700" fill="#2563EB">Bối cảnh</text>
<text x="656.0" y="158.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">D1 hướng xuống, giá vừa hồi lên nửa trên. Còn đáy cũ</text>
<text x="656.0" y="174.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">phía dưới chưa bị lấy.</text>
<text x="656.0" y="198.1" font-size="11.8" font-weight="700" fill="#2563EB">① Liquidity</text>
<text x="656.0" y="214.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá lên trên đỉnh phiên trước rồi dừng.</text>
<text x="656.0" y="237.4" font-size="11.8" font-weight="700" fill="#2563EB">② Phá cấu trúc</text>
<text x="656.0" y="253.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá rơi mạnh, một nến đóng cửa dưới đáy giữa. Có</text>
<text x="656.0" y="269.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">displacement.</text>
<text x="656.0" y="293.1" font-size="11.8" font-weight="700" fill="#2563EB">③ Retest</text>
<text x="656.0" y="309.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá hồi lên, râu chạm vùng, đóng cửa trong vùng.</text>
<text x="656.0" y="325.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Khung nhỏ cho MSS giảm.</text>
<text x="656.0" y="348.8" font-size="11.8" font-weight="700" fill="#2563EB">④ Kết quả</text>
<text x="656.0" y="364.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá đi tiếp về phía DOL.</text>
<rect x="656.0" y="493.0" width="302.0" height="101.9" rx="8" fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="493.0" width="4.0" height="101.9" rx="2" fill="#15803D"/>
<text x="670.0" y="512.9" font-size="11.6" font-weight="700" fill="#15803D" data-bx="656.0,958.0">Điều thật sự kết luận được</text>
<text x="670.0" y="532.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Bullish và Bearish Breaker đối xứng hoàn toàn về</text>
<text x="670.0" y="548.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">định nghĩa. Thị trường thật thì không nhất thiết</text>
<text x="670.0" y="565.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">đối xứng: tốc độ rơi và tốc độ tăng có thể khác →</text>
<text x="670.0" y="581.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">ghi riêng hai chiều khi backtest.</text>
