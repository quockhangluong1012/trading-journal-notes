<text x="358.7" y="438.3" font-size="10.5" font-weight="600" fill="#475569" text-anchor="end" data-maxw="140.0">gợn sóng nhỏ: nhiễu,</text>
<text x="358.7" y="451.9" font-size="10.5" font-weight="600" fill="#475569" text-anchor="end" data-maxw="140.0">không đặt tên</text>
<text x="652.0" y="121.6" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="end">S1 = biên trên ⇒ ERL</text>
<text x="652.0" y="476.9" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="end">S6 = biên dưới ⇒ ERL</text>
<rect x="684.0" y="87.0" width="288.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="698.0" y="109.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Swing được “nâng hạng” khi…</text>
<text x="700.0" y="127.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">▸ Nó định ra range đang dùng</text>
<text x="714.0" y="144.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">S1, S6 ⇒ ERL</text>
<text x="700.0" y="171.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">▸ Nó khởi đầu một cú displacement</text>
<text x="714.0" y="188.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">S6 → nhịp tăng mạnh sau đó</text>
<text x="700.0" y="215.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">▸ Bị phá làm đổi cấu trúc</text>
<text x="714.0" y="232.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">phá S7 = dấu hiệu đổi nhịp</text>
<text x="700.0" y="259.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">▸ Nó là đỉnh/đáy trên khung lớn hơn</text>
<text x="714.0" y="276.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">ví dụ đỉnh D1 nằm trên H1</text>
<text x="700.0" y="303.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">▸ Giá phản ứng rõ khi quay lại</text>
<text x="714.0" y="320.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">không chỉ là chạm rồi đi</text>
<text x="700.0" y="351.0" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="256.0">Lưu ý: nếu bạn chọn range khác (ví dụ từ S3</text>
<text x="700.0" y="367.3" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="256.0">xuống S6), thì S3 trở thành ERL trên và S1</text>
<text x="700.0" y="383.6" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="256.0">thành “ERL xa”. Nhãn đi theo range.</text>
<rect x="28.0" y="571.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="595.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Cách phân cấp swing chi tiết (micro → internal → intermediate → external → HTF) có ở note Dealing Range (57) và Advance Market Structure (01). Ở đây chỉ cần:</text>
<text x="42.0" y="611.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hai biên = ERL, swing đáng kể bên trong = IRL, gợn sóng = bỏ qua.</text>
