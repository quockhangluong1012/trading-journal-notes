<text x="939.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SWING</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Có rất nhiều swing — swing nào là ERL, swing nào là IRL, swing nào là nhiễu?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Chỉ hai swing định ra range mới là ERL của range đó. Các swing đáng kể bên trong là IRL. Các gợn sóng nhỏ không đáng gọi tên.</text>
