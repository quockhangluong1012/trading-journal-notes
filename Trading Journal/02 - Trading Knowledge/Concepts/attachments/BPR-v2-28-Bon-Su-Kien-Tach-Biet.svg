<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<rect x="1" y="1" width="998" height="518" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="855.9" y="22" width="116.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="914.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">THỨ TỰ SỰ KIỆN</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bốn sự kiện tách biệt — không có thứ tự bắt buộc</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Liquidity sweep, FVG, BPR và MSS là bốn thứ khác nhau. Chúng có thể xuất hiện theo nhiều thứ tự, hoặc thiếu hẳn một vài cái.</text>
<rect x="28.0" y="86.0" width="944.0" height="68.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Mẫu “sách giáo khoa” đảo chiều</text>
<text x="40.0" y="128.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">Sweep đáy → FVG leg rơi → BPR khi leg bật để lại FVG chồng →</text>
<text x="40.0" y="142.9" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">MSS khi phá đỉnh.</text>
<rect x="400.0" y="106.0" width="69.8" height="28.0" rx="14" fill="#EAF2FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="434.9" y="125.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Sweep</text>
<line x1="473.8" y1="120.0" x2="495.8" y2="120.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="501.8" y="106.0" width="54.5" height="28.0" rx="14" fill="#E7F7EF" stroke="#0F9D74" stroke-width="1.3"/>
<text x="529.0" y="125.0" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="middle">FVG</text>
<line x1="560.3" y1="120.0" x2="582.3" y2="120.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="588.3" y="106.0" width="53.6" height="28.0" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="615.1" y="125.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<line x1="645.9" y1="120.0" x2="667.9" y2="120.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="673.9" y="106.0" width="56.9" height="28.0" rx="14" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="702.3" y="125.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">MSS</text>
<rect x="28.0" y="162.0" width="944.0" height="68.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="184.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">BPR trước, sweep sau</text>
<text x="40.0" y="204.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">BPR hình thành giữa range; vài giờ sau giá mới quét đỉnh/đáy rồi</text>
<text x="40.0" y="218.9" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">đảo.</text>
<rect x="400.0" y="182.0" width="54.5" height="28.0" rx="14" fill="#E7F7EF" stroke="#0F9D74" stroke-width="1.3"/>
<text x="427.3" y="201.0" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="middle">FVG</text>
<line x1="458.5" y1="196.0" x2="480.5" y2="196.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="486.5" y="182.0" width="53.6" height="28.0" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="513.3" y="201.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<line x1="544.1" y1="196.0" x2="566.1" y2="196.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="572.1" y="182.0" width="69.8" height="28.0" rx="14" fill="#EAF2FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="607.0" y="201.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Sweep</text>
<line x1="645.9" y1="196.0" x2="667.9" y2="196.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="673.9" y="182.0" width="56.9" height="28.0" rx="14" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="702.3" y="201.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">MSS</text>
<rect x="28.0" y="238.0" width="944.0" height="68.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="260.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">BPR không có sweep, không có MSS</text>
<text x="40.0" y="280.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">Nhịp hồi dữ dội trong xu hướng (Hình 14 phải).</text>
<rect x="400.0" y="258.0" width="54.5" height="28.0" rx="14" fill="#E7F7EF" stroke="#0F9D74" stroke-width="1.3"/>
<text x="427.3" y="277.0" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="middle">FVG</text>
<line x1="458.5" y1="272.0" x2="480.5" y2="272.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="486.5" y="258.0" width="54.5" height="28.0" rx="14" fill="#E7F7EF" stroke="#0F9D74" stroke-width="1.3"/>
<text x="513.8" y="277.0" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="middle">FVG</text>
<line x1="545.1" y1="272.0" x2="567.1" y2="272.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="573.1" y="258.0" width="53.6" height="28.0" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="599.9" y="277.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<rect x="28.0" y="314.0" width="944.0" height="68.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="336.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">MSS không có BPR</text>
<text x="40.0" y="356.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">Phá cấu trúc bằng một leg duy nhất có FVG — không có FVG</text>
<text x="40.0" y="370.9" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">ngược nào để chồng.</text>
<rect x="400.0" y="334.0" width="69.8" height="28.0" rx="14" fill="#EAF2FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="434.9" y="353.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Sweep</text>
<line x1="473.8" y1="348.0" x2="495.8" y2="348.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="501.8" y="334.0" width="54.5" height="28.0" rx="14" fill="#E7F7EF" stroke="#0F9D74" stroke-width="1.3"/>
<text x="529.0" y="353.0" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="middle">FVG</text>
<line x1="560.3" y1="348.0" x2="582.3" y2="348.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="588.3" y="334.0" width="56.9" height="28.0" rx="14" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="616.7" y="353.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">MSS</text>
<rect x="28.0" y="390.0" width="944.0" height="68.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="412.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Sweep không kéo theo gì</text>
<text x="40.0" y="432.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">Giá quét đáy rồi tiếp tục đi xuống — không FVG ngược, không</text>
<text x="40.0" y="446.9" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">BPR, không MSS.</text>
<rect x="400.0" y="410.0" width="69.8" height="28.0" rx="14" fill="#EAF2FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="434.9" y="429.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Sweep</text>
<line x1="473.8" y1="424.0" x2="495.8" y2="424.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ah6B7280)"/>
<rect x="501.8" y="410.0" width="84.1" height="28.0" rx="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.3"/>
<text x="543.8" y="429.0" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle">không có</text>
<text x="28.0" y="500.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Trong journal, ghi thời điểm của từng sự kiện thay vì một nhãn gộp “có BPR”. Khi đó backtest mới trả lời được thứ tự nào liên quan tới kết quả tốt.</text>
</svg>
