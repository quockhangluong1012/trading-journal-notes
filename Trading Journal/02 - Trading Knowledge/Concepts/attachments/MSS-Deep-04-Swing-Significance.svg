<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Swing significance — hai swing CÙNG kích thước, ý nghĩa cấu trúc KHÁC hẳn</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Ý nghĩa đến từ quan hệ (swing này gánh kết luận nào? bị phá thì cái gì đổi?) chứ không đến từ chiều cao trên màn hình.</text>
<rect x="26.0" y="84.0" width="560.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<path d="M46.0,396.0 L87.6,285.0 L118.8,329.4 L160.4,240.6 L191.6,285.0 L222.8,255.4 L254.0,307.2 L290.4,270.2 L321.6,322.0 L358.0,188.8 L389.2,233.2 L430.8,137.0 L462.0,196.2 L503.6,159.2 L540.0,211.0" stroke="#111827" stroke-width="2.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="254.0" cy="307.2" r="6" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="254.0" y="331.2" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Swing A</text>
<circle cx="321.6" cy="322.0" r="6" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="325.6" y="346.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">Swing B</text>
<circle cx="160.4" cy="240.6" r="5" fill="#9CA3AF" stroke="#ffffff" stroke-width="1.5"/>
<text x="160.4" y="228.6" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">Swing C (cũ)</text>
<line x1="321.6" y1="322.0" x2="358.0" y2="188.8" stroke="#7C3AED" stroke-width="3.4" marker-end="url(#aP)"/>
<text x="329.2" y="240.0" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="end">displacement → BOS</text>
<line x1="306.0" y1="240.6" x2="566.0" y2="240.6" stroke="#16A34A" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="566.0" y="235.6" font-size="10" font-weight="600" fill="#15803D" text-anchor="end">đỉnh cũ bị BOS phá</text>
<text x="246.0" y="347.2" font-size="9.6" font-weight="400" fill="#B45309" text-anchor="end">(nằm trong range nội bộ, đã bị test nhiều lần)</text>
<rect x="600.0" y="84.0" width="354.0" height="400.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="612.0" y="106.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Thẻ điểm 7 chiều (S L D R T P C)</text>
<text x="612.0" y="128.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">chiều</text>
<text x="832.0" y="128.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">A</text>
<text x="872.0" y="128.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">B</text>
<text x="912.0" y="128.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">C</text>
<text x="612.0" y="150.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">S cấu trúc: phá nó đổi nhãn?</text>
<text x="832.0" y="150.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="872.0" y="150.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓</text>
<text x="912.0" y="150.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="612.0" y="176.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">L thanh khoản: chưa bị lấy, có cụm?</text>
<text x="832.0" y="176.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">±</text>
<text x="872.0" y="176.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓</text>
<text x="912.0" y="176.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">?</text>
<text x="612.0" y="202.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">D displacement xuất phát từ nó?</text>
<text x="832.0" y="202.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="872.0" y="202.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓</text>
<text x="912.0" y="202.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="612.0" y="228.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">R phản ứng / được tôn trọng?</text>
<text x="832.0" y="228.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓ nhỏ</text>
<text x="872.0" y="228.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓</text>
<text x="912.0" y="228.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="612.0" y="254.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">T đúng cấp khung đang xét?</text>
<text x="832.0" y="254.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">L2</text>
<text x="872.0" y="254.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">L3</text>
<text x="912.0" y="254.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">L1–L2</text>
<text x="612.0" y="280.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">P protected (gốc leg BOS)?</text>
<text x="832.0" y="280.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="872.0" y="280.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓</text>
<text x="912.0" y="280.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="612.0" y="306.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">C hợp lưu (POI, PD, DOL)?</text>
<text x="832.0" y="306.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">±</text>
<text x="872.0" y="306.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">±</text>
<text x="912.0" y="306.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">–</text>
<text x="612.0" y="336.0" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="start">A: '±' = pool đã mỏng (test nhiều lần).</text>
<text x="612.0" y="352.0" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="start">B: qua swing gate SG1–SG3 → ứng viên mạnh nhất.</text>
<text x="612.0" y="368.0" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="start">C: đỉnh cũ đã bị BOS phá (consumed) → S = 0.</text>
<rect x="26.0" y="496.0" width="928.0" height="90.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="42.0" y="518.0" font-size="10.4" font-weight="700" fill="#6D28D9" text-anchor="start">Hệ quả cho MSS:</text>
<text x="42.0" y="535.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• Phá Swing A = phá một mốc nội bộ đã bị test nhiều lần → 'MSS' ở lớp internal, thông tin thấp, dễ chỉ là nhiễu/inducement.</text>
<text x="42.0" y="552.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• Phá Swing B = phá gốc của leg đã tạo BOS → vô hiệu cấu trúc ở cấp của nó (MSS lớp protected). Đây mới là sự kiện đáng ghi.</text>
<text x="42.0" y="569.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">• Swing gates (SG1–SG3) trước, scores sau; trọng số giữa các chiều CHƯA BIẾT — không bịa (57 §10.2). [INTERPRETATION · BACKTEST REQUIRED]</text>
</svg>