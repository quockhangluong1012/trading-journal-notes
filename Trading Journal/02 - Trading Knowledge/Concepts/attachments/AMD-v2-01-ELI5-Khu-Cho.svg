<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="658" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Chuyện khu chợ: giá một món đồ đi qua 3 đoạn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Giá dao động giữa 90 và 100, vọt lên 103, không giữ được, rơi lại dưới 100 rồi giảm mạnh xuống 85. Truyện chỉ minh họa cách ĐỌC mô</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">hình — không chứng minh có ai cố tình điều khiển giá.</text>
<rect x="918.3" y="22.0" width="53.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="945.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ELI5</text>
<rect x="70.0" y="120.0" width="560.0" height="420.0" rx="6" fill="#FFFFFF"/>
<rect x="28.0" y="96.0" width="612.0" height="470.0" rx="10" fill="none" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="70.0" y="120.0" width="285.4" height="420.0" rx="0" fill="#EAF2FF"/>
<text x="212.7" y="540.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">A — Tích lũy</text>
<rect x="355.4" y="120.0" width="95.1" height="420.0" rx="0" fill="#FFF1E6"/>
<text x="403.0" y="540.0" font-size="13" font-weight="700" fill="#EA580C" text-anchor="middle">M — Thao túng</text>
<rect x="450.6" y="120.0" width="179.4" height="420.0" rx="0" fill="#F3EEFF"/>
<text x="540.3" y="540.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">D — Phân phối</text>
<text x="62.0" y="491.5" font-size="11" font-weight="500" fill="#6B7280" text-anchor="end">85</text>
<line x1="66.0" y1="487.5" x2="70.0" y2="487.5" stroke="#9CA3AF" stroke-width="1"/>
<text x="62.0" y="404.0" font-size="11" font-weight="500" fill="#6B7280" text-anchor="end">90</text>
<line x1="66.0" y1="400.0" x2="70.0" y2="400.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="62.0" y="316.5" font-size="11" font-weight="500" fill="#6B7280" text-anchor="end">95</text>
<line x1="66.0" y1="312.5" x2="70.0" y2="312.5" stroke="#9CA3AF" stroke-width="1"/>
<text x="62.0" y="229.0" font-size="11" font-weight="500" fill="#6B7280" text-anchor="end">100</text>
<line x1="66.0" y1="225.0" x2="70.0" y2="225.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="62.0" y="141.5" font-size="11" font-weight="500" fill="#6B7280" text-anchor="end">105</text>
<line x1="66.0" y1="137.5" x2="70.0" y2="137.5" stroke="#9CA3AF" stroke-width="1"/>
<line x1="70.0" y1="225.0" x2="630.0" y2="225.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="628.0" y="221.0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="end">mép trên = 100</text>
<line x1="70.0" y1="400.0" x2="439.7" y2="400.0" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="437.7" y="414.0" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="end">mép dưới = 90</text>
<path d="M70.0,312.5 L97.2,260.0 L124.4,347.5 L151.6,277.5 L178.7,233.8 L205.9,382.5 L233.1,295.0 L260.3,228.5 L287.5,356.2 L314.7,277.5 L341.8,303.8 L369.0,211.0 L396.2,172.5 L423.4,242.5 L450.6,268.8 L477.8,312.5 L505.0,365.0 L532.1,412.3 L559.3,442.0 L586.5,470.0 L613.7,487.5" fill="none" stroke="#334155" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70.0" cy="312.5" r="2.6" fill="#334155"/>
<circle cx="97.2" cy="260.0" r="2.6" fill="#334155"/>
