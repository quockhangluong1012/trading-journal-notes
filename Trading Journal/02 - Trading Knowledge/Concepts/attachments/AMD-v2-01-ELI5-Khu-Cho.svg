<circle cx="287.5" cy="356.2" r="2.6" fill="#334155"/>
<circle cx="314.7" cy="277.5" r="2.6" fill="#334155"/>
<circle cx="341.8" cy="303.8" r="2.6" fill="#334155"/>
<circle cx="369.0" cy="211.0" r="2.6" fill="#334155"/>
