<circle cx="586.5" cy="470.0" r="2.6" fill="#334155"/>
<circle cx="613.7" cy="487.5" r="2.6" fill="#334155"/>
<circle cx="205.9" cy="402.5" r="10" fill="#2563EB"/>
<text x="205.9" y="406.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="351.0" cy="205.0" r="10" fill="#EA580C"/>
<text x="351.0" y="209.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="396.2" cy="154.5" r="10" fill="#EA580C"/>
<text x="396.2" y="158.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="441.4" cy="250.5" r="10" fill="#EA580C"/>
<text x="441.4" y="254.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="609.7" cy="509.5" r="10" fill="#7C3AED"/>
<text x="609.7" y="513.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<line x1="396.2" y1="172.5" x2="440.2" y2="178.7" stroke="#EA580C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="440.2" y="176.5" font-size="11" font-weight="600" fill="#EA580C" text-anchor="start">đỉnh 103: không ai mua thêm</text>
<line x1="532.1" y1="412.3" x2="498.1" y2="448.5" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3,2"/>
<text x="498.1" y="446.3" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="end">thủng 90</text>
<text x="75.4" y="136.0" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">thời gian →</text>
<rect x="656.0" y="96.0" width="316.0" height="70.4" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<circle cx="674.0" cy="114.0" r="10" fill="#2563EB"/>
<text x="674.0" y="118.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="692.0" y="118.0" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">Người mua, người bán trả giá qua lại giữa 90</text>
<text x="692.0" y="134.8" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">và 100. Chưa bên nào thắng hẳn — giá cứ lên</text>
<text x="692.0" y="151.6" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">xuống trong một cái hộp.</text>
<rect x="656.0" y="175.4" width="316.0" height="53.6" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.1"/>
<circle cx="674.0" cy="193.4" r="10" fill="#EA580C"/>
<text x="674.0" y="197.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="692.0" y="197.4" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">Giá bất ngờ vọt lên 103. Nhiều người reo</text>
<text x="692.0" y="214.2" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">“lên nữa rồi!” và vội mua đuổi.</text>
<rect x="656.0" y="238.0" width="316.0" height="70.4" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.1"/>
<circle cx="674.0" cy="256.0" r="10" fill="#EA580C"/>
<text x="674.0" y="260.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="692.0" y="260.0" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">Nhưng ở 103 không còn ai muốn mua thêm,</text>
<text x="692.0" y="276.8" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">mà người muốn bán thì có. Giá không đứng</text>
<text x="692.0" y="293.6" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">được.</text>
<rect x="656.0" y="317.4" width="316.0" height="53.6" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.1"/>
<circle cx="674.0" cy="335.4" r="10" fill="#EA580C"/>
<text x="674.0" y="339.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="692.0" y="339.4" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">Giá tụt lại dưới 100. Ai mua ở 101–103 bây</text>
<text x="692.0" y="356.2" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">giờ đang lỗ và bắt đầu lo.</text>
<rect x="656.0" y="380.0" width="316.0" height="53.6" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<circle cx="674.0" cy="398.0" r="10" fill="#7C3AED"/>
<text x="674.0" y="402.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="692.0" y="402.0" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">Họ vội bán để thoát. Thêm người bán, ít</text>
<text x="692.0" y="418.8" font-size="12.2" font-weight="400" fill="#1F2937" text-anchor="start">người mua → giá rơi mạnh tới 85.</text>
<rect x="28.0" y="582.0" width="306.0" height="56.0" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1"/>
<text x="40.0" y="604.0" font-size="12.2" font-weight="700" fill="#2563EB" text-anchor="start">A = “Mọi người còn đang trả giá”</text>
<text x="40.0" y="624.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi ngang trong hộp. Hai bên cân bằng.</text>
<rect x="346.0" y="582.0" width="306.0" height="56.0" rx="8" fill="#FFF1E6" stroke="#EA580C" stroke-width="1"/>
<text x="358.0" y="604.0" font-size="12.2" font-weight="700" fill="#EA580C" text-anchor="start">M = “Một cú chạy làm nhiều người tin nhầm”</text>
<text x="358.0" y="624.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá ra khỏi hộp một chút rồi thua, quay về.</text>
<rect x="664.0" y="582.0" width="306.0" height="56.0" rx="8" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1"/>
<text x="676.0" y="604.0" font-size="12.2" font-weight="700" fill="#7C3AED" text-anchor="start">D = “Giá đi thật về một phía”</text>
<text x="676.0" y="624.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá rời hộp ở phía bên kia, đi xa và nhanh.</text>
</svg>
