<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="700" fill="#0f1420" rx="12"/>

<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: EURUSD Bullish RB sau sweep London Open</text>
<text x="40" y="64" font-size="15" fill="#94a3b8">08/07, 06:58–13:15 London/NY — sweep sạch, MSS rõ, R:R 3.4</text>

<g stroke="#1c2333" stroke-width="1">
<line x1="40" y1="120" x2="1160" y2="120"/>
<line x1="40" y1="220" x2="1160" y2="220"/>
<line x1="40" y1="320" x2="1160" y2="320"/>
<line x1="40" y1="420" x2="1160" y2="420"/>
<line x1="40" y1="520" x2="1160" y2="520"/>
<line x1="40" y1="600" x2="1160" y2="600"/>
</g>

<!-- price labels -->
<text x="1080" y="200" font-size="13" fill="#a78bfa">1.0862 BSL (TP2)</text>
<text x="1080" y="260" font-size="13" fill="#a78bfa">1.0835 (TP1)</text>
<text x="1080" y="390" font-size="13" fill="#38bdf8">1.0791 Entry</text>
<text x="1080" y="450" font-size="13" fill="#ef4444">1.0774 SL</text>
<text x="1080" y="470" font-size="12" fill="#eab308">1.0778 sweep low</text>

<!-- pre-sweep down candles into liquidity -->
<rect x="100" y="330" width="16" height="35" fill="#ef4444"/><line x1="108" y1="322" x2="108" y2="373" stroke="#ef4444" stroke-width="2"/>
<rect x="140" y="350" width="16" height="30" fill="#ef4444"/><line x1="148" y1="342" x2="148" y2="390" stroke="#ef4444" stroke-width="2"/>

<!-- liquidity dashed at old low -->
<line x1="40" y1="392" x2="1160" y2="392" stroke="#eab308" stroke-dasharray="6,4" stroke-width="2"/>
<text x="45" y="386" font-size="12" fill="#eab308">Đáy tuần trước 1.0785</text>

<!-- sweep candle wick down -->
<rect x="190" y="365" width="20" height="20" fill="#22c55e"/>
<line x1="200" y1="358" x2="200" y2="465" stroke="#22c55e" stroke-width="2.5"/>
<text x="215" y="440" font-size="13" fill="#22c55e" font-weight="bold">1: Sweep 1.0778</text>
<text x="215" y="458" font-size="12" fill="#94a3b8">wick 14 pip / body 3 pip (4.7x)</text>

<!-- RB zone -->
<rect x="185" y="378" width="60" height="87" fill="#22c55e" opacity="0.18" stroke="#22c55e" stroke-dasharray="3,3"/>

<!-- reversal candles up -->
<rect x="260" y="330" width="16" height="35" fill="#22c55e"/><line x1="268" y1="320" x2="268" y2="372" stroke="#22c55e" stroke-width="2"/>
<rect x="300" y="290" width="16" height="35" fill="#22c55e"/><line x1="308" y1="280" x2="308" y2="332" stroke="#22c55e" stroke-width="2"/>

<!-- MSS marker -->
<circle cx="316" cy="290" r="5" fill="#f97316"/>
<text x="325" y="285" font-size="13" fill="#f97316" font-weight="bold">2: MSS bullish @ 1.0798 (07:12)</text>

<!-- pullback to RB body edge -->
<rect x="360" y="360" width="16" height="30" fill="#ef4444"/><line x1="368" y1="350" x2="368" y2="398" stroke="#ef4444" stroke-width="2"/>
<text x="385" y="385" font-size="13" fill="#38bdf8" font-weight="bold">3: Pullback 1.0791 (07:24)</text>
<text x="385" y="403" font-size="12" fill="#94a3b8">mép body RB + FVG M5 nhỏ</text>

<!-- entry line -->
<line x1="40" y1="392" x2="1160" y2="392" stroke="#38bdf8" stroke-dasharray="2,2" opacity="0"/>
<line x1="40" y1="392" x2="1160" y2="392" stroke="none"/>
<line x1="360" y1="392" x2="1160" y2="392" stroke="#38bdf8" stroke-dasharray="5,4" stroke-width="2"/>

<!-- SL line -->
<line x1="360" y1="465" x2="1160" y2="465" stroke="#ef4444" stroke-dasharray="5,4" stroke-width="2"/>

<!-- rally candles to TP1 then TP2 -->
<rect x="420" y="320" width="16" height="55" fill="#22c55e"/><line x1="428" y1="310" x2="428" y2="385" stroke="#22c55e" stroke-width="2"/>
<rect x="460" y="270" width="16" height="55" fill="#22c55e"/><line x1="468" y1="260" x2="468" y2="335" stroke="#22c55e" stroke-width="2"/>
<rect x="500" y="220" width="16" height="55" fill="#22c55e"/><line x1="508" y1="210" x2="508" y2="285" stroke="#22c55e" stroke-width="2"/>
<rect x="560" y="255" width="16" height="20" fill="#22c55e"/><line x1="568" y1="248" x2="568" y2="285" stroke="#22c55e" stroke-width="2"/>
<text x="590" y="240" font-size="13" fill="#a78bfa" font-weight="bold">4: TP1 1.0835 (09:40) +2.6R</text>

<line x1="40" y1="200" x2="1160" y2="200" stroke="#a78bfa" stroke-dasharray="5,4" stroke-width="2"/>
<rect x="650" y="170" width="16" height="35" fill="#22c55e"/><line x1="658" y1="160" x2="658" y2="215" stroke="#22c55e" stroke-width="2"/>
<rect x="700" y="180" width="16" height="20" fill="#22c55e"/><line x1="708" y1="172" x2="708" y2="210" stroke="#22c55e" stroke-width="2"/>
<text x="730" y="190" font-size="13" fill="#a78bfa" font-weight="bold">5: TP2 1.0862 (13:15) +4.2R</text>

<!-- summary box -->
<rect x="40" y="530" width="1120" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="60" y="558" font-size="15" fill="#e2e8f0" font-weight="bold">Tổng kết trade</text>
<text x="60" y="582" font-size="13" fill="#94a3b8">Entry 1.0791 | SL 1.0774 (risk 17 pip) | TP1 1.0835 (+2.6R, đóng 50%) | TP2 1.0862 (+4.2R, đóng phần còn lại)</text>
<text x="60" y="604" font-size="13" fill="#94a3b8">R trung bình cả lệnh: +3.4R</text>
<text x="60" y="630" font-size="13" fill="#eab308">Bài học: sweep xảy ra đúng lúc chuyển giao phiên Á→London — thanh khoản mỏng cuối phiên Á</text>
<text x="60" y="650" font-size="13" fill="#eab308">dễ bị quét bởi lệnh mở đầu London, tạo sweep sạch mà không cần một cú tin tức nào.</text>
</svg>
