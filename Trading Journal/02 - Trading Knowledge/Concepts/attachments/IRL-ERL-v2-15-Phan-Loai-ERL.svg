<text x="726.0" y="143.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Đỉnh/đáy bằng nhau ở biên = ERL “dày”</text>
<text x="726.0" y="159.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">(theo diễn giải ICT). EQH nằm GIỮA</text>
<text x="726.0" y="176.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">range thì là IRL.</text>
<text x="726.0" y="204.7" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">Luôn là ERL?</text>
<rect x="801.5" y="191.7" width="79.5" height="18.0" rx="9.0" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="841.3" y="204.7" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Chỉ khi ở biên</text>
