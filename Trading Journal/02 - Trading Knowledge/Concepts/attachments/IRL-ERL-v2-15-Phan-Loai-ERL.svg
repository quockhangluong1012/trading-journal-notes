<rect x="925.9" y="22" width="46.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="948.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ERL</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Phân loại External Range Liquidity — và câu hỏi “mức này có LUÔN là ERL không?”</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một mức chỉ là ERL khi nó nằm Ở hoặc NGOÀI biên của range đang tham chiếu. PDH, PWH, EQH… không tự động là ERL.</text>
<rect x="28.0" y="87.0" width="466.0" height="228.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="97.0" width="4.0" height="208.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="44.0" y="111.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">1 · External swing high / low</text>
<rect x="44.0" y="125.0" width="190.0" height="176.0" rx="8" fill="#FCFCFE" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="78.8" y="156.8" width="147.2" height="112.3" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
