<path d="M530.0,484.2 L556.8,462.4 L583.5,471.7 L610.3,449.9 L637.1,459.2 L663.8,443.6 L690.6,453.0 L704.0,446.8" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="726.0" y="383.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Thường là ERL của khung lớn. Với một</text>
<text x="726.0" y="399.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">range H1 nhỏ, chúng là “ERL xa”: đích</text>
<text x="726.0" y="416.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">nếu range nhỏ bị phá, không phải bước</text>
<text x="726.0" y="432.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">kế tiếp.</text>
<text x="726.0" y="461.2" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">Luôn là ERL?</text>
<rect x="801.5" y="448.2" width="123.1" height="18.0" rx="9.0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="863.0" y="461.2" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">Thường — ở khung lớn</text>
<rect x="28.0" y="567.0" width="944.0" height="34.8" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="591.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Câu kiểm tra nhanh: “Nếu giá chạm mức này, nó có ĐI RA NGOÀI range tôi đang vẽ không?” Có ⇒ ERL. Không ⇒ IRL. Chưa vẽ range ⇒ câu hỏi chưa có nghĩa.</text>
