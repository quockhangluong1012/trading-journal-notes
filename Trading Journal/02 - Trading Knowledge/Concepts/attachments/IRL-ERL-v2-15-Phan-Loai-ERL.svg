<text x="522.0" y="351.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">4 · PWH/PWL, đỉnh/đáy 20–40–60 ngày</text>
<rect x="522.0" y="365.0" width="190.0" height="176.0" rx="8" fill="#FCFCFE" stroke="#D8DBE2" stroke-width="1.2"/>
