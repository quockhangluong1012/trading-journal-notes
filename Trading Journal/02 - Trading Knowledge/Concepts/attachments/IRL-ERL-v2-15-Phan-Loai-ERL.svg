<text x="248.0" y="143.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Chính hai swing định ra range. LUÔN là</text>
<text x="248.0" y="159.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">ERL của range mà nó định ra — đó là</text>
<text x="248.0" y="176.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">định nghĩa.</text>
<text x="248.0" y="204.7" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">Luôn là ERL?</text>
<rect x="323.5" y="191.7" width="133.2" height="18.0" rx="9.0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="390.1" y="204.7" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">Luôn — với range của nó</text>
