<text x="224.0" y="426.2" font-size="10.5" font-weight="600" fill="#475569" text-anchor="end">PDH</text>
<path d="M52.0,453.0 L78.8,431.2 L105.5,443.6 L132.3,434.3 L159.1,449.9 L185.8,437.4 L212.6,445.2 L226.0,440.5" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="248.0" y="383.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">Hôm nay đi ngang giữa range D1: PDH</text>
<text x="248.0" y="399.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">nằm BÊN TRONG range D1 ⇒ là IRL của</text>
<text x="248.0" y="416.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">D1, dù vẫn là ERL của range ngày hôm</text>
<text x="248.0" y="432.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="230.0">qua.</text>
<text x="248.0" y="461.2" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">Luôn là ERL?</text>
