<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="648" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cùng một cú vọt lên 103 — ba tương lai khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ở khoảnh khắc “BÂY GIỜ”, bạn chưa biết tương lai nào sẽ xảy ra. Chỉ khi giá làm thêm việc, bạn mới có bằng chứng để gọi tên.</text>
<rect x="832.8" y="22.0" width="139.2" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="902.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ELI5 · REAL-TIME</text>
<rect x="28.0" y="92.0" width="400.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="116.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Những gì bạn thấy được tới lúc này</text>
<rect x="60.0" y="272.0" width="340.0" height="150.0" rx="2" fill="#F8FAFC"/>
