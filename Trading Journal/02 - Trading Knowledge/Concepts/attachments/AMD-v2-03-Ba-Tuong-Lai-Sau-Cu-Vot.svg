<text x="62.0" y="268.0" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start">100</text>
<line x1="60.0" y1="422.0" x2="400.0" y2="422.0" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="62.0" y="435.0" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start">90</text>
<path d="M60.0,347.0 L92.1,302.0 L124.2,392.0 L156.2,317.0 L188.3,281.0 L220.4,399.5 L252.5,332.0 L284.5,284.0 L316.6,362.0 L348.7,257.0 L380.8,227.0" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="380.8" cy="227.0" r="5.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<line x1="388.8" y1="140.0" x2="388.8" y2="516.0" stroke="#EA580C" stroke-width="2" stroke-dasharray="5,4"/>
<text x="382.8" y="150.0" font-size="11" font-weight="800" fill="#EA580C" text-anchor="end">BÂY GIỜ</text>
<text x="44.0" y="538.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">Giá đã vọt ra khỏi hộp. Đó là một SỰ KIỆN, chưa phải một</text>
<text x="44.0" y="554.6" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">câu chuyện.</text>
<rect x="446.0" y="92.0" width="526.0" height="142.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.1"/>
<text x="460.0" y="114.0" font-size="12.8" font-weight="700" fill="#15803D" text-anchor="start">A. Giữ được trên 100 rồi đi tiếp → breakout THẬT</text>
<rect x="462.0" y="124.0" width="250.0" height="100.0" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<line x1="462.0" y1="162.5" x2="712.0" y2="162.5" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="462.0" y1="200.9" x2="712.0" y2="200.9" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M462.0,150.9 L493.2,156.7 L524.5,152.8 L555.8,147.1 L587.0,148.6 L618.2,141.3 L649.5,135.5 L680.8,137.8 L712.0,129.8" fill="none" stroke="#15803D" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="462.0" cy="150.9" r="4" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="728.0" y="154.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không phải Manipulation. Ai bán ngược</text>
<text x="728.0" y="170.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ở 103 sẽ thua.</text>
<rect x="446.0" y="244.0" width="526.0" height="142.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="460.0" y="266.0" font-size="12.8" font-weight="700" fill="#7C3AED" text-anchor="start">B. Quay về dưới 100 rồi rơi mạnh → giống AMD</text>
<rect x="462.0" y="276.0" width="250.0" height="100.0" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<line x1="462.0" y1="314.5" x2="712.0" y2="314.5" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="462.0" y1="352.9" x2="712.0" y2="352.9" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M462.0,302.9 L493.2,318.3 L524.5,324.1 L555.8,321.4 L587.0,333.7 L618.2,345.2 L649.5,355.2 L680.8,364.5 L712.0,370.2" fill="none" stroke="#7C3AED" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="462.0" cy="302.9" r="4" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="728.0" y="306.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lúc này mới có lý do gọi cú vọt là</text>
<text x="728.0" y="322.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">“Manipulation”.</text>
<rect x="446.0" y="396.0" width="526.0" height="142.0" rx="10" fill="#F3F4F6" stroke="#64748B" stroke-width="1.1"/>
<text x="460.0" y="418.0" font-size="12.8" font-weight="700" fill="#64748B" text-anchor="start">C. Quay về rồi lại đi ngang trong hộp → chưa là gì cả</text>
<rect x="462.0" y="428.0" width="250.0" height="100.0" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<line x1="462.0" y1="466.5" x2="712.0" y2="466.5" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="462.0" y1="504.9" x2="712.0" y2="504.9" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M462.0,454.9 L493.2,470.3 L524.5,479.9 L555.8,472.2 L587.0,489.5 L618.2,475.7 L649.5,491.5 L680.8,478.0 L712.0,484.2" fill="none" stroke="#64748B" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="462.0" cy="454.9" r="4" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="728.0" y="458.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ là một cú chọc ra rồi về. Không có</text>
<text x="728.0" y="474.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Distribution.</text>
<rect x="446.0" y="552.0" width="526.0" height="48.6" rx="8" fill="#FFF0F3" stroke="#BE123C" stroke-width="1"/>
<text x="456.0" y="574.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Quy tắc: không đặt tên “Manipulation” cho cú vọt khi giá chưa quay về và chưa có lực</text>
<text x="456.0" y="590.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đi về phía bên kia.</text>
</svg>
