<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="638.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cùng MỘT cây nến CHoCH, tám loại câu nói khác nhau</text>
<rect x="855.3" y="23.0" width="116.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="913.7" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CÁCH ĐỌC NOTE</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Lỗi lớn nhất khi học CHoCH: nói một câu DIỄN GIẢI bằng giọng chắc chắn của câu QUAN SÁT. Mỗi câu trong note mang một nhãn.</text>
<rect x="28.0" y="94.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="94.5" width="6.0" height="56.0" rx="3" fill="#15803D"/>
<rect x="46.0" y="103.5" width="95.3" height="19.5" rx="9.75" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="93.7" y="115.2" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">[OBSERVABLE]</text>
<text x="46.0" y="140.5" font-size="11" font-weight="400" fill="#6B7280">Ai nhìn chart cũng thấy giống nhau</text>
<text x="350.0" y="119.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Thân nến H1 đóng cửa thấp hơn đáy 1.0850 — đáy đã phóng ra cú tăng gần nhất.”</text>
<rect x="28.0" y="156.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="156.5" width="6.0" height="56.0" rx="3" fill="#0891B2"/>
<rect x="46.0" y="165.5" width="140.7" height="19.5" rx="9.75" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="1"/>
<text x="116.3" y="177.2" font-size="10.5" font-weight="700" fill="#0891B2" text-anchor="middle">[MARKET MECHANICS]</text>
<text x="46.0" y="202.5" font-size="11" font-weight="400" fill="#6B7280">Giải thích bằng cách lệnh được khớp</text>
<text x="350.0" y="181.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Giá đi xuống khi lệnh bán chủ động ăn hết lệnh chờ mua ở các mức giá bên dưới.”</text>
<rect x="28.0" y="218.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="218.5" width="6.0" height="56.0" rx="3" fill="#2563EB"/>
<rect x="46.0" y="227.5" width="117.3" height="19.5" rx="9.75" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1"/>
<text x="104.7" y="239.2" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">[ICT FRAMEWORK]</text>
<text x="46.0" y="264.5" font-size="11" font-weight="400" fill="#6B7280">Cách ICT / SMC đặt tên và dùng</text>
<text x="350.0" y="243.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Phá ngược trạng thái lần đầu = CHoCH; có displacement thì nhiều người gọi là MSS.”</text>
<rect x="28.0" y="280.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="280.5" width="6.0" height="56.0" rx="3" fill="#B45309"/>
<rect x="46.0" y="289.5" width="117.2" height="19.5" rx="9.75" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="104.6" y="301.2" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">[INTERPRETATION]</text>
<text x="46.0" y="326.5" font-size="11" font-weight="400" fill="#6B7280">Hợp lý, nhưng OHLC không chứng minh được</text>
<text x="350.0" y="305.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Phe mua đã không bảo vệ mức này; có thể stop của người mua bên dưới đã bị kích hoạt.”</text>
<rect x="28.0" y="342.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="342.5" width="6.0" height="56.0" rx="3" fill="#7C3AED"/>
<rect x="46.0" y="351.5" width="94.2" height="19.5" rx="9.75" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="1"/>
<text x="93.1" y="363.2" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">[HYPOTHESIS]</text>
<text x="46.0" y="388.5" font-size="11" font-weight="400" fill="#6B7280">Có thể kiểm chứng, chưa kiểm chứng</text>
<text x="350.0" y="367.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“CHoCH xảy ra sau một cú quét thanh khoản sẽ ít thất bại hơn CHoCH không có quét.”</text>
<rect x="28.0" y="404.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="404.5" width="6.0" height="56.0" rx="3" fill="#0D9488"/>
<rect x="46.0" y="413.5" width="166.8" height="19.5" rx="9.75" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1"/>
<text x="129.4" y="425.2" font-size="10.5" font-weight="700" fill="#0D9488" text-anchor="middle">[FRAMEWORK-DEPENDENT]</text>
<text x="46.0" y="450.5" font-size="11" font-weight="400" fill="#6B7280">Đúng hay sai tùy định nghĩa của từng trường phái</text>
<text x="350.0" y="429.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Râu nến vượt đáy là đủ để gọi CHoCH.” (có nguồn chấp nhận, có nguồn không)</text>
<rect x="28.0" y="466.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="466.5" width="6.0" height="56.0" rx="3" fill="#94A3B8"/>
<rect x="46.0" y="475.5" width="124.0" height="19.5" rx="9.75" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-width="1"/>
<text x="108.0" y="487.2" font-size="10.5" font-weight="700" fill="#94A3B8" text-anchor="middle">[NOT ESTABLISHED]</text>
<text x="46.0" y="512.5" font-size="11" font-weight="400" fill="#6B7280">Chưa có bằng chứng đủ để khẳng định</text>
<text x="350.0" y="491.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Smart Money đã quyết định đảo chiều ở đây.”</text>
<rect x="28.0" y="528.5" width="944.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="528.5" width="6.0" height="56.0" rx="3" fill="#B91C1C"/>
<rect x="46.0" y="537.5" width="139.9" height="19.5" rx="9.75" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="115.9" y="549.2" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">[BACKTEST REQUIRED]</text>
<text x="46.0" y="574.5" font-size="11" font-weight="400" fill="#6B7280">Không được coi là lợi thế khi chưa đo</text>
<text x="350.0" y="553.5" font-size="12.5" font-weight="400" fill="#111827" data-bx="349.0,957.0" font-style="italic">“Vào lệnh theo CHoCH tại POI cho kết quả tốt hơn vào lệnh ngẫu nhiên.”</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Chỉ nhãn đầu tiên là chắc chắn. Càng xuống dưới, câu nói càng là thứ ta NGHĨ hoặc HY VỌNG, và càng cần bằng chứng. Mức giá 1.0850 là số minh họa.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
