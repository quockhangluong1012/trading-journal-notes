<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="638.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Case E — Liquidity sweep nhưng KHÔNG có CHoCH</text>
<rect x="876.7" y="23.0" width="95.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.4" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CASE STUDY</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Một sự kiện thanh khoản không đồng nghĩa với thay đổi cấu trúc.</text>
<rect x="28.0" y="92.5" width="560.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<line x1="255.2" y1="326.4" x2="566.1" y2="326.4" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="564.1" y="320.4" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">protected high</text>
<line x1="208.3" y1="395.7" x2="566.1" y2="395.7" stroke="#7C3AED" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3,3"/>
<text x="564.1" y="410.7" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">đáy cũ</text>
<polyline points="73.3,177.9 132.0,316.5 178.9,257.1 237.6,395.7 284.5,326.4 331.5,445.3 390.1,351.2 437.1,405.6 472.3,375.9 542.7,514.6" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="132.0" cy="316.5" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="178.9" cy="257.1" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="237.6" cy="395.7" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="284.5" cy="326.4" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="331.5" cy="445.3" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="390.1" cy="351.2" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="437.1" cy="405.6" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="472.3" cy="375.9" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="542.7" cy="514.6" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="331.5" y="460.3" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">quét</text>
<text x="390.1" y="328.1" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">bật lên nhưng</text>
<text x="390.1" y="341.2" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">không tới 65</text>
<text x="536.7" y="529.6" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">giảm tiếp</text>
<rect x="600.0" y="92.5" width="372.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="614.0" y="106.5" width="175.0" height="20.0" rx="10.0" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="701.5" y="118.7" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">Sweep only — không CHoCH</text>
<text x="616.0" y="150.5" font-size="11" font-weight="700" fill="#6B7280">BỐI CẢNH</text>
<text x="616.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giá giảm vào vùng có nhiều đáy cũ.</text>
<text x="616.0" y="188.9" font-size="11" font-weight="700" fill="#6B7280">CHUỖI GIÁ</text>
<text x="616.0" y="204.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Râu nến thủng đáy cũ 58 rồi đóng lại phía trên: một cú quét.</text>
<text x="616.0" y="221.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giá bật lên khá mạnh…</text>
<text x="616.0" y="243.9" font-size="11" font-weight="700" fill="#6B7280">ĐIỂM MẤU CHỐT</text>
<text x="616.0" y="259.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">…nhưng dừng ở 62.5, dưới protected high 65. Không có</text>
<text x="616.0" y="276.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">CHoCH.</text>
<text x="616.0" y="298.8" font-size="11" font-weight="700" fill="#6B7280">PHÂN LOẠI</text>
<text x="616.0" y="314.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Liquidity sweep KHÔNG kèm structural shift. Trạng thái vẫn</text>
<text x="616.0" y="331.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">là GIẢM.</text>
<text x="616.0" y="353.8" font-size="11" font-weight="700" fill="#6B7280">DIỄN GIẢI</text>
<text x="616.0" y="369.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Lệnh dừng lỗ có thể đã được khớp, nhưng lực mua sau đó</text>
<text x="616.0" y="386.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">không đủ để phá mức mà cấu trúc giảm dựa vào.</text>
<text x="616.0" y="408.7" font-size="11" font-weight="700" fill="#6B7280">HÀM Ý</text>
<text x="616.0" y="424.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Không Long chỉ vì “đã quét”. Chờ CHoCH, hoặc chấp nhận</text>
<text x="616.0" y="441.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">giảm tiếp.</text>
<text x="616.0" y="463.7" font-size="11" font-weight="700" fill="#6B7280">BÀI HỌC</text>
<text x="616.0" y="479.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Quét là ĐIỀU KIỆN ĐẦU VÀO có thể có của một đảo chiều,</text>
<text x="616.0" y="496.1" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">không phải chính đảo chiều.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đây là lý do protocol của bạn đặt câu hỏi “liquidity sweep có tạo ra CHoCH không?”. Câu trả lời: không tự động.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
