<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760">
  <rect width="1280" height="760" rx="14" fill="#131722" stroke="#2a2e39"/>
  <text x="40" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#d1d4dc">Mốc ngày khác nhau: đóng 17:00 ET vs midnight open</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#787b86">GBPUSD 50 ngày: 38% cho ra bias D1 khác nhau giữa hai quy ước</text>

  <line x1="640" y1="110" x2="640" y2="660" stroke="#2a2e39" stroke-width="2"/>

  <!-- Left: CME/futures 17:00 ET -->
  <rect x="90" y="140" width="220" height="42" rx="8" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="200" y="167" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90d9">Ngày CME/futures (đóng 17:00 ET)</text>

  <line x1="80" y1="380" x2="80" y2="620" stroke="#2a2e39" stroke-width="1"/>
  <text x="60" y="385" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#787b86">17:00</text>
  <text x="60" y="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#787b86">17:00 (+1)</text>

  <g>
    <line x1="150" y1="420" x2="150" y2="470" stroke="#26a69a" stroke-width="2"/>
    <rect x="140" y="430" width="20" height="30" fill="#26a69a" rx="1"/>
    <line x1="200" y1="400" x2="200" y2="450" stroke="#26a69a" stroke-width="2"/>
    <rect x="190" y="410" width="20" height="30" fill="#26a69a" rx="1"/>
    <line x1="250" y1="440" x2="250" y2="510" stroke="#ef5350" stroke-width="2.5"/>
    <rect x="238" y="450" width="24" height="45" fill="#ef5350" rx="1"/>
  </g>
  <text x="200" y="550" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ef5350">close &lt; open -&gt; D1 bearish</text>

  <!-- Right: midnight broker -->
  <rect x="990" y="140" width="220" height="42" rx="8" fill="#b48ead" opacity="0.16" stroke="#b48ead" stroke-width="1.5"/>
  <text x="1100" y="167" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b48ead">Ngày FX cash (midnight broker)</text>

  <line x1="980" y1="380" x2="980" y2="620" stroke="#2a2e39" stroke-width="1"/>
  <text x="965" y="385" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#787b86">00:00</text>
  <text x="955" y="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#787b86">00:00 (+1)</text>

  <g>
    <line x1="1030" y1="450" x2="1030" y2="500" stroke="#26a69a" stroke-width="2"/>
    <rect x="1020" y="460" width="20" height="30" fill="#26a69a" rx="1"/>
    <line x1="1080" y1="420" x2="1080" y2="470" stroke="#26a69a" stroke-width="2"/>
    <rect x="1070" y="430" width="20" height="30" fill="#26a69a" rx="1"/>
    <line x1="1130" y1="380" x2="1130" y2="430" stroke="#26a69a" stroke-width="2"/>
    <rect x="1120" y="390" width="20" height="30" fill="#26a69a" rx="1"/>
  </g>
  <text x="1080" y="550" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#26a69a">close &gt; open -&gt; D1 bullish</text>

  <!-- overlap zone highlighted -->
  <rect x="230" y="380" width="80" height="240" fill="#ff9800" opacity="0.08" stroke="#ff9800" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="270" y="365" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ff9800">vùng lệch pha 17:00-24:00 ET</text>

  <rect x="300" y="670" width="680" height="50" rx="8" fill="#131722" stroke="#565b66" stroke-width="1"/>
  <text x="640" y="700" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#d1d4dc">Cùng dữ liệu, hai quy ước đóng ngày -&gt; hai kết luận bias D1 trái ngược</text>

  <text x="640" y="745" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#565b66">Xem EC-D3 - chọn một quy ước duy nhất và dùng nhất quán</text>
</svg>
