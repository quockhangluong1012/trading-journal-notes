<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Correlation Risk — 2 lenh tuong quan = 1 rui ro USD lon</text>

  <!-- box EURUSD long -->
  <rect x="60" y="110" width="380" height="160" fill="#1e222d" stroke="#26a69a" stroke-width="2"/>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#26a69a">Lenh 1: EURUSD LONG</text>
  <text x="80" y="170" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Risk 0.5% = $500</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ban chat: Long EUR / Short USD</text>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ly do: DXY yeu, bias giam USD</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Nhin rieng: "risk 0.5%, an toan"</text>

  <!-- box GBPUSD long -->
  <rect x="520" y="110" width="380" height="160" fill="#1e222d" stroke="#26a69a" stroke-width="2"/>
  <text x="540" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#26a69a">Lenh 2: GBPUSD LONG</text>
  <text x="540" y="170" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Risk 0.5% = $500</text>
  <text x="540" y="195" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ban chat: Long GBP / Short USD</text>
  <text x="540" y="220" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ly do: DXY yeu, bias giam USD (GIONG)</text>
  <text x="540" y="245" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Nhin rieng: "risk 0.5%, an toan"</text>

  <!-- arrows converging -->
  <path d="M 250 270 L 460 380" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 710 270 L 500 380" stroke="#ffffff" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- combined USD short box -->
  <rect x="300" y="390" width="360" height="110" fill="rgba(239,83,80,0.2)" stroke="#ef5350" stroke-width="2"/>
  <text x="320" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ef5350">Thuc te: 1 vi the SHORT USD lon</text>
  <text x="320" y="450" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Tong rui ro thuc te ~ 1% (gop), khong phai</text>
  <text x="320" y="475" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">hai rui ro doc lap 0.5% + 0.5%</text>

  <text x="60" y="530" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">Neu USD dao chieu bat ngo (vd tin CPI manh), CA HAI lenh cung dinh SL cung luc - lo gop co the vuot han muc du moi lenh rieng le duoi 0.5%.</text>
</svg>
