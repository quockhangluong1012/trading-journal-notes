<rect x="575.1" y="138.5" width="60.9" height="208.0" rx="4" fill="#E5E7EB" fill-opacity="0.55" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
<text x="605.6" y="236.5" font-size="30" font-weight="700" fill="#6B7280" text-anchor="middle">?</text>
<text x="605.6" y="258.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">chưa biết</text>
<text x="570.2" y="310.4" font-size="10" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="356.0,642.0">CHoCH ↓</text>
<text x="362.0" y="372.5" font-size="12" font-weight="400" fill="#15803D" data-bx="361.0,637.0">Biết: protected low đã bị đóng nến xuyên →</text>
<text x="362.0" y="389.5" font-size="12" font-weight="400" fill="#15803D" data-bx="361.0,637.0">câu “đang tăng” ở lớp này hết hiệu lực.</text>
<text x="362.0" y="416.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="361.0,637.0">Đổi TỰ ĐỘNG: trạng thái lớp này chuyển sang</text>
<text x="362.0" y="433.6" font-size="12" font-weight="400" fill="#2563EB" data-bx="361.0,637.0">“đang thử giảm”; mức tham chiếu mới phía trên</text>
<text x="362.0" y="450.6" font-size="12" font-weight="400" fill="#2563EB" data-bx="361.0,637.0">= đỉnh 68.</text>
<text x="362.0" y="477.7" font-size="12" font-weight="400" fill="#B45309" data-bx="361.0,637.0">Chưa biết: đây là đảo chiều, pullback sâu của</text>
<text x="362.0" y="494.7" font-size="12" font-weight="400" fill="#B45309" data-bx="361.0,637.0">khung lớn, hay range.</text>
<rect x="664.0" y="92.5" width="306.0" height="540.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="688.0" cy="113.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="688.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="705.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="704.0,959.0">SAU: giá hồi lên</text>
<line x1="750.0" y1="277.8" x2="935.7" y2="277.8" stroke="#C026D3" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="752.0" y="292.8" font-size="10.5" font-weight="700" fill="#C026D3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="674.0,960.0">đã bị phá</text>
<polyline points="695.2,342.5 740.9,236.6 765.2,277.8 810.9,177.8 835.3,224.8 865.7,201.3 896.2,295.4 920.5,254.2" fill="none" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
