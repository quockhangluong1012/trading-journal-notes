<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="648.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Trước — Lúc — Sau: điều gì thật sự thay đổi khi một CHoCH xảy ra?</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Ba ảnh chụp cùng một chart ở ba thời điểm. Vùng xám là tương lai chưa biết. Đọc kỹ dòng “chưa biết”: đó là phần hay bị bỏ qua nhất.</text>
<rect x="28.0" y="92.5" width="306.0" height="540.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="52.0" cy="113.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="69.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="68.0,323.0">TRƯỚC: giá đang lùi về</text>
<line x1="114.0" y1="277.8" x2="226.7" y2="277.8" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="116.0" y="271.8" font-size="10.5" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,324.0">protected low</text>
<polyline points="59.2,342.5 104.9,236.6 129.2,277.8 174.9,177.8 199.3,224.8 229.7,248.3" fill="none" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
