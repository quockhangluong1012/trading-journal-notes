<circle cx="199.3" cy="224.8" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="229.7" cy="248.3" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<rect x="226.7" y="138.5" width="91.3" height="208.0" rx="4" fill="#E5E7EB" fill-opacity="0.55" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
<text x="272.3" y="236.5" font-size="30" font-weight="700" fill="#6B7280" text-anchor="middle">?</text>
<text x="272.3" y="258.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">chưa biết</text>
<text x="44.0" y="372.5" font-size="12" font-weight="400" fill="#15803D" data-bx="43.0,319.0">Biết: trạng thái TĂNG; protected low = 51.</text>
<text x="44.0" y="399.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="43.0,319.0">Đổi: chưa có gì.</text>
<text x="44.0" y="426.5" font-size="12" font-weight="400" fill="#B45309" data-bx="43.0,319.0">Chưa biết: lần lùi này dừng ở đâu.</text>
<rect x="346.0" y="92.5" width="306.0" height="540.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="370.0" cy="113.5" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="370.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="387.0" y="118.0" font-size="13.5" font-weight="700" fill="#C026D3" data-bx="386.0,641.0">LÚC: nến đóng dưới 51</text>
<line x1="432.0" y1="277.8" x2="593.4" y2="277.8" stroke="#C026D3" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="434.0" y="292.8" font-size="10.5" font-weight="700" fill="#C026D3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="356.0,642.0">đã bị phá</text>
<polyline points="377.2,342.5 422.9,236.6 447.2,277.8 492.9,177.8 517.3,224.8 547.7,201.3 578.2,295.4" fill="none" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
