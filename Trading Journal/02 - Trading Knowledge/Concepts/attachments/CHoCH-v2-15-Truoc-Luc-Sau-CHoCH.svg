<circle cx="865.7" cy="201.3" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="896.2" cy="295.4" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="920.5" cy="254.2" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<rect x="917.5" y="138.5" width="36.5" height="208.0" rx="4" fill="#E5E7EB" fill-opacity="0.55" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
<text x="935.7" y="236.5" font-size="30" font-weight="700" fill="#6B7280" text-anchor="middle">?</text>
<text x="935.7" y="258.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">chưa biết</text>
<text x="888.2" y="310.4" font-size="10" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="674.0,960.0">CHoCH ↓</text>
<text x="680.0" y="372.5" font-size="12" font-weight="400" fill="#15803D" data-bx="679.0,955.0">Biết thêm: giá hồi nhưng chưa vượt 68.</text>
<text x="680.0" y="399.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="679.0,955.0">Đổi: nếu tạo đỉnh thấp hơn rồi thủng 48 → BOS</text>
<text x="680.0" y="416.5" font-size="12" font-weight="400" fill="#2563EB" data-bx="679.0,955.0">↓ đầu tiên, cấu trúc giảm mới có hình dạng.</text>
<text x="680.0" y="443.6" font-size="12" font-weight="400" fill="#B45309" data-bx="679.0,955.0">Chưa biết: vẫn có thể vượt 68 → CHoCH thất</text>
<text x="680.0" y="460.6" font-size="12" font-weight="400" fill="#B45309" data-bx="679.0,955.0">bại.</text>
<text x="28.0" y="634.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Câu then chốt: CHoCH thay đổi BẢN ĐỒ (mô tả cấu trúc) một cách chắc chắn. Nó KHÔNG thay đổi chắc chắn điều giá sẽ làm tiếp theo.</text>
