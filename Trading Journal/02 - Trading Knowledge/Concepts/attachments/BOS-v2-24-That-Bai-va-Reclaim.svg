<svg viewBox="0 0 1100 470" width="1100" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Khi BOS thất bại: năm kịch bản và cách gọi tên đúng</title>
<desc>Khi BOS thất bại: năm kịch bản và cách gọi tên đúng. Thất bại của một cú phá có nhiều mức độ. Gọi đúng tên giúp biết điều gì đã sai: cú phá, hay cả cấu trúc.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1100" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Khi BOS thất bại: năm kịch bản và cách gọi tên đúng</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Thất bại của một cú phá có nhiều mức độ. Gọi đúng tên giúp biết điều gì đã sai: cú phá, hay cả cấu trúc.</tspan></text>
<rect x="24.0" y="112.0" width="200.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="28.9" y="88.0" width="22.3" height="20.0" rx="10.0" fill="#DC2626"/>
<text x="40.0" y="102.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">A</tspan></text>
<text x="54.0" y="102.0" font-size="11.5" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Phá rồi quay lại ngay</tspan></text>
<line x1="67.8" y1="191.0" x2="209.5" y2="191.0" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="209.5" y="205.0" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="34.0,275.0 67.8,191.0 97.0,228.8 128.5,182.6 142.0,203.6 180.2,233.0 205.0,245.6" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="24.0" y="332.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Chưa từng được chấp nhận. Gọi</tspan></text>
<text x="24.0" y="347.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>đúng: quét / phá thất bại (B0 bị từ</tspan></text>
<text x="24.0" y="363.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>chối).</tspan></text>
<rect x="237.0" y="112.0" width="200.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="241.9" y="88.0" width="22.3" height="20.0" rx="10.0" fill="#B45309"/>
<text x="253.0" y="102.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">B</tspan></text>
<text x="267.0" y="102.0" font-size="11.5" fill="#B45309" text-anchor="start"><tspan font-weight="700">Đóng trên rồi giảm tiếp</tspan></text>
<line x1="280.8" y1="191.0" x2="422.5" y2="191.0" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="422.5" y="205.0" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="247.0,275.0 280.8,191.0 310.0,228.8 337.0,178.4 350.5,186.8 368.5,207.8 413.5,241.4" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="237.0" y="332.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Có B1 nhưng không có B2. BOS bị</tspan></text>
<text x="237.0" y="347.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>hủy; cấu trúc tăng chưa chắc sai,</tspan></text>
<text x="237.0" y="363.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>nhưng cú phá vô hiệu.</tspan></text>
<rect x="450.0" y="112.0" width="200.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="454.9" y="88.0" width="22.3" height="20.0" rx="10.0" fill="#7C3AED"/>
<text x="466.0" y="102.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">C</tspan></text>
<text x="480.0" y="102.0" font-size="11.5" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">Phá đáy rồi lấy lại</tspan></text>
<line x1="493.8" y1="254.0" x2="635.5" y2="254.0" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="635.5" y="249.0" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đáy cũ</tspan></text>
<polyline points="460.0,170.0 493.8,254.0 523.0,212.0 550.0,268.7 561.2,241.4 595.0,203.6 631.0,191.0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="450.0" y="332.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Bearish BOS bị &quot;reclaim&quot;: giá quay</tspan></text>
<text x="450.0" y="347.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>lại trên đáy cũ. Cấu trúc giảm không</tspan></text>
<text x="450.0" y="363.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>được gia hạn; có thể chỉ là quét</tspan></text>
<text x="450.0" y="379.6" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>đáy.</tspan></text>
<rect x="663.0" y="112.0" width="200.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="667.9" y="88.0" width="22.3" height="20.0" rx="10.0" fill="#6B7280"/>
<text x="679.0" y="102.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">D</tspan></text>
<text x="693.0" y="102.0" font-size="11.5" fill="#6B7280" text-anchor="start"><tspan font-weight="700">Phá nhưng không đi tiếp</tspan></text>
<line x1="706.8" y1="191.0" x2="848.5" y2="191.0" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="848.5" y="205.0" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="673.0,275.0 706.8,191.0 736.0,228.8 763.0,184.7 776.5,188.9 790.0,182.6 803.5,192.1 817.0,184.7 839.5,188.9" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="663.0" y="332.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Được chấp nhận yếu, không có hậu</tspan></text>
<text x="663.0" y="347.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>quả. Chưa sai — nhưng cũng chưa</tspan></text>
<text x="663.0" y="363.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>chứng minh được gì thêm.</tspan></text>
<rect x="876.0" y="112.0" width="200.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="880.9" y="88.0" width="22.3" height="20.0" rx="10.0" fill="#2563EB"/>
<text x="892.0" y="102.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">E</tspan></text>
<text x="906.0" y="102.0" font-size="11.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Đúng khung nhỏ, HTF chưa đổi</tspan></text>
<polyline points="886.0,136.4 1061.5,275.0" fill="none" stroke="#9CA3AF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>
<line x1="890.5" y1="157.4" x2="1061.5" y2="157.4" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
<text x="1061.5" y="152.4" font-size="11" fill="#DC2626" text-anchor="end"><tspan>đỉnh HTF</tspan></text>
<line x1="919.8" y1="212.0" x2="1061.5" y2="212.0" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="1061.5" y="226.0" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh nhỏ</tspan></text>
<polyline points="886.0,233.0 919.8,212.0 949.0,241.4 980.5,199.4 998.5,216.2 1025.5,203.6 1052.5,220.4" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="876.0" y="332.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Phá external của khung nhỏ, nhưng</tspan></text>
<text x="876.0" y="347.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>đỉnh của khung lớn (đường đỏ) còn</tspan></text>
<text x="876.0" y="363.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>nguyên. Không đổi bối cảnh lớn.</tspan></text>
</svg>
