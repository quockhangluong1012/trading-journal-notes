<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>30 lệnh chưa nói được gì: khoảng tin cậy 95% khi quan sát 60%</title>
<desc>Biểu đồ khoảng tin cậy: 12/20 từ 39 đến 78 phần trăm, 18/30 từ 42 đến 75, 60/100 từ 50 đến 69, 120/200 từ 53 đến 67. Chỉ 60/100 trở đi mới loại trừ 50 phần trăm.</desc>
