<line x1="455.7420802299713" y1="255" x2="455.7420802299713" y2="269" stroke="#1D9E75" stroke-width="2"/>
<circle cx="408.1818181818182" cy="262" r="5" fill="#1F2937" stroke="none" stroke-width="1"/>
<text x="612" y="261" font-size="12" fill="#1D9E75" font-weight="700">[53%, 67%]</text>
<text x="612" y="276" font-size="10.5" fill="#1D9E75">loại trừ 50%</text>
<rect x="24" y="346" width="712" height="44" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="38" y="372" font-size="11" fill="#92400E" font-weight="700">Chỉ 60/100 “vừa đủ” loại trừ 50%. Các con số 20–30 hay 30–50 mẫu chỉ đủ phát hiện lỗi vận hành, chưa đủ chứng minh edge.</text>
