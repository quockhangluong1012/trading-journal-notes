<circle cx="408.1818181818182" cy="216" r="5" fill="#1F2937" stroke="none" stroke-width="1"/>
<text x="612" y="215" font-size="12" fill="#1D9E75" font-weight="700">[50%, 69%]</text>
<text x="612" y="230" font-size="10.5" fill="#1D9E75">loại trừ 50%</text>
<text x="100" y="266" font-size="13" fill="#1F2937" text-anchor="end" font-weight="700">120/200</text>
<text x="112" y="266" font-size="10.5" fill="#6B7280">n = 200</text>
<line x1="357.880318909182" y1="262" x2="455.7420802299713" y2="262" stroke="#1D9E75" stroke-width="5"/>
