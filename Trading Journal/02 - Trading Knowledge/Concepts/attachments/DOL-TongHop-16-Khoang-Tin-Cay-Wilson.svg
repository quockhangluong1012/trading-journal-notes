<text x="480.90909090909093" y="314" font-size="10.5" fill="#6B7280" text-anchor="middle">70%</text>
<line x1="553.6363636363636" y1="100" x2="553.6363636363636" y2="296" stroke="#E5E7EB" stroke-width="1"/>
<text x="553.6363636363636" y="314" font-size="10.5" fill="#6B7280" text-anchor="middle">80%</text>
<line x1="335.4545454545455" y1="96" x2="335.4545454545455" y2="300" stroke="#1F2937" stroke-width="1.3" stroke-dasharray="4 3"/>
