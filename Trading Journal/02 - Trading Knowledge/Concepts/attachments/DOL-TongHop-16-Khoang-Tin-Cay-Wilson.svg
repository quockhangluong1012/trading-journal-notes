<rect x="0" y="0" width="760" height="400" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">30 lệnh chưa nói được gì: khoảng tin cậy 95% khi quan sát 60%</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Khoảng tin cậy Wilson; baseline giả định = 50%. Phải loại trừ được baseline mới gọi là có dấu hiệu</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">edge.</text>
