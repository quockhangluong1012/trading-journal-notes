<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Đồng xu cũng vẽ ra "chart" — vì sao một framework phải thắng baseline, không chỉ "khớp" với chart</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">60 lần tung đồng xu: Ngửa = +1, Sấp = −1. Không có tổ chức, không có thuật toán, không có liquidity. Hãy nhìn xem nó "giống" gì.</text>
