<text x="920.0" y="124.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="end">đỏ = "swing high", xanh = "swing low" (pivot 3 bước)</text>
<rect x="26.0" y="388.0" width="456.0" height="66.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
<text x="40.0" y="410.0" font-size="11.8" font-weight="700" fill="#15803D" text-anchor="start">Điều đúng</text>
<text x="40.0" y="427.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Một framework KHÔNG cần dự đoán mọi chuyển động</text>
<text x="40.0" y="444.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">để hữu ích. Trading là xác suất; thua là bình thường.</text>
<rect x="498.0" y="388.0" width="456.0" height="66.0" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/>
<text x="512.0" y="410.0" font-size="11.8" font-weight="700" fill="#6D28D9" text-anchor="start">Nhưng</text>
<text x="512.0" y="427.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Nếu IPDA claim một mẫu hình là có HỆ THỐNG, mẫu hình đó</text>
<text x="512.0" y="444.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">phải xảy ra nhiều hơn trong dữ liệu thật so với đồng xu.</text>
