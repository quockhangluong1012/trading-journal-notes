<text x="40.0" y="475.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hệ quả: “Đã có CISD chưa?” luôn phải kèm “trên khung nào?”. Một CISD M5 là bằng chứng của M5. Nó có thể là một phần trong quá trình H1 tạo CISD — hoặc</text>
<text x="40.0" y="492.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không. Đừng gán nhãn H1 khi nến H1 còn chưa đóng.</text>
