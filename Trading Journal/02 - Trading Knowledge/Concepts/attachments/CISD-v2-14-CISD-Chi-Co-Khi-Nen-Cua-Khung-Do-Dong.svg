<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD chỉ “có” khi nến của CHÍNH khung đó đóng cửa</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mười hai nến M5 tạo thành một nến H1. M5 có thể đã CISD từ lâu trong khi nến H1 vẫn đang chạy. Trên H1, chưa có gì được xác nhận</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">cho tới khi nến H1 đóng.</text>
