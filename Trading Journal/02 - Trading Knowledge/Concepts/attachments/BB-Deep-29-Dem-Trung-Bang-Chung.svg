<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba nhãn bên trái đều được sinh ra bởi cùng 3–4 cây nến. Cộng chúng thành “3 confluence” là tự thổi phồng độ tin cậy.</text>
