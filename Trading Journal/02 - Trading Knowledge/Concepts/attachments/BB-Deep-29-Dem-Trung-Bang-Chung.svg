<text x="588.0" y="95.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">Bằng chứng ĐỘC LẬP hơn (khác nguồn)</text>
<text x="590.0" y="112.0" font-size="11.5" font-weight="800" fill="#15803D" text-anchor="start">Khác khung</text>
<text x="590.0" y="129.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Vị trí trong range D1 / HTF POI — được xác định từ dữ liệu khác,</text>
<text x="590.0" y="144.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">thời điểm khác.</text>
<text x="590.0" y="167.9" font-size="11.5" font-weight="800" fill="#15803D" text-anchor="start">Khác thời gian</text>
<text x="590.0" y="184.9" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Killzone / macro time — thông tin từ đồng hồ, không từ hình nến.</text>
<text x="590.0" y="208.4" font-size="11.5" font-weight="800" fill="#15803D" text-anchor="start">Khác sự kiện</text>
<text x="590.0" y="225.4" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Pool HTF bị lấy trước đó (ví dụ PDL) — một sự kiện tách biệt với</text>
<text x="590.0" y="240.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">cú phá H1.</text>
<text x="590.0" y="264.3" font-size="11.5" font-weight="800" fill="#15803D" text-anchor="start">Khác thị trường</text>
<text x="590.0" y="281.3" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">SMT với tài sản tương quan — nếu dùng, phải định nghĩa trước.</text>
<text x="590.0" y="304.7" font-size="11.5" font-weight="800" fill="#15803D" text-anchor="start">Cần đo</text>
<text x="590.0" y="321.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Ngay cả các bằng chứng “độc lập” cũng có thể tương quan với</text>
<text x="590.0" y="337.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">nhau. Chỉ backtest với các nhóm tách riêng mới cho biết phần</text>
<text x="590.0" y="352.6" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">đóng góp thật.</text>
<rect x="20.0" y="486.0" width="940.0" height="49.0" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.2"/>
<rect x="20.0" y="486.0" width="4.0" height="49.0" rx="2" fill="#334155"/>
<text x="32.0" y="507.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Quy tắc: trong checklist, MSS + displacement + FVG của CÙNG một nhịp được tính là MỘT nhóm bằng chứng (“chất lượng cú phá”), chấm bằng một điểm disp_score —</text>
<text x="32.0" y="522.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">không cộng ba lần.</text>
