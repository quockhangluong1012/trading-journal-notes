<text x="655.0" y="455.6" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi về SSL. Một ví dụ đối xứng — không phải bằng chứng</text>
<text x="655.0" y="470.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">thống kê.</text>
