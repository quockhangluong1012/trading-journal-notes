<svg viewBox="0 0 1000 530" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="528" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">AMD và Draw on Liquidity: hướng của cú lệch so với hướng của đích</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trong hình mẫu PO3, cú lệch (M) đi NGƯỢC hướng đích (DOL). Nếu cú chạy đầu tiên đi CÙNG hướng đích và lấy luôn pool ở đó, có thể đó</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">không phải Manipulation mà chính là chuyến đi về đích.</text>
<rect x="926.2" y="22.0" width="45.8" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="949.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DOL</text>
<rect x="28.0" y="100.0" width="306.0" height="330.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.1"/>
<circle cx="46.0" cy="119.0" r="9" fill="#15803D"/>
<text x="46.0" y="123.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="62.0" y="123.0" font-size="12.4" font-weight="700" fill="#15803D" text-anchor="start">Hình mẫu: lệch NGƯỢC đích</text>
<rect x="40.0" y="134.0" width="282.0" height="170.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="40.0" y1="167.2" x2="322.0" y2="167.2" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="42.0" y="163.2" font-size="9.5" font-weight="600" fill="#B91C1C" text-anchor="start">BSL</text>
<line x1="40.0" y1="270.8" x2="322.0" y2="270.8" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="42.0" y="283.8" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="start">SSL</text>
<rect x="40.0" y="222.3" width="107.7" height="20.1" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="320.0" y="157.1" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="end">đích</text>
<path d="M40.0,234.0 L65.6,224.0 L91.3,240.7 L116.9,225.7 L142.5,239.1 L168.2,260.8 L193.8,274.2 L219.5,247.4 L245.1,220.7 L270.7,200.6 L296.4,180.5 L322.0,163.8" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="322.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">DOL là BSL phía trên. Giá lệch xuống quét SSL,</text>
<text x="40.0" y="337.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">thua, rồi chạy lên. Cú lệch đóng vai trò “lấy lệnh</text>
<text x="40.0" y="352.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">bán” trước chuyến đi.</text>
<rect x="346.0" y="100.0" width="306.0" height="330.0" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.1"/>
<circle cx="364.0" cy="119.0" r="9" fill="#B45309"/>
<text x="364.0" y="123.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="380.0" y="123.0" font-size="12.4" font-weight="700" fill="#B45309" text-anchor="start">Cú chạy đầu tiên CÙNG hướng đích</text>
<rect x="358.0" y="134.0" width="282.0" height="170.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="358.0" y1="167.2" x2="640.0" y2="167.2" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="360.0" y="163.2" font-size="9.5" font-weight="600" fill="#B91C1C" text-anchor="start">BSL</text>
<line x1="358.0" y1="270.8" x2="640.0" y2="270.8" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="360.0" y="283.8" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="start">SSL</text>
<rect x="358.0" y="222.3" width="107.7" height="20.1" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M358.0,234.0 L383.6,224.0 L409.3,240.7 L434.9,225.7 L460.5,239.1 L486.2,214.0 L511.8,190.6 L537.5,170.5 L563.1,160.5 L588.7,173.9 L614.4,183.9 L640.0,190.6" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="322.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá chạy thẳng lên lấy BSL. Đây có thể là D luôn</text>
<text x="358.0" y="337.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">(ngày không có M), hoặc là cú vượt đỉnh của một</text>
<text x="358.0" y="352.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">bearish AMD. Đích đã được giao → hỏi lại: đích</text>
<text x="358.0" y="367.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">MỚI ở đâu?</text>
<rect x="664.0" y="100.0" width="306.0" height="330.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="682.0" cy="119.0" r="9" fill="#4338CA"/>
<text x="682.0" y="123.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="698.0" y="123.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">DOL đổi giữa chừng</text>
<rect x="676.0" y="134.0" width="282.0" height="170.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="676.0" y1="167.2" x2="958.0" y2="167.2" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="678.0" y="163.2" font-size="9.5" font-weight="600" fill="#B91C1C" text-anchor="start">BSL</text>
<line x1="676.0" y1="270.8" x2="958.0" y2="270.8" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="678.0" y="283.8" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="start">SSL</text>
<rect x="676.0" y="222.3" width="107.7" height="20.1" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="881.1" cy="163.8" r="5" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
<text x="873.1" y="157.1" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="end">đã giao</text>
<path d="M676.0,234.0 L701.6,224.0 L727.3,240.7 L752.9,225.7 L778.5,239.1 L804.2,257.5 L829.8,227.4 L855.5,197.3 L881.1,163.8 L906.7,183.9 L932.4,214.0 L958.0,240.7" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="322.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">BSL đã bị lấy → không còn là đích. Pool chưa bị</text>
<text x="676.0" y="337.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">lấy gần nhất bây giờ là SSL phía dưới. Bám đích cũ</text>
<text x="676.0" y="352.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">sau khi nó đã được giao là lỗi phổ biến.</text>
<rect x="28.0" y="442.0" width="944.0" height="48.6" rx="8" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1"/>
<text x="38.0" y="464.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Câu hỏi bắt buộc trước mỗi phiên: “Đích của hôm nay (và của tuần) ở đâu? Phía nào của vùng tích lũy là NGƯỢC đích?” Chỉ cú lệch về phía ngược đích mới</text>
<text x="38.0" y="480.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hợp vai Manipulation trong PO3. [BACKTEST REQUIRED] Việc chọn đích đúng là bài toán riêng (xem note DOL) — AMD không giải quyết nó thay bạn.</text>
</svg>
