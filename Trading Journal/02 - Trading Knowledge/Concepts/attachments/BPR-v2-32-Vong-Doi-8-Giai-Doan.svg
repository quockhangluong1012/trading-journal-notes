<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah0F7A5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7A5A"/></marker><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ahB45309" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahB91C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="884.8" y="22" width="87.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LIFECYCLE</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vòng đời của một BPR: tám giai đoạn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Từ lúc FVG đầu tiên xuất hiện cho tới lúc ta quyết định BPR còn đáng theo dõi hay không. Giai đoạn 7 có bốn ngã rẽ.</text>
<rect x="28.0" y="86.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="48.0" cy="108.0" r="11" fill="#1F2937"/>
<text x="48.0" y="112.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="66.0" y="113.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">FVG thứ nhất hình thành</text>
<text x="40.0" y="148.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Chỉ là một FVG.</text>
<rect x="269.0" y="86.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="289.0" cy="108.0" r="11" fill="#1F2937"/>
<text x="289.0" y="112.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="307.0" y="113.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">FVG ngược chiều hình thành</text>
<text x="281.0" y="148.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Leg ngược chạy nhanh qua cùng dải</text>
<text x="281.0" y="163.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">giá.</text>
<rect x="510.0" y="86.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="530.0" cy="108.0" r="11" fill="#1F2937"/>
<text x="530.0" y="112.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="548.0" y="113.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Hai FVG chồng nhau</text>
<text x="522.0" y="148.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Ghi 4 mức giá, kiểm tra phần chung.</text>
<rect x="751.0" y="86.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="771.0" cy="108.0" r="11" fill="#7C3AED"/>
<text x="771.0" y="112.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="789.0" y="113.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">BPR gọi tên được</text>
<text x="763.0" y="148.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Giá lúc này đã rời khỏi vùng.</text>
<rect x="751.0" y="228.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="771.0" cy="250.0" r="11" fill="#1F2937"/>
<text x="771.0" y="254.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="789.0" y="255.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Giá đi xa khỏi BPR</text>
<text x="763.0" y="290.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">BPR còn mới (fresh).</text>
<rect x="510.0" y="228.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="530.0" cy="250.0" r="11" fill="#1F2937"/>
<text x="530.0" y="254.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="548.0" y="255.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Giá quay lại BPR</text>
<text x="522.0" y="290.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Lần chạm đầu tiên.</text>
<rect x="269.0" y="228.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="289.0" cy="250.0" r="11" fill="#7C3AED"/>
<text x="289.0" y="254.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="307.0" y="255.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">Giá cư xử thế nào?</text>
<text x="281.0" y="290.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Xem bốn ngã rẽ bên dưới.</text>
<rect x="28.0" y="228.0" width="220.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="48.0" cy="250.0" r="11" fill="#1F2937"/>
<text x="48.0" y="254.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="66.0" y="255.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Đánh giá lại</text>
<text x="40.0" y="290.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Còn relevant? Còn dùng được?</text>
<line x1="250.0" y1="132.0" x2="267.0" y2="132.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="491.0" y1="132.0" x2="508.0" y2="132.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="732.0" y1="132.0" x2="749.0" y2="132.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="861.0" y1="180.0" x2="861.0" y2="226.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="749.0" y1="274.0" x2="732.0" y2="274.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="508.0" y1="274.0" x2="491.0" y2="274.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="267.0" y1="274.0" x2="250.0" y2="274.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="28.0" y="360.0" width="220.0" height="44.0" rx="22" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.4"/>
<text x="138.0" y="387.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="middle">Phản ứng từ mép gần</text>
<line x1="379.0" y1="322.0" x2="138.0" y2="358.0" stroke="#0F7A5A" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ah0F7A5A)"/>
<rect x="269.0" y="360.0" width="220.0" height="44.0" rx="22" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.4"/>
<text x="379.0" y="387.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="middle">Vào sâu rồi phản ứng</text>
<line x1="379.0" y1="322.0" x2="379.0" y2="358.0" stroke="#0F7A5A" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ah0F7A5A)"/>
<rect x="510.0" y="360.0" width="220.0" height="44.0" rx="22" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
<text x="620.0" y="387.0" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Xuyên mép xa rồi lấy lại</text>
<line x1="379.0" y1="322.0" x2="620.0" y2="358.0" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ahB45309)"/>
<rect x="751.0" y="360.0" width="220.0" height="44.0" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4"/>
<text x="861.0" y="387.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Đóng vượt mép xa và đứng được</text>
<line x1="379.0" y1="322.0" x2="861.0" y2="358.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ahB91C1C)"/>
<rect x="28.0" y="420.0" width="944.0" height="76.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="40.0" y="444.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">Ở giai đoạn 8 hỏi ba câu</text>
<text x="40.0" y="464.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Bối cảnh D1/H1 có còn như lúc BPR hình thành? Vùng đã bị chạm bao nhiêu lần và sâu tới đâu? Có sự kiện mới nào (MSS, sweep, BPR mới) làm vùng này mất ý nghĩa?</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Không có luật “chạm một lần là hết hiệu lực”. Nhưng mỗi lần chạm phải được ghi lại — đó là dữ liệu để biết BPR của bạn thường sống bao lâu.</text>
</svg>
