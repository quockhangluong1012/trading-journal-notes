" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Cho bé 5 tuổi: ba con búp bê lồng nhau — D1 chứa H1, H1 chứa M5</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Con búp bê nhỏ quay mặt sang trái không làm con búp bê lớn quay theo. Một BOS ở M5 không phải là BOS ở D1.</tspan></text>
<rect x="24.0" y="92.0" width="852.0" height="290.0" rx="16" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.6"/>
<text x="40.0" y="116.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">D1 — búp bê lớn: BỐI CẢNH (&quot;tôi đang ở đâu?&quot;)</tspan></text>
<polyline points="56.0,329.4 121.6,247.0 154.4,275.8 226.6,168.7 265.9,214.0" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="239.1" y="168.7" font-size="11.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">cấu trúc lớn: TĂNG</tspan></text>
<rect x="420.0" y="128.0" width="440.0" height="238.0" rx="14" fill="#FEF7E6" stroke="#B45309" stroke-width="1.6"/>
<text x="434.0" y="150.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">H1 — búp bê vừa: SETUP (&quot;đang làm gì?&quot;)</tspan></text>
<polyline points="450.0,193.7 487.6,239.6 506.4,223.2 553.4,272.4 572.2,256.0 619.2,308.5" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="453.8" y="288.8" font-size="11" fill="#B45309" text-anchor="start"><tspan font-weight="700">nhịp lùi: GIẢM nhỏ</tspan></text>
<rect x="664.0" y="164.0" width="184.0" height="186.0" rx="12" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.6"/>
<text x="676.0" y="186.0" font-size="12.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">M5 — búp bê nhỏ:</tspan></text>
<text x="676.0" y="202.0" font-size="12" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">THỰC THI (&quot;có cò chưa?&quot;)</tspan></text>
<polyline points="692.0,255.4 724.0,304.4 736.8,284.8 749.6,294.6 775.2,255.4 788.0,267.2 814.9,235.8" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="753.4" y="237.8" font-size="11" fill="#1D9E75" text-anchor="end"><tspan font-weight="700">M5: TĂNG</tspan></text>
<rect x="24.0" y="396.0" width="852.0" height="62.0" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.0"/>
<rect x="24.0" y="396.0" width="5.0" height="62.0" rx="2" fill="#7C3AED"/>
<text x="38.0" y="416.0" font-size="13" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">Ba câu cùng đúng một lúc</tspan></text>
<text x="38.0" y="435.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>D1 đang tăng · H1 đang lùi (giảm nhỏ) · M5 vừa đảo lên. Không câu nào &quot;sai&quot;. Chỉ sai khi lấy câu của búp bê nhỏ để nói về búp bê lớn.</tspan></text>
</svg>
