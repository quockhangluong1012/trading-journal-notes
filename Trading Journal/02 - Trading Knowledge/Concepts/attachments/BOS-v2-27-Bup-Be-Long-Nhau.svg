<svg viewBox="0 0 900 470" width="900" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cho bé 5 tuổi: ba con búp bê lồng nhau — D1 chứa H1, H1 chứa M5</title>
<desc>Cho bé 5 tuổi: ba con búp bê lồng nhau — D1 chứa H1, H1 chứa M5. Con búp bê nhỏ quay mặt sang trái không làm con búp bê lớn quay theo. Một BOS ở M5 không phải là BOS ở D1.</desc>
