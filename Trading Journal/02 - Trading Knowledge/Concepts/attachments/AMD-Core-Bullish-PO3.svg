<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
  <text x="24" y="30" font-size="18" font-weight="700" fill="currentColor">Bullish PO3 — quét SSL rồi phân phối lên BSL</text>
  <text x="24" y="50" font-size="12.5" fill="var(--muted)">Thứ tự nhân quả: range tạo pool → Judas lấy pool dưới → reclaim + displacement → expansion về pool trên.</text>
  <line x1="30" y1="200" x2="870" y2="200" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="786" y="194" font-size="11" fill="var(--muted)">Daily Open</text>
  <rect x="40" y="170" width="260" height="62" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="40" y1="235" x2="400" y2="235" stroke="var(--error)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="44" y="249" font-size="11" fill="var(--error)">SSL (stop phe Long + sell-stop breakout)</text>
  <path d="M40,200 L85,190 L130,208 L175,188 L220,205 L265,192 L300,200 L350,248 L385,215 L415,198 L450,180 L500,150 L540,160 L600,125 L650,132 L710,100 L770,108 L830,80 L865,84" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="120" cy="150" r="9" fill="var(--accent)"/>
  <text x="116" y="154" font-size="11" font-weight="700" fill="var(--surface)">1</text>
  <text x="136" y="140" font-size="11.5" fill="var(--accent)">Accumulation: đi ngang quanh open</text>
  <circle cx="350" cy="248" r="9" fill="var(--warning)"/>
  <text x="346" y="252" font-size="11" font-weight="700" fill="var(--surface)">2</text>
  <text x="300" y="276" font-size="11.5" font-weight="700" fill="var(--warning)">Judas XUỐNG quét SSL</text>
  <circle cx="415" cy="198" r="9" fill="var(--success)"/>
  <text x="411" y="202" font-size="11" font-weight="700" fill="var(--surface)">3</text>
  <text x="430" y="222" font-size="11.5" fill="var(--success)">Reclaim trên đáy range</text>
  <circle cx="500" cy="150" r="9" fill="var(--success)"/>
  <text x="496" y="154" font-size="11" font-weight="700" fill="var(--surface)">4</text>
  <text x="516" y="142" font-size="11.5" fill="var(--success)">MSS + displacement LÊN</text>
  <line x1="640" y1="84" x2="870" y2="84" stroke="var(--success)" stroke-width="1.1" stroke-dasharray="5 4"/>
  <circle cx="770" cy="108" r="9" fill="var(--success)"/>
  <text x="766" y="112" font-size="11" font-weight="700" fill="var(--surface)">5</text>
  <text x="700" y="76" font-size="11" fill="var(--success)">Target: BSL / PDH</text>
  <text x="40" y="310" font-size="12" fill="var(--fg)">Entry: FVG/OB nhịp phân phối · Stop: dưới đáy Judas · Target: BSL phía trên.</text>
  <text x="40" y="332" font-size="12" fill="var(--error)">Vô hiệu nếu: phá range và GIỮ (đóng H1 ngoài + pullback nông không reclaim) — đó là trend day, xem §38.</text>
  <text x="40" y="354" font-size="12" fill="var(--muted)">Cơ chế: cú quét biến stop thành lệnh bán thị trường — chính là counterparty để lệnh mua lớn được khớp (chi tiết §8).</text>
</svg>
