<svg viewBox="0 0 980 540" width="980" height="540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">IPDA và Dealing Range — dùng một khung giá để tổ chức câu hỏi "giá đang ở đâu, có thể đi đâu"</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Range KHÔNG cho hướng. Range cho VỊ TRÍ (premium/discount) và danh sách mục tiêu (internal / external).</text>
<rect x="26.0" y="74.0" width="600.0" height="446.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="60.0" y="130.0" width="520.0" height="170.0" rx="0" fill="#FEE2E2" stroke="none" stroke-width="0" opacity="0.5"/>
<rect x="60.0" y="300.0" width="520.0" height="170.0" rx="0" fill="#DCFCE7" stroke="none" stroke-width="0" opacity="0.5"/>
<line x1="60.0" y1="130.0" x2="580.0" y2="130.0" stroke="#B91C1C" stroke-width="2"/>
<line x1="60.0" y1="470.0" x2="580.0" y2="470.0" stroke="#15803D" stroke-width="2"/>
<line x1="60.0" y1="300.0" x2="580.0" y2="300.0" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="66.0" y="122.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">Range High — trên đó: BSL (external)</text>
<text x="300.0" y="490.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="start">Range Low — dưới đó: SSL (external)</text>
<text x="574.0" y="294.0" font-size="11" font-weight="700" fill="#334155" text-anchor="end">EQ 50%</text>
<text x="66.0" y="154.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">PREMIUM</text>
<text x="574.0" y="460.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="end">DISCOUNT</text>
<rect x="250.0" y="330.0" width="90.0" height="30.0" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
<text x="346.0" y="350.0" font-size="11" font-weight="700" fill="#0F766E" text-anchor="start">FVG (internal)</text>
<rect x="400.0" y="210.0" width="80.0" height="26.0" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
<text x="486.0" y="228.0" font-size="11" font-weight="700" fill="#0F766E" text-anchor="start">FVG</text>
<path d="M80.0,440.0 L130.0,455.0 L170.0,478.0 L200.0,430.0 L240.0,380.0 L270.0,355.0 L300.0,365.0 L330.0,320.0 L380.0,280.0 L420.0,230.0 L440.0,236.0 L470.0,190.0 L520.0,150.0 L548.0,122.0 L566.0,140.0" stroke="#1F2937" stroke-width="2.2" fill="none"/>
<circle cx="170.0" cy="478.0" r="6" fill="#15803D" stroke="none" stroke-width="1.2"/>
<text x="60.0" y="500.0" font-size="10.5" font-weight="600" fill="#15803D" text-anchor="start">lấy SSL rồi quay lại</text>
<circle cx="548.0" cy="122.0" r="6" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<text x="516.0" y="108.0" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start">chạm BSL</text>
<text x="40.0" y="98.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Một range ở một khung — ví dụ minh họa</text>
<rect x="640.0" y="74.0" width="314.0" height="446.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="654.0" y="98.0" font-size="11.6" font-weight="700" fill="#1F2937" text-anchor="start">Câu hỏi range giúp đặt ra</text>
<text x="654.0" y="114.8" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">1. Giá đang ở premium hay discount</text>
<text x="654.0" y="131.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">   của range NÀO (khung nào)?</text>
<text x="654.0" y="148.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">2. Bên ngoài range: thanh khoản</text>
<text x="654.0" y="165.3" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">   external nằm ở đâu?</text>
<text x="654.0" y="182.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">3. Bên trong: vùng internal (FVG,</text>
<text x="654.0" y="198.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">   OB) nào chưa được giao dịch lại?</text>
<text x="654.0" y="215.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">4. Phía nào đã bị lấy gần đây?</text>
<text x="654.0" y="232.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="654.0" y="249.4" font-size="11.6" font-weight="700" fill="#B45309" text-anchor="start">ICT diễn giải (giả thuyết):</text>
<text x="654.0" y="266.2" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Lấy external → quay về internal;</text>
<text x="654.0" y="283.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">lấp internal → hướng ra external</text>
<text x="654.0" y="299.8" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">phía đối diện. ("IRL ↔ ERL")</text>
<text x="654.0" y="316.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="654.0" y="333.5" font-size="11.6" font-weight="700" fill="#B91C1C" text-anchor="start">Điều KHÔNG suy ra được:</text>
<text x="654.0" y="350.3" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Discount ≠ "sẽ tăng".</text>
<text x="654.0" y="367.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Cùng một giá có thể là premium</text>
<text x="654.0" y="383.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  của range nhỏ và discount của</text>
<text x="654.0" y="400.8" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  range lớn (xem note 57 — Dealing Range).</text>
<text x="654.0" y="417.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• EQ không có sức hút vật lý.</text>
</svg>
