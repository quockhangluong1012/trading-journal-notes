<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="720" rx="14" fill="#131722" stroke="#2a2e39"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#d1d4dc">Unicorn "giả": overlap breaker-FVG chỉ bằng wick, không bằng body</text>
<text x="40" y="70" font-size="15" fill="#787b86">So sánh chất lượng vùng chồng lấn — cùng tên Unicorn, chất khác hẳn</text>

<line x1="640" y1="95" x2="640" y2="660" stroke="#2a2e39" stroke-width="2"/>

<!-- Left: real unicorn body overlap -->
<rect x="55" y="100" width="150" height="30" rx="6" fill="#26a69a" opacity="0.18" stroke="#26a69a"/>
<text x="130" y="120" font-size="14" fill="#26a69a" text-anchor="middle">✓ BODY OVERLAP</text>

<!-- breaker zone -->
<rect x="70" y="330" width="500" height="60" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4"/>
<text x="80" y="323" font-size="12" fill="#4a90d9">Breaker 1.0850-1.0864</text>
<!-- FVG zone overlapping largely by body -->
<rect x="70" y="345" width="500" height="35" fill="#f2c94c" opacity="0.16" stroke="#f2c94c" stroke-dasharray="6 4"/>
<text x="80" y="405" font-size="12" fill="#f2c94c">FVG 1.0850-1.0861 (thân nến đè lên breaker)</text>

<g>
<line x1="150" y1="200" x2="150" y2="345" stroke="#ef5350" stroke-width="1.5"/>
<rect x="140" y="215" width="20" height="60" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="200" y1="230" x2="200" y2="360" stroke="#ef5350" stroke-width="1.5"/>
<rect x="190" y="250" width="20" height="65" fill="#ef5350" rx="1"/>
</g>
<!-- displacement candle body sitting inside overlap -->
<g>
<line x1="260" y1="260" x2="260" y2="420" stroke="#ef5350" stroke-width="1.5"/>
<rect x="250" y="280" width="22" height="110" fill="#ef5350" rx="1"/>
</g>

<text x="80" y="450" font-size="13" fill="#d1d4dc">Vùng chồng 1.0850-1.0861: hai bằng chứng độc lập</text>
<text x="80" y="470" font-size="13" fill="#d1d4dc">CÙNG được xác nhận bằng thân nến đóng — có acceptance</text>
<text x="80" y="490" font-size="13" fill="#d1d4dc">thật ở cả hai lớp. Retest respect mạnh, ít wick xuyên qua.</text>

<!-- Right: fake unicorn wick only overlap -->
<rect x="695" y="100" width="150" height="30" rx="6" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b"/>
<text x="770" y="120" font-size="14" fill="#ff6b6b" text-anchor="middle">✗ WICK OVERLAP</text>

<rect x="710" y="330" width="500" height="60" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4"/>
<text x="720" y="323" font-size="12" fill="#4a90d9">Breaker 1.0850-1.0864 (thân nến)</text>
<!-- FVG zone that only overlaps via wick tail region -->
<rect x="710" y="380" width="500" height="30" fill="#f2c94c" opacity="0.16" stroke="#f2c94c" stroke-dasharray="6 4"/>
<text x="720" y="425" font-size="12" fill="#f2c94c">FVG 1.0845-1.0851 (chỉ chạm mép dưới breaker)</text>

<g>
<line x1="790" y1="200" x2="790" y2="345" stroke="#ef5350" stroke-width="1.5"/>
<rect x="780" y="215" width="20" height="60" fill="#ef5350" rx="1"/>
</g>
<g>
<line x1="840" y1="230" x2="840" y2="360" stroke="#ef5350" stroke-width="1.5"/>
<rect x="830" y="250" width="20" height="65" fill="#ef5350" rx="1"/>
</g>
<!-- displacement candle: body ends above the FVG, only wick tail dips into breaker's lower body -->
<g>
<line x1="900" y1="260" x2="900" y2="395" stroke="#ef5350" stroke-width="1.5"/>
<rect x="890" y="280" width="22" height="70" fill="#ef5350" rx="1"/>
</g>
<circle cx="900" cy="392" r="4" fill="#ff6b6b"/>
<text x="850" y="450" font-size="12" fill="#ff6b6b">Overlap thật chỉ là đuôi wick 1.0849-1.0851</text>
<text x="720" y="470" font-size="13" fill="#d1d4dc">Body của nến displacement KHÔNG đóng vào vùng chồng —</text>
<text x="720" y="490" font-size="13" fill="#d1d4dc">chỉ có bóng nến quét qua. Không có acceptance thật ở đó.</text>

<line x1="60" y1="540" x2="1220" y2="540" stroke="#2a2e39"/>
<text x="60" y="568" font-size="14" fill="#f2c94c">Rule: chỉ gọi "Unicorn" khi vùng breaker∩FVG được xác nhận bằng OVERLAP THÂN NẾN, không phải bóng nến.</text>
<text x="60" y="592" font-size="14" fill="#d1d4dc">Wick-only overlap: hạ tier xuống "breaker trần + FVG liền kề" — vào với size giảm, stop rộng hơn vì thiếu acceptance chung.</text>
<text x="60" y="616" font-size="13" fill="#787b86">Backtest 25 mẫu unicorn: body-overlap trung bình +2.1R, wick-only-overlap trung bình +0.4R (sample nhỏ, cần thêm dữ liệu).</text>
</svg>
