<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Nhiều DOL — nhiều con đường: framework là BẢN ĐỒ, không phải GPS</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một điểm xuất phát, giá có thể đi theo nhiều đường. Chart quá khứ chỉ cho thấy MỘT đường đã xảy ra.</text>
