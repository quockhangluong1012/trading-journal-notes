<rect x="26.0" y="468.0" width="928.0" height="116.0" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.3"/>
<text x="40.0" y="492.0" font-size="11.8" font-weight="700" fill="#6D28D9" text-anchor="start">GPS vs BẢN ĐỒ</text>
<text x="40.0" y="509.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• GPS nói: "rẽ phải sau 200m, tới nơi lúc 10:42" — một con đường, một thời điểm. IPDA KHÔNG làm được điều này.</text>
<text x="40.0" y="526.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Bản đồ nói: "có ba thị trấn quanh đây; thị trấn B gần nhất" — liệt kê điểm đến có thể. Đây là thứ framework làm được.</text>
<text x="40.0" y="543.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Khi bạn chọn DOL, bạn đang đặt cược xác suất có điều kiện: P(chạm B trước đáy | bối cảnh). Không có "chắc chắn".</text>
<text x="40.0" y="560.4" font-size="11.8" font-weight="600" fill="#6D28D9" text-anchor="start">• Chuyện "giá đã tới B" sau khi xảy ra KHÔNG chứng minh B "là" DOL — random walk cũng chạm mức gần với xác suất cao (xem IPDA-Sim-02).</text>
