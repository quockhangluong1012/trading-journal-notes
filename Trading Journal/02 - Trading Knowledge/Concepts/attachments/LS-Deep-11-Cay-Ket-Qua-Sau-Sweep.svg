<svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="680" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Sau khi liquidity bị chạm tới: cây kết quả — sweep là một PHÉP THỬ, không phải một tín hiệu</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một cú xuyên mức có thể đi theo sáu nhánh. Nhánh nào xảy ra phụ thuộc vào dòng lệnh tới SAU khi stop đã khớp (xem LS-Sim-03),</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">và vào bối cảnh đo được TRƯỚC sự kiện. Ô PENDING là trạng thái hợp lệ: chưa phân xử = chưa có gì để trade.</text>
<rect x="370.0" y="96.0" width="240.0" height="54.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="490.0" y="118.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Giá vượt mức L (penetration)</text>
<text x="490.0" y="135.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="middle">high &gt; L + ε  (hoặc low &lt; L − ε)</text>
<rect x="70.0" y="186.0" width="240.0" height="60.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="190.0" y="208.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">REJECTION</text>
<text x="190.0" y="225.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">close &lt; L − δ trong k nến, chưa acceptance</text>
<rect x="370.0" y="186.0" width="240.0" height="60.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 3"/>
<text x="490.0" y="208.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">PENDING (timer k nến)</text>
<text x="490.0" y="225.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">chưa thỏa điều kiện nào</text>
<rect x="670.0" y="186.0" width="240.0" height="60.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
<text x="790.0" y="208.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">ACCEPTANCE</text>
<text x="790.0" y="225.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">≥2 close &gt; L hoặc close &gt; L + 0.5·ATR</text>
<line x1="490.0" y1="150.0" x2="190.0" y2="184.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aK)"/>
<line x1="490.0" y1="150.0" x2="790.0" y2="184.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aK)"/>
<line x1="490.0" y1="150.0" x2="490.0" y2="184.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aK)"/>
<line x1="490.0" y1="246.0" x2="490.0" y2="282.0" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#aK)"/>
<rect x="390.0" y="284.0" width="200.0" height="46.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="490.0" y="306.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">hết timer → NO-TRADE</text>
<rect x="40.0" y="350.0" width="300.0" height="64.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
<text x="52.0" y="372.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">R1 · Đảo nhanh</text>
<text x="52.0" y="389.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">MSS + displacement + FVG</text>
<text x="52.0" y="403.5" font-size="10" font-weight="400" fill="#374151" text-anchor="start">→ ứng viên setup reversal</text>
<rect x="40.0" y="426.0" width="300.0" height="64.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="52.0" y="448.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">R2 · Đảo chậm / lình xình</text>
<text x="52.0" y="465.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">không displacement trong m nến</text>
<text x="52.0" y="479.5" font-size="10" font-weight="400" fill="#374151" text-anchor="start">→ hạ cấp / bỏ</text>
<rect x="40.0" y="502.0" width="300.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="52.0" y="524.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">R3 · Rejection thất bại</text>
<text x="52.0" y="541.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">re-break + acceptance</text>
<text x="52.0" y="555.5" font-size="10" font-weight="400" fill="#374151" text-anchor="start">→ nhãn đổi thành run (T1)</text>
<line x1="190.0" y1="246.0" x2="190.0" y2="348.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#aK)"/>
<path d="M190,300 L24,300 L24,566 L38,566" stroke="#6B7280" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M24,458 L38,458" stroke="#6B7280" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="640.0" y="350.0" width="300.0" height="64.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
<text x="652.0" y="372.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">A1 · Tiếp diễn (run)</text>
<text x="652.0" y="389.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">lấy pool kế tiếp cùng phía</text>
<text x="652.0" y="403.5" font-size="10" font-weight="400" fill="#374151" text-anchor="start">→ chỉ trade theo hướng run</text>
<rect x="640.0" y="426.0" width="300.0" height="64.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="652.0" y="448.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">A2 · Mở rộng rồi dừng</text>
<text x="652.0" y="465.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">acceptance nhưng không tới</text>
<text x="652.0" y="479.5" font-size="10" font-weight="400" fill="#374151" text-anchor="start">pool kế tiếp; range mới</text>
<rect x="640.0" y="502.0" width="300.0" height="64.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="652.0" y="524.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">A3 · Không follow-through</text>
<text x="652.0" y="541.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">quay lại dưới L − δ</text>
<text x="652.0" y="555.5" font-size="10" font-weight="400" fill="#374151" text-anchor="start">→ failed breakout (E3)</text>
<line x1="790.0" y1="246.0" x2="790.0" y2="348.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#aK)"/>
<path d="M790,300 L956,300 L956,566 L942,566" stroke="#6B7280" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M956,458 L942,458" stroke="#6B7280" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="356.0" y="346.0" width="268.0" height="216.0" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="368.0" y="368.0" font-size="10.3" font-weight="700" fill="#6D28D9" text-anchor="start">Yếu tố quyết định nhánh</text>
<text x="368.0" y="387.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">• dòng lệnh ròng SAU khi stop khớp</text>
<text x="368.0" y="406.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">   (không thấy; proxy: displacement)</text>
<text x="368.0" y="425.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">• bias &amp; vị trí trong range D1 (ex-ante)</text>
<text x="368.0" y="444.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">• khoảng cách: pool đối diện vs</text>
<text x="368.0" y="463.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">   pool kế tiếp → p_null</text>
<text x="368.0" y="482.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">• chế độ biến động (ATR regime)</text>
<text x="368.0" y="501.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">• phiên / giờ / tin tức</text>
<text x="368.0" y="520.0" font-size="10.3" font-weight="400" fill="#374151" text-anchor="start">• độ sâu sổ (proxy: giờ, spread)</text>
<rect x="40.0" y="586.0" width="900.0" height="80.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="56.0" y="606.0" font-size="10.2" font-weight="700" fill="#B45309" text-anchor="start">Ba điều cần nhớ</text>
<text x="56.0" y="622.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">1. Không có "kết quả mặc định" của sweep. Reversal chỉ là MỘT nhánh; trên random walk, tỷ lệ mỗi nhánh do hình học quyết định (LS-Sim-02).</text>
<text x="56.0" y="638.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">2. Nhãn R1/R3/A1/A3 chỉ biết SAU một độ trễ; tại close của nến xuyên, phần lớn sự kiện còn PENDING (LS-Sim-05).</text>
<text x="56.0" y="654.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">3. Edge (nếu có) nằm ở việc ƯỚC LƯỢNG xác suất nhánh tốt hơn baseline bằng biến ex-ante — không nằm ở việc gọi tên nhánh sau khi nó xảy ra.</text>
</svg>