<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="718.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cây quyết định: Valid CHoCH · Weak CHoCH · Không phải CHoCH</text>
<rect x="863.9" y="23.0" width="108.1" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="917.9" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">DECISION TREE</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đọc từ trên xuống. Mỗi câu hỏi chỉ dùng thông tin đã có tại lúc nến đóng cửa. Các ô xám ở bên phải là chỗ “dừng lại”.</text>
