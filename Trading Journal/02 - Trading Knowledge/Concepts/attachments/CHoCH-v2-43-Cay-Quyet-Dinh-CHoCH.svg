<text x="680.0" y="535.5" font-size="11.3" font-weight="400" fill="#374151" data-bx="679.0,965.0">Không → VALID nhưng KHÔNG hành động (bối</text>
<text x="680.0" y="551.5" font-size="11.3" font-weight="400" fill="#374151" data-bx="679.0,965.0">cảnh xấu)</text>
<line x1="385.0" y1="564.5" x2="385.0" y2="576.0" stroke="#15803D" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="385.0,580.5 381.7,575.5 388.3,575.5" fill="#15803D"/>
<text x="394.0" y="576.5" font-size="10" font-weight="700" fill="#15803D">có</text>
<rect x="150.0" y="584.5" width="470.0" height="56.0" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.5"/>
<text x="385.0" y="609.0" font-size="12" font-weight="700" fill="#C026D3" text-anchor="middle">VALID CHoCH (G1) — bằng chứng cấu trúc. Chưa phải lệnh: chuyển sang</text>
<text x="385.0" y="624.6" font-size="12" font-weight="700" fill="#C026D3" text-anchor="middle">mô hình vào lệnh (hồi về FVG/OB, stop, target).</text>
<text x="28.0" y="687.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Sau nút cuối, cập nhật bậc khi có thông tin mới: G2 (không bị đóng ngược trong vài nến) và G3 (HL/LH mới + BOS). Bản Mermaid chỉnh sửa được nằm trong note,</text>
<text x="28.0" y="704.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">mục 24.</text>
