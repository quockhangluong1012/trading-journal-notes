<svg viewBox="0 0 1000 590" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="588" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vòng đời của liquidity trong một chu kỳ AMD: được xây → bị lấy → trở thành đích</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Liquidity không “biến mất” khi bị lấy — nó đã được khớp. Sau đó giá không còn lý do ở lại mép cũ, và câu hỏi chuyển sang: pool tiếp theo</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nằm ở đâu?</text>
<rect x="878.6" y="22.0" width="93.4" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="925.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LIQUIDITY</text>
<rect x="28.0" y="100.0" width="944.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="60.0" y="130.0" width="366.7" height="270.0" rx="0" fill="#EAF2FF"/>
<text x="243.3" y="122.0" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="middle">A — liquidity được XÂY</text>
<rect x="426.7" y="130.0" width="146.7" height="270.0" rx="0" fill="#FFF1E6"/>
<text x="500.0" y="122.0" font-size="12.5" font-weight="700" fill="#EA580C" text-anchor="middle">M — một phía bị LẤY</text>
<rect x="573.3" y="130.0" width="366.7" height="270.0" rx="0" fill="#F3EEFF"/>
<text x="756.7" y="122.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="middle">D — phía kia là ĐÍCH</text>
<line x1="60.0" y1="168.6" x2="940.0" y2="168.6" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="62.0" y="164.6" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">PDH — external BSL (đích)</text>
