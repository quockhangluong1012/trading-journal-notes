<text x="62.0" y="241.7" font-size="10" font-weight="600" fill="#B91C1C" text-anchor="start">đỉnh range — internal BSL</text>
<line x1="60.0" y1="322.9" x2="573.3" y2="322.9" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="62.0" y="317.9" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="start">đáy range — SSL (sẽ bị quét)</text>
