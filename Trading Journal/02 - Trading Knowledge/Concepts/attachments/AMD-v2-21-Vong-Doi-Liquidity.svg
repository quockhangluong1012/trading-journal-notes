<line x1="500.0" y1="349.9" x2="516.0" y2="370.0" stroke="#EA580C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="516.0" y="367.9" font-size="10.5" font-weight="600" fill="#EA580C" text-anchor="start">lệnh BÁN chờ được khớp</text>
<text x="516.0" y="381.5" font-size="10.5" font-weight="600" fill="#EA580C" text-anchor="start">(có người mua đứng bên kia)</text>
<line x1="610.0" y1="231.2" x2="598.0" y2="201.6" stroke="#B91C1C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="598.0" y="205.2" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end">đỉnh range bị vượt khi đi qua</text>
<text x="598.0" y="218.9" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end">= liquidity trên đường đi</text>
<line x1="866.7" y1="164.7" x2="856.7" y2="145.0" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3,2"/>
<text x="856.7" y="148.7" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="end">chạm đích</text>
<rect x="28.0" y="444.0" width="306.0" height="124.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="468.0" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">Trong A</text>
<text x="42.0" y="500.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi lần giá chạm mép mà không phá, mép rõ hơn</text>
<text x="42.0" y="516.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">→ người dùng nó làm mốc đặt chốt lỗ và lệnh</text>
<text x="42.0" y="533.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">“khi phá”. Hai kho lệnh chờ lớn dần ở hai phía.</text>
<rect x="346.0" y="444.0" width="306.0" height="124.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="360.0" y="468.0" font-size="13.5" font-weight="700" fill="#EA580C" text-anchor="start">Trong M</text>
<text x="360.0" y="500.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi vào một kho. Lệnh chờ thức dậy và được</text>
<text x="360.0" y="516.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">khớp. Nếu bên kia đủ dày và người phá không</text>
<text x="360.0" y="533.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">quay lại, kho này “đã dùng xong” — giá rút về.</text>
<rect x="664.0" y="444.0" width="306.0" height="124.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="678.0" y="468.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">Trong D</text>
<text x="678.0" y="500.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Kho phía kia (và kho xa hơn — đỉnh hôm qua,</text>
<text x="678.0" y="516.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đỉnh tuần) trở thành đích. Liquidity nhỏ nằm</text>
<text x="678.0" y="533.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trên đường đi bị lấy dần như những trạm dừng.</text>
