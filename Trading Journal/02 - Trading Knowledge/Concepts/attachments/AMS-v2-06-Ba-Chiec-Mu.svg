<svg viewBox="0 0 1000 430" width="1000" height="430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="428" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba chiếc mũ: cấp cao không thay thế cấp thấp, nó chồng lên</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mọi LTL đều là ITL. Mọi ITL đều là STL. Chiều ngược lại thì KHÔNG đúng.</text>
<rect x="827.0" y="22.0" width="145.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="899.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">QUAN HỆ CHA–CON</text>
<rect x="40.0" y="96.0" width="520.0" height="300.0" rx="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
<text x="60.0" y="124.0" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">Tất cả STL: a  b  c  d  e  f  g  h</text>
<rect x="90.0" y="150.0" width="420.0" height="220.0" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="110.0" y="180.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">Trong đó, các ITL: b  e  g</text>
<rect x="150.0" y="212.0" width="300.0" height="130.0" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="170.0" y="242.0" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start">Trong đó, LTL: e</text>
<text x="300.0" y="292.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">e đội cùng lúc ba mũ:</text>
<text x="300.0" y="314.0" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle">STL + ITL + LTL</text>
<rect x="590.0" y="100.0" width="382.0" height="97.4" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="590.0" y="100.0" width="5.0" height="97.4" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="604.0" y="119.5" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start">Câu hỏi 1</text>
<text x="604.0" y="136.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một LTL có bắt buộc "chứa" ITL và STL không?</text>
<text x="604.0" y="152.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có, theo hai nghĩa:</text>
<text x="604.0" y="169.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">1) Chính nó cũng là một ITL và một STL.</text>
<text x="604.0" y="186.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">2) Nó cần ít nhất một ITL ở mỗi bên làm chứng.</text>
<rect x="590.0" y="212.0" width="382.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="590.0" y="212.0" width="5.0" height="80.7" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="604.0" y="231.5" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">Câu hỏi 2</text>
<text x="604.0" y="248.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một ITL có bắt buộc sinh ra từ STL không?</text>
<text x="604.0" y="264.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có. ITL chỉ là một STL được lên cấp.</text>
<text x="604.0" y="281.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không có ITL nào "từ trên trời rơi xuống".</text>
<rect x="590.0" y="306.0" width="382.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.3"/>
<rect x="590.0" y="306.0" width="5.0" height="80.7" rx="2" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="0"/>
<text x="604.0" y="325.5" font-size="11.5" font-weight="700" fill="#9CA3AF" text-anchor="start">Câu hỏi 3</text>
<text x="604.0" y="342.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mọi STL có thành ITL không?</text>
<text x="604.0" y="358.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không. Đa số STL mãi chỉ là STL.</text>
<text x="604.0" y="375.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ở ví dụ này: 8 đáy nhỏ → 3 đáy vừa → 1 đáy lớn.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
