<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="638.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Thang bằng chứng: IFVG mạnh, vừa, yếu — và 'không phải IFVG'</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không có điểm số. Mỗi IFVG được đọc qua bốn câu hỏi; nhãn là để GHI CHÉP rồi kiểm chứng, không phải để tự tin hơn.</text>
<rect x="778.4" y="22.0" width="193.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="875.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CHẤT LƯỢNG · HYPOTHESIS</text>
<text x="261.5" y="112.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="middle">FVG gốc</text>
<text x="464.5" y="112.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="middle">Cú phá</text>
<text x="667.5" y="112.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="middle">Sau cú phá</text>
<text x="870.5" y="112.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="middle">Bối cảnh</text>
<rect x="28.0" y="124.0" width="944.0" height="98.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.2"/>
<text x="40.0" y="154.0" font-size="13" font-weight="800" fill="#15803D" text-anchor="start">MẠNH</text>
<text x="168.0" y="150.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Sinh ra từ một cú đẩy rõ, ở vị trí</text>
<text x="168.0" y="166.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">cấu trúc có ý nghĩa.</text>
<text x="371.0" y="150.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Đóng cửa xa ngoài mép xa, có</text>
<text x="371.0" y="166.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">displacement, phá một swing có</text>
<text x="371.0" y="182.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">ý nghĩa.</text>
<line x1="363.0" y1="136.0" x2="363.0" y2="210.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="574.0" y="150.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Nến sau không lấy lại vùng;</text>
<text x="574.0" y="166.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">retest LẦN ĐẦU bị từ chối rõ.</text>
<line x1="566.0" y1="136.0" x2="566.0" y2="210.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="777.0" y="150.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Cùng D1 bias và DOL, sau một</text>
<text x="777.0" y="166.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">sweep, đúng premium/discount,</text>
<text x="777.0" y="182.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">trong killzone.</text>
<line x1="769.0" y1="136.0" x2="769.0" y2="210.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<rect x="28.0" y="230.0" width="944.0" height="98.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="40.0" y="260.0" font-size="13" font-weight="800" fill="#1D4ED8" text-anchor="start">VỪA</text>
<text x="168.0" y="256.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">FVG bình thường, vị trí không đặc</text>
<text x="168.0" y="272.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">biệt.</text>
<text x="371.0" y="256.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Đóng cửa qua mép xa nhưng</text>
<text x="371.0" y="272.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">không mạnh; phá swing nhỏ.</text>
<line x1="363.0" y1="242.0" x2="363.0" y2="316.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="574.0" y="256.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá do dự quanh vùng vài nến rồi</text>
<text x="574.0" y="272.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">mới đi.</text>
<line x1="566.0" y1="242.0" x2="566.0" y2="316.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="777.0" y="256.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Thiếu một vài yếu tố bối cảnh.</text>
<line x1="769.0" y1="242.0" x2="769.0" y2="316.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<rect x="28.0" y="336.0" width="944.0" height="98.0" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
<text x="40.0" y="366.0" font-size="13" font-weight="800" fill="#EA580C" text-anchor="start">YẾU</text>
<text x="168.0" y="362.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">FVG nhỏ, giữa range, giữa hư</text>
<text x="168.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">không.</text>
<text x="371.0" y="362.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Vừa đủ đóng qua mép xa bằng</text>
<text x="371.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">nhiều nến nhỏ; không phá swing</text>
<text x="371.0" y="394.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">nào.</text>
<line x1="363.0" y1="348.0" x2="363.0" y2="422.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="574.0" y="362.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Retest lần 3+, hoặc retest đóng</text>
<text x="574.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">trong vùng.</text>
<line x1="566.0" y1="348.0" x2="566.0" y2="422.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="777.0" y="362.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Ngược bias HTF, ngoài killzone,</text>
<text x="777.0" y="378.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">sát giờ tin.</text>
<line x1="769.0" y1="348.0" x2="769.0" y2="422.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<rect x="28.0" y="442.0" width="944.0" height="98.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="40.0" y="472.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">KHÔNG PHẢI</text>
<text x="40.0" y="489.9" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">IFVG</text>
<text x="168.0" y="468.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Không có FVG thật (bóng chồng,</text>
<text x="168.0" y="484.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">vẽ bằng thân nến).</text>
<text x="371.0" y="468.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ bóng xuyên; đóng trong vùng;</text>
<text x="371.0" y="484.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">hoặc đóng ở khung NHỎ hơn.</text>
<line x1="363.0" y1="454.0" x2="363.0" y2="528.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="574.0" y="468.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá đóng cửa quay lại qua mép xa</text>
<text x="574.0" y="484.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">(vô hiệu).</text>
<line x1="566.0" y1="454.0" x2="566.0" y2="528.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="777.0" y="468.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">—</text>
<line x1="769.0" y1="454.0" x2="769.0" y2="528.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/>
<rect x="28.0" y="561.0" width="944.0" height="57.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="46.0" y="587.0" font-size="12.5" font-weight="600" fill="#7C3AED" text-anchor="start">HYPOTHESIS: thứ tự 'mạnh → yếu' có lý do (nhiều bằng chứng độc lập cùng chỉ một hướng), nhưng CHƯA phải kết quả đo. Cách kiểm: gắn nhãn</text>
<text x="46.0" y="604.5" font-size="12.5" font-weight="600" fill="#7C3AED" text-anchor="start">TRƯỚC khi xem kết quả, rồi xem nhãn có thật sự tách được kết quả hay không.</text>
</svg>
