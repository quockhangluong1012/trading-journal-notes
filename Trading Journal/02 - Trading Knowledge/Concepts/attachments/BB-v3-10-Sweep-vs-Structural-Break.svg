<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cả hai đều “vượt qua một mức”. Khác nhau ở chỗ cây nến ĐÓNG CỬA ở đâu và giá Ở LẠI bên nào sau đó.</text>
