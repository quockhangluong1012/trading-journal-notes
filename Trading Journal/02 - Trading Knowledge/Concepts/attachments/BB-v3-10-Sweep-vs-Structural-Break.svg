<text x="274.7" y="369.0" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="52.0,464.0">râu qua, thân đóng lại bên trên</text>
<text x="42.0" y="452.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="41.0,475.0">Râu nến đi xuống dưới đáy cũ, nhưng nến đóng cửa quay lại PHÍA TRÊN.</text>
<text x="42.0" y="469.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="41.0,475.0">Giá không ở lại bên dưới. Túi lệnh dưới đáy đã bị lấy, cấu trúc chưa đổi.</text>
