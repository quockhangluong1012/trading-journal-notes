<text x="526.0" y="452.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="525.0,959.0">Thân nến đóng cửa PHÍA DƯỚI đáy cũ và các nến sau tiếp tục ở dưới.</text>
<text x="526.0" y="469.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="525.0,959.0">Lần quay lại vạch cũ bị từ chối. Cấu trúc đã đổi.</text>
<text x="28.0" y="547.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trong một Bullish Breaker có CẢ HAI: đáy cũ bị vi phạm (ICT gọi là chạy stop), sau đó đỉnh giữa bị PHÁ bằng thân nến (structural break). Hai sự kiện, hai vai khác</text>
<text x="28.0" y="564.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">nhau.</text>
