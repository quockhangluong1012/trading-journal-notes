<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ahE0464B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0464B"/></marker></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao một chặng giảm đi tiếp — hoặc dừng lại?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi giao dịch luôn có một người mua và một người bán. Giá đi xuống khi người BÁN vội hơn: họ chấp nhận bán vào các lệnh mua đang</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">chờ, hết mức này tới mức thấp hơn. Lượng lệnh chờ bên dưới quyết định giá rơi xa hay gần.</text>
<rect x="903.9" y="22" width="68.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="937.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CƠ CHẾ</text>
<text x="28.0" y="588.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<rect x="28.0" y="110.0" width="450.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="134.0" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">A. Phía dưới ít lệnh mua chờ → giá rơi xa</text>
<text x="98.0" y="172.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 8</text>
<rect x="108.0" y="158.0" width="26.0" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="198.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 7</text>
<rect x="108.0" y="184.0" width="31.2" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="224.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 6</text>
<rect x="108.0" y="210.0" width="20.8" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="250.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 5</text>
<rect x="108.0" y="236.0" width="26.0" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="276.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 4</text>
<rect x="108.0" y="262.0" width="23.4" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="302.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 3</text>
<rect x="108.0" y="288.0" width="28.6" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="328.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 2</text>
<rect x="108.0" y="314.0" width="18.2" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="98.0" y="354.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 1</text>
<rect x="108.0" y="340.0" width="26.0" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="108.0" y="380.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">thanh xanh = lượng lệnh MUA đang chờ ở mỗi mức</text>
<text x="42.0" y="410.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi mức chỉ có ít người chờ mua, nên một lượng bán vừa phải cũng “ăn” hết</text>
<text x="42.0" y="425.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">mức này sang mức khác. Trên chart: nến đỏ thân dài, chuỗi đỏ kéo dài.</text>
<line x1="428.0" y1="162.0" x2="428.0" y2="360.0" stroke="#E0464B" stroke-width="2.4" marker-end="url(#ahE0464B)"/>
<text x="438.0" y="170.0" font-size="10" font-weight="700" fill="#E0464B" text-anchor="start">lệnh</text>
<text x="438.0" y="182.0" font-size="10" font-weight="700" fill="#E0464B" text-anchor="start">bán</text>
<text x="438.0" y="194.0" font-size="10" font-weight="700" fill="#E0464B" text-anchor="start">vội</text>
<rect x="522.0" y="110.0" width="450.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="536.0" y="134.0" font-size="13" font-weight="700" fill="#059669" text-anchor="start">B. Gặp vùng nhiều lệnh mua chờ → giá dừng</text>
<text x="592.0" y="172.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 8</text>
<rect x="602.0" y="158.0" width="26.0" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="198.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 7</text>
<rect x="602.0" y="184.0" width="23.4" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="224.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 6</text>
<rect x="602.0" y="210.0" width="28.6" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="250.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 5</text>
<rect x="602.0" y="236.0" width="124.8" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="276.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 4</text>
<rect x="602.0" y="262.0" width="161.2" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="302.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 3</text>
<rect x="602.0" y="288.0" width="143.0" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="328.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 2</text>
<rect x="602.0" y="314.0" width="26.0" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="592.0" y="354.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">mức 1</text>
<rect x="602.0" y="340.0" width="20.8" height="18.0" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="602.0" y="380.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">thanh xanh = lượng lệnh MUA đang chờ ở mỗi mức</text>
<text x="536.0" y="410.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ở mức 5–3 có rất nhiều người chờ mua. Lệnh bán bị “hấp thụ”, giá không</text>
<text x="536.0" y="425.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">xuống thêm được. Nếu người mua bắt đầu vội hơn, chặng giảm kết thúc.</text>
<line x1="922.0" y1="162.0" x2="922.0" y2="360.0" stroke="#E0464B" stroke-width="2.4" marker-end="url(#ahE0464B)"/>
<text x="932.0" y="170.0" font-size="10" font-weight="700" fill="#E0464B" text-anchor="start">lệnh</text>
<text x="932.0" y="182.0" font-size="10" font-weight="700" fill="#E0464B" text-anchor="start">bán</text>
<text x="932.0" y="194.0" font-size="10" font-weight="700" fill="#E0464B" text-anchor="start">vội</text>
<text x="28.0" y="494.0" font-size="11" font-weight="600" fill="#EA580C" text-anchor="start">Lưu ý: chart OHLC KHÔNG cho ta thấy sổ lệnh. Ta chỉ thấy kết quả (nến dài/ngắn, đi tiếp/dừng). Hình B là cách GIẢI THÍCH có thể, không phải điều ta quan sát trực tiếp.</text>
</svg>
