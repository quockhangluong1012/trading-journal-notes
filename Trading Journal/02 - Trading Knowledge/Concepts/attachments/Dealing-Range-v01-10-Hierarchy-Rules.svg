<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">Range hierarchy và bảy quy tắc ưu tiên (v0.1)</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Mỗi tầng trả lời một câu hỏi. Direction đi từ trên xuống; location lấy từ tầng thấp nhất còn scale-matched; M5 không bao giờ quyết định location.</text>
  <rect x="30.0" y="88.0" width="440.0" height="470.0" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/>
  <text x="42.0" y="109.0" font-size="12.5" font-weight="700" fill="#6B7280">T0 · W1 / IPDA 60</text>
  <text x="42.0" y="126.0" font-size="11" fill="#374151">bối cảnh xa · DOL HTF</text>
  <rect x="56.0" y="140.0" width="388.0" height="398.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="68.0" y="161.0" font-size="12.5" font-weight="700" fill="#1D4ED8">T1 · D1 container / IPDA 20</text>
  <text x="68.0" y="178.0" font-size="11" fill="#374151">liquidity map D1 · DOL candidates</text>
  <rect x="82.0" y="192.0" width="336.0" height="326.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="94.0" y="213.0" font-size="12.5" font-weight="700" fill="#7C3AED">T2 · D1 leg DR</text>
  <text x="94.0" y="230.0" font-size="11" fill="#374151">direction + location D1 (Daily Bias)</text>
  <rect x="108.0" y="244.0" width="284.0" height="254.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="120.0" y="265.0" font-size="12.5" font-weight="700" fill="#B45309">T3 · H1 leg DR</text>
  <text x="120.0" y="282.0" font-size="11" fill="#374151">location của POI (setup)</text>
  <rect x="134.0" y="296.0" width="232.0" height="182.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
  <text x="146.0" y="317.0" font-size="12.5" font-weight="700" fill="#15803D">T4 · M5 structure</text>
  <text x="146.0" y="334.0" font-size="11" fill="#374151">trigger · stop — KHÔNG quyết định location</text>
  <rect x="500.0" y="88.0" width="454.0" height="470.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="512.0" y="110.0" font-size="13" font-weight="700" fill="#7C3AED">Quy tắc — tất cả là [HYPOTHESIS] về thiết kế</text>
  <rect x="514.0" y="130.5" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="145.0" font-size="10.5" font-weight="700" fill="#7C3AED">R1</text>
  <text x="558.0" y="144.0" font-size="11.2" fill="#374151">Direction lấy từ range cao nhất còn protected anchor và structure rõ</text>
  <text x="558.0" y="159.1" font-size="11.2" fill="#374151">ràng.</text>
  <rect x="514.0" y="172.7" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="187.2" font-size="10.5" font-weight="700" fill="#7C3AED">R2</text>
  <text x="558.0" y="186.2" font-size="11.2" fill="#374151">Location đo trên range thấp nhất còn scale-matched với trade</text>
  <text x="558.0" y="201.4" font-size="11.2" fill="#374151">(thường là H1 leg DR).</text>
  <rect x="514.0" y="215.0" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="229.5" font-size="10.5" font-weight="700" fill="#7C3AED">R3</text>
  <text x="558.0" y="228.5" font-size="11.2" fill="#374151">Parent constraint: child location chỉ hợp lệ nếu parent đồng thuận</text>
  <text x="558.0" y="243.6" font-size="11.2" fill="#374151">direction, HOẶC DOL của parent còn đủ xa.</text>
  <rect x="514.0" y="257.2" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="271.7" font-size="10.5" font-weight="700" fill="#7C3AED">R4</text>
  <text x="558.0" y="270.7" font-size="11.2" fill="#374151">Mọi xung đột location giữa các tầng phải được ghi lại (location_conflict</text>
  <text x="558.0" y="285.8" font-size="11.2" fill="#374151">= TRUE).</text>
  <rect x="514.0" y="299.5" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="314.0" font-size="10.5" font-weight="700" fill="#7C3AED">R5</text>
  <text x="558.0" y="313.0" font-size="11.2" fill="#374151">Trong cùng scale: dùng range ACTIVE gần nhất — không phải range</text>
  <text x="558.0" y="328.1" font-size="11.2" fill="#374151">trông &#x27;đẹp&#x27; nhất.</text>
  <rect x="514.0" y="341.7" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="356.2" font-size="10.5" font-weight="700" fill="#7C3AED">R6</text>
  <text x="558.0" y="355.2" font-size="11.2" fill="#374151">Parent INVALIDATED → mọi child mất directional support; suy luận</text>
  <text x="558.0" y="370.3" font-size="11.2" fill="#374151">lại từ trên xuống.</text>
  <rect x="514.0" y="383.9" width="27.4" height="19.5" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="521.0" y="398.4" font-size="10.5" font-weight="700" fill="#7C3AED">R7</text>
  <text x="558.0" y="397.4" font-size="11.2" fill="#374151">H1 chỉ override D1 khi phá một swing có cấp D1 (θ* ≥ θ_min D1). Ý</text>
  <text x="558.0" y="412.6" font-size="11.2" fill="#374151">nghĩa thuộc về swing bị phá.</text>
</svg>
