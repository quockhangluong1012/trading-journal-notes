<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một IFVG không sống mãi. Mỗi lần giá quay lại 'hỏi', câu trả lời có thể khác đi. Khi giá đóng cửa quay lại qua cả vùng, IFVG chấm</text>
