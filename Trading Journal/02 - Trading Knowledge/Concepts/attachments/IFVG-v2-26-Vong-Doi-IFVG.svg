<text x="847.7" y="132.0" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">đóng cửa TRÊN cả vùng</text>
<text x="32.0" y="498.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">Hình thành</text>
<text x="128.0" y="498.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một nến cùng khung đóng cửa qua mép xa của FVG. Từ đây nó là</text>
<text x="128.0" y="513.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ỨNG VIÊN IFVG.</text>
<text x="512.0" y="498.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">Kích hoạt</text>
<text x="608.0" y="498.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thời điểm bạn cho phép mình DÙNG vùng (ví dụ: sau khi nến kế</text>
<text x="608.0" y="513.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tiếp không lấy lại vùng). Phải viết quy tắc này ra trước.</text>
<text x="32.0" y="562.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">Retest</text>
<text x="128.0" y="562.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá quay lại chạm vùng từ phía bên kia. Ghi: lần thứ mấy, sâu tới</text>
<text x="128.0" y="577.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đâu (mép gần / CE / mép xa).</text>
<text x="512.0" y="562.0" font-size="12.5" font-weight="800" fill="#1F2937" text-anchor="start">Vô hiệu</text>
<text x="608.0" y="562.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một nến cùng khung đóng cửa quay lại qua MÉP XA của IFVG (với</text>
<text x="608.0" y="577.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bearish IFVG: đóng trên 106). Bóng xuyên qua chưa đủ.</text>
