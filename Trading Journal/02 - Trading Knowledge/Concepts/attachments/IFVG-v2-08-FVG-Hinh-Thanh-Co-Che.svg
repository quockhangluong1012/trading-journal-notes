<text x="46.0" y="623.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">Cùng một FVG có thể đến từ: lệnh mua dồn dập · người bán rút lệnh chờ · tin tức · phiên vắng (ít lệnh). Chart OHLC không phân biệt được các</text>
