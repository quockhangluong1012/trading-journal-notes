<text x="42.0" y="525.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hệ quả thực hành: luôn ghi kèm khung — “ERL-H1”, “IRL-D1”. Khi giá phá range nhỏ và lấy L, đó là “lấy ERL của H1” nhưng với D1 chỉ là “đi qua một IRL”. Hai câu</text>
