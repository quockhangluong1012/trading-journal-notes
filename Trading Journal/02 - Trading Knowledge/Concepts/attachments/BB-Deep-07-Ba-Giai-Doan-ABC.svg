<text x="32.0" y="440.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">A · ỨNG VIÊN (CANDIDATE)</text>
<text x="32.0" y="459.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Đã biết: có OB gốc tại H1, đáy L1 vừa bị phá.</text>
<text x="32.0" y="480.6" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Chưa biết: giá có đóng trên H1 không. Nhiều ứng</text>
<text x="32.0" y="496.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">viên KHÔNG bao giờ được xác nhận.</text>
<text x="32.0" y="517.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Việc làm: ghi ứng viên + đánh dấu trước mức H1 cần</text>
<text x="32.0" y="532.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">bị phá. Không vào lệnh.</text>
