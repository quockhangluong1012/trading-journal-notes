<text x="666.0" y="459.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Đã biết: giá đã chạm vùng.</text>
<text x="666.0" y="480.6" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Chưa biết: phản ứng có đủ lớn và bền không — đây</text>
<text x="666.0" y="496.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">mới là phần cần chứng minh.</text>
<text x="666.0" y="517.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Việc làm: xuống M5 theo gate, quan sát, ghi kết cục</text>
<text x="666.0" y="532.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">A / B / C.</text>
