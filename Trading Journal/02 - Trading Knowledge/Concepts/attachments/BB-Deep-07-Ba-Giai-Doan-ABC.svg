<text x="349.0" y="459.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Đã biết: thân nến đóng trên H1 → vùng là Breaker</text>
<text x="349.0" y="475.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">theo định nghĩa.</text>
<text x="349.0" y="496.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Chưa biết: giá có quay lại không, quay lại thì giữ hay</text>
<text x="349.0" y="511.6" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">xuyên.</text>
<text x="349.0" y="532.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Việc làm: khóa ranh giới vùng, ghi t_avail, mục tiêu,</text>
<text x="349.0" y="548.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">điều kiện hết hạn.</text>
