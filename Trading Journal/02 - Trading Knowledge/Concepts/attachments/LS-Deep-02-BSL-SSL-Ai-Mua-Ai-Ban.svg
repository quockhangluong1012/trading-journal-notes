<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Buy-side / Sell-side Liquidity — ai mua, ai bán, ai cần ai</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Tên gọi đặt theo PHÍA của lệnh chờ được kích hoạt — không theo hướng giá sẽ đi.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">BSL = khối lệnh MUA có thể xuất hiện khi giá vượt đỉnh → đó là ĐỐI ỨNG cho người muốn BÁN lượng lớn.</text>
<rect x="40.0" y="100.0" width="380.0" height="460.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<path d="M60.0,370.0 L75.0,338.0 L90.0,310.0 L105.0,282.0 L120.0,250.0 L135.0,226.0 L150.0,210.0 L165.0,234.0 L180.0,266.0 L195.0,298.0 L210.0,330.0 L225.0,362.0 L240.0,394.0 L255.0,426.0 L270.0,450.0 L285.0,434.0 L300.0,406.0 L315.0,378.0 L330.0,350.0 L345.0,330.0 L360.0,314.0 L375.0,322.0 L390.0,334.0 L405.0,326.0" stroke="#111827" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48.0" y="176.0" width="364.0" height="34.0" rx="4" fill="#F5F3FF" fill-opacity="0.7" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="48.0" y1="210.0" x2="412.0" y2="210.0" stroke="#B45309" stroke-width="1.8"/>
<text x="406.0" y="170.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="end">BSL — phía trên đỉnh cũ</text>
<text x="56.0" y="225.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">đỉnh cũ</text>
<rect x="48.0" y="450.0" width="364.0" height="34.0" rx="4" fill="#F5F3FF" fill-opacity="0.7" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="48.0" y1="450.0" x2="412.0" y2="450.0" stroke="#B45309" stroke-width="1.8"/>
<text x="406.0" y="500.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="end">SSL — phía dưới đáy cũ</text>
<text x="56.0" y="443.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">đáy cũ</text>
<circle cx="405.0" cy="326.0" r="4" fill="#111827"/>
<text x="401.0" y="350.0" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="end">giá hiện tại</text>
<rect x="450.0" y="100.0" width="490.0" height="208.0" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="464.0" y="122.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="start">Phía TRÊN đỉnh cũ có thể có (giả thuyết, không quan sát được):</text>
<text x="464.0" y="145.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">① Buy stop-loss của người đang SHORT</text>
<text x="464.0" y="160.5" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">     → khi giá chạm: thành lệnh MUA market (taker)</text>
<text x="464.0" y="176.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">② Buy-stop vào lệnh breakout ("phá đỉnh thì mua")</text>
<text x="464.0" y="191.5" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">     → cũng là lệnh MUA market</text>
<text x="464.0" y="207.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">③ Sell-limit đang chờ (chốt lời của người LONG, người short ở đỉnh)</text>
<text x="464.0" y="222.5" font-size="10.8" font-weight="400" fill="#374151" text-anchor="start">     → lệnh BÁN — chính là thứ ăn vào ① và ②</text>
<rect x="464.0" y="252.0" width="462.0" height="46.0" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="474.0" y="271.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">Ai cần BSL? Người muốn BÁN lượng lớn:</text>
<text x="474.0" y="285.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">①+② đổ lệnh mua vào → họ bán được mà không tự đạp giá xuống.</text>
<rect x="450.0" y="320.0" width="490.0" height="160.0" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="464.0" y="342.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="start">Phía DƯỚI đáy cũ — đối xứng:</text>
<text x="464.0" y="364.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">① Sell stop-loss của người đang LONG → lệnh BÁN market</text>
<text x="464.0" y="381.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">② Sell-stop vào lệnh breakdown → lệnh BÁN market</text>
<text x="464.0" y="398.0" font-size="10.8" font-weight="700" fill="#1F2937" text-anchor="start">③ Buy-limit đang chờ (chốt lời short, người bắt đáy) → lệnh MUA</text>
<rect x="464.0" y="424.0" width="462.0" height="46.0" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="474.0" y="443.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">Ai cần SSL? Người muốn MUA lượng lớn:</text>
<text x="474.0" y="457.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">lệnh bán bị kích hoạt cho họ đối ứng để mua.</text>
<rect x="450.0" y="492.0" width="490.0" height="68.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="464.0" y="512.0" font-size="10.4" font-weight="700" fill="#B91C1C" text-anchor="start">Ba điều chart KHÔNG cho biết:</text>
<text x="464.0" y="527.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">(1) có bao nhiêu lệnh ①②③ thật sự ở đó; (2) chúng nằm sâu bao nhiêu sau mức;</text>
<text x="464.0" y="542.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">(3) ai dùng chúng, với ý định gì. "Smart money cần BSL" là diễn giải, không phải quan sát.</text>
</svg>