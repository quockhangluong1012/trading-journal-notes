<text x="786.8" y="155.9" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">z z z  lệnh stop đang “ngủ”</text>
<text x="520.0" y="357.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="438.0">Trên một đỉnh cũ, người bán khống đặt stop-loss; người chờ phá đỉnh đặt</text>
<text x="520.0" y="373.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="438.0">lệnh mua chờ. Tất cả đều là lệnh MUA chưa hiện ra.</text>
<text x="520.0" y="415.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="438.0">ICT gọi cụm lệnh đó là “liquidity”: một nguồn đối ứng có thể đoán trước được</text>
<text x="520.0" y="431.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="438.0">VỊ TRÍ — nhưng không ai thấy được SỐ LƯỢNG.</text>
<rect x="28.0" y="481.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="505.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nối hai nghĩa lại: khi cụm stop mua thức dậy, nó tạo ra một đợt lệnh MUA bất ngờ. Với ai đang muốn BÁN một khối lớn, đó chính là “người đứng bên kia” họ cần. Vì</text>
<text x="42.0" y="521.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">vậy ICT gọi cụm stop là liquidity.</text>
