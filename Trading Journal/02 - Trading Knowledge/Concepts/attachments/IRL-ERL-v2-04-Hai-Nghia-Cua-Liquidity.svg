<text x="931.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LIQUIDITY</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity là gì? Hai nghĩa khác nhau mà người học hay trộn lẫn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Liquidity KHÔNG phải là “tiền”. Ở nghĩa gốc, nó là việc bạn có dễ tìm được người đứng phía bên kia để khớp lệnh hay không.</text>
<rect x="28.0" y="87.0" width="466.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="109.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">Nghĩa sách tài chính: mua/bán có dễ không?</text>
<text x="146.0" y="129.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Thị trường DÀY</text>
