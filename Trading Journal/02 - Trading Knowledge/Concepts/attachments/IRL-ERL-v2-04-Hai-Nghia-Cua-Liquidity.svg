<rect x="263.0" y="288.0" width="16.0" height="16.0" rx="3" fill="#1D4ED8" stroke="none" stroke-width="1.2" opacity="0.75"/>
<text x="56.0" y="317.0" font-size="10" font-weight="600" fill="#6B7280" text-anchor="start">đỏ = lệnh bán đang chờ · xanh = lệnh mua đang chờ (minh họa)</text>
<text x="56.0" y="343.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="410.0">DÀY: bạn mua một khối lớn mà giá chỉ nhích nhẹ, vì có rất nhiều người</text>
<text x="56.0" y="359.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="410.0">bán đứng chờ sẵn.</text>
<text x="56.0" y="383.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="410.0">MỎNG: cùng khối lệnh đó phải “ăn” lên nhiều mức giá mới đủ người bán</text>
<text x="56.0" y="399.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="410.0">→ giá nhảy, trượt giá.</text>
<text x="56.0" y="423.0" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic" data-maxw="410.0">Ví dụ đời thường: chợ đông thì bán rau nhanh, giá ổn định; chợ vắng thì</text>
<text x="56.0" y="439.6" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic" data-maxw="410.0">phải hạ giá mới có người mua.</text>
<rect x="506.0" y="87.0" width="466.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="520.0" y="109.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">Nghĩa ICT: chỗ có lệnh chờ sẽ bị buộc khớp</text>
