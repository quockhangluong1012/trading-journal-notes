<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mk64748B" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba pha của Power of 3 — mỗi pha trả lời một câu hỏi khác</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Chuẩn bị (Preparation) → Lệch hướng (Deviation) → Mở rộng (Expansion). Hàng trên: giá làm gì (quan sát). Hàng giữa: có thể vì sao (cơ</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">chế/diễn giải). Hàng dưới: câu hỏi bạn phải tự trả lời.</text>
<rect x="873.2" y="22.0" width="98.8" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="922.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CORE MODEL</text>
<rect x="120.0" y="100.0" width="272.0" height="418.0" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="256.0" y="126.0" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">A — ACCUMULATION</text>
<text x="256.0" y="146.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Chuẩn bị</text>
<rect x="130.0" y="166.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="140.0" y="188.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi ngang trong một vùng. Mép trên,</text>
<text x="140.0" y="204.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">mép dưới được chạm nhiều lần.</text>
<rect x="130.0" y="282.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="140.0" y="304.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hai phía cân bằng. Mỗi lần chạm mép</text>
<text x="140.0" y="320.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">mà không phá, mép đó càng “rõ” → càng</text>
<text x="140.0" y="337.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nhiều người đặt lệnh quanh đó.</text>
<rect x="130.0" y="398.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="140.0" y="420.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đây có phải một vùng cân bằng thật</text>
<text x="140.0" y="436.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không? Mép ở đâu? Lệnh chờ có thể nằm</text>
<text x="140.0" y="453.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ở đâu?</text>
<line x1="394.0" y1="310.0" x2="408.0" y2="310.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="410.0" y="100.0" width="272.0" height="418.0" rx="12" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.3"/>
<text x="546.0" y="126.0" font-size="14" font-weight="800" fill="#EA580C" text-anchor="middle">M — MANIPULATION</text>
<text x="546.0" y="146.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Lệch hướng</text>
<rect x="420.0" y="166.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="430.0" y="188.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá chọc ra khỏi một mép, chạm vào</text>
<text x="430.0" y="204.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chỗ có nhiều lệnh chờ, rồi không đi tiếp</text>
<text x="430.0" y="221.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">được.</text>
<rect x="420.0" y="282.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="430.0" y="304.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh chờ thức dậy và được khớp. Nếu</text>
<text x="430.0" y="320.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">bên kia đủ mạnh hấp thụ hết, lực đẩy</text>
<text x="430.0" y="337.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">cạn → giá quay về.</text>
<rect x="420.0" y="398.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="430.0" y="420.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Phía nào vừa bị lấy? Giá có quay về</text>
<text x="430.0" y="436.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không? Có bằng chứng nào chống lại</text>
<text x="430.0" y="453.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không?</text>
<line x1="684.0" y1="310.0" x2="698.0" y2="310.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="700.0" y="100.0" width="272.0" height="418.0" rx="12" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="836.0" y="126.0" font-size="14" font-weight="800" fill="#7C3AED" text-anchor="middle">D — DISTRIBUTION</text>
<text x="836.0" y="146.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Mở rộng</text>
<rect x="710.0" y="166.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="720.0" y="188.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi mạnh về phía bên kia, nến to, ít</text>
<text x="720.0" y="204.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">râu, phá cấu trúc, để lại khoảng trống</text>
<text x="720.0" y="221.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">(FVG).</text>
<rect x="710.0" y="282.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="720.0" y="304.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Một phía đã hết “đạn”, phía còn lại</text>
<text x="720.0" y="320.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thắng thế. Giá phải đi xa hơn để tìm</text>
<text x="720.0" y="337.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">người chịu khớp.</text>
<rect x="710.0" y="398.0" width="252.0" height="106.0" rx="8" fill="#FFFFFF"/>
<text x="720.0" y="420.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Có thật sự đi về phía bên kia với sức</text>
<text x="720.0" y="436.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">mạnh không? Đích (DOL) ở đâu? Khi nào</text>
<text x="720.0" y="453.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thì sai?</text>
<text x="28.0" y="216.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Giá làm gì</text>
<text x="28.0" y="332.0" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="start">Có thể vì</text>
<text x="28.0" y="349.2" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="start">sao</text>
<text x="28.0" y="448.0" font-size="12.5" font-weight="700" fill="#BE123C" text-anchor="start">Câu hỏi của</text>
<text x="28.0" y="465.2" font-size="12.5" font-weight="700" fill="#BE123C" text-anchor="start">bạn</text>
<rect x="28.0" y="532.0" width="944.0" height="48.6" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="38.0" y="554.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ba pha là một KHUNG để kể lại chuyển động giá, không phải định luật. Thị trường không “đếm tới ba”. Có ngày chỉ có 2 pha, có ngày có nhiều chu kỳ, có ngày</text>
<text x="38.0" y="570.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không có chu kỳ nào.</text>
</svg>
