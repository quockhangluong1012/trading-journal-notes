<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="648" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Accumulation ở những vị trí khác nhau mang ý nghĩa khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Hình dạng đi ngang giống nhau. Điều thay đổi là VỊ TRÍ: nó nằm sau cái gì, nằm ở đâu trong vùng giá lớn, và nằm vào giờ nào. Vị trí</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">quyết định câu hỏi bạn cần đặt ra.</text>
<rect x="852.8" y="22.0" width="119.2" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="912.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ACCUMULATION</text>
<rect x="28.0" y="96.0" width="306.0" height="262.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="46.0" cy="115.0" r="9" fill="#4338CA"/>
<text x="46.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="62.0" y="119.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">Sau một đợt giảm dài</text>
<rect x="40.0" y="130.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="169.2" y="219.3" width="152.8" height="18.7" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M40.0,141.4 L63.5,155.8 L87.0,167.4 L110.5,184.7 L134.0,199.1 L157.5,219.3 L181.0,236.6 L204.5,222.2 L228.0,233.7 L251.5,220.7 L275.0,235.1 L298.5,223.6 L322.0,232.3" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="266.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Có thể là nền đáy… hoặc chỉ là nghỉ trước khi giảm</text>
<text x="40.0" y="281.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">tiếp. Câu hỏi: đã chạm vùng đích (DOL) của khung</text>
<text x="40.0" y="296.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">lớn chưa?</text>
<rect x="346.0" y="96.0" width="306.0" height="262.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="364.0" cy="115.0" r="9" fill="#4338CA"/>
<text x="364.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="380.0" y="119.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">Sau một đợt tăng dài</text>
<rect x="358.0" y="130.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="487.2" y="140.0" width="152.8" height="18.7" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M358.0,236.6 L381.5,222.2 L405.0,210.6 L428.5,193.3 L452.0,178.9 L475.5,158.7 L499.0,141.4 L522.5,155.8 L546.0,144.3 L569.5,157.3 L593.0,142.9 L616.5,154.4 L640.0,145.7" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="266.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Có thể là vùng tạo đỉnh, cũng có thể chỉ là tích</text>
<text x="358.0" y="281.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">lũy lại để tăng tiếp. Đừng mặc định hướng nào.</text>
<rect x="664.0" y="96.0" width="306.0" height="262.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="682.0" cy="115.0" r="9" fill="#4338CA"/>
<text x="682.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="698.0" y="119.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">Trong một phiên (vd. range phiên Á)</text>
<rect x="676.0" y="130.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="676.0" y="209.4" width="241.0" height="29.9" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M676.0,228.4 L701.6,212.1 L727.3,233.9 L752.9,214.8 L778.5,236.6 L804.2,212.1 L829.8,231.1 L855.5,217.5 L881.1,233.9 L906.7,220.3 L932.4,179.5 L958.0,141.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="266.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Biên hẹp vì ít người giao dịch. Mép phiên Á thành</text>
<text x="676.0" y="281.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">mốc cho phiên sau. Hẹp không có nghĩa là “đang</text>
<text x="676.0" y="296.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">gom hàng”.</text>
<rect x="28.0" y="370.0" width="306.0" height="262.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="46.0" cy="389.0" r="9" fill="#4338CA"/>
<text x="46.0" y="393.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="62.0" y="393.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">Ngay trước giờ mở cửa quan trọng</text>
<rect x="40.0" y="404.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="40.0" y="472.1" width="208.7" height="15.9" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
