<text x="363.1" y="519.3" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="start">discount</text>
<path d="M358.0,430.7 L383.6,447.1 L409.3,463.5 L434.9,486.4 L460.5,506.1 L486.2,525.8 L511.8,512.7 L537.5,524.2 L563.1,514.3 L588.7,525.8 L614.4,516.0 L640.0,522.5" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="555.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Range nhỏ nằm ở discount của range lớn: nếu</text>
<text x="358.0" y="570.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">khung lớn tăng, đây là chỗ đáng chờ cú lệch xuống.</text>
<rect x="664.0" y="370.0" width="306.0" height="262.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="682.0" cy="389.0" r="9" fill="#4338CA"/>
<text x="682.0" y="393.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="698.0" y="393.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">Giữa một xu hướng (tích lũy lại)</text>
<rect x="676.0" y="404.0" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="752.9" y="457.9" width="143.6" height="11.6" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M676.0,510.6 L701.6,492.6 L727.3,474.6 L752.9,459.1 L778.5,466.9 L804.2,459.1 L829.8,468.1 L855.5,460.4 L881.1,466.9 L906.7,451.4 L932.4,433.4 L958.0,415.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="540.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Re-accumulation: nghỉ rồi đi tiếp. Có khi có cú</text>
<text x="676.0" y="555.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">quét đáy nhỏ trước khi đi tiếp, có khi không.</text>
