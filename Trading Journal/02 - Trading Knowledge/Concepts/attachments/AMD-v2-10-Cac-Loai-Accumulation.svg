<text x="258.3" y="417.0" font-size="10" font-weight="700" fill="#EA580C" text-anchor="start">mở cửa</text>
<path d="M40.0,483.4 L68.2,476.6 L96.4,485.7 L124.6,474.3 L152.8,483.4 L181.0,475.5 L209.2,484.5 L237.4,476.6 L265.6,510.6 L293.8,449.4 L322.0,415.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="540.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá chờ phiên lớn (London / New York) mở. Cú chạy</text>
<text x="40.0" y="555.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">đầu tiên khi mở cửa là lúc AMD hay được kể</text>
<text x="40.0" y="570.3" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">chuyện.</text>
<rect x="346.0" y="370.0" width="306.0" height="262.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<circle cx="364.0" cy="389.0" r="9" fill="#4338CA"/>
<text x="364.0" y="393.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">i</text>
<text x="380.0" y="393.0" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">Bên trong một dealing range lớn (ở vùng</text>
<text x="380.0" y="409.1" font-size="12.4" font-weight="700" fill="#4338CA" text-anchor="start">rẻ)</text>
<rect x="358.0" y="419.2" width="282.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
