<text x="930.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LIQUIDITY</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">BPR và thanh khoản: liquidity nằm ở swing, không nằm “trong” BPR</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ dựng sẵn: giá quét đáy cũ (SSL), quay đầu nhanh, để lại Bullish BPR. Mỗi nhãn chỉ một thứ khác nhau.</text>
