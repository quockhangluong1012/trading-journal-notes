<text x="45.3" y="406.8" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">SSL — đáy cũ</text>
<line x1="148.6" y1="190.8" x2="610.7" y2="190.8" stroke="#B91C1C" stroke-width="1.3" stroke-dasharray="6,4"/>
<text x="610.7" y="185.8" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end">BSL — đỉnh cũ, DOL tiềm năng</text>
<line x1="226.0" y1="485.2" x2="610.7" y2="485.2" stroke="#1F2937" stroke-width="1.3" stroke-dasharray="2,3"/>
<text x="610.7" y="498.2" font-size="10" font-weight="700" fill="#1F2937" text-anchor="end">đáy chữ V: cực trị mới, stop thường đặt dưới đây</text>
<circle cx="289.3" cy="509.2" r="9" fill="#1D4ED8"/>
<text x="289.3" y="513.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="495.8" cy="353.2" r="9" fill="#7C3AED"/>
<text x="495.8" y="357.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="646.0" y="86.0" width="326.0" height="122.0" rx="10" fill="#EAF2FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="658.0" y="110.5" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">① Sự kiện thanh khoản (sweep)</text>
<text x="658.0" y="130.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi xuống dưới đáy cũ rồi quay lên. Đây là sự kiện về</text>
<text x="658.0" y="146.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">VỊ TRÍ của đáy cũ, không phải về FVG.</text>
<rect x="646.0" y="218.0" width="326.0" height="122.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="658.0" y="242.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">② BPR</text>
<text x="658.0" y="262.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Hình thành từ leg rơi và leg bật. Nằm PHÍA TRÊN đáy chữ</text>
<text x="658.0" y="278.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">V. Mép BPR không phải là nơi tập trung lệnh dừng lỗ.</text>
<rect x="646.0" y="350.0" width="326.0" height="176.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="658.0" y="374.5" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Ba hệ quả thực tế</text>
<circle cx="661.0" cy="390.9" r="2.2" fill="#1F2937"/>
<text x="670.0" y="394.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Stop của lệnh Long tại BPR thường đặt dưới đáy chữ V</text>
<text x="670.0" y="409.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">— tức là dưới một cực trị mới, nơi thanh khoản mới có</text>
<text x="670.0" y="425.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">thể hình thành.</text>
<circle cx="661.0" cy="439.4" r="2.2" fill="#1F2937"/>
<text x="670.0" y="443.3" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Sweep làm câu chuyện đảo chiều hợp lý hơn, nhưng</text>
<text x="670.0" y="458.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">không bắt buộc để có BPR.</text>
<circle cx="661.0" cy="472.8" r="2.2" fill="#1F2937"/>
<text x="670.0" y="476.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đích của lệnh là thanh khoản đối diện (BSL), không phải</text>
<text x="670.0" y="491.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">mép bên kia của BPR.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">[HYPOTHESIS] BPR hình thành ngay sau một sweep thanh khoản ngoài (external) liên quan hơn BPR không có sweep. [BACKTEST REQUIRED].</text>
