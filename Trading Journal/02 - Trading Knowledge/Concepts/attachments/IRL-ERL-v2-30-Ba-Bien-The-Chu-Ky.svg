<svg viewBox="0 0 1000 543" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="541" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="895.7" y="22" width="76.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="933.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">BIẾN THỂ</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba biến thể của chu kỳ: tiếp diễn, đảo chiều, dao động trong range</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng các “mảnh ghép” IRL/ERL, ghép theo thứ tự khác nhau cho ra ba bức tranh khác nhau. Không cái nào là mặc định.</text>
<rect x="28.0" y="87.0" width="306.7" height="370.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">1 · Tiếp diễn (bậc thang)</text>
<rect x="74.5" y="290.6" width="242.2" height="16.1" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<rect x="145.7" y="246.9" width="170.9" height="13.8" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<rect x="216.9" y="205.5" width="99.7" height="13.8" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<line x1="88.7" y1="276.8" x2="316.7" y2="276.8" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="160.0" y1="235.4" x2="316.7" y2="235.4" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="231.2" y1="194.0" x2="316.7" y2="194.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="6,4"/>
<path d="M46.0,332.0 L88.7,276.8 L117.2,295.2 L160.0,235.4 L188.5,253.8 L231.2,194.0 L259.7,212.4 L302.4,152.6 L316.7,143.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="381.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">ERL → IRL → ERL cùng một hướng. Mỗi đỉnh cũ bị</text>
<text x="40.0" y="397.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">lấy; mỗi nhịp hồi chạm IRL rồi đi tiếp.</text>
<rect x="346.7" y="87.0" width="306.7" height="370.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="358.7" y="108.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">2 · Đảo chiều</text>
<rect x="364.7" y="171.0" width="270.7" height="138.0" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="364.7" y="171.0" width="270.7" height="138.0" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="364.7" y1="240.0" x2="635.3" y2="240.0" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="500.0" y="207.8" width="135.3" height="13.8" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.8"/>
<line x1="407.4" y1="171.0" x2="635.3" y2="171.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6,4"/>
<line x1="364.7" y1="309.0" x2="635.3" y2="309.0" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<path d="M364.7,286.0 L407.4,194.0 L435.9,221.6 L464.4,171.0 L478.6,157.2 L492.9,184.8 L521.4,217.0 L535.6,207.8 L564.1,253.8 L592.6,286.0 L621.1,313.6 L635.3,322.8" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.7" y="381.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Lấy ERL trên → về IRL bên trong → đi tới ERL dưới.</text>
<text x="358.7" y="397.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Dạng “con lắc” trọn vẹn.</text>
<rect x="665.3" y="87.0" width="306.7" height="370.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="677.3" y="108.0" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">3 · Dao động trong range</text>
<rect x="683.3" y="171.0" width="270.7" height="128.8" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="683.3" y="171.0" width="270.7" height="128.8" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="683.3" y1="235.4" x2="954.0" y2="235.4" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<line x1="683.3" y1="171.0" x2="954.0" y2="171.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6,4"/>
<line x1="683.3" y1="299.8" x2="954.0" y2="299.8" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<path d="M683.3,240.0 L711.8,180.2 L740.3,286.0 L768.8,194.0 L797.3,295.2 L825.8,175.6 L854.3,276.8 L882.8,189.4 L911.3,290.6 L939.8,203.2 L954.0,230.8" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="677.3" y="381.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Chạm gần hai biên nhiều lần nhưng không phá. IRL</text>
<text x="677.3" y="397.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">bị lấy liên tục; ERL tích tụ. Chờ một phía bị lấy rõ</text>
<text x="677.3" y="413.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">ràng.</text>
<rect x="28.0" y="471.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="495.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Câu hỏi phân biệt sau mỗi lần một ERL bị lấy: giá được CHẤP NHẬN bên ngoài (→ biến thể 1), quay vào có LỰC (→ biến thể 2), hay quay vào KHÔNG lực (→ biến</text>
<text x="42.0" y="511.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thể 3)?</text>
</svg>
