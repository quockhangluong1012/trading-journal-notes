<svg viewBox="0 0 1000 690" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="688" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="823.8" y="22" width="148.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="897.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">PREMIUM · DISCOUNT</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">BPR trong Premium / Discount — bốn ô, bốn câu chuyện</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Giả sử dealing range D1 đã chọn. Mỗi ô là một tổ hợp: loại BPR × vị trí. Màu thể hiện mức độ phù hợp với logic ICT “mua ở discount, bán ở premium” — không</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">phải xác suất.</text>
<text x="370.0" y="121.0" font-size="13.5" font-weight="700" fill="#0F9D74" text-anchor="middle">Bullish BPR</text>
<text x="782.0" y="121.0" font-size="13.5" font-weight="700" fill="#E0464B" text-anchor="middle">Bearish BPR</text>
<text x="150.0" y="222.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="end">Ở PREMIUM</text>
<text x="150.0" y="404.0" font-size="13" font-weight="700" fill="#0F7A5A" text-anchor="end">Ở DISCOUNT</text>
<rect x="170.0" y="133.0" width="400.0" height="170.0" rx="10" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="182.0" y="158.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">Mua ở vùng đắt</text>
<text x="182.0" y="178.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ít phù hợp logic ICT. Có thể là BPR tiếp diễn trong xu hướng tăng rất</text>
<text x="182.0" y="194.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">mạnh. Cần D1 bullish rõ + thêm bằng chứng. Hay bị xuyên khi giá cần</text>
<text x="182.0" y="210.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">về EQ.</text>
<rect x="582.0" y="133.0" width="400.0" height="170.0" rx="10" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="594.0" y="158.0" font-size="13" font-weight="700" fill="#0F7A5A" text-anchor="start">Bán ở vùng đắt</text>
<text x="594.0" y="178.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phù hợp nhất nếu D1 bearish và DOL ở dưới. Vẫn chỉ là VỊ TRÍ: cần</text>
<text x="594.0" y="194.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chờ M5 xác nhận.</text>
<rect x="170.0" y="315.0" width="400.0" height="170.0" rx="10" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="182.0" y="340.0" font-size="13" font-weight="700" fill="#0F7A5A" text-anchor="start">Mua ở vùng rẻ</text>
<text x="182.0" y="360.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phù hợp nhất nếu D1 bullish và DOL ở trên. Vẫn chỉ là VỊ TRÍ: cần chờ</text>
<text x="182.0" y="376.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">M5 xác nhận.</text>
<rect x="582.0" y="315.0" width="400.0" height="170.0" rx="10" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3"/>
<text x="594.0" y="340.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">Bán ở vùng rẻ</text>
<text x="594.0" y="360.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ít phù hợp logic ICT. Có thể là nhịp giảm tiếp diễn trong downtrend</text>
<text x="594.0" y="376.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">mạnh, hoặc một bẫy trước khi bật lên. Cần thêm bằng chứng.</text>
<rect x="28.0" y="503.0" width="944.0" height="132.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="40.0" y="528.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Bốn thứ KHÁC NHAU, đừng gộp làm một</text>
<circle cx="43.0" cy="544.9" r="2.2" fill="#1F2937"/>
<text x="52.0" y="548.9" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hướng của BPR (bullish/bearish) — giá đang ở phía nào của vùng.</text>
<circle cx="43.0" cy="563.5" r="2.2" fill="#1F2937"/>
<text x="52.0" y="567.5" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hướng khung lớn (D1 bias, DOL) — câu chuyện tổng.</text>
<circle cx="43.0" cy="582.1" r="2.2" fill="#1F2937"/>
<text x="52.0" y="586.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Vị trí của BPR (premium/discount) — rẻ hay đắt trong dealing range.</text>
<circle cx="43.0" cy="600.7" r="2.2" fill="#1F2937"/>
<text x="52.0" y="604.7" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hướng lệnh — chỉ quyết định sau khi ba thứ trên và xác nhận M5 cùng ủng hộ.</text>
<text x="28.0" y="670.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">“Bullish BPR = Buy”, “Discount = Buy” đều KHÔNG phải quy tắc giao dịch độc lập. Mỗi thứ chỉ là một mảnh của bức tranh.</text>
</svg>
