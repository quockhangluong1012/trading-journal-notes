<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Ranh giới mờ: Full Mitigation vs chuyển thành Breaker</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Từ cùng một điểm "đóng sát cạnh distal" — hai diễn biến hoàn toàn khác nhau ở nến kế tiếp</text>

  <!-- shared setup -->
  <rect x="24" y="72" width="712" height="130" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="94" font-size="12" font-weight="700" fill="#1F2937">Điểm chung: giá đi vào OB, đóng thân NGAY SÁT cạnh distal — chưa rõ hướng</text>
  <rect x="60" y="120" width="640" height="50" fill="#3B82F6" opacity="0.12"/>
  <text x="66" y="138" font-size="9.5" fill="#1D4ED8" font-weight="700">Bullish OB — proximal (trên) ... distal (dưới, râu)</text>
  <rect x="360" y="140" width="2" height="26" fill="#6B7280"/><rect x="354" y="144" width="12" height="20" fill="#6B7280" rx="1"/>
  <text x="320" y="188" font-size="9" fill="#6B7280">Nến X: đóng thân sát cạnh distal — chưa rõ</text>

  <!-- Panel A: bounces = full mitigation -->
  <rect x="24" y="212" width="344" height="212" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="234" font-size="13" font-weight="700" fill="#16A34A">A. Nến kế tiếp bật lại vào trong OB</text>

  <rect x="44" y="260" width="308" height="50" fill="#16A34A" opacity="0.1"/>
  <rect x="120" y="285" width="2" height="26" fill="#16A34A"/><rect x="114" y="289" width="12" height="20" fill="#16A34A" rx="1"/>
  <path d="M126,300 L170,260 L210,230" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="180" y="222" font-size="9.5" font-weight="700" fill="#166534">Đóng cửa trở lại phía trong OB</text>

  <rect x="44" y="336" width="308" height="70" rx="6" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="1"/>
  <text x="52" y="354" font-size="10" font-weight="700" fill="#166534">Kết luận: FULL MITIGATION hợp lệ</text>
  <text x="52" y="368" font-size="9.5" fill="#166534">OB còn sống — tiếp tục theo kế hoạch gốc</text>
  <text x="52" y="384" font-size="9.5" fill="#166534">(entry đã đặt tại OB vẫn hợp lệ)</text>

  <!-- Panel B: continues out = breaker -->
  <rect x="392" y="212" width="344" height="212" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="404" y="234" font-size="13" font-weight="700" fill="#B91C1C">B. Nến kế tiếp tiếp tục đóng NGOÀI OB</text>

  <rect x="412" y="260" width="308" height="50" fill="#DC2626" opacity="0.1"/>
  <rect x="488" y="290" width="2" height="26" fill="#DC2626"/><rect x="482" y="294" width="12" height="20" fill="#DC2626" rx="1"/>
  <path d="M494,310 L540,340 L580,365" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <text x="540" y="222" font-size="9.5" font-weight="700" fill="#B91C1C">Acceptance giữ NGOÀI OB (1-2 nến)</text>

  <rect x="412" y="336" width="308" height="70" rx="6" fill="#B91C1C" opacity="0.06" stroke="#B91C1C" stroke-width="1"/>
  <text x="420" y="354" font-size="10" font-weight="700" fill="#B91C1C">Kết luận: OB CHẾT → chuyển thành Breaker</text>
  <text x="420" y="368" font-size="9.5" fill="#B91C1C">Đóng vai trò NGƯỢC LẠI — cần MSS mới</text>
  <text x="420" y="384" font-size="9.5" fill="#B91C1C">theo hướng ngược để xác nhận, không đảo tự động</text>
</svg>
