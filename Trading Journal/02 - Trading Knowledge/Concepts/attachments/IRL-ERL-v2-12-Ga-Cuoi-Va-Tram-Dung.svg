<rect x="1" y="1" width="998" height="559" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="862.1" y="22" width="109.9" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="917.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">VÌ SAO TỒN TẠI</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">IRL là trạm dừng, ERL là ga cuối của một tuyến — tại sao cần phân biệt hai loại</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phân loại IRL/ERL trả lời hai câu hỏi khác nhau. ERL: “trong range này, giá có thể đi XA tới đâu?”. IRL: “trên đường đi, giá có thể DỪNG hoặc HỒI ở đâu?”.</text>
<rect x="28.0" y="87.0" width="944.0" height="250.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="80.0" y1="207.0" x2="860.0" y2="207.0" stroke="#334155" stroke-width="6"/>
<circle cx="230.0" cy="207.0" r="13" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="230.0" y="243.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">trạm 1</text>
<text x="230.0" y="258.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">= IRL</text>
<circle cx="400.0" cy="207.0" r="13" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="400.0" y="243.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">trạm 2</text>
<text x="400.0" y="258.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">= IRL</text>
<circle cx="570.0" cy="207.0" r="13" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
<text x="570.0" y="243.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">trạm 3</text>
<text x="570.0" y="258.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">= IRL</text>
<rect x="820.0" y="173.0" width="110.0" height="68.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="875.0" y="201.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">GA CUỐI</text>
<text x="875.0" y="220.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">= ERL</text>
<circle cx="80.0" cy="207.0" r="10" fill="#334155" stroke="none" stroke-width="1.2"/>
<text x="80.0" y="237.0" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">xuất phát</text>
<rect x="289.0" y="135.0" width="52.0" height="26.0" rx="6" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<rect x="295.0" y="140.0" width="12.0" height="9.0" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1.2"/>
<rect x="311.0" y="140.0" width="12.0" height="9.0" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1.2"/>
<circle cx="301.0" cy="162.0" r="4.5" fill="#111827" stroke="none" stroke-width="1.2"/>
<circle cx="329.0" cy="162.0" r="4.5" fill="#111827" stroke="none" stroke-width="1.2"/>
<text x="315.0" y="127.0" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">xe A: ghé từng trạm</text>
<path d="M190.0,167.0 Q222.0,157.0 230.0,189.0" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#ah0F766E)"/>
<path d="M360.0,167.0 Q392.0,157.0 400.0,189.0" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#ah0F766E)"/>
<path d="M530.0,167.0 Q562.0,157.0 570.0,189.0" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#ah0F766E)"/>
<rect x="674.0" y="135.0" width="52.0" height="26.0" rx="6" fill="#BE123C" stroke="none" stroke-width="1.2"/>
