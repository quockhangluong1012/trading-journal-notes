<rect x="696.0" y="140.0" width="12.0" height="9.0" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1.2"/>
<circle cx="686.0" cy="162.0" r="4.5" fill="#111827" stroke="none" stroke-width="1.2"/>
<circle cx="714.0" cy="162.0" r="4.5" fill="#111827" stroke="none" stroke-width="1.2"/>
<text x="700.0" y="127.0" font-size="10.5" font-weight="700" fill="#BE123C" text-anchor="middle">xe B: chạy thẳng, bỏ trạm</text>
<line x1="470.0" y1="133.0" x2="800.0" y2="133.0" stroke="#BE123C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ahBE123C)"/>
<text x="870.0" y="269.0" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="middle">tới ga cuối: hoặc quay đầu,</text>
<text x="870.0" y="283.0" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="middle">hoặc nối sang tuyến mới</text>
<rect x="28.0" y="349.0" width="466.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="28.0" y="359.0" width="4.0" height="108.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="44.0" y="372.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">ERL trả lời: giá có thể đi XA tới đâu?</text>
<text x="44.0" y="393.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">ERL đánh dấu giới hạn của “tuyến” hiện tại — đỉnh và đáy đã định ra range.</text>
<text x="44.0" y="410.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">Khi giá chạm ERL, câu chuyện của range này kết thúc: hoặc quay đầu, hoặc</text>
<text x="44.0" y="426.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">một range mới bắt đầu.</text>
<rect x="506.0" y="349.0" width="466.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="506.0" y="359.0" width="4.0" height="108.0" rx="2" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="522.0" y="372.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">IRL trả lời: giá có thể dừng/hồi ở đâu?</text>
<text x="522.0" y="393.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">IRL là những chỗ giá có thể ghé trên đường: đỉnh/đáy nhỏ, FVG. Chúng giúp</text>
<text x="522.0" y="410.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">chọn chỗ vào lệnh (POI) và đặt mục tiêu trung gian, nhưng không trạm nào</text>
<text x="522.0" y="426.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="436.0">“bắt buộc” phải ghé.</text>
<rect x="28.0" y="489.0" width="944.0" height="51.6" rx="10" fill="#FFFBEB" stroke="#F5D08A" stroke-width="1.2"/>
<text x="42.0" y="513.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giới hạn ẩn dụ: xe buýt chạy theo LỊCH, trạm nào cũng ghé. Giá thì không có lịch — có lúc ghé mọi trạm, có lúc chạy thẳng tới ga cuối (xe B), có lúc quay đầu</text>
<text x="42.0" y="529.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">giữa đường. Ẩn dụ chỉ giúp nhớ VAI TRÒ, không giúp đoán LỘ TRÌNH.</text>
</svg>
