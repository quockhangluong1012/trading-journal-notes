<text x="40.0" y="300.0" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start">H1 · SETUP</text>
<text x="40.0" y="326.0" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">Giá đã tới vùng</text>
<text x="40.0" y="341.7" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">chưa? Có Breaker H1</text>
<text x="40.0" y="357.5" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">bên trong không?</text>
<text x="196.0" y="300.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Cấu trúc H1 trong bối cảnh D1 (internal/external)</text>
<text x="196.0" y="326.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• OB gốc H1 + cực trị bị vi phạm + đóng qua swing</text>
<text x="196.0" y="352.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Trạng thái: NOT READY / MONITORING / EVENT</text>
<text x="196.0" y="378.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Mức M5 sẽ dùng: đánh dấu TRƯỚC</text>
<rect x="770.0" y="314.0" width="168.0" height="52.0" rx="8" fill="#F3F4F6" stroke="#0F766E" stroke-width="1.2"/>
