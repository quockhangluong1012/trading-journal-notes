<rect x="26.0" y="460.0" width="150.0" height="140.0" rx="10" fill="#6D28D9"/>
<rect x="160.0" y="460.0" width="16.0" height="140.0" rx="0" fill="#6D28D9"/>
<text x="40.0" y="490.0" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start">M5 · EXECUTION</text>
<text x="40.0" y="516.0" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">Có bằng chứng phản</text>
<text x="40.0" y="531.7" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">ứng ngay lúc này</text>
<text x="40.0" y="547.5" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">không?</text>
<text x="196.0" y="490.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Arrival vào vùng trong killzone</text>
<text x="196.0" y="516.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Sweep M5 + MSS M5 trên mức đã đánh dấu</text>
<text x="196.0" y="542.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• FVG/điểm vào, stop, target, R tối thiểu</text>
<text x="196.0" y="568.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Nếu không có → ghi lại, không ép</text>
<rect x="770.0" y="504.0" width="168.0" height="52.0" rx="8" fill="#F3F4F6" stroke="#6D28D9" stroke-width="1.2"/>
<text x="854.0" y="526.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">ĐẦU RA</text>
<text x="854.0" y="544.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="middle">Execution Card</text>
<text x="954.0" y="628.0" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">Không có cổng nào được mở chỉ vì “nhìn thấy một Breaker đẹp” trên khung thấp.</text>
