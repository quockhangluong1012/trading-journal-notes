<text x="854.0" y="164.0" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">Context Card</text>
<rect x="200.0" y="228.0" width="736.0" height="34.0" rx="17" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
<text x="216.0" y="242.0" font-size="10.8" font-weight="800" fill="#B45309" text-anchor="start">GATE G1 (D1→H1) + điều kiện Breaker</text>
<text x="216.0" y="256.0" font-size="10" font-weight="500" fill="#1F2937" text-anchor="start">Breaker D1 CONFIRMED, chưa INVALIDATED/EXPIRED · giá đang tiến về vùng · DOL chưa bị lấy · không có sự kiện tin lớn</text>
