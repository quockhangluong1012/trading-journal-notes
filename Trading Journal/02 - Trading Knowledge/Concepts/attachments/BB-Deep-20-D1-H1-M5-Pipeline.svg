<text x="216.0" y="432.0" font-size="10.8" font-weight="800" fill="#B45309" text-anchor="start">GATE G2 (H1→M5) + điều kiện Breaker</text>
<text x="216.0" y="446.0" font-size="10" font-weight="500" fill="#1F2937" text-anchor="start">Giá đã vào/sát vùng · đang trong killzone · mức SSL &amp; swing M5 đã đánh dấu trước · còn đủ khoảng cách tới target</text>
