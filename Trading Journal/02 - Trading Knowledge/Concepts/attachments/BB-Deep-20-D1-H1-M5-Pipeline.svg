<text x="40.0" y="110.0" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start">D1 · CONTEXT</text>
<text x="40.0" y="136.0" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">Tôi đang ở đâu?</text>
<text x="40.0" y="151.7" font-size="11.4" font-weight="600" fill="#FFFFFF" text-anchor="start">Vùng nào đáng chờ?</text>
<text x="196.0" y="110.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Cấu trúc lớn + swing cấp L4–L5</text>
<text x="196.0" y="136.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Dealing range, EQ, P/D (ghi range nào)</text>
<text x="196.0" y="162.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• Breaker D1: trạng thái + ranh giới + t_avail</text>
<text x="196.0" y="188.0" font-size="11.8" font-weight="500" fill="#1F2937" text-anchor="start">• DOL ứng viên, kịch bản A/B, điều kiện hết hạn</text>
<rect x="770.0" y="124.0" width="168.0" height="52.0" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.2"/>
