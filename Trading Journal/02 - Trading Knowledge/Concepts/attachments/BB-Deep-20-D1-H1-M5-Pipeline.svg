<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">D1 → H1 → M5 cho Breaker — mỗi khung một câu hỏi, một đầu ra, một cổng</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Kế thừa hệ thống Context Card → Setup Card → Execution Card và gate G1/G2 của vault; dưới đây chỉ ghi phần RIÊNG cho Breaker.</text>
<rect x="877.2" y="18" width="76.8" height="22" rx="11" fill="#F3F4F6" stroke="#D8DBE2"/>
<text x="915.6" y="33.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">ĐA KHUNG</text>
