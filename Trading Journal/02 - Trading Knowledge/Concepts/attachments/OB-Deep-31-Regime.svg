<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="620" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">OB và regime thị trường — không có 'một mô hình OB' cho mọi trạng thái</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi ô = một GIẢ THUYẾT + biến để đo. OB-Sim-07: regime đổi E[R] của MỌI vùng — phải so với đối chứng trong CÙNG regime.</text>
<rect x="26.0" y="84.0" width="300.0" height="182.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="40.0" y="110.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">Trend mạnh, pullback nông</text>
<text x="40.0" y="140.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">OB lớn hiếm khi được test (v1 §14.8);</text>
<text x="40.0" y="157.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">OB internal nhỏ trong pullback = continuation</text>
<text x="40.0" y="174.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Đo: fill rate, missed-trade, R/tuần</text>
<rect x="40.0" y="231.0" width="62.4" height="19.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="71.2" y="244.0" font-size="9" font-weight="600" fill="#15803D" text-anchor="middle">HYP-OB-019</text>
<rect x="338.0" y="84.0" width="300.0" height="182.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="352.0" y="110.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Trend lành mạnh, pullback sâu</text>
<text x="352.0" y="140.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">bối cảnh 'sách giáo khoa' của ICT;</text>
<text x="352.0" y="157.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">OB tại origin leg vs OB giữa leg (v1 §14.1)</text>
<text x="352.0" y="174.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Đo: E[R] theo ob_position_in_leg</text>
<rect x="352.0" y="231.0" width="62.4" height="19.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
<text x="383.2" y="244.0" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">HYP-OB-014</text>
<rect x="650.0" y="84.0" width="300.0" height="182.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="664.0" y="110.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">Range / consolidation</text>
<text x="664.0" y="140.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">'OB' thường chỉ là biên range dao động;</text>
<text x="664.0" y="157.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">BOS internal liên tục — nhiều OB giả</text>
<text x="664.0" y="174.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Đo: E[R] theo pd_pos; ADX/VR làm biến</text>
<rect x="664.0" y="231.0" width="62.4" height="19.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="695.2" y="244.0" font-size="9" font-weight="600" fill="#B45309" text-anchor="middle">HYP-OB-008</text>
<rect x="26.0" y="280.0" width="300.0" height="182.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="40.0" y="306.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Biến động thấp (co hẹp)</text>
<text x="40.0" y="336.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">displacement 'trông mạnh' vì ATR co lại;</text>
<text x="40.0" y="353.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">ngưỡng ATR bị thổi phồng (v1 §16.4)</text>
<text x="40.0" y="370.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Đo: percentile theo instrument × phiên</text>
<rect x="40.0" y="427.0" width="62.4" height="19.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="71.2" y="440.0" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">HYP-OB-002</text>
<rect x="338.0" y="280.0" width="300.0" height="182.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="352.0" y="306.0" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="start">Biến động cao / mở rộng</text>
<text x="352.0" y="336.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">OB rộng, stop xa, R:R xấu;</text>
<text x="352.0" y="353.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">trượt giá lớn hơn khi khớp</text>
<text x="352.0" y="370.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Đo: width/ATR; slippage thực</text>
<rect x="352.0" y="427.0" width="62.4" height="19.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="383.2" y="440.0" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">HYP-OB-018</text>
<rect x="650.0" y="280.0" width="300.0" height="182.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="664.0" y="306.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">Sốc tin tức</text>
<text x="664.0" y="336.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">thân nến lớn do RÚT thanh khoản, không do</text>
<text x="664.0" y="353.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">dòng tiền chủ động (v1 §14.2) — OB 'ảo'</text>
<text x="664.0" y="370.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Đo: news_within_N; loại khỏi sản xuất OB</text>
<rect x="664.0" y="427.0" width="62.4" height="19.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="695.2" y="440.0" font-size="9" font-weight="600" fill="#B91C1C" text-anchor="middle">HYP-OB-020</text>
<rect x="26.0" y="482.0" width="928.0" height="124.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="38.0" y="502.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="start">Kết quả mô phỏng (OB-Sim-07) — đọc cẩn thận</text>
<text x="38.0" y="520.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">• Random walk: OB +0.00R, đối chứng hướng ngẫu nhiên −0.01R. Mean-reverting: OB +0.01R, đối chứng +0.04R. Trending: OB −0.02R, đối chứng hướng ngẫu nhiên −0.18R.</text>
<text x="38.0" y="537.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">• Trong regime trending, OB 'thắng' đối chứng +0.16R — nhưng một đối chứng chỉ cần CÙNG HƯỚNG momentum 1h cho −0.01R: phần hơn của OB = thông tin về HƯỚNG,</text>
<text x="38.0" y="554.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">  thứ một quy tắc momentum đơn giản cũng có. Nếu trên dữ liệu thật OB có edge trong trend, phải chứng minh nó hơn quy tắc momentum, không chỉ hơn vùng ngẫu nhiên.</text>
<text x="38.0" y="571.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">• Hệ quả thực hành: báo cáo kết quả OB theo regime (ví dụ VR(60/5), ADX, ATR percentile) — một con số E[R] gộp có thể che hai hiệu ứng ngược dấu.</text>
</svg>