<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="760" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="758" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">EURUSD Short — thắng theo template Asia→London sweep→NY reversal (+2.4R)</text>
  <text x="32" y="66" font-size="15" fill="#787b86">EURUSD, Asia → London → NY (tái dựng minh họa từ mẫu backtest)</text>

  <text x="90" y="700" font-size="13" fill="#ff9800">Asia 02:00-08:00</text>
  <text x="380" y="700" font-size="13" fill="#ff9800">London 08:00-10:30</text>
  <text x="750" y="700" font-size="13" fill="#ff9800">NY 13:30-15:30</text>

  <!-- Asia range -->
  <rect x="80" y="420" width="220" height="60" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="86" y="412" font-size="13" fill="#4a90d9">Asia range 1.0862-1.0884</text>

  <g>
    <rect x="110" y="430" width="18" height="30" fill="#26a69a" rx="1"/><line x1="119" y1="420" x2="119" y2="460" stroke="#26a69a"/>
    <rect x="150" y="425" width="18" height="35" fill="#ef5350" rx="1"/><line x1="159" y1="415" x2="159" y2="465" stroke="#ef5350"/>
    <rect x="190" y="435" width="18" height="25" fill="#26a69a" rx="1"/><line x1="199" y1="425" x2="199" y2="460" stroke="#26a69a"/>
  </g>
  <line x1="80" y1="420" x2="1180" y2="420" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="1080" y="414" font-size="12" fill="#b48ead">Asia High 1.0884</text>
  <line x1="80" y1="480" x2="1180" y2="480" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="1080" y="500" font-size="12" fill="#b48ead">Asia Low 1.0862</text>

  <!-- London sweeps Asia High with moderate depth ~0.5% ADR then reverses -->
  <g>
    <rect x="400" y="350" width="20" height="70" fill="#26a69a" rx="1"/><line x1="410" y1="335" x2="410" y2="440" stroke="#26a69a" stroke-width="2"/>
  </g>
  <text x="360" y="320" font-size="13" fill="#f2c94c">London wick vuot Asia High → 1.0895 (~0.4% ADR)</text>

  <!-- reversal candles hold below within 1-2 candles -->
  <g>
    <rect x="440" y="380" width="18" height="40" fill="#ef5350" rx="1"/><line x1="449" y1="365" x2="449" y2="430" stroke="#ef5350"/>
    <rect x="480" y="410" width="18" height="50" fill="#ef5350" rx="1"/><line x1="489" y1="395" x2="489" y2="470" stroke="#ef5350"/>
  </g>
  <text x="440" y="490" font-size="13" fill="#787b86">Dong lai duoi Asia High ngay nen ke tiep</text>
  <text x="440" y="508" font-size="13" fill="#787b86">-&gt; xac nhan sweep, khong phai breakout</text>

  <!-- entry short -->
  <line x1="500" y1="420" x2="500" y2="370" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="500,368 494,380 506,380" fill="#4a90d9"/>
  <text x="440" y="360" font-size="13" fill="#4a90d9">Entry Short 1.0878 (retest CE London sweep)</text>

  <!-- NY continuation down to Asia Low and beyond -->
  <g>
    <rect x="750" y="440" width="18" height="50" fill="#ef5350" rx="1"/><line x1="759" y1="425" x2="759" y2="510" stroke="#ef5350"/>
    <rect x="790" y="480" width="18" height="60" fill="#ef5350" rx="1"/><line x1="799" y1="465" x2="799" y2="560" stroke="#ef5350"/>
    <rect x="830" y="530" width="18" height="55" fill="#ef5350" rx="1"/><line x1="839" y1="515" x2="839" y2="605" stroke="#ef5350"/>
  </g>

  <line x1="700" y1="600" x2="1200" y2="600" stroke="#f2c94c" stroke-dasharray="6 4"/>
  <text x="1080" y="594" font-size="13" fill="#f2c94c">TP 1.0838 (duoi Asia Low)</text>
  <circle cx="870" cy="600" r="7" fill="#26a69a"/>
  <text x="885" y="620" font-size="14" fill="#26a69a">+2.4R</text>

  <rect x="900" y="150" width="330" height="200" fill="#1c2030" stroke="#f2c94c" stroke-dasharray="6 4"/>
  <text x="916" y="178" font-size="15" font-weight="bold" fill="#f2c94c">Checklist template (EC-B3)</text>
  <text x="916" y="204" font-size="13" fill="#d1d4dc">Asia range ro ret: co</text>
  <text x="916" y="224" font-size="13" fill="#d1d4dc">London sweep dung 1 canh: co (Asia High)</text>
  <text x="916" y="244" font-size="13" fill="#d1d4dc">Do sau sweep hop ly (~0.4% ADR): co</text>
  <text x="916" y="264" font-size="13" fill="#d1d4dc">Giu duoi muc ngay 1-2 nen: co</text>
  <text x="916" y="290" font-size="13" fill="#26a69a">-&gt; Du dieu kien template, entry theo</text>
  <text x="916" y="310" font-size="13" fill="#26a69a">huong doi chieu voi London sweep</text>

  <text x="60" y="730" font-size="13" fill="#565b66">Tái dựng minh họa từ mẫu backtest EURUSD H1/M15 — không phải giao dịch thật.</text>
</svg>
