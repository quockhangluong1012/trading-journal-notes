<svg viewBox="0 0 980 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="800" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cây quyết định MSS (v0.1) — từ 'có mức không?' tới 'có lệnh không?'</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi câu hỏi có đáp án đo được tại close nến. 'Không' cũng là output hợp lệ — và là output phổ biến nhất.</text>
<rect x="40.0" y="92.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="122.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q1</text>
<text x="96.0" y="114.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Có mức tham chiếu ĐÃ XÁC NHẬN (known_at &lt; t) ở lớp/khung đã khai báo?</text>
<line x1="640.0" y1="117.0" x2="690.0" y2="117.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="98.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="122.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → không phân tích MSS</text>
<line x1="340.0" y1="142.0" x2="340.0" y2="162.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="156.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="164.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="194.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q2</text>
<text x="96.0" y="186.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Swing đó có ý nghĩa (Level ≥ 2 ở khung exec, qua swing gate SG1–SG3 của 57 §10.2)?</text>
<line x1="640.0" y1="189.0" x2="690.0" y2="189.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="170.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="194.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → bỏ qua / ưu tiên thấp</text>
<line x1="340.0" y1="214.0" x2="340.0" y2="234.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="228.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="236.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="266.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q3</text>
<text x="96.0" y="258.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Close vượt mức (+ε)? (wick-only = PROBE)</text>
<line x1="640.0" y1="261.0" x2="690.0" y2="261.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="242.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="266.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → chờ; probe → logic sweep</text>
<line x1="340.0" y1="286.0" x2="340.0" y2="306.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="300.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="308.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="338.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q4</text>
<text x="96.0" y="330.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Cú phá NGƯỢC trạng thái của lớp?</text>
<line x1="640.0" y1="333.0" x2="690.0" y2="333.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="314.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="338.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → đó là BOS (continuation)</text>
<line x1="340.0" y1="358.0" x2="340.0" y2="378.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="372.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="380.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="410.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q5</text>
<text x="96.0" y="402.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Displacement đạt ngưỡng (leg ≥ x·ATR / thân ≥ y·ATR)? → G1</text>
<line x1="640.0" y1="405.0" x2="690.0" y2="405.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="386.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="410.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → weak break (ghi, không trade)</text>
<line x1="340.0" y1="430.0" x2="340.0" y2="450.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="444.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="452.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="482.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q6</text>
<text x="96.0" y="467.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Hướng MSS khớp bối cảnh: D1 bias + trạng thái H1 (hoặc playbook ngược trend</text>
<text x="96.0" y="482.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">riêng)?</text>
<line x1="640.0" y1="477.0" x2="690.0" y2="477.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="458.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="482.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → không trade (không dùng để đảo bias)</text>
<line x1="340.0" y1="502.0" x2="340.0" y2="522.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="516.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="524.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="554.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q7</text>
<text x="96.0" y="539.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Vị trí: tại/ngay sau POI H1, đúng nửa premium/discount; có liquidity event</text>
<text x="96.0" y="554.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">ex-ante?</text>
<line x1="640.0" y1="549.0" x2="690.0" y2="549.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="530.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="554.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → hạ hạng hoặc bỏ (HYP-MSS-003/005)</text>
<line x1="340.0" y1="574.0" x2="340.0" y2="594.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="588.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="596.0" width="600.0" height="50.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="56.0" y="626.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start">Q8</text>
<text x="96.0" y="618.0" font-size="10.2" font-weight="600" fill="#1F2937" text-anchor="start">Còn chỗ tới chướng ngại đầu tiên ≥ 2R và invalidation (I4) đặt được?</text>
<line x1="640.0" y1="621.0" x2="690.0" y2="621.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="692.0" y="602.0" width="262.0" height="38.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="823.0" y="626.0" font-size="9.6" font-weight="600" fill="#B91C1C" text-anchor="middle">Không → bỏ (v1 W5)</text>
<line x1="340.0" y1="646.0" x2="340.0" y2="666.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="348.0" y="660.0" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">Có</text>
<rect x="40.0" y="668.0" width="600.0" height="50.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="56.0" y="698.0" font-size="13" font-weight="800" fill="#15803D" text-anchor="start">→</text>
<text x="96.0" y="683.0" font-size="10.2" font-weight="700" fill="#1F2937" text-anchor="start">Execution model: chờ retrace vào FVG/OB của leg; entry ở giá khả thi; stop I4;</text>
<text x="96.0" y="698.0" font-size="10.2" font-weight="700" fill="#1F2937" text-anchor="start">target = pool/DOL</text>
<rect x="26.0" y="740.0" width="928.0" height="46.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="761.0" font-size="10.1" font-weight="600" fill="#334155" text-anchor="start">Q1–Q5 = nhận diện (khách quan hóa được). Q6–Q8 = bối cảnh &amp; quản trị (nơi phần lớn 'edge', nếu có, sẽ nằm). Mọi ngưỡng: HEURISTIC · BACKTEST REQUIRED.</text>
<text x="42.0" y="777.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">Thứ tự hỏi có chủ đích: câu rẻ và khách quan trước, câu đắt và chủ quan sau — để 'không' xuất hiện sớm nhất có thể.</text>
</svg>