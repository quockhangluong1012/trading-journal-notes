<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="538" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="894.3" y="22" width="77.7" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="933.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">BIÊN BPR</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cách lấy hai mép của BPR — không cần công thức</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ minh họa: Bullish FVG 1.1000–1.1020, Bearish FVG 1.1010–1.1030. Đặt hai dải cạnh nhau rồi chỉ giữ phần nằm trong CẢ HAI dải.</text>
<line x1="60.0" y1="446.0" x2="480.0" y2="446.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="54.0" y="450.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">1.0990</text>
<line x1="60.0" y1="378.0" x2="480.0" y2="378.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="54.0" y="382.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">1.1000</text>
<line x1="60.0" y1="310.0" x2="480.0" y2="310.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="54.0" y="314.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">1.1010</text>
<line x1="60.0" y1="242.0" x2="480.0" y2="242.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="54.0" y="246.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">1.1020</text>
<line x1="60.0" y1="174.0" x2="480.0" y2="174.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="54.0" y="178.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">1.1030</text>
<line x1="60.0" y1="106.0" x2="480.0" y2="106.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="54.0" y="110.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">1.1040</text>
<rect x="100.0" y="242.0" width="90.0" height="136.0" rx="3" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.6"/>
<text x="145.0" y="234.0" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="middle">Bullish FVG</text>
<rect x="220.0" y="174.0" width="90.0" height="136.0" rx="3" fill="#FDE3E4" stroke="#E0464B" stroke-width="1.6"/>
<text x="265.0" y="166.0" font-size="12" font-weight="700" fill="#E0464B" text-anchor="middle">Bearish FVG</text>
<rect x="350.0" y="242.0" width="110.0" height="68.0" rx="3" fill="#E9DDFF" stroke="#7C3AED" stroke-width="2"/>
<text x="405.0" y="234.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<line x1="100.0" y1="310.0" x2="460.0" y2="310.0" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5,3"/>
<line x1="100.0" y1="242.0" x2="460.0" y2="242.0" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5,3"/>
<text x="405.0" y="281.0" font-size="11.5" font-weight="700" fill="#7C3AED" text-anchor="middle">1.1010–1.1020</text>
<text x="145.0" y="348.0" font-size="10.5" font-weight="700" fill="#0F9D74" text-anchor="middle">chỉ xanh</text>
<text x="265.0" y="212.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">chỉ đỏ</text>
<rect x="540.0" y="86.0" width="432.0" height="112.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="552.0" y="111.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">Mép DƯỚI của BPR</text>
<text x="552.0" y="131.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">So hai mép dưới: 1.1000 (xanh) và 1.1010 (đỏ). Lấy mép nào CAO hơn →</text>
<text x="552.0" y="147.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">1.1010. Dưới mức này chỉ có màu xanh.</text>
<rect x="540.0" y="208.0" width="432.0" height="112.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="552.0" y="233.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">Mép TRÊN của BPR</text>
<text x="552.0" y="253.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">So hai mép trên: 1.1020 (xanh) và 1.1030 (đỏ). Lấy mép nào THẤP hơn →</text>
<text x="552.0" y="269.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">1.1020. Trên mức này chỉ có màu đỏ.</text>
<rect x="540.0" y="330.0" width="432.0" height="136.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="552.0" y="355.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Kiểm tra nhanh</text>
<circle cx="555.0" cy="371.9" r="2.2" fill="#1F2937"/>
<text x="564.0" y="375.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nếu mép dưới vừa chọn còn THẤP hơn mép trên vừa chọn → có BPR.</text>
<circle cx="555.0" cy="390.7" r="2.2" fill="#1F2937"/>
<text x="564.0" y="394.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nếu bằng nhau hoặc cao hơn → hai dải không có phần chung → không</text>
<text x="564.0" y="410.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">có BPR.</text>
<circle cx="555.0" cy="425.5" r="2.2" fill="#1F2937"/>
<text x="564.0" y="429.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phần “chỉ xanh”, “chỉ đỏ” vẫn là một phần của từng FVG, nhưng không</text>
<text x="564.0" y="445.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">thuộc BPR.</text>
<text x="28.0" y="520.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Mẹo thực hành: luôn ghi bốn mức giá ra giấy (hai mép của mỗi FVG) trước khi vẽ hộp BPR. Mắt rất dễ “thấy” phần chồng khi thật ra không có.</text>
</svg>
