<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD và Displacement là hai thứ khác nhau — bảng 2×2</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Displacement = cú di chuyển mạnh, thân nến lớn, thường để lại FVG. CISD = đóng cửa vượt open đầu chặng. Có thể có cái này mà</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">không có cái kia.</text>
