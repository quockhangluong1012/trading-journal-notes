<text x="796.0" y="154.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nến cuối đóng vượt sát mức.</text>
<text x="796.0" y="171.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hợp lệ theo định nghĩa,</text>
<text x="796.0" y="187.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nhưng yếu: không có dấu vết</text>
