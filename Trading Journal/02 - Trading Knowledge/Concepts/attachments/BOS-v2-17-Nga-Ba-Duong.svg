<svg viewBox="0 0 900 470" width="900" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Khoảnh khắc giá vừa vượt đỉnh cũ: ba tương lai, và ta chưa biết cái nào</title>
<desc>Khoảnh khắc giá vừa vượt đỉnh cũ: ba tương lai, và ta chưa biết cái nào. Phần nét liền là quá khứ đã xảy ra. Ba nhánh nét đứt là những điều CÓ THỂ xảy ra. Gắn nhãn BOS ngay bây giờ là đang đoán tương lai.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Khoảnh khắc giá vừa vượt đỉnh cũ: ba tương lai, và ta chưa biết cái nào</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Phần nét liền là quá khứ đã xảy ra. Ba nhánh nét đứt là những điều CÓ THỂ xảy ra. Gắn nhãn BOS ngay bây giờ là đang đoán tương lai.</tspan></text>
<rect x="24.0" y="92.0" width="852.0" height="290.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<line x1="164.2" y1="204.8" x2="847.6" y2="204.8" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="164.2" y="199.8" font-size="11" fill="#D85A30" text-anchor="start"><tspan>đỉnh cũ</tspan></text>
<polyline points="40.0,333.8 164.2,204.8 257.4,269.2 387.9,195.1" fill="none" stroke="#1F2937" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="387.9" y1="100.0" x2="387.9" y2="372.0" stroke="#1F2937" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
<text x="387.9" y="117.7" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">BÂY GIỜ</tspan></text>
<rect x="387.9" y="111.2" width="459.7" height="248.3" rx="2" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8" opacity="0.18"/>
<polyline points="387.9,195.1 425.2,224.1 505.9,275.7 599.1,301.5 692.3,314.4" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<polyline points="387.9,195.1 437.6,185.4 499.7,211.2 574.2,191.8 648.8,230.5 723.3,217.7" fill="none" stroke="#B45309" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<polyline points="387.9,195.1 431.4,172.5 474.8,185.4 568.0,133.8 661.2,120.9" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="669.2" y="120.9" font-size="11.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Ngã 3: ở lại phía trên, đi tiếp</tspan></text>
<text x="669.2" y="135.9" font-size="11.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">→ BOS được chấp nhận</tspan></text>
<text x="731.3" y="217.7" font-size="11.5" fill="#B45309" text-anchor="start"><tspan font-weight="700">Ngã 2: lưỡng lự quanh mức</tspan></text>
<text x="731.3" y="232.7" font-size="11.5" fill="#B45309" text-anchor="start"><tspan font-weight="700">→ phá thất bại chậm</tspan></text>
<text x="700.3" y="314.4" font-size="11.5" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Ngã 1: quay lại ngay</tspan></text>
<text x="700.3" y="329.4" font-size="11.5" fill="#DC2626" text-anchor="start"><tspan font-weight="700">→ quét (sweep)</tspan></text>
<rect x="24.0" y="396.0" width="852.0" height="62.0" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.0"/>
<rect x="24.0" y="396.0" width="5.0" height="62.0" rx="2" fill="#2563EB"/>
<text x="38.0" y="416.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Câu trả lời đúng duy nhất ở thời điểm này: CHƯA BIẾT</tspan></text>
<text x="38.0" y="435.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Trạng thái = CHỜ (PENDING). Việc của ta là khai báo trước: &quot;nếu nến đóng trên và giữ được trong cửa sổ X thì gọi là BOS; nếu đóng ngược vào trong</tspan></text>
<text x="38.0" y="451.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>thì là quét/phá thất bại&quot;.</tspan></text>
</svg>
