<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Viên gạch đầu tiên: cây nến và điểm xoay (swing)</text>
<rect x="889.7" y="23.0" width="82.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="930.8" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Mọi thuật ngữ phía sau đều xây từ hai thứ này. Nến tăng = đóng cửa cao hơn mở cửa (up-close). Nến giảm = đóng cửa thấp hơn mở cửa</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">(down-close).</text>
<rect x="28.0" y="112.9" width="460.0" height="430.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="138.4" font-size="13.5" font-weight="700" fill="#111827" data-bx="41.0,477.0">Một cây nến kể bốn con số</text>
<line x1="120.0" y1="192.9" x2="120.0" y2="462.9" stroke="#0E9F6E" stroke-width="2.5" stroke-linecap="round"/>
<rect x="96.0" y="242.9" width="48.0" height="170.0" rx="3" fill="#0E9F6E"/>
<text x="120.0" y="172.9" font-size="12.5" font-weight="700" fill="#0E9F6E" text-anchor="middle">Nến TĂNG (up-close)</text>
<line x1="148.0" y1="192.9" x2="164.0" y2="192.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="168.0" y="196.9" font-size="11" font-weight="400" fill="#111827">cao nhất (high)</text>
<line x1="148.0" y1="242.9" x2="164.0" y2="242.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="168.0" y="246.9" font-size="11" font-weight="400" fill="#111827">đóng cửa (close)</text>
<line x1="148.0" y1="412.9" x2="164.0" y2="412.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="168.0" y="416.9" font-size="11" font-weight="400" fill="#111827">mở cửa (open)</text>
<line x1="148.0" y1="462.9" x2="164.0" y2="462.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="168.0" y="466.9" font-size="11" font-weight="400" fill="#111827">thấp nhất (low)</text>
<text x="90.0" y="331.9" font-size="11" font-weight="700" fill="#0E9F6E" text-anchor="end">thân</text>
<text x="112.0" y="218.9" font-size="11" font-weight="700" fill="#0E9F6E" text-anchor="end">râu</text>
<line x1="330.0" y1="192.9" x2="330.0" y2="462.9" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/>
<rect x="306.0" y="242.9" width="48.0" height="170.0" rx="3" fill="#E5484D"/>
<text x="330.0" y="172.9" font-size="12.5" font-weight="700" fill="#E5484D" text-anchor="middle">Nến GIẢM (down-close)</text>
<line x1="358.0" y1="192.9" x2="374.0" y2="192.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="378.0" y="196.9" font-size="11" font-weight="400" fill="#111827">cao nhất (high)</text>
<line x1="358.0" y1="242.9" x2="374.0" y2="242.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="378.0" y="246.9" font-size="11" font-weight="400" fill="#111827">mở cửa (open)</text>
<line x1="358.0" y1="412.9" x2="374.0" y2="412.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="378.0" y="416.9" font-size="11" font-weight="400" fill="#111827">đóng cửa (close)</text>
<line x1="358.0" y1="462.9" x2="374.0" y2="462.9" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<text x="378.0" y="466.9" font-size="11" font-weight="400" fill="#111827">thấp nhất (low)</text>
<text x="300.0" y="331.9" font-size="11" font-weight="700" fill="#E5484D" text-anchor="end">thân</text>
<text x="322.0" y="218.9" font-size="11" font-weight="700" fill="#E5484D" text-anchor="end">râu</text>
<text x="42.0" y="496.9" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,475.0">Thân = quãng giữa mở cửa và đóng cửa. Râu = phần giá đã tới nhưng</text>
<text x="42.0" y="514.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,475.0">không ở lại. Râu rất quan trọng trong bài này: “chạm” khác với “đóng cửa</text>
<text x="42.0" y="531.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,475.0">qua”.</text>
<rect x="512.0" y="112.9" width="460.0" height="430.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="138.4" font-size="13.5" font-weight="700" fill="#111827" data-bx="525.0,961.0">Swing = chỗ giá quay đầu</text>
<line x1="548.0" y1="348.5" x2="548.0" y2="398.1" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
<rect x="538.0" y="354.7" width="20.0" height="37.2" rx="2" fill="#0E9F6E"/>
<line x1="584.0" y1="298.9" x2="584.0" y2="360.9" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
<rect x="574.0" y="311.3" width="20.0" height="43.4" rx="2" fill="#0E9F6E"/>
<line x1="620.0" y1="236.9" x2="620.0" y2="323.7" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
<rect x="610.0" y="298.9" width="20.0" height="12.4" rx="2" fill="#0E9F6E"/>
<line x1="656.0" y1="286.5" x2="656.0" y2="348.5" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
<rect x="646.0" y="298.9" width="20.0" height="43.4" rx="2" fill="#E5484D"/>
<line x1="692.0" y1="329.9" x2="692.0" y2="391.9" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
<rect x="682.0" y="342.3" width="20.0" height="37.2" rx="2" fill="#E5484D"/>
<line x1="786.0" y1="249.3" x2="786.0" y2="305.1" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
<rect x="776.0" y="261.7" width="20.0" height="37.2" rx="2" fill="#E5484D"/>
<line x1="822.0" y1="292.7" x2="822.0" y2="354.7" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
<rect x="812.0" y="298.9" width="20.0" height="43.4" rx="2" fill="#E5484D"/>
<line x1="858.0" y1="329.9" x2="858.0" y2="416.7" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
<rect x="848.0" y="342.3" width="20.0" height="12.4" rx="2" fill="#E5484D"/>
<line x1="894.0" y1="298.9" x2="894.0" y2="360.9" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
<rect x="884.0" y="305.1" width="20.0" height="49.6" rx="2" fill="#0E9F6E"/>
<line x1="930.0" y1="261.7" x2="930.0" y2="317.5" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
<rect x="920.0" y="267.9" width="20.0" height="37.2" rx="2" fill="#0E9F6E"/>
<circle cx="620.0" cy="236.9" r="5.0" fill="#475569"/>
<text x="620.0" y="224.9" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">SWING HIGH</text>
<circle cx="858.0" cy="416.7" r="5.0" fill="#475569"/>
<text x="858.0" y="438.7" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">SWING LOW</text>
<text x="620.0" y="174.9" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Đỉnh: nến giữa cao hơn hai bên</text>
<text x="858.0" y="174.9" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Đáy: nến giữa thấp hơn hai bên</text>
<text x="526.0" y="496.9" font-size="12" font-weight="400" fill="#6B7280" data-bx="525.0,959.0">Giống ngọn đồi và thung lũng. Chỉ biết đó là đỉnh SAU KHI nến bên phải</text>
<text x="526.0" y="514.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="525.0,959.0">đã đóng — luôn chậm một nhịp. Đây là mầm của hindsight.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trong note này: “đáy cũ”, “đỉnh giữa”, “đáy mới” đều là các swing. Breaker được định nghĩa bằng thứ tự các swing đó bị vượt qua.</text>
