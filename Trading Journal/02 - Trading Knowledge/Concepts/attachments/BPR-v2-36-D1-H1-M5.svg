<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="869.7" y="22" width="102.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="920.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">D1 → H1 → M5</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">BPR trong D1 → H1 → M5: ba khung, ba câu hỏi</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sơ đồ dựng sẵn. D1 cho biết giá đang ở đâu. H1 cho biết vùng nào đáng chờ. M5 cho biết có điều kiện vào lệnh hay chưa. BPR chỉ là một mảnh ở D1/H1.</text>
<rect x="28.0" y="86.0" width="304.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">D1 — CONTEXT: tôi đang ở đâu?</text>
<polyline points="50.8,305.9 78.0,278.5 91.6,209.7 105.2,192.2 118.8,198.7 132.4,257.8 159.6,327.7 173.2,305.9 200.4,387.9 227.6,349.6 254.8,294.9 282.0,256.7 302.4,238.1" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112.7" y="218.4" width="202.6" height="32.8" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="114.7" y="214.4" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="start">D1 Bearish BPR</text>
<line x1="167.1" y1="393.3" x2="315.3" y2="393.3" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="6,4"/>
<text x="315.3" y="406.3" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="end">SSL — DOL</text>
<line x1="58.3" y1="273.1" x2="315.3" y2="273.1" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="58.3" y="268.1" font-size="9.5" font-weight="700" fill="#64748B" text-anchor="start">EQ</text>
<text x="275.2" y="423.9" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">giá hồi lên premium</text>
<rect x="344.0" y="86.0" width="304.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="356.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">H1 — SETUP: vùng nào đáng chờ?</text>
<rect x="360.7" y="174.7" width="270.6" height="164.0" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.0" stroke-dasharray="5,3" opacity="0.45"/>
<text x="384.5" y="188.3" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="start">vùng D1 BPR</text>
<polyline points="366.8,415.2 394.0,371.5 421.2,393.3 448.4,316.8 475.6,338.7 502.8,251.2 516.4,273.1 530.0,253.9 543.6,316.8 570.8,289.5 598.0,262.1" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="483.1" y1="251.2" x2="631.3" y2="251.2" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="631.3" y="246.2" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="end">equal highs (BSL nội bộ)</text>
<rect x="537.5" y="275.8" width="93.8" height="21.9" rx="2" fill="#E3D4FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="629.3" y="309.7" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="end">H1 BPR</text>
<text x="502.8" y="415.2" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">giá đi vào vùng D1, tạo đỉnh bằng nhau</text>
<rect x="660.0" y="86.0" width="304.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="672.0" y="108.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">M5 — EXECUTION: có điều kiện chưa?</text>
<polyline points="682.2,338.7 706.9,284.0 731.6,256.7 744.0,202.0 756.4,247.6 768.7,302.2 781.1,338.7 793.5,347.8 805.8,311.3 818.2,293.1 842.9,366.0 867.6,411.6 892.4,429.8" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="701.3" y1="229.3" x2="786.7" y2="229.3" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="4,3"/>
<circle cx="744.0" cy="188.0" r="9" fill="#1D4ED8"/>
<text x="744.0" y="192.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="701.3" y1="338.7" x2="836.1" y2="338.7" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4,3"/>
<circle cx="784.8" cy="363.8" r="9" fill="#B45309"/>
<text x="784.8" y="367.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="750.8" y="284.0" width="110.0" height="32.8" rx="2" fill="#FDE3E4" stroke="#E0464B" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="818.2" cy="279.1" r="9" fill="#0F7A5A"/>
<text x="818.2" y="283.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="800.3" y1="189.2" x2="885.6" y2="189.2" stroke="#B91C1C" stroke-width="1.3" stroke-dasharray="2,2"/>
<text x="885.6" y="184.2" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="end">stop</text>
<line x1="849.7" y1="429.8" x2="947.4" y2="429.8" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="2,2"/>
<text x="947.4" y="442.3" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="end">target</text>
<text x="674.0" y="384.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">① quét equal highs</text>
<text x="674.0" y="402.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="start">② MSS + displacement xuống</text>
<text x="674.0" y="420.0" font-size="10.5" font-weight="700" fill="#0F7A5A" text-anchor="start">③ hồi về FVG M5 → entry</text>
<text x="32.0" y="490.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">D1 Bearish BPR nằm ở premium, DOL là SSL bên dưới.</text>
<text x="32.0" y="505.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">BPR chỉ trả lời: “vùng này đáng để xuống H1 xem”.</text>
<text x="348.0" y="490.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Trong vùng D1, H1 tạo equal highs (thanh khoản nội bộ)</text>
<text x="348.0" y="505.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">và một H1 BPR nhỏ. Đây là chỗ chờ, chưa phải lệnh.</text>
<text x="664.0" y="490.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ khi M5 cho chuỗi: sweep → MSS có displacement</text>
<text x="664.0" y="505.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">→ FVG mới → mới có điều kiện vào. Không có chuỗi →</text>
<text x="664.0" y="521.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">không có lệnh.</text>
<text x="28.0" y="620.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Nếu D1 và H1 mâu thuẫn (ví dụ H1 BPR bullish trong D1 Bearish BPR), ưu tiên D1 hoặc đứng ngoài — trừ khi bạn đang chủ động backtest mô hình ngược xu hướng.</text>
</svg>
