<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="498" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="882.4" y="22" width="89.6" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="927.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NHẬN DIỆN</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Khung nhận diện 4 khối: A → B → C → D</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đi theo thứ tự thời gian. A và B biết được ngay; C cần ít nhất vài nến; D cần nhiều nến hơn nữa. Đừng nhảy từ B sang kết luận.</text>
<rect x="28.0" y="100.0" width="229.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
<rect x="28.0" y="100.0" width="229.0" height="44.0" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
<text x="40.0" y="128.0" font-size="12.5" font-weight="800" fill="#64748B" text-anchor="start">A. Cấu trúc TRƯỚC gap</text>
<rect x="40.0" y="156.5" width="90.8" height="19.5" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
<text x="85.4" y="171.0" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">Biết trước gap</text>
<circle cx="46.0" cy="192.0" r="3" fill="#64748B" stroke="none" stroke-width="1"/>
<text x="56.0" y="196.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đang đi ngang hay đang trend?</text>
<circle cx="46.0" cy="217.9" r="3" fill="#64748B" stroke="none" stroke-width="1"/>
<text x="56.0" y="221.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có biên range / swing quan trọng</text>
<text x="56.0" y="237.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">rõ không?</text>
<circle cx="46.0" cy="259.6" r="3" fill="#64748B" stroke="none" stroke-width="1"/>
<text x="56.0" y="263.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Biên đó được test nhiều lần chưa?</text>
<circle cx="46.0" cy="285.5" r="3" fill="#64748B" stroke="none" stroke-width="1"/>
<text x="56.0" y="289.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có co hẹp (compression) trước đó</text>
<text x="56.0" y="305.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">không?</text>
<line x1="257.0" y1="235.0" x2="267.0" y2="235.0" stroke="#94A3B8" stroke-width="1.6"/>
<path d="M267.0,235.0 L261.6,237.6 L261.6,232.4 Z" fill="#94A3B8"/>
<rect x="267.0" y="100.0" width="229.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
<rect x="267.0" y="100.0" width="229.0" height="44.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
<text x="279.0" y="128.0" font-size="12.5" font-weight="800" fill="#D97706" text-anchor="start">B. Bản thân cái gap</text>
<rect x="279.0" y="156.5" width="133.1" height="19.5" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="345.5" y="171.0" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="middle">Biết ngay khi xuất hiện</text>
<circle cx="285.0" cy="192.0" r="3" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="295.0" y="196.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gap đo theo kiểu nào (High/Low</text>
<text x="295.0" y="211.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hay Close/Open)?</text>
<circle cx="285.0" cy="233.7" r="3" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="295.0" y="237.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Gap nằm ở đâu: trong hay ngoài</text>
<text x="295.0" y="253.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">biên?</text>
<circle cx="285.0" cy="275.5" r="3" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="295.0" y="279.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Xảy ra lúc nào: mở phiên, tin, giờ</text>
<text x="295.0" y="295.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">thanh khoản mỏng?</text>
<circle cx="285.0" cy="317.2" r="3" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="295.0" y="321.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chart này có đúng phiên/nguồn dữ</text>
<text x="295.0" y="337.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">liệu không?</text>
<line x1="496.0" y1="235.0" x2="506.0" y2="235.0" stroke="#94A3B8" stroke-width="1.6"/>
<path d="M506.0,235.0 L500.6,237.6 L500.6,232.4 Z" fill="#94A3B8"/>
<rect x="506.0" y="100.0" width="229.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="506.0" y="100.0" width="229.0" height="44.0" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
<text x="518.0" y="128.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start">C. Có phá cấu trúc thật?</text>
<rect x="518.0" y="156.5" width="106.6" height="19.5" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
<text x="571.3" y="171.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">Biết sau 1–vài nến</text>
<circle cx="524.0" cy="192.0" r="3" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="534.0" y="196.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá ĐÓNG CỬA ngoài biên chưa?</text>
<circle cx="524.0" cy="217.9" r="3" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="534.0" y="221.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phá swing nội bộ hay biên ngoài</text>
<text x="534.0" y="237.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">của range?</text>
<circle cx="524.0" cy="259.6" r="3" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="534.0" y="263.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có follow-through (đi tiếp)</text>
<text x="534.0" y="279.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">không?</text>
<circle cx="524.0" cy="301.4" r="3" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="534.0" y="305.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hay giá quay ngay lại vào range?</text>
<line x1="735.0" y1="235.0" x2="745.0" y2="235.0" stroke="#94A3B8" stroke-width="1.6"/>
<path d="M745.0,235.0 L739.6,237.6 L739.6,232.4 Z" fill="#94A3B8"/>
<rect x="745.0" y="100.0" width="229.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#0F9D74" stroke-width="1.6"/>
<rect x="745.0" y="100.0" width="229.0" height="44.0" rx="10" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.6"/>
<text x="757.0" y="128.0" font-size="12.5" font-weight="800" fill="#0F9D74" text-anchor="start">D. Hành vi SAU gap</text>
<rect x="757.0" y="156.5" width="109.0" height="19.5" rx="9" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1"/>
<text x="811.5" y="171.0" font-size="10.5" font-weight="700" fill="#0F9D74" text-anchor="middle">Biết sau nhiều nến</text>
<circle cx="763.0" cy="192.0" r="3" fill="#0F9D74" stroke="none" stroke-width="1"/>
<text x="773.0" y="196.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Tiếp tục mở rộng (expansion)?</text>
<circle cx="763.0" cy="217.9" r="3" fill="#0F9D74" stroke="none" stroke-width="1"/>
<text x="773.0" y="221.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Quay lại test gap rồi giữ?</text>
<circle cx="763.0" cy="243.7" r="3" fill="#0F9D74" stroke="none" stroke-width="1"/>
<text x="773.0" y="247.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Lấp một phần / lấp hết?</text>
<circle cx="763.0" cy="269.6" r="3" fill="#0F9D74" stroke="none" stroke-width="1"/>
<text x="773.0" y="273.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá lấy lại range cũ (reclaim) →</text>
<text x="773.0" y="289.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">thất bại?</text>
<rect x="28.0" y="384.0" width="944.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="406.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao thứ tự quan trọng</text>
<text x="44.0" y="426.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">A không cần tương lai. B chỉ cần khoảnh khắc gap xuất hiện. C và D luôn cần thêm nến. Nếu bạn dùng thông tin của D để 'chứng minh' quyết định đã ra ở B, đó là</text>
<text x="44.0" y="441.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hindsight bias. Ghi lại kết luận A–B kèm thời điểm TRƯỚC khi xem tiếp chart.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
