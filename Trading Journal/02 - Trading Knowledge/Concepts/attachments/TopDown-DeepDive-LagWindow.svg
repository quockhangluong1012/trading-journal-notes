<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>

  <text x="480" y="34" text-anchor="middle" fill="#d1d4dc" font-size="22" font-weight="bold">Cua so do tre giua cac tang (HTF -&gt; Intermediate -&gt; LTF)</text>

  <!-- Timeline axis -->
  <line x1="60" y1="470" x2="900" y2="470" stroke="#1e222d" stroke-width="2"/>
  <text x="60" y="495" fill="#d1d4dc" font-size="12">t0</text>
  <text x="880" y="495" fill="#d1d4dc" font-size="12">t</text>

  <!-- Grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="60" y1="120" x2="900" y2="120"/>
    <line x1="60" y1="220" x2="900" y2="220"/>
    <line x1="60" y1="320" x2="900" y2="320"/>
    <line x1="60" y1="420" x2="900" y2="420"/>
  </g>

  <!-- HTF event -->
  <text x="65" y="105" fill="#d1d4dc" font-size="13" font-weight="bold">HTF (D1) MSS</text>
  <line x1="150" y1="90" x2="150" y2="460" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="150" cy="150" r="6" fill="#f2c94c"/>
  <text x="160" y="145" fill="#f2c94c" font-size="12">Bias flip xac nhan</text>

  <!-- lag window rectangle -->
  <rect x="150" y="90" width="220" height="380" fill="rgba(41,98,255,0.12)" stroke="#2962ff" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="180" y="80" fill="#5b8dff" font-size="12">Cua so cho (lag window)</text>

  <!-- Intermediate confirmation -->
  <text x="65" y="205" fill="#d1d4dc" font-size="13" font-weight="bold">Intermediate (H1) POI</text>
  <circle cx="370" cy="250" r="6" fill="#ff9800"/>
  <line x1="370" y1="90" x2="370" y2="460" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="245" fill="#ff9800" font-size="12">POI sach hinh thanh</text>

  <!-- LTF trigger -->
  <text x="65" y="305" fill="#d1d4dc" font-size="13" font-weight="bold">LTF (M5) trigger</text>
  <circle cx="430" cy="350" r="6" fill="#26a69a"/>
  <text x="440" y="345" fill="#26a69a" font-size="12">Sweep + MSS xac nhan entry</text>

  <!-- too-late zone -->
  <rect x="600" y="90" width="300" height="380" fill="rgba(239,83,80,0.10)" stroke="#ef5350" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="610" y="80" fill="#ef5350" font-size="12">Qua han - do tin cay bias giam dan</text>

  <!-- candle mini pattern along LTF row -->
  <g>
    <rect x="200" y="390" width="10" height="20" fill="#26a69a"/>
    <rect x="215" y="380" width="10" height="25" fill="#26a69a"/>
    <rect x="230" y="395" width="10" height="15" fill="#ef5350"/>
    <rect x="245" y="385" width="10" height="20" fill="#26a69a"/>
    <rect x="415" y="370" width="10" height="18" fill="#ef5350"/>
    <rect x="430" y="360" width="10" height="30" fill="#26a69a"/>
    <rect x="445" y="350" width="10" height="25" fill="#26a69a"/>
  </g>

  <!-- annotation arrow -->
  <line x1="150" y1="150" x2="360" y2="248" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="380" y1="250" x2="425" y2="348" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="480" y="510" text-anchor="middle" fill="#d1d4dc" font-size="13">Neu Intermediate/LTF khong xac nhan trong cua so hop ly, coi bias la "tentative" - giam size hoac cho them</text>

  <!-- Legend -->
  <g transform="translate(60,40)">
    <circle cx="6" cy="0" r="5" fill="#f2c94c"/>
    <text x="16" y="4" fill="#d1d4dc" font-size="12">HTF flip</text>
    <circle cx="120" cy="0" r="5" fill="#ff9800"/>
    <text x="130" y="4" fill="#d1d4dc" font-size="12">Intermediate POI</text>
    <circle cx="270" cy="0" r="5" fill="#26a69a"/>
    <text x="280" y="4" fill="#d1d4dc" font-size="12">LTF trigger</text>
    <rect x="400" y="-6" width="14" height="12" fill="rgba(41,98,255,0.25)" stroke="#2962ff"/>
    <text x="420" y="4" fill="#d1d4dc" font-size="12">Cua so cho hop ly</text>
    <rect x="580" y="-6" width="14" height="12" fill="rgba(239,83,80,0.15)" stroke="#ef5350"/>
    <text x="600" y="4" fill="#d1d4dc" font-size="12">Qua han - can nghi ngo</text>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
