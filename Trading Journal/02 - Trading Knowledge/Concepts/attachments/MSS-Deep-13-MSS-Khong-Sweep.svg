<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">MSS KHÔNG có sweep — xảy ra thường xuyên, và không tự động là 'kém chất lượng'</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Câu 'MSS phải có sweep trước' là một BỘ LỌC của ICT 2022 (giả thuyết cần đo), không phải định nghĩa của MSS và không phải quy luật dòng tiền.</text>
<rect x="26.0" y="84.0" width="454.0" height="340.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="104.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">A. Đảo chiều tại POI HTF, đáy cao hơn đáy cũ</text>
<rect x="244.7" y="297.6" width="215.3" height="40.6" rx="3" fill="#EFF6FF" fill-opacity="0.8" stroke="#2563EB" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="455.9" y="291.6" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="end">POI H1 (ví dụ FVG H1)</text>
<line x1="170.2" y1="344.0" x2="460.0" y2="344.0" stroke="#D97706" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="460.0" y="358.0" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="end">đáy cũ (SSL) — KHÔNG bị chạm</text>
<path d="M46.0,141.0 L87.4,233.8 L120.5,199.0 L170.2,344.0 L211.6,268.6 L253.0,326.6 L286.1,257.0 L311.0,280.2 L352.4,199.0 L377.2,222.2 L443.4,146.8" stroke="#111827" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="253.0" cy="326.6" r="5.5" fill="#2563EB" stroke="#ffffff" stroke-width="1.5"/>
<text x="243.0" y="330.6" font-size="9.8" font-weight="700" fill="#1D4ED8" text-anchor="end">đáy cao hơn (HL)</text>
<line x1="211.6" y1="268.6" x2="460.0" y2="268.6" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="211.6" cy="268.6" r="4.5" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="277.8" cy="268.6" r="5" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="269.8" y="258.6" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="end">MSS</text>
<text x="54.3" y="412.0" font-size="9.6" font-weight="600" fill="#334155" text-anchor="start">Phản ứng từ VỊ TRÍ (POI), không qua một mức thanh khoản ex-ante.</text>
<rect x="500.0" y="84.0" width="454.0" height="340.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="512.0" y="104.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">B. Đáy cũ bị phá bằng CLOSE (run), rồi mới MSS</text>
<line x1="652.5" y1="297.6" x2="934.0" y2="297.6" stroke="#D97706" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="934.0" y="291.6" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="end">đáy cũ: bị close xuyên qua</text>
<path d="M520.0,141.0 L569.7,239.6 L602.8,204.8 L652.5,297.6 L685.6,257.0 L735.3,349.8 L760.1,320.8 L776.7,338.2 L818.1,239.6 L842.9,262.8 L900.9,170.0" stroke="#111827" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="710.4" cy="309.2" r="5" fill="#DC2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="702.4" y="315.2" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="end">BOS ↓ (không phải sweep)</text>
<line x1="760.1" y1="320.8" x2="934.0" y2="320.8" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="785.0" cy="320.8" r="5" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="779.0" y="308.8" font-size="10" font-weight="800" fill="#6D28D9" text-anchor="end">MSS</text>
<text x="528.3" y="412.0" font-size="9.6" font-weight="600" fill="#334155" text-anchor="start">Liquidity bị 'tiêu thụ' bằng acceptance, sau đó cấu trúc mới lật.</text>
<rect x="26.0" y="436.0" width="928.0" height="88.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="458.0" font-size="10.2" font-weight="700" fill="#334155" text-anchor="start">Hệ quả cho backtest:</text>
<text x="42.0" y="474.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Trên random walk: 43% MSS không lấy đáy/đỉnh nào trước đó; 48% có run (close xuyên) — 'MSS không sweep' là phần lớn, không phải ngoại lệ.</text>
<text x="42.0" y="491.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Muốn biết điều kiện sweep có giá trị không, phải đo E[R](MSS + sweep) − E[R](MSS không sweep) trên CÙNG quy tắc entry/stop (HYP-MSS-003).</text>
<text x="42.0" y="507.5" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Ô 'MSS không sweep' trong ma trận Sweep × MSS (note 20 §13.2): kiểm tra danh sách mức ex-ante TRƯỚC khi gọi là sweep.</text>
</svg>