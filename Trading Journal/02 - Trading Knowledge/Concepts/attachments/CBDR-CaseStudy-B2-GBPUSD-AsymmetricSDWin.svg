<line x1="60" y1="660" x2="1220" y2="660" stroke="#2a2e39"/>
<text x="60" y="688" font-size="14" fill="#d1d4dc">Bài học: CBDR sạch (40pip) + GBPUSD trong giai đoạn này có -SD dễ chạm hơn +SD (xem EC directional hit-rate) → tự tin để TP2 xa hơn mặc định.</text>
<text x="60" y="712" font-size="14" fill="#d1d4dc">Nếu áp dụng kỳ vọng đối xứng mặc định (chỉ TP1 tại -1 SD rồi chốt hết), lệnh sẽ bỏ lỡ phần lớn phần lãi từ -1 xuống -2 SD.</text>
<text x="60" y="736" font-size="13" fill="#787b86">Nguồn: tái dựng minh họa từ mẫu backtest GBPUSD London kill zone, kết hợp CBDR target + directional hit-rate rolling.</text>
