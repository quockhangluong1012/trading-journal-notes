<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Scenario H — Kế hoạch bị vô hiệu trước khi có entry (ví dụ invalidation)</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bối cảnh như Scenario A. Giá vào zone, quét pool M5 — nhưng không reclaim; H1 accept dưới distal 1045. Mỗi tầng chết theo thứ tự.</text>
<rect x="26.0" y="96.0" width="308.0" height="250.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="34.0" y="112.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">D1 — bối cảnh</text>
<line x1="26.0" y1="221.0" x2="334.0" y2="221.0" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="30.0" y="218.0" font-size="9" font-weight="400" fill="#4B5563" text-anchor="start">EQ 1100</text>
<rect x="155.4" y="259.0" width="178.6" height="21.7" rx="2" fill="#DBEAFE" stroke="none" stroke-width="0" opacity="0.9"/>
<text x="330.0" y="277.8" font-size="9" font-weight="400" fill="#1D4ED8" text-anchor="end">POI 1045–1065</text>
<line x1="257.0" y1="112.3" x2="334.0" y2="112.3" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="330.0" y="109.3" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="end">BSL 1200 (DOL)</text>
<line x1="204.6" y1="242.7" x2="334.0" y2="242.7" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="330.0" y="254.7" font-size="9" font-weight="400" fill="#B45309" text-anchor="end">SSL 1080</text>
<line x1="112.2" y1="329.7" x2="334.0" y2="329.7" stroke="#15803D" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="330.0" y="341.7" font-size="9" font-weight="700" fill="#15803D" text-anchor="end">protected 1000</text>
<polyline points="26.0,199.3 63.0,166.7 118.4,329.7 173.8,158.0 210.8,242.7 272.4,112.3 318.6,185.1" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="318.6" cy="185.1" r="4" fill="#1D4ED8" stroke="white" stroke-width="1.2"/>
<rect x="346.0" y="96.0" width="308.0" height="250.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="354.0" y="112.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">H1 — diễn biến trung gian</text>
<rect x="346.0" y="221.0" width="308.0" height="55.6" rx="2" fill="#BFDBFE" stroke="none" stroke-width="0" opacity="0.9"/>
<text x="352.2" y="234.9" font-size="9.5" font-weight="400" fill="#1D4ED8" text-anchor="start">POI D1 1045–1065</text>
<line x1="346.0" y1="276.6" x2="654.0" y2="276.6" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="650.0" y="288.6" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="end">distal 1045</text>
<polyline points="346.0,123.8 392.2,157.1 423.0,146.0 469.2,218.2 493.8,232.1 518.5,226.6 549.3,282.1 567.8,273.8 592.4,301.6 617.0,290.4 641.7,323.8" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="567.8" cy="279.3" r="4" fill="#B91C1C" stroke="white" stroke-width="1.2"/>
<circle cx="617.0" cy="293.2" r="4" fill="#B91C1C" stroke="white" stroke-width="1.2"/>
<text x="500.0" y="318.2" font-size="9.5" font-weight="400" fill="#B91C1C" text-anchor="start">2 nến H1 đóng dưới, không reclaim</text>
<rect x="666.0" y="96.0" width="308.0" height="250.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="674.0" y="112.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">M5 — thực thi</text>
<line x1="690.6" y1="166.8" x2="974.0" y2="166.8" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="694.6" y="163.8" font-size="9" font-weight="400" fill="#7C3AED" text-anchor="start">pool 1063.5</text>
<line x1="758.4" y1="200.2" x2="974.0" y2="200.2" stroke="#0F766E" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="970.0" y="212.2" font-size="9" font-weight="400" fill="#0F766E" text-anchor="end">nếu đã vào: stop</text>
<polyline points="666.0,129.3 712.2,164.3 752.2,141.8 795.4,187.7 820.0,175.2 850.8,221.0 881.6,208.5 927.8,279.3 967.8,312.7" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="758.4" y="262.7" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">sweep → không reclaim = RUN</text>
<rect x="26.0" y="360.0" width="183.2" height="64.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
<text x="36.0" y="379.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">T5</text>
<text x="36.0" y="397.0" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="start">vào zone → MONITORING</text>
<rect x="217.2" y="360.0" width="183.2" height="64.0" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="227.2" y="379.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">T6</text>
<text x="227.2" y="397.0" font-size="10.8" font-weight="700" fill="#0F766E" text-anchor="start">sweep thành run: setup M5</text>
<text x="227.2" y="410.5" font-size="10.8" font-weight="700" fill="#0F766E" text-anchor="start">fail</text>
<rect x="408.4" y="360.0" width="183.2" height="64.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
<text x="418.4" y="379.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">+2 nến H1</text>
<text x="418.4" y="397.0" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="start">acceptance &lt; 1045: POI</text>
<text x="418.4" y="410.5" font-size="10.8" font-weight="700" fill="#B45309" text-anchor="start">fail</text>
<rect x="599.6" y="360.0" width="183.2" height="64.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.3"/>
<text x="609.6" y="379.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">Cascade</text>
<text x="609.6" y="397.0" font-size="10.8" font-weight="700" fill="#B91C1C" text-anchor="start">không còn POI trên 1000</text>
<rect x="790.8" y="360.0" width="183.2" height="64.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="800.8" y="379.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">D1 close</text>
<text x="800.8" y="397.0" font-size="10.8" font-weight="700" fill="#1D4ED8" text-anchor="start">&lt; 1000? → FULL RESET :</text>
<text x="800.8" y="410.5" font-size="10.8" font-weight="700" fill="#1D4ED8" text-anchor="start">giữ, chờ</text>
<rect x="26.0" y="436.0" width="600.0" height="148.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
<text x="40.0" y="458.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="start">QUYẾT ĐỊNH ĐÚNG TẠI THỜI ĐIỂM ĐÓ</text>
<text x="40.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Setup M5 fail → về MONITORING; POI fail → bỏ zone, KHÔNG lật bias</text>
<text x="40.0" y="497.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="497.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Không còn vùng nào giữa 1045 và 1000 → trạng thái chờ tới D1 close</text>
<text x="40.0" y="516.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="516.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">D1 close &lt; 1000 → bias → Neutral/Transition, viết lại D1 summary; ≥ 1000 → bias</text>
<text x="53.0" y="531.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">giữ nhưng DEGRADED</text>
<rect x="640.0" y="436.0" width="334.0" height="148.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="654.0" y="458.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">SAI LẦM PHỔ BIẾN</text>
<text x="654.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="667.0" y="478.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Long 'giá tốt hơn' dưới zone vì 'D1 vẫn</text>
<text x="667.0" y="493.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">tăng'</text>
<text x="654.0" y="512.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="667.0" y="512.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Lật short ngay khi H1 xuyên 1045 (bias D1</text>
<text x="667.0" y="527.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">chưa bị vô hiệu)</text>
<text x="654.0" y="546.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="667.0" y="546.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Xóa log setup fail vì 'không có lệnh nên</text>
<text x="667.0" y="561.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">không cần ghi'</text>
</svg>
