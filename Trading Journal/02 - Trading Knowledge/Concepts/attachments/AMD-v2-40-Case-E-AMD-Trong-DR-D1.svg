<text x="891.5" y="237.6" font-size="10.2" font-weight="600" fill="#64748B" text-anchor="end">chạm EQ: vùng giá</text>
<text x="891.5" y="250.8" font-size="10.2" font-weight="600" fill="#64748B" text-anchor="end">“không còn rẻ”</text>
<rect x="28.0" y="586.0" width="944.0" height="65.1" rx="8" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1"/>
<text x="38.0" y="608.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bài học: AMD cho bạn HƯỚNG và ĐIỂM VÀO, nhưng đích thực tế phụ thuộc vào cấu trúc lớn. Từ discount, Distribution thường gặp các trạm dừng (đỉnh nội bộ,</text>
<text x="38.0" y="624.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">EQ) trước khi — nếu có — đi tới đỉnh dealing range. [BACKTEST REQUIRED] Nên chốt ở trạm nào là câu hỏi dữ liệu, không phải niềm tin. Mục tiêu đặt quá xa =</text>
<text x="38.0" y="641.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">biến lệnh thắng thành lệnh hòa.</text>
