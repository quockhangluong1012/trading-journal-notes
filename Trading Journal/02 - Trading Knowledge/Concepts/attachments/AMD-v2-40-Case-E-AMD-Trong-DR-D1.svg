<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bullish AMD trên H1 hình thành ở discount của dealing range D1. Câu hỏi khó không phải “có AMD không”, mà là “Distribution sẽ đi tới</text>
