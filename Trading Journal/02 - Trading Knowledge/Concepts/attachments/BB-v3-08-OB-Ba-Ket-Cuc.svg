<text x="28.0" y="557.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Quy ước dùng trong note: râu qua vùng = chưa thất bại. Thân nến đóng qua mép xa và giá không quay lại ngay = thất bại. Đây là quy ước LÀM VIỆC, không phải</text>
<text x="28.0" y="574.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">lời ICT.</text>
