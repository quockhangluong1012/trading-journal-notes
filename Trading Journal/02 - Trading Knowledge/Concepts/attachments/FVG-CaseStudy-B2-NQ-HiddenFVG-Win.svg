    <rect x="720" y="240" width="20" height="70" fill="#26a69a" rx="1"/><line x1="730" y1="225" x2="730" y2="320" stroke="#26a69a"/>
    <rect x="760" y="180" width="20" height="65" fill="#26a69a" rx="1"/><line x1="770" y1="165" x2="770" y2="255" stroke="#26a69a"/>
    <rect x="900" y="160" width="20" height="40" fill="#26a69a" rx="1"/><line x1="910" y1="148" x2="910" y2="210" stroke="#26a69a"/>
