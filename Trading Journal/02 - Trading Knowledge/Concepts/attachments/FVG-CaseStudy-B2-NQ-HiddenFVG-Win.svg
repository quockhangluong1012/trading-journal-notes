  <text x="696" y="674" font-size="14" fill="#f2c94c">phai nho setup H1 dep san co</text>

  <text x="60" y="730" font-size="13" fill="#565b66">Tái dựng minh họa từ mẫu backtest NQ H1/M5 — không phải giao dịch thật.</text>
