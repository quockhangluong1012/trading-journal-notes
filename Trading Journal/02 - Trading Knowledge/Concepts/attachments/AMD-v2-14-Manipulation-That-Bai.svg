<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="648" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Khi “Manipulation” không thành: sáu kịch bản thất bại</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi khung bắt đầu giống nhau: một vùng đi ngang và một cú vượt mép. Phần sau mới quyết định. Không cố biến mọi liquidity sweep thành</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">một setup AMD.</text>
<rect x="894.5" y="22.0" width="77.5" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="933.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">FAILURE</text>
<rect x="28.0" y="96.0" width="306.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="46.0" cy="115.0" r="9" fill="#B91C1C"/>
<text x="46.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="62.0" y="119.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Quét đỉnh rồi TĂNG TIẾP</text>
<rect x="40.0" y="130.0" width="282.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="40.0" y="212.5" width="155.1" height="40.3" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M40.0,239.4 L68.2,217.8 L96.4,247.4 L124.6,215.2 L152.8,244.7 L181.0,217.8 L209.2,196.3 L237.4,212.5 L265.6,188.3 L293.8,164.1 L322.0,142.6" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="278.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Cú quét thật ra là bước đầu của breakout. Ai</text>
<text x="40.0" y="293.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">short sau cú quét sẽ bị cuốn theo.</text>
<rect x="346.0" y="96.0" width="306.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="364.0" cy="115.0" r="9" fill="#B91C1C"/>
<text x="364.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="380.0" y="119.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Quét đáy rồi GIẢM TIẾP</text>
<rect x="358.0" y="130.0" width="282.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="358.0" y="139.9" width="155.1" height="37.6" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M358.0,150.6 L386.2,172.2 L414.4,142.6 L442.6,174.8 L470.8,145.3 L499.0,172.2 L527.2,193.7 L555.4,180.2 L583.6,207.1 L611.8,228.6 L640.0,247.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="278.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Hình ảnh đối xứng: “quét SSL” không bảo đảm đảo</text>
<text x="358.0" y="293.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">lên.</text>
<rect x="664.0" y="96.0" width="306.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="682.0" cy="115.0" r="9" fill="#B91C1C"/>
<text x="682.0" y="119.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="698.0" y="119.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Đóng nến bên ngoài và GIỮ được</text>
<rect x="676.0" y="130.0" width="282.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="676.0" y="196.9" width="155.1" height="58.2" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M676.0,235.8 L704.2,204.7 L732.4,247.4 L760.6,200.8 L788.8,243.5 L817.0,204.7 L845.2,177.5 L873.4,173.6 L901.6,181.4 L929.8,169.8 L958.0,142.6" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="278.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Breakout được chấp nhận. Không có reclaim →</text>
<text x="676.0" y="293.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">không có lý do gọi là Manipulation.</text>
<rect x="28.0" y="370.0" width="306.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="46.0" cy="389.0" r="9" fill="#B91C1C"/>
<text x="46.0" y="393.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="62.0" y="393.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Quay vào trong nhưng KHÔNG có lực</text>
<rect x="40.0" y="404.0" width="282.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="40.0" y="445.7" width="141.0" height="87.4" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M40.0,503.9 L65.6,457.4 L91.3,521.4 L116.9,451.5 L142.5,515.6 L168.2,457.4 L193.8,416.6 L219.5,469.0 L245.1,486.5 L270.7,463.2 L296.4,492.3 L322.0,469.0" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="552.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Reclaim xong lại đi ngang. Không displacement →</text>
<text x="40.0" y="567.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">chưa có Distribution.</text>
<rect x="346.0" y="370.0" width="306.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="364.0" cy="389.0" r="9" fill="#B91C1C"/>
<text x="364.0" y="393.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="380.0" y="393.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Có MSS nhưng KHÔNG đi tiếp</text>
<rect x="358.0" y="404.0" width="282.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="358.0" y="451.5" width="129.2" height="65.5" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M358.0,495.2 L381.5,460.3 L405.0,508.3 L428.5,455.9 L452.0,503.9 L475.5,460.3 L499.0,425.3 L522.5,477.7 L546.0,521.4 L569.5,499.6 L593.0,469.0 L616.5,442.8 L640.0,416.6" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="358.0" y="552.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Phá đáy nhỏ xong giá quay lại vượt đỉnh. MSS</text>
<text x="358.0" y="567.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">không đi kèm theo đuổi = MSS bẫy.</text>
<rect x="664.0" y="370.0" width="306.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="682.0" cy="389.0" r="9" fill="#B91C1C"/>
<text x="682.0" y="393.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="698.0" y="393.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Quét CẢ HAI phía</text>
<rect x="676.0" y="404.0" width="282.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="676.0" y="444.5" width="129.2" height="52.4" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M676.0,479.5 L699.5,451.5 L723.0,490.0 L746.5,448.0 L770.0,486.5 L793.5,451.5 L817.0,423.6 L840.5,465.5 L864.0,521.4 L887.5,493.5 L911.0,416.6 L934.5,472.5 L958.0,514.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="552.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá giật hai đầu. Ai cũng có lý do để bị dừng lỗ. Đây</text>
<text x="676.0" y="567.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">là range lớn hơn, không phải AMD.</text>
