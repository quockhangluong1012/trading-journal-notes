<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m0" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1F2937"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="640.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Quy trình D1 → H1 → M5: mỗi khung một câu hỏi, một đầu ra, một cổng chuyển</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Không bắt đầu từ M5 rồi chọn D1/H1 để hợp thức hóa. Mỗi mũi tên là một điều kiện, không phải thói quen.</text>
<rect x="24.0" y="74.0" width="280.0" height="432.0" rx="9" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/>
<rect x="24.0" y="74.0" width="280.0" height="34.0" rx="9" fill="#374151"/>
<rect x="24.0" y="96.0" width="280.0" height="12.0" rx="0" fill="#374151"/>
<text x="38.0" y="97.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">D1 — CONTEXT</text>
<text x="38.0" y="130.0" font-size="11.5" fill="#374151" font-weight="700" text-anchor="start">&quot;Tôi đang ở đâu?&quot;</text>
<text x="38.0" y="154.0" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">Xác định &amp; ghi chú:</text>
<text x="44.0" y="174.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Swing D1 cấp L4–L5</text>
<text x="44.0" y="188.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Range D1 (2 biên + lý do)</text>
<text x="44.0" y="203.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• BSL/SSL lớn, EQH/EQL D1</text>
<text x="44.0" y="218.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• PWH/PWL, PDH/PDL</text>
<text x="44.0" y="233.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Internal/External theo range</text>
<text x="44.0" y="248.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• DOL chính + thay thế</text>
<text x="38.0" y="277.4" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Bỏ qua:</text>
<text x="44.0" y="297.4" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Swing nhỏ, wick lẻ</text>
<text x="44.0" y="312.3" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Mọi FVG nhỏ</text>
<text x="44.0" y="327.2" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Tin &quot;bias chắc chắn&quot;</text>
<rect x="36.0" y="352.0" width="256.0" height="68.9" rx="7" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="43.0" y="368.9" font-size="10.9" fill="#374151" font-weight="700" text-anchor="start">Cổng chuyển</text>
<text x="43.0" y="385.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">→ H1 khi: tóm tắt D1 đủ rõ để</text>
<text x="43.0" y="400.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">biết nhìn vào đâu (&quot;chưa rõ&quot; vẫn</text>
<text x="43.0" y="414.4" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">phải được ghi ra)</text>
<rect x="36.0" y="440.0" width="256.0" height="54.0" rx="6" fill="#374151" fill-opacity="0.09" stroke="#374151" stroke-width="1"/>
<text x="46.0" y="460.0" font-size="10.5" fill="#374151" font-weight="700" text-anchor="start">ĐẦU RA:</text>
<text x="46.0" y="478.0" font-size="10.6" fill="#1F2937" font-weight="600" text-anchor="start">Bản đồ D1 + điều kiện đánh giá lại</text>
<rect x="330.0" y="74.0" width="280.0" height="432.0" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
<rect x="330.0" y="74.0" width="280.0" height="34.0" rx="9" fill="#0F766E"/>
<rect x="330.0" y="96.0" width="280.0" height="12.0" rx="0" fill="#0F766E"/>
<text x="344.0" y="97.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">H1 — SETUP</text>
<text x="344.0" y="130.0" font-size="11.5" fill="#0F766E" font-weight="700" text-anchor="start">&quot;Giá cư xử ra sao trong bối cảnh?&quot;</text>
<text x="344.0" y="154.0" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">Xác định &amp; ghi chú:</text>
<text x="350.0" y="174.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Cấu trúc H1 (int./ext.)</text>
<text x="350.0" y="188.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Liquidity H1 gần mức D1</text>
<text x="350.0" y="203.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Quan hệ H1 ↔ D1 (đồng thuận?)</text>
<text x="350.0" y="218.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Trạng thái: chạm / xuyên / chấp nhận</text>
<text x="350.0" y="233.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Thông tin còn thiếu</text>
<text x="344.0" y="262.5" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Bỏ qua:</text>
<text x="350.0" y="282.5" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Swing M5</text>
<text x="350.0" y="297.4" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Dao động không làm đổi</text>
<text x="350.0" y="312.3" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• cách đọc</text>
<rect x="342.0" y="352.0" width="256.0" height="68.9" rx="7" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="349.0" y="368.9" font-size="10.9" fill="#0F766E" font-weight="700" text-anchor="start">Cổng chuyển</text>
<text x="349.0" y="385.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">→ M5 khi: MONITORING (giá vào</text>
<text x="349.0" y="400.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">phạm vi mức + killzone) hoặc</text>
<text x="349.0" y="414.4" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">EVENT (mức đang bị xuyên)</text>
<rect x="342.0" y="440.0" width="256.0" height="54.0" rx="6" fill="#0F766E" fill-opacity="0.09" stroke="#0F766E" stroke-width="1"/>
<text x="352.0" y="460.0" font-size="10.5" fill="#0F766E" font-weight="700" text-anchor="start">ĐẦU RA:</text>
<text x="352.0" y="478.0" font-size="10.6" fill="#1F2937" font-weight="600" text-anchor="start">Danh sách mức H1 + trạng thái theo dõi</text>
<rect x="636.0" y="74.0" width="280.0" height="432.0" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/>
<rect x="636.0" y="74.0" width="280.0" height="34.0" rx="9" fill="#B45309"/>
<rect x="636.0" y="96.0" width="280.0" height="12.0" rx="0" fill="#B45309"/>
<text x="650.0" y="97.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">M5 — QUAN SÁT</text>
<text x="650.0" y="130.0" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">&quot;Chuyện gì đang xảy ra quanh mức?&quot;</text>
<text x="650.0" y="154.0" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">Xác định &amp; ghi chú:</text>
<text x="656.0" y="174.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Mức đến từ đâu (D1/H1)?</text>
<text x="656.0" y="188.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Trình tự: tiếp cận → xuyên →</text>
<text x="656.0" y="203.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• close → phản ứng</text>
<text x="656.0" y="218.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Swing nào bị phá, thuộc cấp nào</text>
<text x="656.0" y="233.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Phân loại theo E-code</text>
<text x="650.0" y="262.5" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Bỏ qua:</text>
<text x="656.0" y="282.5" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Mức M5 mới không có trong</text>
<text x="656.0" y="297.4" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• danh sách</text>
<text x="656.0" y="312.3" font-size="10.8" fill="#6B7280" font-weight="normal" text-anchor="start">• Một nến lớn đơn lẻ</text>
<rect x="648.0" y="352.0" width="256.0" height="68.9" rx="7" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="655.0" y="368.9" font-size="10.9" fill="#B45309" font-weight="700" text-anchor="start">Cổng chuyển</text>
<text x="655.0" y="385.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">→ về H1 khi: sự kiện đã phân loại,</text>
<text x="655.0" y="400.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">giá rời phạm vi, hết killzone,</text>
<text x="655.0" y="414.4" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">hoặc có tin tier-1</text>
<rect x="648.0" y="440.0" width="256.0" height="54.0" rx="6" fill="#B45309" fill-opacity="0.09" stroke="#B45309" stroke-width="1"/>
<text x="658.0" y="460.0" font-size="10.5" fill="#B45309" font-weight="700" text-anchor="start">ĐẦU RA:</text>
<text x="658.0" y="478.0" font-size="10.6" fill="#1F2937" font-weight="600" text-anchor="start">Bản ghi sự kiện có known_at</text>
<line x1="300.0" y1="290.0" x2="328.0" y2="290.0" stroke="#1F2937" stroke-width="2.2" marker-end="url(#m0)"/>
<line x1="606.0" y1="290.0" x2="634.0" y2="290.0" stroke="#1F2937" stroke-width="2.2" marker-end="url(#m0)"/>
<rect x="24.0" y="514.0" width="892.0" height="92.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="535.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Cổng D1 → H1: đã có bản đồ D1 (range, BSL/SSL lớn, DOL chính/thay thế, điều kiện đánh giá lại). Nếu D1 chưa rõ vẫn được xem H1 để</text>
<text x="40.0" y="552.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">thu thập thông tin — nhưng KHÔNG được giả vờ có bias.   Cổng H1 → M5: giá vào phạm vi ≤ 1.5·ATR(H1) của một mức trong danh sách trong</text>
<text x="40.0" y="569.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">killzone đã khai báo (MONITORING), hoặc một mức đang bị xuyên (EVENT). Quay lại H1 khi: sự kiện đã phân loại xong, giá rời phạm vi,</text>
<text x="40.0" y="586.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">hết killzone, hoặc có tin tier-1. Quay lại D1 khi: có close + acceptance ở khung D1 qua mức trong &quot;điều kiện đánh giá lại&quot;.</text>
<text x="24.0" y="626.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-22 · k, killzone, phạm vi là tham số khai báo (HEURISTIC). Bộ quy tắc DOL v0.2 ở [[58-Draw-on-Liquidity-DOL-Tong-hop-Deep-Dive-v0.2-Beginner-Friendly]].</text>
</svg>
