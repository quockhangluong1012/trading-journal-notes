<text x="40.0" y="480.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Vạch xám chấm ngắn: liquidity của a, b, c, d, f đã bị giá lấy khi rơi xuyên qua. Chúng không còn là mục tiêu.</text>
<text x="40.0" y="502.0" font-size="11.5" font-weight="600" fill="#DC2626" text-anchor="start">"Dày / mỏng" là GIẢ THUYẾT hợp lý (đáy càng lớn càng nhiều người nhìn thấy), không đo được từ chart nến. [HYPOTHESIS]</text>
<text x="40.0" y="524.0" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="start">Swing low ≠ liquidity pool: đáy chỉ là NƠI lệnh có thể tụ. Có tụ thật hay không thì chart không cho biết.</text>
