<svg viewBox="0 0 980 640" width="980" height="640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Tảng băng: chart cho bạn thấy phần nổi — mọi câu chuyện về "tổ chức" là suy luận về phần chìm</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Đường mặt nước = chart của bạn (thực chất là luồng quote của broker/sàn bạn dùng).</text>
<rect x="1.0" y="250.0" width="978.0" height="389.0" rx="0" fill="#E0F2FE" stroke="none" stroke-width="0"/>
<line x1="1.0" y1="250.0" x2="979.0" y2="250.0" stroke="#1D4ED8" stroke-width="2"/>
<text x="954.0" y="242.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="end">mặt nước = chart của bạn</text>
<polygon points="330.0,250.0 400.0,130.0 450.0,100.0 520.0,110.0 590.0,160.0 650.0,250.0" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
<polygon points="330.0,250.0 250.0,360.0 220.0,480.0 300.0,590.0 500.0,620.0 700.0,580.0 770.0,470.0 730.0,340.0 650.0,250.0" fill="#F1F5F9" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
<text x="490.0" y="140.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Giá · Thời gian</text>
<text x="490.0" y="161.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">OHLC · High / Low</text>
<text x="490.0" y="182.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Biến động (range, ATR)</text>
<text x="490.0" y="203.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Swing structure</text>
<text x="490.0" y="224.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Volume (futures/sàn — nếu có)</text>
<text x="490.0" y="290.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">AI đặt lệnh</text>
<text x="490.0" y="320.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">TẠI SAO họ đặt</text>
<text x="490.0" y="350.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Lượng lệnh chờ ở MỖI mức giá</text>
<text x="490.0" y="380.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Lệnh bị hủy trước khi khớp</text>
<text x="490.0" y="410.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Lịch sử sổ lệnh đầy đủ</text>
<text x="490.0" y="440.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Stop của người khác nằm đâu</text>
<text x="490.0" y="470.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Ý định của tổ chức</text>
<text x="490.0" y="500.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Thuật toán thực thi nào đang chạy</text>
<text x="490.0" y="530.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">"Logic IPDA" (nếu có)</text>
<rect x="26.0" y="80.0" width="270.0" height="150.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
<text x="40.0" y="104.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">PHẦN NỔI — OBSERVABLE</text>
<text x="40.0" y="121.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đo trực tiếp, ai đo cũng ra</text>
<text x="40.0" y="138.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">cùng kết quả (cùng feed).</text>
<text x="40.0" y="156.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mô tả CÁI GÌ đã xảy ra.</text>
<text x="40.0" y="173.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không tự nói TẠI SAO.</text>
<rect x="684.0" y="80.0" width="270.0" height="150.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="698.0" y="104.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">CẦU NỐI — INTERPRETATION</text>
<text x="698.0" y="121.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">"Đỉnh này có stop", "tổ chức</text>
<text x="698.0" y="138.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đã tích lũy", "IPDA tìm BSL"</text>
<text x="698.0" y="156.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">= suy luận từ phần nổi về</text>
<text x="698.0" y="173.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">phần chìm. Có thể sai.</text>
<rect x="26.0" y="520.0" width="220.0" height="100.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="38.0" y="544.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">PHẦN CHÌM — UNKNOWN</text>
<text x="38.0" y="561.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không thể suy ra chắc</text>
<text x="38.0" y="578.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chắn chỉ từ OHLC.</text>
<text x="38.0" y="596.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ test được HỆ QUẢ.</text>
<rect x="734.0" y="520.0" width="220.0" height="100.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="746.0" y="544.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Lưu ý FX/CFD</text>
<text x="746.0" y="561.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Prop firm/broker CFD: chart</text>
<text x="746.0" y="578.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">là quote của nhà cung cấp,</text>
<text x="746.0" y="596.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không có volume thật.</text>
</svg>
