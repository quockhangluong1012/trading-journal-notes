<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m0" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#16A34A"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="590.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Chuyện gì có thể xảy ra với lệnh khi giá đi qua một đỉnh cũ (toy model)</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Ba ảnh chụp sổ lệnh quanh mức L. Cột trái: lệnh BÁN chờ (limit, hiển thị). Cột phải: lệnh MUA có điều kiện (buy-stop, KHÔNG hiển thị).</text>
<rect x="838.2" y="16.0" width="77.8" height="20.0" rx="10.0" fill="#B45309"/>
<text x="877.1" y="30.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">TOY MODEL</text>
<rect x="24.0" y="74.0" width="290.0" height="420.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="36.0" y="98.0" font-size="13" fill="#1F2937" font-weight="700" text-anchor="start">① Trước: giá dưới L</text>
<text x="94.0" y="124.0" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle">Ask (limit bán)</text>
<text x="239.0" y="124.0" font-size="10.5" fill="#C2410C" font-weight="600" text-anchor="middle">Buy-stop (ẩn)</text>
<text x="169.0" y="162.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L+3</text>
<rect x="105.0" y="148.0" width="39.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<line x1="38.0" y1="180.0" x2="300.0" y2="180.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="169.0" y="208.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L+2</text>
<rect x="92.0" y="194.0" width="52.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<line x1="38.0" y1="226.0" x2="300.0" y2="226.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="169.0" y="254.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L+1</text>
<rect x="118.0" y="240.0" width="26.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<rect x="194.0" y="240.0" width="76.5" height="22.0" rx="2" fill="#C2410C" fill-opacity="0.55" stroke="#C2410C" stroke-width="1" stroke-dasharray="4 2"/>
<line x1="38.0" y1="272.0" x2="300.0" y2="272.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="169.0" y="300.0" font-size="11.5" fill="#C2410C" font-weight="700" text-anchor="middle">L</text>
<rect x="79.0" y="286.0" width="65.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<rect x="194.0" y="286.0" width="102.0" height="22.0" rx="2" fill="#C2410C" fill-opacity="0.55" stroke="#C2410C" stroke-width="1" stroke-dasharray="4 2"/>
<line x1="38.0" y1="318.0" x2="300.0" y2="318.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="169.0" y="346.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L−1</text>
<rect x="66.0" y="332.0" width="78.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<rect x="194.0" y="332.0" width="17.0" height="22.0" rx="2" fill="#C2410C" fill-opacity="0.55" stroke="#C2410C" stroke-width="1" stroke-dasharray="4 2"/>
<line x1="38.0" y1="364.0" x2="300.0" y2="364.0" stroke="#F3F4F6" stroke-width="1"/>
<line x1="38.0" y1="365.4" x2="300.0" y2="365.4" stroke="#1D4ED8" stroke-width="2.2"/>
<text x="40.0" y="379.4" font-size="10.5" fill="#1D4ED8" font-weight="700" text-anchor="start">Giá hiện tại (dưới L)</text>
<text x="38.0" y="392.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Stop dồn ngay trên L (L+1, L+2):</text>
<text x="38.0" y="407.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">người bán khống cắt lỗ + người</text>
<text x="38.0" y="422.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">chờ breakout. Ask phía trên mỏng.</text>
<text x="38.0" y="452.0" font-size="10.5" fill="#B45309" font-weight="700" text-anchor="start">[INTERPRETATION] vị trí stop</text>
<rect x="328.0" y="74.0" width="290.0" height="420.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="340.0" y="98.0" font-size="13" fill="#1F2937" font-weight="700" text-anchor="start">② Giá chạm L: stop → market</text>
<text x="398.0" y="124.0" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle">Ask (limit bán)</text>
<text x="543.0" y="124.0" font-size="10.5" fill="#C2410C" font-weight="600" text-anchor="middle">Buy-stop (ẩn)</text>
<text x="473.0" y="162.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L+3</text>
<rect x="409.0" y="148.0" width="39.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<line x1="342.0" y1="180.0" x2="604.0" y2="180.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="473.0" y="208.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L+2</text>
<rect x="396.0" y="194.0" width="52.0" height="22.0" rx="2" fill="#DC2626" fill-opacity="0.7"/>
<line x1="342.0" y1="226.0" x2="604.0" y2="226.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="473.0" y="254.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L+1</text>
<rect x="408.0" y="240.0" width="40.0" height="22.0" rx="2" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="342.0" y1="272.0" x2="604.0" y2="272.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="473.0" y="300.0" font-size="11.5" fill="#C2410C" font-weight="700" text-anchor="middle">L</text>
<rect x="408.0" y="286.0" width="40.0" height="22.0" rx="2" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="342.0" y1="318.0" x2="604.0" y2="318.0" stroke="#F3F4F6" stroke-width="1"/>
<text x="473.0" y="346.0" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">L−1</text>
<rect x="408.0" y="332.0" width="40.0" height="22.0" rx="2" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="342.0" y1="364.0" x2="604.0" y2="364.0" stroke="#F3F4F6" stroke-width="1"/>
<line x1="342.0" y1="186.0" x2="604.0" y2="186.0" stroke="#1D4ED8" stroke-width="2.2"/>
<text x="344.0" y="181.0" font-size="10.5" fill="#1D4ED8" font-weight="700" text-anchor="start">Giá vọt lên ~L+2</text>
<line x1="590.0" y1="342.4" x2="590.0" y2="197.5" stroke="#16A34A" stroke-width="3" marker-end="url(#m0)"/>
<text x="582.0" y="333.2" font-size="10" fill="#16A34A" font-weight="700" text-anchor="end">ask L−1…L+1 bị ăn hết</text>
<text x="342.0" y="392.0" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Mỗi buy-stop thành lệnh MUA market.</text>
<text x="342.0" y="407.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Chúng ăn ask L, L+1, L+2 → giá vọt</text>
<text x="342.0" y="422.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">(có thể dây chuyền = cascade).</text>
<text x="342.0" y="452.0" font-size="10.5" fill="#0F766E" font-weight="700" text-anchor="start">[MARKET MECHANICS] cơ chế khớp lệnh</text>
<rect x="632.0" y="74.0" width="290.0" height="420.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="644.0" y="98.0" font-size="13" fill="#1F2937" font-weight="700" text-anchor="start">③ Sau: hai nhánh có thể</text>
<rect x="644.0" y="116.0" width="266.0" height="106.4" rx="7" fill="#FFF7E6" stroke="#B45309" stroke-width="1.2"/>
<text x="653.0" y="135.5" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Nhánh A — bị hấp thụ</text>
<text x="653.0" y="153.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Có người BÁN lớn đứng chờ (limit sell,</text>
<text x="653.0" y="168.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">metaorder bán) hấp thụ dòng mua →</text>
<text x="653.0" y="183.5" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">giá quay lại dưới L.</text>
<text x="653.0" y="198.7" font-size="11" fill="#374151" font-weight="600" text-anchor="start">Quan sát: wick trên L, close dưới L</text>
<text x="653.0" y="213.9" font-size="11" fill="#C2410C" font-weight="700" text-anchor="start">→ ứng viên SWEEP (E2/E3)</text>
<rect x="644.0" y="270.0" width="266.0" height="106.4" rx="7" fill="#ECFDF3" stroke="#15803D" stroke-width="1.2"/>
<text x="653.0" y="289.5" font-size="11.5" fill="#1F2937" font-weight="700" text-anchor="start">Nhánh B — được chấp nhận</text>
<text x="653.0" y="307.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Không còn đủ người bán; người mua mới</text>
<text x="653.0" y="322.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">tiếp tục vào (breakout, tin, trend) →</text>
<text x="653.0" y="337.5" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">giá giữ trên L, có giao dịch 2 chiều.</text>
<text x="653.0" y="352.7" font-size="11" fill="#374151" font-weight="600" text-anchor="start">Quan sát: ≥2 close liên tiếp trên L</text>
<text x="653.0" y="367.9" font-size="11" fill="#15803D" font-weight="700" text-anchor="start">→ ACCEPTANCE / breakout (E4)</text>
<text x="646.0" y="432.0" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">Chart chỉ cho thấy KẾT QUẢ (A hay B),</text>
<text x="646.0" y="447.2" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">không cho thấy ai đã bán / mua.</text>
<text x="646.0" y="462.4" font-size="11" fill="#1F2937" font-weight="normal" text-anchor="start">Ở thời điểm ② không ai biết nhánh nào.</text>
<rect x="24.0" y="506.0" width="892.0" height="52.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
<text x="40.0" y="527.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">Bằng chứng thực nghiệm (FX): stop-loss có xu hướng dồn ngay SAU số tròn, take-profit dồn TẠI số tròn; giá có xu hướng</text>
<text x="40.0" y="544.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">tăng tốc sau khi vượt vùng tập trung stop (Osler 2003, 2005). Điều đó KHÔNG chứng minh ai đó &quot;cố tình&quot; đẩy giá tới đó.</text>
<text x="24.0" y="576.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-03 · Khối lượng là giả định để minh họa cơ chế. Không suy ra được khối lượng thật từ chart OHLC.</text>
</svg>
