<rect x="664.0" y="97.0" width="4.0" height="200.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="110.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Có thể kết luận (ex-ante)</text>
<text x="680.0" y="131.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Range: swing high → swing low vừa phá đáy cũ.</text>
<text x="680.0" y="147.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Giá ở nửa premium, đang chạm FVG giảm (IRL).</text>
<text x="680.0" y="163.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• SSL dưới và BSL trên đều chưa bị lấy.</text>
<text x="680.0" y="179.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Đáy nội bộ gần nhất là T1 nếu giá quay xuống.</text>
<text x="680.0" y="195.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Giả thuyết DOL: SSL dưới.</text>
<rect x="664.0" y="317.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="327.0" width="4.0" height="200.0" rx="2" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="340.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">KHÔNG thể kết luận</text>
<text x="680.0" y="361.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Rằng FVG sẽ chặn giá.</text>
<text x="680.0" y="377.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Rằng SSL bị lấy trước BSL.</text>
<text x="680.0" y="393.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Rằng xu hướng giảm “chắc chắn” tiếp diễn.</text>
<text x="680.0" y="425.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Cần thêm: phản ứng tại FVG + MSS giảm có</text>
<text x="680.0" y="440.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">displacement ở khung nhỏ.</text>
<rect x="28.0" y="551.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="575.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bẫy hay gặp ở Case B: bán khi giá mới chạm mép dưới FVG mà không chờ phản ứng. Nếu nhiều nến đóng cửa trên FVG và trên đỉnh nội bộ gần nhất ⇒ kịch bản 2</text>
<text x="42.0" y="591.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">(về BSL) mạnh lên.</text>
