<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case B — Bearish dealing range: giá hồi lên IRL ở premium, ERL dưới còn nguyên</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đối xứng với Case A. Mọi nhãn đổi phía: DOL ứng viên là SSL dưới, IRL vào lệnh nằm ở premium. Hình dựng (synthetic).</text>
