<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Thang bằng chứng — từ “wick qua một swing” tới “đổi cách đọc HTF”</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Mỗi bậc chỉ trả lời câu hỏi “tôi đang ở đâu”, KHÔNG trả lời “giá sẽ đi đâu”. Đổi cách đọc HTF chỉ khi hội đủ 4 điều kiện.</text>

  <defs>
    <marker id="arUp" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- rails -->
  <line x1="44" y1="556" x2="44" y2="150" stroke="#9CA3AF" stroke-width="2.4"/>
  <line x1="600" y1="556" x2="600" y2="150" stroke="#9CA3AF" stroke-width="2.4"/>
  <path d="M322 158 L322 132" stroke="#374151" stroke-width="2" marker-end="url(#arUp)"/>
  <text x="332" y="140" font-size="11" font-weight="700" fill="#374151">bằng chứng mạnh dần</text>
  <text x="44" y="576" font-size="10" fill="#6B7280">yếu nhất (bậc 1)</text>

  <!-- rung 1 -->
  <rect x="52" y="496" width="540" height="56" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <circle cx="74" cy="524" r="11" fill="#16A34A"/>
  <text x="74" y="528" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="94" y="518" font-size="11" font-weight="700" fill="#15803D">Wick qua một internal swing, đóng lại trong range</text>
  <text x="94" y="536" font-size="10.5" fill="#374151">→ <tspan font-weight="700">A · DEEP PULLBACK</tspan> — range VALID, bias giữ nguyên, chờ Long tại array D1 · size 100%</text>

  <!-- rung 2 -->
  <rect x="52" y="416" width="540" height="56" rx="7" fill="#ECFDF5" stroke="#A7F3D0"/>
  <circle cx="74" cy="444" r="11" fill="#16A34A"/>
  <text x="74" y="448" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="94" y="438" font-size="11" font-weight="700" fill="#15803D">Body-close qua internal + MSS ở H1</text>
  <text x="94" y="456" font-size="10.5" fill="#374151">→ <tspan font-weight="700">A hoặc B</tspan> — chờ; CẤM short ở discount; chờ MSS H1 bullish hoặc array D1</text>

  <!-- rung 3 -->
  <rect x="52" y="336" width="540" height="56" rx="7" fill="#FFFBEB" stroke="#FDE68A"/>
  <circle cx="74" cy="364" r="11" fill="#D97706"/>
  <text x="74" y="368" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="94" y="358" font-size="11" font-weight="700" fill="#B45309">Body-close qua protected INTERMEDIATE + acceptance</text>
  <text x="94" y="376" font-size="10.5" fill="#374151">→ <tspan font-weight="700">B · INTERMEDIATE BEARISH</tspan> — hạ bậc luận điểm; chỉ trade theo range MỚI · size 50%</text>

  <!-- rung 4 -->
  <rect x="52" y="256" width="540" height="56" rx="7" fill="#FEF2F2" stroke="#FECACA"/>
  <circle cx="74" cy="284" r="11" fill="#DC2626"/>
  <text x="74" y="288" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="94" y="278" font-size="11" font-weight="700" fill="#B91C1C">Neo D1 bị body-close, NHƯNG chưa có MSS ở D1</text>
  <text x="94" y="296" font-size="10.5" fill="#374151">→ <tspan font-weight="700">B → C ứng viên</tspan> — range REPLACED, KHÔNG đảo bias, chờ · size 25–50%</text>

  <!-- rung 5 -->
  <rect x="52" y="176" width="540" height="56" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <circle cx="74" cy="204" r="11" fill="#991B1B"/>
  <text x="74" y="208" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="94" y="198" font-size="11" font-weight="700" fill="#991B1B">Neo D1 phá + MSS D1 + acceptance qua nhiều phiên</text>
  <text x="94" y="216" font-size="10.5" fill="#374151">→ <tspan font-weight="700">C · GENUINE REVERSAL</tspan> — đổi cách đọc HTF; tìm setup ở range mới · size 50%</text>

  <!-- right panel : 4 conditions -->
  <rect x="620" y="100" width="315" height="456" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="634" y="123" font-size="12.5" font-weight="700" fill="#1F2937">4 điều kiện HỘI ĐỦ để đổi cách đọc HTF</text>
  <text x="634" y="139" font-size="10" fill="#6B7280">(conjunctive — thiếu một điều là chưa đủ)</text>

  <rect x="634" y="150" width="287" height="62" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="644" y="168" font-size="10.5" font-weight="700" fill="#B91C1C">1 · Neo HTF phá bằng BODY-CLOSE</text>
  <text x="644" y="184" font-size="10" fill="#374151">không phải wick — và KHÔNG reclaim</text>
  <text x="644" y="199" font-size="10" fill="#374151">trong m nến (m viết bằng số TRƯỚC sự kiện)</text>

  <rect x="634" y="220" width="287" height="62" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="644" y="238" font-size="10.5" font-weight="700" fill="#B91C1C">2 · Có MSS/CHoCH ở khung HTF</text>
  <text x="644" y="254" font-size="10" fill="#374151">D1 hoặc W1 — không chỉ ở H1</text>
  <text x="644" y="269" font-size="10" fill="#374151">MSS ở khung nào chỉ có hiệu lực ở khung đó</text>

  <rect x="634" y="290" width="287" height="76" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="644" y="308" font-size="10.5" font-weight="700" fill="#B91C1C">3 · Điểm phá nằm ở PREMIUM của range HTF</text>
  <text x="644" y="324" font-size="10" fill="#374151">hoặc, nếu bắt đầu từ discount, thì BSL phía trên</text>
  <text x="644" y="338" font-size="10" fill="#374151">đã bị lấy trước đó</text>
  <text x="644" y="355" font-size="10" font-weight="700" fill="#B45309">Phá từ discount = C ứng viên YẾU (nghi Judas)</text>

  <rect x="634" y="374" width="287" height="62" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="644" y="392" font-size="10.5" font-weight="700" fill="#B91C1C">4 · Acceptance kéo dài qua ≥ vài phiên</text>
  <text x="644" y="408" font-size="10" fill="#374151">Thời gian là bằng chứng, không chỉ mức giá</text>
  <text x="644" y="423" font-size="10" fill="#374151">1–2 nến chưa nói lên điều gì</text>

  <rect x="634" y="446" width="287" height="96" rx="6" fill="#1F2937" opacity="0.05"/>
  <text x="644" y="465" font-size="10.5" font-weight="700" fill="#1F2937">Nếu chỉ đạt 1–2 điều kiện</text>
  <text x="644" y="482" font-size="10" fill="#374151">→ giữ interpretation cũ, GIẢM SIZE, và ghi</text>
  <text x="644" y="497" font-size="10" fill="#374151"><tspan font-weight="700">htf_under_review = true</tspan></text>
  <text x="644" y="516" font-size="10" font-weight="700" fill="#B91C1C">KHÔNG đổi bias. KHÔNG đảo chiều lệnh.</text>
  <text x="644" y="533" font-size="10" fill="#6B7280">Đảo bias ở đáy pullback là lỗi thua kinh điển.</text>

  <!-- footer -->
  <rect x="25" y="584" width="910" height="26" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="38" y="601" font-size="10.5" font-weight="700" fill="#B45309">Cảnh báo phương pháp luận: kịch bản này, tại thời điểm nó đang xảy ra, KHÔNG THỂ được phân giải thành A/B/C bằng chart. Thang này gán xác suất, không cho đáp án.</text>
</svg>
