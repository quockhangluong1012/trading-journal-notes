<svg viewBox="0 0 1000 720" width="1000" height="720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="720" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Invalidation đúng cấp độ — setup chết ≠ POI chết ≠ bias chết</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Reset về tầng THẤP NHẤT còn hợp lệ ('deepest valid ancestor'), không về số 0 sau mỗi lần thất bại. Ví dụ XYZ, kịch bản long.</text>
<rect x="26.0" y="84.0" width="330.0" height="430.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="34.0" y="100.0" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="start">XYZ — ba mức invalidation</text>
<rect x="26.0" y="245.2" width="330.0" height="71.7" rx="2" fill="#DBEAFE" stroke="none" stroke-width="0" opacity="0.8"/>
<polyline points="26.0,119.8 92.0,173.6 125.0,155.7 207.5,256.0 230.6,234.5 263.6,259.6 296.6,213.0 339.5,191.5" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="26.0" y1="265.0" x2="356.0" y2="265.0" stroke="#0F766E" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30.0" y="279.0" font-size="9.8" font-weight="400" fill="#0F766E" text-anchor="start">① stop M5 1059.5 (dưới sweep 1061)</text>
<line x1="26.0" y1="316.9" x2="356.0" y2="316.9" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="30.0" y="330.9" font-size="9.8" font-weight="400" fill="#B45309" text-anchor="start">② distal POI 1045 (2 close H1 + không reclaim)</text>
<line x1="26.0" y1="478.2" x2="356.0" y2="478.2" stroke="#B91C1C" stroke-width="2" stroke-dasharray="5 4"/>
<text x="30.0" y="473.2" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="start">③ protected low 1000 (thân nến D1)</text>
<rect x="372.0" y="84.0" width="602.0" height="140.0" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/>
<text x="388.0" y="108.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">① SETUP M5 FAIL</text>
<text x="388.0" y="130.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">TRIGGER</text>
<text x="388.0" y="148.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="148.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Sweep thành run (không reclaim)</text>
<text x="388.0" y="164.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="164.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">MSS thiếu displacement · FVG bị đóng</text>
<text x="401.0" y="179.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">xuyên</text>
<text x="388.0" y="195.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="195.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Chạm stop 1059.5 · hết giờ · hết TTL</text>
<text x="684.0" y="130.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">HÀNH ĐỘNG</text>
<text x="684.0" y="148.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Về MONITORING nếu zone còn và còn giờ;</text>
<text x="684.0" y="163.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">log 'setup_fail' + lý do. Bias &amp; POI</text>
<text x="684.0" y="178.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">KHÔNG đổi.</text>
<rect x="372.0" y="230.0" width="602.0" height="140.0" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/>
<text x="388.0" y="254.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">② POI H1/D1 FAIL</text>
<text x="388.0" y="276.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">TRIGGER</text>
<text x="388.0" y="294.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="294.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">2 nến H1 đóng dưới 1045, không reclaim</text>
<text x="401.0" y="308.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">(acceptance)</text>
<text x="388.0" y="325.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="325.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">hoặc một nến displacement xuyên trọn zone</text>
<text x="684.0" y="276.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">HÀNH ĐỘNG</text>
<text x="684.0" y="294.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Bỏ zone này; tìm POI thấp hơn NHƯNG vẫn</text>
<text x="684.0" y="309.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">trên 1000 (cascade) — hoặc chờ. Bias D1</text>
<text x="684.0" y="324.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">vẫn còn.</text>
<rect x="372.0" y="376.0" width="602.0" height="140.0" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
<text x="388.0" y="400.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">③ THESIS D1 FAIL</text>
<text x="388.0" y="422.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">TRIGGER</text>
<text x="388.0" y="440.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="440.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Thân nến D1 đóng dưới 1000 (protected</text>
<text x="401.0" y="454.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">low)</text>
<text x="388.0" y="471.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="401.0" y="471.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Trong phiên: thân nến H1 &lt; 1000 hoặc</text>
<text x="401.0" y="485.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">xuyên &gt; 0.5 ATR → SUSPEND</text>
<text x="684.0" y="422.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">HÀNH ĐỘNG</text>
<text x="684.0" y="440.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">FULL RESET: cấu trúc → Transition, bias →</text>
<text x="684.0" y="455.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Neutral; viết lại D1 summary. Không 'lật</text>
<text x="684.0" y="470.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">short ngay'.</text>
<rect x="26.0" y="530.0" width="948.0" height="170.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="554.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Năm nhãn vòng đời (01c §7.0): bốn kiểu kết thúc + một trạng thái suy yếu (DEGRADED)</text>
<rect x="40.0" y="568.0" width="176.0" height="114.0" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="50.0" y="590.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">INVALIDATED</text>
<text x="50.0" y="610.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">có bằng chứng ngược</text>
<text x="50.0" y="648.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">→ reset đúng tầng</text>
<rect x="226.0" y="568.0" width="176.0" height="114.0" rx="7" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
<text x="236.0" y="590.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">FULFILLED</text>
<text x="236.0" y="610.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đúng &amp; xong (DOL đã</text>
<text x="236.0" y="624.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chạm)</text>
<text x="236.0" y="648.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">→ viết lại DOL, không</text>
<text x="236.0" y="662.6" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">trade tiếp target cũ</text>
<rect x="412.0" y="568.0" width="176.0" height="114.0" rx="7" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="422.0" y="590.0" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">EXPIRED</text>
<text x="422.0" y="610.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">hết hạn, chưa kết quả</text>
<text x="422.0" y="648.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">→ hạ confidence /</text>
<text x="422.0" y="662.6" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">Neutral</text>
<rect x="598.0" y="568.0" width="176.0" height="114.0" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="608.0" y="590.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">SUPERSEDED</text>
<text x="608.0" y="610.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">khung tham chiếu đổi</text>
<text x="608.0" y="648.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">→ re-map range, chọn lại</text>
<rect x="784.0" y="568.0" width="176.0" height="114.0" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="794.0" y="590.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">DEGRADED</text>
<text x="794.0" y="610.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">còn hiệu lực nhưng yếu</text>
<text x="794.0" y="648.0" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">→ giảm size / đòi thêm</text>
<text x="794.0" y="662.6" font-size="10.8" font-weight="400" fill="#6B7280" text-anchor="start">ĐK</text>
</svg>
