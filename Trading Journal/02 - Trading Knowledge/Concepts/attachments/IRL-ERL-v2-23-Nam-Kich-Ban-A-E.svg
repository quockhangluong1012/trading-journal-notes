<text x="358.7" y="645.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">FVG nằm đó nhưng giá không bao giờ quay lại; đi</text>
<text x="358.7" y="661.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">thẳng tới ERL.</text>
<rect x="665.3" y="399.0" width="306.7" height="300.0" rx="10" fill="#FFFBEB" stroke="#F5D08A" stroke-width="1.2"/>
<text x="679.3" y="425.0" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start">Điều cả năm ô có chung</text>
<text x="679.3" y="451.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">Mỗi trình tự chỉ được gọi tên SAU khi nó đã xảy</text>
<text x="679.3" y="467.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">ra. Trong real-time, bạn chỉ có: giá đang ở đâu</text>
<text x="679.3" y="484.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.7">so với range, cái gì đã bị lấy, cái gì còn.</text>
<text x="679.3" y="549.0" font-size="12" font-weight="700" fill="#92400E" text-anchor="start" data-maxw="278.7">Không có trình tự nào là bắt buộc. Câu đúng là:</text>
<text x="679.3" y="565.6" font-size="12" font-weight="700" fill="#92400E" text-anchor="start" data-maxw="278.7">“Sau khi lấy X, giá THƯỜNG hướng tới Y — tôi</text>
<text x="679.3" y="582.1" font-size="12" font-weight="700" fill="#92400E" text-anchor="start" data-maxw="278.7">sẽ chờ bằng chứng Z trước khi tin điều đó.”</text>
</svg>
