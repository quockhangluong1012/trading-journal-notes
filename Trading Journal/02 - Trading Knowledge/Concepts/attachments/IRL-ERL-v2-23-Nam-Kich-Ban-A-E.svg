<text x="932.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">KỊCH BẢN</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Năm trình tự giữa IRL và ERL — thường gặp, nhưng không cái nào là luật</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đỏ = ERL trên · Xanh = ERL dưới · Vàng = IRL (FVG / đỉnh-đáy nội bộ). Mỗi ô là một hình dựng (synthetic).</text>
