<text x="40.0" y="645.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Lấy ERL này xong đi thẳng tới ERL kế tiếp; xu</text>
<text x="40.0" y="661.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">hướng mạnh, ít quay đầu.</text>
<rect x="346.7" y="399.0" width="306.7" height="300.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
