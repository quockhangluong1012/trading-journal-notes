<text x="358.7" y="333.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Quét BSL → đóng cửa lại bên trong → về FVG bên</text>
<text x="358.7" y="349.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">trong.</text>
