<text x="694.0" y="157.5" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Một cái đáy đã có từ trước (đáy cũ).</text>
<circle cx="676.0" cy="179.5" r="10.0" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="676.0" y="183.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
