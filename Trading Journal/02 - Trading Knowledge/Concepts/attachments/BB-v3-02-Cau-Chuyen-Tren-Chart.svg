<text x="694.0" y="200.5" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Nến tăng cuối cùng ở đỉnh, ngay trước khi</text>
<text x="694.0" y="217.5" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">giá rơi. ICT gọi đây là bearish Order Block.</text>
<circle cx="676.0" cy="239.6" r="10.0" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="676.0" y="243.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="694.0" y="243.6" font-size="12.5" font-weight="700" fill="#E5484D">Thủng sàn</text>
<text x="694.0" y="260.6" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Giá đi xuống DƯỚI đáy cũ. ICT gọi là chạy</text>
<text x="694.0" y="277.6" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">stop / lấy sell-side liquidity.</text>
<circle cx="676.0" cy="299.7" r="10.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="676.0" y="303.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="694.0" y="303.7" font-size="12.5" font-weight="700" fill="#0E9F6E">Xuyên trần</text>
<text x="694.0" y="320.7" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Giá quay lên và ĐÓNG NẾN trên đỉnh giữa.</text>
<text x="694.0" y="337.7" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Cái trần đã thất bại.</text>
<circle cx="676.0" cy="359.7" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="676.0" y="363.7" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="694.0" y="363.7" font-size="12.5" font-weight="700" fill="#2563EB">Trần thành sàn</text>
<text x="694.0" y="380.7" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Từ lúc này vùng nến ở ② được gọi là Bullish</text>
<text x="694.0" y="397.8" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Breaker.</text>
<circle cx="676.0" cy="419.8" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="676.0" y="423.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="694.0" y="423.8" font-size="12.5" font-weight="700" fill="#111827">Bóng rơi lại</text>
<text x="694.0" y="440.8" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">Giá quay về vùng đó. Có thể bật lên, có thể</text>
<text x="694.0" y="457.9" font-size="12" font-weight="400" fill="#111827" data-bx="693.0,959.0">thủng. Phải quan sát, không đoán.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Sơ đồ dựng, không phải dữ liệu thị trường. Trục dọc là giá (lên = đắt hơn), trục ngang là thời gian (trái → phải).</text>
