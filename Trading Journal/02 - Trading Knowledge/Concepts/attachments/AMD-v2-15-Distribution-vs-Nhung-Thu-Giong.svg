<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="698" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Distribution thật khác gì một cú bật, một nhịp hồi, hay một cú chạy hụt?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cả bốn đều bắt đầu bằng một đoạn giá đi mạnh. Điểm khác nằm ở những gì xảy ra NGAY SAU: giá có giữ được hướng mới, có tôn trọng</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">khoảng trống mình để lại, có đi về một đích rõ không.</text>
<rect x="854.9" y="22.0" width="117.1" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="913.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DISTRIBUTION</text>
<rect x="28.0" y="100.0" width="466.0" height="262.0" rx="10" fill="#ECFDF3" stroke="#15803D" stroke-width="1.1"/>
<circle cx="46.0" cy="119.0" r="9" fill="#15803D"/>
<text x="46.0" y="123.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="62.0" y="123.0" font-size="12.4" font-weight="700" fill="#15803D" text-anchor="start">Distribution thật</text>
<rect x="40.0" y="134.0" width="442.0" height="150.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="154.9" y="228.6" width="327.1" height="12.5" rx="2" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="478.0" y="224.6" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="end">FVG</text>
<path d="M40.0,262.4 L84.2,269.5 L128.4,258.8 L172.6,230.3 L216.8,209.0 L261.0,217.9 L305.2,194.8 L349.4,177.0 L393.6,185.9 L437.8,162.7 L482.0,148.5" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="302.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Nến to liên tiếp, phá đỉnh có ý nghĩa, hồi nông, vùng FVG được giữ, giá đi về</text>
<text x="40.0" y="317.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">phía đích (DOL).</text>
<rect x="506.0" y="100.0" width="466.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="524.0" cy="119.0" r="9" fill="#B91C1C"/>
<text x="524.0" y="123.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="540.0" y="123.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Cú bật tạm thời (impulse rồi hết)</text>
<rect x="518.0" y="134.0" width="442.0" height="150.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<path d="M518.0,253.4 L562.2,269.5 L606.4,245.3 L650.6,148.5 L694.8,188.8 L739.0,221.1 L783.2,253.4 L827.4,237.2 L871.6,257.4 L915.8,245.3 L960.0,253.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="518.0" y="302.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Một nến to rồi bị lấy lại toàn bộ. Không phá cấu trúc nào quan trọng, không ai</text>
<text x="518.0" y="317.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">theo sau.</text>
<rect x="28.0" y="374.0" width="466.0" height="262.0" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.1"/>
<circle cx="46.0" cy="393.0" r="9" fill="#B45309"/>
<text x="46.0" y="397.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="62.0" y="397.0" font-size="12.4" font-weight="700" fill="#B45309" text-anchor="start">Nhịp hồi bình thường trong xu hướng giảm</text>
<rect x="40.0" y="408.0" width="442.0" height="150.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="40.0" y1="422.5" x2="482.0" y2="422.5" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="480.0" y="418.5" font-size="9.5" font-weight="600" fill="#B91C1C" text-anchor="end">đỉnh có ý nghĩa</text>
<path d="M40.0,422.5 L84.2,441.4 L128.4,464.1 L172.6,486.8 L216.8,471.7 L261.0,460.3 L305.2,469.8 L349.4,490.6 L393.6,513.2 L437.8,528.4 L482.0,543.5" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="576.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi lên một đoạn nhưng vẫn dưới đỉnh có ý nghĩa của xu hướng giảm. Không</text>
<text x="40.0" y="591.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">đổi gì ở khung lớn.</text>
<rect x="506.0" y="374.0" width="466.0" height="262.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.1"/>
<circle cx="524.0" cy="393.0" r="9" fill="#B91C1C"/>
<text x="524.0" y="397.0" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✗</text>
<text x="540.0" y="397.0" font-size="12.4" font-weight="700" fill="#B91C1C" text-anchor="start">Cú chạy hụt (expansion thất bại)</text>
<rect x="518.0" y="408.0" width="442.0" height="150.0" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="632.9" y="458.5" width="327.1" height="18.0" rx="2" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="956.0" y="454.5" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="end">FVG</text>
<path d="M518.0,507.5 L562.2,517.7 L606.4,502.3 L650.6,461.1 L694.8,430.2 L739.0,440.5 L783.2,422.5 L827.4,456.0 L871.6,492.0 L915.8,522.9 L960.0,543.5" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="518.0" y="576.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Phá cấu trúc xong quay ngược xuyên qua điểm xuất phát. FVG bị xuyên thủng</text>
<text x="518.0" y="591.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">→ giả thuyết bị hủy.</text>
<rect x="28.0" y="650.0" width="944.0" height="48.6" rx="8" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1"/>
<text x="38.0" y="672.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không có một dấu hiệu đơn lẻ nào đủ. Displacement + MSS + giá giữ hướng + FVG được tôn trọng là một CỤM bằng chứng. Thiếu càng nhiều mắt xích, giả</text>
<text x="38.0" y="688.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thuyết càng yếu.</text>
</svg>
