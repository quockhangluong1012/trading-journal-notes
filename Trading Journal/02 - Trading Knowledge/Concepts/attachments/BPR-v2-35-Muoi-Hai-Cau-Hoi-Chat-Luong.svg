<svg viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="608" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="871.0" y="22" width="101.0" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="921.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CHẤT LƯỢNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Điều gì làm một BPR đáng quan tâm? — mười hai câu hỏi, không chấm điểm</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không cộng điểm. Mỗi câu hỏi là một CỘT trong journal. Nhãn góc phải cho biết đây là quy tắc ICT, diễn giải, hay giả thuyết cần kiểm chứng.</text>
<rect x="28.0" y="86.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="178.5" y="93.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="212.2" y="107.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="46.0" cy="104.0" r="10" fill="#1F2937"/>
<text x="46.0" y="108.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="40.0" y="136.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">FVG thứ nhất mạnh?</text>
<text x="40.0" y="170.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Có displacement thật, hay chỉ là nến</text>
<text x="40.0" y="185.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">nhỉnh hơn?</text>
<rect x="267.0" y="86.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="417.5" y="93.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="451.2" y="107.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="285.0" cy="104.0" r="10" fill="#1F2937"/>
<text x="285.0" y="108.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="279.0" y="136.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">FVG thứ hai mạnh?</text>
<text x="279.0" y="170.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Leg quay đầu có lực tương đương</text>
<text x="279.0" y="185.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">không?</text>
<rect x="506.0" y="86.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="656.5" y="93.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="690.2" y="107.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="524.0" cy="104.0" r="10" fill="#1F2937"/>
<text x="524.0" y="108.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="518.0" y="136.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Phần chồng đủ dày?</text>
<text x="518.0" y="170.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Lớn hơn spread và nhiễu bình thường</text>
<text x="518.0" y="185.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">của khung đó?</text>
<rect x="745.0" y="86.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="895.5" y="93.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="929.2" y="107.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="763.0" cy="104.0" r="10" fill="#1F2937"/>
<text x="763.0" y="108.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="757.0" y="136.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Có displacement hai phía?</text>
<text x="757.0" y="170.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Hay một phía là cú giật tin?</text>
<rect x="28.0" y="210.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="185.7" y="217.5" width="60.3" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B45309" stroke-width="1.1"/>
<text x="215.8" y="231.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<circle cx="46.0" cy="228.0" r="10" fill="#1F2937"/>
<text x="46.0" y="232.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="40.0" y="260.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Gắn với cấu trúc?</text>
<text x="40.0" y="294.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Nằm ở cổ chữ V phá swing quan trọng,</text>
<text x="40.0" y="309.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">hay giữa range?</text>
<rect x="267.0" y="210.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="417.5" y="217.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="451.2" y="231.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="285.0" cy="228.0" r="10" fill="#1F2937"/>
<text x="285.0" y="232.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="279.0" y="260.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Có sự kiện thanh khoản?</text>
<text x="279.0" y="294.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Có sweep external/internal ngay trước</text>
<text x="279.0" y="309.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">không?</text>
<rect x="506.0" y="210.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="692.0" y="217.5" width="32.0" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="708.0" y="231.0" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<circle cx="524.0" cy="228.0" r="10" fill="#1F2937"/>
<text x="524.0" y="232.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="518.0" y="260.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Vị trí trong dealing range?</text>
<text x="518.0" y="294.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Premium/discount đúng với hướng D1?</text>
<rect x="745.0" y="210.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="931.0" y="217.5" width="32.0" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="947.0" y="231.0" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<circle cx="763.0" cy="228.0" r="10" fill="#1F2937"/>
<text x="763.0" y="232.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="757.0" y="260.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Khoảng cách tới DOL?</text>
<text x="757.0" y="294.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Còn đủ đường để đi (R:R) không?</text>
<rect x="28.0" y="334.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="178.5" y="341.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="212.2" y="355.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="46.0" cy="352.0" r="10" fill="#1F2937"/>
<text x="46.0" y="356.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="40.0" y="384.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Còn fresh?</text>
<text x="40.0" y="418.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Đã bị chạm chưa, chạm mấy lần?</text>
<rect x="267.0" y="334.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="417.5" y="341.5" width="67.5" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="451.2" y="355.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">BACKTEST</text>
<circle cx="285.0" cy="352.0" r="10" fill="#1F2937"/>
<text x="285.0" y="356.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="279.0" y="384.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Độ sâu các lần chạm trước?</text>
<text x="279.0" y="418.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Nông, tới giữa, hay xuyên?</text>
<rect x="506.0" y="334.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="692.0" y="341.5" width="32.0" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="708.0" y="355.0" font-size="9.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ICT</text>
<circle cx="524.0" cy="352.0" r="10" fill="#1F2937"/>
<text x="524.0" y="356.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text>
<text x="518.0" y="384.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Cùng hướng khung lớn?</text>
<text x="518.0" y="418.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">D1 bias và H1 cấu trúc ủng hộ?</text>
<rect x="745.0" y="334.0" width="228.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="902.7" y="341.5" width="60.3" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#B45309" stroke-width="1.1"/>
<text x="932.8" y="355.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<circle cx="763.0" cy="352.0" r="10" fill="#1F2937"/>
<text x="763.0" y="356.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text>
<text x="757.0" y="384.0" font-size="12.3" font-weight="700" fill="#1F2937" text-anchor="start">Chế độ thị trường?</text>
<text x="757.0" y="418.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Trend rõ, range, hay ngày tin lớn?</text>
<rect x="28.0" y="464.0" width="944.0" height="74.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="40.0" y="488.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">Ba câu hỏi riêng biệt</text>
<text x="40.0" y="508.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">① BPR có hình thành HỢP LỆ không (định nghĩa)? ② BPR có ĐÁNG QUAN TÂM không (mười hai câu trên)? ③ BPR có tạo ra CƠ HỘI GIAO DỊCH không (chỉ khi M5 cho xác</text>
<text x="40.0" y="524.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhận)? Một BPR có thể “có” ở ①, “có” ở ②, và vẫn “không” ở ③.</text>
<text x="28.0" y="590.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Không câu nào ở đây là quy tắc chính thức của ICT về BPR, trừ các câu về bối cảnh (dealing range, DOL, bias) vốn là khung chung của ICT.</text>
</svg>
