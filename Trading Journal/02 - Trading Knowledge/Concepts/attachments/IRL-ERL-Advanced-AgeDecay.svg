<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">IRL Age Decay — FVG càng "già" và bị chạm nhiều lần, sức hút làm draw càng yếu</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Cùng vẽ trên chart với biên không đổi, nhưng "trọng lượng" thanh khoản còn lại rất khác nhau</text>

  <!-- Panel 1: young FVG -->
  <rect x="24" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="94" font-size="13.5" font-weight="700" fill="#16A34A">① FVG "trẻ" — chưa bị chạm</text>
  <text x="36" y="110" font-size="10" fill="#6B7280">Hình thành trong phiên/ngày hiện tại</text>

  <path d="M60,150 L100,190 L140,170 L180,220" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="140" y="185" width="60" height="40" fill="#16A34A" opacity="0.28"/>
  <text x="146" y="180" font-size="9.5" font-weight="700" fill="#166534">FVG mới, biên nguyên vẹn</text>

  <path d="M180,220 L230,260 L280,300 L320,340" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="220" y="360" font-size="9.5" fill="#6B7280">Giá quay lại lần đầu — dự kiến phản ứng mạnh</text>

  <rect x="36" y="384" width="308" height="28" rx="6" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="1"/>
  <text x="44" y="402" font-size="9.5" fill="#166534">Draw mạnh — ưu tiên hàng đầu làm IRL target</text>

  <!-- Panel 2: old decayed FVG -->
  <rect x="392" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="404" y="94" font-size="13.5" font-weight="700" fill="#B45309">② FVG "già" — đã chạm 3 lần</text>
  <text x="404" y="110" font-size="10" fill="#6B7280">Hình thành 4-5 ngày trước</text>

  <rect x="508" y="185" width="60" height="40" fill="#9CA3AF" opacity="0.35"/>
  <text x="512" y="180" font-size="9.5" font-weight="700" fill="#6B7280">Biên vẽ không đổi trên chart</text>

  <!-- 3 touches, each shallower reaction -->
  <path d="M428,150 L460,190 L500,205 L520,205" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="430" y="145" font-size="8.5" fill="#6B7280">Chạm 1 (wick nhẹ)</text>

  <path d="M520,205 L545,225 L560,210 L575,205" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="530" y="245" font-size="8.5" fill="#6B7280">Chạm 2</text>

  <path d="M575,205 L600,215 L620,205 L635,215" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="590" y="235" font-size="8.5" fill="#6B7280">Chạm 3 (gần cạn)</text>

  <path d="M635,215 L660,260 L690,310 L712,350" fill="none" stroke="#DC2626" stroke-width="2.2"/>
  <text x="620" y="365" font-size="9.5" font-weight="700" fill="#B91C1C">Lần thứ 4: giá xuyên thẳng qua, không phản ứng</text>

  <rect x="404" y="384" width="308" height="28" rx="6" fill="#B45309" opacity="0.08" stroke="#B45309" stroke-width="1"/>
  <text x="412" y="402" font-size="9.5" fill="#92400E">Draw yếu — ưu tiên IRL/ERL khác mới hơn</text>
</svg>
