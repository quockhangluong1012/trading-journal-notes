<svg viewBox="0 0 980 1040" width="980" height="1040" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="1040" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mô hình tư duy cuối cùng — mỗi mũi tên được giải thích bằng ngôn ngữ đơn giản</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Xanh dương = cơ chế thị trường. Cam = diễn giải của ICT. Tím = giả thuyết cần kiểm chứng.</text>
<rect x="180.0" y="80.0" width="240.0" height="44.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="300.0" y="108.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">MARKET</text>
<line x1="300.0" y1="124.0" x2="300.0" y2="150.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#aB)"/>
<text x="440.0" y="108.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">nơi người muốn mua gặp người muốn bán</text>
<rect x="180.0" y="150.0" width="240.0" height="44.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="300.0" y="178.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">BUYERS + SELLERS</text>
<line x1="300.0" y1="194.0" x2="300.0" y2="220.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#aB)"/>
<text x="440.0" y="178.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">mỗi người có lý do riêng, mức giá riêng, độ sốt ruột riêng</text>
<rect x="180.0" y="220.0" width="240.0" height="44.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="300.0" y="248.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">ORDERS</text>
<line x1="300.0" y1="264.0" x2="300.0" y2="290.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#aB)"/>
<text x="440.0" y="248.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">họ nói ý muốn bằng lệnh: market (ngay), limit (chờ), stop (khi chạm)</text>
<rect x="180.0" y="290.0" width="240.0" height="44.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="300.0" y="318.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">ORDER MATCHING</text>
<line x1="300.0" y1="334.0" x2="300.0" y2="360.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#aB)"/>
<text x="440.0" y="318.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">lệnh gặp nhau → giao dịch; ai chấp nhận giá người kia thì khớp</text>
<rect x="180.0" y="360.0" width="240.0" height="44.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="300.0" y="388.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">PRICE DISCOVERY</text>
<line x1="300.0" y1="404.0" x2="300.0" y2="430.0" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#aB)"/>
<text x="440.0" y="388.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">giao dịch tiếp theo xảy ra ở đâu → đó là "giá mới"</text>
<rect x="180.0" y="430.0" width="240.0" height="44.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="300.0" y="458.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">PRICE MOVEMENT</text>
<text x="440.0" y="458.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">chuỗi giao dịch ở các mức khác nhau theo thời gian</text>
<rect x="80.0" y="500.0" width="200.0" height="44.0" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.5"/>
<text x="180.0" y="528.0" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">STRUCTURE</text>
<rect x="320.0" y="500.0" width="200.0" height="44.0" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.5"/>
<text x="420.0" y="528.0" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">LIQUIDITY</text>
<line x1="260.0" y1="474.0" x2="180.0" y2="500.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<line x1="340.0" y1="474.0" x2="420.0" y2="500.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<path d="M 280,522 L 320,522" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
<text x="560.0" y="508.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">giá để lại đỉnh/đáy (structure); con người đặt lệnh</text>
<text x="560.0" y="525.1" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">quanh đỉnh/đáy đó (liquidity) — hai thứ nuôi nhau</text>
<line x1="180.0" y1="544.0" x2="280.0" y2="570.0" stroke="#B45309" stroke-width="1.6" marker-end="url(#aO)"/>
<line x1="420.0" y1="544.0" x2="320.0" y2="570.0" stroke="#B45309" stroke-width="1.6" marker-end="url(#aO)"/>
<rect x="180.0" y="570.0" width="240.0" height="44.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="300.0" y="598.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">PRICE DELIVERY</text>
<text x="440.0" y="598.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">ICT đặt tên cho đường đi: từ vùng này tới vùng kia</text>
<line x1="300.0" y1="614.0" x2="300.0" y2="640.0" stroke="#B45309" stroke-width="1.8" marker-end="url(#aO)"/>
<rect x="180.0" y="640.0" width="240.0" height="44.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="300.0" y="668.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">ICT INTERPRETATION</text>
<text x="440.0" y="668.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">đọc đường đi bằng liquidity, PD array, structure, time</text>
<line x1="300.0" y1="684.0" x2="300.0" y2="710.0" stroke="#B45309" stroke-width="1.8" marker-end="url(#aO)"/>
<rect x="180.0" y="710.0" width="240.0" height="44.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="300.0" y="738.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">IPDA</text>
<text x="440.0" y="738.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">mô hình khái niệm gom các cách đọc đó thành một hệ</text>
<rect x="70.0" y="790.0" width="140.0" height="40.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="140.0" y="815.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">PRICE</text>
<line x1="300.0" y1="754.0" x2="140.0" y2="790.0" stroke="#B45309" stroke-width="1.4" marker-end="url(#aO)"/>
<rect x="230.0" y="790.0" width="140.0" height="40.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="300.0" y="815.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">TIME</text>
<line x1="300.0" y1="754.0" x2="300.0" y2="790.0" stroke="#B45309" stroke-width="1.4" marker-end="url(#aO)"/>
<rect x="390.0" y="790.0" width="140.0" height="40.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="460.0" y="815.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">LIQUIDITY</text>
<line x1="300.0" y1="754.0" x2="460.0" y2="790.0" stroke="#B45309" stroke-width="1.4" marker-end="url(#aO)"/>
<text x="560.0" y="815.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">ba trục mà IPDA dùng để mô tả delivery</text>
<rect x="180.0" y="862.0" width="240.0" height="44.0" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.6"/>
<text x="300.0" y="890.0" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="middle">DOL (giả thuyết)</text>
<line x1="300.0" y1="830.0" x2="300.0" y2="862.0" stroke="#6D28D9" stroke-width="1.8" marker-end="url(#aP)"/>
<text x="440.0" y="882.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">câu trả lời TẠM THỜI cho "giá có thể được kéo về đâu?"</text>
<text x="440.0" y="900.0" font-size="11.8" font-weight="600" fill="#6D28D9" text-anchor="start">→ phải có invalidation, phải vượt baseline</text>
<rect x="26.0" y="928.0" width="928.0" height="94.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="952.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Đọc theo chiều xuống = nhân quả (có cơ sở). Đọc theo chiều lên = suy luận (từ chart đoán cơ chế).</text>
<text x="40.0" y="969.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Khi phân tích chart thật, bạn luôn đi NGƯỢC chiều: thấy price movement → đoán liquidity → đoán delivery → đặt giả thuyết DOL.</text>
<text x="40.0" y="986.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi bước ngược đều mất thông tin. Vì thế mọi kết luận ở tầng cam/tím phải mang nhãn [INTERPRETATION] hoặc [HYPOTHESIS].</text>
</svg>
