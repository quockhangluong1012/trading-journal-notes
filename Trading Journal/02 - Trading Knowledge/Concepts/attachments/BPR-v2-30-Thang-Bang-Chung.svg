<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="825.2" y="22" width="146.8" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="898.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">THANG BẰNG CHỨNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Năm bậc: Location → Confluence → Evidence → Confirmation → Trigger</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">BPR thường chỉ đứng ở bậc 1–2. Nhiều lỗi xảy ra vì nhảy thẳng từ “có BPR” sang “vào lệnh”, bỏ qua ba bậc giữa.</text>
<rect x="28.0" y="366.0" width="180.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
<text x="38.0" y="388.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">1 · LOCATION</text>
<text x="38.0" y="406.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Vị trí</text>
<text x="38.0" y="426.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">BPR nằm trong POI của D1/H1,</text>
<text x="38.0" y="441.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đúng phía premium/discount.</text>
<text x="38.0" y="460.4" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">“Giá đang ở chỗ đáng xem.”</text>
<rect x="218.0" y="316.0" width="180.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="228.0" y="338.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="start">2 · CONFLUENCE</text>
<text x="228.0" y="356.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Trùng lặp</text>
<text x="228.0" y="376.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">BPR trùng với OB, FVG khung</text>
<text x="228.0" y="391.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lớn, hay một mức liquidity.</text>
<text x="228.0" y="410.4" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">“Nhiều lý do cùng chỉ về một</text>
<text x="228.0" y="424.9" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">chỗ.” Không cộng dồn thành</text>
<text x="228.0" y="439.3" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">xác suất.</text>
<rect x="408.0" y="266.0" width="180.0" height="210.0" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
<text x="418.0" y="288.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">3 · EVIDENCE</text>
<text x="418.0" y="306.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Bằng chứng giá</text>
<text x="418.0" y="326.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá tới vùng và CÓ hành vi:</text>
<text x="418.0" y="341.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">quét một đỉnh/đáy nhỏ, nến từ</text>
<text x="418.0" y="356.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chối.</text>
<text x="418.0" y="375.5" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">“Giá đang làm gì ở đây?”</text>
<rect x="598.0" y="216.0" width="180.0" height="260.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<text x="608.0" y="238.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">4 · CONFIRMATION</text>
<text x="608.0" y="256.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Xác nhận</text>
<text x="608.0" y="276.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">M5: MSS có displacement,</text>
<text x="608.0" y="291.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">phá một swing có ý nghĩa.</text>
<text x="608.0" y="310.4" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">“Hướng ngắn hạn đã đổi theo ý</text>
<text x="608.0" y="324.9" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">mình.”</text>
<rect x="788.0" y="166.0" width="180.0" height="310.0" rx="10" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.6"/>
<text x="798.0" y="188.0" font-size="12" font-weight="700" fill="#0F7A5A" text-anchor="start">5 · TRIGGER</text>
<text x="798.0" y="206.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="start">Điều kiện vào lệnh</text>
<text x="798.0" y="226.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá hồi về FVG mới của M5</text>
<text x="798.0" y="241.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">(hoặc entry đã định nghĩa),</text>
<text x="798.0" y="256.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">stop và target đã rõ.</text>
<text x="798.0" y="275.5" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">“Lệnh được đặt.”</text>
<rect x="28.0" y="490.0" width="944.0" height="74.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="40.0" y="514.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">BPR đứng ở đâu?</text>
<text x="40.0" y="534.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">BPR trả lời bậc 1 (vị trí) và có thể góp vào bậc 2 (trùng lặp). Nó không phải bằng chứng (bậc 3), không phải xác nhận (bậc 4), càng không phải điều kiện vào lệnh (bậc 5).</text>
<text x="28.0" y="620.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Càng nhiều PD array chồng lên nhau càng dễ tạo cảm giác chắc chắn. Nhưng ba lý do cùng dựa trên một cú di chuyển giá thật ra chỉ là MỘT bằng chứng được đếm ba lần.</text>
</svg>
