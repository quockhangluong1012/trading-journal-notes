<line x1="132.3" y1="303.1" x2="338.2" y2="303.1" stroke="#2563EB" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="261.0" y1="242.0" x2="466.9" y2="242.0" stroke="#2563EB" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
<text x="46.0" y="472.5" font-size="12.5" font-weight="700" fill="#2563EB">HH</text>
<text x="82.0" y="472.5" font-size="12.2" font-weight="400" fill="#111827">= đẩy được lên chỗ mới</text>
<text x="46.0" y="493.5" font-size="12.5" font-weight="700" fill="#0E9F6E">HL</text>
<text x="82.0" y="493.5" font-size="12.2" font-weight="400" fill="#111827">= lùi, nhưng có người mua sớm hơn</text>
<text x="46.0" y="520.5" font-size="12" font-weight="400" fill="#111827" data-bx="45.0,477.0">HL quan trọng vì nó cho thấy người mua chấp nhận trả giá CAO HƠN lần</text>
<text x="46.0" y="537.5" font-size="12" font-weight="400" fill="#111827" data-bx="45.0,477.0">trước. Đáy nào phóng ra cú vượt đỉnh gần nhất (ở đây: 111) là protected</text>
<text x="46.0" y="554.5" font-size="12" font-weight="400" fill="#111827" data-bx="45.0,477.0">low. Mất nó = câu “đang tăng” sai.</text>
<rect x="506.0" y="92.5" width="466.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
