<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="638.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cấu trúc tăng (HH–HL) và cấu trúc giảm (LH–LL): mỗi nhãn đang nói điều gì?</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Số trên chart là giá minh họa. Đừng học thuộc nhãn — hãy đọc câu tiếng Việt bên dưới mỗi nhãn: đó mới là ý nghĩa.</text>
<rect x="28.0" y="92.5" width="466.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="118.0" font-size="13.5" font-weight="700" fill="#0E9F6E" data-bx="41.0,483.0">Cấu trúc TĂNG</text>
