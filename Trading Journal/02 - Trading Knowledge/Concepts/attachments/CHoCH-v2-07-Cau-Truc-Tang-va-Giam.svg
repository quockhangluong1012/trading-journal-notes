<text x="524.0" y="472.5" font-size="12.5" font-weight="700" fill="#2563EB">LL</text>
<text x="560.0" y="472.5" font-size="12.2" font-weight="400" fill="#111827">= đẩy được xuống chỗ mới</text>
<text x="524.0" y="493.5" font-size="12.5" font-weight="700" fill="#E5484D">LH</text>
<text x="560.0" y="493.5" font-size="12.2" font-weight="400" fill="#111827">= hồi, nhưng có người bán sớm hơn</text>
<text x="524.0" y="520.5" font-size="12" font-weight="400" fill="#111827" data-bx="523.0,955.0">LH quan trọng vì nó cho thấy người bán chấp nhận bán ở giá THẤP HƠN</text>
<text x="524.0" y="537.5" font-size="12" font-weight="400" fill="#111827" data-bx="523.0,955.0">lần trước. Đỉnh phóng ra cú thủng đáy gần nhất (ở đây: 112) là protected</text>
<text x="524.0" y="554.5" font-size="12" font-weight="400" fill="#111827" data-bx="523.0,955.0">high. Mất nó = câu “đang giảm” sai.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đây là định nghĩa kiểu Dow Theory (cuối thế kỷ 19), không phải phát minh của ICT. ICT/SMC thêm tên gọi cho các cú phá: BOS, CHoCH, MSS.</text>
