<text x="228.8" y="373.2" font-size="11" font-weight="700" fill="#0E9F6E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="62.0,460.0">HL</text>
