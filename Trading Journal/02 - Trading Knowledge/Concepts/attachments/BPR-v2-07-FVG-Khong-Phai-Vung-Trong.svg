<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="886.7" y="22" width="85.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="929.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">FVG có phải “vùng giá chưa ai giao dịch”? — Không hẳn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">So sánh một FVG với một khoảng trống mở cửa (opening gap). Ở FVG, nến 2 đã đi xuyên qua dải giá. Ở gap mở cửa, giá nhảy cóc và thật sự không có giao dịch</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nào ở giữa.</text>
<rect x="28.0" y="103.0" width="460.0" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="125.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Fair Value Gap</text>
<line x1="172.4" y1="372.9" x2="172.4" y2="450.2" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="162.4" y="388.3" width="20.0" height="38.7" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="258.0" y1="210.5" x2="258.0" y2="396.1" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="248.0" y="225.9" width="20.0" height="162.4" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="343.6" y1="171.8" x2="343.6" y2="311.0" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="333.6" y="187.3" width="20.0" height="38.7" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<rect x="133.9" y="311.0" width="333.8" height="61.9" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="276.0" cy="357.4" r="3.2" fill="#1D4ED8"/>
<circle cx="276.0" cy="326.5" r="3.2" fill="#1D4ED8"/>
<circle cx="276.0" cy="295.5" r="3.2" fill="#1D4ED8"/>
<circle cx="276.0" cy="264.6" r="3.2" fill="#1D4ED8"/>
<text x="258.0" y="311.0" font-size="10" font-weight="700" fill="#1F2937" text-anchor="middle"></text>
<text x="284.0" y="249.1" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">giao dịch CÓ xảy ra</text>
<text x="284.0" y="264.1" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">bên trong nến 2</text>
<text x="52.6" y="147.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nến 2 đi qua dải xanh. Chỉ là: trong ba nến này, đây là nến DUY NHẤT chạm dải</text>
<text x="52.6" y="162.6" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đó, và nó đi một mạch.</text>
<rect x="506.0" y="103.0" width="466.0" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="518.0" y="125.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Opening gap (ví dụ khoảng trống cuối tuần)</text>
<line x1="652.2" y1="372.9" x2="652.2" y2="450.2" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="642.2" y="388.3" width="20.0" height="38.7" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="773.7" y1="210.5" x2="773.7" y2="287.8" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="763.7" y="225.9" width="20.0" height="46.4" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<rect x="613.1" y="287.8" width="199.6" height="85.1" rx="2" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="713.0" y="334.3" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">không có</text>
<text x="713.0" y="349.3" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">giao dịch nào</text>
<text x="652.2" y="481.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">đóng cửa thứ Sáu</text>
<text x="773.7" y="481.0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">mở cửa đầu tuần</text>
<text x="530.7" y="147.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Ở đây giá nhảy cóc. Đây mới đúng là “vùng chưa giao dịch”.</text>
<text x="28.0" y="540.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Vì vậy cách nói chính xác hơn: FVG là dải giá được đi qua NHANH và MỘT CHIỀU trong cửa sổ ba nến. Còn nó có phải “mất cân bằng lệnh” hay không là diễn giải.</text>
</svg>
