<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="760" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cây quyết định OB (real-time) — mỗi nút được gắn loại: ĐỊNH NGHĨA · QUY TẮC (heuristic) · GIẢ THUYẾT</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Chỉ dùng thông tin có tại thời điểm của nút. Nút GIẢ THUYẾT = nơi bạn đang đặt cược vào một điều chưa được đo — ghi lại để kiểm chứng.</text>
<rect x="26.0" y="84.0" width="640.0" height="54.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="40.0" y="106.0" font-size="10.6" font-weight="700" fill="#6D28D9" text-anchor="start">1. Có nến/chuỗi nến ngược hướng ngay trước một cú mở rộng?</text>
<rect x="40.0" y="115.4" width="60.2" height="18.6" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="70.1" y="128.0" font-size="8.6" font-weight="600" fill="#6D28D9" text-anchor="middle">ĐỊNH NGHĨA</text>
<line x1="666.0" y1="111.0" x2="696.0" y2="111.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="115.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → không có OB</text>
<line x1="120.0" y1="138.0" x2="120.0" y2="150.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="148.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="150.0" width="640.0" height="54.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="40.0" y="172.0" font-size="10.6" font-weight="700" fill="#6D28D9" text-anchor="start">2. Displacement đạt ngưỡng (Net ≥ x ATR, thân ≥ y) — biết ở close nến e?</text>
<rect x="40.0" y="181.4" width="60.2" height="18.6" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="70.1" y="194.0" font-size="8.6" font-weight="600" fill="#6D28D9" text-anchor="middle">ĐỊNH NGHĨA</text>
<line x1="666.0" y1="177.0" x2="696.0" y2="177.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="181.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → ghi 'D0', không giao dịch</text>
<line x1="120.0" y1="204.0" x2="120.0" y2="216.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="214.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="216.0" width="640.0" height="54.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="40.0" y="238.0" font-size="10.6" font-weight="700" fill="#6D28D9" text-anchor="start">3. Close vượt swing ĐÃ XÁC NHẬN (BOS/MSS) — t_avail?</text>
<rect x="40.0" y="247.4" width="60.2" height="18.6" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="70.1" y="260.0" font-size="8.6" font-weight="600" fill="#6D28D9" text-anchor="middle">ĐỊNH NGHĨA</text>
<line x1="666.0" y1="243.0" x2="696.0" y2="243.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="247.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → OB D3a (đo riêng nếu muốn)</text>
<line x1="120.0" y1="270.0" x2="120.0" y2="282.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="280.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="282.0" width="640.0" height="54.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="40.0" y="304.0" font-size="10.6" font-weight="700" fill="#6D28D9" text-anchor="start">4. Ghi đặc trưng: cấp swing, sweep, FVG, pd_pos, width/ATR, phiên, tin</text>
<rect x="40.0" y="313.4" width="60.2" height="18.6" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="70.1" y="326.0" font-size="8.6" font-weight="600" fill="#6D28D9" text-anchor="middle">ĐỊNH NGHĨA</text>
<line x1="666.0" y1="309.0" x2="696.0" y2="309.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="313.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">chỉ GHI — chưa lọc</text>
<line x1="120.0" y1="336.0" x2="120.0" y2="348.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="346.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="348.0" width="640.0" height="54.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="40.0" y="370.0" font-size="10.6" font-weight="700" fill="#B45309" text-anchor="start">5. OB cùng hướng D1 bias &amp; nằm trên đường tới DOL (không chặn bởi pool chưa quét)?</text>
