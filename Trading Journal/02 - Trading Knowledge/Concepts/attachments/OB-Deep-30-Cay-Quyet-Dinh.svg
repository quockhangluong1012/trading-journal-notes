<text x="74.9" y="392.0" font-size="8.6" font-weight="600" fill="#B45309" text-anchor="middle">QUY TẮC v0.1</text>
<line x1="666.0" y1="375.0" x2="696.0" y2="375.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="379.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → IGNORE (hoặc playbook countertrend)</text>
<line x1="120.0" y1="402.0" x2="120.0" y2="414.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="412.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="414.0" width="640.0" height="54.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="40.0" y="436.0" font-size="10.6" font-weight="700" fill="#B45309" text-anchor="start">6. OB còn hợp lệ: chưa invalidated, chưa superseded, tuổi &lt; T_max?</text>
<rect x="40.0" y="445.4" width="69.8" height="18.6" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="74.9" y="458.0" font-size="8.6" font-weight="600" fill="#B45309" text-anchor="middle">QUY TẮC v0.1</text>
<line x1="666.0" y1="441.0" x2="696.0" y2="441.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="445.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → xoá khỏi chart</text>
<line x1="120.0" y1="468.0" x2="120.0" y2="480.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="478.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="480.0" width="640.0" height="54.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="40.0" y="502.0" font-size="10.6" font-weight="700" fill="#B45309" text-anchor="start">7. Giá đã rời đi ≥ x ATR rồi quay lại chạm proximal?</text>
<rect x="40.0" y="511.4" width="69.8" height="18.6" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="74.9" y="524.0" font-size="8.6" font-weight="600" fill="#B45309" text-anchor="middle">QUY TẮC v0.1</text>
<line x1="666.0" y1="507.0" x2="696.0" y2="507.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="511.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">chưa → WAIT</text>
<line x1="120.0" y1="534.0" x2="120.0" y2="546.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="544.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="546.0" width="640.0" height="54.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="40.0" y="568.0" font-size="10.6" font-weight="700" fill="#B91C1C" text-anchor="start">8. Có bằng chứng LTF tại vùng: sweep → MSS → displacement (M5)?</text>
<rect x="40.0" y="577.4" width="60.2" height="18.6" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="70.1" y="590.0" font-size="8.6" font-weight="600" fill="#B91C1C" text-anchor="middle">GIẢ THUYẾT</text>
<line x1="666.0" y1="573.0" x2="696.0" y2="573.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="577.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → WAIT; quá W nến → IGNORE</text>
<line x1="120.0" y1="600.0" x2="120.0" y2="612.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="610.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="612.0" width="640.0" height="54.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="40.0" y="634.0" font-size="10.6" font-weight="700" fill="#B45309" text-anchor="start">9. Entry (FVG/OB M5), stop cấu trúc, target DOL: R:R ≥ R_min?</text>
<rect x="40.0" y="643.4" width="69.8" height="18.6" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="74.9" y="656.0" font-size="8.6" font-weight="600" fill="#B45309" text-anchor="middle">QUY TẮC v0.1</text>
<line x1="666.0" y1="639.0" x2="696.0" y2="639.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="702.0" y="643.0" font-size="9.8" font-weight="600" fill="#B91C1C" text-anchor="start">không → IGNORE (không 'chỉnh' stop cho đẹp)</text>
<line x1="120.0" y1="666.0" x2="120.0" y2="678.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="128.0" y="676.0" font-size="8.6" font-weight="700" fill="#15803D" text-anchor="start">có</text>
<rect x="26.0" y="678.0" width="640.0" height="54.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="40.0" y="700.0" font-size="10.6" font-weight="700" fill="#15803D" text-anchor="start">10. TRADE — ghi ob_state, scenario, mfe/mae sau khi đóng lệnh</text>
<rect x="40.0" y="709.4" width="60.2" height="18.6" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="70.1" y="722.0" font-size="8.6" font-weight="600" fill="#15803D" text-anchor="middle">ĐỊNH NGHĨA</text>
