<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Khúc quanh từ M sang D: sweep → reclaim → MSS → displacement → FVG</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phóng to vùng chuyển pha (bullish). Bên phải: ba biến thể thường gặp. FVG là “dấu chân” của displacement — hữu ích để chọn chỗ vào,</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nhưng không bắt buộc phải có, và có FVG cũng không bảo đảm gì.</text>
