<svg viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<rect x="1" y="1" width="998" height="608" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Quy trình 6 bước xác định mức CISD (không dùng hindsight)</text>
<rect x="880.6" y="22" width="91.4" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="926.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">QUY TRÌNH</text>
<text x="28.0" y="598.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<rect x="180.0" y="74.0" width="640.0" height="62.0" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="192.0" y="98.3" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">1 · Khai báo khung &amp; cách đếm</text>
<text x="192.0" y="120.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ghi trước: khung thời gian, múi giờ chart, quy ước chuỗi (liền mạch / gộp).</text>
<line x1="500.0" y1="137.0" x2="500.0" y2="149.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="180.0" y="150.0" width="640.0" height="62.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="192.0" y="174.3" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">2 · Delivery hiện tại là gì?</text>
<text x="192.0" y="196.5" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chuỗi nến cùng chiều gần nhất đang đi lên hay đi xuống? Nó đã chạm vùng thanh khoản / POI nào?</text>
<line x1="500.0" y1="212.9" x2="500.0" y2="224.9" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="180.0" y="225.9" width="640.0" height="62.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="192.0" y="250.3" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">3 · Tìm chuỗi cuối chạy vào cực trị</text>
<text x="192.0" y="272.5" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Từ cực trị (đáy/đỉnh vừa tạo) đếm ngược các nến đóng cùng chiều liền nhau.</text>
<line x1="500.0" y1="288.9" x2="500.0" y2="300.9" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="180.0" y="301.9" width="640.0" height="62.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="192.0" y="326.2" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">4 · Kẻ mức = open nến đầu chuỗi</text>
<text x="192.0" y="348.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Kẻ NGAY khi cực trị đã có, trước khi biết giá làm gì. Không dời mức về sau.</text>
<line x1="500.0" y1="364.8" x2="500.0" y2="376.8" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="180.0" y="377.8" width="640.0" height="62.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="192.0" y="402.2" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">5 · Chờ nến ĐÓNG CỬA</text>
<text x="192.0" y="424.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Râu vượt không tính. Nến chưa đóng = “đang hình thành”. Đóng vượt = CISD ở khung này.</text>
<line x1="500.0" y1="440.8" x2="500.0" y2="452.8" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="180.0" y="453.8" width="640.0" height="78.8" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="192.0" y="478.1" font-size="13" font-weight="700" fill="#059669" text-anchor="start">6 · Đánh giá follow-through</text>
<text x="192.0" y="500.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Có đóng lại phía bên kia không (thất bại mềm)? Có phá cực trị không (thất bại cứng)? Có MSS / FVG / đi</text>
<text x="192.0" y="517.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">về thanh khoản không?</text>
<text x="28.0" y="100.0" font-size="12" font-weight="700" fill="#DC2626" text-anchor="start">Khi nào</text>
<text x="28.0" y="116.0" font-size="12" font-weight="700" fill="#DC2626" text-anchor="start">dừng lại?</text>
<text x="28.0" y="136.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không xác định được</text>
<text x="28.0" y="151.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chuỗi rõ ràng, chart có</text>
<text x="28.0" y="166.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">gap lớn, hoặc không biết</text>
<text x="28.0" y="181.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">mình đang ở khung/bối</text>
<text x="28.0" y="196.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">cảnh nào → bỏ qua, không</text>
<text x="28.0" y="211.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">ép.</text>
<text x="838.0" y="100.0" font-size="12" font-weight="700" fill="#059669" text-anchor="start">Mẹo</text>
<text x="838.0" y="120.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đặt cảnh báo giá tại mức</text>
<text x="838.0" y="135.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">CISD ngay ở bước 4, rồi</text>
<text x="838.0" y="150.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">rời mắt khỏi chart cho</text>
<text x="838.0" y="165.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">tới khi nến đóng.</text>
</svg>
