<text x="498.8" y="394.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">validation 2020–2021</text>
<rect x="578.0" y="372.0" width="224.8" height="34.0" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="692.4" y="394.0" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">OOS khóa 2022–2024</text>
<rect x="806.8" y="372.0" width="119.2" height="34.0" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="868.4" y="394.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">forward / live 2025→</text>
<text x="50.0" y="430.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">Walk-forward: tối ưu trên cửa sổ trượt, đánh giá trên cửa sổ kế tiếp. OOS khóa chỉ được mở MỘT lần — mở lần hai = nó thành IS.</text>
<text x="50.0" y="450.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">Feed cố định (một broker hoặc futures), cùng múi giờ, cùng quy tắc rollover — nến khác feed → OB khác (v1 EdgeB-FeedOffset).</text>
<rect x="26.0" y="478.0" width="928.0" height="128.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="38.0" y="498.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="start">Ba lỗi phương pháp phổ biến nhất trong backtest OB tay (đối chiếu vault)</text>
<text x="38.0" y="516.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Chọn ngày để backtest SAU khi đã thấy chart → mẫu có điều kiện trên kết cục (22 backtest trong vault: được chọn tay — §50).</text>
<text x="38.0" y="533.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Ghi 'OB' cho cả vùng được dùng làm context lẫn vùng khớp lệnh → không tách được đóng góp OB vs FVG (≥ 3/8 lệnh gắn 'OB' trong vault thực ra khớp tại FVG/BPR).</text>
<text x="38.0" y="550.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Không ghi lệnh bị LỠ (limit không khớp) → E[R] trên mỗi setup bị thổi phồng; missed trade là một phần của chiến lược (HYP-OB-013).</text>
<text x="38.0" y="567.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Giải pháp: bảng ghi sự kiện theo OB-DEF + cột kết cục được điền SAU, bởi quy tắc, không bởi cảm nhận (Phụ lục B của 55 + §37 note này).</text>
