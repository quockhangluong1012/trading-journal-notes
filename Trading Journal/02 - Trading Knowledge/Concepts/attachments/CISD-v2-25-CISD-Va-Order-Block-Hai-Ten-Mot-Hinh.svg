<text x="407.4" y="244.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="650.0" y="108.0" width="322.0" height="77.4" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="662.0" y="132.3" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">Order Block = VÙNG</text>
<text x="662.0" y="154.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nơi chặng cũ diễn ra. ICT dùng open của (chuỗi) nến</text>
<text x="662.0" y="170.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">này và phần giữa thân làm mốc khi giá quay lại.</text>
<rect x="650.0" y="193.4" width="322.0" height="77.4" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="662.0" y="217.7" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">CISD = KHOẢNH KHẮC</text>
<text x="662.0" y="239.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">① Nến đóng trên open của OB. Nhiều người dạy (vd.</text>
<text x="662.0" y="255.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">TTrades) gọi đây là lúc OB “được xác nhận”.</text>
<rect x="650.0" y="278.7" width="322.0" height="93.5" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="662.0" y="303.1" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Dùng cùng nhau</text>
<text x="662.0" y="324.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">CISD trả lời “chặng cũ đã bị lấy lại chưa?”. OB trả lời</text>
<text x="662.0" y="340.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“nếu giá quay lại, vùng nào đáng theo dõi?”. Xem</text>
<text x="662.0" y="357.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">[[25-OB-Order-Block]].</text>
<rect x="650.0" y="380.2" width="322.0" height="93.5" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="662.0" y="404.5" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Cẩn thận</text>
<text x="662.0" y="426.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một CISD không tự động biến mọi chuỗi đỏ thành OB</text>
<text x="662.0" y="442.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“mạnh”. Chất lượng vẫn phụ thuộc bối cảnh,</text>
<text x="662.0" y="458.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">displacement và thanh khoản.</text>
