<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD và Order Block: hai cái tên nhìn cùng một hình</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Chuỗi nến đỏ #6–#9 trước cú tăng chính là ứng viên bullish Order Block. CISD là SỰ KIỆN giá đóng cửa vượt open của chuỗi đó. OB là</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">VÙNG; CISD là KHOẢNH KHẮC.</text>
<rect x="881.5" y="22" width="90.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="926.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LIÊN HỆ OB</text>
<text x="28.0" y="548.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
