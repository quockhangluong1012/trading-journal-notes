<svg viewBox="0 0 1000 623" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ahDC2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="1" y="1" width="998" height="621" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="905.5" y="22" width="66.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="938.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CASE C</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case C — Consolidation: hai phía đều tích tụ ERL, chưa có DOL có hướng</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trong vùng đi ngang, mỗi lần chạm mép lại làm mép rõ hơn. IRL bên trong gần như vô nghĩa vì bị lấy liên tục. Hình dựng (synthetic).</text>
<rect x="28.0" y="87.0" width="620.0" height="450.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="85.8" y="252.4" width="550.2" height="110.8" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="85.8" y="252.4" width="550.2" height="110.8" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="85.8" y1="307.7" x2="636.0" y2="307.7" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M40.0,184.2 L85.8,303.5 L116.4,252.4 L147.0,346.1 L177.5,260.9 L208.1,363.1 L238.7,277.9 L269.2,337.6 L299.8,252.4 L330.4,354.6 L360.9,286.4 L391.5,324.8 L406.8,303.5 L437.3,329.0" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="116.4" y1="252.4" x2="636.0" y2="252.4" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="315.1" y="247.4" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start">EQH = ERL trên</text>
<line x1="208.1" y1="363.1" x2="636.0" y2="363.1" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="223.4" y="376.6" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start">EQL = ERL dưới</text>
<line x1="85.8" y1="307.7" x2="636.0" y2="307.7" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<line x1="40.0" y1="141.6" x2="636.0" y2="141.6" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="8,4"/>
<text x="634.0" y="136.6" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="end">ERL khung lớn (đỉnh trước range)</text>
<line x1="40.0" y1="465.4" x2="636.0" y2="465.4" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="8,4"/>
<text x="634.0" y="478.9" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="end">ERL khung lớn (đáy xa)</text>
<line x1="437.3" y1="95.0" x2="437.3" y2="529.0" stroke="#475569" stroke-width="1.4" stroke-dasharray="2,3"/>
<rect x="399.9" y="98.5" width="74.9" height="17.5" rx="8.75" fill="#FFFFFF" stroke="#475569" stroke-width="1.1"/>
<text x="437.3" y="111.0" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">BÂY GIỜ (T0)</text>
<path d="M437.3,329.0 L467.9,269.4 L483.2,239.6 L498.5,269.4 L529.0,320.5 L574.9,397.2" fill="none" stroke="#059669" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#ah059669)"/>
<path d="M437.3,329.0 L467.9,354.6 L483.2,380.2 L498.5,346.1 L544.3,277.9 L590.2,201.2" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#ahDC2626)"/>
<line x1="42.0" y1="163.2" x2="68.0" y2="163.2" stroke="#059669" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="74.0" y="167.2" font-size="10" font-weight="700" fill="#059669" text-anchor="start">A: quét EQH rồi xuống</text>
<line x1="42.0" y1="179.2" x2="68.0" y2="179.2" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="74.0" y="183.2" font-size="10" font-weight="700" fill="#DC2626" text-anchor="start">B: quét EQL rồi lên</text>
<rect x="664.0" y="87.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="97.0" width="4.0" height="200.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="110.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Có thể kết luận (ex-ante)</text>
<text x="680.0" y="131.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Có hai biên rõ: EQH và EQL.</text>
<text x="680.0" y="147.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Bên ngoài cả hai đều có thể có lệnh chờ.</text>
<text x="680.0" y="163.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Giá đang ở giữa (gần EQ) ⇒ không có lợi thế vị</text>
<text x="680.0" y="179.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">trí.</text>
<text x="680.0" y="195.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Đáng làm: CHỜ một phía bị lấy rõ ràng.</text>
<rect x="664.0" y="317.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="327.0" width="4.0" height="200.0" rx="2" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="340.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">KHÔNG thể kết luận</text>
<text x="680.0" y="361.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Phía nào sẽ bị quét trước.</text>
<text x="680.0" y="377.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Cú quét đầu tiên là sweep hay breakout.</text>
<text x="680.0" y="393.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• “Bên lớn đang tích lũy” — đó là diễn giải.</text>
<text x="680.0" y="425.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Đừng chọn DOL khi chưa có sự kiện. “Không có</text>
<text x="680.0" y="440.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">lệnh” là kết luận hợp lệ.</text>
<rect x="28.0" y="551.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="575.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Sau khi một phía bị lấy: nếu giá quay vào có displacement ⇒ đích kế là IRL/EQ rồi biên đối diện (A hoặc B). Nếu được chấp nhận bên ngoài ⇒ range mới, nhắm</text>
<text x="42.0" y="591.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ERL khung lớn (đường tím).</text>
</svg>
