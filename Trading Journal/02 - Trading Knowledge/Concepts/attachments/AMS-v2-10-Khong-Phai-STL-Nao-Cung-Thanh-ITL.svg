<text x="42.0" y="415.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi đáy đều cao hơn đáy bên trái nó.</text>
<text x="42.0" y="432.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Không đáy nào thấp hơn CẢ HAI hàng xóm → không có ITL.</text>
<text x="42.0" y="448.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Xu hướng vẫn tăng khỏe. Thiếu ITL không có nghĩa là yếu.</text>
<rect x="506.0" y="396.0" width="466.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="506.0" y="396.0" width="5.0" height="64.0" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="520.0" y="415.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một nhịp hồi rơi sâu hơn nhịp trước và nhịp sau.</text>
<text x="520.0" y="432.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đáy của nhịp hồi sâu đó thấp hơn hai hàng xóm → ITL.</text>
<text x="520.0" y="448.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ITL = dấu vết của "một lần lùi lại lớn hơn bình thường".</text>
