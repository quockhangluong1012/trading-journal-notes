<text x="32.0" y="470.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Rơi nhanh, bật nhanh, hai FVG rõ. BPR ghi lại một cú</text>
<text x="32.0" y="485.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">quay đầu có lực ở cả hai phía.</text>
<text x="348.0" y="470.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Leg rơi rất nhanh; leg bật lên chậm, chỉ để lại FVG nhỏ.</text>
<text x="348.0" y="485.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Phần chồng mỏng. Phía mua chưa chứng minh được gì</text>
<text x="348.0" y="501.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhiều.</text>
<text x="664.0" y="470.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Hai nến khổng lồ trong vài phút tin tức. BPR chiếm gần</text>
<text x="664.0" y="485.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">cả biên độ. Đây là dấu vết của biến động tin, ít nói về</text>
<text x="664.0" y="501.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">cấu trúc.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Displacement càng lớn không có nghĩa BPR càng tốt: leg quá lớn có thể làm BPR xa giá, R:R kém, hoặc chỉ là nhiễu tin tức. [HYPOTHESIS] — cần backtest.</text>
