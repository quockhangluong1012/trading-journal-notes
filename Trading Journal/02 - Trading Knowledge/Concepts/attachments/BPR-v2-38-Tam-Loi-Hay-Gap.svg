<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="578" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="849.3" y="22" width="122.7" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="910.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LỖI THƯỜNG GẶP</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Tám lỗi hay gặp nhất với BPR</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi thẻ: lỗi (đỏ) → cách hiểu đúng (xanh). Danh sách đầy đủ 16 lỗi nằm trong note.</text>
<rect x="28.0" y="86.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="38.0" y="98.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="50.0" y="120.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="50.0" y="142.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Gọi một FVG là BPR</text>
<rect x="38.0" y="188.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="50.0" y="210.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="50.0" y="232.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">BPR cần HAI FVG ngược chiều</text>
<text x="50.0" y="248.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">chồng nhau.</text>
<rect x="267.0" y="86.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="277.0" y="98.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="289.0" y="120.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="289.0" y="142.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Vẽ BPR khi hai FVG chỉ nằm</text>
<text x="289.0" y="158.6" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">gần nhau</text>
<rect x="277.0" y="188.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="289.0" y="210.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="289.0" y="232.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Ghi 4 mức giá; không có phần</text>
<text x="289.0" y="248.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">chung → không có BPR.</text>
<rect x="506.0" y="86.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="516.0" y="98.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="528.0" y="120.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="528.0" y="142.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Lấy cả hai FVG làm vùng BPR</text>
<rect x="516.0" y="188.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="528.0" y="210.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="528.0" y="232.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ phần chung là BPR; phần</text>
<text x="528.0" y="248.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">còn lại thuộc từng FVG.</text>
<rect x="745.0" y="86.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="755.0" y="98.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="767.0" y="120.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="767.0" y="142.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Coi BPR là Equilibrium</text>
<rect x="755.0" y="188.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="767.0" y="210.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="767.0" y="232.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">EQ là điểm giữa dealing range;</text>
<text x="767.0" y="248.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">BPR ở đâu cũng được.</text>
<rect x="28.0" y="296.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="38.0" y="308.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="50.0" y="330.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="50.0" y="352.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Bullish BPR → Buy ngay</text>
<rect x="38.0" y="398.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="50.0" y="420.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="50.0" y="442.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Hướng lệnh do D1/H1 và xác</text>
<text x="50.0" y="458.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">nhận M5 quyết định.</text>
<rect x="267.0" y="296.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="277.0" y="308.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="289.0" y="330.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="289.0" y="352.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Tin chắc giá sẽ phản ứng</text>
<rect x="277.0" y="398.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="289.0" y="420.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="289.0" y="442.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Phản ứng là khả năng; hãy đếm</text>
<text x="289.0" y="458.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">tỉ lệ trong backtest.</text>
<rect x="506.0" y="296.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="516.0" y="308.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="528.0" y="330.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="528.0" y="352.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Chỉ nhớ những BPR đã chạy</text>
<text x="528.0" y="368.6" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">đẹp</text>
<rect x="516.0" y="398.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="528.0" y="420.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="528.0" y="442.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Ghi MỌI BPR thấy được trong</text>
<text x="528.0" y="458.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">real-time, kể cả cái thất bại.</text>
<rect x="745.0" y="296.0" width="228.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<rect x="755.0" y="308.0" width="208.0" height="82.0" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.2"/>
<text x="767.0" y="330.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ SAI</text>
<text x="767.0" y="352.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">BPR = MSS = đảo chiều</text>
<rect x="755.0" y="398.0" width="208.0" height="82.0" rx="8" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.2"/>
<text x="767.0" y="420.0" font-size="11.5" font-weight="700" fill="#0F7A5A" text-anchor="start">✓ ĐÚNG</text>
<text x="767.0" y="442.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Ba sự kiện khác nhau; ghi riêng</text>
<text x="767.0" y="458.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">thời điểm từng cái.</text>
<text x="28.0" y="560.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Lỗi số 7 (chỉ nhớ những BPR chạy đẹp) là lỗi nguy hiểm nhất, vì nó làm mọi khái niệm trông như có lợi thế.</text>
</svg>
