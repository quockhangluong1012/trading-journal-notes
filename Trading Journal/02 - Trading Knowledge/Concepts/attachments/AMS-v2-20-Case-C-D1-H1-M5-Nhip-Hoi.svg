<text x="358.0" y="364.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đỉnh thấp dần, đáy thấp dần → H1 GIẢM.</text>
<text x="358.0" y="380.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đây chính là "nhịp hồi" của D1</text>
<text x="358.0" y="396.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">nhìn gần. Không mâu thuẫn với D1.</text>
