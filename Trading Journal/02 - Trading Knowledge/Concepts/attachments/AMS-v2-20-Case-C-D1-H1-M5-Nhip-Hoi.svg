<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case C — D1 tăng, H1 giảm, M5 vừa quay đầu</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba khung, ba câu trả lời khác nhau, và không câu nào sai. Khung vàng = phần được phóng to ở ô bên phải.</text>
