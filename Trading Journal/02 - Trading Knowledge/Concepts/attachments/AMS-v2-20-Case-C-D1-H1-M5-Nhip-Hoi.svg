<text x="40.0" y="364.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đáy cao dần, đỉnh cao dần → D1 TĂNG.</text>
<text x="40.0" y="380.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá đang lùi nhưng CHƯA thủng</text>
<text x="40.0" y="396.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">D1-STL gần nhất.</text>
