<text x="859.3" y="180.3" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">vượt STH</text>
<circle cx="900.7" cy="241.3" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="900.7" y="262.3" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">hồi lại</text>
<text x="676.0" y="364.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Quét đáy nhỏ rồi vượt đỉnh nhỏ</text>
<text x="676.0" y="380.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">→ M5 vừa đổi sang TĂNG.</text>
<text x="676.0" y="396.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ là cấu trúc CỤC BỘ của M5.</text>
<rect x="28.0" y="426.0" width="944.0" height="47.4" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="28.0" y="426.0" width="5.0" height="47.4" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="42.0" y="445.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cái đã đổi: cấu trúc M5. Cái CHƯA đổi: cấu trúc H1 (vẫn giảm cho tới khi một H1-STH/ITH bị vượt). Cái vẫn nguyên: cấu trúc D1 (tăng).</text>
<text x="42.0" y="462.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">M5 quay đầu cùng chiều D1 ở cuối một nhịp hồi H1 là bối cảnh mà ICT 2022 Model tìm kiếm — nhưng đó là giả thuyết giao dịch, không phải bảo đảm.</text>
