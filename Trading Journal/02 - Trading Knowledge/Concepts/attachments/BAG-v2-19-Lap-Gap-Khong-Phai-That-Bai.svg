<text x="44.0" y="483.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chưa bị phủ nhận.</text>
<text x="520.0" y="452.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">B: Giá đóng cửa trở lại trong range và ở lại đó. Thông tin: thị trường không</text>
<text x="520.0" y="467.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chấp nhận giá ở vùng mới — đây mới là dấu hiệu thất bại (theo tiêu chí bạn</text>
<text x="520.0" y="483.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">định nghĩa trước).</text>
