<text x="362.0" y="392.0" font-size="11.8" font-weight="700" fill="#EA580C" text-anchor="start">Giá chạm 101: lệnh chờ thức dậy.</text>
<text x="362.0" y="412.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi lệnh chờ biến thành một lệnh MUA ngay lập</text>
<text x="362.0" y="428.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">tức. Nhiều lệnh mua cùng lúc → giá bị đẩy thêm</text>
<text x="362.0" y="444.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">một đoạn, lên 103.</text>
<text x="362.0" y="464.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Thêm người thấy giá “phá đỉnh” liền mua đuổi ở</text>
<text x="362.0" y="480.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">102–103.</text>
<text x="362.0" y="500.3" font-size="11.8" font-weight="400" fill="#6B7280" text-anchor="start">Kho lệnh MUA phía trên giờ đã bị dùng hết.</text>
<rect x="664.0" y="92.0" width="306.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
