<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ai bị “kẹt” khi giá vượt 100 rồi quay về?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba khoảnh khắc của cùng một câu chuyện. Chấm tròn = lệnh chờ đang “ngủ”. Lệnh chờ chỉ thức dậy khi giá chạm tới nó.</text>
<rect x="918.3" y="22.0" width="53.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="945.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ELI5</text>
