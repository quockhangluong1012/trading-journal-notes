<text x="680.0" y="392.0" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start">Giá rơi lại dưới 100.</text>
<text x="680.0" y="412.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Người mua ở 101–103 giờ đang lỗ. Khi họ bỏ</text>
<text x="680.0" y="428.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">cuộc, họ phải BÁN — đó là thêm lực bán.</text>
<text x="680.0" y="448.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Phía dưới 90 vẫn còn kho lệnh BÁN đang ngủ.</text>
<text x="680.0" y="464.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Nếu giá rơi tới đó, chúng lại thức dậy → giá có</text>
<text x="680.0" y="480.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">thể rơi nhanh hơn.</text>
<rect x="28.0" y="574.0" width="944.0" height="48.6" rx="8" fill="#FFF7E6" stroke="#B45309" stroke-width="1"/>
<text x="38.0" y="596.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">[CƠ CHẾ] Lệnh stop là lệnh “hẹn”: nằm im cho tới khi giá chạm, rồi thành lệnh thị trường. Điều này có thật trong cách sàn khớp lệnh.  [DIỄN GIẢI] Chữ “bị</text>
<text x="38.0" y="612.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">kẹt”, “bị bẫy” là cách kể chuyện. Nhìn chart, ta KHÔNG biết có bao nhiêu lệnh chờ, ai đặt, và có ai cố tình đẩy giá hay không.</text>
