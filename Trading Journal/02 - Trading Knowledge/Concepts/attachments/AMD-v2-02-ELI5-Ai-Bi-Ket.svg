<text x="270.7" y="176.1" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end">lệnh MUA đang ngủ</text>
<text x="270.7" y="356.9" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="end">lệnh BÁN đang ngủ</text>
<text x="44.0" y="392.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">Trên 100 có hai nhóm lệnh MUA đang chờ:</text>
<text x="44.0" y="412.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Người đã bán ở 98–99 đặt “chốt chặn lỗ” ở</text>
<text x="44.0" y="428.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">101. Nếu giá lên 101, lệnh này bắt họ MUA lại.</text>
<text x="44.0" y="448.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Người thích “mua khi phá đỉnh” đặt lệnh mua</text>
<text x="44.0" y="464.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">chờ ở 101.</text>
<text x="44.0" y="484.2" font-size="11.8" font-weight="400" fill="#6B7280" text-anchor="start">Dưới 90 là hình ảnh đối xứng: lệnh BÁN đang</text>
<text x="44.0" y="500.3" font-size="11.8" font-weight="400" fill="#6B7280" text-anchor="start">ngủ.</text>
