<text x="40.0" y="536.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Đọc: LTH ở đỉnh lớn. Sau đó ITH thứ nhất THẤP HƠN LTH, ITH thứ hai thấp hơn ITH thứ nhất. ITL thứ hai thấp hơn ITL thứ nhất → cấp trung hạn đang giảm.</text>
<text x="40.0" y="551.7" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Chưa có LTL: trong lúc giá còn lập đáy mới thì chưa đáy nào đủ hàng xóm bên phải để lên cấp dài hạn.</text>
