<svg viewBox="0 0 980 520" width="980" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="520" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Kiểm chứng IPDA thế nào? — Không hỏi "IPDA có đúng không", mà hỏi "nếu đúng thì phải thấy gì?"</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mọi claim về "price delivery tới liquidity" phải thắng một baseline có cùng khoảng cách, cùng biến động, cùng thời gian.</text>
<rect x="26.0" y="80.0" width="176.0" height="150.0" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="114.0" y="106.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">1. Định nghĩa trước</text>
<text x="114.0" y="136.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Quy tắc chọn mức ICT</text>
<text x="114.0" y="158.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">(DOL, H20/L20, swing)</text>
<text x="114.0" y="180.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">chỉ dùng dữ liệu ≤ T0</text>
<line x1="202.0" y1="155.0" x2="214.0" y2="155.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="214.0" y="80.0" width="176.0" height="150.0" rx="10" fill="#F3F4F6" stroke="#334155" stroke-width="1.5"/>
<text x="302.0" y="106.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">2. Nhóm đối chứng</text>
<text x="302.0" y="136.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Mức ngẫu nhiên CÙNG</text>
<text x="302.0" y="158.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">khoảng cách (theo ATR)</text>
<text x="302.0" y="180.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">và cùng phía</text>
<line x1="390.0" y1="155.0" x2="402.0" y2="155.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="402.0" y="80.0" width="176.0" height="150.0" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="490.0" y="106.0" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">3. Đo kết quả</text>
<text x="490.0" y="136.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">P(chạm trong N ngày)</text>
<text x="490.0" y="158.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">thời gian tới chạm</text>
<text x="490.0" y="180.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">chạm TRƯỚC mức đối diện?</text>
<line x1="578.0" y1="155.0" x2="590.0" y2="155.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="590.0" y="80.0" width="176.0" height="150.0" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
<text x="678.0" y="106.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="middle">4. So sánh</text>
<text x="678.0" y="136.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">Hiệu số ICT − đối chứng</text>
<text x="678.0" y="158.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">khoảng tin cậy 95%</text>
<text x="678.0" y="180.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">nhiều thị trường, nhiều năm</text>
<line x1="766.0" y1="155.0" x2="778.0" y2="155.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="778.0" y="80.0" width="176.0" height="150.0" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="866.0" y="106.0" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">5. Kết luận</text>
<text x="866.0" y="136.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">SUPPORTED / WEAK /</text>
<text x="866.0" y="158.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">REJECTED / MORE DATA</text>
<text x="866.0" y="180.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">ghi vào Hypothesis Register</text>
<rect x="26.0" y="248.0" width="600.0" height="252.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="272.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Ví dụ khung kết quả (CHƯA có dữ liệu — chỉ là mẫu)</text>
<rect x="40.0" y="282.0" width="572.0" height="30.0" rx="4" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="48.0" y="302.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start"></text>
<text x="300.0" y="302.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Mức ICT</text>
<text x="400.0" y="302.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Đối chứng</text>
<text x="500.0" y="302.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Hiệu số</text>
<text x="48.0" y="336.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">P(chạm ≤ 20 ngày)</text>
<text x="300.0" y="336.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">p_ICT = ?</text>
<text x="400.0" y="336.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">p_ctrl = ?</text>
<text x="500.0" y="336.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Δ ± CI 95%</text>
<text x="48.0" y="370.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Chạm trước mức đối diện</text>
<text x="300.0" y="370.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">q_ICT = ?</text>
<text x="400.0" y="370.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">q_ctrl = ?</text>
<text x="500.0" y="370.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Δ ± CI 95%</text>
<text x="48.0" y="404.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Thời gian trung vị tới chạm</text>
<text x="300.0" y="404.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">t_ICT = ?</text>
<text x="400.0" y="404.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">t_ctrl = ?</text>
<text x="500.0" y="404.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">tỉ số</text>
<text x="48.0" y="438.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Phản ứng sau chạm (MFE ngược)</text>
<text x="300.0" y="438.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">m_ICT = ?</text>
<text x="400.0" y="438.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">m_ctrl = ?</text>
<text x="500.0" y="438.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Δ ± CI 95%</text>
<text x="40.0" y="486.0" font-size="11.5" font-weight="600" fill="#6D28D9" text-anchor="start">Nếu p_ICT ≈ p_ctrl trên dữ liệu đủ lớn: "giá tìm tới liquidity" không thêm thông tin so với hình học.</text>
<rect x="640.0" y="248.0" width="314.0" height="252.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/>
<text x="654.0" y="272.0" font-size="11.6" font-weight="700" fill="#B91C1C" text-anchor="start">Điều gì làm giả thuyết SAI?</text>
<text x="654.0" y="288.8" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Mức ICT không được chạm</text>
<text x="654.0" y="305.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  nhiều hơn mức đối chứng.</text>
<text x="654.0" y="322.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Chạm "đúng hướng DOL" không</text>
<text x="654.0" y="339.3" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  vượt p_null theo khoảng cách.</text>
<text x="654.0" y="356.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Kết quả chỉ có ở 1 thị trường</text>
<text x="654.0" y="372.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  hoặc 1 giai đoạn (overfit).</text>
<text x="654.0" y="389.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Mức 20/40/60 không khác</text>
<text x="654.0" y="406.6" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  17/35/71 hay 25/50/75.</text>
<text x="654.0" y="423.4" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">• Phải dùng hindsight mới chọn</text>
<text x="654.0" y="440.2" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">  được mức "đúng".</text>
</svg>
