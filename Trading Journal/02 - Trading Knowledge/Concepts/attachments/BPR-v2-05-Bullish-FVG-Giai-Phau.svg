<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="886.7" y="22" width="85.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="929.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bullish FVG: ba cây nến và cách lấy hai mép</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bullish FVG xuất hiện khi ĐÁY của nến 3 vẫn còn cao hơn ĐỈNH của nến 1. Khoảng hở giữa hai bóng nến đó là FVG. Nến 2 là nến chạy dài ở giữa.</text>
<rect x="28.0" y="86.0" width="470.0" height="410.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Đúng là FVG</text>
<line x1="140.4" y1="362.6" x2="140.4" y2="442.2" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="130.4" y="378.6" width="20.0" height="39.8" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<text x="140.4" y="474.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">Nến 1</text>
<line x1="228.0" y1="195.6" x2="228.0" y2="386.5" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="218.0" y="211.5" width="20.0" height="167.1" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<text x="228.0" y="474.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">Nến 2</text>
<line x1="315.6" y1="155.8" x2="315.6" y2="299.0" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="305.6" y="171.7" width="20.0" height="39.8" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<text x="315.6" y="474.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">Nến 3</text>
<rect x="100.9" y="299.0" width="403.0" height="63.6" rx="2" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="100.9" y1="362.6" x2="503.9" y2="362.6" stroke="#0F9D74" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="503.9" y="376.6" font-size="11" font-weight="700" fill="#0F9D74" text-anchor="end">mép dưới = ĐỈNH nến 1</text>
<line x1="100.9" y1="299.0" x2="503.9" y2="299.0" stroke="#0F9D74" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="503.9" y="294.0" font-size="11" font-weight="700" fill="#0F9D74" text-anchor="end">mép trên = ĐÁY nến 3</text>
<text x="289.3" y="334.8" font-size="12" font-weight="700" fill="#0F9D74" text-anchor="start">Bullish FVG</text>
<rect x="516.0" y="86.0" width="220.0" height="410.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="528.0" y="108.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">KHÔNG phải FVG</text>
<line x1="579.0" y1="362.6" x2="579.0" y2="442.2" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="569.0" y="378.6" width="20.0" height="39.8" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="626.0" y1="195.6" x2="626.0" y2="386.5" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="616.0" y="211.5" width="20.0" height="167.1" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="673.0" y1="155.8" x2="673.0" y2="382.5" stroke="#0F9D74" stroke-width="1.2" opacity="1"/>
<rect x="663.0" y="171.7" width="20.0" height="39.8" rx="0" fill="#0F9D74" stroke="#0F9D74" stroke-width="0.6" opacity="1"/>
<line x1="534.4" y1="362.6" x2="717.6" y2="362.6" stroke="#B91C1C" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="532.0" y="130.7" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">Bóng nến 3 chạm vào vùng của nến 1.</text>
<text x="532.0" y="145.2" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">Nến 2 vẫn dài, nhưng không còn</text>
<text x="532.0" y="159.7" font-size="10.5" font-weight="400" fill="#B91C1C" text-anchor="start">khoảng hở.</text>
<rect x="752.0" y="86.0" width="220.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="764.0" y="111.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Nhớ bằng một câu</text>
<text x="764.0" y="131.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ba nến. Nến giữa chạy dài. Nếu</text>
<text x="764.0" y="147.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bóng nến 1 và bóng nến 3 KHÔNG</text>
<text x="764.0" y="163.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chạm nhau, khoảng giữa chúng là</text>
<text x="764.0" y="179.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">FVG.</text>
<rect x="752.0" y="292.0" width="220.0" height="204.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="764.0" y="317.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">Tên gọi ICT</text>
<text x="764.0" y="337.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">BISI — Buyside Imbalance, Sellside</text>
<text x="764.0" y="353.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Inefficiency: giá được giao lên một</text>
<text x="764.0" y="369.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">mạch, phía bán chưa được “mời”</text>
<text x="764.0" y="385.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">giao dịch đầy đủ ở dải này.</text>
<text x="28.0" y="540.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Mép FVG lấy theo BÓNG nến (high/low), không lấy theo thân. Đây là quy ước phổ biến; một số trader dùng thân nến — hãy chọn một cách và giữ nhất quán trong backtest.</text>
</svg>
