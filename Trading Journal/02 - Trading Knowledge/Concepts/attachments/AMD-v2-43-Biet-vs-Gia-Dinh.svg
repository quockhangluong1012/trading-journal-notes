<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mkBE123C" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cái gì ta BIẾT và cái gì ta chỉ GIẢ ĐỊNH về AMD</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đi từ dưới lên: càng lên cao, câu nói càng hấp dẫn — và càng ít chắc chắn. Rủi ro lớn nhất là dùng sự tự tin của tầng dưới cho câu nói ở</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">tầng trên.</text>
<rect x="868.6" y="22.0" width="103.4" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="920.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">EPISTEMICS</text>
<path d="M50,550 L950,550 L888,480 L112,480 Z" fill="#F1F5F9" stroke="#334155" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="504.0" font-size="13.5" font-weight="800" fill="#334155" text-anchor="middle">Quan sát được</text>
<text x="500.0" y="522.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">Giá đi ngang, phá mép, quay vào, đi mạnh, để lại khoảng trống. Ai nhìn chart cũng thấy giống nhau.</text>
<path d="M112,472 L888,472 L826,402 L174,402 Z" fill="#E6F7F4" stroke="#0F766E" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="426.0" font-size="13.5" font-weight="800" fill="#0F766E" text-anchor="middle">Cơ chế có cơ sở</text>
<text x="500.0" y="444.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">Lệnh stop thức dậy thành lệnh thị trường; lệnh tụ quanh mốc rõ; cần bên kia để khớp (nghiên cứu lệnh FX).</text>
<path d="M174,394 L826,394 L764,324 L236,324 Z" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="348.0" font-size="13.5" font-weight="800" fill="#4338CA" text-anchor="middle">Khung ICT</text>
<text x="500.0" y="366.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">Đặt tên A/M/D, Judas, Midnight Open, killzone. Hữu ích để tổ chức quan sát — không phải định luật.</text>
<path d="M236,316 L764,316 L702,246 L298,246 Z" fill="#FFF7E6" stroke="#B45309" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="270.0" font-size="13.5" font-weight="800" fill="#B45309" text-anchor="middle">Diễn giải</text>
<text x="500.0" y="288.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">“Smart money cố tình gom / bẫy.” Không kiểm chứng được từ giá; có giải thích</text>
<text x="500.0" y="301.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">khác cho cùng hình.</text>
<path d="M298,238 L702,238 L640,168 L360,168 Z" fill="#FFF0F3" stroke="#BE123C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="192.0" font-size="13.5" font-weight="800" fill="#BE123C" text-anchor="middle">Giả thuyết cần backtest</text>
<text x="500.0" y="210.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">“AMD cho lợi thế giao dịch.” Chỉ dữ liệu ghi TRƯỚC kết</text>
<text x="500.0" y="223.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">quả, trên thị trường của bạn, mới trả lời được.</text>
<line x1="60.0" y1="540.0" x2="60.0" y2="120.0" stroke="#BE123C" stroke-width="2.4" marker-end="url(#mkBE123C)"/>
<text x="70.0" y="130.0" font-size="10.5" font-weight="700" fill="#BE123C" text-anchor="start">hấp dẫn hơn,</text>
<text x="70.0" y="144.0" font-size="10.5" font-weight="700" fill="#BE123C" text-anchor="start">kém chắc hơn</text>
<text x="70.0" y="536.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">chắc hơn</text>
<rect x="28.0" y="566.0" width="944.0" height="48.6" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="1"/>
<text x="38.0" y="588.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mẫu câu đúng: “[QUAN SÁT] Giá thủng đáy range rồi đóng lại bên trong. [ICT] Đây là ứng viên Manipulation. [BACKTEST REQUIRED] Trên dữ liệu của tôi, kiểu</text>
<text x="38.0" y="604.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">này có đáng vào lệnh không thì chưa biết.” Mẫu câu sai: “Smart money vừa quét stop, giá chắc chắn sẽ lên.”</text>
</svg>
