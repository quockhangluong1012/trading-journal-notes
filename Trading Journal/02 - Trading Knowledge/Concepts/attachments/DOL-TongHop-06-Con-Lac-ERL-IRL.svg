<svg viewBox="0 0 760 466" width="760" height="466" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Con lắc ERL ↔ IRL: năm nhịp</title>
<desc>Giá lấy ERL dưới, quay về FVG bên trong range, chạy lên lấy ERL trên, quay về FVG giảm bên trong, rồi hướng lại ERL dưới. Năm nhịp được đánh số.</desc>
