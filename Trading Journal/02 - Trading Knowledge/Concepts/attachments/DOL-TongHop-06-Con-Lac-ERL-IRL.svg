<rect x="0" y="0" width="760" height="466" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Con lắc ERL ↔ IRL: năm nhịp</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Ở nhịp 2 và 4, FVG là ĐÍCH (IRL). Ở nhịp 1 và 3, cùng FVG đó là NƠI LÊN TÀU cho chặng kế tiếp.</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">[HYPOTHESIS — cần backtest]</text>
