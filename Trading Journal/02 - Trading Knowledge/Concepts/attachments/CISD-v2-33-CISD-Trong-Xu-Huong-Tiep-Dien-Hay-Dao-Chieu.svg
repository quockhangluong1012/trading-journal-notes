<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD trong xu hướng: tiếp diễn hay đảo chiều?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng là CISD, nhưng vị trí trong cấu trúc làm ý nghĩa khác hẳn. CISD THUẬN xu hướng ở cuối nhịp hồi = tiếp diễn. CISD NGƯỢC xu</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">hướng = mới chỉ là dấu hiệu đầu tiên, cần thêm nhiều bằng chứng.</text>
