<text x="518.0" y="519.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">vẫn tăng. Đây mới là dấu hiệu đầu tiên; cần CHoCH/MSS và bối cảnh HTF ủng hộ.</text>
