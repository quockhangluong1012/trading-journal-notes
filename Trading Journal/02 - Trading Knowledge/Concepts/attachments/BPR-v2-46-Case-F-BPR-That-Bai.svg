<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ dựng sẵn để học, không phải dữ liệu thị trường. Đọc theo thời gian T0 → T5: mỗi bước chỉ dùng thông tin có tại thời điểm đó.</text>
