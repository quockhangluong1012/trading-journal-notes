<text x="682.0" y="108.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
<text x="700.0" y="108.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">T0 · D1 tăng, DOL là BSL phía trên. Leg giảm vừa</text>
<text x="700.0" y="122.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">rồi có thể chỉ là hồi.</text>
<rect x="664.0" y="140.0" width="308.0" height="33.0" rx="8" fill="#FFFFFF" stroke="#0F9D74" stroke-width="1.2"/>
<circle cx="682.0" cy="158.0" r="10" fill="#0F9D74"/>
<text x="682.0" y="162.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="700.0" y="162.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">T1 · Leg tăng → bullish FVG.</text>
<rect x="664.0" y="179.0" width="308.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#E0464B" stroke-width="1.2"/>
<circle cx="682.0" cy="197.0" r="10" fill="#E0464B"/>
<text x="682.0" y="201.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="700.0" y="201.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">T2 · Leg giảm nhanh → bearish FVG chồng lên →</text>
<text x="700.0" y="215.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Bearish BPR.</text>
<rect x="664.0" y="233.0" width="308.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<circle cx="682.0" cy="251.0" r="10" fill="#B45309"/>
<text x="682.0" y="255.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="700.0" y="255.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">T3 · Giá quay lên, vào vùng, KHÔNG có dấu hiệu</text>
<text x="700.0" y="269.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">từ chối nào trên M5.</text>
<rect x="664.0" y="287.0" width="308.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<circle cx="682.0" cy="305.0" r="10" fill="#B91C1C"/>
<text x="682.0" y="309.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="700.0" y="309.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">T4 · Nến đóng trên mép xa, nến sau đứng được →</text>
<text x="700.0" y="323.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">BPR mất vai trò.</text>
<rect x="664.0" y="341.0" width="308.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<circle cx="682.0" cy="359.0" r="10" fill="#B91C1C"/>
<text x="682.0" y="363.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="700.0" y="363.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">T5 · Giá chạy tiếp lên (expansion). Ai Short chỉ vì</text>
<text x="700.0" y="377.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">“có BPR” đã bị dừng lỗ.</text>
<rect x="664.0" y="397.0" width="308.0" height="173.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.3"/>
<text x="676.0" y="421.5" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Bài học</text>
<text x="676.0" y="441.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Thất bại này có thể đọc được TRƯỚC khi vào lệnh:</text>
<text x="676.0" y="456.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">BPR ngược D1, và M5 không cho xác nhận. Đây là</text>
<text x="676.0" y="472.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">“lệnh không vào” đúng.</text>
<text x="28.0" y="620.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Sau khi bị xuyên, vùng này có thể được theo dõi theo hướng ngược lại (giống ý tưởng inversion). Đó là một giả thuyết riêng, cần kiểm chứng riêng.</text>
