<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Giải phẫu một DOL trong dealing range</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Giá đang ở FVG (IRL) thuộc nửa discount. Trên là BSL (DOL dự báo), dưới là SSL (đối thủ). Câu hỏi: cụm</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">nào bị chạm trước, và trong bao lâu?</text>
