<svg viewBox="0 0 1000 480" width="1000" height="480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="478" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="867.9" y="22" width="104.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="919.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">GAP FILLING</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao giá đôi khi quay lại vùng gap? — Không có 'lực hút' bí ẩn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Giá chỉ đi xuống lại vùng gap khi ở các mức thấp hơn có người BÁN chủ động và thiếu người MUA mới. Bốn lý do phổ biến (đều là DIỄN</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">GIẢI, chart không cho thấy trực tiếp):</text>
<rect x="28.0" y="108.0" width="466.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#0F9D74" stroke-width="1.4"/>
<text x="42.0" y="134.0" font-size="13" font-weight="800" fill="#0F9D74" text-anchor="start">① Người mua sớm chốt lời</text>
<rect x="401.6" y="121.0" width="78.4" height="19.0" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
<text x="440.8" y="135.0" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">[DIỄN GIẢI]</text>
<text x="42.0" y="160.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ai đã mua trong range giờ đang lời. Một phần sẽ bán ra → thêm lệnh bán.</text>
<rect x="504.0" y="108.0" width="466.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="518.0" y="134.0" font-size="13" font-weight="800" fill="#D97706" text-anchor="start">② Lực mua 'một lần' đã dùng hết</text>
<rect x="877.6" y="121.0" width="78.4" height="19.0" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
<text x="916.8" y="135.0" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">[DIỄN GIẢI]</text>
<text x="518.0" y="160.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh dồn qua đêm và lệnh dừng lỗ của phe bán chỉ khớp một lần lúc mở cửa.</text>
<text x="518.0" y="176.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Khi đã khớp xong, người mua mới ở giá cao có thể không còn nhiều.</text>
<rect x="28.0" y="224.0" width="466.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="42.0" y="250.0" font-size="13" font-weight="800" fill="#2563EB" text-anchor="start">③ Thông tin được đánh giá lại</text>
<rect x="401.6" y="237.0" width="78.4" height="19.0" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
<text x="440.8" y="251.0" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">[DIỄN GIẢI]</text>
<text x="42.0" y="276.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Sau phản ứng đầu tiên, người tham gia đọc lại tin. Nếu nhiều người thấy giá</text>
<text x="42.0" y="292.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đã đi quá đà, họ bán ra.</text>
<rect x="504.0" y="224.0" width="466.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="518.0" y="250.0" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start">④ Lệnh chờ ở vùng giá cũ</text>
<rect x="877.6" y="237.0" width="78.4" height="19.0" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
<text x="916.8" y="251.0" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">[DIỄN GIẢI]</text>
<text x="518.0" y="276.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người lỡ tàu đặt lệnh MUA chờ quanh biên cũ. Khi giá đi xuống, đó là nơi CÓ</text>
<text x="518.0" y="292.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">người mua → giá có thể dừng ở đó. Đây là cách giải thích vì sao biên cũ đôi</text>
<text x="518.0" y="309.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">khi thành hỗ trợ.</text>
<rect x="28.0" y="344.0" width="944.0" height="120.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="44.0" y="370.0" font-size="13" font-weight="800" fill="#D97706" text-anchor="start">Điều ngược lại cũng quan trọng</text>
<text x="44.0" y="394.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá KHÔNG quay lại khi người mua mới tiếp tục xuất hiện ở các mức cao hơn và người bán không đủ mạnh để kéo giá xuống. Câu 'gap nào rồi cũng được lấp'</text>
<text x="44.0" y="410.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không phải quy luật. Bulkowski thống kê rằng breakaway gap hiếm khi bị lấp trong tuần đầu, còn common gap thì thường lấp nhanh; một nghiên cứu trên chỉ</text>
<text x="44.0" y="427.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">số Mỹ 1928–2018 (Plastun và cộng sự, 2020) kết luận ngược với 'huyền thoại gap luôn được lấp'.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
