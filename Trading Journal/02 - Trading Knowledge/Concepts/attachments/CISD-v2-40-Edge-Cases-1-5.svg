<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Edge cases 1–5: phản ứng tại mức CISD</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi ô: bối cảnh → chuỗi giá → phân loại → vì sao → điều có thể xảy ra tiếp → kết luận được gì. Đường cam = mức CISD.</text>
