<text x="715.2" y="118.7" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">Not CHoCH — không có trạng thái</text>
<text x="616.0" y="150.5" font-size="11" font-weight="700" fill="#6B7280">BỐI CẢNH</text>
<text x="616.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giá đi ngang nhiều phiên, biên range rõ ràng.</text>
<text x="616.0" y="188.9" font-size="11" font-weight="700" fill="#6B7280">CẤU TRÚC</text>
<text x="616.0" y="204.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Không có trạng thái: đỉnh/đáy chồng lên nhau.</text>
<text x="616.0" y="227.4" font-size="11" font-weight="700" fill="#6B7280">CHUỖI GIÁ</text>
<text x="616.0" y="243.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Mỗi cạnh range bị phá rồi quay lại. Indicator in CHoCH lên,</text>
<text x="616.0" y="259.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">CHoCH xuống liên tục.</text>
<text x="616.0" y="282.3" font-size="11" font-weight="700" fill="#6B7280">PHÂN LOẠI</text>
<text x="616.0" y="298.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Không phải CHoCH theo note này — không có “character”</text>
<text x="616.0" y="314.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">nào để đổi (bước 1 của cây quyết định).</text>
<text x="616.0" y="337.3" font-size="11" font-weight="700" fill="#6B7280">NÊN ĐỌC THẾ NÀO</text>
<text x="616.0" y="353.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Như một range: thanh khoản ở hai cạnh, các cú quét. Thay</text>
<text x="616.0" y="369.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">đổi thật là khi giá RỜI range bằng displacement và được</text>
<text x="616.0" y="386.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">chấp nhận bên ngoài.</text>
<text x="616.0" y="408.7" font-size="11" font-weight="700" fill="#6B7280">HÀM Ý</text>
<text x="616.0" y="424.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đứng ngoài với tư cách “CHoCH trader”. Mô hình khác</text>
<text x="616.0" y="441.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">(range) có thể có lệnh.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Gợi ý backtest: đếm số CHoCH mỗi ngày trên lớp internal; ngày đi ngang thường có nhiều nhãn hơn hẳn ngày có xu hướng. [HYPOTHESIS]</text>
