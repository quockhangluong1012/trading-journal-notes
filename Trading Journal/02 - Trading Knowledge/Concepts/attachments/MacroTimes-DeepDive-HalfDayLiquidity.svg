<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Half-day: macro chieu mat hieu luc do thanh khoan mong</text>

  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="340" x2="960" y2="340"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
  </g>

  <!-- normal day volume profile -->
  <text x="30" y="75" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ngay binh thuong: volume duy tri toi cuoi phien PM</text>
  <g fill="rgba(41,98,255,0.3)">
    <rect x="30" y="330" width="20" height="60"/>
    <rect x="60" y="300" width="20" height="90"/>
    <rect x="90" y="280" width="20" height="110"/>
    <rect x="120" y="310" width="20" height="80"/>
    <rect x="150" y="290" width="20" height="100"/>
    <rect x="180" y="300" width="20" height="90"/>
    <rect x="210" y="285" width="20" height="105"/>
    <rect x="240" y="295" width="20" height="95"/>
    <rect x="270" y="280" width="20" height="110"/>
    <rect x="300" y="290" width="20" height="100"/>
  </g>
  <rect x="230" y="150" width="80" height="140" fill="rgba(242,201,76,0.08)" stroke="#f2c94c" stroke-dasharray="4,4"/>
  <text x="235" y="145" font-family="Arial, sans-serif" font-size="12" fill="#f2c94c">Macro 14:50 PM</text>
  <text x="30" y="410" font-family="Arial, sans-serif" font-size="13" fill="#26a69a">Volume on dinh -&gt; macro PM dang tin cay</text>

  <!-- half-day volume profile -->
  <text x="510" y="75" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Ngay half-day: volume roi manh sau buoi trua</text>
  <g fill="rgba(239,83,80,0.3)">
    <rect x="510" y="320" width="20" height="70"/>
    <rect x="540" y="290" width="20" height="100"/>
    <rect x="570" y="300" width="20" height="90"/>
    <rect x="600" y="340" width="20" height="50"/>
    <rect x="630" y="365" width="20" height="25"/>
    <rect x="660" y="378" width="20" height="12"/>
    <rect x="690" y="382" width="20" height="8"/>
    <rect x="720" y="385" width="20" height="5"/>
    <rect x="750" y="386" width="20" height="4"/>
    <rect x="780" y="387" width="20" height="3"/>
  </g>
  <rect x="700" y="150" width="80" height="240" fill="rgba(239,83,80,0.08)" stroke="#ef5350" stroke-dasharray="4,4"/>
  <text x="700" y="145" font-family="Arial, sans-serif" font-size="12" fill="#ef5350">Macro 14:50 PM (yeu)</text>
  <text x="510" y="410" font-family="Arial, sans-serif" font-size="13" fill="#ef5350">Volume can kiet -&gt; macro PM khong dang tin</text>

  <!-- legend / note box -->
  <rect x="30" y="440" width="900" height="80" fill="none" stroke="#d1d4dc" stroke-width="1"/>
  <text x="45" y="465" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Vi du: ngay sau Thanksgiving, ap Giang sinh, ap Nam moi - CME/NYSE dong cua som.</text>
  <text x="45" y="487" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Displacement co the van "in ra" ve hinh thuc nhung thieu luc day tiep dien do thanh khoan mong.</text>
  <text x="45" y="509" font-family="Arial, sans-serif" font-size="14" fill="#d1d4dc">Kiem tra lich CME/NYSE truoc moi ky le de xac dinh truoc.</text>
</svg>
