<text x="40.0" y="534.0" font-size="11.3" fill="#1F2937" font-weight="normal" text-anchor="start">[ICT FRAMEWORK] giá &quot;dao động&quot; giữa ERL và IRL (lấy ERL → về IRL → tới ERL kế tiếp) là mô tả của ICT, không phải luật.</text>
<text x="40.0" y="552.0" font-size="11.3" fill="#1F2937" font-weight="normal" text-anchor="start">Quy ước vault (RULE-LS-009): khi nói &quot;external&quot; không kèm range, mặc định là range D1 context đã chốt trước phiên.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-07 · Chart minh họa. FVG được coi là IRL theo cách dùng ICT; FVG không phải &quot;cụm stop&quot; mà là vùng giá đi một chiều.</text>
