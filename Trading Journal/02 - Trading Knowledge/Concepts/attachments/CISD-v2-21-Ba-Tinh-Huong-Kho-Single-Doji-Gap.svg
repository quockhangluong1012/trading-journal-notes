<rect x="666.0" y="448.0" width="305.0" height="83.6" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="678.0" y="470.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Gap (mở phiên, cuối tuần, tin tức) làm “bậc thang”</text>
<text x="678.0" y="485.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">bị đứt. Chuỗi trước và sau gap có thể là hai trạng</text>
<text x="678.0" y="501.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">thái khác nhau. Quy ước an toàn: ghi nhận cả hai</text>
<text x="678.0" y="516.6" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">mức, ưu tiên khung/phiên liền mạch.</text>
