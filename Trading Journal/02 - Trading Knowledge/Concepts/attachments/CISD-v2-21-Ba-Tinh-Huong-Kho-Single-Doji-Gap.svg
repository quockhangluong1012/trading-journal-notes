<line x1="361.0" y1="175.2" x2="638.0" y2="175.2" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="636.0" y="170.2" font-size="9.5" font-weight="700" fill="#9CA3AF" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">nếu gộp: open #0</text>
<text x="420.4" y="195.2" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">doji</text>
<rect x="347.0" y="448.0" width="305.0" height="68.2" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="359.0" y="470.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Doji không đóng giảm → theo quy ước v2, nó kết thúc</text>
<text x="359.0" y="485.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">chuỗi; mức là open của nến đỏ sau nó. Cách “gộp”</text>
<text x="359.0" y="501.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">cho mức cao hơn. Ghi rõ bạn dùng cách nào.</text>
<rect x="666.0" y="108.0" width="305.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="678.0" y="130.0" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">C · Có khoảng trống giá (gap)</text>
