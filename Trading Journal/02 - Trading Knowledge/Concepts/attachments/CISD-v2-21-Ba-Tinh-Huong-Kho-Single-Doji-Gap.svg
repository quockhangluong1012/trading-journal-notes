<text x="220.1" y="163.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
<rect x="28.0" y="448.0" width="305.0" height="83.6" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="40.0" y="470.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Single-candle CISD: mức = open của chính nến đó.</text>
<text x="40.0" y="485.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Hợp lệ theo định nghĩa, nhưng một nến dài rơi mạnh</text>
<text x="40.0" y="501.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">rồi bị lấy lại thường là vùng biến động lớn — đọc thêm</text>
<text x="40.0" y="516.6" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">bối cảnh.</text>
<rect x="347.0" y="108.0" width="305.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="359.0" y="130.0" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">B · Có doji chen giữa</text>
