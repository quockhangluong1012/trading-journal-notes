<text x="510.0" y="476.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">xuyên cao hơn — đứng ngoài hoặc chờ bằng chứng mới.</text>
<text x="28.0" y="540.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Luật đọc: hướng giao dịch do D1/H1 quyết định (bias + DOL + vị trí trong dealing range). Tên của BPR chỉ cho biết giá đang ở phía nào của nó.</text>
