<rect x="0" y="0" width="980" height="620" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">OB đa khung — gộp nến (aggregation), lồng nhau (nesting) và tinh chỉnh (refinement)</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Khung thời gian không tạo ra thông tin mới; nó đổi cách GỘP cùng một chuỗi giá. Một OB H1 chứa cả một cấu trúc M5 bên trong.</text>
<rect x="26.0" y="80.0" width="300.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="100.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">A. Một nến H1 = 12 nến M5</text>
