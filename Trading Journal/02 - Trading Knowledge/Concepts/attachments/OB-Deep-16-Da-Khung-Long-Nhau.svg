<text x="285.0" y="320.0" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">= 1 nến H1</text>
<text x="40.0" y="350.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Bên trong 'một nến OB H1' có swing, BOS,</text>
<text x="40.0" y="365.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">sweep, FVG M5 riêng. 'Mở' nến H1 ra M5</text>
<text x="40.0" y="380.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">là thay một câu hỏi bằng 12 câu hỏi nhỏ.</text>
<text x="40.0" y="395.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="40.0" y="410.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">OB-Sim-01: tần suất OB TRÊN MỖI NẾN</text>
<text x="40.0" y="425.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">cùng bậc ở M5 (75/1.000) và H1 (54/1.000).</text>
<rect x="340.0" y="80.0" width="300.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="352.0" y="100.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="start">B. Lồng nhau D1 ⊃ H1 ⊃ M5</text>
<rect x="370.0" y="120.0" width="240.0" height="300.0" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="380.0" y="140.0" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="start">D1 OB (context)</text>
<rect x="400.0" y="190.0" width="180.0" height="170.0" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="410.0" y="210.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="start">H1 OB (setup / POI)</text>
<rect x="450.0" y="280.0" width="80.0" height="40.0" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="490.0" y="304.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">M5</text>
<text x="352.0" y="440.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Quyền: D1 nói ở đâu, H1 nói chờ gì,</text>
<text x="352.0" y="455.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">M5 chỉ nói KHI NÀO bóp cò (RULE-OB-007).</text>
<rect x="654.0" y="80.0" width="300.0" height="400.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="666.0" y="100.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">C. Refinement: được gì, mất gì</text>
<rect x="662.0" y="118.0" width="284.0" height="26.0" rx="4" fill="#F1F5F9"/>
<text x="668.0" y="136.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start"></text>
<text x="760.0" y="136.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">full HTF OB</text>
<text x="860.0" y="136.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">refined LTF OB</text>
<rect x="662.0" y="148.0" width="284.0" height="26.0" rx="4" fill="#FFFFFF"/>
<text x="668.0" y="166.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">khoảng stop</text>
<text x="760.0" y="166.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">rộng (vd 40 pip)</text>
<text x="860.0" y="166.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">hẹp (vd 6 pip)</text>
<rect x="662.0" y="178.0" width="284.0" height="26.0" rx="4" fill="#F9FAFB"/>
<text x="668.0" y="196.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">R:R danh nghĩa</text>
<text x="760.0" y="196.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">thấp</text>
<text x="860.0" y="196.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cao</text>
<rect x="662.0" y="208.0" width="284.0" height="26.0" rx="4" fill="#FFFFFF"/>
<text x="668.0" y="226.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">tỷ lệ khớp</text>
<text x="760.0" y="226.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cao</text>
<text x="860.0" y="226.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">thấp hơn</text>
<rect x="662.0" y="238.0" width="284.0" height="26.0" rx="4" fill="#F9FAFB"/>
<text x="668.0" y="256.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">số lựa chọn</text>
<text x="760.0" y="256.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">1</text>
<text x="860.0" y="256.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">2–4 OB con</text>
<rect x="662.0" y="268.0" width="284.0" height="26.0" rx="4" fill="#FFFFFF"/>
<text x="668.0" y="286.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">rủi ro overfit</text>
<text x="760.0" y="286.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">thấp</text>
<text x="860.0" y="286.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">CAO (chọn ex-post)</text>
<rect x="662.0" y="298.0" width="284.0" height="26.0" rx="4" fill="#F9FAFB"/>
<text x="668.0" y="316.0" font-size="9.6" font-weight="700" fill="#374151" text-anchor="start">E[R] trên RW</text>
<text x="760.0" y="316.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<text x="860.0" y="316.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">≈ 0</text>
<text x="666.0" y="350.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Refinement đổi PHÂN PHỐI kết quả (ít khớp,</text>
<text x="666.0" y="365.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">R lớn khi đúng), không tự tạo edge.</text>
<text x="666.0" y="380.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Rủi ro lớn nhất: chọn OB con 'đúng' SAU khi</text>
<text x="666.0" y="395.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">thấy giá phản ứng ở đó (OB-Sim-05 L3).</text>
<rect x="26.0" y="494.0" width="928.0" height="112.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="38.0" y="514.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="start">Quy tắc v2 (v0.1, BACKTEST REQUIRED)</text>
<text x="38.0" y="531.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">1. Chỉ tìm OB LTF SAU khi giá đã vào OB HTF và có sự kiện LTF (sweep/MSS) — không vẽ trước (v1 §14.5, giữ nguyên).</text>
<text x="38.0" y="547.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">2. Stop theo cấu trúc LTF đã dùng để vào lệnh; không 'mượn' stop HTF cho tín hiệu LTF (sai R:R 5–10 lần).</text>
<text x="38.0" y="563.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">3. Ghi rõ OB nào (TF nào) là context, setup, execution trong journal: ob_tf_context / ob_tf_setup / entry_tf.</text>
<text x="38.0" y="579.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">4. 'HTF OB quan trọng hơn' là HYPOTHESIS — trên RW, OB H1 và M5 cho Δ ≈ 0 như nhau (OB-Sim-02). Ý nghĩa HTF nếu có đến từ người tham gia, không từ phép gộp nến.</text>
