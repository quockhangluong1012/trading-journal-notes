<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đỉnh cũ đã bị vi phạm (mắt xích 2 có). Nhưng đáy giữa chỉ bị một cái râu chọc thủng — mắt xích 3 chưa xảy ra.</text>
