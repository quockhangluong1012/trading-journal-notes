<text x="443.4" y="417.5" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">chỉ là RÂU</text>
<rect x="642.0" y="92.5" width="330.0" height="519.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Đọc từng nến (số ở dưới chart)</text>
<text x="656.0" y="142.5" font-size="12" font-weight="700" fill="#2563EB">Nến 3</text>
<text x="656.0" y="158.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Tạo ĐỈNH CŨ.</text>
<text x="656.0" y="182.2" font-size="12" font-weight="700" fill="#2563EB">Nến 7</text>
<text x="656.0" y="198.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Nến giảm cuối cùng ở đáy giữa → vùng cam (bullish</text>
<text x="656.0" y="215.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">OB).</text>
<text x="656.0" y="238.7" font-size="12" font-weight="700" fill="#2563EB">Nến 8–12</text>
<text x="656.0" y="254.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá tăng vượt đỉnh cũ, tạo đỉnh mới. Mắt xích 2</text>
<text x="656.0" y="271.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">xong.</text>
<text x="656.0" y="295.2" font-size="12" font-weight="700" fill="#2563EB">Nến 13–15</text>
<text x="656.0" y="311.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá rơi về vùng cam.</text>
<text x="656.0" y="335.0" font-size="12" font-weight="700" fill="#2563EB">Nến 16</text>
<text x="656.0" y="351.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Râu đâm xuống DƯỚI đáy giữa, nhưng nến đóng cửa</text>
<text x="656.0" y="367.8" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">quay lại phía trên. Chỉ là râu.</text>
<text x="656.0" y="391.5" font-size="12" font-weight="700" fill="#2563EB">Nến 17–21</text>
<text x="656.0" y="407.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá bật lên từ vùng. OB gốc GIỮ đúng vai hỗ trợ —</text>
<text x="656.0" y="424.3" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">không có gì đổi vai cả.</text>
<rect x="656.0" y="510.8" width="302.0" height="86.5" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="510.8" width="4.0" height="86.5" rx="2" fill="#B45309"/>
<text x="670.0" y="530.8" font-size="11.8" font-weight="700" fill="#B45309" data-bx="656.0,958.0">Thiếu mắt xích 3 → không phải Breaker</text>
<text x="670.0" y="550.6" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">Vẽ Bearish Breaker ở nến 16 là vẽ sớm. Thực tế:</text>
<text x="670.0" y="567.3" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">một bullish OB hoạt động đúng vai, kèm một cú</text>
<text x="670.0" y="584.1" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">quét dưới đáy giữa.</text>
