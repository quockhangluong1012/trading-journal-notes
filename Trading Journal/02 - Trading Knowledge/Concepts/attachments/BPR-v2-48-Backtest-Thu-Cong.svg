<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<rect x="1" y="1" width="998" height="618" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="884.4" y="22" width="87.6" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">BACKTEST</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Backtest thủ công BPR: đơn giản nhưng không được gian lận</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không cần công thức. Chỉ cần ba thói quen: ghi MỌI BPR, không nhìn tương lai, và luôn có một nhóm để so sánh.</text>
<rect x="28.0" y="86.0" width="150.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="46.0" cy="106.0" r="10" fill="#1F2937"/>
<text x="46.0" y="110.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="62.0" y="110.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Bar replay</text>
<text x="38.0" y="152.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Tua chart theo từng nến.</text>
<text x="38.0" y="166.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Không nhìn phần bên</text>
<text x="38.0" y="181.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">phải.</text>
<line x1="179.0" y1="166.0" x2="185.5" y2="166.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#ah6B7280)"/>
<rect x="186.8" y="86.0" width="150.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="204.8" cy="106.0" r="10" fill="#7C3AED"/>
<text x="204.8" y="110.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="220.8" y="110.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="start">Ghi MỌI BPR</text>
<text x="196.8" y="152.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Kể cả BPR xấu, BPR</text>
<text x="196.8" y="166.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">ngược bias, BPR mỏng.</text>
<text x="196.8" y="181.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đánh số từng cái.</text>
<line x1="337.8" y1="166.0" x2="344.3" y2="166.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#ah6B7280)"/>
<rect x="345.6" y="86.0" width="150.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
<circle cx="363.6" cy="106.0" r="10" fill="#0E7490"/>
<text x="363.6" y="110.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="379.6" y="110.0" font-size="12" font-weight="700" fill="#0E7490" text-anchor="start">Ghi bối cảnh lúc</text>
<text x="379.6" y="126.6" font-size="12" font-weight="700" fill="#0E7490" text-anchor="start">hình thành</text>
<text x="355.6" y="152.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Khung, thứ tự, sweep,</text>
<text x="355.6" y="166.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">MSS, premium/discount,</text>
<text x="355.6" y="181.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">fresh.</text>
<line x1="496.6" y1="166.0" x2="503.1" y2="166.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#ah6B7280)"/>
<rect x="504.4" y="86.0" width="150.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<circle cx="522.4" cy="106.0" r="10" fill="#B45309"/>
<text x="522.4" y="110.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="538.4" y="110.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">Theo dõi lần quay</text>
<text x="538.4" y="126.6" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">lại</text>
<text x="514.4" y="152.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Có quay lại không? Sâu</text>
<text x="514.4" y="166.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">tới đâu? Phản ứng hay</text>
<text x="514.4" y="181.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">xuyên?</text>
<line x1="655.4" y1="166.0" x2="661.9" y2="166.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#ah6B7280)"/>
<rect x="663.2" y="86.0" width="150.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<circle cx="681.2" cy="106.0" r="10" fill="#1D4ED8"/>
<text x="681.2" y="110.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="697.2" y="110.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">So với nhóm đối</text>
<text x="697.2" y="126.6" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">chứng</text>
<text x="673.2" y="152.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">FVG đơn lẻ cùng khung,</text>
<text x="673.2" y="166.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">cùng kích thước, cùng</text>
<text x="673.2" y="181.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">giai đoạn.</text>
<line x1="814.2" y1="166.0" x2="820.7" y2="166.0" stroke="#6B7280" stroke-width="1.3" marker-end="url(#ah6B7280)"/>
<rect x="822.0" y="86.0" width="150.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.5"/>
<circle cx="840.0" cy="106.0" r="10" fill="#0F7A5A"/>
<text x="840.0" y="110.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="856.0" y="110.0" font-size="12" font-weight="700" fill="#0F7A5A" text-anchor="start">Kết luận tạm</text>
<text x="856.0" y="126.6" font-size="12" font-weight="700" fill="#0F7A5A" text-anchor="start">(v0.x)</text>
<text x="832.0" y="152.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">“Có dấu hiệu”, “chưa đủ</text>
<text x="832.0" y="166.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">mẫu”, hay “không khác”.</text>
<rect x="28.0" y="262.0" width="466.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="40.0" y="286.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">Những câu hỏi có thể trả lời bằng cách ĐẾM</text>
<circle cx="43.0" cy="302.8" r="2.2" fill="#7C3AED"/>
<text x="52.0" y="306.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Bao nhiêu BPR được giá quay lại?</text>
<circle cx="43.0" cy="321.3" r="2.2" fill="#7C3AED"/>
<text x="52.0" y="325.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Trong số đó, bao nhiêu phản ứng, bao nhiêu bị xuyên?</text>
<circle cx="43.0" cy="339.7" r="2.2" fill="#7C3AED"/>
<text x="52.0" y="343.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">BPR cùng bias D1 khác BPR ngược bias thế nào?</text>
<circle cx="43.0" cy="358.2" r="2.2" fill="#7C3AED"/>
<text x="52.0" y="362.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">BPR sau sweep khác BPR không sweep thế nào?</text>
<circle cx="43.0" cy="376.7" r="2.2" fill="#7C3AED"/>
<text x="52.0" y="380.6" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Fresh khác đã chạm thế nào? Trend khác range thế nào?</text>
<circle cx="43.0" cy="395.1" r="2.2" fill="#7C3AED"/>
<text x="52.0" y="399.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">BPR có khác FVG đơn lẻ cùng điều kiện không?</text>
<rect x="506.0" y="262.0" width="466.0" height="220.0" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.3"/>
<text x="518.0" y="286.5" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Ba cách tự lừa mình</text>
<circle cx="521.0" cy="302.8" r="2.2" fill="#B91C1C"/>
<text x="530.0" y="306.8" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ ghi BPR sau khi đã thấy giá phản ứng (hindsight / chọn mẫu đẹp).</text>
<circle cx="521.0" cy="321.3" r="2.2" fill="#B91C1C"/>
<text x="530.0" y="325.2" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Đổi định nghĩa giữa chừng cho hợp với kết quả (ví dụ: “BPR này không tính vì</text>
<text x="530.0" y="340.7" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">mỏng”).</text>
<circle cx="521.0" cy="355.2" r="2.2" fill="#B91C1C"/>
<text x="530.0" y="359.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Kết luận từ vài mẫu. Vài mẫu thắng liên tiếp hoàn toàn có thể là ngẫu nhiên.</text>
<text x="28.0" y="600.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Quy tắc: quyết định định nghĩa và bộ lọc TRƯỚC khi đếm. Mọi thay đổi sau đó ghi thành phiên bản mới (v0.2, v0.3…) theo quy ước versioning của vault.</text>
</svg>
