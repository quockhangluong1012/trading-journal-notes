<svg viewBox="0 0 980 420" width="980" height="420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="420" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Chuỗi nhân quả của toàn bộ note — đọc từ trái sang phải, không nhảy cóc</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Màu xanh dương = cơ chế thị trường có cơ sở. Màu cam = cách ICT đặt tên/diễn giải. Mũi tên = "dẫn tới", không phải "chắc chắn gây ra".</text>
<rect x="26.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="73.0" y="118.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">1</text>
<text x="73.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Con người</text>
<text x="73.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">muốn mua / bán</text>
<line x1="121.0" y1="142.0" x2="129.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="130.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="177.0" y="118.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">2</text>
<text x="177.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Lệnh</text>
<text x="177.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">market · limit</text>
<text x="177.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">· stop</text>
<line x1="225.0" y1="142.0" x2="233.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="234.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="281.0" y="118.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">3</text>
<text x="281.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Khớp lệnh</text>
<text x="281.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">giao dịch xảy</text>
<text x="281.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">ra</text>
<line x1="329.0" y1="142.0" x2="337.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="338.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="385.0" y="118.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">4</text>
<text x="385.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Price discovery</text>
<text x="385.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">tìm mức giá</text>
<text x="385.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">giao dịch</text>
<line x1="433.0" y1="142.0" x2="441.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="442.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="489.0" y="118.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">5</text>
<text x="489.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Giá di chuyển</text>
<text x="489.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">giao dịch ở</text>
<text x="489.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">mức mới</text>
<line x1="537.0" y1="142.0" x2="545.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="546.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="593.0" y="118.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">6</text>
<text x="593.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Liquidity</text>
<text x="593.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">lệnh chờ ở</text>
<text x="593.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">đâu, bao nhiêu</text>
<line x1="641.0" y1="142.0" x2="649.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="650.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="697.0" y="118.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">7</text>
<text x="697.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Price delivery</text>
<text x="697.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">giá đi từ vùng</text>
<text x="697.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">→ vùng</text>
<line x1="745.0" y1="142.0" x2="753.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="754.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="801.0" y="118.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">8</text>
<text x="801.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">ICT diễn giải</text>
<text x="801.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">DOL, PD array,</text>
<text x="801.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">structure</text>
<line x1="849.0" y1="142.0" x2="857.0" y2="142.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="858.0" y="96.0" width="94.0" height="92.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="905.0" y="118.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">9</text>
<text x="905.0" y="142.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">IPDA</text>
<text x="905.0" y="162.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">mô hình khái</text>
<text x="905.0" y="176.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">niệm</text>
<line x1="26.0" y1="206.0" x2="640.0" y2="206.0" stroke="#1D4ED8" stroke-width="2"/>
<text x="333.0" y="226.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">PHẦN I–X: thị trường hoạt động thế nào (không cần ICT)</text>
<line x1="650.0" y1="206.0" x2="952.0" y2="206.0" stroke="#B45309" stroke-width="2"/>
<text x="801.0" y="226.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">PHẦN XI–XXVII: ICT nhìn quá trình đó</text>
<rect x="26.0" y="252.0" width="450.0" height="150.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
<text x="40.0" y="278.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">✗ Giải thích vòng tròn (bị cấm trong note)</text>
<text x="40.0" y="304.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">"Giá tăng vì IPDA muốn lấy buy-side liquidity."</text>
<text x="40.0" y="322.1" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">"DOL là nơi IPDA muốn đưa giá tới."</text>
<text x="40.0" y="340.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">"Price di chuyển vì IPDA delivery price."</text>
<text x="40.0" y="358.4" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">→ Chỉ thay một từ khó bằng nhiều từ khó khác.</text>
<text x="40.0" y="376.5" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">→ Không trả lời: AI đặt lệnh gì, khớp ở đâu, vì sao ở mức đó?</text>
<rect x="504.0" y="252.0" width="450.0" height="150.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="518.0" y="278.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">✓ Giải thích cơ chế (mục tiêu của note)</text>
<text x="518.0" y="304.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh mua chủ động đã khớp hết các lệnh bán ở 101, 102;</text>
<text x="518.0" y="322.1" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">giao dịch tiếp theo chỉ có thể xảy ra ở 103 → giá in ra 103.</text>
<text x="518.0" y="340.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Phía trên đỉnh cũ có nhiều stop → khi chạm, stop thành</text>
<text x="518.0" y="358.4" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">lệnh mua → khớp tiếp lên trên → giá chạy nhanh.</text>
<text x="518.0" y="376.5" font-size="12.5" font-weight="600" fill="#15803D" text-anchor="start">→ Sau đó mới nói: "ICT gọi chuỗi này là price delivery".</text>
</svg>
