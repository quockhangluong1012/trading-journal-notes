<rect x="540.0" y="240.0" width="70.0" height="40.0" rx="4" fill="none" stroke="#15803D" stroke-width="2" stroke-dasharray="4 3"/>
<text x="575.0" y="232.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">cổng vào</text>
<text x="366.0" y="342.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="379.0" y="342.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đường đi tới khu đó có thông không?</text>
<text x="366.0" y="360.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="379.0" y="360.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đang đi vòng (hồi) hay đổi hướng</text>
<text x="379.0" y="376.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">thật?</text>
<text x="366.0" y="395.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="379.0" y="395.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đã tới cổng chưa?</text>
<rect x="674.0" y="84.0" width="300.0" height="372.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="688.0" y="108.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">③ Con đường trước mặt = M5</text>
<rect x="694.0" y="120.0" width="260.0" height="200.0" rx="6" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
<path d="M760,320 L800,120 M888,320 L848,120" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round"/>
<path d="M824,310 L824,130" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/>
<rect x="812.0" y="240.0" width="24.0" height="38.0" rx="5" fill="#1D4ED8" stroke="none" stroke-width="0"/>
<text x="844.0" y="262.0" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">xe của bạn</text>
<circle cx="746.0" cy="170.0" r="9" fill="#B91C1C" stroke="none" stroke-width="1"/>
<circle cx="746.0" cy="192.0" r="9" fill="#B45309" stroke="none" stroke-width="1"/>
<circle cx="746.0" cy="214.0" r="9" fill="#15803D" stroke="none" stroke-width="1"/>
<text x="700.0" y="232.0" font-size="10" font-weight="400" fill="#6B7280" text-anchor="start">đèn</text>
<text x="690.0" y="342.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="703.0" y="342.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đèn đã xanh chưa (điều kiện đã xảy</text>
<text x="703.0" y="357.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ra)?</text>
<text x="690.0" y="376.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="703.0" y="376.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có thể rẽ vào cổng an toàn ngay bây</text>
<text x="703.0" y="392.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">giờ?</text>
<text x="690.0" y="411.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="703.0" y="411.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nếu chưa: đứng chờ, không đi đường</text>
<text x="703.0" y="427.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">khác</text>
<line x1="326.0" y1="250.0" x2="350.0" y2="250.0" stroke="#6B7280" stroke-width="2" marker-end="url(#m6B7280)"/>
<line x1="650.0" y1="250.0" x2="674.0" y2="250.0" stroke="#6B7280" stroke-width="2" marker-end="url(#m6B7280)"/>
<rect x="26.0" y="470.0" width="948.0" height="150.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="26.0" y="470.0" width="948.0" height="6.0" rx="3" fill="#B91C1C" stroke="none" stroke-width="0"/>
<text x="40.0" y="494.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">Ẩn dụ đúng đến đâu — và gãy ở đâu</text>
<text x="42.0" y="518.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="518.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Bản đồ thành phố KHÔNG dự báo tương lai: nó chỉ cho biết bạn</text>
<text x="55.0" y="533.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đang ở đâu. 'D1 tăng' không có nghĩa 'hôm nay sẽ tăng'.</text>
<text x="42.0" y="552.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="552.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thành phố trên thị trường được vẽ lại liên tục: một con đường</text>
<text x="55.0" y="568.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lớn bị sập (swing có ý nghĩa ở thang D1 bị phá) LÀ thông tin</text>
<text x="55.0" y="584.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">để vẽ lại bản đồ lớn — dù bạn nhìn thấy nó trên H1.</text>
<text x="504.0" y="518.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="517.0" y="518.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đèn xanh ở con đường nhỏ không quyết định cả thành phố đi đâu:</text>
<text x="517.0" y="533.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">một tín hiệu M5 không đổi được Daily Bias.</text>
<text x="504.0" y="552.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="517.0" y="552.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có những ngày không có đường nào an toàn để đi: đứng yên (No</text>
<text x="517.0" y="568.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Trade) là một quyết định đúng, không phải thất bại.</text>
</svg>
