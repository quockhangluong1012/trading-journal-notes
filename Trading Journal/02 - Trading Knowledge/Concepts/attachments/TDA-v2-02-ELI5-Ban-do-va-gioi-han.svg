<text x="186.0" y="212.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">bạn ở đây</text>
<rect x="126.0" y="262.0" width="100.0" height="48.0" rx="4" fill="none" stroke="#15803D" stroke-width="2" stroke-dasharray="4 3"/>
<text x="132.0" y="306.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">khu muốn đến</text>
<text x="42.0" y="342.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="342.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mình đang ở khu nào?</text>
<text x="42.0" y="360.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="360.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thành phố nhìn chung dốc lên hay</text>
<text x="55.0" y="376.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">xuống?</text>
<text x="42.0" y="395.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="395.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Khu nào đáng tới (vùng quan tâm)?</text>
<rect x="350.0" y="84.0" width="300.0" height="372.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="364.0" y="108.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">② Bản đồ khu phố = H1</text>
<rect x="370.0" y="120.0" width="260.0" height="200.0" rx="6" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1"/>
<line x1="380.0" y1="140.0" x2="620.0" y2="140.0" stroke="#FCD34D" stroke-width="3"/>
