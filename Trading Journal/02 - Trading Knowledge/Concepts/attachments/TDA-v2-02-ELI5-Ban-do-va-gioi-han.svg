<rect x="246.0" y="180.0" width="50.0" height="90.0" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
<rect x="56.0" y="260.0" width="60.0" height="50.0" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
