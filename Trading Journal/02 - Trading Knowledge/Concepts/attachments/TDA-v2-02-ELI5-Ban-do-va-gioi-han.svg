<rect x="0" y="0" width="1000" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Giải thích cho trẻ 5 tuổi: bản đồ thành phố → bản đồ khu phố → con đường trước mặt</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi tấm bản đồ trả lời một câu hỏi khác. Tấm nhỏ không thay được tấm lớn, tấm lớn không thay được tấm nhỏ.</text>
<rect x="26.0" y="84.0" width="300.0" height="372.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">① Bản đồ thành phố = D1</text>
<rect x="46.0" y="120.0" width="260.0" height="200.0" rx="6" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
<rect x="56.0" y="130.0" width="70.0" height="50.0" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
<rect x="136.0" y="130.0" width="90.0" height="70.0" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
<rect x="236.0" y="130.0" width="60.0" height="40.0" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
<rect x="56.0" y="190.0" width="110.0" height="60.0" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
