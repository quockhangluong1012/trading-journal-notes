<line x1="504.0" y1="128.0" x2="504.0" y2="312.0" stroke="#FCD34D" stroke-width="3"/>
<line x1="556.0" y1="128.0" x2="556.0" y2="312.0" stroke="#FCD34D" stroke-width="3"/>
<line x1="608.0" y1="128.0" x2="608.0" y2="312.0" stroke="#FCD34D" stroke-width="3"/>
