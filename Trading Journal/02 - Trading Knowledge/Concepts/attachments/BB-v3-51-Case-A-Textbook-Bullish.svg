<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Bối cảnh và diễn biến</text>
<text x="656.0" y="142.5" font-size="11.8" font-weight="700" fill="#2563EB">Bối cảnh</text>
<text x="656.0" y="158.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">D1 hướng lên, giá vừa hồi về nửa dưới. Còn đỉnh cũ</text>
<text x="656.0" y="174.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">phía trên chưa bị lấy.</text>
<text x="656.0" y="198.1" font-size="11.8" font-weight="700" fill="#2563EB">① Liquidity</text>
<text x="656.0" y="214.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá xuống dưới đáy phiên trước — một túi lệnh dễ</text>
<text x="656.0" y="230.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">thấy — rồi dừng.</text>
<text x="656.0" y="253.8" font-size="11.8" font-weight="700" fill="#2563EB">② Phá cấu trúc</text>
<text x="656.0" y="269.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Ba nến tăng mạnh, nến thứ năm đóng cửa trên đỉnh</text>
<text x="656.0" y="286.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">giữa. Có displacement.</text>
<text x="656.0" y="309.4" font-size="11.8" font-weight="700" fill="#2563EB">③ Retest</text>
<text x="656.0" y="325.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá hồi về, râu chạm vùng, đóng cửa trong vùng.</text>
<text x="656.0" y="341.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Khung nhỏ cho MSS tăng.</text>
<text x="656.0" y="365.1" font-size="11.8" font-weight="700" fill="#2563EB">④ Kết quả</text>
<text x="656.0" y="381.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá đi tiếp về phía DOL.</text>
<rect x="656.0" y="509.6" width="302.0" height="85.4" rx="8" fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="509.6" width="4.0" height="85.4" rx="2" fill="#15803D"/>
<text x="670.0" y="529.5" font-size="11.6" font-weight="700" fill="#15803D" data-bx="656.0,958.0">Điều thật sự kết luận được</text>
<text x="670.0" y="548.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Một mẫu mà MỌI thứ cùng chiều. Nó cho thấy</text>
<text x="670.0" y="565.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">trình tự trông thế nào khi chạy đúng — không</text>
<text x="670.0" y="581.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">cho thấy trình tự này chạy đúng bao nhiêu lần.</text>
