<text x="66.0" y="144.8" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">Range high (BSL — DOL giả định)</text>
<line x1="60.0" y1="559.2" x2="620.0" y2="559.2" stroke="#334155" stroke-width="1.4"/>
<text x="66.0" y="575.2" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">Range low (SSL)</text>
<line x1="60.0" y1="355.0" x2="620.0" y2="355.0" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>
<text x="616.0" y="350.0" font-size="10" font-weight="600" fill="#334155" text-anchor="end">EQ 50%</text>
<text x="616.0" y="179.4" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="end">PREMIUM</text>
<text x="616.0" y="538.8" font-size="11" font-weight="700" fill="#15803D" text-anchor="end">DISCOUNT</text>
<rect x="90.0" y="469.3" width="270.0" height="36.8" rx="0" fill="#16A34A" fill-opacity="0.25"/>
<line x1="90.0" y1="469.3" x2="360.0" y2="469.3" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="90.0" y1="506.1" x2="360.0" y2="506.1" stroke="#15803D" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="368.0" y="485.7" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">A. Bullish FVG ở discount, sau sweep SSL</text>
<text x="368.0" y="499.7" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">→ ứng viên entry long (location tốt nhất)</text>
<rect x="90.0" y="338.7" width="270.0" height="32.7" rx="0" fill="#D97706" fill-opacity="0.25"/>
<line x1="90.0" y1="338.7" x2="360.0" y2="338.7" stroke="#B45309" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="90.0" y1="371.3" x2="360.0" y2="371.3" stroke="#B45309" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="368.0" y="353.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="start">B. Bullish FVG quanh EQ</text>
<text x="368.0" y="367.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">→ trung tính; cần thêm bằng chứng</text>
<rect x="90.0" y="216.2" width="270.0" height="28.6" rx="0" fill="#D97706" fill-opacity="0.25"/>
<line x1="90.0" y1="216.2" x2="360.0" y2="216.2" stroke="#B45309" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="90.0" y1="244.7" x2="360.0" y2="244.7" stroke="#B45309" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="368.0" y="228.5" font-size="10" font-weight="700" fill="#B45309" text-anchor="start">C. Bullish FVG ở premium</text>
<text x="368.0" y="242.5" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">→ long ở đây = chase; R:R tới DOL ngắn</text>
<rect x="90.0" y="281.5" width="270.0" height="24.5" rx="0" fill="#DC2626" fill-opacity="0.25"/>
<line x1="90.0" y1="281.5" x2="360.0" y2="281.5" stroke="#B91C1C" stroke-width="1.1" stroke-dasharray="5 3"/>
<line x1="90.0" y1="306.0" x2="360.0" y2="306.0" stroke="#B91C1C" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="368.0" y="291.8" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">D. Bearish FVG chưa lấp trên đường lên</text>
<text x="368.0" y="305.8" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">→ CẢN TRỞ: có thể là target/điểm phản ứng</text>
<path d="M80.0,395.8 L99.3,446.9 L118.6,510.2 L137.9,571.4 L157.1,497.9 L176.4,444.8 L195.7,473.4 L215.0,404.0 L234.3,346.8 L253.6,367.2 L272.9,301.9 L292.1,314.2 L311.4,248.8 L330.7,195.8 L350.0,142.7" stroke="#1F2937" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="666.0" y="96.0" width="284.0" height="528.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="680.0" y="120.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start">Bốn vai trò của FVG so với DOL</text>
<text x="680.0" y="146.0" font-size="10.2" font-weight="700" fill="#1F2937" text-anchor="start">1. Entry location</text>
<text x="680.0" y="163.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">FVG giữa giá và POI, cùng chiều DOL,</text>
<text x="680.0" y="180.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">ở discount (long) / premium (short).</text>
<text x="680.0" y="197.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="680.0" y="214.0" font-size="10.2" font-weight="700" fill="#1F2937" text-anchor="start">2. Continuation location</text>
<text x="680.0" y="231.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">FVG mới nhất trên leg đang chạy về</text>
<text x="680.0" y="248.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">DOL — chỗ nghỉ của trend.</text>
<text x="680.0" y="265.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="680.0" y="282.0" font-size="10.2" font-weight="700" fill="#1F2937" text-anchor="start">3. Obstacle / reaction area</text>
<text x="680.0" y="299.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">FVG NGƯỢC chiều nằm giữa giá và DOL</text>
<text x="680.0" y="316.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">— nơi giá có thể phản ứng ngược.</text>
<text x="680.0" y="333.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="680.0" y="350.0" font-size="10.2" font-weight="700" fill="#1F2937" text-anchor="start">4. Target (draw)</text>
<text x="680.0" y="367.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">FVG HTF chưa lấp phía trước như một</text>
<text x="680.0" y="384.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">mục tiêu trung gian (ICT: PD array</text>
<text x="680.0" y="401.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">as draw) — [HYPOTHESIS], cần test</text>
<text x="680.0" y="418.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">so với mức ngẫu nhiên cùng khoảng cách.</text>
<text x="680.0" y="435.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="680.0" y="452.0" font-size="10.2" font-weight="700" fill="#B91C1C" text-anchor="start">Lưu ý</text>
<text x="680.0" y="469.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">'Bullish FVG ở discount tốt hơn'</text>
<text x="680.0" y="486.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">là heuristic ICT — BACKTEST REQUIRED.</text>
