<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">FVG trong Dealing Range và trên đường tới DOL — vị trí đổi vai trò của cùng một FVG</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Dealing range chỉ là CONTEXT. Câu hỏi không phải 'FVG này đẹp không' mà là 'FVG này nằm ở đâu so với range và so với DOL?'</text>
<rect x="30.0" y="96.0" width="620.0" height="528.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="60.0" y="150.8" width="560.0" height="408.3" rx="0" fill="#F9FAFB"/>
