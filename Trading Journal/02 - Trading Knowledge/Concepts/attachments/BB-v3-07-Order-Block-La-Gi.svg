<text x="28.0" y="574.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Không phải mọi nến ngược màu đều là OB đáng quan tâm (xem note 25 và 55). Với Breaker, ta chỉ cần OB nằm NGAY TẠI một swing: đỉnh giữa hoặc đáy giữa.</text>
