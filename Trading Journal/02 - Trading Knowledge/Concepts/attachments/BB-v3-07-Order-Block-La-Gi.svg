<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Order Block (OB): cây nến NGƯỢC màu cuối cùng trước một cú chạy mạnh</text>
<rect x="889.7" y="23.0" width="82.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="930.8" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bullish OB = nến GIẢM cuối cùng trước khi giá tăng mạnh. Bearish OB = nến TĂNG cuối cùng trước khi giá giảm mạnh. Hai hình là ảnh gương của</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">nhau.</text>
