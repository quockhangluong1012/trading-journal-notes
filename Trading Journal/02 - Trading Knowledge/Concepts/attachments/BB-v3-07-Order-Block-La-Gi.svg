<text x="526.0" y="478.9" font-size="12" font-weight="400" fill="#6B7280" data-bx="525.0,959.0">Trẻ con: chỗ quả bóng “khựng lại” trước khi rơi mạnh. [ICT] diễn giải rằng</text>
