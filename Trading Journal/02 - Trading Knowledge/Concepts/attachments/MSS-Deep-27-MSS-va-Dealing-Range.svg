<rect x="0" y="0" width="980" height="596" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">MSS và vị trí trong dealing range — cùng một MSS, bốn bối cảnh</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">ICT ưu tiên MSS tăng ở discount / MSS giảm ở premium. Một phần lý do là HÌNH HỌC (khoảng cách</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">tới pool đối diện quyết định R:R) — phần còn lại là giả thuyết cần đo.</text>
