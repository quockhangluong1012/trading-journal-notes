<text x="70.8" y="176.4" font-size="10" font-weight="800" fill="#B91C1C" text-anchor="start">PREMIUM</text>
<text x="70.8" y="439.6" font-size="10" font-weight="800" fill="#15803D" text-anchor="start">DISCOUNT</text>
