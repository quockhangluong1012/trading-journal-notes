<text x="259.8" y="377.0" font-size="9" font-weight="400" fill="#374151" text-anchor="middle">chop, room vừa</text>
<path d="M351.6,192.8 L367.8,229.2 L378.6,211.0 L394.8,243.8 L416.4,196.4 L432.6,211.0 L454.2,171.0" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
