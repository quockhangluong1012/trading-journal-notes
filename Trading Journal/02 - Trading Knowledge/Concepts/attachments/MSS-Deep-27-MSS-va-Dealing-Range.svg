<text x="119.4" y="478.9" font-size="9" font-weight="400" fill="#374151" text-anchor="middle">room lớn tới BSL</text>
<path d="M211.2,280.2 L227.4,316.6 L238.2,298.4 L254.4,331.1 L276.0,283.8 L292.2,298.4 L313.8,258.3" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
