<text x="400.2" y="289.6" font-size="9" font-weight="400" fill="#374151" text-anchor="middle">mua đắt, room nhỏ</text>
<path d="M470.4,192.8 L492.0,134.6 L513.6,149.1 L535.2,120.0" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="513.6" y="103.4" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="middle">D · ngoài range</text>
<rect x="640.0" y="96.0" width="314.0" height="408.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="652.0" y="118.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Đọc bốn bối cảnh (bullish MSS)</text>
<text x="652.0" y="135.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">A · Discount, sau khi lấy SSL</text>
<text x="652.0" y="150.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Cấu hình ưa thích của ICT 2022. R:R tới</text>
<text x="652.0" y="165.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">BSL lớn về mặt hình học. [HYP-MSS-005]</text>
<text x="652.0" y="180.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="195.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">B · Quanh equilibrium</text>
<text x="652.0" y="210.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Không ở cực range → MSS-I ở đây thường</text>
<text x="652.0" y="225.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">là dao động nội bộ. Room vừa phải.</text>
<text x="652.0" y="240.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="255.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="start">C · Premium</text>
<text x="652.0" y="270.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Long ở premium = mua phần đắt của range;</text>
<text x="652.0" y="285.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">pool phía trên gần → R:R nhỏ (v1 W5).</text>
<text x="652.0" y="300.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="315.0" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">D · Ngoài range (sau khi phá biên)</text>
<text x="652.0" y="330.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Range cũ hết hiệu lực → re-map range</text>
<text x="652.0" y="345.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">trước khi dùng premium/discount</text>
<text x="652.0" y="360.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">(note 37).</text>
<text x="652.0" y="375.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="652.0" y="390.0" font-size="10" font-weight="600" fill="#6B7280" text-anchor="start">Nhắc: p_null của 'tới BSL trước stop' do</text>
<text x="652.0" y="405.0" font-size="10" font-weight="600" fill="#6B7280" text-anchor="start">khoảng cách quyết định (martingale).</text>
<rect x="26.0" y="516.0" width="928.0" height="64.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="538.0" font-size="10.1" font-weight="600" fill="#334155" text-anchor="start">Kiểm định đúng: so E[R] (không phải win rate) của MSS theo vị trí, với stop/target cùng quy tắc, và so với baseline cùng khoảng cách tới pool.</text>
<text x="42.0" y="554.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">Win rate cao hơn ở A có thể chỉ là target gần hơn tương đối với stop. [HYPOTHESIS · BACKTEST REQUIRED]</text>
</svg>