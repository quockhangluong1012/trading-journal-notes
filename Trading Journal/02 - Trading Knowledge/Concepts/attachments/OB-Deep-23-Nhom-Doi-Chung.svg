<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Nhóm đối chứng — câu hỏi đúng là 'OB có hơn một vùng bất kỳ CÙNG HÌNH HỌC không?'</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Tỷ lệ phản ứng thô phụ thuộc độ rộng vùng và khoảng cách tới giá. So OB với vùng hẹp hơn / xa hơn là so táo với cam.</text>
<rect x="26.0" y="80.0" width="450.0" height="330.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="38.0" y="100.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Dựng đối chứng khớp hình học (C1)</text>
<line x1="60.0" y1="145.0" x2="220.0" y2="145.0" stroke="#111827" stroke-width="2.2"/>
<text x="64.0" y="137.0" font-size="9.4" font-weight="600" fill="#374151" text-anchor="start">giá tại t_avail của OB</text>
<rect x="80.0" y="207.5" width="140.0" height="50.0" rx="2" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="1.3"/>
<text x="224.0" y="236.5" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">OB</text>
<line x1="240.0" y1="145.0" x2="240.0" y2="207.5" stroke="#D97706" stroke-width="1.4" marker-end="url(#aO)"/>
<text x="246.0" y="175.0" font-size="9.4" font-weight="700" fill="#B45309" text-anchor="start">offset = 1.2 ATR</text>
<line x1="240.0" y1="207.5" x2="240.0" y2="257.5" stroke="#7C3AED" stroke-width="1.4"/>
<text x="246.0" y="235.0" font-size="9.4" font-weight="700" fill="#6D28D9" text-anchor="start">width = 1.2 ATR</text>
<line x1="260.0" y1="132.5" x2="300.0" y2="132.5" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
<text x="280.0" y="126.5" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">→</text>
<line x1="310.0" y1="170.0" x2="450.0" y2="170.0" stroke="#111827" stroke-width="2.2"/>
<text x="314.0" y="162.0" font-size="9.4" font-weight="600" fill="#374151" text-anchor="start">giá tại t' ngẫu nhiên</text>
<rect x="330.0" y="232.5" width="120.0" height="50.0" rx="2" fill="#475569" fill-opacity="0.3" stroke="#475569" stroke-width="1.3"/>
<text x="390.0" y="226.5" font-size="9.2" font-weight="700" fill="#334155" text-anchor="middle">vùng đối chứng C1</text>
<text x="40.0" y="318.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Cùng hướng, cùng khoảng cách, cùng độ rộng, cùng quy tắc</text>
<text x="40.0" y="333.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">entry/stop/target, cùng cửa sổ W — chỉ khác: không có</text>
<text x="40.0" y="348.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">nến ngược hướng + displacement + BOS phía sau.</text>
<text x="40.0" y="363.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Nếu OB &gt; C1 trên dữ liệu thật: phần chênh là thông tin</text>
<text x="40.0" y="378.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">riêng của 'cú mất cân bằng' (đúng thứ ta muốn đo).</text>
<rect x="490.0" y="80.0" width="464.0" height="330.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="502.0" y="100.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Kết quả trên random walk (OB-Sim-02, Gaussian)</text>
<text x="504.0" y="120.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">nhóm</text>
<text x="700.0" y="120.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">phản ứng thô</text>
<text x="810.0" y="120.0" font-size="9.8" font-weight="700" fill="#6B7280" text-anchor="start">win − p_null (điểm %)</text>
<rect x="498.0" y="129.0" width="448.0" height="26.0" rx="4" fill="#EFF6FF"/>
<text x="504.0" y="146.0" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">OB (D3b)</text>
<text x="700.0" y="146.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">53.5%</text>
<text x="810.0" y="146.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">+0.3 ± 0.3</text>
<rect x="498.0" y="159.0" width="448.0" height="26.0" rx="4" fill="#F1F5F9"/>
<text x="504.0" y="176.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">C1 zone khớp hình học</text>
<text x="700.0" y="176.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">53.1%</text>
<text x="810.0" y="176.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">−0.2 ± 0.3</text>
<rect x="498.0" y="189.0" width="448.0" height="26.0" rx="4" fill="#F1F5F9"/>
<text x="504.0" y="206.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">C2 nến ngược không displ.</text>
<text x="700.0" y="206.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">45.6%</text>
<text x="810.0" y="206.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">+0.2 ± 0.3</text>
<rect x="498.0" y="219.0" width="448.0" height="26.0" rx="4" fill="#F1F5F9"/>
<text x="504.0" y="236.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">C3 swing cũ (S/R)</text>
<text x="700.0" y="236.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">49.9%</text>
<text x="810.0" y="236.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">−0.3 ± 0.3</text>
<rect x="498.0" y="249.0" width="448.0" height="26.0" rx="4" fill="#F1F5F9"/>
<text x="504.0" y="266.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">C4 FVG</text>
<text x="700.0" y="266.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">35.7%</text>
<text x="810.0" y="266.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">−0.2 ± 0.3</text>
<rect x="498.0" y="279.0" width="448.0" height="26.0" rx="4" fill="#EFF6FF"/>
<text x="504.0" y="296.0" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">OB H1</text>
<text x="700.0" y="296.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">56.9%</text>
<text x="810.0" y="296.0" font-size="10" font-weight="600" fill="#374151" text-anchor="start">+2.2 ± 1.2</text>
<text x="504.0" y="340.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">Phản ứng thô chênh tới 21 điểm % — hoàn toàn do độ rộng vùng</text>
<text x="504.0" y="355.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">(FVG hẹp ~0.54 ATR, OB ~1.17 ATR). Sau khi trừ hình học: mọi</text>
<text x="504.0" y="370.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">nhóm ≈ 0. OB H1: n nhỏ (2.375), CI chứa 0.</text>
<rect x="26.0" y="424.0" width="928.0" height="200.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="38.0" y="444.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="start">Bảng đối chứng tối thiểu cho nghiên cứu OB thật (theo protocol §40)</text>
<text x="38.0" y="462.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">C1 vùng ngẫu nhiên khớp hình học — baseline BẮT BUỘC; trả lời 'OB có hơn một mức giá bất kỳ không?'</text>
<text x="38.0" y="479.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">C2 nến ngược hướng KHÔNG có displacement — trả lời 'displacement có thêm gì không?' (lưu ý: nhãn 'không displacement' chỉ biết sau leg → bắt đầu đo SAU đó;</text>
<text x="38.0" y="496.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">     lần chạy đầu của OB-Sim-02 quên điều này và cho C2 −5 điểm % giả — chính đối chứng cũng có thể rò rỉ tương lai).</text>
<text x="38.0" y="513.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">C3 swing cũ / S/R — trả lời 'OB có hơn support/resistance cổ điển không?'   C4 FVG — 'OB có hơn FVG cùng leg không?'</text>
<text x="38.0" y="530.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">C5 thời điểm ngẫu nhiên, hướng = momentum 1h — trả lời 'OB có hơn một quy tắc đi theo xu hướng đơn giản không?' (OB-Sim-07: trong regime trending, OB</text>
<text x="38.0" y="547.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">     thắng vùng hướng-ngẫu-nhiên +0.16R nhưng KHÔNG thắng C5).</text>
<text x="38.0" y="564.0" font-size="9.8" font-weight="400" fill="#374151" text-anchor="start">Thống kê: so sánh cặp OB vs C cùng quy tắc, cùng giai đoạn; báo cáo chênh lệch + CI; bootstrap theo ngày để xử lý phụ thuộc.</text>
</svg>