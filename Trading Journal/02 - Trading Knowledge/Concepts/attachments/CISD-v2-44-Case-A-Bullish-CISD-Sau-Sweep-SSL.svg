<text x="655.0" y="131.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đỉnh #5 vừa hình thành; đáy cũ #2 = SSL. Bias tăng, đích</text>
<text x="655.0" y="147.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">là BSL phía trên.</text>
<rect x="646.0" y="164.8" width="326.0" height="67.8" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="655.0" y="185.0" font-size="11.8" font-weight="700" fill="#2563EB" text-anchor="start">T1 · Sweep (#9)</text>
<text x="655.0" y="205.7" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Chặng #6–#9 đưa giá vào POI và quét SSL. Kẻ mức CISD =</text>
<text x="655.0" y="220.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">open #6 NGAY LÚC NÀY.</text>
<rect x="646.0" y="238.6" width="326.0" height="52.7" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="655.0" y="258.8" font-size="11.8" font-weight="700" fill="#6B7280" text-anchor="start">T2 · Thử (#10)</text>
<text x="655.0" y="279.5" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Nến tăng đóng dưới mức → chưa CISD.</text>
<rect x="646.0" y="297.3" width="326.0" height="67.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="655.0" y="317.5" font-size="11.8" font-weight="700" fill="#D97706" text-anchor="start">T3 · CISD (#11)</text>
<text x="655.0" y="338.2" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng trên mức → bullish CISD. Có FVG. Kế hoạch: theo dõi,</text>
<text x="655.0" y="353.3" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">chưa vào (khung yêu cầu MSS).</text>
<rect x="646.0" y="371.1" width="326.0" height="67.8" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.3"/>
<text x="655.0" y="391.4" font-size="11.8" font-weight="700" fill="#4338CA" text-anchor="start">T4 · MSS (#13)</text>
<text x="655.0" y="412.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Đóng vượt swing high → MSS. Giá đã hồi vào FVG ở #12. Đủ</text>
<text x="655.0" y="427.1" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">điều kiện theo khung.</text>
<rect x="646.0" y="445.0" width="326.0" height="67.8" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="655.0" y="465.2" font-size="11.8" font-weight="700" fill="#059669" text-anchor="start">T5 · Kết quả</text>
<text x="655.0" y="485.8" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi về BSL. KHÔNG kết luận “CISD hiệu quả” từ một ví</text>
<text x="655.0" y="500.9" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="start">dụ.</text>
