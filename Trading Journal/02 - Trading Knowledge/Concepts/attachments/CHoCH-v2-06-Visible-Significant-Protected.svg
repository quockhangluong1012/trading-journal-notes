<text x="802.0" y="180.9" font-size="11.5" font-weight="700" fill="#6B7280" text-anchor="middle">VISIBLE</text>
<text x="802.0" y="194.9" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">mọi đáy/đỉnh nhìn thấy</text>
<text x="802.0" y="242.9" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">SIGNIFICANT</text>
<text x="802.0" y="256.9" font-size="10" font-weight="400" fill="#2563EB" text-anchor="middle">gánh một việc cấu trúc</text>
<text x="802.0" y="311.9" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">PROTECTED</text>
<text x="802.0" y="325.9" font-size="9.5" font-weight="400" fill="#B45309" text-anchor="middle">chỉ 1 mỗi lớp</text>
<text x="648.0" y="396.9" font-size="11.8" font-weight="400" fill="#6B7280" data-bx="647.0,957.0">Visible: bất kỳ chỗ giá quay đầu. Rất nhiều, phần lớn</text>
<text x="648.0" y="413.7" font-size="11.8" font-weight="400" fill="#6B7280" data-bx="647.0,957.0">là nhiễu.</text>
<text x="648.0" y="437.4" font-size="11.8" font-weight="400" fill="#2563EB" data-bx="647.0,957.0">Significant: đã xác nhận, và đã làm một việc cấu trúc</text>
<text x="648.0" y="454.2" font-size="11.8" font-weight="400" fill="#2563EB" data-bx="647.0,957.0">(ví dụ phóng ra một BOS, hoặc là ranh của dealing</text>
<text x="648.0" y="470.9" font-size="11.8" font-weight="400" fill="#2563EB" data-bx="647.0,957.0">range).</text>
<text x="648.0" y="494.7" font-size="11.8" font-weight="400" fill="#B45309" data-bx="647.0,957.0">Protected: đáy (đỉnh) mà NẾU bị phá thì câu “đang</text>
<text x="648.0" y="511.5" font-size="11.8" font-weight="400" fill="#B45309" data-bx="647.0,957.0">tăng (giảm)” ở lớp này không còn đúng. Tại một thời</text>
<text x="648.0" y="528.2" font-size="11.8" font-weight="400" fill="#B45309" data-bx="647.0,957.0">điểm, mỗi lớp chỉ có MỘT.</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Định nghĩa vận hành của vault (kế thừa note 21 và 57): protected low = đáy thấp nhất của chân sóng đã tạo ra BOS tăng gần nhất.</text>
