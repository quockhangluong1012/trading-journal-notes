<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cùng một đoạn xu hướng tăng. Rất nhiều đáy nhìn thấy được, chỉ vài đáy có ý nghĩa cấu trúc, và chỉ MỘT đáy là protected low tại thời điểm cuối</text>
