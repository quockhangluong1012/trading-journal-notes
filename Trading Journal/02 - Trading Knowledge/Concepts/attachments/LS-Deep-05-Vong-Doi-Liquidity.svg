<svg viewBox="0 0 980 750" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="750" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vòng đời của một liquidity reference — mức giá và lệnh là hai thứ khác nhau</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Chart chỉ cho thấy MỨC GIÁ. Các lệnh quanh mức đó xuất hiện, tăng, dời đi, bị khớp, được bổ sung — gần như hoàn toàn vô hình.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Dòng cuối mỗi ô: cái gì THẤY được trên OHLC, cái gì chỉ SUY LUẬN được, cái gì KHÔNG thấy.</text>
<line x1="581.6" y1="185.7" x2="637.5" y2="224.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="784.4" y1="282.8" x2="781.9" y2="352.5" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="784.5" y1="444.1" x2="787.1" y2="513.8" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="642.3" y1="574.9" x2="586.5" y2="613.2" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="398.4" y1="614.3" x2="342.5" y2="576.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="195.6" y1="517.2" x2="198.1" y2="447.5" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="195.5" y1="355.9" x2="192.9" y2="286.2" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="337.7" y1="225.1" x2="393.5" y2="186.8" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<rect x="385.0" y="130.0" width="210.0" height="84.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
<text x="490.0" y="150.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="middle">1 · Hình thành</text>
<text x="490.0" y="169.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">swing hoàn thành, mức trở nên</text>
<text x="490.0" y="183.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">nổi bật với người nhìn chart</text>
<text x="490.0" y="206.0" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">thấy: mức · không thấy: lệnh</text>
<rect x="629.0" y="196.8" width="210.0" height="84.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
<text x="734.0" y="216.8" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">2 · Tích lũy</text>
<text x="734.0" y="235.8" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">thời gian trôi, thêm test / equal</text>
<text x="734.0" y="249.8" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">highs → nhiều người tham chiếu</text>
<text x="734.0" y="272.8" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">thấy: số lần test, tuổi của mức</text>
<rect x="730.0" y="358.0" width="210.0" height="84.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/>
<text x="835.0" y="378.0" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="middle">3 · Di chuyển (migration)</text>
<text x="835.0" y="397.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">trailing stop dời theo giá;</text>
<text x="835.0" y="411.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">stop chuyển sang swing mới hơn</text>
<text x="835.0" y="434.0" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">không thấy</text>
<rect x="629.0" y="519.2" width="210.0" height="84.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/>
<text x="734.0" y="539.2" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">4 · Tiếp cận</text>
<text x="734.0" y="558.2" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">giá tới gần; lệnh limit có thể</text>
<text x="734.0" y="572.2" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">được thêm vào hoặc bị rút</text>
<text x="734.0" y="595.2" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">thấy: khoảng cách · không: sổ lệnh</text>
<rect x="385.0" y="586.0" width="210.0" height="84.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.7"/>
<text x="490.0" y="606.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">5 · Tiêu thụ</text>
<text x="490.0" y="625.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">giá vượt mức → stop kích hoạt</text>
<text x="490.0" y="639.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">và khớp với limit đối diện</text>
<text x="490.0" y="662.0" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">thấy: giá vượt · không: lượng khớp</text>
<rect x="141.0" y="519.2" width="210.0" height="84.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.7"/>
<text x="246.0" y="539.2" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">6 · Tiêu thụ một phần</text>
<text x="246.0" y="558.2" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">vượt nông: chỉ lớp stop sát mức</text>
<text x="246.0" y="572.2" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">bị kích hoạt, lớp sâu vẫn còn</text>
<text x="246.0" y="595.2" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">thấy: độ sâu · suy luận: còn lại bao nhiêu</text>
<rect x="40.0" y="358.0" width="210.0" height="84.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.7"/>
<text x="145.0" y="378.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">7 · Hết hiệu lực</text>
<text x="145.0" y="397.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">acceptance bên kia mức → mức</text>
<text x="145.0" y="411.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">không còn là reference cũ</text>
<text x="145.0" y="434.0" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">suy luận: từ acceptance</text>
<rect x="141.0" y="196.8" width="210.0" height="84.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
<text x="246.0" y="216.8" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="middle">8 · Bổ sung (replenish)</text>
<text x="246.0" y="235.8" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">stop mới đặt ngay ngoài cực trị</text>
<text x="246.0" y="249.8" font-size="10.2" font-weight="400" fill="#374151" text-anchor="middle">vừa tạo (đỉnh/đáy của cú sweep)</text>
<text x="246.0" y="272.8" font-size="9.8" font-weight="600" fill="#334155" text-anchor="middle">suy luận: từ cực trị mới</text>
<circle cx="490.0" cy="400.0" r="92" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.6"/>
<text x="490.0" y="366.0" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">MỨC GIÁ L</text>
<text x="490.0" y="385.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="middle">đỉnh/đáy cũ, PDH/PDL,</text>
<text x="490.0" y="404.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="middle">equal highs/lows…</text>
<text x="490.0" y="423.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="middle">mức ≠ lệnh</text>
<rect x="40.0" y="688.0" width="900.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="56.0" y="707.0" font-size="10.4" font-weight="700" fill="#1F2937" text-anchor="start">Hệ quả:</text>
<text x="56.0" y="722.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">"pool đã bị lấy" là trạng thái của LỆNH (không thấy) — trên chart ta chỉ thấy MỨC đã bị vượt. Pool có thể bị lấy một phần, rồi được bổ sung ngay bên ngoài cực trị mới.</text>
</svg>