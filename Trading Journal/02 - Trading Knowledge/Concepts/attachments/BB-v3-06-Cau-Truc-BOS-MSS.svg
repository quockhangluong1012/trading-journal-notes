<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="578.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cấu trúc thị trường: bậc thang đi lên, bậc thang đi xuống, và hai kiểu “phá”</text>
<rect x="889.7" y="23.0" width="82.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="930.8" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">NỀN TẢNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">HH = đỉnh cao hơn, HL = đáy cao hơn, LH = đỉnh thấp hơn, LL = đáy thấp hơn. BOS = phá THEO hướng đang đi. MSS = phá NGƯỢC hướng đang đi.</text>
<rect x="28.0" y="94.5" width="460.0" height="420.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="13.5" font-weight="700" fill="#0E9F6E" data-bx="41.0,477.0">BOS — đi tiếp con đường cũ</text>
<polyline points="64.8,402.5 140.4,306.5 190.8,354.5 274.8,246.5 325.2,294.5 426.0,168.5" fill="none" stroke="#0E9F6E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.8" cy="402.5" r="3.5" fill="#0E9F6E"/>
<text x="64.8" y="418.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đáy</text>
<circle cx="140.4" cy="306.5" r="3.5" fill="#0E9F6E"/>
<text x="140.4" y="297.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HH</text>
<circle cx="190.8" cy="354.5" r="3.5" fill="#0E9F6E"/>
<text x="190.8" y="370.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HL</text>
<circle cx="274.8" cy="246.5" r="3.5" fill="#0E9F6E"/>
<text x="274.8" y="237.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HH</text>
<circle cx="325.2" cy="294.5" r="3.5" fill="#0E9F6E"/>
<text x="325.2" y="310.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HL</text>
<circle cx="426.0" cy="168.5" r="3.5" fill="#0E9F6E"/>
<text x="426.0" y="159.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HH</text>
<line x1="140.4" y1="306.5" x2="240.8" y2="306.5" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<rect x="182.4" y="282.5" width="38.6" height="19.5" rx="9.75" fill="#0E9F6E" fill-opacity="0.12" stroke="#0E9F6E" stroke-width="1"/>
<text x="201.7" y="294.2" font-size="10.5" font-weight="700" fill="#0E9F6E" text-anchor="middle">BOS</text>
<line x1="274.8" y1="246.5" x2="392.0" y2="246.5" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<rect x="316.8" y="222.5" width="38.6" height="19.5" rx="9.75" fill="#0E9F6E" fill-opacity="0.12" stroke="#0E9F6E" stroke-width="1"/>
<text x="336.1" y="234.2" font-size="10.5" font-weight="700" fill="#0E9F6E" text-anchor="middle">BOS</text>
<text x="42.0" y="466.5" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,475.0">Mỗi lần giá vượt đỉnh cũ theo hướng đang đi, cấu trúc tăng được “gia hạn”.</text>
<text x="42.0" y="483.5" font-size="12" font-weight="400" fill="#6B7280" data-bx="41.0,475.0">Trẻ con: leo thêm một bậc thang.</text>
<rect x="512.0" y="94.5" width="460.0" height="420.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="120.0" font-size="13.5" font-weight="700" fill="#E5484D" data-bx="525.0,961.0">MSS — bậc thang bị gãy</text>
<polyline points="548.8,384.5 624.4,276.5 674.8,324.5 758.8,192.5 809.2,258.5" fill="none" stroke="#0E9F6E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
