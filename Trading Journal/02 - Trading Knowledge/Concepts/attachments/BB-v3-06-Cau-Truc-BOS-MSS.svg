<text x="548.8" y="400.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đáy</text>
<circle cx="624.4" cy="276.5" r="3.5" fill="#475569"/>
<text x="624.4" y="267.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HH</text>
<circle cx="674.8" cy="324.5" r="3.5" fill="#475569"/>
<text x="674.8" y="340.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HL</text>
<circle cx="758.8" cy="192.5" r="3.5" fill="#475569"/>
<text x="758.8" y="183.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HH</text>
<circle cx="809.2" cy="258.5" r="3.5" fill="#475569"/>
<text x="809.2" y="274.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">HL gần nhất</text>
<circle cx="851.2" cy="222.5" r="3.5" fill="#475569"/>
<text x="851.2" y="213.5" font-size="11" font-weight="700" fill="#111827" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">LH</text>
<circle cx="926.8" cy="354.5" r="3.5" fill="#475569"/>
<line x1="809.2" y1="258.5" x2="932.8" y2="258.5" stroke="#E5484D" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5,4"/>
<rect x="881.2" y="264.5" width="40.2" height="19.5" rx="9.75" fill="#E5484D" fill-opacity="0.12" stroke="#E5484D" stroke-width="1"/>
<text x="901.3" y="276.2" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="middle">MSS</text>
<text x="526.0" y="466.5" font-size="12" font-weight="400" fill="#6B7280" data-bx="525.0,959.0">Giá không lập đỉnh cao hơn nữa (LH), rồi đóng cửa DƯỚI đáy cao hơn gần</text>
<text x="526.0" y="483.5" font-size="12" font-weight="400" fill="#6B7280" data-bx="525.0,959.0">nhất. Chuỗi “đỉnh cao hơn, đáy cao hơn” đã gãy.</text>
<text x="28.0" y="547.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Liên hệ Breaker: sự kiện “đóng nến qua đỉnh giữa / đáy giữa” chính là một MSS trên khung đang xét. Gọi nó là BOS hay MSS tuỳ bạn đang so với xu hướng nào</text>
<text x="28.0" y="564.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">(§15).</text>
