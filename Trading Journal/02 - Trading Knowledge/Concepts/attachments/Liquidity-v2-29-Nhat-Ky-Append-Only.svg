<rect x="24.0" y="394.0" width="440.0" height="119.7" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="33.0" y="413.3" font-size="11.3" fill="#B91C1C" font-weight="700" text-anchor="start">Năm kiểu hindsight phổ biến</text>
<text x="33.0" y="430.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Kéo lại mức cho &quot;vừa&quot; cực trị sweep</text>
<text x="33.0" y="445.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Xóa dòng PROJECTED khi DOL sai</text>
<text x="33.0" y="460.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Đổi ε/δ/k sau khi thấy kết quả</text>
<text x="33.0" y="475.4" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Không ghi mức không bị chạm (mất mẫu số)</text>
<text x="33.0" y="490.3" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Ghi known_at = lúc wick chạm (sai: nhãn chỉ</text>
<text x="33.0" y="505.2" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">  có ở close nến phân xử)</text>
<rect x="476.0" y="394.0" width="440.0" height="119.7" rx="7" fill="#ECFDF3" stroke="#15803D" stroke-width="1.2"/>
<text x="485.0" y="413.3" font-size="11.3" fill="#15803D" font-weight="700" text-anchor="start">Cách chặn</text>
<text x="485.0" y="430.7" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Chụp màn hình danh sách mức có giờ trước phiên</text>
<text x="485.0" y="445.6" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Tham số khai báo ở đầu file backtest (v0.1)</text>
<text x="485.0" y="460.5" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Swing chỉ dùng sau khi đã xác nhận (N nến)</text>
<text x="485.0" y="475.4" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Sự kiện mơ hồ → ghi &quot;EXP/UND&quot;, không bỏ</text>
<text x="485.0" y="490.3" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Đổi định nghĩa → version mới + changelog</text>
<text x="485.0" y="505.2" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="start">• Review ở file riêng, không sửa log gốc</text>
<text x="24.0" y="534.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-29 · Giá trong bảng là giả định để minh họa định dạng, không phải giao dịch thật.</text>
