<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Một dòng đã ghi thì không sửa. Thông tin mới = dòng mới. Mức không bị chạm và sự kiện thất bại cũng là dữ liệu.</text>
