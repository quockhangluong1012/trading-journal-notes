<text x="702.0" y="154.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đổi lên → xuống ở nến #11, rồi xuống → lên ở</text>
<text x="702.0" y="171.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nến #14. Hai lần đổi trạng thái chỉ trong vài</text>
<text x="702.0" y="188.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nến.</text>
<rect x="690.0" y="213.6" width="282.0" height="95.6" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.3"/>
<text x="702.0" y="237.9" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start">Structure</text>
<text x="702.0" y="260.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không đổi: đáy #12 vẫn cao hơn đáy #4, đỉnh</text>
<text x="702.0" y="276.9" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">#15 cao hơn đỉnh #9. Đoạn giảm chỉ là một</text>
<text x="702.0" y="293.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nhịp điều chỉnh (pullback).</text>
<rect x="690.0" y="319.1" width="282.0" height="95.6" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="702.0" y="343.5" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Bài học</text>
<text x="702.0" y="365.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bearish CISD ở đây KHÔNG có nghĩa là xu</text>
<text x="702.0" y="382.5" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hướng đã quay đầu. Nó chỉ nói: chặng lên</text>
<text x="702.0" y="399.3" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ngắn gần nhất đã bị lấy lại.</text>
