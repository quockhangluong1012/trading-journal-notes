<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Delivery có thể đổi chiều trong khi cấu trúc KHÔNG đổi</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trong một xu hướng tăng, giá đóng cửa dưới open đầu chặng lên gần nhất (bearish CISD) — delivery ngắn hạn đổi sang xuống. Nhưng</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">đáy quan trọng (HL) không bị phá, nên cấu trúc vẫn tăng. Rồi một bullish CISD đưa giá đi tiếp.</text>
<rect x="804.9" y="22" width="167.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="888.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DELIVERY ≠ STRUCTURE</text>
<text x="28.0" y="548.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
