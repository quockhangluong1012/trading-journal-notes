<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="875.1" y="22" width="96.9" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="923.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">TRẠNG THÁI</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Năm trạng thái — năm câu hỏi khác nhau, đừng trộn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một BPR có thể vừa hợp lệ, vừa đã bị chạm, vừa không còn liên quan. Mỗi trạng thái trả lời một câu hỏi riêng.</text>
<rect x="28.0" y="86.0" width="180.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
<rect x="28.0" y="86.0" width="180.0" height="50.0" rx="10" fill="#1F2937"/>
<rect x="28.0" y="116.0" width="180.0" height="20.0" rx="0" fill="#1F2937"/>
<text x="118.0" y="108.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">VALID</text>
<text x="118.0" y="127.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hợp lệ</text>
<text x="38.0" y="160.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Có đúng là BPR theo định</text>
<text x="38.0" y="176.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">nghĩa không?</text>
<text x="38.0" y="200.6" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Hai FVG ngược chiều, cùng</text>
<text x="38.0" y="216.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">khung, chồng nhau thật (4</text>
<text x="38.0" y="231.5" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">mức giá).</text>
<rect x="218.0" y="86.0" width="180.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
<rect x="218.0" y="86.0" width="180.0" height="50.0" rx="10" fill="#0E7490"/>
<rect x="218.0" y="116.0" width="180.0" height="20.0" rx="0" fill="#0E7490"/>
<text x="308.0" y="108.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">FRESH</text>
<text x="308.0" y="127.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Còn mới</text>
<text x="228.0" y="160.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Từ lúc hình thành, giá đã</text>
<text x="228.0" y="176.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">quay lại vùng chưa?</text>
<text x="228.0" y="200.6" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Chưa chạm = fresh. Đã chạm</text>
<text x="228.0" y="216.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">= không còn fresh (nhưng</text>
<text x="228.0" y="231.5" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">chưa chắc vô dụng).</text>
<rect x="408.0" y="86.0" width="180.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="408.0" y="86.0" width="180.0" height="50.0" rx="10" fill="#7C3AED"/>
<rect x="408.0" y="116.0" width="180.0" height="20.0" rx="0" fill="#7C3AED"/>
<text x="498.0" y="108.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">RELEVANT</text>
<text x="498.0" y="127.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Còn liên quan</text>
<text x="418.0" y="160.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Vùng này có nằm trong câu</text>
<text x="418.0" y="176.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">chuyện D1/H1 hiện tại</text>
<text x="418.0" y="192.6" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">không?</text>
<text x="418.0" y="216.9" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Đúng phía DOL, đúng</text>
<text x="418.0" y="232.3" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">premium/discount, chưa bị sự</text>
<text x="418.0" y="247.8" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">kiện lớn hơn làm lu mờ.</text>
<rect x="598.0" y="86.0" width="180.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="598.0" y="86.0" width="180.0" height="50.0" rx="10" fill="#B45309"/>
<rect x="598.0" y="116.0" width="180.0" height="20.0" rx="0" fill="#B45309"/>
<text x="688.0" y="108.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">MITIGATED</text>
<text x="688.0" y="127.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Đã bị chạm</text>
<text x="608.0" y="160.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Giá đã vào vùng sâu tới</text>
<text x="608.0" y="176.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">đâu?</text>
<text x="608.0" y="200.6" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Chạm mép gần · tới giữa · tới</text>
<text x="608.0" y="216.0" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">mép xa. Ghi độ sâu, đừng chỉ</text>
<text x="608.0" y="231.5" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">ghi “có/không”.</text>
<rect x="788.0" y="86.0" width="180.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="788.0" y="86.0" width="180.0" height="50.0" rx="10" fill="#B91C1C"/>
<rect x="788.0" y="116.0" width="180.0" height="20.0" rx="0" fill="#B91C1C"/>
<text x="878.0" y="108.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">INVALIDATED</text>
<text x="878.0" y="127.0" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mất vai trò</text>
<text x="798.0" y="160.0" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Giá đã đóng nến vượt mép</text>
<text x="798.0" y="176.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">xa VÀ đứng được ở đó</text>
<text x="798.0" y="192.6" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">chưa?</text>
<text x="798.0" y="216.9" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">Theo quy tắc chấp nhận của</text>
<text x="798.0" y="232.3" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">bạn. Một bóng nến chọc qua</text>
<text x="798.0" y="247.8" font-size="11.2" font-weight="400" fill="#6B7280" text-anchor="start">chưa đủ.</text>
<rect x="28.0" y="430.0" width="944.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="40.0" y="454.5" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Ví dụ kết hợp</text>
<text x="40.0" y="474.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“BPR H1 này VALID, không còn FRESH (đã chạm một lần tới giữa), vẫn RELEVANT (đúng phía DOL), MITIGATED một phần, chưa INVALIDATED.” — câu mô tả kiểu này cho</text>
<text x="40.0" y="490.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">backtest nhiều thông tin hơn hẳn chữ “BPR đẹp”.</text>
<text x="28.0" y="540.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Quy tắc chấp nhận (đóng nến + giữ vài nến) là lựa chọn của bạn. Ghi rõ trong journal để mọi mẫu dùng cùng một chuẩn.</text>
</svg>
