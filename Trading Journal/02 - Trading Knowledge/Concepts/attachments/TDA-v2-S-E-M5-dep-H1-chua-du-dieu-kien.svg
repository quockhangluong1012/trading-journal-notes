<text x="667.0" y="546.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Coi lệnh thắng ngẫu nhiên từ setup này là</text>
<text x="667.0" y="561.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">bằng chứng quy trình sai</text>
