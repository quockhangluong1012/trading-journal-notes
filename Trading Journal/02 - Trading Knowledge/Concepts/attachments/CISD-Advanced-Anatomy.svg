<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs><marker id="caa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Giải phẫu một CISD bullish hợp lệ</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Chuỗi nến đỏ sweep SSL → nến xanh đóng BODY qua OPEN nến đỏ đầu → delivery lật buy-side → FVG làm entry</text>
  <rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- CISD level -->
  <line x1="150" y1="150" x2="700" y2="150" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="470" y="143" font-size="11" font-weight="700" fill="#0284C7">CISD level = OPEN nến đỏ ĐẦU chuỗi</text>

  <!-- SSL sweep level -->
  <line x1="60" y1="392" x2="330" y2="392" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="66" y="386" font-size="10.5" fill="#B45309">SSL (đáy nhỏ / equal lows)</text>

  <!-- red delivery leg (down) -->
  <rect x="150" y="150" width="2" height="60" fill="#DC2626"/><rect x="142" y="150" width="16" height="52" fill="#DC2626" rx="1"/>
  <rect x="184" y="196" width="2" height="70" fill="#DC2626"/><rect x="176" y="200" width="16" height="60" fill="#DC2626" rx="1"/>
  <rect x="218" y="250" width="2" height="80" fill="#DC2626"/><rect x="210" y="256" width="16" height="66" fill="#DC2626" rx="1"/>
  <rect x="252" y="300" width="2" height="98" fill="#DC2626"/><rect x="244" y="306" width="16" height="78" fill="#DC2626" rx="1"/>
  <text x="150" y="230" font-size="10.5" font-weight="700" fill="#B91C1C">① Chuỗi giao hàng (delivery leg) bán</text>
  <circle cx="253" cy="398" r="7" fill="none" stroke="#B45309" stroke-width="2.4"/>
  <text x="150" y="420" font-size="10.5" font-weight="700" fill="#B45309">② Sweep SSL + rejection (wick từ chối)</text>

  <!-- green candle closing through CISD level -->
  <rect x="300" y="120" width="2" height="290" fill="#16A34A"/><rect x="292" y="140" width="16" height="250" fill="#16A34A" rx="1"/>
  <text x="318" y="132" font-size="10.5" font-weight="700" fill="#15803D">③ Nến xanh ĐÓNG BODY qua CISD level = state lật</text>

  <!-- FVG box -->
  <rect x="330" y="150" width="70" height="60" fill="#3B82F6" opacity="0.2"/>
  <text x="404" y="185" font-size="10.5" font-weight="700" fill="#1D4ED8">④ FVG do displacement để lại = vùng entry</text>

  <!-- retrace + continuation -->
  <path d="M312,150 L340,178 L366,205" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#caa)"/>
  <circle cx="366" cy="200" r="6" fill="#16A34A"/>
  <text x="376" y="230" font-size="10" font-weight="700" fill="#15803D">Entry (retrace về FVG / 50% CE)</text>
  <path d="M366,205 L430,150 L520,105 L620,92" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="470" y="86" font-size="10.5" font-weight="700" fill="#15803D">⑤ Delivery mua về BSL (draw on liquidity)</text>

  <text x="40" y="440" font-size="10.5" fill="#6B7280">CISD KHÔNG phải lý do đảo chiều — nó là bằng chứng rằng lý do đảo chiều (sweep + POI) đã hoàn tất.</text>
</svg>
