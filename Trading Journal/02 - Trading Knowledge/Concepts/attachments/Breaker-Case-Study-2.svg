<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1250" height="750" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study — ES Short thứ Tư 10/09, FOMC 14:00 EST: Breaker giả trong tin, -1.2R</text>
  <text x="40" y="63" font-size="15" fill="#94a3b8">Sweep + MSS thỏa mọi tiêu chí trên chart — nhưng xảy ra trong 90 giây quanh FOMC, không có "hàng kẹt" thật đứng sau</text>

  <!-- price levels -->
  <text x="1120" y="150" font-size="9.0" fill="#94a3b8">4,512 High2 (sweep)</text>
  <text x="1120" y="230" font-size="9.0" fill="#94a3b8" textLength="74" lengthAdjust="spacingAndGlyphs">4,498 High1 (OB gốc)</text>
  <text x="1120" y="380" font-size="9.5" fill="#94a3b8">4,465 entry retest</text>
  <text x="1120" y="440" font-size="13" fill="#94a3b8">4,478 stop</text>
  <text x="1120" y="560" font-size="9.0" fill="#94a3b8">4,420 target SSL (không đạt)</text>

  <line x1="70" y1="150" x2="1080" y2="150" stroke="#1c2333"/>
  <line x1="70" y1="560" x2="1080" y2="560" stroke="#1c2333"/>

  <!-- candles: rally into High1 forming OB (up candles = OB base) -->
  <rect x="90" y="260" width="16" height="40" fill="#22c55e"/><line x1="98" y1="250" x2="98" y2="310" stroke="#22c55e" stroke-width="2"/>
  <rect x="120" y="240" width="16" height="35" fill="#22c55e"/><line x1="128" y1="230" x2="128" y2="285" stroke="#22c55e" stroke-width="2"/>
  <!-- OB candle: up-close last before spike -->
  <rect x="150" y="220" width="18" height="25" fill="#22c55e" stroke="#38bdf8" stroke-width="2"/><line x1="159" y1="210" x2="159" y2="255" stroke="#22c55e" stroke-width="2"/>
  <text x="145" y="205" font-size="12" fill="#38bdf8" font-weight="bold">OB (nến tăng cuối)</text>

  <!-- news spike: sweep above High1 within 1-3 M1 candles -->
  <rect x="180" y="145" width="18" height="55" fill="#22c55e"/><line x1="189" y1="135" x2="189" y2="215" stroke="#22c55e" stroke-width="2"/>
  <text x="175" y="120" font-size="12" fill="#f97316" font-weight="bold">FOMC 14:00 — spread giãn, quote rút</text>
  <!-- MSS spike down within same news window -->
  <rect x="210" y="200" width="18" height="90" fill="#ef4444"/><line x1="219" y1="190" x2="219" y2="305" stroke="#ef4444" stroke-width="2"/>
  <text x="235" y="260" font-size="12" fill="#f97316">"MSS" trong 90 giây</text>
  <text x="235" y="278" font-size="12" fill="#f97316">quanh tin — chân không thanh khoản</text>

  <!-- breaker zone (fail) -->
  <rect x="60" y="220" width="1000" height="30" fill="#ef4444" opacity="0.15"/>
  <text x="900" y="217" font-size="12" fill="#94a3b8">Vùng "breaker" bị gán nhãn (thực ra không có ai kẹt)</text>

  <!-- retest -->
  <rect x="300" y="230" width="18" height="30" fill="#22c55e"/><line x1="309" y1="220" x2="309" y2="270" stroke="#22c55e" stroke-width="2"/>
  <circle cx="309" cy="240" r="6" fill="#38bdf8"/>
  <text x="270" y="205" font-size="12" fill="#38bdf8" font-weight="bold">Entry Short 4,465 (retest)</text>

  <!-- stop hit -->
  <line x1="60" y1="245" x2="1060" y2="245" stroke="#ef4444" stroke-dasharray="6,4"/>
  <text x="900" y="242" font-size="11" fill="#ef4444">Stop 4,478</text>

  <!-- price reverses back up through stop (spread already normalized) -->
  <rect x="335" y="200" width="18" height="35" fill="#22c55e"/><line x1="344" y1="190" x2="344" y2="245" stroke="#22c55e" stroke-width="2"/>
  <rect x="370" y="165" width="18" height="40" fill="#22c55e"/><line x1="379" y1="155" x2="379" y2="215" stroke="#22c55e" stroke-width="2"/>
  <text x="335" y="150" font-size="12" fill="#ef4444" font-weight="bold">Giá quay lại xuyên stop — "acceptance"</text>
  <text x="335" y="166" font-size="12" fill="#ef4444" font-weight="bold">giả trong tin không giữ được</text>

  <rect x="30" y="600" width="1140" height="130" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="55" y="628" font-size="16" fill="#e2e8f0" font-weight="bold">Bài học cơ chế</text>
  <text x="55" y="652" font-size="13" fill="#94a3b8">Sweep (High2 &gt; High1) và MSS (phá xuống) đều xảy ra trong ~90 giây quanh FOMC — lúc order book gần trống, spread ES giãn 3-6 ticks.</text>
  <text x="55" y="672" font-size="13" fill="#94a3b8">Không có vị thế thật bị kẹt ở bước sweep — "breaker" không có ai bảo vệ. Khi spread co lại sau tin, giá đơn giản quay về hướng cũ.</text>
  <text x="55" y="692" font-size="13" fill="#94a3b8">Kết quả: entry 4,465, stop 4,478 (13 points × 20 USD = 260 USD/contract risk), quét stop trong vòng 12 phút → <tspan fill="#ef4444" font-weight="bold">-1.2R</tspan>.</text>
  <text x="55" y="712" font-size="13" fill="#a78bfa" font-weight="bold">Quy tắc rút ra: chuỗi sweep→MSS phải trải ra nhiều nến có đấu giá thật; loại bỏ chuỗi nằm gọn trong ±3 phút quanh high-impact news.</text>
</svg>