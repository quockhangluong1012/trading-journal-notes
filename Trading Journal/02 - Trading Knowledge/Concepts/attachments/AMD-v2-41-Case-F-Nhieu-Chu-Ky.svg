<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case F — Hai chu kỳ AMD trong cùng một ngày</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Chu kỳ London (bullish) chạm đích PDH → đích cũ đã được giao. Giá tích lũy lại, lệch LÊN quét đỉnh mới, rồi chạy xuống. Cùng một ngày,</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">hai AMD ngược chiều — không mâu thuẫn, vì đích đã đổi.</text>
