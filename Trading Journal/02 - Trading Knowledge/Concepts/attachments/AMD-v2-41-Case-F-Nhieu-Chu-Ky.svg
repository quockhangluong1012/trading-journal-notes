<text x="720.0" y="476.0" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">New York</text>
<rect x="28.0" y="498.0" width="306.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="522.0" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">Chu kỳ 1 (London)</text>
<text x="42.0" y="554.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Bullish AMD hướng về PDH. Kết thúc khi PDH bị</text>
<text x="42.0" y="570.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">lấy → đích ĐÃ GIAO.</text>
<rect x="346.0" y="498.0" width="306.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="360.0" y="522.0" font-size="13.5" font-weight="700" fill="#64748B" text-anchor="start">Khoảng nghỉ</text>
<text x="360.0" y="554.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá đi ngang dưới/trên PDH = ứng viên A2. Câu</text>
<text x="360.0" y="570.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">hỏi đổi: “đích MỚI ở đâu?” — pool chưa bị lấy</text>
<text x="360.0" y="586.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">gần nhất ở phía dưới.</text>
<rect x="664.0" y="498.0" width="306.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="678.0" y="522.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">Chu kỳ 2 (New York)</text>
<text x="678.0" y="554.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Lệch lên quét đỉnh A2 (ngược đích mới), reclaim,</text>
<text x="678.0" y="570.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">MSS xuống → bearish AMD về đáy range Á.</text>
<rect x="28.0" y="622.0" width="944.0" height="48.6" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="1"/>
<text x="38.0" y="644.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bài học: đừng mang câu chuyện của chu kỳ 1 sang chu kỳ 2. Người “vẫn bullish vì sáng nay bullish” sẽ mua đúng cú lệch của chu kỳ NY. Mỗi lần đích được giao,</text>
<text x="38.0" y="660.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">quy trình bắt đầu lại từ bước 1.</text>
