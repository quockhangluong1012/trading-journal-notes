<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Reversal MSS — 'đảo chiều' là giả thuyết được CỦNG CỐ DẦN, không phải sự kiện một nến</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">MSS chỉ cho biết: trạng thái giảm ở LỚP ĐÓ đã bị phá. Mỗi giai đoạn sau thêm bằng chứng (và thêm độ trễ). Không giai đoạn nào 'chứng minh' đảo chiều.</text>
