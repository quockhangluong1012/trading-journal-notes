<rect x="26.0" y="556.0" width="928.0" height="68.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="42.0" y="577.0" font-size="10.2" font-weight="700" fill="#6D28D9" text-anchor="start">Không dùng hindsight: tại giai đoạn 2 trader KHÔNG thấy giai đoạn 4–7. Mọi 'ví dụ đảo chiều đẹp' đều được chọn sau khi biết giai đoạn 7.</text>
<text x="42.0" y="594.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Câu hỏi đúng tại mỗi giai đoạn: 'bằng chứng MỚI là gì, và nó đổi xác suất bao nhiêu so với baseline cùng khoảng cách?' (MSS-Sim-04/05).</text>
