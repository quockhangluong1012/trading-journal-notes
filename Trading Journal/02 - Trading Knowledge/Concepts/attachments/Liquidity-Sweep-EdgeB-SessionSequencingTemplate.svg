<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="718" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">Template Asia high → London sweep → NY reversal</text>
  <text x="32" y="66" font-size="15" fill="#787b86">EURUSD — thống kê tần suất template trên 6 tháng backtest (N=126 ngày giao dịch)</text>

  <text x="90" y="640" font-size="13" fill="#ff9800">Asia 02:00-08:00</text>
  <text x="380" y="640" font-size="13" fill="#ff9800">London 08:00-11:00</text>
  <text x="700" y="640" font-size="13" fill="#ff9800">NY 13:30-16:00</text>

  <!-- Asia range -->
  <rect x="80" y="400" width="220" height="60" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <text x="86" y="392" font-size="13" fill="#4a90d9">Asia range 1.0865-1.0885</text>

  <g>
    <rect x="110" y="410" width="18" height="30" fill="#26a69a" rx="1"/><line x1="119" y1="400" x2="119" y2="450" stroke="#26a69a"/>
    <rect x="150" y="405" width="18" height="35" fill="#26a69a" rx="1"/><line x1="159" y1="395" x2="159" y2="445" stroke="#26a69a"/>
    <rect x="190" y="415" width="18" height="25" fill="#ef5350" rx="1"/><line x1="199" y1="405" x2="199" y2="440" stroke="#ef5350"/>
  </g>
  <line x1="80" y1="400" x2="1180" y2="400" stroke="#b48ead" stroke-dasharray="4 3"/>
  <text x="1080" y="394" font-size="12" fill="#b48ead">Asia High 1.0885</text>

  <!-- London sweep -->
  <g>
    <rect x="400" y="330" width="20" height="70" fill="#26a69a" rx="1"/><line x1="410" y1="300" x2="410" y2="420" stroke="#26a69a" stroke-width="2"/>
  </g>
  <text x="360" y="290" font-size="13" fill="#f2c94c">London wick vuot Asia High → 1.0901</text>

  <g>
    <rect x="440" y="360" width="18" height="40" fill="#ef5350" rx="1"/><line x1="449" y1="345" x2="449" y2="420" stroke="#ef5350"/>
    <rect x="480" y="390" width="18" height="50" fill="#ef5350" rx="1"/><line x1="489" y1="375" x2="489" y2="460" stroke="#ef5350"/>
  </g>

  <!-- NY reversal continuation -->
  <g>
    <rect x="700" y="420" width="18" height="50" fill="#ef5350" rx="1"/><line x1="709" y1="405" x2="709" y2="490" stroke="#ef5350"/>
    <rect x="740" y="460" width="18" height="70" fill="#ef5350" rx="1"/><line x1="749" y1="445" x2="749" y2="550" stroke="#ef5350"/>
    <rect x="780" y="520" width="18" height="60" fill="#ef5350" rx="1"/><line x1="789" y1="505" x2="789" y2="600" stroke="#ef5350"/>
  </g>
  <text x="700" y="608" font-size="13" fill="#ef5350">NY tiep dien giam manh — target Asia Low</text>

  <!-- stats box -->
  <rect x="900" y="150" width="330" height="230" fill="#1c2030" stroke="#f2c94c" stroke-dasharray="6 4"/>
  <text x="916" y="178" font-size="15" font-weight="bold" fill="#f2c94c">Thong ke tan suat (N=126 ngay)</text>
  <text x="916" y="204" font-size="13" fill="#d1d4dc">Asia hinh thanh range ro ret: 88 ngay</text>
  <text x="916" y="224" font-size="13" fill="#d1d4dc">London sweep dung 1 canh Asia: 61 ngay</text>
  <text x="916" y="244" font-size="13" fill="#d1d4dc">-&gt; NY dao chieu theo huong con lai: 39</text>
  <text x="916" y="264" font-size="13" fill="#d1d4dc">-&gt; NY tiep dien cung huong London: 22</text>
  <text x="916" y="290" font-size="13" fill="#f2c94c">Tan suat template day du (ca 3 buoc): 31%</text>
  <text x="916" y="312" font-size="13" fill="#f2c94c">tren tong so ngay co Asia range ro ret</text>
  <text x="916" y="338" font-size="13" fill="#ff6b6b">Tan suat template that bai (London sweep</text>
  <text x="916" y="358" font-size="13" fill="#ff6b6b">nhung NY khong dao chieu): 36%</text>

  <text x="60" y="694" font-size="13" fill="#565b66">31% không phải "chắc thắng" — đây là base-rate để tính position size kỳ vọng, không phải tín hiệu độc lập đủ để vào lệnh mù.</text>
</svg>
