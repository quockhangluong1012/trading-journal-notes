<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">MEHR — so win rate với martingale của chính bracket đó</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Win rate đơn lẻ vô nghĩa nếu không biết R:R. MEHR = win rate − r/(r+g). Dưới martingale E[MEHR] = 0 với mọi bracket.</text>
  <rect x="26.0" y="84.0" width="600.0" height="430.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="80.0" y1="414.0" x2="610.0" y2="414.0" stroke="#E5E7EB" stroke-width="1"/>
  <text x="72.0" y="418.0" font-size="10" fill="#6B7280" text-anchor="end">0%</text>
  <line x1="80.0" y1="341.5" x2="610.0" y2="341.5" stroke="#E5E7EB" stroke-width="1"/>
  <text x="72.0" y="345.5" font-size="10" fill="#6B7280" text-anchor="end">20%</text>
  <line x1="80.0" y1="269.0" x2="610.0" y2="269.0" stroke="#E5E7EB" stroke-width="1"/>
  <text x="72.0" y="273.0" font-size="10" fill="#6B7280" text-anchor="end">40%</text>
  <line x1="80.0" y1="196.5" x2="610.0" y2="196.5" stroke="#E5E7EB" stroke-width="1"/>
  <text x="72.0" y="200.5" font-size="10" fill="#6B7280" text-anchor="end">60%</text>
  <line x1="80.0" y1="124.0" x2="610.0" y2="124.0" stroke="#E5E7EB" stroke-width="1"/>
  <text x="72.0" y="128.0" font-size="10" fill="#6B7280" text-anchor="end">80%</text>
  <rect x="100.0" y="196.5" width="44.0" height="217.5" rx="3" fill="#1D4ED8"/>
  <rect x="148.0" y="172.3" width="44.0" height="241.7" rx="3" fill="#9CA3AF"/>
  <text x="122.0" y="190.5" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">60%</text>
  <text x="170.0" y="166.3" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">66.7%</text>
  <text x="146.0" y="432.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Win 60% · TP 0.5R</text>
  <text x="146.0" y="452.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">MEHR -6.7 pp</text>
  <text x="146.0" y="469.0" font-size="10.5" fill="#374151" text-anchor="middle">E[R] -0.10R</text>
  <rect x="230.0" y="250.9" width="44.0" height="163.1" rx="3" fill="#1D4ED8"/>
  <rect x="278.0" y="232.8" width="44.0" height="181.2" rx="3" fill="#9CA3AF"/>
  <text x="252.0" y="244.9" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">45%</text>
  <text x="300.0" y="226.8" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">50.0%</text>
  <text x="276.0" y="432.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Win 45% · TP 1R</text>
  <text x="276.0" y="452.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">MEHR -5.0 pp</text>
  <text x="276.0" y="469.0" font-size="10.5" fill="#374151" text-anchor="middle">E[R] -0.10R</text>
  <rect x="360.0" y="269.0" width="44.0" height="145.0" rx="3" fill="#1D4ED8"/>
  <rect x="408.0" y="293.2" width="44.0" height="120.8" rx="3" fill="#9CA3AF"/>
  <text x="382.0" y="263.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">40%</text>
  <text x="430.0" y="287.2" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">33.3%</text>
  <text x="406.0" y="432.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Win 40% · TP 2R</text>
  <text x="406.0" y="452.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">MEHR +6.7 pp</text>
  <text x="406.0" y="469.0" font-size="10.5" fill="#374151" text-anchor="middle">E[R] +0.20R</text>
  <rect x="490.0" y="305.2" width="44.0" height="108.8" rx="3" fill="#1D4ED8"/>
  <rect x="538.0" y="323.4" width="44.0" height="90.6" rx="3" fill="#9CA3AF"/>
  <text x="512.0" y="299.2" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">30%</text>
  <text x="560.0" y="317.4" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">25.0%</text>
  <text x="536.0" y="432.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">Win 30% · TP 3R</text>
  <text x="536.0" y="452.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">MEHR +5.0 pp</text>
  <text x="536.0" y="469.0" font-size="10.5" fill="#374151" text-anchor="middle">E[R] +0.20R</text>
  <rect x="90.0" y="100.0" width="12.0" height="12.0" rx="2" fill="#1D4ED8"/>
  <text x="108.0" y="110.0" font-size="10.5" fill="#374151">win rate quan sát</text>
  <rect x="240.0" y="100.0" width="12.0" height="12.0" rx="2" fill="#9CA3AF"/>
  <text x="258.0" y="110.0" font-size="10.5" fill="#374151">p_bracket = r/(r+g) — win rate của ngẫu nhiên</text>
  <rect x="642.0" y="84.0" width="312.0" height="430.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="654.0" y="106.0" font-size="13" font-weight="700" fill="#7C3AED">Công thức</text>
  <text x="658.0" y="148.0" font-size="11.5" font-weight="700" fill="#1F2937">MEHR = y_hit − r / (r + g)</text>
  <text x="658.0" y="170.0" font-size="11.5" font-weight="700" fill="#1F2937">E[R] = MEHR × (r + g) / r</text>
  <text x="658.0" y="202.0" font-size="11" fill="#374151">r = rủi ro, g = phần thưởng (theo giá)</text>
  <text x="658.0" y="224.0" font-size="11" fill="#374151">y_hit = 1 nếu target chạm trước stop</text>
  <text x="658.0" y="256.0" font-size="11.5" font-weight="700" fill="#1F2937">Hệ thống win 60% với TP 0.5R</text>
  <text x="658.0" y="278.0" font-size="11" fill="#374151">tệ hơn ngẫu nhiên.</text>
  <text x="658.0" y="300.0" font-size="11.5" font-weight="700" fill="#1F2937">Hệ thống win 30% với TP 3R</text>
  <text x="658.0" y="322.0" font-size="11" fill="#374151">tốt hơn ngẫu nhiên.</text>
  <text x="658.0" y="354.0" font-size="11" fill="#374151">Dùng MEHR để so setup có R:R</text>
  <text x="658.0" y="376.0" font-size="11" fill="#374151">khác nhau trên cùng một thang.</text>
</svg>
