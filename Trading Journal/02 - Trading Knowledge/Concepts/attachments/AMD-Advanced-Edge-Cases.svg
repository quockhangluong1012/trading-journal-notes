<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="42" font-size="26" font-weight="bold" fill="#e2e8f0">Edge case đắt giá nhất: Double Judas &amp; Fractal AMD trong AMD</text>
  <text x="40" y="66" font-size="15" fill="#94a3b8">London raid → pop nhẹ → NY re-raid sâu hơn → distribution thật (NQ / EURUSD)</text>

  <!-- timeline -->
  <line x1="60" y1="700" x2="1150" y2="700" stroke="#334155" stroke-width="2"/>
  <text x="70" y="722" font-size="13" fill="#94a3b8">Asia</text>
  <text x="280" y="722" font-size="13" fill="#94a3b8">London 02:00–05:00 NY</text>
  <text x="640" y="722" font-size="13" fill="#94a3b8">NY AM 08:30–10:00</text>
  <text x="950" y="722" font-size="13" fill="#94a3b8">NY distribution</text>

  <!-- Daily open -->
  <line x1="60" y1="400" x2="1150" y2="400" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1070" y="393" font-size="14" fill="#eab308">Daily Open</text>

  <!-- PDL deep pool -->
  <line x1="60" y1="560" x2="1150" y2="560" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="70" y="553" font-size="13" fill="#ef4444">PDL / cụm SSL sâu (chưa bị quét)</text>

  <!-- Asia accumulation -->
  <g>
    <rect x="80" y="392" width="14" height="18" fill="#22c55e"/>
    <line x1="87" y1="384" x2="87" y2="418" stroke="#22c55e" stroke-width="2"/>
    <rect x="105" y="398" width="14" height="16" fill="#ef4444"/>
    <line x1="112" y1="390" x2="112" y2="422" stroke="#ef4444" stroke-width="2"/>
    <rect x="130" y="394" width="14" height="18" fill="#22c55e"/>
    <line x1="137" y1="386" x2="137" y2="420" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="80" y="440" font-size="13" fill="#94a3b8">Range Á hẹp quanh open</text>

  <!-- London Judas #1 down -->
  <g>
    <rect x="290" y="405" width="16" height="22" fill="#ef4444"/>
    <line x1="298" y1="397" x2="298" y2="440" stroke="#ef4444" stroke-width="2"/>
    <rect x="320" y="425" width="16" height="30" fill="#ef4444"/>
    <line x1="328" y1="417" x2="328" y2="465" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="285" y="480" font-size="13" fill="#f97316" font-weight="bold">Judas #1 (London)</text>
  <text x="285" y="497" font-size="12" fill="#94a3b8">trader vào Long ngay đây</text>
  <polygon points="336,455 350,450 350,462" fill="#f97316"/>

  <!-- pop back up -->
  <g>
    <rect x="380" y="380" width="16" height="20" fill="#22c55e"/>
    <line x1="388" y1="372" x2="388" y2="410" stroke="#22c55e" stroke-width="2"/>
    <rect x="410" y="360" width="16" height="20" fill="#22c55e"/>
    <line x1="418" y1="352" x2="418" y2="392" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="380" y="345" font-size="12" fill="#94a3b8">Pop nhẹ — trông giống reclaim</text>

  <!-- entry marker fail -->
  <circle cx="426" cy="368" r="6" fill="#38bdf8"/>
  <text x="436" y="365" font-size="12" fill="#38bdf8">Entry Long #1</text>

  <!-- NY re-raid deeper to PDL -->
  <g>
    <rect x="650" y="420" width="18" height="30" fill="#ef4444"/>
    <line x1="659" y1="410" x2="659" y2="460" stroke="#ef4444" stroke-width="2"/>
    <rect x="685" y="460" width="18" height="40" fill="#ef4444"/>
    <line x1="694" y1="450" x2="694" y2="510" stroke="#ef4444" stroke-width="2"/>
    <rect x="720" y="510" width="18" height="45" fill="#ef4444"/>
    <line x1="729" y1="500" x2="729" y2="565" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="650" y="595" font-size="13" fill="#ef4444" font-weight="bold">Judas #2 = NY re-raid</text>
  <text x="650" y="612" font-size="12" fill="#94a3b8">quét sạch PDL — Entry Long #1 bị stop</text>
  <polygon points="738,565 752,560 752,572" fill="#f97316"/>

  <!-- real distribution -->
  <g>
    <rect x="800" y="470" width="18" height="30" fill="#22c55e"/>
    <line x1="809" y1="458" x2="809" y2="510" stroke="#22c55e" stroke-width="2"/>
    <rect x="840" y="420" width="18" height="35" fill="#22c55e"/>
    <line x1="849" y1="408" x2="849" y2="465" stroke="#22c55e" stroke-width="2"/>
    <rect x="880" y="370" width="18" height="35" fill="#22c55e"/>
    <line x1="889" y1="358" x2="889" y2="415" stroke="#22c55e" stroke-width="2"/>
    <rect x="920" y="320" width="18" height="35" fill="#22c55e"/>
    <line x1="929" y1="308" x2="929" y2="365" stroke="#22c55e" stroke-width="2"/>
    <rect x="960" y="270" width="18" height="35" fill="#22c55e"/>
    <line x1="969" y1="258" x2="969" y2="315" stroke="#22c55e" stroke-width="2"/>
  </g>
  <circle cx="818" cy="490" r="6" fill="#38bdf8"/>
  <text x="800" y="240" font-size="13" fill="#22c55e" font-weight="bold">Distribution thật</text>
  <text x="800" y="257" font-size="12" fill="#94a3b8">chỉ chạy SAU khi PDL bị lấy</text>

  <rect x="990" y="200" width="150" height="55" fill="#eab308" opacity="0.15"/>
  <text x="1000" y="222" font-size="13" fill="#eab308">BSL target</text>
  <text x="1000" y="240" font-size="12" fill="#eab308">draw thật của ngày</text>

  <!-- lesson box -->
  <rect x="60" y="60" width="1090" height="0" fill="none"/>
  <rect x="700" y="60" width="440" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="715" y="85" font-size="14" fill="#e2e8f0" font-weight="bold">Bài học đo được</text>
  <text x="715" y="106" font-size="13" fill="#94a3b8">Đừng hỏi "Judas xong chưa?" — hỏi</text>
  <text x="715" y="124" font-size="13" fill="#94a3b8">"pool sâu nhất trong kịch bản đã bị</text>
  <text x="715" y="142" font-size="13" fill="#94a3b8">quét chưa?" Quy tắc 2 lần thử: fail</text>
  <text x="715" y="160" font-size="13" fill="#94a3b8">ở Judas #1 → chờ NY xác nhận re-raid.</text>
</svg>
