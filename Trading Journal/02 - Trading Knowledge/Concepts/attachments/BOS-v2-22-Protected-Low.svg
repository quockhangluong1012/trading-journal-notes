<svg viewBox="0 0 1000 540" width="1000" height="540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Protected low: &quot;chốt an toàn&quot; của cấu trúc tăng — và vì sao nó dời lên sau mỗi BOS</title>
<desc>Protected low: &quot;chốt an toàn&quot; của cấu trúc tăng — và vì sao nó dời lên sau mỗi BOS. Protected low = đáy đã tạo ra cú tăng phá đỉnh trước đó (BOS gần nhất). Thủng nó → lời giải thích &quot;cấu trúc đang tăng&quot; không còn đúng. Phá một đáy nhỏ phía trên nó thì chưa.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Protected low: &quot;chốt an toàn&quot; của cấu trúc tăng — và vì sao nó dời lên sau mỗi BOS</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Protected low = đáy đã tạo ra cú tăng phá đỉnh trước đó (BOS gần nhất). Thủng nó → lời giải thích &quot;cấu trúc đang tăng&quot; không còn đúng. Phá một đáy nhỏ</tspan></text>
<text x="24.0" y="72.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>phía trên nó thì chưa.</tspan></text>
<rect x="24.0" y="96.0" width="600.0" height="426.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<line x1="171.1" y1="387.8" x2="367.7" y2="387.8" stroke="#1D9E75" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="367.7" y="401.8" font-size="11" fill="#1D9E75" text-anchor="end"><tspan>protected (sau BOS 1)</tspan></text>
<line x1="345.8" y1="332.6" x2="608.0" y2="332.6" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="608.0" y="346.6" font-size="11" fill="#1D9E75" text-anchor="end"><tspan font-weight="700">protected (sau BOS 2)</tspan></text>
<line x1="121.9" y1="328.7" x2="220.2" y2="328.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="258.5" y1="261.7" x2="395.0" y2="261.7" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="460.5" y1="230.2" x2="520.6" y2="230.2" stroke="#2563EB" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
<polyline points="40.0,446.9 121.9,328.7 171.1,387.8 258.5,261.7 291.2,301.1 313.1,281.4 345.8,332.6 433.2,190.8 460.5,230.2 482.4,210.5 515.2,253.8" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="515.2,253.8 553.4,214.4 597.1,159.3" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<polyline points="515.2,253.8 547.9,301.1 580.7,356.3" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<circle cx="121.9" cy="328.7" r="3.6" fill="#2563EB"/>
<text x="121.9" y="319.7" font-size="11.5" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">HH</tspan></text>
<circle cx="171.1" cy="387.8" r="3.6" fill="#1D9E75"/>
<text x="171.1" y="406.3" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL1</tspan></text>
<circle cx="258.5" cy="261.7" r="3.6" fill="#2563EB"/>
<text x="258.5" y="252.7" font-size="11.5" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">HH</tspan></text>
<circle cx="345.8" cy="332.6" r="3.6" fill="#1D9E75"/>
<text x="345.8" y="351.1" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL2</tspan></text>
<circle cx="433.2" cy="190.8" r="3.6" fill="#2563EB"/>
<text x="433.2" y="181.8" font-size="11.5" fill="#2563EB" text-anchor="middle"><tspan font-weight="700">HH</tspan></text>
<rect x="142.5" y="303.2" width="46.2" height="19.0" rx="9.5" fill="#E8F6F0" stroke="#1D9E75" stroke-width="0.9"/>
<text x="165.6" y="316.3" font-size="10" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">BOS 1</tspan></text>
<rect x="300.9" y="236.2" width="46.2" height="19.0" rx="9.5" fill="#E8F6F0" stroke="#1D9E75" stroke-width="0.9"/>
<text x="324.0" y="249.3" font-size="10" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">BOS 2</tspan></text>
<circle cx="493.3" cy="230.2" r="4.5" fill="#2563EB"/>
<line x1="493.3" y1="230.2" x2="291.2" y2="135.7" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="291.2" y="113.7" font-size="11" fill="#2563EB" text-anchor="start"><tspan>phá đáy nhỏ (70) = internal,</tspan></text>
<text x="291.2" y="127.7" font-size="11" fill="#2563EB" text-anchor="start"><tspan>cấu trúc tăng CHƯA sai</tspan></text>
<text x="597.1" y="151.3" font-size="11" fill="#1D9E75" text-anchor="end"><tspan font-weight="700">giữ trên HL2</tspan></text>
<circle cx="564.3" cy="332.6" r="5" fill="#DC2626"/>
<text x="556.3" y="326.6" font-size="11.5" fill="#DC2626" text-anchor="end"><tspan font-weight="700">thủng HL2 → MSS ↓</tspan></text>
<line x1="400.5" y1="383.9" x2="400.5" y2="340.5" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_green)"/>
<text x="405.9" y="364.2" font-size="11" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">dời lên</tspan></text>
<rect x="640.0" y="96.0" width="336.0" height="118.0" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.0"/>
<rect x="640.0" y="96.0" width="5.0" height="118.0" rx="2" fill="#7C3AED"/>
<text x="654.0" y="116.0" font-size="13" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">Cho bé 5 tuổi</tspan></text>
<text x="654.0" y="135.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Bé leo núi có dây an toàn. Mỗi lần lên được chỗ cao hơn,</tspan></text>
<text x="654.0" y="151.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>bé đóng một cái chốt ở chỗ đứng vững gần nhất. Trượt</tspan></text>
<text x="654.0" y="167.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>chân nhỏ phía trên chốt thì chưa sao; tuột qua chốt thì</tspan></text>
<text x="654.0" y="183.6" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>chặng leo coi như hỏng.</tspan></text>
<rect x="640.0" y="226.0" width="336.0" height="96.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="640.0" y="226.0" width="5.0" height="96.0" rx="2" fill="#1D9E75"/>
<text x="654.0" y="246.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Vì sao đáy ĐÓ được bảo vệ?</tspan></text>
<text x="654.0" y="265.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Vì chính từ đáy đó giá đã đi lên và phá đỉnh trước</tspan></text>
<text x="654.0" y="281.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>(BOS). Nó là &quot;bằng chứng&quot; của cấu trúc tăng hiện tại.</tspan></text>
<rect x="640.0" y="334.0" width="336.0" height="96.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="640.0" y="334.0" width="5.0" height="96.0" rx="2" fill="#DC2626"/>
<text x="654.0" y="354.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Không được chọn sau khi biết kết quả</tspan></text>
<text x="654.0" y="373.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Protected low được xác định ngay khi BOS xảy ra, theo</tspan></text>
<text x="654.0" y="389.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>quy tắc đã khai báo — không phải chọn đáy nào &quot;đã giữ</tspan></text>
<text x="654.0" y="405.7" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>được&quot; sau khi thấy giá đi đâu.</tspan></text>
<rect x="640.0" y="442.0" width="336.0" height="80.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="640.0" y="442.0" width="5.0" height="80.0" rx="2" fill="#B45309"/>
<text x="654.0" y="462.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Khi nào mất ý nghĩa?</tspan></text>
<text x="654.0" y="481.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Khi một BOS mới dời nó lên mức cao hơn, hoặc khi nó đã</tspan></text>
<text x="654.0" y="497.8" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>bị thủng (cấu trúc đổi).</tspan></text>
</svg>
