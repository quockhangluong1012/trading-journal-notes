<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">&quot;Too many swings&quot;: funnel lọc swing</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Swing rất rẻ: random walk thuần túy đã cho ~35 fractal swing high (5-bar) mỗi 250 bar. Framework chỉ falsify được khi anchor là output của một</text>
  <text x="26.0" y="72.0" font-size="13" fill="#6B7280">hàm xác định.</text>
  <polygon points="40.0,105.0 560.0,105.0 526.0,175.0 74.0,175.0" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="300.0" y="133.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">DETECTION</text>
  <text x="300.0" y="152.0" font-size="10.8" fill="#1F2937" text-anchor="middle">mọi pivot (fractal / DC nhỏ)</text>
  <line x1="568.0" y1="140.0" x2="590.0" y2="140.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="598.0" y="144.0" font-size="11.2" fill="#374151">hàng chục / năm D1 — kể cả trong dữ liệu ngẫu nhiên</text>
  <polygon points="74.0,183.0 526.0,183.0 492.0,253.0 108.0,253.0" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="300.0" y="211.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">SCALE</text>
  <text x="300.0" y="230.0" font-size="10.8" fill="#1F2937" text-anchor="middle">θ* ≥ θ_min(TF)</text>
  <line x1="534.0" y1="218.0" x2="590.0" y2="218.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="598.0" y="222.0" font-size="11.2" fill="#374151">loại micro swing</text>
  <polygon points="108.0,261.0 492.0,261.0 458.0,331.0 142.0,331.0" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="300.0" y="289.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">CONSEQUENCE</text>
  <text x="300.0" y="308.0" font-size="10.8" fill="#1F2937" text-anchor="middle">origin của BOS/MSS, hoặc sweep có hệ quả</text>
  <line x1="500.0" y1="296.0" x2="590.0" y2="296.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="598.0" y="300.0" font-size="11.2" fill="#374151">loại swing &#x27;đẹp&#x27; nhưng vô hại</text>
  <polygon points="142.0,339.0 458.0,339.0 424.0,409.0 176.0,409.0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="300.0" y="367.0" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">ALIVE</text>
  <text x="300.0" y="386.0" font-size="10.8" fill="#1F2937" text-anchor="middle">chưa bị phá có acceptance</text>
  <line x1="466.0" y1="374.0" x2="590.0" y2="374.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="598.0" y="378.0" font-size="11.2" fill="#374151">loại swing đã spent</text>
  <polygon points="176.0,417.0 424.0,417.0 390.0,487.0 210.0,487.0" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="300.0" y="445.0" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">RELEVANT</text>
  <text x="300.0" y="464.0" font-size="10.8" fill="#1F2937" text-anchor="middle">trong vùng scale-matched quanh giá</text>
  <line x1="432.0" y1="452.0" x2="590.0" y2="452.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="598.0" y="456.0" font-size="11.2" fill="#374151">còn lại một nhúm — thường 2–4 mỗi phía</text>
  <rect x="26.0" y="501.0" width="928.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40.0" y="526.0" font-size="11.5" font-weight="700" fill="#1F2937">Số lượng ở mỗi tầng phải được ĐO trên dữ liệu của bạn. Còn quá nhiều → tham số quá lỏng; còn 0 → quá chặt.</text>
</svg>
