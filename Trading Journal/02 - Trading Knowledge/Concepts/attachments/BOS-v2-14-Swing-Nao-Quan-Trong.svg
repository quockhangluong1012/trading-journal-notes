<svg viewBox="0 0 1000 520" width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Swing nào quan trọng? Hậu quả cấu trúc quan trọng hơn hình dạng đẹp</title>
<desc>Swing nào quan trọng? Hậu quả cấu trúc quan trọng hơn hình dạng đẹp. Swing A trông &quot;đẹp&quot; nhưng không gây ra điều gì. Swing B trông &quot;xấu&quot; (râu dài, lộn xộn) nhưng là nơi khởi đầu cả một chân giảm và phá cấu trúc.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="520" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Swing nào quan trọng? Hậu quả cấu trúc quan trọng hơn hình dạng đẹp</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Swing A trông &quot;đẹp&quot; nhưng không gây ra điều gì. Swing B trông &quot;xấu&quot; (râu dài, lộn xộn) nhưng là nơi khởi đầu cả một chân giảm và phá cấu trúc.</tspan></text>
<rect x="24.0" y="112.0" width="300.0" height="240.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="26.0" y="104.0" font-size="13" fill="#6B7280" text-anchor="start"><tspan font-weight="700">A — Đẹp nhưng vô nghĩa</tspan></text>
<polyline points="40.0,246.9 68.5,223.1 97.0,258.7 125.5,220.1 148.3,246.9 182.6,199.3 216.8,246.9 239.6,217.1 268.1,255.8 302.3,229.0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="182.6" cy="199.3" r="3.6" fill="#6B7280"/>
<text x="182.6" y="190.3" font-size="11" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">đỉnh nhỏ cân đối</tspan></text>
<text x="45.7" y="306.3" font-size="11" fill="#6B7280" text-anchor="start"><tspan>giá đi ngang trước và sau nó</tspan></text>
<rect x="340.0" y="112.0" width="300.0" height="240.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="342.0" y="104.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">B — Xấu nhưng quan trọng</tspan></text>
<rect x="478.6" y="190.4" width="34.2" height="104.0" rx="2" fill="#FEF7E6" stroke="#B45309" stroke-width="0.8" opacity="0.5"/>
<line x1="384.5" y1="268.4" x2="532.8" y2="268.4" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="384.5" y="282.4" font-size="11" fill="#D85A30" text-anchor="start"><tspan>đáy cũ</tspan></text>
<polyline points="356.0,242.4 384.5,268.4 427.3,206.0 447.2,221.6 470.0,148.8 478.6,200.8 510.0,294.4 532.8,273.6 555.6,304.8 584.1,284.0 618.3,320.4" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="470.0" cy="148.8" r="3.6" fill="#DC2626"/>
<text x="470.0" y="139.8" font-size="11" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">đỉnh râu dài</tspan></text>
<text x="515.7" y="200.8" font-size="11" fill="#B45309" text-anchor="start"><tspan font-weight="700">chân giảm mạnh</tspan></text>
<text x="515.7" y="221.6" font-size="11" fill="#B45309" text-anchor="start"><tspan font-weight="700">phá đáy cũ</tspan></text>
<rect x="656.0" y="104.0" width="320.0" height="248.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="668.0" y="126.0" font-size="13" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Sáu câu hỏi</tspan></text>
<text x="912.0" y="126.0" font-size="13" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">A</tspan></text>
<text x="950.0" y="126.0" font-size="13" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">B</tspan></text>
<text x="668.0" y="154.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Tạo ra một chân sóng rõ?</tspan></text>
<text x="912.0" y="154.0" font-size="14" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">✗</tspan></text>
<text x="950.0" y="154.0" font-size="14" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">✓</tspan></text>
<line x1="668.0" y1="172.0" x2="962.0" y2="172.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/>
<text x="668.0" y="186.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Bảo vệ một HL/LH quan trọng?</tspan></text>
<text x="912.0" y="186.0" font-size="14" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">✗</tspan></text>
<text x="950.0" y="186.0" font-size="14" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">✓</tspan></text>
<line x1="668.0" y1="204.0" x2="962.0" y2="204.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/>
<text x="668.0" y="218.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Khởi đầu một cú dịch chuyển?</tspan></text>
<text x="912.0" y="218.0" font-size="14" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">✗</tspan></text>
<text x="950.0" y="218.0" font-size="14" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">✓</tspan></text>
<line x1="668.0" y1="236.0" x2="962.0" y2="236.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/>
<text x="668.0" y="250.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Có nhiều lệnh chờ quanh nó (đỉnh/đáy</tspan></text>
<text x="668.0" y="265.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>rõ)?</tspan></text>
<text x="912.0" y="250.0" font-size="14" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">✗</tspan></text>
<text x="950.0" y="250.0" font-size="14" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">✓</tspan></text>
<line x1="668.0" y1="284.0" x2="962.0" y2="284.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/>
<text x="668.0" y="298.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Thấy được ở khung lớn hơn?</tspan></text>
<text x="912.0" y="298.0" font-size="14" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">✗</tspan></text>
<text x="950.0" y="298.0" font-size="14" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">✓</tspan></text>
<line x1="668.0" y1="316.0" x2="962.0" y2="316.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/>
<text x="668.0" y="330.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Gây hậu quả cấu trúc (phá swing khác)?</tspan></text>
<text x="912.0" y="330.0" font-size="14" fill="#6B7280" text-anchor="middle"><tspan font-weight="700">✗</tspan></text>
<text x="950.0" y="330.0" font-size="14" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">✓</tspan></text>
<line x1="668.0" y1="364.0" x2="962.0" y2="364.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/>
<rect x="24.0" y="372.0" width="616.0" height="132.0" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.0"/>
<rect x="24.0" y="372.0" width="5.0" height="132.0" rx="2" fill="#2563EB"/>
<text x="38.0" y="392.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">Nguyên tắc</tspan></text>
<text x="38.0" y="411.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="50.0" y="411.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Một swing quan trọng vì những gì nó đã GÂY RA (chân sóng, cú dịch chuyển, phá cấu trúc), không</tspan></text>
<text x="50.0" y="428.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>vì nó trông cân đối.</tspan></text>
<text x="38.0" y="447.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan font-weight="700">•</tspan></text>
<text x="50.0" y="447.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Nhưng chỉ được dùng thông tin ĐÃ CÓ tại thời điểm đánh giá. Nếu phải chờ tương lai mới biết swing</tspan></text>
<text x="50.0" y="463.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>quan trọng, thì lúc đó nó chưa được dùng làm mốc.</tspan></text>
<rect x="656.0" y="372.0" width="320.0" height="132.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="656.0" y="372.0" width="5.0" height="132.0" rx="2" fill="#B45309"/>
<text x="670.0" y="392.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Không dùng làm định nghĩa duy nhất</tspan></text>
<text x="670.0" y="411.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Số nến hai bên hay một ngưỡng độ dài chỉ là cách</tspan></text>
<text x="670.0" y="428.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>ĐO hỗ trợ. Cái quyết định là vai trò cấu trúc của</tspan></text>
<text x="670.0" y="445.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>swing.</tspan></text>
</svg>
