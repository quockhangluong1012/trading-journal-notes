<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ahEA580C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker><marker id="ahDC2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="1" y="1" width="998" height="618" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Các trạng thái của một CISD trong thời gian thực</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một CISD không “bật” ra từ hư không. Nó đi qua các trạng thái. Biết mình đang ở trạng thái nào giúp tránh hành động quá sớm và</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">tránh giữ niềm tin quá lâu.</text>
<rect x="907.2" y="22" width="64.8" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="939.6" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STATE</text>
<text x="28.0" y="608.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<rect x="30.0" y="156.0" width="200.0" height="76.0" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
<text x="130.0" y="198.2" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle">S0 · Chưa có ứng viên</text>
<rect x="260.0" y="156.0" width="200.0" height="76.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="360.0" y="190.4" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">S1 · Có chuỗi + cực trị → kẻ</text>
<text x="360.0" y="206.0" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">mức</text>
<rect x="500.0" y="156.0" width="200.0" height="76.0" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
<text x="600.0" y="190.4" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">S2 · Nến đang vượt mức</text>
<text x="600.0" y="206.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">(CHƯA đóng)</text>
<rect x="740.0" y="156.0" width="200.0" height="76.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="840.0" y="190.4" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">S3 · CISD xác nhận (nến đã</text>
<text x="840.0" y="206.0" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">đóng)</text>
<rect x="740.0" y="336.0" width="200.0" height="76.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="840.0" y="370.4" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">S4 · Follow-through: không</text>
<text x="840.0" y="386.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">đóng lại, có MSS/FVG</text>
<rect x="500.0" y="336.0" width="200.0" height="76.0" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
<text x="600.0" y="370.4" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">S5 · Thất bại MỀM: đóng lại</text>
<text x="600.0" y="386.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">phía bên kia mức</text>
<rect x="260.0" y="336.0" width="200.0" height="76.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="360.0" y="370.4" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">S6 · Thất bại CỨNG: phá cực</text>
<text x="360.0" y="386.0" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">trị cú quét</text>
<line x1="230.0" y1="194.0" x2="258.0" y2="194.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="460.0" y1="194.0" x2="498.0" y2="194.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="700.0" y1="194.0" x2="738.0" y2="194.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<line x1="840.0" y1="232.0" x2="840.0" y2="334.0" stroke="#059669" stroke-width="1.6" marker-end="url(#ah059669)"/>
<line x1="780.0" y1="232.0" x2="650.0" y2="336.0" stroke="#EA580C" stroke-width="1.6" marker-end="url(#ahEA580C)"/>
<line x1="500.0" y1="374.0" x2="462.0" y2="374.0" stroke="#DC2626" stroke-width="1.6" marker-end="url(#ahDC2626)"/>
<path d="M600,156 C600,104 380,104 380,154" fill="none" stroke="#EA580C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#ahEA580C)"/>
<text x="490.0" y="112.0" font-size="10.5" font-weight="600" fill="#EA580C" text-anchor="middle">nến đóng lại dưới mức → quay về S1</text>
<path d="M700,384 C760,444 900,444 900,416" fill="none" stroke="#059669" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#ah059669)"/>
<text x="830.0" y="456.0" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">có thể hồi phục</text>
<path d="M260,374 C150,374 130,304 130,234" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#ah6B7280)"/>
<text x="160.0" y="344.0" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">tìm chuỗi mới</text>
<rect x="28.0" y="484.0" width="300.0" height="77.4" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="40.0" y="508.4" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Ở S2 đừng hành động</text>
<text x="40.0" y="530.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá đang ở trên mức nhưng nến chưa đóng. Rất</text>
<text x="40.0" y="546.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">nhiều “CISD” biến mất ngay trước tiếng chuông.</text>
<rect x="350.0" y="484.0" width="300.0" height="77.4" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="362.0" y="508.4" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">S3 là bắt đầu, không phải kết thúc</text>
<text x="362.0" y="530.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">CISD xác nhận chỉ mở ra giai đoạn “chứng minh”.</text>
<text x="362.0" y="546.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Kế hoạch phải có sẵn S4, S5, S6.</text>
<rect x="672.0" y="484.0" width="300.0" height="93.5" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="684.0" y="508.4" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">S5 khác S6</text>
<text x="684.0" y="530.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thất bại mềm = niềm tin giảm mạnh. Thất bại</text>
<text x="684.0" y="546.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cứng = chặng cũ đã quay lại: kịch bản đảo chiều</text>
<text x="684.0" y="562.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">bị bác bỏ.</text>
</svg>
