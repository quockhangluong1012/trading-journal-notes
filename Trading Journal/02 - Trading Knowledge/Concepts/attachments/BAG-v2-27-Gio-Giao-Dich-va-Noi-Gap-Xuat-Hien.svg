<text x="130.5" y="432.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Gap mỗi đêm + cuối tuần; giờ mở rộng (màu nhạt) có thể 'lấp' gap trên chart giờ chính thức.</text>
