<text x="130.8" y="474.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Gần như liên tục 24/5; gap thật chủ yếu ở cuối tuần hoặc khi có cú sốc. Giờ mở/đóng tùy broker.</text>
