<text x="175.3" y="453.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nghỉ ngắn mỗi ngày (~17:00–18:00 ET) + cuối tuần → gap nhỏ hằng ngày và gap cuối tuần.</text>
