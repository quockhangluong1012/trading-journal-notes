<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Cases đắt giá nhất: Ép mô hình &amp; Midpoint lệch trên nến tin</text>
  <text x="40" y="63" font-size="15" fill="#94a3b8">EC3 — hai nến không thực sự "thân lớn" | EC2 — bóng dài spike tin làm midpoint vô nghĩa</text>

  <!-- Panel EC3 -->
  <rect x="40" y="90" width="560" height="620" rx="8" fill="#141b2b" stroke="#1c2333"/>
  <text x="60" y="120" font-size="17" fill="#e2e8f0" font-weight="bold">EC3. Ép mô hình — nến không đủ "thân lớn"</text>

  <text x="60" y="150" font-size="13" fill="#94a3b8">ATR(14) trung bình body = đường tham chiếu</text>
  <line x1="70" y1="300" x2="550" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="555" y="304" font-size="11" fill="#94a3b8">ATR ref</text>

  <line x1="150" y1="330" x2="150" y2="270" stroke="#f97316" stroke-width="2"/>
  <rect x="139" y="280" width="22" height="45" fill="#f97316"/>
  <text x="150" y="350" font-size="11" fill="#f97316" text-anchor="middle">Body chỉ 1.2x ATR</text>
  <text x="150" y="368" font-size="11" fill="#f97316" text-anchor="middle">(dưới ngưỡng 1.5x)</text>

  <line x1="230" y1="340" x2="230" y2="250" stroke="#f97316" stroke-width="2"/>
  <rect x="219" y="260" width="22" height="70" fill="#f97316"/>
  <text x="230" y="360" font-size="11" fill="#f97316" text-anchor="middle">Cũng dưới ngưỡng</text>

  <rect x="139" y="255" width="102" height="75" fill="#f97316" opacity="0.15"/>
  <text x="60" y="400" font-size="13" fill="#ef4444">→ "Implied FVG" bị ép — không đủ điều kiện thật</text>

  <text x="60" y="430" font-size="13" fill="#94a3b8">So sánh: hai nến THỰC SỰ thân lớn (≥1.5x ATR)</text>
  <line x1="350" y1="580" x2="350" y2="470" stroke="#22c55e" stroke-width="2"/>
  <rect x="339" y="490" width="22" height="90" fill="#22c55e"/>
  <line x1="420" y1="500" x2="420" y2="400" stroke="#22c55e" stroke-width="2"/>
  <rect x="409" y="420" width="22" height="80" fill="#22c55e"/>
  <text x="380" y="600" font-size="11" fill="#22c55e" text-anchor="middle">Body vượt trội rõ rệt → hợp lệ</text>

  <rect x="60" y="620" width="500" height="80" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="646" font-size="13" fill="#e2e8f0">Quy tắc cứng: chỉ tính "thân lớn" nếu body ≥ 1.5x ATR(14),</text>
  <text x="80" y="668" font-size="13" fill="#e2e8f0">quyết định TRƯỚC phiên — không điều chỉnh giữa lúc tìm setup.</text>

  <!-- Panel EC2 -->
  <rect x="620" y="90" width="540" height="620" rx="8" fill="#141b2b" stroke="#1c2333"/>
  <text x="640" y="120" font-size="17" fill="#e2e8f0" font-weight="bold">EC2. Bóng dài spike tin làm midpoint vô nghĩa</text>

  <text x="640" y="150" font-size="13" fill="#94a3b8">Nến CPI 08:30 ET — quote đóng băng trong tích tắc</text>
  <line x1="800" y1="380" x2="800" y2="180" stroke="#f97316" stroke-width="2"/>
  <rect x="789" y="280" width="22" height="60" fill="#f97316"/>
  <text x="815" y="195" font-size="12" fill="#f97316">Bóng trên dài gấp 3x bình thường</text>
  <text x="815" y="215" font-size="11" fill="#94a3b8">(spike đơn lẻ, quote gần đóng băng)</text>

  <line x1="800" y1="230" x2="1120" y2="230" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1000" y="225" font-size="12" fill="#eab308">Midpoint tính "máy móc"</text>
  <text x="1000" y="245" font-size="11" fill="#ef4444">→ rơi vào vùng KHÔNG có giao dịch thật</text>

  <rect x="640" y="420" width="460" height="140" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="660" y="446" font-size="14" fill="#e2e8f0" font-weight="bold">Vì sao bẫy được cả trader kinh nghiệm</text>
  <text x="660" y="470" font-size="13" fill="#e2e8f0">Công thức midpoint áp dụng máy móc không</text>
  <text x="660" y="490" font-size="13" fill="#e2e8f0">phân biệt được bóng "bình thường" (nhiều nhịp</text>
  <text x="660" y="510" font-size="13" fill="#e2e8f0">giao dịch nhỏ) với bóng "spike đơn lẻ" do tin.</text>
  <text x="660" y="534" font-size="12" fill="#94a3b8">Vùng đo được trông hợp lệ về hình học nhưng vô nghĩa về orderflow</text>

  <rect x="640" y="580" width="460" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="660" y="606" font-size="14" fill="#e2e8f0" font-weight="bold">Cách xử lý</text>
  <text x="660" y="630" font-size="13" fill="#e2e8f0">• Nhận diện bóng dài xuất hiện trong ±1-2 phút tin</text>
  <text x="660" y="652" font-size="13" fill="#e2e8f0">• Loại trừ hoàn toàn nến trong cửa sổ tin</text>
  <text x="660" y="674" font-size="13" fill="#e2e8f0">• Chỉ tính implied trên cụm nến SAU khi tin lắng</text>
</svg>
