<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Không cộng mọi thứ vào một điểm — ba vai trò của bằng chứng</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Chỉ DIRECTIONAL EVIDENCE cập nhật hướng. MODIFIER đổi kịch bản/vị trí/thời điểm. VETO đổi trạng thái bất kể phần còn lại.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker>
  </defs>

  <!-- column 1 -->
  <rect x="26" y="76" width="300" height="300" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
  <text x="44" y="102" font-size="14" font-weight="700" fill="#15803D">DIRECTIONAL EVIDENCE</text>
  <text x="44" y="120" font-size="11" fill="#15803D">cập nhật xác suất của HƯỚNG</text>
  <text x="44" y="150" font-size="11.5" fill="#374151">• D1 structural state (RULE-DB-001)</text>
  <text x="44" y="176" font-size="11.5" fill="#374151">• Displacement + acceptance phá swing</text>
  <text x="56" y="192" font-size="11.5" fill="#374151">có scale ≥ θ_min(D1)</text>
  <text x="44" y="218" font-size="11.5" fill="#374151">• Sweep liquidity meaningful + RECLAIM</text>
  <text x="56" y="234" font-size="11.5" fill="#374151">(sự kiện xảy ra hôm nay, sau T0)</text>
  <text x="44" y="260" font-size="11.5" fill="#374151">• SMT tại mức meaningful (confirmation)</text>
  <rect x="40" y="300" width="272" height="60" rx="6" fill="#DCFCE7"/>
  <text x="52" y="322" font-size="11" font-weight="700" fill="#166534">Đếm theo HỌ bằng chứng độc lập,</text>
  <text x="52" y="340" font-size="11" font-weight="700" fill="#166534">không đếm từng dấu hiệu cùng nguồn.</text>

  <!-- column 2 -->
  <rect x="340" y="76" width="300" height="300" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="358" y="102" font-size="14" font-weight="700" fill="#1D4ED8">MODIFIERS</text>
  <text x="358" y="120" font-size="11" fill="#1D4ED8">không đổi hướng — đổi CÁCH hành động</text>
  <text x="358" y="150" font-size="11.5" fill="#374151">• Location p trong D1 leg DR, LRI</text>
  <text x="358" y="176" font-size="11.5" fill="#374151">• Khoảng cách DOL, M ratio, p_null^T</text>
  <text x="358" y="202" font-size="11.5" fill="#374151">• Session timing / killzone</text>
  <text x="358" y="228" font-size="11.5" fill="#374151">• Volatility regime (ATR pct, ADR5/ADR20)</text>
  <text x="358" y="254" font-size="11.5" fill="#374151">• Premium / Discount (RULE-DB-003)</text>
  <rect x="354" y="300" width="272" height="60" rx="6" fill="#DBEAFE"/>
  <text x="366" y="322" font-size="11" font-weight="700" fill="#1E3A8A">Chọn kịch bản chính, POI, room, giờ —</text>
  <text x="366" y="340" font-size="11" font-weight="700" fill="#1E3A8A">KHÔNG được cộng vào điểm hướng.</text>

  <!-- column 3 -->
  <rect x="654" y="76" width="300" height="300" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="672" y="102" font-size="14" font-weight="700" fill="#B91C1C">VETOES</text>
  <text x="672" y="120" font-size="11" fill="#B91C1C">chuyển STATE ngay lập tức</text>
  <text x="672" y="150" font-size="11.5" fill="#374151">• Tin tier-1 trong cửa sổ → SUSPENDED</text>
  <text x="672" y="176" font-size="11.5" fill="#374151">• Thang lớn hơn ngược chiều tại POI</text>
  <text x="684" y="192" font-size="11.5" fill="#374151">(W1 POI, PWH bị từ chối) → CONFLICTED</text>
  <text x="672" y="218" font-size="11.5" fill="#374151">• D1 TRANSITION / range FORMING</text>
  <text x="684" y="234" font-size="11.5" fill="#374151">→ UNCLEAR</text>
  <text x="672" y="260" font-size="11.5" fill="#374151">• LRI thấp / DOL vừa bị lấy → UNCLEAR</text>
  <rect x="668" y="300" width="272" height="60" rx="6" fill="#FEE2E2"/>
  <text x="680" y="322" font-size="11" font-weight="700" fill="#991B1B">Veto thắng mọi tổng điểm.</text>
  <text x="680" y="340" font-size="11" font-weight="700" fill="#991B1B">“Không có bias” là output hợp lệ.</text>

  <!-- arrows to output -->
  <path d="M176 378 L176 410 L440 410 L440 428" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M490 378 L490 428" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M804 378 L804 410 L540 410 L540 428" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="250" y="432" width="480" height="54" rx="9" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
  <text x="490" y="455" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">DAILY BIAS = state + tier + policy</text>
  <text x="490" y="474" font-size="11" fill="#6B7280" text-anchor="middle">BULLISH / BEARISH / NEUTRAL / UNCLEAR / CONFLICTED / SUSPENDED</text>

  <rect x="26" y="500" width="928" height="44" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="490" y="519" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">Ảo giác hội tụ: trên random walk, 6 yếu tố “bullish” phổ biến tương quan TB 0.38; ≥5/6 đồng thuận ở 56% số ngày</text>
  <text x="490" y="536" font-size="11.5" fill="#92400E" text-anchor="middle">(nếu độc lập chỉ 22%) — và không dự báo gì cho ngày hôm sau. Số lượng bằng chứng ≠ sức mạnh bằng chứng.</text>
</svg>
