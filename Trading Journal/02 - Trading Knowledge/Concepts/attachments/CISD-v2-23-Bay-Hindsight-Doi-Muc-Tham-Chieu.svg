<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bẫy hindsight: dời mức tham chiếu cho “khớp” với kết quả</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trái: mức được kẻ theo quy tắc ở thời điểm thật → CISD thất bại, ghi nhận trung thực. Phải: sau khi biết kết quả, người xem chọn lại</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">một open khác để chart “trông đúng”. Đây là tự lừa mình.</text>
