<text x="924.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">REFERENCE</text>
<text x="28.0" y="588.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
