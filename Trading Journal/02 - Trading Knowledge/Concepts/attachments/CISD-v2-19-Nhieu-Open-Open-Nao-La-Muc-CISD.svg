<text x="618.0" y="153.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến đầu của chuỗi đỏ LIỀN MẠCH cuối cùng (#6–#9) chạy vào</text>
<text x="618.0" y="169.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đáy. Đây là mức CISD.</text>
<rect x="606.0" y="191.7" width="366.0" height="76.7" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="618.0" y="215.6" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start">A, B · open #1, #2</text>
<text x="618.0" y="237.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Thuộc một chặng xuống CŨ hơn, đã kết thúc bởi chặng lên</text>
<text x="618.0" y="253.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">#3–#5.</text>
<rect x="606.0" y="275.4" width="366.0" height="76.7" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="618.0" y="299.3" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start">C · open #5</text>
<text x="618.0" y="320.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến xanh: thuộc chặng LÊN, không phải chặng xuống cần bị</text>
<text x="618.0" y="336.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lấy lại.</text>
<rect x="606.0" y="359.1" width="366.0" height="76.7" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="618.0" y="383.0" font-size="12.5" font-weight="700" fill="#EA580C" text-anchor="start">D, E, F · open #7, #8, #9</text>
<text x="618.0" y="404.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nằm GIỮA chuỗi. Dùng chúng = chỉ đòi lấy lại một phần chặng</text>
<text x="618.0" y="420.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">(biến thể “gần nhất” của F: sớm hơn, nhiễu hơn).</text>
<rect x="606.0" y="442.8" width="366.0" height="76.7" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="618.0" y="466.7" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start">G · open #10</text>
<text x="618.0" y="488.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nến xanh đầu tiên sau đáy — đây là chặng MỚI, không phải mốc</text>
<text x="618.0" y="504.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">tham chiếu.</text>
