<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Chart có rất nhiều giá mở cửa — open nào là mức CISD?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi gạch nhỏ là open của một cây nến. Chỉ MỘT gạch là mức CISD theo quy tắc v2: open của nến ĐẦU TIÊN trong chuỗi nến đóng</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">giảm liên tiếp cuối cùng đã đưa giá vào đáy (#6).</text>
