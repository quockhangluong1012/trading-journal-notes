<rect x="108.4" y="255.8" width="81.6" height="26.4" rx="0" fill="#E6F6F8" stroke="#0E7490" stroke-width="1.3" stroke-dasharray="4,3"/>
<polyline points="46.0,214.0 70.0,236.0 94.0,258.0 118.0,275.6 142.0,181.0 166.0,148.0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="38.0" y="386.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nến giảm cuối cùng trước</text>
<text x="38.0" y="401.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">một cú tăng mạnh. = GỐC</text>
<text x="38.0" y="416.9" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">của cú đẩy.</text>
