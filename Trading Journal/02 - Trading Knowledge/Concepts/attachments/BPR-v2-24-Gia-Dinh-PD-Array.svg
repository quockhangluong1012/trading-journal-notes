<text x="611.0" y="386.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Phần bóng nến dài ở đáy. =</text>
<text x="611.0" y="401.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">vùng giá bị TỪ CHỐI nhanh.</text>
<rect x="792.0" y="86.0" width="180.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="802.0" y="108.0" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">BPR</text>
