<polyline points="237.0,258.0 261.0,203.0 285.0,280.0 309.0,236.0 333.0,156.8 357.0,200.8 381.0,148.0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="229.0" y="386.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Vùng đỉnh cũ thất bại sau khi</text>
<text x="229.0" y="401.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">giá quét đáy rồi phá đỉnh. =</text>
<text x="229.0" y="416.9" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">vùng ĐỔI VAI có sweep.</text>
<rect x="410.0" y="86.0" width="180.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="420.0" y="108.0" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">Mitigation Block</text>
<rect x="442.4" y="200.8" width="129.6" height="22.0" rx="0" fill="#FFF4E0" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4,3"/>
<polyline points="428.0,280.0 452.0,203.0 476.0,258.0 500.0,236.0 524.0,156.8 548.0,200.8 572.0,148.0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="420.0" y="386.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Như breaker nhưng đáy thứ</text>
<text x="420.0" y="401.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">hai CAO hơn (không quét). =</text>
<text x="420.0" y="416.9" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">đổi vai không có sweep.</text>
