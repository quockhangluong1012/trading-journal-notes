<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="893.9" y="22" width="78.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="932.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SO SÁNH</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">BPR trong “gia đình PD array”: mỗi vùng được làm từ một thứ khác nhau</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sơ đồ đơn giản hóa (đường giá thay cho nến), phiên bản bullish. Điều cần nhớ là NGUYÊN LIỆU tạo ra mỗi vùng.</text>
<rect x="28.0" y="86.0" width="180.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
