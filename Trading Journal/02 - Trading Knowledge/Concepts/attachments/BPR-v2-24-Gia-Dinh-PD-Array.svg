<text x="802.0" y="386.0" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Phần chung của hai FVG</text>
<text x="802.0" y="401.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">ngược chiều. = CỔ của một</text>
<text x="802.0" y="416.9" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">cú quay đầu nhanh.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Điểm chung: tất cả đều là vùng do một sự kiện giá trong QUÁ KHỨ để lại. Không vùng nào tự chứng minh rằng giá sẽ phản ứng ở đó trong TƯƠNG LAI.</text>
