<rect x="891.6" y="205.2" width="52.8" height="77.0" rx="0" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>
<rect x="891.6" y="209.6" width="52.8" height="52.8" rx="0" fill="#E9DDFF" stroke="#7C3AED" stroke-width="1.6"/>
