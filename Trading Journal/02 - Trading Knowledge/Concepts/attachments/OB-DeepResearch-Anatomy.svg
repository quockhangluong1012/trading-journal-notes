<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="440" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Giải phẫu Bullish OB — quan sát được vs diễn giải</text>
  <text x="24" y="52" font-size="12.5" fill="#6B7280">Chart chỉ cho biết nơi cú mất cân bằng bắt đầu. Ai đặt lệnh, lệnh còn hay hết — không quan sát được.</text>

  <!-- chart frame -->
  <rect x="24" y="68" width="486" height="352" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- FVG zone -->
  <rect x="316" y="236" width="190" height="44" fill="#FEF3C7" opacity="0.9"/>
  <text x="472" y="262" font-size="10.5" font-weight="700" fill="#B45309">FVG</text>
  <!-- OB full zone -->
  <rect x="262" y="280" width="244" height="42" fill="#DBEAFE" opacity="0.9"/>
  <!-- OB body zone -->
  <rect x="262" y="285" width="244" height="20" fill="#93C5FD" opacity="0.55"/>

  <!-- equal lows line (SSL) -->
  <line x1="110" y1="300" x2="262" y2="300" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="112" y="316" font-size="10" fill="#DC2626">Equal lows = SSL</text>

  <!-- lower high line (broken swing) -->
  <line x1="150" y1="228" x2="352" y2="228" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="156" y="222" font-size="10" fill="#374151">Lower high (swing bị phá)</text>

  <!-- candles: wick then body. red = down, green = up -->
  <g stroke-width="1.3">
    <!-- c1 down -->
    <line x1="60" y1="112" x2="60" y2="178" stroke="#DC2626"/><rect x="53" y="120" width="14" height="50" fill="#DC2626"/>
    <!-- c2 down -->
    <line x1="90" y1="165" x2="90" y2="232" stroke="#DC2626"/><rect x="83" y="170" width="14" height="50" fill="#DC2626"/>
    <!-- c3 down (first low 300) -->
    <line x1="120" y1="215" x2="120" y2="300" stroke="#DC2626"/><rect x="113" y="220" width="14" height="45" fill="#DC2626"/>
    <!-- c4 up -->
    <line x1="150" y1="228" x2="150" y2="270" stroke="#16A34A"/><rect x="143" y="235" width="14" height="30" fill="#16A34A"/>
    <!-- c5 down (second low 300) -->
    <line x1="180" y1="230" x2="180" y2="300" stroke="#DC2626"/><rect x="173" y="235" width="14" height="45" fill="#DC2626"/>
    <!-- c6 up -->
    <line x1="210" y1="245" x2="210" y2="288" stroke="#16A34A"/><rect x="203" y="250" width="14" height="30" fill="#16A34A"/>
    <!-- c7 down -->
    <line x1="240" y1="246" x2="240" y2="294" stroke="#DC2626"/><rect x="233" y="250" width="14" height="36" fill="#DC2626"/>
    <!-- c8 OB candle: down, sweeps below 300 -->
    <line x1="270" y1="280" x2="270" y2="322" stroke="#1D4ED8" stroke-width="1.6"/><rect x="263" y="285" width="14" height="20" fill="#1D4ED8"/>
    <!-- c9 displacement up -->
    <line x1="300" y1="225" x2="300" y2="308" stroke="#16A34A"/><rect x="293" y="230" width="14" height="75" fill="#16A34A"/>
    <!-- c10 displacement up (MSS close) -->
    <line x1="330" y1="155" x2="330" y2="238" stroke="#16A34A"/><rect x="323" y="160" width="14" height="72" fill="#16A34A"/>
    <!-- c11 up -->
    <line x1="360" y1="128" x2="360" y2="170" stroke="#16A34A"/><rect x="353" y="140" width="14" height="20" fill="#16A34A"/>
    <!-- c12 down -->
    <line x1="390" y1="135" x2="390" y2="180" stroke="#DC2626"/><rect x="383" y="140" width="14" height="35" fill="#DC2626"/>
    <!-- c13 down into FVG -->
    <line x1="420" y1="172" x2="420" y2="262" stroke="#DC2626"/><rect x="413" y="175" width="14" height="80" fill="#DC2626"/>
    <!-- c14 retest wick into OB, close up -->
    <line x1="450" y1="210" x2="450" y2="286" stroke="#16A34A"/><rect x="443" y="215" width="14" height="40" fill="#16A34A"/>
  </g>
  <path d="M470 250 L492 196" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16A34A"/></marker>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
  </defs>

  <!-- annotations -->
  <text x="150" y="336" font-size="10.5" font-weight="700" fill="#1D4ED8">① Sweep SSL</text>
  <text x="150" y="350" font-size="10" fill="#1D4ED8">② Nến down-close cuối = OB</text>
  <text x="300" y="118" font-size="10" fill="#166534">③ Displacement</text>
  <text x="300" y="130" font-size="10" fill="#166534">④ Close vượt LH = MSS</text>
  <line x1="338" y1="76" x2="338" y2="334" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="342" y="88" font-size="9.5" fill="#4B5563">t_avail: nến MSS đóng cửa</text>
  <text x="342" y="100" font-size="9.5" fill="#4B5563">(trước mốc này OB chưa tồn tại)</text>
  <text x="380" y="300" font-size="10" fill="#1E3A8A">⑥ Retest: penetration ≈ 14%</text>

  <!-- level labels: mini zoom diagram -->
  <g font-size="9.5">
    <text x="300" y="346" font-size="10" font-weight="700" fill="#1E3A8A">Zoom vùng OB (tỉ lệ thật):</text>
    <rect x="300" y="358" width="44" height="59" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="0.8"/>
    <rect x="300" y="365" width="44" height="28" fill="#93C5FD" opacity="0.7"/>
    <line x1="300" y1="379" x2="344" y2="379" stroke="#1D4ED8" stroke-dasharray="3 2"/>
    <line x1="300" y1="387.5" x2="344" y2="387.5" stroke="#B45309" stroke-dasharray="2 2"/>
    <g stroke="#6B7280" stroke-width="0.7">
      <line x1="344" y1="358" x2="356" y2="356"/>
      <line x1="344" y1="365" x2="356" y2="369"/>
      <line x1="344" y1="379" x2="356" y2="382"/>
      <line x1="344" y1="387.5" x2="356" y2="395"/>
      <line x1="344" y1="417" x2="356" y2="408"/>
    </g>
    <text x="360" y="359" fill="#1E3A8A">Proximal = High</text>
    <text x="360" y="372" fill="#1E3A8A">Open = đỉnh thân (nến giảm)</text>
    <text x="360" y="385" fill="#1D4ED8">MT = 50% thân</text>
    <text x="360" y="398" fill="#B45309">CE = 50% full range</text>
    <text x="360" y="411" fill="#1E3A8A">Distal = Low (đáy râu sweep)</text>
  </g>
  <g font-size="9.5" fill="#374151">
    <text x="30" y="378" font-weight="700" font-size="10">Đo vùng — ghi TẤT CẢ:</text>
    <text x="30" y="392">full = High→Low (xanh nhạt)</text>
    <text x="30" y="405">body = Open→Close (xanh đậm)</text>
    <text x="30" y="418">MT ≠ CE → khai báo dùng mức nào</text>
  </g>

  <!-- right panel -->
  <rect x="524" y="68" width="212" height="170" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="524" y="68" width="212" height="28" rx="8" fill="#DCFCE7"/>
  <text x="534" y="87" font-size="11.5" font-weight="800" fill="#166534">QUAN SÁT ĐƯỢC</text>
  <g font-size="10.5" fill="#374151">
    <text x="534" y="114">✓ Giá quét qua equal lows</text>
    <text x="534" y="134">✓ Nến down-close cuối cùng</text>
    <text x="534" y="154">✓ Displacement: thân lớn, ít chồng lấp</text>
    <text x="534" y="174">✓ FVG 3 nến</text>
    <text x="534" y="194">✓ Close vượt lower high (MSS)</text>
    <text x="534" y="214">✓ Mức proximal / MT / CE / distal</text>
    <text x="534" y="230" font-size="9.5" fill="#6B7280">[MARKET MECHANICS]</text>
  </g>
  <rect x="524" y="250" width="212" height="170" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="524" y="250" width="212" height="28" rx="8" fill="#FEF3C7"/>
  <text x="534" y="269" font-size="11.5" font-weight="800" fill="#B45309">KHÔNG QUAN SÁT ĐƯỢC</text>
  <g font-size="10.5" fill="#374151">
    <text x="534" y="296">? Ai tạo displacement</text>
    <text x="534" y="316">? Sponsored, stop cascade hay tin tức</text>
    <text x="534" y="336">? Còn lệnh chờ ở OB không</text>
    <text x="534" y="356">? Phản ứng khi retest do "lệnh cũ"</text>
    <text x="546" y="370">hay người tham gia mới</text>
    <text x="534" y="392" font-size="9.5" fill="#6B7280">[INTERPRETATION / ICT FRAMEWORK]</text>
    <text x="534" y="408" font-size="9.5" fill="#6B7280">→ không kiểm chứng được từ nến</text>
  </g>
</svg>
