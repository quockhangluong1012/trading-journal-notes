<svg viewBox="0 0 980 500" width="980" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="500" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Ba cách hiểu IPDA — từ "robot điều khiển thị trường" tới "bộ từ vựng của trader"</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Câu hỏi không phải "IPDA đúng hay sai?" mà là "bạn đang dùng IPDA theo nghĩa nào — và nghĩa đó kiểm chứng được không?"</text>
<rect x="26.0" y="74.0" width="296.0" height="344.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="26.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="27.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#FEE2E2" stroke="#FEE2E2" stroke-width="0"/>
<text x="38.0" y="97.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">A. Robot trung tâm</text>
<text x="38.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Một thuật toán DUY NHẤT quyết định</text>
<text x="38.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">giá đi đâu, khi nào, tới mức nào.</text>
<text x="38.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="38.0" y="181.3" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Vấn đề:</text>
<text x="38.0" y="198.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Không có bằng chứng công khai nào</text>
<text x="38.0" y="215.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  (ngân hàng, sàn, cơ quan quản lý).</text>
<text x="38.0" y="232.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• FX phi tập trung, hàng nghìn dealer,</text>
<text x="38.0" y="249.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  ECN, quỹ, ngân hàng trung ương với</text>
<text x="38.0" y="266.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  mục tiêu mâu thuẫn nhau.</text>
<text x="38.0" y="284.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Không falsify được: mọi kết quả đều</text>
<text x="38.0" y="301.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  "giải thích" được sau khi xảy ra.</text>
<text x="38.0" y="318.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="38.0" y="335.3" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">→ Không dùng nghĩa này.</text>
<rect x="38.0" y="392.5" width="135.7" height="18.5" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
<text x="44.0" y="407.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">[UNSUPPORTED CLAIM]</text>
<rect x="342.0" y="74.0" width="296.0" height="344.0" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<rect x="342.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
<rect x="343.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#EDE9FE" stroke="#EDE9FE" stroke-width="0"/>
<text x="354.0" y="97.0" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">B. Quy luật nổi lên (emergent)</text>
<text x="354.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Nhiều người + nhiều thuật toán THẬT</text>
<text x="354.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">(market making, thực thi, quản trị stop)</text>
<text x="354.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">tạo ra các mẫu hình lặp lại.</text>
<text x="354.0" y="181.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="354.0" y="198.4" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Ví dụ có cơ sở:</text>
<text x="354.0" y="215.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Stop gom quanh số tròn/đỉnh rõ →</text>
<text x="354.0" y="232.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  price cascade (Osler).</text>
<text x="354.0" y="249.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Biến động tập trung theo phiên.</text>
<text x="354.0" y="266.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Order flow giải thích phần lớn biến</text>
<text x="354.0" y="284.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  động tỷ giá ngày (Evans &amp; Lyons).</text>
<text x="354.0" y="301.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="354.0" y="318.2" font-size="11.8" font-weight="700" fill="#6D28D9" text-anchor="start">→ Kiểm chứng được bằng dữ liệu.</text>
<rect x="354.0" y="392.5" width="90.1" height="18.5" rx="4" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1"/>
<text x="360.0" y="407.0" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="start">[HYPOTHESIS]</text>
<rect x="658.0" y="74.0" width="296.0" height="344.0" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
<rect x="658.0" y="74.0" width="296.0" height="34.0" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<rect x="659.0" y="96.0" width="294.0" height="12.0" rx="0" fill="#CCFBF1" stroke="#CCFBF1" stroke-width="0"/>
<text x="670.0" y="97.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">C. Ngôn ngữ mô tả (model)</text>
<text x="670.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">IPDA = bộ từ vựng giúp trader tổ chức</text>
<text x="670.0" y="147.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">quan sát: giá đang đi TỪ đâu TỚI đâu,</text>
<text x="670.0" y="164.2" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">qua những vùng nào.</text>
<text x="670.0" y="181.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="670.0" y="198.4" font-size="11.8" font-weight="700" fill="#1F2937" text-anchor="start">Giá trị đến từ:</text>
<text x="670.0" y="215.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Ép mình hỏi đúng câu hỏi trước</text>
<text x="670.0" y="232.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">  khi tìm entry.</text>
<text x="670.0" y="249.8" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Chuẩn hóa ghi chép, so sánh, review.</text>
<text x="670.0" y="266.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">• Tạo giả thuyết để test.</text>
<text x="670.0" y="284.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="670.0" y="301.1" font-size="11.8" font-weight="700" fill="#0F766E" text-anchor="start">Đo bằng: kỷ luật + expectancy,</text>
<text x="670.0" y="318.2" font-size="11.8" font-weight="700" fill="#0F766E" text-anchor="start">không bằng "đúng/sai về bản chất".</text>
<rect x="670.0" y="392.5" width="116.2" height="18.5" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
<text x="676.0" y="407.0" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="start">[INTERPRETATION]</text>
<rect x="26.0" y="428.0" width="928.0" height="56.0" rx="8" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<line x1="60.0" y1="456.0" x2="920.0" y2="456.0" stroke="#334155" stroke-width="2" marker-end="url(#aS)"/>
<text x="60.0" y="448.0" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="start">càng về trái: càng "mạnh", càng khó kiểm chứng</text>
<text x="920.0" y="448.0" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="end">càng về phải: càng khiêm tốn, càng hữu dụng</text>
<text x="490.0" y="476.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Note này dùng B (giả thuyết cơ chế) + C (công cụ tư duy). Không dùng A.</text>
</svg>
