<svg viewBox="0 0 1000 503" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="501" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="923.5" y="22" width="48.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="947.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">FVG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Khi giá quay lại một FVG: bốn kiểu phản ứng — và không kiểu nào là bắt buộc</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một FVG tăng (vùng vàng). Bốn tương lai khác nhau. Bạn chỉ biết mình đang ở kiểu nào SAU khi giá đã phản ứng.</text>
<rect x="28.0" y="87.0" width="227.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="108.0" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">a · Chạm rồi bật lên</text>
<rect x="93.8" y="221.6" width="143.2" height="29.4" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.9"/>
<path d="M46.0,309.8 L73.3,288.8 L86.9,272.0 L100.6,204.8 L114.2,196.4 L127.9,183.8 L155.1,209.0 L168.8,227.9 L196.1,196.4 L223.4,162.8 L237.0,146.0" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="363.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">Giá chạm vùng, có nến từ chối, rồi</text>
<text x="40.0" y="379.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">đi tiếp. Kiểu “sách giáo khoa”.</text>
<rect x="267.0" y="87.0" width="227.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="279.0" y="108.0" font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="start">b · Lấp hết rồi đi xuyên qua</text>
<rect x="332.8" y="221.6" width="143.2" height="29.4" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.9"/>
<path d="M285.0,309.8 L312.3,288.8 L325.9,272.0 L339.6,204.8 L353.2,196.4 L366.9,183.8 L394.1,213.2 L407.8,234.2 L421.4,251.0 L435.1,263.6 L462.4,284.6 L476.0,297.2" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="279.0" y="363.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">FVG không giữ được giá. Nó đã</text>
<text x="279.0" y="379.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">được “rebalance” — nhưng không</text>
<text x="279.0" y="395.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">có phản ứng.</text>
<rect x="506.0" y="87.0" width="227.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="518.0" y="108.0" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start">c · Không bao giờ quay lại</text>
<rect x="571.8" y="221.6" width="143.2" height="29.4" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.9"/>
<path d="M524.0,309.8 L551.3,288.8 L564.9,272.0 L578.6,204.8 L592.2,196.4 L605.9,183.8 L619.5,192.2 L646.8,167.0 L660.4,175.4 L687.7,146.0 L715.0,133.4" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="518.0" y="363.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">Giá chạy tiếp, bỏ qua IRL. Người chờ</text>
<text x="518.0" y="379.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">“giá về FVG” bị lỡ tàu.</text>
<rect x="745.0" y="87.0" width="227.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="757.0" y="108.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">d · Xuyên qua rồi đổi vai (IFVG)</text>
<rect x="810.8" y="221.6" width="143.2" height="29.4" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.9"/>
<path d="M763.0,309.8 L790.3,288.8 L803.9,272.0 L817.6,204.8 L831.2,196.4 L844.9,183.8 L872.1,217.4 L885.8,259.4 L899.4,272.0 L913.1,255.2 L926.7,248.9 L940.4,267.8 L954.0,288.8" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="757.0" y="363.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">Giá đóng cửa dưới FVG; lần quay lên</text>
<text x="757.0" y="379.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">sau, vùng cũ chặn giá như kháng</text>
<text x="757.0" y="395.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="203.0">cự.</text>
<rect x="28.0" y="431.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="455.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ghi vào journal KIỂU phản ứng (a/b/c/d) mỗi lần giá tới một FVG bạn đã đánh dấu TRƯỚC. Sau nhiều lần, bạn sẽ biết FVG ở bối cảnh nào hay giữ giá — đó là dữ</text>
<text x="42.0" y="471.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">liệu của bạn, không phải lời hứa của ICT.</text>
</svg>
