<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Vòng đời của một OB — máy trạng thái (khung phân tích, KHÔNG phải quy luật thị trường)</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi chuyển trạng thái phải có điều kiện quan sát được tại thời điểm xảy ra. Trạng thái giúp ghi journal và backtest nhất quán; nó không dự báo gì.</text>
<rect x="30.0" y="96.0" width="170.0" height="56.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="115.0" y="119.0" font-size="11.4" font-weight="700" fill="#334155" text-anchor="middle">CANDIDATE</text>
<text x="115.0" y="137.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">nến ngược hướng đóng</text>
<rect x="250.0" y="96.0" width="170.0" height="56.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="335.0" y="119.0" font-size="11.4" font-weight="700" fill="#6D28D9" text-anchor="middle">FORMED</text>
<text x="335.0" y="137.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">displacement + BOS → t_avail</text>
<rect x="470.0" y="96.0" width="170.0" height="56.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="555.0" y="119.0" font-size="11.4" font-weight="700" fill="#1D4ED8" text-anchor="middle">ARMED</text>
<text x="555.0" y="137.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">giá cách proximal ≥ x ATR</text>
<rect x="690.0" y="96.0" width="170.0" height="56.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
<text x="775.0" y="119.0" font-size="11.4" font-weight="700" fill="#B45309" text-anchor="middle">TOUCHED</text>
<text x="775.0" y="137.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">penetration ≥ 0 (lần k)</text>
<rect x="690.0" y="230.0" width="170.0" height="56.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="775.0" y="253.0" font-size="11.4" font-weight="700" fill="#15803D" text-anchor="middle">REACTED</text>
<text x="775.0" y="271.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">+x ATR trước distal</text>
<rect x="470.0" y="230.0" width="170.0" height="56.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
<text x="555.0" y="253.0" font-size="11.4" font-weight="700" fill="#B45309" text-anchor="middle">ABSORBING</text>
<text x="555.0" y="271.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">lình xình trong vùng &gt; N nến</text>
<rect x="250.0" y="230.0" width="170.0" height="56.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="335.0" y="253.0" font-size="11.4" font-weight="700" fill="#6D28D9" text-anchor="middle">DISTAL SWEPT</text>
<text x="335.0" y="271.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">râu/close qua distal</text>
<rect x="30.0" y="230.0" width="170.0" height="56.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="115.0" y="253.0" font-size="11.4" font-weight="700" fill="#15803D" text-anchor="middle">RECLAIMED</text>
<text x="115.0" y="271.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">close lại trong vùng ≤ k nến</text>
<rect x="250.0" y="370.0" width="170.0" height="56.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
<text x="335.0" y="393.0" font-size="11.4" font-weight="700" fill="#B91C1C" text-anchor="middle">INVALIDATED</text>
<text x="335.0" y="411.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">≥ k close ngoài, không reclaim</text>
<rect x="30.0" y="370.0" width="170.0" height="56.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
<text x="115.0" y="393.0" font-size="11.4" font-weight="700" fill="#B91C1C" text-anchor="middle">BREAKER-CANDIDATE</text>
<text x="115.0" y="411.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">cấu trúc đổi phe qua vùng</text>
<rect x="470.0" y="370.0" width="170.0" height="56.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="555.0" y="393.0" font-size="11.4" font-weight="700" fill="#334155" text-anchor="middle">EXPIRED</text>
<text x="555.0" y="411.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">tuổi &gt; T_max (khai báo)</text>
<rect x="690.0" y="370.0" width="170.0" height="56.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="775.0" y="393.0" font-size="11.4" font-weight="700" fill="#334155" text-anchor="middle">SUPERSEDED</text>
<text x="775.0" y="411.0" font-size="9.2" font-weight="400" fill="#374151" text-anchor="middle">range re-map / OB mới thay thế</text>
<line x1="200.0" y1="124.0" x2="250.0" y2="124.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#aK)"/>
<line x1="420.0" y1="124.0" x2="470.0" y2="124.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#aK)"/>
<line x1="640.0" y1="124.0" x2="690.0" y2="124.0" stroke="#6B7280" stroke-width="1.4" marker-end="url(#aK)"/>
<line x1="775.0" y1="152.0" x2="775.0" y2="230.0" stroke="#15803D" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="715.0" y1="152.0" x2="595.0" y2="230.0" stroke="#B45309" stroke-width="1.4" marker-end="url(#aO)"/>
<line x1="470.0" y1="258.0" x2="420.0" y2="258.0" stroke="#6D28D9" stroke-width="1.4" marker-end="url(#aP)"/>
<line x1="250.0" y1="258.0" x2="200.0" y2="258.0" stroke="#15803D" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="335.0" y1="286.0" x2="335.0" y2="370.0" stroke="#B91C1C" stroke-width="1.4" marker-end="url(#aR)"/>
<line x1="250.0" y1="398.0" x2="200.0" y2="398.0" stroke="#B91C1C" stroke-width="1.4" marker-end="url(#aR)"/>
<line x1="775.0" y1="286.0" x2="775.0" y2="300.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="784.0" y="312.0" font-size="9" font-weight="600" fill="#6B7280" text-anchor="start">về ARMED (lần chạm k+1)</text>
<line x1="115.0" y1="286.0" x2="115.0" y2="300.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="124.0" y="312.0" font-size="9" font-weight="600" fill="#6B7280" text-anchor="start">về ARMED / TOUCHED</text>
<rect x="30.0" y="444.0" width="924.0" height="180.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="464.0" font-size="11.2" font-weight="700" fill="#334155" text-anchor="start">Câu hỏi phản biện cho chính khung này</text>
<text x="42.0" y="481.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Có thật tồn tại 'vòng đời' không, hay chỉ là cách ta kể chuyện? — Các trạng thái là ĐỊNH NGHĨA của ta (DEFINITIONAL). Điều thực nghiệm là: xác suất chuyển trạng thái</text>
<text x="42.0" y="497.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">  có khác vùng đối chứng không. Trên random walk: P(REACTED | TOUCHED) đúng bằng hình học; 27% lần chạm đi qua DISTAL SWEPT và phần lớn quay về (OB-Sim-06 C).</text>
<text x="42.0" y="513.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• 'OB yếu đi sau mỗi lần mitigation' — trên random walk tỷ lệ phản ứng THÔ lại TĂNG theo số lần chạm (vùng rộng sống sót), và GIẢM theo tuổi (vùng gần bị chạm sớm),</text>
<text x="42.0" y="529.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">  dù không có cơ chế nào (OB-Sim-04). Mọi 'lifecycle effect' phải được đo sau khi trừ hình học.</text>
<text x="42.0" y="545.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• EXPIRED / SUPERSEDED là quy tắc VỆ SINH (giữ chart sạch, v1 Best Practice 8) — tham số T_max phải khai báo trước, không chỉnh theo kết quả.</text>
<text x="42.0" y="561.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">• Tham số x, N, k, T_max đều HEURISTIC v0.1 — xem RULE-OB-003…006 (§65).</text>
</svg>