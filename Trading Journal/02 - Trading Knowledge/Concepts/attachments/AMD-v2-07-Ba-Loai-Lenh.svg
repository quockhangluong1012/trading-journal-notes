<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba loại lệnh — giải thích bằng chuyện đi chợ</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Muốn hiểu vì sao giá hay “chọc” qua mép rồi quay về, trước hết phải biết lệnh nằm ở đâu và khi nào lệnh được khớp.</text>
<rect x="907.0" y="22.0" width="65.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="939.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CƠ CHẾ</text>
<rect x="28.0" y="96.0" width="306.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="13.5" font-weight="700" fill="#E0464B" text-anchor="start">Lệnh thị trường (Market)</text>
<text x="42.0" y="154.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">“Tôi mua NGAY, giá nào cũng được.”</text>
<text x="42.0" y="196.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người vội. Lệnh này ăn vào hàng người đang xếp</text>
<text x="42.0" y="212.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hàng chờ bán. Nhiều lệnh vội cùng lúc → giá</text>
<text x="42.0" y="229.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nhảy.</text>
<rect x="42.0" y="264.5" width="108.0" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#E0464B" stroke-width="1"/>
<text x="96.0" y="279.0" font-size="10.5" font-weight="700" fill="#E0464B" text-anchor="middle">LẤY thanh khoản</text>
<rect x="346.0" y="96.0" width="306.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="360.0" y="120.0" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">Lệnh giới hạn (Limit)</text>
<text x="360.0" y="154.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">“Tôi chỉ mua ở 95, tôi xếp hàng chờ.”</text>
<text x="360.0" y="196.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người kiên nhẫn. Đứng sẵn trong hàng, làm</text>
<text x="360.0" y="212.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">“tấm đệm” cho giá. Có thể rút lui bất cứ lúc</text>
<text x="360.0" y="229.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nào.</text>
<rect x="360.0" y="264.5" width="141.5" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
<text x="430.8" y="279.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">CUNG CẤP thanh khoản</text>
<rect x="664.0" y="96.0" width="306.0" height="196.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="678.0" y="120.0" font-size="13.5" font-weight="700" fill="#EA580C" text-anchor="start">Lệnh dừng (Stop)</text>
<text x="678.0" y="154.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">“Nếu giá chạm 101 thì MUA ngay cho tôi.”</text>
<text x="678.0" y="196.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh hẹn giờ. Ngủ im, không ai thấy. Khi giá</text>
<text x="678.0" y="212.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chạm mức hẹn, nó thức dậy thành lệnh thị</text>
<text x="678.0" y="229.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trường.</text>
<rect x="678.0" y="264.5" width="173.6" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<text x="764.8" y="279.0" font-size="10.5" font-weight="700" fill="#EA580C" text-anchor="middle">Thức dậy → LẤY thanh khoản</text>
<rect x="28.0" y="308.0" width="944.0" height="270.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="332.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Lệnh nằm quanh một vùng đi ngang như thế nào? (minh họa, không phải dữ liệu)</text>
<rect x="60.0" y="421.0" width="560.0" height="95.0" rx="2" fill="#F8FAFC"/>
<path d="M60.0,468.5 L106.7,434.3 L153.3,497.0 L200.0,449.5 L246.7,425.8 L293.3,504.6 L340.0,459.0 L386.7,424.8 L433.3,493.2 L480.0,444.8 L526.7,478.0 L573.3,454.2 L620.0,468.5" fill="none" stroke="#334155" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="60.0" y1="421.0" x2="620.0" y2="421.0" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="62.0" y="417.0" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="start">mép trên</text>
<line x1="60.0" y1="516.0" x2="620.0" y2="516.0" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="62.0" y="529.0" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="start">mép dưới</text>
<circle cx="355.6" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="386.7" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="417.8" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="448.9" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="480.0" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="511.1" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="542.2" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="573.3" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="604.4" cy="405.8" r="3.2" fill="#EA580C"/>
<circle cx="355.6" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="386.7" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="417.8" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="448.9" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="480.0" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="511.1" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="542.2" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="573.3" cy="531.2" r="3.2" fill="#EA580C"/>
<circle cx="604.4" cy="531.2" r="3.2" fill="#EA580C"/>
<text x="628.0" y="409.8" font-size="11" font-weight="700" fill="#EA580C" text-anchor="start">stop MUA (zzz)</text>
<text x="628.0" y="535.2" font-size="11" font-weight="700" fill="#EA580C" text-anchor="start">stop BÁN (zzz)</text>
<rect x="164.7" y="413.4" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="164.7" y="517.6" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="258.0" y="413.4" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="258.0" y="517.6" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="351.3" y="413.4" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="351.3" y="517.6" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="444.7" y="413.4" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<rect x="444.7" y="517.6" width="24.0" height="6.0" rx="0" fill="#2563EB" opacity="0.55"/>
<text x="69.3" y="399.8" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="start">limit bán xếp hàng</text>
<text x="69.3" y="545.2" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="start">limit mua xếp hàng</text>
<text x="760.0" y="374.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao lệnh hay tụ ở ngoài</text>
<text x="760.0" y="391.2" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">mép?</text>
<text x="760.0" y="414.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Mép càng rõ, càng nhiều người</text>
<text x="760.0" y="430.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">dùng nó làm mốc: đặt chốt lỗ ngay</text>
<text x="760.0" y="446.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">bên ngoài, hoặc đặt lệnh “mua khi</text>
<text x="760.0" y="462.5" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">phá” ngay bên ngoài.</text>
<text x="760.0" y="486.5" font-size="11.6" font-weight="400" fill="#0F766E" text-anchor="start">Nghiên cứu lệnh FX (Osler) cho</text>
<text x="760.0" y="502.5" font-size="11.6" font-weight="400" fill="#0F766E" text-anchor="start">thấy lệnh stop thường tụ ngay sau</text>
<text x="760.0" y="518.5" font-size="11.6" font-weight="400" fill="#0F766E" text-anchor="start">các số tròn.</text>
<rect x="28.0" y="592.0" width="944.0" height="48.6" rx="8" fill="#E6F7F4" stroke="#0F766E" stroke-width="1"/>
<text x="38.0" y="614.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chìa khóa: khi lệnh stop thức dậy, nó cần một người đứng bên kia để khớp. Nếu bên kia dày (nhiều limit) → giá đi được ít rồi dừng. Nếu bên kia mỏng → giá</text>
<text x="38.0" y="630.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trượt đi xa. Chart giá KHÔNG cho bạn thấy độ dày này.</text>
</svg>
