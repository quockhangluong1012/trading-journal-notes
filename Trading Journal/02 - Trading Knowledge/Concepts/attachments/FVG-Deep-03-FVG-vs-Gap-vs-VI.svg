<text x="670.0" y="411.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">nhưng bóng nến CHỒNG LÊN NHAU</text>
<text x="670.0" y="430.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ vùng giữa hai thân đã có</text>
