<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Cùng là 'khoảng trống trên chart', nhưng ba hiện tượng mô tả ba điều khác nhau về việc giá có thực sự được giao dịch trong vùng hay không.</text>
