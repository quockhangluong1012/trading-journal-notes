<text x="358.0" y="430.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ 100–102: CÓ giao dịch, nhưng</text>
<text x="358.0" y="449.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">   chỉ trong thời gian nến 2</text>
