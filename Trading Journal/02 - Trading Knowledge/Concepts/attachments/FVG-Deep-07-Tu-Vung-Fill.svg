<text x="30.0" y="450.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Quy ước v0.1 cho journal/backtest: touch = wick chạm proximal; fill depth = (proximal − cực trị) / size (0 → 1); full fill = depth ≥ 1;</text>
<text x="30.0" y="469.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">invalidated = một nến CÙNG KHUNG với FVG đóng cửa ngoài distal; inversion = sau invalidation, giá quay lại vùng từ phía bên kia và bị từ chối.</text>
<text x="30.0" y="488.0" font-size="10.4" font-weight="400" fill="#374151" text-anchor="start">Ghi tách: touched (y/n), max_depth, closed_beyond (y/n), bars_to_touch, bars_to_invalidation — đừng gộp thành 'respected' hay 'failed'.</text>
