<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Từ vựng sau khi FVG hình thành — sáu sự kiện KHÁC nhau, đừng dùng như từ đồng nghĩa</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Bullish FVG [100, 102]. Mỗi khung là một đường đi sau khi FVG được biết. Wick = chạm bằng bóng nến; close = giá đóng cửa của nến cùng khung với FVG.</text>
