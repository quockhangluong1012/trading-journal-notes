<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Look-ahead bias — năm cách thông tin tương lai lọt vào 'MSS' của bạn</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Trên random walk (không có edge), mỗi lỗi dưới đây tự tạo ra 'edge' dương. Nếu backtester của bạn cho MSS edge trên random walk → có rò rỉ.</text>
<rect x="26.0" y="84.0" width="520.0" height="420.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="42.0" y="108.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">BAD — rò rỉ tương lai</text>
<text x="42.0" y="134.0" font-size="10.6" font-weight="700" fill="#1F2937" text-anchor="start">1. Pivot cửa sổ trung tâm dùng tại i</text>
<text x="52.0" y="150.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">swing tại i 'biết' rằng n nến sau thấp hơn → nhãn sớm n nến (ví dụ shift(-n)</text>
<text x="52.0" y="164.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">trong pandas; thư viện smartmoneyconcepts dùng cửa sổ trung tâm)</text>
<text x="42.0" y="196.0" font-size="10.6" font-weight="700" fill="#1F2937" text-anchor="start">2. Xác nhận bằng close, khớp tại MỨC</text>
<text x="52.0" y="212.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">điều kiện 'close vượt mức' đã chứa đoạn đường từ mức tới close → E[R] +0.26R</text>
<text x="52.0" y="226.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">ảo</text>
<text x="42.0" y="258.0" font-size="10.6" font-weight="700" fill="#1F2937" text-anchor="start">3. Lọc bằng sự kiện sau ('BOS kế tiếp' ≈ G3), vào tại MSS</text>
<text x="52.0" y="274.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">chỉ giữ MSS 'đã thành công' → E[R] +0.62R ảo, win 53% vs null 33%</text>
<text x="42.0" y="306.0" font-size="10.6" font-weight="700" fill="#1F2937" text-anchor="start">4. Lọc 'giữ được k nến', vào tại MSS</text>
<text x="52.0" y="322.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">→ E[R] +0.66R ảo (k = 6)</text>
<text x="42.0" y="354.0" font-size="10.6" font-weight="700" fill="#1F2937" text-anchor="start">5. Chọn ví dụ đẹp sau khi biết kết cục</text>
<text x="52.0" y="370.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">bộ sưu tập screenshot = mẫu bị chọn theo kết quả; 'n mẫu thắng' không ước</text>
<text x="52.0" y="384.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">lượng được gì</text>
<rect x="560.0" y="84.0" width="394.0" height="420.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="576.0" y="108.0" font-size="13" font-weight="800" fill="#15803D" text-anchor="start">GOOD — thứ tự thời gian bắt buộc</text>
<rect x="580.0" y="121.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="140.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Swing hình thành (nến i)</text>
<line x1="757.0" y1="151.0" x2="757.0" y2="161.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="165.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="184.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Swing được xác nhận (i + n) → known_at</text>
<line x1="757.0" y1="195.0" x2="757.0" y2="205.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="209.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="228.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Mức tham chiếu sẵn sàng (&gt; known_at)</text>
<line x1="757.0" y1="239.0" x2="757.0" y2="249.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="253.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="272.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Giá tấn công mức</text>
<line x1="757.0" y1="283.0" x2="757.0" y2="293.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="297.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="316.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Close vượt mức (t) → G0/G1</text>
<line x1="757.0" y1="327.0" x2="757.0" y2="337.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="341.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="360.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Vào lệnh tại giá có thể khớp ở t / t+1</text>
<line x1="757.0" y1="371.0" x2="757.0" y2="381.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="385.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="404.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">G2/G3 được ghi THÊM, không sửa nhãn t</text>
<line x1="757.0" y1="415.0" x2="757.0" y2="425.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="580.0" y="429.0" width="354.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="757.0" y="448.0" font-size="10.2" font-weight="600" fill="#15803D" text-anchor="middle">Kết cục đo từ giá vào thật</text>
<rect x="26.0" y="516.0" width="928.0" height="108.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="538.0" font-size="10.1" font-weight="700" fill="#334155" text-anchor="start">Kiểm tra rò rỉ bắt buộc trước mọi backtest MSS (RULE-MSS-012):</text>
<text x="42.0" y="555.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">1) Chạy đúng code đó trên random walk: E[R] phải ≈ 0 (V0 trung thực: -0.004R ± 0.012).   2) Mỗi nhãn có known_at; assert known_at ≤ thời điểm dùng.</text>
<text x="42.0" y="572.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">3) Fill tại giá khả thi (close t, open t+1, hoặc limit đã đặt TRƯỚC) + spread/slippage.   4) Không lọc bằng biến tính sau thời điểm vào lệnh.</text>
<text x="42.0" y="589.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">5) Tập ví dụ phải là TẤT CẢ sự kiện thỏa định nghĩa trong khoảng thời gian, không phải những cái nhớ được. [MSS-Sim-03]</text>
</svg>