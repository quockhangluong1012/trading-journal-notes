<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="698.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Chart nào cũng đầy vùng thất bại. Năm câu hỏi để chọn Breaker đáng chờ</text>
<rect x="835.6" y="23.0" width="136.4" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="903.8" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">KHUNG QUYẾT ĐỊNH</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Không chấm điểm, không cộng trừ. Đi từ trên xuống: câu nào trả lời “không” thì dừng ở đó. Qua đủ năm câu mới đáng đặt cảnh báo.</text>
<rect x="28.0" y="96.5" width="560.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="52.0" cy="121.5" r="11.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="125.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="74.0" y="126.5" font-size="13.2" font-weight="700" fill="#111827">Có cùng hướng với bối cảnh khung lớn không?</text>
<text x="74.0" y="148.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="73.0,575.0">D1/H1: bias, DOL. Bullish Breaker khi khung lớn đang hướng lên.</text>
<line x1="590.0" y1="136.5" x2="634.8" y2="136.5" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/>
<polygon points="640.0,136.5 634.2,140.4 634.2,132.6" fill="#B91C1C"/>
<text x="615.0" y="128.5" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">không</text>
<rect x="644.0" y="100.5" width="328.0" height="72.0" rx="10" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1.2"/>
<text x="658.0" y="124.5" font-size="12" font-weight="700" fill="#B91C1C">BỎ QUA</text>
<text x="658.0" y="144.5" font-size="11.4" font-weight="400" fill="#111827" data-bx="657.0,959.0">Ngược khung lớn: chỉ ghi chú, không lập kế hoạch.</text>
<line x1="308.0" y1="177.5" x2="308.0" y2="187.0" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
<polygon points="308.0,191.5 304.7,186.5 311.3,186.5" fill="#15803D"/>
<text x="320.0" y="189.5" font-size="10.5" font-weight="700" fill="#15803D">có</text>
<rect x="28.0" y="192.5" width="560.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="52.0" cy="217.5" r="11.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="221.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="74.0" y="222.5" font-size="13.2" font-weight="700" fill="#111827">Swing bị phá có quan trọng không?</text>
<text x="74.0" y="244.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="73.0,575.0">Đỉnh/đáy được bảo vệ của khung đó — hay chỉ là một gợn nhỏ bên trong?</text>
<line x1="590.0" y1="232.5" x2="634.8" y2="232.5" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<polygon points="640.0,232.5 634.2,236.4 634.2,228.6" fill="#B45309"/>
<text x="615.0" y="224.5" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">không</text>
<rect x="644.0" y="196.5" width="328.0" height="72.0" rx="10" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1.2"/>
<text x="658.0" y="220.5" font-size="12" font-weight="700" fill="#B45309">HẠ ƯU TIÊN</text>
<text x="658.0" y="240.5" font-size="11.4" font-weight="400" fill="#111827" data-bx="657.0,959.0">Gợn nhỏ: Breaker “nội bộ”, dễ bị cuốn trôi.</text>
<line x1="308.0" y1="273.5" x2="308.0" y2="283.0" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
<polygon points="308.0,287.5 304.7,282.5 311.3,282.5" fill="#15803D"/>
<text x="320.0" y="285.5" font-size="10.5" font-weight="700" fill="#15803D">có</text>
<rect x="28.0" y="288.5" width="560.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="52.0" cy="313.5" r="11.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="317.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="74.0" y="318.5" font-size="13.2" font-weight="700" fill="#111827">Trước cú phá có lấy một túi liquidity đáng kể không?</text>
<text x="74.0" y="340.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="73.0,575.0">Đỉnh/đáy ngày, phiên, đỉnh/đáy bằng nhau… hay chỉ một đáy vô danh?</text>
<line x1="590.0" y1="328.5" x2="634.8" y2="328.5" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<polygon points="640.0,328.5 634.2,332.4 634.2,324.6" fill="#B45309"/>
<text x="615.0" y="320.5" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">không</text>
<rect x="644.0" y="292.5" width="328.0" height="72.0" rx="10" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1.2"/>
<text x="658.0" y="316.5" font-size="12" font-weight="700" fill="#B45309">HẠ ƯU TIÊN</text>
<text x="658.0" y="336.5" font-size="11.4" font-weight="400" fill="#111827" data-bx="657.0,959.0">Túi nhỏ: đủ định nghĩa, thiếu câu chuyện.</text>
<line x1="308.0" y1="369.5" x2="308.0" y2="379.0" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
<polygon points="308.0,383.5 304.7,378.5 311.3,378.5" fill="#15803D"/>
<text x="320.0" y="381.5" font-size="10.5" font-weight="700" fill="#15803D">có</text>
<rect x="28.0" y="384.5" width="560.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="52.0" cy="409.5" r="11.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="413.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="74.0" y="414.5" font-size="13.2" font-weight="700" fill="#111827">Cú phá có dứt khoát không?</text>
<text x="74.0" y="436.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="73.0,575.0">Thân dài, ít nến, đóng xa swing. Có thể kèm FVG.</text>
<line x1="590.0" y1="424.5" x2="634.8" y2="424.5" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<polygon points="640.0,424.5 634.2,428.4 634.2,420.6" fill="#B45309"/>
<text x="615.0" y="416.5" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">không</text>
<rect x="644.0" y="388.5" width="328.0" height="72.0" rx="10" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1.2"/>
<text x="658.0" y="412.5" font-size="12" font-weight="700" fill="#B45309">HẠ ƯU TIÊN</text>
<text x="658.0" y="432.5" font-size="11.4" font-weight="400" fill="#111827" data-bx="657.0,959.0">Phá lê lết: hay bị kéo ngược lại.</text>
<line x1="308.0" y1="465.5" x2="308.0" y2="475.0" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
<polygon points="308.0,479.5 304.7,474.5 311.3,474.5" fill="#15803D"/>
<text x="320.0" y="477.5" font-size="10.5" font-weight="700" fill="#15803D">có</text>
<rect x="28.0" y="480.5" width="560.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="52.0" cy="505.5" r="11.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="509.8" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="74.0" y="510.5" font-size="13.2" font-weight="700" fill="#111827">Vùng còn mới và còn chỗ chạy không?</text>
<text x="74.0" y="532.5" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="73.0,575.0">Chưa bị chạm; mục tiêu chưa đạt; khoảng tới mục tiêu đủ lớn so với mức dừng.</text>
<line x1="590.0" y1="520.5" x2="634.8" y2="520.5" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/>
<polygon points="640.0,520.5 634.2,524.4 634.2,516.6" fill="#B91C1C"/>
<text x="615.0" y="512.5" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">không</text>
<rect x="644.0" y="484.5" width="328.0" height="72.0" rx="10" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1.2"/>
<text x="658.0" y="508.5" font-size="12" font-weight="700" fill="#B91C1C">BỎ QUA</text>
<text x="658.0" y="528.5" font-size="11.4" font-weight="400" fill="#111827" data-bx="657.0,959.0">Đã chạm nhiều lần / hết chỗ chạy: hết giá trị.</text>
<line x1="308.0" y1="561.5" x2="308.0" y2="571.0" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
<polygon points="308.0,575.5 304.7,570.5 311.3,570.5" fill="#15803D"/>
<rect x="28.0" y="576.5" width="944.0" height="58.0" rx="10" fill="#15803D" fill-opacity="0.08" stroke="#15803D" stroke-width="1.5"/>
<text x="48.0" y="601.5" font-size="13.5" font-weight="700" fill="#15803D">BREAKER ĐÁNG CHỜ</text>
<text x="48.0" y="621.5" font-size="11.8" font-weight="400" fill="#111827">Đặt cảnh báo ở mép gần. Khi giá tới: xuống khung nhỏ tìm sweep → MSS → displacement → FVG. Không có chuỗi đó thì không có lệnh.</text>
<text x="28.0" y="667.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">“Hạ ưu tiên” không phải “loại”: bạn vẫn có thể theo dõi, nhưng ghi rõ điểm yếu để sau này biết nhóm nào thật sự kém hơn. Toàn bộ khung này là [GIẢ THUYẾT]</text>
<text x="28.0" y="684.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">cần backtest.</text>
