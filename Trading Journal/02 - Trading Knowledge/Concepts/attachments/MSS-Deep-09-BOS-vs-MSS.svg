<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Nến phá (khung xanh) giống hệt nhau trong cả hai panel. Nhãn không nằm trong nến; nó nằm trong trạng thái cấu trúc mà thuật toán đang giữ.</text>
