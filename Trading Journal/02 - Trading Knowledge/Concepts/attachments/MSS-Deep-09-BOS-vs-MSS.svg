<text x="42.0" y="477.0" font-size="10.2" font-weight="700" fill="#334155" text-anchor="start">label = f(cú phá, trạng thái trước, lớp tham chiếu, thuật toán swing, quy tắc close/wick)</text>
<text x="42.0" y="493.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• BOS và MSS không khác nhau ở cách giá chạy qua mức; chúng khác nhau ở việc cú phá XÁC NHẬN hay PHỦ ĐỊNH trạng thái đang có.</text>
<text x="42.0" y="509.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Vì vậy câu 'MSS = đảo chiều, BOS = tiếp diễn' chỉ đúng ở LỚP và KHUNG nơi trạng thái được định nghĩa (MSS M5 có thể là tiếp diễn H1).</text>
<text x="42.0" y="525.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• Trên random walk ~50% số lần phá (lớp internal) là MSS (MSS-Sim-01): con số đó là tính chất của thuật toán, không phải của 'smart money'.</text>
