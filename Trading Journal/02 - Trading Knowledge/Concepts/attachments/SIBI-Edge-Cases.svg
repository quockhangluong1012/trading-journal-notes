<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Case đắt giá: SIBI nến tin bị fill ngay + Inversion nhầm lẫn</text>
  <text x="40" y="62" font-size="15" fill="#94a3b8">Hai bẫy khiến trader nhầm vai trò SIBI ngay cả khi đã hiểu đúng lý thuyết</text>

  <!-- Panel A: SIBI formed on news candle gets filled instantly -->
  <rect x="40" y="90" width="540" height="440" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="60" y="118" font-size="17" font-weight="bold" fill="#e2e8f0">A. SIBI hình thành trong nến CPI bị fill ngay lập tức</text>

  <line x1="80" y1="380" x2="80" y2="300" stroke="#22c55e" stroke-width="2"/>
  <rect x="68" y="315" width="24" height="65" fill="#22c55e"/>
  <text x="55" y="400" font-size="11" fill="#94a3b8">C1 trước tin</text>

  <line x1="150" y1="330" x2="150" y2="180" stroke="#eab308" stroke-width="3.5"/>
  <rect x="136" y="200" width="28" height="130" fill="#eab308"/>
  <text x="110" y="170" font-size="12" fill="#eab308">C2 = nến CPI 08:30 (displacement cực mạnh)</text>

  <line x1="220" y1="200" x2="220" y2="150" stroke="#22c55e" stroke-width="2"/>
  <rect x="208" y="155" width="24" height="45" fill="#22c55e"/>
  <text x="200" y="140" font-size="11" fill="#94a3b8">C3</text>

  <rect x="90" y="200" width="120" height="45" fill="#22c55e" opacity="0.25"/>
  <text x="95" y="260" font-size="12" fill="#22c55e">SIBI "giả" 5 phút sau tin</text>

  <!-- immediate fill -->
  <line x1="280" y1="180" x2="280" y2="260" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="268" y="190" width="24" height="70" fill="#ef4444"/>
  <text x="300" y="220" font-size="12" fill="#ef4444">08:34 giá quay lại fill hết SIBI</text>
  <text x="300" y="240" font-size="11" fill="#94a3b8">chỉ 4 phút sau khi hình thành!</text>

  <text x="60" y="460" font-size="13" fill="#e2e8f0" font-weight="bold">Vì sao bẫy được:</text>
  <text x="60" y="482" font-size="12" fill="#94a3b8">Trader thấy SIBI "sạch" ngay sau tin và coi là POI hỗ trợ mạnh,</text>
  <text x="60" y="502" font-size="12" fill="#94a3b8">không biết rằng volatility tin tức khiến giá quay đầu test lại</text>
  <text x="60" y="522" font-size="12" fill="#94a3b8">gần như ngay lập tức — không phải "hỗ trợ được tôn trọng" thật.</text>

  <text x="60" y="550" font-size="13" fill="#e2e8f0" font-weight="bold">Cách nhận diện sớm:</text>
  <text x="60" y="572" font-size="12" fill="#94a3b8">SIBI hình thành trong ±5 phút quanh giờ tin tier-1.</text>

  <text x="60" y="600" font-size="13" fill="#e2e8f0" font-weight="bold">Cách xử lý:</text>
  <text x="60" y="622" font-size="12" fill="#94a3b8">Hạ độ tin cậy SIBI hình thành quanh tin; chờ ít nhất 15-30</text>
  <text x="60" y="642" font-size="12" fill="#94a3b8">phút ổn định trước khi coi CE của nó là điểm entry đáng tin.</text>

  <!-- Panel B: Inversion confusion -->
  <rect x="620" y="90" width="540" height="440" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="640" y="118" font-size="17" font-weight="bold" fill="#e2e8f0">B. SIBI bị đóng cửa xuyên qua → nhầm vẫn coi là hỗ trợ</text>

  <line x1="660" y1="260" x2="1120" y2="260" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1000" y="255" font-size="11" fill="#22c55e">top SIBI (low C3)</text>
  <line x1="660" y1="320" x2="1120" y2="320" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1000" y="335" font-size="11" fill="#22c55e">bottom SIBI (high C1)</text>

  <rect x="660" y="260" width="460" height="60" fill="#22c55e" opacity="0.15"/>

  <!-- price closes through -->
  <line x1="750" y1="230" x2="750" y2="380" stroke="#ef4444" stroke-width="3"/>
  <rect x="738" y="240" width="24" height="130" fill="#ef4444"/>
  <text x="700" y="400" font-size="12" fill="#ef4444">Đóng cửa XUYÊN QUA hết SIBI</text>
  <text x="700" y="418" font-size="11" fill="#94a3b8">(không phải chạm rồi bật)</text>

  <!-- retest as resistance now (inverted) -->
  <line x1="850" y1="380" x2="850" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <rect x="838" y="310" width="24" height="60" fill="#94a3b8"/>
  <polygon points="850,300 835,325 865,325" fill="#f97316"/>
  <text x="870" y="310" font-size="12" fill="#f97316">Retest → bị TỪ CHỐI (giờ là kháng cự)</text>

  <text x="640" y="460" font-size="13" fill="#e2e8f0" font-weight="bold">Vì sao bẫy được:</text>
  <text x="640" y="482" font-size="12" fill="#94a3b8">Trader vẫn Long tại vùng SIBI cũ vì nhớ "đây là hỗ trợ",</text>
  <text x="640" y="502" font-size="12" fill="#94a3b8">không nhận ra giá đã đóng cửa xuyên qua → SIBI đã INVERT</text>
  <text x="640" y="522" font-size="12" fill="#94a3b8">thành kháng cự (IFVG) theo đúng cơ chế Inverse FVG.</text>

  <text x="640" y="550" font-size="13" fill="#e2e8f0" font-weight="bold">Cách nhận diện sớm:</text>
  <text x="640" y="572" font-size="12" fill="#94a3b8">Theo dõi trạng thái fill: nếu có nến ĐÓNG CỬA bên dưới</text>
  <text x="640" y="592" font-size="12" fill="#94a3b8">bottom của SIBI, vai trò đã đảo — không còn là hỗ trợ.</text>

  <text x="640" y="620" font-size="13" fill="#e2e8f0" font-weight="bold">Cách xử lý:</text>
  <text x="640" y="642" font-size="12" fill="#94a3b8">Áp dụng logic Inverse FVG (IFVG): SIBI bị xuyên → coi là</text>
  <text x="640" y="662" font-size="12" fill="#94a3b8">kháng cự tiềm năng khi retest, không còn là hỗ trợ cũ.</text>
</svg>
