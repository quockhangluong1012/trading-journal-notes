<text x="954.6" y="337.8" font-size="9.5" font-weight="700" fill="#0F9D74" text-anchor="end">mép dưới FVG xanh: chưa bị đóng nến xuyên</text>
<text x="924.2" y="258.5" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<rect x="28.0" y="448.0" width="466.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
<text x="40.0" y="472.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Leg giảm xuyên qua và ĐÓNG dưới FVG xanh → có IFVG. Nhưng leg đó không để</text>
<text x="40.0" y="487.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">lại FVG đỏ nào chồng lên → không có BPR.</text>
<rect x="506.0" y="448.0" width="466.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="518.0" y="472.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Leg giảm nhanh, để lại FVG đỏ đè lên NỬA TRÊN FVG xanh → có BPR. Nhưng giá</text>
<text x="518.0" y="487.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chưa từng đóng nến dưới FVG xanh → chưa có IFVG.</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Hệ quả: đừng viết “BPR là một loại IFVG” hay “IFVG hoàn chỉnh nhất”. Hãy ghi riêng hai nhãn trong journal để biết nhãn nào mới thật sự liên quan tới kết quả.</text>
