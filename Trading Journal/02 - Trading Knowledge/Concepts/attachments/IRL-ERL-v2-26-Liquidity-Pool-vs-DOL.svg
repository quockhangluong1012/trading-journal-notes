<text x="584.0" y="190.3" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end">đỉnh range — ERL trên</text>
<line x1="59.9" y1="138.3" x2="616.0" y2="138.3" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6,4"/>
