<rect x="923.4" y="22" width="48.6" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="947.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DOL</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity pool ≠ Draw on Liquidity: có nhiều pool, nhưng DOL là MỘT giả thuyết bạn chọn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Pool = nơi lệnh chờ CÓ THỂ nằm (dữ kiện về vị trí). DOL = nơi bạn KỲ VỌNG giá hướng tới trong một khoảng thời gian (giả thuyết). Pool gần nhất không phải lúc</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nào cũng là DOL.</text>
<rect x="28.0" y="104.0" width="600.0" height="470.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
