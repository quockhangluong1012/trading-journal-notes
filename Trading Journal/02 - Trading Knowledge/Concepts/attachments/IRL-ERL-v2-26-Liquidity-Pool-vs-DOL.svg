<circle cx="417.4" cy="196.3" r="7.15" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
<circle cx="417.4" cy="196.3" r="2.34" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="435.4" y="216.3" font-size="11" font-weight="700" fill="#059669" text-anchor="start">DOL đã chọn: B</text>
<rect x="644.0" y="104.0" width="328.0" height="470.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="658.0" y="126.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Từ nhiều pool đến một DOL</text>
<circle cx="668.0" cy="145.0" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="149.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="684.0" y="149.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="274.0">Pool nào CÒN (chưa bị lấy)?</text>
<circle cx="668.0" cy="175.0" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="179.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="684.0" y="179.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="274.0">Bias khung lớn ủng hộ hướng nào?</text>
<circle cx="668.0" cy="205.0" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="209.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="684.0" y="209.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="274.0">Giá đang ở premium hay discount?</text>
<circle cx="668.0" cy="235.0" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="239.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="684.0" y="239.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="274.0">Có IRL nào chặn đường không (F, A)?</text>
<circle cx="668.0" cy="265.0" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="269.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="684.0" y="269.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="274.0">Phía ngược lại có pool “đối thủ” gần không (D)?</text>
<circle cx="668.0" cy="295.0" r="9" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="668.0" y="299.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="684.0" y="299.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="274.0">Trong khoảng thời gian nào? (phiên, ngày, tuần)</text>
<text x="660.0" y="330.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="296.0">Ở đây: giá đang ở discount, bias tăng ⇒ chọn B làm</text>
<text x="660.0" y="346.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="296.0">DOL; A là trạm trung gian (T1), D là “đối thủ” — nếu D</text>
<text x="660.0" y="362.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="296.0">bị lấy trước, giả thuyết yếu đi.</text>
<text x="660.0" y="414.0" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="296.0">DOL có thể là IRL: ngay sau khi B bị quét, DOL gần</text>
<text x="660.0" y="430.3" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="296.0">thường là F hoặc EQ bên trong.</text>
<rect x="28.0" y="588.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="612.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Phân biệt năm chữ: liquidity pool (vị trí) · liquidity target (đích của một lệnh cụ thể) · nearest liquidity (gần nhất) · major liquidity target (đích lớn của khung lớn) ·</text>
<text x="42.0" y="628.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">DOL (giả thuyết hướng đi). Chi tiết ở các note DOL 52/56/58.</text>
