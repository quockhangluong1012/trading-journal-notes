<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="884.8" y="22" width="87.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">PHẢN ỨNG</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao giá CÓ THỂ phản ứng ở BPR — và vì sao CÓ THỂ không</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ: Bearish BPR, giá quay lên chạm vùng. Mỗi lý do được gắn nhãn: cơ chế có cơ sở, hay diễn giải hợp lý nhưng chưa chứng minh.</text>
<text x="28.0" y="90.0" font-size="13.5" font-weight="700" fill="#0F7A5A" text-anchor="start">CÓ THỂ phản ứng vì…</text>
<text x="506.0" y="90.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">CÓ THỂ không phản ứng vì…</text>
<rect x="28.0" y="102.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="40.0" y="126.2" font-size="12.2" font-weight="700" fill="#0F7A5A" text-anchor="start">[CƠ CHẾ] Lệnh chờ ở mức dễ thấy</text>
<text x="40.0" y="146.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nhiều trader vẽ cùng vùng và đặt lệnh limit bán ở đó. Khi giá chạm, các lệnh này</text>
<text x="40.0" y="161.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">khớp và có thể tạo lực cản ngắn hạn.</text>
<rect x="28.0" y="200.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
<text x="40.0" y="224.2" font-size="12.2" font-weight="700" fill="#B45309" text-anchor="start">[DIỄN GIẢI] Người mua bị kẹt muốn hòa vốn</text>
<text x="40.0" y="244.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Ai mua trong leg tăng giờ đang lỗ. Khi giá về lại giá mua, một số người bán ra để</text>
<text x="40.0" y="259.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">thoát → thêm lực bán.</text>
<rect x="28.0" y="298.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
<text x="40.0" y="322.2" font-size="12.2" font-weight="700" fill="#B45309" text-anchor="start">[DIỄN GIẢI] Người bán đúng muốn bán thêm</text>
<text x="40.0" y="342.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Ai bán trong leg giảm có thể bán thêm khi giá hồi đúng về chỗ họ đã vào lệnh.</text>
<rect x="28.0" y="396.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="40.0" y="420.2" font-size="12.2" font-weight="700" fill="#0F7A5A" text-anchor="start">[CƠ CHẾ] Bối cảnh lớn cùng hướng</text>
<text x="40.0" y="440.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Nếu khung lớn đang đi xuống, “phản ứng” chỉ là giá đi tiếp con đường lớn. BPR là</text>
<text x="40.0" y="455.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">CHỖ, không phải NGUYÊN NHÂN.</text>
<rect x="506.0" y="102.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.3"/>
<text x="518.0" y="126.2" font-size="12.2" font-weight="700" fill="#B91C1C" text-anchor="start">Bối cảnh lớn ngược hướng</text>
<text x="518.0" y="146.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Khung lớn đang kéo giá lên → lực mua lớn hơn mọi lệnh chờ ở BPR.</text>
<rect x="506.0" y="200.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.3"/>
<text x="518.0" y="224.2" font-size="12.2" font-weight="700" fill="#B91C1C" text-anchor="start">Tin tức, phiên mỏng thanh khoản</text>
<text x="518.0" y="244.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Biến động bất thường nuốt mất vùng nhỏ; lệnh chờ bị rút trước tin.</text>
<rect x="506.0" y="298.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.3"/>
<text x="518.0" y="322.2" font-size="12.2" font-weight="700" fill="#B91C1C" text-anchor="start">Vùng đã bị chạm nhiều lần</text>
<text x="518.0" y="342.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh chờ ở đó đã khớp hoặc đã hủy. Lần chạm sau ít “người đợi” hơn.</text>
<rect x="506.0" y="396.0" width="466.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.3"/>
<text x="518.0" y="420.2" font-size="12.2" font-weight="700" fill="#B91C1C" text-anchor="start">Vùng quá nhỏ so với nhiễu</text>
<text x="518.0" y="440.1" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">Dao động bình thường của nến đã lớn hơn cả BPR → phản ứng hay không đều là</text>
<text x="518.0" y="455.5" font-size="11.2" font-weight="400" fill="#1F2937" text-anchor="start">ngẫu nhiên.</text>
<rect x="28.0" y="496.0" width="944.0" height="84.0" rx="10" fill="#F3F4F6" stroke="#64748B" stroke-width="1.3"/>
<text x="40.0" y="520.5" font-size="12.5" font-weight="700" fill="#64748B" text-anchor="start">Cái bẫy “tỉ lệ nền” (base rate)</text>
<text x="40.0" y="540.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Giá hầu như lúc nào cũng khựng lại hay bật lên ở ĐÂU ĐÓ. Thấy giá phản ứng ở BPR chưa chứng minh BPR có tác dụng. Câu hỏi đúng: phản ứng ở BPR có thường hơn, mạnh</text>
<text x="40.0" y="556.3" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">hơn một vùng cùng kích thước chọn bất kỳ không? → BACKTEST REQUIRED.</text>
<text x="28.0" y="620.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Không có lý do nào ở trên chứng minh “tổ chức cố tình bảo vệ BPR”. Chart chỉ cho thấy giá làm gì, không cho thấy ai làm và vì sao.</text>
</svg>
