<svg viewBox="0 0 980 600" width="980" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Sổ lệnh: Bid, Ask, Spread — giao dịch xảy ra khi một bên CHẤP NHẬN giá của bên kia</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">TẦNG 2. Người bán xếp hàng phía trên (ASK), người mua xếp hàng phía dưới (BID). Khoảng trống ở giữa = spread.</text>
<rect x="26.0" y="74.0" width="430.0" height="470.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="98.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Sổ lệnh (ví dụ đơn giản)</text>
<text x="130.0" y="122.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">BID (người mua chờ)</text>
<text x="340.0" y="122.0" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="middle">ASK (người bán chờ)</text>
<rect x="218.0" y="134.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="153.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">104</text>
<rect x="266.0" y="136.0" width="152.0" height="26.0" rx="2" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.1"/>
<text x="424.0" y="153.0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">400</text>
<rect x="218.0" y="168.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="187.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">103</text>
<rect x="266.0" y="170.0" width="57.0" height="26.0" rx="2" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.1"/>
<text x="329.0" y="187.0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">150</text>
<rect x="218.0" y="202.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="221.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">102</text>
<rect x="266.0" y="204.0" width="114.0" height="26.0" rx="2" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.1"/>
<text x="386.0" y="221.0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">300</text>
<rect x="218.0" y="236.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="255.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">101</text>
<rect x="266.0" y="238.0" width="76.0" height="26.0" rx="2" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.1"/>
<text x="348.0" y="255.0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">200</text>
<rect x="218.0" y="270.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="289.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">100</text>
<rect x="119.0" y="272.0" width="95.0" height="26.0" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
<text x="113.0" y="289.0" font-size="11" font-weight="600" fill="#15803D" text-anchor="end">250</text>
<rect x="218.0" y="304.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="323.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">99</text>
<rect x="145.6" y="306.0" width="68.4" height="26.0" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
<text x="139.6" y="323.0" font-size="11" font-weight="600" fill="#15803D" text-anchor="end">180</text>
<rect x="218.0" y="338.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="357.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">98</text>
<rect x="100.0" y="340.0" width="114.0" height="26.0" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
<text x="94.0" y="357.0" font-size="11" font-weight="600" fill="#15803D" text-anchor="end">300</text>
<rect x="218.0" y="372.0" width="44.0" height="30.0" rx="3" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="240.0" y="391.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">97</text>
<rect x="168.4" y="374.0" width="45.6" height="26.0" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
<text x="162.4" y="391.0" font-size="11" font-weight="600" fill="#15803D" text-anchor="end">120</text>
<rect x="40.0" y="418.0" width="402.0" height="112.0" rx="6" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="52.0" y="440.0" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="start">Best Ask = 101: rẻ nhất mà một người bán CHỊU bán.</text>
<text x="52.0" y="456.7" font-size="11.5" font-weight="600" fill="#15803D" text-anchor="start">Best Bid = 100: cao nhất mà một người mua CHỊU mua.</text>
<text x="52.0" y="473.4" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">Spread = 101 − 100 = 1.</text>
<text x="52.0" y="490.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ở 100/101 hai bên chưa đồng ý → CHƯA có giao dịch.</text>
<text x="52.0" y="506.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">"Giá" trên chart = giao dịch cuối (hoặc bid/ask/mid tùy feed).</text>
<rect x="472.0" y="74.0" width="482.0" height="112.0" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<rect x="472.0" y="74.0" width="482.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.4"/>
<rect x="473.0" y="94.0" width="480.0" height="10.0" rx="0" fill="#F3F4F6" stroke="#F3F4F6" stroke-width="0"/>
<text x="484.0" y="94.0" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">1. Không ai nhượng bộ</text>
<text x="484.0" y="124.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người mua chờ ở 100, người bán chờ ở 101.</text>
<text x="484.0" y="141.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không ai vượt spread → không giao dịch.</text>
<text x="484.0" y="158.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá trên chart gần như đứng yên.</text>
<rect x="472.0" y="198.0" width="482.0" height="112.0" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.4"/>
<rect x="472.0" y="198.0" width="482.0" height="30.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<rect x="473.0" y="218.0" width="480.0" height="10.0" rx="0" fill="#DCFCE7" stroke="#DCFCE7" stroke-width="0"/>
<text x="484.0" y="218.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">2. Một người mua sốt ruột</text>
<text x="484.0" y="248.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Gửi MARKET BUY 200 → khớp 200 lô @101.</text>
<text x="484.0" y="265.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giao dịch cuối = 101 → "giá tăng" 1.</text>
<text x="484.0" y="282.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ask 101 đã hết → best ask mới = 102.</text>
<rect x="472.0" y="322.0" width="482.0" height="112.0" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4"/>
<rect x="472.0" y="322.0" width="482.0" height="30.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
<rect x="473.0" y="342.0" width="480.0" height="10.0" rx="0" fill="#FEE2E2" stroke="#FEE2E2" stroke-width="0"/>
<text x="484.0" y="342.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">3. Một người bán sốt ruột</text>
<text x="484.0" y="372.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Gửi MARKET SELL 250 → khớp 250 lô @100.</text>
<text x="484.0" y="389.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giao dịch cuối = 100 → "giá giảm".</text>
<text x="484.0" y="406.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bid 100 đã hết → best bid mới = 99.</text>
<rect x="472.0" y="446.0" width="482.0" height="98.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<text x="486.0" y="468.0" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="start">Lưu ý thực tế:</text>
<text x="486.0" y="484.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• Futures (NQ, ES) có sổ lệnh trung tâm trên sàn CME.</text>
<text x="486.0" y="501.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">• FX spot là thị trường OTC phi tập trung — KHÔNG có một sổ lệnh</text>
<text x="486.0" y="518.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">  duy nhất. Nhưng logic "giao dịch = một bên chấp nhận giá bên kia"</text>
<text x="486.0" y="534.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">  vẫn đúng ở mọi nơi khớp lệnh (ECN, dealer, broker của bạn).</text>
<text x="26.0" y="584.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Câu then chốt: GIÁ THAY ĐỔI VÌ GIAO DỊCH CÓ THỂ XẢY RA Ở MỘT MỨC GIÁ MỚI — không phải vì giá "muốn" đi đâu.</text>
</svg>
