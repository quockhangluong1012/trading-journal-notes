<text x="524.0" y="416.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="523.0,955.0">Lệnh chờ mua mỏng hơn (có thể đã bị rút). Bán ăn xuyên 51 → kích hoạt</text>
<text x="524.0" y="434.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="523.0,955.0">các lệnh dừng lỗ bán bên dưới → chúng thành lệnh bán chủ động mới →</text>
<text x="524.0" y="451.6" font-size="12.2" font-weight="400" fill="#111827" data-bx="523.0,955.0">giá trượt qua nhiều mức rất nhanh: một nến thân to (displacement).</text>
<rect x="28.0" y="500.0" width="944.0" height="50.5" rx="8" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="500.0" width="4.0" height="50.5" rx="2" fill="#B91C1C"/>
<text x="42.0" y="520.2" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">Trên chart OHLC ta KHÔNG nhìn thấy bảng này. Ta chỉ thấy kết quả (giá đóng dưới 51, nến thân to). Câu “phe mua đã bỏ cuộc” là [INTERPRETATION]; “ai” đã</text>
<text x="42.0" y="537.2" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">bán và “vì sao” là [NOT ESTABLISHED].</text>
<text x="28.0" y="587.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cơ chế lệnh chờ / lệnh chủ động / lệnh dừng lỗ là [MARKET MECHANICS] được nghiên cứu học thuật ủng hộ (ví dụ Osler 2003 về lệnh dừng lỗ tụ quanh số tròn).</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Độ dày từng mức trong hình là minh họa.</text>
