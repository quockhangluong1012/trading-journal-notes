<text x="46.0" y="416.9" font-size="12.2" font-weight="400" fill="#111827" data-bx="45.0,477.0">Lệnh bán chủ động đến, ăn bớt lệnh chờ mua ở 53, 52… tới 51 thì gặp</text>
<text x="46.0" y="434.2" font-size="12.2" font-weight="400" fill="#111827" data-bx="45.0,477.0">một “bức tường” lệnh chờ mua dày. Bán không ăn hết → giá ngừng giảm</text>
<text x="46.0" y="451.6" font-size="12.2" font-weight="400" fill="#111827" data-bx="45.0,477.0">và bật lên. Ta thấy một HL.</text>
