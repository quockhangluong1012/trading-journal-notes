<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cơ chế: vì sao lần trước giá bật lên, còn lần này giá rơi xuyên qua?</text>
<rect x="829.5" y="23.0" width="142.5" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="900.7" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">MARKET MECHANICS</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Mô hình đơn giản hóa của sổ lệnh quanh một đáy. Thanh xanh = lệnh CHỜ MUA (bị động). Mũi tên đỏ = lệnh BÁN CHỦ ĐỘNG. Thanh tím = lệnh dừng</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">lỗ bán nằm dưới đáy.</text>
