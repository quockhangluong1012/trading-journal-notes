<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mitigation — từ vựng chính xác và tọa độ xuyên (penetration) để đo</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Quy ước tọa độ (theo 55 §12): 0 = proximal, 0.5 = giữa vùng, 1 = distal, &gt; 1 = bên ngoài. Mọi từ dưới đây phải quy về con số.</text>
<rect x="26.0" y="80.0" width="520.0" height="500.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="190.0" y="235.0" width="340.0" height="158.3" rx="2" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="1.3"/>
<line x1="160.0" y1="235.0" x2="530.0" y2="235.0" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
<text x="156.0" y="239.0" font-size="9.6" font-weight="700" fill="#1D4ED8" text-anchor="end">0 — proximal</text>
<line x1="160.0" y1="314.2" x2="530.0" y2="314.2" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
<text x="156.0" y="318.2" font-size="9.6" font-weight="700" fill="#1D4ED8" text-anchor="end">0.5 — giữa (MT/CE)</text>
<line x1="160.0" y1="393.3" x2="530.0" y2="393.3" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
<text x="156.0" y="397.3" font-size="9.6" font-weight="700" fill="#1D4ED8" text-anchor="end">1 — distal</text>
<line x1="160.0" y1="440.8" x2="530.0" y2="440.8" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 3"/>
<text x="156.0" y="444.8" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="end">1.3 — ngoài distal</text>
<line x1="220.0" y1="163.8" x2="220.0" y2="242.9" stroke="#16A34A" stroke-width="2.4"/>
<circle cx="220.0" cy="242.9" r="4" fill="#16A34A"/>
<text x="220.0" y="153.8" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">chạm (touch)</text>
<line x1="272.0" y1="163.8" x2="272.0" y2="314.2" stroke="#D97706" stroke-width="2.4"/>
<circle cx="272.0" cy="314.2" r="4" fill="#D97706"/>
<text x="272.0" y="137.8" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">xuyên 50%</text>
<line x1="324.0" y1="163.8" x2="324.0" y2="385.4" stroke="#D97706" stroke-width="2.4"/>
<circle cx="324.0" cy="385.4" r="4" fill="#D97706"/>
<text x="324.0" y="153.8" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">xuyên gần trọn</text>
<line x1="376.0" y1="163.8" x2="376.0" y2="440.8" stroke="#7C3AED" stroke-width="2.4"/>
<circle cx="376.0" cy="440.8" r="4" fill="#7C3AED"/>
<rect x="369.0" y="353.8" width="14.0" height="23.8" rx="1" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="376.0" y="137.8" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">râu xuyên, close trong</text>
<line x1="432.0" y1="163.8" x2="432.0" y2="440.8" stroke="#DC2626" stroke-width="2.4"/>
<circle cx="432.0" cy="440.8" r="4" fill="#DC2626"/>
<rect x="425.0" y="393.3" width="14.0" height="28.5" rx="1" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<text x="432.0" y="153.8" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">close ngoài 1 nến</text>
<line x1="494.0" y1="163.8" x2="494.0" y2="464.6" stroke="#DC2626" stroke-width="2.4"/>
<circle cx="494.0" cy="464.6" r="4" fill="#DC2626"/>
<rect x="472.0" y="412.3" width="12.0" height="31.7" rx="1" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<rect x="488.0" y="412.3" width="12.0" height="31.7" rx="1" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<rect x="504.0" y="412.3" width="12.0" height="31.7" rx="1" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<text x="494.0" y="137.8" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">chấp nhận (k close)</text>
<text x="300.0" y="560.0" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">max_penetration và closes_outside_n là hai biến KHÁC NHAU — ghi cả hai.</text>
<rect x="560.0" y="92.0" width="394.0" height="74.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
<text x="572.0" y="112.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="start">Quay lại (return)</text>
<text x="572.0" y="130.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">giá chạm proximal (penetration ≥ 0) — chưa nói gì về kết</text>
<text x="572.0" y="144.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">cục.</text>
<rect x="560.0" y="174.0" width="394.0" height="74.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="572.0" y="194.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="start">Mitigate</text>
<text x="572.0" y="212.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">ICT: giá vào vùng 'để lệnh cũ được khớp/cân bằng'. Vận</text>
<text x="572.0" y="226.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">hành: penetration ≥ ngưỡng (vd 0.5) — KHAI BÁO.</text>
<rect x="560.0" y="256.0" width="394.0" height="74.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
<text x="572.0" y="276.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">Phản ứng (react)</text>
<text x="572.0" y="294.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">đạt proximal + x·ATR trước khi chạm distal − b·ATR (§46).</text>
<rect x="560.0" y="338.0" width="394.0" height="74.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="572.0" y="358.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="start">Xuyên tạm thời</text>
<text x="572.0" y="376.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">penetration &gt; 1 nhưng close quay về trong ≤ k nến</text>
<text x="572.0" y="390.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">(Scenario D/E của 55).</text>
<rect x="560.0" y="420.0" width="394.0" height="74.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="572.0" y="440.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">Vô hiệu (invalidate)</text>
<text x="572.0" y="458.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">≥ k close ngoài distal VÀ không reclaim; hoặc phá cấu trúc</text>
<text x="572.0" y="472.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">qua OB (§31).</text>
<rect x="560.0" y="502.0" width="394.0" height="74.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="572.0" y="522.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">Unmitigated / fresh</text>
<text x="572.0" y="540.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">chưa có lần chạm nào kể từ t_avail — 'tươi' là trạng thái,</text>
<text x="572.0" y="554.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">không phải chất lượng.</text>
</svg>