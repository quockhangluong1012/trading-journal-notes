<text x="574.0" y="530.0" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">#11</text>
<text x="525.3" y="135.5" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">so sánh độ dài</text>
<rect x="650.0" y="108.0" width="322.0" height="78.8" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="662.0" y="132.3" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">Thanh đỏ: cả chặng xuống</text>
<text x="662.0" y="154.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Từ vạch xuất phát tới chỗ thấp nhất. Đây là đoạn</text>
<text x="662.0" y="171.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đường mà chặng cũ đã “giao” xuống.</text>
<rect x="650.0" y="196.8" width="322.0" height="78.8" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<text x="662.0" y="221.1" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">Thanh xám — nến #10: “gần được”</text>
<text x="662.0" y="243.3" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Có lực mua, nhưng lúc chuông reo giá vẫn ở dưới</text>
<text x="662.0" y="260.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">vạch. Mới lấy lại một phần.</text>
<rect x="650.0" y="285.5" width="322.0" height="95.6" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="662.0" y="309.9" font-size="13" font-weight="700" fill="#059669" text-anchor="start">Thanh xanh — nến #11: CISD</text>
<text x="662.0" y="332.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lúc chuông reo giá đã ở trên vạch: mọi bước xuống</text>
<text x="662.0" y="348.9" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">của #6–#9 đã bị đi ngược lại. Delivery đã đổi sang</text>
<text x="662.0" y="365.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">lên (ở khung này).</text>
<rect x="650.0" y="391.1" width="322.0" height="78.8" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="662.0" y="415.4" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Không cần tính toán</text>
<text x="662.0" y="437.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ một câu có/không: “close của nến này có nằm</text>
<text x="662.0" y="454.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trên vạch xuất phát không?”.</text>
</svg>
