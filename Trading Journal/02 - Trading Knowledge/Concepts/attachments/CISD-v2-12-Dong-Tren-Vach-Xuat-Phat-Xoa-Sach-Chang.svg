<text x="612.0" y="188.3" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">vạch xuất phát (open #6)</text>
<text x="70.6" y="544.0" font-size="9.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">#5</text>
<text x="127.8" y="544.0" font-size="9.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">#6</text>
<text x="185.0" y="544.0" font-size="9.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">#7</text>
