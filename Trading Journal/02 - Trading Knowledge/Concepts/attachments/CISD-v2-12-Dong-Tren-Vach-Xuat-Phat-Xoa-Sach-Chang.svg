<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs></defs>
<rect x="1" y="1" width="998" height="558" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Đóng trên vạch xuất phát = cả chặng bị “xóa sạch”</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Hãy đo bằng mắt, không cần tính: chặng xuống đi từ vạch xuất phát tới đáy. Nến #10 chỉ lấy lại một phần. Nến #11 chốt sổ ở trên</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">vạch xuất phát → lấy lại toàn bộ.</text>
<rect x="884.8" y="22" width="87.2" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="928.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">TRỰC GIÁC</text>
<text x="28.0" y="548.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
