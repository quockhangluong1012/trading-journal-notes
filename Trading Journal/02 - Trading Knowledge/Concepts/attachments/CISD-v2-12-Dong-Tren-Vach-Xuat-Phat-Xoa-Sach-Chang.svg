<text x="413.8" y="544.0" font-size="9.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">#11</text>
<line x1="476.7" y1="193.3" x2="476.7" y2="493.5" stroke="#DC2626" stroke-width="4"/>
<line x1="469.7" y1="193.3" x2="483.7" y2="193.3" stroke="#DC2626" stroke-width="2"/>
