<line x1="525.3" y1="431.9" x2="525.3" y2="316.5" stroke="#9CA3AF" stroke-width="4"/>
<line x1="518.3" y1="431.9" x2="532.3" y2="431.9" stroke="#9CA3AF" stroke-width="2"/>
