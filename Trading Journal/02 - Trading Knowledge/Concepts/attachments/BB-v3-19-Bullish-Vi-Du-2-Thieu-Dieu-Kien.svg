<text x="656.0" y="142.5" font-size="12" font-weight="700" fill="#2563EB">Nến 3</text>
<text x="656.0" y="158.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Tạo ĐÁY CŨ.</text>
<text x="656.0" y="182.2" font-size="12" font-weight="700" fill="#2563EB">Nến 7</text>
<text x="656.0" y="198.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Nến tăng cuối cùng ở đỉnh giữa → vùng cam.</text>
<text x="656.0" y="222.0" font-size="12" font-weight="700" fill="#2563EB">Nến 8–11</text>
<text x="656.0" y="238.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá rơi nhưng DỪNG phía trên đáy cũ (tạo đáy cao</text>
<text x="656.0" y="254.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">hơn). Mắt xích 2 KHÔNG xảy ra.</text>
<text x="656.0" y="278.5" font-size="12" font-weight="700" fill="#2563EB">Nến 12–16</text>
<text x="656.0" y="294.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá tăng trở lại. Nến 16 đóng cửa trên đỉnh giữa.</text>
<text x="656.0" y="318.2" font-size="12" font-weight="700" fill="#2563EB">Nến 20</text>
<text x="656.0" y="334.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá hồi về vùng rồi bật lên — hành vi giống hệt một</text>
<text x="656.0" y="351.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="655.0,959.0">Breaker.</text>
<rect x="656.0" y="510.8" width="302.0" height="86.5" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
