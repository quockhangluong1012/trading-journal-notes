<text x="670.0" y="530.8" font-size="11.8" font-weight="700" fill="#B45309" data-bx="656.0,958.0">Thiếu mắt xích 2 → Mitigation Block</text>
<text x="670.0" y="550.6" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">Theo ICT đây là tên khác. Mức “sai” của ý tưởng</text>
<text x="670.0" y="567.3" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">nằm ở đáy cao hơn, không phải ở một đáy quét.</text>
<text x="670.0" y="584.1" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">Ghi đúng tên để sau này so sánh được hai loại.</text>
