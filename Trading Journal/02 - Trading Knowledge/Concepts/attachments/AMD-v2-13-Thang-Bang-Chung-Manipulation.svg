<rect x="1" y="1" width="998" height="688" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Thang bằng chứng: từ “giá chạm mép” đến “có lý do gọi là Manipulation”</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ví dụ bearish: giá quét đỉnh của vùng đi ngang. Mỗi bậc thêm một mẩu bằng chứng. Bậc 1–3 chỉ tạo ra ỨNG VIÊN. Từ bậc 4 trở lên mới</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">có bằng chứng giá đã đổi hướng.</text>
