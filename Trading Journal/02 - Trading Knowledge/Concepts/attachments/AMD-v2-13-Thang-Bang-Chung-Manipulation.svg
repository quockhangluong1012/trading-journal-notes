<text x="423.6" y="421.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<circle cx="483.1" cy="282.0" r="10" fill="#7C3AED"/>
<text x="483.1" y="286.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="602.0" y="100.0" width="370.0" height="45.0" rx="7" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
<circle cx="620.0" cy="116.0" r="9.5" fill="#9CA3AF"/>
<text x="620.0" y="119.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
<text x="638.0" y="120.0" font-size="12" font-weight="700" fill="#9CA3AF" text-anchor="start">Giá đi ngang</text>
<text x="638.0" y="136.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Mới chỉ có vùng ứng viên.</text>
<rect x="602.0" y="150.0" width="370.0" height="45.0" rx="7" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<circle cx="620.0" cy="166.0" r="9.5" fill="#64748B"/>
<text x="620.0" y="169.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="638.0" y="170.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">Giá tiến sát mép</text>
<text x="638.0" y="186.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Chưa phải tín hiệu gì.</text>
<rect x="602.0" y="200.0" width="370.0" height="60.0" rx="7" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<circle cx="620.0" cy="216.0" r="9.5" fill="#EA580C"/>
<text x="620.0" y="219.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="638.0" y="220.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="start">Xuyên mép, lấy liquidity</text>
<text x="638.0" y="236.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Sự kiện có thật — nhưng breakout thật cũng bắt đầu</text>
<text x="638.0" y="251.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">y như vậy.</text>
<rect x="602.0" y="265.0" width="370.0" height="45.0" rx="7" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<circle cx="620.0" cy="281.0" r="9.5" fill="#EA580C"/>
<text x="620.0" y="284.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="638.0" y="285.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="start">Nến ĐÓNG lại bên trong</text>
<text x="638.0" y="301.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Ứng viên mạnh hơn. Vẫn có thể phá lần hai.</text>
<rect x="602.0" y="315.0" width="370.0" height="60.0" rx="7" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
<circle cx="620.0" cy="331.0" r="9.5" fill="#EA580C"/>
<text x="620.0" y="334.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="638.0" y="335.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="start">Không đi tiếp được</text>
<text x="638.0" y="351.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Đỉnh sau thấp hơn đỉnh quét: người mua không quay</text>
<text x="638.0" y="366.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lại.</text>
<rect x="602.0" y="380.0" width="370.0" height="45.0" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
<circle cx="620.0" cy="396.0" r="9.5" fill="#7C3AED"/>
<text x="620.0" y="399.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="638.0" y="400.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="start">Nến to ngược chiều + phá đáy nhỏ (MSS)</text>
<text x="638.0" y="416.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Bằng chứng đầu tiên rằng hướng đã đổi.</text>
<rect x="602.0" y="430.0" width="370.0" height="60.0" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
<circle cx="620.0" cy="446.0" r="9.5" fill="#7C3AED"/>
<text x="620.0" y="449.8" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="638.0" y="450.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="start">Giá hồi vào FVG rồi đi tiếp</text>
<text x="638.0" y="466.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Distribution đang phát triển. Lúc này cú quét mới có</text>
<text x="638.0" y="481.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lý do được gọi là Manipulation.</text>
<rect x="28.0" y="584.0" width="944.0" height="48.6" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="38.0" y="606.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">HỦY giả thuyết Manipulation khi: giá đóng nến TRÊN mép và giữ được vài nến · giá vượt lại đỉnh của cú quét sau khi đã có MSS · giá quay vào range nhưng chỉ</text>
<text x="38.0" y="622.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đi ngang, không có lực về phía kia. Gọi là “Manipulation” ở bậc 2–3 = dùng tương lai mà bạn chưa có.</text>
</svg>
