<circle cx="367.4" cy="274.3" r="10" fill="#EA580C"/>
<text x="367.4" y="278.3" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="394.8" cy="181.1" r="10" fill="#EA580C"/>
<text x="394.8" y="185.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
