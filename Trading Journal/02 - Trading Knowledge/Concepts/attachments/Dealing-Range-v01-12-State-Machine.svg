<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="ar1D4ED8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="ar6B7280" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="ar7C3AED" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7C3AED"/></marker><marker id="arD97706" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D97706"/></marker><marker id="arDC2626" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#DC2626"/></marker></defs>
  <rect x="0" y="0" width="980" height="700" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">State machine của Dealing Range (v0.1)</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Mọi thay đổi range phải đi qua một event có id. Không có event → không đổi range. Sweep và completion KHÔNG phải invalidation.</text>
  <rect x="30.0" y="248.0" width="196.0" height="62.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="128.0" y="272.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">FORMING</text>
  <text x="128.0" y="292.0" font-size="10.5" fill="#374151" text-anchor="middle">termination chưa đóng</text>
  <rect x="300.0" y="248.0" width="196.0" height="62.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="398.0" y="272.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="middle">ACTIVE</text>
  <text x="398.0" y="292.0" font-size="10.5" fill="#374151" text-anchor="middle">range đang có thẩm quyền</text>
  <rect x="300.0" y="108.0" width="196.0" height="62.0" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="398.0" y="132.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">SWEPT_H / SWEPT_L</text>
  <text x="398.0" y="152.0" font-size="10.5" fill="#374151" text-anchor="middle">wick qua biên, close lại</text>
  <rect x="600.0" y="108.0" width="196.0" height="62.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="698.0" y="132.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="middle">EXTENDED</text>
  <text x="698.0" y="152.0" font-size="10.5" fill="#374151" text-anchor="middle">phá termination có acceptance</text>
  <rect x="600.0" y="248.0" width="196.0" height="62.0" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="698.0" y="272.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">COMPLETED</text>
  <text x="698.0" y="292.0" font-size="10.5" fill="#374151" text-anchor="middle">đã chạm DOL</text>
  <rect x="600.0" y="388.0" width="196.0" height="62.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="698.0" y="412.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">PENDING</text>
  <text x="698.0" y="432.0" font-size="10.5" fill="#374151" text-anchor="middle">close ngoài protected, chờ m bar</text>
  <rect x="300.0" y="478.0" width="196.0" height="62.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="398.0" y="502.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="middle">CONSOLIDATING</text>
  <text x="398.0" y="522.0" font-size="10.5" fill="#374151" text-anchor="middle">thất bại 2 phía + co biên độ</text>
  <rect x="830.0" y="388.0" width="124.0" height="62.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="892.0" y="412.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">INVALIDATED</text>
  <text x="892.0" y="432.0" font-size="10.5" fill="#374151" text-anchor="middle">câu chuyện chết</text>
  <rect x="830.0" y="116.0" width="124.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="892.0" y="135.0" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">range MỚI (origin</text>
  <text x="892.0" y="149.2" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">dịch)</text>
