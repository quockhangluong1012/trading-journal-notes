  <text x="366.0" y="216.0" font-size="9.8" font-weight="700" fill="#1D4ED8" text-anchor="end">sweep</text>
  <line x1="424.0" y1="173.0" x2="424.0" y2="246.0" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#ar1D4ED8)"/>
  <text x="430.0" y="216.0" font-size="9.8" fill="#1D4ED8">quay lại</text>
  <path d="M496 258 C 540 218, 560 158, 596 143" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar7C3AED)"/>
  <text x="520.0" y="190.0" font-size="9.8" font-weight="700" fill="#7C3AED">close vượt H*</text>
  <line x1="496.0" y1="279.0" x2="596.0" y2="279.0" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#ar1D4ED8)"/>
  <text x="546.0" y="271.0" font-size="9.8" font-weight="700" fill="#1D4ED8" text-anchor="middle">chạm DOL</text>
  <path d="M496 298 C 540 338, 560 398, 596 416" fill="none" stroke="#D97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arD97706)"/>
  <text x="506.0" y="360.0" font-size="9.8" font-weight="700" fill="#B45309">close &lt; L*</text>
  <line x1="796.0" y1="419.0" x2="826.0" y2="419.0" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arDC2626)"/>
  <text x="892.0" y="470.0" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="middle">k close / displacement,</text>
  <text x="892.0" y="484.0" font-size="9.8" fill="#B91C1C" text-anchor="middle">không reclaim trong m bar</text>
  <text x="698.0" y="468.0" font-size="9.8" font-weight="700" fill="#1D4ED8" text-anchor="middle">reclaim ≤ m bar → quay về SWEPT</text>
  <text x="698.0" y="482.0" font-size="9.8" fill="#1D4ED8" text-anchor="middle">(failed breakdown)</text>
  <line x1="796.0" y1="139.0" x2="826.0" y2="139.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ar7C3AED)"/>
  <line x1="796.0" y1="279.0" x2="826.0" y2="279.0" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#ar1D4ED8)"/>
  <line x1="398.0" y1="312.0" x2="398.0" y2="474.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ar7C3AED)"/>
  <text x="406.0" y="398.0" font-size="9.8" font-weight="700" fill="#7C3AED">n lần thất bại hai phía</text>
  <text x="406.0" y="412.0" font-size="9.8" fill="#7C3AED">→ dùng Container DR</text>
  <rect x="30.0" y="568.0" width="924.0" height="112.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="42.0" y="590.0" font-size="12" font-weight="700" fill="#1F2937">Đối chiếu với máy trạng thái ở note 57 (quy ước đang dùng trong vault)</text>
  <rect x="44.0" y="612.5" width="100.3" height="19.5" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="51.0" y="627.0" font-size="10.5" font-weight="700" fill="#1D4ED8">ACTIVE ≈ VALID</text>
  <rect x="152.3" y="612.5" width="153.2" height="19.5" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="159.3" y="627.0" font-size="10.5" font-weight="700" fill="#1D4ED8">SWEPT ≈ RAID (vẫn VALID)</text>
  <rect x="313.5" y="612.5" width="133.9" height="19.5" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="320.5" y="627.0" font-size="10.5" font-weight="700" fill="#1D4ED8">PENDING ≈ SUSPENDED</text>
  <rect x="455.5" y="612.5" width="133.9" height="19.5" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="462.5" y="627.0" font-size="10.5" font-weight="700" fill="#1D4ED8">EXTENDED ≈ REPLACED</text>
  <rect x="597.4" y="612.5" width="174.2" height="19.5" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
  <text x="604.4" y="627.0" font-size="10.5" font-weight="700" fill="#1D4ED8">INVALIDATED ≈ INVALIDATED</text>
  <text x="44.0" y="654.0" font-size="10.8" fill="#374151">Note 57 còn có REFINED (wick giãn biên → đo lại levels, không đổi phân tích) — v0.1 giữ quy ước này. FORMING, COMPLETED, CONSOLIDATING là phần bổ sung của v0.1.</text>
