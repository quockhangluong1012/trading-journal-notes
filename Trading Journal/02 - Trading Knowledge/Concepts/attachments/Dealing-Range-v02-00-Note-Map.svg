<svg viewBox="0 0 1280 590" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="1280" height="590" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">Bản đồ note 12 — Dealing Range v0.2 (đã gộp trùng lặp)</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Bốn lớp: khái niệm để dùng hằng ngày → cơ chế → phản biện &amp; ngoại lệ → bằng chứng. Mỗi chủ đề chỉ có MỘT nơi trình bày đầy đủ; nơi khác chỉ trỏ link.</text>
  <text x="26.0" y="134.0" font-size="13" font-weight="700" fill="#1D4ED8">Lớp 1 · Khái niệm &amp; vận hành</text>
  <rect x="250.0" y="104.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="260.0" y="125.0" font-size="12" font-weight="700" fill="#1F2937">§1  Định nghĩa</text>
  <text x="260.0" y="142.0" font-size="10.5" fill="#374151">4 cấp, 3 họ range, mental model</text>
  <rect x="502.0" y="104.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="512.0" y="125.0" font-size="12" font-weight="700" fill="#1F2937">§2  Bối cảnh</text>
  <text x="512.0" y="142.0" font-size="10.5" fill="#374151">vì sao quan trọng, khi nào bỏ qua</text>
  <rect x="754.0" y="104.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="764.0" y="125.0" font-size="12" font-weight="700" fill="#1F2937">§3  Nhận diện</text>
  <text x="764.0" y="142.0" font-size="10.5" fill="#374151">structure → swing → anchor → dựng DR</text>
  <rect x="1006.0" y="104.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="1016.0" y="125.0" font-size="12" font-weight="700" fill="#1F2937">§4  Đa khung</text>
  <text x="1016.0" y="142.0" font-size="10.5" fill="#374151">D1/H1/M5 gate, nested, LRI</text>
  <rect x="250.0" y="172.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="260.0" y="193.0" font-size="12" font-weight="700" fill="#1F2937">§5  Xác nhận / vô hiệu</text>
  <text x="260.0" y="210.0" font-size="10.5" fill="#374151">state machine, update, known_at</text>
  <rect x="502.0" y="172.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="512.0" y="193.0" font-size="12" font-weight="700" fill="#1F2937">§6  Ví dụ chart</text>
  <text x="512.0" y="210.0" font-size="10.5" fill="#374151">dữ liệu thật EURUSD H1</text>
  <rect x="754.0" y="172.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="764.0" y="193.0" font-size="12" font-weight="700" fill="#1F2937">§7  Entry model</text>
  <text x="764.0" y="210.0" font-size="10.5" fill="#374151">sequence, POI, decision tree</text>
  <rect x="1006.0" y="172.0" width="242.0" height="58.0" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="1016.0" y="193.0" font-size="12" font-weight="700" fill="#1F2937">§8–13  Checklist → Thành thạo</text>
  <text x="1016.0" y="210.0" font-size="10.5" fill="#374151">lỗi, câu hỏi, flashcards, lesson</text>
  <text x="26.0" y="280.0" font-size="13" font-weight="700" fill="#7C3AED">Lớp 2 · Cơ chế</text>
  <rect x="250.0" y="250.0" width="242.0" height="58.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="260.0" y="271.0" font-size="12" font-weight="700" fill="#1F2937">§14  Cơ chế &amp; lăng kính</text>
  <text x="260.0" y="288.0" font-size="10.5" fill="#374151">mechanics vs ICT, EQ, P/D, liquidity, DOL,</text>
  <text x="260.0" y="301.0" font-size="10.5" fill="#374151">AMT/Wyckoff</text>
  <text x="26.0" y="358.0" font-size="13" font-weight="700" fill="#B91C1C">Lớp 3 · Phản biện &amp; ngoại lệ</text>
  <rect x="250.0" y="328.0" width="242.0" height="58.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="260.0" y="349.0" font-size="12" font-weight="700" fill="#1F2937">§15  Phản biện</text>
  <text x="260.0" y="366.0" font-size="10.5" fill="#374151">critique, giới hạn, what we know</text>
  <rect x="502.0" y="328.0" width="242.0" height="58.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="512.0" y="349.0" font-size="12" font-weight="700" fill="#1F2937">§16  Edge cases</text>
  <text x="512.0" y="366.0" font-size="10.5" fill="#374151">catalog gộp EC/CX/War stories</text>
  <rect x="754.0" y="328.0" width="242.0" height="58.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="764.0" y="349.0" font-size="12" font-weight="700" fill="#1F2937">§17  Case studies</text>
  <text x="764.0" y="366.0" font-size="10.5" fill="#374151">A–E giả định + case lưu trữ</text>
  <text x="26.0" y="436.0" font-size="13" font-weight="700" fill="#15803D">Lớp 4 · Bằng chứng</text>
  <rect x="250.0" y="406.0" width="242.0" height="58.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="260.0" y="427.0" font-size="12" font-weight="700" fill="#1F2937">§18  Định lượng</text>
  <text x="260.0" y="444.0" font-size="10.5" fill="#374151">biến, formalize, pseudocode, journal</text>
  <rect x="502.0" y="406.0" width="242.0" height="58.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="512.0" y="427.0" font-size="12" font-weight="700" fill="#1F2937">§19  Backtest &amp; thực nghiệm</text>
  <text x="512.0" y="444.0" font-size="10.5" fill="#374151">phương pháp + kết quả v0.2</text>
  <rect x="754.0" y="406.0" width="242.0" height="58.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="764.0" y="427.0" font-size="12" font-weight="700" fill="#1F2937">§20  Hypothesis register</text>
  <text x="764.0" y="444.0" font-size="10.5" fill="#374151">trạng thái, câu hỏi mở, changelog</text>
  <rect x="26.0" y="490.0" width="600.0" height="76.0" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="36.0" y="510.0" font-size="12.5" font-weight="700" fill="#1D4ED8">Lộ trình đọc nhanh (trước phiên)</text>
  <text x="36.0" y="528.0" font-size="11.5" fill="#374151">§1 → §3 (Dấu hiệu chính) → §4 (gate) → §5 (state) → §8 Checklist → §12 Câu nhắc nhở.</text>
  <rect x="650.0" y="490.0" width="600.0" height="76.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
  <text x="660.0" y="510.0" font-size="12.5" font-weight="700" fill="#15803D">Lộ trình nghiên cứu</text>
  <text x="660.0" y="528.0" font-size="11.5" fill="#374151">§14 cơ chế → §15 what we know → §19.3 kết quả thực nghiệm → §20 register → chọn hypothesis tiếp</text>
  <text x="660.0" y="543.5" font-size="11.5" fill="#374151">theo để test.</text>
</svg>
