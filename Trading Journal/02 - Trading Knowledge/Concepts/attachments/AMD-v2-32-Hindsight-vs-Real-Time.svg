<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Hindsight vs real-time: cùng một chart, hai cảm giác hoàn toàn khác</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bên trái: nhìn lại sau khi ngày đã kết thúc — mọi thứ trông hiển nhiên. Bên phải: cùng chart, cắt ở thời điểm phải ra quyết định — ba</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">tương lai vẫn còn mở.</text>
<rect x="878.6" y="22.0" width="93.4" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="925.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">HINDSIGHT</text>
<rect x="28.0" y="98.0" width="466.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="122.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">Nhìn lại (ex-post)</text>
<rect x="48.0" y="148.0" width="173.1" height="300.0" rx="0" fill="#EAF2FF"/>
<text x="134.5" y="164.0" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">A</text>
<rect x="221.1" y="148.0" width="79.9" height="300.0" rx="0" fill="#FFF1E6"/>
<text x="261.0" y="164.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">M</text>
<rect x="300.9" y="148.0" width="173.1" height="300.0" rx="0" fill="#F3EEFF"/>
<text x="387.5" y="164.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">D</text>
<path d="M48.0,324.5 L74.6,296.2 L101.2,335.1 L127.9,299.8 L154.5,331.5 L181.1,303.3 L207.8,328.0 L234.4,356.2 L261.0,395.1 L287.6,373.9 L314.2,328.0 L340.9,282.1 L367.5,296.2 L394.1,246.8 L420.8,204.5 L447.4,218.6 L474.0,176.2" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="261.0" y1="395.1" x2="271.0" y2="419.2" stroke="#EA580C" stroke-width="1" stroke-dasharray="3,2"/>
<text x="271.0" y="417.1" font-size="10.5" font-weight="600" fill="#EA580C" text-anchor="start">Judas “rõ ràng”</text>
<text x="44.0" y="478.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">“Quá dễ: tích lũy, quét đáy, chạy lên.” Nhưng nhãn A/M/D được dán</text>
<text x="44.0" y="494.6" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">SAU KHI đã thấy D.</text>
<rect x="506.0" y="98.0" width="466.0" height="420.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="520.0" y="122.0" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">Tại thời điểm quyết định (ex-ante)</text>
<path d="M526.0,324.5 L552.6,296.2 L579.2,335.1 L605.9,299.8 L632.5,331.5 L659.1,303.3 L685.8,328.0 L712.4,356.2 L739.0,395.1" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="747.0" y="148.0" width="205.0" height="300.0" rx="0" fill="#E5E7EB" opacity="0.55"/>
<text x="850.8" y="168.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">tương lai: chưa thấy</text>
<path d="M739.0,395.1 L778.9,366.8 L818.9,324.5 L858.8,282.1 L898.8,232.7 L938.7,190.4" fill="none" stroke="#15803D" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,4"/>
<path d="M739.0,395.1 L778.9,416.2 L818.9,402.1 L858.8,430.4 L898.8,437.4 L938.7,444.5" fill="none" stroke="#E0464B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,4"/>
<path d="M739.0,395.1 L778.9,345.6 L818.9,380.9 L858.8,338.6 L898.8,373.9 L938.7,345.6" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,4"/>
<text x="941.3" y="184.4" font-size="10" font-weight="700" fill="#15803D" text-anchor="end">quét rồi lên</text>
<text x="941.3" y="458.5" font-size="10" font-weight="700" fill="#E0464B" text-anchor="end">thủng tiếp</text>
<text x="941.3" y="339.6" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">đi ngang</text>
<text x="522.0" y="478.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">Câu đúng ở đây: “có một cú thủng đáy range — ỨNG VIÊN M — chờ</text>
<text x="522.0" y="494.6" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">reclaim và MSS”.</text>
<rect x="28.0" y="530.0" width="944.0" height="48.6" rx="8" fill="#FFF0F3" stroke="#BE123C" stroke-width="1"/>
<text x="38.0" y="552.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ba thói quen chống hindsight: (1) vẽ mép range và ghi đích TRƯỚC phiên; (2) khi backtest bằng bar replay, ghi trạng thái S1–S4 trước khi bấm nến tiếp</text>
<text x="38.0" y="568.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">theo; (3) ghi lại cả những ngày mô hình KHÔNG xảy ra — nếu chỉ lưu ngày đẹp, bộ sưu tập của bạn sẽ nói dối bạn.</text>
</svg>
