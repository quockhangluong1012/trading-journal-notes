  <rect x="40" y="105" width="380" height="185" fill="#1e222d" stroke="#26a69a" stroke-width="1"/>

  <rect x="70" y="230" width="140" height="40" fill="rgba(41,98,255,0.15)" stroke="#2962ff"/>
  <text x="140" y="222" fill="#9db4e0" font-size="11" text-anchor="middle">Range cu</text>

  <rect x="220" y="220" width="12" height="18" fill="#26a69a"/>
  <rect x="236" y="195" width="12" height="30" fill="#26a69a"/>
  <rect x="252" y="160" width="12" height="45" fill="#26a69a"/>
  <rect x="268" y="150" width="12" height="30" fill="#26a69a"/>
  <text x="248" y="140" fill="#26a69a" font-size="11" text-anchor="middle">Body ratio cao</text>

  <rect x="290" y="150" width="12" height="20" fill="#26a69a" opacity="0.6"/>
  <rect x="306" y="152" width="12" height="18" fill="#26a69a" opacity="0.6"/>
  <text x="298" y="270" fill="#f2c94c" font-size="10" text-anchor="middle">2 nen dong</text>
  <text x="298" y="282" fill="#f2c94c" font-size="10" text-anchor="middle">ngoai external</text>

  <rect x="330" y="130" width="70" height="45" fill="rgba(255,152,0,0.2)" stroke="#f2c94c"/>
  <text x="365" y="123" fill="#f2c94c" font-size="11" text-anchor="middle">POI moi</text>

  <text x="230" y="305" fill="#d1d4dc" font-size="12" text-anchor="middle">Body ratio OK - ATR OK - FVG sach - Acceptance OK</text>

  <!-- RIGHT: failed -->
  <text x="730" y="90" fill="#ef5350" font-size="16" font-weight="bold" text-anchor="middle">THAT BAI - thieu acceptance</text>
  <rect x="540" y="105" width="380" height="185" fill="#1e222d" stroke="#ef5350" stroke-width="1"/>

  <rect x="570" y="230" width="140" height="40" fill="rgba(41,98,255,0.15)" stroke="#2962ff"/>
  <text x="640" y="222" fill="#9db4e0" font-size="11" text-anchor="middle">Range cu</text>

  <rect x="720" y="220" width="12" height="18" fill="#26a69a"/>
  <rect x="736" y="195" width="12" height="30" fill="#26a69a"/>
  <rect x="752" y="160" width="12" height="45" fill="#26a69a"/>
  <rect x="768" y="150" width="12" height="30" fill="#26a69a"/>
  <text x="748" y="140" fill="#26a69a" font-size="11" text-anchor="middle">Body ratio cao</text>

  <!-- only 1 candle closes outside then reversal -->
  <rect x="790" y="150" width="12" height="20" fill="#26a69a" opacity="0.6"/>
  <rect x="806" y="165" width="12" height="35" fill="#ef5350"/>
  <rect x="822" y="195" width="12" height="45" fill="#ef5350"/>
  <text x="812" y="270" fill="#ef5350" font-size="10" text-anchor="middle">chi 1 nen roi</text>
  <text x="812" y="282" fill="#ef5350" font-size="10" text-anchor="middle">bi quet nguoc</text>

  <line x1="783" y1="145" x2="850" y2="145" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="880" y="149" fill="#f2c94c" font-size="10">external</text>

  <text x="730" y="305" fill="#d1d4dc" font-size="12" text-anchor="middle">Body ratio OK - ATR OK - FVG sach - Acceptance THIEU (chi 1 nen)</text>

  <!-- Bottom summary -->
  <rect x="40" y="330" width="880" height="170" fill="#181c27" stroke="#2a2e39"/>
  <text x="480" y="355" fill="#d1d4dc" font-size="14" font-weight="bold" text-anchor="middle">Vi sao acceptance la tieu chi khong the bo qua</text>

  <text x="60" y="385" fill="#d1d4dc" font-size="12">- 3/4 tieu chi dat lam setup TRONG rat thuyet phuc, nhung khong co gia tri du bao doc lap neu thieu tieu chi thu 4</text>
  <text x="60" y="410" fill="#d1d4dc" font-size="12">- Acceptance (gia dong giu ngoai external it nhat 1-2 nen) la bang chung rang thi truong "chap nhan" gia moi</text>
  <text x="60" y="435" fill="#d1d4dc" font-size="12">- Thieu no, nhip manh co the chi la mot cai quet thanh khoan (liquidity sweep) chu khong phai displacement that</text>
  <text x="60" y="460" fill="#d1d4dc" font-size="12">- He qua thuc chien: lenh limit dat tai POI cua range "that bai" thuong bi kich hoat roi dao chieu ngay (-1R)</text>
  <text x="60" y="485" fill="#787b86" font-size="11">Tham khao chi tiet tai muc D2/D3 (Deep Dive) va muc 6D (noi dung goc) cua file nay</text>
