<svg viewBox="0 0 900 500" width="900" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Đọc từng bước một chuỗi giá: 100 → 110 → 105 → 115 → 109 → 120</title>
<desc>Đọc từng bước một chuỗi giá: 100 → 110 → 105 → 115 → 109 → 120. Số chỉ để minh họa. Hãy đọc từng bước theo thứ tự thời gian, như đang xem trực tiếp.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="500" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Đọc từng bước một chuỗi giá: 100 → 110 → 105 → 115 → 109 → 120</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Số chỉ để minh họa. Hãy đọc từng bước theo thứ tự thời gian, như đang xem trực tiếp.</tspan></text>
<rect x="24.0" y="92.0" width="500.0" height="390.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<line x1="125.1" y1="287.0" x2="262.9" y2="287.0" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="295.3" y1="223.1" x2="437.0" y2="223.1" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="210.2" y1="350.9" x2="499.5" y2="350.9" stroke="#1D9E75" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="499.5" y="364.9" font-size="11" fill="#1D9E75" text-anchor="end"><tspan>đáy 105</tspan></text>
<line x1="380.4" y1="299.8" x2="499.5" y2="299.8" stroke="#1D9E75" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="499.5" y="294.8" font-size="11" fill="#1D9E75" text-anchor="end"><tspan>đáy 109 = cần giữ</tspan></text>
<polyline points="40.0,414.9 125.1,287.0 210.2,350.9 295.3,223.1 380.4,299.8 465.5,159.1" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="414.9" r="3.6" fill="#1F2937"/>
<text x="40.0" y="433.9" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">100</tspan></text>
<circle cx="125.1" cy="287.0" r="3.6" fill="#1F2937"/>
<text x="125.1" y="278.0" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">110</tspan></text>
<circle cx="210.2" cy="350.9" r="3.6" fill="#1F2937"/>
<text x="210.2" y="369.9" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">105</tspan></text>
<circle cx="295.3" cy="223.1" r="3.6" fill="#1F2937"/>
<text x="295.3" y="214.1" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">115</tspan></text>
<circle cx="380.4" cy="299.8" r="3.6" fill="#1F2937"/>
<text x="380.4" y="318.8" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">109</tspan></text>
<circle cx="465.5" cy="159.1" r="3.6" fill="#1F2937"/>
<text x="465.5" y="150.1" font-size="12" fill="#1F2937" text-anchor="middle"><tspan font-weight="700">120</tspan></text>
<rect x="192.8" y="263.2" width="47.9" height="19.5" rx="9.75" fill="#E8F6F0" stroke="#1D9E75" stroke-width="0.9"/>
<text x="216.7" y="276.8" font-size="10.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">BOS 1</tspan></text>
<rect x="366.9" y="199.3" width="47.9" height="19.5" rx="9.75" fill="#E8F6F0" stroke="#1D9E75" stroke-width="0.9"/>
<text x="390.8" y="212.9" font-size="10.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">BOS 2</tspan></text>
<circle cx="96.5" cy="350.9" r="9" fill="#2563EB"/>
<text x="96.5" y="354.9" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<circle cx="153.6" cy="319.0" r="9" fill="#2563EB"/>
<text x="153.6" y="323.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<circle cx="266.7" cy="287.0" r="9" fill="#2563EB"/>
<text x="266.7" y="291.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<circle cx="323.8" cy="261.4" r="9" fill="#2563EB"/>
<text x="323.8" y="265.4" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<circle cx="436.9" cy="229.5" r="9" fill="#2563EB"/>
<text x="436.9" y="233.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<text x="540.0" y="98.0" font-size="12.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">① 100 → 110</tspan></text>
<text x="540.0" y="115.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Giá đi lên. 110 chỉ thành &quot;đỉnh&quot; khi giá quay xuống.</tspan></text>
<text x="540.0" y="139.6" font-size="12.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">② 110 → 105</tspan></text>
<text x="540.0" y="156.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Nhịp lùi. 105 cao hơn 100 → đáy cao hơn (HL).</tspan></text>
<text x="540.0" y="181.1" font-size="12.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">③ 105 → 115</tspan></text>
<text x="540.0" y="198.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Vượt 110 → BOS 1. Phe mua làm được điều trước đó chưa</tspan></text>
<text x="540.0" y="214.7" font-size="12" fill="#1F2937" text-anchor="start"><tspan>làm được.</tspan></text>
<text x="540.0" y="239.2" font-size="12.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">④ 115 → 109</tspan></text>
<text x="540.0" y="256.2" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Lùi lần nữa, nhưng 109 vẫn cao hơn 105 → cấu trúc tăng</tspan></text>
<text x="540.0" y="272.8" font-size="12" fill="#1F2937" text-anchor="start"><tspan>còn nguyên.</tspan></text>
<text x="540.0" y="297.4" font-size="12.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">⑤ 109 → 120</tspan></text>
<text x="540.0" y="314.4" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Vượt 115 → BOS 2. Đáy 109 trở thành &quot;đáy cần giữ&quot;</tspan></text>
<text x="540.0" y="330.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>(protected low).</tspan></text>
<rect x="540.0" y="357.5" width="336.0" height="128.5" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="540.0" y="357.5" width="5.0" height="128.5" rx="2" fill="#DC2626"/>
<text x="554.0" y="377.5" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Và nếu sau 120 giá rơi thủng 109?</tspan></text>
<text x="554.0" y="397.4" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Đáy cần giữ đã mất → cấu trúc tăng bị phủ định</tspan></text>
<text x="554.0" y="414.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>(MSS), dù 120 vẫn là đỉnh cao nhất. Đỉnh cao nhất</tspan></text>
<text x="554.0" y="430.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>không &quot;bảo vệ&quot; xu hướng; đáy cần giữ mới làm việc</tspan></text>
<text x="554.0" y="447.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>đó.</tspan></text>
</svg>
