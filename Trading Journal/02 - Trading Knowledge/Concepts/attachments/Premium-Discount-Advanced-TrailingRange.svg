<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Trend mạnh: range TRƯỢT liên tục — discount hành xử khác regime range</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Giá chỉ về discount NÔNG của từng leg mới; chờ deep-discount = lỡ sóng; "discount" của range cũ thành bẫy</text>
  <rect x="24" y="70" width="712" height="382" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- three trailing ranges climbing -->
  <!-- range 1 -->
  <rect x="60" y="330" width="180" height="90" fill="#94A3B8" opacity="0.10"/>
  <line x1="60" y1="330" x2="240" y2="330" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="420" x2="240" y2="420" stroke="#15803D" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="375" x2="240" y2="375" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="64" y="345" font-size="8.5" fill="#6B7280">Range 1 EQ</text>
  <!-- range 2 -->
  <rect x="240" y="250" width="180" height="90" fill="#94A3B8" opacity="0.10"/>
  <line x1="240" y1="250" x2="420" y2="250" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="340" x2="420" y2="340" stroke="#15803D" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="295" x2="420" y2="295" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="244" y="265" font-size="8.5" fill="#6B7280">Range 2 EQ</text>
  <!-- range 3 -->
  <rect x="420" y="160" width="200" height="90" fill="#94A3B8" opacity="0.10"/>
  <line x1="420" y1="160" x2="620" y2="160" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="420" y1="250" x2="620" y2="250" stroke="#15803D" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="420" y1="205" x2="620" y2="205" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="424" y="175" font-size="8.5" fill="#6B7280">Range 3 EQ</text>

  <!-- rising price path making higher lows only reaching shallow discount -->
  <path d="M70,410 L120,360 L150,378 L200,300 L250,320 L300,270 L360,240 L420,255 L470,200 L540,175 L610,150" fill="none" stroke="#2563EB" stroke-width="2.6"/>
  <circle cx="150" cy="378" r="5" fill="#16A34A"/><circle cx="250" cy="320" r="5" fill="#16A34A"/><circle cx="360" cy="240" r="5" fill="#16A34A"/>
  <text x="300" y="120" font-size="10.5" font-weight="700" fill="#15803D">HL chỉ chạm discount NÔNG (25–50%) của mỗi leg mới</text>

  <!-- deep discount limit left behind -->
  <line x1="60" y1="440" x2="700" y2="440" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="66" y="434" font-size="9.5" font-weight="700" fill="#B91C1C">Limit chờ "deep discount" của range 1 → không bao giờ khớp (lỡ cả sóng) ✗</text>

  <text x="40" y="465" font-size="1" fill="#fff"> </text>
</svg>
