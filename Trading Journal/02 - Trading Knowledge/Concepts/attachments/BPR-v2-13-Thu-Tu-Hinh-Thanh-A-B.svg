<text x="28.0" y="620.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Quy ước đặt tên khác nhau giữa các nguồn. Trong note này: Bullish BPR = bearish FVG trước, bullish FVG sau. Bearish BPR = ngược lại.</text>
