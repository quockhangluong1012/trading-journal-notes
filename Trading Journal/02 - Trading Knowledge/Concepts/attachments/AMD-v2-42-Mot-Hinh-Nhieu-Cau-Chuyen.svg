<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="578" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Một hình, nhiều câu chuyện: cùng một đường giá dưới 5 lăng kính</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Range → thủng đáy → quay vào → chạy lên. Mỗi trường phái đặt một cái tên và một câu chuyện khác nhau. Không lăng kính nào được</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">chứng minh bởi chính hình này.</text>
<rect x="829.0" y="22.0" width="143.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="900.5" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DEVIL’S ADVOCATE</text>
<rect x="28.0" y="100.0" width="944.0" height="190.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="60.0" y="187.3" width="415.6" height="27.7" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M60.0,204.7 L108.9,189.1 L157.8,211.6 L206.7,190.8 L255.6,213.3 L304.4,192.5 L353.3,209.9 L402.2,194.3 L451.1,208.1 L500.0,228.9 L548.9,246.3 L597.8,215.1 L646.7,194.3 L695.6,201.2 L744.4,173.5 L793.3,156.1 L842.2,163.1 L891.1,142.3 L940.0,128.4" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28.0" y="304.0" width="180.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="328.0" font-size="13.5" font-weight="700" fill="#4338CA" text-anchor="start">ICT</text>
<text x="40.0" y="362.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Accumulation →</text>
<text x="40.0" y="377.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Manipulation (Judas, quét</text>
<text x="40.0" y="393.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">SSL) → Distribution về</text>
<text x="40.0" y="409.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">BSL. Câu chuyện: “thuật</text>
<text x="40.0" y="424.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">toán lấy liquidity”.</text>
<rect x="219.0" y="304.0" width="180.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="233.0" y="328.0" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">Wyckoff</text>
<text x="231.0" y="362.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Trading range → Spring →</text>
<text x="231.0" y="377.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Sign of Strength →</text>
<text x="231.0" y="393.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Markup. Câu chuyện:</text>
<text x="231.0" y="409.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">“composite operator gom</text>
<text x="231.0" y="424.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">hàng”.</text>
<rect x="410.0" y="304.0" width="180.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="424.0" y="328.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">Auction theory</text>
<text x="422.0" y="362.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Cân bằng → giá thăm dò</text>
<text x="422.0" y="377.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">phía dưới, bị từ chối</text>
<text x="422.0" y="393.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">(excess) → tìm giá trị mới</text>
<text x="422.0" y="409.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">phía trên.</text>
<rect x="601.0" y="304.0" width="180.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="615.0" y="328.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">Price action cổ điển</text>
<text x="613.0" y="362.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Phá vỡ giả / “Turtle Soup”</text>
<text x="613.0" y="377.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">(Connors &amp; Raschke): fade</text>
<text x="613.0" y="393.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">cú phá đáy N-ngày khi giá</text>
<text x="613.0" y="409.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">quay lại.</text>
<rect x="792.0" y="304.0" width="180.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="806.0" y="328.0" font-size="13.5" font-weight="700" fill="#64748B" text-anchor="start">Không có câu chuyện</text>
<text x="804.0" y="362.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Biến động co rồi giãn; dao</text>
<text x="804.0" y="377.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">động quanh mức trung bình.</text>
<text x="804.0" y="393.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Hình dạng này cũng xuất</text>
<text x="804.0" y="409.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">hiện trong chuỗi giá ngẫu</text>
<text x="804.0" y="424.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nhiên.</text>
<rect x="28.0" y="498.0" width="944.0" height="48.6" rx="8" fill="#FFF0F3" stroke="#BE123C" stroke-width="1"/>
<text x="38.0" y="520.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Câu hỏi đáng tiền: nếu xóa hết tên gọi, điều gì còn lại có thể kiểm chứng? → (1) giá có quay vào sau khi phá; (2) có lực đi về phía kia; (3) đi được bao xa so với</text>
<text x="38.0" y="536.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">rủi ro. Đó là phần bạn có thể ghi chép và đo trên dữ liệu của chính mình. Phần “ai làm, vì sao” thì không.</text>
</svg>
