<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cấu trúc ngoài (external) và cấu trúc trong (internal)</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Hai mép của vùng là ITH và ITL. Mọi đỉnh/đáy nhỏ nằm giữa hai mép là "chuyện trong nhà".</text>
