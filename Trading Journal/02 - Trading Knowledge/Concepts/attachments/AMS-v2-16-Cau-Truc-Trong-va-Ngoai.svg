<text x="624.0" y="159.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end">mép trên = ITH → phía trên là buy-side liquidity NGOÀI</text>
<text x="624.0" y="453.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end">mép dưới = ITL → phía dưới là sell-side liquidity NGOÀI</text>
<text x="521.3" y="341.5" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="middle" font-style="italic">bên trong: STH / STL</text>
