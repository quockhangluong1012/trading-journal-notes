<text x="678.0" y="132.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phá một STL/STH bên trong hộp:</text>
<text x="678.0" y="148.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chỉ là thay đổi NỘI BỘ.</text>
<text x="678.0" y="165.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Hai mép vẫn còn nguyên.</text>
<rect x="664.0" y="186.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="664.0" y="186.0" width="5.0" height="80.7" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="678.0" y="205.5" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start">Phá mép ngoài</text>
<text x="678.0" y="222.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Phá mép (ITH hoặc ITL):</text>
<text x="678.0" y="238.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cấu trúc cấp trung hạn thay đổi.</text>
<text x="678.0" y="255.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cần vẽ lại vùng.</text>
<rect x="664.0" y="276.0" width="308.0" height="80.7" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="664.0" y="276.0" width="5.0" height="80.7" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="678.0" y="295.5" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">Luôn tương đối</text>
<text x="678.0" y="312.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">"Trong" và "ngoài" luôn đi kèm một</text>
<text x="678.0" y="328.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cấp và một khung. ITL của H1 có thể</text>
<text x="678.0" y="345.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chỉ là chuyện bên trong của D1.</text>
