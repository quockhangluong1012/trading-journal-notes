<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Cơ chế thị trường thật đằng sau Liquidity</text>
  <text x="40" y="62" font-size="15" fill="#94a3b8">Từ resting order tới institutional fill — vì sao giá "phải" đi lấy pool trước khi đảo</text>

  <!-- book depth chart -->
  <rect x="40" y="90" width="540" height="320" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="60" y="118" font-size="16" font-weight="bold" fill="#e2e8f0">Độ sâu order book quanh 2 pool liquidity</text>

  <line x1="60" y1="380" x2="560" y2="380" stroke="#334155" stroke-width="1"/>
  <!-- SSL side thick near bottom -->
  <text x="60" y="150" font-size="13" fill="#94a3b8">Giá hiện tại ở giữa range</text>
  <line x1="310" y1="130" x2="310" y2="380" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="315" y="145" font-size="12" fill="#38bdf8">Giá hiện tại</text>

  <rect x="100" y="330" width="120" height="16" fill="#eab308" opacity="0.7"/>
  <rect x="100" y="350" width="90" height="16" fill="#eab308" opacity="0.5"/>
  <text x="100" y="320" font-size="12" fill="#eab308">SSL pool (sell-stops) dày</text>

  <rect x="420" y="200" width="120" height="16" fill="#eab308" opacity="0.7"/>
  <rect x="450" y="180" width="90" height="16" fill="#eab308" opacity="0.5"/>
  <text x="420" y="170" font-size="12" fill="#eab308">BSL pool (buy-stops) dày</text>

  <text x="60" y="410" font-size="13" fill="#e2e8f0">Institutional sell order lớn cần đối ứng MUA → bị hút đến BSL để "bán vào" buy-stop</text>

  <!-- flow diagram -->
  <rect x="600" y="90" width="560" height="320" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="620" y="118" font-size="16" font-weight="bold" fill="#e2e8f0">Chuỗi engineered liquidity → sponsorship</text>

  <circle cx="650" cy="160" r="18" fill="#334155"/>
  <text x="644" y="166" fill="#e2e8f0" font-size="14">1</text>
  <text x="680" y="166" font-size="14" fill="#e2e8f0">Equal highs/lows hình thành → đám đông đặt SL tại đó</text>

  <circle cx="650" cy="205" r="18" fill="#334155"/>
  <text x="644" y="211" fill="#e2e8f0" font-size="14">2</text>
  <text x="680" y="211" font-size="14" fill="#e2e8f0">Algo TWAP/VWAP + dealer hedging đẩy giá tới pool (chi phí thấp nhất)</text>

  <circle cx="650" cy="255" r="18" fill="#334155"/>
  <text x="644" y="261" fill="#e2e8f0" font-size="14">3</text>
  <text x="680" y="261" font-size="14" fill="#e2e8f0">Stop cluster khớp hàng loạt → cung cấp thanh khoản đối ứng</text>

  <circle cx="650" cy="305" r="18" fill="#334155"/>
  <text x="644" y="311" fill="#e2e8f0" font-size="14">4</text>
  <text x="680" y="311" font-size="14" fill="#e2e8f0">Lệnh lớn được fill xong → áp lực ngược chiều xuất hiện (displacement)</text>

  <circle cx="650" cy="355" r="18" fill="#334155"/>
  <text x="644" y="361" fill="#e2e8f0" font-size="14">5</text>
  <text x="680" y="361" font-size="14" fill="#e2e8f0">Giá đảo chiều (sponsorship rõ) hoặc tiếp tục (waypoint, ít sponsor)</text>

  <!-- market table -->
  <text x="40" y="450" font-size="18" font-weight="bold" fill="#e2e8f0">Liquidity theo 3 loại thị trường</text>
  <g font-size="14">
    <rect x="40" y="470" width="1120" height="40" fill="#1e293b" stroke="#334155"/>
    <text x="55" y="495" fill="#e2e8f0" font-weight="bold">Tiêu chí</text>
    <text x="330" y="495" fill="#e2e8f0" font-weight="bold">FX majors</text>
    <text x="620" y="495" fill="#e2e8f0" font-weight="bold">Index futures (NQ/ES)</text>
    <text x="920" y="495" fill="#e2e8f0" font-weight="bold">Crypto (BTC/ETH)</text>

    <rect x="40" y="510" width="1120" height="42" fill="#0f1420" stroke="#334155"/>
    <text x="55" y="536" fill="#94a3b8">Cấu trúc phiên</text>
    <text x="330" y="536" fill="#94a3b8">Asia→London→NY rõ rệt</text>
    <text x="620" y="536" fill="#94a3b8">RTH/ETH tách biệt, gap mở cửa</text>
    <text x="920" y="536" fill="#94a3b8">24/7 không nghỉ, khó chia phiên</text>

    <rect x="40" y="552" width="1120" height="42" fill="#1e293b" stroke="#334155"/>
    <text x="55" y="578" fill="#94a3b8">Nguồn pool chính</text>
    <text x="330" y="578" fill="#94a3b8">PDH/PDL, session high/low</text>
    <text x="620" y="578" fill="#94a3b8">Overnight high/low, IB range</text>
    <text x="920" y="578" fill="#94a3b8">Funding rate + liquidation levels</text>

    <rect x="40" y="594" width="1120" height="42" fill="#0f1420" stroke="#334155"/>
    <text x="55" y="620" fill="#94a3b8">Rủi ro đặc thù</text>
    <text x="330" y="620" fill="#94a3b8">DST lệch kill zone</text>
    <text x="620" y="620" fill="#94a3b8">Rollover contract, thin holiday</text>
    <text x="920" y="620" fill="#94a3b8">Thanh khoản phân mảnh đa sàn</text>
  </g>
  <text x="40" y="670" font-size="13" fill="#94a3b8">So với Auction Market Theory: liquidity pool ~ vùng "excess" ngoài value area; so với Wyckoff: pool ~ nơi Composite Man test cung/cầu.</text>
  <text x="40" y="692" font-size="13" fill="#94a3b8">So với Orderflow: absorption tại pool = delta lệch hướng dù giá vẫn di chuyển theo hướng cũ — cùng hiện tượng, khác tên gọi.</text>
</svg>
