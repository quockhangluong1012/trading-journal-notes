<text x="626.0" y="454.6" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Chờ — NOT READY</text>
<line x1="120.0" y1="486.0" x2="120.0" y2="518.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="128.0" y="506.0" font-size="10" fill="#15803D" font-weight="700" text-anchor="start">CÓ</text>
<rect x="60.0" y="520.0" width="520.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
<circle cx="82.0" cy="546.0" r="13" fill="#1D4ED8"/>
<text x="82.0" y="551.0" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="104.0" y="551.0" font-size="12.2" fill="#1F2937" font-weight="700" text-anchor="start">Giá đã xuyên mức chưa (quá L ± ε)?</text>
