<text x="626.0" y="630.6" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Chưa rõ hết k → EXPIRED (ghi lại)</text>
<line x1="120.0" y1="662.0" x2="120.0" y2="694.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="128.0" y="682.0" font-size="10" fill="#15803D" font-weight="700" text-anchor="start">CÓ</text>
<rect x="60.0" y="696.0" width="520.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
<circle cx="82.0" cy="722.0" r="13" fill="#1D4ED8"/>
<text x="82.0" y="727.0" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
<text x="104.0" y="727.0" font-size="12.2" fill="#1F2937" font-weight="700" text-anchor="start">Đủ điều kiện definition để gắn E-code?</text>
<line x1="582.0" y1="722.0" x2="616.0" y2="722.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="590.0" y="716.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start">KHÔNG</text>
<rect x="618.0" y="700.0" width="298.0" height="26.6" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="626.0" y="718.6" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Giữ trạng thái chưa xác định</text>
<line x1="120.0" y1="750.0" x2="120.0" y2="782.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="128.0" y="770.0" font-size="10" fill="#15803D" font-weight="700" text-anchor="start">CÓ</text>
