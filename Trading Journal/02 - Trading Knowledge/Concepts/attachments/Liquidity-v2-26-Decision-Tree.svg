<text x="104.0" y="639.0" font-size="12.2" fill="#1F2937" font-weight="700" text-anchor="start">Trong k nến: rejection, acceptance hay chưa rõ?</text>
<line x1="582.0" y1="634.0" x2="616.0" y2="634.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#m0)"/>
