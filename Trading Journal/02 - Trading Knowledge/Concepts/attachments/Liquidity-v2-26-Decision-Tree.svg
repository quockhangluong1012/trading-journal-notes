<text x="626.0" y="806.6" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Giữ nhận định cũ (vẫn ghi sự kiện)</text>
<line x1="120.0" y1="838.0" x2="120.0" y2="870.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="128.0" y="860.0" font-size="10" fill="#15803D" font-weight="700" text-anchor="start">CÓ</text>
<rect x="60.0" y="872.0" width="856.0" height="59.3" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="69.0" y="891.1" font-size="11.1" fill="#7C3AED" font-weight="700" text-anchor="start">Kết quả của nhánh &quot;CÓ&quot; ở bước 9</text>
<text x="69.0" y="908.2" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Cập nhật bản đồ: gạch mức đã tiêu; DOL → delivered / spent / invalidated / flip; ghi known_at + lý do. Nếu sự kiện ở khung D1 → vẽ lại D1.</text>
<text x="69.0" y="922.8" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Nhánh ở bước 7: REJECTED → (chờ MSS + displacement trong m nến?) → REVERSAL CONF. hoặc STALE · ACCEPTED → breakout / BOS / RUN nếu mức kế cùng phía cũng được chấp nhận.</text>
<text x="24.0" y="926.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-26 · Cây này mô tả THỨ TỰ CÂU HỎI, không hứa giá sẽ đi theo trình tự nào. Tham số k, ε, δ, m khai báo trước.</text>
