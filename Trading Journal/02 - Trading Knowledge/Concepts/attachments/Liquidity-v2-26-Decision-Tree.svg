<rect x="0.0" y="0.0" width="940.0" height="940.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Decision tree cho Liquidity (v0.1)</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Cây phân tích — không phải cây nhân quả. Mỗi nhánh &quot;KHÔNG&quot; là một kết quả hợp lệ, không phải lỗi.</text>
