<text x="626.0" y="542.6" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Chạm/không xuyên = E0/E1 — KHÔNG gọi là sweep</text>
<line x1="120.0" y1="574.0" x2="120.0" y2="606.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#m1)"/>
