<svg viewBox="0 0 760 656" width="760" height="656" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sáu bẫy DOL có hình dạng đặc trưng trên chart</title>
<desc>Sáu khung nhỏ: đúng đích sai đường khi có pool chưa quét sau SL; sweep của sweep quét SL dưới râu; TP bị front-run ngay dưới mức; MSS mồi khi pool khung lớn còn nguyên; DOL đã tiêu khiến giá trôi về IRL; tin tức quét cả hai phía.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="656" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Sáu bẫy DOL có hình dạng đặc trưng trên chart</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">T7 (ảo giác thống kê) và T8 (tự kể chuyện sau khi thua) là bẫy thống kê/tâm lý nên không vẽ được. Điểm</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">chung: thanh khoản của CHÍNH BẠN bị lấy trước.</text>
<g transform="translate(40,70)">

<text font-size="13" font-weight="700" fill="#1F2937" x="40" y="34">T1 · Đúng đích, sai đường</text>
<line x1="40" y1="54" x2="320" y2="54" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="40" y1="138" x2="320" y2="138" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="60" y1="128" x2="150" y2="128" stroke="#888780" stroke-width="1.5"/>
<text font-size="12" fill="#4B5563" x="40" y="132">SL</text>
<polyline points="50,100 100,112 140,124 170,144 210,100 272,58" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<circle cx="100" cy="112" r="3.5" fill="#1F2937"/>
<text font-size="12" fill="#4B5563" x="40" y="172">pool chưa quét nằm sau SL</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="360" y="34">T2 · Sweep của sweep</text>
<line x1="360" y1="120" x2="640" y2="120" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="450" y1="130" x2="520" y2="130" stroke="#888780" stroke-width="1.5"/>
<polyline points="370,70 410,128 440,90 460,102 490,134 540,80 600,52" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<circle cx="460" cy="102" r="3.5" fill="#1F2937"/>
<text font-size="12" fill="#4B5563" x="360" y="172">SL ngay dưới râu bị quét lần 2</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="40" y="214">T3 · TP bị front-run</text>
<line x1="40" y1="240" x2="320" y2="240" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="200" y1="240" x2="300" y2="240" stroke="#1D9E75" stroke-width="2.5"/>
<polyline points="50,320 100,290 130,300 190,256 230,247 270,300 300,322" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<text font-size="12" fill="#4B5563" x="40" y="352">dừng cách mức vài tick rồi đảo</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="360" y="214">T4 · MSS mồi</text>
<line x1="360" y1="324" x2="640" y2="324" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="370,240 420,300 440,286 460,296 490,272 510,282 560,330 620,334" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<circle cx="510" cy="282" r="3.5" fill="#1F2937"/>
<text font-size="12" fill="#4B5563" x="360" y="352">MSS nội bộ, pool HTF còn nguyên</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="40" y="394">T5 · DOL đã tiêu</text>
<line x1="40" y1="424" x2="320" y2="424" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="200" y="488" width="120" height="16" fill="#1D9E75" opacity="0.2"/>
<rect x="200" y="488" width="120" height="16" fill="none" stroke="#1D9E75" stroke-width="0.5"/>
<polyline points="50,480 100,414 130,460 160,442 190,470 220,452 255,492 300,498" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<text font-size="12" fill="#4B5563" x="40" y="532">đích đã giao, giá về IRL</text>
<text font-size="13" font-weight="700" fill="#1F2937" x="360" y="394">T6 · Tin quét hai đầu</text>
<line x1="360" y1="420" x2="640" y2="420" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="360" y1="500" x2="640" y2="500" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="480" y1="406" x2="480" y2="512" stroke="#888780" stroke-width="1" stroke-dasharray="2 3"/>
<polyline points="370,460 460,464 485,412 500,508 530,440 560,480 630,458" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arK)"/>
<text font-size="12" fill="#4B5563" x="360" y="532">cả hai phía bị quét quanh tin</text>

</g>
</svg>
