<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mental model cuối cùng: BOS trong bốn câu hỏi</title>
<desc>Mental model cuối cùng: BOS trong bốn câu hỏi. Nếu chỉ nhớ một hình trong note này, hãy nhớ hình này.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Mental model cuối cùng: BOS trong bốn câu hỏi</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Nếu chỉ nhớ một hình trong note này, hãy nhớ hình này.</tspan></text>
<rect x="340.0" y="232.0" width="320.0" height="112.0" rx="14" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.8"/>
<text x="356.0" y="260.0" font-size="13.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">BOS = giá làm được điều CHƯA TỪNG làm</tspan></text>
<text x="356.0" y="278.6" font-size="13.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">trong cấu trúc này, THEO ĐÚNG chiều</tspan></text>
<text x="356.0" y="297.3" font-size="13.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">của cấu trúc này — và điều đó được chấp</tspan></text>
<text x="356.0" y="315.9" font-size="13.5" fill="#2563EB" text-anchor="start"><tspan font-weight="700">nhận.</tspan></text>
<rect x="24.0" y="94.0" width="300.0" height="130.0" rx="8" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<rect x="24.0" y="94.0" width="5.0" height="130.0" rx="2" fill="#1D9E75"/>
<text x="38.0" y="114.0" font-size="14" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">1. Cái gì bị phá?</tspan></text>
<text x="38.0" y="135.3" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>Một swing ĐÃ xác nhận, có vai trò cấu trúc.</tspan></text>
<text x="38.0" y="152.6" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>Cấp nào? Khung nào? Internal hay external?</tspan></text>
<rect x="676.0" y="94.0" width="300.0" height="130.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="676.0" y="94.0" width="5.0" height="130.0" rx="2" fill="#B45309"/>
<text x="690.0" y="114.0" font-size="14" fill="#B45309" text-anchor="start"><tspan font-weight="700">2. Phá như thế nào?</tspan></text>
<text x="690.0" y="135.3" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>Chạm → đóng ngoài → được chấp nhận → có</tspan></text>
<text x="690.0" y="152.6" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>hậu quả. Displacement là chất lượng, không</tspan></text>
<text x="690.0" y="169.8" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>phải điều kiện.</tspan></text>
<rect x="24.0" y="354.0" width="300.0" height="130.0" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.0"/>
<rect x="24.0" y="354.0" width="5.0" height="130.0" rx="2" fill="#7C3AED"/>
<text x="38.0" y="374.0" font-size="14" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">3. Trong bối cảnh nào?</tspan></text>
<text x="38.0" y="395.3" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>Thuận trạng thái = BOS; ngược = MSS. Khung</tspan></text>
<text x="38.0" y="412.6" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>lớn nói gì? Phía trước còn đường chạy</tspan></text>
<text x="38.0" y="429.8" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>không?</tspan></text>
<rect x="676.0" y="354.0" width="300.0" height="130.0" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<rect x="676.0" y="354.0" width="5.0" height="130.0" rx="2" fill="#DC2626"/>
<text x="690.0" y="374.0" font-size="14" fill="#DC2626" text-anchor="start"><tspan font-weight="700">4. Cái gì thay đổi?</tspan></text>
<text x="690.0" y="395.3" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>Mức cần giữ dời theo; bản đồ vẽ lại. KHÔNG</tspan></text>
<text x="690.0" y="412.6" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>thay đổi: việc giá &quot;chắc chắn&quot; đi tiếp — điều</tspan></text>
<text x="690.0" y="429.8" font-size="12.5" fill="#1F2937" text-anchor="start"><tspan>đó chưa ai biết.</tspan></text>
<line x1="324.0" y1="200.0" x2="360.0" y2="232.0" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="676.0" y1="200.0" x2="640.0" y2="232.0" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="324.0" y1="400.0" x2="360.0" y2="344.0" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="676.0" y1="400.0" x2="640.0" y2="344.0" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="24.0" y="500.0" width="952.0" height="46.0" rx="10" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<text x="500.0" y="529.0" font-size="15" fill="#B45309" text-anchor="middle"><tspan font-weight="700">Chạm chưa phải phá. Phá chưa phải được chấp nhận. Được chấp nhận chưa phải sẽ đi tiếp.</tspan></text>
</svg>
