<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="498" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Ba trường hợp khó: bằng nhau, rơi sâu, và mép phải</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi ô là một lý do khiến mắt ta muốn "nâng cấp" một cái đáy trong khi luật chưa cho phép.</text>
<rect x="868.0" y="22.0" width="104.0" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="920.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">EDGE CASES</text>
<rect x="28.0" y="84.0" width="308.0" height="396.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="40.0" y="104.0" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="start">A. Hai đáy bằng nhau</text>
<polyline points="58.0,143.9 89.0,262.6 120.0,191.4 151.0,322.0 182.0,227.0 213.0,322.0 244.0,179.5 275.0,250.8 306.0,132.0" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
<circle cx="89.0" cy="262.6" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="89.0" y="283.6" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="151.0" cy="322.0" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="151.0" y="343.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="213.0" cy="322.0" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="213.0" y="343.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="275.0" cy="250.8" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="275.0" y="271.8" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<line x1="151.0" y1="322.0" x2="213.0" y2="322.0" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="40.0" y="384.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không đáy nào THẤP HƠN đáy kia.</text>
<text x="40.0" y="401.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Theo luật chặt: chưa có ITL.</text>
<text x="40.0" y="418.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Cách dùng: coi hai đáy là MỘT vùng</text>
<text x="40.0" y="435.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">(relative equal lows) và ghi rõ quy ước.</text>
<rect x="346.0" y="84.0" width="308.0" height="396.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="358.0" y="104.0" font-size="12.5" font-weight="700" fill="#9CA3AF" text-anchor="start">B. Rơi rất sâu nhưng không lên cấp</text>
<polyline points="376.0,322.0 411.4,260.7 446.9,279.1 482.3,138.1 517.7,242.3 553.1,168.8 588.6,205.5 624.0,132.0" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
<circle cx="376.0" cy="322.0" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="376.0" y="343.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="446.9" cy="279.1" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="446.9" y="300.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="517.7" cy="242.3" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="517.7" y="263.3" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="588.6" cy="205.5" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="588.6" y="226.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<text x="358.0" y="384.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Cú rơi từ đỉnh xuống rất dài.</text>
<text x="358.0" y="401.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nhưng đáy của nó vẫn CAO HƠN</text>
<text x="358.0" y="418.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">đáy bên trái.</text>
<text x="358.0" y="435.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">→ Độ dài cú rơi không quyết định cấp.</text>
<rect x="664.0" y="84.0" width="308.0" height="396.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="676.0" y="104.0" font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="start">C. Đáy sâu nhất ở mép phải</text>
<polyline points="694.0,132.0 743.6,202.0 793.2,152.0 842.8,232.0 892.4,172.0 942.0,322.0" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
<circle cx="743.6" cy="202.0" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="743.6" y="223.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="842.8" cy="232.0" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="842.8" y="253.0" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">STL</text>
<circle cx="942.0" cy="322.0" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="942.0" cy="322.0" r="2.5" fill="#2563EB" stroke="none" stroke-width="2"/>
<text x="942.0" y="347.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">ứng viên ?</text>
<rect x="948.0" y="132.0" width="18.0" height="200.0" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 3"/>
<text x="676.0" y="384.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đáy mới nhất, sâu nhất chart.</text>
<text x="676.0" y="401.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nhưng bên phải CHƯA có gì.</text>
<text x="676.0" y="418.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Chưa có hàng xóm bên phải → chưa</text>
<text x="676.0" y="435.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">thể là ITL. Chỉ là "ứng viên".</text>
