<svg viewBox="0 0 1000 548" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="546.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mental model cuối cùng: IFVG là câu hỏi giá đặt ra LẦN THỨ HAI</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Năm bước, mỗi bước có một câu hỏi và một loại bằng chứng. Thiếu bước nào thì câu chuyện dừng ở đó.</text>
<rect x="888.1" y="22.0" width="83.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="930.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">TỔNG KẾT</text>
<rect x="28.0" y="104.0" width="177.6" height="200.0" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>
<circle cx="52.0" cy="130.0" r="13" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="134.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="72.0" y="135.0" font-size="13" font-weight="800" fill="#15803D" text-anchor="start">Có một vùng</text>
<text x="42.0" y="190.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">FVG 3 nến, cùng khung, đã</text>
<text x="42.0" y="206.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">xác nhận.</text>
<rect x="42.0" y="268.0" width="70.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/>
<text x="77.3" y="281.5" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">QUAN SÁT</text>
<line x1="206.6" y1="219.0" x2="211.4" y2="219.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
<path d="M218.6,219.0 L211.3,222.3 L211.3,215.7 Z" fill="#1F2937"/>
<rect x="219.6" y="104.0" width="177.6" height="200.0" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
<circle cx="243.6" cy="130.0" r="13" fill="#B91C1C" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="243.6" y="134.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="263.6" y="135.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">Vùng bị phá đúng</text>
<text x="263.6" y="152.9" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">cách</text>
<text x="233.6" y="190.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Đóng cửa qua mép xa, trên</text>
<text x="233.6" y="206.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đúng khung của FVG.</text>
<rect x="233.6" y="268.0" width="70.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="268.9" y="281.5" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">QUAN SÁT</text>
<line x1="398.2" y1="219.0" x2="403.0" y2="219.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
<path d="M410.2,219.0 L402.9,222.3 L402.9,215.7 Z" fill="#1F2937"/>
<rect x="411.2" y="104.0" width="177.6" height="200.0" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
<circle cx="435.2" cy="130.0" r="13" fill="#B91C1C" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="435.2" y="134.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="455.2" y="135.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">Giá ở lại bên kia</text>
<text x="425.2" y="190.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Nến sau không lấy lại</text>
<text x="425.2" y="206.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">vùng.</text>
<rect x="425.2" y="268.0" width="70.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="460.5" y="281.5" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">QUAN SÁT</text>
<line x1="589.8" y1="219.0" x2="594.6" y2="219.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
<path d="M601.8,219.0 L594.5,222.3 L594.5,215.7 Z" fill="#1F2937"/>
<rect x="602.8" y="104.0" width="177.6" height="200.0" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<circle cx="626.8" cy="130.0" r="13" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="626.8" y="134.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="646.8" y="135.0" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start">Giá quay lại hỏi</text>
<text x="616.8" y="190.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Retest từ phía bên kia,</text>
<text x="616.8" y="206.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trong bối cảnh phù hợp.</text>
<rect x="616.8" y="268.0" width="70.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="652.1" y="281.5" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">BỐI CẢNH</text>
<line x1="781.4" y1="219.0" x2="786.2" y2="219.0" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round"/>
<path d="M793.4,219.0 L786.1,222.3 L786.1,215.7 Z" fill="#1F2937"/>
<rect x="794.4" y="104.0" width="177.6" height="200.0" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
<circle cx="818.4" cy="130.0" r="13" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="818.4" y="134.2" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="838.4" y="135.0" font-size="13" font-weight="800" fill="#1D4ED8" text-anchor="start">Câu trả lời</text>
<text x="808.4" y="190.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Từ chối → vùng làm việc.</text>
<text x="808.4" y="206.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Lấy lại → inversion giả.</text>
<text x="808.4" y="223.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Không hỏi → không có</text>
<text x="808.4" y="239.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">lệnh.</text>
<rect x="808.4" y="268.0" width="63.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="840.2" y="281.5" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">KẾT QUẢ</text>
<text x="46.0" y="334.0" font-size="13" font-weight="800" fill="#1D4ED8" text-anchor="start">Định nghĩa</text>
<text x="220.0" y="334.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">cho bạn CHỖ (bước 1–3).</text>
<text x="46.0" y="364.0" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start">Bối cảnh</text>
<text x="220.0" y="364.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">cho bạn LÝ DO để quan tâm (D1 bias, DOL, POI, killzone).</text>
<text x="46.0" y="394.0" font-size="13" font-weight="800" fill="#EA580C" text-anchor="start">Hành vi lúc retest</text>
<text x="220.0" y="394.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">cho bạn CÂU TRẢ LỜI — và câu trả lời có thể là 'không'.</text>
<text x="46.0" y="424.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start">Backtest</text>
<text x="220.0" y="424.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">cho bạn biết câu trả lời đó có đáng tiền không.</text>
<rect x="28.0" y="469.0" width="944.0" height="57.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="46.0" y="495.0" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">Cho bé 5 tuổi: sàn bị thủng thì có thể thành trần nhà — nhưng trần này làm bằng giấy. Có khi nó chặn được bạn, có khi bạn nhảy xuyên qua luôn.</text>
<text x="46.0" y="512.5" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">Muốn biết thường xuyên ra sao, bạn phải đếm.</text>
</svg>
