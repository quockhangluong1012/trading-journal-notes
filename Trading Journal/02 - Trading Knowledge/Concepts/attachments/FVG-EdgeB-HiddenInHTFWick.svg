<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="760" rx="14" fill="#131722"/>
  <rect x="1" y="1" width="1278" height="758" rx="14" fill="none" stroke="#2a2e39"/>

  <text x="32" y="42" font-size="26" font-weight="bold" fill="#d1d4dc">FVG "ẩn" trong wick sweep H1 — chỉ thấy trên LTF</text>
  <text x="32" y="66" font-size="15" fill="#787b86">Nến H1 sweep dài, bên trong chứa 3 nến M5 tạo FVG mà H1 không thể hiện</text>

  <!-- LEFT: H1 view, single big candle -->
  <rect x="40" y="100" width="560" height="26" rx="5" fill="#1c2030" stroke="#787b86" stroke-opacity="0.6"/>
  <text x="52" y="118" font-size="14" fill="#787b86">Khung H1 — chỉ thấy một nến sweep dài, "vô nghĩa"</text>

  <rect x="280" y="220" width="40" height="60" fill="#26a69a" rx="1"/>
  <line x1="300" y1="150" x2="300" y2="460" stroke="#26a69a" stroke-width="2"/>
  <text x="220" y="490" font-size="13" fill="#787b86">Nen H1 sweep dai, gia phan ung "vo co"</text>
  <text x="220" y="510" font-size="13" fill="#787b86">o giua wick — khong the giai thich tren H1</text>

  <line x1="60" y1="340" x2="560" y2="340" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="332" font-size="13" fill="#f2c94c">Gia dao chieu tai day, H1 khong co ly do</text>

  <!-- vertical divider -->
  <line x1="640" y1="90" x2="640" y2="740" stroke="#2a2e39" stroke-width="1"/>

  <!-- RIGHT: M5 zoom -->
  <rect x="680" y="100" width="560" height="26" rx="5" fill="#1c2030" stroke="#4a90d9" stroke-opacity="0.6"/>
  <text x="692" y="118" font-size="14" fill="#4a90d9">Zoom M5 — 3 nen tao FVG that nam trong wick</text>

  <g>
    <rect x="720" y="440" width="24" height="30" fill="#ef5350" rx="1"/><line x1="732" y1="425" x2="732" y2="480" stroke="#ef5350"/>
    <rect x="760" y="400" width="24" height="80" fill="#ef5350" rx="1"/><line x1="772" y1="380" x2="772" y2="500" stroke="#ef5350"/>
    <rect x="800" y="440" width="24" height="20" fill="#26a69a" rx="1"/><line x1="812" y1="425" x2="812" y2="470" stroke="#26a69a"/>
  </g>

  <!-- FVG zone between candle wicks n1 high(440) and n3 low(440-20=420 approx) -->
  <rect x="740" y="380" width="80" height="60" fill="#26a69a" opacity="0.16" stroke="#26a69a" stroke-dasharray="5 4" stroke-opacity="0.6"/>
  <text x="840" y="400" font-size="13" fill="#26a69a">M5 bullish FVG that</text>
  <text x="840" y="418" font-size="13" fill="#26a69a">CE = day chinh xac cua wick H1</text>

  <!-- continuation candles bouncing from CE -->
  <g>
    <rect x="850" y="330" width="24" height="70" fill="#26a69a" rx="1"/><line x1="862" y1="315" x2="862" y2="410" stroke="#26a69a"/>
    <rect x="890" y="260" width="24" height="80" fill="#26a69a" rx="1"/><line x1="902" y1="245" x2="902" y2="345" stroke="#26a69a"/>
    <rect x="960" y="200" width="24" height="70" fill="#26a69a" rx="1"/><line x1="972" y1="185" x2="972" y2="275" stroke="#26a69a"/>
  </g>

  <rect x="680" y="560" width="560" height="140" fill="#1c2030" stroke="#f2c94c" stroke-dasharray="6 4"/>
  <text x="696" y="588" font-size="15" font-weight="bold" fill="#f2c94c">Vi sao H1 "phan ung vo co"?</text>
  <text x="696" y="612" font-size="13" fill="#d1d4dc">Displacement that xay ra tren M5, tao FVG</text>
  <text x="696" y="632" font-size="13" fill="#d1d4dc">that su la POI. Tren H1 no chi la 1 wick</text>
  <text x="696" y="652" font-size="13" fill="#d1d4dc">— nhin H1 don doc se bo lo hoan toan ly do</text>
  <text x="696" y="676" font-size="13" fill="#d1d4dc">dao chieu, tuong nham la "ngau nhien"</text>

  <text x="60" y="730" font-size="13" fill="#565b66">Rule: khi H1 co wick dai bat thuong ma khong co POI H1 giai thich duoc, luon zoom M1/M5 truoc khi ket luan "ngau nhien".</text>
</svg>
