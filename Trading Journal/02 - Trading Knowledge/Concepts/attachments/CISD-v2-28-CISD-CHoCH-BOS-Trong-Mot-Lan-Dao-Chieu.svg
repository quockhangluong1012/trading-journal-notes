<line x1="246.5" y1="341.6" x2="634.0" y2="341.6" stroke="#4338CA" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="632.0" y="355.1" font-size="10.5" font-weight="700" fill="#4338CA" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">đáy HL #8–#9 (mốc CHoCH)</text>
<line x1="408.0" y1="394.6" x2="634.0" y2="394.6" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="632.0" y="408.1" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">đáy sau CHoCH (mốc BOS↓)</text>
<line x1="58.1" y1="373.4" x2="203.5" y2="373.4" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="60.1" y="368.4" font-size="9.5" font-weight="700" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">BOS↑ (xu hướng cũ)</text>
<circle cx="405.3" cy="377.5" r="10" fill="#D97706" stroke="none" stroke-width="1.2"/>
<text x="405.3" y="381.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="432.2" cy="414.6" r="10" fill="#4338CA" stroke="none" stroke-width="1.2"/>
<text x="432.2" y="418.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="539.8" cy="457.1" r="10" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="539.8" y="461.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="190.0" cy="283.1" r="10" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="190.0" y="287.1" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<rect x="668.0" y="108.0" width="304.0" height="93.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="680.0" y="132.3" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">① Bearish CISD (#13)</text>
<text x="680.0" y="154.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Chặng tăng #9–#10 bị lấy lại hết theo giá đóng</text>
<text x="680.0" y="170.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">cửa. Cấu trúc tăng vẫn còn nguyên (HL chưa bị</text>
<text x="680.0" y="186.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">phá).</text>
<rect x="668.0" y="209.5" width="304.0" height="93.5" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.3"/>
<text x="680.0" y="233.8" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start">② CHoCH (#14)</text>
<text x="680.0" y="255.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Lần ĐẦU giá đóng dưới đáy HL được bảo vệ của xu</text>
<text x="680.0" y="271.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">hướng tăng → “tính cách” cấu trúc đổi. (Nhiều</text>
<text x="680.0" y="287.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">người gọi đây là MSS.)</text>
<rect x="668.0" y="310.9" width="304.0" height="77.4" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<text x="680.0" y="335.3" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">③ BOS↓ (#18)</text>
<text x="680.0" y="357.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá phá tiếp đáy mới theo hướng xuống. Cấu trúc</text>
<text x="680.0" y="373.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">giảm đang được xác nhận thêm.</text>
<rect x="668.0" y="396.3" width="304.0" height="93.5" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="680.0" y="420.6" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">Ghi nhớ</text>
<text x="680.0" y="442.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">BOS = phá cùng chiều cấu trúc. CHoCH/MSS = phá</text>
<text x="680.0" y="458.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ngược chiều. CISD = không cần swing, chỉ cần</text>
<text x="680.0" y="474.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">open của chuỗi.</text>
</svg>
