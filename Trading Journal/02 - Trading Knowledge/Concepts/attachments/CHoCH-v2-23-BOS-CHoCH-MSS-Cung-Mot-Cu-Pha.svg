<text x="362.0" y="402.5" font-size="12" font-weight="400" fill="#111827" data-bx="361.0,637.0">Phá NGƯỢC trạng thái, lần đầu, đúng</text>
<text x="362.0" y="419.5" font-size="12" font-weight="400" fill="#111827" data-bx="361.0,637.0">protected high → “character” đổi. Chưa đòi</text>
<text x="362.0" y="436.5" font-size="12" font-weight="400" fill="#111827" data-bx="361.0,637.0">displacement.</text>
