<text x="680.0" y="402.5" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">Cùng cú phá ngược trạng thái, nhưng bằng</text>
<text x="680.0" y="419.5" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">chân sóng nhanh, thân nến lớn, để lại FVG.</text>
<rect x="28.0" y="512.5" width="944.0" height="50.5" rx="8" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="512.5" width="4.0" height="50.5" rx="2" fill="#2563EB"/>
<text x="42.0" y="532.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">Không có định nghĩa chuẩn. Đa số tài liệu SMC: CHoCH = cú phá ngược trạng thái đầu tiên (không đòi displacement). innercircletrader.net, ICT 2022: MSS =</text>
<text x="42.0" y="549.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">cú phá đó CÓ displacement. Một số nơi dùng hai chữ như nhau. Vault này: dùng thang G0–G3 (hình 24).</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Hệ quả: trước khi gọi tên một cú phá, phải khai báo trạng thái hiện tại của lớp và khung đang xét. Không khai báo → hai người gọi cùng một nến bằng hai tên.</text>
