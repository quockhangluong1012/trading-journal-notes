<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">M5 có thể cho biết gì — và KHÔNG THỂ cho biết gì</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">M5 là kính hiển vi đặt đúng chỗ, đúng lúc. Đặt sai chỗ, nó vẫn cho hình ảnh rất sắc nét — của nhiễu.</text>
<rect x="26.0" y="84.0" width="470.0" height="330.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="26.0" y="84.0" width="470.0" height="6.0" rx="3" fill="#15803D" stroke="none" stroke-width="0"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#15803D" text-anchor="start">M5 CÓ THỂ cho biết</text>
<text x="40.0" y="126.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="126.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Một pool ĐÃ đánh dấu trước có bị quét không, sâu bao nhiêu,</text>
<text x="53.0" y="142.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">reclaim nhanh không</text>
<text x="40.0" y="164.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="164.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Mốc MSS ĐÃ đánh dấu có bị phá bằng thân nến + displacement</text>
<text x="53.0" y="180.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">không</text>
<text x="40.0" y="202.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="202.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Chuỗi sự kiện có xảy ra trong đúng zone, đúng giờ không</text>
<text x="40.0" y="224.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="224.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Địa chỉ thực thi (FVG), vị trí stop theo cấu trúc, khoảng</text>
<text x="53.0" y="240.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">cách tới mục tiêu</text>
<text x="40.0" y="262.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="262.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Setup này còn hợp lệ hay đã fail (để quay lên đúng tầng)</text>
<rect x="504.0" y="84.0" width="470.0" height="330.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="504.0" y="84.0" width="470.0" height="6.0" rx="3" fill="#B91C1C" stroke="none" stroke-width="0"/>
<text x="518.0" y="108.0" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">M5 KHÔNG THỂ cho biết</text>
<text x="518.0" y="126.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="126.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Daily Bias đúng hay sai (một MSS M5 phá micro swing L1)</text>
<text x="518.0" y="148.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="148.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá 'chắc chắn' sẽ tới DOL — M5 chỉ cho bằng chứng tại chỗ,</text>
<text x="531.0" y="164.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">không cho xác suất đích</text>
<text x="518.0" y="186.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="186.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Ý định của 'smart money' — chart không chứa danh tính người</text>
<text x="531.0" y="202.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">đặt lệnh</text>
<text x="518.0" y="224.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="224.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Một MSS ở giữa range có ý nghĩa gì — nếu không có zone và mốc</text>
<text x="531.0" y="240.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">định sẵn</text>
<text x="518.0" y="262.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="531.0" y="262.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Bối cảnh: mọi thứ M5 nói phải được đọc TRONG khung D1/H1</text>
<rect x="26.0" y="428.0" width="948.0" height="114.0" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="42.0" y="452.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao M5 dễ đánh lừa:</text>
<text x="42.0" y="474.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="474.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Mỗi phiên M5 có hàng chục swing; trên dữ liệu ngẫu nhiên, chuỗi 'sweep → reclaim' vẫn xuất hiện thường xuyên (null model: 01c</text>
<text x="55.0" y="489.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">§4.6)</text>
<text x="42.0" y="509.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="509.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Vì vậy giá trị của M5 đến từ ĐIỀU KIỆN đặt nó (zone + giờ + mốc định trước), không đến từ hình dạng đẹp của tín hiệu</text>
</svg>
