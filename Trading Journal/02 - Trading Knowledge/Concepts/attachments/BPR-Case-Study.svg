<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: GBPUSD Short 14/09/2026 — BPR đẹp như sách nhưng THUA</text>
  <text x="30" y="63" font-size="15" fill="#94a3b8">Mọi tiêu chí hình thức đạt, nhưng thiếu xác nhận MSS LTF trước entry — kết quả -1.1R</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="60" y1="140" x2="1150" y2="140"/>
    <line x1="60" y1="260" x2="1150" y2="260"/>
    <line x1="60" y1="380" x2="1150" y2="380"/>
    <line x1="60" y1="500" x2="1150" y2="500"/>
    <line x1="60" y1="620" x2="1150" y2="620"/>
  </g>
  <text x="1155" y="264" font-size="9.0" fill="#94a3b8">62205 BSL</text>
  <text x="1155" y="384" font-size="12" fill="#94a3b8">62168</text>
  <text x="1155" y="440" font-size="9.0" fill="#a78bfa">62154 CE</text>
  <text x="1155" y="504" font-size="12" fill="#94a3b8">62140</text>

  <!-- rally into sweep -->
  <g>
    <rect x="90" y="330" width="16" height="60" fill="#22c55e"/>
    <rect x="130" y="300" width="16" height="55" fill="#22c55e"/>
    <rect x="170" y="270" width="16" height="55" fill="#22c55e"/>
    <line x1="187" y1="255" x2="187" y2="330" stroke="#eab308" stroke-width="2" stroke-dasharray="4,3"/>
  </g>
  <text x="90" y="240" font-size="13" fill="#eab308" font-weight="bold">① 09:00 sweep BSL 62205</text>

  <!-- bullish FVG leg -->
  <rect x="120" y="345" width="90" height="45" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-dasharray="3,2"/>
  <text x="120" y="410" font-size="12" fill="#22c55e">bullish FVG 62140-62175</text>

  <!-- displacement down -->
  <g>
    <rect x="230" y="270" width="16" height="140" fill="#ef4444"/>
    <line x1="238" y1="255" x2="238" y2="420" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="230" y="245" font-size="13" fill="#ef4444" font-weight="bold">② 10:00 displacement giảm mạnh</text>
  <rect x="220" y="380" width="90" height="45" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-dasharray="3,2"/>
  <text x="220" y="440" font-size="11" fill="#ef4444">bearish FVG 62130-62168</text>

  <!-- BPR overlap zone -->
  <rect x="290" y="380" width="130" height="45" fill="#a78bfa" opacity="0.35" stroke="#a78bfa" stroke-width="2"/>
  <text x="295" y="472" font-size="13" fill="#a78bfa" font-weight="bold">BPR 62140-62168, CE=62154</text>

  <!-- retest chop (no MSS) -->
  <g>
    <rect x="460" y="390" width="16" height="35" fill="#22c55e"/>
    <rect x="500" y="385" width="16" height="35" fill="#ef4444"/>
    <rect x="540" y="392" width="16" height="30" fill="#22c55e"/>
    <rect x="580" y="388" width="16" height="35" fill="#ef4444"/>
  </g>
  <text x="450" y="365" font-size="13" fill="#38bdf8" font-weight="bold">③ 10:15 entry Short CE 62154 (limit)</text>
  <text x="450" y="470" font-size="12" fill="#f97316">Lình xình 45 phút — KHÔNG có MSS M5 xác nhận</text>
  <text x="450" y="488" font-size="12" fill="#f97316">(bỏ qua bước bắt buộc trong checklist mục 4)</text>

  <!-- reversal up through -->
  <g>
    <rect x="650" y="330" width="16" height="60" fill="#22c55e"/>
    <rect x="690" y="270" width="16" height="70" fill="#22c55e"/>
    <rect x="730" y="220" width="16" height="60" fill="#22c55e"/>
    <line x1="738" y1="200" x2="738" y2="290" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="650" y="205" font-size="13" fill="#ef4444" font-weight="bold">④ 11:30 displacement tăng bất ngờ xuyên BPR</text>

  <!-- SL line -->
  <line x1="60" y1="210" x2="1150" y2="210" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1005" y="204" font-size="13" fill="#ef4444" font-weight="bold">SL 62210</text>

  <!-- entry line -->
  <line x1="60" y1="440" x2="1150" y2="440" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1000" y="434" font-size="13" fill="#38bdf8" font-weight="bold">Entry 62154 (CE)</text>

  <text x="800" y="230" font-size="14" fill="#ef4444" font-weight="bold">⑤ SL chạm 62210 → -1.1R</text>

  <!-- bottom callout box -->
  <g transform="translate(60,650)">
    <rect x="0" y="0" width="1090" height="75" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="16" y="24" font-size="14" fill="#e2e8f0" font-weight="bold">Bài học: checklist hình thức đạt 100% (sweep, PD, bias, overlap đo được) vẫn thua vì thiếu MSS LTF xác nhận</text>
    <text x="16" y="46" font-size="13" fill="#94a3b8">Nguyên nhân thật: BoE official remarks bất ngờ (không trong lịch kinh tế chuẩn) — giới hạn cứng #3, #5 của Critique (mục 18.3)</text>
    <text x="16" y="64" font-size="13" fill="#94a3b8">Nếu chờ M5 MSS xác nhận trước entry: có thể tránh lệnh này hoàn toàn hoặc vào muộn hơn với xác nhận thật</text>
  </g>
</svg>