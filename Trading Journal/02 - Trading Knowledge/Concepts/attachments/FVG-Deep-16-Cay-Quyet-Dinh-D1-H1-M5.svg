<rect x="0" y="0" width="980" height="760" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Cây quyết định thời gian thực: dùng FVG trong khung D1 → H1 → M5</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi nút là một câu hỏi có thể trả lời TẠI thời điểm đó (không cần biết tương lai). Nhánh 'không' = không có lệnh — đó là kết quả hợp lệ.</text>
