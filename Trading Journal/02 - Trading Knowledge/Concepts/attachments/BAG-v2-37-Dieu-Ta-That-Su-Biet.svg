<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="885.9" y="22" width="86.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="929.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">EVIDENCE</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Điều ta thật sự biết — Từ chắc chắn đến không có cơ sở</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi nhận định trong note được đặt vào một bậc. Càng lên cao càng chắc chắn. Đừng để nhận định ở bậc dưới mượn độ tin cậy của bậc trên.</text>
<rect x="28.0" y="100.0" width="944.0" height="72.0" rx="10" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.4"/>
<text x="44.0" y="124.0" font-size="12.5" font-weight="800" fill="#0F9D74" text-anchor="start">CƠ CHẾ THỊ TRƯỜNG — chắc chắn</text>
<text x="44.0" y="146.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá chỉ khớp ở nơi có lệnh đối ứng. Gap mở cửa có thể xảy ra khi không có khớp lệnh liên tục. Gap trên chart phụ thuộc phiên và nguồn dữ liệu.</text>
<rect x="50.0" y="182.0" width="900.0" height="72.0" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="66.0" y="206.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start">THUẬT NGỮ TA — định nghĩa đã được công nhận</text>
<text x="66.0" y="228.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Bốn loại gap (common, breakaway, runaway, exhaustion) được đặt tên theo vị trí trong cấu trúc. Breakaway = rời vùng tích lũy.</text>
<rect x="72.0" y="264.0" width="856.0" height="72.0" rx="10" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.4"/>
<text x="88.0" y="288.0" font-size="12.5" font-weight="800" fill="#0E7490" text-anchor="start">QUAN SÁT THỐNG KÊ CÓ NGUỒN — có điều kiện</text>
<text x="88.0" y="310.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Bulkowski: breakaway gap hiếm khi bị lấp trong tuần đầu (cổ phiếu, thị trường tăng). Nghiên cứu học thuật: kết quả khác nhau theo thị trường.</text>
<rect x="94.0" y="346.0" width="812.0" height="72.0" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="110.0" y="370.0" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="start">CÁCH DÙNG TRONG ICT — diễn giải</text>
<text x="110.0" y="392.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cộng đồng ICT dùng tên này cho FVG không bị quay lại. Chưa tìm được định nghĩa nguyên văn của ICT.</text>
<rect x="116.0" y="428.0" width="768.0" height="72.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="132.0" y="452.0" font-size="12.5" font-weight="800" fill="#D97706" text-anchor="start">GIẢI THÍCH HỢP LÝ — chưa kiểm chứng trên chart</text>
<text x="132.0" y="474.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh dừng lỗ và lệnh dồn qua đêm cung cấp lực 'một lần'; biên cũ thành hỗ trợ vì lệnh chờ.</text>
<rect x="138.0" y="510.0" width="724.0" height="72.0" rx="10" fill="#FBE3E4" stroke="#E0464B" stroke-width="1.4"/>
<text x="154.0" y="534.0" font-size="12.5" font-weight="800" fill="#E0464B" text-anchor="start">KHÔNG CÓ CƠ SỞ</text>
<text x="154.0" y="556.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">'Gap nào cũng phải lấp.' 'Gap to = mạnh.' 'Gap không lấp = tổ chức đang mua.' 'Breakaway luôn mở ra trend mới.'</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
