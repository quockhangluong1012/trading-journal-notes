<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" textLength="1154" lengthAdjust="spacingAndGlyphs">Edge Case: Mitigation Block trong thị trường trending mạnh — khi mọi pullback "trông giống MB"</text>
  <text x="40" y="63" font-size="15" fill="#94a3b8">Trend mạnh tạo ra hàng loạt higher low không sweep — không phải tất cả đều là Mitigation Block có ý nghĩa giao dịch</text>

  <!-- uptrend price action with multiple higher lows -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#1c2333"/>
  <text x="1080" y="595" font-size="12" fill="#94a3b8">Trục thời gian →</text>

  <!-- trend line -->
  <line x1="80" y1="560" x2="1120" y2="180" stroke="#334155" stroke-dasharray="5,4" stroke-width="1.5"/>
  <text x="900" y="200" font-size="12" fill="#94a3b8">Xu hướng tăng mạnh, không hồi sâu</text>

  <!-- series of up candles with small higher lows -->
  <g>
    <rect x="100" y="500" width="14" height="40" fill="#22c55e"/><line x1="107" y1="490" x2="107" y2="550" stroke="#22c55e" stroke-width="2"/>
    <rect x="130" y="470" width="14" height="35" fill="#22c55e"/><line x1="137" y1="460" x2="137" y2="515" stroke="#22c55e" stroke-width="2"/>
    <rect x="160" y="500" width="14" height="18" fill="#ef4444"/><line x1="167" y1="492" x2="167" y2="522" stroke="#ef4444" stroke-width="2"/>
    <circle cx="167" cy="518" r="4" fill="#eab308"/>
    <text x="145" y="545" font-size="11" fill="#eab308">HL 1</text>
  </g>

  <g>
    <rect x="220" y="430" width="14" height="40" fill="#22c55e"/><line x1="227" y1="420" x2="227" y2="480" stroke="#22c55e" stroke-width="2"/>
    <rect x="250" y="400" width="14" height="35" fill="#22c55e"/><line x1="257" y1="390" x2="257" y2="445" stroke="#22c55e" stroke-width="2"/>
    <rect x="280" y="430" width="14" height="15" fill="#ef4444"/><line x1="287" y1="424" x2="287" y2="452" stroke="#ef4444" stroke-width="2"/>
    <circle cx="287" cy="448" r="4" fill="#eab308"/>
    <text x="260" y="475" font-size="11" fill="#eab308">HL 2</text>
  </g>

  <g>
    <rect x="340" y="360" width="14" height="40" fill="#22c55e"/><line x1="347" y1="350" x2="347" y2="410" stroke="#22c55e" stroke-width="2"/>
    <rect x="370" y="330" width="14" height="35" fill="#22c55e"/><line x1="377" y1="320" x2="377" y2="375" stroke="#22c55e" stroke-width="2"/>
    <rect x="400" y="360" width="14" height="14" fill="#ef4444"/><line x1="407" y1="354" x2="407" y2="380" stroke="#ef4444" stroke-width="2"/>
    <circle cx="407" cy="376" r="4" fill="#eab308"/>
    <text x="380" y="405" font-size="11" fill="#eab308">HL 3</text>
  </g>

  <g>
    <rect x="460" y="290" width="14" height="40" fill="#22c55e"/><line x1="467" y1="280" x2="467" y2="340" stroke="#22c55e" stroke-width="2"/>
    <rect x="490" y="260" width="14" height="35" fill="#22c55e"/><line x1="497" y1="250" x2="497" y2="305" stroke="#22c55e" stroke-width="2"/>
    <rect x="520" y="290" width="14" height="13" fill="#ef4444"/><line x1="527" y1="284" x2="527" y2="308" stroke="#ef4444" stroke-width="2"/>
    <circle cx="527" cy="306" r="4" fill="#eab308"/>
    <text x="500" y="335" font-size="11" fill="#eab308">HL 4</text>
  </g>

  <rect x="620" y="180" width="500" height="90" fill="#1e293b" stroke="#f97316" rx="6"/>
  <text x="640" y="205" font-size="14" fill="#f97316" font-weight="bold">Câu hỏi bẫy: HL nào mới là "Mitigation Block"?</text>
  <text x="640" y="228" font-size="13" fill="#94a3b8">Nếu gắn nhãn MB cho MỌI higher low trong trend này,</text>
  <text x="640" y="246" font-size="13" fill="#94a3b8">khái niệm mất hết ý nghĩa lọc lựa — 4 HL liên tiếp không</text>
  <text x="640" y="264" font-size="13" fill="#94a3b8">thể đều là "điểm vào tối ưu" ngang giá trị nhau.</text>

  <rect x="30" y="480" width="1140" height="200" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="55" y="510" font-size="16" fill="#e2e8f0" font-weight="bold">Tiêu chí lọc bổ sung khi trend đang mạnh</text>
  <text x="55" y="538" font-size="13" fill="#94a3b8">• Độ sâu hồi: MB có ý nghĩa cần hồi về vùng discount/premium hợp lý (Fibo 50-70%), không phải hồi nông &lt;20% biên độ.</text>
  <text x="55" y="560" font-size="13" fill="#94a3b8">• Thời gian hồi: cần ít nhất 2-3 nến LTF tạo cấu trúc rõ (không phải chỉ 1 nến rút chân rồi tiếp diễn ngay).</text>
  <text x="55" y="582" font-size="13" fill="#94a3b8">• Vị trí trong dealing range: chỉ ưu tiên HL nằm gần discount/equilibrium của range hiện tại, bỏ qua HL nằm sâu trong premium.</text>
  <text x="55" y="604" font-size="13" fill="#94a3b8">• Confluence: HL trùng FVG/OB cũ hoặc mức Fibo quan trọng có giá trị cao hơn HL "trơn" không có gì hỗ trợ.</text>
  <text x="55" y="632" font-size="13" fill="#f97316" font-weight="bold">Nguyên tắc: trong trend rất mạnh, KHÔNG trade mọi MB — chỉ trade MB đầu tiên sau một nhịp mở rộng đáng kể (thường là</text>
  <text x="55" y="652" font-size="13" fill="#f97316" font-weight="bold">HL đầu tiên sau leg tăng mạnh nhất), các HL liên tiếp sau đó có xác suất giảm dần do dealing range bị thu hẹp.</text>
</svg>