<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="32" font-size="15.5" font-weight="700" fill="#1F2937">Giải phẫu "biển đối ứng" — SM mua bằng cách nào ở đáy</text>
<text x="24" y="52" font-size="11.5" fill="#6B7280">Sell-side raid: đẩy giá xuống dưới đáy cũ → kích hoạt thác lệnh BÁN → SM âm thầm MUA vào</text>
<rect x="24" y="66" width="470" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<line x1="44" y1="150" x2="474" y2="150" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="48" y="144" font-size="9.5" fill="#6B7280">đáy cũ "hiển nhiên" — nơi cụm stop dày đặc</text>
<rect x="44" y="150" width="430" height="70" fill="#DC2626" opacity="0.08"/>
<text x="300" y="168" font-size="9" fill="#B91C1C">vùng gom đối ứng (stop + breakout bán)</text>
<line x1="44" y1="360" x2="474" y2="360" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="48" y="375" font-size="9.5" font-weight="700" fill="#1D4ED8">DOL đối diện (BSL) = target sau đảo</text>
<path d="M60,300 L92,255 L120,225 L150,190 L175,165 L195,178 L210,200 L228,215 L248,205 L262,175 L285,135 L320,110 L360,95" fill="none" stroke="#374151" stroke-width="2.2"/>
<circle cx="228" cy="215" r="6" fill="none" stroke="#B45309" stroke-width="2.4"/>
<text x="150" y="242" font-size="9.5" font-weight="700" fill="#B45309">quét dưới đáy = stops fire</text>
<circle cx="262" cy="175" r="5" fill="none" stroke="#15803D" stroke-width="2.2"/>
<text x="270" y="168" font-size="9.5" fill="#15803D">rejection + MSS → SM đã gom xong</text>
<!-- SM buy arrows into the sea -->
<text x="60" y="330" font-size="9.5" font-weight="700" fill="#166534">↑ SM MUA vào thác lệnh bán này</text>
<!-- right legend of 4 counterparty groups -->
<rect x="506" y="66" width="230" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="520" y="88" font-size="12" font-weight="700" fill="#1F2937">Ai BÁN cho SM ở đáy?</text>
<rect x="518" y="100" width="206" height="76" rx="6" fill="#FEF2F2"/>
<text x="526" y="118" font-size="10.5" font-weight="700" fill="#B91C1C">1· Stop-loss phe Long</text>
<text x="526" y="134" font-size="9.5" fill="#374151">stop = lệnh BÁN cưỡng bức,</text>
<text x="526" y="148" font-size="9.5" fill="#374151">nguồn đối ứng LỚN NHẤT.</text>
<text x="526" y="166" font-size="9" fill="#6B7280">đặt ngay dưới đáy "hiển nhiên"</text>
<rect x="518" y="184" width="206" height="60" rx="6" fill="#FFF7ED"/>
<text x="526" y="202" font-size="10.5" font-weight="700" fill="#9A3412">2· Breakout sellers</text>
<text x="526" y="218" font-size="9.5" fill="#374151">bán đuổi vì tưởng "phá đáy</text>
<text x="526" y="232" font-size="9.5" fill="#374151">= trend giảm".</text>
<rect x="518" y="252" width="206" height="60" rx="6" fill="#FEFCE8"/>
<text x="526" y="270" font-size="10.5" font-weight="700" fill="#854D0E">3· FOMO / hoảng loạn</text>
<text x="526" y="286" font-size="9.5" fill="#374151">bán tháo khi thấy nến đỏ</text>
<text x="526" y="300" font-size="9.5" fill="#374151">mạnh — cảm xúc, không lý trí.</text>
<rect x="518" y="320" width="206" height="66" rx="6" fill="#EFF6FF"/>
<text x="526" y="338" font-size="10.5" font-weight="700" fill="#1D4ED8">4· Mandate khác</text>
<text x="526" y="354" font-size="9.5" fill="#374151">ETF/index rút vốn, hedger</text>
<text x="526" y="368" font-size="9.5" fill="#374151">đóng vị thế — bán vì NGHĨA</text>
<text x="526" y="382" font-size="9.5" fill="#374151">VỤ, không vì quan điểm giá.</text>
<text x="520" y="410" font-size="9.5" fill="#374151">Ở ĐỈNH: đối xứng hoàn toàn</text>
<text x="520" y="426" font-size="9.5" fill="#374151">(4 nhóm này MUA cho SM bán).</text>
</svg>