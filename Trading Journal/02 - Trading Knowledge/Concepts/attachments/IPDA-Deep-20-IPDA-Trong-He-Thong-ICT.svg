<text x="490.0" y="553.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">Không có tín hiệu "IPDA mua". Mọi quyết định vào lệnh vẫn phải qua D1 → H1 → M5 với điều kiện và invalidation viết trước.</text>
