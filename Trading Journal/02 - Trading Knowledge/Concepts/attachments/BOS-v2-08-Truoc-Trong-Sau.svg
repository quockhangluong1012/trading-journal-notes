<circle cx="166.3" cy="247.2" r="3.6" fill="#1D9E75"/>
<text x="166.3" y="265.7" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<circle cx="142.6" cy="191.4" r="3" fill="#7C3AED"/>
<circle cx="160.4" cy="188.4" r="3" fill="#7C3AED"/>
<circle cx="178.2" cy="191.4" r="3" fill="#7C3AED"/>
<circle cx="195.9" cy="188.4" r="3" fill="#7C3AED"/>
<circle cx="213.7" cy="191.4" r="3" fill="#7C3AED"/>
<circle cx="231.4" cy="188.4" r="3" fill="#7C3AED"/>
<circle cx="249.2" cy="191.4" r="3" fill="#7C3AED"/>
<text x="134.7" y="178.4" font-size="11" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">lệnh hẹn phía trên đỉnh</tspan></text>
<text x="199.9" y="224.3" font-size="11" fill="#1F2937" text-anchor="start"><tspan>← quay lại gần đỉnh</tspan></text>
<rect x="384.0" y="112.0" width="332.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="386.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">2. TRONG: giá vượt đỉnh cũ</tspan></text>
<line x1="478.9" y1="201.4" x2="700.0" y2="201.4" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="700.0" y="196.4" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ H</tspan></text>
<polyline points="400.0,293.1 478.9,201.4 526.3,247.2 557.9,219.7 581.6,192.2 593.4,185.3" fill="none" stroke="#1F2937" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="478.9" cy="201.4" r="3.6" fill="#D85A30"/>
<circle cx="526.3" cy="247.2" r="3.6" fill="#1D9E75"/>
<text x="526.3" y="265.7" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<rect x="569.7" y="178.4" width="35.5" height="32.1" rx="2" fill="#FEF7E6" stroke="#B45309" stroke-width="0.8" opacity="0.6"/>
<line x1="589.5" y1="187.6" x2="494.7" y2="150.3" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="494.7" y="128.3" font-size="11" fill="#B45309" text-anchor="start"><tspan>lệnh hẹn bật thành lệnh mua;</tspan></text>
<text x="494.7" y="142.3" font-size="11" fill="#B45309" text-anchor="start"><tspan>người bán ở H bị mua hết</tspan></text>
<text x="605.4" y="219.3" font-size="10.5" fill="#6B7280" text-anchor="start"><tspan>đang diễn ra</tspan></text>
<rect x="744.0" y="112.0" width="332.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="746.0" y="104.0" font-size="13" fill="#2563EB" text-anchor="start"><tspan font-weight="700">3. SAU: giá ở lại phía trên</tspan></text>
<line x1="838.9" y1="201.4" x2="1060.0" y2="201.4" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="1060.0" y="196.4" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ H</tspan></text>
<polyline points="760.0,293.1 838.9,201.4 886.3,247.2 917.9,219.7 941.6,192.2 953.4,185.3 977.1,169.3 1000.8,187.6 1044.2,146.3" fill="none" stroke="#1F2937" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="838.9" cy="201.4" r="3.6" fill="#D85A30"/>
<circle cx="886.3" cy="247.2" r="3.6" fill="#1D9E75"/>
<text x="886.3" y="265.7" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<line x1="886.3" y1="247.2" x2="1060.0" y2="247.2" stroke="#1D9E75" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="1060.0" y="261.2" font-size="11" fill="#1D9E75" text-anchor="end"><tspan>HL = đáy cần giữ mới</tspan></text>
<text x="971.1" y="164.7" font-size="11" fill="#1D9E75" text-anchor="end"><tspan font-weight="700">giá ở lại trên H</tspan></text>
<rect x="24.0" y="348.0" width="332.0" height="108.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="36.0" y="368.0" font-size="12" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Đã biết:</tspan><tspan> Có một đỉnh đã xác nhận (H) và một đáy cao</tspan></text>
<text x="36.0" y="384.6" font-size="12" fill="#1D9E75" text-anchor="start"><tspan>hơn (HL). Cấu trúc đang tăng.</tspan></text>
<text x="36.0" y="405.1" font-size="12" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Chưa biết:</tspan><tspan> Giá có vượt H được không.</tspan></text>
<rect x="384.0" y="348.0" width="332.0" height="108.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="396.0" y="368.0" font-size="12" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Đã biết:</tspan><tspan> Giá đã giao dịch trên H. Có lực mua đủ để</tspan></text>
<text x="396.0" y="384.6" font-size="12" fill="#1D9E75" text-anchor="start"><tspan>chạm và vượt.</tspan></text>
<text x="396.0" y="405.1" font-size="12" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Chưa biết:</tspan><tspan> Nến sẽ đóng ở đâu; giá ở lại hay bị đẩy về.</tspan></text>
<text x="396.0" y="421.7" font-size="12" fill="#DC2626" text-anchor="start"><tspan>Trạng thái: CHỜ.</tspan></text>
<rect x="744.0" y="348.0" width="332.0" height="108.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="756.0" y="368.0" font-size="12" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Đã biết:</tspan><tspan> Giá được chấp nhận phía trên H; HL thành</tspan></text>
<text x="756.0" y="384.6" font-size="12" fill="#1D9E75" text-anchor="start"><tspan>đáy cần giữ; bản đồ phải vẽ lại.</tspan></text>
<text x="756.0" y="405.1" font-size="12" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Chưa biết:</tspan><tspan> Giá sẽ đi tiếp bao xa; khung lớn hơn có</tspan></text>
<text x="756.0" y="421.7" font-size="12" fill="#DC2626" text-anchor="start"><tspan>đồng ý không.</tspan></text>
</svg>
