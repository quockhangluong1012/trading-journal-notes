<svg viewBox="0 0 1100 470" width="1100" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Trước – Trong – Sau một BOS tăng: chuyện gì đang xảy ra ở từng giai đoạn</title>
<desc>Trước – Trong – Sau một BOS tăng: chuyện gì đang xảy ra ở từng giai đoạn. Đọc từ trái sang phải như ba khung hình của một đoạn phim. Mỗi khung có điều đã biết và điều chưa biết.</desc>
