<text x="680.0" y="414.9" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">Đỉnh, đáy chồng lên nhau, không có thói quen.</text>
<text x="680.0" y="432.0" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">Phá đỉnh nhỏ hay đáy nhỏ đều không đổi “tính</text>
<text x="680.0" y="449.0" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">cách” nào cả.</text>
<rect x="680.0" y="482.9" width="106.5" height="20.0" rx="10.0" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="733.2" y="495.1" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">CHoCH vô nghĩa</text>
<text x="28.0" y="557.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Hệ quả thực hành: bước đầu tiên của mọi nhận diện CHoCH là KHAI BÁO trạng thái hiện tại (trên khung nào, ở lớp nào). Không khai báo được → không gọi</text>
<text x="28.0" y="574.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">CHoCH.</text>
