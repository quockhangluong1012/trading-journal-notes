<circle cx="255.9" cy="187.4" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="293.3" cy="230.1" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="44.0" y="414.9" font-size="12" font-weight="400" fill="#111827" data-bx="43.0,319.0">Có thói quen rõ: đáy sau cao hơn đáy trước.</text>
<text x="44.0" y="432.0" font-size="12" font-weight="400" fill="#111827" data-bx="43.0,319.0">Phá protected low = CHoCH có nghĩa.</text>
<rect x="44.0" y="482.9" width="106.5" height="20.0" rx="10.0" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="97.3" y="495.1" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">CHoCH có nghĩa</text>
