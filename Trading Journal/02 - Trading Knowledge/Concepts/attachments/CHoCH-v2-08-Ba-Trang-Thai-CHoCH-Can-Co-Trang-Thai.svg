<circle cx="611.3" cy="315.7" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="362.0" y="414.9" font-size="12" font-weight="400" fill="#111827" data-bx="361.0,637.0">Có thói quen rõ: đỉnh sau thấp hơn đỉnh trước.</text>
<text x="362.0" y="432.0" font-size="12" font-weight="400" fill="#111827" data-bx="361.0,637.0">Phá protected high = CHoCH có nghĩa.</text>
