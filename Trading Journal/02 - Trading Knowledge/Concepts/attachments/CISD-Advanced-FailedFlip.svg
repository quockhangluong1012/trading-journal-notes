<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Edge case — Failed CISD tự trở thành CISD ngược (flip → IFVG)</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Một bullish CISD thất bại thường lộ order flow thật và flip thành bearish CISD — chỉ trade khi THUẬN Daily Bias</text>
  <rect x="24" y="70" width="712" height="374" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <marker id="cflip1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
  </marker>

  <!-- CISD level (bullish attempt) -->
  <line x1="90" y1="200" x2="710" y2="200" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="486" y="176" font-size="10.5" font-weight="700" fill="#1D4ED8">CISD level (open chuỗi đỏ)</text>
  <!-- SSL below -->
  <line x1="60" y1="360" x2="380" y2="360" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="66" y="354" font-size="10" fill="#B45309">SSL (sweep #1)</text>
  <line x1="380" y1="410" x2="700" y2="410" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="536" y="404" font-size="10" fill="#B45309">SSL kế tiếp (draw thật HTF)</text>

  <!-- bearish delivery leg down to sweep -->
  <rect x="110" y="150" width="2" height="130" fill="#DC2626"/><rect x="102" y="158" width="14" height="110" fill="#DC2626" rx="1"/>
  <rect x="142" y="230" width="2" height="130" fill="#DC2626"/><rect x="134" y="240" width="14" height="108" fill="#DC2626" rx="1"/>
  <circle cx="141" cy="360" r="7" fill="none" stroke="#B45309" stroke-width="2.2"/>

  <!-- green candle closes ABOVE CISD level = bullish CISD attempt -->
  <rect x="178" y="150" width="2" height="215" fill="#16A34A"/><rect x="170" y="168" width="14" height="120" fill="#16A34A" rx="1"/>
  <circle cx="177" cy="168" r="9" fill="none" stroke="#15803D" stroke-width="2"/>
  <text x="177" y="163" font-size="11" font-weight="700" fill="#15803D">①</text>
  <text x="192" y="150" font-size="10" font-weight="700" fill="#15803D">Nến đóng qua level → tưởng bullish CISD</text>

  <!-- failure candle: closes body back BELOW CISD level -->
  <rect x="230" y="176" width="2" height="150" fill="#DC2626"/><rect x="222" y="180" width="14" height="120" fill="#DC2626" rx="1"/>
  <circle cx="229" cy="234" r="9" fill="none" stroke="#B91C1C" stroke-width="2"/>
  <text x="229" y="239" font-size="11" font-weight="700" fill="#B91C1C">②</text>
  <text x="244" y="222" font-size="10" font-weight="700" fill="#B91C1C">FAILED — đóng body trở lại DƯỚI level</text>

  <!-- IFVG box (failed FVG becomes inverse) -->
  <rect x="218" y="200" width="30" height="34" fill="#3B82F6" opacity="0.16"/>
  <text x="252" y="256" font-size="9" font-weight="700" fill="#1D4ED8">FVG cú thất bại → IFVG (hỗ trợ hướng ngược)</text>

  <!-- flip into bearish CISD -->
  <circle cx="300" cy="205" r="9" fill="none" stroke="#B91C1C" stroke-width="2"/>
  <text x="300" y="210" font-size="11" font-weight="700" fill="#B91C1C">③</text>
  <text x="316" y="214" font-size="10" font-weight="700" fill="#B91C1C">Level flip → bearish CISD (cần RE-CONFIRM)</text>

  <!-- bearish delivery to next SSL -->
  <path d="M236,240 L300,300 L380,360 L500,395 L640,408" fill="none" stroke="#B91C1C" stroke-width="2.6" marker-end="url(#cflip1)"/>
  <circle cx="640" cy="408" r="9" fill="none" stroke="#B91C1C" stroke-width="2"/>
  <text x="640" y="413" font-size="11" font-weight="700" fill="#B91C1C">④</text>
  <text x="452" y="378" font-size="10.5" font-weight="700" fill="#B91C1C">Delivery giảm về SSL (stop trên cực trị FAILED)</text>

  <text x="40" y="432" font-size="10.5" fill="#6B7280">Quy tắc: chỉ flip nếu hướng mới THUẬN Daily Bias/HTF + có RE-CONFIRM. Ngược bias → đứng ngoài, KHÔNG revenge flip.</text>
</svg>
