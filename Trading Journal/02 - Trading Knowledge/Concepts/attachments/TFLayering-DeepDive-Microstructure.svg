<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <!-- grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="210" x2="960" y2="210"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="330" x2="960" y2="330"/>
    <line x1="0" y1="390" x2="960" y2="390"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
  </g>

  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d1d4dc">Nhay Fractal vs Timeframe Layering</text>
  <text x="30" y="62" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">H1 to M5 truc tiep (12x) sinh nhieu MSS gia; them M15 (4x + 3x) loc nhieu tung tang</text>

  <!-- Panel A: H1 -> M5 direct -->
  <text x="30" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ef5350">Panel A: Nhay truc tiep H1 -> M5 (ty le 12x)</text>

  <!-- H1 candle (single big) -->
  <line x1="90" y1="130" x2="90" y2="190" stroke="#26a69a" stroke-width="2"/>
  <rect x="78" y="140" width="24" height="40" fill="#26a69a"/>
  <text x="70" y="205" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">H1 candle</text>

  <!-- arrow -->
  <line x1="120" y1="160" x2="180" y2="160" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- M5 noisy candles representing 12 candles -->
  <g>
    <rect x="210" y="150" width="10" height="15" fill="#26a69a"/><line x1="215" y1="145" x2="215" y2="170" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="225" y="145" width="10" height="12" fill="#ef5350"/><line x1="230" y1="138" x2="230" y2="162" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="240" y="155" width="10" height="10" fill="#26a69a"/><line x1="245" y1="148" x2="245" y2="170" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="255" y="140" width="10" height="18" fill="#ef5350"/><line x1="260" y1="132" x2="260" y2="163" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="270" y="148" width="10" height="14" fill="#26a69a"/><line x1="275" y1="142" x2="275" y2="167" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="285" y="152" width="10" height="12" fill="#ef5350"/><line x1="290" y1="146" x2="290" y2="168" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="300" y="138" width="10" height="20" fill="#26a69a"/><line x1="305" y1="130" x2="305" y2="163" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="315" y="150" width="10" height="10" fill="#ef5350"/><line x1="320" y1="144" x2="320" y2="165" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="330" y="145" width="10" height="15" fill="#26a69a"/><line x1="335" y1="138" x2="335" y2="165" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="345" y="155" width="10" height="10" fill="#ef5350"/><line x1="350" y1="148" x2="350" y2="170" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="360" y="140" width="10" height="18" fill="#26a69a"/><line x1="365" y1="133" x2="365" y2="163" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="375" y="150" width="10" height="12" fill="#ef5350"/><line x1="380" y1="143" x2="380" y2="167" stroke="#ef5350" stroke-width="1.5"/>
  </g>
  <text x="210" y="205" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">12 nen M5 - moi swing con trong deu "giong" MSS</text>

  <!-- fake MSS markers -->
  <g stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="225" y1="138" x2="395" y2="138"/>
    <line x1="300" y1="130" x2="395" y2="130"/>
  </g>
  <text x="620" y="140" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">Nhieu "MSS gia" do 1 tick / noise</text>

  <!-- Panel B: H1 -> M15 -> M5 -->
  <text x="30" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26a69a">Panel B: H1 -> M15 (4x) -> M5 (3x): loc nhieu tung tang</text>

  <line x1="90" y1="270" x2="90" y2="330" stroke="#26a69a" stroke-width="2"/>
  <rect x="78" y="280" width="24" height="40" fill="#26a69a"/>
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">H1</text>

  <line x1="120" y1="300" x2="165" y2="300" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- M15 candles: 4 candles, clean displacement -->
  <g>
    <rect x="185" y="295" width="16" height="14" fill="#ef5350"/><line x1="193" y1="288" x2="193" y2="312" stroke="#ef5350" stroke-width="1.5"/>
    <rect x="210" y="275" width="16" height="26" fill="#26a69a"/><line x1="218" y1="266" x2="218" y2="304" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="235" y="255" width="16" height="28" fill="#26a69a"/><line x1="243" y1="248" x2="243" y2="286" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="260" y="240" width="16" height="24" fill="#26a69a"/><line x1="268" y1="232" x2="268" y2="267" stroke="#26a69a" stroke-width="1.5"/>
  </g>
  <line x1="180" y1="295" x2="285" y2="295" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="285" y="292" font-family="Arial, sans-serif" font-size="15" fill="#f2c94c">Swing ref</text>
  <rect x="212" y="248" width="46" height="27" fill="rgba(41,98,255,0.25)"/>
  <text x="212" y="240" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">FVG M15</text>
  <text x="185" y="345" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">M15: MSS that (than dong, co FVG)</text>

  <line x1="300" y1="290" x2="345" y2="290" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- M5 execution: refined entry -->
  <g>
    <rect x="365" y="270" width="10" height="15" fill="#26a69a"/><line x1="370" y1="264" x2="370" y2="290" stroke="#26a69a" stroke-width="1.5"/>
    <rect x="380" y="260" width="10" height="16" fill="#26a69a"/><line x1="385" y1="253" x2="385" y2="281" stroke="#26a69a" stroke-width="1.5"/>
  </g>
  <rect x="360" y="255" width="35" height="20" fill="rgba(255,152,0,0.25)"/>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Entry CE M5</text>
  <text x="365" y="345" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">M5: chi refine entry, khong tao lai xac nhan</text>

  <!-- ATR buffer illustration -->
  <text x="30" y="400" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#d1d4dc">Ngung ATR-buffer loc MSS "1 tick" tren M1:</text>
  <line x1="30" y1="420" x2="500" y2="420" stroke="#1e222d" stroke-width="10"/>
  <line x1="30" y1="420" x2="430" y2="420" stroke="#26a69a" stroke-width="10"/>
  <line x1="430" y1="420" x2="500" y2="420" stroke="#ef5350" stroke-width="10"/>
  <line x1="430" y1="405" x2="430" y2="435" stroke="#f2c94c" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="30" y="450" font-family="Arial, sans-serif" font-size="15" fill="#d1d4dc">Vuot swing duoi buffer ATR = nhieu (bo qua)</text>
  <text x="435" y="450" font-family="Arial, sans-serif" font-size="15" fill="#ef5350">Vuot qua buffer = MSS hop le</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="30" y="520" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#d1d4dc">Legend: xanh=tang, do=giam, vang net dut=thanh khoan/swing ref, cam=vung OB, xanh duong=vung FVG</text>
</svg>
