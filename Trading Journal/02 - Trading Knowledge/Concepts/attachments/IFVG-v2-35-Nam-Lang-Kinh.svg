<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="678.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Một hiện tượng — năm lăng kính giải thích</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng hành vi quan sát được, nhiều mô hình kể chuyện khác nhau. Không câu chuyện nào được OHLC chứng minh; chúng gợi ra những</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">điều có thể KIỂM CHỨNG.</text>
<rect x="826.7" y="22.0" width="145.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="899.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">GÓC NHÌN THAY THẾ</text>
<rect x="330.0" y="250.0" width="340.0" height="130.0" rx="14" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.6"/>
<text x="500.0" y="280.0" font-size="12" font-weight="800" fill="#1F2937" text-anchor="middle">HÀNH VI QUAN SÁT ĐƯỢC</text>
<text x="500.0" y="306.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Giá phá qua một vùng, ở lại phía bên kia, rồi</text>
<text x="500.0" y="323.2" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">quay lại vùng đó và bị đẩy ra.</text>
<rect x="28.0" y="100.0" width="300.0" height="122.0" rx="12" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="44.0" y="126.0" font-size="13.5" font-weight="800" fill="#7C3AED" text-anchor="start">ICT</text>
<text x="44.0" y="150.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">FVG thất bại → đảo cực thành IFVG. Giao dịch</text>
<text x="44.0" y="166.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">retest theo hướng mới.</text>
<rect x="672.0" y="100.0" width="300.0" height="122.0" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<text x="688.0" y="126.0" font-size="13.5" font-weight="800" fill="#1D4ED8" text-anchor="start">S/R cổ điển</text>
<text x="688.0" y="150.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Polarity / role reversal: hỗ trợ bị phá thành</text>
<text x="688.0" y="166.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">kháng cự. Có trong sách phân tích kỹ thuật từ</text>
<text x="688.0" y="182.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">trước ICT rất lâu.</text>
<rect x="28.0" y="440.0" width="300.0" height="122.0" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.3"/>
<text x="44.0" y="466.0" font-size="13.5" font-weight="800" fill="#0F766E" text-anchor="start">Auction theory</text>
<text x="44.0" y="490.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Giá được CHẤP NHẬN ở vùng mới; quay lại vùng</text>
<text x="44.0" y="506.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">cũ thì bị TỪ CHỐI — thị trường 'không muốn' giao</text>
<text x="44.0" y="522.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">dịch ở đó nữa.</text>
<rect x="672.0" y="440.0" width="300.0" height="122.0" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
<text x="688.0" y="466.0" font-size="13.5" font-weight="800" fill="#EA580C" text-anchor="start">Vi cấu trúc</text>
<text x="688.0" y="490.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Lệnh có thể tụ ở các mức dễ thấy. Osler (2003):</text>
<text x="688.0" y="506.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">lệnh chốt lời hay tụ ở số tròn, lệnh dừng lỗ ngay</text>
<text x="688.0" y="522.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">sau số tròn.</text>
<rect x="350.0" y="440.0" width="300.0" height="122.0" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<text x="366.0" y="466.0" font-size="13.5" font-weight="800" fill="#B91C1C" text-anchor="start">Tài chính hành vi</text>
<text x="366.0" y="490.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Neo giá (anchoring) &amp; muốn gỡ hòa vốn: người</text>
<text x="366.0" y="506.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">kẹt lệnh có thể thoát ở giá vốn.</text>
<line x1="330.0" y1="170.0" x2="395.2" y2="242.6" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
<path d="M400.0,248.0 L392.7,244.7 L397.5,240.4 Z" fill="#7C3AED"/>
<line x1="672.0" y1="170.0" x2="604.9" y2="242.7" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round"/>
<path d="M600.0,248.0 L602.6,240.4 L607.4,244.8 Z" fill="#1D4ED8"/>
<line x1="250.0" y1="438.0" x2="373.4" y2="384.8" stroke="#0F766E" stroke-width="1.6" stroke-linecap="round"/>
<path d="M380.0,382.0 L374.6,387.9 L372.0,381.9 Z" fill="#0F766E"/>
<line x1="750.0" y1="438.0" x2="626.6" y2="384.8" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round"/>
<path d="M620.0,382.0 L628.0,381.9 L625.4,387.9 Z" fill="#EA580C"/>
<line x1="500.0" y1="438.0" x2="500.0" y2="391.2" stroke="#B91C1C" stroke-width="1.6" stroke-linecap="round"/>
<path d="M500.0,384.0 L503.3,391.3 L496.7,391.3 Z" fill="#B91C1C"/>
<rect x="28.0" y="601.0" width="944.0" height="57.0" rx="10" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="46.0" y="627.0" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">Câu hỏi kiểm chứng được — bất kể bạn tin lăng kính nào: vùng IFVG có phản ứng KHÁC một vùng cùng kích thước đặt ngẫu nhiên, hay khác một</text>
<text x="46.0" y="644.5" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="start">mức S/R thường bị phá không? Nếu không khác, cái tên 'IFVG' không thêm thông tin.</text>
</svg>
