<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="618.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Khi Breaker H1 nói ngược D1: ai thắng?</text>
<rect x="887.4" y="23.0" width="84.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="929.7" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">ĐA KHUNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">D1 đang hướng lên trong cả hai hình. Khác nhau ở chỗ Breaker H1 xuất hiện theo hướng nào — và điều đó quyết định bạn dùng nó hay chỉ ghi chú.</text>
<rect x="28.0" y="94.5" width="460.0" height="470.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="12.8" font-weight="700" fill="#15803D" data-bx="41.0,477.0">A · H1 CÙNG hướng D1 — Bullish Breaker trong nhịp hồi</text>
<line x1="48.0" y1="410.5" x2="457.7" y2="166.6" stroke="#D1D5DB" stroke-width="9" stroke-linecap="round"/>
<polygon points="468.0,160.5 461.2,174.9 452.0,159.6" fill="#D1D5DB"/>
<text x="408.0" y="200.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="end">D1: hướng lên</text>
<rect x="216.0" y="241.0" width="235.2" height="13.5" rx="2" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,3"/>
<polyline points="56.4,357.1 132.0,227.5 174.0,259.9 216.0,243.7 266.4,308.5 342.0,211.3 384.0,243.7 451.2,162.7" fill="none" stroke="#374151" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="220.0" y="268.5" font-size="10.5" font-weight="700" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Bullish Breaker H1</text>
<text x="44.0" y="456.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,473.0">D1 tăng, giá hồi về. Trong nhịp hồi, H1 quét đáy rồi phá đỉnh giữa →</text>
<text x="44.0" y="473.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,473.0">Bullish Breaker H1 thuận D1. Đây là setup để chờ.</text>
<rect x="44.0" y="522.5" width="123.2" height="19.5" rx="9.75" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="105.6" y="534.2" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">DÙNG làm setup POI</text>
<rect x="512.0" y="94.5" width="460.0" height="470.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="120.0" font-size="12.8" font-weight="700" fill="#B45309" data-bx="525.0,961.0">B · H1 NGƯỢC hướng D1 — Bearish Breaker giữa xu hướng tăng</text>
<line x1="532.0" y1="410.5" x2="941.7" y2="166.6" stroke="#D1D5DB" stroke-width="9" stroke-linecap="round"/>
<polygon points="952.0,160.5 945.2,174.9 936.0,159.6" fill="#D1D5DB"/>
<text x="892.0" y="200.5" font-size="11" font-weight="700" fill="#6B7280" text-anchor="end">D1: hướng lên</text>
<rect x="767.2" y="270.7" width="100.8" height="10.8" rx="2" fill="#B45309" fill-opacity="0.18" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5,3"/>
<polyline points="540.4,362.5 624.4,259.9 666.4,286.9 725.2,222.1 767.2,276.1 809.2,254.5 851.2,297.7 935.2,173.5" fill="none" stroke="#374151" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="771.2" y="295.5" font-size="10.5" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Bearish Breaker H1</text>
<text x="528.0" y="456.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="527.0,957.0">D1 vẫn tăng. H1 quét đỉnh rồi phá đáy giữa → Bearish Breaker H1.</text>
<text x="528.0" y="473.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="527.0,957.0">Thường đây chỉ là cách nhịp hồi của D1 diễn ra. Không bán theo nó.</text>
<rect x="528.0" y="522.5" width="225.9" height="19.5" rx="9.75" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="641.0" y="534.2" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">CHỈ GHI CHÚ — chờ H1 quay lại thuận D1</text>
<text x="28.0" y="587.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Quy tắc làm việc: khung lớn quyết định HƯỚNG, khung nhỏ quyết định THỜI ĐIỂM. Bearish Breaker H1 ở hình B còn có ích theo cách khác: khi nó bị phá ngược</text>
<text x="28.0" y="604.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">lại, đó là dấu hiệu nhịp hồi đã xong.</text>
