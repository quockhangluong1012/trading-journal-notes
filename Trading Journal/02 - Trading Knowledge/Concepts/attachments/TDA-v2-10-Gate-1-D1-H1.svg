<svg viewBox="0 0 1000 580" width="1000" height="580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="0" y="0" width="1000" height="580" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">GATE 1 — D1 → H1: khi nào bản tóm tắt D1 'đủ dùng'?</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Điều kiện chuyển xuống H1 là D1 đủ rõ để ĐỊNH HƯỚNG việc quan sát — không phải biết chắc giá sẽ đi đâu. Spec hình thức: 01 §15 / 01c §8.2.</text>
<rect x="26.0" y="84.0" width="360.0" height="350.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="26.0" y="84.0" width="360.0" height="6.0" rx="3" fill="#1D4ED8" stroke="none" stroke-width="0"/>
<text x="40.0" y="108.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">THÔNG TIN CỐT LÕI (thiếu → chưa xuống)</text>
<text x="40.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc chính đã đọc với mức rõ ràng hợp lý</text>
<text x="53.0" y="146.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">(Bull / Bear / Range / Transition)</text>
<text x="40.0" y="168.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="168.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Swing quan trọng (L4+) đã xác định —</text>
<text x="53.0" y="184.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">protected level rõ</text>
<text x="40.0" y="207.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="207.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Dealing Range có LÝ DO chọn neo</text>
<text x="40.0" y="229.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="229.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Liquidity đáng chú ý hai phía đã đánh dấu</text>
<text x="40.0" y="251.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="251.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Daily Bias đã đánh giá — hoặc giữ</text>
<text x="53.0" y="268.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Neutral/Conflicting có lý do</text>
<text x="40.0" y="290.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="290.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Vùng cần theo dõi (HTF POI) nếu có</text>
<text x="40.0" y="312.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="53.0" y="312.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Điều kiện làm nhận định thay đổi đã VIẾT RA</text>
<rect x="400.0" y="84.0" width="280.0" height="350.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="400.0" y="84.0" width="280.0" height="6.0" rx="3" fill="#B45309" stroke="none" stroke-width="0"/>
<text x="414.0" y="108.0" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">THÔNG TIN BỔ TRỢ (không mở cổng)</text>
<text x="414.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="427.0" y="130.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Vùng phụ, POI thứ hai</text>
<text x="414.0" y="152.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="427.0" y="152.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Kịch bản thay thế (H-FUEL,</text>
<text x="427.0" y="168.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">H-FAIL)</text>
<text x="414.0" y="190.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="427.0" y="190.9" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">W1 cùng / ngược hướng</text>
<text x="414.0" y="213.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="427.0" y="213.1" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Displacement D1 gần nhất</text>
<text x="414.0" y="235.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="427.0" y="235.4" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">Quan sát chưa đủ thành kết luận</text>
<text x="414.0" y="257.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="427.0" y="257.7" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">→ dùng để GÁN MỨC TIN CẬY / size,</text>
<text x="427.0" y="274.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">không để bù cho một điều kiện cốt</text>
<text x="427.0" y="290.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start">lõi bị thiếu</text>
<rect x="694.0" y="84.0" width="280.0" height="350.0" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="708.0" y="108.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">KẾT QUẢ</text>
<rect x="708.0" y="120.0" width="252.0" height="34.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
<text x="834.0" y="141.3" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">PASS → mở H1 với nhiệm vụ cụ thể</text>
<text x="708.0" y="180.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">H1 biết: tìm hướng nào, ở vùng nào,</text>
<text x="708.0" y="195.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">chờ điều gì, sai khi nào.</text>
<rect x="708.0" y="236.0" width="252.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="834.0" y="257.3" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">FAIL → ở lại D1</text>
<text x="708.0" y="292.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="721.0" y="292.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Cấu trúc chưa rõ → theo dõi leg</text>
<text x="721.0" y="307.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">mới</text>
<text x="708.0" y="328.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="721.0" y="328.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">DOL chưa đủ cơ sở → viết 2 kịch</text>
<text x="721.0" y="344.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">bản có điều kiện</text>
<text x="708.0" y="364.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="721.0" y="364.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Neutral → ghi trigger chuyển trạng</text>
<text x="721.0" y="380.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">thái</text>
<text x="708.0" y="401.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="721.0" y="401.4" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Bias rõ nhưng giá ở sai vùng → CHỜ</text>
<text x="721.0" y="417.1" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">(trạng thái hay gặp nhất)</text>
<rect x="26.0" y="448.0" width="948.0" height="116.0" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="42.0" y="472.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">Ngoại lệ &amp; cảnh báo</text>
<text x="42.0" y="494.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="494.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Ngày có tin cấp cao: Gate 1 có thể PASS về cấu trúc nhưng vẫn khóa vì bối cảnh (không chạy event-mode)</text>
<text x="42.0" y="513.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="513.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">D1 summary viết SAU khi đã nhìn H1/M5 hôm nay = không hợp lệ (nhiễm hindsight) — viết lại ở phiên sau</text>
<text x="42.0" y="533.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">•</text>
<text x="55.0" y="533.7" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">'Ngày nào cũng PASS' là dấu hiệu tiêu chí quá lỏng, không phải dấu hiệu thị trường luôn có cơ hội</text>
</svg>
