<text x="615.4" y="332.0" font-size="10.5" font-weight="800" fill="#0F9D74" text-anchor="end">mép gần</text>
<text x="615.4" y="421.1" font-size="10.5" font-weight="800" fill="#64748B" text-anchor="end">mép xa = biên trên</text>
<text x="182.0" y="544.5" font-size="11" font-weight="800" fill="#64748B" text-anchor="middle">VÙNG CŨ (range đi ngang)</text>
<text x="328.6" y="305.5" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="end">nến đầu tiên sau gap →</text>
<text x="334.6" y="389.9" font-size="10" font-weight="400" fill="#0F9D74" text-anchor="start"></text>
<text x="345.5" y="391.4" font-size="11" font-weight="800" fill="#0F9D74" text-anchor="start">KHOẢNG TRỐNG (gap)</text>
<text x="475.4" y="360.3" font-size="10.5" font-weight="800" fill="#2563EB" text-anchor="start">← lần quay lại đầu tiên</text>
<text x="532.4" y="134.6" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">giao dịch ở vùng mới</text>
<rect x="646.0" y="100.0" width="326.0" height="62.9" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
<text x="656.0" y="119.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="start">① Vùng cũ</text>
<text x="656.0" y="135.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nơi giá đã đi ngang đủ lâu để nhiều người cùng nhìn thấy</text>
<text x="656.0" y="150.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">biên. Phải xác định được TRƯỚC khi gap xảy ra.</text>
<rect x="646.0" y="170.9" width="326.0" height="78.0" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
<text x="656.0" y="189.9" font-size="11" font-weight="700" fill="#64748B" text-anchor="start">② Biên bị rời bỏ</text>
<text x="656.0" y="206.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đường trên của vùng cũ. Gap có ý nghĩa cấu trúc khi đưa</text>
<text x="656.0" y="221.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">giá ra NGOÀI đường này. Ở hình này biên trùng mép xa;</text>
<text x="656.0" y="236.7" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">ngoài thực tế hai mức có thể khác nhau.</text>
<rect x="646.0" y="256.9" width="326.0" height="62.9" rx="8" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.1"/>
<text x="656.0" y="275.9" font-size="11" font-weight="700" fill="#0F9D74" text-anchor="start">③ Mép xa (far edge)</text>
<text x="656.0" y="292.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">High của nến cuối trước gap. Giá quay về tới đây = gap đã</text>
<text x="656.0" y="307.6" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lấp hết (full fill).</text>
<rect x="646.0" y="327.8" width="326.0" height="62.9" rx="8" fill="#DDF4EC" stroke="#0F9D74" stroke-width="1.1"/>
<text x="656.0" y="346.8" font-size="11" font-weight="700" fill="#0F9D74" text-anchor="start">④ Mép gần (near edge)</text>
<text x="656.0" y="363.3" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Low của nến đầu tiên sau gap. Giá quay lại vượt qua mức</text>
<text x="656.0" y="378.4" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">này = bắt đầu lấp (partial fill).</text>
<rect x="646.0" y="398.6" width="326.0" height="62.9" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.1"/>
<text x="656.0" y="417.6" font-size="11" font-weight="700" fill="#2563EB" text-anchor="start">⑤ Sau gap</text>
<text x="656.0" y="434.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá có giữ được ở vùng mới không? Có quay lại vào vùng cũ</text>
<text x="656.0" y="449.3" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">không? Đây mới là phần quyết định tên gọi.</text>
