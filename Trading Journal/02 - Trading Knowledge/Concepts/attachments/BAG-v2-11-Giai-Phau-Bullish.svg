<text x="927.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">GIẢI PHẪU</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Giải phẫu một Bullish Breakaway Gap</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sơ đồ dựng (giá minh họa). Đọc từ trái sang phải: vùng cũ → biên → khoảng trống → giá ở vùng mới → lần quay lại đầu tiên.</text>
