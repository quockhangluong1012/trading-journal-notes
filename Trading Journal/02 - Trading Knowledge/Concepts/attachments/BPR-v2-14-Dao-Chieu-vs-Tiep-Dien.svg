<text x="518.0" y="538.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">đánh dấu một nhịp hồi dữ dội trong xu hướng.</text>
<text x="28.0" y="620.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Bài học: thấy BPR chưa đủ để biết có đảo chiều. Phải đọc thêm cấu trúc (swing nào bị phá) và thanh khoản (đáy/đỉnh nào bị quét).</text>
