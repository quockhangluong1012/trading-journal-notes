<line x1="640.0" y1="184.0" x2="688.0" y2="184.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah6B7280)"/>
<rect x="40.0" y="627.0" width="73.0" height="21.0" rx="10.5" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
<text x="76.5" y="643.0" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">ĐIỀU KIỆN</text>
<rect x="350.0" y="627.0" width="133.9" height="21.0" rx="10.5" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.1"/>
<text x="416.9" y="643.0" font-size="11" font-weight="700" fill="#4338CA" text-anchor="middle">XÁC NHẬN (cấu trúc)</text>
<rect x="660.0" y="627.0" width="157.9" height="21.0" rx="10.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
<text x="738.9" y="643.0" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">CẢNH BÁO SỚM / BỔ TRỢ</text>
<rect x="40.0" y="659.0" width="171.8" height="21.0" rx="10.5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
<text x="125.9" y="675.0" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">DỮ KIỆN, KHÔNG PHẢI LỆNH</text>
<rect x="350.0" y="659.0" width="89.2" height="21.0" rx="10.5" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.1"/>
<text x="394.6" y="675.0" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">THẬN TRỌNG</text>
<rect x="660.0" y="659.0" width="83.7" height="21.0" rx="10.5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
<text x="701.8" y="675.0" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">KHÔNG LÀM</text>
<rect x="28.0" y="704.0" width="944.0" height="55.6" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="40.0" y="727.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Trong khung hiện tại của bạn (sweep → MSS → FVG → entry), CISD M5 KHÔNG thay thế MSS. Nó giúp: (1) biết sớm phản ứng sau sweep có thật không, (2) chuẩn</text>
<text x="40.0" y="744.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">bị kế hoạch, (3) phát hiện cú quét thất bại. Biến thể “vào lệnh ngay tại CISD, không chờ MSS” là một giả thuyết cần backtest riêng.</text>
