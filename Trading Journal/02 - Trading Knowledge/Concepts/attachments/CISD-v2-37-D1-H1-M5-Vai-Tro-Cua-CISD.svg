<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<rect x="1" y="1" width="998" height="798" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CISD trong khung D1 → H1 → M5: vai trò ở từng tầng</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đây là một mô hình ứng viên (candidate model), không phải trình tự bắt buộc. Màu cho biết vai trò: ĐIỀU KIỆN (bắt buộc), XÁC</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">NHẬN, hoặc BỔ TRỢ.</text>
<rect x="896.1" y="22" width="75.9" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="934.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ÁP DỤNG</text>
<text x="28.0" y="788.0" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">Sơ đồ minh họa (synthetic) — giá trong hình là ví dụ, không phải dữ liệu thị trường thật.</text>
<text x="172.0" y="118.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">D1 — CONTEXT</text>
<text x="500.0" y="118.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">H1 — SETUP</text>
<text x="828.0" y="118.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">M5 — EXECUTION</text>
<rect x="32.0" y="153.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="172.0" y="188.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Bias + DOL + Dealing Range</text>
<rect x="32.0" y="245.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="172.0" y="280.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Giá ở premium/discount phù hợp</text>
<rect x="32.0" y="337.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="172.0" y="372.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">HTF POI được xác định</text>
<rect x="32.0" y="429.0" width="280.0" height="62.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="172.0" y="456.4" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">D1 CISD = dữ kiện cho bias (không tự đổi</text>
<text x="172.0" y="472.0" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">bias)</text>
<rect x="360.0" y="153.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="500.0" y="188.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Giá chạm H1 POI trong vùng D1</text>
<rect x="360.0" y="245.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="500.0" y="280.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Liquidity H1 bị chạm/quét</text>
<rect x="360.0" y="337.0" width="280.0" height="62.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="500.0" y="372.2" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">H1 CISD tại POI = setup đang phát triển</text>
<rect x="360.0" y="429.0" width="280.0" height="62.0" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
<text x="500.0" y="456.4" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">H1 CISD ngược D1 → coi là hồi, trừ khi có lý</text>
<text x="500.0" y="472.0" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">do</text>
<rect x="688.0" y="153.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="828.0" y="188.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">M5 sweep tại vùng H1</text>
<rect x="688.0" y="245.0" width="280.0" height="62.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="828.0" y="280.2" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">M5 CISD = cảnh báo sớm</text>
<rect x="688.0" y="337.0" width="280.0" height="62.0" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.4"/>
<text x="828.0" y="372.2" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">M5 MSS + displacement</text>
<rect x="688.0" y="429.0" width="280.0" height="62.0" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="828.0" y="464.2" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">FVG → entry, stop, target</text>
<rect x="688.0" y="521.0" width="280.0" height="62.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="828.0" y="556.2" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Không: CISD M5 một mình = lệnh</text>
