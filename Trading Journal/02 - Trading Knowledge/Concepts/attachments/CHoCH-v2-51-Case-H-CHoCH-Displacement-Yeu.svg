<rect x="600.0" y="92.5" width="372.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="614.0" y="106.5" width="155.2" height="20.0" rx="10.0" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="691.6" y="118.7" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Weak CHoCH (G0) — chờ</text>
<text x="616.0" y="150.5" font-size="11" font-weight="700" fill="#6B7280">BỐI CẢNH</text>
<text x="616.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giá ở POI H1. Cấu trúc M5 giảm, protected high = 64.8.</text>
<text x="616.0" y="188.9" font-size="11" font-weight="700" fill="#6B7280">CHUỖI GIÁ</text>
<text x="616.0" y="204.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Không quét. Giá “bò” lên bằng chuỗi nến nhỏ chồng lên</text>
<text x="616.0" y="221.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">nhau, rồi một nến đóng nhỉnh trên 64.8.</text>
<text x="616.0" y="243.9" font-size="11" font-weight="700" fill="#6B7280">PHÂN LOẠI</text>
<text x="616.0" y="259.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">CHoCH G0 (weak). Có thay đổi trạng thái theo định nghĩa,</text>
<text x="616.0" y="276.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">nhưng không có displacement.</text>
<text x="616.0" y="298.8" font-size="11" font-weight="700" fill="#6B7280">BẰNG CHỨNG CÓ</text>
<text x="616.0" y="314.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Trạng thái đổi; giá đang ở POI.</text>
<text x="616.0" y="337.3" font-size="11" font-weight="700" fill="#6B7280">BẰNG CHỨNG THIẾU</text>
<text x="616.0" y="353.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Lực (displacement), FVG để vào lệnh, cú quét, độ chấp</text>
<text x="616.0" y="369.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">nhận.</text>
<text x="616.0" y="392.2" font-size="11" font-weight="700" fill="#6B7280">HÀM Ý</text>
<text x="616.0" y="408.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Không vào lệnh tại G0. Chờ: (a) lên G2 rồi một chân sóng có</text>
<text x="616.0" y="424.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">lực tạo vùng vào lệnh; hoặc (b) bị đóng ngược → bỏ.</text>
<text x="616.0" y="447.2" font-size="11" font-weight="700" fill="#6B7280">VÔ HIỆU</text>
<text x="616.0" y="463.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đóng nến trở lại dưới 64.8 trong cửa sổ đã khai báo.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Có giả thuyết cho rằng CHoCH không displacement thất bại nhiều hơn. Lưu ý từ note 21: so sánh phải dùng kỳ vọng E[R], không chỉ tỷ lệ thất bại.</text>
