<text x="844.0" y="317.0" font-size="11.5" font-weight="700" fill="#7C3AED" text-anchor="start">ERL xa*</text>
<text x="912.0" y="317.0" font-size="11.5" font-weight="700" fill="#7C3AED" text-anchor="start">ERL</text>
