<text x="678.0" y="357.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start" data-maxw="280.0">* “ERL xa”: nằm ngoài child range nhưng không phải</text>
<text x="678.0" y="372.2" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start" data-maxw="280.0">biên kế tiếp của nó — có thể là đích xa nếu child</text>
<text x="678.0" y="387.4" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start" data-maxw="280.0">range bị phá.</text>
<text x="678.0" y="421.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">Quy tắc đọc: D1 cho biết BƯỚC LỚN (giá đang</text>
<text x="678.0" y="437.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">giữa đường từ E tới B). H1 cho biết BƯỚC NHỎ (giá</text>
<text x="678.0" y="453.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">đang dao động giữa D và A, quanh C).</text>
<text x="678.0" y="501.0" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="280.0">Lấy A = lấy ERL-H1, nhưng chỉ là “đi qua IRL” với</text>
<text x="678.0" y="517.3" font-size="11.8" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="280.0">D1 — không đủ để đổi bias D1.</text>
<rect x="28.0" y="597.0" width="944.0" height="34.8" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="621.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hình dựng (synthetic). Child range nằm ở NỬA TRÊN (premium) của parent range — điều này quan trọng khi chọn hướng lệnh ở H1, xem §21.</text>
