<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Range lồng nhau: Parent Range (D1) chứa Child Range (H1) — một mức có thể mang hai</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">nhãn</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Range lớn trả lời “đích xa ở đâu”. Range nhỏ trả lời “bước tiếp theo ở đâu”. Một mức giá có thể là ERL của range nhỏ nhưng IRL của range lớn.</text>
