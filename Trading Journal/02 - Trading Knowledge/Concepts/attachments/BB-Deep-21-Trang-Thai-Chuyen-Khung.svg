<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="m0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Khi nào chuyển khung? — ba trạng thái theo dõi trên H1</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Không xuống M5 vì “thấy vài nến nhỏ”. Mỗi lần chuyển trạng thái phải có điều kiện quan sát được — và có đường quay lại.</text>
<rect x="845.2" y="18" width="108.8" height="22" rx="11" fill="#F3F4F6" stroke="#D8DBE2"/>
<text x="899.6" y="33.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">CHUYỂN KHUNG</text>
<rect x="26.0" y="80.0" width="292.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="26.0" y="80.0" width="292.0" height="34.0" rx="10" fill="#9CA3AF"/>
<rect x="26.0" y="104.0" width="292.0" height="10.0" rx="0" fill="#9CA3AF"/>
<text x="172.0" y="102.0" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">STATE A · NOT READY</text>
<text x="38.0" y="136.0" font-size="11.2" font-weight="700" fill="#9CA3AF" text-anchor="start">Vào trạng thái khi:</text>
<text x="38.0" y="154.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá còn xa vùng, hoặc Breaker chưa đạt định</text>
<text x="38.0" y="169.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nghĩa.</text>
<text x="38.0" y="195.5" font-size="11.2" font-weight="700" fill="#9CA3AF" text-anchor="start">Việc làm:</text>
<text x="38.0" y="213.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Ở lại H1 (hoặc D1).</text>
<text x="38.0" y="233.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Cập nhật trạng thái vùng sau mỗi nến H1 đóng.</text>
<text x="38.0" y="252.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• KHÔNG mở M5 để “tìm” tín hiệu.</text>
<line x1="320.0" y1="200.0" x2="340.0" y2="200.0" stroke="#111827" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="342.0" y="80.0" width="292.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<rect x="342.0" y="80.0" width="292.0" height="34.0" rx="10" fill="#0F766E"/>
<rect x="342.0" y="104.0" width="292.0" height="10.0" rx="0" fill="#0F766E"/>
<text x="488.0" y="102.0" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">STATE B · MONITORING</text>
<text x="354.0" y="136.0" font-size="11.2" font-weight="700" fill="#0F766E" text-anchor="start">Vào trạng thái khi:</text>
<text x="354.0" y="154.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Giá tiến sát hoặc đã vào vùng Breaker đã xác</text>
<text x="354.0" y="169.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">nhận.</text>
<text x="354.0" y="195.5" font-size="11.2" font-weight="700" fill="#0F766E" text-anchor="start">Việc làm:</text>
<text x="354.0" y="213.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Đánh dấu TRƯỚC: đáy/đỉnh M5 sẽ bị quét,</text>
<text x="354.0" y="229.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">swing M5 cần phá.</text>
<text x="354.0" y="248.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Kiểm tra giờ: có trong killzone?</text>
<text x="354.0" y="268.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Mở M5 để QUAN SÁT, chưa kết luận.</text>
<line x1="636.0" y1="200.0" x2="656.0" y2="200.0" stroke="#111827" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="658.0" y="80.0" width="292.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.6"/>
<rect x="658.0" y="80.0" width="292.0" height="34.0" rx="10" fill="#6D28D9"/>
<rect x="658.0" y="104.0" width="292.0" height="10.0" rx="0" fill="#6D28D9"/>
<text x="804.0" y="102.0" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">STATE C · EVENT UNDER EVALUATION</text>
<text x="670.0" y="136.0" font-size="11.2" font-weight="700" fill="#6D28D9" text-anchor="start">Vào trạng thái khi:</text>
<text x="670.0" y="154.0" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Đang có sự kiện: sweep M5 trong vùng, hoặc</text>
<text x="670.0" y="169.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">MSS M5 vừa đóng.</text>
<text x="670.0" y="195.5" font-size="11.2" font-weight="700" fill="#6D28D9" text-anchor="start">Việc làm:</text>
<text x="670.0" y="213.5" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• So sự kiện với mức đã đánh dấu.</text>
<text x="670.0" y="233.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Nếu đủ điều kiện setup → đánh giá lệnh.</text>
<text x="670.0" y="252.9" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">• Nếu không → ghi lại, quay về B hoặc A.</text>
<text x="330.0" y="190.0" font-size="10" font-weight="600" fill="#1F2937" text-anchor="start"></text>
<text x="338.0" y="222.0" font-size="10.5" font-weight="800" fill="#111827" text-anchor="end">A→B</text>
<text x="654.0" y="222.0" font-size="10.5" font-weight="800" fill="#111827" text-anchor="end">B→C</text>
<path d="M 812,382 C 812,430 180,430 180,382" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#m1)"/>
<text x="496.0" y="426.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">vùng INVALIDATED / EXPIRED, hoặc bối cảnh D1 đổi → về A (đánh giá lại từ D1)</text>
<path d="M 760,382 C 760,404 520,404 520,382" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#m2)"/>
<text x="640.0" y="400.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">sự kiện không đạt → về B</text>
<rect x="26.0" y="452.0" width="928.0" height="67.5" rx="8" fill="#F3F4F6" stroke="#334155" stroke-width="1.2"/>
<rect x="26.0" y="452.0" width="4.0" height="67.5" rx="2" fill="#334155"/>
<text x="38.0" y="474.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Ba câu không được nói ở trạng thái nào</text>
<text x="38.0" y="493.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">“Chắc chắn sẽ bật.” · “Vào trước cho kịp, xác nhận sau.” · “Swing này (vừa tìm ra) là swing cần phá.” — mức tham chiếu M5 phải có trước sự kiện (gate G2.R5 của</text>
<text x="38.0" y="509.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">vault).</text>
</svg>
