<circle cx="880.0" cy="262.8" r="4" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1"/>
<text x="880.0" y="283.8" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">LL</text>
<text x="676.0" y="364.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Thủng M5-STL, tạo đỉnh thấp hơn</text>
<text x="676.0" y="380.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">→ M5 GIẢM.</text>
<text x="676.0" y="396.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Bán theo M5 = bán ngược H1 và D1.</text>
<rect x="28.0" y="426.0" width="944.0" height="47.4" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
<rect x="28.0" y="426.0" width="5.0" height="47.4" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="42.0" y="445.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Kết luận đúng: "M5 đang giảm BÊN TRONG một nhịp tăng H1, bên trong một xu hướng tăng D1". Mỗi nhãn phải kèm tên khung.</text>
<text x="42.0" y="462.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Muốn nói H1 đổi chiều thì phải thấy một H1-STL/ITL bị phá. Muốn nói D1 đổi chiều thì phải thấy đáy D1 bị phá.</text>
