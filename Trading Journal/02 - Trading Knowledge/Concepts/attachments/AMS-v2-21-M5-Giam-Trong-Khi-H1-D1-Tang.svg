<text x="40.0" y="364.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không đáy D1 nào bị đụng tới.</text>
<text x="40.0" y="380.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không có gì thay đổi ở đây.</text>
