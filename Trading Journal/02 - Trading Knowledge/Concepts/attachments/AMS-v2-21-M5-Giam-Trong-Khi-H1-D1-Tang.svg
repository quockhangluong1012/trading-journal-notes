<text x="358.0" y="364.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đáy H1 gần nhất còn nguyên.</text>
<text x="358.0" y="380.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Cú lùi mới chỉ là một nhịp hồi</text>
<text x="358.0" y="396.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">nhỏ bên trong nhịp tăng H1.</text>
