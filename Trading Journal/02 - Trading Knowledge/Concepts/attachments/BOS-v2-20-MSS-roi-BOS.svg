<line x1="326.0" y1="196.6" x2="422.4" y2="196.6" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="40.0,158.3 117.0,265.5 172.0,219.5 249.0,349.7 326.0,196.6 370.0,257.8 458.0,143.0" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="158.3" r="3.6" fill="#DC2626"/>
<text x="40.0" y="149.3" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH1</tspan></text>
<circle cx="117.0" cy="265.5" r="3.6" fill="#DC2626"/>
<text x="117.0" y="284.0" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LL1</tspan></text>
<circle cx="172.0" cy="219.5" r="3.6" fill="#DC2626"/>
<text x="172.0" y="210.5" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH2</tspan></text>
<circle cx="249.0" cy="349.7" r="3.6" fill="#DC2626"/>
<text x="249.0" y="368.2" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LL2</tspan></text>
<circle cx="326.0" cy="196.6" r="3.6" fill="#1D9E75"/>
<text x="326.0" y="187.6" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">đỉnh mới</tspan></text>
<circle cx="370.0" cy="257.8" r="3.6" fill="#1D9E75"/>
<text x="370.0" y="276.3" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL mới</tspan></text>
<text x="199.5" y="213.5" font-size="11" fill="#DC2626" text-anchor="start"><tspan>protected high (cũ)</tspan></text>
<text x="217.8" y="279.5" font-size="10.5" fill="#D85A30" text-anchor="end"><tspan>BOS ↓ (cũ)</tspan></text>
<circle cx="314.4" cy="219.5" r="5.5" fill="#7C3AED"/>
<text x="304.4" y="237.5" font-size="12.5" fill="#7C3AED" text-anchor="end"><tspan font-weight="700">MSS ↑</tspan></text>
<circle cx="416.9" cy="196.6" r="5.5" fill="#1D9E75"/>
<text x="426.9" y="210.6" font-size="12.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">BOS ↑ đầu tiên</tspan></text>
<rect x="560.0" y="104.0" width="516.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="562.0" y="96.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Tăng → Giảm</tspan></text>
<line x1="708.0" y1="288.5" x2="856.0" y2="288.5" stroke="#1D9E75" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="653.0" y1="242.5" x2="763.3" y2="242.5" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
