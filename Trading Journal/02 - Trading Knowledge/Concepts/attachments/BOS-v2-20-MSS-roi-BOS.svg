<circle cx="576.0" cy="349.7" r="3.6" fill="#1D9E75"/>
<text x="576.0" y="368.2" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL1</tspan></text>
<circle cx="653.0" cy="242.5" r="3.6" fill="#1D9E75"/>
<text x="653.0" y="233.5" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HH1</tspan></text>
<circle cx="708.0" cy="288.5" r="3.6" fill="#1D9E75"/>
<text x="708.0" y="307.0" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL2</tspan></text>
<circle cx="785.0" cy="158.3" r="3.6" fill="#1D9E75"/>
<text x="785.0" y="149.3" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HH2</tspan></text>
<circle cx="862.0" cy="311.4" r="3.6" fill="#DC2626"/>
<text x="862.0" y="329.9" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">đáy mới</tspan></text>
<circle cx="906.0" cy="250.2" r="3.6" fill="#DC2626"/>
<text x="906.0" y="241.2" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH mới</tspan></text>
<text x="735.5" y="304.5" font-size="11" fill="#1D9E75" text-anchor="start"><tspan>protected low (cũ)</tspan></text>
<text x="753.8" y="236.5" font-size="10.5" fill="#D85A30" text-anchor="end"><tspan>BOS ↑ (cũ)</tspan></text>
<circle cx="850.5" cy="288.5" r="5.5" fill="#7C3AED"/>
<text x="840.5" y="278.5" font-size="12.5" fill="#7C3AED" text-anchor="end"><tspan font-weight="700">MSS ↓</tspan></text>
<circle cx="952.9" cy="311.4" r="5.5" fill="#DC2626"/>
<text x="962.9" y="309.4" font-size="12.5" fill="#DC2626" text-anchor="start"><tspan font-weight="700">BOS ↓ đầu tiên</tspan></text>
<text x="24.0" y="432.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>① Ban đầu là cấu trúc giảm vì đỉnh và đáy đều thấp dần (LH–LL).</tspan></text>
<text x="564.0" y="432.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>② Swing bảo vệ cấu trúc giảm là LH2 — đỉnh tạo ra cú giảm phá LL1.</tspan></text>
<text x="24.0" y="454.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>③ Giá vượt LH2: lần đầu cấu trúc giảm bị phủ định → MSS (nhiều nơi gọi CHoCH).</tspan></text>
<text x="564.0" y="454.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>④ Chưa có xu hướng mới: cần một HL mới không thủng LL2, rồi một BOS ↑ vượt đỉnh mới.</tspan></text>
<text x="24.0" y="476.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>⑤ Hình phải là phiên bản ngược lại. MSS là &quot;cảnh báo có cơ sở&quot;, BOS đầu tiên mới là &quot;cấu trúc mới có hình dạng&quot;.</tspan></text>
</svg>
