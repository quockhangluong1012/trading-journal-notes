<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Độ sâu mitigation cần thiết khác nhau theo session</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Cùng một Bullish OB, nhưng thanh khoản mỏng ở phiên Á đòi hỏi retrace sâu hơn nhiều so với London/NY</text>

  <!-- Panel 1: Asia thin liquidity -->
  <rect x="24" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="94" font-size="13.5" font-weight="700" fill="#B45309">① OB test trong phiên Á (thanh khoản mỏng)</text>

  <rect x="44" y="200" width="308" height="110" fill="#16A34A" opacity="0.1"/>
  <text x="48" y="196" font-size="8.5" fill="#6B7280">proximal (đỉnh OB)</text>
  <text x="48" y="322" font-size="8.5" fill="#6B7280">distal (đáy OB / râu)</text>
  <line x1="44" y1="255" x2="352" y2="255" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="300" y="251" font-size="8.5" fill="#1D4ED8" font-weight="700">CE 50%</text>

  <path d="M70,140 L110,180 L150,165 L190,220 L230,240" fill="none" stroke="#374151" stroke-width="2.2"/>
  <path d="M230,240 L260,270 L290,300 L310,315" fill="none" stroke="#B45309" stroke-width="2.2" stroke-dasharray="4 3"/>
  <circle cx="310" cy="315" r="6" fill="none" stroke="#B45309" stroke-width="2.4"/>
  <text x="200" y="335" font-size="9.5" font-weight="700" fill="#92400E">Cần đi gần tới cạnh distal mới có phản ứng</text>

  <rect x="36" y="356" width="308" height="52" rx="6" fill="#B45309" opacity="0.08" stroke="#B45309" stroke-width="1"/>
  <text x="44" y="374" font-size="9.5" fill="#92400E">Thanh khoản mỏng — order flow institutional</text>
  <text x="44" y="388" font-size="9.5" fill="#92400E">ít tham gia; shallow tap không đủ "gom" lệnh</text>

  <!-- Panel 2: London/NY thick liquidity -->
  <rect x="392" y="72" width="344" height="352" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="404" y="94" font-size="13.5" font-weight="700" fill="#16A34A">② OB test trong London/NY (thanh khoản dày)</text>

  <rect x="412" y="200" width="308" height="110" fill="#16A34A" opacity="0.1"/>
  <text x="416" y="196" font-size="8.5" fill="#6B7280">proximal (đỉnh OB)</text>
  <text x="416" y="322" font-size="8.5" fill="#6B7280">distal (đáy OB / râu)</text>
  <line x1="412" y1="255" x2="720" y2="255" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="668" y="251" font-size="8.5" fill="#1D4ED8" font-weight="700">CE 50%</text>

  <path d="M438,140 L478,180 L518,165 L558,205" fill="none" stroke="#374151" stroke-width="2.2"/>
  <path d="M558,205 L580,215 L600,208" fill="none" stroke="#16A34A" stroke-width="2.2"/>
  <circle cx="600" cy="208" r="6" fill="#16A34A"/>
  <path d="M600,208 L630,170 L660,140 L690,110" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="440" y="130" font-size="9.5" font-weight="700" fill="#166534">Shallow tap (giữa proximal–CE) đã đủ phản ứng</text>

  <rect x="404" y="356" width="308" height="52" rx="6" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="1"/>
  <text x="412" y="374" font-size="9.5" fill="#166534">Thanh khoản dày — order flow institutional</text>
  <text x="412" y="388" font-size="9.5" fill="#166534">tham gia mạnh; đủ khớp lệnh ngay tại vùng nông</text>
</svg>
