<text x="127.5" y="322.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">bóng 102.9</text>
<rect x="126.6" y="384.0" width="102.7" height="21.0" rx="10.5" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/>
<text x="178.0" y="398.5" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">FVG CÒN SỐNG</text>
<text x="40.0" y="426.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người bán đẩy được xuống 102.9 nhưng KHÔNG</text>
<text x="40.0" y="442.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">giữ được giá ở đó. Đến lúc đóng cửa, giá đã về lại</text>
<text x="40.0" y="459.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trên vùng.</text>
<rect x="350.0" y="98.0" width="300.0" height="450.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="364.0" y="122.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">B. Đóng cửa BÊN TRONG vùng</text>
