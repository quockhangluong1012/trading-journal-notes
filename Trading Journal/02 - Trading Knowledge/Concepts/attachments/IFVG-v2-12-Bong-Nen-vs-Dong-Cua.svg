<text x="771.5" y="322.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">bóng 102.9</text>
<rect x="722.7" y="384.0" width="198.6" height="21.0" rx="10.5" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="822.0" y="398.5" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">BỊ VI PHẠM → ỨNG VIÊN IFVG</text>
<text x="684.0" y="426.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Giá ở lại dưới 104 khi nến kết thúc. Thị trường đã</text>
<text x="684.0" y="442.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">chấp nhận giao dịch ở phía bên kia vùng — ít nhất</text>
<text x="684.0" y="459.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">là tạm thời.</text>
<rect x="28.0" y="601.0" width="944.0" height="57.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="46.0" y="627.0" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">Cho bé 5 tuổi: bóng nến giống như thò chân xuống hồ nước rồi rút lên ngay. Giá đóng cửa giống như bước hẳn xuống và ĐỨNG ở đó. Chỉ khi 'đứng ở</text>
<text x="46.0" y="644.5" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">đó' (C) ta mới nói giá đã sang phía bên kia vùng.</text>
</svg>
