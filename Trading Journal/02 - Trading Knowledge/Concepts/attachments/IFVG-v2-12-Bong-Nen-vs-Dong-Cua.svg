<text x="449.5" y="302.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="end" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">bóng 103.6</text>
<rect x="444.7" y="384.0" width="110.5" height="21.0" rx="10.5" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.1"/>
<text x="500.0" y="398.5" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">CHƯA KẾT LUẬN</text>
<text x="362.0" y="426.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Hai bên đang giằng co ngay trong vùng. Theo</text>
<text x="362.0" y="442.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">định nghĩa của note này: chưa phải IFVG — chờ</text>
<text x="362.0" y="459.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">thêm nến.</text>
<rect x="672.0" y="98.0" width="300.0" height="450.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="686.0" y="122.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">C. Đóng cửa DƯỚI cả vùng</text>
<rect x="682.0" y="136.0" width="280.0" height="230.0" rx="6" fill="#F8FAFC"/>
<rect x="695.2" y="229.6" width="253.5" height="57.1" rx="0" fill="#15803D" opacity="0.22"/>
