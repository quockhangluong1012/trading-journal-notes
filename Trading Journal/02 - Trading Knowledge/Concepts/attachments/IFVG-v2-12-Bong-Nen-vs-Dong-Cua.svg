<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="678.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Bóng nến hay giá đóng cửa? — điều kiện cốt lõi</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bóng nến cho biết giá đã ĐI TỚI đâu. Giá đóng cửa cho biết giá Ở LẠI đâu khi cây nến kết thúc. IFVG cần thông tin thứ hai.</text>
<rect x="826.7" y="22.0" width="145.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="899.3" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ĐIỀU KIỆN CỐT LÕI</text>
<rect x="28.0" y="98.0" width="300.0" height="450.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="122.0" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">A. Bóng xuyên, đóng cửa trên vùng</text>
