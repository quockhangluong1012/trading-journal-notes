<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Điều gì thật sự thay đổi? Đọc cấu trúc TRƯỚC và SAU khi đỉnh giữa bị phá</text>
<rect x="904.4" y="23.0" width="67.6" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="938.2" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CƠ CHẾ</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cùng những cái đỉnh và đáy ấy, nhưng ý nghĩa của chúng đổi hẳn sau một cây nến. Đây là lõi của chữ “Breaker”.</text>
<rect x="28.0" y="94.5" width="460.0" height="452.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="13.5" font-weight="700" fill="#E5484D" data-bx="41.0,477.0">TRƯỚC — mọi thứ đang kể chuyện GIẢM</text>
<polyline points="68.5,252.6 134.4,329.2 225.0,227.1 340.4,359.8 398.1,303.7" fill="none" stroke="#475569" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="134.4" y1="329.2" x2="360.4" y2="329.2" stroke="#7C3AED" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="225.0" y1="227.1" x2="464.0" y2="227.1" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<circle cx="68.5" cy="252.6" r="4.0" fill="#475569"/>
<circle cx="134.4" cy="329.2" r="4.0" fill="#475569"/>
<circle cx="225.0" cy="227.1" r="4.0" fill="#475569"/>
<circle cx="340.4" cy="359.8" r="4.0" fill="#475569"/>
<text x="134.4" y="347.2" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đáy cũ</text>
<text x="340.4" y="377.8" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đáy mới (thấp hơn)</text>
<rect x="209.0" y="225.1" width="32.0" height="22.0" rx="3" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="1.4"/>
<text x="225.0" y="203.1" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đỉnh giữa = đỉnh ĐƯỢC BẢO VỆ</text>
<text x="225.0" y="217.1" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">của nhịp giảm</text>
<text x="406.1" y="307.7" font-size="18" font-weight="700" fill="#6B7280">?</text>
<text x="42.0" y="430.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="41.0,475.0">Đáy sau thấp hơn đáy trước → phe bán đang thắng. Đỉnh giữa là nơi cú</text>
<text x="42.0" y="447.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="41.0,475.0">bán thắng ấy xuất phát. Chừng nào đỉnh này còn nguyên, chuyện “giá</text>
<text x="42.0" y="465.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="41.0,475.0">đang giảm” còn nguyên. Vùng nến ở đó được nhìn như KHÁNG CỰ.</text>
<rect x="512.0" y="94.5" width="460.0" height="452.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="526.0" y="120.0" font-size="13.5" font-weight="700" fill="#0E9F6E" data-bx="525.0,961.0">SAU — chuyện GIẢM bị xoá trên khung này</text>
<polyline points="552.5,252.6 618.4,329.2 709.0,227.1 824.4,359.8 931.5,170.9" fill="none" stroke="#475569" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="618.4" y1="329.2" x2="844.4" y2="329.2" stroke="#7C3AED" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="709.0" y1="227.1" x2="948.0" y2="227.1" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5,4"/>
<circle cx="552.5" cy="252.6" r="4.0" fill="#475569"/>
<circle cx="618.4" cy="329.2" r="4.0" fill="#475569"/>
<circle cx="709.0" cy="227.1" r="4.0" fill="#475569"/>
<circle cx="824.4" cy="359.8" r="4.0" fill="#475569"/>
<text x="618.4" y="347.2" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đáy cũ</text>
<text x="824.4" y="377.8" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đáy mới → đọc lại là “cú quét”</text>
<rect x="693.0" y="225.1" width="32.0" height="22.0" rx="3" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.4"/>
<rect x="859.0" y="201.1" width="41.4" height="20.0" rx="10.0" fill="#0E9F6E" fill-opacity="0.12" stroke="#0E9F6E" stroke-width="1"/>
<text x="879.7" y="213.3" font-size="11" font-weight="700" fill="#0E9F6E" text-anchor="middle">MSS</text>
<text x="689.0" y="217.1" font-size="11" font-weight="700" fill="#0E9F6E" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">đỉnh giữa ĐÃ BỊ PHÁ</text>
<text x="526.0" y="430.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="525.0,959.0">Đỉnh sinh ra cái đáy mới đã bị vượt bằng thân nến → chuỗi “đỉnh thấp</text>
<text x="526.0" y="447.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="525.0,959.0">hơn, đáy thấp hơn” không còn. Phe bán đã thua tại chính nơi họ mạnh</text>
<text x="526.0" y="465.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="525.0,959.0">nhất. Vùng nến ở đó được theo dõi như HỖ TRỢ có thể có.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Chú ý chữ “được theo dõi như”: cấu trúc đổi là QUAN SÁT. Việc vùng cũ sẽ đỡ giá là kỳ vọng của khung ICT — một giả thuyết, không phải hệ quả tất yếu.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
