<text x="263.0" y="201.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">Bị đóng cửa qua mép xa</text>
<line x1="263.0" y1="232.0" x2="263.0" y2="238.8" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round"/>
