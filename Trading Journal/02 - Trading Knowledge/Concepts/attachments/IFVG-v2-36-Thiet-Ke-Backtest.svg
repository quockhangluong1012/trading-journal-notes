<line x1="263.0" y1="448.0" x2="263.0" y2="454.8" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round"/>
<path d="M263.0,462.0 L259.7,454.7 L266.3,454.7 Z" fill="#1F2937"/>
<rect x="143.0" y="464.0" width="240.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="263.0" y="489.0" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Tới mục tiêu trước khi bị vô hiệu</text>
<text x="28.0" y="546.0" font-size="11.8" font-weight="600" fill="#6B7280" text-anchor="start">Ở mỗi tầng: ghi SỐ LƯỢNG và tỉ lệ đi tiếp sang tầng sau. Tầng nào 'rơi' nhiều</text>
<text x="28.0" y="562.3" font-size="11.8" font-weight="600" fill="#6B7280" text-anchor="start">nhất là chỗ khái niệm yếu nhất.</text>
