<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1.0" y="1.0" width="998.0" height="678.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Thiết kế backtest IFVG — không cần thống kê phức tạp</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một cái phễu để ĐẾM, và các cặp nhóm để SO SÁNH. Không cần công thức: chỉ cần định nghĩa cố định, ghi chép trung thực và một</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">nhóm đối chứng.</text>
<rect x="809.5" y="22.0" width="162.5" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="890.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">BACKTEST · THIẾT KẾ</text>
<rect x="28.0" y="104.0" width="470.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
<text x="263.0" y="129.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Tất cả FVG (định nghĩa cố định, một khung)</text>
