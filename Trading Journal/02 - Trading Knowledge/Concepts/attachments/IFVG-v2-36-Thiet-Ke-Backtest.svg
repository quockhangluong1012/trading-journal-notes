<text x="752.0" y="159.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="middle">vs</text>
<rect x="770.0" y="140.0" width="186.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="863.0" y="159.0" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">không có</text>
<rect x="538.0" y="182.0" width="196.0" height="30.0" rx="8" fill="#ECFDF3" stroke="#15803D" stroke-width="1"/>
<text x="636.0" y="201.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">Cú phá kèm MSS</text>
<text x="752.0" y="201.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="middle">vs</text>
<rect x="770.0" y="182.0" width="186.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="863.0" y="201.0" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">không MSS</text>
<rect x="538.0" y="224.0" width="196.0" height="30.0" rx="8" fill="#ECFDF3" stroke="#15803D" stroke-width="1"/>
<text x="636.0" y="243.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">Có sweep trước đó</text>
<text x="752.0" y="243.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="middle">vs</text>
<rect x="770.0" y="224.0" width="186.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="863.0" y="243.0" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">không sweep</text>
<rect x="538.0" y="266.0" width="196.0" height="30.0" rx="8" fill="#ECFDF3" stroke="#15803D" stroke-width="1"/>
<text x="636.0" y="285.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">Cùng hướng D1 / DOL</text>
<text x="752.0" y="285.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="middle">vs</text>
<rect x="770.0" y="266.0" width="186.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="863.0" y="285.0" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">ngược hướng</text>
<rect x="538.0" y="308.0" width="196.0" height="30.0" rx="8" fill="#ECFDF3" stroke="#15803D" stroke-width="1"/>
<text x="636.0" y="327.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">Retest lần đầu</text>
<text x="752.0" y="327.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="middle">vs</text>
<rect x="770.0" y="308.0" width="186.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="863.0" y="327.0" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">lần 2+</text>
<rect x="538.0" y="350.0" width="196.0" height="30.0" rx="8" fill="#ECFDF3" stroke="#15803D" stroke-width="1"/>
<text x="636.0" y="369.0" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">Trong killzone</text>
<text x="752.0" y="369.0" font-size="11" font-weight="800" fill="#6B7280" text-anchor="middle">vs</text>
<rect x="770.0" y="350.0" width="186.0" height="30.0" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="1"/>
<text x="863.0" y="369.0" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">ngoài killzone</text>
<rect x="538.0" y="396.0" width="418.0" height="58.0" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
<text x="552.0" y="416.0" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="start">ĐỐI CHỨNG: vùng cùng kích thước đặt ngẫu nhiên, và mức S/R</text>
<text x="552.0" y="431.9" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="start">thường bị phá. Không có đối chứng = không biết IFVG có thêm gì.</text>
<rect x="520.0" y="476.0" width="452.0" height="180.0" rx="12" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="538.0" y="502.0" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start">Ba câu hỏi KHÁC nhau — đừng trộn</text>
<text x="538.0" y="528.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">① IFVG có TỒN TẠI không? → đếm theo định nghĩa.</text>
<text x="538.0" y="554.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">② IFVG có PHẢN ỨNG không? → so với đối chứng.</text>
<text x="538.0" y="580.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">③ IFVG có EDGE không? → kết quả bằng R sau spread, trượt giá, sau khi</text>
<text x="538.0" y="596.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trừ các lệnh lỡ.</text>
