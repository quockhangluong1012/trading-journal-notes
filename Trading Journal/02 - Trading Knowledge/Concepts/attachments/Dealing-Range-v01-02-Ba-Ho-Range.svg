  <text x="38.0" y="431.7" font-size="11" fill="#374151">Trend · ICT 2022 Model · OTE</text>
  <text x="38.0" y="454.6" font-size="11" font-weight="700" fill="#1F2937">Yêu cầu:</text>
  <text x="38.0" y="470.6" font-size="11" fill="#374151">direction BULL/BEAR ở scale đang xét</text>
  <text x="353.0" y="362.0" font-size="11" font-weight="700" fill="#1F2937">Trả lời:</text>
  <text x="353.0" y="378.0" font-size="11" fill="#374151">Liquidity bên ngoài nằm ở đâu hai phía, giá đang ở</text>
