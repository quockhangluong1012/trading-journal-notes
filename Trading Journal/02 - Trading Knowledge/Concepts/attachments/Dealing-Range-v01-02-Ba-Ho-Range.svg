  <text x="353.0" y="415.7" font-size="11" font-weight="700" fill="#1F2937">Hữu ích nhất:</text>
  <text x="353.0" y="431.7" font-size="11" fill="#374151">Consolidation · DOL mapping</text>
  <text x="353.0" y="454.6" font-size="11" font-weight="700" fill="#1F2937">Lưu ý:</text>
  <text x="353.0" y="470.6" font-size="11" fill="#374151">không tự mang hướng — P/D ở đây là</text>
  <text x="353.0" y="485.4" font-size="11" fill="#374151">mean-reversion</text>
  <text x="668.0" y="362.0" font-size="11" font-weight="700" fill="#1F2937">Trả lời:</text>
  <text x="668.0" y="378.0" font-size="11" fill="#374151">Trong một cửa sổ thời gian chuẩn, giá đang ở đâu?</text>
