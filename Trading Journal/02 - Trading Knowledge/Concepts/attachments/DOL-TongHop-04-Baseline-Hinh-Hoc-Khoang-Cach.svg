<svg viewBox="0 0 760 462" width="760" height="462" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Khoảng cách quyết định xác suất — kể cả khi thị trường hoàn toàn ngẫu nhiên</title>
<desc>Thanh ngang minh họa xác suất chạm DOL trước theo tỷ lệ khoảng cách tới DOL và tới đối thủ: 1:3 là 75 phần trăm, 1:1 là 50, 2:1 là 33, 3:1 là 25.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="462" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Khoảng cách quyết định xác suất — kể cả khi thị trường hoàn toàn ngẫu nhiên</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Giá cách DOL một đoạn a (phía trên) và cách đối thủ một đoạn b (phía dưới). Bước đi ngẫu nhiên không xu</text>
<text x="24" y="70" font-size="12.5" fill="#6B7280">hướng: P(chạm DOL trước) = b / (a + b).</text>
<rect x="24" y="84" width="400" height="282" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="38" y="106" font-size="12.5" fill="#1F2937" font-weight="700">P(DOL bị chạm trước) theo tỷ lệ khoảng cách</text>
<text x="38" y="122" font-size="10.5" fill="#6B7280">khoảng cách tới DOL : tới đối thủ</text>
<text x="90" y="159" font-size="12.5" fill="#1F2937" text-anchor="end" font-weight="700">1 : 3</text>
<rect x="100" y="140" width="290" height="28" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<rect x="100" y="140" width="217.5" height="28" rx="4" fill="#1D9E75" stroke="none" stroke-width="1" opacity="0.85"/>
<text x="309.5" y="159" font-size="12.5" fill="#FFFFFF" text-anchor="end" font-weight="700">75%</text>
<text x="90" y="205" font-size="12.5" fill="#1F2937" text-anchor="end" font-weight="700">1 : 1</text>
<rect x="100" y="186" width="290" height="28" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<rect x="100" y="186" width="145.0" height="28" rx="4" fill="#6B7280" stroke="none" stroke-width="1" opacity="0.85"/>
<text x="251.0" y="205" font-size="12.5" fill="#1F2937" font-weight="700">50%</text>
<text x="90" y="251" font-size="12.5" fill="#1F2937" text-anchor="end" font-weight="700">2 : 1</text>
<rect x="100" y="232" width="290" height="28" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<rect x="100" y="232" width="95.7" height="28" rx="4" fill="#D85A30" stroke="none" stroke-width="1" opacity="0.85"/>
<text x="201.7" y="251" font-size="12.5" fill="#1F2937" font-weight="700">33%</text>
<text x="90" y="297" font-size="12.5" fill="#1F2937" text-anchor="end" font-weight="700">3 : 1</text>
<rect x="100" y="278" width="290" height="28" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<rect x="100" y="278" width="72.5" height="28" rx="4" fill="#D85A30" stroke="none" stroke-width="1" opacity="0.85"/>
<text x="178.5" y="297" font-size="12.5" fill="#1F2937" font-weight="700">25%</text>
<line x1="245.0" y1="132" x2="245.0" y2="312" stroke="#1F2937" stroke-width="1" stroke-dasharray="3 3"/>
<text x="245.0" y="326" font-size="10.5" fill="#6B7280" text-anchor="middle">50% = tung đồng xu</text>
<text x="38" y="354" font-size="11" fill="#4B5563" font-style="italic">Thị trường không có lực hút nào; chỉ có hình học.</text>
<rect x="440" y="84" width="296" height="282" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="454" y="106" font-size="12.5" fill="#1F2937" font-weight="700">Ảo giác “DOL luôn đúng”</text>
<text x="454" y="152" font-size="34" fill="#D85A30" font-weight="700">63%</text>
<text x="454" y="170" font-size="10.5" fill="#4B5563">“tỷ lệ đúng” trung bình nếu bạn LUÔN chọn pool</text>
<text x="454" y="184.2" font-size="10.5" fill="#4B5563">gần hơn làm DOL (mô phỏng, khoảng cách ngẫu</text>
<text x="454" y="198.39999999999998" font-size="10.5" fill="#4B5563">nhiên 0.3–2.0 ATR).</text>
<text x="454" y="232" font-size="22" fill="#1F2937" font-weight="700">EV = 0R</text>
<text x="454" y="248" font-size="10.5" fill="#4B5563">nếu TP đặt tại DOL và SL tại pool đối thủ</text>
<text x="454" y="262.2" font-size="10.5" fill="#4B5563">(trước phí).</text>
<line x1="454" y1="274" x2="722" y2="274" stroke="#E5E7EB" stroke-width="1"/>
<text x="454" y="292" font-size="10.5" fill="#1F2937" font-weight="700">Tỷ lệ thắng hòa vốn của R:R bất kỳ =</text>
<text x="454" y="306.2" font-size="10.5" fill="#1F2937" font-weight="700">1/(1+RR) = đúng bằng xác suất ngẫu nhiên</text>
<text x="454" y="320.4" font-size="10.5" fill="#1F2937" font-weight="700">chạm TP trước SL.</text>
<rect x="24" y="378" width="712" height="72" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="38" y="400" font-size="13.5" fill="#92400E" font-weight="700">Edge của DOL = tỷ lệ chạm trước THỰC TẾ − baseline b/(a+b)</text>
<text x="38" y="420" font-size="11.5" fill="#92400E">Tỷ lệ chạm “cao” thôi thì chưa đủ. Chỉ có phần vượt baseline, ở cùng khoảng cách và cùng horizon, mới là</text>
<text x="38" y="435.5" font-size="11.5" fill="#92400E">thông tin.</text>
</svg>
