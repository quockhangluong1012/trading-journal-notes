<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>

  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Case Study 1 — EURUSD Long: SSL Sweep → Bullish MSS → +3.25R</text>
  <text x="600" y="64" font-size="15" fill="#94a3b8" text-anchor="middle">Thứ Ba, London Kill Zone 08:12–14:55 NY — Daily Bias Bullish, discount H1 OB 1.0798–1.0808</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="60" y1="150" x2="1140" y2="150"/>
    <line x1="60" y1="280" x2="1140" y2="280"/>
    <line x1="60" y1="410" x2="1140" y2="410"/>
    <line x1="60" y1="540" x2="1140" y2="540"/>
  </g>

  <!-- price levels labels on left -->
  <text x="20" y="154" font-size="12" fill="#94a3b8">1.0895</text>
  <text x="20" y="284" font-size="12" fill="#94a3b8">1.0855</text>
  <text x="20" y="414" font-size="12" fill="#94a3b8">1.0817</text>
  <text x="20" y="544" font-size="12" fill="#94a3b8">1.0793</text>

  <!-- BSL target line -->
  <line x1="60" y1="150" x2="1140" y2="150" stroke="#eab308" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="1000" y="145" font-size="13" fill="#eab308">Target 2: BSL 1.0895 (PWH)</text>

  <!-- equilibrium/target1 -->
  <line x1="60" y1="280" x2="1140" y2="280" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="1000" y="275" font-size="12.5" fill="#eab308">Target 1: internal 1.0855</text>

  <!-- downward leg into discount forming lower highs -->
  <line x1="120" y1="180" x2="120" y2="240" stroke="#ef4444" stroke-width="2"/>
  <rect x="112" y="195" width="16" height="30" fill="#ef4444"/>
  <line x1="170" y1="200" x2="170" y2="260" stroke="#ef4444" stroke-width="2"/>
  <rect x="162" y="215" width="16" height="30" fill="#ef4444"/>
  <line x1="220" y1="230" x2="220" y2="300" stroke="#ef4444" stroke-width="2"/>
  <rect x="212" y="245" width="16" height="35" fill="#ef4444"/>

  <line x1="100" y1="330" x2="330" y2="330" stroke="#eab308" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="335" y="334" font-size="12" fill="#eab308">lower-high 1.0818</text>

  <line x1="270" y1="260" x2="270" y2="340" stroke="#ef4444" stroke-width="2"/>
  <rect x="262" y="280" width="16" height="40" fill="#ef4444"/>

  <!-- equal lows / OB zone -->
  <rect x="60" y="470" width="320" height="55" fill="#22c55e" opacity="0.2"/>
  <text x="70" y="490" font-size="12.5" fill="#e2e8f0">H1 bullish OB 1.0798–1.0808</text>
  <text x="70" y="506" font-size="11.5" fill="#94a3b8">+ equal lows 1.0801/1.0803 (Tier 1)</text>

  <!-- sweep wick -->
  <text x="330" y="450" font-size="13" fill="#f97316" font-weight="bold">08:12 — Sweep SSL</text>
  <line x1="330" y1="410" x2="330" y2="555" stroke="#f97316" stroke-width="2.5"/>
  <rect x="322" y="420" width="16" height="60" fill="#ef4444"/>
  <text x="290" y="575" font-size="11.5" fill="#f97316">wick 1.0796 → reclaim 1.0809</text>

  <!-- displacement candle breaking lower high -->
  <line x1="420" y1="440" x2="420" y2="320" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="410" y="330" width="20" height="90" fill="#22c55e"/>
  <text x="380" y="305" font-size="13" fill="#22c55e" font-weight="bold">08:27 — Bullish MSS</text>
  <text x="380" y="580" font-size="11.5" fill="#94a3b8">phá LH 1.0818, đóng 1.0826, CISD OK</text>

  <!-- FVG -->
  <rect x="410" y="360" width="120" height="45" fill="#22c55e" opacity="0.25"/>
  <text x="416" y="378" font-size="12" fill="#e2e8f0">FVG</text>
  <text x="416" y="393" font-size="11" fill="#94a3b8">1.0814–1.0819</text>

  <!-- entry marker -->
  <circle cx="470" cy="405" r="6" fill="#38bdf8"/>
  <text x="482" y="409" font-size="13" fill="#38bdf8" font-weight="bold">Entry 08:34 @ 1.0817</text>

  <!-- stop line -->
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="900" y="558" font-size="13" fill="#ef4444">Stop 1.0793 (dưới sweep low, buffer 3 pip)</text>

  <!-- path to target -->
  <line x1="470" y1="405" x2="700" y2="280" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="620" y="260" font-size="12" fill="#94a3b8">11:40 chạm T1, dời stop về entry</text>
  <line x1="700" y1="280" x2="950" y2="150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="800" y="200" font-size="12" fill="#94a3b8">14:55 chạm T2 1.0895</text>
  <circle cx="950" cy="150" r="6" fill="#a78bfa"/>

  <!-- results box -->
  <rect x="820" y="470" width="320" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="835" y="495" font-size="14" font-weight="bold" fill="#e2e8f0">Kết quả</text>
  <text x="835" y="516" font-size="13" fill="#e2e8f0">Rủi ro: 24 pip</text>
  <text x="835" y="535" font-size="13" fill="#e2e8f0">Lợi nhuận: 78 pip</text>
  <text x="835" y="558" font-size="15" fill="#22c55e" font-weight="bold">Kết quả: +3.25R</text>

  <text x="600" y="650" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-style="italic">Bài học: chọn lower-high GẦN nhất (1.0818) làm swing MSS thay vì chờ phá toàn bộ chuỗi (1.0832) → entry sớm hơn, R tốt hơn.</text>
</svg>
