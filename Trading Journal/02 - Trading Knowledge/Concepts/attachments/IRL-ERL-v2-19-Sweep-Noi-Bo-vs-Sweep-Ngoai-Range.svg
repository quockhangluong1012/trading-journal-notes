<svg viewBox="0 0 1000 616" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="614" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="906.9" y="22" width="65.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="939.4" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">SWEEP</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Sweep NỘI BỘ và sweep NGOÀI RANGE — cùng là “quét đáy”, khác hẳn về tầm ảnh</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">hưởng</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sweep = giá vượt qua một mức có lệnh chờ rồi quay lại. Sweep nội bộ thường chỉ là một nhịp hồi. Sweep ngoài range có thể kết thúc câu chuyện của cả range</text>
<text x="28.0" y="107.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">— hoặc mở ra một range mới.</text>
<rect x="28.0" y="130.0" width="466.0" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="152.0" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">Sweep NỘI BỘ (internal)</text>
<rect x="52.0" y="198.9" width="418.0" height="193.5" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="52.0" y="198.9" width="418.0" height="193.5" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="52.0" y1="295.6" x2="470.0" y2="295.6" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M52.0,383.0 L111.7,307.4 L151.5,326.3 L211.2,265.0 L251.0,293.3 L271.0,283.8 L290.9,300.4 L310.8,274.4 L370.5,227.2 L410.3,246.1 L450.1,213.0 L470.0,217.8" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="251.0" y1="293.3" x2="330.7" y2="293.3" stroke="#D97706" stroke-width="1.4" stroke-dasharray="3,3"/>
<circle cx="264.5" cy="300.3" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="279.4" cy="300.3" r="2.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<line x1="290.9" y1="300.4" x2="330.9" y2="340.4" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>
<text x="333.9" y="344.4" font-size="10.5" font-weight="600" fill="#D97706" text-anchor="start" data-maxw="150.0">quét đáy nội bộ rồi đi tiếp lên</text>
<text x="44.0" y="444.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="434.0">• Mức bị quét nằm GIỮA range. Hàng rào không đổi.</text>
<text x="44.0" y="468.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="434.0">• Thường chỉ là nhịp hồi lấy stop của người vừa mua — xu hướng có thể tiếp</text>
<text x="44.0" y="484.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="434.0">diễn.</text>
<text x="44.0" y="508.0" font-size="12" font-weight="700" fill="#D97706" text-anchor="start" data-maxw="434.0">• Ý nghĩa lớn chỉ khi nó xảy ra ĐÚNG tại POI khung lớn.</text>
<rect x="506.0" y="130.0" width="466.0" height="400.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="520.0" y="152.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">Sweep NGOÀI RANGE (external)</text>
<rect x="530.0" y="208.3" width="418.0" height="151.0" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="530.0" y="208.3" width="418.0" height="151.0" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="530.0" y1="283.8" x2="948.0" y2="283.8" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M530.0,250.8 L569.8,208.3 L609.6,274.4 L649.4,250.8 L689.2,312.2 L729.0,293.3 L768.9,359.4 L808.7,345.2 L828.6,387.7 L848.5,345.2 L868.4,298.0 L888.3,307.4 L928.1,260.2 L948.0,265.0" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="783.1" cy="368.4" r="2.4000000000000004" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="799.7" cy="368.4" r="2.4000000000000004" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<circle cx="816.3" cy="368.4" r="2.4000000000000004" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.1"/>
<line x1="828.6" y1="387.7" x2="778.6" y2="393.7" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3,2"/>
<text x="775.6" y="397.7" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="end" data-maxw="150.0">quét đáy RANGE, đóng cửa</text>
<text x="775.6" y="411.3" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="end" data-maxw="150.0">lại bên trong</text>
<line x1="868.4" y1="298.0" x2="798.4" y2="238.0" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
<text x="795.4" y="236.0" font-size="10.5" font-weight="600" fill="#059669" text-anchor="end" data-maxw="120.0">displacement lên</text>
<text x="522.0" y="444.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="434.0">• Mức bị quét là BIÊN của range: ERL.</text>
<text x="522.0" y="468.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="434.0">• Hai khả năng: (1) đảo chiều — giá quay vào và đi về IRL/ERL đối diện; (2)</text>
<text x="522.0" y="484.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="434.0">breakout — đóng cửa và được chấp nhận bên dưới.</text>
<text x="522.0" y="524.0" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="start" data-maxw="434.0">• Chỉ bằng chứng SAU cú quét mới phân biệt được.</text>
<rect x="28.0" y="544.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="568.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Sweep ngoài range có “tầm” lớn hơn vì nó chạm tới giới hạn của cả câu chuyện. Nhưng “tầm lớn” không có nghĩa “chắc chắn đảo chiều”: theo Osler, stop bị kích</text>
<text x="42.0" y="584.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hoạt có xu hướng đẩy giá đi TIẾP cùng chiều.</text>
</svg>
