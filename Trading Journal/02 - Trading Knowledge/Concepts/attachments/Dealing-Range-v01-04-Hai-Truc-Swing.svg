  <text x="376.0" y="139.0" font-size="11" font-weight="700" fill="#1F2937">HL mới</text>
  <text x="376.0" y="153.0" font-size="9.8" fill="#6B7280">chưa có BOS từ nó</text>
  <circle cx="522.0" cy="373.0" r="6" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
