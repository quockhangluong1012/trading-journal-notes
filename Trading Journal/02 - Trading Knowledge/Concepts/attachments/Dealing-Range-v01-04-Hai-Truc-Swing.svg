<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <rect x="0" y="0" width="980" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937">Phân loại swing hai trục: scale (θ*) × role(t)</text>
  <text x="26.0" y="55.0" font-size="13" fill="#6B7280">Micro/HTF là KÍCH THƯỚC; internal/protected/target là VAI TRÒ so với một range. Hierarchy 5 cấp trộn hai trục này — tách chúng ra để đo được.</text>
  <rect x="210.0" y="112.0" width="120.0" height="348.0" rx="0" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
