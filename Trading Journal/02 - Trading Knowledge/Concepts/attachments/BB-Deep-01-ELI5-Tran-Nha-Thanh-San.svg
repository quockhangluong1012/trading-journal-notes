<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Giải thích cho trẻ 5 tuổi: “Trần nhà biến thành sàn nhà”</text>
<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một quả bóng nảy trong ngôi nhà hai tầng. Hình chỉ giúp nhớ THỨ TỰ sự kiện — không mô tả ai đang đặt lệnh trên thị trường.</text>
