<text x="38.0" y="404.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Bóng nảy lên, đụng trần, rơi xuống.</text>
<text x="38.0" y="420.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Trần = vùng OB gốc từng chặn giá.</text>
<rect x="38.0" y="468.5" width="104.6" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#B45309" stroke-width="1.1"/>
<text x="90.3" y="483.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">chart: OB gốc giữ</text>
<rect x="262.0" y="384.0" width="222.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="274.0" y="404.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Bóng nảy rất mạnh, xuyên qua</text>
<text x="274.0" y="420.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">trần, lên tầng trên. = giá đóng nến</text>
<text x="274.0" y="436.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">vượt qua vùng và phá đỉnh cũ.</text>
<rect x="274.0" y="468.5" width="141.3" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#111827" stroke-width="1.1"/>
<text x="344.6" y="483.0" font-size="10.5" font-weight="700" fill="#111827" text-anchor="middle">chart: OB thất bại + MSS</text>
<rect x="498.0" y="384.0" width="222.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="510.0" y="404.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Bóng rơi xuống, chạm đúng chỗ</text>
<text x="510.0" y="420.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">trần cũ và nảy lên lại. = retest</text>
<text x="510.0" y="436.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Breaker và phản ứng.</text>
<rect x="510.0" y="468.5" width="126.3" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.1"/>
<text x="573.1" y="483.0" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">chart: Breaker giữ (A)</text>
<rect x="734.0" y="384.0" width="222.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="746.0" y="404.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Có lúc bóng rơi xuyên qua lỗ</text>
<text x="746.0" y="420.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">thủng, rớt xuống tầng dưới. =</text>
<text x="746.0" y="436.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Breaker thất bại. Không có gì bảo</text>
<text x="746.0" y="452.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">đảm.</text>
<rect x="746.0" y="468.5" width="153.0" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.1"/>
<text x="822.5" y="483.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">chart: Breaker bị xuyên (B)</text>
<rect x="26.0" y="504.0" width="928.0" height="68.1" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
<rect x="26.0" y="504.0" width="4.0" height="68.1" rx="2" fill="#B45309"/>
<text x="38.0" y="526.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Ẩn dụ gãy ở đâu?</text>
<text x="38.0" y="545.9" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Trần nhà là vật thật; vùng giá thì không. Không có “bê tông” nào ở đó — chỉ có lệnh của những người tham gia, và biểu đồ không cho ta thấy họ là ai. Ẩn dụ đúng ở</text>
<text x="38.0" y="561.7" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">THỨ TỰ (chặn → bị phá → quay lại thử), sai ở chỗ gợi ý rằng sàn chắc chắn sẽ đỡ.</text>
</svg>
