<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="dpatr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="dpatr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B45309"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">ATR baseline bị "phồng" sau một displacement lớn</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">ATR(14) nhảy vọt sau cú nổ đầu tiên → continuation displacement bị chấm "yếu" oan vì dùng sai mẫu số</text>

  <rect x="24" y="70" width="712" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- ==== PRICE PANEL (top) ==== -->
  <text x="44" y="94" font-size="11" font-weight="700" fill="#374151">Giá — một leg tăng đang chạy</text>

  <!-- structure level broken by first displacement -->
  <line x1="44" y1="250" x2="716" y2="250" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="590" y="244" font-size="9.5" fill="#6B7280">mức cấu trúc bị phá</text>

  <!-- pre-sweep small path + SSL -->
  <line x1="60" y1="290" x2="150" y2="290" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M70,270 L100,282 L130,290" fill="none" stroke="#6B7280" stroke-width="1.8"/>
  <circle cx="130" cy="290" r="5" fill="none" stroke="#B45309" stroke-width="2.2"/>
  <text x="58" y="306" font-size="9" fill="#B45309">sweep</text>

  <!-- FIRST big displacement candle (bullish) -->
  <rect x="169" y="118" width="2" height="176" fill="#16A34A"/>
  <rect x="162" y="128" width="14" height="150" fill="#16A34A" rx="1"/>
  <text x="150" y="112" font-size="10.5" font-weight="700" fill="#15803D">① Displacement LỚN đầu tiên</text>

  <!-- small pullback candles -->
  <rect x="205" y="150" width="2" height="40" fill="#DC2626"/><rect x="199" y="156" width="12" height="26" fill="#DC2626" rx="1" opacity="0.7"/>
  <rect x="233" y="145" width="2" height="40" fill="#DC2626"/><rect x="227" y="150" width="12" height="26" fill="#DC2626" rx="1" opacity="0.7"/>
  <text x="200" y="212" font-size="8.5" fill="#6B7280">pullback nhỏ</text>

  <!-- CONTINUATION displacement candle (medium) -->
  <rect x="279" y="120" width="2" height="66" fill="#16A34A"/>
  <rect x="272" y="128" width="14" height="52" fill="#16A34A" rx="1"/>
  <text x="300" y="126" font-size="10.5" font-weight="700" fill="#15803D">② Continuation displacement</text>
  <text x="300" y="141" font-size="9.5" fill="#374151">thực chất MẠNH so với baseline TRƯỚC leg,</text>
  <text x="300" y="155" font-size="9.5" fill="#374151">nhưng bị ATR đã phồng chấm nhầm là "yếu"</text>

  <!-- pre-expansion baseline (reference range) dashed on continuation -->
  <line x1="600" y1="128" x2="700" y2="128" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="600" y1="180" x2="700" y2="180" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="452" y="198" font-size="9.5" font-weight="700" fill="#1D4ED8">so với baseline TRƯỚC (xanh): ĐỦ mạnh → entry OK</text>

  <!-- divider -->
  <line x1="44" y1="330" x2="716" y2="330" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ==== ATR TRACK (bottom) ==== -->
  <text x="44" y="352" font-size="11" font-weight="700" fill="#374151">Track ATR(14) bên dưới</text>

  <!-- axis -->
  <line x1="60" y1="430" x2="716" y2="430" stroke="#9CA3AF" stroke-width="1.2"/>

  <!-- pre-expansion baseline ATR (dashed low, extended) -->
  <line x1="60" y1="412" x2="716" y2="412" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="548" y="408" font-size="9.5" font-weight="700" fill="#1D4ED8">pre-expansion ATR (mẫu số đúng)</text>

  <!-- ATR step line: low then jumps up after first displacement -->
  <path d="M60,412 L165,412 L165,368 L280,368 L280,378 L716,378" fill="none" stroke="#B45309" stroke-width="2.4"/>
  <text x="352" y="362" font-size="9.5" font-weight="700" fill="#B45309">ATR nhảy vọt sau cú nổ → "phồng"</text>
  <path d="M280,398 L280,382" stroke="#B45309" stroke-width="1.4" marker-end="url(#dpatr2)"/>
  <text x="188" y="404" font-size="9" fill="#B45309">ATR hiện tại (đã phồng) = mẫu số SAI, kéo ngưỡng lên phi lý</text>

  <text x="24" y="466" font-size="11" font-style="italic" fill="#6B7280">Dùng ATR TRƯỚC displacement đầu (hoặc ATR khung cao hơn) làm mẫu số cả leg — đừng để ATR tự cập nhật kéo ngưỡng giữa leg.</text>
</svg>
