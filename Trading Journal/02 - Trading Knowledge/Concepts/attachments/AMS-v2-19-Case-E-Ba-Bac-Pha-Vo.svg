<text x="40.0" y="508.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">① Chỉ cấp ngắn hạn đổi. ITL và LTL còn nguyên → có thể chỉ là một nhịp hồi.</text>
<text x="40.0" y="528.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">② Cấp trung hạn đổi. Nhịp tăng gần nhất không còn được "giữ". LTL vẫn còn → cấu trúc lớn chưa đổi.</text>
<text x="40.0" y="548.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">③ Cấp dài hạn (trên khung này) đổi. Vẫn KHÔNG chứng minh xu hướng của khung lớn hơn đã đảo.</text>
