<rect x="585.8" y="228.5" width="15.0" height="40.0" rx="1" fill="#E5484D"/>
<line x1="630.8" y1="241.8" x2="630.8" y2="315.1" stroke="#E5484D" stroke-width="1.4"/>
<rect x="623.2" y="268.5" width="15.0" height="40.0" rx="1" fill="#E5484D"/>
