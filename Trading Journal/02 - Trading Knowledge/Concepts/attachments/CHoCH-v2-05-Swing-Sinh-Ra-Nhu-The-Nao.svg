<text x="70.0" y="417.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t1</text>
<circle cx="122.0" cy="292.5" r="9.0" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="122.0" y="317.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t2</text>
<circle cx="174.0" cy="232.5" r="9.0" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="174.0" y="257.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t3</text>
<circle cx="226.0" cy="212.5" r="9.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="226.0" y="237.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t4</text>
<circle cx="278.0" cy="232.5" r="9.0" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="278.0" y="257.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t5</text>
<circle cx="330.0" cy="292.5" r="9.0" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="330.0" y="317.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t6</text>
<circle cx="382.0" cy="392.5" r="9.0" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="382.0" y="417.5" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">t7</text>
<line x1="50.0" y1="460.5" x2="410.0" y2="460.5" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
<text x="226.0" y="184.5" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">cao nhất ở t4</text>
<text x="44.0" y="486.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,415.0">Ở đúng lúc t4, bạn KHÔNG biết đó là điểm cao nhất — có thể</text>
<text x="44.0" y="503.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,415.0">bóng còn bay tiếp. Chỉ khi thấy bóng rơi xuống ở t5, t6, bạn</text>
<text x="44.0" y="521.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="43.0,415.0">mới nói: “À, đỉnh là t4”.</text>
<rect x="442.0" y="92.5" width="530.0" height="461.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="466.0" cy="113.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="466.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="483.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="482.0,961.0">Trên chart: đỉnh fractal 5 nến</text>
<g>
