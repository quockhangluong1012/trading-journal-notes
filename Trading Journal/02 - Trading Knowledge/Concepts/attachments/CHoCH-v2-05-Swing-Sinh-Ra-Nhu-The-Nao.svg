<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Swing high được sinh ra như thế nào — và vì sao ta chỉ biết nó MUỘN</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Trái: ví dụ cho bé. Phải: cùng ý tưởng trên nến. Một đỉnh chỉ trở thành “swing high” khi giá đã đi xuống khỏi nó một đoạn.</text>
<rect x="28.0" y="92.5" width="400.0" height="461.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="52.0" cy="113.5" r="10.0" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="69.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="68.0,417.0">Ném quả bóng lên trời</text>
