<rect x="698.2" y="335.1" width="15.0" height="40.0" rx="1" fill="#E5484D"/>
</g>
<text x="480.8" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">1</text>
<text x="518.2" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">2</text>
<text x="555.8" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">3</text>
<text x="593.2" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">4</text>
<text x="630.8" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">5</text>
<text x="668.2" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">6</text>
<text x="705.8" y="444.5" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">7</text>
<line x1="499.5" y1="188.5" x2="724.5" y2="188.5" stroke="#2563EB" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="501.5" y="182.5" font-size="10.5" font-weight="700" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="456.0,768.0">đỉnh = nến 4</text>
<rect x="656.2" y="144.5" width="26.0" height="288.0" rx="4" fill="#C026D3" fill-opacity="0.08" stroke="#C026D3" stroke-width="1" stroke-dasharray="4,3"/>
<text x="668.2" y="251.3" font-size="10" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="456.0,768.0">xác nhận</text>
<text x="668.2" y="263.8" font-size="10" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="456.0,768.0">tại đây</text>
<text x="778.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="777.0,959.0">Nến 1–3: giá đi lên, mỗi nến cao</text>
<text x="778.0" y="182.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="777.0,959.0">hơn nến trước.</text>
<text x="778.0" y="207.4" font-size="11.6" font-weight="400" fill="#2563EB" data-bx="777.0,959.0">Nến 4: cao nhất. Lúc nến 4</text>
<text x="778.0" y="223.9" font-size="11.6" font-weight="400" fill="#2563EB" data-bx="777.0,959.0">đóng cửa, ta CHƯA biết nó là</text>
<text x="778.0" y="240.3" font-size="11.6" font-weight="400" fill="#2563EB" data-bx="777.0,959.0">đỉnh.</text>
<text x="778.0" y="264.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="777.0,959.0">Nến 5: thấp hơn nến 4. Vẫn</text>
<text x="778.0" y="281.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="777.0,959.0">chưa chắc.</text>
<text x="778.0" y="305.8" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="777.0,959.0">Nến 6 đóng cửa: đã có 2 nến</text>
<text x="778.0" y="322.2" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="777.0,959.0">thấp hơn ở bên phải → nến 4</text>
<text x="778.0" y="338.7" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="777.0,959.0">được XÁC NHẬN là swing high.</text>
<text x="778.0" y="363.2" font-size="11.6" font-weight="400" fill="#B45309" data-bx="777.0,959.0">Bài học: swing luôn đến trễ.</text>
<text x="778.0" y="379.7" font-size="11.6" font-weight="400" fill="#B45309" data-bx="777.0,959.0">Một cú “phá swing” chỉ có</text>
<text x="778.0" y="396.1" font-size="11.6" font-weight="400" fill="#B45309" data-bx="777.0,959.0">nghĩa nếu swing đó đã được</text>
<text x="778.0" y="412.6" font-size="11.6" font-weight="400" fill="#B45309" data-bx="777.0,959.0">xác nhận TRƯỚC cú phá.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Quy tắc “2 nến mỗi bên” là một quy ước (fractal), không phải luật. Có nhiều cách định nghĩa swing; mỗi cách cho độ trễ khác nhau — xem note 54.</text>
