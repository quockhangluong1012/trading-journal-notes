<svg viewBox="0 0 1000 569" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="567" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="925.9" y="22" width="46.1" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="948.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ERL</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Giá vừa chạm ERL trên. Ba tương lai — và bằng chứng nào cho biết bạn đang ở tương lai</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">nào</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cú vượt đỉnh range là một CÂU HỎI, không phải câu trả lời. Đừng đặt tên nó trước khi giá trả lời.</text>
<rect x="28.0" y="113.0" width="306.7" height="370.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="40.0" y="134.0" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">1 · Sweep → quay vào → về IRL</text>
<rect x="60.2" y="201.6" width="256.4" height="115.0" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="60.2" y="201.6" width="256.4" height="115.0" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="60.2" y1="259.1" x2="316.7" y2="259.1" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="174.2" y="266.0" width="142.5" height="13.8" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.9"/>
<path d="M46.0,312.0 L74.5,206.2 L103.0,261.4 L131.5,233.8 L160.0,289.0 L188.5,247.6 L216.9,206.2 L231.2,187.8 L245.4,215.4 L259.7,247.6 L273.9,238.4 L302.4,270.6 L316.7,279.8" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="74.5" y1="201.6" x2="316.7" y2="201.6" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="60.2" y="196.6" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">ERL trên</text>
<text x="40.0" y="407.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Đóng cửa lại dưới đỉnh, displacement xuống, phá</text>
<text x="40.0" y="423.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">đáy nội bộ gần nhất. Đích kế: IRL bên trong (FVG,</text>
<text x="40.0" y="439.6" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">EQ).</text>
<rect x="346.7" y="113.0" width="306.7" height="370.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="358.7" y="134.0" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start">2 · Được chấp nhận bên ngoài</text>
<rect x="378.9" y="201.6" width="256.4" height="115.0" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="378.9" y="201.6" width="256.4" height="115.0" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="378.9" y1="259.1" x2="635.3" y2="259.1" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M364.7,312.0 L393.2,206.2 L421.6,261.4 L450.1,233.8 L478.6,289.0 L507.1,247.6 L535.6,206.2 L549.9,187.8 L564.1,174.0 L578.4,187.8 L592.6,197.0 L606.8,169.4 L635.3,155.6" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="393.2" y1="201.6" x2="635.3" y2="201.6" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="378.9" y="196.6" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">ERL trên</text>
<text x="358.7" y="407.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Nhiều nến đóng cửa trên đỉnh, đỉnh cũ giữ giá khi</text>
<text x="358.7" y="423.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">test lại từ trên. Vẽ range mới: ERL cũ thành IRL.</text>
<rect x="665.3" y="113.0" width="306.7" height="370.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="677.3" y="134.0" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">3 · Quay vào nhưng không có lực</text>
<rect x="697.6" y="201.6" width="256.4" height="115.0" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.2"/>
<rect x="697.6" y="201.6" width="256.4" height="115.0" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="697.6" y1="259.1" x2="954.0" y2="259.1" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M683.3,312.0 L711.8,206.2 L740.3,261.4 L768.8,233.8 L797.3,289.0 L825.8,247.6 L854.3,206.2 L868.5,187.8 L882.8,210.8 L897.0,197.0 L911.3,215.4 L925.5,199.3 L939.8,213.1 L954.0,203.9" fill="none" stroke="#334155" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="711.8" y1="201.6" x2="954.0" y2="201.6" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="697.6" y="196.6" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">ERL trên</text>
<text x="677.3" y="407.0" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">Lắc qua lắc lại quanh đỉnh, không có</text>
<text x="677.3" y="423.3" font-size="11.8" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="282.7">displacement. Chưa có câu trả lời ⇒ đứng ngoài.</text>
<rect x="28.0" y="497.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="521.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Ở thời điểm giá vừa vượt đỉnh, cả ba hình trông giống hệt nhau. Thứ phân biệt chúng là những gì xảy ra SAU: nến đóng cửa ở đâu, có displacement không, cấu</text>
<text x="42.0" y="537.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">trúc nội bộ có bị phá không.</text>
</svg>
