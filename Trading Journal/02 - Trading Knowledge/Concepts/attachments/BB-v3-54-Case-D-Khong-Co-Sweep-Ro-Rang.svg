<text x="192.6" y="304.6" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">đỉnh giữa</text>
<circle cx="294.2" cy="479.7" r="20.0" fill="none" stroke="#B45309" stroke-width="2"/>
<text x="336.7" y="494.7" font-size="10.5" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">chỉ vượt qua</text>
<text x="336.7" y="507.9" font-size="10.5" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">một chút xíu</text>
<text x="305.4" y="344.8" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">OB gốc</text>
<text x="463.4" y="344.8" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">BREAKER?</text>
<rect x="642.0" y="92.5" width="330.0" height="519.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Bối cảnh và diễn biến</text>
<text x="656.0" y="142.5" font-size="11.8" font-weight="700" fill="#2563EB">Đáy cũ</text>
<text x="656.0" y="158.5" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Không phải đáy ngày hay đáy phiên. Chỉ là một nhịp</text>
<text x="656.0" y="174.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">nghỉ nhỏ trong vùng đi ngang.</text>
<text x="656.0" y="198.1" font-size="11.8" font-weight="700" fill="#2563EB">Vi phạm</text>
<text x="656.0" y="214.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Giá thò xuống dưới đáy cũ một đoạn rất ngắn. Trên dữ</text>
<text x="656.0" y="230.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">liệu của sàn khác có thể còn không thấy.</text>
<text x="656.0" y="253.8" font-size="11.8" font-weight="700" fill="#2563EB">Phá cấu trúc</text>
<text x="656.0" y="269.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Rõ ràng: nến đóng cửa trên đỉnh giữa, có</text>
<text x="656.0" y="286.1" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">displacement.</text>
<text x="656.0" y="309.4" font-size="11.8" font-weight="700" fill="#2563EB">Phân loại</text>
<text x="656.0" y="325.4" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Theo chữ: Breaker. Theo cách đọc chặt: mơ hồ giữa</text>
<text x="656.0" y="341.8" font-size="11.5" font-weight="400" fill="#111827" data-bx="655.0,959.0">Breaker và Mitigation Block.</text>
<rect x="656.0" y="493.0" width="302.0" height="101.9" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="493.0" width="4.0" height="101.9" rx="2" fill="#B45309"/>
<text x="670.0" y="512.9" font-size="11.6" font-weight="700" fill="#B45309" data-bx="656.0,958.0">Điều thật sự kết luận được</text>
<text x="670.0" y="532.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Định nghĩa của ICT chỉ đòi “old low violated”,</text>
<text x="670.0" y="548.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">không nói phải vi phạm bao nhiêu. Khi không</text>
<text x="670.0" y="565.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">quyết được, ghi “mơ hồ (Breaker | Mitigation)” và</text>
<text x="670.0" y="581.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">lý do. Đừng ép về phía mình thích.</text>
