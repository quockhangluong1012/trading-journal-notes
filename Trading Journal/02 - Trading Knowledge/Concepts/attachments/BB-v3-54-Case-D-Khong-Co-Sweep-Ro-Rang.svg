<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đáy cũ có bị vi phạm, nhưng chỉ bằng một cái râu rất ngắn, và “đáy cũ” chỉ là một gợn nhỏ. Đúng chữ của định nghĩa — còn đúng ý thì chưa chắc.</text>
