<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B45309"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">"Quá nhiều OB": năm OB, chỉ một OB structural</text>
  <text x="24" y="52" font-size="12.5" fill="#6B7280">Cấp của OB = cấp của cấu trúc mà displacement từ nó phá vỡ. Xếp hạng swing trước, OB sau.</text>

  <rect x="24" y="66" width="450" height="380" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- HTF zone L4 -->
  <rect x="30" y="370" width="438" height="48" fill="#EDE9FE" opacity="0.85"/>
  <text x="200" y="410" font-size="10.5" font-weight="700" fill="#6D28D9">D1 OB zone (L4) — context, không phải trigger</text>

  <!-- dealing range B→H : premium / discount strip -->
  <rect x="452" y="140" width="14" height="99" fill="#FEE2E2"/>
  <rect x="452" y="239" width="14" height="99" fill="#DCFCE7"/>
  <text x="462" y="190" font-size="9.5" fill="#B91C1C" text-anchor="middle" transform="rotate(-90 462 190)">Premium</text>
  <text x="462" y="289" font-size="9.5" fill="#166534" text-anchor="middle" transform="rotate(-90 462 289)">Discount</text>
  <line x1="150" y1="338" x2="466" y2="338" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="404" y="333" font-size="9" fill="#6B7280">đáy range</text>

  <!-- EQ line -->
  <line x1="150" y1="239" x2="466" y2="239" stroke="#6B7280" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="404" y="234" font-size="9.5" fill="#4B5563">EQ 50%</text>

  <!-- old external high -->
  <line x1="36" y1="250" x2="215" y2="250" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="40" y="244" font-size="9.5" fill="#374151">External high cũ</text>
  <text x="200" y="226" font-size="9.5" font-weight="700" fill="#166534">BOS</text>

  <!-- OB boxes -->
  <rect x="58" y="376" width="24" height="16" fill="#A78BFA" opacity="0.9"/>
  <rect x="138" y="324" width="24" height="14" fill="#1D4ED8" opacity="0.9"/>
  <rect x="221" y="261" width="22" height="11" fill="#60A5FA" opacity="0.9"/>
  <rect x="305" y="215" width="22" height="11" fill="#93C5FD" opacity="0.9"/>
  <rect x="357" y="184" width="18" height="7" fill="#BFDBFE" stroke="#60A5FA" stroke-width="0.8"/>

  <!-- price path -->
  <polyline points="40,300 70,392 125,310 150,338 205,236 232,272 290,196 316,226 352,178 366,190 400,140" fill="none" stroke="#111827" stroke-width="2"/>
  <polyline points="400,140 430,185" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrO)"/>
  <text x="336" y="132" font-size="9.5" fill="#111827">H (đỉnh range hiện tại)</text>
  <text x="300" y="104" font-size="10" font-weight="700" fill="#B45309">Giá đang hồi — OB nào đáng chờ?</text>

  <!-- OB labels -->
  <g font-size="10" font-weight="700">
    <text x="86" y="390" fill="#6D28D9">OB-A · trong zone L4</text>
    <text x="168" y="356" fill="#1D4ED8">OB-B · L3</text>
    <text x="246" y="286" fill="#2563EB">OB-C · L2</text>
    <text x="332" y="254" fill="#3B82F6">OB-D · L2</text>
    <text x="372" y="210" fill="#60A5FA">OB-E · L1</text>
  </g>
  <text x="168" y="367" font-size="9" fill="#1D4ED8">gốc leg BOS = protected low</text>

  <!-- supersession note -->
  <rect x="30" y="424" width="438" height="18" fill="#F3F4F6"/>
  <text x="36" y="437" font-size="9.5" fill="#374151">R-H3: nếu giá phá H → BOS mới → OB tại đáy hồi mới thành L3; OB-B hạ thành "reference sâu".</text>

  <!-- right legend -->
  <rect x="488" y="66" width="248" height="380" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="500" y="90" font-size="12" font-weight="800" fill="#1F2937">Phân loại &amp; hành động</text>

  <g font-size="10.5">
    <rect x="498" y="102" width="228" height="58" rx="6" fill="#DBEAFE"/>
    <text x="506" y="120" font-weight="800" fill="#1D4ED8">OB-B · L3 structural</text>
    <text x="506" y="136" fill="#374151">Gốc leg phá external high · discount</text>
    <text x="506" y="152" fill="#374151">→ POI chính; invalidation = cấu trúc</text>

    <rect x="498" y="168" width="228" height="58" rx="6" fill="#EFF6FF"/>
    <text x="506" y="186" font-weight="800" fill="#2563EB">OB-C · L2 internal</text>
    <text x="506" y="202" fill="#374151">Discount (sát EQ), retest vùng vừa BOS</text>
    <text x="506" y="218" fill="#374151">→ Plan A chỉ khi thỏa R-H4</text>

    <rect x="498" y="234" width="228" height="58" rx="6" fill="#FEF2F2"/>
    <text x="506" y="252" font-weight="800" fill="#B91C1C">OB-D · L2 internal</text>
    <text x="506" y="268" fill="#374151">Premium</text>
    <text x="506" y="284" fill="#374151">→ inducement / mục tiêu hồi (IRL)</text>

    <rect x="498" y="300" width="228" height="58" rx="6" fill="#FEF2F2"/>
    <text x="506" y="318" font-weight="800" fill="#B91C1C">OB-E · L1 micro</text>
    <text x="506" y="334" fill="#374151">Premium, không phá cấu trúc đáng kể</text>
    <text x="506" y="350" fill="#374151">→ chỉ dùng refine M5 (hoặc bỏ)</text>

    <rect x="498" y="366" width="228" height="58" rx="6" fill="#F5F3FF"/>
    <text x="506" y="384" font-weight="800" fill="#6D28D9">OB-A · gốc cả move, trong zone L4</text>
    <text x="506" y="400" fill="#374151">Leg từ A không phá gì → nằm ngoài range</text>
    <text x="506" y="416" fill="#374151">→ reference sâu; chỉ liên quan nếu B fail</text>
  </g>
  <text x="500" y="440" font-size="9" fill="#6B7280">Phân loại là giả thuyết nghiên cứu (OB-HIER v0.1).</text>
</svg>
