<svg viewBox="0 0 1000 630" width="1000" height="630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>BOS hay Sweep? Bốn kịch bản bắt đầu giống hệt nhau</title>
<desc>BOS hay Sweep? Bốn kịch bản bắt đầu giống hệt nhau. Cả bốn đều bắt đầu bằng việc giá vượt lên trên đỉnh cũ. Khác biệt chỉ lộ ra SAU đó: giá đóng ở đâu, ở lại được không, và có gây hậu quả cấu trúc không.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1000" height="630" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">BOS hay Sweep? Bốn kịch bản bắt đầu giống hệt nhau</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Cả bốn đều bắt đầu bằng việc giá vượt lên trên đỉnh cũ. Khác biệt chỉ lộ ra SAU đó: giá đóng ở đâu, ở lại được không, và có gây hậu quả cấu trúc không.</tspan></text>
<rect x="24.0" y="104.0" width="466.0" height="196.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="30.9" y="110.0" width="22.3" height="20.0" rx="10.0" fill="#DC2626"/>
<text x="42.0" y="124.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">A</tspan></text>
<text x="58.0" y="124.0" font-size="12.5" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Quét đỉnh (sweep)</tspan></text>
<line x1="121.4" y1="181.5" x2="463.1" y2="181.5" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="463.1" y="195.5" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="40.0,263.5 121.4,181.5 191.9,218.4 267.9,173.3 289.5,197.9 343.8,226.6 452.3,251.2" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="267.9" cy="173.3" r="4.5" fill="#DC2626"/>
<text x="278.7" y="169.2" font-size="11" fill="#DC2626" text-anchor="start"><tspan>xuyên rồi quay vào</tspan></text>
<text x="26.0" y="318.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá vượt đỉnh rồi quay lại và đóng dưới đỉnh. Lệnh phía trên đã khớp, nhưng giá</tspan></text>
<text x="26.0" y="333.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>không được chấp nhận ở đó.</tspan></text>
<rect x="510.0" y="104.0" width="466.0" height="196.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="516.9" y="110.0" width="22.3" height="20.0" rx="10.0" fill="#1D9E75"/>
<text x="528.0" y="124.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">B</tspan></text>
<text x="544.0" y="124.0" font-size="12.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">BOS phía trên đỉnh</tspan></text>
<line x1="607.4" y1="181.5" x2="949.1" y2="181.5" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="949.1" y="195.5" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="526.0,263.5 607.4,181.5 677.9,218.4 753.9,167.1 786.4,177.4 851.5,144.6 938.3,128.2" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="791.8" y="189.7" font-size="11" fill="#1D9E75" text-anchor="start"><tspan>lùi nhẹ, không vào lại</tspan></text>
<text x="512.0" y="318.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá vượt, đóng trên, lùi nhẹ mà không đóng ngược vào trong, rồi đi tiếp. Cấu trúc</tspan></text>
<text x="512.0" y="333.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>tăng được gia hạn.</tspan></text>
<rect x="24.0" y="372.0" width="466.0" height="196.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="30.9" y="378.0" width="22.3" height="20.0" rx="10.0" fill="#B45309"/>
<text x="42.0" y="392.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">C</tspan></text>
<text x="58.0" y="392.0" font-size="12.5" fill="#B45309" text-anchor="start"><tspan font-weight="700">Phá thất bại (failed breakout)</tspan></text>
<line x1="121.4" y1="449.5" x2="463.1" y2="449.5" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="463.1" y="463.5" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="40.0,531.5 121.4,449.5 191.9,486.4 267.9,437.2 311.2,431.1 343.8,443.4 387.2,461.8 452.3,474.1" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="289.5" y="420.8" font-size="11" fill="#B45309" text-anchor="start"><tspan>lên được một chút rồi hụt hơi</tspan></text>
<text x="26.0" y="586.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Giá phá và đóng trên được một lúc, không đi xa, rồi trượt về dưới. Cú phá mất ý</tspan></text>
<text x="26.0" y="601.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>nghĩa; cấu trúc quay lại trạng thái cũ hoặc thành đi ngang.</tspan></text>
<rect x="510.0" y="372.0" width="466.0" height="196.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<rect x="516.9" y="378.0" width="22.3" height="20.0" rx="10.0" fill="#7C3AED"/>
<text x="528.0" y="392.0" font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">D</tspan></text>
<text x="544.0" y="392.0" font-size="12.5" fill="#7C3AED" text-anchor="start"><tspan font-weight="700">Quét rồi đảo chiều</tspan></text>
<line x1="607.4" y1="449.5" x2="949.1" y2="449.5" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="949.1" y="463.5" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ</tspan></text>
<polyline points="526.0,511.0 607.4,449.5 650.8,474.1 699.6,439.2 721.3,457.7 759.3,490.5 791.8,476.1 938.3,531.5" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="650.8" y1="474.1" x2="808.1" y2="474.1" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
<text x="650.8" y="488.1" font-size="11" fill="#1D9E75" text-anchor="start"><tspan>đáy nhỏ</tspan></text>
<circle cx="745.7" cy="474.1" r="5" fill="#DC2626"/>
<text x="756.6" y="468.1" font-size="12" fill="#DC2626" text-anchor="start"><tspan font-weight="700">MSS ↓</tspan></text>
<text x="512.0" y="586.0" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>Lấy thanh khoản trên đỉnh rồi dịch chuyển xuống, phá đáy nhỏ theo chiều ngược</tspan></text>
<text x="512.0" y="601.9" font-size="11.5" fill="#1F2937" text-anchor="start"><tspan>lại. Sự kiện thanh khoản dẫn tới một sự kiện cấu trúc (MSS), không phải BOS tăng.</tspan></text>
</svg>
