<svg viewBox="0 0 980 560" width="980" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="560" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mỗi giao dịch luôn có HAI phía — vì sao "nhiều người mua hơn người bán" là cách nói sai</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Lượng mua và lượng bán trong một giao dịch LUÔN bằng nhau. Cái khác nhau là: ai sốt ruột (chấp nhận giá của người kia), ai kiên nhẫn (chờ).</text>
<rect x="26.0" y="76.0" width="300.0" height="250.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="100.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">Một giao dịch</text>
<circle cx="90.0" cy="174.0" r="9" fill="#15803D" stroke="none" stroke-width="1.2"/>
<path d="M77.0,202.0 q13,-26 26,0 z" stroke="#FFFFFF" stroke-width="0" fill="#15803D"/>
<text x="90.0" y="218.0" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">Người mua</text>
<circle cx="262.0" cy="174.0" r="9" fill="#B91C1C" stroke="none" stroke-width="1.2"/>
<path d="M249.0,202.0 q13,-26 26,0 z" stroke="#FFFFFF" stroke-width="0" fill="#B91C1C"/>
<text x="262.0" y="218.0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Người bán</text>
<circle cx="140.0" cy="168.0" r="7" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<path d="M140.0,161.0 q3,-6 8,-6" stroke="#15803D" stroke-width="2" fill="none"/>
<circle cx="158.0" cy="168.0" r="7" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<path d="M158.0,161.0 q3,-6 8,-6" stroke="#15803D" stroke-width="2" fill="none"/>
<circle cx="176.0" cy="168.0" r="7" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<path d="M176.0,161.0 q3,-6 8,-6" stroke="#15803D" stroke-width="2" fill="none"/>
<circle cx="194.0" cy="168.0" r="7" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<path d="M194.0,161.0 q3,-6 8,-6" stroke="#15803D" stroke-width="2" fill="none"/>
<circle cx="212.0" cy="168.0" r="7" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<path d="M212.0,161.0 q3,-6 8,-6" stroke="#15803D" stroke-width="2" fill="none"/>
<line x1="150.0" y1="192.0" x2="214.0" y2="192.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<line x1="214.0" y1="206.0" x2="150.0" y2="206.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="176.0" y="232.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">5 táo ↔ tiền</text>
<rect x="44.0" y="262.0" width="264.0" height="48.0" rx="6" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1"/>
<text x="176.0" y="282.0" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle">Lượng MUA = 5 = Lượng BÁN</text>
<text x="176.0" y="300.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">(luôn luôn, trong mọi giao dịch)</text>
<rect x="342.0" y="76.0" width="300.0" height="250.0" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/>
<text x="356.0" y="100.0" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">✗ Ngộ nhận phổ biến</text>
<text x="356.0" y="128.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">"Giá tăng vì có nhiều người mua</text>
<text x="356.0" y="145.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">hơn người bán."</text>
<text x="356.0" y="162.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="356.0" y="180.2" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Vấn đề:</text>
<text x="356.0" y="197.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Mỗi lô được mua thì có đúng một</text>
<text x="356.0" y="215.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">  lô được bán. Tổng mua = tổng bán.</text>
<text x="356.0" y="232.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• SỐ NGƯỜI có thể khác: 1 quỹ mua</text>
<text x="356.0" y="249.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">  1.000 lô từ 200 người bán nhỏ.</text>
<text x="356.0" y="267.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">  Nhưng 1.000 = 1.000.</text>
<text x="356.0" y="284.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Nên "nhiều hơn" không giải thích</text>
<text x="356.0" y="302.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">  được gì về cơ chế.</text>
<rect x="658.0" y="76.0" width="296.0" height="250.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.3"/>
<text x="672.0" y="100.0" font-size="14" font-weight="700" fill="#15803D" text-anchor="start">✓ Điều thật sự khác nhau</text>
<text x="672.0" y="128.0" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Ai SỐT RUỘT? (chủ động)</text>
<text x="672.0" y="145.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người chấp nhận ngay giá của phía kia</text>
<text x="672.0" y="162.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">= "aggressor" (lệnh market).</text>
<text x="672.0" y="180.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="672.0" y="197.6" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Ai KIÊN NHẪN? (bị động)</text>
<text x="672.0" y="215.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người đặt sẵn giá và chờ</text>
<text x="672.0" y="232.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">= lệnh limit, nằm trong sổ lệnh.</text>
<text x="672.0" y="249.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start"></text>
<text x="672.0" y="267.2" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">Giá tăng khi:</text>
<text x="672.0" y="284.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">người mua sốt ruột liên tục chấp nhận</text>
<text x="672.0" y="302.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">giá chào bán, VÀ người bán rút/nâng giá.</text>
<rect x="26.0" y="344.0" width="928.0" height="172.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.3"/>
<text x="40.0" y="368.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Ví dụ số: cùng 1.000 lô được giao dịch — nhưng giá đi hai hướng khác nhau</text>
<rect x="40.0" y="382.0" width="440.0" height="120.0" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1"/>
<text x="54.0" y="404.0" font-size="12" font-weight="700" fill="#15803D" text-anchor="start">Kịch bản A — giá tăng 100 → 103</text>
<text x="54.0" y="421.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người MUA dùng lệnh market: chấp nhận ask 101, 102, 103.</text>
<text x="54.0" y="438.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người BÁN chỉ đặt limit chờ, không ai bán chủ động.</text>
<text x="54.0" y="456.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mua 1.000 = Bán 1.000 ✓ — nhưng giao dịch dịch lên trên.</text>
<text x="54.0" y="473.6" font-size="12" font-weight="600" fill="#15803D" text-anchor="start">→ Phía chủ động là người mua.</text>
<rect x="500.0" y="382.0" width="440.0" height="120.0" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
<text x="514.0" y="404.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start">Kịch bản B — giá giảm 100 → 97</text>
<text x="514.0" y="421.4" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người BÁN dùng lệnh market: chấp nhận bid 99, 98, 97.</text>
<text x="514.0" y="438.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Người MUA chỉ đặt limit chờ, không ai mua chủ động.</text>
<text x="514.0" y="456.2" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Mua 1.000 = Bán 1.000 ✓ — nhưng giao dịch dịch xuống.</text>
<text x="514.0" y="473.6" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="start">→ Phía chủ động là người bán.</text>
<text x="26.0" y="544.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Volume không có "phe". Volume chỉ là số lô đã khớp. Hướng giá đến từ phía nào vượt spread và phía nào rút/đặt lệnh chờ — không phải từ "số người".</text>
</svg>
