<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="538" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vì sao một ngày TĂNG lại có thể bắt đầu bằng một cú GIẢM?</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Một cách giải thích dựa trên khớp lệnh. Đây là [DIỄN GIẢI] hợp lý cho hình dạng của bullish AMD — không phải bằng chứng rằng có</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">“người mua lớn” đứng sau mọi cú quét đáy.</text>
<rect x="838.1" y="22.0" width="133.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="905.1" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">ELI5 · DIỄN GIẢI</text>
<rect x="28.0" y="96.0" width="306.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">① Người mua lớn cần người bán</text>
<rect x="44.0" y="142.0" width="274.0" height="180.0" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<rect x="68.0" y="236.0" width="34.0" height="24.0" rx="3" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.2"/>
<rect x="116.0" y="236.0" width="34.0" height="24.0" rx="3" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.2"/>
<rect x="164.0" y="236.0" width="34.0" height="24.0" rx="3" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.2"/>
<rect x="212.0" y="236.0" width="34.0" height="24.0" rx="3" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.2"/>
<rect x="260.0" y="236.0" width="34.0" height="24.0" rx="3" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.2"/>
<text x="181.0" y="282.0" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">nhiều thùng táo cần mua</text>
<circle cx="181.0" cy="188.0" r="16" fill="#2563EB"/>
<text x="181.0" y="193.0" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">MUA</text>
<text x="181.0" y="222.0" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">người mua lớn (giả định)</text>
<text x="44.0" y="352.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Muốn mua cả một xe táo mà không làm giá táo</text>
<text x="44.0" y="368.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">tăng vọt, bạn cần thật nhiều người muốn BÁN</text>
<text x="44.0" y="385.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">cùng một lúc. Mua từng chút ở giữa chợ thì</text>
<text x="44.0" y="401.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">mỗi lần mua lại đẩy giá lên.</text>
<rect x="346.0" y="96.0" width="306.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="360.0" y="120.0" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">② Lệnh BÁN đang ngủ dưới đáy</text>
<rect x="362.0" y="142.0" width="274.0" height="180.0" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<rect x="362.0" y="190.6" width="274.0" height="37.8" rx="2" fill="#EAF2FF"/>
<line x1="362.0" y1="228.4" x2="636.0" y2="228.4" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="364.0" y="241.4" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="start">đáy</text>
<circle cx="457.1" cy="244.6" r="3.2" fill="#1D4ED8"/>
<circle cx="483.0" cy="244.6" r="3.2" fill="#1D4ED8"/>
<circle cx="508.8" cy="244.6" r="3.2" fill="#1D4ED8"/>
<circle cx="534.6" cy="244.6" r="3.2" fill="#1D4ED8"/>
<circle cx="560.5" cy="244.6" r="3.2" fill="#1D4ED8"/>
<circle cx="586.3" cy="244.6" r="3.2" fill="#1D4ED8"/>
<circle cx="612.1" cy="244.6" r="3.2" fill="#1D4ED8"/>
<path d="M362.0,214.0 L389.4,192.4 L416.8,224.8 L444.2,196.0 L471.6,226.6 L499.0,197.8 L526.4,223.0 L553.8,205.0" fill="none" stroke="#334155" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="362.0" y="352.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Dưới đáy vùng đi ngang có chốt lỗ của người</text>
<text x="362.0" y="368.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đang mua, và lệnh “bán khi thủng đáy” của</text>
<text x="362.0" y="385.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">người khác. Tất cả đều là lệnh BÁN — nằm chờ</text>
<text x="362.0" y="401.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ở cùng một chỗ.</text>
<rect x="664.0" y="96.0" width="306.0" height="340.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="678.0" y="120.0" font-size="13.5" font-weight="700" fill="#EA580C" text-anchor="start">③ Giá chạm đáy: lệnh bán thức dậy</text>
<rect x="680.0" y="142.0" width="274.0" height="180.0" rx="4" fill="#FFFFFF" stroke="#EEF0F4" stroke-width="1.2"/>
<rect x="680.0" y="190.6" width="274.0" height="37.8" rx="2" fill="#EAF2FF"/>
<line x1="680.0" y1="228.4" x2="954.0" y2="228.4" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="682.0" y="241.4" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="start">đáy</text>
<circle cx="751.7" cy="244.6" r="3.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<circle cx="772.7" cy="244.6" r="3.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<circle cx="793.8" cy="244.6" r="3.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<circle cx="814.9" cy="244.6" r="3.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<circle cx="836.0" cy="244.6" r="3.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<circle cx="857.0" cy="244.6" r="3.2" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="861.7" y="279.2" font-size="10" font-weight="600" fill="#2563EB" text-anchor="end">khớp với</text>
<text x="861.7" y="292.2" font-size="10" font-weight="600" fill="#2563EB" text-anchor="end">lệnh mua chờ</text>
<path d="M680.0,214.0 L701.1,192.4 L722.2,224.8 L743.2,196.0 L764.3,226.6 L785.4,197.8 L806.5,223.0 L827.5,205.0 L848.6,246.4 L869.7,275.2 L890.8,260.8 L911.8,224.8 L932.9,185.2 L954.0,163.6" fill="none" stroke="#334155" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="680.0" y="352.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Khi giá chạm đáy, hàng loạt lệnh bán thức dậy</text>
<text x="680.0" y="368.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">cùng lúc. Nếu có người mua lớn đứng chờ, họ</text>
<text x="680.0" y="385.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">khớp được nhiều mà giá không chạy ngược lên</text>
<text x="680.0" y="401.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">ngay. Khi lệnh bán cạn, giá có thể bật lên.</text>
<rect x="28.0" y="450.0" width="944.0" height="65.1" rx="8" fill="#FFF7E6" stroke="#B45309" stroke-width="1"/>
<text x="38.0" y="472.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">[CƠ CHẾ] Mỗi lệnh mua cần một lệnh bán khớp với nó — điều này luôn đúng. [DIỄN GIẢI] “Người lớn cố tình đẩy giá xuống để lấy lệnh bán” là câu chuyện; chart</text>
<text x="38.0" y="488.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">không cho biết ai mua ở đáy. [PHẢN VÍ DỤ] Rất nhiều cú thủng đáy chỉ là người bán thật đang thắng: lệnh bán thức dậy, không ai đỡ, giá giảm tiếp (xem hình</text>
<text x="38.0" y="505.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">“Manipulation thất bại”).</text>
</svg>
