<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mk15803D" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs>
<rect x="1" y="1" width="998" height="598" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Năm loại thông tin — cùng một sự kiện, năm mức độ chắc chắn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Sự kiện: giá vượt 100, lên 103, rồi quay về dưới 100. Mỗi câu dưới đây đều nói về sự kiện này, nhưng chúng KHÔNG cùng loại sự thật.</text>
<rect x="863.9" y="22.0" width="108.1" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="918.0" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">QUY ƯỚC NHÃN</text>
<rect x="104.0" y="98.0" width="868.0" height="74.0" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.1"/>
<rect x="118.0" y="114.0" width="74.9" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
<text x="155.4" y="129.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">QUAN SÁT</text>
<text x="118.0" y="154.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">Thấy trực tiếp trên chart.</text>
<text x="380.0" y="128.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">“Giá chạm 103 rồi đóng nến dưới 100.” — ai nhìn chart cũng thấy giống nhau.</text>
<rect x="104.0" y="182.0" width="868.0" height="74.0" rx="10" fill="#E6F7F4" stroke="#0F766E" stroke-width="1.1"/>
<rect x="118.0" y="198.0" width="59.0" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="147.5" y="213.0" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">CƠ CHẾ</text>
<text x="118.0" y="238.0" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="start">Giải thích bằng cách lệnh được khớp.</text>
<text x="380.0" y="212.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">“Lệnh stop phía trên 100 khi bị chạm sẽ biến thành lệnh mua thị trường.” — đúng về nguyên</text>
<text x="380.0" y="229.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">lý, nhưng KHÔNG biết số lượng.</text>
<rect x="104.0" y="266.0" width="868.0" height="74.0" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-width="1.1"/>
<rect x="118.0" y="282.0" width="39.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#4338CA" stroke-width="1"/>
<text x="137.9" y="297.0" font-size="11" font-weight="700" fill="#4338CA" text-anchor="middle">ICT</text>
<text x="118.0" y="322.0" font-size="11.5" font-weight="600" fill="#4338CA" text-anchor="start">Tên gọi và khung của ICT.</text>
<text x="380.0" y="296.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">“Đây là Manipulation / Judas Swing trong Power of 3.” — một cách đặt tên, không phải quy</text>
<text x="380.0" y="313.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">luật tự nhiên.</text>
<rect x="104.0" y="350.0" width="868.0" height="74.0" rx="10" fill="#FFF7E6" stroke="#B45309" stroke-width="1.1"/>
<rect x="118.0" y="366.0" width="82.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
<text x="159.4" y="381.0" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">DIỄN GIẢI</text>
<text x="118.0" y="406.0" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="start">Hợp lý, nhưng chart không chứng minh được.</text>
<text x="380.0" y="380.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">“Smart Money cố tình đẩy giá lên để bẫy người mua.” — không thể biết danh tính hay ý định</text>
<text x="380.0" y="397.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">từ giá.</text>
<rect x="104.0" y="434.0" width="868.0" height="74.0" rx="10" fill="#FFF0F3" stroke="#BE123C" stroke-width="1.1"/>
<rect x="118.0" y="450.0" width="146.2" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#BE123C" stroke-width="1"/>
<text x="191.1" y="465.0" font-size="11" font-weight="700" fill="#BE123C" text-anchor="middle">BACKTEST REQUIRED</text>
<text x="118.0" y="490.0" font-size="11.5" font-weight="600" fill="#BE123C" text-anchor="start">Cần dữ liệu của chính bạn mới được tin.</text>
<text x="380.0" y="464.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">“Sau kiểu quay về này, giá thường rơi tiếp.” — phải ghi chép nhiều lần, ghi TRƯỚC khi biết kết</text>
<text x="380.0" y="481.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">quả.</text>
<line x1="62.0" y1="490.0" x2="62.0" y2="120.0" stroke="#15803D" stroke-width="2.5" marker-end="url(#mk15803D)"/>
<text x="62.0" y="108.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">chắc hơn</text>
<text x="62.0" y="506.0" font-size="11" font-weight="700" fill="#BE123C" text-anchor="middle">cần kiểm</text>
<text x="62.0" y="519.0" font-size="11" font-weight="700" fill="#BE123C" text-anchor="middle">chứng</text>
<rect x="28.0" y="528.0" width="944.0" height="49.8" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/>
<text x="38.0" y="550.5" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Luật của note này: mỗi khi viết một câu quan trọng, hỏi “câu này thuộc loại nào?”. Lỗi phổ biến nhất của người học ICT là đọc câu DIỄN GIẢI như thể</text>
<text x="38.0" y="567.8" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">nó là QUAN SÁT.</text>
</svg>
