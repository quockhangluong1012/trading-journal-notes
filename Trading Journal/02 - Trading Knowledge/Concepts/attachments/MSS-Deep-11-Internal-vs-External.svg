<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Internal vs External — MSS ở lớp trong KHÔNG phá cấu trúc lớp ngoài</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Một leg tăng H1 (external) chứa cả một cấu trúc giảm nội bộ (pullback). Hai MSS internal xảy ra; protected low external vẫn nguyên.</text>
<rect x="26.0" y="84.0" width="640.0" height="420.0" rx="9" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="190.0" y="195.2" width="312.0" height="174.8" rx="8" fill="#FFFBEB" fill-opacity="0.55" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="196.0" y="189.2" font-size="10" font-weight="700" fill="#B45309" text-anchor="start">vùng pullback = cấu trúc GIẢM nội bộ (LH/LL)</text>
<path d="M46.0,453.6 L136.0,263.6 L154.0,278.8 L178.0,218.0 L208.0,263.6 L232.0,240.8 L262.0,294.0 L286.0,267.4 L316.0,324.4 L340.0,294.0 L370.0,347.2 L394.0,316.8 L418.0,332.0 L454.0,263.6 L478.0,286.4 L550.0,180.0 L574.0,202.8 L634.0,126.8" stroke="#111827" stroke-width="2.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="50.0" cy="453.6" r="6" fill="#7C3AED" stroke="#ffffff" stroke-width="1.5"/>
<text x="60.0" y="445.6" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="start">P-L external (H1) — không bị chạm</text>
<line x1="46.0" y1="453.6" x2="646.0" y2="453.6" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="178.0" cy="218.0" r="6" fill="#16A34A" stroke="#ffffff" stroke-width="1.5"/>
<text x="178.0" y="206.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">HH external</text>
<line x1="178.0" y1="218.0" x2="646.0" y2="218.0" stroke="#16A34A" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="232.0" cy="240.8" r="4" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="232.0" y="230.8" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">LH</text>
<circle cx="262.0" cy="294.0" r="4" fill="#DC2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="262.0" y="312.0" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">LL</text>
<circle cx="286.0" cy="267.4" r="4" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="286.0" y="257.4" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">LH</text>
<circle cx="316.0" cy="324.4" r="4" fill="#DC2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="316.0" y="342.4" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">LL</text>
<circle cx="340.0" cy="294.0" r="4" fill="#D97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="340.0" y="284.0" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">LH</text>
<circle cx="370.0" cy="347.2" r="4" fill="#DC2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="370.0" y="365.2" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">LL</text>
<circle cx="154.0" cy="278.8" r="4" fill="#16A34A" stroke="#ffffff" stroke-width="1.5"/>
<text x="146.0" y="282.8" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="end">HL internal</text>
<line x1="154.0" y1="278.8" x2="286.0" y2="278.8" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="250.0" cy="278.8" r="4.5" fill="#DC2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="146.0" y="308.8" font-size="9.8" font-weight="700" fill="#B91C1C" text-anchor="end">① internal bearish MSS</text>
<text x="146.0" y="322.8" font-size="9.4" font-weight="400" fill="#374151" text-anchor="end">(close dưới HL internal)</text>
<line x1="148.0" y1="302.8" x2="246.0" y2="280.8" stroke="#DC2626" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="340.0" y1="294.0" x2="466.0" y2="294.0" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="424.0" y="316.4" font-size="9.8" font-weight="700" fill="#15803D" text-anchor="start">② internal bullish MSS</text>
<text x="424.0" y="330.4" font-size="9.4" font-weight="700" fill="#15803D" text-anchor="start">= TIẾP DIỄN của H1</text>
<rect x="680.0" y="84.0" width="274.0" height="420.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8"/>
<text x="692.0" y="106.0" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Đọc đúng lớp</text>
<text x="692.0" y="123.0" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">① Internal bearish MSS:</text>
<text x="692.0" y="137.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">đổi state NỘI BỘ → 'pullback</text>
<text x="692.0" y="152.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">đang diễn ra'. KHÔNG đổi H1 bias</text>
<text x="692.0" y="166.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start">vì P-L external chưa bị chạm.</text>
<text x="692.0" y="181.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="692.0" y="196.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">② Internal bullish MSS:</text>
<text x="692.0" y="210.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">reversal của pullback = continuation</text>
<text x="692.0" y="225.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">của leg H1. Đây là kịch bản 'MSS</text>
<text x="692.0" y="239.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start">thuận HTF' của ICT 2022.</text>
<text x="692.0" y="254.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="692.0" y="269.0" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="start">Khi nào external đổi?</text>
<text x="692.0" y="283.6" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Chỉ khi close dưới P-L external</text>
<text x="692.0" y="298.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">(MSS lớp swing H1). Internal MSS</text>
<text x="692.0" y="312.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start">có thể là BƯỚC ĐẦU của quá trình</text>
<text x="692.0" y="327.4" font-size="10" font-weight="400" fill="#374151" text-anchor="start">đó — nhưng tự nó không phải.</text>
<text x="692.0" y="342.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="692.0" y="356.6" font-size="10" font-weight="700" fill="#334155" text-anchor="start">Sai lầm phổ biến:</text>
<text x="692.0" y="371.2" font-size="10" font-weight="400" fill="#374151" text-anchor="start">gọi ① là 'MSS, đảo bias, short'</text>
<text x="692.0" y="385.8" font-size="10" font-weight="400" fill="#374151" text-anchor="start">trong khi leg H1 còn nguyên.</text>
<rect x="26.0" y="516.0" width="928.0" height="68.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="42.0" y="537.0" font-size="10.2" font-weight="600" fill="#334155" text-anchor="start">Internal/External là QUAN HỆ với một range/lớp cụ thể, không phải thuộc tính của mức giá (57 §16.1). Cùng một cú phá: internal với D1, external với M5.</text>
<text x="42.0" y="554.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">MSS-Sim-05: trên cùng đường giá, ~31 MSS M5 (internal) cho mỗi 1 MSS H1 (protected); 51% MSS M5 đi ngược cấu trúc H1. [SIMULATION]</text>
</svg>