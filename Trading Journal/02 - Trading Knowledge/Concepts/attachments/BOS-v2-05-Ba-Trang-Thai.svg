<svg viewBox="0 0 900 420" width="900" height="420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ba trạng thái cấu trúc: tăng, giảm, đi ngang</title>
<desc>Ba trạng thái cấu trúc: tăng, giảm, đi ngang. Cùng là những đường lên xuống, nhưng thứ tự của đỉnh và đáy cho ta biết &quot;ai đang gấp hơn&quot;. BOS chỉ có nghĩa khi đã biết mình đang ở trạng thái nào.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="420" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Ba trạng thái cấu trúc: tăng, giảm, đi ngang</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Cùng là những đường lên xuống, nhưng thứ tự của đỉnh và đáy cho ta biết &quot;ai đang gấp hơn&quot;. BOS chỉ có nghĩa khi đã biết mình đang ở trạng</tspan></text>
<text x="24.0" y="72.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>thái nào.</tspan></text>
<rect x="24.0" y="118.0" width="270.0" height="210.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="26.0" y="110.0" font-size="13" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Tăng: HH + HL</tspan></text>
<polyline points="40.0,285.3 95.3,231.9 123.0,255.0 178.4,196.3 206.0,219.4 261.4,155.4" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="95.3" cy="231.9" r="3.6" fill="#1D9E75"/>
<text x="95.3" y="222.9" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HH</tspan></text>
<circle cx="123.0" cy="255.0" r="3.6" fill="#1D9E75"/>
<text x="123.0" y="273.5" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<circle cx="178.4" cy="196.3" r="3.6" fill="#1D9E75"/>
<text x="178.4" y="187.3" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HH</tspan></text>
<circle cx="206.0" cy="219.4" r="3.6" fill="#1D9E75"/>
<text x="206.0" y="237.9" font-size="11.5" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">HL</tspan></text>
<text x="26.0" y="350.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Mỗi lần lùi lại dừng cao hơn lần trước; mỗi lần</tspan></text>
<text x="26.0" y="366.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>tăng đi xa hơn đỉnh trước.</tspan></text>
<rect x="315.0" y="118.0" width="270.0" height="210.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="317.0" y="110.0" font-size="13" fill="#DC2626" text-anchor="start"><tspan font-weight="700">Giảm: LH + LL</tspan></text>
<polyline points="331.0,160.7 386.3,214.1 414.0,191.0 469.4,249.7 497.0,226.6 552.4,290.6" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="386.3" cy="214.1" r="3.6" fill="#DC2626"/>
<text x="386.3" y="232.6" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LL</tspan></text>
<circle cx="414.0" cy="191.0" r="3.6" fill="#DC2626"/>
<text x="414.0" y="182.0" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH</tspan></text>
<circle cx="469.4" cy="249.7" r="3.6" fill="#DC2626"/>
<text x="469.4" y="268.2" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LL</tspan></text>
<circle cx="497.0" cy="226.6" r="3.6" fill="#DC2626"/>
<text x="497.0" y="217.6" font-size="11.5" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">LH</tspan></text>
<text x="317.0" y="350.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Mỗi lần hồi lên dừng thấp hơn lần trước; mỗi</tspan></text>
<text x="317.0" y="366.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>lần giảm xuống sâu hơn đáy trước.</tspan></text>
<rect x="606.0" y="118.0" width="270.0" height="210.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="608.0" y="110.0" font-size="13" fill="#6B7280" text-anchor="start"><tspan font-weight="700">Đi ngang: trần + sàn</tspan></text>
<line x1="622.0" y1="167.8" x2="860.0" y2="167.8" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="622.0" y="162.8" font-size="11" fill="#D85A30" text-anchor="start"><tspan>trần</tspan></text>
<line x1="622.0" y1="278.2" x2="860.0" y2="278.2" stroke="#D85A30" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="622.0" y="292.2" font-size="11" fill="#D85A30" text-anchor="start"><tspan>sàn</tspan></text>
<polyline points="622.0,223.0 655.2,171.4 688.4,271.1 721.6,174.9 754.8,267.5 788.0,169.6 821.3,274.6 854.5,214.1" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="608.0" y="350.0" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Giá chạm trần rồi rơi, chạm sàn rồi bật. Phá</tspan></text>
<text x="608.0" y="366.6" font-size="12" fill="#1F2937" text-anchor="start"><tspan>&quot;đỉnh nhỏ&quot; bên trong hộp chưa nói lên điều</tspan></text>
<text x="608.0" y="383.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>gì.</tspan></text>
</svg>
