<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study: EURUSD — Long tại CE của SIBI sau sweep SSL</text>
  <text x="40" y="62" font-size="15" fill="#94a3b8">Thứ Tư 08/04, London KZ — đúng sách, đạt 2.5R</text>

  <g stroke="#1c2333" stroke-width="1">
    <line x1="40" y1="120" x2="1160" y2="120"/>
    <line x1="40" y1="220" x2="1160" y2="220"/>
    <line x1="40" y1="320" x2="1160" y2="320"/>
    <line x1="40" y1="420" x2="1160" y2="420"/>
    <line x1="40" y1="520" x2="1160" y2="520"/>
  </g>

  <!-- SSL sweep -->
  <line x1="80" y1="420" x2="1120" y2="420" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="414" font-size="13" fill="#eab308">Equal Lows (SSL) 1.0820</text>

  <line x1="150" y1="400" x2="150" y2="460" stroke="#22c55e" stroke-width="2"/>
  <rect x="138" y="400" width="24" height="40" fill="#22c55e"/>
  <line x1="200" y1="440" x2="200" y2="520" stroke="#f97316" stroke-width="3"/>
  <rect x="188" y="440" width="24" height="70" fill="#f97316"/>
  <text x="160" y="545" font-size="12" fill="#f97316">08:05 sweep SSL → 1.0813</text>

  <!-- displacement up creating SIBI -->
  <line x1="270" y1="500" x2="270" y2="330" stroke="#22c55e" stroke-width="3.5"/>
  <rect x="255" y="345" width="30" height="150" fill="#22c55e"/>
  <text x="95" y="332" font-size="12" fill="#22c55e">08:20 displacement lên</text>

  <line x1="330" y1="330" x2="330" y2="290" stroke="#22c55e" stroke-width="2"/>
  <rect x="318" y="295" width="24" height="35" fill="#22c55e"/>

  <!-- SIBI gap -->
  <rect x="255" y="340" width="100" height="55" fill="#22c55e" opacity="0.25"/>
  <line x1="255" y1="367" x2="355" y2="367" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="360" font-size="12" fill="#eab308">CE SIBI = 1.0830</text>
  <text x="100" y="378" font-size="11" fill="#94a3b8">top=1.0838 bottom=1.0822</text>

  <!-- MSS -->
  <line x1="200" y1="380" x2="450" y2="380" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="398" font-size="12" fill="#94a3b8">STL nội bộ</text>
  <polygon points="330,330 315,355 345,355" fill="#22c55e"/>
  <text x="330" y="306" font-size="12" fill="#22c55e">08:35 MSS tăng xác nhận</text>

  <!-- retrace to CE -->
  <line x1="420" y1="360" x2="420" y2="400" stroke="#38bdf8" stroke-width="2"/>
  <rect x="408" y="360" width="24" height="30" fill="#38bdf8" opacity="0.8"/>
  <circle cx="420" cy="367" r="6" fill="#38bdf8"/>
  <text x="440" y="370" font-size="13" fill="#38bdf8">09:10 Entry Long tại CE 1.0830</text>

  <!-- continuation -->
  <g>
    <line x1="500" y1="360" x2="500" y2="290" stroke="#22c55e" stroke-width="2"/>
    <rect x="488" y="300" width="24" height="60" fill="#22c55e"/>
    <line x1="580" y1="290" x2="580" y2="220" stroke="#22c55e" stroke-width="2"/>
    <rect x="568" y="230" width="24" height="60" fill="#22c55e"/>
    <line x1="660" y1="220" x2="660" y2="170" stroke="#22c55e" stroke-width="2"/>
    <rect x="648" y="180" width="24" height="40" fill="#22c55e"/>
  </g>

  <!-- target -->
  <line x1="80" y1="165" x2="1120" y2="165" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="960" y="160" font-size="13" fill="#a78bfa">TP: BSL/inefficiency phía trên 1.0868</text>

  <!-- stop -->
  <line x1="80" y1="435" x2="450" y2="435" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="462" y="440" font-size="12" fill="#ef4444">SL 1.0817 (dưới high(C1))</text>

  <!-- summary -->
  <rect x="850" y="180" width="300" height="210" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="870" y="208" font-size="16" font-weight="bold" fill="#e2e8f0">Kết quả</text>
  <text x="870" y="234" font-size="13" fill="#e2e8f0">Entry: 1.0830 (09:10)</text>
  <text x="870" y="256" font-size="13" fill="#ef4444">SL: 1.0817 (13 pip)</text>
  <text x="870" y="278" font-size="13" fill="#a78bfa">TP: 1.0868 (38 pip)</text>
  <text x="870" y="300" font-size="13" fill="#22c55e">R:R ≈ 2.5R (dời BE sau MSS tiếp)</text>
  <text x="870" y="330" font-size="12" fill="#94a3b8">SIBI hình thành sau sweep SSL:</text>
  <text x="870" y="350" font-size="12" fill="#94a3b8">đúng chuỗi sweep→displacement→</text>
  <text x="870" y="370" font-size="12" fill="#94a3b8">MSS→entry tại CE của SIBI.</text>

  <g font-size="12" fill="#e2e8f0">
    <text x="80" y="610">1. 08:05 sweep SSL 1.0820→1.0813</text>
    <text x="420" y="610">2. 08:20 displacement lên tạo SIBI</text>
    <text x="780" y="610">3. 08:35 MSS tăng phá STL</text>
    <text x="80" y="630">4. 09:10 entry Long tại CE SIBI 1.0830</text>
    <text x="420" y="630">5. SL 1.0817, TP inefficiency 1.0868</text>
    <text x="780" y="630">6. Đạt TP 11:40 → 2.5R</text>
  </g>
</svg>
