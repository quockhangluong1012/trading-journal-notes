<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="860" height="520" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Điều kiện biến Pool → Candidate DOL — và phép thử đối thủ</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Ba điều kiện kiểm tra được, cộng một điều kiện ẩn. Thiếu điều kiện ẩn thì bạn có thiên kiến, không phải DOL.</text>

  <!-- ====== LEFT: logic equation ====== -->
  <rect x="24" y="74" width="420" height="112" rx="8" fill="#0F172A"/>
  <text x="44" y="100" font-size="11.5" font-weight="700" fill="#7DD3FC">CÔNG THỨC VẬN HÀNH</text>
  <text x="44" y="126" font-size="13" font-weight="700" fill="#F8FAFC">Candidate(P)  ⟺  A ∧ R ∧ F</text>
  <text x="44" y="152" font-size="12.5" font-weight="700" fill="#F8FAFC">DOL  ⟺  argmax Score(P)</text>
  <text x="44" y="174" font-size="10.5" fill="#94A3B8">điều kiện ẩn:  |{candidate mỗi phía}| ≥ 1</text>

  <!-- ====== THREE CONDITION BOXES ====== -->
  <!-- A -->
  <rect x="24" y="204" width="268" height="126" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="24" y="204" width="268" height="30" rx="8" fill="#DBEAFE"/>
  <text x="40" y="224" font-size="12" font-weight="700" fill="#1D4ED8">A — ALIGNMENT</text>
  <text x="40" y="252" font-size="10.5" fill="#374151">Pool nằm CÙNG PHÍA với structural</text>
  <text x="40" y="267" font-size="10.5" fill="#374151">event gần nhất đã confirm.</text>
  <text x="40" y="290" font-size="10" font-weight="700" fill="#1D4ED8">Kiểm tra:</text>
  <text x="40" y="305" font-size="10" fill="#4B5563">BOS/MSS/sweep gần nhất có dấu gì?</text>
  <text x="40" y="320" font-size="10" fill="#6B7280">Không xác định → không có candidate</text>

  <!-- R -->
  <rect x="304" y="204" width="268" height="126" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="304" y="204" width="268" height="30" rx="8" fill="#DBEAFE"/>
  <text x="320" y="224" font-size="12" font-weight="700" fill="#1D4ED8">R — REACHABILITY</text>
  <text x="320" y="252" font-size="10.5" fill="#374151">Khoảng cách nằm trong tầm horizon.</text>
  <text x="320" y="267" font-size="10.5" fill="#374151">d / ADR ≤ λ  (λ chốt trước)</text>
  <text x="320" y="290" font-size="10" font-weight="700" fill="#1D4ED8">Nếu vượt ngưỡng:</text>
  <text x="320" y="305" font-size="10" fill="#4B5563">KHÔNG xoá pool — hạ xuống</text>
  <text x="320" y="320" font-size="10" fill="#6B7280">final objective của horizon dài hơn</text>

  <!-- F -->
  <rect x="584" y="204" width="252" height="126" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="584" y="204" width="252" height="30" rx="8" fill="#DBEAFE"/>
  <text x="600" y="224" font-size="12" font-weight="700" fill="#1D4ED8">F — FRESHNESS</text>
  <text x="600" y="252" font-size="10.5" fill="#374151">Chưa bị trade-through kể từ</text>
  <text x="600" y="267" font-size="10.5" fill="#374151">khi pool được xác nhận.</text>
  <text x="600" y="290" font-size="10" font-weight="700" fill="#1D4ED8">Swept:</text>
  <text x="600" y="305" font-size="10" fill="#4B5563">Hết vai trò POOL (conditional</text>
  <text x="600" y="320" font-size="10" fill="#6B7280">orders đã tiêu thụ) — không phải hết vai trò MỨC</text>

  <!-- ====== HIDDEN CONDITION ====== -->
  <rect x="24" y="348" width="812" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="44" y="372" font-size="12" font-weight="700" fill="#B45309">ĐIỀU KIỆN ẨN THỨ TƯ — OPPONENT:  phải tồn tại ≥1 candidate ở PHÍA BÊN KIA của cùng tầng</text>
  <text x="44" y="394" font-size="10.5" fill="#92400E">Nếu chỉ một phía có candidate, đó KHÔNG phải "DOL đã rõ" — mà là bạn chưa mark đủ phía bên kia.</text>

  <!-- ====== BRANCH ====== -->
  <line x1="430" y1="410" x2="430" y2="428" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="220" y1="428" x2="640" y2="428" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="220" y1="428" x2="220" y2="440" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="640" y1="428" x2="640" y2="440" stroke="#6B7280" stroke-width="1.6"/>
  <polygon points="220,444 215,434 225,434" fill="#6B7280"/>
  <polygon points="640,444 635,434 645,434" fill="#6B7280"/>

  <!-- YES -->
  <rect x="60" y="448" width="320" height="58" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="220" y="470" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">CÓ ĐỐI THỦ → được phép phát biểu DOL</text>
  <text x="220" y="490" font-size="10" fill="#166534" text-anchor="middle">viết ra: DOL = pool X tại giá…, đối thủ = Y, invalid = …</text>

  <!-- NO -->
  <rect x="480" y="448" width="320" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="640" y="470" font-size="11.5" font-weight="700" fill="#374151" text-anchor="middle">KHÔNG CÓ ĐỐI THỦ → dừng, đây là thiên kiến</text>
  <text x="640" y="490" font-size="10" fill="#4B5563" text-anchor="middle">quay lại mark pool phía đối diện trước khi phân tích tiếp</text>
</svg>
