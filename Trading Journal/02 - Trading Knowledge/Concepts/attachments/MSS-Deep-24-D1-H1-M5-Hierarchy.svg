<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="640" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">MSS trong D1 → H1 → M5 — mỗi khung có QUYỀN khác nhau</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Context → Setup → Execution. Một MSS chỉ có quyền đổi kết luận ở CHÍNH khung/lớp của nó;</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">muốn đổi khung trên, phải có bằng chứng ở khung trên.</text>
<rect x="40.0" y="100.0" width="900.0" height="136.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="60.0" y="130.0" font-size="15" font-weight="800" fill="#1D4ED8" text-anchor="start">D1 = CONTEXT</text>
<text x="60.0" y="156.0" font-size="10.6" font-weight="600" fill="#1F2937" text-anchor="start">MSS-P D1: cấu trúc ngày lật (F2 lớp swing: ~6 lần/năm trên random walk).</text>
<text x="60.0" y="174.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Quyền: xét lại daily bias, dealing range, DOL HTF.</text>
<text x="60.0" y="192.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Không quyền: chọn entry.</text>
<text x="560.0" y="156.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Câu hỏi: 'Tôi đang ở đâu? Thanh khoản lớn ở đâu?'</text>
<text x="560.0" y="174.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Dữ liệu: nến D1 ĐÃ ĐÓNG (không dùng nến đang chạy).</text>
<line x1="250.0" y1="237.0" x2="250.0" y2="255.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="258.0" y="251.0" font-size="9.4" font-weight="600" fill="#6B7280" text-anchor="start">bối cảnh đi XUỐNG (lọc)</text>
<line x1="720.0" y1="255.0" x2="720.0" y2="239.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="712.0" y="251.0" font-size="9.4" font-weight="600" fill="#6B7280" text-anchor="end">bằng chứng đi LÊN chỉ khi khung trên xác nhận</text>
<rect x="40.0" y="256.0" width="900.0" height="136.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
<text x="60.0" y="286.0" font-size="15" font-weight="800" fill="#6D28D9" text-anchor="start">H1 = SETUP</text>
<text x="60.0" y="312.0" font-size="10.6" font-weight="600" fill="#1F2937" text-anchor="start">MSS-P H1: leg trong ngày lật → setup đổi pha.</text>
<text x="60.0" y="330.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">MSS-I H1: pullback bắt đầu/kết thúc.</text>
<text x="60.0" y="348.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Quyền: bật/tắt setup; chọn POI; không đổi D1 bias một mình.</text>
<text x="560.0" y="312.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Câu hỏi: 'Setup có đang hình thành không?'</text>
<text x="560.0" y="330.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Dữ liệu: nến H1 đã đóng; trạng thái H1 tại thời điểm M5.</text>
<line x1="250.0" y1="393.0" x2="250.0" y2="411.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="258.0" y="407.0" font-size="9.4" font-weight="600" fill="#6B7280" text-anchor="start">bối cảnh đi XUỐNG (lọc)</text>
<line x1="720.0" y1="411.0" x2="720.0" y2="395.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="712.0" y="407.0" font-size="9.4" font-weight="600" fill="#6B7280" text-anchor="end">bằng chứng đi LÊN chỉ khi khung trên xác nhận</text>
<rect x="40.0" y="412.0" width="900.0" height="136.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
<text x="60.0" y="442.0" font-size="15" font-weight="800" fill="#15803D" text-anchor="start">M5 = EXECUTION</text>
<text x="60.0" y="468.0" font-size="10.6" font-weight="600" fill="#1F2937" text-anchor="start">MSS-I M5 (G1): trigger trong vùng H1 đã chọn.</text>
<text x="60.0" y="486.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Quyền: thời điểm vào, vị trí stop (I4).</text>
<text x="60.0" y="504.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Không quyền: đổi H1 state hay D1 bias (≈31 MSS M5 / 1 MSS H1).</text>
<text x="560.0" y="468.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Câu hỏi: 'Có trigger không? Invalidation ở đâu?'</text>
<text x="560.0" y="486.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Dữ liệu: nến M5; M1 chỉ để kiểm tra 'grind' (v1 W3).</text>
<rect x="26.0" y="572.0" width="928.0" height="52.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="42.0" y="593.0" font-size="10.1" font-weight="700" fill="#B45309" text-anchor="start">Nesting: D1 tăng ⊃ H1 pullback giảm ⊃ M5 bullish MSS → với M5 là reversal, với H1 là kết thúc pullback, với D1 là continuation (MSS-Deep-16).</text>
<text x="42.0" y="610.0" font-size="10.1" font-weight="400" fill="#374151" text-anchor="start">Lỗi đắt nhất: để một M5 MSS đổi hướng cả ngày. MSS-Sim-05: M5 MSS gần như không thêm thông tin về H1 ngoài khoảng cách tới mức H1.</text>
</svg>