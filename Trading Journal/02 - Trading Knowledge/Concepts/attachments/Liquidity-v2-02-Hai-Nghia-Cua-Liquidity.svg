<text x="40.0" y="523.0" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start">không phải phép đo độ sâu sổ lệnh. Nhãn: [ICT FRAMEWORK] cho tên gọi · [INTERPRETATION] cho &quot;có lệnh ở đó&quot;.</text>
<text x="24.0" y="546.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-02 · Số lượng trên sổ lệnh là minh họa. Thị trường FX spot phi tập trung: không có một sổ lệnh duy nhất cho mọi người.</text>
