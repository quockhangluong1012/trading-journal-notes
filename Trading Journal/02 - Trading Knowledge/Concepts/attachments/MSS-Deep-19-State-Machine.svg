<svg viewBox="0 0 980 676" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="676" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">MSS state machine v0.1 — mọi chuyển trạng thái chỉ xét tại CLOSE của nến</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Một máy cho MỘT mức tham chiếu ở MỘT lớp, MỘT khung. Nhãn append-only, mỗi nhãn có known_at.</text>
<text x="26.0" y="73.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Ngưỡng ε, x, y, k, m là HEURISTIC — khai báo trước khi test, không chỉnh sau khi thấy kết quả.</text>
<rect x="30.0" y="90.0" width="170.0" height="70.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.7"/>
<text x="115.0" y="112.0" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">S0 · STABLE</text>
<text x="115.0" y="130.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">trạng thái lớp ℓ = DOWN</text>
<text x="115.0" y="144.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">(ví dụ cho bullish MSS)</text>
<rect x="260.0" y="90.0" width="190.0" height="70.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.7"/>
<text x="355.0" y="112.0" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">S1 · ARMED</text>
<text x="355.0" y="130.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">mức L đã xác nhận</text>
<text x="355.0" y="144.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">known_at(L) &lt; t</text>
<rect x="520.0" y="90.0" width="190.0" height="70.0" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/>
<text x="615.0" y="112.0" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">S2 · PROBE</text>
<text x="615.0" y="130.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">high &gt; L + ε nhưng</text>
<text x="615.0" y="144.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">close ≤ L + ε (wick)</text>
<rect x="770.0" y="90.0" width="180.0" height="70.0" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.7"/>
<text x="860.0" y="112.0" font-size="12" font-weight="800" fill="#6B7280" text-anchor="middle">→ sweep/run logic</text>
<text x="860.0" y="130.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">(xem note 20 §20)</text>
<text x="860.0" y="144.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">không phải MSS</text>
<rect x="260.0" y="220.0" width="190.0" height="78.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/>
<text x="355.0" y="242.0" font-size="12" font-weight="800" fill="#6D28D9" text-anchor="middle">S3 · CANDIDATE (G0)</text>
<text x="355.0" y="260.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">close &gt; L + ε·ATR khi lớp = DOWN</text>
<text x="355.0" y="274.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">→ trạng thái lớp lật NGAY tại đây</text>
<rect x="30.0" y="360.0" width="200.0" height="78.0" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.7"/>
<text x="130.0" y="382.0" font-size="12" font-weight="800" fill="#6B7280" text-anchor="middle">WEAK BREAK</text>
<text x="130.0" y="400.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">leg &lt; x·ATR và thân &lt; y·ATR</text>
<text x="130.0" y="414.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">ghi lại; không phải MSS-G1</text>
<rect x="300.0" y="360.0" width="200.0" height="78.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/>
<text x="400.0" y="382.0" font-size="12" font-weight="800" fill="#6D28D9" text-anchor="middle">S4 · QUALIFIED (G1)</text>
<text x="400.0" y="400.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">displacement đạt ngưỡng</text>
<text x="400.0" y="414.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">(FVG: biết ở t+1)</text>
<rect x="580.0" y="360.0" width="180.0" height="78.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.7"/>
<text x="670.0" y="382.0" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="middle">FAILED</text>
<text x="670.0" y="400.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">close &lt; L − ε·ATR trong k nến</text>
<text x="670.0" y="414.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">(I2) = sự kiện MỚI, append</text>
<rect x="300.0" y="490.0" width="200.0" height="78.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
<text x="400.0" y="512.0" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle">S5 · ACCEPTED (G2)</text>
<text x="400.0" y="530.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">k nến không close ngược</text>
<text x="400.0" y="544.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">known_at = t + k</text>
<rect x="580.0" y="490.0" width="180.0" height="78.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.7"/>
<text x="670.0" y="512.0" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="middle">INVALIDATED</text>
<text x="670.0" y="530.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">close &lt; ext − ε</text>
<text x="670.0" y="544.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">(= MSS ngược, I4)</text>
<rect x="800.0" y="490.0" width="150.0" height="78.0" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.7"/>
<text x="875.0" y="512.0" font-size="12" font-weight="800" fill="#6B7280" text-anchor="middle">EXPIRED</text>
<text x="875.0" y="530.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">chưa có BOS ↑</text>
<text x="875.0" y="544.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">sau m nến (I6)</text>
<rect x="300.0" y="590.0" width="200.0" height="56.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
<text x="400.0" y="612.0" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle">S6 · CONFIRMED (G3)</text>
<text x="400.0" y="630.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">HL mới + BOS ↑ cùng hướng</text>
<line x1="200.0" y1="125.0" x2="258.0" y2="125.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="229.0" y="117.0" font-size="9" font-weight="600" fill="#6B7280" text-anchor="middle">pivot</text>
<line x1="450.0" y1="118.0" x2="518.0" y2="118.0" stroke="#B45309" stroke-width="1.6" marker-end="url(#aO)"/>
<text x="484.0" y="110.0" font-size="9" font-weight="600" fill="#B45309" text-anchor="middle">wick</text>
<line x1="520.0" y1="140.0" x2="452.0" y2="140.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="486.0" y="154.0" font-size="9" font-weight="600" fill="#6B7280" text-anchor="middle">close lại</text>
<line x1="710.0" y1="125.0" x2="768.0" y2="125.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<line x1="355.0" y1="160.0" x2="355.0" y2="218.0" stroke="#6D28D9" stroke-width="1.6" marker-end="url(#aP)"/>
<text x="362.0" y="194.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="start">close &gt; L+ε</text>
<line x1="300.0" y1="298.0" x2="160.0" y2="358.0" stroke="#6B7280" stroke-width="1.6" marker-end="url(#aK)"/>
<text x="198.0" y="324.0" font-size="9" font-weight="600" fill="#6B7280" text-anchor="end">không đạt G1</text>
<line x1="380.0" y1="298.0" x2="395.0" y2="358.0" stroke="#6D28D9" stroke-width="1.6" marker-end="url(#aP)"/>
<text x="394.0" y="334.0" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="start">đạt G1</text>
<line x1="500.0" y1="399.0" x2="578.0" y2="399.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<text x="538.0" y="391.0" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">≤ k nến</text>
<line x1="400.0" y1="438.0" x2="400.0" y2="488.0" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#aB)"/>
<text x="406.0" y="468.0" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="start">k nến giữ</text>
<line x1="500.0" y1="529.0" x2="578.0" y2="529.0" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#aR)"/>
<path d="M 500 545 C 650 600, 760 600, 860 570" stroke="#9CA3AF" stroke-width="1.4" fill="none" marker-end="url(#aK)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700.0" y="604.0" font-size="9" font-weight="600" fill="#6B7280" text-anchor="middle">hết m nến</text>
<line x1="400.0" y1="568.0" x2="400.0" y2="588.0" stroke="#15803D" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="780.0" y="220.0" width="174.0" height="230.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.1"/>
<text x="792.0" y="240.0" font-size="9.6" font-weight="700" fill="#334155" text-anchor="start">Tham số (khai báo trước)</text>
<text x="792.0" y="255.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">ε  dung sai phá (×ATR): 0–0.05</text>
<text x="792.0" y="270.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">x  leg/ATR (ví dụ 2.0)</text>
<text x="792.0" y="285.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">y  thân/ATR (ví dụ 1.0)</text>
<text x="792.0" y="300.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">k  nến chấp nhận (ví dụ 3)</text>
<text x="792.0" y="315.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">m  cửa sổ G3 (ví dụ 24)</text>
<text x="792.0" y="330.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">n  fractal (ví dụ 2)</text>
<text x="792.0" y="345.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="792.0" y="360.0" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="start">Mọi con số trên là</text>
<text x="792.0" y="375.0" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="start">HEURISTIC — chưa</text>
<text x="792.0" y="390.0" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="start">được hiệu chỉnh.</text>
<text x="792.0" y="405.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">Xem note 50 cho</text>
<text x="792.0" y="420.0" font-size="9.6" font-weight="400" fill="#374151" text-anchor="start">displacement.</text>
</svg>