<text x="542.3" y="181.3" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">chờ giá</text>
<text x="542.3" y="194.4" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">quay về?</text>
<rect x="642.0" y="110.9" width="330.0" height="467.1" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="136.4" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Năm nhóm và điều họ có thể làm</text>
<circle cx="666.0" cy="156.9" r="10.0" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="160.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="684.0" y="160.9" font-size="12" font-weight="700" fill="#D97706">Người BÁN quanh đỉnh giữa</text>
<text x="684.0" y="176.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">Giá giờ nằm trên giá vốn → đang lỗ. Nếu giá</text>
<text x="684.0" y="193.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">quay về, có thể mua lại để thoát gần hoà vốn.</text>
<circle cx="666.0" cy="212.9" r="10.0" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="216.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="684.0" y="216.9" font-size="12" font-weight="700" fill="#E5484D">Người BÁN ĐUỔI lúc đáy cũ thủng</text>
<text x="684.0" y="232.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">Lỗ nhiều hơn. ICT nói nhóm này “will look to</text>
<text x="684.0" y="249.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">mitigate the loss”.</text>
<circle cx="666.0" cy="268.8" r="10.0" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="272.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="684.0" y="272.8" font-size="12" font-weight="700" fill="#7C3AED">Lệnh dừng lỗ trên đỉnh giữa</text>
<text x="684.0" y="288.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">Khi giá vượt đỉnh, chúng thành lệnh MUA ngay</text>
<text x="684.0" y="305.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">→ cú phá hay đi nhanh. Sau đó chúng không</text>
<text x="684.0" y="321.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">còn.</text>
<circle cx="666.0" cy="341.2" r="10.0" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="345.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text>
<text x="684.0" y="345.2" font-size="12" font-weight="700" fill="#0E9F6E">Người MUA gần đáy mới</text>
<text x="684.0" y="361.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">Đang lãi. Có thể mua thêm khi giá hồi.</text>
<circle cx="666.0" cy="380.7" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="384.7" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>
<text x="684.0" y="384.7" font-size="12" font-weight="700" fill="#2563EB">Người đứng ngoài, lỡ cú phá</text>
<text x="684.0" y="400.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,957.0">Có thể đặt lệnh mua chờ ở mức vừa bị phá.</text>
<rect x="656.0" y="426.2" width="302.0" height="101.9" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="426.2" width="4.0" height="101.9" rx="2" fill="#B45309"/>
<text x="670.0" y="446.0" font-size="11.6" font-weight="700" fill="#B45309" data-bx="656.0,958.0">Hai mặt của cùng câu chuyện</text>
<text x="670.0" y="465.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">A + D + E cùng muốn MUA quanh một vùng →</text>
<text x="670.0" y="482.0" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">vùng đó CÓ THỂ đỡ giá. Nhưng nếu A đã thoát</text>
<text x="670.0" y="498.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">hết bằng stop (C), nguồn mua chính đã biến mất</text>
<text x="670.0" y="514.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">trước khi giá quay lại.</text>
<text x="28.0" y="607.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đây là câu chuyện hợp lý nhất hiện có, không phải dữ kiện. Không ai đo được nhóm nào đông, nhóm nào đã thoát — nhất là trên FX giao ngay, nơi không có sổ</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">lệnh chung.</text>
