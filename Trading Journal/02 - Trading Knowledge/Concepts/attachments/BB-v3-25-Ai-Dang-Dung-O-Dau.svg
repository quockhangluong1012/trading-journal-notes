<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bản đồ năm nhóm người CÓ THỂ có mặt quanh một Bullish Breaker ngay sau khi nến xác nhận đóng cửa. Tất cả là [DIỄN GIẢI] — chart nến không</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">cho thấy họ.</text>
