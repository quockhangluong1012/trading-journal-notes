<text x="542.3" y="236.4" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>
<text x="305.4" y="232.2" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">lệnh dừng lỗ (đã bị kích hoạt)</text>
<text x="102.4" y="469.3" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">ĐÁY CŨ</text>
<text x="166.6" y="293.4" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">ĐỈNH GIỮA</text>
<line x1="542.3" y1="251.7" x2="542.3" y2="290.8" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
