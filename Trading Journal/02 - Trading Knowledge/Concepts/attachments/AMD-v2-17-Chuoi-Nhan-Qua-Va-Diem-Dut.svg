<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mk64748B" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Chuỗi nhân quả A → M → D và những chỗ chuỗi có thể đứt</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi mũi tên là một bước “có thể” xảy ra, không phải “phải” xảy ra. Thẻ đỏ dưới mỗi mũi tên là những gì làm chuỗi đứt ở bước đó.</text>
<rect x="857.3" y="22.0" width="114.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="914.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CAUSAL MODEL</text>
<rect x="28.0" y="120.0" width="140.0" height="76.0" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="98.0" y="148.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="middle">Accumulation</text>
<text x="98.0" y="180.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">giá cân bằng trong vùng</text>
<line x1="170.0" y1="158.0" x2="188.0" y2="158.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="190.0" y="120.0" width="140.0" height="76.0" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="260.0" y="148.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="middle">Liquidity hình</text>
<text x="260.0" y="163.6" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="middle">thành</text>
<text x="260.0" y="180.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">lệnh chờ tụ ngoài mép</text>
<line x1="332.0" y1="158.0" x2="350.0" y2="158.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="352.0" y="120.0" width="140.0" height="76.0" rx="10" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.4"/>
<text x="422.0" y="148.0" font-size="12.5" font-weight="800" fill="#EA580C" text-anchor="middle">Manipulation</text>
<text x="422.0" y="180.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">giá lệch ra, lấy liquidity</text>
<line x1="494.0" y1="158.0" x2="512.0" y2="158.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="514.0" y="120.0" width="140.0" height="76.0" rx="10" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.4"/>
<text x="584.0" y="148.0" font-size="12.5" font-weight="800" fill="#EA580C" text-anchor="middle">Rejection /</text>
<text x="584.0" y="163.6" font-size="12.5" font-weight="800" fill="#EA580C" text-anchor="middle">Reclaim</text>
<text x="584.0" y="180.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">không giữ được, quay</text>
<text x="584.0" y="193.5" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">vào</text>
<line x1="656.0" y1="158.0" x2="674.0" y2="158.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="676.0" y="120.0" width="140.0" height="76.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="746.0" y="148.0" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="middle">Displacement</text>
<text x="746.0" y="180.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">đi mạnh về phía kia,</text>
<text x="746.0" y="193.5" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">MSS</text>
<line x1="818.0" y1="158.0" x2="836.0" y2="158.0" stroke="#64748B" stroke-width="2" marker-end="url(#mk64748B)"/>
<rect x="838.0" y="120.0" width="140.0" height="76.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="908.0" y="148.0" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="middle">Distribution</text>
<text x="908.0" y="180.0" font-size="10.8" font-weight="400" fill="#1F2937" text-anchor="middle">mở rộng về đích (DOL)</text>
<line x1="179.0" y1="164.0" x2="179.0" y2="226.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="106.0" y="226.0" width="186.0" height="55.0" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="116.0" y="243.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">Đứt khi…</text>
<text x="116.0" y="259.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Không ai dùng mép làm mốc</text>
<text x="116.0" y="273.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">(mép mờ) → ít lệnh chờ.</text>
<line x1="341.0" y1="164.0" x2="341.0" y2="346.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="268.0" y="346.0" width="186.0" height="69.5" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="278.0" y="363.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">Đứt khi…</text>
<text x="278.0" y="379.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Giá không lệch ra mà chạy</text>
<text x="278.0" y="393.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">thẳng (trend day) hoặc tin ra</text>
<text x="278.0" y="408.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">phá mọi thứ.</text>
<line x1="503.0" y1="164.0" x2="503.0" y2="226.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="430.0" y="226.0" width="186.0" height="55.0" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="440.0" y="243.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">Đứt khi…</text>
<text x="440.0" y="259.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Bên phá thắng: đóng ngoài và</text>
<text x="440.0" y="273.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">giữ → breakout thật.</text>
<line x1="665.0" y1="164.0" x2="665.0" y2="346.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="592.0" y="346.0" width="186.0" height="69.5" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="602.0" y="363.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">Đứt khi…</text>
<text x="602.0" y="379.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Quay vào nhưng không ai đẩy</text>
<text x="602.0" y="393.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">mạnh về phía kia → đi ngang</text>
<text x="602.0" y="408.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">tiếp.</text>
<line x1="827.0" y1="164.0" x2="827.0" y2="226.0" stroke="#B91C1C" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="754.0" y="226.0" width="186.0" height="55.0" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="764.0" y="243.0" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="start">Đứt khi…</text>
<text x="764.0" y="259.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Đi mạnh được một đoạn rồi bị</text>
<text x="764.0" y="273.5" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lấy lại (MSS bẫy).</text>
<rect x="28.0" y="480.0" width="944.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="504.0" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Ba câu trả lời ngắn cho câu hỏi nhân quả</text>
<text x="44.0" y="536.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Không có Accumulation thì vẫn có thể có cú lệch và cú chạy — nhưng không có “mép” để đo cú lệch, nên câu chuyện PO3 mất điểm tựa.</text>
<text x="44.0" y="560.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Bước trước KHÔNG đẩy bước sau xảy ra; nó chỉ tạo ĐIỀU KIỆN (có lệnh chờ để lấy, có người mắc kẹt để thêm lực).</text>
<text x="44.0" y="584.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">• Vì vậy AMD là chuỗi điều kiện để quan sát lần lượt, không phải cỗ máy dự báo tự chạy.</text>
</svg>
