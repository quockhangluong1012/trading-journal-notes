<svg viewBox="0 0 980 660" width="980" height="660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F766E"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA3AF" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="980" height="660" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Giải phẫu cái tên IPDA — mỗi chữ hứa hẹn điều gì, và ta kiểm chứng được bao nhiêu?</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">ICT gốc: Interbank Price Delivery Algorithm. "Institutional Price Delivery Algorithm" là cách gọi phổ biến khác trong cộng đồng.</text>
<rect x="26.0" y="76.0" width="928.0" height="128.0" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<rect x="26.0" y="76.0" width="84.0" height="128.0" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="68.0" y="146.0" font-size="46" font-weight="700" fill="#1D4ED8" text-anchor="middle">I</text>
<text x="68.0" y="180.0" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Interbank</text>
<text x="126.0" y="100.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">Interbank / Institutional</text>
<text x="126.0" y="122.0" font-size="11.8" font-weight="700" fill="#334155" text-anchor="start">Gợi ý:</text>
<text x="180.0" y="122.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Giá FX hình thành trong mạng lưới ngân hàng–dealer–tổ chức.</text>
<text x="126.0" y="148.0" font-size="11.8" font-weight="700" fill="#15803D" text-anchor="start">Quan sát được:</text>
<text x="126.0" y="166.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">FX là thị trường OTC phi tập trung, ≈ $9.6 nghìn tỷ/ngày (BIS, 4/2025). Có dealer, ECN, market maker, quỹ.</text>
<text x="126.0" y="188.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">KHÔNG quan sát được:</text>
<text x="272.0" y="188.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">AI cụ thể đang giao dịch, với ý định gì. "Institutional" không phải MỘT tổ chức.</text>
<rect x="876.2" y="87.0" width="67.8" height="18.0" rx="4" fill="#E5E7EB" stroke="#334155" stroke-width="1"/>
<text x="882.2" y="101.0" font-size="10" font-weight="700" fill="#334155" text-anchor="start">[UNKNOWN]</text>
<rect x="746.6" y="87.0" width="123.6" height="18.0" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
<text x="752.6" y="101.0" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="start">[MARKET MECHANICS]</text>
<rect x="26.0" y="216.0" width="928.0" height="128.0" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
<rect x="26.0" y="216.0" width="84.0" height="128.0" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
<text x="68.0" y="286.0" font-size="46" font-weight="700" fill="#15803D" text-anchor="middle">P</text>
<text x="68.0" y="320.0" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Price</text>
<text x="126.0" y="240.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">Price</text>
<text x="126.0" y="262.0" font-size="11.8" font-weight="700" fill="#334155" text-anchor="start">Gợi ý:</text>
<text x="180.0" y="262.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Đối tượng của mô hình là giá.</text>
<text x="126.0" y="288.0" font-size="11.8" font-weight="700" fill="#15803D" text-anchor="start">Quan sát được:</text>
<text x="126.0" y="306.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá, thời gian, OHLC, high/low — từ feed của broker/sàn bạn dùng.</text>
<text x="126.0" y="328.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">KHÔNG quan sát được:</text>
<text x="272.0" y="328.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá "thật" toàn thị trường FX: không có một giá duy nhất; mỗi nơi có quote riêng.</text>
<rect x="857.6" y="227.0" width="86.4" height="18.0" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1"/>
<text x="863.6" y="241.0" font-size="10" font-weight="700" fill="#15803D" text-anchor="start">[OBSERVABLE]</text>
<rect x="26.0" y="356.0" width="928.0" height="128.0" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="26.0" y="356.0" width="84.0" height="128.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="68.0" y="426.0" font-size="46" font-weight="700" fill="#B45309" text-anchor="middle">D</text>
<text x="68.0" y="460.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">Delivery</text>
<text x="126.0" y="380.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">Delivery</text>
<text x="126.0" y="402.0" font-size="11.8" font-weight="700" fill="#334155" text-anchor="start">Gợi ý:</text>
<text x="180.0" y="402.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Giá được "giao" có chủ đích từ vùng này tới vùng khác.</text>
<text x="126.0" y="428.0" font-size="11.8" font-weight="700" fill="#15803D" text-anchor="start">Quan sát được:</text>
<text x="126.0" y="446.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Giá ĐÃ đi từ vùng A tới vùng B. Đường đi có thể mô tả, đo lường.</text>
<text x="126.0" y="468.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">KHÔNG quan sát được:</text>
<text x="272.0" y="468.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">"Chủ đích". Đường đi quan sát được tương thích với cả có lẫn không có chủ đích.</text>
<rect x="832.8" y="367.0" width="111.2" height="18.0" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
<text x="838.8" y="381.0" font-size="10" font-weight="700" fill="#0F766E" text-anchor="start">[INTERPRETATION]</text>
<rect x="721.8" y="367.0" width="105.0" height="18.0" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="727.8" y="381.0" font-size="10" font-weight="700" fill="#B45309" text-anchor="start">[ICT FRAMEWORK]</text>
<rect x="26.0" y="496.0" width="928.0" height="128.0" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<rect x="26.0" y="496.0" width="84.0" height="128.0" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
<text x="68.0" y="566.0" font-size="46" font-weight="700" fill="#6D28D9" text-anchor="middle">A</text>
<text x="68.0" y="600.0" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Algorithm</text>
<text x="126.0" y="520.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">Algorithm</text>
<text x="126.0" y="542.0" font-size="11.8" font-weight="700" fill="#334155" text-anchor="start">Gợi ý:</text>
<text x="180.0" y="542.0" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Quá trình có quy tắc, có hệ thống, lặp lại.</text>
<text x="126.0" y="568.0" font-size="11.8" font-weight="700" fill="#15803D" text-anchor="start">Quan sát được:</text>
<text x="126.0" y="586.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Có RẤT NHIỀU thuật toán thật: market making, thực thi (TWAP/VWAP), HFT, quản trị stop.</text>
<text x="126.0" y="608.0" font-size="11.8" font-weight="700" fill="#B91C1C" text-anchor="start">KHÔNG quan sát được:</text>
<text x="272.0" y="608.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một thuật toán DUY NHẤT tên "IPDA" điều khiển giá: không có bằng chứng công khai.</text>
<rect x="814.2" y="507.0" width="129.8" height="18.0" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
<text x="820.2" y="521.0" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="start">[UNSUPPORTED CLAIM]</text>
<rect x="721.8" y="507.0" width="86.4" height="18.0" rx="4" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1"/>
<text x="727.8" y="521.0" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="start">[HYPOTHESIS]</text>
<rect x="26.0" y="640.0" width="928.0" height="0.0" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
