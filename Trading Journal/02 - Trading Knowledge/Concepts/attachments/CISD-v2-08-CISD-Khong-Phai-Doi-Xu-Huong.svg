<text x="676.0" y="500.1" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">“CISD này đổi trạng thái của chặng NÀO, trên</text>
<text x="676.0" y="516.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">khung NÀO?” — trước khi hỏi “giá sẽ đi đâu?”.</text>
