<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Phóng to từ trái sang phải: D1 đang tăng → trong đó H1 có một nhịp giảm → trong nhịp đó M5 có bearish CISD. Bearish CISD M5 chỉ</text>
