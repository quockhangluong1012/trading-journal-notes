<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="558.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cùng một Breaker, sáu loại câu nói khác nhau</text>
<rect x="855.3" y="23.0" width="116.7" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="913.7" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CÁCH ĐỌC NOTE</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Lỗi phổ biến nhất: đọc một câu DIỄN GIẢI như thể nó là QUAN SÁT. Mỗi câu trong note đều mang một trong sáu nhãn này.</text>
<rect x="28.0" y="96.5" width="944.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="96.5" width="6.0" height="62.0" rx="3" fill="#15803D"/>
<rect x="46.0" y="108.5" width="83.5" height="20.0" rx="10.0" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="87.7" y="120.7" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">[QUAN SÁT]</text>
<text x="46.0" y="147.5" font-size="11.5" font-weight="400" fill="#6B7280">Ai nhìn chart cũng thấy giống nhau</text>
<text x="330.0" y="124.5" font-size="13" font-weight="400" fill="#111827" data-bx="329.0,957.0" font-style="italic">“Giá đi xuống dưới đáy cũ, rồi một cây nến đóng cửa phía trên đỉnh giữa.”</text>
<rect x="28.0" y="166.5" width="944.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="166.5" width="6.0" height="62.0" rx="3" fill="#2563EB"/>
<rect x="46.0" y="178.5" width="43.7" height="20.0" rx="10.0" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1"/>
<text x="67.8" y="190.7" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">[ICT]</text>
<text x="46.0" y="217.5" font-size="11.5" font-weight="400" fill="#6B7280">Cách ICT đặt tên và sử dụng</text>
<text x="330.0" y="194.5" font-size="13" font-weight="400" fill="#111827" data-bx="329.0,957.0" font-style="italic">“Nến tăng ở đỉnh giữa, sau trình tự đó, được ICT gọi là Bullish Breaker.”</text>
<rect x="28.0" y="236.5" width="944.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="236.5" width="6.0" height="62.0" rx="3" fill="#0891B2"/>
<rect x="46.0" y="248.5" width="68.2" height="20.0" rx="10.0" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="1"/>
<text x="80.1" y="260.7" font-size="11" font-weight="700" fill="#0891B2" text-anchor="middle">[CƠ CHẾ]</text>
<text x="46.0" y="287.5" font-size="11.5" font-weight="400" fill="#6B7280">Cách lệnh được khớp — có nghiên cứu ủng hộ</text>
<text x="330.0" y="264.5" font-size="13" font-weight="400" fill="#111827" data-bx="329.0,957.0" font-style="italic">“Lệnh dừng lỗ hay tụ quanh các mức dễ thấy; khi bị kích hoạt chúng trở thành lệnh thị trường.”</text>
<rect x="28.0" y="306.5" width="944.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="306.5" width="6.0" height="62.0" rx="3" fill="#B45309"/>
<rect x="46.0" y="318.5" width="77.4" height="20.0" rx="10.0" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="84.7" y="330.7" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">[DIỄN GIẢI]</text>
<text x="46.0" y="357.5" font-size="11.5" font-weight="400" fill="#6B7280">Hợp lý, nhưng chart không chứng minh được</text>
<text x="330.0" y="334.5" font-size="13" font-weight="400" fill="#111827" data-bx="329.0,957.0" font-style="italic">“Những người bán ở vùng này đang lỗ; khi giá quay lại họ mua vào để thoát hòa vốn.”</text>
<rect x="28.0" y="376.5" width="944.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="376.5" width="6.0" height="62.0" rx="3" fill="#7C3AED"/>
<rect x="46.0" y="388.5" width="94.4" height="20.0" rx="10.0" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="1"/>
<text x="93.2" y="400.7" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">[GIẢ THUYẾT]</text>
<text x="46.0" y="427.5" font-size="11.5" font-weight="400" fill="#6B7280">Có thể kiểm chứng, nhưng chưa kiểm chứng</text>
<text x="330.0" y="404.5" font-size="13" font-weight="400" fill="#111827" data-bx="329.0,957.0" font-style="italic">“Breaker có displacement mạnh sẽ giữ giá tốt hơn Breaker phá yếu.”</text>
<rect x="28.0" y="446.5" width="944.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="28.0" y="446.5" width="6.0" height="62.0" rx="3" fill="#B91C1C"/>
<rect x="46.0" y="458.5" width="145.8" height="20.0" rx="10.0" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="118.9" y="470.7" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">[BACKTEST REQUIRED]</text>
<text x="46.0" y="497.5" font-size="11.5" font-weight="400" fill="#6B7280">Chưa được phép coi là lợi thế giao dịch</text>
<text x="330.0" y="474.5" font-size="13" font-weight="400" fill="#111827" data-bx="329.0,957.0" font-style="italic">“Vào lệnh tại Breaker cho kết quả tốt hơn vào lệnh tại một vùng bất kỳ.”</text>
<text x="28.0" y="544.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Chỉ hai nhãn đầu là chắc chắn. Bốn nhãn sau là thứ ta NGHĨ hoặc ta HY VỌNG — càng xuống dưới càng cần bằng chứng.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
