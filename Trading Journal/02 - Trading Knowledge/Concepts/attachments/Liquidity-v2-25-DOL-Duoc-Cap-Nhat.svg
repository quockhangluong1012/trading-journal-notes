<text x="42.0" y="166.5" font-size="11" fill="#C2410C" font-weight="600" text-anchor="start">PDH — DOL dự kiến lúc 06:00</text>
<line x1="40.0" y1="471.5" x2="612.0" y2="471.5" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="42.0" y="485.5" font-size="11" fill="#1D4ED8" font-weight="600" text-anchor="start">PDL — đối thủ được ghi từ đầu</text>
<line x1="46.0" y1="315.5" x2="433.0" y2="315.5" stroke="#374151" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="46.0" y="331.5" font-size="10.5" fill="#374151" font-weight="700" text-anchor="start">protected low H1 (= điều kiện vô hiệu đã ghi)</text>
<line x1="196.5" y1="112.0" x2="196.5" y2="520.0" stroke="#C2410C" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.7"/>
