<text x="647.0" y="93.0" font-size="11.0" fill="#7C3AED" font-weight="700" text-anchor="start">Nhật ký DOL (append-only)</text>
<text x="647.0" y="110.0" font-size="10.5" fill="#C2410C" font-weight="normal" text-anchor="start">06:00 · PROJECTED: DOL = PDH; đối thủ</text>
<text x="647.0" y="124.4" font-size="10.5" fill="#C2410C" font-weight="normal" text-anchor="start">= PDL; horizon 1 ngày; vô hiệu khi H1</text>
<text x="647.0" y="138.9" font-size="10.5" fill="#C2410C" font-weight="normal" text-anchor="start">close + acceptance dưới protected low</text>
<text x="647.0" y="153.4" font-size="10.5" fill="#C2410C" font-weight="normal" text-anchor="start">T1 · ACTIVE: displacement H1 về PDH</text>
<text x="647.0" y="167.9" font-size="10.5" fill="#B91C1C" font-weight="normal" text-anchor="start">T2 · INVALIDATED: 2 close H1 liên tiếp dưới</text>
<text x="647.0" y="182.4" font-size="10.5" fill="#B91C1C" font-weight="normal" text-anchor="start">protected low (acceptance)</text>
<text x="647.0" y="196.9" font-size="10.5" fill="#1D4ED8" font-weight="normal" text-anchor="start">T3 · FLIP: DOL mới = PDL (là đối thủ</text>
<text x="647.0" y="211.4" font-size="10.5" fill="#1D4ED8" font-weight="normal" text-anchor="start">đã ghi sẵn); ghi lý do + giờ</text>
<text x="647.0" y="225.9" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start">T4 · ACTIVE (giảm): chưa delivered</text>
<rect x="638.0" y="300.0" width="278.0" height="102.4" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="647.0" y="319.0" font-size="11.0" fill="#B91C1C" font-weight="700" text-anchor="start">Không được làm</text>
<text x="647.0" y="335.9" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">• Xóa dòng PROJECTED ban đầu</text>
<text x="647.0" y="350.4" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">• Viết lại &quot;thật ra DOL luôn là PDL&quot;</text>
<text x="647.0" y="364.9" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">• Đổi điều kiện vô hiệu sau khi bị chạm</text>
<text x="647.0" y="379.4" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">• Giữ lệnh theo PDH &quot;vì D1 vẫn tăng&quot;</text>
<text x="647.0" y="393.9" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">   mà không có lý do mới ở khung D1</text>
<rect x="638.0" y="440.0" width="278.0" height="58.9" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="647.0" y="459.0" font-size="11.0" fill="#7C3AED" font-weight="700" text-anchor="start">Vòng đời DOL (DOL v0.2)</text>
<text x="647.0" y="475.9" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">projected → active → delivered → spent</text>
<text x="647.0" y="490.4" font-size="10.5" fill="#1F2937" font-weight="normal" text-anchor="start">                       ↘ invalidated → flip</text>
<rect x="24.0" y="534.0" width="892.0" height="52.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="555.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Đánh giá sau phiên: dự đoán ban đầu (PDH) SAI — ghi là sai. Nhưng QUY TRÌNH đúng: điều kiện vô hiệu đã viết trước và được tôn trọng.</text>
<text x="40.0" y="572.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Hai thứ chấm điểm riêng: độ chính xác của DOL (thống kê) và kỷ luật cập nhật (quy trình). Đừng trộn.</text>
<text x="24.0" y="606.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-25 · Nến H1 minh họa, giá và giờ giả định.</text>
