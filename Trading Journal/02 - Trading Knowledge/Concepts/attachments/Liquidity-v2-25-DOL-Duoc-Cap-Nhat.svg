<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">DOL ban đầu phải được cập nhật: từ PDH (dự kiến) sang PDL (đổi hướng)</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">DOL là biến trạng thái. Mỗi lần đổi phải có sự kiện cụ thể + thời điểm + lý do. Không &quot;giữ niềm tin&quot; qua sự kiện vô hiệu.</text>
