<text x="540.0" y="474.0" font-size="11.5" font-weight="600" fill="#EA580C" text-anchor="middle">IFVG hợp lệ — GHI LẠI vào journal, không giao dịch.</text>
<text x="540.0" y="489.9" font-size="11.5" font-weight="600" fill="#EA580C" text-anchor="middle">Đây là dữ liệu cho backtest.</text>
