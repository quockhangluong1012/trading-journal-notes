<text x="70.0" y="200.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">FVG hợp lệ</text>
<text x="48.0" y="250.0" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="start">✓</text>
<text x="70.0" y="250.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">Đóng cửa qua mép xa (cùng</text>
<text x="70.0" y="266.6" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">khung)</text>
