<rect x="1.0" y="1.0" width="998.0" height="538.0" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Valid IFVG ≠ Tradeable IFVG — hai cánh cổng</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cổng 1 hỏi về HÌNH HỌC (khách quan). Cổng 2 hỏi về BỐI CẢNH và THỰC THI. Phần lớn IFVG hợp lệ dừng ở cổng 2 — và như vậy là</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">đúng.</text>
