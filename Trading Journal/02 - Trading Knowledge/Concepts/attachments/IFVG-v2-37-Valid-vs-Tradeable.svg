<text x="412.0" y="236.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">Ở POI H1, đúng premium/discount</text>
<text x="390.0" y="276.0" font-size="14" font-weight="800" fill="#15803D" text-anchor="start">✓</text>
<text x="412.0" y="276.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">Retest trong killzone</text>
<text x="390.0" y="316.0" font-size="14" font-weight="800" fill="#15803D" text-anchor="start">✓</text>
<text x="412.0" y="316.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">M5 xác nhận (MSS / displacement)</text>
<text x="390.0" y="356.0" font-size="14" font-weight="800" fill="#15803D" text-anchor="start">✓</text>
<text x="412.0" y="356.0" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">R:R đạt kế hoạch, không sát tin</text>
