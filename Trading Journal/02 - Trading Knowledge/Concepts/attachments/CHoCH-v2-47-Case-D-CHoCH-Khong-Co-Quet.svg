<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="638.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Case D — CHoCH không có liquidity sweep</text>
<rect x="876.7" y="23.0" width="95.3" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.4" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">CASE STUDY</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Hợp lệ về cấu trúc. Câu hỏi là thiếu cú quét làm mất bao nhiêu giá trị — chưa ai đo cho bạn.</text>
<rect x="28.0" y="92.5" width="560.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="385.6" y="333.6" width="72.5" height="75.9" rx="2" fill="#0891B2" fill-opacity="0.2" stroke="#0891B2" stroke-width="1.2"/>
<line x1="230.4" y1="384.2" x2="540.9" y2="384.2" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="538.9" y="378.2" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">protected high</text>
<line x1="282.1" y1="498.1" x2="437.4" y2="498.1" stroke="#7C3AED" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3,3"/>
<text x="435.4" y="513.1" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">đáy LL — chưa bị quét</text>
<polyline points="69.9,194.4 121.6,371.5 163.1,295.6 214.8,472.8 256.2,384.2 308.0,498.1 349.4,434.8 390.8,460.1 452.9,270.3 489.2,333.6 546.1,207.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
