<circle cx="390.8" cy="460.1" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="452.9" cy="270.3" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="489.2" cy="333.6" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="546.1" cy="207.0" r="3.2" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="390.8" y="486.1" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">đáy cao hơn</text>
<text x="390.8" y="499.2" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">(không quét)</text>
<text x="448.9" y="262.3" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">CHoCH (displacement)</text>
<text x="542.1" y="199.0" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,578.0">BOS ↑</text>
<rect x="600.0" y="92.5" width="372.0" height="501.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<rect x="614.0" y="106.5" width="171.2" height="20.0" rx="10.0" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="1"/>
<text x="699.6" y="118.7" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Valid CHoCH, thiếu bối cảnh</text>
<text x="616.0" y="150.5" font-size="11" font-weight="700" fill="#6B7280">BỐI CẢNH</text>
<text x="616.0" y="166.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giá ở POI H1, phiên London. Không có cú quét rõ ràng.</text>
<text x="616.0" y="188.9" font-size="11" font-weight="700" fill="#6B7280">CẤU TRÚC</text>
<text x="616.0" y="204.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giảm, protected high = 65.</text>
<text x="616.0" y="227.4" font-size="11" font-weight="700" fill="#6B7280">CHUỖI GIÁ</text>
<text x="616.0" y="243.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Giá tạo một đáy CAO HƠN đáy LL (không quét), rồi đi lên</text>
<text x="616.0" y="259.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">mạnh qua 65.</text>
<text x="616.0" y="282.3" font-size="11" font-weight="700" fill="#6B7280">PHÂN LOẠI</text>
<text x="616.0" y="298.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Valid CHoCH G1 theo định nghĩa. Thiếu một bằng chứng bối</text>
<text x="616.0" y="314.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">cảnh (quét).</text>
<text x="616.0" y="337.3" font-size="11" font-weight="700" fill="#6B7280">DIỄN GIẢI</text>
<text x="616.0" y="353.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đáy cao hơn có thể cho thấy bên bán yếu dần. Hoặc đáy LL</text>
<text x="616.0" y="369.8" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">vẫn còn là “nam châm” chưa được lấy — rủi ro giá quay</text>
<text x="616.0" y="386.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">xuống quét nó (kịch bản D, hình 25).</text>
<text x="616.0" y="408.7" font-size="11" font-weight="700" fill="#6B7280">HÀM Ý</text>
<text x="616.0" y="424.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Hợp lệ để theo dõi. Có nên trade hay không tùy quy tắc mô</text>
<text x="616.0" y="441.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">hình của bạn: đó là câu hỏi backtest (HYP-CHOCH-002).</text>
<text x="616.0" y="463.7" font-size="11" font-weight="700" fill="#6B7280">VÔ HIỆU</text>
<text x="616.0" y="479.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">Đóng nến dưới đáy cao hơn 59; nguy hiểm hơn nếu thủng</text>
<text x="616.0" y="496.1" font-size="11.6" font-weight="400" fill="#111827" data-bx="615.0,957.0">56.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">[FRAMEWORK-DEPENDENT]: nhiều bản ICT 2022 yêu cầu quét trước MSS; định nghĩa CHoCH thì không. Đừng trộn hai thứ này.</text>
