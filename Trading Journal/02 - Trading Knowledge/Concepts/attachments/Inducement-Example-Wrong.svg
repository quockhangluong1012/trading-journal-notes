<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Ví dụ sai — Vào lệnh TẠI Inducement, bị quét trước khi giá đảo thật</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Trader nhầm đáy nhỏ (IDM) là điểm đảo chiều, Long ngay tại đó — giá xuyên qua quét stop rồi mới đảo thật tại OB phía dưới</text>

  <rect x="24" y="70" width="712" height="356" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- OB real POI further below -->
  <rect x="44" y="340" width="660" height="46" fill="#3B82F6" opacity="0.14"/>
  <text x="52" y="358" font-size="10.5" font-weight="700" fill="#1D4ED8">OB THẬT (POI) — nơi giá đảo chiều thật, nằm SÂU HƠN đáy nhỏ</text>

  <path d="M70,140 L110,180 L150,165 L190,220 L225,255" fill="none" stroke="#374151" stroke-width="2.2"/>

  <!-- minor low mistaken as OB -->
  <circle cx="225" cy="255" r="7" fill="none" stroke="#F59E0B" stroke-width="2.4"/>
  <text x="180" y="240" font-size="10" font-weight="700" fill="#B45309">Đáy nhỏ (IDM) — trader nhầm là điểm đảo</text>

  <!-- wrong entry here -->
  <circle cx="225" cy="255" r="6" fill="#DC2626"/>
  <text x="180" y="278" font-size="10" font-weight="700" fill="#B91C1C">Long SAI tại đây — stop đặt sát dưới</text>

  <!-- price sweeps through, stops trader, continues to real OB -->
  <path d="M225,255 L260,290 L300,320 L340,363" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <circle cx="300" cy="310" r="6" fill="none" stroke="#DC2626" stroke-width="2.2"/>
  <text x="310" y="300" font-size="9.5" font-weight="700" fill="#B91C1C">Giá xuyên qua, quét stop loss</text>

  <path d="M340,363 L360,363" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- real reversal at OB, too late for the trader -->
  <path d="M360,363 L400,320 L440,280 L480,220 L520,160" fill="none" stroke="#16A34A" stroke-width="2.6"/>
  <text x="440" y="150" font-size="10.5" font-weight="700" fill="#15803D">Đảo chiều THẬT xảy ra tại OB — nhưng đã quá muộn</text>
  <text x="440" y="164" font-size="10.5" font-weight="700" fill="#15803D">cho trader đã bị stop out ở đáy nhỏ phía trên</text>

  <rect x="40" y="398" width="656" height="14" rx="6" fill="#FEF3C7"/>
  <text x="52" y="0" font-size="0"></text>
</svg>
