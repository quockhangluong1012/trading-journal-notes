<text x="241.9" y="182.3" font-size="10" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,324.0">phá mạnh</text>
<text x="308.9" y="154.8" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="38.0,324.0">BOS ↑</text>
<text x="44.0" y="392.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="43.0,319.0">Quét đáy cũ → nhiều nến tăng thân to → đóng</text>
<text x="44.0" y="409.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="43.0,319.0">xa phía trên protected high, để lại FVG → hồi</text>
<text x="44.0" y="426.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="43.0,319.0">giữ được → BOS ↑. Đủ bằng chứng cho cả</text>
<text x="44.0" y="442.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="43.0,319.0">“cảnh báo” lẫn “cấu trúc mới thành hình”.</text>
<rect x="44.0" y="506.5" width="169.6" height="20.0" rx="10.0" fill="#15803D" fill-opacity="0.12" stroke="#15803D" stroke-width="1"/>
<text x="128.8" y="518.7" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Valid CHoCH → đã lên bậc 3</text>
