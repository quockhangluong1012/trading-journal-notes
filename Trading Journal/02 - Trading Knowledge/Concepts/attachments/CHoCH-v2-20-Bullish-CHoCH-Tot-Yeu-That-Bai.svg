<text x="52.0" y="117.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="69.0" y="118.0" font-size="13.5" font-weight="700" fill="#15803D" data-bx="68.0,323.0">CHoCH chất lượng tốt</text>
<line x1="159.7" y1="240.7" x2="318.0" y2="240.7" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
