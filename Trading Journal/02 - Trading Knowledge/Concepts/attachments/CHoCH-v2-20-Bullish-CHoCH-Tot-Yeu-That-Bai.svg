<text x="517.3" y="287.8" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="356.0,642.0">không quét</text>
<text x="584.2" y="252.1" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="356.0,642.0">bò qua</text>
<text x="362.0" y="392.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="361.0,637.0">Không quét đáy nào. Giá “bò” lên bằng nến nhỏ</text>
<text x="362.0" y="409.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="361.0,637.0">chồng lên nhau và đóng nhỉnh hơn protected</text>
<text x="362.0" y="426.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="361.0,637.0">high một chút. Đây vẫn là CHoCH theo định</text>
<text x="362.0" y="442.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="361.0,637.0">nghĩa, nhưng ít thông tin.</text>
