<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Ba bullish CHoCH: tốt, yếu, và thất bại</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Cả ba đều đóng nến trên cùng một protected high. Khác nhau ở ĐIỀU XẢY RA TRƯỚC, TRONG và SAU cú phá.</text>
<rect x="28.0" y="92.5" width="306.0" height="452.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
