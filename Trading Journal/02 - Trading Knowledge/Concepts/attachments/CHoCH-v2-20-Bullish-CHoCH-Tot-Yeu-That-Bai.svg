<text x="871.8" y="219.0" font-size="10" font-weight="700" fill="#C026D3" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="674.0,960.0">CHoCH ↑</text>
<text x="953.0" y="333.6" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="674.0,960.0">thủng đáy</text>
<text x="680.0" y="392.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,955.0">Có CHoCH, nhưng rồi giá không tạo được đáy</text>
<text x="680.0" y="409.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,955.0">cao hơn mà thủng luôn đáy vừa tạo. Cấu trúc</text>
<text x="680.0" y="426.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,955.0">giảm tiếp diễn. CHoCH đã là một cảnh báo SAI.</text>
<rect x="680.0" y="506.5" width="90.2" height="20.0" rx="10.0" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="1"/>
<text x="725.1" y="518.7" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">CHoCH failed</text>
<text x="28.0" y="567.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Phân loại “tốt/yếu” ở ô 1–2 dựa trên thông tin CÓ tại thời điểm phá. Nhãn “thất bại” ở ô 3 chỉ biết được SAU — đó là hindsight, dùng để học chứ không dùng để</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">vào lệnh.</text>
