<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Bé đi lên cầu thang từng bậc một, rồi bất ngờ nhảy một bước thật dài. Những bậc bị nhảy qua chỉ được một bước chân lướt ngang trên</text>
