<text x="42.0" y="476.0" font-size="13.5" font-weight="700" fill="#EA580C" text-anchor="start">Phép so sánh dừng ở đâu?</text>
<text x="46.0" y="500.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">• Trên chart, giá CÓ đi qua vùng FVG: nến 2 đã giao dịch ở đó. FVG không phải 'bậc chưa ai đặt chân', mà là 'bậc chỉ có MỘT bước chân lướt qua, không ai</text>
<text x="46.0" y="517.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">dừng lại'.</text>
<text x="46.0" y="552.0" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">• Cầu thang thật không thay đổi. Còn 'bậc bị nhảy' trên chart không có nghĩa là giá BẮT BUỘC phải quay lại đi từng bậc — đó là một câu hỏi phải kiểm</text>
<text x="46.0" y="569.2" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">chứng.</text>
