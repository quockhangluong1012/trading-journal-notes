<svg viewBox="0 0 980 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="580" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="26" y="34" font-size="18" font-weight="700" fill="#1F2937">Máy trạng thái của một Dealing Range</text>
  <text x="26" y="55" font-size="13" fill="#6B7280">Wick KHÔNG BAO GIỜ làm range invalid. SUSPENDED là một trạng thái hợp lệ, không phải sự do dự.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <!-- VALID -->
  <rect x="60" y="180" width="184" height="80" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="152" y="208" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">VALID</text>
  <text x="152" y="228" font-size="10.5" fill="#374151" text-anchor="middle">range đang vận hành</text>
  <text x="152" y="245" font-size="10.5" fill="#374151" text-anchor="middle">còn ≥1 đầu unswept</text>

  <!-- REFINED -->
  <rect x="60" y="330" width="184" height="80" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="152" y="358" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">REFINED</text>
  <text x="152" y="378" font-size="10.5" fill="#374151" text-anchor="middle">biên giãn do wick mới</text>
  <text x="152" y="395" font-size="10.5" fill="#374151" text-anchor="middle">→ đo lại levels, KHÔNG đổi phân tích</text>

  <path d="M132 262 L132 328" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M174 328 L174 262" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="46" y="290" font-size="9.5" fill="#6B7280">wick giãn biên</text>
  <text x="186" y="290" font-size="9.5" fill="#6B7280">cập nhật số</text>

  <!-- self loop raid -->
  <path d="M92 178 C 92 118, 212 118, 212 178" fill="none" stroke="#15803D" stroke-width="1.8" marker-end="url(#arG)"/>
  <text x="152" y="92" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">wick qua biên rồi close lại</text>
  <text x="152" y="107" font-size="10" fill="#15803D" text-anchor="middle">= RAID → vẫn VALID, unswept −1</text>
  <text x="152" y="122" font-size="10" fill="#15803D" text-anchor="middle">(range còn MẠNH HƠN ở phía đối diện)</text>

  <!-- SUSPENDED -->
  <rect x="340" y="180" width="196" height="80" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="438" y="208" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">SUSPENDED</text>
  <text x="438" y="228" font-size="10.5" fill="#374151" text-anchor="middle">sự kiện đã xảy ra nhưng</text>
  <text x="438" y="245" font-size="10.5" fill="#374151" text-anchor="middle">chưa đủ m nến để phán</text>

  <path d="M246 220 L336 220" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="291" y="210" font-size="10" fill="#6B7280" text-anchor="middle">có sự kiện</text>

  <!-- REPLACED -->
  <rect x="620" y="96" width="212" height="80" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="726" y="124" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">REPLACED</text>
  <text x="726" y="144" font-size="10.5" fill="#374151" text-anchor="middle">neo bị close-through, hoặc có</text>
  <text x="726" y="160" font-size="10.5" fill="#374151" text-anchor="middle">BOS tạo neo mới tốt hơn</text>

  <path d="M538 196 C 578 180, 588 150, 616 138" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="540" y="128" font-size="10" fill="#6B7280">close-through</text>

  <rect x="858" y="108" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-dasharray="4 3"/>
  <text x="908" y="132" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">range MỚI</text>
  <text x="908" y="148" font-size="10" fill="#6B7280" text-anchor="middle">chốt + cascade</text>
  <path d="M834 136 L854 136" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- INVALIDATED -->
  <rect x="620" y="290" width="212" height="96" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="726" y="318" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">INVALIDATED</text>
  <text x="726" y="338" font-size="10.5" fill="#374151" text-anchor="middle">2 con đường tới đây:</text>
  <text x="726" y="354" font-size="10.5" fill="#374151" text-anchor="middle">· protected swing bị phá (body-close)</text>
  <text x="726" y="370" font-size="10.5" fill="#374151" text-anchor="middle">· CẢ HAI đầu external bị lấy hết</text>

  <path d="M538 246 C 578 268, 588 300, 616 320" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#arR)"/>
  <text x="556" y="290" font-size="10" fill="#B91C1C">giữ ngoài ≥ m nến + MSS</text>

  <path d="M132 440 L 300 440 L 300 262" fill="none" stroke="#15803D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arG)"/>
  <text x="150" y="432" font-size="10" fill="#15803D">reclaim trong m nến → đây chỉ là RAID, quay lại VALID</text>

  <!-- properties -->
  <rect x="26" y="470" width="928" height="94" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="40" y="491" font-size="12" font-weight="700" fill="#15803D">Ba tính chất quan trọng nhất của máy trạng thái này</text>
  <text x="40" y="511" font-size="10.5" fill="#374151"><tspan font-weight="700">1 · Wick không bao giờ invalidate.</tspan> Cơ chế: wick qua biên = thanh khoản được tiêu thụ ở đó NHƯNG không có acceptance → neo vẫn đứng.</text>
  <text x="40" y="529" font-size="10.5" fill="#374151"><tspan font-weight="700">2 · SUSPENDED là trạng thái đúng</tspan> khi sự kiện vừa xảy ra. Gán vội REPLACED/INVALIDATED tại đây chính là nguồn của việc re-map liên tục.</text>
  <text x="40" y="547" font-size="10.5" fill="#374151"><tspan font-weight="700">3 · REPLACED ≠ INVALIDATED.</tspan> Bị thay thế là vận hành bình thường (mỗi BOS tạo neo mới). Chỉ INVALIDATED mới là “range chết vì cấu trúc bị phá”.</text>
</svg>
