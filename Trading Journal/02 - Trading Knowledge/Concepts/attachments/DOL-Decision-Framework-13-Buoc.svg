<svg viewBox="0 0 1060 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Decision framework 13 bước — mỗi bước có output viết ra được</text>
  <text x="24" y="54" font-size="13" fill="#6B7280">Không bước nào được kết thúc bằng một cảm nhận. Và mỗi bước đều có quyền trả về "dừng".</text>

  <!-- ================= COLUMN 1 ================= -->
  <rect x="24" y="76" width="180" height="24" rx="6" fill="#E5E7EB"/>
  <text x="114" y="93" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">VỊ TRÍ &amp; KHUNG</text>

  <rect x="24" y="108" width="180" height="52" rx="7" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="36" y="126" font-size="11" font-weight="700" fill="#1F2937">1. Giá đang ở đâu?</text>
  <text x="36" y="142" font-size="9.5" fill="#4B5563">→ giá, vs open, vs prior day</text>
  <text x="36" y="155" font-size="9" fill="#6B7280">session/timezone phải rõ</text>

  <rect x="24" y="172" width="180" height="52" rx="7" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="36" y="190" font-size="11" font-weight="700" fill="#1F2937">2. HTF structure?</text>
  <text x="36" y="206" font-size="9.5" fill="#4B5563">→ HH/HL, LH/LL, undefined</text>
  <text x="36" y="219" font-size="9" fill="#6B7280">undefined → DỪNG (neutral)</text>

  <rect x="24" y="236" width="180" height="60" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="36" y="254" font-size="11" font-weight="700" fill="#1D4ED8">3. Active dealing range?</text>
  <text x="36" y="270" font-size="9.5" fill="#1E3A8A">→ 2 CON SỐ + phương pháp</text>
  <text x="36" y="283" font-size="9" font-weight="700" fill="#B91C1C">ĐÓNG BĂNG. Không chốt được → DỪNG</text>

  <!-- arrow -->
  <line x1="206" y1="266" x2="230" y2="266" stroke="#6B7280" stroke-width="1.8"/>
  <polygon points="234,266 224,261 224,271" fill="#6B7280"/>

  <!-- ================= COLUMN 2 ================= -->
  <rect x="236" y="76" width="180" height="24" rx="6" fill="#E5E7EB"/>
  <text x="326" y="93" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">LIQUIDITY</text>

  <rect x="236" y="108" width="180" height="52" rx="7" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="248" y="126" font-size="11" font-weight="700" fill="#1F2937">4. Liquidity có gì?</text>
  <text x="248" y="142" font-size="9.5" fill="#4B5563">→ mark RỘNG, CẢ HAI PHÍA</text>
  <text x="248" y="155" font-size="9" fill="#6B7280">chỉ một phía → mark lại</text>

  <rect x="236" y="172" width="180" height="60" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="248" y="190" font-size="11" font-weight="700" fill="#B45309">5. Pool nào structural?</text>
  <text x="248" y="206" font-size="9.5" fill="#92400E">→ áp hard filters F1–F7</text>
  <text x="248" y="221" font-size="9" font-weight="700" fill="#B91C1C">rỗng → DỪNG (neutral)</text>

  <rect x="236" y="244" width="180" height="52" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="248" y="262" font-size="11" font-weight="700" fill="#1D4ED8">6. Candidate DOLs?</text>
  <text x="248" y="278" font-size="9.5" fill="#1E3A8A">→ A ∧ R ∧ F, ≥1 mỗi phía</text>
  <text x="248" y="291" font-size="9" fill="#6B7280">điều kiện ẩn: có ĐỐI THỦ</text>

  <!-- arrow -->
  <line x1="418" y1="266" x2="442" y2="266" stroke="#6B7280" stroke-width="1.8"/>
  <polygon points="446,266 436,261 436,271" fill="#6B7280"/>

  <!-- ================= COLUMN 3 ================= -->
  <rect x="448" y="76" width="180" height="24" rx="6" fill="#E5E7EB"/>
  <text x="538" y="93" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">CHỌN</text>

  <rect x="448" y="108" width="180" height="44" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="460" y="126" font-size="11" font-weight="700" fill="#15803D">7. Ủng hộ gì?</text>
  <text x="460" y="142" font-size="9.5" fill="#4B5563">→ viết ra, không cảm nhận</text>

  <rect x="448" y="160" width="180" height="50" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
  <text x="460" y="178" font-size="11" font-weight="700" fill="#B91C1C">8. Phản bác gì?</text>
  <text x="460" y="194" font-size="9.5" fill="#7F1D1D">→ BẮT BUỘC</text>
  <text x="460" y="206" font-size="9" fill="#6B7280">bỏ bước này → bước 9 vô nghĩa</text>

  <rect x="448" y="218" width="180" height="60" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="460" y="236" font-size="11" font-weight="700" fill="#B45309">9. Asymmetry?</text>
  <text x="460" y="252" font-size="9.5" fill="#92400E">→ so sánh hai phía</text>
  <text x="460" y="267" font-size="9" font-weight="700" fill="#B91C1C">|asym| &lt; ngưỡng → DỪNG (neutral)</text>

  <!-- arrow -->
  <line x1="630" y1="266" x2="654" y2="266" stroke="#6B7280" stroke-width="1.8"/>
  <polygon points="658,266 648,261 648,271" fill="#6B7280"/>

  <!-- ================= COLUMN 4 ================= -->
  <rect x="660" y="76" width="180" height="24" rx="6" fill="#E5E7EB"/>
  <text x="750" y="93" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">MỤC TIÊU</text>

  <rect x="660" y="108" width="180" height="52" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="672" y="126" font-size="11" font-weight="700" fill="#15803D">10. Intermediate (T1)?</text>
  <text x="672" y="142" font-size="9.5" fill="#166534">→ candidate gần nhất hợp lệ</text>
  <text x="672" y="155" font-size="9" font-weight="700" fill="#166534">CÙNG HƯỚNG với DOL</text>

  <rect x="660" y="172" width="180" height="52" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="672" y="190" font-size="11" font-weight="700" fill="#15803D">11. Final objective (T2)?</text>
  <text x="672" y="206" font-size="9.5" fill="#166534">→ candidate xa nhất hợp lệ</text>
  <text x="672" y="219" font-size="9" font-weight="700" fill="#166534">CÙNG HƯỚNG với DOL</text>

  <rect x="660" y="236" width="180" height="60" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="672" y="254" font-size="11" font-weight="700" fill="#B91C1C">12. Invalidation?</text>
  <text x="672" y="270" font-size="9.5" fill="#7F1D1D">→ SỰ KIỆN quan sát được</text>
  <text x="672" y="283" font-size="9" fill="#6B7280">viết TRƯỚC khi vào lệnh, dạng close</text>

  <!-- arrow -->
  <line x1="842" y1="266" x2="866" y2="266" stroke="#6B7280" stroke-width="1.8"/>
  <polygon points="870,266 860,261 860,271" fill="#6B7280"/>

  <!-- ================= COLUMN 5 ================= -->
  <rect x="872" y="76" width="164" height="24" rx="6" fill="#E5E7EB"/>
  <text x="954" y="93" font-size="10.5" font-weight="700" fill="#374151" text-anchor="middle">THỰC THI</text>

  <rect x="872" y="108" width="164" height="188" rx="7" fill="#0F172A" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="884" y="128" font-size="11" font-weight="700" fill="#7DD3FC">13. H1/M5 phản hồi?</text>
  <text x="884" y="150" font-size="9.5" fill="#E2E8F0">•  chọn model:</text>
  <text x="892" y="163" font-size="9" fill="#94A3B8">reversal / continuation</text>
  <text x="884" y="182" font-size="9.5" fill="#E2E8F0">•  chờ raid / POI hold</text>
  <text x="884" y="200" font-size="9.5" fill="#E2E8F0">•  chờ MSS (pivot</text>
  <text x="892" y="213" font-size="9" fill="#94A3B8">PRE-CONFIRMED)</text>
  <text x="884" y="231" font-size="9.5" fill="#E2E8F0">•  chờ displacement</text>
  <text x="884" y="249" font-size="9.5" fill="#E2E8F0">•  entry FVG first touch</text>
  <text x="884" y="267" font-size="9.5" fill="#FCA5A5">•  R:R sau costs tới T1</text>
  <text x="892" y="280" font-size="9" fill="#F87171">không đạt → DỪNG</text>

  <!-- ================= RETURNS (bottom) ================= -->
  <rect x="24" y="330" width="1012" height="106" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="44" y="354" font-size="12.5" font-weight="700" fill="#334155">BỐN OUTPUT HỢP LỆ — không chỉ hai. Nếu mô hình chưa bao giờ trả về Neutral, đó là dấu hiệu bạn đang KỂ CHUYỆN.</text>

  <rect x="44" y="366" width="228" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="158" y="386" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">LONG PLAN</text>
  <text x="158" y="404" font-size="9.5" fill="#166534" text-anchor="middle">asymmetry nghiêng upper rõ rệt</text>

  <rect x="284" y="366" width="228" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="398" y="386" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">SHORT PLAN</text>
  <text x="398" y="404" font-size="9.5" fill="#991B1B" text-anchor="middle">asymmetry nghiêng lower rõ rệt</text>

  <rect x="524" y="366" width="240" height="56" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/>
  <text x="644" y="386" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">NEUTRAL — NO-TRADE</text>
  <text x="644" y="404" font-size="9.5" fill="#4B5563" text-anchor="middle">mục tiêu tham khảo: ≥25–30% số ngày</text>

  <rect x="776" y="366" width="240" height="56" rx="6" fill="#EFF6FF" stroke="#1D4ED8"/>
  <text x="896" y="386" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">WAIT — RE-ASSESS</text>
  <text x="896" y="404" font-size="9.5" fill="#1E3A8A" text-anchor="middle">có candidate, chưa tới điều kiện entry</text>

  <!-- ================= THREE CHECKS ================= -->
  <rect x="24" y="452" width="1012" height="128" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="44" y="476" font-size="12.5" font-weight="700" fill="#1F2937">BA CÂU HỎI KIỂM TRA TRƯỚC KHI BẤM NÚT — một câu "Không" là không vào lệnh</text>

  <rect x="44" y="490" width="316" height="70" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="58" y="510" font-size="11" font-weight="700" fill="#B45309">1. Tôi có viết được ĐỐI THỦ không?</text>
  <text x="58" y="530" font-size="10" fill="#92400E">Không → chưa có DOL, chỉ có thiên kiến.</text>
  <text x="58" y="548" font-size="9.5" font-style="italic" fill="#B45309">Không có đối thủ = không có gì để so sánh.</text>

  <rect x="372" y="490" width="316" height="70" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="386" y="510" font-size="11" font-weight="700" fill="#B45309">2. Invalidation viết được chưa?</text>
  <text x="386" y="530" font-size="10" fill="#92400E">Không → đây là niềm tin, không phải kế hoạch.</text>
  <text x="386" y="548" font-size="9.5" font-style="italic" fill="#B45309">Phải dạng SỰ KIỆN quan sát được, dạng close.</text>

  <rect x="700" y="490" width="316" height="70" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="714" y="510" font-size="11" font-weight="700" fill="#B45309">3. Nếu DOL hit, chốt ở đâu?</text>
  <text x="714" y="530" font-size="10" fill="#92400E">Không → entry chưa có target, chỉ có hy vọng.</text>
  <text x="714" y="548" font-size="9.5" font-style="italic" fill="#B45309">T1 và T2 phải cùng hướng.</text>
</svg>
