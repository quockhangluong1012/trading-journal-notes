<svg viewBox="0 0 1000 680" width="1000" height="680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="1" y="1" width="998" height="678" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="874.5" y="22" width="97.5" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="923.2" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">FRAMEWORK</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Quy trình đọc chart 7 bước (bản đã bổ sung Bước 0 và Bước 7)</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi bước có lối thoát 'DỪNG'. Phần lớn gap sẽ dừng ở bước 0–3. Đó là kết quả bình thường, không phải thất bại của quy trình.</text>
<rect x="28.0" y="100.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="42.0" y="122.0" font-size="12.5" font-weight="800" fill="#64748B" text-anchor="start">0. Kiểm tra dữ liệu</text>
<text x="42.0" y="142.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Chart phiên nào? Nguồn nào? Có giờ mở rộng / đổi hợp đồng / khác giờ đóng nến?</text>
<line x1="628.0" y1="131.0" x2="664.0" y2="131.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,131.0 L658.6,133.6 L658.6,128.4 Z" fill="#E0464B"/>
<rect x="666.0" y="108.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="127.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Gap chỉ có trên feed này → DỪNG</text>
<line x1="328.0" y1="162.0" x2="328.0" y2="171.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,171.0 L325.8,166.5 L330.2,166.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="171.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="42.0" y="193.0" font-size="12.5" font-weight="800" fill="#64748B" text-anchor="start">1. Bối cảnh trước gap</text>
<text x="42.0" y="213.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Trend hay range? Biên nào rõ? Ghi ra TRƯỚC khi xem tiếp.</text>
<line x1="628.0" y1="202.0" x2="664.0" y2="202.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,202.0 L658.6,204.6 L658.6,199.4 Z" fill="#E0464B"/>
<rect x="666.0" y="179.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="198.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Không có cấu trúc rõ → chỉ gọi là 'gap'</text>
<line x1="328.0" y1="233.0" x2="328.0" y2="242.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,242.0 L325.8,237.5 L330.2,237.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="242.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="42.0" y="264.0" font-size="12.5" font-weight="800" fill="#D97706" text-anchor="start">2. Mô tả gap</text>
<text x="42.0" y="284.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Hướng, vị trí so với biên, cách đo, phiên, có tin không.</text>
<line x1="628.0" y1="273.0" x2="664.0" y2="273.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,273.0 L658.6,275.6 L658.6,270.4 Z" fill="#E0464B"/>
<rect x="666.0" y="250.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="269.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Gap nằm trong range → common gap</text>
<line x1="328.0" y1="304.0" x2="328.0" y2="313.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,313.0 L325.8,308.5 L330.2,308.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="313.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="42.0" y="335.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start">3. Có phá cấu trúc?</text>
<text x="42.0" y="355.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Biên nội bộ hay biên ngoài? Nến đóng cửa ở đâu?</text>
<line x1="628.0" y1="344.0" x2="664.0" y2="344.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,344.0 L658.6,346.6 L658.6,341.4 Z" fill="#E0464B"/>
<rect x="666.0" y="321.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="340.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Không đóng cửa ngoài biên ngoài → DỪNG</text>
<line x1="328.0" y1="375.0" x2="328.0" y2="384.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,384.0 L325.8,379.5 L330.2,379.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="384.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="42.0" y="406.0" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start">4. Hành vi sau gap</text>
<text x="42.0" y="426.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Follow-through? Test? Lấp một phần / hết? Lấy lại range?</text>
<line x1="628.0" y1="415.0" x2="664.0" y2="415.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,415.0 L658.6,417.6 L658.6,412.4 Z" fill="#E0464B"/>
<rect x="666.0" y="392.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="411.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Lấy lại range → breakout thất bại</text>
<line x1="328.0" y1="446.0" x2="328.0" y2="455.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,455.0 L325.8,450.5 L330.2,450.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="455.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#0F9D74" stroke-width="1.4"/>
<text x="42.0" y="477.0" font-size="12.5" font-weight="800" fill="#0F9D74" text-anchor="start">5. Phân loại có ghi thời điểm</text>
<text x="42.0" y="497.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Ứng viên / xác nhận / thất bại / chưa rõ. Ghi kèm nến số mấy.</text>
<line x1="628.0" y1="486.0" x2="664.0" y2="486.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,486.0 L658.6,488.6 L658.6,483.4 Z" fill="#E0464B"/>
<rect x="666.0" y="463.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="482.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">'Chưa rõ' là câu trả lời hợp lệ</text>
<line x1="328.0" y1="517.0" x2="328.0" y2="526.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,526.0 L325.8,521.5 L330.2,521.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="526.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#0F9D74" stroke-width="1.4"/>
<text x="42.0" y="548.0" font-size="12.5" font-weight="800" fill="#0F9D74" text-anchor="start">6. Ý nghĩa thực tế</text>
<text x="42.0" y="568.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Range cũ còn liên quan? Cấu trúc đổi chưa? Gap là tham chiếu gì?</text>
<line x1="628.0" y1="557.0" x2="664.0" y2="557.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,557.0 L658.6,559.6 L658.6,554.4 Z" fill="#E0464B"/>
<rect x="666.0" y="534.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="553.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Không có bối cảnh mới → không trade</text>
<line x1="328.0" y1="588.0" x2="328.0" y2="597.0" stroke="#94A3B8" stroke-width="1.4"/>
<path d="M328.0,597.0 L325.8,592.5 L330.2,592.5 Z" fill="#94A3B8"/>
<rect x="28.0" y="597.0" width="600.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="42.0" y="619.0" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="start">7. Chuyển sang mô hình entry</text>
<text x="42.0" y="639.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Breakaway chỉ là BỐI CẢNH. Entry vẫn cần quy trình H1 → M5 riêng.</text>
<line x1="628.0" y1="628.0" x2="664.0" y2="628.0" stroke="#E0464B" stroke-width="1.4"/>
<path d="M664.0,628.0 L658.6,630.6 L658.6,625.4 Z" fill="#E0464B"/>
<rect x="666.0" y="605.0" width="306.0" height="46.0" rx="8" fill="#FBE3E4" stroke="#E0464B" stroke-width="1"/>
<text x="678.0" y="624.0" font-size="11" font-weight="700" fill="#E0464B" text-anchor="start">Không có trigger M5 → không lệnh</text>
