<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Phát hiện MSS theo thời gian thực — tại close nến t, ta thực sự biết gì?</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Đường kẻ đỏ là 'bây giờ'. Mọi thứ bên phải là tương lai. Một backtest trung thực chỉ được dùng thông tin bên trái đường đỏ.</text>
