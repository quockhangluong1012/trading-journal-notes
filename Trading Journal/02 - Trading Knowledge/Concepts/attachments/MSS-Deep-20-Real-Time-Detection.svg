<line x1="223.0" y1="184.0" x2="725.0" y2="184.0" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="219.0" y="176.0" font-size="9.6" font-weight="700" fill="#6D28D9" text-anchor="start">STH (pivot tại nến i)</text>
<line x1="671.0" y1="96.0" x2="671.0" y2="374.0" stroke="#DC2626" stroke-width="2.2"/>
<text x="675.0" y="108.0" font-size="10" font-weight="800" fill="#B91C1C" text-anchor="start">BÂY GIỜ = close nến t</text>
<rect x="673.0" y="112.0" width="253.0" height="270.0" rx="0" fill="#FEF2F2" fill-opacity="0.5"/>
<text x="683.0" y="300.0" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="start">tương lai:</text>
<text x="683.0" y="314.0" font-size="9.6" font-weight="400" fill="#B91C1C" text-anchor="start">k, m nến tới</text>
<line x1="237.0" y1="342.0" x2="237.0" y2="352.0" stroke="#7C3AED" stroke-width="1.6"/>
<text x="237.0" y="368.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="middle">i: STH hình thành</text>
<line x1="341.0" y1="342.0" x2="341.0" y2="352.0" stroke="#7C3AED" stroke-width="1.6"/>
<text x="341.0" y="368.0" font-size="9.2" font-weight="700" fill="#6D28D9" text-anchor="middle">i+2: STH được biết</text>
<line x1="393.0" y1="342.0" x2="393.0" y2="352.0" stroke="#D97706" stroke-width="1.6"/>
<text x="393.0" y="380.0" font-size="9.2" font-weight="700" fill="#B45309" text-anchor="middle">s: đáy sweep</text>
<line x1="497.0" y1="342.0" x2="497.0" y2="352.0" stroke="#D97706" stroke-width="1.6"/>
<text x="497.0" y="368.0" font-size="9.2" font-weight="700" fill="#B45309" text-anchor="middle">s+2: đáy được biết</text>
<line x1="653.0" y1="342.0" x2="653.0" y2="352.0" stroke="#16A34A" stroke-width="1.6"/>
<text x="653.0" y="368.0" font-size="9.2" font-weight="700" fill="#15803D" text-anchor="middle">t: close &gt; STH</text>
<rect x="26.0" y="396.0" width="452.0" height="188.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
<text x="38.0" y="418.0" font-size="12.5" font-weight="700" fill="#15803D" text-anchor="start">BIẾT tại close t (ex-ante)</text>
<text x="38.0" y="435.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• STH đã xác nhận và mức của nó (known_at = i + n)</text>
<text x="38.0" y="452.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• cực trị sweep và vị trí của nó</text>
<text x="38.0" y="469.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• close nến t &gt; STH (+ε) → G0</text>
<text x="38.0" y="486.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• thân/leg của cú phá theo ATR(t−1) → G1 hay không</text>
<text x="38.0" y="503.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• trạng thái lớp ℓ trước t (DOWN), bối cảnh H1/D1 đến nến H1/D1 đã đóng</text>
<text x="38.0" y="520.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• khoảng cách tới DOL / pool đối diện (ATR)</text>
<rect x="500.0" y="396.0" width="454.0" height="188.0" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
<text x="512.0" y="418.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">CHƯA BIẾT tại close t (ex-post)</text>
<text x="512.0" y="435.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• FVG có hình thành không (cần nến t+1)</text>
<text x="512.0" y="452.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• cú phá có giữ được k nến không (G2)</text>
<text x="512.0" y="469.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• có HL mới + BOS (G3) không</text>
<text x="512.0" y="486.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• đáy sweep có thành 'protected low' thật không</text>
<text x="512.0" y="503.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• giá có tới DOL không — và đây có phải 'đảo chiều' không</text>
<text x="512.0" y="520.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">• MSS này sau này có được gọi là 'đẹp' hay không (selection)</text>
</svg>