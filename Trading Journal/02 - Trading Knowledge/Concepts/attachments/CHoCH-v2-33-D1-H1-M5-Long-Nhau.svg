<text x="680.0" y="402.5" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">Ở POI H1: quét đáy nhỏ → giá vượt đỉnh M5</text>
<text x="680.0" y="419.5" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">gần nhất bằng displacement = M5 CHoCH ↑.</text>
<text x="680.0" y="436.5" font-size="12" font-weight="400" fill="#111827" data-bx="679.0,955.0">Đây là “con kiến đổi hướng”.</text>
<rect x="28.0" y="572.5" width="944.0" height="50.5" rx="8" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="572.5" width="4.0" height="50.5" rx="2" fill="#2563EB"/>
<text x="42.0" y="592.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">Đọc đúng: D1 vẫn tăng (không cần “xác nhận lại”). H1 đang hồi; M5 CHoCH ↑ tại POI là gợi ý đầu tiên rằng đợt hồi H1 có thể dừng. Muốn nói “H1 đã đổi chiều”</text>
<text x="42.0" y="609.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">cần H1 phá protected high của chính H1 (bậc 4 ở hình 18).</text>
<text x="28.0" y="649.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Quy tắc phân quyền (RULE-CHOCH-006): mỗi CHoCH chỉ có quyền thay đổi kết luận ở chính khung và lớp của nó.</text>
