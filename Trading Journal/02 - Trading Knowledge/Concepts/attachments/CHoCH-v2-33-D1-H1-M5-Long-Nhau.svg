<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Mỗi khung kể một câu chuyện riêng. M5 CHoCH tăng ở đây là tín hiệu “có thể đợt hồi H1 đang kết thúc” — KHÔNG phải tín hiệu đổi D1.</text>
