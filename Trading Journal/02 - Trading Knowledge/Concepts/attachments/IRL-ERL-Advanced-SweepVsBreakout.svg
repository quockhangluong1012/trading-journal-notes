<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Sweep ERL: Liquidity grab (đảo) vs Breakout (mở rộng range)</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Chìa khoá phân biệt: WICK reject quay lại trong range = grab; BODY đóng chấp nhận ngoài biên = breakout → range mới</text>

  <!-- LEFT: grab -->
  <rect x="24" y="70" width="345" height="382" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#15803D">A. Liquidity grab → ĐẢO chiều</text>
  <line x1="44" y1="130" x2="350" y2="130" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="120" y="124" font-size="9.5" font-weight="700" fill="#B91C1C">ERL đỉnh (BSL)</text>
  <line x1="44" y1="400" x2="350" y2="400" stroke="#B45309" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="50" y="416" font-size="9.5" fill="#B45309">ERL đáy (SSL) = draw sau khi đảo</text>
  <!-- candles up to BSL, wick through, close back inside -->
  <rect x="80" y="250" width="2" height="60" fill="#16A34A"/><rect x="72" y="256" width="14" height="48" fill="#16A34A" rx="1"/>
  <rect x="112" y="190" width="2" height="70" fill="#16A34A"/><rect x="104" y="196" width="14" height="56" fill="#16A34A" rx="1"/>
  <rect x="150" y="112" width="2" height="90" fill="#DC2626"/><rect x="142" y="150" width="14" height="52" fill="#DC2626" rx="1"/>
  <text x="158" y="120" font-size="9" fill="#B91C1C">wick xuyên BSL, thân đóng LẠI trong range</text>
  <circle cx="151" cy="118" r="6" fill="none" stroke="#B45309" stroke-width="2.2"/>
  <path d="M156,175 L200,240 L250,320 L300,390" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <text x="60" y="440" font-size="10" font-weight="700" fill="#15803D">→ đảo về ERL đối diện (rotation bình thường)</text>

  <!-- RIGHT: breakout -->
  <rect x="391" y="70" width="345" height="382" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="407" y="96" font-size="12.5" font-weight="700" fill="#B91C1C">B. Breakout → range MỞ RỘNG</text>
  <line x1="411" y1="200" x2="717" y2="200" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="470" y="194" font-size="9.5" fill="#475569">ERL cũ (giờ thành IRL/hỗ trợ mới)</text>
  <!-- candles break with body acceptance above -->
  <rect x="440" y="320" width="2" height="56" fill="#16A34A"/><rect x="432" y="326" width="14" height="44" fill="#16A34A" rx="1"/>
  <rect x="472" y="250" width="2" height="70" fill="#16A34A"/><rect x="464" y="256" width="14" height="56" fill="#16A34A" rx="1"/>
  <rect x="504" y="150" width="2" height="120" fill="#16A34A"/><rect x="496" y="158" width="14" height="104" fill="#16A34A" rx="1"/>
  <text x="512" y="150" font-size="9" font-weight="700" fill="#15803D">BODY đóng chấp nhận NGOÀI biên</text>
  <!-- fresh IRL/FVG from breakout candle -->
  <rect x="472" y="200" width="48" height="34" fill="#3B82F6" opacity="0.2"/>
  <text x="524" y="220" font-size="9" font-weight="700" fill="#1D4ED8">IRL/FVG MỚI do nến breakout tạo</text>
  <path d="M510,162 L560,140 L610,120 L660,108" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="410" y="430" font-size="10" font-weight="700" fill="#B91C1C">→ range cũ chết; vẽ range mới, ERL cũ = IRL/hỗ trợ,</text>
  <text x="410" y="446" font-size="10" font-weight="700" fill="#B91C1C">retrace về IRL mới để tiếp diễn (không phải đảo)</text>
</svg>
