<text x="270.0" y="454.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">chỉ L2 (swing nội bộ của nhịp hồi)</text>
<text x="630.0" y="454.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">L3 rồi L4 (swing neo bối cảnh D1)</text>
