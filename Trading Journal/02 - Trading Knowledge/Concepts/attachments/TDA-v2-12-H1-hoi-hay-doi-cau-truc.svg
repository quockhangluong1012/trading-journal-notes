<text x="40.0" y="496.0" font-size="11.6" font-weight="700" fill="#1F2937" text-anchor="start">Displacement</text>
<text x="270.0" y="496.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nến chồng lấp, động lượng giảm dần khi tới POI</text>
<text x="630.0" y="496.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nến thân dài liên tiếp, để lại FVG bearish</text>
