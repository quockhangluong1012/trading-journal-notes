<text x="26.0" y="56.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cả hai trường hợp nhìn giống nhau ở 70% đầu tiên. Khác biệt nằm ở thang swing bị phá, displacement, acceptance và phản ứng tại POI.</text>
