<text x="270.0" y="538.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">đi từ premium về discount / vào POI</text>
<text x="630.0" y="538.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">đi XUYÊN POI và tiếp tục</text>
<rect x="26.0" y="556.0" width="948.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="580.0" font-size="11.6" font-weight="700" fill="#1F2937" text-anchor="start">Acceptance</text>
<text x="270.0" y="580.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">wick xuyên rồi đóng lại trong / trên zone</text>
<text x="630.0" y="580.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">nhiều nến đóng dưới distal, không reclaim</text>
<rect x="26.0" y="598.0" width="948.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="622.0" font-size="11.6" font-weight="700" fill="#1F2937" text-anchor="start">Phản ứng tại POI</text>
<text x="270.0" y="622.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">có: nến từ chối, MSS ngược hướng nhịp hồi</text>
<text x="630.0" y="622.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">không: hồi yếu, bị bán tại mức vừa phá</text>
<rect x="26.0" y="640.0" width="948.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="664.0" font-size="11.6" font-weight="700" fill="#1F2937" text-anchor="start">Liquidity</text>
<text x="270.0" y="664.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lấy SSL nội bộ (1080) rồi phản ứng = 'nhiên liệu'</text>
<text x="630.0" y="664.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">lấy SSL nội bộ và tiếp tục về SSL external (1000)</text>
<text x="500.0" y="702.0" font-size="11" font-weight="700" fill="#1F2937" text-anchor="middle">Quy tắc: ≥ 3 chẩn đoán nghiêng 'đổi' → REASSESS D1 (không tự lật bias). Thân nến xuyên L4 → SUSPEND ngay. (HEURISTIC — BACKTEST REQUIRED)</text>
