<svg viewBox="0 0 1000 623" xmlns="http://www.w3.org/2000/svg" font-family="&#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect x="1" y="1" width="998" height="621" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="905.7" y="22" width="66.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="938.8" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">CASE D</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Case D — Sweep ERL dưới, reclaim, rồi giá đi về IRL bên trong</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Đọc theo thời gian, không nhìn trước: T1 → T5. Ở mỗi mốc, chỉ dùng thông tin đã có tại mốc đó. Hình dựng (synthetic).</text>
<rect x="28.0" y="87.0" width="620.0" height="450.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="55.3" y="201.2" width="580.7" height="98.0" rx="0" fill="#FEF2F2" stroke="none" stroke-width="1.2"/>
<rect x="55.3" y="299.2" width="580.7" height="98.0" rx="0" fill="#ECFDF5" stroke="none" stroke-width="1.2"/>
<rect x="55.3" y="201.2" width="580.7" height="196.0" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,3"/>
<line x1="55.3" y1="299.2" x2="636.0" y2="299.2" stroke="#64748B" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="116.4" y="256.6" width="519.6" height="21.3" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.85"/>
<rect x="383.8" y="341.8" width="252.2" height="25.6" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1" stroke-dasharray="4,2" opacity="0.85"/>
<path d="M40.0,269.4 L55.3,201.2 L85.8,252.4 L101.1,235.3 L116.4,269.4 L131.7,312.0 L162.3,286.4 L192.8,346.1 L223.4,320.5 L253.9,380.2 L284.5,354.6 L315.1,397.2 L330.4,371.6 L345.6,384.4 L360.9,422.8 L376.2,371.6 L391.5,380.2 L406.8,312.0 L422.1,329.0 L437.3,337.6 L452.6,320.5 L483.2,286.4 L498.5,269.4 L529.0,295.0" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="315.1" y1="397.2" x2="636.0" y2="397.2" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="634.0" y="411.2" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="end">ERL dưới — ĐÃ BỊ QUÉT</text>
<line x1="223.4" y1="320.5" x2="422.1" y2="320.5" stroke="#059669" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="223.4" y="315.5" font-size="10" font-weight="700" fill="#059669" text-anchor="start">đỉnh nội bộ bị phá (MSS)</text>
<line x1="55.3" y1="201.2" x2="636.0" y2="201.2" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="634.0" y="196.2" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end">ERL trên (BSL) — đích xa</text>
<text x="544.3" y="358.6" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG mới (IRL)</text>
<text x="192.8" y="271.3" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">FVG giảm cũ (IRL phía trên)</text>
<rect x="347.9" y="431.8" width="26.0" height="18.0" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="360.9" y="444.8" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">T1</text>
<rect x="345.2" y="356.6" width="26.0" height="18.0" rx="9" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
<text x="358.2" y="369.6" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">T2</text>
<rect x="377.8" y="293.0" width="26.0" height="18.0" rx="9" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<text x="390.8" y="306.0" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">T3</text>
<rect x="424.3" y="346.6" width="26.0" height="18.0" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="437.3" y="359.6" font-size="9.5" font-weight="700" fill="#D97706" text-anchor="middle">T4</text>
<rect x="485.5" y="242.4" width="26.0" height="18.0" rx="9" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
<text x="498.5" y="255.4" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">T5</text>
<rect x="664.0" y="87.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="97.0" width="4.0" height="200.0" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="110.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Có thể kết luận (ex-ante)</text>
<text x="680.0" y="131.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">T1: giá xuyên đáy range — mới chỉ là CÂU HỎI.</text>
<text x="680.0" y="147.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">T2: nến đóng lại trong range — ứng viên sweep.</text>
<text x="680.0" y="163.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">T3: displacement phá đỉnh nội bộ (MSS) — bằng</text>
<text x="680.0" y="179.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">chứng mạnh hơn; để lại FVG mới.</text>
<text x="680.0" y="195.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">T4: giá hồi về FVG mới (IRL) — vùng vào lệnh ứng</text>
<text x="680.0" y="210.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">viên.</text>
<text x="680.0" y="226.8" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">T5: giá chạm FVG giảm cũ (IRL phía trên) — trạm</text>
<text x="680.0" y="242.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">có thể khựng.</text>
<rect x="664.0" y="317.0" width="308.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="664.0" y="327.0" width="4.0" height="200.0" rx="2" fill="#DC2626" stroke="none" stroke-width="1.2"/>
<text x="680.0" y="340.0" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="start">KHÔNG thể kết luận</text>
<text x="680.0" y="361.6" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Tại T1: không thể biết sweep hay breakdown.</text>
<text x="680.0" y="377.4" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Tại T3: vẫn chưa biết ERL trên có bị lấy không.</text>
<text x="680.0" y="393.3" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">• Ở bất kỳ mốc nào: “ai” đã quét đáy.</text>
<text x="680.0" y="425.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="278.0">Thứ tự T1→T5 chỉ rõ ràng khi nhìn lại.</text>
<rect x="28.0" y="551.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="575.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Bài học: sau khi một ERL bị lấy, DOL GẦN thường là IRL (EQ, FVG giảm cũ), chưa phải ERL đối diện. Đặt T1 ở IRL đầu tiên, chỉ để phần còn lại chạy về ERL trên khi</text>
<text x="42.0" y="591.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">đường đi thông.</text>
</svg>
