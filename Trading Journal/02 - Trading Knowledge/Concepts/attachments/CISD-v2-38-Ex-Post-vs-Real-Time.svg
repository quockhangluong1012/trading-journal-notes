<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trái: khi đã biết kết quả, CISD trông “hiển nhiên”. Phải: ở đúng lúc nến #11 vừa đóng, có ít nhất ba tương lai khác nhau. Mọi kế</text>
