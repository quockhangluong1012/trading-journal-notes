<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Râu vượt hay thân đóng vượt? Chỉ GIÁ ĐÓNG CỬA được tính</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Ba tình huống ở cùng một vạch xuất phát. Chỉ tình huống C là CISD. Râu nến cho biết giá ĐÃ TỚI đó, nhưng không ở lại được tới lúc</text>
