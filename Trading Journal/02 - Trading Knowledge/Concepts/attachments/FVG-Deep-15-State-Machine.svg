<text x="482.0" y="124.0" font-size="9.2" font-weight="600" fill="#334155" text-anchor="start">hết hạn</text>
<line x1="650.0" y1="227.0" x2="650.0" y2="169.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
