<text x="500.0" y="318.0" font-size="9.2" font-weight="600" fill="#334155" text-anchor="start">bật</text>
<line x1="473.0" y1="502.0" x2="555.0" y2="502.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="478.0" y="494.0" font-size="9.2" font-weight="600" fill="#334155" text-anchor="start">close ngoài distal</text>
<line x1="743.0" y1="502.0" x2="785.0" y2="502.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="748.0" y="494.0" font-size="9.2" font-weight="600" fill="#334155" text-anchor="start">retest</text>
