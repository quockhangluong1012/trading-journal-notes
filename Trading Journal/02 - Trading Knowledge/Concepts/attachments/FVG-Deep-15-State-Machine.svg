<text x="560.0" y="344.0" font-size="9.4" font-weight="400" fill="#6B7280" text-anchor="start">(lấp hết rồi mới bật) — ghi depth để phân biệt.</text>
<rect x="30.0" y="560.0" width="920.0" height="66.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
<text x="46.0" y="582.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start">Tham số khai báo TRƯỚC khi chạy (v0.1 — HEURISTIC):</text>
<text x="46.0" y="602.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">min_size = 0.25·ATR(14) · k = 1.0·ATR · m = 6 nến · N_expire = 48 nến · invalidation = close cùng khung ngoài distal · buffer = 0.1·ATR</text>
<text x="46.0" y="618.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Không chỉnh tham số theo kết quả backtest; nếu đổi → tăng version (v0.2) và test lại trên dữ liệu mới.</text>
