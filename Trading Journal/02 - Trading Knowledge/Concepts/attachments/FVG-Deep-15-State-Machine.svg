<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">FVG state machine v0.1 — đủ rõ để code và backtest (chuyển trạng thái CHỈ tại đóng nến)</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Mỗi chuyển trạng thái ghi lại bar index (known_at). Trạng thái là append-only: không sửa lại nhãn cũ khi có thông tin mới.</text>
