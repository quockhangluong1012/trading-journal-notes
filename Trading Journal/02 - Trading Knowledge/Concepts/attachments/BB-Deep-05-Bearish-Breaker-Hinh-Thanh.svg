<text x="678.0" y="105.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Đỉnh H1 được xác nhận</text>
<text x="678.0" y="123.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Trên đỉnh thường có lệnh dừng lỗ của người bán</text>
<text x="678.0" y="139.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">khống — ICT gọi là buy-side liquidity (BSL).</text>
<circle cx="659.0" cy="165.0" r="11" fill="#B45309"/>
<text x="659.0" y="169.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="678.0" y="170.0" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="start">Đáy L1 và OB gốc</text>
<text x="678.0" y="188.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Cây nến GIẢM cuối cùng trước cú tăng là bullish</text>
<text x="678.0" y="204.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">OB — vùng “đáng lẽ đỡ giá”.</text>
<circle cx="659.0" cy="230.0" r="11" fill="#B91C1C"/>
<text x="659.0" y="234.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="678.0" y="235.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Giá vượt lên trên H1 → H2</text>
<text x="678.0" y="253.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Đỉnh cũ bị vi phạm. Diễn giải ICT: BSL bị quét.</text>
<text x="678.0" y="269.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Bản thân điều này chưa nói giá sẽ giảm.</text>
<circle cx="659.0" cy="295.0" r="11" fill="#111827"/>
<text x="659.0" y="299.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="678.0" y="300.0" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Thân nến đóng DƯỚI L1</text>
<text x="678.0" y="318.0" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">OB gốc thất bại và cấu trúc đổi sang giảm</text>
<text x="678.0" y="334.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">(MSS). Breaker được xác nhận tại lúc đóng nến</text>
<text x="678.0" y="350.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">này.</text>
<circle cx="659.0" cy="376.1" r="11" fill="#BE185D"/>
<text x="659.0" y="380.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="678.0" y="381.1" font-size="12.5" font-weight="700" fill="#BE185D" text-anchor="start">Vùng đổi vai</text>
<text x="678.0" y="399.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Vùng từng đỡ giá giờ được theo dõi như vùng có</text>
<text x="678.0" y="415.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">thể cản giá: Bearish Breaker.</text>
<circle cx="659.0" cy="441.1" r="11" fill="#BE185D"/>
<text x="659.0" y="445.2" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="678.0" y="446.1" font-size="12.5" font-weight="700" fill="#BE185D" text-anchor="start">Retest từ dưới lên</text>
<text x="678.0" y="464.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">Giá quay lên vùng. Quan sát phản ứng và ghi lại</text>
<text x="678.0" y="480.1" font-size="11.6" font-weight="400" fill="#1F2937" text-anchor="start">cả khi vùng bị xuyên.</text>
