<line x1="525.2" y1="397.5" x2="766.0" y2="397.5" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="764.0" y="413.5" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="430.0,772.0">protected low</text>
<text x="609.9" y="198.7" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="430.0,772.0">BOS</text>
<text x="548.7" y="274.6" font-size="10" font-weight="700" fill="#2563EB" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="430.0,772.0">chân sóng</text>
<text x="548.7" y="287.1" font-size="10" font-weight="700" fill="#2563EB" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="430.0,772.0">đã tạo BOS</text>
<text x="746.6" y="443.7" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="430.0,772.0">đóng dưới → CHoCH ↓</text>
<text x="782.0" y="156.5" font-size="11.6" font-weight="400" fill="#2563EB" data-bx="781.0,959.0">Cú tăng từ 57 lên 76 đã làm</text>
<text x="782.0" y="172.9" font-size="11.6" font-weight="400" fill="#2563EB" data-bx="781.0,959.0">một việc: vượt đỉnh cũ 64</text>
<text x="782.0" y="189.4" font-size="11.6" font-weight="400" fill="#2563EB" data-bx="781.0,959.0">(BOS).</text>
<text x="782.0" y="214.9" font-size="11.6" font-weight="400" fill="#B45309" data-bx="781.0,959.0">Đáy 57 là điểm xuất phát của</text>
<text x="782.0" y="231.3" font-size="11.6" font-weight="400" fill="#B45309" data-bx="781.0,959.0">cú tăng đó → protected low.</text>
<text x="782.0" y="256.8" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="781.0,959.0">Giá đóng dưới 57: mọi thứ cú</text>
<text x="782.0" y="273.3" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="781.0,959.0">tăng đó tạo ra đã bị trả lại hết.</text>
<text x="782.0" y="289.8" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="781.0,959.0">Câu “đáy sau cao hơn đáy</text>
<text x="782.0" y="306.2" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="781.0,959.0">trước” không còn đúng ở lớp</text>
<text x="782.0" y="322.7" font-size="11.6" font-weight="400" fill="#C026D3" data-bx="781.0,959.0">này.</text>
<text x="782.0" y="348.2" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="781.0,959.0">Còn đáy 66 (giữa đường)? Phá</text>
<text x="782.0" y="364.7" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="781.0,959.0">nó chỉ là pullback sâu hơn,</text>
<text x="782.0" y="381.1" font-size="11.6" font-weight="400" fill="#6B7280" data-bx="781.0,959.0">chưa xoá cú tăng nào.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đây là lý do “protected” không có nghĩa là “có người đang bảo vệ”. Nó có nghĩa: cả câu chuyện cấu trúc của lớp này DỰA trên mức đó.</text>
