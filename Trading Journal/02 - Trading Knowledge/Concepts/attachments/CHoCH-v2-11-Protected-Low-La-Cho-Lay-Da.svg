<text x="69.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="68.0,387.0">Cho bé: nhảy xa</text>
<line x1="50.0" y1="342.5" x2="380.0" y2="342.5" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
