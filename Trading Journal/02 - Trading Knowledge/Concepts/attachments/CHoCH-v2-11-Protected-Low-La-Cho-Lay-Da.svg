<text x="300.0" y="364.5" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">tiếp đất xa</text>
<line x1="296.0" y1="292.5" x2="106.0" y2="292.5" stroke="#C026D3" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6,4"/>
<polygon points="100.0,292.5 106.6,288.0 106.6,296.9" fill="#C026D3"/>
<text x="200.0" y="284.5" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="middle">bị kéo lùi qua vạch giậm</text>
<text x="46.0" y="392.5" font-size="12.2" font-weight="400" fill="#111827" data-bx="45.0,383.0">Bé giậm ở vạch cam và nhảy rất xa. Nếu sau đó bé bị</text>
<text x="46.0" y="409.8" font-size="12.2" font-weight="400" fill="#111827" data-bx="45.0,383.0">kéo lùi về SAU vạch giậm, cú nhảy coi như chưa từng</text>
<text x="46.0" y="427.1" font-size="12.2" font-weight="400" fill="#111827" data-bx="45.0,383.0">có. Bé đang đứng ở chỗ còn tệ hơn trước khi nhảy.</text>
