<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">D1 → H1 → M5: CHoCH ở mỗi khung được quyền thay đổi điều gì?</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Bối cảnh chảy từ trên xuống. Một CHoCH ở khung nhỏ KHÔNG có quyền thay đổi kết luận của khung lớn.</text>
<rect x="28.0" y="98.5" width="944.0" height="118.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="28.0" y="98.5" width="110.0" height="118.0" rx="12" fill="#2563EB" fill-opacity="0.12"/>
<text x="83.0" y="152.5" font-size="26" font-weight="700" fill="#2563EB" text-anchor="middle">D1</text>
<text x="83.0" y="176.5" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">CONTEXT</text>
<text x="156.0" y="126.5" font-size="10.5" font-weight="400" fill="#6B7280">Sự kiện</text>
<text x="156.0" y="144.5" font-size="12.2" font-weight="700" fill="#111827" data-bx="155.0,397.0">D1 CHoCH (protected swing D1 bị đóng</text>
<text x="156.0" y="161.8" font-size="12.2" font-weight="700" fill="#111827" data-bx="155.0,397.0">nến xuyên)</text>
<text x="420.0" y="126.5" font-size="10.5" font-weight="400" fill="#6B7280">Được quyền</text>
<text x="420.0" y="144.5" font-size="12.2" font-weight="400" fill="#15803D" data-bx="419.0,741.0">Đặt CÂU HỎI cho daily bias. Bias đổi khi có thêm</text>
<text x="420.0" y="161.8" font-size="12.2" font-weight="400" fill="#15803D" data-bx="419.0,741.0">bằng chứng D1 (G2–G3), không phải ngay lập tức.</text>
<text x="760.0" y="126.5" font-size="10.5" font-weight="400" fill="#6B7280">KHÔNG được quyền</text>
<text x="760.0" y="144.5" font-size="12.2" font-weight="400" fill="#B91C1C" data-bx="759.0,961.0">Đổi entry M5? Không trực tiếp.</text>
<line x1="83.0" y1="218.5" x2="83.0" y2="228.5" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="83.0,234.5 78.5,227.8 87.5,227.8" fill="#6B7280"/>
<rect x="28.0" y="236.5" width="944.0" height="118.0" rx="12" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.6"/>
<rect x="28.0" y="236.5" width="110.0" height="118.0" rx="12" fill="#C026D3" fill-opacity="0.12"/>
<text x="83.0" y="290.5" font-size="26" font-weight="700" fill="#C026D3" text-anchor="middle">H1</text>
<text x="83.0" y="314.5" font-size="11" font-weight="700" fill="#C026D3" text-anchor="middle">SETUP</text>
<text x="156.0" y="264.5" font-size="10.5" font-weight="400" fill="#6B7280">Sự kiện</text>
<text x="156.0" y="282.5" font-size="12.2" font-weight="700" fill="#111827" data-bx="155.0,397.0">H1 CHoCH (protected swing H1)</text>
<text x="420.0" y="264.5" font-size="10.5" font-weight="400" fill="#6B7280">Được quyền</text>
<text x="420.0" y="282.5" font-size="12.2" font-weight="400" fill="#15803D" data-bx="419.0,741.0">Đổi trạng thái setup: đợt hồi H1 có thể đã kết thúc /</text>
<text x="420.0" y="299.8" font-size="12.2" font-weight="400" fill="#15803D" data-bx="419.0,741.0">setup mới đang hình thành.</text>
<text x="760.0" y="264.5" font-size="10.5" font-weight="400" fill="#6B7280">KHÔNG được quyền</text>
<text x="760.0" y="282.5" font-size="12.2" font-weight="400" fill="#B91C1C" data-bx="759.0,961.0">Đổi daily bias? KHÔNG.</text>
<line x1="83.0" y1="356.5" x2="83.0" y2="366.5" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="83.0,372.5 78.5,365.8 87.5,365.8" fill="#6B7280"/>
<rect x="28.0" y="374.5" width="944.0" height="118.0" rx="12" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="1.6"/>
<rect x="28.0" y="374.5" width="110.0" height="118.0" rx="12" fill="#0E9F6E" fill-opacity="0.12"/>
<text x="83.0" y="428.5" font-size="26" font-weight="700" fill="#0E9F6E" text-anchor="middle">M5</text>
<text x="83.0" y="452.5" font-size="11" font-weight="700" fill="#0E9F6E" text-anchor="middle">EXECUTION</text>
<text x="156.0" y="402.5" font-size="10.5" font-weight="400" fill="#6B7280">Sự kiện</text>
<text x="156.0" y="420.5" font-size="12.2" font-weight="700" fill="#111827" data-bx="155.0,397.0">M5 CHoCH / MSS tại POI H1</text>
<text x="420.0" y="402.5" font-size="10.5" font-weight="400" fill="#6B7280">Được quyền</text>
<text x="420.0" y="420.5" font-size="12.2" font-weight="400" fill="#15803D" data-bx="419.0,741.0">Là điều kiện kích hoạt cho mô hình vào lệnh — nếu</text>
<text x="420.0" y="437.8" font-size="12.2" font-weight="400" fill="#15803D" data-bx="419.0,741.0">D1, H1 đã cho phép.</text>
<text x="760.0" y="402.5" font-size="10.5" font-weight="400" fill="#6B7280">KHÔNG được quyền</text>
<text x="760.0" y="420.5" font-size="12.2" font-weight="400" fill="#B91C1C" data-bx="759.0,961.0">Đổi H1 / D1? KHÔNG.</text>
<rect x="28.0" y="514.5" width="944.0" height="50.5" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="28.0" y="514.5" width="4.0" height="50.5" rx="2" fill="#B45309"/>
<text x="42.0" y="534.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">Ngoại lệ duy nhất là khi bạn CHỦ ĐỘNG nghiên cứu mô hình ngược xu hướng — khi đó phải khai báo trước, ghi riêng trong journal và backtest riêng. Không</text>
<text x="42.0" y="551.7" font-size="12" font-weight="400" fill="#111827" data-bx="28.0,972.0">được “đổi luật” giữa lệnh.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đồng bộ với RULE-MSS-004 (note 21) và state machine D1–H1–M5 (01c - ICT 2022 Model).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
