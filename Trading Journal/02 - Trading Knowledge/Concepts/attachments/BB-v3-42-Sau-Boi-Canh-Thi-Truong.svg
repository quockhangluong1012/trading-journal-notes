<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="758.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Cùng một hình Breaker, sáu bối cảnh thị trường khác nhau</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Đường xám = giá. Ô xanh dương = vùng Breaker. Hình dạng tại chỗ có thể giống nhau; ý nghĩa thì phụ thuộc vào thứ đang diễn ra xung quanh.</text>
<rect x="28.0" y="94.5" width="306.0" height="306.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="13.5" font-weight="700" fill="#15803D" data-bx="41.0,323.0">A · Trong xu hướng TĂNG</text>
<rect x="153.6" y="203.8" width="153.4" height="8.6" rx="2" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,3"/>
<polyline points="49.5,276.1 87.8,231.3 115.2,252.0 153.6,207.3 186.5,258.9 241.3,176.3 268.7,207.3 307.0,155.7" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42.0" y="340.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="41.0,321.0">Nhịp hồi quét đáy cao hơn rồi phá đỉnh giữa.</text>
<text x="42.0" y="357.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="41.0,321.0">Bullish Breaker THUẬN xu hướng: bối cảnh ủng</text>
<text x="42.0" y="374.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="41.0,321.0">hộ.</text>
<rect x="347.0" y="94.5" width="306.0" height="306.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="361.0" y="120.0" font-size="13.5" font-weight="700" fill="#15803D" data-bx="360.0,642.0">B · Trong xu hướng GIẢM</text>
<rect x="472.6" y="226.2" width="153.4" height="8.6" rx="2" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,3"/>
<polyline points="368.5,162.5 406.8,207.3 434.2,186.6 472.6,231.3 505.5,179.7 560.3,262.3 587.7,231.3 626.0,282.9" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="361.0" y="340.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="360.0,640.0">Ảnh gương: nhịp hồi quét đỉnh thấp hơn rồi phá</text>
<text x="361.0" y="357.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="360.0,640.0">đáy giữa. Bearish Breaker THUẬN xu hướng.</text>
<rect x="666.0" y="94.5" width="306.0" height="306.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="680.0" y="120.0" font-size="13.5" font-weight="700" fill="#6B7280" data-bx="679.0,961.0">C · Trong vùng ĐI NGANG</text>
<rect x="775.2" y="200.4" width="169.9" height="6.9" rx="2" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,3"/>
<line x1="682.0" y1="196.9" x2="956.0" y2="196.9" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="682.0" y1="238.2" x2="956.0" y2="238.2" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
<polyline points="687.5,224.5 714.9,203.8 742.3,234.8 775.2,200.4 802.6,238.2 835.4,196.9 862.8,231.3 895.7,203.8 923.1,227.9 945.0,210.7" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="680.0" y="340.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,959.0">Đỉnh và đáy bị quét qua lại liên tục. “Breaker”</text>
<text x="680.0" y="357.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,959.0">mọc khắp nơi và hay bị xuyên. Phần lớn là</text>
<text x="680.0" y="374.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,959.0">nhiễu.</text>
<rect x="28.0" y="410.5" width="306.0" height="306.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="42.0" y="436.0" font-size="13.5" font-weight="700" fill="#B45309" data-bx="41.0,323.0">D · Lúc ĐẢO CHIỀU xu hướng</text>
<rect x="181.0" y="516.4" width="126.0" height="8.6" rx="2" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,3"/>
<polyline points="49.5,475.1 82.4,516.4 109.8,495.7 148.1,540.5 181.0,519.8 213.9,568.0 263.2,502.6 285.1,521.5 307.0,488.9" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42.0" y="656.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="41.0,321.0">Breaker đầu tiên NGƯỢC xu hướng cũ. Có thể là</text>
<text x="42.0" y="673.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="41.0,321.0">đảo chiều thật, có thể chỉ là nhịp hồi sâu. Cần</text>
<text x="42.0" y="690.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="41.0,321.0">khung lớn ủng hộ.</text>
<rect x="347.0" y="410.5" width="306.0" height="306.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="361.0" y="436.0" font-size="13.5" font-weight="700" fill="#7C3AED" data-bx="360.0,642.0">E · Sau một cú PHÁ GIẢ (false breakout)</text>
<rect x="505.5" y="540.5" width="120.6" height="6.9" rx="2" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,3"/>
<polyline points="368.5,557.7 401.4,523.3 434.2,547.3 472.6,523.3 505.5,543.9 538.4,506.1 571.2,561.1 598.6,545.6 626.0,581.7" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="361.0" y="656.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="360.0,640.0">Giá vượt đỉnh vùng rồi rơi lại: đó là mắt xích 2</text>
<text x="361.0" y="673.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="360.0,640.0">của một Bearish Breaker. Phá giả phía này =</text>
<text x="361.0" y="690.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="360.0,640.0">quét cho phía kia.</text>
<rect x="666.0" y="410.5" width="306.0" height="306.0" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="680.0" y="436.0" font-size="13.5" font-weight="700" fill="#B91C1C" data-bx="679.0,961.0">F · Chỉ có cú QUÉT, không có cú phá</text>
<line x1="758.7" y1="519.8" x2="956.0" y2="519.8" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5,4"/>
<text x="956.0" y="514.8" font-size="10" font-weight="700" fill="#475569" text-anchor="end">đỉnh giữa — chưa bị phá</text>
<polyline points="687.5,530.1 720.4,557.7 758.7,519.8 808.0,571.4 846.4,530.1 884.8,550.8 917.6,533.6 945.0,557.7" fill="none" stroke="#374151" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="680.0" y="656.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,959.0">Đáy cũ bị quét, giá bật lên nhưng KHÔNG vượt</text>
<text x="680.0" y="673.2" font-size="11.8" font-weight="400" fill="#111827" data-bx="679.0,959.0">được đỉnh giữa. Không có Breaker nào ở đây.</text>
<text x="28.0" y="727.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Thuận xu hướng (A, B) là bối cảnh mà khung ICT kỳ vọng Breaker hoạt động tốt nhất; C và F là nơi nhận diện máy móc gây hại nhiều nhất. Mọi kỳ vọng ở đây là</text>
<text x="28.0" y="744.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">[GIẢ THUYẾT].</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
