<text x="60.0" y="387.0" font-size="10.5" fill="#1D4ED8" font-weight="700" text-anchor="start">MSS: close đầu tiên dưới swing low H1, thân lớn</text>
<rect x="638.0" y="74.0" width="278.0" height="440.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="650.0" y="96.0" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">Ghi nhận theo thời gian</text>
<rect x="648.0" y="116.0" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<text x="655.0" y="133.0" font-size="11" fill="#6B7280" font-weight="700" text-anchor="start">T1 · Quan sát</text>
<text x="655.0" y="149.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Lower high dưới PDH; không có</text>
<text x="655.0" y="163.9" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">xuyên mức nào trong danh sách.</text>
<rect x="648.0" y="178.3" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="655.0" y="195.3" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">T2 · Đã xác nhận</text>
<text x="655.0" y="212.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">MSS giảm (theo định nghĩa MSS của</text>
<text x="655.0" y="226.2" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">vault) — sweep_before_mss = FALSE.</text>
<rect x="648.0" y="240.6" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="655.0" y="257.6" font-size="11" fill="#B45309" font-weight="700" text-anchor="start">Chưa xác nhận</text>
<text x="655.0" y="274.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">BSL phía trên còn nguyên → rủi ro giá</text>
<text x="655.0" y="288.5" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">quay lên lấy nó (mức chưa quét sau stop?).</text>
<rect x="648.0" y="302.9" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
<text x="655.0" y="319.9" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start">Không được làm</text>
<text x="655.0" y="336.8" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">Tìm một wick nhỏ M1 bất kỳ rồi gọi</text>
<text x="655.0" y="350.7" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">là &quot;sweep&quot; để hợp thức hóa.</text>
<rect x="648.0" y="365.1" width="258.0" height="54.3" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="655.0" y="382.1" font-size="11" fill="#1D4ED8" font-weight="700" text-anchor="start">Biến cần ghi</text>
<text x="655.0" y="399.1" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">MSS không sweep là một NHÓM riêng</text>
<text x="655.0" y="413.0" font-size="10.4" fill="#1F2937" font-weight="normal" text-anchor="start">để so sánh với MSS có sweep.</text>
<rect x="24.0" y="524.0" width="892.0" height="46.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="544.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Có ba nhóm cần so sánh: sweep + MSS, sweep không MSS, MSS không sweep. Nếu chỉ ghi nhóm đầu, bạn không thể biết</text>
<text x="40.0" y="559.5" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">sweep có đóng góp gì (ablation). Case D là đối chứng cần thiết, không phải ngoại lệ phải giấu.</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-18-Case-D-MSS-Khong-Sweep · Nến minh họa, giá giả định. T0…T5 = thứ tự thông tin xuất hiện; chỉ T5 là thông tin hậu kiểm (ex-post).</text>
