<svg viewBox="0 0 760 540" width="760" height="540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bản đồ vai trò: mỗi khái niệm giữ đúng một vai</title>
<desc>Bảy khái niệm và vai của chúng, năm câu hỏi cần thuộc lòng, và định nghĩa thế nào là bị bẫy.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="540" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">Bản đồ vai trò: mỗi khái niệm giữ đúng một vai</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">Trộn vai là nguồn gốc của phần lớn lập luận vòng tròn và “bẫy” tự tưởng tượng.</text>
<rect x="24" y="76" width="420" height="356" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="38" y="98" font-size="13" fill="#1F2937" font-weight="700">Khái niệm → vai</text>
<rect x="38" y="110" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<rect x="38" y="110" width="6" height="40" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="54" y="127" font-size="11.5" fill="#1F2937" font-weight="700">DOL</text>
<text x="54" y="142" font-size="10.5" fill="#4B5563">Xác định ĐÍCH</text>
<rect x="38" y="156" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
<rect x="38" y="156" width="6" height="40" rx="3" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="54" y="173" font-size="11.5" fill="#1F2937" font-weight="700">Con lắc ERL ↔ IRL</text>
<text x="54" y="188" font-size="10.5" fill="#4B5563">Xác định THỨ TỰ giá đi qua các mức</text>
<rect x="38" y="202" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.3"/>
<rect x="38" y="202" width="6" height="40" rx="3" fill="#1D9E75" stroke="#1D9E75" stroke-width="1"/>
<text x="54" y="219" font-size="11.5" fill="#1F2937" font-weight="700">Structure + displacement</text>
<text x="54" y="234" font-size="10.5" fill="#4B5563">Cung cấp BẰNG CHỨNG</text>
<rect x="38" y="248" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.3"/>
<rect x="38" y="248" width="6" height="40" rx="3" fill="#D85A30" stroke="#D85A30" stroke-width="1"/>
<text x="54" y="265" font-size="11.5" fill="#1F2937" font-weight="700">Premium / discount</text>
<text x="54" y="280" font-size="10.5" fill="#4B5563">Chọn CHỖ VÀO (quyết định R:R), không cho biết hướng</text>
<rect x="38" y="294" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.3"/>
<rect x="38" y="294" width="6" height="40" rx="3" fill="#6B7280" stroke="#6B7280" stroke-width="1"/>
<text x="54" y="311" font-size="11.5" fill="#1F2937" font-weight="700">Killzone / tin tức</text>
<text x="54" y="326" font-size="10.5" fill="#4B5563">Quyết định HÔM NAY có trade hay không</text>
<rect x="38" y="340" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="38" y="340" width="6" height="40" rx="3" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<text x="54" y="357" font-size="11.5" fill="#1F2937" font-weight="700">Cổng Mistake 13</text>
<text x="54" y="372" font-size="10.5" fill="#4B5563">Quyết định CHỖ ĐẶT STOP</text>
<rect x="38" y="386" width="392" height="40" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<rect x="38" y="386" width="6" height="40" rx="3" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="54" y="403" font-size="11.5" fill="#1F2937" font-weight="700">Baseline b/(a+b)</text>
<text x="54" y="418" font-size="10.5" fill="#4B5563">Cho biết SỰ THẬT (có edge hay chỉ là hình học)</text>
<rect x="460" y="76" width="276" height="356" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="474" y="98" font-size="13" fill="#1F2937" font-weight="700">Năm câu hỏi cần thuộc lòng</text>
<circle cx="482" cy="116" r="10" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="482" y="119.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="500" y="120" font-size="11" fill="#4B5563">Các bể thanh khoản nằm ở đâu, xét cả</text>
<text x="500" y="134.9" font-size="11" fill="#4B5563">hai phía?</text>
<circle cx="482" cy="161.8" r="10" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="482" y="165.3" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="500" y="165.8" font-size="11" fill="#4B5563">Bể nào còn nguyên?</text>
<circle cx="482" cy="192.70000000000002" r="10" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="482" y="196.20000000000002" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="500" y="196.70000000000002" font-size="11" fill="#4B5563">Phía nào vừa bị lấy, và đó là sweep</text>
<text x="500" y="211.60000000000002" font-size="11" fill="#4B5563">hay run?</text>
<circle cx="482" cy="238.50000000000003" r="10" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="482" y="242.00000000000003" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="500" y="242.50000000000003" font-size="11" fill="#4B5563">Đường tới đích có thông không?</text>
<circle cx="482" cy="269.40000000000003" r="10" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="482" y="272.90000000000003" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="500" y="273.40000000000003" font-size="11" fill="#4B5563">Horizon là bao lâu, và nếu sai thì</text>
<text x="500" y="288.3" font-size="11" fill="#4B5563">sai ở đâu?</text>
<text x="474" y="344" font-size="10.5" fill="#1F2937" font-weight="700">Không trả lời được câu 3 và 5 → kết</text>
<text x="474" y="358.2" font-size="10.5" fill="#1F2937" font-weight="700">luận hợp lệ là “không có DOL”, tức là</text>
<text x="474" y="372.4" font-size="10.5" fill="#1F2937" font-weight="700">không có trade.</text>
<rect x="24" y="446" width="712" height="78" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
<text x="38" y="468" font-size="13" fill="#92400E" font-weight="700">Thế nào là bị “bẫy”?</text>
<text x="38" y="486" font-size="10.5" fill="#92400E">Khi chính thanh khoản của bạn (stop, entry, TP) là thứ dễ bị lấy nhất ở bước tiếp theo. Tránh bẫy không phải là đoán ý</text>
<text x="38" y="500.2" font-size="10.5" fill="#92400E">đồ của smart money, mà là KHÔNG đứng vào những chỗ đó: pool chưa quét sau SL, SL sát râu nến, TP đúng tại mức, DOL đã</text>
<text x="38" y="514.4" font-size="10.5" fill="#92400E">giao, cửa sổ tin.</text>
</svg>
