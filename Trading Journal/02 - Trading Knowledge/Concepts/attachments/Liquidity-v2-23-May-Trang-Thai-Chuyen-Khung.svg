<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m0" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1F2937"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="600.0" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">Máy trạng thái theo dõi liquidity: khi nào chờ, khi nào xuống khung, khi nào quay lại</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Mỗi mũi tên có điều kiện. Trạng thái mặc định là CHỜ. Không trạng thái nào đồng nghĩa với &quot;vào lệnh&quot;.</text>
<rect x="40.0" y="120.0" width="190.0" height="86.0" rx="10" fill="#6B7280" fill-opacity="0.08" stroke="#6B7280" stroke-width="1.8"/>
<text x="135.0" y="144.0" font-size="13" fill="#6B7280" font-weight="700" text-anchor="middle">NOT READY</text>
<text x="135.0" y="166.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Giá xa mọi mức trong</text>
<text x="135.0" y="180.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">danh sách; theo dõi H1</text>
<rect x="290.0" y="120.0" width="190.0" height="86.0" rx="10" fill="#B45309" fill-opacity="0.08" stroke="#B45309" stroke-width="1.8"/>
<text x="385.0" y="144.0" font-size="13" fill="#B45309" font-weight="700" text-anchor="middle">MONITORING</text>
<text x="385.0" y="166.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Giá trong phạm vi mức;</text>
<text x="385.0" y="180.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">mở M5 để quan sát</text>
<rect x="540.0" y="120.0" width="190.0" height="86.0" rx="10" fill="#B91C1C" fill-opacity="0.08" stroke="#B91C1C" stroke-width="1.8"/>
<text x="635.0" y="144.0" font-size="13" fill="#B91C1C" font-weight="700" text-anchor="middle">EVENT</text>
<text x="635.0" y="166.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Mức đang bị xuyên;</text>
<text x="635.0" y="180.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">PENDING chờ phân xử</text>
<rect x="540.0" y="300.0" width="190.0" height="104.0" rx="10" fill="#1D4ED8" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="635.0" y="324.0" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="middle">CLASSIFIED</text>
<text x="635.0" y="346.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">E1/E2/E3/E4/E5/E6…</text>
<text x="635.0" y="360.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">+ xác nhận MSS/disp.?</text>
<text x="635.0" y="375.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">+ known_at</text>
<rect x="290.0" y="300.0" width="190.0" height="104.0" rx="10" fill="#7C3AED" fill-opacity="0.08" stroke="#7C3AED" stroke-width="1.8"/>
<text x="385.0" y="324.0" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">UPDATE MAP</text>
<text x="385.0" y="346.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Gạch mức đã tiêu</text>
<text x="385.0" y="360.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Cập nhật DOL state</text>
<text x="385.0" y="375.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Thêm mức mới (nếu có)</text>
<rect x="40.0" y="300.0" width="190.0" height="104.0" rx="10" fill="#374151" fill-opacity="0.08" stroke="#374151" stroke-width="1.8"/>
<text x="135.0" y="324.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">REASSESS D1</text>
<text x="135.0" y="346.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Có sự kiện ở khung D1</text>
<text x="135.0" y="360.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">(close + acceptance)</text>
<text x="135.0" y="375.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">→ vẽ lại bản đồ</text>
<rect x="780.0" y="210.0" width="136.0" height="104.0" rx="10" fill="#B45309" fill-opacity="0.08" stroke="#B45309" stroke-width="1.8"/>
<text x="848.0" y="234.0" font-size="13" fill="#B45309" font-weight="700" text-anchor="middle">UNDETERMINED</text>
<text x="848.0" y="256.0" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">Không đủ điều</text>
<text x="848.0" y="270.9" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">kiện phân loại</text>
<text x="848.0" y="285.8" font-size="10.8" fill="#1F2937" font-weight="normal" text-anchor="middle">→ EXPIRED, ghi lại</text>
<line x1="232.0" y1="150.0" x2="288.0" y2="150.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="260.0" y="142.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">vào phạm vi</text>
<line x1="288.0" y1="180.0" x2="232.0" y2="180.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="260.0" y="196.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">rời phạm vi</text>
<line x1="482.0" y1="150.0" x2="538.0" y2="150.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="510.0" y="142.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">xuyên L+ε</text>
<line x1="482.0" y1="180.0" x2="538.0" y2="180.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="510.0" y="174.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle"></text>
<text x="510.0" y="196.0" font-size="10" fill="#1F2937" font-weight="normal" text-anchor="start"></text>
<line x1="635.0" y1="208.0" x2="635.0" y2="298.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="642.0" y="246.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="start">trong k nến:</text>
<text x="642.0" y="260.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="start">rejection / acceptance</text>
<line x1="732.0" y1="190.0" x2="778.0" y2="240.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="770.0" y="206.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">hết k</text>
<line x1="538.0" y1="352.0" x2="482.0" y2="352.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="510.0" y="344.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">ghi nhãn</text>
<line x1="385.0" y1="298.0" x2="385.0" y2="210.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="392.0" y="256.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="start">quay lại</text>
<line x1="288.0" y1="370.0" x2="232.0" y2="370.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="260.0" y="362.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">nếu đổi D1</text>
<line x1="135.0" y1="298.0" x2="135.0" y2="210.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="142.0" y="256.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="start">bản đồ mới</text>
<line x1="848.0" y1="316.0" x2="732.0" y2="380.0" stroke="#1F2937" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="812.0" y="360.0" font-size="10.2" fill="#1F2937" font-weight="600" text-anchor="middle">ghi EXP</text>
<rect x="24.0" y="430.0" width="892.0" height="140.0" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="452.0" font-size="12" fill="#1F2937" font-weight="700" text-anchor="start">Điều kiện chuyển (v0.1, HEURISTIC — khai báo trước):</text>
<text x="40.0" y="474.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">NOT READY → MONITORING: |giá − L| ≤ 1.5·ATR(14,H1) VÀ trong killzone đã khai báo VÀ ngoài cửa sổ tin tier-1 (−10 → +15 phút).</text>
<text x="40.0" y="490.4" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">MONITORING → EVENT: high &gt; L+ε (BSL) / low &lt; L−ε (SSL) với L trong danh sách chốt trước phiên. Mức ngoài danh sách → &quot;unlisted breach&quot;.</text>
<text x="40.0" y="506.9" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">EVENT → CLASSIFIED: trong nến j + 3 nến M5: rejection (close &lt; L−δ BSL / &gt; L+δ SSL) hoặc acceptance (2 close liên tiếp bên kia / 1 close &gt; 0.5·ATR). Hết → EXP.</text>
<text x="40.0" y="523.3" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">CLASSIFIED → UPDATE MAP: luôn. Ghi E-code, known_at, MSS/displacement trong m nến (nếu có), trạng thái DOL. Không xóa nhãn cũ.</text>
<text x="40.0" y="539.7" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">UPDATE MAP → REASSESS D1: chỉ khi sự kiện xảy ra ở khung D1 (close D1 + acceptance qua mức trong &quot;điều kiện đánh giá lại&quot;).</text>
<text x="24.0" y="586.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-23 · Tham số k, ε, δ, killzone là quy ước vận hành của vault — cần khai báo cố định khi backtest.</text>
</svg>
