<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="600" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">OB trong khung D1 → H1 → M5 — vai trò, câu hỏi, và quyền quyết định của từng khung</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">D1 = CONTEXT · H1 = SETUP · M5 = EXECUTION. Một OB M5 không được phép lật kết luận của D1 (trừ khi đang nghiên cứu countertrend có khai báo).</text>
<rect x="26.0" y="84.0" width="928.0" height="136.0" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="44.0" y="114.0" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="start">D1 — CONTEXT</text>
<text x="44.0" y="140.0" font-size="9.6" font-weight="700" fill="#6B7280" text-anchor="start">câu hỏi</text>
<text x="44.0" y="160.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Ở đâu trong dealing range? Premium/discount?</text>
<text x="44.0" y="176.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">DOL nào? Cấu trúc lớn còn nguyên không?</text>
<text x="44.0" y="192.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">D1 OB = VÙNG chú ý (location), không phải entry</text>
<text x="520.0" y="140.0" font-size="9.6" font-weight="700" fill="#6B7280" text-anchor="start">cổng trước khi xuống khung dưới</text>
<text x="520.0" y="160.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">HTF OB còn 'sống' (chưa invalidated/superseded)?</text>
<text x="520.0" y="176.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">OB nằm trên đường tới DOL hay chặn đường?</text>
<line x1="490.0" y1="220.0" x2="490.0" y2="234.0" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<rect x="26.0" y="234.0" width="928.0" height="136.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="44.0" y="264.0" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="start">H1 — SETUP</text>
<text x="44.0" y="290.0" font-size="9.6" font-weight="700" fill="#6B7280" text-anchor="start">câu hỏi</text>
<text x="44.0" y="310.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Trong vùng D1, OB H1 nào là POI?</text>
<text x="44.0" y="326.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Lọc theo 8 cổng của 55 §9.3 (cấp swing, sweep,</text>
<text x="44.0" y="342.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">freshness, room tới DOL…) — KHAI BÁO trước</text>
<text x="520.0" y="290.0" font-size="9.6" font-weight="700" fill="#6B7280" text-anchor="start">cổng trước khi xuống khung dưới</text>
<text x="520.0" y="310.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Giá đã tới POI chưa (ARMED → TOUCHED)?</text>
<text x="520.0" y="326.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Có thanh khoản LTF chưa quét dưới distal không?</text>
<line x1="490.0" y1="370.0" x2="490.0" y2="384.0" stroke="#6B7280" stroke-width="2" marker-end="url(#aK)"/>
<rect x="26.0" y="384.0" width="928.0" height="136.0" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="44.0" y="414.0" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">M5 — EXECUTION</text>
<text x="44.0" y="440.0" font-size="9.6" font-weight="700" fill="#6B7280" text-anchor="start">câu hỏi</text>
<text x="44.0" y="460.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Có sự kiện: sweep → MSS → displacement?</text>
<text x="44.0" y="476.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Entry: FVG M5 (2022 Model) hoặc OB M5</text>
<text x="44.0" y="492.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Stop: cấu trúc M5 · Target: DOL H1/D1</text>
<text x="520.0" y="440.0" font-size="9.6" font-weight="700" fill="#6B7280" text-anchor="start">cổng trước khi xuống khung dưới</text>
<text x="520.0" y="460.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Có R:R tối thiểu tới DOL không?</text>
<text x="520.0" y="476.0" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Đang trong kill zone / không có tin trong ±N phút?</text>
<text x="26.0" y="556.0" font-size="10.4" font-weight="700" fill="#334155" text-anchor="start">Ghi chú: 'MTF confirmation có thực sự cần?' là câu hỏi thực nghiệm — HYP-OB-010 (M5 cùng hướng D1 bias vs ngược hướng).</text>
<text x="26.0" y="576.0" font-size="10.4" font-weight="700" fill="#334155" text-anchor="start">Lợi ích chắc chắn của MTF là KỶ LUẬT (ít lệnh, ít lựa chọn ex-post), không phải xác suất — xác suất phải đo.</text>
</svg>