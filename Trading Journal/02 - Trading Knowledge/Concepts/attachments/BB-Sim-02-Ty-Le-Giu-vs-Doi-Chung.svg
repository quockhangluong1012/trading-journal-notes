<text x="604.0" y="348.0" font-size="11.2" font-weight="600" fill="#334155" text-anchor="start">Phá càng xa (cú phá càng mạnh) → retest càng ít; tỷ lệ giữ</text>
<text x="604.0" y="363.5" font-size="11.2" font-weight="600" fill="#334155" text-anchor="start">vẫn quanh một nửa. Trên dữ liệu thật, phải tách hiệu ứng hình</text>
<text x="604.0" y="378.9" font-size="11.2" font-weight="600" fill="#334155" text-anchor="start">học này ra trước khi kết luận “displacement giúp Breaker tốt</text>
<text x="604.0" y="394.4" font-size="11.2" font-weight="600" fill="#334155" text-anchor="start">hơn”.</text>
