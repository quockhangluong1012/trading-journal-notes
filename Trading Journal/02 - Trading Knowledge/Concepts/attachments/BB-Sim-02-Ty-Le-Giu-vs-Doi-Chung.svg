<text x="38.0" y="494.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Hệ quả cho nghiên cứu của bạn</text>
<text x="38.0" y="513.7" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">Câu hỏi đúng KHÔNG phải “Breaker có giữ giá không?” mà là “trên dữ liệu thật, Breaker có giữ NHIỀU HƠN vùng đối chứng cùng độ rộng, cùng khoảng cách, cùng</text>
<text x="38.0" y="529.2" font-size="11.4" font-weight="400" fill="#1F2937" text-anchor="start">thời điểm không — sau chi phí?”. Mô phỏng chỉ cho baseline; nó không chứng minh ICT sai hay đúng. [SIMULATION]</text>
