<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1F2937">Case study — cùng "đặt limit tại CE", hai thị trường cho hai kết quả</text>
  <text x="24" y="52" font-size="13" fill="#6B7280">Fill-rate của CE khác nhau theo sản phẩm: NAS100 hay shallow-respect, EURUSD hay retrace sâu tới CE.</text>

  <!-- LEFT: NAS100 shallow respect (miss) -->
  <rect x="24" y="68" width="350" height="300" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <rect x="24" y="68" width="350" height="30" rx="8" fill="#FEE2E2"/>
  <text x="38" y="88" font-size="13" font-weight="800" fill="#B91C1C">NAS100 — shallow respect → LỠ lệnh</text>

  <rect x="90" y="180" width="250" height="60" fill="#16A34A" opacity="0.15"/>
  <line x1="90" y1="200" x2="340" y2="200" stroke="#166534" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="96" y="196" font-size="9" fill="#166534">mép trên FVG</text>
  <line x1="90" y1="210" x2="340" y2="210" stroke="#166534" stroke-width="1.6"/>
  <text x="250" y="207" font-size="9" font-weight="700" fill="#166534">CE (limit đặt ở đây)</text>
  <!-- price rejects at upper edge before reaching CE -->
  <path d="M60,300 L95,250 L120,270 L150,205 L175,203" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="160" cy="200" r="5" fill="#DC2626"/>
  <text x="120" y="180" font-size="9" fill="#B91C1C">reject ở mép, chưa tới CE</text>
  <path d="M175,203 L205,160 L235,178 L270,120 L305,130" fill="none" stroke="#16A34A" stroke-width="2.6"/>
  <text x="220" y="150" font-size="9.5" font-weight="700" fill="#166534">giá chạy — limit CE không khớp</text>
  <text x="40" y="352" font-size="10.5" fill="#374151">→ Setup thắng nhưng bạn không có lệnh</text>

  <!-- RIGHT: EURUSD deep fill -->
  <rect x="386" y="68" width="350" height="300" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <rect x="386" y="68" width="350" height="30" rx="8" fill="#DCFCE7"/>
  <text x="400" y="88" font-size="13" font-weight="800" fill="#166534">EURUSD — retrace sâu tới CE → khớp</text>

  <rect x="452" y="180" width="250" height="60" fill="#16A34A" opacity="0.15"/>
  <line x1="452" y1="200" x2="702" y2="200" stroke="#166534" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="458" y="196" font-size="9" fill="#166534">mép trên FVG</text>
  <line x1="452" y1="210" x2="702" y2="210" stroke="#166534" stroke-width="1.6"/>
  <text x="612" y="207" font-size="9" font-weight="700" fill="#166534">CE (limit khớp ✓)</text>
  <path d="M422,300 L457,250 L482,268 L512,215 L540,222 L560,211" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="556" cy="210" r="5" fill="#16A34A"/>
  <text x="470" y="255" font-size="9" fill="#166534">chạm đúng CE + M5 MSS</text>
  <path d="M560,211 L590,165 L620,182 L660,120 L695,132" fill="none" stroke="#16A34A" stroke-width="2.6"/>
  <text x="580" y="150" font-size="9.5" font-weight="700" fill="#166534">delivery lên → R:R tốt hơn mép</text>
  <text x="400" y="352" font-size="10.5" fill="#374151">→ Vào CE tối ưu: stop gọn, R:R lớn</text>

  <rect x="24" y="376" width="712" height="52" rx="6" fill="#EDE9FE"/>
  <text x="36" y="396" font-size="11.5" font-weight="700" fill="#5B21B6">Bài học: "vào tại CE" không phải quy tắc phổ quát — nó phụ thuộc phân bố ĐỘ SÂU RETRACE của từng sản phẩm/phiên.</text>
  <text x="36" y="416" font-size="11.5" fill="#5B21B6">Backtest 20–30 mẫu/sản phẩm: nếu hay shallow-respect → chia đôi (nửa mép + nửa CE); nếu hay retrace sâu → đặt trọn CE.</text>
</svg>
