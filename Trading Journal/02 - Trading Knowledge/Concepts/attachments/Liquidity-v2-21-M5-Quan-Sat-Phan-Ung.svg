<text x="649.0" y="124.8" font-size="10.6" fill="#B45309" font-weight="normal" text-anchor="start">08:35 — Nến xuyên L (PENETRATED), rồi</text>
<text x="649.0" y="139.5" font-size="10.6" fill="#1D4ED8" font-weight="normal" text-anchor="start">   close (08:40) &gt; L + δ → SWEEP (E2)</text>
<text x="649.0" y="154.1" font-size="10.6" fill="#1D4ED8" font-weight="normal" text-anchor="start">   known_at = 08:40, không phải 08:35</text>
<text x="649.0" y="168.7" font-size="10.6" fill="#15803D" font-weight="normal" text-anchor="start">09:05 — Close trên swing high M5, thân</text>
<text x="649.0" y="183.3" font-size="10.6" fill="#15803D" font-weight="normal" text-anchor="start">   lớn, để lại FVG → REVERSAL CONF.</text>
<text x="649.0" y="198.0" font-size="10.6" fill="#1F2937" font-weight="700" text-anchor="start">Đã xác nhận: sự kiện SWEEP + MSS M5</text>
<text x="649.0" y="212.6" font-size="10.6" fill="#1F2937" font-weight="700" text-anchor="start">Vẫn là giả thuyết: giá hồi tới EQH H1</text>
