<text x="649.0" y="366.2" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">MSS M5 ≠ đảo chiều D1. Nó chỉ nói cấu trúc</text>
<text x="649.0" y="380.8" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">M5 đã đổi. D1 đổi khi có sự kiện ở khung D1.</text>
<text x="649.0" y="395.5" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Một wick M5 bất kỳ không được gắn nhãn</text>
<text x="649.0" y="410.1" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">&quot;liquidity event&quot; nếu mức không có trong</text>
<text x="649.0" y="424.7" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">danh sách đã chốt (&quot;unlisted breach&quot;).</text>
<rect x="24.0" y="552.0" width="892.0" height="52.0" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="40.0" y="573.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Phân biệt 5 lớp: (1) sự kiện đã xảy ra · (2) cách phân loại (E-code) · (3) ý nghĩa với cấu trúc · (4) giả thuyết tiếp theo ·</text>
<text x="40.0" y="590.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">(5) kết quả thực tế — chỉ biết sau. Kết thúc phân tích M5 khi sự kiện được phân loại xong, KHÔNG phải khi &quot;có lệnh&quot;.</text>
<text x="24.0" y="626.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-21 · Nến M5 minh họa, giá và giờ giả định (giờ New York).</text>
