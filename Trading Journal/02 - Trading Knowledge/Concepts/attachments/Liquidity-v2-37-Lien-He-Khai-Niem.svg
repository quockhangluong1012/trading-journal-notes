<text x="600.0" y="92.0" font-size="12.5" fill="#1F2937" font-weight="700" text-anchor="start">Bảy nhãn — bảy loại đối tượng</text>
<rect x="600.0" y="104.0" width="316.0" height="54.0" rx="7" fill="#1D4ED8" fill-opacity="0.07" stroke="#1D4ED8" stroke-width="1"/>
<circle cx="616.0" cy="122.0" r="9" fill="#1D4ED8"/>
<text x="616.0" y="126.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="632.0" y="126.0" font-size="11.6" fill="#1D4ED8" font-weight="700" text-anchor="start">Liquidity (SSL)</text>
<text x="905.0" y="126.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">MỨC giá</text>
<text x="612.0" y="146.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Lệnh có điều kiện có thể ở đâu?</text>
<rect x="600.0" y="164.0" width="316.0" height="54.0" rx="7" fill="#16A34A" fill-opacity="0.07" stroke="#16A34A" stroke-width="1"/>
<circle cx="616.0" cy="182.0" r="9" fill="#16A34A"/>
<text x="616.0" y="186.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="632.0" y="186.0" font-size="11.6" fill="#16A34A" font-weight="700" text-anchor="start">POI (OB/FVG H1)</text>
<text x="905.0" y="186.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">VÙNG giá</text>
<text x="612.0" y="206.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Phản ứng có thể ở đâu?</text>
<rect x="600.0" y="224.0" width="316.0" height="54.0" rx="7" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1"/>
<circle cx="616.0" cy="242.0" r="9" fill="#B45309"/>
<text x="616.0" y="246.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="632.0" y="246.0" font-size="11.6" fill="#B45309" font-weight="700" text-anchor="start">Sweep</text>
<text x="905.0" y="246.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">SỰ KIỆN</text>
<text x="612.0" y="266.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Giá đã xuyên mức rồi quay lại chưa?</text>
<rect x="600.0" y="284.0" width="316.0" height="54.0" rx="7" fill="#0F766E" fill-opacity="0.07" stroke="#0F766E" stroke-width="1"/>
<circle cx="616.0" cy="302.0" r="9" fill="#0F766E"/>
<text x="616.0" y="306.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="632.0" y="306.0" font-size="11.6" fill="#0F766E" font-weight="700" text-anchor="start">Displacement</text>
<text x="905.0" y="306.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">TÍNH CHẤT</text>
<text x="612.0" y="326.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Chuyển động có mạnh bất thường?</text>
<rect x="600.0" y="344.0" width="316.0" height="54.0" rx="7" fill="#0F766E" fill-opacity="0.07" stroke="#0F766E" stroke-width="1"/>
<circle cx="616.0" cy="362.0" r="9" fill="#0F766E"/>
<text x="616.0" y="366.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="632.0" y="366.0" font-size="11.6" fill="#0F766E" font-weight="700" text-anchor="start">FVG</text>
<text x="905.0" y="366.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">DẤU VẾT</text>
<text x="612.0" y="386.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Chuyển động để lại khoảng trống?</text>
<rect x="600.0" y="404.0" width="316.0" height="54.0" rx="7" fill="#C2410C" fill-opacity="0.07" stroke="#C2410C" stroke-width="1"/>
<circle cx="616.0" cy="422.0" r="9" fill="#C2410C"/>
<text x="616.0" y="426.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="632.0" y="426.0" font-size="11.6" fill="#C2410C" font-weight="700" text-anchor="start">MSS</text>
<text x="905.0" y="426.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">SỰ KIỆN cấu trúc</text>
<text x="612.0" y="446.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Swing có ý nghĩa đã bị phá?</text>
<rect x="600.0" y="464.0" width="316.0" height="54.0" rx="7" fill="#7C3AED" fill-opacity="0.07" stroke="#7C3AED" stroke-width="1"/>
<circle cx="616.0" cy="482.0" r="9" fill="#7C3AED"/>
<text x="616.0" y="486.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="632.0" y="486.0" font-size="11.6" fill="#7C3AED" font-weight="700" text-anchor="start">DOL</text>
<text x="905.0" y="486.0" font-size="10" fill="#6B7280" font-weight="700" text-anchor="end">MỤC TIÊU (giả thuyết)</text>
<text x="612.0" y="506.0" font-size="10.6" fill="#1F2937" font-weight="normal" text-anchor="start">Giá có thể hướng tới đâu?</text>
<rect x="24.0" y="534.0" width="892.0" height="70.0" rx="8" fill="#FFF7E6" stroke="#B45309" stroke-width="1"/>
<text x="40.0" y="555.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">Đếm trùng: &quot;sweep + displacement + FVG + MSS&quot; thường là MỘT chuyển động được mô tả bốn lần — không phải bốn bằng chứng</text>
<text x="40.0" y="572.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">độc lập. Tương tự &quot;POI ở Discount&quot; + &quot;gần SSL range low&quot; thường là cùng một thông tin vị trí. Khi chấm điểm confluence,</text>
<text x="40.0" y="589.0" font-size="11.2" fill="#1F2937" font-weight="normal" text-anchor="start">gom các nhãn cùng nguồn thông tin lại thành một biến, rồi đo giá trị gia tăng của từng lớp (ablation).</text>
<text x="24.0" y="626.0" font-size="10.5" fill="#9CA3AF" font-weight="normal" text-anchor="start" font-style="italic">Liquidity-v2-37 · Chuỗi giá minh họa (bullish). Định nghĩa từng khái niệm ở note riêng: FVG, MSS, OB, Displacement, DOL.</text>
