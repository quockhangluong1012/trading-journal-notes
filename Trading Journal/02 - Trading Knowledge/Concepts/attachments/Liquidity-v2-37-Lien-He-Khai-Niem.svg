<text x="24.0" y="56.0" font-size="12.5" fill="#6B7280" font-weight="normal" text-anchor="start">Cùng một chuỗi giá, bảy nhãn. Lẫn loại đối tượng (mức / vùng / sự kiện / tính chất / mục tiêu) là nguồn của đếm-trùng bằng chứng.</text>
