<rect x="642.0" y="92.5" width="330.0" height="503.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Thứ tự giá gặp khi hồi về</text>
<circle cx="666.0" cy="140.5" r="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="144.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="684.0" y="144.5" font-size="12.3" font-weight="700" fill="#2563EB">Breaker — nông nhất</text>
<text x="684.0" y="160.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Nến tăng ở đỉnh giữa đã bị phá. Hồi ít nhất là tới</text>
<text x="684.0" y="177.2" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">đây.</text>
<circle cx="666.0" cy="197.6" r="10.0" fill="#0891B2" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="201.6" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="684.0" y="201.6" font-size="12.3" font-weight="700" fill="#0891B2">FVG</text>
<text x="684.0" y="217.9" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Khoảng trống của nhịp phá. Sâu hơn Breaker</text>
<text x="684.0" y="234.4" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">(trong ví dụ này).</text>
<circle cx="666.0" cy="254.8" r="10.0" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="258.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="684.0" y="258.8" font-size="12.3" font-weight="700" fill="#D97706">Order Block</text>
<text x="684.0" y="275.1" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Nến giảm cuối cùng trước nhịp tăng — nằm ở</text>
<text x="684.0" y="291.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">đáy mới.</text>
<circle cx="666.0" cy="312.0" r="10.0" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="316.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="684.0" y="316.0" font-size="12.3" font-weight="700" fill="#7C3AED">Rejection Block</text>
<text x="684.0" y="332.3" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">Phần râu dưới của đáy mới. Sâu nhất; qua nữa là</text>
<text x="684.0" y="348.7" font-size="11.6" font-weight="400" fill="#111827" data-bx="683.0,959.0">ý tưởng sai.</text>
<rect x="656.0" y="375.2" width="302.0" height="85.4" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="375.2" width="4.0" height="85.4" rx="2" fill="#475569"/>
<text x="670.0" y="395.1" font-size="11.6" font-weight="700" fill="#475569" data-bx="656.0,958.0">Chọn vùng nào?</text>
<text x="670.0" y="414.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Vùng nông cho giá vào sớm nhưng mức dừng xa.</text>
<text x="670.0" y="431.0" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Vùng sâu cho mức dừng gần nhưng hay lỡ lệnh.</text>
<text x="670.0" y="447.5" font-size="11.6" font-weight="400" fill="#111827" data-bx="656.0,958.0">Không vùng nào “đúng hơn” — đó là đánh đổi.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Nếu hai vùng “nói” khác nhau (Breaker bị thủng nhưng FVG bên dưới giữ): ý tưởng tăng chưa sai, nhưng vùng Breaker đã sai. Ghi riêng từng vùng.</text>
