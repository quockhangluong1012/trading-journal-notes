<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Khi giá hồi về, nó gặp các vùng theo thứ tự từ nông tới sâu. Bốn vùng này sinh ra từ cùng MỘT nhịp tăng — đừng đếm chúng như bốn phiếu bầu.</text>
