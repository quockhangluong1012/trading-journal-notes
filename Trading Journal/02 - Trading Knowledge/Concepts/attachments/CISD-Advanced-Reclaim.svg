<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="760" height="450" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1F2937">Opening-price reclaim — CISD ở "độ phân giải trong ngày"</text>
  <text x="24" y="54" font-size="12.5" fill="#6B7280">Midnight Open (00:00 ET) / NDOG / NWOG làm mốc delivery gốc: dưới open = discount, trên open = premium</text>
  <rect x="24" y="70" width="712" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- opening price line -->
  <line x1="60" y1="230" x2="700" y2="230" stroke="#7C3AED" stroke-width="2.4"/>
  <text x="470" y="222" font-size="11" font-weight="700" fill="#6D28D9">OPEN trong ngày (giá trị công bằng)</text>
  <rect x="60" y="90" width="640" height="140" fill="#DBEAFE" opacity="0.35"/>
  <text x="70" y="110" font-size="10.5" font-weight="700" fill="#1D4ED8">PREMIUM (trên open — đắt)</text>
  <rect x="60" y="230" width="640" height="180" fill="#FEE2E2" opacity="0.35"/>
  <text x="70" y="250" font-size="10.5" font-weight="700" fill="#B91C1C">DISCOUNT (dưới open — rẻ)</text>

  <!-- price pushed below open to sweep SSL -->
  <rect x="120" y="220" width="2" height="40" fill="#DC2626"/><rect x="112" y="222" width="14" height="30" fill="#DC2626" rx="1"/>
  <rect x="152" y="248" width="2" height="52" fill="#DC2626"/><rect x="144" y="252" width="14" height="42" fill="#DC2626" rx="1"/>
  <rect x="184" y="288" width="2" height="72" fill="#DC2626"/><rect x="176" y="294" width="14" height="52" fill="#DC2626" rx="1"/>
  <line x1="112" y1="360" x2="330" y2="360" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="118" y="378" font-size="10" font-weight="700" fill="#B45309">① Manipulation: đẩy xuống sweep SSL (gom hàng rẻ)</text>
  <circle cx="185" cy="360" r="7" fill="none" stroke="#B45309" stroke-width="2.2"/>

  <!-- green candle reclaiming open -->
  <rect x="240" y="150" width="2" height="220" fill="#16A34A"/><rect x="232" y="168" width="16" height="188" fill="#16A34A" rx="1"/>
  <text x="256" y="160" font-size="10.5" font-weight="700" fill="#15803D">② Nến đóng TRỞ LẠI trên open = reclaim = CISD trong ngày</text>

  <!-- continuation up -->
  <path d="M248,200 L330,160 L440,130 L560,118" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="440" y="112" font-size="10.5" font-weight="700" fill="#15803D">③ Xác nhận bias bullish của ngày → về BSL</text>

  <text x="40" y="420" font-size="10.5" fill="#6B7280">Confluence mạnh nhất: reclaim open TRÙNG NDOG/NWOG, hoặc trùng CE của một FVG HTF.</text>
</svg>
