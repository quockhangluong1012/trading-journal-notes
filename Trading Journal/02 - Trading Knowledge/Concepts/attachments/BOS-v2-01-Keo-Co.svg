<svg viewBox="0 0 900 480" width="900" height="480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>BOS giải thích cho bé 5 tuổi: trò kéo co dựng đứng</title>
<desc>BOS giải thích cho bé 5 tuổi: trò kéo co dựng đứng. Hai nhóm kéo một sợi dây dựng đứng. Dải ruy băng đỏ là &quot;giá&quot;. Mỗi lần ruy băng lên cao nhất, ta kẻ một vạch. Kéo vượt vạch cũ = phe kéo lên vừa làm được điều mà lần trước chưa làm được.</desc>
<defs><marker id="ar_ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1F2937" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D8DBE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FBFBFD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#7C3AED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#F3F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="480" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="18" fill="#1F2937" text-anchor="start"><tspan font-weight="700">BOS giải thích cho bé 5 tuổi: trò kéo co dựng đứng</tspan></text>
<text x="24.0" y="55.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>Hai nhóm kéo một sợi dây dựng đứng. Dải ruy băng đỏ là &quot;giá&quot;. Mỗi lần ruy băng lên cao nhất, ta kẻ một vạch. Kéo vượt vạch cũ = phe kéo lên</tspan></text>
<text x="24.0" y="72.0" font-size="12.5" fill="#6B7280" text-anchor="start"><tspan>vừa làm được điều mà lần trước chưa làm được.</tspan></text>
<rect x="24.0" y="96.0" width="420.0" height="268.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="34.0" y="116.0" font-size="13" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Sân kéo co</tspan></text>
<rect x="100.0" y="126.0" width="220.0" height="26.0" rx="13" fill="#E8F6F0" stroke="#1D9E75" stroke-width="1.0"/>
<text x="210.0" y="144.0" font-size="12" fill="#1D9E75" text-anchor="middle"><tspan font-weight="700">PHE KÉO LÊN (người mua gấp)</tspan></text>
<rect x="98.0" y="330.0" width="224.0" height="26.0" rx="13" fill="#FDECEC" stroke="#DC2626" stroke-width="1.0"/>
<text x="210.0" y="348.0" font-size="12" fill="#DC2626" text-anchor="middle"><tspan font-weight="700">PHE KÉO XUỐNG (người bán gấp)</tspan></text>
<line x1="210.0" y1="154.0" x2="210.0" y2="328.0" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
<line x1="192.0" y1="268.0" x2="228.0" y2="268.0" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
<text x="140.0" y="272.0" font-size="10.5" fill="#6B7280" text-anchor="end"><tspan>lần 1</tspan></text>
<line x1="192.0" y1="238.0" x2="228.0" y2="238.0" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
<text x="140.0" y="242.0" font-size="10.5" fill="#6B7280" text-anchor="end"><tspan>lần 2</tspan></text>
<line x1="150.0" y1="238.0" x2="400.0" y2="238.0" stroke="#D85A30" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="398.0" y="256.0" font-size="11" fill="#D85A30" text-anchor="end"><tspan font-weight="700">vạch cao nhất lần trước</tspan></text>
<path d="M196,196 L224,186 L224,206 Z" fill="#DC2626"/>
<path d="M224,196 L196,186 L196,206 Z" fill="#DC2626" opacity="0.8"/>
<line x1="250.0" y1="232.0" x2="250.0" y2="200.0" stroke="#1D9E75" stroke-width="2" stroke-linecap="round" marker-end="url(#ar_green)"/>
<text x="260.0" y="200.0" font-size="12.5" fill="#1D9E75" text-anchor="start"><tspan font-weight="700">Lần này: vượt vạch cũ!</tspan></text>
<text x="260.0" y="216.0" font-size="11.5" fill="#6B7280" text-anchor="start"><tspan>= &quot;phá kỷ lục&quot; cũ</tspan></text>
<rect x="470.0" y="96.0" width="406.0" height="268.0" rx="8" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.0"/>
<text x="480.0" y="116.0" font-size="13" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Cùng ý tưởng trên biểu đồ giá</tspan></text>
<polyline points="486.0,325.0 573.0,244.4 616.5,278.9 703.4,198.3 746.9,232.9 833.9,140.8" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="703.4" y1="198.3" x2="851.3" y2="198.3" stroke="#D85A30" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="851.3" y="212.3" font-size="11" fill="#D85A30" text-anchor="end"><tspan>đỉnh cũ = &quot;vạch&quot;</tspan></text>
<circle cx="703.4" cy="198.3" r="3.6" fill="#D85A30"/>
<circle cx="779.5" cy="198.3" r="5" fill="#1D9E75"/>
<line x1="779.5" y1="198.3" x2="729.5" y2="286.4" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
<text x="729.5" y="298.4" font-size="11.5" fill="#1D9E75" text-anchor="start"><tspan>giá vượt đỉnh cũ</tspan></text>
<text x="729.5" y="312.9" font-size="11.5" fill="#1D9E75" text-anchor="start"><tspan>= ứng viên BOS tăng</tspan></text>
<rect x="24.0" y="378.0" width="852.0" height="88.0" rx="8" fill="#FEF7E6" stroke="#B45309" stroke-width="1.0"/>
<rect x="24.0" y="378.0" width="5.0" height="88.0" rx="2" fill="#B45309"/>
<text x="38.0" y="398.0" font-size="13" fill="#B45309" text-anchor="start"><tspan font-weight="700">Giới hạn của phép so sánh (phải nhớ)</tspan></text>
<text x="38.0" y="417.9" font-size="12" fill="#1F2937" text-anchor="start"><tspan>Thị trường KHÔNG có hai đội cố định. Mỗi giao dịch luôn có một người mua và một người bán với cùng số lượng. Giá đi lên không vì &quot;bên mua</tspan></text>
<text x="38.0" y="434.5" font-size="12" fill="#1F2937" text-anchor="start"><tspan>đông hơn&quot;, mà vì người mua GẤP (chấp nhận trả giá cao) ăn hết hàng của người bán đang chờ. Vạch mới chỉ cho biết bên nào đang gấp hơn ở</tspan></text>
<text x="38.0" y="451.1" font-size="12" fill="#1F2937" text-anchor="start"><tspan>thời điểm đó, không cho biết ai thắng cả trận.</tspan></text>
</svg>
