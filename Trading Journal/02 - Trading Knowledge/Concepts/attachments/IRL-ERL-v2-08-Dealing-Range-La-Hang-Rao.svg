<text x="913.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">DEALING RANGE</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Dealing Range là hàng rào: không có hàng rào thì không có “bên trong” và “bên</text>
<text x="28.0" y="66.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">ngoài”</text>
<text x="28.0" y="90.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Dealing range = vùng giá giữa một swing low có ý nghĩa và một swing high có ý nghĩa. Nó là mốc tham chiếu để gọi tên IRL/ERL, premium/discount.</text>
