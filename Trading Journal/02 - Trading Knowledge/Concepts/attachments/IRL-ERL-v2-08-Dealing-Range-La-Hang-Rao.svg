<text x="678.0" y="136.0" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start">1 · Chọn hàng rào trước</text>
<text x="678.0" y="157.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">Câu hỏi “mức này là IRL hay ERL?” chỉ có nghĩa</text>
<text x="678.0" y="174.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">khi đã nói rõ: so với RANGE NÀO, trên KHUNG</text>
<text x="678.0" y="190.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">NÀO.</text>
<rect x="662.0" y="259.0" width="310.0" height="138.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="662.0" y="269.0" width="4.0" height="118.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1.2"/>
<text x="678.0" y="282.0" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">2 · Range không cần đi ngang</text>
<text x="678.0" y="303.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">Một nhịp tăng từ swing low tới swing high cũng là</text>
<text x="678.0" y="320.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">một dealing range. Đi ngang chỉ là một trường</text>
<text x="678.0" y="336.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">hợp đặc biệt.</text>
<rect x="662.0" y="405.0" width="310.0" height="138.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="662.0" y="415.0" width="4.0" height="118.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="678.0" y="428.0" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">3 · Đổi range → đổi nhãn</text>
<text x="678.0" y="449.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">Khi giá phá biên và được chấp nhận bên ngoài, ta</text>
<text x="678.0" y="466.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">vẽ range mới. ERL cũ có thể trở thành IRL của</text>
<text x="678.0" y="482.7" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="280.0">range mới.</text>
<rect x="28.0" y="557.0" width="944.0" height="51.6" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="581.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Liên kết: cách chọn swing “có ý nghĩa” được nghiên cứu riêng ở note Dealing Range (12) và Re-mapping Dealing Range (37). Note này chỉ dùng range như mốc</text>
<text x="42.0" y="597.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">tham chiếu.</text>
