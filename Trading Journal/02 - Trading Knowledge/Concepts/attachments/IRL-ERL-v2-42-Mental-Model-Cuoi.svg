<text x="930.7" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">TỔNG KẾT</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mental model cuối cùng: hàng rào — kho bên ngoài — trạm bên trong — và bốn câu hỏi</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Nếu chỉ nhớ một hình, hãy nhớ hình này. Mọi phần khác của note là chi tiết của bốn câu hỏi bên phải.</text>
