<text x="450.5" y="355.0" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">trạm: FVG</text>
<text x="63.1" y="447.8" font-size="10" font-weight="700" fill="#92400E" text-anchor="start">HÀNG RÀO (range + khung)</text>
<rect x="564.0" y="87.0" width="408.0" height="111.5" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="564.0" y="97.0" width="4.0" height="91.5" rx="2" fill="#92400E" stroke="none" stroke-width="1.2"/>
<text x="580.0" y="110.0" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start">1 · Hàng rào nào?</text>
<text x="580.0" y="131.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">Range tham chiếu, khung nào, hai biên ở đâu. Không có hàng rào</text>
<text x="580.0" y="148.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">⇒ không có IRL/ERL.</text>
<rect x="564.0" y="206.5" width="408.0" height="111.5" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="564.0" y="216.5" width="4.0" height="91.5" rx="2" fill="#7C3AED" stroke="none" stroke-width="1.2"/>
<text x="580.0" y="229.5" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="start">2 · Đã lấy gì, còn gì?</text>
<text x="580.0" y="251.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">Kho ngoài nào đã bị chạm? Trạm trong nào đã được ghé? Đánh</text>
<text x="580.0" y="267.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">dấu xám ngay khi bị lấy.</text>
<rect x="564.0" y="326.0" width="408.0" height="111.5" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="564.0" y="336.0" width="4.0" height="91.5" rx="2" fill="#059669" stroke="none" stroke-width="1.2"/>
<text x="580.0" y="349.0" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">3 · Đang đi về đâu?</text>
<text x="580.0" y="370.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">DOL là MỘT giả thuyết: thường là kho ngoài phía chưa bị lấy; ngay</text>
<text x="580.0" y="387.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">sau khi một kho bị lấy, thường là trạm bên trong.</text>
<rect x="564.0" y="445.5" width="408.0" height="111.5" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<rect x="564.0" y="455.5" width="4.0" height="91.5" rx="2" fill="#2563EB" stroke="none" stroke-width="1.2"/>
<text x="580.0" y="468.5" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">4 · Bằng chứng nào?</text>
<text x="580.0" y="490.1" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">Phản ứng tại trạm, sweep + đóng cửa quay lại, displacement,</text>
<text x="580.0" y="506.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start" data-maxw="378.0">MSS. Không có bằng chứng ⇒ không có lệnh.</text>
<rect x="28.0" y="571.0" width="944.0" height="51.6" rx="10" fill="#FFFBEB" stroke="#F5D08A" stroke-width="1.2"/>
<text x="42.0" y="595.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Một câu cho trẻ 5 tuổi: “Quả bóng lăn trong vườn, ghé đồ chơi bên trong, rồi có lúc nhảy ra lấy đồ ngoài rào. Ta không biết chắc nó sẽ đi đâu — ta chỉ nhìn xem</text>
<text x="42.0" y="611.8" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">nó đã lấy gì, còn gì, và chờ nó cho thấy hướng.”</text>
</svg>
