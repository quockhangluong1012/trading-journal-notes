<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng bốn bước của Hình 01, nhưng bằng nến. Giá trong hình là ví dụ dựng sẵn, không phải dữ liệu thị trường.</text>
