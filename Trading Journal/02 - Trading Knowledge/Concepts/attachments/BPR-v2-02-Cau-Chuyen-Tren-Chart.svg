<text x="584.8" y="241.2" font-size="9.5" font-weight="700" fill="#0F9D74" text-anchor="end">mép trên bullish FVG</text>
<text x="584.8" y="420.2" font-size="9.5" font-weight="700" fill="#E0464B" text-anchor="end">mép dưới bearish FVG</text>
<text x="494.0" y="338.8" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR</text>
<rect x="656.0" y="86.0" width="316.0" height="98.0" rx="10" fill="#E7F7EF" stroke="#0F9D74" stroke-width="1.3"/>
<text x="668.0" y="110.5" font-size="12.5" font-weight="700" fill="#0F9D74" text-anchor="start">① Leg tăng nhanh → Bullish FVG</text>
<text x="668.0" y="130.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nến 3 tăng dài. Đáy nến sau nó vẫn cao hơn đỉnh nến</text>
<text x="668.0" y="145.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">trước nó → để lại một khoảng (xanh).</text>
<rect x="656.0" y="194.0" width="316.0" height="98.0" rx="10" fill="#FDECEC" stroke="#E0464B" stroke-width="1.3"/>
<text x="668.0" y="218.5" font-size="12.5" font-weight="700" fill="#E0464B" text-anchor="start">② Leg giảm nhanh → Bearish FVG</text>
<text x="668.0" y="238.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Nến 9 giảm dài. Đỉnh nến sau vẫn thấp hơn đáy nến</text>
<text x="668.0" y="253.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">trước → một khoảng (đỏ) đè lên một phần khoảng xanh.</text>
<rect x="656.0" y="302.0" width="316.0" height="98.0" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.3"/>
<text x="668.0" y="326.5" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">③ Phần chồng = BPR</text>
<text x="668.0" y="346.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Chỉ phần nằm trong CẢ HAI khoảng mới là BPR (tím).</text>
<text x="668.0" y="361.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Phần chỉ có màu xanh hoặc chỉ có màu đỏ không thuộc</text>
<text x="668.0" y="377.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">BPR.</text>
<rect x="656.0" y="410.0" width="316.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.3"/>
<text x="668.0" y="434.5" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">④ Lúc nhìn thấy BPR, giá đã ở dưới nó</text>
<text x="668.0" y="454.8" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Khi FVG thứ hai vừa hoàn tất, nến sau đã nằm hẳn dưới</text>
<text x="668.0" y="469.9" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">BPR. Câu hỏi còn lại: nếu giá quay lên đây, chuyện gì có</text>
<text x="668.0" y="485.1" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">thể xảy ra?</text>
<text x="28.0" y="580.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Vì leg đi xuống là leg sau cùng và giá kết thúc phía dưới, cộng đồng ICT thường gọi vùng này là Bearish BPR (kháng cự tiềm năng). Tên gọi không phải lời dự báo.</text>
