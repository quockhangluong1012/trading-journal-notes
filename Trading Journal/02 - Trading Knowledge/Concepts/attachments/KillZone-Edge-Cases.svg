<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="800" fill="#0f1420" rx="12"/>
<text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Edge Cases Kill Zone: DST lệch pha &amp; các cửa sổ giờ dễ nhầm</text>
<text x="40" y="63" font-size="15" fill="#94a3b8">DST Mỹ vs EU lệch 2-3 tuần, Sunday reopen không phải KZ, half-day biến dạng thanh khoản</text>

<!-- Panel 1: DST calendar mismatch -->
<rect x="40" y="90" width="540" height="260" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="118" font-size="16" fill="#eab308" font-weight="bold">1. DST Mỹ vs EU lệch nhau 2-3 tuần</text>

<line x1="70" y1="160" x2="550" y2="160" stroke="#334155" stroke-width="2"/>
<text x="70" y="180" font-size="11" fill="#94a3b8">Th.3 CN tuần 2</text>
<circle cx="150" cy="160" r="5" fill="#38bdf8"/>
<text x="120" y="150" font-size="11" fill="#38bdf8">Mỹ → EDT</text>

<text x="340" y="180" font-size="11" fill="#94a3b8">Th.3 CN cuối</text>
<circle cx="420" cy="160" r="5" fill="#f97316"/>
<text x="390" y="150" font-size="11" fill="#f97316">EU → BST</text>

<rect x="150" y="200" width="270" height="30" fill="#f97316" opacity="0.25"/>
<text x="160" y="220" font-size="12" fill="#f97316" font-weight="bold">Vùng rủi ro quy đổi ~3 tuần (chênh lệch NY-London chỉ còn 4h thay vì 5h)</text>

<text x="70" y="260" font-size="12" fill="#94a3b8">Tương tự cuối Th.10 (EU→GMT) và đầu Th.11 (Mỹ→EST)</text>
<text x="70" y="280" font-size="12" fill="#94a3b8">Trong 2 khoảng này: London Open KZ giờ NY tương ứng</text>
<text x="70" y="298" font-size="12" fill="#94a3b8">với giờ London THẬT khác 1h so với các tuần còn lại năm.</text>
<text x="70" y="326" font-size="13" fill="#e2e8f0" font-weight="bold">Xử lý: luôn set chart theo NY time tuyệt đối.</text>

<!-- Panel 2: broker server GMT+2/3 -->
<rect x="620" y="90" width="540" height="260" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="640" y="118" font-size="16" fill="#eab308" font-weight="bold">2. Giờ server broker GMT+2/+3</text>
<text x="640" y="145" font-size="13" fill="#94a3b8">Silver Bullet NY AM = 10:00-11:00 ET</text>
<rect x="640" y="160" width="480" height="34" fill="#0f1420" stroke="#334155"/>
<text x="650" y="182" font-size="13" fill="#e2e8f0">Mùa đông: quy đổi = 17:00-18:00 giờ server (GMT+2)</text>
<rect x="640" y="200" width="480" height="34" fill="#0f1420" stroke="#334155"/>
<text x="650" y="222" font-size="13" fill="#e2e8f0">Mùa hè: quy đổi = 17:00-18:00 giờ server (GMT+3)</text>
<text x="640" y="256" font-size="12" fill="#f97316" font-weight="bold">Server đổi DST theo lịch riêng (thường EU/Israel),</text>
<text x="640" y="274" font-size="12" fill="#f97316" font-weight="bold">KHÔNG theo DST Mỹ → công thức ghi nhớ có thể sai lệch 1h.</text>
<text x="640" y="310" font-size="13" fill="#e2e8f0" font-weight="bold">Xử lý: dùng đồng hồ NY time trực tiếp,</text>
<text x="640" y="328" font-size="13" fill="#e2e8f0" font-weight="bold">không tự cộng trừ tay.</text>

<!-- Panel 3: Sunday reopen vs London Open KZ -->
<rect x="40" y="380" width="540" height="200" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="408" font-size="16" fill="#eab308" font-weight="bold">3. Sunday Reopen ≠ Kill Zone</text>
<line x1="70" y1="450" x2="550" y2="450" stroke="#334155" stroke-width="2"/>
<circle cx="110" cy="450" r="6" fill="#94a3b8"/>
<text x="80" y="475" font-size="11" fill="#94a3b8">18:00 ET CN</text>
<text x="80" y="490" font-size="11" fill="#94a3b8">(futures reopen)</text>
<circle cx="330" cy="450" r="6" fill="#eab308"/>
<text x="290" y="475" font-size="11" fill="#eab308" font-weight="bold">02:00 ET T2</text>
<text x="285" y="490" font-size="11" fill="#eab308" font-weight="bold">London Open KZ thật</text>
<text x="60" y="530" font-size="12" fill="#94a3b8">Thanh khoản 18:00 ET CN (chỉ Sydney/Tokyo) mỏng hơn</text>
<text x="60" y="548" font-size="12" fill="#94a3b8">nhiều so với London Open KZ thật — biến động dễ đảo ngược.</text>
<text x="60" y="570" font-size="13" fill="#e2e8f0" font-weight="bold">Không trade biến động ngay sau reopen.</text>

<!-- Panel 4: half-day holiday impact -->
<rect x="620" y="380" width="540" height="200" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="640" y="408" font-size="16" fill="#eab308" font-weight="bold">4. Half-day (sau Thanksgiving, 24/12)</text>
<text x="640" y="435" font-size="13" fill="#94a3b8">Volume thường: </text>
<rect x="740" y="422" width="200" height="16" fill="#38bdf8"/>
<text x="640" y="465" font-size="13" fill="#94a3b8">Volume half-day: </text>
<rect x="760" y="452" width="70" height="16" fill="#ef4444"/>
<text x="840" y="465" font-size="12" fill="#ef4444">~30-50% ngày thường</text>
<text x="640" y="500" font-size="12" fill="#94a3b8">Sweep dễ xảy ra (order book mỏng) nhưng</text>
<text x="640" y="518" font-size="12" fill="#94a3b8">MSS theo sau thường yếu, không tiếp diễn.</text>
<text x="640" y="546" font-size="13" fill="#e2e8f0" font-weight="bold">Kiểm tra lịch CME/NYSE trước mỗi tuần.</text>

<!-- Bottom summary strip -->
<rect x="40" y="620" width="1120" height="140" fill="#1e293b" stroke="#334155" rx="8"/>
<text x="60" y="650" font-size="16" fill="#e2e8f0" font-weight="bold">Nguyên tắc chung xử lý các edge case thời gian</text>
<text x="60" y="680" font-size="13" fill="#94a3b8">1. Luôn neo theo New York time tuyệt đối — không quy đổi tay bằng công thức ghi nhớ cứng.</text>
<text x="60" y="702" font-size="13" fill="#94a3b8">2. Kiểm tra lịch DST Mỹ + EU + lịch nghỉ lễ CME/NYSE riêng biệt trước mỗi tuần giao dịch.</text>
<text x="60" y="724" font-size="13" fill="#94a3b8">3. Phân biệt rõ "giờ mở lại giao dịch" (Sunday reopen) với "cửa sổ biến động cao thật" (Kill Zone).</text>
<text x="60" y="746" font-size="13" fill="#94a3b8">4. Trên crypto 24/7: hạ kỳ vọng vào khung Kill Zone truyền thống, ưu tiên lịch tin vĩ mô Mỹ.</text>
</svg>
