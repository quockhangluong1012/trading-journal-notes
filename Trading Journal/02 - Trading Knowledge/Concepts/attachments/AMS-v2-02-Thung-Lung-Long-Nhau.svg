<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Thung lũng nhỏ nằm trong thung lũng lớn</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Cùng một đường giá. Ba khung màu là ba "cỡ" thung lũng lồng vào nhau.</text>
