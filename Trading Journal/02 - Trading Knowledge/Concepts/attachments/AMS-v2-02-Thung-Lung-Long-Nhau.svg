<text x="281.0" y="337.0" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">Thung lũng VỪA — đáy là ITL (b)</text>
<rect x="603.5" y="232.0" width="121.5" height="120.0" rx="10" fill="#6B7280" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4" fill-opacity="0.07"/>
