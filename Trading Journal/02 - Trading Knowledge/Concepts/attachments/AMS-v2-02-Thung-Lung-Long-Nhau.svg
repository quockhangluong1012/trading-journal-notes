<text x="42.0" y="495.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Một đáy to không phải là một thứ khác với đáy nhỏ. Nó là một đáy nhỏ nằm ở chỗ thấp nhất của một vùng rộng hơn.</text>
<text x="42.0" y="512.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Cỡ của thung lũng không do "sâu bao nhiêu" quyết định, mà do nó thấp hơn bao nhiêu LỚP hàng xóm.</text>
