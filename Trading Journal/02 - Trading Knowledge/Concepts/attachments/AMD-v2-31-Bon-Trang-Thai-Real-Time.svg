<text x="38.0" y="584.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">Cách nói đúng trong journal: “11:40 — S1: range Á, đã ghi mép trên/dưới” · “14:20 — S2: quét đáy Á, nến M15 đóng lại bên trong” · “14:55 — S3: MSS M5</text>
<text x="38.0" y="600.6" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">+ displacement”. Ghi giờ cho từng trạng thái giúp bạn tự kiểm tra sau này: mình đã biết gì, VÀO LÚC NÀO.</text>
