<text x="44.0" y="263.0" font-size="10" font-weight="800" fill="#B45309" text-anchor="start">CHƯA BIẾT</text>
<text x="44.0" y="281.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">phá phía nào, có phá không</text>
