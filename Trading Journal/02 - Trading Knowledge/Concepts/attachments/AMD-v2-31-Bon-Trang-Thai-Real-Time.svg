<rect x="1" y="1" width="998" height="638" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Nhận diện real-time: 4 trạng thái, mỗi trạng thái có “biết / chưa biết / xác nhận / hủy”</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Trong real-time, bạn không bao giờ “đang ở pha M”. Bạn chỉ “đang có một ứng viên M”. Mỗi bước sang phải đòi một mẩu bằng chứng mới;</text>
<text x="28.0" y="80.9" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">mọi bước đều có lối thoát về HỦY.</text>
