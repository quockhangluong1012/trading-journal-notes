<text x="500.0" y="530.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">HỦY → quay về quan sát. Không “nâng cấp” ứng viên khi thiếu bằng chứng; không “hạ cấp” để giữ câu chuyện.</text>
