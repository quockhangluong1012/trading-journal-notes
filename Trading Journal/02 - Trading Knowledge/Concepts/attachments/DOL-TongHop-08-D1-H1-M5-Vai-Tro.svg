<svg viewBox="0 0 760 488" width="760" height="488" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>D1 → H1 → M5: D1 chọn ĐÍCH, H1 chọn ĐƯỜNG và GA, M5 quyết định LÊN TÀU</title>
<desc>Ba cột D1, H1, M5 với các bước cần làm ở mỗi khung và ba việc M5 không được làm.</desc>
<defs><marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="488" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" fill="#1F2937" font-weight="700">D1 → H1 → M5: D1 chọn ĐÍCH, H1 chọn ĐƯỜNG và GA, M5 quyết định LÊN TÀU</text>
<text x="24" y="54" font-size="12.5" fill="#6B7280">M5 không bao giờ được đổi đích. Điền xong thẻ DOL (D1) trước khi bấm play khi backtest bằng Bar Replay.</text>
<rect x="24" y="76" width="232" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="24" y="76" width="232" height="62" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="36" y="98" font-size="16" fill="#2563EB" font-weight="700">D1</text>
<text x="84" y="98" font-size="10.5" fill="#6B7280">làm một lần, trước 11:00 VN</text>
<text x="36" y="118" font-size="11.5" fill="#1F2937" font-weight="700">Tôi đang ở đâu, đích lớn ở</text>
<text x="36" y="133.5" font-size="11.5" fill="#1F2937" font-weight="700">đâu?</text>
<circle cx="44" cy="152" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="155.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="156" font-size="10.5" fill="#4B5563">Chốt (đóng băng) dealing range</text>
<text x="60" y="170.2" font-size="10.5" fill="#4B5563">D1.</text>
<circle cx="44" cy="185.39999999999998" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="188.89999999999998" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="60" y="189.39999999999998" font-size="10.5" fill="#4B5563">Bản đồ ERL: PWH/PWL, PDH/PDL,</text>
<text x="60" y="203.59999999999997" font-size="10.5" fill="#4B5563">swing D1, EQH/EQL.</text>
<circle cx="44" cy="218.79999999999995" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="222.29999999999995" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="60" y="222.79999999999995" font-size="10.5" fill="#4B5563">Bản đồ IRL: FVG D1/H4,</text>
<text x="60" y="236.99999999999994" font-size="10.5" fill="#4B5563">NWOG/NDOG.</text>
<circle cx="44" cy="252.19999999999993" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="255.69999999999993" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="60" y="256.19999999999993" font-size="10.5" fill="#4B5563">Con lắc: ERL nào vừa bị lấy;</text>
<text x="60" y="270.3999999999999" font-size="10.5" fill="#4B5563">sweep hay run?</text>
<circle cx="44" cy="285.5999999999999" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="289.0999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="60" y="289.5999999999999" font-size="10.5" fill="#4B5563">Vị trí % range</text>
<text x="60" y="303.7999999999999" font-size="10.5" fill="#4B5563">(premium/discount).</text>
<circle cx="44" cy="318.9999999999999" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="322.4999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
<text x="60" y="322.9999999999999" font-size="10.5" fill="#4B5563">Đường đi: vật cản LRLR hay HRLR.</text>
<circle cx="44" cy="338.1999999999999" r="9" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="44" y="341.6999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">7</text>
<text x="60" y="342.1999999999999" font-size="10.5" fill="#4B5563">Viết thẻ DOL.</text>
<rect x="264" y="76" width="232" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="264" y="76" width="232" height="62" rx="8" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.2"/>
<text x="276" y="98" font-size="16" fill="#7C3AED" font-weight="700">H1</text>
<text x="324" y="98" font-size="10.5" fill="#6B7280">phiên Á → London</text>
<text x="276" y="118" font-size="11.5" fill="#1F2937" font-weight="700">Giá cư xử thế nào trong bối</text>
<text x="276" y="133.5" font-size="11.5" fill="#1F2937" font-weight="700">cảnh đó?</text>
<circle cx="284" cy="152" r="9" fill="#7C3AED" stroke="none" stroke-width="1"/>
<text x="284" y="155.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="300" y="156" font-size="10.5" fill="#4B5563">Liệt kê pool phiên: Á, London,</text>
<text x="300" y="170.2" font-size="10.5" fill="#4B5563">EQH/EQL H1.</text>
<circle cx="284" cy="185.39999999999998" r="9" fill="#7C3AED" stroke="none" stroke-width="1"/>
<text x="284" y="188.89999999999998" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="300" y="189.39999999999998" font-size="10.5" fill="#4B5563">Gán vai: “nhiên liệu” (phía</text>
<text x="300" y="203.59999999999997" font-size="10.5" fill="#4B5563">ngược DOL) hay “bậc thang” (cùng</text>
<text x="300" y="217.79999999999995" font-size="10.5" fill="#4B5563">phía).</text>
<circle cx="284" cy="232.99999999999994" r="9" fill="#7C3AED" stroke="none" stroke-width="1"/>
<text x="284" y="236.49999999999994" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="300" y="236.99999999999994" font-size="10.5" fill="#4B5563">Chọn POI: FVG/OB H1–H4 ở</text>
<text x="300" y="251.19999999999993" font-size="10.5" fill="#4B5563">discount nếu DOL hướng lên.</text>
<circle cx="284" cy="266.3999999999999" r="9" fill="#7C3AED" stroke="none" stroke-width="1"/>
<text x="284" y="269.8999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="300" y="270.3999999999999" font-size="10.5" fill="#4B5563">Cổng Mistake 13: pool chưa quét</text>
<text x="300" y="284.5999999999999" font-size="10.5" fill="#4B5563">≤ 0.5 ATR H1 phía SL → CHỜ.</text>
<circle cx="284" cy="299.7999999999999" r="9" fill="#7C3AED" stroke="none" stroke-width="1"/>
<text x="284" y="303.2999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="300" y="303.7999999999999" font-size="10.5" fill="#4B5563">Đọc trạng thái delivery: đang về</text>
<text x="300" y="317.9999999999999" font-size="10.5" fill="#4B5563">DOL hay về IRL?</text>
<rect x="504" y="76" width="232" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="504" y="76" width="232" height="62" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="516" y="98" font-size="16" fill="#1D9E75" font-weight="700">M5</text>
<text x="564" y="98" font-size="10.5" fill="#6B7280">chỉ trong killzone</text>
<text x="516" y="118" font-size="11.5" fill="#1F2937" font-weight="700">Đã có trigger chưa?</text>
<circle cx="524" cy="152" r="9" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="524" y="155.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="540" y="156" font-size="10.5" fill="#4B5563">Sweep phía ngược, ngay tại POI</text>
<text x="540" y="170.2" font-size="10.5" fill="#4B5563">H1.</text>
<circle cx="524" cy="185.39999999999998" r="9" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="524" y="188.89999999999998" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="540" y="189.39999999999998" font-size="10.5" fill="#4B5563">MSS phá swing cấu trúc +</text>
<text x="540" y="203.59999999999997" font-size="10.5" fill="#4B5563">displacement về DOL.</text>
<circle cx="524" cy="218.79999999999995" r="9" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="524" y="222.29999999999995" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="540" y="222.79999999999995" font-size="10.5" fill="#4B5563">Entry: limit ở CE của FVG đầu</text>
<text x="540" y="236.99999999999994" font-size="10.5" fill="#4B5563">tiên sau MSS.</text>
<circle cx="524" cy="252.19999999999993" r="9" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="524" y="255.69999999999993" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="540" y="256.19999999999993" font-size="10.5" fill="#4B5563">SL ngoài râu sweep + 0.1–0.2 ATR</text>
<text x="540" y="270.3999999999999" font-size="10.5" fill="#4B5563">M5, rồi tính lại size ≤ 0.5%.</text>
<circle cx="524" cy="285.5999999999999" r="9" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="524" y="289.0999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="540" y="289.5999999999999" font-size="10.5" fill="#4B5563">T1 trước bậc thang đầu tiên; T2</text>
<text x="540" y="303.7999999999999" font-size="10.5" fill="#4B5563">trước DOL ngày.</text>
<circle cx="524" cy="318.9999999999999" r="9" fill="#1D9E75" stroke="none" stroke-width="1"/>
<text x="524" y="322.4999999999999" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
<text x="540" y="322.9999999999999" font-size="10.5" fill="#4B5563">R:R tới vật cản đầu tiên phải ≥</text>
<text x="540" y="337.1999999999999" font-size="10.5" fill="#4B5563">2.</text>
<rect x="24" y="390" width="712" height="34" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1"/>
<text x="38" y="412" font-size="12" fill="#DC2626" font-weight="700">M5 KHÔNG được: tạo DOL mới cho ngày · lật DOL của D1 · “cứu” một narrative D1 đã sai.</text>
<rect x="24" y="434" width="712" height="34" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="38" y="456" font-size="11" fill="#4B5563">Killzone (giờ VN, Mỹ dùng EDT tới 01/11/2026): London 13:00–16:00 · NY AM 18:00–21:00. Sau 01/11 (EST) cộng thêm 1 giờ.</text>
</svg>
