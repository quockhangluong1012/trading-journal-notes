<text x="873.1" y="237.5" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">protected low hiện tại</text>
<line x1="824.3" y1="176.0" x2="938.0" y2="176.0" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="820.3" y="166.0" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">đỉnh trước — đã bị vượt</text>
<rect x="28.0" y="396.0" width="466.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
<rect x="28.0" y="396.0" width="5.0" height="64.0" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="42.0" y="415.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đáy giữa thấp hơn hai hàng xóm → đúng là ITL theo luật vị trí.</text>
<text x="42.0" y="432.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nhưng cú bật lên từ nó không vượt được đỉnh nào quan trọng.</text>
<text x="42.0" y="448.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nó chưa "làm" được gì → không có lý do gọi là protected.</text>
<rect x="506.0" y="396.0" width="466.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
<rect x="506.0" y="396.0" width="5.0" height="64.0" rx="2" fill="#059669" stroke="#059669" stroke-width="0"/>
<text x="520.0" y="415.5" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Các đáy cao dần → không đáy nào là ITL.</text>
<text x="520.0" y="432.2" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Nhưng mỗi đáy đều đẩy giá vượt đỉnh trước đó.</text>
<text x="520.0" y="448.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">Đáy mới nhất làm được việc đó là protected low của cấp ngắn hạn.</text>
