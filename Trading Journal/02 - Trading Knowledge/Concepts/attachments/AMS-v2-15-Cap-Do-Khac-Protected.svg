<text x="295.4" y="159.7" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="start">đỉnh cần vượt — chưa bao giờ bị vượt</text>
<line x1="232.6" y1="308.3" x2="460.0" y2="308.3" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="346.3" y="324.3" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">về sau bị thủng</text>
