<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#131722"/>
  <!-- grid -->
  <g stroke="#1e222d" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
  </g>

  <text x="480" y="36" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Reaper IFVG: Order Flow qua 3 pha</text>

  <!-- Pha 1 label -->
  <text x="130" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Pha 1: Breaker hut thanh khoan</text>
  <!-- candles pha 1: downtrend forming OB then break up -->
  <line x1="100" y1="140" x2="100" y2="200" stroke="#ef5350" stroke-width="2"/>
  <rect x="92" y="150" width="16" height="35" fill="#ef5350"/>
  <line x1="140" y1="150" x2="140" y2="210" stroke="#ef5350" stroke-width="2"/>
  <rect x="132" y="160" width="16" height="35" fill="#ef5350"/>
  <line x1="180" y1="120" x2="180" y2="190" stroke="#26a69a" stroke-width="2"/>
  <rect x="172" y="130" width="16" height="45" fill="#26a69a"/>
  <line x1="220" y1="90" x2="220" y2="160" stroke="#26a69a" stroke-width="2"/>
  <rect x="212" y="100" width="16" height="45" fill="#26a69a"/>

  <!-- OB box (orange) turning into breaker -->
  <rect x="85" y="150" width="70" height="45" fill="rgba(255,152,0,0.25)"/>
  <text x="120" y="215" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Breaker (ALERT)</text>

  <!-- stop cluster line -->
  <line x1="80" y1="205" x2="260" y2="205" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="170" y="230" fill="#f2c94c" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Stop cluster duoi Breaker</text>

  <!-- Pha 2 label -->
  <text x="450" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Pha 2: Chay xuyen, quet stop</text>
  <line x1="300" y1="200" x2="300" y2="260" stroke="#ef5350" stroke-width="2"/>
  <rect x="292" y="210" width="16" height="35" fill="#ef5350"/>
  <line x1="340" y1="230" x2="340" y2="300" stroke="#ef5350" stroke-width="2"/>
  <rect x="332" y="240" width="16" height="45" fill="#ef5350"/>
  <line x1="380" y1="270" x2="380" y2="340" stroke="#ef5350" stroke-width="2"/>
  <rect x="372" y="280" width="16" height="45" fill="#ef5350"/>

  <!-- arrow showing sweep -->
  <path d="M 250 210 L 380 330" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="300" fill="#ffffff" font-family="Arial, sans-serif" font-size="13">Sweep + cascade</text>

  <!-- Pha 3: Reaper IFVG zone -->
  <text x="720" y="70" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Pha 3: Reaper IFVG (ENTRY)</text>
  <rect x="600" y="340" width="120" height="50" fill="rgba(41,98,255,0.25)"/>
  <text x="660" y="405" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Reaper IFVG</text>

  <line x1="420" y1="330" x2="420" y2="390" stroke="#ef5350" stroke-width="2"/>
  <rect x="412" y="340" width="16" height="40" fill="#ef5350"/>
  <line x1="460" y1="350" x2="460" y2="400" stroke="#ef5350" stroke-width="2"/>
  <rect x="452" y="358" width="16" height="35" fill="#ef5350"/>
  <line x1="620" y1="355" x2="620" y2="385" stroke="#26a69a" stroke-width="2"/>
  <rect x="612" y="360" width="16" height="20" fill="#26a69a"/>
  <line x1="660" y1="330" x2="660" y2="380" stroke="#26a69a" stroke-width="2"/>
  <rect x="652" y="335" width="16" height="35" fill="#26a69a"/>
  <line x1="700" y1="300" x2="700" y2="350" stroke="#26a69a" stroke-width="2"/>
  <rect x="692" y="305" width="16" height="35" fill="#26a69a"/>

  <path d="M 640 335 L 700 300" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="740" y="300" fill="#ffffff" font-family="Arial, sans-serif" font-size="13">MSS + Entry</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="480" y="500" fill="#d1d4dc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Breaker = ALERT (thanh khoan bi quet) | Reaper IFVG = ENTRY (luc doi ung can, sau confirmation LTF)</text>
</svg>
