<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B7280"/></marker><marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/></marker><marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803D"/></marker><marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker><marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker><marker id="aS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker><marker id="aD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="980" height="760" rx="10" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<text x="26.0" y="34.0" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Mô hình tư duy cuối cùng — từ cơ chế thị trường tới FVG tới quyết định</text>
<text x="26.0" y="56.0" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Bên trái: chuỗi nhân quả CÓ THỂ (cơ chế). Bên phải: cách ICT đặt nó vào D1 → H1 → M5. Đây là framework nghiên cứu, không phải định luật thị trường.</text>
<rect x="30.0" y="104.0" width="520.0" height="44.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="290.0" y="131.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Thị trường: lệnh chờ + lệnh chủ động</text>
<line x1="290.0" y1="148.0" x2="290.0" y2="160.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="30.0" y="162.0" width="520.0" height="44.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="290.0" y="189.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Price discovery: giá dịch tới nơi có đối ứng</text>
<line x1="290.0" y1="206.0" x2="290.0" y2="218.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="30.0" y="220.0" width="520.0" height="44.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="290.0" y="247.0" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Dòng lệnh một chiều mạnh (lý do: thông tin / thanh khoản / metaorder)</text>
<line x1="290.0" y1="264.0" x2="290.0" y2="276.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="30.0" y="278.0" width="520.0" height="44.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="290.0" y="305.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Displacement: nến lớn so với ATR</text>
<line x1="290.0" y1="322.0" x2="290.0" y2="334.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="30.0" y="336.0" width="520.0" height="44.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="290.0" y="363.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Hình học 3 nến: Low₃ &gt; High₁</text>
<line x1="290.0" y1="380.0" x2="290.0" y2="392.0" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="30.0" y="394.0" width="520.0" height="44.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<text x="290.0" y="421.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">FVG (known_at = close nến 3)</text>
<line x1="290.0" y1="438.0" x2="160.0" y2="462.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<line x1="290.0" y1="438.0" x2="420.0" y2="462.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<rect x="40.0" y="464.0" width="230.0" height="44.0" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="155.0" y="484.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Không quay lại</text>
<text x="155.0" y="500.0" font-size="9.4" font-weight="400" fill="#6B7280" text-anchor="middle">(metaorder / trend: lỡ tàu)</text>
<rect x="310.0" y="464.0" width="230.0" height="44.0" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="425.0" y="484.0" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">Retrace vào FVG</text>
<text x="425.0" y="500.0" font-size="9.4" font-weight="400" fill="#6B7280" text-anchor="middle">(geometry + transient impact)</text>
<line x1="425.0" y1="508.0" x2="340.0" y2="530.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<line x1="425.0" y1="508.0" x2="500.0" y2="530.0" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<rect x="250.0" y="532.0" width="170.0" height="56.0" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4"/>
<text x="335.0" y="554.0" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Reaction</text>
<text x="335.0" y="572.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">→ continuation / reversal</text>
<rect x="430.0" y="532.0" width="120.0" height="56.0" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
<text x="490.0" y="554.0" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">Acceptance</text>
<text x="490.0" y="572.0" font-size="9.4" font-weight="400" fill="#374151" text-anchor="middle">→ invalid / IFVG</text>
<rect x="30.0" y="604.0" width="520.0" height="88.0" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
<text x="44.0" y="626.0" font-size="10.2" font-weight="700" fill="#B45309" text-anchor="start">Câu hỏi edge duy nhất:</text>
<text x="44.0" y="644.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">xác suất 'reaction' tại FVG có CAO HƠN vùng cùng hình học không — sau khi</text>
<text x="44.0" y="662.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">lọc bằng các biến biết TRƯỚC (context, vị trí, cách tiếp cận, thời gian)?</text>
<text x="44.0" y="680.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">Trên random walk: không (FVG-Sim-04). Trên thị trường thật: chưa biết → test.</text>
<rect x="580.0" y="104.0" width="370.0" height="128.0" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="596.0" y="130.0" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">D1 — CONTEXT</text>
<text x="596.0" y="156.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Dealing range · liquidity · DOL</text>
<text x="596.0" y="177.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">HTF FVG = location / draw</text>
<text x="596.0" y="198.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ hypothesis hướng, KHÔNG entry</text>
<line x1="765.0" y1="232.0" x2="765.0" y2="252.0" stroke="#334155" stroke-width="1.8" marker-end="url(#aS)"/>
<rect x="580.0" y="254.0" width="370.0" height="128.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="596.0" y="280.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start">H1 — SETUP</text>
<text x="596.0" y="306.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Structure · liquidity event · POI</text>
<text x="596.0" y="327.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">H1 FVG trên leg phá cấu trúc</text>
<text x="596.0" y="348.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ vùng chờ cụ thể</text>
<line x1="765.0" y1="382.0" x2="765.0" y2="402.0" stroke="#334155" stroke-width="1.8" marker-end="url(#aS)"/>
<rect x="580.0" y="404.0" width="370.0" height="128.0" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
<text x="596.0" y="430.0" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">M5 — EXECUTION</text>
<text x="596.0" y="456.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">Sweep · MSS · displacement</text>
<text x="596.0" y="477.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">M5 FVG = điểm vào, stop ngắn</text>
<text x="596.0" y="498.0" font-size="10.6" font-weight="400" fill="#374151" text-anchor="start">→ trigger + invalidation</text>
<rect x="580.0" y="560.0" width="370.0" height="180.0" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.3"/>
<text x="596.0" y="584.0" font-size="10.2" font-weight="700" fill="#334155" text-anchor="start">Ba câu trader phải trả lời được</text>
<text x="596.0" y="601.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">1. Tôi đang nhìn thấy gì? (OHLC: 3 nến, vùng,</text>
<text x="596.0" y="618.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">   size/ATR, known_at)</text>
<text x="596.0" y="635.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">2. Tôi biết gì / chưa biết gì? (loại displacement,</text>
<text x="596.0" y="652.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">   ai giao dịch — không biết)</text>
<text x="596.0" y="669.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">3. Điều gì phải xảy ra tiếp để hypothesis</text>
<text x="596.0" y="686.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">   được xác nhận? (reaction ≥ k·ATR trong m nến)</text>
<text x="596.0" y="703.0" font-size="10.2" font-weight="400" fill="#374151" text-anchor="start">   — và điều gì bác bỏ nó? (close ngoài distal)</text>
</svg>