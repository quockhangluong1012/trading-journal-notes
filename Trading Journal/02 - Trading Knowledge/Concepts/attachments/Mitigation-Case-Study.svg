<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="750" fill="#0f1420" rx="12"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#e2e8f0">Case Study — USDJPY Long 22/01/2024: Mitigation Block trong tiếp diễn trend, +2.4R</text>
  <text x="40" y="63" font-size="15" fill="#94a3b8">Higher low giữ vững (không sweep) giữa một xu hướng tăng mạnh, MSS xác nhận, retest vào MB — đúng bối cảnh MB phát huy tốt nhất</text>

  <text x="1130" y="150" font-size="13" fill="#94a3b8" text-anchor="end">148.20 High trước đó</text>
  <text x="1130" y="330" font-size="13" fill="#94a3b8" text-anchor="end">147.35 Low1 (giữ vững)</text>
  <text x="1130" y="300" font-size="13" fill="#94a3b8" text-anchor="end">147.52 entry retest</text>
  <text x="1130" y="360" font-size="13" fill="#94a3b8" text-anchor="end">147.30 stop</text>
  <text x="1130" y="120" font-size="13" fill="#94a3b8" text-anchor="end">148.75 target BSL</text>

  <line x1="70" y1="150" x2="1080" y2="150" stroke="#1c2333"/>
  <line x1="70" y1="330" x2="1080" y2="330" stroke="#1c2333" stroke-dasharray="4,3"/>

  <!-- uptrend leg to High -->
  <rect x="90" y="220" width="16" height="50" fill="#22c55e"/><line x1="98" y1="210" x2="98" y2="280" stroke="#22c55e" stroke-width="2"/>
  <rect x="120" y="190" width="16" height="45" fill="#22c55e"/><line x1="128" y1="180" x2="128" y2="245" stroke="#22c55e" stroke-width="2"/>
  <rect x="150" y="160" width="16" height="40" fill="#22c55e"/><line x1="158" y1="150" x2="158" y2="210" stroke="#22c55e" stroke-width="2"/>
  <text x="90" y="145" font-size="12" fill="#94a3b8">Leg tăng mạnh trước đó</text>

  <!-- pullback: Low1 forms, higher low, no sweep of prior swing low -->
  <rect x="190" y="230" width="16" height="45" fill="#ef4444"/><line x1="198" y1="220" x2="198" y2="285" stroke="#ef4444" stroke-width="2"/>
  <rect x="220" y="260" width="16" height="55" fill="#ef4444"/><line x1="228" y1="250" x2="228" y2="320" stroke="#ef4444" stroke-width="2"/>
  <rect x="250" y="280" width="18" height="30" fill="#22c55e" stroke="#38bdf8" stroke-width="2"/><line x1="259" y1="270" x2="259" y2="325" stroke="#22c55e" stroke-width="2"/>
  <text x="190" y="335" font-size="12" fill="#eab308" font-weight="bold">Low1 giữ vững — không xuyên</text>
  <text x="190" y="352" font-size="12" fill="#eab308" font-weight="bold">qua đáy swing cũ (không sweep)</text>

  <!-- MSS confirmation candle -->
  <rect x="290" y="230" width="18" height="60" fill="#22c55e"/><line x1="299" y1="220" x2="299" y2="295" stroke="#22c55e" stroke-width="2"/>
  <text x="285" y="215" font-size="12" fill="#38bdf8" font-weight="bold">MSS: phá đỉnh nhịp hồi</text>

  <!-- MB zone -->
  <rect x="180" y="280" width="120" height="45" fill="#22c55e" opacity="0.18"/>
  <text x="190" y="272" font-size="11" fill="#94a3b8">Mitigation Block</text>

  <!-- retest and entry -->
  <rect x="340" y="285" width="16" height="30" fill="#22c55e"/><line x1="348" y1="275" x2="348" y2="320" stroke="#22c55e" stroke-width="2"/>
  <circle cx="348" cy="300" r="6" fill="#38bdf8"/>
  <text x="360" y="298" font-size="12" fill="#38bdf8" font-weight="bold">Entry Long 147.52</text>

  <!-- stop line -->
  <line x1="70" y1="360" x2="1080" y2="360" stroke="#ef4444" stroke-dasharray="6,4"/>
  <text x="900" y="357" font-size="11" fill="#ef4444" textLength="294" lengthAdjust="spacingAndGlyphs">Stop 147.30 (dưới Low1, KHÔNG ngoài điểm sweep vì không có sweep)</text>

  <!-- continuation up to target -->
  <rect x="400" y="240" width="16" height="35" fill="#22c55e"/><line x1="408" y1="230" x2="408" y2="285" stroke="#22c55e" stroke-width="2"/>
  <rect x="430" y="200" width="16" height="35" fill="#22c55e"/><line x1="438" y1="190" x2="438" y2="245" stroke="#22c55e" stroke-width="2"/>
  <rect x="460" y="165" width="16" height="30" fill="#22c55e"/><line x1="468" y1="155" x2="468" y2="205" stroke="#22c55e" stroke-width="2"/>
  <rect x="490" y="130" width="16" height="30" fill="#22c55e"/><line x1="498" y1="120" x2="498" y2="170" stroke="#22c55e" stroke-width="2"/>
  <text x="520" y="140" font-size="12" fill="#a78bfa" font-weight="bold">Target 148.75 (BSL) đạt được</text>

  <rect x="30" y="420" width="1140" height="300" fill="#1e293b" stroke="#334155" rx="8"/>
  <text x="55" y="450" font-size="16" fill="#e2e8f0" font-weight="bold">Chuỗi reasoning</text>
  <text x="55" y="478" font-size="13" fill="#94a3b8">1. Bias D1/H4: uptrend rõ, USDJPY trong sóng tăng đa tuần, không có catalyst đảo chiều vĩ mô tại thời điểm này.</text>
  <text x="55" y="500" font-size="13" fill="#94a3b8">2. Nhịp hồi (pullback) trên H1 tạo Low1 tại 147.35 — kiểm tra kỹ: đáy swing liền trước là 147.20, giá hồi về 147.35 và</text>
  <text x="55" y="518" font-size="13" fill="#94a3b8">   KHÔNG chạm 147.20 (không có wick hay thân xuyên qua) → phép thử sweep: GIỮ VỮNG → đây là Mitigation Block, không phải Breaker.</text>
  <text x="55" y="540" font-size="13" fill="#94a3b8">3. MSS: nến M15 đóng cửa phá đỉnh nhịp hồi ngay sau Low1 → xác nhận tiếp diễn hướng tăng.</text>
  <text x="55" y="562" font-size="13" fill="#94a3b8">4. Entry: limit tại vùng MB 147.55–147.40, khớp 147.52. Stop 147.30 — dưới Low1 một khoảng nhỏ (không cần rộng như</text>
  <text x="55" y="580" font-size="13" fill="#94a3b8">   logic breaker vì không có điểm sweep để đặt ngoài).</text>
  <text x="55" y="602" font-size="13" fill="#94a3b8">5. Target 148.75 tại BSL kế tiếp. Stop 22 pip, target 123 pip → R:R kế hoạch ~2.4, đạt đủ TP → <tspan fill="#22c55e" font-weight="bold">+2.4R</tspan>.</text>
  <text x="55" y="632" font-size="13" fill="#a78bfa" font-weight="bold">Bài học: đây là bối cảnh MB phát huy tốt nhất — tiếp diễn trend rõ, higher low sạch, MSS dứt khoát. Khác biệt cốt lõi so</text>
  <text x="55" y="652" font-size="13" fill="#a78bfa" font-weight="bold">với case study Breaker (EURUSD 03/05/2021, xem [[04 - Breaker Block]]): ở đó CÓ sweep external trước displacement,</text>
  <text x="55" y="672" font-size="13" fill="#a78bfa" font-weight="bold">còn ở đây Low1 giữ vững hoàn toàn — hai setup nhìn giống nhau về hình dạng nhưng cơ chế đứng sau khác nhau hoàn toàn.</text>
</svg>