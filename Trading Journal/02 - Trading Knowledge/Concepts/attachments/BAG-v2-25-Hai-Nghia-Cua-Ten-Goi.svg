<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Một cái tên, hai nghĩa — 'Breakaway Gap' cổ điển và trong cộng đồng ICT</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Nguồn gốc của khái niệm là TA cổ điển. Trong cộng đồng ICT/SMC, cùng tên này thường được dùng cho một thứ khác. Khi ghi journal, phải</text>
<text x="28.0" y="81.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">ghi rõ đang dùng nghĩa nào.</text>
