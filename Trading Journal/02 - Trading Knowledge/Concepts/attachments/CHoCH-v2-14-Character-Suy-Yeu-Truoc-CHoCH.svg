<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.8" y="0.8" width="998.5" height="598.5" rx="14" fill="#FBFBFD" stroke="#DADDE3" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="20" font-weight="700" fill="#111827">Character thường suy yếu TRƯỚC khi CHoCH xuất hiện</text>
<rect x="877.1" y="23.0" width="94.9" height="24.0" rx="12" fill="#F3F4F6" stroke="#DADDE3" stroke-width="1"/>
<text x="924.6" y="39.5" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">SƠ ĐỒ DỰNG</text>
<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">CHoCH là “phán quyết” cuối cùng. Trước đó thường (không phải luôn luôn) có những dấu hiệu nhỏ hơn. Hai panel dưới cùng kết thúc bằng một</text>
<text x="28.0" y="84.5" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">CHoCH ↓ giống hệt nhau.</text>
<rect x="28.0" y="110.9" width="466.0" height="443.1" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="52.0" cy="131.9" r="10.0" fill="#C026D3" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="52.0" y="135.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="69.0" y="136.4" font-size="13.5" font-weight="700" fill="#C026D3" data-bx="68.0,483.0">Có báo trước (LuxAlgo gọi là CHoCH+ / “supported”)</text>
<line x1="256.3" y1="280.0" x2="474.0" y2="280.0" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="472.0" y="274.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="42.0,480.0">protected low</text>
<polyline points="71.7,404.3 147.4,291.3 185.3,325.2 242.1,246.1 279.9,280.0 317.8,234.7 374.6,308.2 412.5,274.3 469.3,336.5" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="147.4" cy="291.3" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="185.3" cy="325.2" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="242.1" cy="246.1" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="279.9" cy="280.0" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="317.8" cy="234.7" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="374.6" cy="308.2" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="412.5" cy="274.3" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="469.3" cy="336.5" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="317.8" y="212.2" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="42.0,480.0">đỉnh chỉ nhỉnh hơn</text>
<text x="317.8" y="224.7" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="42.0,480.0">(chân tăng ngắn lại)</text>
<text x="412.5" y="265.3" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="42.0,480.0">hồi yếu, đỉnh thấp hơn</text>
<text x="368.6" y="324.2" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="42.0,480.0">CHoCH ↓</text>
<text x="50.0" y="446.9" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="62.0" y="446.9" font-size="12" font-weight="400" fill="#111827" data-bx="61.0,473.0">Chân tăng cuối ngắn hơn hẳn các chân trước.</text>
<text x="50.0" y="468.0" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="62.0" y="468.0" font-size="12" font-weight="400" fill="#111827" data-bx="61.0,473.0">Pullback sâu và nhanh hơn thường lệ.</text>
<text x="50.0" y="489.0" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="62.0" y="489.0" font-size="12" font-weight="400" fill="#111827" data-bx="61.0,473.0">Sau CHoCH, cú hồi không vượt nổi đỉnh cũ.</text>
<text x="50.0" y="510.0" font-size="12" font-weight="700" fill="#C026D3">•</text>
<text x="62.0" y="510.0" font-size="12" font-weight="400" fill="#111827" data-bx="61.0,473.0">Những dấu hiệu này là [OBSERVABLE]. Chúng tốt hơn hay xấu hơn</text>
<text x="62.0" y="527.1" font-size="12" font-weight="400" fill="#111827" data-bx="61.0,473.0">cho CHoCH là [HYPOTHESIS].</text>
<rect x="506.0" y="110.9" width="466.0" height="443.1" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<circle cx="530.0" cy="131.9" r="10.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="530.0" y="135.9" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="547.0" y="136.4" font-size="13.5" font-weight="700" fill="#B45309" data-bx="546.0,961.0">Không báo trước (“leading” CHoCH)</text>
<line x1="734.3" y1="280.0" x2="952.0" y2="280.0" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="950.0" y="274.0" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="520.0,958.0">protected low</text>
<polyline points="549.7,404.3 625.4,291.3 663.3,325.2 720.1,246.1 757.9,280.0 814.7,200.8 862.1,347.8" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="625.4" cy="291.3" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="663.3" cy="325.2" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="720.1" cy="246.1" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="757.9" cy="280.0" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="814.7" cy="200.8" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="862.1" cy="347.8" r="3.6" fill="#111827" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="814.7" y="191.8" font-size="10" font-weight="700" fill="#0E9F6E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="520.0,958.0">đỉnh mới rất mạnh</text>
<text x="856.1" y="363.8" font-size="10.5" font-weight="700" fill="#C026D3" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="520.0,958.0">CHoCH ↓ đột ngột</text>
<text x="528.0" y="446.9" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="540.0" y="446.9" font-size="12" font-weight="400" fill="#111827" data-bx="539.0,951.0">Chân tăng cuối còn mạnh hơn trước.</text>
<text x="528.0" y="468.0" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="540.0" y="468.0" font-size="12" font-weight="400" fill="#111827" data-bx="539.0,951.0">Không có dấu hiệu yếu nào trước đó.</text>
<text x="528.0" y="489.0" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="540.0" y="489.0" font-size="12" font-weight="400" fill="#111827" data-bx="539.0,951.0">CHoCH đến từ một cú đảo rất nhanh (thường do tin tức hoặc cú quét</text>
<text x="540.0" y="506.0" font-size="12" font-weight="400" fill="#111827" data-bx="539.0,951.0">lớn).</text>
<text x="528.0" y="527.1" font-size="12" font-weight="700" fill="#B45309">•</text>
<text x="540.0" y="527.1" font-size="12" font-weight="400" fill="#111827" data-bx="539.0,951.0">Loại này khó đoán trước và cũng dễ là “cú giật” rồi tiếp diễn.</text>
<text x="28.0" y="584.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Thuật ngữ CHoCH+ / “supported CHoCH” lấy từ tài liệu indicator của LuxAlgo — một quy ước của công cụ, không phải định nghĩa chuẩn của ICT.</text>
