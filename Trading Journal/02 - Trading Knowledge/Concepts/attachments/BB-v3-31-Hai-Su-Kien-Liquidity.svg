<text x="28.0" y="66.0" font-size="13" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Sự kiện 1 lấy túi lệnh NGƯỢC hướng sắp đi (dưới đáy cũ). Sự kiện 2 lấy túi lệnh CÙNG hướng mới (trên đỉnh giữa). Chỉ sự kiện 1 thì chưa có Breaker.</text>
