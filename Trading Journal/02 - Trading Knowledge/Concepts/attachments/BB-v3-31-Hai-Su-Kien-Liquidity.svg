<text x="186.6" y="509.2" font-size="10.5" font-weight="700" fill="#DB2777" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" data-bx="40.0,616.0">dưới đáy cũ</text>
