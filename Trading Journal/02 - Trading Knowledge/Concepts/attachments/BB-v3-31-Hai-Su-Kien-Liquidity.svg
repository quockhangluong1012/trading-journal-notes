<rect x="642.0" y="92.5" width="330.0" height="503.5" rx="11" fill="#FFFFFF" stroke="#DADDE3" stroke-width="1.2"/>
<text x="656.0" y="118.0" font-size="13.5" font-weight="700" fill="#111827" data-bx="655.0,961.0">Hai sự kiện, hai vai</text>
<circle cx="666.0" cy="140.5" r="10.0" fill="#DB2777" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="144.4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="684.0" y="144.5" font-size="12.3" font-weight="700" fill="#DB2777">Lấy sell-side dưới đáy cũ</text>
<text x="684.0" y="161.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="683.0,959.0">Giá đi xuống dưới đáy cũ. ICT gọi là “run on</text>
<text x="684.0" y="177.7" font-size="11.8" font-weight="400" fill="#111827" data-bx="683.0,959.0">stops”, và coi đây là một phần của định nghĩa</text>
<text x="684.0" y="194.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="683.0,959.0">Breaker.</text>
<circle cx="666.0" cy="215.2" r="10.0" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="666.0" y="219.2" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="684.0" y="219.2" font-size="12.3" font-weight="700" fill="#7C3AED">Lấy buy-side trên đỉnh giữa</text>
<text x="684.0" y="235.8" font-size="11.8" font-weight="400" fill="#111827" data-bx="683.0,959.0">Giá đóng cửa trên đỉnh giữa. Đây vừa là cú phá</text>
<text x="684.0" y="252.5" font-size="11.8" font-weight="400" fill="#111827" data-bx="683.0,959.0">cấu trúc, vừa là lúc lệnh dừng của người bán bị</text>
<text x="684.0" y="269.3" font-size="11.8" font-weight="400" fill="#111827" data-bx="683.0,959.0">kích hoạt.</text>
<rect x="656.0" y="298.0" width="302.0" height="69.7" rx="8" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="298.0" width="4.0" height="69.7" rx="2" fill="#2563EB"/>
<text x="670.0" y="318.1" font-size="11.8" font-weight="700" fill="#2563EB" data-bx="656.0,958.0">Liquidity sweep ≠ Breaker</text>
<text x="670.0" y="337.8" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">Sự kiện 1 một mình chỉ là một cú quét. Phải có</text>
<text x="670.0" y="354.6" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">sự kiện 2 thì trình tự mới hoàn tất.</text>
<rect x="656.0" y="375.8" width="302.0" height="69.7" rx="8" fill="#0D9488" fill-opacity="0.07" stroke="#0D9488" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="375.8" width="4.0" height="69.7" rx="2" fill="#0D9488"/>
<text x="670.0" y="395.8" font-size="11.8" font-weight="700" fill="#0D9488" data-bx="656.0,958.0">Thiếu sự kiện 1</text>
<text x="670.0" y="415.6" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">Không có sự kiện 1 (đáy cũ còn nguyên) mà có</text>
<text x="670.0" y="432.3" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">sự kiện 2 → ICT gọi là Mitigation Block.</text>
<rect x="656.0" y="453.5" width="302.0" height="86.5" rx="8" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1" stroke-opacity="0.35"/>
<rect x="656.0" y="453.5" width="4.0" height="86.5" rx="2" fill="#B45309"/>
<text x="670.0" y="473.5" font-size="11.8" font-weight="700" fill="#B45309" data-bx="656.0,958.0">[GIỚI HẠN]</text>
<text x="670.0" y="493.3" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">Túi lệnh vẽ bằng các vạch chỉ là minh hoạ. Trên</text>
<text x="670.0" y="510.0" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">chart nến ta không thấy chúng; ta chỉ thấy giá</text>
<text x="670.0" y="526.8" font-size="11.8" font-weight="400" fill="#111827" data-bx="656.0,958.0">đã đi qua mức đó.</text>
<text x="28.0" y="624.0" font-size="12" font-weight="400" fill="#6B7280" data-bx="27.0,973.0">Chất lượng của sự kiện 1 thay đổi rất nhiều: đáy cũ có thể là đáy của cả ngày, hoặc chỉ là một gợn nhỏ. Định nghĩa không phân biệt; việc lọc chất lượng là của bạn.</text>
