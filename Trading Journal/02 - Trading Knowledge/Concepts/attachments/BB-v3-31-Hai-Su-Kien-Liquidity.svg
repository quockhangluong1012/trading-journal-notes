<circle cx="305.4" cy="517.8" r="9.5" fill="#DB2777" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="305.4" y="521.6" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
