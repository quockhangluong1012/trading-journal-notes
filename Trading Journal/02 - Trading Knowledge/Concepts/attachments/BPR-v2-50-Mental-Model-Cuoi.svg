<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<rect x="1" y="1" width="998" height="698" rx="12" fill="#FBFBFD" stroke="#D8DBE2" stroke-width="1.5"/>
<rect x="855.7" y="22" width="116.3" height="24" rx="12" fill="#F3F4F6" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="913.9" y="38.5" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">MENTAL MODEL</text>
<text x="28.0" y="40.0" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Mental model cuối cùng: BPR trong một trang</text>
<text x="28.0" y="64.0" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="start">Nếu chỉ nhớ một hình, hãy nhớ hình này.</text>
<rect x="300.0" y="86.0" width="400.0" height="120.0" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
<text x="500.0" y="120.0" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">BPR = dải giá mà giá đã chạy NHANH qua theo</text>
<text x="500.0" y="140.7" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">CẢ HAI chiều</text>
<text x="500.0" y="178.0" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">(phần chồng của một bullish FVG và một bearish FVG, cùng</text>
<text x="500.0" y="193.9" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="middle">khung)</text>
<rect x="28.0" y="86.0" width="260.0" height="200.0" rx="10" fill="#E7F7EF" stroke="#0F7A5A" stroke-width="1.3"/>
<text x="40.0" y="111.5" font-size="13.5" font-weight="700" fill="#0F7A5A" text-anchor="start">Nó LÀ</text>
<circle cx="43.0" cy="129.1" r="2.2" fill="#0F7A5A"/>
<text x="52.0" y="133.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Một dấu vết của quá khứ: một cú đi nhanh</text>
<text x="52.0" y="148.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">và một cú quay đầu nhanh.</text>
<circle cx="43.0" cy="163.3" r="2.2" fill="#0F7A5A"/>
<text x="52.0" y="167.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Một VỊ TRÍ đáng theo dõi khi giá quay lại.</text>
<circle cx="43.0" cy="181.9" r="2.2" fill="#0F7A5A"/>
<text x="52.0" y="185.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Một vùng hẹp giúp đặt lệnh và stop rõ</text>
<text x="52.0" y="201.4" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">hơn.</text>
<rect x="712.0" y="86.0" width="260.0" height="200.0" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.3"/>
<text x="724.0" y="111.5" font-size="13.5" font-weight="700" fill="#B91C1C" text-anchor="start">Nó KHÔNG là</text>
<circle cx="727.0" cy="129.1" r="2.2" fill="#B91C1C"/>
<text x="736.0" y="133.1" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Bằng chứng cung = cầu hay “tổ chức cân</text>
<text x="736.0" y="148.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">bằng”.</text>
<circle cx="727.0" cy="163.3" r="2.2" fill="#B91C1C"/>
<text x="736.0" y="167.2" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Equilibrium của dealing range.</text>
<circle cx="727.0" cy="181.9" r="2.2" fill="#B91C1C"/>
<text x="736.0" y="185.8" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">MSS, đảo chiều, hay tín hiệu vào lệnh.</text>
<rect x="28.0" y="300.0" width="224.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.6"/>
<text x="42.0" y="326.0" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">D1</text>
<text x="42.0" y="348.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Tôi ở đâu? BPR D1 = bối cảnh</text>
<line x1="254.0" y1="335.0" x2="266.0" y2="335.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah6B7280)"/>
<rect x="268.0" y="300.0" width="224.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="282.0" y="326.0" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">H1</text>
<text x="282.0" y="348.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Vùng nào đáng chờ? BPR H1 = setup</text>
<line x1="494.0" y1="335.0" x2="506.0" y2="335.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah6B7280)"/>
<rect x="508.0" y="300.0" width="224.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
<text x="522.0" y="326.0" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">M5</text>
<text x="522.0" y="348.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Có điều kiện chưa? sweep → MSS →</text>
<text x="522.0" y="363.2" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">FVG</text>
<line x1="734.0" y1="335.0" x2="746.0" y2="335.0" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah6B7280)"/>
<rect x="748.0" y="300.0" width="224.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#0F7A5A" stroke-width="1.6"/>
<text x="762.0" y="326.0" font-size="15" font-weight="700" fill="#0F7A5A" text-anchor="start">LỆNH</text>
<text x="762.0" y="348.0" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">Stop ngoài cực trị · target = DOL</text>
<line x1="500.0" y1="208.0" x2="500.0" y2="296.0" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="28.0" y="386.0" width="944.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="408.0" font-size="12.5" font-weight="700" fill="#0F7A5A" text-anchor="start">Cho trẻ 5 tuổi</text>
<text x="42.0" y="428.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">Quả bóng chạy vội lên rồi chạy vội xuống qua cùng một khúc đường; khúc đó là BPR — chỗ đáng nhìn khi bóng quay lại, nhưng không ai biết trước bóng sẽ dừng hay lăn</text>
<text x="42.0" y="443.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">qua.</text>
<rect x="28.0" y="462.0" width="944.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="484.0" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="start">Cho người mới</text>
<text x="42.0" y="504.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">BPR là phần chồng của hai FVG ngược chiều: một vùng giá bị đi qua nhanh hai lần, dùng để biết nên chờ ở đâu, không phải để biết nên mua hay bán.</text>
<rect x="28.0" y="538.0" width="944.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="1.2"/>
<text x="42.0" y="560.0" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="start">Cho ICT trader</text>
<text x="42.0" y="580.0" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">BPR là một PD array mô tả delivery hai chiều qua cùng dải giá; giá trị của nó nằm ở vị trí trong dealing range, hướng DOL và chuỗi xác nhận LTF — lợi thế độc lập của nó là</text>
<text x="42.0" y="595.6" font-size="11.3" font-weight="400" fill="#1F2937" text-anchor="start">BACKTEST REQUIRED.</text>
<text x="28.0" y="680.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Bốn chữ cần nhớ: VỊ TRÍ (BPR) · BỐI CẢNH (D1/H1) · XÁC NHẬN (M5) · GHI CHÉP (journal).</text>
</svg>
