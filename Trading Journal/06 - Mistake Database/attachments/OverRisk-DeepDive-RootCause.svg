<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Root Cause — 5 Whys: Risk vượt 0.5%/lệnh</text>
  <text x="550" y="58" text-anchor="middle" font-size="14" fill="#555">Chuỗi bậc thang từ hành vi bề mặt xuống nguyên nhân gốc, cộng với cơ chế AMD</text>

  <!-- Ladder steps going down, left aligned staircase -->
  <!-- Step 0 (surface) -->
  <rect x="40" y="80" width="480" height="70" rx="8" fill="#c62828"/>
  <text x="60" y="104" font-size="13" fill="#fff" font-weight="bold">BỀ MẶT: "Setup này chắc ăn quá,</text>
  <text x="60" y="124" font-size="13" fill="#fff" font-weight="bold">tôi risk 2% thay vì 0.5%"</text>
  <text x="60" y="142" font-size="12" fill="#ffe0e0">Triệu chứng, không phải nguyên nhân</text>

  <!-- Step 1 -->
  <rect x="90" y="165" width="480" height="66" rx="8" fill="#e64a19"/>
  <text x="110" y="188" font-size="13" fill="#fff" font-weight="bold">WHY 1: Vì sao "chắc ăn" dẫn tới</text>
  <text x="110" y="206" font-size="13" fill="#fff" font-weight="bold">tăng size?</text>
  <text x="110" y="222" font-size="11.5" fill="#ffe0d0">Tin conviction chủ quan thay thế công thức</text>

  <!-- Step 2 -->
  <rect x="140" y="246" width="500" height="70" rx="8" fill="#ef6c00"/>
  <text x="160" y="269" font-size="13" fill="#fff" font-weight="bold">WHY 2: Vì sao tin conviction thay</text>
  <text x="160" y="287" font-size="13" fill="#fff" font-weight="bold">được công thức?</text>
  <text x="160" y="305" font-size="11.5" fill="#fff3e0">Chưa có dữ liệu backtest về tương quan</text>

  <!-- Step 3 -->
  <rect x="190" y="331" width="520" height="70" rx="8" fill="#f57f17"/>
  <text x="210" y="354" font-size="13" fill="#3a2c00" font-weight="bold">WHY 3: Vì sao chưa có dữ liệu</text>
  <text x="210" y="372" font-size="13" fill="#3a2c00" font-weight="bold">mà vẫn tin?</text>
  <text x="210" y="390" font-size="11.5" fill="#3a2c00">Chưa bắt buộc log conviction_score với outcome</text>

  <!-- Step 4 -->
  <rect x="240" y="416" width="540" height="70" rx="8" fill="#f9a825"/>
  <text x="260" y="439" font-size="13" fill="#3a2c00" font-weight="bold">WHY 4: Vì sao chưa có cơ chế</text>
  <text x="260" y="457" font-size="13" fill="#3a2c00" font-weight="bold">log đó?</text>
  <text x="260" y="475" font-size="11.5" fill="#3a2c00">Học framework nhanh hơn tốc độ tích lũy Tier 1</text>

  <!-- Root cause box -->
  <rect x="150" y="510" width="800" height="100" rx="10" fill="#2e7d32"/>
  <text x="550" y="538" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">NGUYÊN NHÂN GỐC</text>
  <text x="550" y="560" text-anchor="middle" font-size="12.5" fill="#fff">Thiếu một bộ lọc bắt buộc giữa "cảm giác conviction"</text>
  <text x="550" y="578" text-anchor="middle" font-size="12.5" fill="#fff">và "hành động thay đổi risk" — không có phanh ở giữa.</text>
  <text x="550" y="596" text-anchor="middle" font-size="11.5" fill="#c8e6c9">Lỗi thiết kế quy trình, không phải lỗi đạo đức "tham lam"</text>

  <!-- AMD branch -->
  <rect x="60" y="640" width="980" height="160" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <text x="80" y="666" font-size="14" fill="#1a1a1a" font-weight="bold">Nhánh cơ chế thị trường (AMD) — ai đang thu hoạch thanh khoản của ai</text>

  <rect x="80" y="682" width="290" height="100" rx="6" fill="#1565c0"/>
  <text x="225" y="705" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">Accumulation</text>
  <text x="225" y="724" text-anchor="middle" font-size="11" fill="#e3f2fd">Chuỗi thắng liên tiếp ở size</text>
  <text x="225" y="740" text-anchor="middle" font-size="11" fill="#e3f2fd">lớn hơn kế hoạch — chưa bị</text>
  <text x="225" y="756" text-anchor="middle" font-size="11" fill="#e3f2fd">phạt vì variance thuận lợi</text>

  <rect x="395" y="682" width="290" height="100" rx="6" fill="#f9a825"/>
  <text x="540" y="705" text-anchor="middle" font-size="12.5" fill="#3a2c00" font-weight="bold">Manipulation</text>
  <text x="540" y="724" text-anchor="middle" font-size="11" fill="#3a2c00">Chuỗi thắng từ nới tháo</text>
  <text x="540" y="740" text-anchor="middle" font-size="11" fill="#3a2c00">tâm lý: size lớn hơn</text>
  <text x="540" y="756" text-anchor="middle" font-size="11" fill="#3a2c00">trở thành "bình thường mới"</text>

  <rect x="710" y="682" width="290" height="100" rx="6" fill="#c62828"/>
  <text x="855" y="705" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">Distribution</text>
  <text x="855" y="724" text-anchor="middle" font-size="11" fill="#ffe0e0">Chuỗi thua thống kê bình</text>
  <text x="855" y="740" text-anchor="middle" font-size="11" fill="#ffe0e0">thường ập tới đúng lúc size</text>
  <text x="855" y="756" text-anchor="middle" font-size="11" fill="#ffe0e0">đã bị neo cao — SL = fuel</text>
</svg>
