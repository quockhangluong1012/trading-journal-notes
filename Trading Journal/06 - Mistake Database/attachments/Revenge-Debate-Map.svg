<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#1a1a1a">Debate Map — Circuit Breaker Cứng vs Linh Hoạt</text>
  <text x="30" y="58" font-size="13" fill="#555">Kiến nghị: sau lệnh thua, cooldown cứng 30-60 phút, cấm mọi lệnh, không ngoại lệ</text>

  <!-- Cột trái: Ủng hộ -->
  <rect x="30" y="80" width="500" height="470" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="50" y="108" font-size="16" font-weight="bold" fill="#2e7d32">PHE ỦNG HỘ (giữ rule cứng)</text>

  <rect x="50" y="122" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="142" font-size="12" font-weight="bold" fill="#2e7d32">1. Ý chí không đáng tin sau sốc cảm xúc</text>
  <text x="62" y="160" font-size="12" fill="#333">Prospect theory: tự kỷ luật bằng ý chí</text>
  <text x="62" y="176" font-size="12" fill="#333">gần bằng 0 lúc tilt — rule mềm luôn có</text>
  <text x="62" y="192" font-size="12" fill="#333">"cửa" để cảm xúc lách qua.</text>

  <rect x="50" y="206" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="226" font-size="12" font-weight="bold" fill="#2e7d32">2. Bất đối xứng rủi ro</text>
  <text x="62" y="244" font-size="12" fill="#333">Dừng sai (false positive) mất vài R;</text>
  <text x="62" y="260" font-size="12" fill="#333">không dừng khi cần (false negative) có</text>
  <text x="62" y="276" font-size="12" fill="#333">thể mất cả giới hạn lỗ ngày 5%.</text>

  <rect x="50" y="290" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="310" font-size="12" font-weight="bold" fill="#2e7d32">3. Rule mềm cần tự đánh giá lúc khó nhất</text>
  <text x="62" y="328" font-size="12" fill="#333">Đòi hỏi tự tham chiếu vô nghĩa: người</text>
  <text x="62" y="344" font-size="12" fill="#333">đang tilt hiếm khi tự nhận ra mình</text>
  <text x="62" y="360" font-size="12" fill="#333">đang tilt tại đúng thời điểm đó.</text>

  <rect x="50" y="374" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="394" font-size="12" font-weight="bold" fill="#2e7d32">4. Fail-rate prop firm thực nghiệm</text>
  <text x="62" y="412" font-size="12" fill="#333">Revenge trading là nguyên nhân hàng</text>
  <text x="62" y="428" font-size="12" fill="#333">đầu fail challenge — rule dễ nhớ, dễ</text>
  <text x="62" y="444" font-size="12" fill="#333">audit có tỷ lệ tuân thủ cao hơn.</text>

  <rect x="50" y="466" width="460" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="62" y="488" font-size="12" font-weight="bold" fill="#1b4d1e">Phản hồi vòng 2:</text>
  <text x="62" y="506" font-size="12" fill="#1b4d1e">"Không cần thiết" là đánh giá SAU khi</text>
  <text x="62" y="522" font-size="12" fill="#1b4d1e">biết kết quả — không đo được lúc ra quyết định.</text>

  <!-- Cột phải: Phản đối -->
  <rect x="570" y="80" width="500" height="470" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="590" y="108" font-size="16" font-weight="bold" fill="#c62828">PHE PHẢN ĐỐI (rule nên mềm)</text>

  <rect x="590" y="122" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="142" font-size="12" font-weight="bold" fill="#c62828">1. Chi phí cơ hội thật</text>
  <text x="602" y="160" font-size="12" fill="#333">Setup A-tier/Judas swing chất lượng cao</text>
  <text x="602" y="176" font-size="12" fill="#333">thường dồn cục 15-30 phút đầu Kill Zone</text>
  <text x="602" y="192" font-size="12" fill="#333">— cooldown 60 phút có thể xoá sổ cả ngày.</text>

  <rect x="590" y="206" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="226" font-size="12" font-weight="bold" fill="#c62828">2. Overfit trên sample nhỏ</text>
  <text x="602" y="244" font-size="12" fill="#333">Ngưỡng 30-60 phút là kinh nghiệm cộng</text>
  <text x="602" y="260" font-size="12" fill="#333">đồng, chưa calibrate riêng cho trader —</text>
  <text x="602" y="276" font-size="12" fill="#333">rule Tier 0 nói bằng giọng Tier 3.</text>

  <rect x="590" y="290" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="310" font-size="12" font-weight="bold" fill="#c62828">3. Chuyên gia dùng circuit breaker mềm</text>
  <text x="602" y="328" font-size="12" fill="#333">Chỉ bắt buộc cooldown dài khi có dấu</text>
  <text x="602" y="344" font-size="12" fill="#333">hiệu tilt rõ hoặc ≥2 lệnh thua liên tiếp,</text>
  <text x="602" y="360" font-size="12" fill="#333">không áp một cỡ cho tất cả.</text>

  <rect x="590" y="374" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="394" font-size="12" font-weight="bold" fill="#c62828">4. Rule cứng né tránh học kỹ năng thật</text>
  <text x="602" y="412" font-size="12" fill="#333">Chỉ dựa đồng hồ, không luyện tự nhận</text>
  <text x="602" y="428" font-size="12" fill="#333">diện tilt sớm — kỹ năng sống còn hơn</text>
  <text x="602" y="444" font-size="12" fill="#333">cả circuit breaker.</text>

  <rect x="590" y="466" width="460" height="70" rx="6" fill="#f9d6d2" stroke="#c62828"/>
  <text x="602" y="488" font-size="12" font-weight="bold" fill="#7a1a1a">Phản hồi vòng 2:</text>
  <text x="602" y="506" font-size="12" fill="#7a1a1a">Giải pháp không phải cứng hoá toàn bộ —</text>
  <text x="602" y="522" font-size="12" fill="#7a1a1a">đầu tư đo tilt thời gian thực tốt hơn.</text>

  <!-- Mũi tên phản hồi chéo -->
  <path d="M 530 300 L 570 300" stroke="#777" stroke-width="2" marker-end="url(#arrowd)"/>
  <path d="M 570 500 L 530 500" stroke="#777" stroke-width="2" marker-end="url(#arrowd2)"/>

  <defs>
    <marker id="arrowd" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777"/>
    </marker>
    <marker id="arrowd2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777"/>
    </marker>
  </defs>

  <!-- Phán quyết có điều kiện -->
  <rect x="30" y="565" width="1040" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="50" y="590" font-size="15" font-weight="bold" fill="#1565c0">Phán quyết có điều kiện</text>
  <text x="50" y="612" font-size="12" fill="#333">Giai đoạn backtest (chưa live): ưu tiên Phe Ủng hộ — bất đối xứng rủi ro nghiêng về giữ rule cứng.</text>
  <text x="50" y="630" font-size="12" fill="#333">Khi đã live + có n≥20 lệnh gắn tilt-metrics cho thấy tương quan rõ giữa "dấu hiệu tilt" và "lệnh</text>
  <text x="50" y="648" font-size="12" fill="#333">kế tiếp tệ": Phe Phản đối có cơ sở áp dụng rule mềm có điều kiện.</text>
  <text x="50" y="670" font-size="12" fill="#333">Dữ liệu cần để giải quyết tranh biện: n≥30 lệnh thua, gắn tilt flag sinh lý + thời gian tới lệnh kế</text>
  <text x="50" y="688" font-size="12" fill="#333">tiếp + kết quả + điểm checklist, đo tương quan giữa tilt flag và chất lượng lệnh sau đó.</text>

  <!-- Dải Evidence Tier -->
  <rect x="30" y="730" width="1040" height="60" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="50" y="752" font-size="12" font-weight="bold" fill="#1a1a1a">Evidence Tier hiện tại: Tier 0</text>
  <text x="50" y="770" font-size="12" fill="#555">Cả hai phe đang tranh biện trên lý thuyết + kinh nghiệm cộng đồng — chưa có backtest riêng của trader.</text>
</svg>
