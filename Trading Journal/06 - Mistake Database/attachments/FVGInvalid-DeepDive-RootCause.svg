<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">FVG Not Valid — Chuỗi 5 Whys &amp; Cơ chế AMD</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#555">Từ hành vi bề mặt xuống nguyên nhân gốc quy trình</text>

  <!-- Step Bề mặt -->
  <rect x="40" y="80" width="920" height="58" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="102" font-size="13" font-weight="bold" fill="#1a1a1a">Bề mặt:</text>
  <text x="60" y="122" font-size="13" fill="#333">Vào lệnh vì FVG "trông giống" khoảng trống 3 nến hợp lệ, chưa kiểm tra bối cảnh.</text>

  <!-- arrow -->
  <line x1="500" y1="138" x2="500" y2="158" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Why 1 -->
  <rect x="70" y="160" width="860" height="58" rx="8" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="90" y="182" font-size="13" font-weight="bold" fill="#3a2c00">Why 1:</text>
  <text x="90" y="202" font-size="13" fill="#333">Chưa chạy đủ 6 điều kiện hợp lệ trước khi coi khoảng trống là POI.</text>

  <line x1="500" y1="218" x2="500" y2="238" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Why 2 -->
  <rect x="100" y="240" width="800" height="58" rx="8" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="120" y="262" font-size="13" font-weight="bold" fill="#3a2c00">Why 2:</text>
  <text x="120" y="282" font-size="13" fill="#333">Phản xạ nhận dạng hình dạng nhanh hơn thói quen xác minh bối cảnh.</text>

  <line x1="500" y1="298" x2="500" y2="318" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Why 3 -->
  <rect x="130" y="320" width="740" height="58" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="150" y="342" font-size="13" font-weight="bold" fill="#c62828">Why 3:</text>
  <text x="150" y="362" font-size="13" fill="#333">Checklist là danh sách tham khảo, không phải GATE cứng chặn hành động.</text>

  <line x1="500" y1="378" x2="500" y2="398" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Why 4 -->
  <rect x="160" y="400" width="680" height="58" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="180" y="422" font-size="13" font-weight="bold" fill="#c62828">Why 4:</text>
  <text x="180" y="442" font-size="13" fill="#333">Log ghi SAU khi vào lệnh — không có ma sát trước lúc bấm nút.</text>

  <line x1="500" y1="458" x2="500" y2="478" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Root cause box -->
  <rect x="150" y="480" width="700" height="90" rx="10" fill="#c62828"/>
  <text x="500" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">NGUYÊN NHÂN GỐC</text>
  <text x="500" y="534" text-anchor="middle" font-size="13" fill="#fff">Thiếu ma sát quy trình (process friction) giữa nhận diện</text>
  <text x="500" y="554" text-anchor="middle" font-size="13" fill="#fff">hình dạng và hành động thực thi — không phải thiếu kiến thức.</text>

  <!-- AMD branch -->
  <rect x="40" y="600" width="920" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="626" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Nhánh cơ chế thị trường (AMD) — vì sao FVG sai giai đoạn bị trừng phạt</text>

  <rect x="70" y="640" width="270" height="100" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="205" y="662" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Accumulation</text>
  <text x="205" y="684" text-anchor="middle" font-size="12" fill="#333">FVG ngẫu nhiên sinh</text>
  <text x="205" y="700" text-anchor="middle" font-size="12" fill="#333">trong range — nhiễu,</text>
  <text x="205" y="716" text-anchor="middle" font-size="12" fill="#333">không có counterparty</text>

  <rect x="365" y="640" width="270" height="100" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="500" y="662" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Manipulation</text>
  <text x="500" y="684" text-anchor="middle" font-size="12" fill="#333">Sweep+displacement thật</text>
  <text x="500" y="700" text-anchor="middle" font-size="12" fill="#333">sinh FVG hợp lệ — có</text>
  <text x="500" y="716" text-anchor="middle" font-size="12" fill="#333">"trọng lượng" order flow</text>

  <rect x="660" y="640" width="270" height="100" rx="8" fill="#ffffff" stroke="#f9a825" stroke-width="1.5"/>
  <text x="795" y="662" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c00">Distribution</text>
  <text x="795" y="684" text-anchor="middle" font-size="12" fill="#333">FVG muộn cuối chu kỳ —</text>
  <text x="795" y="700" text-anchor="middle" font-size="12" fill="#333">đám đông đuổi theo,</text>
  <text x="795" y="716" text-anchor="middle" font-size="12" fill="#333">biến thể của FOMO Entry</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
