<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Audit Framework — RR Compliance Pipeline</text>
  <text x="550" y="58" text-anchor="middle" font-size="14" fill="#555">Từ log đủ field đến hành động, kèm khối red flags "làm đẹp" RR</text>

  <!-- Pipeline stage 1: log fields -->
  <rect x="40" y="80" width="230" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="155" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">1. Log fields bắt buộc</text>
  <text x="55" y="128" font-size="11.5" fill="#1a1a1a">rr_planned, rr_realized</text>
  <text x="55" y="146" font-size="11.5" fill="#1a1a1a">target_pool_type + tolerance</text>
  <text x="55" y="164" font-size="11.5" fill="#1a1a1a">runway_check_done</text>
  <text x="55" y="182" font-size="11.5" fill="#1a1a1a">sl_logic_type</text>
  <text x="55" y="200" font-size="11.5" fill="#1a1a1a">spread_slippage_estimate</text>
  <text x="55" y="218" font-size="11.5" fill="#1a1a1a">screenshot_pre_entry</text>

  <path d="M 270 155 L 300 155" stroke="#999" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Stage 2: PASS/FAIL questions -->
  <rect x="300" y="80" width="240" height="150" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="420" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">2. 12 câu hỏi PASS/FAIL</text>
  <text x="315" y="128" font-size="11.5" fill="#555">RR planned ghi trước entry?</text>
  <text x="315" y="146" font-size="11.5" fill="#555">RR≥1:2? Pool có tên cụ thể?</text>
  <text x="315" y="164" font-size="11.5" fill="#555">Runway check đã chạy?</text>
  <text x="315" y="182" font-size="11.5" fill="#555">SL structural? Lệch RR≤20%?</text>
  <text x="315" y="200" font-size="11.5" fill="#555">TP1/TP2 tách rõ? Ảnh đánh dấu?</text>
  <text x="315" y="218" font-size="11.5" fill="#555">Ngoại lệ có tiêu chí lượng hóa?</text>

  <path d="M 540 155 L 570 155" stroke="#999" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Stage 3: Rubric -->
  <rect x="570" y="80" width="230" height="150" rx="8" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="685" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c00">3. Rubric A/B/C/F</text>
  <text x="585" y="130" font-size="12" fill="#2e7d32">A: 11-12/12 — mẫu chuẩn</text>
  <text x="585" y="150" font-size="12" fill="#1565c0">B: 8-10/12 — chấp nhận</text>
  <text x="585" y="170" font-size="12" fill="#3a2c00">C: 5-7/12 — cảnh báo</text>
  <text x="585" y="190" font-size="12" fill="#c62828">F: 0-4/12 — vi phạm nặng</text>
  <text x="585" y="212" font-size="11" fill="#555">(điểm/12 câu audit)</text>

  <path d="M 800 155 L 830 155" stroke="#999" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Stage 4: Action -->
  <rect x="830" y="80" width="230" height="150" rx="8" fill="#fce4e4" stroke="#c62828" stroke-width="1.5"/>
  <text x="945" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">4. Hành động</text>
  <text x="845" y="130" font-size="11.5" fill="#1a1a1a">≥30% lệnh tháng = C:</text>
  <text x="845" y="148" font-size="11.5" fill="#1a1a1a">chạy lại runway check 2 tuần</text>
  <text x="845" y="170" font-size="11.5" fill="#1a1a1a">≥2 lệnh F liên tiếp RR&lt;2:</text>
  <text x="845" y="188" font-size="11.5" fill="#1a1a1a">dừng live/demo, quay backtest</text>
  <text x="845" y="206" font-size="11.5" fill="#1a1a1a">tối thiểu 1 tuần</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Red flags box -->
  <rect x="40" y="260" width="1020" height="180" rx="10" fill="#fce4e4" stroke="#c62828" stroke-width="2"/>
  <text x="60" y="288" font-size="15" font-weight="bold" fill="#c62828">Red flags — dấu hiệu tự lừa dối / làm đẹp RR</text>
  <text x="60" y="312" font-size="12.5" fill="#3a2c00">• rr_edit_timestamp trùng thời điểm review, không trùng sự kiện giá cụ thể trong lịch sử nến</text>
  <text x="60" y="332" font-size="12.5" fill="#3a2c00">• Target pool đổi tên gọi sau kết quả (EQH "rõ ràng" khi thắng, "không chắc" khi thua)</text>
  <text x="60" y="352" font-size="12.5" fill="#3a2c00">• SL luôn rơi ở khoảng cách tạo RR đúng 2.00-2.05 — dấu hiệu SL bị "gọt" theo target đã biết</text>
  <text x="60" y="372" font-size="12.5" fill="#3a2c00">• runway_check_done luôn = có nhưng không bao giờ tìm thấy obstruction nào</text>
  <text x="60" y="392" font-size="12.5" fill="#3a2c00">• Chi phí giao dịch không bao giờ được nhắc dù SL rất ngắn (&lt;10 pip)</text>
  <text x="60" y="416" font-size="12.5" fill="#3a2c00">• "Ngoại lệ chất lượng cao" viện dẫn cho mọi lệnh RR thấp mà không có tiêu chí lượng hóa trước</text>

  <!-- Audit cadence -->
  <rect x="40" y="460" width="330" height="150" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="486" font-size="13" font-weight="bold" fill="#1a1a1a">Nhịp audit</text>
  <text x="60" y="510" font-size="12" fill="#555">Hàng ngày: chấm nhanh mọi</text>
  <text x="60" y="528" font-size="12" fill="#555">lệnh đã lập kế hoạch (kể cả</text>
  <text x="60" y="546" font-size="12" fill="#555">lệnh không vào vì RR thấp)</text>
  <text x="60" y="568" font-size="12" fill="#555">Hàng tuần: đo lệch RR</text>
  <text x="60" y="586" font-size="12" fill="#555">planned vs realized</text>

  <!-- Meta-audit -->
  <rect x="390" y="460" width="670" height="150" rx="8" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="410" y="486" font-size="13" font-weight="bold" fill="#3a2c00">Meta-audit của chính note</text>
  <text x="410" y="510" font-size="12" fill="#3a2c00">Evidence Tier hiện tại: TIER 0 — ngưỡng "1:2" là suy luận lý thuyết, chưa backtest</text>
  <text x="410" y="530" font-size="12" fill="#3a2c00">phân nhóm theo confluence. Sample size: n=0 lệnh xác nhận thực tế trong note.</text>
  <text x="410" y="552" font-size="12" fill="#3a2c00">Cần dữ liệu: backtest ≥20 mẫu/ngưỡng RR (1.5/1.8/2.0/2.5), phân nhóm WR theo</text>
  <text x="410" y="572" font-size="12" fill="#3a2c00">confluence, shadow log lệnh bị từ chối vì RR&lt;2 để đo chi phí cơ hội thật.</text>
  <text x="410" y="594" font-size="12" fill="#3a2c00">Auditor: trader tự đo bằng số + rule ngưỡng cố định + review định kỳ.</text>
</svg>
