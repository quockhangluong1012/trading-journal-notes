<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1150" height="720" fill="#ffffff"/>
  <text x="575" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Case Studies Panel — FTMO 100K (kịch bản minh họa)</text>
  <text x="575" y="58" text-anchor="middle" font-size="14" fill="#555">3 panel: SL creep + correlation blow-up / tuân thủ đúng / gray-zone chênh SL nhỏ</text>

  <!-- CASE A - red -->
  <rect x="30" y="80" width="350" height="600" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="205" y="108" text-anchor="middle" font-size="14" fill="#8e0000" font-weight="bold">CASE A — Thất bại</text>
  <text x="205" y="126" text-anchor="middle" font-size="11" fill="#8e0000">NAS100+US30, phiên NY</text>

  <!-- schematic price line for case A -->
  <polyline points="55,180 90,175 120,190 150,160 180,210 210,250 240,300 270,330 300,345 330,350"
            fill="none" stroke="#c62828" stroke-width="2.5"/>
  <line x1="55" y1="160" x2="330" y2="160" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="335" y="163" font-size="10" fill="#333">Entry</text>
  <line x1="55" y1="215" x2="330" y2="215" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="335" y="218" font-size="10" fill="#c62828">SL kế hoạch 25pt</text>
  <line x1="55" y1="255" x2="330" y2="255" stroke="#c62828" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="335" y="258" font-size="10" fill="#c62828" font-weight="bold">SL thực 42pt (không tính lại lot)</text>

  <text x="45" y="400" font-size="11.5" fill="#333">- SL nới 25→42pt, lot GIỮ NGUYÊN</text>
  <text x="45" y="418" font-size="11.5" fill="#333">- Mở thêm US30 (correlation ~0.9)</text>
  <text x="45" y="436" font-size="11.5" fill="#333">- Cả 2 lệnh cùng thua: -$1,372</text>
  <text x="45" y="454" font-size="11.5" fill="#333">- Revenge XAUUSD: -$700 thêm</text>
  <rect x="45" y="470" width="310" height="70" rx="6" fill="#c62828"/>
  <text x="200" y="494" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Tổng: -$2,072 (~2.02%)</text>
  <text x="200" y="514" text-anchor="middle" font-size="11" fill="#ffe0e0">40% daily budget trong 1 buổi sáng</text>
  <text x="45" y="560" font-size="11" fill="#333" font-style="italic">Bài học: không tính lại lot + bỏ qua</text>
  <text x="45" y="576" font-size="11" fill="#333" font-style="italic">correlation nhân 4 lần thiệt hại</text>

  <!-- CASE B - green -->
  <rect x="400" y="80" width="350" height="600" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="575" y="108" text-anchor="middle" font-size="14" fill="#1b5e20" font-weight="bold">CASE B — Đúng process</text>
  <text x="575" y="126" text-anchor="middle" font-size="11" fill="#1b5e20">Cùng bối cảnh, tuân thủ rule</text>

  <polyline points="425,180 460,175 490,190 520,160 550,210 580,250 610,300 640,330 670,345 700,350"
            fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <line x1="425" y1="160" x2="700" y2="160" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="705" y="163" font-size="10" fill="#333">Entry</text>
  <line x1="425" y1="255" x2="700" y2="255" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="705" y="258" font-size="10" fill="#2e7d32" font-weight="bold">SL 42pt (lot đã tính lại)</text>

  <text x="415" y="400" font-size="11.5" fill="#333">- SL nới 25→42pt, lot TÍNH LẠI ngay</text>
  <text x="415" y="418" font-size="11.5" fill="#333">- Correlation NAS100/US30: chỉ giữ 1</text>
  <text x="415" y="436" font-size="11.5" fill="#333">- Bỏ qua US30 (có thể là lệnh thắng)</text>
  <text x="415" y="454" font-size="11.5" fill="#333">- Không revenge sau khi thua</text>
  <rect x="415" y="470" width="310" height="70" rx="6" fill="#2e7d32"/>
  <text x="570" y="494" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Tổng: -$512 (đúng 0.5%)</text>
  <text x="570" y="514" text-anchor="middle" font-size="11" fill="#e8f5e9">Bỏ lỡ khả năng thắng kép từ US30</text>
  <text x="415" y="560" font-size="11" fill="#333" font-style="italic">Bài học: tuân thủ đúng đôi khi "mất"</text>
  <text x="415" y="576" font-size="11" fill="#333" font-style="italic">một cơ hội thắng — vẫn đúng kỳ vọng</text>

  <!-- CASE C - amber -->
  <rect x="770" y="80" width="350" height="600" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="945" y="108" text-anchor="middle" font-size="14" fill="#3a2c00" font-weight="bold">CASE C — Gray zone</text>
  <text x="945" y="126" text-anchor="middle" font-size="11" fill="#3a2c00">Chênh SL nhỏ 20→23 điểm</text>

  <polyline points="795,190 830,185 860,205 890,175 900,195 930,220 960,235 990,240"
            fill="none" stroke="#f9a825" stroke-width="2.5"/>
  <line x1="795" y1="175" x2="990" y2="175" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="995" y="178" font-size="10" fill="#333">Entry</text>
  <line x1="795" y1="200" x2="990" y2="200" stroke="#f9a825" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="995" y="203" font-size="9.5" fill="#c76b00">SL kế hoạch 20pt</text>
  <line x1="795" y1="215" x2="990" y2="215" stroke="#c76b00" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="995" y="218" font-size="9.5" fill="#c76b00" font-weight="bold">SL thực 23pt (wick 3pt)</text>

  <text x="785" y="400" font-size="11.5" fill="#333">- Wick vượt SL 3pt rồi quay lại</text>
  <text x="785" y="418" font-size="11.5" fill="#333">- Chênh nhỏ: 15% so kế hoạch</text>
  <text x="785" y="436" font-size="11.5" fill="#333">- Cảm giác "không đáng tính lại"</text>
  <text x="785" y="454" font-size="11.5" fill="#333">- Nhưng rule không có ngưỡng miễn trừ</text>
  <rect x="785" y="470" width="310" height="70" rx="6" fill="#f9a825"/>
  <text x="940" y="494" text-anchor="middle" font-size="13" fill="#3a2c00" font-weight="bold">Vẫn tính lại lot đúng 23pt</text>
  <text x="940" y="514" text-anchor="middle" font-size="11" fill="#3a2c00">Chênh lệch thực tế không đáng kể</text>
  <text x="785" y="560" font-size="11" fill="#333" font-style="italic">Bài học: tự động hóa phép tính để</text>
  <text x="785" y="576" font-size="11" fill="#333" font-style="italic">giảm chi phí tuân thủ ở biên nhỏ</text>
</svg>
