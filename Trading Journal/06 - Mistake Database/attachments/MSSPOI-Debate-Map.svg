<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#1a1a1a">Debate Map — Ranh Giới POI: Nghiêm Ngặt vs Có Buffer</text>
  <text x="30" y="58" font-size="13" fill="#555">Kiến nghị: MSS chỉ hợp lệ khi nằm hoàn toàn trong ranh giới hình học của POI, không ngoại lệ</text>

  <rect x="30" y="80" width="500" height="470" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="50" y="108" font-size="16" font-weight="bold" fill="#2e7d32">ỦNG HỘ (ranh giới nghiêm ngặt)</text>

  <rect x="50" y="122" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="142" font-size="12" font-weight="bold" fill="#2e7d32">1. Ranh giới hình học là tiêu chí khách quan</text>
  <text x="62" y="160" font-size="12" fill="#333">Toạ độ giá cụ thể — cho phép "gần</text>
  <text x="62" y="176" font-size="12" fill="#333">cũng tính" mở cửa cho diễn giải co</text>
  <text x="62" y="192" font-size="12" fill="#333">giãn theo FOMO/bias.</text>

  <rect x="50" y="206" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="226" font-size="12" font-weight="bold" fill="#2e7d32">2. CE ngụ ý ranh giới rõ</text>
  <text x="62" y="244" font-size="12" fill="#333">Nếu ngay TRONG ranh giới còn có</text>
  <text x="62" y="260" font-size="12" fill="#333">gradient tin cậy (gần/xa CE), thì</text>
  <text x="62" y="276" font-size="12" fill="#333">NGOÀI ranh giới không có lý do có tin cậy.</text>

  <rect x="50" y="290" width="460" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="62" y="310" font-size="12" font-weight="bold" fill="#2e7d32">3. Dữ liệu mô phỏng: chênh lệch EV lớn</text>
  <text x="62" y="328" font-size="12" fill="#333">+0.73R (in POI) vs −0.33R (ngoài) —</text>
  <text x="62" y="344" font-size="12" fill="#333">nới ranh giới sẽ pha trộn nhóm tốt/</text>
  <text x="62" y="360" font-size="12" fill="#333">xấu, mất khả năng đo lường.</text>

  <rect x="50" y="382" width="460" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="62" y="404" font-size="12" font-weight="bold" fill="#1b4d1e">Phản hồi vòng 2:</text>
  <text x="62" y="422" font-size="12" fill="#1b4d1e">Gradient có tồn tại lý thuyết, nhưng mở</text>
  <text x="62" y="438" font-size="12" fill="#1b4d1e">ra ngoài ranh giới = không gian tự lừa.</text>

  <rect x="570" y="80" width="500" height="470" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="590" y="108" font-size="16" font-weight="bold" fill="#c62828">PHẢN ĐỐI (POI cần buffer hợp lý)</text>

  <rect x="590" y="122" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="142" font-size="12" font-weight="bold" fill="#c62828">1. OB/FVG là mô hình xấp xỉ, không tuyệt đối</text>
  <text x="602" y="160" font-size="12" fill="#333">Nhiều cách vẽ OB khác nhau ngay</text>
  <text x="602" y="176" font-size="12" fill="#333">trong giới ICT/SMC — đòi hỏi ranh</text>
  <text x="602" y="192" font-size="12" fill="#333">giới tuyệt đối là độ chính xác giả tạo.</text>

  <rect x="590" y="206" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="226" font-size="12" font-weight="bold" fill="#c62828">2. Spread/slippage tạo sai số vài pip</text>
  <text x="602" y="244" font-size="12" fill="#333">Ngưỡng nhị phân quá nhạy với nhiễu</text>
  <text x="602" y="260" font-size="12" fill="#333">đo đạc nhỏ, không phản ánh bản</text>
  <text x="602" y="276" font-size="12" fill="#333">chất thị trường thật.</text>

  <rect x="590" y="290" width="460" height="78" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="602" y="310" font-size="12" font-weight="bold" fill="#c62828">3. Thực hành SMC phổ biến dùng buffer</text>
  <text x="602" y="328" font-size="12" fill="#333">POI ± 10-20% chiều rộng để bù sai</text>
  <text x="602" y="344" font-size="12" fill="#333">số vẽ — 0% buffer là cực đoan hơn</text>
  <text x="602" y="360" font-size="12" fill="#333">thực hành phổ biến, chưa có cơ sở tối ưu.</text>

  <rect x="590" y="382" width="460" height="70" rx="6" fill="#f9d6d2" stroke="#c62828"/>
  <text x="602" y="404" font-size="12" font-weight="bold" fill="#7a1a1a">Phản hồi vòng 2:</text>
  <text x="602" y="422" font-size="12" fill="#7a1a1a">Buffer cố định, nhỏ, định nghĩa bằng số</text>
  <text x="602" y="438" font-size="12" fill="#7a1a1a">trước khi trade — khác "gần thì tính".</text>

  <path d="M 530 300 L 570 300" stroke="#777" stroke-width="2" marker-end="url(#arrowd)"/>
  <path d="M 570 500 L 530 500" stroke="#777" stroke-width="2" marker-end="url(#arrowd2)"/>

  <defs>
    <marker id="arrowd" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#777"/></marker>
    <marker id="arrowd2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#777"/></marker>
  </defs>

  <rect x="30" y="565" width="1040" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="50" y="590" font-size="15" font-weight="bold" fill="#1565c0">Phán quyết có điều kiện</text>
  <text x="50" y="612" font-size="12" fill="#333">Trader chưa có kỷ luật ghi log ổn định (giai đoạn hiện tại): Ủng hộ đúng — ranh giới nghiêm ngặt, không buffer.</text>
  <text x="50" y="630" font-size="12" fill="#333">Trader đã có buffer cố định, định lượng, viết trước: Phản đối có cơ sở — buffer nhỏ (10-15%) hợp lý.</text>
  <text x="50" y="648" font-size="12" fill="#333">Vùng chưa giải quyết: ngưỡng buffer tối ưu (10%/15%/20%?) — xem Case C mục 15.</text>
  <text x="50" y="670" font-size="12" fill="#333">Dữ liệu cần: log poi_buffer_pct cho n≥20 lệnh, đo winrate/RR theo từng dải buffer để tìm breakpoint.</text>
  <text x="50" y="688" font-size="12" fill="#333">Nếu breakpoint xác định rõ qua ≥2 giai đoạn thị trường → tiến gần Tier 1.</text>

  <rect x="30" y="730" width="1040" height="60" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="50" y="752" font-size="12" font-weight="bold" fill="#1a1a1a">Evidence Tier hiện tại: Tier 0</text>
  <text x="50" y="770" font-size="12" fill="#555">Cả hai phe tranh biện trên lý thuyết vẽ OB/FVG — chưa có backtest riêng so sánh ranh giới vs buffer.</text>
</svg>
