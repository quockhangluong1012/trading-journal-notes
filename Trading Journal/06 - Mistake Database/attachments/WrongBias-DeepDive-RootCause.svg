<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1100" height="860" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#1a1a1a">WrongBias - Root Cause 5 Whys</text>
<text x="30" y="62" font-size="13" fill="#555">Chuỗi nguyên nhân bias sai + vai trò draw on liquidity</text>

<g>
<rect x="30" y="90" width="330" height="60" rx="6" fill="#f5f5f5" stroke="#ddd"/>
<text x="45" y="112" font-size="13" fill="#1a1a1a" font-weight="bold">Bề mặt</text>
<text x="45" y="132" font-size="13" fill="#1a1a1a">Bias long vì D1 đóng cửa</text>
<text x="45" y="148" font-size="13" fill="#1a1a1a">xanh 2 ngày liên tiếp</text>

<rect x="90" y="170" width="330" height="60" rx="6" fill="#f5f5f5" stroke="#ddd"/>
<text x="105" y="192" font-size="13" fill="#1a1a1a" font-weight="bold">Why 1</text>
<text x="105" y="212" font-size="13" fill="#1a1a1a">Dùng màu nến làm proxy</text>
<text x="105" y="228" font-size="13" fill="#1a1a1a">cho bias thay vì liquidity</text>

<rect x="150" y="250" width="360" height="60" rx="6" fill="#f5f5f5" stroke="#ddd"/>
<text x="165" y="272" font-size="13" fill="#1a1a1a" font-weight="bold">Why 2</text>
<text x="165" y="292" font-size="13" fill="#1a1a1a">Quy trình bias chưa có thứ</text>
<text x="165" y="308" font-size="13" fill="#1a1a1a">tự ưu tiên bắt buộc</text>

<rect x="210" y="330" width="380" height="60" rx="6" fill="#f5f5f5" stroke="#ddd"/>
<text x="225" y="352" font-size="13" fill="#1a1a1a" font-weight="bold">Why 3</text>
<text x="225" y="372" font-size="13" fill="#1a1a1a">Bias bị coi là bước cầm</text>
<text x="225" y="388" font-size="13" fill="#1a1a1a">nhanh đầu ngày</text>

<rect x="270" y="410" width="380" height="60" rx="6" fill="#f5f5f5" stroke="#ddd"/>
<text x="285" y="432" font-size="13" fill="#1a1a1a" font-weight="bold">Why 4</text>
<text x="285" y="452" font-size="13" fill="#1a1a1a">Chưa log bias_correct để</text>
<text x="285" y="468" font-size="13" fill="#1a1a1a">thấy tác hại bằng số</text>

<rect x="330" y="490" width="440" height="90" rx="6" fill="#c62828" fill-opacity="0.12" stroke="#c62828" stroke-width="2"/>
<text x="345" y="514" font-size="13" fill="#c62828" font-weight="bold">GỐC RỄ</text>
<text x="345" y="534" font-size="13" fill="#1a1a1a">Thiếu quy trình xác định bias có</text>
<text x="345" y="550" font-size="13" fill="#1a1a1a">thứ tự ưu tiên: dealing range và</text>
<text x="345" y="566" font-size="13" fill="#1a1a1a">liquidity trước, màu nến chỉ là</text>
<text x="345" y="582" font-size="13" fill="#1a1a1a">tham khảo cuối cùng</text>

<line x1="195" y1="150" x2="255" y2="170" stroke="#999" stroke-width="2"/>
<line x1="255" y1="230" x2="330" y2="250" stroke="#999" stroke-width="2"/>
<line x1="330" y1="310" x2="400" y2="330" stroke="#999" stroke-width="2"/>
<line x1="400" y1="390" x2="460" y2="410" stroke="#999" stroke-width="2"/>
<line x1="460" y1="470" x2="550" y2="490" stroke="#999" stroke-width="2"/>
</g>

<rect x="30" y="610" width="1040" height="230" rx="8" fill="#f5f5f5" stroke="#ddd"/>
<text x="50" y="638" font-size="16" font-weight="bold" fill="#1565c0">Cơ chế: draw on liquidity + dealing range quyết định bias thật</text>

<rect x="50" y="655" width="320" height="160" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
<text x="65" y="678" font-size="13" font-weight="bold" fill="#1565c0">Draw on liquidity</text>
<text x="65" y="700" font-size="13" fill="#1a1a1a">Mức giá hấp dẫn nhất mà</text>
<text x="65" y="716" font-size="13" fill="#1a1a1a">giá có khả năng cao sẽ</text>
<text x="65" y="732" font-size="13" fill="#1a1a1a">đi tới (old high/low chưa</text>
<text x="65" y="748" font-size="13" fill="#1a1a1a">quét)</text>
<text x="65" y="770" font-size="13" fill="#1a1a1a">HTF pool = target, không</text>
<text x="65" y="786" font-size="13" fill="#1a1a1a">phải trigger</text>

<rect x="390" y="655" width="320" height="160" rx="6" fill="#ffffff" stroke="#f9a825" stroke-width="1.5"/>
<text x="405" y="678" font-size="13" font-weight="bold" fill="#3a2c00">Dealing range</text>
<text x="405" y="700" font-size="13" fill="#1a1a1a">Premium (nửa trên) vs</text>
<text x="405" y="716" font-size="13" fill="#1a1a1a">Discount (nửa dưới)</text>
<text x="405" y="736" font-size="13" fill="#1a1a1a">Biên phải là swing hợp</text>
<text x="405" y="752" font-size="13" fill="#1a1a1a">lệ khung lớn, không phải</text>
<text x="405" y="768" font-size="13" fill="#1a1a1a">swing nhỏ gần nhất</text>
<text x="405" y="790" font-size="13" fill="#1a1a1a">(xem case remap 4.10)</text>

<rect x="730" y="655" width="310" height="160" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
<text x="745" y="678" font-size="13" font-weight="bold" fill="#c62828">Ai lợi dụng sai lầm?</text>
<text x="745" y="700" font-size="13" fill="#1a1a1a">Cú đẩy 2 nến xanh có thể</text>
<text x="745" y="716" font-size="13" fill="#1a1a1a">là bơm thanh khoản ngắn</text>
<text x="745" y="732" font-size="13" fill="#1a1a1a">hạn đẩy giá vào premium</text>
<text x="745" y="752" font-size="13" fill="#1a1a1a">để tạo điều kiện cho sweep/</text>
<text x="745" y="768" font-size="13" fill="#1a1a1a">reversal xuống discount, nơi</text>
<text x="745" y="784" font-size="13" fill="#1a1a1a">phe bán thật đang chờ</text>
</svg>
