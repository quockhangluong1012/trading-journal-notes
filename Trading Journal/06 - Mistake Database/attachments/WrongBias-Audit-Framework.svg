<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1100" height="740" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#1a1a1a">WrongBias - Audit Framework</text>
<text x="30" y="62" font-size="13" fill="#555">Pipeline: Log -&gt; Câu hỏi -&gt; Rubric -&gt; Hành động</text>

<g fill="#ffffff" stroke="#1565c0" stroke-width="1.5">
<rect x="30" y="90" width="230" height="120" rx="6"/>
<rect x="300" y="90" width="230" height="120" rx="6"/>
<rect x="570" y="90" width="230" height="120" rx="6"/>
<rect x="840" y="90" width="230" height="120" rx="6"/>
</g>
<text x="45" y="115" font-size="14" font-weight="bold" fill="#1565c0">1. Log</text>
<text x="45" y="136" font-size="13" fill="#1a1a1a">dealing_range hi/lo</text>
<text x="45" y="152" font-size="13" fill="#1a1a1a">draw_on_liquidity_target</text>
<text x="45" y="168" font-size="13" fill="#1a1a1a">bias_tier + 3 điều kiện</text>
<text x="45" y="184" font-size="13" fill="#1a1a1a">ảnh chụp trước phiên</text>

<text x="315" y="115" font-size="14" font-weight="bold" fill="#1565c0">2. Câu hỏi (12)</text>
<text x="315" y="136" font-size="13" fill="#1a1a1a">PASS/FAIL từng tiêu chí</text>
<text x="315" y="152" font-size="13" fill="#1a1a1a">kiểm tra remap hồi tố</text>
<text x="315" y="168" font-size="13" fill="#1a1a1a">kiểm tra mâu thuẫn D1/H4</text>
<text x="315" y="184" font-size="13" fill="#1a1a1a">tần suất Tier C</text>

<text x="585" y="115" font-size="14" font-weight="bold" fill="#1565c0">3. Rubric A-F</text>
<text x="585" y="136" font-size="13" fill="#1a1a1a">A: 11-12 PASS</text>
<text x="585" y="152" font-size="13" fill="#1a1a1a">B: 8-10 PASS</text>
<text x="585" y="168" font-size="13" fill="#1a1a1a">C: 5-7 PASS</text>
<text x="585" y="184" font-size="13" fill="#1a1a1a">F: 0-4 PASS</text>

<text x="855" y="115" font-size="14" font-weight="bold" fill="#1565c0">4. Hành động</text>
<text x="855" y="136" font-size="13" fill="#1a1a1a">A: tiếp tục, định lượng hóa</text>
<text x="855" y="152" font-size="13" fill="#1a1a1a">B: thêm ảnh chụp bắt buộc</text>
<text x="855" y="168" font-size="13" fill="#1a1a1a">C: risk 0.25% cho tới khi</text>
<text x="855" y="184" font-size="13" fill="#1a1a1a">F: cấm risk theo bias</text>

<line x1="260" y1="150" x2="300" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#a4)"/>
<line x1="530" y1="150" x2="570" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#a4)"/>
<line x1="800" y1="150" x2="840" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#a4)"/>
<defs>
<marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 z" fill="#1565c0"/>
</marker>
</defs>

<rect x="30" y="250" width="1040" height="220" rx="8" fill="#c62828" fill-opacity="0.08" stroke="#c62828"/>
<text x="50" y="278" font-size="16" font-weight="bold" fill="#c62828">Red flags (tự lừa dối thường gặp)</text>
<text x="50" y="304" font-size="13" fill="#1a1a1a">- Remap dealing range hồi tố (khác ảnh chụp đầu ngày, liên hệ case 4.10)</text>
<text x="50" y="326" font-size="13" fill="#1a1a1a">- Đếm ngược Tier để hợp lý hóa risk mong muốn (gán Tier A cho bias 1/3 điều kiện)</text>
<text x="50" y="348" font-size="13" fill="#1a1a1a">- Bỏ qua kiểm tra mâu thuẫn timeframe khi D1/H4 "tình cờ" cùng hướng</text>
<text x="50" y="370" font-size="13" fill="#1a1a1a">- Biện minh bias sai bằng "thị trường bất thường" lặp lại nhiều lần</text>
<text x="50" y="392" font-size="13" fill="#1a1a1a">- bias_updated_intraday đánh dấu "có bằng chứng" nhưng ghi mơ hồ</text>
<text x="50" y="418" font-size="13" fill="#1a1a1a">- Meta-audit: Tier 0-1, 0 ngày backtest dẫn chứng cho khung Tier A/B/C</text>
<text x="50" y="440" font-size="13" fill="#1a1a1a">- Cần 20-30 ngày có ảnh chụp + bias_correct để nâng tier</text>

<rect x="30" y="490" width="1040" height="220" rx="8" fill="#f5f5f5" stroke="#ddd"/>
<text x="50" y="518" font-size="16" font-weight="bold" fill="#1a1a1a">Nhịp Audit</text>
<text x="50" y="546" font-size="13" fill="#1a1a1a">Đầu phiên: chụp ảnh dealing range + xác định draw on liquidity + gán Tier</text>
<text x="50" y="570" font-size="13" fill="#1a1a1a">trước khi xem diễn biến phiên</text>
<text x="50" y="594" font-size="13" fill="#1a1a1a">Giữa phiên: chỉ cập nhật bias khi có đủ bằng chứng cấu trúc mới</text>
<text x="50" y="618" font-size="13" fill="#1a1a1a">Cuối ngày: xác nhận bias_correct, đối chiếu dealing range chống remap</text>
<text x="50" y="646" font-size="13" fill="#1a1a1a">Hàng tuần: tổng hợp tỷ lệ Tier A/B/C, winrate theo Tier</text>
<text x="50" y="670" font-size="13" fill="#1a1a1a">Auditor: chính trader (ảnh chụp bắt buộc đầu ngày) + checklist Tier A/B/C</text>
</svg>
