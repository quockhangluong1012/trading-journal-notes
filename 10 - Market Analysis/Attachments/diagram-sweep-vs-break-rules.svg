<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="840" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Quy tắc: Sweep hay Break? — Khi nào Dealing Range còn hợp lệ / cần redraw</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- A -->
  <rect x="150" y="55" width="560" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.3"/>
  <text x="430" y="85" text-anchor="middle" font-size="12.5" fill="#312e81">Giá chạm hoặc xuyên qua 1 boundary của Dealing Range</text>

  <line x1="430" y1="105" x2="430" y2="138" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow2)"/>

  <!-- B diamond -->
  <polygon points="430,140 580,190 430,240 280,190" fill="#f9fafb" stroke="#374151" stroke-width="1.3"/>
  <text x="430" y="185" text-anchor="middle" font-size="11" fill="#1f2937">Có BODY CLOSE</text>
  <text x="430" y="198" text-anchor="middle" font-size="11" fill="#1f2937">vượt qua boundary?</text>

  <!-- B -> C -->
  <line x1="300" y1="203" x2="205" y2="278" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="200" y="230" font-size="10.5" fill="#4b5563" font-weight="600">KHÔNG</text>
  <text x="182" y="243" font-size="10.5" fill="#4b5563" font-weight="600">(chỉ wick)</text>

  <!-- B -> F -->
  <line x1="562" y1="203" x2="655" y2="278" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="600" y="230" font-size="10.5" fill="#4b5563" font-weight="600">CÓ</text>
  <text x="570" y="243" font-size="10.5" fill="#4b5563" font-weight="600">(body close)</text>

  <!-- C diamond -->
  <polygon points="200,280 330,330 200,380 70,330" fill="#f9fafb" stroke="#374151" stroke-width="1.3"/>
  <text x="200" y="322" text-anchor="middle" font-size="10.3" fill="#1f2937">Có named liquidity pool</text>
  <text x="200" y="335" text-anchor="middle" font-size="10.3" fill="#1f2937">bị quét + có reject?</text>

  <!-- F diamond -->
  <polygon points="660,280 800,330 660,380 520,330" fill="#f9fafb" stroke="#374151" stroke-width="1.3"/>
  <text x="660" y="318" text-anchor="middle" font-size="10.1" fill="#1f2937">Có displacement + nhiều</text>
  <text x="660" y="330" text-anchor="middle" font-size="10.1" fill="#1f2937">nến đóng ngoài boundary</text>
  <text x="660" y="342" text-anchor="middle" font-size="10.1" fill="#1f2937">(acceptance)?</text>

  <!-- C -> D / E -->
  <line x1="185" y1="372" x2="150" y2="448" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="120" y="415" font-size="10.5" fill="#047857" font-weight="700">CÓ</text>
  <line x1="225" y1="368" x2="370" y2="448" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="290" y="418" font-size="10.5" fill="#6b7280" font-weight="700">KHÔNG</text>

  <!-- D box -->
  <rect x="40" y="450" width="220" height="80" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.3"/>
  <text x="150" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">SWEEP hợp lệ</text>
  <text x="150" y="494" text-anchor="middle" font-size="10.3" fill="#065f46">Range CŨ còn SỐNG —</text>
  <text x="150" y="508" text-anchor="middle" font-size="10.3" fill="#065f46">boundary được tái xác nhận</text>

  <!-- E box -->
  <rect x="280" y="450" width="220" height="80" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
  <text x="390" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">UNSUPPORTED</text>
  <text x="390" y="494" text-anchor="middle" font-size="10.3" fill="#374151">Chưa đủ evidence để</text>
  <text x="390" y="508" text-anchor="middle" font-size="10.3" fill="#374151">gọi tên "sweep"</text>

  <!-- F -> G / H -->
  <line x1="640" y1="372" x2="615" y2="448" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="540" y="418" font-size="10.3" fill="#92400e" font-weight="700">KHÔNG (1 nến đơn lẻ)</text>
  <line x1="685" y1="368" x2="700" y2="513" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="705" y="450" font-size="10.5" fill="#047857" font-weight="700">CÓ</text>

  <!-- G box -->
  <rect x="500" y="450" width="220" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="610" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">AMBIGUOUS</text>
  <text x="610" y="494" text-anchor="middle" font-size="10.3" fill="#92400e">Theo dõi thêm,</text>
  <text x="610" y="508" text-anchor="middle" font-size="10.3" fill="#92400e">chưa vội kết luận</text>

  <!-- H diamond -->
  <polygon points="700,515 840,570 700,625 560,570" fill="#f9fafb" stroke="#374151" stroke-width="1.3"/>
  <text x="700" y="558" text-anchor="middle" font-size="10" fill="#1f2937">Có MSS tại swing point</text>
  <text x="700" y="570" text-anchor="middle" font-size="10" fill="#1f2937">có ý nghĩa (body close,</text>
  <text x="700" y="582" text-anchor="middle" font-size="10" fill="#1f2937">ngược short-term move,</text>
  <text x="700" y="594" text-anchor="middle" font-size="10" fill="#1f2937">kèm displacement)?</text>

  <!-- H -> I / J -->
  <line x1="590" y1="590" x2="470" y2="648" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <text x="480" y="618" font-size="10.8" fill="#b91c1c" font-weight="700">CHƯA</text>
  <line x1="815" y1="590" x2="730" y2="648" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <text x="790" y="618" font-size="10.8" fill="#047857" font-weight="700">RỒI</text>

  <!-- I box -->
  <rect x="250" y="650" width="380" height="110" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="682" text-anchor="middle" font-size="11.8" font-weight="700" fill="#991b1b">Range CŨ CHẾT — nhưng</text>
  <text x="440" y="700" text-anchor="middle" font-size="11.8" font-weight="700" fill="#991b1b">BIAS MỚI CHƯA xác nhận</text>
  <text x="440" y="722" text-anchor="middle" font-size="11" fill="#7f1d1d">Chỉ ghi "cần theo dõi thêm",</text>
  <text x="440" y="737" text-anchor="middle" font-size="11" fill="#7f1d1d">không gọi đảo chiều</text>
  <text x="440" y="753" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">★ Case NDX 05/08/2026 đang ở ĐÂY</text>

  <!-- J box -->
  <rect x="640" y="650" width="180" height="110" rx="8" fill="#bbf7d0" stroke="#065f46" stroke-width="1.5"/>
  <text x="730" y="682" text-anchor="middle" font-size="11.8" font-weight="700" fill="#065f46">REDRAW</text>
  <text x="730" y="700" text-anchor="middle" font-size="10" fill="#065f46">Range mới = leg</text>
  <text x="730" y="713" text-anchor="middle" font-size="10" fill="#065f46">swing-to-swing</text>
  <text x="730" y="726" text-anchor="middle" font-size="10" fill="#065f46">gần nhất. Bias đảo</text>
  <text x="730" y="739" text-anchor="middle" font-size="10" fill="#065f46">chiều PASS doctrine</text>

  <!-- Legend -->
  <g font-size="10" fill="#374151">
    <rect x="60" y="790" width="14" height="12" fill="#d1fae5" stroke="#047857"/>
    <text x="80" y="800">Range/redraw hợp lệ</text>
    <rect x="230" y="790" width="14" height="12" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="250" y="800">Thiếu evidence</text>
    <rect x="370" y="790" width="14" height="12" fill="#fef3c7" stroke="#b45309"/>
    <text x="390" y="800">Chưa rõ, cần chờ thêm</text>
    <rect x="560" y="790" width="14" height="12" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="580" y="800">Trạng thái hiện tại của case NDX</text>
  </g>
</svg>
