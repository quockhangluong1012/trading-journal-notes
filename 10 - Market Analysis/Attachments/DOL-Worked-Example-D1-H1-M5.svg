<svg viewBox="0 0 1000 980" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="980" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Ví dụ minh họa D1 → H1 → M5 (XAUUSD giả định — không phải dữ liệu thật)</text>

  <!-- ================= PANEL D1 ================= -->
  <text x="40" y="72" font-size="15" font-weight="700" fill="#0f172a">① D1 — Bias &amp; DOL chính</text>
  <rect x="40" y="85" width="920" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- levels -->
  <line x1="60" y1="255" x2="940" y2="255" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="945" y="259" font-size="12" fill="#64748b">3320 — PWL / D1 Low</text>

  <line x1="60" y1="175" x2="940" y2="175" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="945" y="179" font-size="12" fill="#6b7280">3365 — Equilibrium</text>

  <line x1="60" y1="130" x2="940" y2="130" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="945" y="134" font-size="12" fill="#b45309">3396 — PDH (DOL trung gian)</text>

  <rect x="770" y="95" width="150" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <text x="845" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">3404-3406 EQH / ≈3410 PWH</text>

  <!-- D1 price path -->
  <polyline points="70,250 150,190 230,220 330,140 420,175"
            fill="none" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="175" r="5.5" fill="#f59e0b" stroke="#92400e"/>
  <text x="420" y="200" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Giá hiện tại 3365</text>
  <text x="330" y="128" font-size="11.5" fill="#334155" text-anchor="middle">MSS Bullish ~3350</text>

  <polyline points="420,175 500,205 600,150 700,120 785,108"
            fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>

  <text x="140" y="270" font-size="12" fill="#334155">HH/HL D1 → Bias: Bullish</text>

  <!-- zoom connector to H1 -->
  <line x1="420" y1="285" x2="200" y2="330" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="500" y1="285" x2="800" y2="330" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- ================= PANEL H1 ================= -->
  <text x="40" y="358" font-size="15" font-weight="700" fill="#0f172a">② H1 — DOL trung gian &amp; POI</text>
  <rect x="200" y="330" width="600" height="200" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>

  <line x1="220" y1="360" x2="780" y2="360" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="785" y="364" font-size="12" fill="#b45309">3396 PDH</text>

  <rect x="480" y="440" width="180" height="34" fill="#dbeafe" stroke="#2563eb"/>
  <text x="570" y="461" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">3372–3376 H1 FVG/OB (POI)</text>

  <line x1="220" y1="500" x2="780" y2="500" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="785" y="504" font-size="12" fill="#991b1b">≈3368-3370 inducement</text>

  <polyline points="240,380 340,410 440,400 540,455 600,495"
            fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="400" font-size="11.5" fill="#334155" text-anchor="middle">H1 Bias: pullback (internal)</text>

  <!-- zoom connector to M5 -->
  <line x1="540" y1="530" x2="280" y2="575" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="620" y1="530" x2="880" y2="575" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- ================= PANEL M5 ================= -->
  <text x="40" y="603" font-size="15" font-weight="700" fill="#0f172a">③ M5 — Sweep, MSS, Entry</text>
  <rect x="280" y="575" width="600" height="260" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>

  <line x1="300" y1="780" x2="860" y2="780" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="865" y="784" font-size="12" fill="#991b1b">Stop ≈3366 (ngoài vùng sweep)</text>

  <!-- M5 path: dip sweep then MSS reversal -->
  <polyline points="320,650 400,690 460,760 520,745 560,690 640,630"
            fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="460" cy="760" r="5" fill="#dc2626"/>
  <text x="460" y="800" font-size="12" fill="#991b1b" text-anchor="middle">Sweep ~3370 (inducement)</text>

  <line x1="560" y1="690" x2="620" y2="650" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>
  <text x="600" y="620" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">MSS + FVG Entry</text>

  <!-- Targets -->
  <line x1="640" y1="630" x2="770" y2="470" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arB)"/>
  <text x="760" y="450" font-size="12" fill="#1e40af" text-anchor="middle">Target 1: 3396 (PDH, scale-out)</text>

  <line x1="770" y1="470" x2="850" y2="120" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arG)"/>
  <text x="880" y="300" font-size="12" fill="#166534" text-anchor="middle" transform="rotate(-90 880 300)">Target cuối: 3404-3406 EQH (DOL D1)</text>

  <rect x="300" y="850" width="580" height="80" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="315" y="872" font-size="12.5" fill="#713f12" font-weight="700">Đọc chất lượng đường đi (LRLR vs HRLR):</text>
  <text x="315" y="890" font-size="12" fill="#713f12">Ít FVG ngược / old high chắn giữa 3376→3404 → LRLR → giữ runner tới target cuối.</text>
  <text x="315" y="906" font-size="12" fill="#713f12">Nhiều cản → HRLR → chốt dần tại Target 1, hạ kỳ vọng R.</text>

  <text x="500" y="965" text-anchor="middle" font-size="12" fill="#64748b">Minh họa khái niệm — không phải dữ liệu giao dịch thật.</text>
</svg>
