<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1000" height="780" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#0b0b0b">EURUSD — Nested Bias: W1 (Bearish) chứa D1 Pullback (Bullish)</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#52514e">Case study 06–07/08/2026 · giá hiện tại ≈ 1.15227</text>

  <!-- ===================== LEFT PANEL — W1 schematic ===================== -->
  <text x="210" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">W1 — Cấu trúc lớn (LH/LL)</text>

  <!-- axis -->
  <line x1="60" y1="90" x2="60" y2="650" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="60" y1="650" x2="380" y2="650" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- trend guide (lower highs) -->
  <line x1="105" y1="105.6" x2="250" y2="237.8" stroke="#e34948" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>

  <!-- W1 path -->
  <polyline points="60,650 105,105.6 175,183.3 250,237.8 320,591.7 360,437.7"
            fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- W1 markers -->
  <circle cx="105" cy="105.6" r="4.5" fill="#e34948"/>
  <text x="112" y="102" font-size="11.5" fill="#0b0b0b">Đỉnh ~1.1950 (Feb'26)</text>

  <circle cx="175" cy="183.3" r="4" fill="#e34948"/>
  <text x="182" y="180" font-size="11" fill="#52514e">LH ~1.1850</text>

  <circle cx="250" cy="237.8" r="4" fill="#e34948"/>
  <text x="257" y="234" font-size="11" fill="#52514e">LH ~1.1780</text>

  <circle cx="320" cy="591.7" r="4.5" fill="#e34948"/>
  <text x="222" y="605" font-size="11.5" fill="#0b0b0b">Sweep đáy ~1.1325 (Jul'26)</text>

  <circle cx="360" cy="437.7" r="4.5" fill="#2a78d6"/>
  <text x="300" y="425" font-size="11.5" fill="#0b0b0b">Bounce → hiện tại</text>

  <text x="210" y="675" text-anchor="middle" font-size="12" font-weight="600" fill="#e34948">Chuỗi đỉnh/đáy giảm dần → W1 Bias: BEARISH</text>

  <!-- zoom connector -->
  <line x1="380" y1="437.7" x2="560" y2="423.5" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="591.7" x2="560" y2="608.5" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="470" y="500" text-anchor="middle" font-size="11" fill="#898781" transform="rotate(-14 470 500)">zoom D1 →</text>

  <!-- ===================== RIGHT PANEL — D1 zoom ===================== -->
  <text x="755" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">D1 — Dealing Range, FVG, DOL vs Internal Liquidity</text>

  <!-- axis -->
  <line x1="560" y1="90" x2="560" y2="650" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- dealing range box -->
  <rect x="560" y="118.8" width="390" height="489.7" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="955" y="122" font-size="11" fill="#52514e" text-anchor="end">1.18491 — D1 range High</text>
  <text x="955" y="612" font-size="11" fill="#52514e" text-anchor="end">1.13245 — D1 range Low</text>

  <!-- EQ line -->
  <line x1="560" y1="363.7" x2="950" y2="363.7" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="565" y="358" font-size="11.5" fill="#0b0b0b" font-weight="600">EQ 1.15868 (Premium ↑ / Discount ↓)</text>

  <!-- FVG box -->
  <rect x="560" y="375.4" width="390" height="45.5" fill="#eb6834" opacity="0.16"/>
  <rect x="560" y="375.4" width="390" height="45.5" fill="none" stroke="#eb6834" stroke-width="1.5"/>
  <text x="565" y="404" font-size="11.5" fill="#a5451f" font-weight="600">FVG 1.15255–1.15742 (Discount, đã bị test-and-reject từ dưới)</text>

  <!-- ERL / DOL marker -->
  <line x1="560" y1="175.0" x2="950" y2="175.0" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="950" cy="175.0" r="5" fill="#2a78d6"/>
  <text x="565" y="170" font-size="12" fill="#184f95" font-weight="700">1.17889 — Relative Equal Highs = DOL (ERL, external)</text>

  <!-- IRL marker -->
  <line x1="560" y1="271.3" x2="950" y2="271.3" stroke="#4a3aa7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="950" cy="271.3" r="4" fill="#4a3aa7"/>
  <text x="565" y="266" font-size="11.5" fill="#4a3aa7">1.16857 — Internal Liquidity (IRL, chỉ là trạm trên đường đi)</text>

  <!-- MSS marker -->
  <line x1="560" y1="461.0" x2="950" y2="461.0" stroke="#008300" stroke-width="1.5"/>
  <text x="565" y="455" font-size="11.5" fill="#006300" font-weight="600">1.14825 — Intermediate-term high (MSS trigger, body-close)</text>

  <!-- current price marker -->
  <polygon points="555,423.5 545,418 545,429" fill="#0b0b0b"/>
  <text x="565" y="428" font-size="12" fill="#0b0b0b" font-weight="700">◄ Hiện tại ≈1.15227 (Discount)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="710" width="920" height="55" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1"/>
  <circle cx="65" cy="730" r="5" fill="#e34948"/>
  <text x="78" y="734" font-size="11.5" fill="#0b0b0b">W1 structure (Bearish)</text>

  <circle cx="230" cy="730" r="5" fill="#2a78d6"/>
  <text x="243" y="734" font-size="11.5" fill="#0b0b0b">DOL / ERL (external liquidity)</text>

  <circle cx="440" cy="730" r="5" fill="#4a3aa7"/>
  <text x="453" y="734" font-size="11.5" fill="#0b0b0b">Internal liquidity (IRL)</text>

  <rect x="600" y="725" width="14" height="10" fill="#eb6834" opacity="0.4" stroke="#eb6834"/>
  <text x="622" y="734" font-size="11.5" fill="#0b0b0b">FVG / POI</text>

  <circle cx="65" cy="750" r="5" fill="#008300"/>
  <text x="78" y="754" font-size="11.5" fill="#0b0b0b">MSS trigger (body-close)</text>

  <text x="440" y="754" font-size="11.5" fill="#898781">Nguồn: TradingView/FXCM screenshots 06–07/08/2026, đọc bởi user + audit devil's-advocate</text>
</svg>
