<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="900" height="520" rx="12" fill="#191b1f"/>
<defs>
<marker id="ld-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#fa5252" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ld-g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="28" y="30" font-size="16" fill="#e6e8ea" font-weight="bold">Khong tim MSS tren M15 - drop xuong M1 de thay STL da hinh thanh</text>

<!-- TOP: M15 unbroken green sequence -->
<rect x="24" y="52" width="852" height="150" rx="6" fill="#202329" stroke="#2a2d33"/>
<text x="40" y="74" font-size="12.5" fill="#e6e8ea" font-weight="bold">M15 - chuoi nen xanh lien tiep di vao OB (khong thay swing low)</text>
<rect x="60" y="150" width="700" height="34" fill="#4b5563" opacity="0.22"/>
<text x="70" y="144" font-size="10" fill="#e6e8ea">OB H1 (premium)</text>
<!-- 5 green candles rising -->
<g>
<rect x="90" y="150" width="18" height="34" fill="#40c057"/><line x1="99" y1="140" x2="99" y2="188" stroke="#40c057" stroke-width="1.4"/>
<rect x="180" y="130" width="18" height="34" fill="#40c057"/><line x1="189" y1="120" x2="189" y2="168" stroke="#40c057" stroke-width="1.4"/>
<rect x="270" y="112" width="18" height="32" fill="#40c057"/><line x1="279" y1="102" x2="279" y2="148" stroke="#40c057" stroke-width="1.4"/>
<rect x="360" y="96" width="18" height="30" fill="#40c057"/><line x1="369" y1="86" x2="369" y2="130" stroke="#40c057" stroke-width="1.4"/>
<rect x="450" y="82" width="18" height="28" fill="#40c057"/><line x1="459" y1="72" x2="459" y2="114" stroke="#40c057" stroke-width="1.4"/>
</g>
<text x="360" y="200" font-size="10.3" fill="#9aa0a6" font-style="italic">Moi nen chi tao higher-high/higher-low - dinh nghia hoc, chua co STL nao de MSS bam vao</text>

<rect x="700" y="70" width="150" height="46" rx="5" fill="#20262b" stroke="#fa5252" stroke-dasharray="3 3"/>
<text x="775" y="90" font-size="10" fill="#fa5252" font-weight="bold" text-anchor="middle">Cau hoi sai:</text>
<text x="775" y="105" font-size="9.3" fill="#e6e8ea" text-anchor="middle">"MSS o dau?" (chua ton tai)</text>

<line x1="450" y1="202" x2="450" y2="228" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ld-g)"/>
<text x="460" y="220" font-size="10.5" fill="#9aa0a6">zoom vao nen M15 cuoi cung (450-468)</text>

<!-- BOTTOM: M1 zoom revealing internal structure -->
<rect x="24" y="236" width="852" height="252" rx="6" fill="#202329" stroke="#2a2d33"/>
<text x="40" y="260" font-size="12.5" fill="#e6e8ea" font-weight="bold">M1 (ben trong nen M15 cuoi) - cau truc vi mo lo ra STL + MSS that</text>

<!-- micro candles: up, up, down (STL), up more, then displacement down through STL -->
<g>
<rect x="70" y="400" width="10" height="20" fill="#40c057"/>
<rect x="90" y="386" width="10" height="20" fill="#40c057"/>
<rect x="110" y="372" width="10" height="18" fill="#40c057"/>
<rect x="130" y="392" width="10" height="16" fill="#fa5252"/>
<rect x="150" y="398" width="10" height="14" fill="#fa5252"/>
</g>
<circle cx="160" cy="412" r="4" fill="#f0a500"/>
<text x="120" y="440" font-size="9.7" fill="#f0a500" font-weight="bold">STL dau tien (day cua nhip pullback nho)</text>
<line x1="70" y1="412" x2="700" y2="412" stroke="#f0a500" stroke-width="1.2" stroke-dasharray="5 4"/>

<g>
<rect x="170" y="382" width="10" height="18" fill="#40c057"/>
<rect x="190" y="368" width="10" height="16" fill="#40c057"/>
<rect x="210" y="378" width="10" height="14" fill="#fa5252"/>
<rect x="230" y="386" width="10" height="12" fill="#fa5252"/>
</g>
<text x="185" y="356" font-size="9.5" fill="#9aa0a6">day len yeu hon (lower high nho) - phe mua can luc</text>

<!-- displacement candle closing below STL = MSS -->
<rect x="260" y="392" width="16" height="60" fill="#fa5252"/>
<line x1="268" y1="382" x2="268" y2="458" stroke="#fa5252" stroke-width="1.6"/>
<circle cx="268" cy="452" r="4.5" fill="#fa5252"/>
<text x="290" y="420" font-size="10.3" fill="#fa5252" font-weight="bold">Displacement dong THAN duoi STL = MSS M1</text>
<text x="290" y="436" font-size="9.5" fill="#e6e8ea">(khong phai wick - phai la body close)</text>

<!-- FVG left by displacement -->
<rect x="284" y="392" width="70" height="30" fill="#9775fa" opacity="0.22"/>
<text x="292" y="386" font-size="9.3" fill="#9775fa">FVG tao boi displacement</text>

<polyline points="276,452 320,430 360,410 400,392" fill="none" stroke="#40c057" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#ld-g)"/>
<text x="330" y="466" font-size="9.3" fill="#9aa0a6" font-style="italic">retrace ve FVG M1 = entry, ket hop OTE neu co</text>

<rect x="470" y="330" width="380" height="140" rx="6" fill="#20262b" stroke="#2a2d33"/>
<text x="486" y="352" font-size="11.5" fill="#e6e8ea" font-weight="bold">Vi sao viec nay hop ly</text>
<text x="486" y="374" font-size="9.7" fill="#e6e8ea">HTF (H1) da cho bias + POI (cai OB). Khong ep M15</text>
<text x="486" y="390" font-size="9.7" fill="#e6e8ea">phai co swing low rieng - giao viec do cho LTF.</text>
<text x="486" y="410" font-size="9.7" fill="#e6e8ea">Stop chat hon (duoi STL M1), R cao hon - doi lai</text>
<text x="486" y="426" font-size="9.7" fill="#e6e8ea">phai ky luat cho body close vi noise LTF nhieu hon.</text>
<text x="486" y="448" font-size="9.3" fill="#9aa0a6" font-style="italic">Canh bao Trend Day: neu HTF dang la trend day thuc</text>
<text x="486" y="462" font-size="9.3" fill="#9aa0a6" font-style="italic">su (xem AMD - Trend Day Filter), STL M1 co the lien tuc</text>
<text x="486" y="478" font-size="9.3" fill="#9aa0a6" font-style="italic">bi xuyen qua ma khong dao - dung ep model AMD.</text>
</svg>
