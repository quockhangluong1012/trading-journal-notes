<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="900" height="560" rx="12" fill="#191b1f"/>
<defs>
<marker id="mp-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#fa5252" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mp-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#40c057" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="28" y="30" font-size="16" fill="#e6e8ea" font-weight="bold">Nhieu tang pool chong lap: bao gio EQH xa la dieu kien that?</text>
<text x="28" y="48" font-size="10.5" fill="#9aa0a6">Phan xu bang M5 MSS tai OB - khong phai bang cam giac "chua du xa"</text>

<!-- LEFT panel: Scenario A -->
<rect x="24" y="64" width="410" height="462" rx="6" fill="#202329" stroke="#40c057" stroke-width="1.4"/>
<text x="44" y="88" font-size="12.5" fill="#40c057" font-weight="bold">A. Local BSL da du - case that cua note nay</text>

<!-- far EQH grayed unused -->
<line x1="60" y1="112" x2="414" y2="112" stroke="#5a5f66" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="180" cy="112" r="2.6" fill="#5a5f66"/><circle cx="240" cy="112" r="2.6" fill="#5a5f66"/><circle cx="300" cy="112" r="2.6" fill="#5a5f66"/><circle cx="360" cy="112" r="2.6" fill="#5a5f66"/>
<text x="60" y="106" font-size="10" fill="#5a5f66">EQH xa (H1 BSL lon) - KHONG can cho, la TARGET</text>

<!-- local BSL -->
<line x1="60" y1="168" x2="330" y2="168" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="60" y="162" font-size="10" fill="#9aa0a6">BSL cuc bo (STH ngay tren OB)</text>

<!-- OB box -->
<rect x="60" y="192" width="354" height="42" fill="#4b5563" opacity="0.22"/>
<text x="70" y="217" font-size="10.5" fill="#e6e8ea">OB H1 (premium)</text>

<!-- price path: retrace, wick above local BSL, reject, MSS down -->
<polyline points="70,300 110,268 150,236 180,208 205,190 218,178" fill="none" stroke="#40c057" stroke-width="2.2"/>
<circle cx="218" cy="178" r="4.5" fill="#fa5252"/>
<polyline points="218,178 240,214 264,250 288,286 306,310" fill="none" stroke="#fa5252" stroke-width="2.4" marker-end="url(#mp-r)"/>
<text x="234" y="172" font-size="9.7" fill="#40c057">wick quet BSL cuc bo, dong lai</text>
<text x="228" y="300" font-size="9.7" fill="#fa5252" font-weight="bold">M5 MSS xuong NGAY o day</text>

<rect x="40" y="336" width="358" height="90" rx="5" fill="#1e2a20" stroke="#40c057" stroke-dasharray="3 3"/>
<text x="52" y="358" font-size="10.5" fill="#40c057" font-weight="bold">Tin hieu: M5 xac nhan NGAY tai lan cham OB dau tien</text>
<text x="52" y="378" font-size="9.6" fill="#e6e8ea">Sweep + displacement + MSS xay ra tai POI, khong can</text>
<text x="52" y="394" font-size="9.6" fill="#e6e8ea">gia chay them de quet EQH xa. Bo qua EQH la SAI (xem note goc).</text>
<text x="52" y="412" font-size="9.6" fill="#40c057" font-weight="bold">-&gt; VAO LENH ngay, target = EQH xa (bay gio moi dung vai TARGET)</text>

<text x="44" y="452" font-size="10" fill="#9aa0a6">Field journal: m5_confirmed_at_first_tap = TRUE</text>
<text x="44" y="470" font-size="10" fill="#9aa0a6">htf_pool_intervened = FALSE (khong can EQH can thiep)</text>

<!-- RIGHT panel: Scenario B -->
<rect x="466" y="64" width="410" height="462" rx="6" fill="#202329" stroke="#fa5252" stroke-width="1.4"/>
<text x="486" y="88" font-size="12.5" fill="#fa5252" font-weight="bold">B. M5 KHONG xac nhan - EQH xa moi la dieu kien that</text>

<line x1="502" y1="112" x2="856" y2="112" stroke="#f0a500" stroke-width="1.3"/>
<circle cx="622" cy="112" r="2.6" fill="#f0a500"/><circle cx="682" cy="112" r="2.6" fill="#f0a500"/><circle cx="742" cy="112" r="2.6" fill="#f0a500"/><circle cx="802" cy="112" r="2.6" fill="#f0a500"/>
<text x="502" y="106" font-size="10" fill="#f0a500">EQH xa - lan nay CHINH LA noi sweep+MSS that su xay ra</text>

<line x1="502" y1="168" x2="772" y2="168" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="502" y="162" font-size="10" fill="#9aa0a6">BSL cuc bo (bi xuyen qua, KHONG co MSS o day)</text>

<rect x="502" y="192" width="354" height="42" fill="#4b5563" opacity="0.22"/>
<text x="512" y="217" font-size="10.5" fill="#e6e8ea">OB H1 (premium)</text>

<!-- price grinds straight through OB and local BSL without MSS, up to far EQH, THEN reverses -->
<polyline points="512,300 552,270 592,240 622,214 652,190 682,168 712,148 742,128 772,116 802,106" fill="none" stroke="#40c057" stroke-width="2.2"/>
<circle cx="802" cy="106" r="4.5" fill="#fa5252"/>
<polyline points="802,106 812,140 820,180 826,220 830,260" fill="none" stroke="#fa5252" stroke-width="2.4" marker-end="url(#mp-r)"/>
<text x="516" y="252" font-size="9.4" fill="#9aa0a6">gia xuyen qua OB + BSL cuc bo</text>
<text x="516" y="266" font-size="9.4" fill="#9aa0a6">KHONG co body-close MSS - chi grind len tiep</text>
<text x="700" y="100" font-size="9.4" fill="#fa5252" font-weight="bold">MSS chi xuat hien SAU KHI</text>
<text x="700" y="88" font-size="9.4" fill="#fa5252" font-weight="bold">quet xong EQH xa</text>

<rect x="482" y="336" width="358" height="90" rx="5" fill="#2a1f1f" stroke="#fa5252" stroke-dasharray="3 3"/>
<text x="494" y="358" font-size="10.5" fill="#fa5252" font-weight="bold">Tin hieu: M5 KHONG xac nhan tai lan cham OB dau tien</text>
<text x="494" y="378" font-size="9.6" fill="#e6e8ea">Khong co displacement + MSS ngay tai POI = chua co gi de vao.</text>
<text x="494" y="394" font-size="9.6" fill="#e6e8ea">Day la kich ban (3) trong muc 4 cua note goc: cho gia quet EQH,</text>
<text x="494" y="412" font-size="9.6" fill="#fa5252" font-weight="bold">roi moi tim MSS tai do. Cho la DUNG trong truong hop nay.</text>

<text x="486" y="452" font-size="10" fill="#9aa0a6">Field journal: m5_confirmed_at_first_tap = FALSE</text>
<text x="486" y="470" font-size="10" fill="#9aa0a6">htf_pool_intervened = TRUE (EQH xa can thiep truoc khi dao)</text>

<rect x="24" y="500" width="852" height="46" rx="6" fill="#20262b" stroke="#2a2d33"/>
<text x="450" y="522" font-size="11" fill="#e6e8ea" text-anchor="middle" font-weight="bold">Ranh gioi duy nhat giua A va B: M5 co xac nhan NGAY tai lan cham POI dau tien hay khong.</text>
<text x="450" y="538" font-size="10" fill="#9aa0a6" text-anchor="middle">Khong doan truoc kich ban nao se xay ra - de M5 tra loi theo thoi gian thuc, dung chon bang cam tinh.</text>
</svg>
