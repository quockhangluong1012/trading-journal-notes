<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Nested DOL — D1 Bias vs H1 Bias (bias &amp; DOL riêng theo từng khung)</text>

  <!-- D1 dealing range box -->
  <rect x="70" y="70" width="820" height="430" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="80" y="60" font-size="13" fill="#64748b">D1 Dealing Range (PWL → PWH)</text>

  <!-- Equilibrium line -->
  <line x1="70" y1="300" x2="890" y2="300" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="895" y="304" font-size="13" fill="#6b7280">Equilibrium 50%</text>

  <!-- EQH zone (D1 DOL) -->
  <rect x="700" y="85" width="170" height="45" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#166534">EQH (chưa bị chạm)</text>
  <line x1="700" y1="80" x2="880" y2="80" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="885" y="83" font-size="12.5" fill="#166534">≈ PWH</text>

  <!-- EQL zone (H1 DOL) near current price -->
  <rect x="345" y="335" width="150" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="361" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991b1b">EQL gần đây</text>

  <!-- Price structure polyline: HH/HL up to current pullback -->
  <polyline points="100,460 180,300 260,360 350,205 430,280"
            fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- swing labels -->
  <text x="100" y="480" font-size="12" fill="#334155" text-anchor="middle">Low (PWL)</text>
  <text x="180" y="290" font-size="12" fill="#334155" text-anchor="middle">HH1</text>
  <text x="260" y="380" font-size="12" fill="#334155" text-anchor="middle">HL1</text>
  <text x="350" y="195" font-size="12" fill="#334155" text-anchor="middle">HH2</text>
  <text x="430" y="300" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">Giá hiện tại</text>

  <!-- current price marker -->
  <circle cx="430" cy="280" r="6" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>

  <!-- Projected path (dashed) continuing to EQH once H1 MSS confirms -->
  <polyline points="430,280 500,340 560,300 630,190 700,140 785,108"
            fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="170" font-size="12" fill="#64748b" text-anchor="middle">(đường dự phóng — cần H1 MSS xác nhận)</text>

  <!-- Arrow: D1 bias -> DOL D1 -->
  <line x1="450" y1="255" x2="690" y2="120" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="560" y="90" font-size="14" font-weight="700" fill="#166534">D1 Bias: Bullish (HH/HL)</text>
  <text x="560" y="108" font-size="13" fill="#166534">→ DOL D1 = BSL / EQH (target cuối)</text>

  <!-- Arrow: H1 bias -> DOL H1 -->
  <line x1="440" y1="300" x2="425" y2="332" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="470" y="410" font-size="14" font-weight="700" fill="#991b1b">H1 Bias: Bearish (pullback)</text>
  <text x="470" y="428" font-size="13" fill="#991b1b">→ DOL H1 = SSL / EQL (target tạm)</text>

  <!-- Legend box -->
  <rect x="70" y="520" width="820" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="85" y="542" font-size="13" fill="#0f172a" font-weight="700">Nguyên tắc:</text>
  <text x="85" y="562" font-size="13" fill="#334155">Mỗi khung có Bias &amp; DOL riêng. DOL H1 chỉ là trạm dừng tạm thời trên đường tới DOL D1 — miễn là bias D1 chưa bị vô hiệu hóa (không có break + displacement không phản ứng qua EQL).</text>
  <text x="85" y="578" font-size="12.5" fill="#64748b">Minh họa khái niệm — không phải dữ liệu giao dịch thật.</text>
</svg>
